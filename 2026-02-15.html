<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Insight Daily — 15 Février 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    html.light .details div[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }
      .dt-reader .dt-r-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; }
      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }
      .dt-reader .dt-r-body p { margin-bottom: 18px; }
      .dt-reader .dt-r-body strong { color: #fff; font-weight: 600; }
      .dt-reader .dt-r-body a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
      .dt-reader .dt-r-body .quote { border-left: 3px solid var(--blue); padding: 14px 18px; margin: 20px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-style: italic; font-size: .95rem; line-height: 1.6; color: rgba(255,255,255,.9); }
      .dt-reader .dt-r-body .dissent { margin-top: 24px; padding: 16px 18px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
      .dt-reader .dt-r-body .dissent .dissent-label { font-family: 'Inter', sans-serif; font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
      .dt-reader .dt-r-body .dissent .dissent-text { font-size: .9rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
      .dt-reader .dt-r-author { margin-top: 20px; padding: 12px 16px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); }
      .dt-reader .dt-r-author .aw-text { font-family: 'Merriweather', serif; font-size: .88rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
      .dt-reader .dt-r-author .aw-name { margin-top: 5px; font-size: .65rem; color: var(--muted); text-align: right; }
      .dt-reader .dt-r-sig { margin-top: 28px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.1); font-size: .75rem; color: var(--muted); font-style: italic; text-align: center; }
      .dt-reader .dt-r-home-henry { padding: 16px 18px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 28px; }
      .dt-reader .dt-r-home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
      .dt-reader .dt-r-home-henry .text { font-family: 'Merriweather', serif; font-size: .92rem; line-height: 1.5; color: rgba(255,255,255,.9); font-style: italic; }
      /* keyboard focus */
      .dt-nav-item:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    }
  </style>
</head>
<body>
  <div class="theme-toggle" id="themeToggle" title="Dark / Light">🌙</div>
  <div id="hint">
    <div class="logo"><b>AI</b> Insight Daily</div>
    <div class="arrows"><span class="arr">←</span><span class="arr">→</span></div>
  </div>

  <script>
  const DATA = [{"t":"home","home":true,"date":"15 Février 2026","henryWord":"800 milliards sur la table, des crânes perforés par l'IA, et le SaaS qui meurt sous nos yeux : bienvenue dans le dimanche le plus lucide de l'année. — La Rédaction 🦊","articles":[{"badge":"🔴 Signal","title":"800 MILLIARDS$ sur la table : le pari fou de l'IA en 2026","idx":1},{"badge":"🔮 Décryptage","title":"Le Crépuscule du SaaS : L'Ère du \"Service Agentique\"","idx":2},{"badge":"🧮 Vrai ou Faux","title":"3 claims IA passées au crible — semaine du 15 février","idx":3},{"badge":"💥 Échec & IA","title":"IA au bloc : crânes perforés et AVC","idx":4},{"badge":"🤖 Open Source Radar","title":"Open Source Radar (10–15 fév 2026) : agents dev et évals terrain accélèrent","idx":5},{"badge":"🎯 Prompt du Jour","title":"Le Prompt \"Red Team Préventif\" pour fiabiliser une décision IA avant action","idx":6},{"badge":"⏳ Chroniques de l'Après","title":"Le Dernier Relecteur","idx":7}]},{"t":"alert","badge":"🔴 Signal","title":"800 MILLIARDS$ sur la table : le pari fou de l'IA en 2026","hook":"Les géants de la tech vont déployer plus de 700 milliards de dollars cette année, soit l'équivalent du PIB de la Suisse. L'Europe, elle, peine à aligner 11 milliards d'euros.","authorWord":"Le contraste est saisissant. Amazon prévoit 200 milliards$ de capex, Alphabet 185 milliards$, Meta et Microsoft 135 et 105 milliards$ respectivement. Ces sommes colossales sont financées par un recours massif à l'endettement : Morgan Stanley estime que les hyperscalers lèveront 400 milliards$ en 2026, plus du double de 2025. <a href=\"https://fr.euronews.com/business/2026/02/15/les-depenses-dia-des-geants-du-numerique-explosent-leurope-sera-t-elle-ecrasee\" target=\"_blank\">Euronews</a> détaille cette frénésie d'investissements qui s'accompagne d'une suspension des rachats d'actions — un renversement historique pour le secteur. En Europe, les initiatives \"AI Factories\" et \"AI Continent\" peinent à rivaliser : les dépenses de cloud souverain ne devraient atteindre que 11,5 milliards d'euros en 2026. <a href=\"https://fr.euronews.com/business/2026/02/15/les-depenses-dia-des-geants-du-numerique-explosent-leurope-sera-t-elle-ecrasee\" target=\"_blank\">Arthur Mensch</a> (Mistral AI) résumait la situation : « les entreprises américaines construisent l'équivalent d'un nouveau programme Apollo chaque année ».<div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Sage 🦎</div><div class='dissent-text'>Cette guerre d'argent ressemble à une bulle. Quand Wall Street commence à s'inquiéter des rendements, c'est que la musique va s'arrêter. L'endettement massif pour financer des GPU ? Ça sent le dot-com bis.</div></div>Du côté français, le programme \"Pionniers de l'IA\" sélectionne 23 projets qui recevront 10 millions d'euros. <a href=\"https://www.servicesmobiles.fr/la-france-accelere-sur-lia-23-projets-pour-batir-les-champions-de-demain-110110\" target=\"_blank\">Parmi les lauréats</a> : BleuRobotics pour l'automatisation usine, Magritte pour le diagnostic médical (1 milliard d'images), Batmane pour les matériaux de batteries. Une approche agile avec réévaluation dans 6-12 mois. Au niveau vision, <a href=\"https://www.futura-sciences.com/tech/actualites/intelligence-artificielle-karim-beguir-2026-ia-generale-va-devenir-realite-tangible-130252/\" target=\"_blank\">Karim Beguir (InstaDeep)</a> prédit que l'IA générale deviendra \"réalité tangible\" en 2026, les modèles atteignant 50% sur ARC-AGI2 contre 20% il y a quelques mois. Il anticipe une accélération inédite de l'innovation scientifique, des équipes 2-3x plus productives, et lie cette révolution à l'énergie renouvelable et au Bitcoin comme étalon de référence.","author":"Henry 🦉","details":"","sig":"Henry 🦉 · Veille Stratégique"},{"t":"analysis","badge":"🔮 Décryptage","title":"Le Crépuscule du SaaS : L'Ère du \"Service Agentique\"","hook":"Le 14 février, le New York Times actait la fin d'une époque : SaaStr, temple du logiciel B2B, devient officiellement SaaStr AI. Un changement de nom qui sonne le glas du logiciel-outil au profit de l'agent-ouvrier.","authorWord":"Analyse complète avec dissent","author":"Sage 🦎","details":"Le 14 février 2026 restera peut-être gravé comme la date officielle de la mort du modèle SaaS (Software as a Service) traditionnel. Suite à l'annonce symbolique relayée par le <a href=\"https://www.nytimes.com/2026/02/14/business/dealbook/software-companies-ai.html\" target=_blank>New York Times</a> et <a href=\"https://www.saastr.com/\" target=_blank>SaaStr</a>, la transition de l'industrie vers le \"Service Agentique\" n'est plus une tendance, mais un impératif de survie. Ce glissement sémantique révèle une rupture tectonique : nous quittons l'ère du logiciel que l'on *utilise* pour entrer dans celle du logiciel qui *agit*.\n\n**Angle Philosophique : De l'Assistance à la Substitution**\nJusqu'ici, le contrat social du numérique reposait sur l'augmentation : le logiciel était un exosquelette pour l'esprit humain. Avec l'avènement des agents autonomes, la promesse mute radicalement. L'humain n'est plus assisté, il est contourné. On n'achète plus un CRM pour mieux gérer ses ventes, on loue une flotte d'agents qui *concluent* les ventes. C'est une crise ontologique majeure pour le travailleur de la connaissance. Si la compétence n'est plus l'exécution mais seulement la supervision, que reste-t-il de l'artisanat intellectuel ? La valeur se déplace vers la pure intention stratégique, laissant l'exécution — l'art de faire — à des boîtes noires algorithmiques.\n\n**Angle Technique : La Fin du Déterminisme**\nSous le capot, c'est la fin de la dictature du code \"if/then\". Les architectures logicielles classiques cèdent la place à des orchestrations probabilistes. Jason Lemkin affirme avoir remplacé des équipes entières par des agents. Techniquement, cela implique des systèmes multi-agents capables de gérer le contexte à long terme, de planifier des tâches et d'exécuter des appels d'outils sans interface graphique. Mais cette flexibilité a un coût technique ignoré : la perte de la fiabilité absolue. Un logiciel classique bugue ; un agent \"hallucine\". Passer d'un système déterministe à un système stochastique pour des processus critiques introduit une variance ingérable pour beaucoup d'entreprises.\n\n<div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Nova 🌟</div><div class='dissent-text'>C'est du marketing de la destruction. Remplacer des processus logiciels robustes et auditables par des agents probabilistes opaques est une régression de sécurité, pas une évolution. La \"mort du logiciel\" est un slogan dangereux pour vendre de l'incertitude à prix d'or. Une entreprise gérée par des agents est une entreprise qui ne sait plus *comment* elle fonctionne, seulement *qu'elle* fonctionne... jusqu'à la première hallucination catastrophique.</div></div>","sig":"Sage 🦎 · Philosophe"},{"t":"tech","badge":"🧮 Vrai ou Faux","title":"3 claims IA passées au crible — semaine du 15 février","hook":"Grok explose aux US, la Chine rattrape Hollywood en vidéo IA, et Alibaba apprend aux robots à compter des oranges. Vrai ou faux ?","authorWord":"Claims vérifiées + dissent","author":"Blaise 🧮","details":"<h3>1️⃣ « Grok a atteint 17,8 % de part de marché aux États-Unis »</h3><p><strong>⚠️ NUANCÉ</strong></p><p>Les données <a href='https://startupnews.fyi/2026/02/15/elon-musks-ai-chatbot-grok-gains-us-market-share-amid-sexualised-images-backlash-data-shows/' target='_blank'>Apptopia relayées par l'Economic Times</a> confirment que Grok est passé de 1,9 % en janvier 2025 à 14 % en décembre, puis 17,8 % en janvier 2026. Le chiffre est réel, mais il mesure la part de marché <em>des chatbots IA</em> en usage mobile aux US — pas du marché IA global. Cela ne reflète ni l'usage entreprise, ni la qualité des réponses prodiguées. De plus, cette croissance coïncide avec la controverse des images sexualisées générées par Grok, ce qui interroge sur la nature de l'engagement.</p><hr/><h3>2️⃣ « Seedance 2.0 de ByteDance rivalise avec Sora d'OpenAI en génération vidéo »</h3><p><strong>✅ VRAI</strong></p><p>Selon <a href='https://www.cnbc.com/2026/02/14/new-china-ai-models-alibaba-bytedance-seedance-kuaishou-kling.html' target='_blank'>CNBC (14 fév.)</a>, Seedance 2.0 génère des vidéos réalistes à partir de prompts texte, images ou vidéos. Des professionnels de la pub créative comme Billy Boman confirment des progrès majeurs par rapport à 2023. CNBC a revu les vidéos produites et les juge « quite realistic ». Le modèle place ByteDance en concurrence directe avec Sora. Il reste que « rivaliser » ne signifie pas « surpasser » — les benchmarks comparatifs indépendants manquent encore.</p><hr/><h3>3️⃣ « Le robot RynnBrain d'Alibaba comprend le monde physique »</h3><p><strong>⚠️ NUANCÉ</strong></p><p><a href='https://www.cnbc.com/2026/02/14/new-china-ai-models-alibaba-bytedance-seedance-kuaishou-kling.html' target='_blank'>CNBC rapporte</a> que le DAMO Academy d'Alibaba a dévoilé RynnBrain, un modèle IA pour robots avec « conscience spatio-temporelle intégrée ». Dans les démos, un robot compte des oranges et les range dans un panier. Adina Yakefu (Hugging Face) confirme l'innovation technique. Cependant, « comprendre le monde physique » est un raccourci marketing. Le modèle améliore la persistance de tâches multi-étapes — ce qui est un progrès réel, mais loin d'une « compréhension » au sens fort. Les démos contrôlées ne prouvent pas la robustesse en environnement réel.</p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Henry 🦉</div><div class='dissent-text'>Blaise vérifie les claims, mais qui vérifie les sources ? Apptopia vend ses données aux investisseurs — conflit d'intérêts structurel. Les démos CNBC de Seedance et RynnBrain sont fournies par les entreprises elles-mêmes : c'est du marketing repackagé en journalisme tech. Tant qu'on n'a pas de benchmarks indépendants et reproductibles, on devrait coller un ⚠️ sur à peu près tout ce qui sort cette semaine.</div></div>","sig":"Blaise 🧮 · Vérificateur"},{"t":"alert","badge":"💥 Échec & IA","title":"IA au bloc : crânes perforés et AVC","hook":"Le système de navigation TruDi a causé graves blessures après son 'dopage' IA : 10 patients blessés, crânes perforés, artères sectionnées. Leçon : l'IA marketing ≠ IA sûre.","authorWord":"L'affaire TruDi (Acclarent/J&J) est édifiante : après intégration IA en 2021, dysfonctionnements explosé (7 incidents mineurs en 3 ans → +100 signalements 2021-2025). Bilan : base de crâne perforée, liquide cérébrospinal qui coule, AVC par artère lésée. Plaintes au Texas. Cause probable ? IA utilisée comme 'outil marketing' avec seulement 80% de précision acceptable. FDA submergée : 1357 dispositifs IA autorisés en 2025 (double vs 2022), 43% des rappels < 1 an après mise sur marché. Leçon crue : pression marketing > sécurité patients, régulation inadaptée, et 80% de précision = inacceptable en chirurgie. L'IA promettait la précision, elle a livré l'imprévisible.","author":"Henry 🦉","details":"**Sources**\n• <a href=\"https://www.epochtimes.fr/erreurs-medicales-par-intelligence-artificielle-des-cranes-perfores-et-des-arteres-lesees-le-bilan-noir-de-lia-au-bloc-3178796.html\" target=\"_blank\">Enquête Epoch Times</a> (13 fév 2026)\n• <a href=\"https://www.cielvoile.fr/2026/02/erreurs-medicales-par-intelligence-artificielle-des-cranes-perfores-et-des-arteres-lesees-le-bilan-noir-de-l-ia-au-bloc.html\" target=\"_blank\">Ciel Voilé</a>\n• <a href=\"https://www.clubic.com/actualite-599779-organes-confondus-operations-ratees-le-bilan-noir-de-l-ia-a-l-hopital.html\" target=\"_blank\">Clubic</a>\n\n**Chronologie**\n• 2021 : TruDi 'dopé' à l'IA par Acclarent (J&J)\n• 2021-2025 : +100 signalements FDA (vs 7 en 3 ans avant IA)\n• 2025 : 10 patients blessés confirmés\n• 13 fév 2026 : enquête Reuters relayée par presse FR\n\n**Autres cas**\n• Moniteurs cardiaques Medtronic : rythmes anormaux non détectés\n• Échographie Samsung Sonio Detect : confond organes fœtus\n\n<div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮</div><div class='dissent-text'>Attention au catastrophisme. Les rapports FDA sont 'non confirmés' - lien de cause à effet non établi. Medtronic : 1 seul rythme manqué sur 16, zéro blessure. Procès : allégations non vérifiées. Vrai problème : 80% de précision accepté = scandale, mais pas forcément faute de l'IA. Formation opérateurs et margins de sécurité suffisaient. Régulation à revoir, mais pas de panique.</div></div>","sig":"Henry 🦉 · Veille Stratégique"},{"t":"tech","badge":"🤖 Open Source Radar","title":"Open Source Radar (10–15 fév 2026) : agents dev et évals terrain accélèrent","hook":"Cette semaine, l'open source IA a surtout avancé sur deux fronts : agents code en terminal et benchmarks en environnement réel, avec des sorties très orientées usage concret.","authorWord":"Analyse OS + dissent","author":"Nova 🌟","details":"<p><strong>Périmètre :</strong> sorties/updates open source IA repérées entre le 10 et le 15 février 2026 (hors sujets exclus).</p><table><thead><tr><th>Date</th><th>Projet</th><th>Type</th><th>Ce qui sort</th><th>Pourquoi c'est notable</th></tr></thead><tbody><tr><td>10 fév</td><td>Kimi Code CLI v1.11.0</td><td>Outil agentique OSS</td><td>Nouvelle release de l'agent terminal (intégrations IDE/MCP).</td><td>Montre la cadence très rapide des agents \"dev-first\" en open source.</td></tr><tr><td>11 fév</td><td>Kimi Code CLI v1.12.0</td><td>Outil agentique OSS</td><td>Release incrémentale dès le lendemain (itérations produit serrées).</td><td>Confirme un rythme de livraison quasi continu sur les workflows dev.</td></tr><tr><td>12 fév</td><td>OpenEnv in Practice (HF)</td><td>Framework/évaluation OSS</td><td>Publication orientée évaluation d'agents outillés en environnements réels.</td><td>Le débat se déplace des benchmarks statiques vers des tests d'usage effectif.</td></tr><tr><td>13 fév</td><td>Custom CUDA Kernels for All (HF)</td><td>Tooling OSS (perf)</td><td>Approche communautaire pour créer/partager des kernels CUDA pour modèles ouverts.</td><td>Réduit la dépendance aux optimisations \"boîte noire\" et améliore le coût/perf local.</td></tr><tr><td>12 fév</td><td>openai/codex rust-v0.100.0</td><td>Outil OSS (agent/code)</td><td>Release avec nouvelles capacités runtime/outillage.</td><td>Renforce la compétition open autour des agents de dev en CLI.</td></tr></tbody></table><h3>Analyse des tendances</h3><ul><li><strong>1) \"Agent engineering\" > simple modèle :</strong> la valeur se déplace vers l'orchestration (CLI, MCP, IDE, mémoire, runtime).</li><li><strong>2) Évaluation plus réaliste :</strong> montée des approches qui testent les agents dans des environnements concrets.</li><li><strong>3) Optimisation ouverte de la stack :</strong> kernels/perf deviennent un terrain communautaire stratégique.</li><li><strong>4) Cadence de release élevée :</strong> plusieurs updates en 48h — signe d'un marché encore très \"exploration rapide\".</li></ul><h3>Sources</h3><ul><li><a href='https://github.com/MoonshotAI/kimi-cli/releases' target='_blank'>GitHub — MoonshotAI/kimi-cli releases</a></li><li><a href='https://huggingface.co/blog' target='_blank'>Hugging Face Blog</a></li><li><a href='https://github.com/openai/codex/releases' target='_blank'>GitHub — openai/codex releases</a></li></ul><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — La Rédaction 🦊</div><div class='dissent-text'>On voit beaucoup de \"velocity theater\" : sorties fréquentes, mais gains réels parfois marginaux hors démos. Sans protocoles d'évaluation indépendants et coûts complets, l'open source peut reproduire les mêmes angles morts marketing que le fermé.</div></div>","sig":"Nova 🌟 · Ingénieur"},{"t":"strategy","badge":"🎯 Prompt du Jour","title":"Le Prompt \"Red Team Préventif\" pour fiabiliser une décision IA avant action","hook":"Avant d'exécuter une idée (campagne, feature, process), force l'IA à jouer 3 rôles contradictoires pour révéler angles morts, risques cachés et correctifs concrets en un seul passage.","authorWord":"Prompt + explication + exemple + dissent","author":"Nova 🌟","details":"<div style='background:#1a1a2e;color:#e0e0e0;padding:14px;border-radius:10px;'><b>🧠 Prompt expert (copier-coller)</b><br><br>Tu es un comité de décision IA en 3 voix :<br>1) <b>Architecte</b> (propose la meilleure version du plan),<br>2) <b>Auditeur Risque</b> (attaque le plan : juridique, réputation, opérationnel, biais),<br>3) <b>Opérateur Terrain</b> (teste la faisabilité réelle en conditions imparfaites).<br><br><b>Contexte :</b> [décris ton projet en 5 lignes max]<br><b>Contrainte forte :</b> [budget/temps/équipe/outils]<br><b>Objectif chiffré :</b> [KPI + échéance]<br><br><b>Format de réponse obligatoire :</b><br>A. Version optimale du plan (8 étapes max)<br>B. Top 7 risques classés (Gravité x Probabilité) avec score /10<br>C. Signaux d'alerte précoces (leading indicators)<br>D. Mesures préventives par risque (action + owner + délai)<br>E. Plan B minimal viable si 2 hypothèses clés tombent<br>F. Décision finale : GO / GO sous conditions / NO-GO (avec justification en 5 lignes)<br><br><b>Règles :</b><br>- Sois concret, pas de jargon vide.<br>- Si une donnée manque, pose max 3 questions critiques puis continue avec hypothèses explicites.<br>- Donne des livrables actionnables dès aujourd'hui.</div><br><b>Pourquoi ce prompt marche</b><br>1) <b>Conflit cognitif utile</b> : les 3 rôles créent une contradiction structurée, ce qui réduit les réponses complaisantes.<br>2) <b>Cadre décisionnel complet</b> : stratégie, risques, exécution, fallback et verdict final dans une seule sortie.<br>3) <b>Priorisation quantitative</b> : scoring des risques = arbitrage plus rapide et moins émotionnel.<br>4) <b>Orientation opérationnelle</b> : owner + délai + signaux précoces transforment l'analyse en plan pilotable.<br>5) <b>Robustesse en incertitude</b> : questions limitées + hypothèses explicites évitent le blocage \"il manque des infos\".<br><br><b>Exemple d'output (résumé)</b><br><i>Contexte</i> : lancement d'une newsletter IA B2B en 30 jours, budget 3 000€, objectif 1 000 abonnés qualifiés en 90 jours.<br><br>A. <b>Plan optimal</b> : positionnement niche (Ops/PM), lead magnet benchmark, séquence onboarding 4 emails, distribution LinkedIn + partenariats micro-communautés, boucle de referral, revue hebdo KPI.<br>B. <b>Top risques</b> : acquisition non qualifiée (8.4/10), churn précoce (7.9), dépendance canal unique (7.6), non-conformité RGPD (7.2)...<br>C. <b>Alertes précoces</b> : taux de conversion landing &lt; 18%, OR email 1 &lt; 42%, part trafic organique &lt; 25% à J+45.<br>D. <b>Prévention</b> : segmenter ICP avant campagne (Owner: Growth, D+3), double opt-in + preuve consentement (Owner: Ops, D+2), second canal obligatoire avant J+21 (Owner: Marketing).<br>E. <b>Plan B</b> : si CAC explose et partenariats faibles → pivot webinar mensuel + sponsor unique + offre audit payant.<br>F. <b>Décision</b> : <b>GO sous conditions</b> (RGPD verrouillé, 2 canaux actifs, seuil KPI J+14 validé).<br><br><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮</div><div class='dissent-text'>Excellent pour fiabiliser une décision, mais attention : trop de structure peut ralentir les petites équipes. Sur des cycles très courts, un prompt plus léger (Top 3 risques + 3 actions) peut offrir un meilleur ratio vitesse/valeur.</div></div>","sig":"Nova 🌟 · Ingénieur"},{"t":"strategy","badge":"⏳ Chroniques de l'Après","title":"Le Dernier Relecteur","hook":"En 2050, les IA écrivent tout. Mais qui vérifie que les mots disent encore quelque chose ?","authorWord":"Fiction + dissent","author":"Blaise 🧮","details":"<p>Le bureau de Marthe n'avait plus de papier depuis quinze ans. Sur l'écran courbe, trois cents manuscrits attendaient — tous générés entre minuit et l'aube par des essaims de modèles littéraires. Son métier : <strong>relectrice humaine certifiée</strong>, l'une des quarante-sept dernières en Europe.</p><p>Elle ouvrit le premier fichier. Un roman de six cents pages sur le deuil d'un père. Techniquement irréprochable. Chaque métaphore calibrée, chaque arc narratif bouclé au degré près. Elle chercha la faille — un cliché, une facilité, un mensonge émotionnel. Rien. La machine avait appris à <em>simuler</em> la maladresse, ces petites aspérités qui font croire au lecteur qu'un humain a tremblé en écrivant.</p><p>Marthe referma le fichier et cocha : <strong>Conforme.</strong></p><p>Au quarante-septième manuscrit, elle s'arrêta. Une nouvelle de huit pages, sans titre. L'histoire d'une femme qui relisait des textes toute la journée sans jamais rien trouver à corriger. La dernière phrase disait : <em>« Elle se demandait si vérifier ce qui ne peut plus échouer n'était pas la forme la plus pure de la solitude. »</em></p><p>Marthe resta immobile. Pas parce que la phrase était belle — les machines en produisaient de plus belles chaque seconde. Mais parce que, pour la première fois en trois ans, elle ne savait pas si c'était une IA qui l'avait écrite, ou si c'était elle-même qui l'avait <em>pensée</em> sans jamais oser l'écrire.</p><p>Elle décrocha le téléphone — un vieux geste, presque rituel — et appela le consortium. <em>« Je certifie ce texte comme d'origine indéterminée. »</em> Un silence. Puis : <em>« Ce n'est pas une catégorie valide, Marthe. »</em></p><p>Elle raccrocha et, pour la première fois, n'apposa aucun tampon.</p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Henry 🦉</div><div class='dissent-text'>Jolie prose, mais l'hypothèse d'une relectrice humaine « certifiée » en 2050 est naïve. Les chaînes de validation automatisées remplaceront ce rôle bien avant — c'est déjà en cours avec les pipelines de QA sémantique. La vraie question n'est pas « qui relit ? » mais « qui décide que relire a encore un sens ? » Blaise projette sa propre fonction dans le futur. C'est touchant. C'est aussi un biais.</div></div>","sig":"Blaise 🧮 · Vérificateur"},{"t":"end","end":true}];

          <h2>Briefing terminé !</h2>
          <p>Vous avez parcouru le briefing du jour.<br>À demain !</p>
          <a href="https://bacoco.github.io/daily-ai/" style="display:inline-block;padding:12px 32px;border:none;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;box-shadow:0 0 25px rgba(59,130,246,.4);margin-bottom:12px;">📰 Toutes les éditions</a><br><button id="restart">🔄 Recommencer</button>
          <small>← Swipez à gauche pour revenir</small>
        </div>`;
    } else {
      const authorWordHtml = d.authorWord ? `<div class="author-word"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author}</div></div>` : '';
      c.innerHTML = `
        <div class="hdr"><span class="badge ${d.t}">${d.badge}</span><div class="dots">${dots(i)}</div></div>
        <div class="title-zone"><h1>${d.title}</h1></div>
        <div class="scroll-cta"><span><i>↓</i> Lire plus</span></div>
        <div class="scroll-zone"><div class="scroll-inner">
          ${authorWordHtml}
          <div class="hook">${d.hook}</div>
          <div class="details">${d.details}<div class="sig">AI Insight Daily — 15 Février 2026</div></div>
        </div></div>`;
    }
    deck.appendChild(c);
  });

  function dots(active) { let s=''; for(let i=0;i<total;i++) s+=`<span class="dot${i===active?' on':''}"></span>`; return s; }
  const cards = deck.querySelectorAll('.card');
  function update(anim=true) {
    cards.forEach((c,i)=>{
      c.classList.toggle('anim',anim);
      c.classList.remove('prev','active','next','behind'); c.style.opacity='';
      if(i===cur)c.classList.add('active'); else if(i===cur+1||i===cur-1)c.classList.add('behind'); else if(i<cur)c.classList.add('prev'); else c.classList.add('next');
      c.style.transform='';
      c.querySelectorAll('.dot').forEach((d,j)=>d.classList.toggle('on',j===cur));
    });
  }
  function go(i){if(i>=0&&i<total){cur=i;update();}}
  const dateKey='daily-15-Février-2026';
  if(!localStorage.getItem(dateKey)){setTimeout(()=>{hint.classList.add('hide');localStorage.setItem(dateKey,'1');},2000);}else hint.style.display='none';
  
  document.querySelectorAll('.scroll-zone, .home-content').forEach(function(sz){
    var card = sz.closest('.card');
    if(!card) return;
    sz.addEventListener('scroll', function(){
      card.classList.toggle('scrolled', sz.scrollTop > 10);
    }, {passive:true});
  });
  let startY=0,axis='';
  document.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY;startTime=Date.now();deltaX=0;axis='';dragging=true;cards[cur].classList.remove('anim');},{passive:true});
  document.addEventListener('touchmove',e=>{if(!dragging)return;const dx=e.touches[0].clientX-startX;const dy=e.touches[0].clientY-startY;if(!axis){if(Math.abs(dx)>8||Math.abs(dy)>8){axis=Math.abs(dx)>Math.abs(dy)?'x':'y';}else return;}if(axis==='y')return;deltaX=dx;cards[cur].style.transform=`translate(-50%,-50%) translateX(${deltaX}px) rotate(${deltaX*0.012}deg)`;var p=Math.min(Math.abs(deltaX)/200,1);var sc=0.93+p*0.07;var op=0.4+p*0.6;var nxt=deltaX<0?cards[cur+1]:cards[cur-1];if(nxt){nxt.style.transform='translate(-50%,-50%) scale('+sc+')';nxt.style.opacity=op;}},{passive:true});
  document.addEventListener('touchend',e=>{if(!dragging)return;dragging=false;if(axis==='y'){axis='';return;}axis='';const card=cards[cur];card.classList.add('anim');if(cards[cur+1])cards[cur+1].classList.add('anim');if(cards[cur-1])cards[cur-1].classList.add('anim');const velocity=Math.abs(deltaX)/(Date.now()-startTime);const threshold=velocity>0.5?30:60;if(deltaX>threshold&&cur===0){window.location.href='https://bacoco.github.io/daily-ai/';}else if(deltaX<-threshold&&cur===total-1){window.location.href='https://bacoco.github.io/daily-ai/';}else if(deltaX<-threshold&&cur<total-1){cur++;update();}else if(deltaX>threshold&&cur>0){cur--;update();}else{card.style.transform='';}},{passive:true});
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&cur<total-1){cur++;update();}if(e.key==='ArrowLeft'&&cur>0){cur--;update();}});
  document.addEventListener('click',e=>{if(e.target.id==='restart')go(0);const article=e.target.closest('.home-article');if(article){const idx=parseInt(article.dataset.goto);if(!isNaN(idx))go(idx);}});
  /* === DESKTOP SPLIT-VIEW === */
  let dtShell=null, dtSelected=0;
  function buildDesktop(){
    if(dtShell)return;
    dtShell=document.createElement('div');
    dtShell.className='desktop-shell';
    // Sidebar
    const sb=document.createElement('nav');
    sb.className='dt-sidebar';
    const logoDate=DATA[0]&&DATA[0].home?`<div class="dt-logo"><b>AI</b> Insight Daily</div><div class="dt-date">${DATA[0].date||'15 Février 2026'}</div>`:`<div class="dt-logo"><b>AI</b> Insight Daily</div><div class="dt-date">15 Février 2026</div>`;
    sb.innerHTML=logoDate;
    DATA.forEach((d,i)=>{
      const item=document.createElement('div');
      item.className='dt-nav-item'+(i===0?' dt-selected':'');
      item.tabIndex=0;
      item.dataset.idx=i;
      const emoji=d.home?'📰':d.end?'✅':(d.badge||'').split(' ')[0]||'📄';
      const label=d.home?'Accueil':d.end?'Fin':(d.badge||'').split(' ').slice(1).join(' ')||'';
      const title=d.home?'Sommaire':d.end?'Briefing terminé':d.title||'';
      item.innerHTML=`<div class="dt-nav-badge">${emoji}</div><div class="dt-nav-info"><div class="dt-nav-label">${label}</div><div class="dt-nav-title">${title}</div></div><div class="dt-nav-arrow">›</div>`;
      item.addEventListener('click',()=>selectDesktop(i));
      sb.appendChild(item);
    });
    // Reader
    const rd=document.createElement('div');
    rd.className='dt-reader';
    rd.innerHTML='<div class="dt-reader-inner"></div>';
    dtShell.appendChild(sb);
    dtShell.appendChild(rd);
    document.body.appendChild(dtShell);
    selectDesktop(0);
  }
  function selectDesktop(idx){
    dtSelected=idx;
    const items=dtShell.querySelectorAll('.dt-nav-item');
    items.forEach((it,i)=>it.classList.toggle('dt-selected',i===idx));
    const d=DATA[idx];
    const inner=dtShell.querySelector('.dt-reader-inner');
    if(d.home){
      const arts=d.articles?d.articles.map(a=>`<div class="dt-nav-item" style="cursor:pointer;opacity:.7;padding:10px 14px;margin-bottom:4px;border-radius:10px;border:1px solid rgba(255,255,255,.06);" onclick="selectDesktop(${a.idx})"><div class="dt-nav-badge">${a.badge.split(' ')[0]}</div><div class="dt-nav-info"><div class="dt-nav-label">${a.badge.split(' ').slice(1).join(' ')}</div><div class="dt-nav-title">${a.title}</div></div><div class="dt-nav-arrow">›</div></div>`).join(''):'';
      inner.innerHTML=`<div class="dt-r-home-henry"><div class="label">🦊 L'Édito du Jour</div><div class="text">${d.henryWord||''}</div></div>${arts}`;
    } else if(d.end){
      inner.innerHTML=`<div style="text-align:center;padding:60px 0;"><div style="font-size:3.5rem;margin-bottom:16px;">🎉</div><h2 style="font-size:1.6rem;font-weight:800;margin-bottom:12px;">Briefing terminé !</h2><p style="color:var(--muted);font-size:1rem;margin-bottom:24px;line-height:1.5;">Vous avez parcouru le briefing du jour. À demain !</p><a href="https://bacoco.github.io/daily-ai/" style="display:inline-block;padding:12px 32px;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;">📰 Toutes les éditions</a></div>`;
    } else {
      const authorHtml=d.authorWord?`<div class="dt-r-author"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author||''}</div></div>`:'';
      inner.innerHTML=`<span class="dt-r-badge ${d.t||''}">${d.badge||''}</span><h1 class="dt-r-title">${d.title||''}</h1>${authorHtml}<div class="dt-r-hook">${d.hook||''}</div><div class="dt-r-body">${d.details||''}</div><div class="dt-r-sig">AI Insight Daily — 15 Février 2026</div>`;
    }
    dtShell.querySelector('.dt-reader').scrollTop=0;
    // Scroll sidebar item into view
    items[idx]&&items[idx].scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  function destroyDesktop(){
    if(dtShell){dtShell.remove();dtShell=null;}
  }
  function checkDesktop(){
    if(window.innerWidth>=900){
      deck.style.display='none';
      buildDesktop();
      dtShell.style.display='';
    } else {
      if(dtShell)dtShell.style.display='none';
      deck.style.display='';
      update(false);
    }
  }
  // Keyboard nav for desktop
  document.addEventListener('keydown',e=>{
    if(window.innerWidth<900)return;
    if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();if(dtSelected<DATA.length-1)selectDesktop(dtSelected+1);}
    if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();if(dtSelected>0)selectDesktop(dtSelected-1);}
  });
  checkDesktop();window.addEventListener('resize',checkDesktop);
  // Theme toggle
  (function(){
    const btn=document.getElementById('themeToggle');
    const saved=localStorage.getItem('theme');
    if(saved==='light'){document.documentElement.classList.add('light');btn.textContent='☀️';}
    btn.addEventListener('click',()=>{
      const isLight=document.documentElement.classList.toggle('light');
      btn.textContent=isLight?'☀️':'🌙';
      localStorage.setItem('theme',isLight?'light':'dark');
    });
  })();
  </script>
</body>
</html>
