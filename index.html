<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Insight Daily</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#000; --card-bg:#0a0a0f; --text:#fff; --muted:#6a6a7a; --blue:#3b82f6; --green:#10b981; --purple:#a78bfa; --gold:#f59e0b; --red:#ff4757; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { min-height:100%; background:var(--bg); font-family:'Inter',system-ui,sans-serif; color:var(--text); -webkit-tap-highlight-color:transparent; }
    body::before { content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
      background:radial-gradient(ellipse 80% 50% at 20% 10%,rgba(59,130,246,.1) 0%,transparent 50%),
                 radial-gradient(ellipse 60% 40% at 80% 90%,rgba(167,139,250,.08) 0%,transparent 50%); }
    .container { position:relative; z-index:1; max-width:520px; margin:0 auto; padding:40px 16px 80px; }
    .logo { text-align:center; margin-bottom:32px; }
    .logo span { font-size:2rem; font-weight:900; letter-spacing:-0.02em; }
    .logo b { background:linear-gradient(135deg,var(--blue),var(--purple)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .list { display:flex; flex-direction:column; gap:14px; }
    .edition {
      display:block; text-decoration:none; color:var(--text);
      background:var(--card-bg); border:1px solid rgba(255,255,255,.07); border-radius:18px;
      padding:20px; transition:transform .2s, border-color .2s;
      position:relative; overflow:hidden;
    }
    .edition:active { transform:scale(.97); }
    .edition::before { content:''; position:absolute; inset:-1px; border-radius:18px;
      background:linear-gradient(135deg,var(--glow,var(--blue)) 0%,transparent 50%); opacity:.12; pointer-events:none; }
    .edition.latest { --glow:var(--green); border-color:rgba(16,185,129,.3); }
    .edition.special { --glow:var(--gold); }
    .ed-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
    .ed-date { font-size:.65rem; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
    .ed-tag { padding:3px 10px; border-radius:5px; font-size:.55rem; font-weight:700; text-transform:uppercase; letter-spacing:.5px; }
    .ed-tag.latest { background:var(--green); color:#000; }
    .ed-tag.special { background:var(--gold); color:#000; }
    .ed-tag.daily { background:rgba(59,130,246,.15); color:var(--blue); }
    .ed-title { font-size:1.15rem; font-weight:800; line-height:1.3; margin-bottom:8px; }
    .ed-desc { font-size:.82rem; color:rgba(255,255,255,.55); line-height:1.5; }
    .ed-cta { display:inline-block; margin-top:12px; font-size:.72rem; font-weight:700; color:var(--blue); text-transform:uppercase; letter-spacing:.5px; }
    .footer { text-align:center; margin-top:40px; font-size:.65rem; color:var(--muted); }
    .footer a { color:var(--blue); text-decoration:none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo"><span><b>AI</b> Insight Daily</span></div>
    <div class="list" id="list"></div>
    <div class="footer"><a href="https://github.com/bacoco/daily-ai">GitHub</a></div>
  </div>
  <script>
  fetch('editions.json?v='+Date.now()).then(r=>r.json()).then(editions=>{
    const list=document.getElementById('list');
    editions.forEach(ed=>{
      const a=document.createElement('a');
      a.href=ed.url;
      a.className='edition'+(ed.latest?' latest':'')+(ed.type==='special'?' special':'');
      const tagClass=ed.latest?'latest':ed.type;
      const tagText=ed.latest?'✨ Nouveau':ed.type==='special'?'⭐ Spécial':'📰 Daily';
      a.innerHTML=
        '<div class="ed-top"><span class="ed-date">'+ed.date+'</span><span class="ed-tag '+tagClass+'">'+tagText+'</span></div>'+
        '<div class="ed-title">'+ed.title+'</div>'+
        '<div class="ed-desc">'+ed.desc+'</div>'+
        '<span class="ed-cta">Lire l\'édition →</span>';
      list.appendChild(a);
    });
  }).catch(()=>{});
  </script>
</body>
</html>
