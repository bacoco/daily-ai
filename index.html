<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Insight Daily</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#000; --card-bg:#0a0a0f; --text:#fff; --muted:#6a6a7a; --blue:#3b82f6; --green:#10b981; --purple:#a78bfa; --gold:#f59e0b; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { min-height:100%; background:var(--bg); font-family:'Inter',system-ui,sans-serif; color:var(--text); -webkit-tap-highlight-color:transparent; }
    body::before { content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
      background:radial-gradient(ellipse 80% 50% at 20% 10%,rgba(59,130,246,.1) 0%,transparent 50%),
                 radial-gradient(ellipse 60% 40% at 80% 90%,rgba(167,139,250,.08) 0%,transparent 50%); }
    .container { position:relative; z-index:1; max-width:480px; margin:0 auto; padding:50px 20px 80px; }
    .logo { text-align:center; margin-bottom:4px; }
    .logo span { font-size:2rem; font-weight:900; letter-spacing:-0.02em; }
    .logo b { background:linear-gradient(135deg,var(--blue),var(--purple)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .subtitle { text-align:center; font-size:.75rem; color:var(--muted); margin-bottom:36px; letter-spacing:1px; text-transform:uppercase; }
    .list { display:flex; flex-direction:column; gap:12px; }
    .edition {
      display:flex; align-items:center; gap:16px; text-decoration:none; color:var(--text);
      background:var(--card-bg); border:1px solid rgba(255,255,255,.07); border-radius:16px;
      padding:18px 16px; transition:transform .2s, border-color .2s, box-shadow .2s;
      position:relative; overflow:hidden;
    }
    .edition:active { transform:scale(.97); }
    .edition:hover { border-color:rgba(255,255,255,.15); box-shadow:0 10px 40px -10px rgba(0,0,0,.8); }
    .edition::before { content:''; position:absolute; inset:-1px; border-radius:16px;
      background:linear-gradient(135deg,var(--glow,var(--blue)) 0%,transparent 50%); opacity:.12; pointer-events:none; }
    .edition.latest { --glow:var(--green); border-color:rgba(16,185,129,.25); }
    .edition.special { --glow:var(--gold); }
    .ed-date { flex-shrink:0; width:56px; text-align:center; }
    .ed-date .day { font-size:1.6rem; font-weight:900; line-height:1; }
    .ed-date .month { font-size:.6rem; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-top:2px; }
    .ed-info { flex:1; min-width:0; }
    .ed-info .title { font-size:.88rem; font-weight:600; line-height:1.3; margin-bottom:4px;
      overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
    .ed-info .desc { font-size:.72rem; color:rgba(255,255,255,.45); line-height:1.4;
      overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
    .ed-arrow { flex-shrink:0; font-size:1.2rem; color:var(--muted); }
    .ed-tag { position:absolute; top:8px; right:10px; padding:2px 8px; border-radius:4px;
      font-size:.5rem; font-weight:700; text-transform:uppercase; letter-spacing:.5px; }
    .ed-tag.latest { background:var(--green); color:#000; }
    .ed-tag.daily { background:rgba(59,130,246,.2); color:var(--blue); }
    .ed-tag.special { background:rgba(245,158,11,.2); color:var(--gold); }
    .footer { text-align:center; margin-top:40px; font-size:.7rem; color:var(--muted); }
    .footer a { color:var(--blue); text-decoration:none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo"><span><b>AI</b> Insight Daily</span></div>
    <div class="subtitle">Toutes les éditions</div>
    <div class="list" id="list"></div>
    <div class="footer"><a href="https://github.com/bacoco/daily-ai">GitHub</a></div>
  </div>
  <script>
  fetch('editions.json?v='+Date.now()).then(r=>r.json()).then(editions=>{
    const list=document.getElementById('list');
    editions.forEach(ed=>{
      // Parse date for display
      const parts=ed.date.match(/(\d+)\s+(\S+)\s+(\d+)/);
      const day=parts?parts[1]:'';
      const month=parts?parts[2].substring(0,3).toUpperCase():'';
      const a=document.createElement('a');
      a.href=ed.url;
      a.className='edition'+(ed.latest?' latest':'')+(ed.type==='special'?' special':'');
      const tagClass=ed.latest?'latest':ed.type;
      const tagText=ed.latest?'NEW':ed.type==='special'?'SPÉCIAL':'';
      a.innerHTML=
        (tagText?'<span class="ed-tag '+tagClass+'">'+tagText+'</span>':'')+
        '<div class="ed-date"><div class="day">'+day+'</div><div class="month">'+month+'</div></div>'+
        '<div class="ed-info"><div class="title">'+ed.title+'</div><div class="desc">'+ed.desc+'</div></div>'+
        '<div class="ed-arrow">›</div>';
      list.appendChild(a);
    });
  }).catch(()=>{});
  </script>
</body>
</html>
