<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Insight Daily</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#000; --card-bg:#0a0a0f; --text:#fff; --muted:#6a6a7a; --red:#ff4757; --blue:#3b82f6; --green:#10b981; --purple:#a78bfa; --gold:#f59e0b; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { min-height:100%; background:var(--bg); font-family:'Inter',system-ui,sans-serif; color:var(--text);
      -webkit-tap-highlight-color:transparent; overflow-x:hidden; }
    body::before { content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
      background:radial-gradient(ellipse 80% 50% at 20% 10%,rgba(59,130,246,.1) 0%,transparent 50%),
                 radial-gradient(ellipse 60% 40% at 80% 90%,rgba(167,139,250,.08) 0%,transparent 50%); }
    .container { position:relative; z-index:1; max-width:720px; margin:0 auto; padding:40px 20px 60px; }
    .logo { text-align:center; margin-bottom:6px; }
    .logo span { font-size:2.2rem; font-weight:900; letter-spacing:-0.02em; }
    .logo b { background:linear-gradient(135deg,var(--blue),var(--purple)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .subtitle { text-align:center; font-size:.85rem; color:var(--muted); margin-bottom:40px; }
    .grid { display:grid; grid-template-columns:1fr; gap:16px; }
    @media (min-width:600px) { .grid { grid-template-columns:repeat(2,1fr); } }
    .edition { display:block; text-decoration:none; color:var(--text); background:var(--card-bg);
      border:1px solid rgba(255,255,255,.07); border-radius:18px; padding:22px 20px;
      transition:transform .2s,border-color .2s,box-shadow .2s; position:relative; overflow:hidden; }
    .edition:hover { transform:translateY(-3px); border-color:rgba(255,255,255,.15); box-shadow:0 20px 60px -15px rgba(0,0,0,.8); }
    .edition::before { content:''; position:absolute; inset:-1px; border-radius:18px;
      background:linear-gradient(135deg,var(--glow,var(--blue)) 0%,transparent 50%); opacity:.15; pointer-events:none; }
    .edition.special { --glow:var(--gold); }
    .edition.latest { --glow:var(--green); }
    .edition .date { font-size:1.2rem; font-weight:800; margin-bottom:6px; }
    .edition .title { font-size:.82rem; color:rgba(255,255,255,.7); line-height:1.4; margin-bottom:6px; }
    .edition .desc { font-size:.75rem; color:rgba(255,255,255,.45); line-height:1.5; }
    .edition .tag { display:inline-block; margin-top:12px; padding:3px 10px; border-radius:5px;
      font-size:.6rem; font-weight:700; text-transform:uppercase; letter-spacing:.5px; }
    .tag.daily { background:var(--blue); color:#fff; }
    .tag.special { background:var(--gold); color:#000; }
    .tag.latest { background:var(--green); color:#000; }
    .refresh-btn { display:block; margin:30px auto 0; padding:12px 28px; border:none; border-radius:12px;
      background:linear-gradient(135deg,var(--blue),var(--purple)); color:#fff; font-size:.9rem; font-weight:700;
      cursor:pointer; transition:transform .2s,box-shadow .2s; font-family:inherit; }
    .refresh-btn:hover { transform:scale(1.05); box-shadow:0 0 30px rgba(59,130,246,.4); }
    .refresh-btn:active { transform:scale(.97); }
    .footer { text-align:center; margin-top:50px; font-size:.75rem; color:var(--muted); }
    .footer a { color:var(--blue); text-decoration:none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo"><span><b>AI</b> Insight Daily</span></div>
    <div class="subtitle">Toutes les éditions</div>
    <div class="grid" id="grid"></div>
    <button class="refresh-btn" id="refreshBtn" onclick="refreshEditions()">🔄 Rafraîchir</button>
    <div class="footer"><a href="https://github.com/bacoco/daily-ai">GitHub</a></div>
  </div>
  <script>
  var latestUrl = '';
  function render(editions) {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    editions.forEach(ed => {
      if (ed.latest) latestUrl = ed.url;
      const a = document.createElement('a');
      a.href = ed.url;
      a.className = 'edition' + (ed.type === 'special' ? ' special' : '') + (ed.latest ? ' latest' : '');
      const tagClass = ed.latest ? 'latest' : ed.type;
      const tagText = ed.latest ? '✨ Nouveau' : ed.type === 'special' ? '📋 Spécial' : '📰 Daily';
      a.innerHTML = '<div class="date">' + ed.date + '</div><div class="title">' + ed.title + '</div><div class="desc">' + ed.desc + '</div><span class="tag ' + tagClass + '">' + tagText + '</span>';
      grid.appendChild(a);
    });
  }
  function refreshEditions() {
    const btn = document.getElementById('refreshBtn');
    btn.textContent = '⏳';
    btn.disabled = true;
    fetch('editions.json?v=' + Date.now())
      .then(r => r.json())
      .then(data => { render(data); btn.textContent = '🔄 Rafraîchir'; btn.disabled = false; })
      .catch(() => { render([]); btn.textContent = '🔄 Rafraîchir'; btn.disabled = false; });
  }
  refreshEditions();
  // Swipe right on portal → go to latest edition
  var sx=0,dx=0,dr=false,st=0;
  document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;st=Date.now();dx=0;dr=true;},{passive:true});
  document.addEventListener('touchmove',e=>{if(dr)dx=e.touches[0].clientX-sx;},{passive:true});
  document.addEventListener('touchend',e=>{if(!dr)return;dr=false;var v=Math.abs(dx)/(Date.now()-st);var th=v>0.5?30:60;if(dx<-th&&latestUrl){window.location.href=latestUrl;}},{passive:true});
  </script>
</body>
</html>
