<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Insight Daily</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#000; --card-bg:#0a0a0f; --text:#fff; --muted:#6a6a7a; --blue:#3b82f6; --green:#10b981; --purple:#a78bfa; --gold:#f59e0b; --radius:24px; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; width:100%; overflow:hidden; background:var(--bg); font-family:'Inter',system-ui,sans-serif; color:var(--text); -webkit-tap-highlight-color:transparent; }
    body::before { content:''; position:fixed; inset:0; pointer-events:none;
      background:radial-gradient(ellipse 80% 50% at 20% 10%,rgba(59,130,246,.1) 0%,transparent 50%),
                 radial-gradient(ellipse 60% 40% at 80% 90%,rgba(167,139,250,.08) 0%,transparent 50%); }
    #deck { position:relative; width:100%; height:100%; overflow:hidden; }
    .card {
      position:absolute; top:50%; left:50%;
      width:calc(100% - 28px); max-width:440px;
      height:calc(100% - 28px); max-height:800px;
      background:var(--card-bg); border-radius:var(--radius);
      box-shadow:0 30px 80px -20px rgba(0,0,0,.9);
      border:1px solid rgba(255,255,255,.07);
      display:flex; flex-direction:column; overflow:hidden;
      transform:translate(-50%,-50%); opacity:0; pointer-events:none;
      will-change:transform,opacity;
    }
    .card::before { content:''; position:absolute; inset:-1px; border-radius:var(--radius);
      background:linear-gradient(135deg,var(--glow,var(--blue)) 0%,transparent 50%); opacity:.18; pointer-events:none; z-index:0; }
    .card.active { opacity:1; pointer-events:auto; z-index:10; }
    .card.behind { opacity:.4; transform:translate(-50%,-50%) scale(.93); z-index:5; pointer-events:none; }
    .card.prev { opacity:0; transform:translate(-50%,-50%) translateX(-120%); z-index:1; }
    .card.far { opacity:0; transform:translate(-50%,-50%) scale(.85); z-index:1; }
    .card.anim { transition:transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card.latest { --glow:var(--green); }
    .card.special { --glow:var(--gold); }

    .hdr { flex-shrink:0; padding:16px 20px 0; display:flex; justify-content:space-between; align-items:center; z-index:2; }
    .dots { display:flex; gap:5px; }
    .dot { width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.25); }
    .dot.on { background:#fff; box-shadow:0 0 6px rgba(255,255,255,.5); }
    .tag { padding:4px 10px; border-radius:6px; font-size:.55rem; font-weight:700; text-transform:uppercase; letter-spacing:.5px; }
    .tag.new { background:var(--green); color:#000; }
    .tag.daily { background:rgba(59,130,246,.2); color:var(--blue); }

    .body { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; z-index:2; text-align:center; }
    .logo { margin-bottom:20px; }
    .logo span { font-size:1.8rem; font-weight:900; letter-spacing:-0.02em; }
    .logo b { background:linear-gradient(135deg,var(--blue),var(--purple)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .big-date { margin-bottom:24px; }
    .big-date .day { font-size:5rem; font-weight:900; line-height:1; letter-spacing:-0.04em; }
    .big-date .monthyear { font-size:.85rem; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin-top:4px; }
    .edito { flex:1; display:flex; align-items:center; }
    .edito-text { font-family:'Merriweather',Georgia,serif; font-size:.95rem; line-height:1.8; color:rgba(255,255,255,.8); font-weight:300; font-style:italic;
      padding:20px; background:linear-gradient(135deg,rgba(245,158,11,.06) 0%,rgba(255,255,255,.02) 100%);
      border-radius:14px; border-left:3px solid var(--gold); text-align:left; max-width:380px; cursor:pointer; transition:border-color .2s,background .2s; text-decoration:none; display:block; }
    .edito-text:active { background:linear-gradient(135deg,rgba(245,158,11,.12) 0%,rgba(255,255,255,.04) 100%); border-color:var(--blue); }
    .edito-label { font-size:.6rem; color:var(--gold); text-transform:uppercase; letter-spacing:1.5px; font-weight:700; font-style:normal; font-family:'Inter',sans-serif; margin-bottom:8px; }
    .cta { display:block; margin-top:20px; padding:15px 40px; border-radius:14px;
      background:linear-gradient(135deg,var(--blue),var(--purple)); color:#fff;
      font-size:1rem; font-weight:700; text-decoration:none;
      box-shadow:0 0 30px rgba(59,130,246,.3); transition:transform .15s; flex-shrink:0; }
    .cta:active { transform:scale(.95); }

    .swipe-hint { position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:20;
      font-size:.6rem; color:var(--muted); letter-spacing:1px;
      animation:fadeHint 3.5s ease-out forwards; }
    @keyframes fadeHint { 0%{opacity:1} 70%{opacity:1} 100%{opacity:0;pointer-events:none} }

    @media (min-width:900px) {
      html,body { overflow:auto; height:auto; }
      #deck { display:grid; grid-template-columns:repeat(2,1fr); gap:24px; max-width:960px; margin:40px auto; padding:0 20px; }
      .card { position:relative!important; top:auto!important; left:auto!important;
        transform:none!important; opacity:1!important; pointer-events:auto!important;
        width:100%!important; max-width:none!important; height:auto!important; max-height:none!important; min-height:500px; }
      .card.behind,.card.prev,.card.far { opacity:1!important; transform:none!important; }
      .swipe-hint { display:none; }
    }
  </style>
</head>
<body>
  <div id="deck"></div>
  <div class="swipe-hint">← swipez entre les éditions →</div>
  <script>
  var editions=[], cur=0, startX=0, deltaX=0, dragging=false, startTime=0;
  function dots(a,t){var s='';for(var i=0;i<t;i++)s+='<span class="dot'+(i===a?' on':'')+'"></span>';return s;}
  function parseDate(str){var m=str.match(/(\d+)\s+(\S+)\s+(\d+)/);return m?{day:m[1],month:m[2],year:m[3]}:{day:'',month:'',year:''};}

  function build(){
    var deck=document.getElementById('deck');
    deck.innerHTML='';
    editions.forEach(function(ed,i){
      var d=parseDate(ed.date);
      var c=document.createElement('div');
      c.className='card'+(ed.latest?' latest':'')+(ed.type==='special'?' special':'');
      c.dataset.i=i;
      var tagClass=ed.latest?'new':'daily';
      var tagText=ed.latest?'✨ NOUVEAU':'📰 ÉDITION';
      var editoText=ed.edito||ed.desc;
      c.innerHTML=
        '<div class="hdr"><span class="tag '+tagClass+'">'+tagText+'</span><div class="dots">'+dots(i,editions.length)+'</div></div>'+
        '<div class="body">'+
          '<div class="logo"><span><b>AI</b> Insight Daily</span></div>'+
          '<div class="big-date"><div class="day">'+d.day+'</div><div class="monthyear">'+d.month+' '+d.year+'</div></div>'+
          '<div class="edito"><a class="edito-text" href="'+ed.url+'"><div class="edito-label">🦊 Le Mot de Maman</div>'+editoText+'</a></div>'+
          '<a class="cta" href="'+ed.url+'">Lire l\'édition →</a>'+
        '</div>';
      deck.appendChild(c);
    });
    update(false);
  }

  function update(anim){
    var cards=document.querySelectorAll('.card');
    cards.forEach(function(c,i){
      c.classList.toggle('anim',!!anim);
      c.classList.remove('active','behind','prev','far');
      c.style.opacity=''; c.style.transform='';
      if(i===cur) c.classList.add('active');
      else if(i===cur+1||i===cur-1) c.classList.add('behind');
      else if(i<cur) c.classList.add('prev');
      else c.classList.add('far');
      c.querySelectorAll('.dot').forEach(function(d,j){d.classList.toggle('on',j===cur);});
    });
  }

  fetch('editions.json?v='+Date.now()).then(function(r){return r.json();}).then(function(data){editions=data;build();}).catch(function(){});

  document.addEventListener('touchstart',function(e){
    if(window.innerWidth>=900)return;
    startX=e.touches[0].clientX; startTime=Date.now(); deltaX=0; dragging=true;
    var c=document.querySelectorAll('.card')[cur]; if(c)c.classList.remove('anim');
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(!dragging||window.innerWidth>=900)return;
    deltaX=e.touches[0].clientX-startX;
    var cards=document.querySelectorAll('.card');
    var card=cards[cur];
    if(card) card.style.transform='translate(-50%,-50%) translateX('+deltaX+'px) rotate('+deltaX*0.01+'deg)';
    var p=Math.min(Math.abs(deltaX)/200,1);
    var sc=0.93+p*0.07; var op=0.4+p*0.6;
    var nxt=deltaX<0?cards[cur+1]:cards[cur-1];
    if(nxt){nxt.style.transform='translate(-50%,-50%) scale('+sc+')';nxt.style.opacity=op;}
  },{passive:true});
  document.addEventListener('touchend',function(e){
    if(!dragging||window.innerWidth>=900)return;
    dragging=false;
    document.querySelectorAll('.card').forEach(function(c){c.classList.add('anim');});
    var v=Math.abs(deltaX)/(Date.now()-startTime);
    var th=v>0.5?30:60;
    if(deltaX<-th&&cur<editions.length-1){cur++;update(true);}
    else if(deltaX>th&&cur>0){cur--;update(true);}
    else{update(true);}
  },{passive:true});
  var tapTarget=null;
  document.addEventListener('touchstart',function(e){
    tapTarget=e.target;
  },{passive:true});
  // edito-text is now a native <a> link — no JS needed for navigation
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'&&cur<editions.length-1){cur++;update(true);}
    if(e.key==='ArrowLeft'&&cur>0){cur--;update(true);}
  });
  </script>
</body>
</html>
