<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Insight Daily</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#000; --card-bg:#0a0a0f; --text:#fff; --muted:#6a6a7a; --blue:#3b82f6; --green:#10b981; --purple:#a78bfa; --gold:#f59e0b; --red:#ff4757; --radius:24px; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; width:100%; overflow:hidden; background:var(--bg); font-family:'Inter',system-ui,sans-serif; color:var(--text); -webkit-tap-highlight-color:transparent; }
    body::before { content:''; position:fixed; inset:0; pointer-events:none;
      background:radial-gradient(ellipse 80% 50% at 20% 10%,rgba(59,130,246,.1) 0%,transparent 50%),
                 radial-gradient(ellipse 60% 40% at 80% 90%,rgba(167,139,250,.08) 0%,transparent 50%); }
    #deck { position:relative; width:100%; height:100%; overflow:hidden; }
    .card {
      position:absolute; top:50%; left:50%;
      width:calc(100% - 28px); max-width:440px;
      height:calc(100% - 28px); max-height:800px;
      background:var(--card-bg); border-radius:var(--radius);
      box-shadow:0 30px 80px -20px rgba(0,0,0,.9);
      border:1px solid rgba(255,255,255,.07);
      display:flex; flex-direction:column; overflow:hidden;
      transform:translate(-50%,-50%); opacity:0; pointer-events:none;
      will-change:transform,opacity;
    }
    .card::before { content:''; position:absolute; inset:-1px; border-radius:var(--radius);
      background:linear-gradient(135deg,var(--glow,var(--blue)) 0%,transparent 50%); opacity:.15; pointer-events:none; z-index:0; }
    .card.active { opacity:1; pointer-events:auto; z-index:10; }
    .card.behind { opacity:.4; transform:translate(-50%,-50%) scale(.93); z-index:5; pointer-events:none; }
    .card.prev { opacity:0; transform:translate(-50%,-50%) translateX(-120%); z-index:1; }
    .card.far { opacity:0; transform:translate(-50%,-50%) scale(.85); z-index:1; }
    .card.anim { transition:transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card[data-glow=green] { --glow:var(--green); }
    .card[data-glow=gold] { --glow:var(--gold); }
    .card[data-glow=blue] { --glow:var(--blue); }
    .card[data-glow=red] { --glow:var(--red); }

    .hdr { flex-shrink:0; padding:18px 20px 10px; display:flex; justify-content:space-between; align-items:center; z-index:2; }
    .tag { padding:5px 12px; border-radius:6px; font-size:.6rem; font-weight:700; text-transform:uppercase; letter-spacing:.5px; }
    .tag.new { background:var(--green); color:#000; box-shadow:0 0 15px rgba(16,185,129,.4); }
    .tag.daily { background:var(--blue); color:#fff; }
    .tag.special { background:var(--gold); color:#000; }
    .dots { display:flex; gap:5px; }
    .dot { width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.25); }
    .dot.on { background:#fff; box-shadow:0 0 8px rgba(255,255,255,.6); }

    .content { flex:1; display:flex; flex-direction:column; padding:20px 24px 30px; z-index:2; overflow-y:auto; }
    .ed-date { font-size:.7rem; color:var(--muted); text-transform:uppercase; letter-spacing:1.5px; margin-bottom:16px; }
    .ed-title { font-size:1.5rem; font-weight:900; line-height:1.2; letter-spacing:-0.02em; margin-bottom:16px; }
    .ed-desc { font-family:'Merriweather',Georgia,serif; font-size:.92rem; line-height:1.7; color:rgba(255,255,255,.7); font-weight:300; margin-bottom:24px; flex:1; }
    .ed-highlights { margin-bottom:24px; }
    .ed-highlights .hl { display:flex; align-items:flex-start; gap:10px; padding:8px 0; border-bottom:1px solid rgba(255,255,255,.06); }
    .ed-highlights .hl:last-child { border-bottom:none; }
    .ed-highlights .hl-icon { font-size:1rem; flex-shrink:0; margin-top:1px; }
    .ed-highlights .hl-text { font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.75); }
    .ed-cta { display:block; text-align:center; padding:16px; border-radius:14px;
      background:linear-gradient(135deg,var(--blue),var(--purple)); color:#fff;
      font-size:1rem; font-weight:700; text-decoration:none;
      box-shadow:0 0 30px rgba(59,130,246,.3); transition:transform .15s; flex-shrink:0; }
    .ed-cta:active { transform:scale(.95); }

    .swipe-hint { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:20;
      font-size:.65rem; color:var(--muted); letter-spacing:1px;
      animation:fadeHint 4s ease-out forwards; }
    @keyframes fadeHint { 0%{opacity:1} 75%{opacity:1} 100%{opacity:0;pointer-events:none} }

    @media (min-width:900px) {
      html,body { overflow:auto; height:auto; }
      #deck { display:grid; grid-template-columns:repeat(2,1fr); gap:24px; max-width:960px; margin:40px auto; padding:0 20px; }
      .card { position:relative!important; top:auto!important; left:auto!important;
        transform:none!important; opacity:1!important; pointer-events:auto!important;
        width:100%!important; max-width:none!important; height:auto!important; max-height:none!important; min-height:400px; }
      .card.behind,.card.prev,.card.far { opacity:1!important; transform:none!important; }
      .swipe-hint { display:none; }
    }
  </style>
</head>
<body>
  <div id="deck"></div>
  <div class="swipe-hint">← swipez entre les éditions →</div>
  <script>
  var editions=[], cur=0, startX=0, deltaX=0, dragging=false, startTime=0;

  function dots(active,total){let s='';for(let i=0;i<total;i++)s+='<span class="dot'+(i===active?' on':'')+'"></span>';return s;}

  // Extract teaser highlights from desc
  function highlights(desc){
    // Split on periods or commas to get short highlights
    var parts=desc.split(/[.,]/).filter(s=>s.trim().length>10).slice(0,3);
    var icons=['🔴','🔮','💥'];
    return parts.map((p,i)=>'<div class="hl"><span class="hl-icon">'+icons[i%3]+'</span><span class="hl-text">'+p.trim()+'</span></div>').join('');
  }

  function buildCards(){
    var deck=document.getElementById('deck');
    deck.innerHTML='';
    editions.forEach(function(ed,i){
      var c=document.createElement('div');
      c.className='card';
      c.dataset.i=i;
      c.dataset.url=ed.url;
      c.dataset.glow=ed.latest?'green':ed.type==='special'?'gold':'blue';
      var tagClass=ed.latest?'new':ed.type==='special'?'special':'daily';
      var tagText=ed.latest?'✨ NOUVEAU':ed.type==='special'?'⭐ SPÉCIAL':'📰 DAILY';
      c.innerHTML=
        '<div class="hdr"><span class="tag '+tagClass+'">'+tagText+'</span><div class="dots">'+dots(i,editions.length)+'</div></div>'+
        '<div class="content">'+
          '<div class="ed-date">'+ed.date+'</div>'+
          '<div class="ed-title">'+ed.title+'</div>'+
          '<div class="ed-desc">'+ed.desc+'</div>'+
          '<div class="ed-highlights">'+highlights(ed.desc)+'</div>'+
          '<a class="ed-cta" href="'+ed.url+'">Lire cette édition →</a>'+
        '</div>';
      deck.appendChild(c);
    });
    update(false);
  }

  function update(anim){
    var cards=document.querySelectorAll('.card');
    cards.forEach(function(c,i){
      c.classList.toggle('anim',!!anim);
      c.classList.remove('active','behind','prev','far');
      c.style.opacity=''; c.style.transform='';
      if(i===cur) c.classList.add('active');
      else if(i===cur+1||i===cur-1) c.classList.add('behind');
      else if(i<cur) c.classList.add('prev');
      else c.classList.add('far');
      c.querySelectorAll('.dot').forEach(function(d,j){d.classList.toggle('on',j===cur);});
    });
  }

  fetch('editions.json?v='+Date.now()).then(function(r){return r.json();}).then(function(data){editions=data;buildCards();}).catch(function(){});

  document.addEventListener('touchstart',function(e){
    if(window.innerWidth>=900)return;
    startX=e.touches[0].clientX; startTime=Date.now(); deltaX=0; dragging=true;
    var c=document.querySelectorAll('.card')[cur]; if(c)c.classList.remove('anim');
  },{passive:true});

  document.addEventListener('touchmove',function(e){
    if(!dragging||window.innerWidth>=900)return;
    deltaX=e.touches[0].clientX-startX;
    var cards=document.querySelectorAll('.card');
    var card=cards[cur];
    if(card) card.style.transform='translate(-50%,-50%) translateX('+deltaX+'px) rotate('+deltaX*0.01+'deg)';
    var p=Math.min(Math.abs(deltaX)/200,1);
    var sc=0.93+p*0.07;
    var op=0.4+p*0.6;
    var nxt=deltaX<0?cards[cur+1]:cards[cur-1];
    if(nxt){nxt.style.transform='translate(-50%,-50%) scale('+sc+')';nxt.style.opacity=op;}
  },{passive:true});

  document.addEventListener('touchend',function(e){
    if(!dragging||window.innerWidth>=900)return;
    dragging=false;
    var cards=document.querySelectorAll('.card');
    cards.forEach(function(c){c.classList.add('anim');});
    var v=Math.abs(deltaX)/(Date.now()-startTime);
    var th=v>0.5?30:60;
    if(deltaX<-th&&cur<editions.length-1){cur++;update(true);}
    else if(deltaX>th&&cur>0){cur--;update(true);}
    else{update(true);}
  },{passive:true});

  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'&&cur<editions.length-1){cur++;update(true);}
    if(e.key==='ArrowLeft'&&cur>0){cur--;update(true);}
  });

  // Tap on card (not CTA link) does nothing — only the CTA button navigates
  </script>
</body>
</html>
