<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Insight Daily</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#000; --card-bg:#0a0a0f; --text:#fff; --muted:#6a6a7a; --blue:#3b82f6; --green:#10b981; --purple:#a78bfa; --gold:#f59e0b; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; width:100%; overflow:hidden; background:var(--bg); font-family:'Inter',system-ui,sans-serif; color:var(--text); -webkit-tap-highlight-color:transparent; }
    body::before { content:''; position:fixed; inset:0; pointer-events:none;
      background:radial-gradient(ellipse 80% 50% at 20% 10%,rgba(59,130,246,.1) 0%,transparent 50%),
                 radial-gradient(ellipse 60% 40% at 80% 90%,rgba(167,139,250,.08) 0%,transparent 50%); }
    #deck { position:relative; width:100%; height:100%; overflow:hidden; }
    .card {
      position:absolute; top:50%; left:50%;
      width:calc(100% - 28px); max-width:440px;
      height:calc(100% - 28px); max-height:800px;
      background:var(--card-bg); border-radius:24px;
      box-shadow:0 30px 80px -20px rgba(0,0,0,.9);
      border:1px solid rgba(255,255,255,.07);
      display:flex; flex-direction:column; overflow:hidden;
      transform:translate(-50%,-50%); opacity:0; pointer-events:none;
      will-change:transform,opacity;
    }
    .card.active { opacity:1; pointer-events:auto; z-index:10; }
    .card.behind { opacity:.6; pointer-events:none; z-index:5;
      transform:translate(-50%,-50%) scale(.92); }
    .card.prev { opacity:0; transform:translate(-50%,-50%) translateX(-120%); z-index:1; }
    .card.far { opacity:0; transform:translate(-50%,-50%) scale(.85); z-index:1; }
    .card.anim { transition:transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before { content:''; position:absolute; inset:-1px; border-radius:24px;
      background:linear-gradient(135deg,var(--glow,var(--blue)) 0%,transparent 50%); opacity:.15; pointer-events:none; }
    .card.latest { --glow:var(--green); }
    .card.special { --glow:var(--gold); }
    .hdr { padding:20px 22px 12px; display:flex; justify-content:space-between; align-items:center; }
    .dots { display:flex; gap:5px; }
    .dot { width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.25); }
    .dot.on { background:#fff; box-shadow:0 0 8px rgba(255,255,255,.6); }
    .tag { padding:5px 12px; border-radius:6px; font-size:.6rem; font-weight:700; text-transform:uppercase; letter-spacing:.5px; }
    .tag.latest { background:var(--green); color:#000; }
    .tag.daily { background:var(--blue); color:#fff; }
    .tag.special { background:var(--gold); color:#000; }
    .body { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px 24px; text-align:center; }
    .body .date { font-size:2rem; font-weight:900; margin-bottom:12px; line-height:1.2; }
    .body .title { font-size:1rem; color:rgba(255,255,255,.7); line-height:1.5; margin-bottom:16px; max-width:340px; }
    .body .desc { font-size:.82rem; color:rgba(255,255,255,.4); line-height:1.6; max-width:320px; }
    .body .cta { margin-top:28px; display:inline-block; padding:14px 36px; border-radius:14px;
      background:linear-gradient(135deg,var(--blue),var(--purple)); color:#fff; font-size:.95rem;
      font-weight:700; text-decoration:none; box-shadow:0 0 30px rgba(59,130,246,.3);
      transition:transform .2s; }
    .body .cta:active { transform:scale(.95); }
    .swipe-hint { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:20;
      font-size:.7rem; color:var(--muted); text-transform:uppercase; letter-spacing:1px;
      animation:fadeHint 3s ease-out forwards; }
    @keyframes fadeHint { 0%{opacity:1} 70%{opacity:1} 100%{opacity:0} }
    .logo { text-align:center; margin-bottom:4px; }
    .logo span { font-size:1.6rem; font-weight:900; letter-spacing:-0.02em; }
    .logo b { background:linear-gradient(135deg,var(--blue),var(--purple)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    @media (min-width:900px) {
      html,body { overflow:auto; height:auto; }
      #deck { display:grid; grid-template-columns:repeat(2,1fr); gap:24px; max-width:960px; margin:40px auto; padding:0 20px; }
      .card { position:relative!important; top:auto!important; left:auto!important;
        transform:none!important; opacity:1!important; pointer-events:auto!important;
        width:100%!important; max-width:none!important; height:auto!important; max-height:none!important; min-height:350px; }
      .card.behind,.card.prev,.card.far { opacity:1!important; transform:none!important; }
      .swipe-hint { display:none; }
    }
  </style>
</head>
<body>
  <div id="deck"></div>
  <div class="swipe-hint">← Swipez pour parcourir →</div>
  <script>
  var editions=[], cur=0, startX=0, deltaX=0, dragging=false, startTime=0;
  function dots(active,total){let s='';for(let i=0;i<total;i++)s+='<span class="dot'+(i===active?' on':'')+'"></span>';return s;}
  function buildCards(){
    const deck=document.getElementById('deck');
    deck.innerHTML='';
    editions.forEach((ed,i)=>{
      const c=document.createElement('a');
      c.href=ed.url;
      c.className='card'+(ed.latest?' latest':'')+(ed.type==='special'?' special':'');
      c.dataset.i=i;
      const tagClass=ed.latest?'latest':ed.type;
      const tagText=ed.latest?'✨ Nouveau':ed.type==='special'?'📋 Spécial':'📰 Daily';
      c.innerHTML='<div class="hdr"><span class="tag '+tagClass+'">'+tagText+'</span><div class="dots">'+dots(i,editions.length)+'</div></div>'
        +'<div class="body"><div class="logo"><span><b>AI</b> Insight Daily</span></div>'
        +'<div class="date">'+ed.date+'</div>'
        +'<div class="title">'+ed.title+'</div>'
        +'<div class="desc">'+ed.desc+'</div>'
        +'<span class="cta">Lire →</span></div>';
      deck.appendChild(c);
    });
    update(false);
  }
  function update(anim){
    var cards=document.querySelectorAll('.card');
    cards.forEach((c,i)=>{
      c.classList.toggle('anim',!!anim);
      c.classList.remove('active','behind','prev','far');
      if(i===cur) c.classList.add('active');
      else if(i===cur+1) c.classList.add('behind');
      else if(i<cur) c.classList.add('prev');
      else c.classList.add('far');
      c.style.transform='';
      c.querySelectorAll('.dot').forEach((d,j)=>d.classList.toggle('on',j===cur));
    });
  }
  fetch('editions.json?v='+Date.now()).then(r=>r.json()).then(data=>{editions=data;buildCards();}).catch(()=>{});
  document.addEventListener('touchstart',e=>{
    if(window.innerWidth>=900)return;
    startX=e.touches[0].clientX;startTime=Date.now();deltaX=0;dragging=true;
    var c=document.querySelectorAll('.card')[cur];if(c){c.classList.remove('anim');}
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!dragging||window.innerWidth>=900)return;
    deltaX=e.touches[0].clientX-startX;
    var c=document.querySelectorAll('.card')[cur];
    if(c) c.style.transform='translate(-50%,-50%) translateX('+deltaX+'px) rotate('+deltaX*0.012+'deg)';
    // Show behind card scaling up as we drag
    var behind=document.querySelectorAll('.card')[cur+1];
    if(behind&&deltaX<0){
      var progress=Math.min(Math.abs(deltaX)/200,1);
      var scale=0.92+progress*0.08;
      var op=0.6+progress*0.4;
      behind.style.transform='translate(-50%,-50%) scale('+scale+')';
      behind.style.opacity=op;
    }
  },{passive:true});
  document.addEventListener('touchend',e=>{
    if(!dragging||window.innerWidth>=900)return;
    dragging=false;
    var cards=document.querySelectorAll('.card');
    var card=cards[cur];if(card)card.classList.add('anim');
    var behind=cards[cur+1];if(behind){behind.classList.add('anim');}
    var v=Math.abs(deltaX)/(Date.now()-startTime);
    var th=v>0.5?30:60;
    if(deltaX<-th&&cur<editions.length-1){cur++;update(true);}
    else if(deltaX>-th&&deltaX<th){update(true);}
    else if(deltaX>th&&cur>0){cur--;update(true);}
    else{update(true);}
  },{passive:true});
  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight'&&cur<editions.length-1){cur++;update(true);}
    if(e.key==='ArrowLeft'&&cur>0){cur--;update(true);}
  });
  // Prevent link navigation during swipe
  document.addEventListener('click',e=>{
    var card=e.target.closest('.card');
    if(card&&Math.abs(deltaX)>10&&window.innerWidth<900){e.preventDefault();}
  });
  </script>
</body>
</html>
