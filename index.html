<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Le Kiosque 🦊</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#0a0a1a; --card-bg:rgba(255,255,255,.04); --text:#fff; --muted:#6a6a7a; --radius:20px; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html { background:var(--bg); color:var(--text); font-family:'Outfit',system-ui,sans-serif; min-height:100%; }
    body { min-height:100vh; padding:0 16px 60px; }
    body::before { content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
      background:radial-gradient(ellipse 80% 50% at 30% 0%,rgba(99,102,241,.12) 0%,transparent 60%),
                 radial-gradient(ellipse 60% 40% at 80% 100%,rgba(167,139,250,.08) 0%,transparent 50%); }

    .header { position:relative; z-index:1; text-align:center; padding:60px 20px 40px; }
    .header h1 { font-size:3rem; font-weight:900; letter-spacing:-0.03em; margin-bottom:8px; }
    .header h1 span { background:linear-gradient(135deg,#6366f1,#a78bfa,#f59e0b); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .header p { color:var(--muted); font-size:1.1rem; font-weight:400; }

    .grid { position:relative; z-index:1; display:grid; grid-template-columns:1fr; gap:20px; max-width:800px; margin:0 auto; }
    @media (min-width:700px) { .grid { grid-template-columns:repeat(2,1fr); } }

    .journal-card {
      background:var(--card-bg); border-radius:var(--radius); padding:28px 24px;
      border:1px solid rgba(255,255,255,.06);
      backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
      cursor:pointer; text-decoration:none; color:var(--text); display:block;
      transition:transform .2s, border-color .2s, box-shadow .2s;
      position:relative; overflow:hidden;
    }
    .journal-card:hover { transform:translateY(-4px); border-color:rgba(255,255,255,.12); box-shadow:0 20px 60px -15px rgba(0,0,0,.5); }
    .journal-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--accent,#6366f1); opacity:.8; }

    .card-top { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
    .card-emoji { font-size:2.2rem; }
    .card-meta { flex:1; }
    .card-name { font-size:1.3rem; font-weight:800; letter-spacing:-0.02em; }
    .card-tagline { font-size:.8rem; color:var(--muted); margin-top:2px; }
    .badge-new { background:#10b981; color:#000; font-size:.6rem; font-weight:700; padding:3px 8px; border-radius:6px; text-transform:uppercase; letter-spacing:.5px; white-space:nowrap; }

    .card-edito { font-family:'Merriweather',Georgia,serif; font-size:.85rem; line-height:1.7; color:rgba(255,255,255,.65); font-style:italic; font-weight:300;
      padding:14px 16px; background:rgba(255,255,255,.02); border-radius:12px; border-left:3px solid var(--accent,#6366f1); margin-top:4px; }
    .card-edito .edito-label { font-size:.55rem; color:var(--accent,#6366f1); text-transform:uppercase; letter-spacing:1.5px; font-weight:700; font-style:normal; font-family:'Outfit',sans-serif; margin-bottom:6px; }

    .card-date { font-size:.7rem; color:var(--muted); margin-top:14px; text-align:right; }

    .card-loading { text-align:center; color:var(--muted); font-size:.85rem; padding:40px 20px; }

    .footer { position:relative; z-index:1; text-align:center; margin-top:60px; color:var(--muted); font-size:.75rem; }
    .footer a { color:#6366f1; text-decoration:none; }
  </style>
</head>
<body>
  <div class="header">
    <h1><span>Le Kiosque</span></h1>
    <p>Vos newsletters IA, chaque matin ☕</p>
  </div>
  <div class="grid" id="grid">
    <div class="card-loading">Chargement des journaux…</div>
  </div>
  <div class="footer">Le Kiosque · Éditions quotidiennes 🦊</div>

  <script>
  (function(){
    var grid = document.getElementById('grid');

    fetch('kiosque.json?v='+Date.now())
      .then(function(r){ return r.json(); })
      .then(function(k){
        var journals = k.journals.filter(function(j){ return j.active; });
        if(!journals.length){ grid.innerHTML='<div class="card-loading">Aucun journal disponible.</div>'; return; }

        // Fetch editions for each journal
        var promises = journals.map(function(j){
          return fetch(j.editionsUrl+'?v='+Date.now())
            .then(function(r){ return r.json(); })
            .then(function(eds){ j._editions = eds; })
            .catch(function(){ j._editions = []; });
        });

        Promise.all(promises).then(function(){
          grid.innerHTML = '';
          journals.forEach(function(j){
            var latest = j._editions[0] || null;
            var card = document.createElement('a');
            card.className = 'journal-card';
            card.href = j.portalUrl;
            card.style.setProperty('--accent', j.color);

            var isNew = false;
            if(latest){
              // Check if < 24h — parse date like "14 Février 2026"
              try {
                var months = {janvier:0,février:1,fevrier:1,mars:2,avril:3,mai:4,juin:5,juillet:6,août:7,aout:7,septembre:8,octobre:9,novembre:10,décembre:11,decembre:11};
                var parts = latest.date.match(/(\d+)\s+(\S+)\s+(\d+)/);
                if(parts){
                  var d = new Date(parseInt(parts[3]), months[parts[2].toLowerCase()]||0, parseInt(parts[1]));
                  isNew = (Date.now() - d.getTime()) < 86400000*1.5;
                }
              } catch(e){}
            }

            var badgeHtml = isNew ? '<span class="badge-new">NOUVEAU</span>' : '';
            var editoHtml = '';
            if(latest && (latest.edito || latest.desc)){
              var txt = latest.edito || latest.desc;
              if(txt.length > 180) txt = txt.substring(0,180) + '…';
              editoHtml = '<div class="card-edito"><div class="edito-label">🦊 Dernier édito</div>'+txt+'</div>';
            }
            var dateHtml = latest ? '<div class="card-date">Dernière édition : '+latest.date+'</div>' : '';

            card.innerHTML =
              '<div class="card-top">'+
                '<div class="card-emoji">'+j.emoji+'</div>'+
                '<div class="card-meta"><div class="card-name">'+j.name+'</div><div class="card-tagline">'+j.tagline+'</div></div>'+
                badgeHtml+
              '</div>'+
              editoHtml+
              dateHtml;

            grid.appendChild(card);
          });
        });
      })
      .catch(function(e){
        grid.innerHTML='<div class="card-loading">Erreur de chargement.</div>';
        console.error(e);
      });
  })();
  </script>
</body>
</html>
