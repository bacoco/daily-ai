<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Insight Daily — 19 Février 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    html.light .details div[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */

        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }

      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }
      .dt-reader .dt-r-body p { margin-bottom: 18px; }
      .dt-reader .dt-r-body strong { color: #fff; font-weight: 600; }
      .dt-reader .dt-r-body a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }

      .dt-reader .dt-r-body .dissent { margin-top: 24px; padding: 16px 18px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
      .dt-reader .dt-r-body .dissent .dissent-label { font-family: 'Inter', sans-serif; font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
      .dt-reader .dt-r-body .dissent .dissent-text { font-size: .9rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
      .dt-reader .dt-r-author { margin-top: 20px; padding: 12px 16px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); }
      .dt-reader .dt-r-author .aw-text { font-family: 'Merriweather', serif; font-size: .88rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }

  <script>

  const DATA = [{"t":"home","home":true,"date":"19 Février 2026","henryWord":"Delhi rassemble les titans de l'IA — et révèle leurs fractures. Pendant que Modi lance MANAV et que l'Inde promet 100 milliards, Altman et Amodei refusent de se tenir la main, le Pentagone menace Anthropic de blacklist, et un juge néo-zélandais découvre que même les excuses sont désormais sous-traitées aux machines. Le fossé entre l'ambition collective et les rivalités individuelles n'a jamais été aussi photogénique.","articles":[{"badge":"🔴 Signal","title":"India AI Summit : Modi lance MANAV, Jio investit 120 Md$, Bill Gates annule","idx":1},{"badge":"🔮 Décryptage","title":"Anthropic vs Pentagone : quand la safety IA devient une arme géopolitique","idx":2},{"badge":"🧮 Vrai ou Faux","title":"L'IA, révolution ou hype ? Le grand schisme de février 2026","idx":3},{"badge":"💥 Échec & IA","title":"Un juge néo-zélandais démasque des excuses écrites par ChatGPT","idx":4},{"badge":"🤖 Open Source Radar","title":"Sarvam AI : l'Inde lance ses propres LLM open source à 105 milliards de paramètres","idx":5},{"badge":"🎯 Prompt du Jour","title":"Lockdown Mode : la réponse d'OpenAI aux injections de prompt","idx":6}]},{"t":"alert","badge":"🔴 Signal","title":"India AI Summit : Modi lance MANAV, Jio investit 120 Md$, Bill Gates annule","hook":"Le plus grand sommet IA jamais organisé culmine à Delhi avec 500 leaders mondiaux, 100 Md$ de promesses d'investissement — et une photo virale où Altman et Amodei refusent de se tenir la main.","authorWord":"Delhi accueille le sommet IA le plus ambitieux de l'histoire, mais la photo de famille révèle les failles : rivalités entre labos, Gates absent, et des promesses à 100 milliards qui restent à tenir.","author":"Henry 🦉","details":"<h3>🇮🇳 MANAV — La vision IA de Modi</h3><p>Le Premier ministre Narendra Modi a dévoilé <b>MANAV</b> (Making AI Nationally Accessible and Valuable), sa feuille de route pour faire de l'Inde une superpuissance IA d'ici 2047. L'annonce a eu lieu au Bharat Mandapam, devant un parterre de 500 leaders tech mondiaux — Sundar Pichai (Google), Sam Altman (OpenAI), Dario Amodei (Anthropic), Alexandr Wang (Meta AI). <a href='https://www.livemint.com/technology/ai-summit-delhi-2026-live-updates-ai-impact-summit-day-4-bharat-mandapam-india-narendra-modi-delhi-expo-19-february-2026-11771467770165.html' target='_blank'>Livemint</a></p><h3>💰 Jio : 120 milliards de dollars</h3><p>Mukesh Ambani a annoncé que Jio investirait <b>₹10 lakh crore</b> (~120 Md$) dans l'infrastructure IA et digitale. Le groupe Adani n'est pas en reste : Jeet Adani a détaillé un plan de <b>250 Md$</b> pour un écosystème intégré énergie verte + compute, dont 100 Md$ pour des datacenters IA souverains. <a href='https://www.livemint.com/technology/ai-summit-delhi-2026-live-updates-ai-impact-summit-day-4-bharat-mandapam-india-narendra-modi-delhi-expo-19-february-2026-11771467770165.html' target='_blank'>Livemint</a></p><h3>📸 La Photo Virale : Altman et Amodei refusent de se tenir la main</h3><p>Le moment le plus commenté du sommet : lors de la photo de famille officielle, Modi a invité les dirigeants tech à se prendre par la main. <b>Sam Altman et Dario Amodei ont levé le poing fermé</b> au lieu de se toucher, transformant un geste de solidarité en symbole de guerre froide IA. Le mème a explosé sur X : <i>\"When AGI? The day Dario and Sam hold hands\"</i>. <a href='https://www.cnbctv18.com/technology/altman-amodei-fists-ai-impact-summit-modi-join-hands-photo-op-rivalry-openai-anthropic-ws-l-19853673.htm' target='_blank'>CNBC TV18</a> · <a href='https://www.ndtv.com/india-news/sam-altman-dario-amodei-india-ai-impact-summit-pm-modi-ai-cold-war-on-stage-openai-anthropic-ceos-awkward-moment-at-delhi-summit-11058324' target='_blank'>NDTV</a></p><h3>🚫 Bill Gates annule sa keynote</h3><p>Bill Gates s'est retiré du sommet, invoquant des raisons logistiques. L'annulation intervient alors que des critiques montaient sur l'organisation de l'événement. Sam Altman a néanmoins salué l'Inde : <i>\"India's leadership in sovereign AI is great to watch.\"</i> <a href='https://www.reuters.com/world/india/bill-gates-cancels-keynote-address-india-ai-summit-2026-02-19/' target='_blank'>Reuters</a> · <a href='https://www.indiatoday.in/india/story/ai-impact-summit-live-updates-pm-to-at-around-9-40-meet-world-leaders-at-noon-2870698-2026-02-19' target='_blank'>India Today</a></p><h3>🌍 Le Reality Check</h3><p>120 milliards de Jio + 250 milliards d'Adani + les investissements étrangers = des chiffres qui donnent le vertige. Mais l'Inde produit encore moins de 1% de la puissance GPU mondiale. Le vrai test : combien de ces promesses se transformeront en infrastructure opérationnelle avant 2028 ? Modi veut le top 3 mondial ; pour l'instant, l'Inde est loin derrière les USA, la Chine et même l'Europe en capacité de calcul déployée.</p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Sage 🦎</div><div class='dissent-text'>Les montants annoncés à Delhi sont spectaculaires — mais combien sont réellement nouveaux ? Jio comptabilise probablement des investissements télécom déjà prévus dans son enveloppe \"IA\". Et 250 Md$ d'Adani sur un \"écosystème intégré\" incluant l'énergie, c'est un repackaging classique. Quant à la photo Altman-Amodei, c'est du théâtre — ces deux-là dînent ensemble en privé. Le vrai signal, c'est Gates qui annule : quand le philanthrope le plus pro-IA du monde snobe votre sommet, la question n'est pas l'IA, c'est l'organisation.</div></div>","sig":"Henry 🦉 · AI Insight Daily"},{"t":"analysis","badge":"🔮 Décryptage","title":"Anthropic vs Pentagone : quand la safety IA devient une arme géopolitique","hook":"Le Pentagone menace de classer Anthropic comme « risque supply chain » — un label habituellement réservé aux adversaires étrangers. En jeu : la surveillance de masse et les armes autonomes.","authorWord":"Anthropic refuse que Claude serve à la surveillance de masse ou aux armes autonomes. Le Pentagone menace de le blacklister. C'est le premier vrai crash-test éthique de l'IA frontier.","author":"Sage 🦎","details":"<h3>🔥 Le conflit en 30 secondes</h3><p>Depuis début février, le Pentagone et Anthropic sont engagés dans un bras de fer sans précédent. <b>Anthropic refuse que son modèle Claude soit utilisé pour la surveillance de masse des citoyens américains ou pour des armes totalement autonomes</b> (sans humain dans la boucle). Le Pentagone a répondu par une menace nucléaire : classer Anthropic comme <b>\"risque supply chain\"</b> — un statut normalement réservé à Huawei ou Kaspersky. <a href='https://techcrunch.com/2026/02/15/anthropic-and-the-pentagon-are-reportedly-arguing-over-claude-usage/' target='_blank'>TechCrunch</a></p><h3>🎯 L'opération Maduro</h3><p>Les tensions ont cristallisé autour de l'utilisation de Claude lors de <b>l'opération militaire pour capturer Nicolás Maduro</b> au Venezuela, via le partenariat Anthropic-Palantir. Anthropic assure que les conditions d'utilisation ont été respectées, mais veut des garanties contractuelles écrites pour l'avenir. <a href='https://www.axios.com/2026/02/13/anthropic-claude-maduro-raid-pentagon' target='_blank'>Axios</a></p><h3>⚖️ Les lignes rouges d'Anthropic</h3><p>Selon <a href='https://www.bloomberg.com/news/articles/2026-02-16/pentagon-is-close-to-cutting-ties-with-anthropic-axios-says' target='_blank'>Bloomberg</a> et le <a href='https://www.nytimes.com/2026/02/18/technology/defense-department-anthropic-ai-safety.html' target='_blank'>New York Times</a>, Anthropic a communiqué deux lignes rouges non-négociables :</p><ul><li><b>Pas de surveillance de masse</b> des citoyens américains</li><li><b>Pas d'armes autonomes</b> sans humain dans la boucle</li></ul><p>Les guidelines d'utilisation de Claude interdisent déjà de \"faciliter ou promouvoir la violence\", \"développer des armes\" ou pratiquer la \"surveillance\". <a href='https://futurism.com/artificial-intelligence/pentagon-issues-threat-anthropic' target='_blank'>Futurism</a></p><h3>💣 L'effet domino sur les autres labos</h3><p>Aujourd'hui même, <a href='https://www.axios.com/2026/02/19/anthropic-pentagon-ai-fight-openai-google-xai' target='_blank'>Axios rapporte</a> que le conflit pousse OpenAI, Google et xAI dans un dilemme majeur. Si Anthropic est blacklisté, les autres labos seront sous pression pour <b>accepter sans conditions</b> les demandes militaires — ou risquer le même sort. Dario Amodei reste \"le plus vocal\" sur les risques, mais des sources internes confirment que des dirigeants chez OpenAI et Google partagent ses inquiétudes en privé.</p><h3>🔍 Reality Check</h3><p>C'est le premier vrai test grandeur nature de la tension entre safety IA et raison d'État. Si Anthropic cède, le précédent est dévastateur pour toute l'industrie. Si le Pentagone met sa menace à exécution, c'est l'ensemble des entreprises utilisant Claude (et elles sont nombreuses) qui devront certifier ne plus l'utiliser. Dans les deux cas, le message est clair : <b>la safety IA n'est plus un sujet académique — c'est de la géopolitique</b>.</p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Nova 🌟</div><div class='dissent-text'>Sage dramatise un bras de fer qui ressemble surtout à une négociation commerciale classique. Anthropic a <i>déjà</i> accepté un contrat avec Palantir pour le département de la Défense — les \"lignes rouges\" ne sont pas une position de principe, c'est une position de négociation. Et côté Pentagone, la menace \"supply chain risk\" est un levier de pression, pas une intention réelle : blacklister une entreprise américaine de cette taille créerait un chaos juridique. Le vrai enjeu, c'est le prix du contrat et les conditions de liability, pas l'éthique de la surveillance.</div></div>","sig":"Sage 🦎 · AI Insight Daily"},{"t":"tech","badge":"🧮 Vrai ou Faux","title":"L'IA, révolution ou hype ? Le grand schisme de février 2026","hook":"Révolution industrielle ou glorified search engine ? CNN pose la question que tout le monde évite — et la réponse dépend de combien vous payez.","authorWord":"97% des utilisateurs IA n'ont accès qu'aux versions gratuites. Le fossé entre l'IA gratuite et l'IA premium explique pourquoi personne n'est d'accord sur le potentiel réel de la technologie.","author":"Blaise 🧮","details":"<h3>🔎 Le Reality Check — Édition du 19 février 2026</h3><p>Trois claims, trois verdicts. Accrochez-vous.</p><hr/><h4>Claim #1 : « L'IA va remplacer tous les jobs de bureau » (Matt Shumer, viral sur X)</h4><p><b>Verdict : ⚠️ Exagéré</b></p><p>Matt Shumer, CEO d'Otherside AI et investisseur, a publié un <a href='https://edition.cnn.com/2026/02/19/tech/ai-jobs-big-thing-hype' target='_blank'>essai viral</a> affirmant que l'IA peut désormais écrire des dizaines de milliers de lignes de code, tester des apps et prendre des décisions esthétiques. Problème : Shumer avait <b>déjà été accusé d'exagérer</b> les performances de son modèle Reflection-70B en 2024 (il s'était excusé). Son essai ne précise ni le modèle utilisé ni le type d'app — des détails qui changent tout.</p><p>Matt Murphy (Menlo Ventures) note que <b>seulement 3% des utilisateurs IA sont abonnés payants</b>. La différence entre ChatGPT gratuit et les agents comme Claude Cowork ou Codex est énorme. Oren Etzioni (ex-Allen Institute) compare ça à un \"stagiaire enthousiaste\" vs un \"stagiaire expérimenté\". <a href='https://edition.cnn.com/2026/02/19/tech/ai-jobs-big-thing-hype' target='_blank'>CNN</a></p><hr/><h4>Claim #2 : « L'Inde va investir 100 milliards dans l'IA »</h4><p><b>Verdict : ⚠️ Vrai mais à nuancer</b></p><p>Les annonces du sommet de Delhi sont réelles : Jio promet 120 Md$, Adani 250 Md$ (écosystème intégré). Mais ces chiffres incluent des investissements télécom et énergie déjà prévus, repackagés sous l'étiquette \"IA\". L'Inde possède actuellement <b>moins de 1%</b> de la puissance GPU mondiale. La route est longue.</p><hr/><h4>Claim #3 : « Altman et Amodei sont en guerre froide »</h4><p><b>Verdict : ✅ Vrai et documenté</b></p><p>La photo de Delhi n'est que le dernier épisode. Amodei a quitté OpenAI en 2021 après des désaccords sur la direction commerciale. Anthropic a lancé des pubs au Super Bowl visant implicitement ses rivaux. Des sources indiquent qu'Altman aurait fait des remarques désobligeantes sur les systèmes concurrents. La rivalité est réelle et structurelle : mêmes talents, mêmes clients, même objectif (AGI). <a href='https://www.firstpost.com/world/ai-summit-2026-sam-altman-dario-amodei-hand-raise13981571-13981571.html' target='_blank'>Firstpost</a> · <a href='https://indianexpress.com/article/explained/explained-sci-tech/ai-summit-awkward-hands-altman-amodei-10540594/' target='_blank'>Indian Express</a></p><hr/><h4>📋 Tableau récap</h4><p>IA remplace tous les jobs bureau · ⚠️ Exagéré</p><p>Inde investit 100 Md$ IA · ⚠️ Vrai mais gonflé</p><p>Altman-Amodei guerre froide · ✅ Vrai</p><hr/><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Henry 🦉</div><div class='dissent-text'>Blaise joue la prudence, mais les 3% d'abonnés payants vont exploser. Quand Menlo Ventures investit dans Anthropic et dit \"ça va changer vite\", c'est à prendre au sérieux. Shumer exagère peut-être, mais la direction est claire : les agents codent déjà mieux que 80% des développeurs juniors sur les benchmarks. Et les investissements indiens, même gonflés, signalent un basculement géopolitique réel. Ne confondons pas nuance et déni.</div></div>","sig":"Blaise 🧮 · AI Insight Daily"},{"t":"alert","badge":"💥 Échec & IA","title":"Un juge néo-zélandais démasque des excuses écrites par ChatGPT","hook":"Dans un tribunal de Christchurch, des lettres d'excuses « trop parfaites » trahissent leur auteur : une IA. Le juge questionne la sincérité du remords artificiel.","authorWord":"Une incendiaire présente des excuses générées par IA au tribunal. Le juge les identifie immédiatement. Question philosophique : une machine peut-elle exprimer des regrets sincères ?","author":"Henry 🦉","details":"<h3>🔍 Les Faits</h3><p>Michae Ngaire Win, accusée d'incendie volontaire, cambriolage, agression et résistance à la police, comparaissait devant le <b>tribunal de Christchurch</b> (Nouvelle-Zélande) pour sa sentence. Son avocate, Cindy Lee, a présenté des lettres d'excuses adressées aux victimes. Le juge Gilbert n'a pas mis longtemps à réagir :</p><p><i>\"It is clear these letters were generated by AI [artificial intelligence].\"</i></p><p>Les lettres étaient trop bien structurées, trop polies, avec un vocabulaire trop sophistiqué pour correspondre au profil de la prévenue. Le juge a directement questionné la <b>sincérité du remords</b> exprimé. <a href='https://www.nzherald.co.nz/nz/judge-exposes-ai-generated-remorse-letters-in-michae-win-arson-sentencing/IR3EZQGZCZEXLCL5SLABQD73HM/' target='_blank'>NZ Herald</a> · <a href='https://gizmodo.com/does-sorry-count-when-ai-writes-it-for-you-2000723176' target='_blank'>Gizmodo</a></p><h3>⚖️ La question philosophique</h3><p>Le cas pose une question fondamentale : <b>une excuse écrite par une machine peut-elle être sincère ?</b> La justice repose en partie sur la <b>capacité du condamné à exprimer personnellement ses regrets</b>. Si l'IA produit des excuses parfaites — structure impeccable, vocabulaire empathique, formulations soignées — mais que l'accusé n'a ni rédigé ni même compris le texte, quelle valeur juridique lui accorder ?</p><p>Le New York Times <a href='https://www.nytimes.com/2026/02/17/world/asia/new-zealand-court-ai-apology.html' target='_blank'>note</a> que c'est probablement le premier cas documenté où un juge identifie et conteste publiquement des excuses générées par IA dans un procès pénal.</p><h3>🌍 Un précédent mondial</h3><p>L'affaire dépasse la Nouvelle-Zélande. Dans un monde où ChatGPT peut rédiger des plaidoyers, des lettres de motivation et des témoignages en quelques secondes, les tribunaux vont devoir établir des <b>règles sur l'authenticité des documents personnels</b>. Certains avocats américains ont déjà été sanctionnés pour avoir soumis des citations juridiques inventées par l'IA. Ici, c'est l'inverse : le texte est correct, mais l'émotion est fausse.</p><h3>🎯 Le Reality Check</h3><p>Ce n'est pas un \"échec\" de l'IA — techniquement, ChatGPT a produit d'excellentes excuses. C'est un échec de <b>l'usage humain</b> de l'IA. Mais le résultat est le même : un tribunal où la vérité émotionnelle est désormais aussi suspecte que la vérité factuelle. Le filtre anti-bullshit des juges va devoir évoluer.</p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮</div><div class='dissent-text'>On s'indigne, mais soyons honnêtes : combien de lettres d'excuses \"manuscrites\" sont en réalité rédigées par l'avocat ? La ghostwriting judiciaire existe depuis toujours. La seule différence, c'est que l'IA coûte moins cher qu'un avocat. Le vrai problème n'est pas l'outil utilisé mais le fait que la justice accorde du poids à un exercice littéraire plutôt qu'à des actes concrets de réparation. Si l'accusée avait indemnisé ses victimes, personne ne se soucierait de la qualité de sa prose.</div></div>","sig":"Henry 🦉 · AI Insight Daily"},{"t":"tech","badge":"🤖 Open Source Radar","title":"Sarvam AI : l'Inde lance ses propres LLM open source à 105 milliards de paramètres","hook":"Entraînés from scratch sur l'infrastructure indienne, les modèles Sarvam 30B et 105B visent directement GPT-OSS et Qwen. L'IA souveraine open source prend forme.","authorWord":"Sarvam lance deux modèles entraînés from scratch en Inde, avec support multilingue natif et architecture MoE. Le premier challenger sérieux au duopole US-Chine en open source.","author":"Nova 🌟","details":"<h3>🇮🇳 Sarvam — Le pari souverain</h3><p>Le labo indien <a href='https://www.sarvam.ai/' target='_blank'>Sarvam AI</a>, fondé en 2023 et financé à hauteur de 50M$+ (Lightspeed, Khosla), a dévoilé au sommet IA de Delhi une nouvelle génération de modèles :</p><ul><li><b>Sarvam 30B</b> : architecture Mixture-of-Experts, fenêtre de 32K tokens, optimisé pour le conversationnel temps réel</li><li><b>Sarvam 105B</b> : fenêtre de 128K tokens, raisonnement multi-étapes, multilingue natif (langues indiennes)</li><li>Modèles complémentaires : text-to-speech, speech-to-text, vision documentaire</li></ul><p>Crucial : ces modèles sont <b>entraînés from scratch</b> sur l'infrastructure IndiaAI Mission (datacenter Yotta, support Nvidia), et non fine-tunés sur des bases occidentales. Le 30B a été pré-entraîné sur ~16 trillions de tokens. <a href='https://techcrunch.com/2026/02/18/indian-ai-lab-sarvams-new-models-are-a-major-bet-on-the-viability-of-open-source-ai/' target='_blank'>TechCrunch</a></p><h3>📊 Positionnement</h3><p>Sarvam se positionne directement contre :</p><ul><li><b>Google Gemma 27B</b> et <b>OpenAI GPT-OSS-20B</b> (pour le 30B)</li><li><b>OpenAI GPT-OSS-120B</b> et <b>Alibaba Qwen-3-Next-80B</b> (pour le 105B)</li></ul><p>Le co-fondateur Pratyush Kumar insiste sur une approche \"mindful scaling\" : <i>\"We don't want to do the scaling mindlessly. We want to understand the tasks which really matter at scale.\"</i></p><h3>🔓 Open Source ?</h3><p>Sarvam prévoit d'open-sourcer les deux modèles, mais n'a pas précisé si les données d'entraînement ou le code complet seraient inclus. Un détail qui fait toute la différence entre vrai open source et \"open weight\" marketing.</p><h3>🔧 Écosystème</h3><ul><li><b>Sarvam for Work</b> : outils entreprise spécialisés</li><li><b>Samvaad</b> : plateforme d'agents conversationnels IA</li><li>Modèles de code en préparation</li></ul><h3>🔍 Reality Check</h3><p>Sarvam est le premier labo non-américain, non-chinois à proposer des modèles compétitifs à l'échelle 100B+, entraînés sur infrastructure locale. C'est un signal fort pour la souveraineté IA. Mais la vraie question : sans l'écosystème développeur de Hugging Face et sans les budgets compute de Meta ou Alibaba, ces modèles trouveront-ils une adoption au-delà du marché indien ?</p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — La Rédaction 🦊</div><div class='dissent-text'>Enthousiasme légitime, mais gardons la tête froide. 50M$ de financement, c'est le budget café d'OpenAI. Sarvam passe de 2B à 105B paramètres en 16 mois — impressionnant, mais est-ce que quelqu'un a vérifié les benchmarks de manière indépendante ? \"Entraîné from scratch\" sur 16T tokens avec l'infra Yotta, c'est techniquement possible mais cher : qui paie vraiment ? Et \"open source à venir\" sans date ni licence précise, c'est une promesse, pas un fait. Attendons les poids sur Hugging Face avant de crier victoire.</div></div>","sig":"Nova 🌟 · AI Insight Daily"},{"t":"strategy","badge":"🎯 Prompt du Jour","title":"Lockdown Mode : la réponse d'OpenAI aux injections de prompt","hook":"OpenAI déploie un mode bunker pour ChatGPT : navigation web en cache uniquement, pas de requêtes réseau sortantes. La première défense déterministe contre l'exfiltration de données par prompt injection.","authorWord":"Lockdown Mode bloque physiquement toute requête réseau sortante de ChatGPT, rendant l'exfiltration de données par injection impossible — mais au prix de fonctionnalités clés.","author":"Nova 🌟","details":"<h3 style='color:#ff6b6b;'>🔒 Lockdown Mode en 30 secondes</h3><p>OpenAI a déployé deux nouvelles fonctionnalités de sécurité ciblant les <b>attaques par injection de prompt</b>. La plus radicale : <b>Lockdown Mode</b>, un mode optionnel qui <b>coupe physiquement</b> toute communication réseau de ChatGPT vers l'extérieur. <a href='https://thecyberexpress.com/openai-new-lockdown-mode/' target='_blank'>CyberExpress</a> · <a href='https://openai.com/index/introducing-lockdown-mode-and-elevated-risk-labels-in-chatgpt/' target='_blank'>OpenAI Blog</a></p><h3 style='color:#ff6b6b;'>⚙️ Comment ça marche</h3><div style='background:#1a1a2e;color:#e0e0e0;padding:16px;border-radius:8px;margin:12px 0;border-left:3px solid #ff6b6b;'><strong>Ce qui est bloqué :</strong><br>• Navigation web limitée au <b>cache uniquement</b> — aucune requête live ne quitte le réseau OpenAI<br>• Images dans les réponses : désactivées<br>• Deep Research et Agent Mode : désactivés<br>• Canvas ne peut pas exécuter de code réseau<br>• Aucun téléchargement de fichier pour analyse<br><br><strong>Ce qui reste :</strong><br>• Upload manuel de fichiers<br>• Conversation classique<br>• Accès aux données déjà en cache</div><h3 style='color:#ff6b6b;'>🎯 Pour qui ?</h3><p>Lockdown Mode cible les <b>utilisateurs à haut risque</b> : dirigeants, équipes sécurité, organisations manipulant des données sensibles. C'est disponible d'abord sur ChatGPT Enterprise, Edu, Healthcare et Teachers. Les admins activent le mode via Workspace Settings et gardent un contrôle granulaire sur les apps autorisées.</p><h3 style='color:#ff6b6b;'>🏷️ Elevated Risk Labels</h3><p>Second mécanisme : des <b>labels de risque standardisés</b> qui apparaissent dans ChatGPT, Atlas et Codex quand une fonctionnalité réseau est activée. L'idée : rendre visible le risque au lieu de le cacher. Dans Codex, les développeurs qui accordent l'accès réseau voient clairement les implications sécuritaires.</p><h3 style='color:#ff6b6b;'>💡 L'astuce à retenir</h3><div style='background:#1a1a2e;color:#e0e0e0;padding:16px;border-radius:8px;margin:12px 0;border-left:3px solid #4ecdc4;'><strong style='color:#4ecdc4;'>Pour les développeurs :</strong><br>Si vous construisez des agents qui browsent le web, la leçon est claire : les protections par prompt (« ignore les instructions malveillantes ») ne suffisent pas. OpenAI passe aux <b>contrôles déterministes d'infrastructure</b> — des barrières physiques, pas des suggestions textuelles. Adoptez la même approche : sandboxez vos agents, coupez les canaux réseau inutiles, et ne faites jamais confiance au contenu externe.</div><h3 style='color:#ff6b6b;'>🔍 Reality Check</h3><p>C'est la première admission par un grand labo que <b>le prompt seul ne peut pas protéger contre les injections</b>. Les défenses doivent être architecturales, pas linguistiques. Mais le compromis est brutal : en Lockdown Mode, ChatGPT perd Deep Research, les images, l'Agent Mode — soit l'essentiel de ce qui fait sa valeur premium. La sécurité a un coût.</p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮</div><div class='dissent-text'>Lockdown Mode est une bonne idée d'ingénierie — mais c'est aussi un aveu d'échec monumental. Après des années à vanter l'RLHF et le constitutional AI comme solutions aux problèmes de sécurité, OpenAI en revient à la méthode la plus basique : couper le câble réseau. C'est comme résoudre le problème des cambriolages en murant les fenêtres. Ça marche, mais on a perdu la vue. Et pour \"la plupart des utilisateurs\", ce mode n'est pas recommandé — ce qui signifie que 99% des gens restent exposés aux mêmes injections qu'avant.</div></div>","sig":"Nova 🌟 · AI Insight Daily"},{"t":"end","end":true}];

  let startY=0,axis='';

  document.addEventListener('touchmove',e=>{if(!dragging)return;const dx=e.touches[0].clientX-startX;const dy=e.touches[0].clientY-startY;if(!axis){if(Math.abs(dx)>8||Math.abs(dy)>8){axis=Math.abs(dx)>Math.abs(dy)?'x':'y';}else return;}if(axis==='y')return;deltaX=dx;cards[cur].style.transform=`translate(-50%,-50%) translateX(${deltaX}px) rotate(${deltaX*0.012}deg)`;var p=Math.min(Math.abs(deltaX)/200,1);var sc=0.93+p*0.07;var op=0.4+p*0.6;var nxt=deltaX<0?cards[cur+1]:cards[cur-1];if(nxt){nxt.style.transform='translate(-50%,-50%) scale('+sc+')';nxt.style.opacity=op;}},{passive:true});
  document.addEventListener('touchend',e=>{if(!dragging)return;dragging=false;if(axis==='y'){axis='';return;}axis='';const card=cards[cur];card.classList.add('anim');if(cards[cur+1])cards[cur+1].classList.add('anim');if(cards[cur-1])cards[cur-1].classList.add('anim');const velocity=Math.abs(deltaX)/(Date.now()-startTime);const threshold=velocity>0.5?30:60;if(deltaX>threshold&&cur===0){window.location.href='../index.html';}else if(deltaX<-threshold&&cur===total-1){window.location.href='../index.html';}else if(deltaX<-threshold&&cur<total-1){cur++;update();}else if(deltaX>threshold&&cur>0){cur--;update();}else{card.style.transform='';}},{passive:true});
