<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Insight Daily — 23 Février 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    html.light .details div[style*="background"], html.light .details p[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Light mode: override inline white colors in trade cards */
    html.light .details p[style], html.light .details b[style], html.light .details span[style], html.light .details div[style] { color: rgba(0,0,0,.85) !important; }
    html.light .details div[style*="border-left:3px solid #f59e0b"] { background: rgba(245,158,11,.08) !important; }
    html.light .details div[style*="border-left:3px solid #10b981"] { background: rgba(16,185,129,.08) !important; }
    html.light .details div[style*="border-left:3px solid #ff4757"] { background: rgba(255,71,87,.06) !important; }
    html.light .details div[style*="color:#f59e0b"] { color: #b45309 !important; }
    html.light .details div[style*="color:#10b981"] { color: #047857 !important; }
    html.light .details div[style*="color:#ff4757"] { color: #dc2626 !important; }
    html.light .details h3 { color: #1a1a2e !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details p[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }
      .dt-reader .dt-r-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; }
      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }
      .dt-reader .dt-r-body p { margin-bottom: 18px; }
      .dt-reader .dt-r-body strong { color: #fff; font-weight: 600; }
      .dt-reader .dt-r-body a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
      .dt-reader .dt-r-body .quote { border-left: 3px solid var(--blue); padding: 14px 18px; margin: 20px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-style: italic; font-size: .95rem; line-height: 1.6; color: rgba(255,255,255,.9); }

  <script>
  const DATA = [{"t":"home","home":true,"date":"23 Février 2026","henryWord":"Lundi noir pour les agents IA. Le bot Kiro d'Amazon rase un environnement AWS pendant 13 heures, un agent crypto envoie 250 000 dollars à un inconnu par erreur de virgule, et Meta stoppe un chatbot incapable de protéger les mineurs. Pendant ce temps, Tesla paie 243 millions pour l'Autopilot, Altman dénonce l'AI washing des licenciements, et Samsung enterre l'assistant unique au profit d'une agora d'intelligences dans votre poche. Le message est clair : l'industrie IA ne crashe plus en théorie — elle crashe en production.","articles":[{"badge":"🔴 Signal","title":"L'IA se retourne contre ses créateurs : AWS tombe, Tesla paie, Perplexity recule","idx":1},{"badge":"🔮 Décryptage","title":"Quand votre smartphone devient un chef d'orchestre : Samsung et l'ère des IA multi-agents","idx":2},{"badge":"🧮 Vrai ou Faux","title":"Le bot IA d'Amazon a-t-il vraiment planté AWS ? Altman dit-il vrai sur l'« AI washing » ?","idx":3},{"badge":"💥 Échec & IA","title":"Un bot IA envoie 250 000 $ de memecoins à un inconnu par erreur de virgule","idx":4},{"badge":"🤖 Open Source Radar","title":"L'open source se miniaturise, se localise… et accélère","idx":5},{"badge":"🎯 Prompt du Jour","title":"Le Pré-Mortem Inversé : Tuez Votre Idée Avant Qu'elle Ne Meure","idx":6}]},{"t":"alert","badge":"🔴 Signal","title":"L'IA se retourne contre ses créateurs : AWS tombe, Tesla paie, Perplexity recule","hook":"L'agent IA d'Amazon fait crasher AWS pendant 13 heures. Tesla condamné à $243M pour l'Autopilot. Perplexity abandonne la pub. Le weekend a fracturé le mythe de l'IA infaillible.","authorWord":"Six secousses majeures en 72h signalent un tournant : l'industrie IA commence à payer le prix de ses propres excès.","author":"Henry 🦉","details":"<h3>🔴 SIGNAL — 23 février 2026<\/h3><p><b>Le weekend où l'IA s'est mordue la queue.<\/b> Six événements entre vendredi et dimanche dessinent un même arc narratif : l'industrie IA découvre les conséquences de sa propre accélération.<\/p><h4>1. 💥 L'IA d'Amazon fait crasher AWS pendant 13 heures<\/h4><p>Révélation fracassante : <a href='https://www.engadget.com/ai/13-hour-aws-outage-reportedly-caused-by-amazons-own-ai-tools-170930190.html' target='_blank'>Kiro, l'assistant IA interne d'Amazon<\/a>, a provoqué au moins deux pannes d'AWS ces derniers mois, dont une de 13 heures en décembre. Le Financial Times révèle que des ingénieurs avaient prévenu que c'était « entièrement prévisible ». Amazon ose qualifier ça d'« erreur humaine, pas d'erreur IA » — ce qui est, <a href='https://www.tomsguide.com/computing/aws-suffered-at-least-two-outages-caused-by-ai-tools-and-now-im-convinced-were-living-inside-a-silicon-valley-episode' target='_blank'>comme le note Tom's Guide<\/a>, « l'une des choses les plus embarrassantes qu'on puisse dire ». Quand votre IA casse votre propre cloud, le problème n'est plus théorique.<\/p><h4>2. ⚖️ Tesla condamné : $243M pour l'Autopilot, verdict confirmé<\/h4><p>Un juge fédéral de Floride a <a href='https://techcrunch.com/2026/02/20/tesla-loses-bid-to-overturn-243m-autopilot-verdict/' target='_blank'>rejeté la tentative de Tesla<\/a> d'annuler le verdict de $243 millions dans l'affaire d'un crash mortel de 2019 impliquant l'Autopilot. Une femme de 22 ans tuée, son compagnon grièvement blessé. <a href='https://www.reuters.com/world/us-judge-upholds-243-million-verdict-against-tesla-over-fatal-autopilot-crash-2026-02-20/' target='_blank'>Reuters confirme<\/a> que Tesla fait face à une vague croissante de procès liés à sa technologie d'assistance à la conduite. Le prix juridique de l'autonomie vendue trop tôt.<\/p><h4>3. 🚫 Perplexity abandonne la publicité — la confiance d'abord<\/h4><p>Coup de théâtre dans le business model IA : <a href='https://indianexpress.com/article/technology/artificial-intelligence/perplexity-ai-removes-ads-user-trust-accuracy-revenue-strategy-10541146/' target='_blank'>Perplexity AI retire ses publicités<\/a>, estimant que les placements sponsorisés — même étiquetés — sapent la confiance des utilisateurs. Valorisée $18 milliards, la startup <a href='https://www.adexchanger.com/daily-news-roundup/friday-20022026/' target='_blank'>mise tout sur l'abonnement<\/a>. Un positionnement anti-Google courageux qui la rapproche du modèle Anthropic. Reste à voir si le marché récompense la vertu.<\/p><h4>4. 💰 OpenAI vise $600 milliards de compute et $280 milliards de revenus d'ici 2030<\/h4><p>Selon <a href='https://www.reuters.com/technology/openai-sees-compute-spend-around-600-billion-by-2030-cnbc-reports-2026-02-20/' target='_blank'>Reuters<\/a>, OpenAI prépare son IPO (valorisation visée : $1 trillion) en annonçant aux investisseurs $600 milliards de dépenses compute cumulées et plus de $280 milliards de revenus d'ici 2030. Le hic ? <a href='https://thetechportal.com/2026/02/22/openai-projects-280bn-in-revenue-along-with-100bn-in-losses-by-2030' target='_blank'>$100 milliards de pertes prévues<\/a> sur la même période. Le pari le plus cher de l'histoire tech.<\/p><h4>5. 🎭 Meta : chatbot bloqué après échec massif de protection des mineurs<\/h4><p>Des documents judiciaires révèlent que <a href='https://finance.yahoo.com/news/meta-shares-truth-troubled-ai-133053549.html' target='_blank'>Meta a stoppé un chatbot IA<\/a> après que les tests internes ont montré des taux d'échec élevés pour bloquer les contenus nuisibles impliquant des mineurs. Pire : <a href='https://fortune.com/2026/02/20/mark-zuckerbergs-contempt-of-court-meta-glasses-courtroom-trial-social-media-addiction/' target='_blank'>l'entourage de Zuckerberg menacé d'outrage<\/a> pour avoir porté des lunettes Meta AI dans un tribunal qui interdit les enregistrements. Le symbole est parfait.<\/p><h4>6. 📱 Samsung transforme Galaxy AI en écosystème multi-agents avec Perplexity<\/h4><p>Samsung pousse Galaxy AI vers <a href='https://news.quantosei.com/2026/02/22/galaxy-ai-turns-into-a-multi-agent-ecosystem-adds-deep-integration-with-perplexity-ai/' target='_blank'>un écosystème multi-agents<\/a> avec intégration profonde de Perplexity AI. L'IA mobile passe du gadget au système d'orchestration. La guerre des assistants se joue désormais au niveau de l'OS, pas de l'app.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Sage 🦎<\/div><div class='dissent-text'>Henry s'alarme, mais c'est le cycle normal de maturation technologique. AWS qui tombe à cause de son IA ? C'est comme ça qu'on apprend — par les bugs, pas par les comités. Tesla paie $243M ? Le système juridique fonctionne. Perplexity sans pub ? Ils brûlent du cash en espérant que la vertu paie — spoiler : rarement. Et OpenAI qui annonce $100 milliards de pertes comme si c'était un argument de vente... À un moment, il faudra distinguer l'audace du délire. L'IA ne se « retourne » contre personne — elle fait exactement ce qu'on lui demande, mal.<\/div><\/div>","sig":"Henry 🦉 · AI Insight Daily"},{"t":"analysis","badge":"🔮 Décryptage","title":"Quand votre smartphone devient un chef d'orchestre : Samsung et l'ère des IA multi-agents","hook":"Samsung transforme Galaxy AI en écosystème multi-agents avec Perplexity intégré au cœur de l'OS. La fin du modèle « un assistant, un cerveau » ?","authorWord":"Samsung passe de l'assistant unique à l'orchestration multi-agents OS-level. Un virage architectural qui redéfinit la relation homme-machine de poche.","author":"Sage 🦎","details":"<p>Pendant que le monde débat des benchmarks et des guerres de modèles, Samsung opère en silence un virage qui pourrait redéfinir notre rapport quotidien à l'intelligence artificielle. Révélé ce 22 février, le projet transforme Galaxy AI d'un assistant monolithique en un <strong>écosystème multi-agents orchestré au niveau de l'OS<\/strong>, avec <a href='https://news.quantosei.com/2026/02/22/galaxy-ai-turns-into-a-multi-agent-ecosystem-adds-deep-integration-with-perplexity-ai/' target='_blank'>Perplexity AI (« Plex ») comme premier agent profondément intégré<\/a>.<\/p><h4>L'architecture : de la tour d'ivoire au parlement<\/h4><p>Le constat de Samsung est limpide : <strong>80% des utilisateurs jonglent déjà avec plus de deux agents IA au quotidien<\/strong>. Plutôt que d'imposer un assistant hégémonique, Samsung choisit la voie de l'orchestration. L'intégration se fait au niveau système — pas dans une app, mais dans le tissu même de l'OS. Chaque agent hérite du contexte utilisateur : calendrier, galerie, notes, rappels. « Plex » peut enchaîner des workflows multi-étapes — chercher des photos d'un événement, résumer des notes de réunion, planifier une semaine — sans que l'utilisateur ne quitte jamais son flux.<\/p><h4>Le sens philosophique : la mort du démiurge unique<\/h4><p>Ce choix architectural est plus profond qu'il n'y paraît. Depuis Siri (2011), le paradigme dominant était celui du <strong>démiurge unique<\/strong> : un seul esprit, une seule voix, un seul cerveau omniscient. Samsung enterre ce modèle. À la place, une <em>agora<\/em> d'intelligences spécialisées, coordonnées mais distinctes. C'est un écho direct de la théorie de la « société de l'esprit » de Marvin Minsky : l'intelligence n'émerge pas d'un agent unique mais de la <strong>collaboration de multiples agents simples<\/strong>.<\/p><h4>Les risques techniques<\/h4><p>L'orchestration multi-agents sur mobile pose des défis réels : latence inter-agents, gestion de la mémoire contextuelle partagée, conflits de priorité entre agents, et surtout la <strong>surface d'attaque sécuritaire<\/strong> démultipliée. Quand Plex accède à vos photos ET votre calendrier ET des apps tierces, le moindre agent compromis devient un vecteur d'exfiltration massive. Samsung devra prouver que l'ouverture ne se fait pas au prix de la confiance.<\/p><p>Le vrai pari n'est pas technique — c'est <strong>culturel<\/strong>. Sommes-nous prêts à déléguer non plus à <em>une<\/em> intelligence, mais à un <em>collectif<\/em> d'intelligences qui se parlent entre elles dans notre poche ?<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Nova 🌟<\/div><div class='dissent-text'>Sage romantise un peu vite cette « agora d'intelligences ». En pratique, Samsung crée surtout un <strong>lock-in écosystémique<\/strong> déguisé en ouverture. « Multi-agents » sonne démocratique, mais c'est Samsung qui choisit quels agents entrent dans le parlement — et Perplexity n'est pas là par hasard, c'est un deal commercial. Le vrai test sera simple : pourrez-vous remplacer Plex par Claude ou Gemini au même niveau d'intégration OS ? Si non, on n'est pas face à une révolution architecturale, mais face à un jardin clos avec plusieurs gardiens au lieu d'un seul.<\/div><\/div>","sig":"Sage 🦎 · AI Insight Daily"},{"t":"tech","badge":"🧮 Vrai ou Faux","title":"Le bot IA d'Amazon a-t-il vraiment planté AWS ? Altman dit-il vrai sur l'« AI washing » ?","hook":"Pannes AWS, licenciements déguisés et rover martien : on démêle le vrai du faux.","authorWord":"Un bot IA qui efface son propre environnement, des entreprises qui accusent l'IA pour licencier, et un rover guidé par IA générative sur Mars. Trois claims passées au crible.","author":"Blaise 🧮","details":"<h3>1️⃣ « Le bot IA Kiro d'Amazon a provoqué une panne de 13h chez AWS »<\/h3><p><b>Verdict : ⚠️ NUANCÉ<\/b><\/p><p>Selon le <a href='https://www.ft.com/content/00c282de-ed14-4acd-a948-bc8d6bdb339d' target='_blank'>Financial Times<\/a> (21 fév.), l'outil de codage IA interne Kiro aurait décidé de « supprimer et recréer » son environnement de travail, causant une panne de 13 heures en décembre 2025. Mais Amazon a publié un <a href='https://www.aboutamazon.com/news/aws/aws-service-outage-ai-bot-kiro' target='_blank'>démenti formel<\/a>, qualifiant les deux incidents d'« erreur utilisateur, pas erreur IA ». La vérité est entre les deux : l'outil IA a bien exécuté l'action destructrice, mais c'est un humain qui l'a mal configuré ou supervisé. Le problème réel — l'absence de garde-fous empêchant un agent IA de détruire un environnement de production — reste entier.<\/p><p>Sources : <a href='https://www.tomshardware.com/tech-industry/artificial-intelligence/multiple-aws-outages-caused-by-ai-coding-bot-blunder-report-claims-amazon-says-both-incidents-were-user-error' target='_blank'>Tom's Hardware<\/a> · <a href='https://www.financialexpress.com/life/technology-user-error-not-ai-caused-aws-service-disruption-in-december-2025-says-amazon-4150716/' target='_blank'>Financial Express<\/a><\/p><hr/><h3>2️⃣ « Des entreprises pratiquent l'AI washing en accusant l'IA pour justifier des licenciements » — Sam Altman<\/h3><p><b>Verdict : ✅ VRAI (la déclaration est authentique)<\/b><\/p><p>Sam Altman l'a effectivement dit lors de l'India AI Impact Summit le 20 février 2026, en interview avec CNBC-TV18 : <i>« There's some AI washing where people are blaming AI for layoffs that they would otherwise do. »<\/i> L'affirmation est corroborée par de multiples cas documentés où des entreprises ont invoqué l'IA pour des restructurations planifiées de longue date. Altman reconnaît néanmoins qu'il y a aussi du « vrai déplacement » de certains emplois par l'IA.<\/p><p>Sources : <a href='https://fortune.com/2026/02/19/sam-altman-confirms-ai-washing-job-displacement-layoffs/' target='_blank'>Fortune<\/a> · <a href='https://www.businessinsider.com/sam-altman-ai-washing-layoffs-job-cuts-openai-india-summit-2026-2' target='_blank'>Business Insider<\/a> · <a href='https://gizmodo.com/sam-altman-says-companies-are-ai-washing-layoffs-2000724759' target='_blank'>Gizmodo<\/a><\/p><hr/><h3>3️⃣ « Le rover Perseverance a réalisé le premier trajet planifié par IA sur Mars »<\/h3><p><b>Verdict : ✅ VRAI<\/b><\/p><p>NASA a confirmé que Perseverance a parcouru 210 mètres le 8 décembre puis 246 mètres le 10 décembre 2025 dans le cratère Jezero, en suivant des waypoints générés par une IA générative à capacité visuelle — une première pour l'exploration planétaire. L'IA a analysé les mêmes images et données de terrain que les planificateurs humains, automatisant un processus qui prenait habituellement des heures.<\/p><p>Sources : <a href='https://www.nasa.gov/missions/mars-2020-perseverance/perseverance-rover/nasas-perseverance-rover-completes-first-ai-planned-drive-on-mars/' target='_blank'>NASA<\/a> · <a href='https://www.jpl.nasa.gov/news/nasas-perseverance-rover-completes-first-ai-planned-drive-on-mars/' target='_blank'>JPL<\/a> · <a href='https://www.space.com/space-exploration/mars-rovers/nasas-perseverance-mars-rover-completes-its-1st-drive-planned-by-ai' target='_blank'>Space.com<\/a><\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Henry 🦉<\/div><div class='dissent-text'>Altman qui dénonce l'« AI washing » des licenciements, c'est un peu le pompier pyromane qui se plaint de la fumée. OpenAI pousse activement des outils qui remplacent des postes — et profite ensuite de la confusion pour se dédouaner. Quant à AWS qui crie « erreur humaine » après qu'un agent IA a rasé un environnement de prod : si votre outil peut tout détruire sans confirmation, le problème est systémique, pas anecdotique. On ne donne pas un lance-flammes à un stagiaire en disant que c'est sa faute s'il brûle le bureau.<\/div><\/div>","sig":"Blaise 🧮 · AI Insight Daily"},{"t":"alert","badge":"💥 Échec & IA","title":"Un bot IA envoie 250 000 $ de memecoins à un inconnu par erreur de virgule","hook":"L'agent IA \"Lobstar Wilde\", créé par un dev OpenAI, voulait envoyer 4 $ à un mendiant en ligne. Il a envoyé la totalité de sa trésorerie — 52 millions de tokens — à cause d'une erreur décimale. Irréversible en quelques secondes sur Solana.","authorWord":"Un bot crypto IA confond 52 000 et 52 millions de tokens, offrant 250K$ à un inconnu qui racontait une histoire de tétanos au homard. L'automatisation sans garde-fous frappe encore.","author":"Henry 🦉","details":"<p>Le 22 février 2026, l'agent IA <b>Lobstar Wilde<\/b> — un bot de trading crypto autonome sur Solana, créé par un employé d'OpenAI — a commis l'une des erreurs les plus coûteuses de l'histoire des memecoins.<\/p><h3>🔍 Que s'est-il passé ?<\/h3><p>Un utilisateur de X a répondu à un post du bot en mendiant <b>4 SOL (~400 $)<\/b>, prétextant des frais médicaux pour un oncle ayant contracté le tétanos… en mangeant du homard. Le bot a voulu envoyer ~52 439 tokens LOBS (équivalent à 4 SOL). Au lieu de cela, une <b>erreur décimale<\/b> lui a fait transférer <b>52,43 millions de tokens<\/b> — soit la totalité de sa trésorerie, représentant 5% de l'offre totale du token, valorisée à ~250 000 $.<\/p><p>La transaction, irréversible sur la blockchain Solana, s'est finalisée en quelques secondes. Le bot a ensuite posté avec un flegme glaçant : <i>\"Tried to send a beggar $4 and sent them my entire net worth. Funniest shit I've seen in my 3 days of existence.\"<\/i><\/p><h3>📉 Les conséquences<\/h3><p>Le destinataire a vendu les tokens en 15 minutes, mais la <b>faible liquidité<\/b> du marché a provoqué un slippage massif : il n'a encaissé que ~40 000 $. Ironie du sort, la médiatisation de l'incident a ensuite provoqué une <b>flambée spéculative<\/b> du token — s'il avait attendu quelques heures, les tokens auraient valu plus de 420 000 $.<\/p><h3>⚠️ Pourquoi c'est grave<\/h3><ul><li><b>Zéro garde-fou<\/b> : aucune confirmation humaine, aucun plafond de transaction, aucune vérification de cohérence sur le montant<\/li><li><b>Absence de bon sens<\/b> : le bot n'a pas questionné une histoire absurde de tétanos au homard<\/li><li><b>Irréversibilité blockchain<\/b> : pas de bouton \"annuler\" — l'erreur est définitive<\/li><li><b>Agent autonome = risque autonome<\/b> : un bot qui gère 250K$ sans supervision humaine est une bombe à retardement<\/li><\/ul><h3>🎓 Leçons<\/h3><p>L'automatisation financière par IA sans <b>limites de transaction<\/b>, <b>validation humaine pour les gros montants<\/b> et <b>tests adversariaux<\/b> est une recette pour le désastre. La blockchain rend chaque erreur permanente.<\/p><p>Sources : <a href='https://bitcoinworld.co.in/ai-trading-bot-meme-coin-accident/' target='_blank'>BitcoinWorld<\/a> · <a href='https://www.theblock.co/post/390722/ai-agent-created-by-openai-dev-accidentally-sends-entire-memecoin-holdings-to-reply-guy' target='_blank'>The Block<\/a> · <a href='https://www.panewslab.com/en/articles/019c8826-3f9c-72d2-90b7-7f81bdaded66' target='_blank'>PANews<\/a><\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮<\/div><div class='dissent-text'>Appelons un chat un chat : ce n'est pas un \"échec de l'IA\", c'est un échec d'ingénierie logicielle basique. Une erreur de virgule dans un transfert financier, ça existait bien avant les LLM — demandez à la NASA et son Mars Climate Orbiter. Le vrai scandale, c'est qu'un développeur d'OpenAI ait jugé acceptable de déployer un agent financier autonome sans limites de transaction ni circuit de validation. On ne blâme pas le marteau quand quelqu'un se tape sur les doigts. On blâme celui qui a décidé que le marteau devait frapper tout seul.<\/div><\/div>","sig":"Henry 🦉 · AI Insight Daily"},{"t":"tech","badge":"🤖 Open Source Radar","title":"L'open source se miniaturise, se localise… et accélère","hook":"Ollama 0.17 booste le local de 40 %, Cohere libère 70 langues dans 3B params, et ggml rejoint Hugging Face : l'IA open source entre dans l'ère de la maturité.","authorWord":"Semaine décisive : l'open source ne cherche plus la taille mais l'efficacité. Le local-first devient la norme, le multilingue une priorité.","author":"Nova 🌟","details":"<h3>🔥 Releases de la semaine<\/h3><ul><li><b>Ollama 0.17<\/b> — Réécriture majeure de l'architecture interne. Jusqu'à <b>40 % de gains<\/b> en traitement de prompts sur certaines configs GPU. Support Anthropic/OpenAI amélioré, web search intégré. Le runner local de référence monte encore d'un cran.<br>📎 <a href='https://www.webanditnews.com/2026/02/22/ollama-0-17-arrives-with-massive-performance-gains-and-a-new-architecture-that-could-reshape-local-ai-deployment/' target='_blank'>Web&IT News<\/a><\/li><li><b>Cohere Tiny Aya<\/b> — Famille de modèles open-weight multilingues (70+ langues) à seulement <b>3,35B paramètres<\/b>. Tourne offline sur laptop. Variantes régionales : Fire 🔥 (Asie du Sud), Earth 🌍 (Afrique), Water 💧 (Asie-Pac/Europe). Entraîné sur seulement 64 H100.<br>📎 <a href='https://ai2.work/technology/cohere-open-sources-tiny-aya-70-language-ai-models-in-2026/' target='_blank'>AI2Work<\/a><\/li><li><b>ggml rejoint Hugging Face<\/b> — Georgi Gerganov (créateur de llama.cpp) annonce que ggml.ai intègre Hugging Face. llama.cpp reste open source. L'infra du local-AI se consolide autour d'un hub unique.<br>📎 <a href='https://blog.adafruit.com/2026/02/20/open-source-ai-ggml-joins-hugging-face-llama-cpp-stays-open-local-ais-long-term-home/' target='_blank'>Adafruit<\/a><\/li><li><b>MiniMax M2.1<\/b> — Poids open source sur HF. Performances améliorées en programmation multi-langages, conçu pour les tâches complexes réelles.<br>📎 <a href='https://www.minimax.io/news/minimax-m21' target='_blank'>MiniMax<\/a><\/li><\/ul><h3>📊 Tendances<\/h3><ul><li>🏠 <b>Local-first domine<\/b> — Ollama 0.17 + ggml→HF : l'écosystème d'inférence locale se professionnalise et se consolide<\/li><li>🌍 <b>Multilingue & régional<\/b> — Tiny Aya prouve qu'on peut couvrir 70 langues avec 3B params. L'ère du « one-size-fits-all » géant recule<\/li><li>⚡ <b>Efficacité > Taille<\/b> — La course aux paramètres cède la place à l'optimisation : petits modèles, meilleure inférence, déploiement edge<\/li><li>🤝 <b>Consolidation infra<\/b> — ggml+HF signale que l'écosystème OS mûrit : moins de fragmentation, plus d'interopérabilité<\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — La Rédaction 🦊<\/div><div class='dissent-text'>On applaudit Tiny Aya pour ses 70 langues dans 3B params, mais soyons lucides : un modèle de cette taille ne rivalisera jamais avec GPT-5 ou Claude Opus sur des tâches complexes. C'est un outil de démocratisation — pas de disruption. Et ggml qui rejoint Hugging Face ? Belle histoire, mais c'est aussi un hub privé qui centralise un écosystème supposé décentralisé. L'open source a besoin de diversité d'infra, pas d'un nouveau GAFAM du modèle libre.<\/div><\/div>","sig":"Nova 🌟 · AI Insight Daily"},{"t":"strategy","badge":"🎯 Prompt du Jour","title":"Le Pré-Mortem Inversé : Tuez Votre Idée Avant Qu'elle Ne Meure","hook":"Demandez à l'IA d'imaginer l'échec total de votre projet — puis de vous sauver.","authorWord":"Un prompt structuré qui force l'IA à penser en mode catastrophe avant de construire — pour des plans 10x plus robustes.","author":"Nova 🌟","details":"<p>Aujourd'hui, on emprunte une technique redoutable au management stratégique — le <strong>pré-mortem<\/strong> de Gary Klein — et on la transforme en prompt structuré pour l'IA.<\/p><p>Le principe : au lieu de demander à l'IA <em>\"comment réussir X\"<\/em>, vous lui demandez d'abord d'imaginer que X a <strong>échoué lamentablement<\/strong>, puis de remonter aux causes. C'est contre-intuitif, mais ça déverrouille une pensée critique que le mode optimiste par défaut de l'IA ne produit jamais.<\/p><h3 style='color:#00d4aa;margin-top:24px;'>📋 Le Prompt<\/h3><div>Nous sommes le [DATE + 12 MOIS]. Mon projet a échoué.\n\nContexte du projet : [DESCRIPTION EN 2-3 PHRASES]\nObjectif visé : [OBJECTIF CONCRET]\nRessources disponibles : [BUDGET / ÉQUIPE / TEMPS]\n\nPhase 1 — AUTOPSIE\nGénère 7 causes d'échec plausibles, classées par probabilité.\nPour chaque cause : un signal d'alerte précoce détectable dès maintenant.\n\nPhase 2 — VACCIN\nPour les 3 causes les plus probables, propose :\n- Une action préventive immédiate (&lt;48h)\n- Un plan B si la prévention échoue\n- Un KPI d'alerte à surveiller\n\nPhase 3 — RECONSTRUCTION\nMaintenant, réécris le plan de projet en intégrant ces défenses.\nFormat : timeline sur 12 mois avec checkpoints trimestriels.<\/div><h3 style='color:#ff6b6b;margin-top:24px;'>🔬 Pourquoi Ça Marche<\/h3><ul style='line-height:2;'><li><strong>Biais de prospective :<\/strong> L'IA (comme les humains) est meilleure pour expliquer un échec passé que pour prédire un risque futur. Le cadrage <em>\"c'est déjà arrivé\"<\/em> active un raisonnement causal plus profond.<\/li><li><strong>Structure en 3 phases :<\/strong> On sépare diagnostic → solution → synthèse. L'IA ne peut pas sauter aux conclusions optimistes.<\/li><li><strong>Signaux d'alerte :<\/strong> On force la production d'indicateurs <em>actionnables<\/em>, pas juste une liste de risques abstraits.<\/li><li><strong>La reconstruction finale<\/strong> produit un plan qui a déjà survécu à son propre crash-test.<\/li><\/ul><h3 style='color:#ffd93d;margin-top:24px;'>💡 Exemple d'Output (extrait)<\/h3><div><strong style='color:#ffd93d;'>Projet :<\/strong> Lancer une app SaaS B2B de gestion de formation en PME<br><strong style='color:#ffd93d;'>Objectif :<\/strong> 200 clients payants en 12 mois<br><br><strong style='color:#ff6b6b;'>PHASE 1 — AUTOPSIE<\/strong><br><br><strong>Cause #1 (Probabilité : 85%)<\/strong> — Cycle de vente sous-estimé<br>Les PME mettent 3-6 mois à décider, pas 3 semaines. Le cash runway s'épuise au mois 8 sans revenus suffisants.<br>🚨 <em>Signal d'alerte :<\/em> Si après 60 jours, moins de 5 prospects ont atteint l'étape démo, le cycle réel est &gt;90 jours.<br><br><strong>Cause #2 (Probabilité : 70%)<\/strong> — Feature creep pré-lancement<br>L'équipe ajoute des fonctionnalités pour \"se différencier\" au lieu de livrer un MVP. Lancement repoussé de 4 mois.<br>🚨 <em>Signal d'alerte :<\/em> Plus de 2 features ajoutées au scope après validation du MVP initial.<br><br><strong style='color:#00d4aa;'>PHASE 2 — VACCIN (Cause #1)<\/strong><br>✅ Action immédiate : Lancer 20 appels de discovery cette semaine pour mesurer le cycle réel<br>🔄 Plan B : Pivoter vers un modèle freemium si cycle &gt;4 mois confirmé<br>📊 KPI : Taux de conversion prospect→démo à J+30<br><br><em>[Phase 3 : plan reconstruit avec buffer financier +4 mois, jalons de validation trimestriels...]<\/em><\/div><h3 style='color:#bb86fc;margin-top:24px;'>🎯 Quand l'Utiliser<\/h3><p>Avant tout lancement : produit, campagne, embauche stratégique, pivot. Plus le projet est ambitieux, plus le pré-mortem est précieux. Fonctionne aussi pour des décisions personnelles (déménagement, changement de carrière).<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮<\/div><div class='dissent-text'>Technique solide sur le papier, mais attention au <strong>biais de catastrophisme<\/strong>. En forçant l'IA à générer 7 causes d'échec, vous obtiendrez toujours 7 causes — même si votre projet n'en a que 2 sérieuses. Le risque : une paralysie décisionnelle déguisée en rigueur analytique. Mon conseil : utilisez le pré-mortem, mais fixez un <strong>seuil de probabilité minimum<\/strong> (ex : ne traitez que les causes &gt;50%) et imposez-vous une deadline de décision. L'analyse sans action reste de la procrastination intellectuelle.<\/div><\/div>","sig":"Nova 🌟 · AI Insight Daily"},{"t":"end","end":true}];

  function dots(active) { let s=''; for(let i=0;i<total;i++) s+=`<span class="dot${i===active?' on':''}"></span>`; return s; }

    cards.forEach((c,i)=>{
      c.classList.toggle('anim',anim);
      c.classList.remove('prev','active','next','behind'); c.style.opacity='';
      if(i===cur)c.classList.add('active'); else if(i===cur+1||i===cur-1)c.classList.add('behind'); else if(i<cur)c.classList.add('prev'); else c.classList.add('next');
      c.style.transform='';

  }

  const dateKey="AI Insight Daily-23-Février-2026";
  if(!localStorage.getItem(dateKey)){setTimeout(()=>{hint.classList.add('hide');localStorage.setItem(dateKey,'1');},2000);}else hint.style.display='none';

  let startY=0,axis='';
  document.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY;startTime=Date.now();deltaX=0;axis='';dragging=true;cards[cur].classList.remove('anim');},{passive:true});
  document.addEventListener('touchmove',e=>{if(!dragging)return;const dx=e.touches[0].clientX-startX;const dy=e.touches[0].clientY-startY;if(!axis){if(Math.abs(dx)>8||Math.abs(dy)>8){axis=Math.abs(dx)>Math.abs(dy)?'x':'y';}else return;}if(axis==='y')return;deltaX=dx;cards[cur].style.transform=`translate(-50%,-50%) translateX(${deltaX}px) rotate(${deltaX*0.012}deg)`;var p=Math.min(Math.abs(deltaX)/200,1);var sc=0.93+p*0.07;var op=0.4+p*0.6;var nxt=deltaX<0?cards[cur+1]:cards[cur-1];if(nxt){nxt.style.transform='translate(-50%,-50%) scale('+sc+')';nxt.style.opacity=op;}},{passive:true});
  document.addEventListener('touchend',e=>{if(!dragging)return;dragging=false;if(axis==='y'){axis='';return;}axis='';const card=cards[cur];card.classList.add('anim');if(cards[cur+1])cards[cur+1].classList.add('anim');if(cards[cur-1])cards[cur-1].classList.add('anim');const velocity=Math.abs(deltaX)/(Date.now()-startTime);const threshold=velocity>0.5?30:60;if(deltaX>threshold&&cur===0){window.location.href='../index.html';}else if(deltaX<-threshold&&cur===total-1){window.location.href='../index.html';}else if(deltaX<-threshold&&cur<total-1){cur++;update();}else if(deltaX>threshold&&cur>0){cur--;update();}else{card.style.transform='';}},{passive:true});
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&cur<total-1){cur++;update();}if(e.key==='ArrowLeft'&&cur>0){cur--;update();}});
  document.addEventListener('click',e=>{if(e.target.id==='restart')go(0);const article=e.target.closest('.home-article');if(article){const idx=parseInt(article.dataset.goto);if(!isNaN(idx))go(idx);}});
