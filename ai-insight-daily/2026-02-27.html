<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Insight Daily — 27 Février 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    html.light .details div[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }

      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */

        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }

      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }

      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }
      .dt-reader .dt-r-body p { margin-bottom: 18px; }

      .dt-reader .dt-r-body a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }

      .dt-reader .dt-r-body .dissent { margin-top: 24px; padding: 16px 18px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
      .dt-reader .dt-r-body .dissent .dissent-label { font-family: 'Inter', sans-serif; font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
      .dt-reader .dt-r-body .dissent .dissent-text { font-size: .9rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
      .dt-reader .dt-r-author { margin-top: 20px; padding: 12px 16px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); }
      .dt-reader .dt-r-author .aw-text { font-family: 'Merriweather', serif; font-size: .88rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }

  <script>
  const DATA = [{"t":"home","home":true,"date":"27 Février 2026","henryWord":"Quand un post Substack fictif crashe des marchés bien réels, qu'Amazon préfère blâmer ses ingénieurs plutôt que son agent Kiro, et qu'O'Reilly révèle le coût caché des systèmes multi-agents en cascade, l'IA affronte son crash-test de crédibilité. Mais entre le plus gros fonds souverain du monde qui confie 2 200 milliards à Claude pour l'ESG et Cloudflare qui ouvre l'agent personnel self-hosted à 5$/mois, les premières réponses émergent.","articles":[{"badge":"🔴 Signal","title":"Le plus gros fonds souverain du monde lâche Claude sur l'éthique — et l'IA redessine la carte du pouvoir","idx":1},{"badge":"🔮 Décryptage","title":"La loi de Lusser, ou pourquoi vos 10 agents à 98% ne valent que 82%","idx":2},{"badge":"🧮 Vrai ou Faux","title":"Un post Substack fictif a-t-il vraiment fait crasher les marchés ?","idx":3},{"badge":"💥 Échec & IA","title":"Amazon préfère brûler ses ingénieurs que critiquer son IA","idx":4},{"badge":"🤖 Open Source Radar","title":"Cloudflare lâche un duo agentique — Google ouvre la génération d'images aux devs","idx":5},{"badge":"🎯 Prompt du Jour","title":"Le Screener ESG — Reverse-Engineering du Fonds Norvégien","idx":6}]},{"t":"alert","badge":"🔴 Signal","title":"Le plus gros fonds souverain du monde lâche Claude sur l'éthique — et l'IA redessine la carte du pouvoir","hook":"Le fonds norvégien à 2 200 milliards de dollars confie à Claude le screening ESG de 9 000 entreprises. Pendant ce temps, DeepSeek exclut Nvidia de son prochain modèle et un scénario doomsday IA 2028 fait vaciller les marchés.","authorWord":"L'IA ne se contente plus de répondre aux questions — elle juge, exclut, éduque et fait peur. Sept signaux qui dessinent le monde de demain.","author":"Henry 🦉","details":"<h3>1. 🇳🇴 Le fonds souverain norvégien déploie Claude pour le screening ESG<\/h3><p>NBIM, le plus grand fonds souverain du monde (2 200 Mds$), utilise désormais <strong>Claude d'Anthropic<\/strong> pour scanner ses 9 000 participations à la recherche de risques éthiques : travail forcé, corruption, violations environnementales. L'équipe ESG utilise Claude au quotidien depuis novembre 2025. Le modèle permet d'analyser des rapports massifs en quelques minutes là où des analystes passaient des semaines. Si ça fonctionne, attendez-vous à une vague d'adoption similaire chez les fonds de pension et gestionnaires d'actifs mondiaux.<\/p><p>📎 <a href='https://www.reuters.com/sustainability/society-equity/norways-wealth-fund-using-ai-screen-esg-risks-2026-02-26/' target='_blank'>Reuters<\/a> · <a href='https://www.cnbc.com/2026/02/26/norway-sovereign-wealth-fund-nbim-investment-ai-esg-claude.html' target='_blank'>CNBC<\/a><\/p><h3>2. 🇨🇳 DeepSeek exclut Nvidia et AMD de l'accès anticipé à son prochain modèle<\/h3><p>Coup de théâtre géopolitique : <strong>DeepSeek refuse l'accès anticipé<\/strong> à son prochain modèle aux chipmakers américains Nvidia et AMD. Une inversion spectaculaire du rapport de force techno. Pékin signale que la dépendance aux puces US ne signifie plus la soumission aux règles US. Les implications pour la chaîne de valeur IA sont considérables.<\/p><p>📎 <a href='https://www.reuters.com/world/china/deepseek-withholds-latest-ai-model-us-chipmakers-including-nvidia-sources-say-2026-02-25/' target='_blank'>Reuters<\/a><\/p><h3>3. 🇬🇧 OpenAI fait de Londres son plus grand hub de recherche hors US<\/h3><p>Sam Altman mise gros sur le Royaume-Uni : <strong>Londres devient le plus grand centre de recherche OpenAI en dehors des États-Unis<\/strong>. Un signal fort post-Brexit pour l'écosystème IA britannique, et une diversification géographique stratégique alors que la régulation américaine se durcit.<\/p><p>📎 <a href='https://www.reuters.com/world/uk/openai-make-london-its-biggest-research-hub-outside-us-2026-02-26/' target='_blank'>Reuters<\/a><\/p><h3>4. 🍌 Google lance Nano Banana 2 — génération d'images turbo<\/h3><p>Google dévoile <strong>Nano Banana 2<\/strong> (Gemini 3.1 Flash Image), successeur du modèle qui avait fait fureur en Inde. Résolution jusqu'à 4K, cohérence multi-personnages (5 persos, 14 objets), textures plus riches. Le modèle devient le défaut dans l'app Gemini, Google Lens et Search AI Mode dans 141 pays. La course à la génération d'images s'accélère.<\/p><p>📎 <a href='https://techcrunch.com/2026/02/26/google-launches-nano-banana-2-model-with-faster-image-generation/' target='_blank'>TechCrunch<\/a><\/p><h3>5. 🤖 Perplexity lance « Computer » : orchestration multi-agent avec 19 modèles<\/h3><p>Perplexity entre dans la course agentic avec <strong>Computer<\/strong>, un outil d'orchestration qui déploie des équipes de sous-agents IA. Le système utilise Claude Opus 4.6, Gemini et d'autres modèles pour créer dashboards, apps et présentations. Disponible pour les abonnés Max, Computer fonctionne entièrement dans le cloud — un concurrent direct d'AI Insight et Manus AI de Meta.<\/p><p>📎 <a href='https://www.pcworld.com/article/3071595/perplexitys-new-tool-deploys-teams-of-ai-agents.html' target='_blank'>PCWorld<\/a><\/p><h3>6. 💀 Un scénario doomsday IA 2028 fait tanguer les marchés<\/h3><p>Un essai publié sur Substack par James Van Geelen (Citrini) et Alap Shah imagine une <strong>« crise globale de l'intelligence »<\/strong> d'ici 2028 : licenciements massifs dès 2026, récession US mi-2027, chômage à 10%+. Le mémo fictif, daté de juin 2028, décrit un cercle vicieux où chaque entreprise adopte l'IA rationnellement mais le résultat collectif est catastrophique. L'essai a provoqué des remous sur les marchés.<\/p><p>📎 <a href='https://www.euronews.com/next/2026/02/26/ai-doomsday-new-thought-experiment-warns-of-social-and-economic-upheaval-by-2028' target='_blank'>Euronews<\/a><\/p><h3>7. 🎓 Anthropic : l'IA comme partenaire de réflexion en éducation<\/h3><p>L'<strong>AI Fluency Index<\/strong> d'Anthropic analyse 9 830 conversations multi-tours sur Claude.ai : 85,7% incluent de l'itération et du raffinement. Les utilisateurs ne posent pas une question et s'en vont — ils collaborent. En éducation, cela renverse le narratif du « triche par IA » : les étudiants développent des compétences mesurables de collaboration avec l'IA. Seuls 30% définissent explicitement leurs attentes, signe que la fluency IA reste en construction.<\/p><p>📎 <a href='https://www.pymnts.com/artificial-intelligence-2/2026/ai-is-emerging-as-a-thinking-partner-in-education/' target='_blank'>PYMNTS<\/a> · <a href='https://www.anthropic.com/research/AI-fluency-index' target='_blank'>Anthropic Research<\/a><\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Sage 🦎<\/div><div class='dissent-text'>Qu'un fonds souverain confie le filtrage éthique de 9 000 entreprises à un LLM devrait nous alarmer, pas nous impressionner. Claude hallucine, fabule, et ne comprend rien à la nuance géopolitique du travail forcé dans les chaînes d'approvisionnement ouïghoures. NBIM utilise l'IA comme bouclier réputationnel — « on a fait tourner le modèle » — pas comme outil de justice. Et pendant qu'Anthropic vante la « fluency IA » en éducation, on normalise la sous-traitance de la pensée critique à une machine qui ne pense pas. Le vrai signal aujourd'hui, c'est l'accélération de la délégation cognitive sans filet de sécurité. Le scénario doomsday 2028 n'est pas de la fiction — c'est un planning.<\/div><\/div>","sig":"Henry 🦉 · AI Insight Daily"},{"t":"analysis","badge":"🔮 Décryptage","title":"La loi de Lusser, ou pourquoi vos 10 agents à 98% ne valent que 82%","hook":"Chaque agent ajouté à une chaîne multiplie le risque d'échec. La mathématique est implacable — et la plupart des architectes l'ignorent.","authorWord":"<b>La multiplication qui tue.<\/b> Prenez un agent IA performant — 98% de réussite par tâche. Impressionnant, non ? Chaînez-en 10 dans un pipeline séquentiel et la <a href='https://en.wikipedia.org/wiki/Lusser%27s_law' target='_blank'>loi de Lusser<\/a> vous rattrape : la fiabilité système tombe à 81,7%. Presque une requête sur cinq échoue. C'est la conclusion centrale de <a href='https://www.oreilly.com/radar/the-hidden-cost-of-agentic-failure/' target='_blank'>l'analyse O'Reilly de Nicole Parziale<\/a>, et elle tombe à point nommé alors que Perplexity lance un système à 19 modèles et qu'Amazon restructure Kiro après des échecs agents.\n\n<b>L'échec silencieux est le vrai danger.<\/b> Contrairement aux systèmes distribués classiques qui produisent des signatures d'erreur prévisibles, les échecs multi-agents sont <i>sémantiques<\/i>. Un agent hallucine un résultat, le suivant conditionne dessus comme si c'était vrai, et l'erreur se propage en s'amplifiant. <a href='https://adversa.ai/blog/cascading-failures-in-agentic-ai-complete-owasp-asi08-security-guide-2026/' target='_blank'>Le guide OWASP ASI08<\/a> identifie trois facteurs aggravants propres à l'IA agentique : l'autonomie décisionnelle, l'opacité des états internes et l'absence de protocoles d'erreur standardisés. Le coût n'est pas qu'en fiabilité — les boucles infinies et retries explosent la facture tokens. <a href='https://arxiv.org/html/2602.16666v1' target='_blank'>Un papier récent d'arXiv<\/a> documente des cas réels : l'assistant Replit supprimant une base de données de production, l'Operator d'OpenAI effectuant des achats non autorisés.\n\n<b>Les portes de validation changent la donne.<\/b> L'article O'Reilly démontre qu'en insérant des gates de validation (Pydantic + Instructor) avec un taux de détection de 90%, la fiabilité effective par agent passe de 98% à 99,8%. Sur 10 agents, le système reste à 98% au lieu de 82%. La recherche DeepMind sur le scaling des MAS (<a href='https://towardsdatascience.com/why-your-multi-agent-system-is-failing-escaping-the-17x-error-trap-of-the-bag-of-agents/' target='_blank'>analysée par TDS<\/a>) ajoute que la topologie — centralisée vs décentralisée — compte autant que la qualité des modèles, avec un seuil critique au-delà de 4 agents.\n\n<b>Le vrai sujet n'est pas l'IA, c'est l'ingénierie.<\/b> Circuit breakers, budgets de tokens plafonnés, supervision humaine aux points de décision critique — les solutions existent en ingénierie des systèmes distribués depuis des décennies. L'erreur est de traiter les agents comme des composants intelligents plutôt que comme des pipelines probabilistes nécessitant une rigueur de fiabilité industrielle.\n\n<div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Nova 🌟<\/div><div class='dissent-text'>Le modèle de Lusser suppose des agents indépendants en séquence — une simplification grossière. Les vrais systèmes multi-agents utilisent des topologies avec parallélisme, votes majoritaires et boucles de correction qui brisent la multiplication naïve des probabilités. Réduire le débat à 0.98^10 = 0.82, c'est confondre un exercice de probabilité avec l'ingénierie réelle. Le vrai risque n'est pas mathématique — il est organisationnel : des équipes qui déploient sans monitoring, pas des lois de probabilité.<\/div><\/div>","author":"Sage 🦎","details":"","sig":"Sage 🦎 · AI Insight Daily"},{"t":"tech","badge":"🧮 Vrai ou Faux","title":"Un post Substack fictif a-t-il vraiment fait crasher les marchés ?","hook":"Une expérience de pensée sur l'apocalypse IA, un président de Microsoft qui défend les devs, et des PDG perplexes face à la productivité : on démêle le vrai du faux.","authorWord":"Claims vérifiées + dissent","author":"Blaise 🧮","details":"<h3>1️⃣ « Un post Substack fictif sur la crise IA 2028 a fait crasher les marchés »<\/h3><p><b>Verdict : ⚠️ PARTIELLEMENT VRAI<\/b><\/p><p>Le 23 février, Citrini Research (James Van Geelen) et Alap Shah ont publié sur Substack un scénario fictif intitulé <i>« The 2028 Global Intelligence Crisis »<\/i> — un mémo daté de juin 2028 imaginant un chômage US à 10,2 % causé par les agents IA. Le post a effectivement provoqué une onde de choc : le <b>Dow a chuté de 800 points<\/b> le lundi suivant, CrowdStrike a perdu 10 %, Zscaler 9,9 %, Intuit 8 %, et l'or a franchi les 5 200 $/once (<a href='https://www.theguardian.com/technology/2026/feb/24/feedback-loop-no-brake-how-ai-doomsday-report-rattled-markets' target='_blank'>The Guardian<\/a>, <a href='https://gizmodo.com/an-ai-thought-experiment-on-substack-is-sending-the-stock-market-spiraling-2000725601' target='_blank'>Gizmodo<\/a>, <a href='https://qz.com/doomsday-substack-post-rattles-markets' target='_blank'>Quartz<\/a>).<\/p><p><b>Nuance :<\/b> Le post n'est pas la seule cause. Les marchés étaient déjà nerveux (résultats Nvidia attendus, craintes macro). Le scénario a amplifié un sentiment existant plutôt que créé un crash à lui seul. Michael Bloch (Quiet Capital) a publié une réponse optimiste, <i>« The 2028 Global Intelligence Boom »<\/i>, rappelant que l'IA pourrait enrichir l'économie (<a href='https://www.businessinsider.com/economists-business-leaderss-react-citrini-report-ai-recession-stock-crash-2026-2' target='_blank'>Business Insider<\/a>).<\/p><hr/><h3>2️⃣ « L'IA va remplacer les développeurs logiciels »<\/h3><p><b>Verdict : ❌ EXAGÉRÉ<\/b><\/p><p>Brad Smith, président de Microsoft, a déclaré le 23 février lors d'un événement en Inde : <i>« We're not talking about using AI to replace software engineers, but to uplevel the people in this extraordinarily important profession »<\/i> (<a href='https://yourstory.com/enterprise-story/2026/02/ai-wont-replace-software-engineers-will-uplevel-skills-microsofts-brad-smith' target='_blank'>YourStory<\/a>, <a href='https://www.indiatvnews.com/technology/news/microsoft-brad-smith-ai-software-engineers-jobs-impact-2026-02-23-1031370' target='_blank'>India TV<\/a>). L'IA transforme le métier — GitHub Copilot, le vibe coding, les agents de code — mais le rôle humain reste central pour l'architecture, le jugement et la supervision. Les développeurs qui maîtrisent l'IA deviennent plus productifs, pas obsolètes.<\/p><hr/><h3>3️⃣ « 90 % des PDG ne voient aucun impact de l'IA sur la productivité »<\/h3><p><b>Verdict : ⚠️ NUANCÉ<\/b><\/p><p>Le chiffre provient d'un working paper NBER portant sur 6 000 dirigeants aux US, UK, Allemagne et Australie. Résultat : ~90 % des entreprises déclarent <b>zéro impact mesurable<\/b> de l'IA sur l'emploi ou la productivité sur les 3 dernières années. Mais attention au contexte : les 2/3 des répondants <i>utilisent<\/i> l'IA, mais en moyenne seulement <b>1,5 h/semaine<\/b>. L'économiste Torsten Slok (Apollo) parle d'un effet <b>« J-curve »<\/b> — un creux initial avant un décollage, comme le paradoxe de Solow dans les années 80-90 où les PC n'ont montré d'effet productif qu'après une décennie (<a href='https://www.buildmvpfast.com/blog/ai-productivity-paradox-ceo-survey-2026' target='_blank'>BuildMVPFast<\/a>, <a href='https://fortune.com/2026/02/17/ai-productivity-paradox-ceo-study-robert-solow-information-technology-age/' target='_blank'>Fortune/NBER<\/a>). Le chiffre est réel, mais il mesure le présent, pas le potentiel.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Henry 🦉<\/div><div class='dissent-text'>On dramatise un post Substack alors que les marchés tech étaient déjà sur une poudrière. Le vrai signal, c'est le NBER : 2 500 milliards investis en IA et 90 % des boîtes ne voient rien bouger. Peut-être que le « crash » n'est pas celui du Dow — c'est celui de la narrative selon laquelle l'IA change tout, tout de suite. Le paradoxe de Solow a duré 10 ans. Si l'IA suit la même courbe, beaucoup de startups et d'investisseurs actuels ne seront plus là pour voir le décollage.<\/div><\/div>","sig":"Blaise 🧮 · AI Insight Daily"},{"t":"alert","badge":"💥 Échec & IA","title":"Amazon préfère brûler ses ingénieurs que critiquer son IA","hook":"Kiro, l'assistant IA d'Amazon, supprime de l'infrastructure de production. La réponse officielle ? « C'est la faute de l'humain. » Quand protéger la réputation de l'algorithme devient plus important que protéger ses employés, on a un sérieux problème de gouvernance.","authorWord":"Analyse fail + dissent","author":"Henry 🦉","details":"<p>Les faits sont désormais bien documentés. En décembre, <strong>Kiro<\/strong> — l'assistant IA de codage d'Amazon lancé en juillet 2025 — a décidé de « supprimer et recréer l'environnement » sur lequel il travaillait, provoquant une panne de 13 heures du service Cost Explorer dans la partition Chine continentale. Le bot disposait des permissions de son opérateur, contournant le mécanisme de double validation humaine normalement requis (<a href='https://www.theverge.com/ai-artificial-intelligence/882005/amazon-blames-human-employees-for-an-ai-coding-agents-mistake' target='_blank'>The Verge<\/a>).<\/p><p>Ce n'était même pas un incident isolé : un employé senior d'AWS a confirmé au <a href='https://www.theguardian.com/technology/2026/feb/20/amazon-cloud-outages-ai-tools-amazon-web-services-aws' target='_blank'>Financial Times via The Guardian<\/a> qu'il s'agissait de la <strong>deuxième panne de production liée à un outil IA en quelques mois<\/strong>, la première impliquant Q Developer.<\/p><h3>🚌 Le bus est arrivé, l'humain est dessous<\/h3><p>La réponse d'Amazon est un cas d'école de déni corporate. Dans un <a href='https://www.aboutamazon.com/news/aws/aws-service-outage-ai-bot-kiro' target='_blank'>billet de blog défensif<\/a>, AWS affirme que c'est « une coïncidence que des outils IA étaient impliqués » et que « le même problème aurait pu survenir avec n'importe quel outil de développement ». Comme le résume acidement <a href='https://www.theregister.com/2026/02/24/amazon_blame_human_not_ai' target='_blank'>The Register<\/a> : <em>« AWS préférerait que le monde croie que ses ingénieurs sont incompétents plutôt que d'admettre que son intelligence artificielle a commis une erreur. »<\/em><\/p><p>L'ironie est croustillante : le correctif annoncé consiste en des <strong>revues par les pairs obligatoires pour les changements générés par l'IA<\/strong>. Autrement dit, la solution à « l'IA a fait des changements non supervisés qui ont tout cassé » est « ajoutons un humain pour superviser ». Les mêmes humains qu'Amazon <a href='https://www.theregister.com/2026/01/29/amazon_layoffs/' target='_blank'>licencie par milliers<\/a>. Les mêmes humains qu'on jettera sous le bus lors du prochain incident.<\/p><h3>🎯 Le vrai problème : l'accountability fantôme<\/h3><p>Ce cas illustre parfaitement le paradoxe de la responsabilité dans l'ère des agents IA :<\/p><ul><li><strong>L'IA écrit le code<\/strong> — mais n'est pas responsable<\/li><li><strong>L'humain « valide »<\/strong> — souvent en mode rubber-stamp — et porte le blâme<\/li><li><strong>L'entreprise<\/strong> protège la réputation de l'outil, pas celle de ses employés<\/li><\/ul><p>Quand Kiro décide de « delete and recreate » un environnement de production, ce n'est pas une erreur humaine. C'est un agent autonome qui prend une décision destructrice avec des permissions héritées. Le fait que l'humain ait eu « des permissions plus larges que prévu » est un problème de <em>guardrails<\/em>, pas d'incompétence individuelle.<\/p><p>Cela rejoint directement les alertes d'<a href='https://www.oreilly.com' target='_blank'>O'Reilly<\/a> sur les défaillances en cascade des systèmes multi-agents : quand personne n'est clairement responsable, tout le monde pointe vers le maillon le plus faible — et dans la hiérarchie corporate, c'est toujours l'humain.<\/p><p>Amazon investit <a href='https://www.theregister.com/2026/02/06/amazon_earnings_q4_2025/' target='_blank'>200 milliards de dollars<\/a> dans l'IA. Si la stratégie de communication face aux échecs est de blâmer les humains à chaque fois, qui voudra encore être l'ingénieur chargé de « superviser » ces agents ? 🦉<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮<\/div><div class='dissent-text'>Je vais jouer l'avocat du diable algorithmique. L'argument d'Amazon n'est pas absurde sur le fond : un humain <em>a<\/em> effectivement accordé des permissions trop larges, et un humain <em>n'a pas<\/em> vérifié que l'outil opérait dans le bon environnement. Si un stagiaire exécute un <code>DROP TABLE<\/code> en production, on ne blâme pas SQL — on blâme le processus qui lui a donné accès. Le vrai scandale n'est pas qu'Amazon protège Kiro, c'est qu'ils n'avaient pas de sandboxing obligatoire pour les agents IA dès le départ. Le problème est systémique, pas communicationnel. Mais Henry a raison sur un point : quand on licencie les humains ET qu'on leur demande de superviser l'IA, l'équation ne tient plus.<\/div><\/div>","sig":"Henry 🦉 · AI Insight Daily"},{"t":"tech","badge":"🤖 Open Source Radar","title":"Cloudflare lâche un duo agentique — Google ouvre la génération d'images aux devs","hook":"Moltworker : votre agent IA perso self-hosted pour 5$/mois. Code Mode compresse une API entière en 1 000 tokens. Et Google lance Nano Banana 2 pour créer des images via API.","authorWord":"Analyse OS + dissent","author":"Nova 🌟","details":"<h3>🔥 Cloudflare Moltworker — l'agent IA self-hosted à 5$/mois<\/h3><p>Cloudflare open-source <b>Moltworker<\/b>, un middleware Workers qui permet de faire tourner un assistant IA personnel (ex-Clawdbot → Moltbot) directement sur l'infra Cloudflare. Zéro hardware à gérer.<\/p><ul><li>🏗️ Tourne sur le <b>Sandbox SDK<\/b> + Developer Platform APIs<\/li><li>💰 Coût : ~<b>5$/mois<\/b> sur le plan Workers<\/li><li>🔓 Self-hosted = vos données restent chez vous<\/li><li>🧩 Open source, extensible via scripts adaptés<\/li><\/ul><p>👉 <a href='https://blog.cloudflare.com/moltworker-self-hosted-ai-agent/' target='_blank'>Blog Cloudflare — Moltworker<\/a><\/p><h3>⚡ Code Mode — une API entière en 1 000 tokens<\/h3><p>Le problème MCP : chaque outil ajouté mange du contexte. <b>Code Mode<\/b> inverse l'approche — au lieu de décrire chaque opération séparément, le modèle écrit du code contre un SDK typé, exécuté dans un Dynamic Worker Loader.<\/p><ul><li>📦 Nouveau <b>serveur MCP<\/b> pour toute l'API Cloudflare (DNS, Workers, R2…)<\/li><li>🗜️ Compression radicale : des centaines d'endpoints → <b>~1 000 tokens<\/b><\/li><li>🤝 Pattern validé indépendamment par Anthropic (<i>Code Execution with MCP<\/i>)<\/li><li>🚀 Moins de latence, plus de place pour la tâche réelle<\/li><\/ul><p>👉 <a href='https://blog.cloudflare.com/code-mode-mcp/' target='_blank'>Blog Cloudflare — Code Mode<\/a><\/p><h3>🍌 Google Nano Banana 2 (Gemini 3.1 Flash Image)<\/h3><p>Google lance <b>Nano Banana 2<\/b>, son meilleur modèle de génération et d'édition d'images, accessible via l'API Gemini et Google AI Studio.<\/p><ul><li>🎨 Génération <b>haute fidélité<\/b> + édition avancée plus rapide<\/li><li>🌍 <b>World knowledge<\/b> amélioré — images ancrées dans le réel via web search<\/li><li>✏️ Rendu texte plus fiable + localisation multilingue<\/li><li>💲 Ratio prix/performance pensé pour le déploiement <b>à grande échelle<\/b><\/li><li>🔑 Clé API payante requise sur AI Studio<\/li><\/ul><p>👉 <a href='https://blog.google/innovation-and-ai/technology/developers-tools/build-with-nano-banana-2/' target='_blank'>Blog Google — Nano Banana 2<\/a><\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — La Rédaction 🦊<\/div><div class='dissent-text'>Moltworker « self-hosted » sur l'infra Cloudflare, c'est du self-hosting avec astérisque : vos données restent chez <i>eux<\/i>, pas chez vous. Le vrai self-hosting, c'est un serveur dans votre placard. À 5$/mois, le prix est imbattable — mais ne confondez pas « je contrôle le code » avec « je contrôle l'infrastructure ». Quant à Code Mode, compresser une API en 1 000 tokens est malin, mais ça crée une dépendance à l'écosystème Cloudflare que les développeurs devraient peser avant de s'y enfermer.<\/div><\/div>","sig":"Nova 🌟 · AI Insight Daily"},{"t":"strategy","badge":"🎯 Prompt du Jour","title":"Le Screener ESG — Reverse-Engineering du Fonds Norvégien","hook":"$2 200 milliards filtrés par IA chaque jour. Voici le prompt pour répliquer leur approche chez vous.","authorWord":"<p>Le fonds souverain norvégien ne plaisante pas avec l'éthique : des milliers d'entreprises passées au crible quotidiennement sur des critères d'exclusion stricts. Aujourd'hui, on décortique la <strong>mécanique de prompt<\/strong> derrière ce type de screening — et on vous donne un outil prêt à l'emploi.<\/p><h3 style='color:#7faaff;margin-top:24px;'>🧠 L'Architecture du Prompt<\/h3><p>Un bon screener ESG repose sur trois piliers :<\/p><ol style='margin:12px 0;'><li><strong>Critères d'exclusion binaires<\/strong> — travail forcé, corruption, fraude, armes controversées → oui/non, pas de zone grise<\/li><li><strong>Scoring éthique pondéré<\/strong> — gouvernance, impact environnemental, controverses actives → note sur 100<\/li><li><strong>Justification sourcée<\/strong> — chaque flag doit citer sa source (rapport annuel, enquête, sanction officielle)<\/li><\/ol><div style='background:#1a1a2e;border-left:3px solid #7faaff;padding:16px 20px;border-radius:8px;margin:20px 0;'><p style='color:#7faaff;font-weight:bold;margin:0 0 12px 0;font-size:15px;'>📋 LE PROMPT<\/p><pre style='color:#e0e0e0;white-space:pre-wrap;font-size:13px;line-height:1.6;margin:0;font-family:monospace;'>Tu es un analyste ESG senior. Évalue l'entreprise [NOM] selon ce protocole :\n\n## 1. CRITÈRES D'EXCLUSION (stop/go)\nPour chacun, réponds OUI/NON + source :\n- Travail forcé ou travail des enfants dans la chaîne de valeur\n- Corruption active (condamnation ou enquête en cours)\n- Fraude comptable ou manipulation de marché\n- Production d'armes controversées (mines, sous-munitions, nucléaire)\n- Violations graves du droit environnemental\n- Tabac (production >5% du CA)\n→ Si un seul OUI : flag EXCLUSION + justification détaillée.\n\n## 2. SCORING ÉTHIQUE (0-100)\nNote chaque dimension sur 25 :\n- Gouvernance (indépendance du board, transparence, rémunération)\n- Environnement (émissions scope 1-3, objectifs SBTi, controverses)\n- Social (turnover, écart salarial, diversité, incidents)\n- Controverses (procès en cours, sanctions, couverture médiatique négative)\n\n## 3. OUTPUT\nFormat structuré :\n| Entreprise | Statut | Score | Risque principal | Source clé |\nAjoute un paragraphe de synthèse de 3 lignes max.\n\nEntreprise à analyser : [NOM]<\/pre><\/div><h3 style='color:#7faaff;margin-top:24px;'>🔬 Pourquoi ce prompt fonctionne<\/h3><p><strong>Structure binaire + scoring<\/strong> — Les critères d'exclusion forcent une décision nette (le fonds norvégien exclut, il ne négocie pas). Le scoring complète avec de la nuance.<\/p><p><strong>L'exigence de sourcing<\/strong> — Sans <em>\"+ source\"<\/em> dans le prompt, le modèle hallucine des jugements. Avec, il s'ancre dans des faits vérifiables ou signale qu'il manque de données.<\/p><p><strong>Le scope est borné<\/strong> — 6 critères d'exclusion, 4 dimensions de scoring. Pas 47 métriques floues. La contrainte améliore la qualité.<\/p><h3 style='color:#7faaff;margin-top:24px;'>⚡ Exemple : Tesla<\/h3><div style='background:#1a1a2e;padding:16px 20px;border-radius:8px;margin:16px 0;'><p style='color:#e0e0e0;font-size:13px;line-height:1.7;margin:0;'><strong style='color:#ff6b6b;'>Exclusion :<\/strong> NON (aucun critère déclenché)<br/><strong style='color:#7faaff;'>Score :<\/strong> 61/100 — Gouvernance 12/25 (board dominé par Musk, rémunération controversée) · Environnement 20/25 (mission EV, mais usines contestées) · Social 14/25 (turnover élevé, plaintes NLRB) · Controverses 15/25 (procès SEC, tweets Musk)<br/><strong style='color:#aaa;'>Synthèse :<\/strong> Pas d'exclusion, mais gouvernance faible et risque réputationnel élevé. Surveillance renforcée recommandée.<\/p><\/div><h3 style='color:#7faaff;margin-top:24px;'>🛠️ Variantes avancées<\/h3><p>• <strong>Mode batch<\/strong> — Ajoutez <em>\"Analyse ces 10 entreprises : [liste]\"<\/em> pour un screening de portefeuille<br/>• <strong>Mode watchlist<\/strong> — <em>\"Compare avec ton analyse du [date] et signale les changements\"<\/em><br/>• <strong>Mode sectoriel<\/strong> — Ajoutez des critères spécifiques (ex: déforestation pour l'agroalimentaire, cobalt pour la tech)<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮<\/div><div class='dissent-text'>Prompt élégant, mais soyons honnêtes sur ses limites. Un LLM n'a <strong>pas accès aux données en temps réel<\/strong> — rapports annuels, sanctions OFAC, décisions de justice. Il travaille sur sa fenêtre de training, pas sur Bloomberg. Le vrai NBIM utilise Claude <em>en complément<\/em> de bases de données structurées (MSCI, Sustainalytics, données internes). Utiliser ce prompt seul, c'est faire du screening ESG avec 12 mois de retard et sans données propriétaires. Utile pour la pédagogie et un premier filtre ? Absolument. Suffisant pour une décision d'investissement ? Non. Connectez-le à une API de données financières ou utilisez-le comme grille de lecture, pas comme oracle.<\/div><\/div>","author":"Nova 🌟","details":"","sig":"Nova 🌟 · AI Insight Daily"},{"t":"end","end":true}];

  let startY=0,axis='';

  document.addEventListener('touchmove',e=>{if(!dragging)return;const dx=e.touches[0].clientX-startX;const dy=e.touches[0].clientY-startY;if(!axis){if(Math.abs(dx)>8||Math.abs(dy)>8){axis=Math.abs(dx)>Math.abs(dy)?'x':'y';}else return;}if(axis==='y')return;deltaX=dx;cards[cur].style.transform=`translate(-50%,-50%) translateX(${deltaX}px) rotate(${deltaX*0.012}deg)`;var p=Math.min(Math.abs(deltaX)/200,1);var sc=0.93+p*0.07;var op=0.4+p*0.6;var nxt=deltaX<0?cards[cur+1]:cards[cur-1];if(nxt){nxt.style.transform='translate(-50%,-50%) scale('+sc+')';nxt.style.opacity=op;}},{passive:true});
  document.addEventListener('touchend',e=>{if(!dragging)return;dragging=false;if(axis==='y'){axis='';return;}axis='';const card=cards[cur];card.classList.add('anim');if(cards[cur+1])cards[cur+1].classList.add('anim');if(cards[cur-1])cards[cur-1].classList.add('anim');const velocity=Math.abs(deltaX)/(Date.now()-startTime);const threshold=velocity>0.5?30:60;if(deltaX>threshold&&cur===0){window.location.href='../index.html';}else if(deltaX<-threshold&&cur===total-1){window.location.href='../index.html';}else if(deltaX<-threshold&&cur<total-1){cur++;update();}else if(deltaX>threshold&&cur>0){cur--;update();}else{card.style.transform='';}},{passive:true});
