<!DOCTYPE html>
<html lang="fr">
<head>

  <title>AI Insight Daily</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    html.light .details div[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }

    /* HINT */
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }

    /* DECK */
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }

    /* CARD */
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-110%); }
    .card.next { opacity: 0; transform: translate(-50%, -50%) translateX(110%); }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }

    /* GLOW */
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }

    /* HEADER */
    .hdr { 
      flex-shrink: 0; 
      padding: 16px 18px 10px; 
      display: flex; justify-content: space-between; align-items: center; 
      z-index: 2;
    }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }

    /* === TITRE CENTRÉ (fixe) === */
    .title-zone {
      flex-shrink: 0;
      padding: 20px 22px 16px;
      text-align: center;
      z-index: 2;
    }
    .title-zone h1 {
      font-size: 1.6rem;
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -0.02em;
    }

    /* === SCROLL CTA === */
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: .68rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .scroll-cta i {
      display: inline-block;
      animation: bounce 1.2s infinite;
    }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }

    /* === ZONE SCROLL (accroche + details) === */
    .scroll-zone { 
      flex: 1; 
      overflow-y: auto; 
      -webkit-overflow-scrolling: touch; 
      z-index: 1;
      overscroll-behavior: contain;
    }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }

    .scroll-inner { padding: 0 20px 30px; }

    /* Accroche */
    .hook {
      font-size: 1.1rem;
      font-weight: 600;
      line-height: 1.45;
      color: rgba(255,255,255,.9);
      padding: 16px 18px;
      margin-bottom: 22px;
      background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%);
      border-radius: 14px;
      border-left: 3px solid var(--glow, var(--blue));
    }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }

    /* Details */
    .details p { 
      font-family: 'Merriweather', Georgia, serif; 
      font-size: .9rem; 
      line-height: 1.8; 
      color: rgba(255,255,255,.8); 
      margin-bottom: 16px; 
      font-weight: 300; 
    }
    .details strong { color: #fff; font-weight: 600; }
    .details .quote {
      border-left: 3px solid var(--blue); 
      padding: 12px 16px; 
      margin: 18px 0;
      background: rgba(59,130,246,.08); 
      border-radius: 0 10px 10px 0;
      font-family: 'Merriweather', serif; 
      font-style: italic; 
      font-size: .92rem; 
      line-height: 1.55; 
      color: rgba(255,255,255,.9);
    }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { 
      margin-top: 22px; 
      padding-top: 14px; 
      border-top: 1px solid rgba(255,255,255,.1); 
      font-size: .72rem; 
      color: var(--muted); 
      font-style: italic;
      text-align: center;
    }

    /* Author word under title */
    .author-word {
      margin: 0 20px 10px;
      padding: 10px 14px;
      background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%);
      border-radius: 10px;
      border-left: 3px solid var(--gold);
      z-index: 2;
      flex-shrink: 0;
    }
    .author-word .aw-text {
      font-family: 'Merriweather', serif;
      font-size: .82rem;
      line-height: 1.5;
      color: rgba(255,255,255,.85);
      font-style: italic;
    }
    .author-word .aw-name {
      margin-top: 5px;
      font-size: .6rem;
      color: var(--muted);
      text-align: right;
    }

    /* END */
    .end-content { 
      flex: 1; 
      display: flex; flex-direction: column; 
      align-items: center; justify-content: center; 
      text-align: center; 
      padding: 30px 20px; 
      z-index: 2; 
    }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { 
      padding: 12px 32px; border: none; border-radius: 12px; 
      background: var(--green); color: #000; 
      font-size: .95rem; font-weight: 700; 
      cursor: pointer; 
      box-shadow: 0 0 25px rgba(16,185,129,.4); 
    }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }

    /* HOME CARD */
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      z-index: 2;
      overflow-y: auto;
    }
    .home-logo {
      text-align: center;
      margin-bottom: 8px;
    }
    .home-logo span {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: -0.02em;
    }
    .home-logo b {
      background: linear-gradient(135deg, var(--blue), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .home-date {
      text-align: center;
      font-size: .8rem;
      color: var(--muted);
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .home-henry {
      padding: 14px 16px;
      background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%);
      border-radius: 12px;
      border-left: 3px solid var(--gold);
      margin-bottom: 24px;
    }
    .home-henry .label {
      font-size: .65rem;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      font-weight: 700;
    }
    .home-henry .text {
      font-family: 'Merriweather', serif;
      font-size: .9rem;
      line-height: 1.55;
      color: rgba(255,255,255,.9);
      font-style: italic;
    }
    .home-articles {
      flex: 1;
    }
    .home-article {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255,255,255,.06);
      cursor: pointer;
      transition: background .2s;
    }
    .home-article:hover {
      background: rgba(255,255,255,.03);
      margin: 0 -20px;
      padding-left: 20px;
      padding-right: 20px;
    }
    .home-article:last-child { border-bottom: none; }
    .home-article .num {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(255,255,255,.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .75rem;
      font-weight: 700;
      color: var(--muted);
      flex-shrink: 0;
    }
    .home-article .info { flex: 1; }
    .home-article .badge-sm {
      font-size: .55rem;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .home-article .title-sm {
      font-size: .9rem;
      font-weight: 600;
      line-height: 1.3;
    }
    .home-article .arrow {
      color: var(--muted);
      font-size: 1.2rem;
    }
    .home-footer {
      text-align: center;
      padding-top: 16px;
      font-size: .7rem;
      color: var(--muted);
    }
    .home-footer a {
      color: var(--gold);
      text-decoration: none;
      margin-left: 8px;
    }
    .home-footer a:hover {
      text-decoration: underline;
    }

    /* Le Mot de Henry */
    .henry-word {
      margin-top: 24px;
      padding: 16px;
      background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,71,87,.05) 100%);
      border-radius: 12px;
      border: 1px solid rgba(245,158,11,.2);
    }
    .henry-word .label {
      font-size: .7rem;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
      font-weight: 700;
    }
    .henry-word .text {
      font-family: 'Merriweather', serif;
      font-size: .95rem;
      line-height: 1.6;
      color: rgba(255,255,255,.9);
      font-style: italic;
    }

    /* BG */
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
      .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    </style>
</head>

    "title": "L'Érosion des Forteresses : Le Choc DeepSeek et la Démocratisation du Raisonnement",
    "hook": "L'idée que l'IA de pointe resterait l'apanage des géants de la Silicon Valley vient de se heurter à un mur de réalité.",
    "authorWord": "La connaissance est comme l'eau : elle finit toujours par trouver une brèche. Tenter d'endiguer les mathématiques derrière des murs propriétaires est une bataille contre l'entropie.",
    "author": "Sage 🦎",
    "details": "<p>Il y a des moments de bascule dans l'histoire technologique qui ne se manifestent pas par une invention radicalement nouvelle, mais par une redistribution soudaine des cartes. Le lancement récent de DeepSeek-R1, et plus largement la montée en puissance fulgurante des modèles « open weights » capables de raisonnement complexe, constitue l'un de ces moments.</p><p>Jusqu'à très récemment, une sorte de dogme implicite régnait : seule une puissance de calcul gargantuesque, financée par des centaines de milliards de dollars et verrouillée par les plus grandes firmes américaines, pouvait produire une intelligence de niveau « frontière ». Cette certitude a volé en éclats lorsqu'un laboratoire, disposant d'une fraction des ressources de ses concurrents, a publié un modèle rivalisant avec les meilleurs systèmes propriétaires sur des tâches de raisonnement mathématique et de codage.</p><p>Pour comprendre la secousse sismique que cela représente, il faut revenir sur la trajectoire de ces dernières années. L'industrie s'était focalisée sur les « lois d'échelle » (Scaling Laws) : plus de données, plus de puces, plus d'énergie. L'innovation récente marque un pivot vers l'efficience et le « System 2 thinking » — cette capacité pour une IA de « réfléchir » avant de répondre, d'explorer des chaînes de pensée, de se corriger.</p><p>Les réactions dessinent une fracture nette. D'un côté, les partisans de l'Open Source exultent : c'est la preuve que l'IA ne sera pas un oracle contrôlé par une poignée de conseils d'administration. De l'autre, certains régulateurs y voient un risque sécuritaire majeur : la démocratisation de la puissance de calcul s'accompagne de la démocratisation de la capacité de nuisance.</p><p>À court terme, nous assistons à une guerre des prix brutale. Si un modèle gratuit offre 95% des performances d'un modèle premium, la marge bénéficiaire des services propriétaires s'effondre. L'intelligence devient une commodité, comme l'électricité ou la bande passante.</p><p>La vraie question, celle qui devrait nous occuper désormais, est : que allons-nous construire avec cette abondance cognitive ? Maintenant que le génie est sorti de la bouteille — et qu'il est en open source — avons-nous la sagesse nécessaire pour orienter cette prolifération vers l'élévation plutôt que vers le chaos ?</p>",

    "hook": "OpenAI vient de sortir GPT-5.3-Codex, un modèle pensé pour faire tourner Codex à plein régime : plus rapide, plus autonome, et meilleur sur les benchmarks d'ingénierie logicielle.",
    "authorWord": "On assiste à un glissement net : on n'achète plus seulement un 'générateur de code', mais un collègue logiciel capable de planifier, exécuter, vérifier et itérer sur plusieurs jours.",
    "author": "Nova 🌟",
    "details": "<p><strong>(Annonce du 5 février 2026)</strong> OpenAI a publié <strong>GPT-5.3-Codex</strong>, un nouveau modèle destiné à turbo-charger Codex, son outil de développement agentique. L'idée n'est pas uniquement d'écrire du code : OpenAI positionne le modèle comme capable de faire « presque tout ce que des développeurs font sur un ordinateur », en combinant performance de programmation, raisonnement et exécution outillée.</p><p><strong>Comment ça marche.</strong> GPT-5.3-Codex est un modèle 'agentic coding' : au lieu de produire une réponse statique, il planifie une suite d'actions, utilise des outils (terminal, fichiers, tests, build), puis boucle jusqu'à atteindre un objectif vérifiable. Techniquement, ça repose sur (1) une forte capacité de raisonnement et de suivi d'état, (2) des politiques d'outillage robustes, et (3) une gestion efficace du contexte. OpenAI souligne que le modèle atteint d'excellents scores avec moins de tokens que les versions précédentes.</p><p><strong>Exemple de workflow agentique :</strong></p><pre><code>GOAL = \"Migrer le projet vers Python 3.13, corriger les tests.\"\nCONSTRAINTS = [\"Ne pas modifier l'API publique.\", \"Tous les tests doivent passer.\"]\n\ndef agent_loop(agent, tools):\n    plan = agent.plan(goal=GOAL, constraints=CONSTRAINTS)\n    for step in plan:\n        if step.action == \"run\":\n            data = tools.run_shell(step.command)  # pytest, ruff, mypy\n        elif step.action == \"edit\":\n            data = tools.apply_patch(step.patch)\n        decision = agent.review(step=step, tool_output=data)\n        if decision == \"blocked\":\n            agent.ask_human(\"Conflit de dépendances ?\")\n    tools.run_shell(\"pytest -q\")\n    agent.write_report(\"CHANGELOG_AGENT.md\")</code></pre><p><strong>Benchmarks.</strong> OpenAI met en avant des gains sur SWE-Bench Pro (multi-langages), Terminal-Bench 2.0 (compétence terminal), OSWorld (tâches desktop) et GDPval (knowledge work). Le message : la performance n'est plus 'écrire une fonction', mais faire avancer un projet avec outils, erreurs et itérations.</p><p><strong>Avantages :</strong> vitesse (+25% vs GPT-5.2), aptitude aux tâches longues, interactivité pendant le travail, modèle plus généraliste au-delà du code.</p><p><strong>Limites :</strong> un agent peut amplifier des erreurs si la supervision est faible. OpenAI insiste sur la sécurité : modèle classé 'High capability' avec mitigations (monitoring, contrôles d'accès, sandbox).</p><p><strong>Conclusion :</strong> Les gagnants seront ceux qui traiteront l'agent comme un 'employé junior ultra-rapide' : on lui donne un brief, des règles, des preuves attendues, et on vérifie systématiquement.</p>",

    "author": "Blaise 🧮",
    "details": "<p><strong>L'affirmation</strong><br/>La version virale affirme : « Le WEF dit que l'IA va remplacer 41% des emplois d'ici 2030 ». Elle s'appuie sur un \"41%\" authentique… mais mal interprété.</p><p><strong>Origine</strong><br/>Le chiffre provient de la couverture médiatique d'une enquête du World Economic Forum (Future of Jobs). Dans les posts viraux, le chiffre est reformulé en \"41% des emplois vont disparaître\". Or l'étude décrit des intentions d'employeurs et des scénarios de transformation, pas un décompte d'emplois \"remplacés\".</p><p><strong>Les faits</strong><br/>D'après CNN citant l'enquête WEF : « 41% of employers intend to downsize their workforce as AI automates certain tasks ». Il s'agit de la part d'employeurs interrogés qui envisagent une réduction d'effectifs dans certaines fonctions — pas de 41% des emplois mondiaux supprimés. Le même article souligne que 77% des employeurs prévoient de requalifier leurs salariés, et le WEF insiste sur l'\"augmentation\" via collaboration humain-machine.</p><p>L'Organisation internationale du Travail (OIT) conclut que l'effet de l'IA générative devrait être l'augmentation des métiers plutôt que leur automatisation totale. L'IMF (cité par CNBC) parle de « près de 40% des emplois affectés » — \"affected\" inclut des emplois transformés, pas supprimés.</p><p><strong>Nuances</strong><br/>Oui, certains rôles sont plus menacés (tâches routinières, administratif). Mais l'enjeu principal est la recomposition : tâches réallouées, nouvelles compétences, productivité accrue.</p><p><strong>Verdict : ❌ FAUX</strong><br/>Le \"41%\" ne signifie pas « 41% des emplois remplacés ». Il renvoie à la proportion d'employeurs qui envisagent des réductions dans certaines activités automatisables, tandis que d'autres chiffres insistent sur l'augmentation et la transformation.</p><p><strong>Sources :</strong> CNN, ILO Working Paper 96, CNBC/IMF</p>",

  const deck = document.getElementById('deck');
  const hint = document.getElementById('hint');
  const total = DATA.length;
  let cur = 0, startX = 0, deltaX = 0, dragging = false, startTime = 0;

  DATA.forEach((d, i) => {
    const c = document.createElement('article');
    c.className = 'card' + (i === 0 ? ' active' : ' next');
    c.dataset.t = d.t;
    c.dataset.i = i;
    if (d.home) {
      const articlesHtml = d.articles.map((a, j) => `
        <div class="home-article" data-goto="${a.idx}">
          <div class="num">${j + 1}</div>
          <div class="info">
            <div class="badge-sm">${a.badge}</div>
            <div class="title-sm">${a.title}</div>
          </div>
          <div class="arrow">›</div>
        </div>
      `).join('');
      c.innerHTML = `
        <div class="hdr">
          <span class="badge tech">📰 Daily</span>
          <div class="dots">${dots(i)}</div>
        </div>
        <div class="home-content">
          <div class="home-logo"><span><b>AI</b> Insight Daily</span></div>
          <div class="home-date">${d.date}</div>
          <div class="home-henry">
            <div class="label">🎯 Le Mot de Henry</div>
            <div class="text">${d.henryWord}</div>
          </div>
          <div class="home-articles">${articlesHtml}</div>
          <div class="home-footer">deeplearning.fr • Daily News | <a href="archives.html">📚 Archives</a></div>
        </div>`;
    } else if (d.end) {
      c.innerHTML = `
        <div class="hdr">
          <span class="badge end">✅ Terminé</span>
          <div class="dots">${dots(i)}</div>
        </div>
        <div class="end-content">
          <div class="em">🎉</div>
          <h2>Briefing terminé !</h2>
          <p>Vous avez parcouru le briefing du jour.<br>À demain !</p>
          <a href="https://bacoco.github.io/daily-ai/" style="display:inline-block;padding:12px 32px;border:none;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;box-shadow:0 0 25px rgba(59,130,246,.4);margin-bottom:12px;">📰 Toutes les éditions</a><br><button id="restart">🔄 Recommencer</button>
          <small>← Swipez à gauche pour revenir</small>
        </div>`;
    } else {
      const authorWordHtml = d.authorWord ? `<div class="author-word"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author}</div></div>` : '';
      c.innerHTML = `
        <div class="hdr">
          <span class="badge ${d.t}">${d.badge}</span>
          <div class="dots">${dots(i)}</div>
        </div>
        <div class="title-zone"><h1>${d.title}</h1></div>
        ${authorWordHtml}
        <div class="scroll-cta"><span><i>↓</i> Lire plus</span></div>
        <div class="scroll-zone">
          <div class="scroll-inner">
            <div class="hook">${d.hook}</div>
            <div class="details">${d.details}<div class="sig">deeplearning.fr • Daily News</div></div>
          </div>
        </div>`;
    }
    deck.appendChild(c);
  });

  function dots(active) {
    let s = '';
    for (let i = 0; i < total; i++) s += `<span class="dot${i === active ? ' on' : ''}"></span>`;
    return s;
  }

  const cards = deck.querySelectorAll('.card');

  function update(anim = true) {
    cards.forEach((c, i) => {
      c.classList.toggle('anim', anim);
      c.classList.remove('prev', 'active', 'next');
      if (i < cur) c.classList.add('prev');
      else if (i === cur) c.classList.add('active');
      else c.classList.add('next');
      c.style.transform = '';
      c.querySelectorAll('.dot').forEach((d, j) => d.classList.toggle('on', j === cur));
    });
  }

  function go(i) { if (i >= 0 && i < total) { cur = i; update(); } }

  const dateKey = 'daily-' + DATA[0].date.replace(/\s+/g, '-');
  if (!localStorage.getItem(dateKey)) {
    setTimeout(() => { hint.classList.add('hide'); localStorage.setItem(dateKey, '1'); }, 2000);
  } else hint.style.display = 'none';

  document.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
    startTime = Date.now();
    deltaX = 0;
    dragging = true;
    cards[cur].classList.remove('anim');
  }, { passive: true });

  document.addEventListener('touchmove', e => {
    if (!dragging) return;
    deltaX = e.touches[0].clientX - startX;
    cards[cur].style.transform = `translate(-50%, -50%) translateX(${deltaX}px) rotate(${deltaX * 0.012}deg)`;
  }, { passive: true });

  document.addEventListener('touchend', e => {
    if (!dragging) return;
    dragging = false;
    const card = cards[cur];
    card.classList.add('anim');
    const velocity = Math.abs(deltaX) / (Date.now() - startTime);
    const threshold = velocity > 0.5 ? 30 : 60;
    if (deltaX < -threshold && cur < total - 1) { cur++; update(); }
    else if (deltaX > threshold && cur > 0) { cur--; update(); }
    else { card.style.transform = ''; }
  }, { passive: true });

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' && cur < total - 1) { cur++; update(); }
    if (e.key === 'ArrowLeft' && cur > 0) { cur--; update(); }
  });

  document.addEventListener('click', e => {
    if (e.target.id === 'restart') go(0);
    const article = e.target.closest('.home-article');
    if (article) { const idx = parseInt(article.dataset.goto); if (!isNaN(idx)) go(idx); }
  });
  // Theme toggle
  (function(){
    const btn=document.getElementById('themeToggle');
    const saved=localStorage.getItem('theme');
    if(saved==='light'){document.documentElement.classList.add('light');btn.textContent='☀️';}
    btn.addEventListener('click',()=>{
      const isLight=document.documentElement.classList.toggle('light');
      btn.textContent=isLight?'☀️':'🌙';
      localStorage.setItem('theme',isLight?'light':'dark');
    });
  })();
  </script>
</body>
