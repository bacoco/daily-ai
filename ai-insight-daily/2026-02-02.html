  const deck = document.getElementById('deck');
  const hint = document.getElementById('hint');
  const total = DATA.length;
  let cur = 0, startX = 0, deltaX = 0, dragging = false, startTime = 0;

  // Build cards
  DATA.forEach((d, i) => {
    const c = document.createElement('article');
    c.className = 'card' + (i === 0 ? ' active' : ' next');
    c.dataset.t = d.t;
    c.dataset.i = i;

    if (d.home) {
      const articlesHtml = d.articles.map((a, j) => `
        <div class="home-article" data-goto="${a.idx}">
          <div class="num">${j + 1}</div>
          <div class="info">
            <div class="badge-sm">${a.badge}</div>
            <div class="title-sm">${a.title}</div>
          </div>
          <div class="arrow">›</div>
        </div>
      `).join('');

      c.innerHTML = `
        <div class="hdr">
          <span class="badge tech">📰 Daily</span>
          <div class="dots">${dots(i)}</div>
        </div>
        <div class="home-content">
          <div class="home-logo"><span><b>AI</b> Insight Daily</span></div>
          <div class="home-date">${d.date}</div>

          <div class="home-henry">
            <div class="label">🎯 Le Mot de Henry</div>
            <div class="text">${d.henryWord}</div>
          </div>

          <div class="home-articles">${articlesHtml}</div>
          <div class="home-footer">deeplearning.fr • Daily News | <a href="archives.html">📚 Archives</a></div>
        </div>`;

    } else if (d.end) {
      c.dataset.t = 'end';
      c.innerHTML = `
        <div class="hdr">
          <span class="badge end">✅ Terminé</span>
          <div class="dots">${dots(i)}</div>
        </div>
        <div class="end-content">
          <div class="em">🎉</div>
          <h2>Briefing terminé !</h2>
          <p>Vous avez parcouru les 5 sujets du jour.<br>À demain pour le prochain briefing.</p>
          <a href="../index.html" style="display:inline-block;padding:12px 32px;border:none;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;box-shadow:0 0 25px rgba(59,130,246,.4);margin-bottom:12px;">📰 Toutes les éditions</a><br><button id="restart">🔄 Recommencer</button>
          <small>← Swipez à gauche pour revenir</small>
        </div>`;

    } else {
      const authorWordHtml = d.authorWord
        ? `<div class="author-word"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author}</div></div>`
        : '';

      c.innerHTML = `
        <div class="hdr">
          <span class="badge ${d.t}">${d.badge}</span>
          <div class="dots">${dots(i)}</div>
        </div>
        <div class="title-zone"><h1>${d.title}</h1></div>
        ${authorWordHtml}
        <div class="scroll-cta"><span><i>↓</i> Lire plus</span></div>
        <div class="scroll-zone">
          <div class="scroll-inner">
            <div class="hook">${d.hook}</div>
            <div class="details">${d.details}<div class="sig">deeplearning.fr • Daily News</div></div>
          </div>
        </div>`;
    }

    deck.appendChild(c);
  });

  function dots(active) {
    let s = '';
    for (let i = 0; i < total; i++) s += `<span class="dot${i === active ? ' on' : ''}"></span>`;
    return s;
  }

  const cards = deck.querySelectorAll('.card');

  function update(anim = true) {
    cards.forEach((c, i) => {
      c.classList.toggle('anim', anim);
      c.classList.remove('prev', 'active', 'next');
      if (i < cur) c.classList.add('prev');
      else if (i === cur) c.classList.add('active');
      else c.classList.add('next');
      c.style.transform = '';
      c.querySelectorAll('.dot').forEach((d, j) => d.classList.toggle('on', j === cur));
    });
  }

  function go(i) { if (i >= 0 && i < total) { cur = i; update(); } }

  // Hint
  if (!localStorage.getItem('daily-v10b')) {
    setTimeout(() => { hint.classList.add('hide'); localStorage.setItem('daily-v10b', '1'); }, 2000);
  } else hint.style.display = 'none';

  // Touch - swipe left/right
  document.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
    startTime = Date.now();
    deltaX = 0;
    dragging = true;
    cards[cur].classList.remove('anim');
  }, { passive: true });

  document.addEventListener('touchmove', e => {
    if (!dragging) return;
    deltaX = e.touches[0].clientX - startX;
    cards[cur].style.transform = `translate(-50%, -50%) translateX(${deltaX}px) rotate(${deltaX * 0.012}deg)`;
  }, { passive: true });

  document.addEventListener('touchend', e => {
    if (!dragging) return;
    dragging = false;
    const card = cards[cur];
    card.classList.add('anim');

    const velocity = Math.abs(deltaX) / (Date.now() - startTime);
    const threshold = velocity > 0.5 ? 30 : 60;

    if (deltaX < -threshold && cur < total - 1) {
      cur++; update();
    } else if (deltaX > threshold && cur > 0) {
      cur--; update();
    } else {
      card.style.transform = '';
    }
  }, { passive: true });

  // Keyboard
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' && cur < total - 1) { cur++; update(); }
    if (e.key === 'ArrowLeft' && cur > 0) { cur--; update(); }
  });

  // Restart & Article click
  document.addEventListener('click', e => {
    if (e.target.id === 'restart') go(0);
    const article = e.target.closest('.home-article');
    if (article) {
      const idx = parseInt(article.dataset.goto);
      if (!isNaN(idx)) go(idx);
    }
  });
  // Theme toggle
  (function(){
    const btn=document.getElementById('themeToggle');
    const saved=localStorage.getItem('theme');
    if(saved==='light'){document.documentElement.classList.add('light');btn.textContent='☀️';}
    btn.addEventListener('click',()=>{
      const isLight=document.documentElement.classList.toggle('light');
      btn.textContent=isLight?'☀️':'🌙';
      localStorage.setItem('theme',isLight?'light':'dark');
    });
  })();
  </script>
</body>
