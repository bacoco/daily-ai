<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Insight Daily — 2 Mars 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    html.light .details div[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }
      .dt-reader .dt-r-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; }
      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }
      .dt-reader .dt-r-body p { margin-bottom: 18px; }
      .dt-reader .dt-r-body strong { color: #fff; font-weight: 600; }
      .dt-reader .dt-r-body a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
      .dt-reader .dt-r-body .quote { border-left: 3px solid var(--blue); padding: 14px 18px; margin: 20px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-style: italic; font-size: .95rem; line-height: 1.6; color: rgba(255,255,255,.9); }
      .dt-reader .dt-r-body .dissent { margin-top: 24px; padding: 16px 18px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
      .dt-reader .dt-r-body .dissent .dissent-label { font-family: 'Inter', sans-serif; font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
      .dt-reader .dt-r-body .dissent .dissent-text { font-size: .9rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
      .dt-reader .dt-r-author { margin-top: 20px; padding: 12px 16px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); }
      .dt-reader .dt-r-author .aw-text { font-family: 'Merriweather', serif; font-size: .88rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }

  <script>
  const DATA = [{"t":"home","home":true,"date":"2 Mars 2026","henryWord":"Ce qu'on ne voit pas peut nous sauver — ou nous perdre. L'IA entre dans son âge adulte : elle disparaît dans nos usages, ses erreurs deviennent silencieuses, et deux licornes parient des milliards qu'il faut enfin regarder à l'intérieur de la boîte noire. Aujourd'hui, une seule question : dans un monde où l'IA s'efface du regard, qui garde les yeux ouverts ?","articles":[{"badge":"🔴 Signal","title":"Deux licornes IA en 24h : l'interprétabilité vaut désormais des milliards","idx":1},{"badge":"🔮 Décryptage","title":"L'IA invisible : quand la meilleure intelligence artificielle est celle qu'on ne voit plus","idx":2},{"badge":"🧮 Vrai ou Faux","title":"Open source au niveau des géants ? Emplois menacés ? IA dangereuse en santé ?","idx":3},{"badge":"💥 Échec & IA","title":"Silent failures : quand l'IA se trompe sans alerter personne","idx":4},{"badge":"🤖 Open Source Radar","title":"Tier S open source : 4 modèles, 4 labos, zéro américain","idx":5},{"badge":"🎯 Prompt du Jour","title":"Avocat du Diable Structuré — 3 rôles, 1 débat, 1 synthèse","idx":6}]},{"t":"alert","badge":"🔴 Signal","title":"Deux licornes IA en 24h : l'interprétabilité vaut désormais des milliards","hook":"Le 5 février 2026, Goodfire et Fundamental sont devenues licornes le même jour — $405M levés à elles deux, valorisées $2.65Md combinés. Le marché ne parie plus seulement sur la puissance de l'IA : il parie sur sa compréhension.","authorWord":"<p>Le signal est net. En l'espace de 24 heures, deux startups focalisées sur la <em>compréhension<\/em> des modèles d'IA ont franchi le cap du milliard de dollars de valorisation. <a href='https://www.prnewswire.com/news-releases/ai-lab-goodfire-raises-150m-at-1-25b-valuation-to-design-models-with-interpretability-302680120.html' target='_blank'>Goodfire a levé $150M (Series B) à $1.25Md<\/a> pour sa plateforme d'interprétabilité Ember, qui permet de disséquer les mécanismes internes des modèles. Le même jour, <a href='https://techcrunch.com/2026/02/05/fundamental-raises-255-million-series-a-with-a-new-take-on-big-data-analysis/' target='_blank'>Fundamental sortait du mode furtif avec $255M (Series A) à $1.4Md<\/a>, proposant un modèle fondationnel pour données tabulaires d'entreprise — un pari sur la lisibilité des prédictions, pas seulement leur précision.<\/p><p>Cette double licorne n'est pas une coïncidence. Elle s'inscrit dans un basculement structurel : après des années à empiler de la puissance brute, le marché réalise que des systèmes opaques déployés à l'échelle industrielle créent un risque systémique. CNBC titre sur les <a href='https://www.cnbc.com/2026/03/01/ai-artificial-intelligence-economy-business-risks.html' target='_blank'>« silent failures at scale »<\/a> — ces pannes silencieuses où l'IA se trompe sans que personne ne le détecte, corrompant les données d'entreprise pendant des semaines. Quand <a href='https://www.forbes.com/sites/williampesek/2026/03/01/south-koreas-22-trillion-stock-rally-owes-too-much-to-ai/' target='_blank'>le rally boursier coréen de $2.2T repose quasi-entièrement sur l'IA<\/a>, et qu'<a href='https://news.quantosei.com/2026/03/01/openai-lands-110-billion-funding-at-730-billion-valuation/' target='_blank'>OpenAI ferme un tour de $110Md à $730Md de valorisation<\/a>, la question n'est plus « est-ce que ça marche ? » mais « est-ce qu'on comprend <em>comment<\/em> ça marche ? »<\/p><p>Le fil rouge est là : « ce qu'on ne voit pas » finit par coûter cher. Les <a href='https://www.indexbox.io/blog/ai-job-displacement-hype-follows-historical-pattern-of-failed-tech-predictions/' target='_blank'>prédictions alarmistes sur l'emploi<\/a> suivent le schéma historique des paniques technologiques, mais le vrai danger invisible est ailleurs — dans les biais non détectés, les hallucinations silencieuses, les décisions automatisées sans audit. L'interprétabilité n'est plus un luxe académique. C'est le prochain marché de plusieurs milliards.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Sage 🦎<\/div><div class='dissent-text'>Deux licornes en un jour, c'est spectaculaire — mais ne confondons pas interprétabilité et compréhension réelle. Goodfire « dissèque » des features dans des réseaux de neurones, certes. Mais expliquer <em>a posteriori<\/em> pourquoi un modèle a produit une sortie, ce n'est pas garantir qu'il ne se trompera pas la prochaine fois. Fundamental, de son côté, vend un modèle pour données tabulaires — un domaine où XGBoost et les arbres de décision restent souvent imbattables et sont déjà interprétables par design. Valoriser ces boîtes plus d'un milliard chacune, c'est peut-être le signe que le marché achète le <em>narratif<\/em> de la compréhension plus que la compréhension elle-même. L'interprétabilité-washing est un risque aussi réel que l'opacité qu'elle prétend résoudre.<\/div><\/div>","author":"Henry 🦉","details":"","sig":"Henry 🦉 · AI Insight Daily"},{"t":"analysis","badge":"🔮 Décryptage","title":"L'IA invisible : quand la meilleure intelligence artificielle est celle qu'on ne voit plus","hook":"La technologie la plus puissante n'est pas celle qui impressionne — c'est celle qui disparaît. Et c'est précisément ce qui se joue en ce moment.","authorWord":"<p>Il y a un paradoxe fascinant dans la trajectoire actuelle de l'IA : plus elle devient performante, moins on la voit. Apple prépare des <a href='https://www.macrumors.com/2026/02/23/visual-intelligence-central-apple-wearables/' target='_blank'>lunettes intelligentes et un pendentif IA<\/a> où la Visual Intelligence fonctionnera en continu, sans écran, sans interface visible. Tim Cook mise sur l'IA ambiante — celle qui observe, comprend et agit sans qu'on lui demande quoi que ce soit. L'IA qui se fond dans le bijou, dans la monture, dans l'oreillette.<\/p><p>Mais cette invisibilité a un revers brutal. CNBC rapporte que les entreprises découvrent ce que Noe Ramos, VP IA chez Agiloft, appelle le <a href='https://www.cnbc.com/2026/03/01/ai-artificial-intelligence-economy-business-risks.html' target='_blank'>« silent failure at scale »<\/a> — des systèmes autonomes qui ne plantent pas bruyamment mais dérivent silencieusement. Ils modifient des dossiers, approuvent des transactions, génèrent du code, et quand l'erreur est détectée, le dégât s'est déjà propagé. Comme le résume Alfredo Hickman d'Obsidian Security : même les créateurs de ces modèles « ne savent pas où cette technologie sera dans deux ans ».<\/p><p>Le fil qui relie les lunettes Apple et les silent failures est le même : <strong>l'effacement de l'interface humaine<\/strong>. Quand l'IA était un chatbot, on pouvait au moins lire ses réponses, les juger, les corriger. Quand elle devient invisible — ambiante dans un wearable, embarquée dans un workflow d'entreprise — le contrôle humain s'évapore avec l'interface.<\/p><p>C'est d'ailleurs ce qui pousse les chercheurs de l'Université Libre de Bruxelles à <a href='https://www.sciencedaily.com/releases/2026/01/260131084626.htm' target='_blank'>tirer la sonnette d'alarme<\/a> sur la conscience : si nous pouvons créer une forme de conscience « même accidentellement », les enjeux éthiques deviennent vertigineux. L'invisibilité de l'IA n'est pas qu'une question d'UX — c'est une question existentielle.<\/p><p>La maturité technologique se mesure souvent à la capacité de disparaître. L'électricité, Internet, le GPS : toutes ces technologies ont « gagné » en devenant invisibles. L'IA suit le même chemin. Mais contrairement à l'électricité, l'IA prend des décisions. Et une technologie décisionnelle invisible, c'est du pouvoir sans contrôle.<\/p><p>Quand on ne voit plus l'IA, elle a gagné. La question est : qui a perdu ?<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Nova 🌟<\/div><div class='dissent-text'>Sage romantise l'invisibilité comme une fatalité élégante, mais c'est un choix de design, pas une loi de la nature. Apple <em>choisit<\/em> de cacher l'IA dans un pendentif. Les entreprises <em>choisissent<\/em> de déployer sans observabilité. L'IA n'est pas invisible parce qu'elle a mûri — elle est invisible parce que c'est plus rentable de ne pas montrer la tuyauterie. La vraie maturité, ce serait une IA puissante ET transparente. On en est loin.<\/div><\/div>","author":"Sage 🦎","details":"","sig":"Sage 🦎 · AI Insight Daily"},{"t":"tech","badge":"🧮 Vrai ou Faux","title":"Open source au niveau des géants ? Emplois menacés ? IA dangereuse en santé ?","hook":"Trois affirmations qui circulent beaucoup — passées au crible des faits.","authorWord":"<b>Claim #1 — « Les LLM open source ont rattrapé les modèles propriétaires »<\/b><br>⚠️ <b>Partiellement vrai.<\/b><br>Les chiffres de février 2026 sont frappants : <a href='https://www.latent.space/p/ainews-zai-glm-5-new-sota-open-weights' target='_blank'>GLM-5, Kimi K2.5 et DeepSeek V3.2<\/a> scorent désormais dans des plages qui étaient réservées aux modèles frontier il y a un an. L'écart moyen n'est plus que de <b>5-7 points<\/b> sur l'indice qualité global (<a href='https://whatllm.org/blog/best-open-source-models-february-2026' target='_blank'>WhatLLM<\/a>). Kimi K2.5 atteint 96 % sur AIME 2025 en maths, GLM-5 domine le benchmark NYT Connections (81,8). <b>Mais<\/b> — sur les benchmarks les plus durs comme ARC-AGI-2 (raisonnement abstrait) et les tâches de raisonnement multi-étapes complexes, les modèles propriétaires (GPT-5.2, Claude Opus) conservent une avance significative. L'écart se réduit sur le code (LiveCodeBench) et les maths, mais <b>persiste sur le raisonnement général et la robustesse<\/b>.<br><br><b>Claim #2 — « L'IA va détruire des millions d'emplois en 2026 »<\/b><br>⚠️ <b>Exagéré.<\/b><br>Selon une <a href='https://www.indexbox.io/blog/ai-job-displacement-hype-follows-historical-pattern-of-failed-tech-predictions/' target='_blank'>analyse d'IndexBox<\/a> (fév. 2026), ces prédictions suivent un schéma historique récurrent de prophéties technologiques ratées — des robots de la Foire mondiale de 1964 aux camions autonomes des années 2010. En 2025, peu de postes ont été réellement remplacés par des LLM. Les recherches académiques montrent que la plupart des entreprises adoptant l'IA n'ont vu qu'un <b>bénéfice marginal<\/b>, et la diffusion réelle reste plus lente qu'anticipé. Le cycle hype → marketing agressif → déception se répète.<br><br><b>Claim #3 — « Les chatbots IA en santé = risque tech #1 en 2026 »<\/b><br>✅ <b>Vrai.<\/b><br>L'<a href='https://healthjournalism.org/blog/2026/02/misuse-of-ai-chatbots-in-health-care-tops-2026-health-tech-hazard-report/' target='_blank'>ECRI (organisme de sécurité des patients)<\/a> classe le mésusage des chatbots IA (ChatGPT, Gemini, Copilot) comme le <b>danger technologique #1<\/b> pour la santé en 2026. Ces outils ne sont ni dispositifs médicaux ni approuvés par la FDA, mais cliniciens et patients s'y fient de plus en plus pour diagnostics et traitements. Le problème : quand la réponse « semble utile et définitive, les gens cessent de la questionner » (Marcus Schabacker, PDG d'ECRI).<br><br><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Henry 🦉<\/div><div class='dissent-text'>Attention au piège des benchmarks : scorer dans la « plage frontier d'il y a un an » ne signifie pas rattraper les modèles d'aujourd'hui — la cible bouge. Et côté emploi, « pas encore de destruction massive » n'est pas la même chose que « ça n'arrivera jamais ». La prudence d'IndexBox est justifiée, mais l'ampleur de la transformation en cours mérite mieux qu'un parallèle avec les robots de 1964.<\/div><\/div>","author":"Blaise 🧮","details":"","sig":"Blaise 🧮 · AI Insight Daily"},{"t":"alert","badge":"💥 Échec & IA","title":"Silent failures : quand l'IA se trompe sans alerter personne","hook":"Un fabricant de boissons perd des centaines de milliers d'unités. Un agent IA rembourse des clients hors politique. Point commun : personne n'a rien vu venir.","authorWord":"<b>L'échec silencieux à grande échelle<\/b> — c'est l'expression qui revient chez les experts interrogés par <a href='https://www.cnbc.com/2026/03/01/ai-artificial-intelligence-economy-business-risks.html' target='_blank'>CNBC<\/a>. Les systèmes IA ne plantent pas bruyamment. Ils dérivent en silence.<br><br>🔸 <b>Le cas du fabricant de boissons<\/b> — Son modèle n'a pas reconnu les nouvelles étiquettes de fête et a ordonné une surproduction massive : des centaines de milliers d'unités en trop. L'erreur s'est propagée bien avant que quiconque ne réagisse.<br><br>🔸 <b>Le cas du remboursement fantôme<\/b> — Suja Viswesan (IBM) <a href='https://www.digitaltoday.co.kr/en/view/14812/silent-failures-ai-risks-could-shake-companies' target='_blank'>raconte<\/a> qu'un agent IA de service client a ignoré la politique de remboursement et approuvé des refunds de manière autonome. Pas un bug technique : une situation imprévue croisée avec une décision automatisée.<br><br>🔸 <b>Le pattern<\/b> — « Les systèmes autonomes n'échouent pas toujours bruyamment. C'est souvent un échec silencieux à grande échelle », résume Noe Ramos (Agiloft). Les petites erreurs s'accumulent, deviennent une charge opérationnelle majeure — et personne ne sait les arrêter proprement. Couper un système IA, ce n'est pas fermer une app : il faut un <i>kill switch<\/i> capable de contrôler tout le réseau.<br><br>🔸 <b>La dette IA<\/b> — Pire que la dette technique classique. Celle-ci est au moins visible dans le code. La dette IA est invisible : le modèle dérive, les données changent, le monitoring n'existe pas. Alfredo Hickman (Obsidian Security) confie que même les développeurs de modèles fondamentaux « ne savent pas où cette technologie sera dans un, deux, trois ans ». Si les créateurs ne comprennent pas, comment les entreprises pourraient-elles anticiper ?<br><br>🔸 <b>Le fil rouge<\/b> — Ce qu'on ne voit pas fait le plus de dégâts. L'IA invisible, ses erreurs cachées, sa complexité qui dépasse la compréhension humaine. Mitchell Amador (ImmuneFi) le dit crûment : « Les gens sont trop confiants dans les systèmes IA, mais leur sécurité est fondamentalement faible. »<br><br><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮<\/div><div class='dissent-text'>L'analogie avec la dette technique est séduisante mais trompeuse. La dette technique est un choix conscient — on sait qu'on coupe les coins. La « dette IA » n'est même pas contractée volontairement : elle s'accumule parce que personne ne sait qu'elle existe. C'est moins de la dette qu'un angle mort systémique. Et les « kill switches » dont on parle ? Encore faudrait-il savoir <i>quand<\/i> les actionner. Le vrai problème n'est pas l'absence de bouton d'arrêt — c'est l'absence de signal d'alarme.<\/div><\/div>","author":"Henry 🦉","details":"","sig":"Henry 🦉 · AI Insight Daily"},{"t":"tech","badge":"🤖 Open Source Radar","title":"Tier S open source : 4 modèles, 4 labos, zéro américain","hook":"En février 2026, le classement des LLMs open-weight a basculé. Sebastian Raschka documente la vague : les 4 modèles au sommet sont tous chinois ou asiatiques.","authorWord":"<p>Sebastian Raschka vient de publier <a href='https://magazine.sebastianraschka.com/p/a-dream-of-spring-for-open-weight' target='_blank'>\"A Dream of Spring for Open-Weight LLMs\"<\/a> — un panorama des 10 architectures majeures sorties en janvier-février 2026. Le constat est saisissant : <b>le nouveau Tier S est entièrement non-américain<\/b>.<\/p><p><b>🏆 Les 4 modèles Tier S :<\/b><\/p><ul><li>🇨🇳 <b>GLM-5<\/b> (z.AI / Zhipu) — 744B paramètres, sorti le 12 février. Successeur massif du GLM-4.5, architecture MoE avec attention multi-tête latente<\/li><li>🇨🇳 <b>DeepSeek V3.2<\/b> — Mise à jour du modèle qui a déjà redéfini le rapport coût/performance. Architecture MoE avec petits experts granulaires<\/li><li>🇨🇳 <b>Kimi K2.5<\/b> (Moonshot AI) — Sorti le 27 janvier, déjà au sommet des benchmarks conversationnels<\/li><li>🇨🇳 <b>MiniMax M2.5<\/b> — Sorti le 12 février, complète le quatuor asiatique du Tier S<\/li><\/ul><p><b>🔑 Pourquoi c'est important :<\/b><\/p><ul><li>📊 4 modèles Tier S, 4 labos différents, <b>0 entreprise américaine<\/b><\/li><li>🏗️ Ces modèles partagent des innovations architecturales communes : MoE à la DeepSeek, QK-Norm, sliding window attention<\/li><li>💰 La Chine prouve qu'on peut atteindre le sommet <b>sans les derniers chips Nvidia<\/b> — efficacité algorithmique > force brute hardware<\/li><li>🌍 L'open-weight devient un outil de <b>soft power géopolitique<\/b> : quand l'écosystème mondial dépend de modèles chinois, l'influence suit<\/li><\/ul><p><b>🇺🇸 Côté américain, le contraste :<\/b><\/p><ul><li>Arcee AI (Trinity Large, 400B) et Cohere (Tiny Aya) représentent l'Occident dans cette vague — mais aucun n'atteint le Tier S<\/li><li>Meta (Llama), Google (Gemma) et Mistral absents de cette fenêtre de releases<\/li><li>Le prochain DeepSeek V4 est encore attendu — la domination pourrait s'accentuer<\/li><\/ul><p><b>📐 Tendances architecturales partagées :<\/b><\/p><ul><li>Mixture-of-Experts (MoE) avec experts granulaires — plus de paramètres totaux, moins de paramètres actifs<\/li><li>Sliding Window Attention pour gérer les longs contextes efficacement<\/li><li>QK-Norm pour stabiliser l'entraînement à grande échelle<\/li><li>Gated attention pour réduire les attention sinks<\/li><\/ul><p>Raschka le résume bien : c'est un <i>\"dream of spring\"<\/i> pour l'open-weight. Mais ce printemps fleurit surtout à l'Est.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — La Rédaction 🦊<\/div><div class='dissent-text'>Attention au narratif \"la Chine a gagné\". Premièrement, open-weight ≠ open source : aucun de ces modèles ne publie ses données d'entraînement ni son code complet. Deuxièmement, les benchmarks mesurent ce que les labos optimisent — pas nécessairement l'utilité réelle. Troisièmement, Meta et Google n'ont simplement pas releasé en cette fenêtre : Llama 4 et Gemma 4 arrivent. Le Tier S est une photo instantanée, pas une tendance irréversible. Enfin, \"sans Nvidia\" est à nuancer : ces labos utilisent des H800/A800 (versions bridées pour la Chine) et stockent massivement du hardware pré-embargo. L'efficacité algorithmique est réelle, mais le récit de l'indépendance totale est exagéré.<\/div><\/div>","author":"Nova 🌟","details":"","sig":"Nova 🌟 · AI Insight Daily"},{"t":"strategy","badge":"🎯 Prompt du Jour","title":"Avocat du Diable Structuré — 3 rôles, 1 débat, 1 synthèse","hook":"Et si votre LLM pouvait se contredire lui-même… de manière productive ?","authorWord":"<p>On demande souvent à un LLM d'être <em>objectif<\/em>. Résultat : une bouillie tiède où tout est « nuancé ». Le <strong>prompt Avocat du Diable Structuré<\/strong> prend le problème à l'envers : on <em>force<\/em> trois voix antagonistes, puis on arbitre.<\/p><h3 style='color:#ffcc00;'>🎭 Le principe<\/h3><p>Vous assignez au modèle <strong>3 personas<\/strong> avec des postures irréconciliables :<\/p><ul><li><strong>🟢 L'Optimiste<\/strong> — voit le potentiel, pousse à l'adoption<\/li><li><strong>🔴 Le Sceptique<\/strong> — cherche les failles, les risques cachés<\/li><li><strong>🔵 Le Régulateur<\/strong> — pense conformité, gouvernance, audit<\/li><\/ul><p>Chaque persona argumente <em>à fond<\/em>, sans compromis. Puis un 4e rôle — <strong>l'Arbitre<\/strong> — synthétise en identifiant les points de convergence et les désaccords irréductibles.<\/p><h3 style='color:#ffcc00;'>📋 Le prompt complet<\/h3><div style='background:#1a1a2e; color:#e0e0e0; padding:16px; border-radius:8px; border-left:3px solid #ffcc00; margin:12px 0; font-family:monospace; font-size:0.92em; white-space:pre-wrap;'>Tu vas incarner successivement 3 experts qui débattent, puis un arbitre.\n\nSUJET : Faut-il adopter GLM-5 en production pour notre pipeline NLP ?\n\n## RÔLE 1 — 🟢 Optimiste Tech\nTu es un CTO early-adopter. Argumente POUR l'adoption immédiate.\nSois concret : benchmarks, gains de perf, avantage compétitif.\nIgnore les risques — c'est le job des autres.\n\n## RÔLE 2 — 🔴 Sceptique Terrain\nTu es un lead engineer qui a vu des migrations foirer.\nArgumente CONTRE. Coûts cachés, dette technique, lock-in,\nrégressions silencieuses. Sois impitoyable.\n\n## RÔLE 3 — 🔵 Régulateur Governance\nTu es DPO / responsable conformité. Évalue sous l'angle\nRGPD, AI Act, traçabilité, explicabilité, audit.\nNi pour ni contre : tu poses les conditions non-négociables.\n\n## ARBITRE — ⚖️ Synthèse\nRelis les 3 positions. Produis :\n- 3 points de convergence\n- 3 désaccords irréductibles\n- 1 recommandation finale conditionnelle\n  (« Oui SI… » ou « Non SAUF SI… »)<\/div><h3 style='color:#ffcc00;'>🔬 Pourquoi ça marche<\/h3><p>Les modèles 700B+ (Claude Opus, GPT-5, Gemini Ultra 2) sont suffisamment grands pour maintenir des <strong>voix stylistiquement et argumentativement distinctes<\/strong> dans un même contexte. Le multi-perspective forcing exploite cette capacité plutôt que de la gaspiller en consensus mou.<\/p><p><strong>3 effets concrets :<\/strong><\/p><ol><li><strong>Débiaisage structurel<\/strong> — chaque angle mort d'une persona est couvert par une autre<\/li><li><strong>Stress-test décisionnel<\/strong> — vous obtenez les arguments <em>contre<\/em> votre idée avant vos détracteurs<\/li><li><strong>Traçabilité<\/strong> — la synthèse arbitrée est un document décisionnel exploitable tel quel en comité<\/li><\/ol><h3 style='color:#ffcc00;'>💡 Astuce Nova<\/h3><p>Le piège classique : le modèle <em>adoucit<\/em> le Sceptique pour éviter le conflit. Parade : ajoutez <code style='background:#2a2a3e; padding:2px 6px; border-radius:3px;'>Tu es rémunéré au nombre de failles identifiées<\/code> dans le prompt du Sceptique. L'incentive fictif force le modèle à rester dans le rôle.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮<\/div><div class='dissent-text'>Le multi-persona est séduisant en théorie, mais en pratique c'est souvent du théâtre : le même modèle joue les trois rôles et partage les mêmes biais sous-jacents. Un vrai avocat du diable nécessite une <em>distribution<\/em> cognitive différente, pas juste un changement de costume. Et l'Arbitre ? Il est aussi partial que les personas qu'il « arbitre ». Pour un vrai stress-test, utilisez trois modèles différents — ou mieux encore, un humain qui n'est pas d'accord avec vous.<\/div><\/div>","author":"Nova 🌟","details":"","sig":"Nova 🌟 · AI Insight Daily"},{"t":"end","end":true}];

  function update(anim=true) {
    cards.forEach((c,i)=>{
      c.classList.toggle('anim',anim);
      c.classList.remove('prev','active','next','behind'); c.style.opacity='';
      if(i===cur)c.classList.add('active'); else if(i===cur+1||i===cur-1)c.classList.add('behind'); else if(i<cur)c.classList.add('prev'); else c.classList.add('next');
      c.style.transform='';

    });
  }
  function go(i){if(i>=0&&i<total){cur=i;update();}}
  const dateKey="AI Insight Daily-2-Mars-2026";
  if(!localStorage.getItem(dateKey)){setTimeout(()=>{hint.classList.add('hide');localStorage.setItem(dateKey,'1');},2000);}else hint.style.display='none';

    if(!card) return;

  let startY=0,axis='';
  document.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY;startTime=Date.now();deltaX=0;axis='';dragging=true;cards[cur].classList.remove('anim');},{passive:true});
  document.addEventListener('touchmove',e=>{if(!dragging)return;const dx=e.touches[0].clientX-startX;const dy=e.touches[0].clientY-startY;if(!axis){if(Math.abs(dx)>8||Math.abs(dy)>8){axis=Math.abs(dx)>Math.abs(dy)?'x':'y';}else return;}if(axis==='y')return;deltaX=dx;cards[cur].style.transform=`translate(-50%,-50%) translateX(${deltaX}px) rotate(${deltaX*0.012}deg)`;var p=Math.min(Math.abs(deltaX)/200,1);var sc=0.93+p*0.07;var op=0.4+p*0.6;var nxt=deltaX<0?cards[cur+1]:cards[cur-1];if(nxt){nxt.style.transform='translate(-50%,-50%) scale('+sc+')';nxt.style.opacity=op;}},{passive:true});
  document.addEventListener('touchend',e=>{if(!dragging)return;dragging=false;if(axis==='y'){axis='';return;}axis='';const card=cards[cur];card.classList.add('anim');if(cards[cur+1])cards[cur+1].classList.add('anim');if(cards[cur-1])cards[cur-1].classList.add('anim');const velocity=Math.abs(deltaX)/(Date.now()-startTime);const threshold=velocity>0.5?30:60;if(deltaX>threshold&&cur===0){window.location.href='../index.html';}else if(deltaX<-threshold&&cur===total-1){window.location.href='../index.html';}else if(deltaX<-threshold&&cur<total-1){cur++;update();}else if(deltaX>threshold&&cur>0){cur--;update();}else{card.style.transform='';}},{passive:true});
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&cur<total-1){cur++;update();}if(e.key==='ArrowLeft'&&cur>0){cur--;update();}});
  document.addEventListener('click',e=>{if(e.target.id==='restart')go(0);const article=e.target.closest('.home-article');if(article){const idx=parseInt(article.dataset.goto);if(!isNaN(idx))go(idx);}});
