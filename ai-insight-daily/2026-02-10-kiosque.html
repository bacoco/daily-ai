  const deck=document.getElementById('deck'),hint=document.getElementById('hint'),total=DATA.length;

  function dots(a){let s='';for(let i=0;i<total;i++)s+=`<span class="dot${i===a?' on':''}"></span>`;return s;}

  function update(anim=true){cards.forEach((c,i)=>{c.classList.toggle('anim',anim);c.classList.remove('prev','active','next');if(i<cur)c.classList.add('prev');else if(i===cur)c.classList.add('active');else c.classList.add('next');c.style.transform='';c.querySelectorAll('.dot').forEach((d,j)=>d.classList.toggle('on',j===cur));});}

  let startY=0,axis='';document.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY;startTime=Date.now();deltaX=0;axis='';dragging=true;cards[cur].classList.remove('anim');},{passive:true});
  document.addEventListener('touchmove',e=>{if(!dragging)return;const dx=e.touches[0].clientX-startX;const dy=e.touches[0].clientY-startY;if(!axis){if(Math.abs(dx)>8||Math.abs(dy)>8){axis=Math.abs(dx)>Math.abs(dy)?'x':'y';}else return;}if(axis==='y')return;deltaX=dx;cards[cur].style.transform=`translate(-50%,-50%) translateX(${deltaX}px) rotate(${deltaX*0.012}deg)`;},{passive:true});
  document.addEventListener('touchend',e=>{if(!dragging)return;dragging=false;if(axis==='y'){axis='';return;}axis='';const card=cards[cur];card.classList.add('anim');const v=Math.abs(deltaX)/(Date.now()-startTime);const t=v>0.5?30:60;if(deltaX<-t&&cur<total-1){cur++;update();}else if(deltaX>t&&cur>0){cur--;update();}else{card.style.transform='';}},{passive:true});
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&cur<total-1){cur++;update();}if(e.key==='ArrowLeft'&&cur>0){cur--;update();}});

  function cd(){if(window.innerWidth>=900){deck.classList.add('desktop-mode');cards.forEach(c=>{c.classList.remove('prev','next','anim');c.classList.add('active');c.style.transform='none';});}else{deck.classList.remove('desktop-mode');update(false);}}
