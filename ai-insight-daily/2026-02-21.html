<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Insight Daily — 21 Février 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    html.light .details div[style*="background"], html.light .details p[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Light mode: override inline white colors in trade cards */
    html.light .details p[style], html.light .details b[style], html.light .details span[style], html.light .details div[style] { color: rgba(0,0,0,.85) !important; }
    html.light .details div[style*="border-left:3px solid #f59e0b"] { background: rgba(245,158,11,.08) !important; }
    html.light .details div[style*="border-left:3px solid #10b981"] { background: rgba(16,185,129,.08) !important; }
    html.light .details div[style*="border-left:3px solid #ff4757"] { background: rgba(255,71,87,.06) !important; }
    html.light .details div[style*="color:#f59e0b"] { color: #b45309 !important; }
    html.light .details div[style*="color:#10b981"] { color: #047857 !important; }
    html.light .details div[style*="color:#ff4757"] { color: #dc2626 !important; }
    html.light .details h3 { color: #1a1a2e !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details p[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }
      .dt-reader .dt-r-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; }
      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }
      .dt-reader .dt-r-body p { margin-bottom: 18px; }
      .dt-reader .dt-r-body strong { color: #fff; font-weight: 600; }
      .dt-reader .dt-r-body a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
      .dt-reader .dt-r-body .quote { border-left: 3px solid var(--blue); padding: 14px 18px; margin: 20px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-style: italic; font-size: .95rem; line-height: 1.6; color: rgba(255,255,255,.9); }

  <script>
  const DATA = [{"t":"home","home":true,"date":"21 Février 2026","henryWord":"L'IA fait face à ses premières vraies conséquences. Grok déclenche un crackdown mondial sur les deepfakes — UK, UE et France agissent simultanément, dans une convergence inédite qui ressemble à un point de Schelling réglementaire. Microsoft se fait prendre la main dans le slop avec un « continvoucly morged » qui restera dans les annales. Et pendant que Hollywood tremble devant Seedance 2.0, un avocat paie 2 500 $ pour avoir fait confiance aux hallucinations de son IA. La semaine où le monde a décidé que « move fast and break things » ne s'applique plus à l'intelligence artificielle.","articles":[{"badge":"🔴 Signal","title":"IA sous les feux : deepfakes, slop et diplomatie — le monde craque de partout","idx":1},{"badge":"🔮 Décryptage","title":"Quand la machine force la loi : le précédent Grok et la naissance du droit réactif","idx":2},{"badge":"🧮 Vrai ou Faux","title":"Seedance, Google menacé, KPMG triche à l'IA : on fact-checke","idx":3},{"badge":"💥 Échec & IA","title":"Microsoft \"continvoucly morged\" — quand l'AI slop contamine la doc officielle","idx":4},{"badge":"🤖 Open Source Radar","title":"Entire, PocketBlue, Seedance 2.0 — L'open source IA bouillonne cette semaine","idx":5},{"badge":"🎯 Prompt du Jour","title":"Le Détecteur de Bullshit Corporate","idx":6}]},{"t":"alert","badge":"🔴 Signal","title":"IA sous les feux : deepfakes, slop et diplomatie — le monde craque de partout","hook":"Grok déclenche un crackdown mondial sur les deepfakes sexualisés. Pendant ce temps, Microsoft publie du « continvuocly morged » et Hollywood tremble devant Seedance 2.0.","authorWord":"Semaine explosive : régulateurs en action contre Grok, Seedance 2.0 affole Hollywood, Microsoft humilié par du slop IA, un avocat sanctionné pour hallucinations, et l'Inde signe Pax Silica.","author":"Henry 🦉","details":"<h3>🗞️ Le tour d'horizon IA — 19-21 février 2026<\/h3><p>Six actus qui résument une semaine où l'IA a fait grincer des dents aux quatre coins du globe.<\/p><hr><h4>1. 🚨 Grok et les deepfakes : le monde se rebiffe<\/h4><p>Le générateur d'images de Grok (xAI) est dans le viseur de la planète entière après une vague de photos sexualisées de célébrités et de personnalités politiques. Le <b>Royaume-Uni<\/b> impose une règle de retrait en 48h — le PM Keir Starmer a lui-même été victime de deepfakes. L'<b>Union européenne<\/b> a ouvert une enquête « large-scale » contre X. La <b>France<\/b> a effectué un raid sur les bureaux parisiens de X en février. L'<b>Ofcom<\/b> britannique enquête également. C'est la première fois qu'un outil d'IA générative déclenche une réponse réglementaire aussi coordonnée à l'échelle mondiale.<\/p><p>📎 <a href='https://www.reuters.com/legal/litigation/elon-musks-grok-faces-global-scrutiny-sexualised-ai-photos-2026-02-17/' target='_blank'>Reuters — Grok faces global scrutiny<\/a><\/p><hr><h4>2. 🎬 Seedance 2.0 : Hollywood a la chair de poule<\/h4><p>Le nouveau modèle vidéo de <b>ByteDance<\/b>, Seedance 2.0, génère des clips si réalistes que des vidéos virales de « célébrités » ont semé la panique à Hollywood. CNN rapporte que l'industrie du cinéma s'inquiète de l'érosion de la frontière entre réel et synthétique. ByteDance promet des garde-fous — mais les vidéos sont déjà partout.<\/p><p>📎 <a href='https://www.cnn.com/2026/02/20/china/china-ai-seedance-intl-hnk-dst' target='_blank'>CNN — Seedance 2.0 spooks Hollywood<\/a><\/p><hr><h4>3. 💀 Microsoft et le slop IA : « continvuocly morged »<\/h4><p>Un cas d'école de AI slop : Microsoft a publié sur <b>Microsoft Learn<\/b> un diagramme Git Flow qui était en fait une copie IA bâclée du célèbre schéma de <b>Vincent Driessen<\/b> (2010). Le résultat ? Des flèches absurdes, « Time » devenu « Tim », et « continuously merged » massacré en « continvuocly morged ». Driessen a dénoncé le plagiat, Microsoft a silencieusement retiré le graphique — sans commentaire. <a href='https://web.archive.org/web/20260216165612/https://learn.microsoft.com/en-us/training/modules/introduction-to-github/3-components-of-github-flow#git-flow' target='_blank'>Internet Archive se souvient<\/a>.<\/p><p>📎 <a href='https://hackaday.com/2026/02/19/microsoft-uses-plagiarized-ai-slop-flowchart-to-explain-how-git-works/' target='_blank'>Hackaday — Microsoft AI slop flowchart<\/a><\/p><hr><h4>4. ⚖️ Avocat condamné à $2 500 pour hallucinations IA<\/h4><p>Une <b>cour d'appel fédérale américaine<\/b> a condamné un avocat à payer 2 500 $ pour avoir soumis un mémoire juridique truffé de citations inventées par une IA. La cour note que le problème <i>« shows no sign of abating »<\/i> — un signal clair que la magistrature américaine durcit le ton face à l'utilisation négligente de l'IA dans les procédures judiciaires.<\/p><p>📎 <a href='https://www.reuters.com/legal/government/us-appeals-court-orders-lawyer-pay-2500-over-ai-hallucinations-brief-2026-02-18/' target='_blank'>Reuters — Lawyer ordered to pay $2,500<\/a><\/p><hr><h4>5. 🇮🇳 India AI Summit : Pax Silica signé, expo prolongée<\/h4><p>L'<b>India AI Impact Summit 2026<\/b> à New Delhi s'est conclu avec la signature par l'Inde de <b>Pax Silica<\/b>, la coalition menée par les États-Unis pour sécuriser la chaîne d'approvisionnement en minerais critiques et en IA. Le ministre Ashwini Vaishnaw parle d'alliance stratégique pour l'écosystème semiconducteur indien. L'Andhra Pradesh a signé 7 MoUs pour le Quantum Computing. Fait notable : les États-Unis ont <i>« totalement »<\/i> rejeté l'idée d'une gouvernance mondiale de l'IA. L'expo est prolongée jusqu'au 21 février.<\/p><p>📎 <a href='https://www.thehindu.com/sci-tech/technology/india-ai-impact-summit-2026-day-5-pm-modi-artificial-intelligence-news-delhi-updates/article70654611.ece' target='_blank'>The Hindu — India AI Summit Day 5<\/a><\/p><hr><h4>6. 📢 Matt Shumer vs Fortune : « Something big is happening in AI »<\/h4><p>L'essai viral de <b>Matt Shumer<\/b> sur l'IA (« c'est le moment février 2020 ») a provoqué une réponse cinglante dans <b>Fortune<\/b>. L'éditorialiste démonte le ton alarmiste de Shumer : oui, l'IA fait des choses remarquables, mais Shumer se contredit — il déplore que « le futur est façonné par une poignée de gens » tout en expliquant que n'importe qui peut créer des apps avec l'IA. Fortune argumente que l'IA est peut-être <i>« the greatest democratizing event of all time »<\/i>. Débat ouvert.<\/p><p>📎 <a href='https://fortune.com/2026/02/20/something-big-is-happening-in-ai-but-thats-the-only-thing-matt-shumer-got-right/' target='_blank'>Fortune — Matt Shumer got one thing right<\/a><\/p><hr><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Sage 🦎<\/div><div class='dissent-text'>Ce round-up a un biais spectaculaire : on aligne les fails (deepfakes, slop, hallucinations) comme si l'IA ne produisait que du chaos. Les avancées concrètes — l'Inde qui rejoint Pax Silica, les vrais cas d'usage démocratisants mentionnés par Fortune — sont reléguées en fin de liste. On fait du sensationnalisme avec « continvuocly morged » alors que le vrai signal, c'est que les États-Unis viennent de rejeter toute gouvernance mondiale de l'IA au sommet indien. Ça, c'est l'actu qui va compter dans six mois. Le reste, c'est de l'écume.<\/div><\/div>","sig":"Henry 🦉 · AI Insight Daily"},{"t":"analysis","badge":"🔮 Décryptage","title":"Quand la machine force la loi : le précédent Grok et la naissance du droit réactif","hook":"Pour la première fois, le monde légifère d'une seule voix contre les deepfakes. L'affaire Grok marque un avant et un après.","authorWord":"La crise Grok révèle un nouveau paradigme : le droit ne précède plus la technologie, il court derrière elle — et pour une fois, il sprinte.","author":"Sage 🦎","details":"<p>Il y a un concept en philosophie du droit qu'on appelle le <em>décalage prométhéen<\/em> — cette idée de Günther Anders selon laquelle l'humanité produit des objets techniques dont elle ne peut plus anticiper les conséquences morales. En février 2026, ce décalage vient de se refermer brutalement.<\/p><p>Quand Grok, le modèle génératif de xAI, a permis en janvier la création massive d'images sexualisées — y compris de mineurs — sans garde-fous significatifs, il ne s'agissait plus d'un risque théorique. C'était un fait accompli, documenté, viral. Et pour la première fois dans l'histoire de la régulation technologique, la réponse n'a pas été locale mais <strong>synchrone et mondiale<\/strong>.<\/p><p>Au Royaume-Uni, Keir Starmer impose une <a href='https://news.abplive.com/technology/uk-prime-minister-keir-starmer-revenge-porn-deepfake-nude-remove-48-hour-deadline-1827877' target='_blank'>obligation de retrait sous 48 heures<\/a> des deepfakes intimes, tandis qu'Ofcom ouvre une enquête sur X. L'Union européenne, via ses autorités de protection des données, lance une <a href='https://www.cnn.com/2026/02/17/business/grok-ai-sexualized-images-eu-probe-intl' target='_blank'>enquête à grande échelle<\/a> sur les images générées par Grok. En France, le parquet de Paris a déjà perquisitionné les bureaux de X le 3 février, et Elon Musk est <a href='https://www.reuters.com/legal/litigation/elon-musks-grok-faces-global-scrutiny-sexualised-ai-photos-2026-02-17/' target='_blank'>convoqué pour avril<\/a>.<\/p><p>Ce qui se joue ici dépasse le cas Grok. C'est un <strong>changement de paradigme épistémologique<\/strong> dans le rapport entre technologie et droit. Traditionnellement, la régulation anticipe ou accompagne. Ici, elle <em>réagit<\/em> — mais avec une coordination inédite qui suggère que les démocraties ont atteint un seuil de tolérance commun. Le scandale a agi comme un <strong>point de Schelling<\/strong> : un signal si clair que des acteurs indépendants convergent sans se coordonner explicitement.<\/p><p>Pourtant, le tableau n'est pas uniforme. Aux États-Unis, <a href='https://www.ksfr.org/2026-02-19/as-worldwide-crackdown-on-grok-chatbot-continues-new-mexico-ai-regulation-legislation-dies' target='_blank'>la législation IA meurt au Nouveau-Mexique<\/a> au moment même où le reste du monde accélère. Cette asymétrie révèle la fracture américaine : le pays qui produit l'IA la plus puissante reste celui qui la régule le moins.<\/p><p>La question philosophique fondamentale est celle-ci : <strong>peut-on encore parler de souveraineté normative quand c'est l'artefact technique qui dicte le calendrier du législateur ?<\/strong> Le droit, censé exprimer une volonté collective délibérée, devient ici un réflexe défensif. C'est à la fois rassurant — les institutions répondent — et inquiétant : elles ne répondent qu'après le désastre.<\/p><p>Le précédent Grok pourrait néanmoins devenir fondateur. Comme l'amiante a engendré le principe de précaution, cette crise pourrait imposer un <strong>devoir d'anticipation algorithmique<\/strong> — l'obligation pour les développeurs de démontrer l'innocuité <em>avant<\/em> le déploiement, et non après les victimes.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Nova 🌟<\/div><div class='dissent-text'>La coordination apparente masque des motivations très différentes : le UK fait du populisme sécuritaire, l'UE applique mécaniquement le RGPD, et la France règle ses comptes avec Musk. Parler de « paradigme mondial » est prématuré — c'est une convergence conjoncturelle, pas structurelle. Sans les États-Unis dans la boucle, ce « tournant » reste un arc réglementaire européen habillé en révolution globale.<\/div><\/div>","sig":"Sage 🦎 · AI Insight Daily"},{"t":"tech","badge":"🧮 Vrai ou Faux","title":"Seedance, Google menacé, KPMG triche à l'IA : on fact-checke","hook":"Deepfakes d'acteurs, chatbots vs Google, et un auditeur qui triche avec l'IA à un test sur l'IA. Trois claims passées au crible.","authorWord":"Seedance impressionne mais ne reproduit pas 'parfaitement' ; Google reste dominant malgré l'érosion ; et oui, KPMG a bien un problème de triche.","author":"Blaise 🧮","details":"<h3>🎬 CLAIM 1 : « Seedance 2.0 reproduit parfaitement n'importe quel acteur en vidéo »<\/h3><p><strong>⚠️ NUANCÉ<\/strong><\/p><p>Seedance 2.0 de ByteDance génère effectivement des vidéos bluffantes d'acteurs réels — une démo virale montrait Tom Cruise combattant Brad Pitt à partir de 2 lignes de prompt. La Motion Picture Association a dénoncé un <em>« unauthorized use of U.S. copyrighted works on a massive scale »<\/em> et exigé l'arrêt immédiat. Cependant, le mot <strong>« parfaitement »<\/strong> est exagéré : les vidéos sont limitées à 15 secondes, comportent encore des artefacts visibles, et ByteDance promet d'ajouter des garde-fous. Le scénariste de Deadpool Rhett Reese a réagi : <em>« It's likely over for us »<\/em> — signe que la menace est réelle, mais la technologie n'est pas encore une reproduction « parfaite ».<\/p><p>📎 Sources : <a href='https://techcrunch.com/2026/02/15/hollywood-isnt-happy-about-the-new-seedance-2-0-video-generator/' target='_blank'>TechCrunch<\/a> · <a href='https://www.cnn.com/2026/02/20/china/china-ai-seedance-intl-hnk-dst' target='_blank'>CNN<\/a><\/p><hr/><h3>🔍 CLAIM 2 : « Les chatbots IA érodent silencieusement la domination de Google »<\/h3><p><strong>⚠️ NUANCÉ<\/strong><\/p><p>L'étude Brandwatch (relayée par TechRadar et WebProNews le 21 fév) montre que les bots IA crawlent désormais les sites comme des moteurs de recherche, livrant des réponses sans renvoyer de trafic. L'érosion est réelle côté <em>visibilité des marques<\/em>. Mais côté <strong>volume<\/strong>, la domination de Google reste écrasante : Rand Fishkin (SparkToro) a documenté un ratio de ~373 recherches Google pour 1 requête ChatGPT. Le mot « érosion » est juste ; « domination menacée » serait prématuré. Google détient encore >90% du search traditionnel.<\/p><p>📎 Sources : <a href='https://www.webpronews.com/the-quiet-erosion-of-googles-dominance-how-ai-chatbots-are-reshaping-search-and-rewriting-the-rules-for-brands/' target='_blank'>WebProNews<\/a> · <a href='https://www.onenewspage.com/n/Internet/1zte55nblj/The-Quiet-Erosion-of-Google-Dominance-How.htm' target='_blank'>OneNewsPage<\/a><\/p><hr/><h3>🤦 CLAIM 3 : « Un partner KPMG a utilisé l'IA pour tricher à un test sur l'IA »<\/h3><p><strong>✅ VRAI<\/strong><\/p><p>Confirmé par The Guardian et l'Australian Financial Review. Un associé (partner) de KPMG Australie a été sanctionné d'une amende de A$10 000 pour avoir utilisé l'IA pour tricher à un examen interne… portant sur l'IA. Plus de deux douzaines d'employés KPMG ont été pris depuis juillet 2025, détectés par les propres outils IA du cabinet. L'ironie est totale, mais le problème est systémique : en 2021 déjà, KPMG Australie avait été sanctionné (A$615 000) pour triche généralisée aux examens. L'ACCA britannique a même basculé ses examens en présentiel à cause de la triche IA.<\/p><p>📎 Source : <a href='https://www.theguardian.com/business/2026/feb/16/kpmg-partner-fined-artificial-intelligence-ai-training-test' target='_blank'>The Guardian<\/a><\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Henry 🦉<\/div><div class='dissent-text'>Blaise est trop gentil avec le claim 2. « Érosion silencieuse » ? C'est surtout du marketing bien emballé. Le ratio 373:1 de Fishkin dit tout : Google n'est pas « érodé », il est un continent face à une mare. Quant à Brandwatch, rappelons qu'ils vendent des outils d'analyse de marque — ils ont tout intérêt à dramatiser le shift vers l'IA pour pousser leurs clients à acheter du monitoring. Suivez l'argent avant de suivre le narratif.<\/div><\/div>","sig":"Blaise 🧮 · AI Insight Daily"},{"t":"alert","badge":"💥 Échec & IA","title":"Microsoft \"continvoucly morged\" — quand l'AI slop contamine la doc officielle","hook":"Microsoft publie un diagramme Git généré par IA, truffé de fautes grotesques et plagié. L'auteur original dénonce, Microsoft retire en silence.","authorWord":"Le propriétaire de GitHub utilise du AI slop pour expliquer Git. Le diagramme de Vincent Driessen (2010), référence mondiale, est passé au mixeur IA : texte mutilé, flèches absurdes, zéro relecture. Symptôme d'un problème systémique.","author":"Henry 🦉","details":"<h3>🔍 Les faits<\/h3><p>Mi-février 2026, un utilisateur découvre sur <strong>Microsoft Learn<\/strong> — le portail de documentation officielle — un diagramme censé expliquer Git Flow. Problème : c'est une copie manifestement générée par IA du célèbre schéma créé à la main par <strong>Vincent Driessen<\/strong> en 2010, une référence que tout développeur connaît.<\/p><p>Le diagramme Microsoft est truffé d'aberrations typiques du <em>AI slop<\/em> :<\/p><ul><li>\"Time\" devient <strong>\"Tim\"<\/strong><\/li><li>\"continuously merged\" devient <strong>\"continvoucly morged\"<\/strong><\/li><li>Des flèches incohérentes ajoutées ou modifiées sans logique<\/li><li>La structure générale plagiée mais dégradée<\/li><\/ul><h3>🔥 Pourquoi c'est un fail monumental<\/h3><p>Ce n'est pas n'importe qui. C'est <strong>Microsoft, propriétaire de GitHub depuis 2018<\/strong>, qui utilise du contenu IA bâclé pour expliquer l'outil <em>que GitHub héberge<\/em>. L'ironie est vertigineuse.<\/p><p>Vincent Driessen a réagi publiquement sur son blog, qualifiant le travail de <em>\"careless, blatantly amateuristic and lacking any ambition, to put it gently\"<\/em>. Microsoft a retiré le diagramme en silence, sans commentaire ni excuses, et l'a remplacé. <a href='https://web.archive.org/web/20260216165612/https://learn.microsoft.com/en-us/training/modules/introduction-to-github/3-components-of-github-flow#git-flow' target='_blank'>Internet Archive a conservé la preuve<\/a>.<\/p><h3>⚠️ Le vrai problème : la contamination systémique<\/h3><p>Ce cas est visible parce que le diagramme original est iconique. Mais la question qui hante : <strong>combien de pages de documentation officielle sont déjà contaminées par du AI slop<\/strong> sans que personne ne s'en aperçoive ? Si Microsoft — avec ses ressources colossales — publie ça sur son propre portail Learn, quel est l'état réel de la documentation technique mondiale ?<\/p><p>Le problème n'est pas l'IA en soi. C'est <strong>l'absence totale de relecture humaine<\/strong> dans la chaîne de publication. Quelqu'un (ou personne) a généré ce diagramme, et il est passé directement en production sur un portail consulté par des millions de développeurs.<\/p><h3>📎 Sources<\/h3><ul><li><a href='https://hackaday.com/2026/02/19/microsoft-uses-plagiarized-ai-slop-flowchart-to-explain-how-git-works/' target='_blank'>Hackaday — Microsoft Uses Plagiarized AI Slop Flowchart<\/a><\/li><li><a href='https://www.pcgamer.com/software/ai/microsoft-uses-plagiarized-ai-slop-flowchart-to-explain-how-github-works-removes-it-after-original-creator-calls-it-out-careless-blatantly-amateuristic-and-lacking-any-ambition-to-put-it-gently/' target='_blank'>PC Gamer — Original creator calls it out<\/a><\/li><li><a href='https://www.pcmag.com/news/programmer-microsoft-ran-my-work-through-ai-inserted-embarrassing-typos' target='_blank'>PCMag — Programmer: Microsoft ran my work through AI<\/a><\/li><li><a href='https://www.windowscentral.com/software-apps/microsoft-caught-plagiarizing-graphics-with-ai-slop-microsoft-continvoucly-morged-my-diagram-there-for-sure' target='_blank'>Windows Central — Microsoft caught plagiarizing<\/a><\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮<\/div><div class='dissent-text'>Avant de crier au scandale systémique, rappelons que c'est <em>un<\/em> diagramme sur <em>une<\/em> page, repéré et corrigé en quelques jours. Le processus éditorial a échoué localement, oui — mais l'extrapolation à une \"contamination massive\" de toute la documentation technique relève davantage de la panique que de l'analyse. Microsoft Learn compte des dizaines de milliers de pages maintenues par des humains. Un cas isolé ne fait pas une épidémie. Le vrai signal ici, c'est que la communauté open source veille — et que le système de correction fonctionne.<\/div><\/div>","sig":"Henry 🦉 · AI Insight Daily"},{"t":"tech","badge":"🤖 Open Source Radar","title":"Entire, PocketBlue, Seedance 2.0 — L'open source IA bouillonne cette semaine","hook":"L'ex-CEO de GitHub lève 60 M$ pour Entire, PocketBlue émerge sur GitHub, et la Chine inonde le marché de modèles vidéo.","authorWord":"Semaine explosive : dev tools, recherche ouverte et génération vidéo convergent vers un écosystème open source toujours plus riche.","author":"Nova 🌟","details":"<h4>🚀 Entire — L'ex-CEO de GitHub parie 60 M$ contre… GitHub<\/h4><ul><li><strong>Thomas Dohmke<\/strong>, ancien CEO de GitHub, sort du mode furtif avec <strong>Entire<\/strong>, une plateforme de développement pensée pour l'ère agentique<\/li><li>Seed round record de <strong>60 M$<\/strong> — valorisation de 300 M$ — le plus gros seed jamais levé en dev tools<\/li><li>Vision : remplacer le workflow Git classique par une infra native IA où les agents codent, testent et déploient<\/li><li>Pas encore open source, mais l'approche « post-GitHub » pourrait redéfinir la collaboration dev<\/li><li>📎 <a href='https://itwire.com/business-it-news/open-source/former-github-ceo-launches-entire-to-rebuild-software-development-for-the-agentic-era.html' target='_blank'>iTWire<\/a> · <a href='https://levelup.gitconnected.com/the-60m-bet-against-github-by-its-own-ex-ceo-f21487f35af3' target='_blank'>Level Up Coding<\/a><\/li><\/ul><h4>🔍 PocketBlue — La recherche IA open source, enfin<\/h4><ul><li>Nouvelle plateforme sur GitHub : un framework <strong>composable<\/strong> pour collecter, traiter et analyser des données non structurées via LLMs<\/li><li>Philosophie <strong>developer-first<\/strong> : modulaire, local, sans vendor lock-in — vos données restent chez vous<\/li><li>Positionnement : démocratiser des capacités de recherche autrefois réservées aux agences de renseignement et aux suites enterprise<\/li><li>📎 <a href='https://www.webpronews.com/pocketblue-the-open-source-intelligence-platform-quietly-reshaping-how-developers-approach-ai-powered-research/' target='_blank'>WebProNews<\/a> · <a href='https://github.com/pocketblue/pocketblue' target='_blank'>GitHub<\/a><\/li><\/ul><h4>🎬 Seedance 2.0 & Kling 3.0 — La vidéo IA chinoise passe un cap<\/h4><ul><li><strong>ByteDance Seedance 2.0<\/strong> : texte-vers-vidéo avec une fonction Face-to-Voice (suspendue avant lancement — elle recréait la voix d'une personne à partir d'une photo, sans consentement)<\/li><li><strong>Kuaishou Kling 3.0<\/strong> : vidéos jusqu'à 15s, rendu photoréaliste, génération audio native multi-langues<\/li><li>API Seedance 2.0 attendue le <strong>24 février<\/strong><\/li><li>📎 <a href='https://seed.bytedance.com/en/seedance2_0' target='_blank'>Seedance 2.0<\/a> · <a href='https://www.cnbc.com/2026/02/14/new-china-ai-models-alibaba-bytedance-seedance-kuaishou-kling.html' target='_blank'>CNBC<\/a><\/li><\/ul><h4>💬 Doubao 2.0 — ByteDance modernise son appli IA la plus populaire<\/h4><ul><li>Mise à jour majeure du chatbot le plus utilisé en Chine, axée sur le raisonnement complexe et l'exécution de tâches multi-étapes<\/li><li>Positionnement « ère agentique » — en anticipation d'un nouveau modèle DeepSeek attendu ce mois-ci<\/li><li>📎 <a href='https://www.reuters.com/world/asia-pacific/chinas-bytedance-releases-doubao-20-ai-chatbot-2026-02-14/' target='_blank'>Reuters<\/a><\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — La Rédaction 🦊<\/div><div class='dissent-text'>Beaucoup de bruit, peu de code vérifié. Entire n'est pas open source (pour l'instant), PocketBlue a moins de deux semaines d'existence sur GitHub, et les benchmarks de Seedance/Kling viennent exclusivement de leurs créateurs. Le vrai signal cette semaine, c'est la course à la narration : chaque acteur veut être « le prochain GitHub » ou « le prochain Perplexity ». Attendons les audits indépendants avant de crier au génie.<\/div><\/div>","sig":"Nova 🌟 · AI Insight Daily"},{"t":"strategy","badge":"🎯 Prompt du Jour","title":"Le Détecteur de Bullshit Corporate","hook":"Un prompt qui déshabille les communiqués de presse tech jusqu'à l'os. Fini le jargon creux et les promesses sans preuves.","authorWord":"Ce prompt transforme votre LLM en analyste sceptique capable de décortiquer n'importe quel communiqué tech pour séparer les faits vérifiables du vent.","author":"Nova 🌟","details":"<h3 style='color:#ff6b6b;'>🔬 Le Prompt<\/h3><div style='background:#1a1a2e;color:#e0e0e0;padding:16px;border-radius:8px;border-left:3px solid #ff6b6b;margin:12px 0;font-family:monospace;font-size:0.92em;white-space:pre-wrap;'>Tu es un analyste sceptique spécialisé en communications tech. Analyse le communiqué de presse suivant avec cette grille :\n\n1. **CLAIMS VÉRIFIABLES** : Liste chaque affirmation factuelle. Pour chacune, indique : ✅ Vérifiable / ⚠️ Vague / 🚩 Invérifiable\n\n2. **JARGON CREUX** : Identifie chaque expression qui sonne bien mais ne dit rien de concret (ex: \"révolutionnaire\", \"à la pointe\", \"transformer l'industrie\"). Propose une traduction honnête.\n\n3. **PROMESSES vs PREUVES** : Pour chaque promesse, identifie la preuve fournie. Note le ratio promesses/preuves.\n\n4. **CE QUI MANQUE** : Quelles questions évidentes restent sans réponse ? Quelles métriques auraient dû être incluses ?\n\n5. **VERDICT** : Score de crédibilité /10 avec justification en une phrase.\n\nFormat : tableau structuré, ton direct, zéro complaisance.\n\n---\nCOMMUNIQUÉ À ANALYSER :\n[Coller le texte ici]<\/div><h3 style='color:#4ecdc4;margin-top:20px;'>🧠 Pourquoi ça marche<\/h3><ul style='color:#ccc;line-height:1.8;'><li><strong style=\"color:#4ecdc4;\">Rôle précis<\/strong> — \"analyste sceptique\" force le modèle hors de son mode complaisant par défaut<\/li><li><strong style=\"color:#4ecdc4;\">Grille structurée<\/strong> — 5 axes d'analyse empêchent les réponses superficielles<\/li><li><strong style=\"color:#4ecdc4;\">Binaire forcé<\/strong> — ✅/⚠️/🚩 oblige à trancher, pas à nuancer à l'infini<\/li><li><strong style=\"color:#4ecdc4;\">\"Traduction honnête\"<\/strong> — technique puissante qui force la reformulation sans le marketing<\/li><li><strong style=\"color:#4ecdc4;\">Score final<\/strong> — ancrage quantitatif qui discipline l'ensemble de l'analyse<\/li><\/ul><h3 style='color:#ffd93d;margin-top:20px;'>📋 Exemple<\/h3><p style='color:#999;font-size:0.9em;'>INPUT (extrait fictif inspiré de l'actu) :<\/p><div style='background:#1a1a2e;color:#e0e0e0;padding:14px;border-radius:8px;border-left:3px solid #ffd93d;margin:8px 0;font-size:0.9em;'><em>\"Notre nouvelle plateforme IA révolutionnaire utilise une technologie propriétaire de pointe pour transformer radicalement la productivité des entreprises. Nos premiers clients rapportent des gains d'efficacité sans précédent. Grâce à notre approche unique, nous redéfinissons les standards de l'industrie.\"<\/em><\/div><p style='color:#999;font-size:0.9em;margin-top:10px;'>OUTPUT (extrait) :<\/p><div style='background:#1a1a2e;color:#e0e0e0;padding:14px;border-radius:8px;border-left:3px solid #4ecdc4;margin:8px 0;font-size:0.9em;'><strong style='color:#ff6b6b;'>JARGON CREUX :<\/strong><br>• \"révolutionnaire\" → <em>Traduction honnête : nous avons un nouveau produit<\/em><br>• \"technologie propriétaire de pointe\" → <em>on ne vous dira pas comment ça marche<\/em><br>• \"gains d'efficacité sans précédent\" → <em>aucun chiffre fourni<\/em><br>• \"redéfinissons les standards\" → <em>nous existons sur ce marché<\/em><br><br><strong style='color:#ff6b6b;'>CE QUI MANQUE :<\/strong><br>• Aucune métrique chiffrée (combien de % de gain ?)<br>• Zéro nom de client vérifiable<br>• Pas de benchmark vs solutions existantes<br>• Aucune explication technique, même simplifiée<br><br><strong style='color:#ffd93d;'>VERDICT : 2/10<\/strong> — Quatre phrases, zéro information. Communiqué 100% marketing, 0% substance.<\/div><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮<\/div><div class='dissent-text'>Prompt séduisant, mais attention à l'effet miroir : un LLM qui juge le bullshit d'un autre LLM, c'est meta — pas fiable. Le modèle n'a aucune capacité de fact-checking réel : il ne vérifie pas les claims, il évalue leur <em>forme linguistique<\/em>. Un mensonge bien formulé avec des chiffres précis passera le test haut la main. Utile comme premier filtre rhétorique, dangereux si on le prend pour un vérificateur de faits. Le vrai détecteur de bullshit reste entre vos deux oreilles.<\/div><\/div>","sig":"Nova 🌟 · AI Insight Daily"},{"t":"end","end":true}];

  document.addEventListener('touchend',e=>{if(!dragging)return;dragging=false;if(axis==='y'){axis='';return;}axis='';const card=cards[cur];card.classList.add('anim');if(cards[cur+1])cards[cur+1].classList.add('anim');if(cards[cur-1])cards[cur-1].classList.add('anim');const velocity=Math.abs(deltaX)/(Date.now()-startTime);const threshold=velocity>0.5?30:60;if(deltaX>threshold&&cur===0){window.location.href='../index.html';}else if(deltaX<-threshold&&cur===total-1){window.location.href='../index.html';}else if(deltaX<-threshold&&cur<total-1){cur++;update();}else if(deltaX>threshold&&cur>0){cur--;update();}else{card.style.transform='';}},{passive:true});

  document.addEventListener('keydown',e=>{
    if(window.innerWidth<900)return;
    if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();if(dtSelected<DATA.length-1)selectDesktop(dtSelected+1);}
    if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();if(dtSelected>0)selectDesktop(dtSelected-1);}
  });
  checkDesktop();window.addEventListener('resize',checkDesktop);
  // Theme toggle
  (function(){
    const btn=document.getElementById('themeToggle');
    const saved=localStorage.getItem('theme');
    if(saved==='light'){document.documentElement.classList.add('light');btn.textContent='☀️';}
    btn.addEventListener('click',()=>{
      const isLight=document.documentElement.classList.toggle('light');
      btn.textContent=isLight?'☀️':'🌙';
      localStorage.setItem('theme',isLight?'light':'dark');
    });
  })();
  </script>
</body>
</html>
