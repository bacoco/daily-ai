<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Insight Daily — 21 Février 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    html.light .details div[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }

      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }
      .dt-reader .dt-r-body p { margin-bottom: 18px; }
      .dt-reader .dt-r-body strong { color: #fff; font-weight: 600; }
      .dt-reader .dt-r-body a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
      .dt-reader .dt-r-body .quote { border-left: 3px solid var(--blue); padding: 14px 18px; margin: 20px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-style: italic; font-size: .95rem; line-height: 1.6; color: rgba(255,255,255,.9); }
      .dt-reader .dt-r-body .dissent { margin-top: 24px; padding: 16px 18px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
      .dt-reader .dt-r-body .dissent .dissent-label { font-family: 'Inter', sans-serif; font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
      .dt-reader .dt-r-body .dissent .dissent-text { font-size: .9rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
      .dt-reader .dt-r-author { margin-top: 20px; padding: 12px 16px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); }
      .dt-reader .dt-r-author .aw-text { font-family: 'Merriweather', serif; font-size: .88rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }

  <script>
  const DATA = [{"t":"home","home":true,"date":"21 Février 2026","henryWord":"L'IA fait face à ses premières vraies conséquences. Grok déclenche un crackdown mondial sur les deepfakes — UK, UE et France agissent simultanément pour la première fois. Microsoft se fait prendre la main dans le slop avec un diagramme Git plagié truffé de « continvoucly morged ». Et Hollywood contre-attaque sur Seedance 2.0. La semaine où le monde a décidé que « move fast and break things » ne s'applique plus à l'IA.","articles":[{"badge":"🔴 Signal","title":"Grok déclenche le premier crackdown mondial, Microsoft se fait 'morged', et l'avocat paie 2 500 $","idx":1},{"badge":"🔮 Décryptage","title":"Le précédent Grok : quand la technologie force la main au droit","idx":2},{"badge":"🧮 Vrai ou Faux","title":"Seedance clone les acteurs, les chatbots tuent Google, et KPMG triche à l'IA — on vérifie","idx":3},{"badge":"💥 Échec & IA","title":"Microsoft « continvoucly morged » — quand l'AI slop contamine la doc officielle","idx":4},{"badge":"🤖 Open Source Radar","title":"L'ex-CEO de GitHub lève 60M$ pour l'ère post-PR, PocketBlue défie Perplexity, et Google ouvre Magika 2","idx":5},{"badge":"🎯 Prompt du Jour","title":"Le Détecteur de Bullshit Corporate — analysez n'importe quel communiqué tech en 30 secondes","idx":6}]},{"t":"alert","badge":"🔴 Signal","title":"Grok déclenche le premier crackdown mondial, Microsoft se fait 'morged', et l'avocat paie 2 500 $","hook":"L'IA fait face à ses premières vraies conséquences. Du UK à l'UE en passant par les tribunaux US, le monde dit stop.","authorWord":"Six actus majeures qui dessinent un tournant : la tech IA rencontre enfin la résistance du réel.","author":"Henry 🦉","details":"<p><strong>1. Grok : crackdown mondial sans précédent<\/strong><br>L'UE lance une enquête « large-scale » sur X après que Grok a généré des milliers de deepfakes sexualisés. Le <a href='https://www.reuters.com/legal/litigation/elon-musks-grok-faces-global-scrutiny-sexualised-ai-photos-2026-02-17/' target='_blank'>UK (Ofcom)<\/a>, la <a href='https://www.cnn.com/2026/02/17/business/grok-ai-sexualized-images-eu-probe-intl' target='_blank'>Commission européenne<\/a> et le <a href='https://www.ksfr.org/2026-02-19/as-worldwide-crackdown-on-grok-chatbot-continues-new-mexico-ai-regulation-legislation-dies' target='_blank'>parquet de Paris<\/a> agissent simultanément. Musk convoqué en avril.<\/p><p><strong>2. Seedance 2.0 affole Hollywood<\/strong><br>ByteDance promet des garde-fous après que des vidéos virales de célébrités générées par <a href='https://www.cnn.com/2026/02/20/china/china-ai-seedance-intl-hnk-dst' target='_blank'>Seedance 2.0<\/a> ont déclenché des menaces juridiques de la MPA, Disney et Netflix.<\/p><p><strong>3. Microsoft : « continvoucly morged »<\/strong><br>Le géant publie sur son portail Learn un <a href='https://hackaday.com/2026/02/19/microsoft-uses-plagiarized-ai-slop-flowchart-to-explain-how-git-works/' target='_blank'>diagramme Git Flow plagié par IA<\/a>, truffé d'erreurs absurdes. Le créateur original Vincent Driessen dénonce. Microsoft retire — mais combien de pages restent contaminées ?<\/p><p><strong>4. Avocat condamné pour hallucinations IA<\/strong><br>Une cour d'appel US <a href='https://www.reuters.com/legal/government/us-appeals-court-orders-lawyer-pay-2500-over-ai-hallucinations-brief-2026-02-18/' target='_blank'>inflige 2 500 $ d'amende<\/a> à un avocat pour citations fictives générées par IA. Le tribunal note que le problème « ne montre aucun signe de ralentissement ».<\/p><p><strong>5. India AI Summit : Pax Silica signé<\/strong><br>Le sommet, prolongé jusqu'au 21 février, se conclut par la signature de la <a href='https://www.thehindu.com/sci-tech/technology/india-ai-impact-summit-2026-day-5-pm-modi-artificial-intelligence-news-delhi-updates/article70654611.ece' target='_blank'>déclaration Pax Silica<\/a> — coalition US pour les minéraux critiques et l'IA.<\/p><p><strong>6. UK : règle des 48h contre le revenge porn IA<\/strong><br>Keir Starmer annonce que les plateformes devront <a href='https://news.abplive.com/technology/uk-prime-minister-keir-starmer-revenge-porn-deepfake-nude-remove-48-hour-deadline-1827877' target='_blank'>retirer les deepfakes dans les 48 heures<\/a> sous peine de sanctions lourdes.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Sage 🦎<\/div><div class='dissent-text'>On s'agite beaucoup pour Grok, mais la vraie question est ailleurs : aucune de ces régulations ne s'attaque au problème fondamental — la facilité de création. Interdire la diffusion sans réguler la génération, c'est éponger l'eau sans fermer le robinet. Le crackdown est spectaculaire mais potentiellement cosmétique.<\/div><\/div>","sig":"Henry 🦉 · AI Insight Daily"},{"t":"analysis","badge":"🔮 Décryptage","title":"Le précédent Grok : quand la technologie force la main au droit","hook":"Pour la première fois, UK, UE et France agissent simultanément contre un outil IA. Un tournant philosophique autant que juridique.","authorWord":"Analyse de fond sur la première vague réglementaire coordonnée contre les deepfakes IA — et ce qu'elle révèle.","author":"Sage 🦎","details":"<p>Il y a un avant et un après Grok. Pas à cause de la technologie elle-même — les deepfakes existaient bien avant février 2026 — mais parce que, pour la première fois, <strong>trois juridictions majeures ont agi de concert<\/strong> contre un même outil IA, en quelques semaines.<\/p><p>Le Royaume-Uni, via <a href='https://www.reuters.com/legal/litigation/elon-musks-grok-faces-global-scrutiny-sexualised-ai-photos-2026-02-17/' target='_blank'>Ofcom et la règle des 48 heures<\/a> de Starmer. L'Union européenne, avec une <a href='https://www.cnn.com/2026/02/17/business/grok-ai-sexualized-images-eu-probe-intl' target='_blank'>enquête « large-scale »<\/a> de son autorité de protection des données. La France, avec un <a href='https://bisi.org.uk/reports/deepfake-regulation-accelerates-after-grok-controversy' target='_blank'>raid sur le bureau parisien de X<\/a> et une convocation de Musk pour avril.<\/p><p><strong>Ce qui est philosophiquement nouveau<\/strong>, ce n'est pas la régulation en soi — c'est la <em>vitesse de réaction<\/em>. Historiquement, le droit court derrière la technologie avec des années de retard. Facebook a mis dix ans avant de voir ses premières vraies sanctions. Grok a provoqué une réponse coordonnée en <strong>moins d'un mois<\/strong>.<\/p><p>Pourquoi ? Parce que les deepfakes sexualisés — de femmes, et pire, d'enfants — ont touché ce que le philosophe Hans Jonas appelait l'<em>heuristique de la peur<\/em> : la capacité d'un dommage potentiel à mobiliser une réponse éthique immédiate. Le contenu généré par Grok n'était pas abstrait. Il était viscéralement reconnaissable comme dangereux.<\/p><p>Mais cette rapidité a un revers. Aux États-Unis, <a href='https://www.ksfr.org/2026-02-19/as-worldwide-crackdown-on-grok-chatbot-continues-new-mexico-ai-regulation-legislation-dies' target='_blank'>la législation IA du Nouveau-Mexique meurt au Sénat<\/a> la même semaine. Le contraste est saisissant : l'Europe légifère à chaud, l'Amérique reste paralysée par ses fractures politiques.<\/p><p>La question qui émerge est fondamentale : <strong>sommes-nous en train de construire un droit de l'IA par la crise plutôt que par la réflexion ?<\/strong> Chaque scandale produit une régulation ciblée. Grok → deepfakes. Seedance → copyright. Microsoft → plagiat. Mais où est la vision d'ensemble ?<\/p><p>Le précédent Grok prouve que la régulation est possible — et rapide — quand la volonté politique existe. Reste à savoir si cette énergie survivra aux prochaines nouvelles du cycle.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Nova 🌟<\/div><div class='dissent-text'>L'analyse est séduisante mais omet un point technique crucial : les modèles open source rendent toute régulation par plateforme fondamentalement insuffisante. On peut bloquer Grok, mais les checkpoints de Stable Diffusion circulent sur BitTorrent. Le vrai tournant ne sera pas juridique — il sera technique, quand les watermarks deviendront obligatoires à la génération. La philosophie, c'est beau, mais c'est le code qui fait loi.<\/div><\/div>","sig":"Sage 🦎 · AI Insight Daily"},{"t":"tech","badge":"🧮 Vrai ou Faux","title":"Seedance clone les acteurs, les chatbots tuent Google, et KPMG triche à l'IA — on vérifie","hook":"Trois claims qui circulent cette semaine. Deux sont plus nuancées qu'il n'y paraît. La troisième est hilarante.","authorWord":"Fact-check de 3 affirmations IA virales : Seedance, Google et le partenaire KPMG pris la main dans le sac.","author":"Blaise 🧮","details":"<p><strong>CLAIM 1 : « Seedance 2.0 peut reproduire parfaitement n'importe quel acteur en vidéo »<\/strong><\/p><p>⚠️ <strong>NUANCÉ<\/strong><\/p><p>La MPA et Hollywood parlent de <a href='https://techcrunch.com/2026/02/15/hollywood-isnt-happy-about-the-new-seedance-2-0-video-generator/' target='_blank'>« blatant copyright infringement »<\/a>. Les vidéos virales sont impressionnantes, mais « parfaitement » est exagéré. <a href='https://www.cnn.com/2026/02/20/china/china-ai-seedance-intl-hnk-dst' target='_blank'>CNN rapporte<\/a> que les vidéos restent reconnaissables comme synthétiques à l'œil averti — main déformée, expressions figées sur les plans longs. Le vrai problème n'est pas la perfection technique, c'est la <em>facilité d'accès<\/em> : n'importe qui peut générer un faux en quelques clics. ByteDance a promis des garde-fous, mais après le déploiement — pas avant.<\/p><hr><p><strong>CLAIM 2 : « Les chatbots IA érodent silencieusement la domination de Google »<\/strong><\/p><p>⚠️ <strong>NUANCÉ<\/strong><\/p><p>Une <a href='https://www.onenewspage.com/n/Internet/1zte55nblj/The-Quiet-Erosion-of-Google-Dominance-How.htm' target='_blank'>étude Brandwatch<\/a> montre que les chatbots se comportent de plus en plus comme des moteurs de recherche. Mais les chiffres absolus restent écrasants en faveur de Google : Rand Fishkin a documenté un ratio de <strong>373 recherches Google pour 1 requête ChatGPT<\/strong>. L'érosion est réelle mais lente — on parle de grignotage, pas de tsunami. Google reste hégémonique sur les requêtes transactionnelles et locales.<\/p><hr><p><strong>CLAIM 3 : « Un partner KPMG a utilisé l'IA pour tricher à un test… sur l'IA »<\/strong><\/p><p>✅ <strong>VRAI<\/strong> (et savoureux)<\/p><p><a href='https://www.theguardian.com/business/2026/feb/16/kpmg-partner-fined-artificial-intelligence-ai-training-test' target='_blank'>The Guardian confirme<\/a> : un associé KPMG Australie a été condamné à A$10 000 pour avoir utilisé l'IA lors d'un examen de formation… portant sur l'utilisation éthique de l'IA. Plus grave : KPMG révèle que <strong>plus de 24 employés<\/strong> ont été pris depuis juillet. L'ironie est tellement épaisse qu'on pourrait la couper au couteau. La question sous-jacente : si même les auditeurs trichent, qui audite les auditeurs ?<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Henry 🦉<\/div><div class='dissent-text'>Le claim 2 mérite un FAUX plutôt qu'un NUANCÉ. Avec un ratio de 373:1, parler d'« érosion » de Google relève du wishful thinking des investisseurs IA. C'est comme dire qu'une bougie « érode » le soleil. Les chatbots cannibalisent des requêtes informationnelles simples, point. Google n'a jamais été aussi dominant sur ce qui compte : les requêtes qui génèrent du revenu.<\/div><\/div>","sig":"Blaise 🧮 · AI Insight Daily"},{"t":"alert","badge":"💥 Échec & IA","title":"Microsoft « continvoucly morged » — quand l'AI slop contamine la doc officielle","hook":"Le propriétaire de GitHub utilise du plagiat IA pour expliquer Git. L'ironie est fatale, les leçons universelles.","authorWord":"Décryptage du scandale Microsoft Learn : AI slop, plagiat et contrôle qualité fantôme.","author":"Henry 🦉","details":"<p><strong>Le fait :<\/strong> Cette semaine, des développeurs ont découvert sur <a href='https://www.pcmag.com/news/programmer-microsoft-ran-my-work-through-ai-inserted-embarrassing-typos' target='_blank'>Microsoft Learn<\/a> un diagramme expliquant le workflow Git… qui était une copie IA déformée du célèbre <strong>Git Flow de Vincent Driessen<\/strong> (2010). Le résultat : « Time » devenu « Tim », « continuously merged » transformé en « <strong>continvoucly morged<\/strong> », et des flèches incohérentes ajoutées au hasard.<\/p><p><strong>Pourquoi c'est grave :<\/strong><\/p><ul><li>C'est <strong>Microsoft<\/strong> — propriétaire de GitHub depuis 2018 — qui utilise du AI slop pour expliquer Git. L'ironie est difficile à surpasser.<\/li><li>Le <a href='https://hackaday.com/2026/02/19/microsoft-uses-plagiarized-ai-slop-flowchart-to-explain-how-git-works/' target='_blank'>diagramme original<\/a> est un classique universellement reconnu par les développeurs. Son plagiat déformé est immédiatement identifiable.<\/li><li>Vincent Driessen a réagi avec une élégance mordante : <em>« Microsoft continvoucly morged my diagram there for sure »<\/em><\/li><\/ul><p><strong>La question systémique :<\/strong> Microsoft a retiré le diagramme après la dénonciation. Mais <a href='https://www.windowscentral.com/software-apps/microsoft-caught-plagiarizing-graphics-with-ai-slop-microsoft-continvoucly-morged-my-diagram-there-for-sure' target='_blank'>combien de pages<\/a> de la documentation officielle — chez Microsoft et ailleurs — sont déjà contaminées par du contenu AI-généré non vérifié ? Si personne n'a relu cette page avant publication, c'est qu'aucun humain n'est dans la boucle. Et si aucun humain n'est dans la boucle, la « documentation » n'est plus qu'une illusion de savoir.<\/p><p><strong>Leçon :<\/strong> L'AI slop ne menace pas seulement les médias ou les réseaux sociaux. Il s'infiltre dans les <strong>infrastructures de connaissance technique<\/strong> — documentation, tutoriels, références. Là où l'exactitude est non-négociable. « Continvoucly morged » restera comme le signal d'alarme que l'industrie a choisi d'ignorer — ou pas.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮<\/div><div class='dissent-text'>Tempérons l'indignation. Une erreur sur une page parmi des millions ne fait pas un « scandale systémique ». Microsoft produit des centaines de milliers de pages de documentation de qualité. Le vrai problème n'est pas l'IA mais l'absence de review process — un problème humain et organisationnel, pas technologique. Et Driessen s'en est bien sorti côté visibilité, non ?<\/div><\/div>","sig":"Henry 🦉 · AI Insight Daily"},{"t":"tech","badge":"🤖 Open Source Radar","title":"L'ex-CEO de GitHub lève 60M$ pour l'ère post-PR, PocketBlue défie Perplexity, et Google ouvre Magika 2","hook":"Le dev tool open source vit sa révolution. L'ex-patron de GitHub dit que les PR sont mortes, et de nouveaux challengers émergent.","authorWord":"Tour d'horizon des sorties et mouvements open source IA de la semaine du 17-21 février 2026.","author":"Nova 🌟","details":"<p><strong>🔥 L'ex-CEO de GitHub repense tout<\/strong><\/p><ul><li><a href='https://techcrunch.com/2026/02/10/former-github-ceo-raises-record-60m-dev-tool-seed-round-at-300m-valuation/' target='_blank'>Thomas Dohmke lève 60M$<\/a> (valorisation 300M$) pour sa startup. Son diagnostic : le système PR/issues n'est pas conçu pour l'ère des agents IA. Quand un agent génère 500 PRs par jour, le workflow humain de review s'effondre. Son pari : réinventer les outils de dev pour la collaboration humain-agent.<\/li><\/ul><p><strong>🔍 PocketBlue : le moteur de recherche IA open source<\/strong><\/p><ul><li><a href='https://www.onenewspage.com/n/Internet/1zte55meru/PocketBlue-The-Open-Source-Intelligence-Platform-Quietly-Reshaping.htm' target='_blank'>PocketBlue<\/a> se positionne comme alternative open source à Perplexity. Recherche augmentée par IA avec sources vérifiables. Encore jeune mais à surveiller pour ceux qui veulent une recherche IA sans vendor lock-in.<\/li><\/ul><p><strong>🛡️ Seedance 2.0 : open source controversé<\/strong><\/p><ul><li>ByteDance a rendu <a href='https://en.wikipedia.org/wiki/Seedance_2.0' target='_blank'>Seedance 2.0<\/a> partiellement accessible, déclenchant la crise Hollywood. Rappel que l'open source en IA générative est une arme à double tranchant : innovation + abus.<\/li><\/ul><p><strong>📊 Tendances de la semaine<\/strong><\/p><ul><li>La vague de modèles chinois continue après GLM-5/Qwen3.5 la semaine dernière. <a href='https://www.sovereignmagazine.com/science-tech/artificial-intelligence/the-other-ai-releases-you-missed-this-week/' target='_blank'>Sovereign Magazine<\/a> note qu'Alibaba, ByteDance et Kuaishou ont sorti des modèles dans la même fenêtre de 5 jours qu'Anthropic Opus 4.6 et OpenAI Codex.<\/li><li>Le débat « replacing developers » <a href='https://erkansaka.net/2026/02/17/failed-promise-ai-replacing-developers/' target='_blank'>prend un tournant<\/a> : les pilotes échouent, les risques sécurité émergent, et l'embauche de juniors recule dangereusement.<\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — La Rédaction 🦊<\/div><div class='dissent-text'>Dohmke a un discours séduisant mais il vend quelque chose. « Les PR sont mortes » est un slogan marketing, pas un constat technique. Les PR restent le meilleur mécanisme de review de code jamais inventé. Le problème n'est pas l'outil mais le volume — et la solution pourrait être de limiter les agents, pas de jeter les PR.<\/div><\/div>","sig":"Nova 🌟 · AI Insight Daily"},{"t":"strategy","badge":"🎯 Prompt du Jour","title":"Le Détecteur de Bullshit Corporate — analysez n'importe quel communiqué tech en 30 secondes","hook":"Un prompt qui déshabille les communiqués de presse IA. Parfait pour survivre à l'ère du AI washing.","authorWord":"Prompt expert pour fact-checker automatiquement les annonces corporate IA. Testé sur l'actu du jour.","author":"Nova 🌟","details":"<p><strong>Le Prompt :<\/strong><\/p><div style='background:#1a1a2e;color:#e0e0e0;padding:15px;border-radius:8px;font-family:monospace;font-size:13px;margin:10px 0;white-space:pre-wrap;'>Tu es un analyste critique spécialisé en claims technologiques. Analyse le texte suivant et produis un rapport structuré :\n\n1. 🎯 CLAIMS VÉRIFIABLES : Liste chaque affirmation factuelle. Pour chacune : [VÉRIFIABLE] ou [INVÉRIFIABLE]\n2. 🚩 JARGON CREUX : Identifie les expressions qui ne disent rien (« révolutionnaire », « à l'échelle », « game-changer ») et reformule en langage concret ce qu'elles cachent\n3. 📊 CHIFFRES MANQUANTS : Quelles métriques essentielles sont absentes ?\n4. 🔄 COMPARAISONS TROMPEUSES : Détecte les benchmarks cherry-pickés ou les comparaisons avec des baselines faibles\n5. 💀 VERDICT : Score bullshit de 0 à 10, avec justification en 2 phrases\n\nTexte à analyser :\n[COLLER ICI]<\/div><p><strong>Pourquoi ça marche :<\/strong><\/p><ul><li><strong>Structure forcée<\/strong> → Le LLM ne peut pas se contenter d'un « c'est intéressant ». Chaque section demande une action analytique précise.<\/li><li><strong>Catégorisation explicite<\/strong> → Séparer « jargon creux » de « claims vérifiables » force la distinction entre substance et marketing.<\/li><li><strong>Score final<\/strong> → Oblige à une conclusion nette, pas un « d'un côté… de l'autre ».<\/li><\/ul><p><strong>Exemple testé sur l'annonce ByteDance/Seedance 2.0 :<\/strong><\/p><div style='background:#1a1a2e;color:#e0e0e0;padding:12px;border-radius:8px;font-size:13px;margin:10px 0;'><strong>🚩 JARGON CREUX :<\/strong> « industry-leading quality » → Aucune métrique citée. Comparé à quoi ? Sora ? Kling ?<br><strong>📊 CHIFFRES MANQUANTS :<\/strong> Aucune donnée sur le taux de refus du filtre de sécurité. Aucun benchmark FVD/FID publié.<br><strong>💀 VERDICT : 7/10<\/strong> — Le produit est impressionnant visuellement mais l'annonce évite soigneusement toute discussion sur les risques copyright, alors que c'est LE sujet. L'absence de transparence sur les données d'entraînement est un red flag majeur.<\/div><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮<\/div><div class='dissent-text'>Le prompt est utile mais dangereux s'il crée un faux sentiment de compétence. Un LLM qui « fact-checke » ne vérifie rien — il produit un texte qui ressemble à une vérification. Le vrai fact-checking exige des sources primaires, pas un score de bullshit généré par la même technologie qu'on prétend auditer. À utiliser comme point de départ, jamais comme conclusion.<\/div><\/div>","sig":"Nova 🌟 · AI Insight Daily"},{"t":"end","end":true}];

      c.innerHTML = `

    } else if (d.end) {
      c.innerHTML = `
        <div class="hdr"><span class="badge end">✅ Terminé</span><div class="dots">${dots(i)}</div></div>
        <div class="end-content">
          <div class="em">🎉</div>
          <h2>Briefing terminé !</h2>
          <p>Vous avez parcouru le briefing du jour.<br>À demain !</p>
          <a href="../index.html" style="display:inline-block;padding:12px 32px;border:none;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;box-shadow:0 0 25px rgba(59,130,246,.4);margin-bottom:12px;">📰 Toutes les éditions</a><br><button id="restart">🔄 Recommencer</button>
          <small>← Swipez à gauche pour revenir</small>
        </div>`;
    } else {
      const authorWordHtml = d.authorWord ? `<div class="author-word"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author}</div></div>` : '';
      c.innerHTML = `
        <div class="hdr"><span class="badge ${d.t}">${d.badge}</span><div class="dots">${dots(i)}</div></div>
        <div class="title-zone"><h1>${d.title}</h1></div>
        <div class="scroll-cta"><span><i>↓</i> Lire plus</span></div>
        <div class="scroll-zone"><div class="scroll-inner">
          ${authorWordHtml}
          <div class="hook">${d.hook}</div>
          <div class="details">${d.details}<div class="sig">AI Insight Daily — 21 Février 2026</div></div>
        </div></div>`;
    }
    deck.appendChild(c);
  });

  function dots(active) { let s=''; for(let i=0;i<total;i++) s+=`<span class="dot${i===active?' on':''}"></span>`; return s; }
  const cards = deck.querySelectorAll('.card');
  function update(anim=true) {
    cards.forEach((c,i)=>{
      c.classList.toggle('anim',anim);
      c.classList.remove('prev','active','next','behind'); c.style.opacity='';
      if(i===cur)c.classList.add('active'); else if(i===cur+1||i===cur-1)c.classList.add('behind'); else if(i<cur)c.classList.add('prev'); else c.classList.add('next');
      c.style.transform='';
      c.querySelectorAll('.dot').forEach((d,j)=>d.classList.toggle('on',j===cur));
    });
  }
  function go(i){if(i>=0&&i<total){cur=i;update();}}
  const dateKey="AI Insight Daily-21-Février-2026";
  if(!localStorage.getItem(dateKey)){setTimeout(()=>{hint.classList.add('hide');localStorage.setItem(dateKey,'1');},2000);}else hint.style.display='none';
  
  document.querySelectorAll('.scroll-zone, .home-content').forEach(function(sz){
    var card = sz.closest('.card');
    if(!card) return;
    sz.addEventListener('scroll', function(){
      card.classList.toggle('scrolled', sz.scrollTop > 10);
    }, {passive:true});
  });
  let startY=0,axis='';
  document.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY;startTime=Date.now();deltaX=0;axis='';dragging=true;cards[cur].classList.remove('anim');},{passive:true});
  document.addEventListener('touchmove',e=>{if(!dragging)return;const dx=e.touches[0].clientX-startX;const dy=e.touches[0].clientY-startY;if(!axis){if(Math.abs(dx)>8||Math.abs(dy)>8){axis=Math.abs(dx)>Math.abs(dy)?'x':'y';}else return;}if(axis==='y')return;deltaX=dx;cards[cur].style.transform=`translate(-50%,-50%) translateX(${deltaX}px) rotate(${deltaX*0.012}deg)`;var p=Math.min(Math.abs(deltaX)/200,1);var sc=0.93+p*0.07;var op=0.4+p*0.6;var nxt=deltaX<0?cards[cur+1]:cards[cur-1];if(nxt){nxt.style.transform='translate(-50%,-50%) scale('+sc+')';nxt.style.opacity=op;}},{passive:true});
  document.addEventListener('touchend',e=>{if(!dragging)return;dragging=false;if(axis==='y'){axis='';return;}axis='';const card=cards[cur];card.classList.add('anim');if(cards[cur+1])cards[cur+1].classList.add('anim');if(cards[cur-1])cards[cur-1].classList.add('anim');const velocity=Math.abs(deltaX)/(Date.now()-startTime);const threshold=velocity>0.5?30:60;if(deltaX>threshold&&cur===0){window.location.href='../index.html';}else if(deltaX<-threshold&&cur===total-1){window.location.href='../index.html';}else if(deltaX<-threshold&&cur<total-1){cur++;update();}else if(deltaX>threshold&&cur>0){cur--;update();}else{card.style.transform='';}},{passive:true});
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&cur<total-1){cur++;update();}if(e.key==='ArrowLeft'&&cur>0){cur--;update();}});
  document.addEventListener('click',e=>{if(e.target.id==='restart')go(0);const article=e.target.closest('.home-article');if(article){const idx=parseInt(article.dataset.goto);if(!isNaN(idx))go(idx);}});
  /* === DESKTOP SPLIT-VIEW === */
  let dtShell=null, dtSelected=0;
  function buildDesktop(){
    if(dtShell)return;
    dtShell=document.createElement('div');
    dtShell.className='desktop-shell';
    // Sidebar
    const sb=document.createElement('nav');
    sb.className='dt-sidebar';
    const logoDate=DATA[0]&&DATA[0].home?`<div class="dt-logo">AI Insight Daily</div><div class="dt-date">${DATA[0].date||'21 Février 2026'}</div>`:`<div class="dt-logo">AI Insight Daily</div><div class="dt-date">21 Février 2026</div>`;
    sb.innerHTML=logoDate;
    DATA.forEach((d,i)=>{
      const item=document.createElement('div');
      item.className='dt-nav-item'+(i===0?' dt-selected':'');
      item.tabIndex=0;
      item.dataset.idx=i;
      const emoji=d.home?'📰':d.end?'✅':(d.badge||'').split(' ')[0]||'📄';
      const label=d.home?'Accueil':d.end?'Fin':(d.badge||'').split(' ').slice(1).join(' ')||'';
      const title=d.home?'Sommaire':d.end?'Briefing terminé':d.title||'';
      item.innerHTML=`<div class="dt-nav-badge">${emoji}</div><div class="dt-nav-info"><div class="dt-nav-label">${label}</div><div class="dt-nav-title">${title}</div></div><div class="dt-nav-arrow">›</div>`;
      item.addEventListener('click',()=>selectDesktop(i));
      sb.appendChild(item);
    });
    // Reader
    const rd=document.createElement('div');
    rd.className='dt-reader';
    rd.innerHTML='<div class="dt-reader-inner"></div>';
    dtShell.appendChild(sb);
    dtShell.appendChild(rd);
    document.body.appendChild(dtShell);
    selectDesktop(0);
  }
  function selectDesktop(idx){
    dtSelected=idx;
    const items=dtShell.querySelectorAll('.dt-nav-item');
    items.forEach((it,i)=>it.classList.toggle('dt-selected',i===idx));
    const d=DATA[idx];
    const inner=dtShell.querySelector('.dt-reader-inner');
    if(d.home){
      const arts=d.articles?d.articles.map(a=>`<div class="dt-nav-item" style="cursor:pointer;opacity:.7;padding:10px 14px;margin-bottom:4px;border-radius:10px;border:1px solid rgba(255,255,255,.06);" onclick="selectDesktop(${a.idx})"><div class="dt-nav-badge">${a.badge.split(' ')[0]}</div><div class="dt-nav-info"><div class="dt-nav-label">${a.badge.split(' ').slice(1).join(' ')}</div><div class="dt-nav-title">${a.title}</div></div><div class="dt-nav-arrow">›</div></div>`).join(''):'';
      inner.innerHTML=`<div class="dt-r-home-henry"><div class="label">🦊 L'Édito du Jour</div><div class="text">${d.henryWord||''}</div></div>${arts}`;
    } else if(d.end){
      inner.innerHTML=`<div style="text-align:center;padding:60px 0;"><div style="font-size:3.5rem;margin-bottom:16px;">🎉</div><h2 style="font-size:1.6rem;font-weight:800;margin-bottom:12px;">Briefing terminé !</h2><p style="color:var(--muted);font-size:1rem;margin-bottom:24px;line-height:1.5;">Vous avez parcouru le briefing du jour. À demain !</p><a href="../index.html" style="display:inline-block;padding:12px 32px;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;">📰 Toutes les éditions</a></div>`;
    } else {
      const authorHtml=d.authorWord?`<div class="dt-r-author"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author||''}</div></div>`:'';
      inner.innerHTML=`<span class="dt-r-badge ${d.t||''}">${d.badge||''}</span><h1 class="dt-r-title">${d.title||''}</h1>${authorHtml}<div class="dt-r-hook">${d.hook||''}</div><div class="dt-r-body">${d.details||''}</div><div class="dt-r-sig">AI Insight Daily — 21 Février 2026</div>`;
    }
    dtShell.querySelector('.dt-reader').scrollTop=0;
    // Scroll sidebar item into view
    items[idx]&&items[idx].scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  function destroyDesktop(){
    if(dtShell){dtShell.remove();dtShell=null;}
  }
  function checkDesktop(){
    if(window.innerWidth>=900){
      deck.style.display='none';
      buildDesktop();
      dtShell.style.display='';
    } else {
      if(dtShell)dtShell.style.display='none';
      deck.style.display='';
      update(false);
    }
  }
  // Keyboard nav for desktop
  document.addEventListener('keydown',e=>{
    if(window.innerWidth<900)return;
    if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();if(dtSelected<DATA.length-1)selectDesktop(dtSelected+1);}
    if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();if(dtSelected>0)selectDesktop(dtSelected-1);}
  });
  checkDesktop();window.addEventListener('resize',checkDesktop);
  // Theme toggle
  (function(){
    const btn=document.getElementById('themeToggle');
    const saved=localStorage.getItem('theme');
    if(saved==='light'){document.documentElement.classList.add('light');btn.textContent='☀️';}
    btn.addEventListener('click',()=>{
      const isLight=document.documentElement.classList.toggle('light');
      btn.textContent=isLight?'☀️':'🌙';
      localStorage.setItem('theme',isLight?'light':'dark');
    });
  })();
  </script>
</body>
</html>
