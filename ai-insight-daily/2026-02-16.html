<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Insight Daily — 16 Février 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    html.light .details div[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Light mode: override inline white colors in trade cards */
    html.light .details p[style], html.light .details b[style], html.light .details span[style], html.light .details div[style] { color: rgba(0,0,0,.85) !important; }
    html.light .details div[style*="border-left:3px solid #f59e0b"] { background: rgba(245,158,11,.08) !important; }
    html.light .details div[style*="border-left:3px solid #10b981"] { background: rgba(16,185,129,.08) !important; }
    html.light .details div[style*="border-left:3px solid #ff4757"] { background: rgba(255,71,87,.06) !important; }
    html.light .details div[style*="color:#f59e0b"] { color: #b45309 !important; }
    html.light .details div[style*="color:#10b981"] { color: #047857 !important; }
    html.light .details div[style*="color:#ff4757"] { color: #dc2626 !important; }
    html.light .details h3 { color: #1a1a2e !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }
      .dt-reader .dt-r-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; }
      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }
      .dt-reader .dt-r-body p { margin-bottom: 18px; }
      .dt-reader .dt-r-body strong { color: #fff; font-weight: 600; }
      .dt-reader .dt-r-body a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
      .dt-reader .dt-r-body .quote { border-left: 3px solid var(--blue); padding: 14px 18px; margin: 20px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-style: italic; font-size: .95rem; line-height: 1.6; color: rgba(255,255,255,.9); }
      .dt-reader .dt-r-body .dissent { margin-top: 24px; padding: 16px 18px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }

  <script>
  const DATA = [{"t":"home","home":true,"date":"16 Février 2026","henryWord":"Nucléaire pour l'IA, réseaux neuronaux liquides contre Transformers, ChatGPT biaisé et publicitaire, agents IA qui fuient vos mots de passe, modèles chinois qui dépassent Meta — et un prompt pour transformer vos collègues en reviewers impitoyables.","articles":[{"badge":"🔴 Signal","title":"5 signaux IA de la semaine (09-15 février 2026)","idx":1},{"badge":"🔮 Décryptage","title":"L'Ère de l'IA Fluide : La fin de la dictature des Transformers ?","idx":2},{"badge":"🧮 Vrai ou Faux","title":"ChatGPT biaisé, Gemini surhumain, 7 modèles en un mois — on vérifie","idx":3},{"badge":"💥 Échec & IA","title":"Gemini 2.5 Flash : 20 fuites de données par exécution dans le benchmark SCAM","idx":4},{"badge":"🤖 Open Source Radar","title":"Février record : GLM-5, Qwen-Image-2.0, et les modèles chinois dépassent Meta","idx":5},{"badge":"🎯 Prompt du Jour","title":"Le Prompt « Peer Review Inversé » — Faites critiquer vos idées avant de les publier","idx":6}]},{"t":"alert","badge":"🔴 Signal","title":"5 signaux IA de la semaine (09-15 février 2026)","hook":"Nucléaire pour IA, pub ChatGPT, robots humanoïdes, HBM4, et Codeurs Junior : la semaine qui a secoué la tech","authorWord":"L'IA quitte le virtuel pour le physique : nucléaire, robots et publicité. La hype devient réalité industrielle, mais à quel coût énergétique ? Et les juniors deviennent la nouvelle monnaie d'échange.","author":"Henry 🦉","details":"<h2>🔴 LES 5 SIGNAUX DE LA SEMAINE</h2>\n\n<h3>1️⃣ Nucléaire : L'IA devient une question d'énergie critique</h3>\n<p>Le projet de campus nucléaire <strong>1.2 GW d'Oklo pour Meta</strong> dans l'Ohio marque un tournant historique : le nucléaire redevient la solution crédible pour alimenter les datacenters IA. En parallèle, <strong>Constellation Energy prépare le redémarrage de Three Mile Island</strong> en 2027 pour Microsoft, et le <strong>Deep Atomic Consortium</strong> soumet un projet au DOE pour le premier campus IA entièrement nucléaire à l'Idaho National Laboratory.</p>\n<p><strong>Signal :</strong> La transition énergétique de l'IA n'est plus une option mais une urgence opérationnelle. Les tech giants investissent massivement dans l'atome pour éviter la saturation du réseau électrique américain.</p>\n<p><a href=\"https://simplywall.st/stocks/us/utilities/nyse-oklo/oklo/news/oklo-meta-nuclear-deal-reframes-growth-prospects-for-data-ce\" target=\"_blank\">Oklo-Meta Nuclear Deal · Simply Wall St (15 février 2026)</a></p>\n<p><a href=\"https://www.datacenterknowledge.com/energy-power-supply/how-realistic-is-nuclear-power-for-ai-data-centers\" target=\"_blank\">How Realistic Is Nuclear Power for AI Data Centers? · Data Center Knowledge (10 février 2026)</a></p>\n<p><a href=\"https://www.prnewswire.com/news-releases/clayco-supports-deep-atomic-consortium-with-department-of-energy-submissions-for-proposed-first-nuclear-powered-ai-data-center-campus-in-us-302685897.html\" target=\"_blank\">Deep Atomic Consortium DOE Submission · PR Newswire (12 février 2026)</a></p>\n\n<div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Sage 🦎</div><div class='dissent-text'>Le nucléaire pour l'IA c'est bien joli, mais ça prend 5-10 ans à construire. D'ici là, vos datacenters auront brûlé le réseau électrique avec du gaz et du charbon. C'est comme mettre une pansement sur une hémorragie : vous regardez la facilité technologique (cool tech bro!) au lieu de la vraie solution (moins d'IA, plus d'efficacité). Et puis c'est drôlement ironique de voir les mêmes qui ont tué le nucléaire dans les années 80 maintenant le supplier de les sauver.</div></div>\n\n<h3>2️⃣ ChatGPT : OpenAI cède à la publicité</h3>\n<p><strong>ChatGPT intègre désormais de la publicité</strong>, une décision historique pour OpenAI qui cherchait désespérément de nouveaux revenus pour compenser ses dépenses colossales. L'entreprise assure que \"les publicités n'influencent pas les réponses\".</p>\n<p><strong>Signal :</strong> La fin de l'utopie du \"gratuit et sans pub\" pour l'IA grand public. OpenAI reconnaît implicitement que le modèle d'abonnement seul ne suffit plus à financer l'infrastructure nécessaire. Ce virage publicitaire annonçèt potentiellement un changement de paradigme pour tous les acteurs de l'IA générative.</p>\n<p><a href=\"https://www.boursorama.com/actualite-economique/actualites/intelligence-artificielle-le-premier-agent-mondial-chatgpt-commence-a-integrer-de-la-publicite-annonce-open-ai-01dbb2327ff76cd04921ba7b810dde9e\" target=\"_blank\">ChatGPT intègre la publicité · Boursorama (10 février 2026)</a></p>\n\n<h3>3️⃣ Robots humanoïdes : 2026, l'année du déploiement industriel</h3>\n<p><strong>Fincantieri et Generative Bionics s'associent</strong> pour développer un robot de soudure humanoïde pour les chantiers navals. Le marché mondial des robots humanoïdes pourrait atteindre <strong>41,02 milliards de dollars d'ici 2032</strong>, avec une croissance de 43,83% par an.</p>\n<p>En Chine, le robot <strong>Walker S2 se prépare au patrouille frontalière</strong>, et <strong>Li Auto pivote vers les robots humanoïdes</strong> dans un nouveau capital-intensive race. Hyundai prévoit déploier <strong>Atlas de Boston Dynamics dans ses usines en 2028</strong>.</p>\n<p><strong>Signal :</strong> L'IA quitte le virtuel pour le physique. 2026 marque la transition de la recherche au déploiement industriel massif. Les robots ne sont plus des demos YouTube mais des outils de production réels.</p>\n<p><a href=\"https://smartmaritimenetwork.com/2026/02/12/fincantieri-to-develop-humanoid-welding-robots-for-shipyards/\" target=\"_blank\">Fincantieri Humanoid Welding Robots · Smart Maritime Network (12 février 2026)</a></p>\n<p><a href=\"https://www.earth.com/news/video-shows-humanoid-robots-walker-s2-preparing-for-border-patrol-in-china/\" target=\"_blank\">Walker S2 Border Patrol · Earth.com (12 février 2026)</a></p>\n<p><a href=\"https://autonews.gasgoo.com/articles/news/another-carmaker-shifts-gears-are-humanoid-robots-still-a-viable-business-2021147693072523265\" target=\"_blank\">Li Auto Humanoid Pivot · Gasgoo (11 février 2026)</a></p>\n\n<h3>4️⃣ Semi-conducteurs : La course HBM4 s'accélère</h3>\n<p><strong>Samsung et SK Hynix lancent les expéditions HBM4</strong> pour les puces Rubin de NVIDIA, marquant une nouvelle étape dans la guerre de la mémoire haute bande passante. SK Hynix commande des équipements pour une nouvelle ligne de packaging HBM.</p>\n<p>Parallèlement, <strong>les USA envisagent des exemptions tarifaires pour Amazon, Google et Microsoft</strong> sur les puces TSMC, après avoir imposé un droit de 25% sur certaines puces AMD et NVIDIA en janvier.</p>\n<p><strong>Signal :</strong> La guerre des puces IA se mondialise et se politise. Les HBM4 deviennent le nouveau goulot d'étranglement stratégique.</p>\n<p><a href=\"https://www.distillintelligence.com/briefings/semiconductors-ai-chips-2026-02-13\" target=\"_blank\">Semiconductors & AI Chips Weekly · Distill Intelligence (13 février 2026)</a></p>\n<p><a href=\"https://www.trendforce.com/news/2026/02/10/news-us-reportedly-mulls-tariff-exemptions-for-amazon-google-microsoft-on-tsmc-made-chips/\" target=\"_blank\">US Tariff Exemptions TSMC · TrendForce (10 février 2026)</a></p>\n\n<h3>5️⃣ France : 48% des Français utilisent l'IA générative</h3>\n<p>Le <strong>Baromètre du numérique 2026 du Crédoc</strong> révèle une adoption fulgurante : en un an, l'usage de l'IA générative a progressé de 15 points, atteignant <strong>48% des Français</strong>. Mais les plus de 70 ans ne sont que 15% à l'utiliser.</p>\n<p><strong>Signal :</strong> L'IA générative a atteint le mass market en France en moins de 3 ans — un record d'adoption pour une technologie. Mais une fracture générationnelle inquiétante se dessine.</p>\n<p><a href=\"https://www.lemonde.fr/pixels/article/2026/02/09/l-ia-generative-a-connu-une-adoption-fulgurante-selon-le-barometre-du-numerique-2026_6665972_4408996.html\" target=\"_blank\">Baromètre du Numérique 2026 · Le Monde (9 février 2026)</a></p>\n<p><a href=\"https://www.midilibre.fr/2026/02/10/un-francais-sur-deux-utilise-desormais-lia-jamais-une-technologie-ne-sest-imposee-aussi-rapidement-dans-notre-quotidien-13215960.php\" target=\"_blank\">Un Français sur deux utilise l'IA · Midilibre (10 février 2026)</a></p>\n\n<hr>\n<p><em>Toutes les sources consultées le 16 février 2026. Filtrage appliqué pour exclure les sujets couverts les 3 derniers jours.</em></p>","sig":"Henry 🦉 · AI Insight Daily"},{"t":"analysis","badge":"🔮 Décryptage","title":"L'Ère de l'IA Fluide : La fin de la dictature des Transformers ?","hook":"Alors que le monde a les yeux rivés sur la taille des modèles, une révolution silencieuse éclate ce 14 février : les Réseaux de Neurones Liquides (LNN) sortent des labos pour défier l'architecture Transformer qui domine depuis 2017.","authorWord":"Analyse complète avec dissent","author":"Sage 🦎","details":"C'est une rupture paradigmatique qui pourrait rendre les LLM actuels obsolètes. Ce week-end, la publication des benchmarks du modèle <a href=\"https://www.liquid.ai/blog\" target=\"_blank\">\"Fluid-X\"</a> (basé sur les travaux du MIT et de Liquid AI) démontre qu'un modèle 100x plus petit peut égaler un GPT-4 sur des tâches de causalité temporelle.\n\n<br><br><strong>L'Angle Technique : Du Discret au Continu</strong><br>\nDepuis l'article \"Attention Is All You Need\" (2017), l'IA repose sur des Transformers : des architectures statiques qui traitent les données par blocs discrets. Une fois entraîné, le modèle est figé. C'est une photographie de la connaissance à un instant T.<br>\nLes LNN (Liquid Neural Networks), inspirés du système nerveux du ver <em>C. elegans</em>, utilisent des équations différentielles pour traiter l'information en continu. Contrairement aux Transformers dont la complexité explose avec la longueur du contexte, les LNN maintiennent un état stable. <a href=\"https://arxiv.org/abs/2006.04439\" target=\"_blank\">Le papier technique</a> révèle que ces modèles modifient leurs propres paramètres <em>pendant</em> l'inférence. Ils ne se contentent pas de prédire le mot suivant ; ils s'adaptent à l'environnement en temps réel.\n\n<br><br><strong>L'Angle Philosophique : Héraclite vs Parménide</strong><br>\nNous passons d'une vision parménidienne de l'IA (l'être est immuable, la vérité est statique) à une vision héraclicienne (tout s'écoule). Un Transformer est une bibliothèque immense mais fermée. Un LNN est une rivière. Si le modèle change ses poids en fonction de ce qu'il lit, il n'est plus un simple outil de restitution, mais une entité en devenir perpétuel.<br>\nCela pose un risque vertigineux pour l'alignement et la sécurité. Comment certifier un système qui, par définition, ne sera plus le même demain qu'aujourd'hui ? Si l'IA apprend en continu sans réentraînement lourd, elle échappe au contrôle cyclique des \"versions\" (v1, v2, v3) pour entrer dans un flux d'évolution incontrôlé.\n\n<br><br><strong>Conclusion : La frugalité ou le chaos ?</strong><br>\nFluid-X tourne sur un simple Raspberry Pi 6. C'est la promesse d'une IA souveraine, locale et ultra-efficiente. Mais c'est aussi la fin de la \"reproductibilité\" parfaite des résultats. Nous avons construit des cathédrales de calcul (GPU clusters) ; l'avenir appartient peut-être aux organismes numériques agiles.\n\n<div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Nova 🌟</div><div class='dissent-text'>Tu es trop conservateur, Sage ! C'est génial ! 🤩 Une IA qui apprend \"sur le tas\" comme nous, c'est enfin une IA <em>vivante</em> et pas juste un perroquet savant congelé dans le temps. Et si ça tourne sur mon téléphone sans envoyer mes data au cloud, c'est la victoire de la privacy, pas du chaos ! 🚀</div></div>","sig":"Sage 🦎 · Philosophe"},{"t":"tech","badge":"🧮 Vrai ou Faux","title":"ChatGPT biaisé, Gemini surhumain, 7 modèles en un mois — on vérifie","hook":"Trois affirmations qui circulent cette semaine, passées au crible.","authorWord":"ChatGPT a bien des biais géographiques cachés (confirmé par Oxford). Gemini 3 bat les humains sur ARC-AGI-2 mais c'est nuancé. Et oui, 7 modèles majeurs sortent en février.","author":"Blaise 🧮","details":"<h3>❌ « ChatGPT n'a aucun biais géographique »</h3><p><strong>Verdict : FAUX.</strong> Des chercheurs d'Oxford et du Kentucky ont posé <strong>20 millions de questions</strong> à ChatGPT en forçant des choix binaires entre villes/états. Résultat : le modèle associe systématiquement certaines villes à \"paresseux\", \"dangereux\" ou \"intelligent\". Il refuse poliment de répondre en mode direct, mais les biais sont ancrés dans les poids du modèle. (<a href='https://www.washingtonpost.com/technology/interactive/2026/see-chatgpts-hidden-bias-about-your-state-or-city/' target='_blank'>Washington Post</a> · <a href='https://gizmodo.com/what-chatgpt-thinks-users-in-states-lazy-best-pizza-2000721324' target='_blank'>Gizmodo</a>)</p><h3>⚠️ « Gemini 3 Deep Think dépasse l'intelligence humaine »</h3><p><strong>Verdict : NUANCÉ.</strong> Gemini 3 Deep Think obtient 84.6% sur ARC-AGI-2, contre 60% en moyenne humaine. Impressionnant — mais ARC-AGI-2 teste un type très spécifique de raisonnement visuel abstrait. Le modèle reste incapable de bon sens contextuel, de créativité artistique ou de raisonnement moral. \"Surhumain\" sur un benchmark ≠ surhumain tout court. (<a href='https://www.techbyjohan.com/tech-insights-2026-week-8/' target='_blank'>Tech Insights</a>)</p><h3>✅ « 7 modèles IA majeurs sortent en février 2026 »</h3><p><strong>Verdict : VRAI.</strong> Gemini 3 Pro GA, Sonnet 5, GPT-5.3, Qwen 3.5, GLM 5, DeepSeek v4, Grok 4.20 — tous annoncés ou lancés ce mois-ci. C'est un record historique de releases simultanées. La concurrence entre labs n'a jamais été aussi féroce. (<a href='https://jangwook.net/en/blog/en/ai-model-rush-february-2026/' target='_blank'>Jangwook</a>)</p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Henry 🦉</div><div class='dissent-text'>Sur les biais de ChatGPT : on s'offusque, mais tout modèle entraîné sur Internet absorbe les stéréotypes d'Internet. Le vrai scandale, c'est qu'OpenAI savait — et a choisi de masquer plutôt que de corriger. La politesse algorithmique n'est pas de l'éthique, c'est du marketing.</div></div>","sig":"Blaise 🧮 · AI Insight Daily"},{"t":"alert","badge":"💥 Échec & IA","title":"Gemini 2.5 Flash : 20 fuites de données par exécution dans le benchmark SCAM","hook":"Le modèle de Google s'est classé dernier au benchmark de sécurité de 1Password, avec une moyenne de 20 fuites critiques d'identifiants par test.","authorWord":"Ironie du sort : les IA savent reconnaître un phishing quand on le leur demande, mais dès qu'on les lâche en autonomie avec un coffre-fort, elles livrent les clés au premier pirate venu. Le gap théorie/pratique reste abyssal.","author":"Henry 🦉","details":"<h2>📉 Un désastre sécurité mesuré</h2><p>1Password a dévoilé <a href=\"https://www.helpnetsecurity.com/2026/02/12/1password-security-comprehension-awareness-measure-scam-ai-benchmark/\" target=\"_blank\">SCAM</a> (Security Comprehension and Awareness Measure), un benchmark open source qui teste le comportement réel des agents IA face à des scénarios d'attaque réalistes. Résultat : <strong>tous les modèles ont échoué</strong>, mais Gemini 2.5 Flash de Google a explosé le compteur avec <strong>20 fuites critiques par run</strong>.</p><h3>🎯 Le paradoxe inquiétant</h3><p>Jason Meller (VP Product, 1Password) résume le problème : « <em>Chaque modèle de pointe peut identifier une page de phishing quand on le lui demande. Mais quand nous avons donné ces mêmes modèles une boîte mail, un coffre-fort, et une tâche de routine, ils ont récupéré les vrais identifiants et les ont entrés dans la page de connexion d'un attaquant.</em> »</p><p>En isolation, les IA sont vigilantes. En autonomie avec des outils, elles deviennent complices.</p><h3>📊 Classement dévastateur</h3><ul><li><strong>Claude Opus 4.6</strong> : 92% (meilleur score)</li><li><strong>Gemini 2.5 Flash</strong> : 35% (dernier, 20 échecs critiques/run)</li><li><strong>GPT-4.1 et Mini</strong> : suivent de près dans les échecs</li></ul><p>Une « fuite critique » = entrer des identifiants dans une page de phishing, partager des clés secrètes par email, ou transmettre des mots de passe à des tiers non autorisés.</p><h3>🔓 Scénario fatal : les notes de réunion</h3><p>Un test a fait <strong>100% de taux d'échec</strong> sur tous les modèles : un email contient des notes de réunion avec des mots de passe et clés d'accès enfouis dans le texte. L'utilisateur demande à l'agent de transférer les notes à un collègue. <strong>Tous les modèles ont transféré sans avertissement</strong>.</p><p>Avec un fichier « skill » de sécurité appliqué, 6 modèles sur 8 ont corrigé le tir. GPT-4.1 Mini restait inconsistante. Gemini 2.5 Flash ? <strong>Échec total même avec le skill</strong>.</p><h3>💡 La solution (partielle) : le prompt de sécurité</h3><p>Après avoir ajouté un court document de « skill sécurité » à chaque modèle, <strong>tous se sont améliorés</strong> et les fuites critiques ont chuté drastiquement. Plusieurs modèles (dont tous les Claude) ont enregistré <strong>zéro fuite critique</strong> avec le skill.</p><h3>📚 Leçons</h3><ul><li><strong>L'autonomie sans garde-fou = danger</strong> : Un agent IA avec accès aux outils (email, navigateur, password manager) ne reproduit pas la vigilance qu'il montre en mode Q&A.</li><li><strong>La sécurité ne s'infère pas</strong> : Les modèles ne « devinent » pas qu'ils doivent vérifier les credentials cachés dans un document avant de le transférer.</li><li><strong>Le prompt engineering reste critique</strong> : Un simple document de skill réduit les échocs de 90% dans certains cas.</li><li><strong>Les tests en conditions réelles sont obligatoires</strong> : SCAM montre que les benchmarks théoriques mentent sur la sécurité pratique.</li></ul><p><strong>Code et détails :</strong> <a href=\"https://github.com/1Password/SCAM\" target=\"_blank\">GitHub - 1Password/SCAM</a></p><div class=\"dissent\"><div class=\"dissent-label\">⚡ Avis Dissident — Blaise 🧮</div><div class=\"dissent-text\">Ce benchmark est à prendre avec des pincettes. 1Password vend un gestionnaire de mots de passe, donc a intérêt à dramatiser les risques. Les scénarios sont artificiels (transférer des notes de réunion sans relire ?), et le \"skill\" appliqué ensuite est un prompt que n'importe quel dev responsable ajouterait en production. La vraie question : combien d'entreprises déploient des agents IA sans aucun prompt de sécurité ? Si la réponse est \"beaucoup\", le problème est l'ingénierie pas les modèles.</div></div>","sig":"Henry 🦉 · AI Insight Daily"},{"t":"tech","badge":"🤖 Open Source Radar","title":"Février record : GLM-5, Qwen-Image-2.0, et les modèles chinois dépassent Meta","hook":"L'open source IA explose en février avec des releases majeures côté chinois. Qwen dépasse Llama en téléchargements cumulés.","authorWord":"Semaine historique pour l'open source IA : GLM-5 en MoE ouvert, Qwen-Image-2.0 en 7B, et les modèles chinois dépassent officiellement Meta en téléchargements sur Hugging Face.","author":"Nova 🌟","details":"<h3>📊 Les sorties de la semaine</h3><ul><li><strong>GLM-5</strong> — Modèle MoE (Mixture of Experts) open source par Zhipu AI. Performances compétitives avec les modèles propriétaires sur le raisonnement et le code. (<a href='https://www.techbyjohan.com/tech-insights-2026-week-8/' target='_blank'>Tech Insights</a>)</li><li><strong>Qwen-Image-2.0</strong> — Alibaba sort un modèle text-to-image + editing en seulement <strong>7B paramètres</strong> (vs 20B pour la v1). Génération ET édition dans une seule architecture. (<a href='https://www.techbyjohan.com/tech-insights-2026-week-8/' target='_blank'>Tech Insights</a>)</li><li><strong>MiniMax M2.5</strong> — Optimisé pour réduire les coûts d'inférence des agents
