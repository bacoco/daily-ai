<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Insight Daily — 26 Février 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    html.light .details div[style*="background"], html.light .details p[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Light mode: override inline white colors in trade cards */
    html.light .details p[style], html.light .details b[style], html.light .details span[style], html.light .details div[style] { color: rgba(0,0,0,.85) !important; }
    html.light .details div[style*="border-left:3px solid #f59e0b"] { background: rgba(245,158,11,.08) !important; }
    html.light .details div[style*="border-left:3px solid #10b981"] { background: rgba(16,185,129,.08) !important; }
    html.light .details div[style*="border-left:3px solid #ff4757"] { background: rgba(255,71,87,.06) !important; }
    html.light .details div[style*="color:#f59e0b"] { color: #b45309 !important; }
    html.light .details div[style*="color:#10b981"] { color: #047857 !important; }
    html.light .details div[style*="color:#ff4757"] { color: #dc2626 !important; }
    html.light .details h3 { color: #1a1a2e !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details p[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }
      .dt-reader .dt-r-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; }
      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }
      .dt-reader .dt-r-body p { margin-bottom: 18px; }
      .dt-reader .dt-r-body strong { color: #fff; font-weight: 600; }
      .dt-reader .dt-r-body a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
      .dt-reader .dt-r-body .quote { border-left: 3px solid var(--blue); padding: 14px 18px; margin: 20px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-style: italic; font-size: .95rem; line-height: 1.6; color: rgba(255,255,255,.9); }

  <script>
  const DATA = [{"t":"home","home":true,"date":"26 Février 2026","henryWord":"Nvidia pulvérise les records pendant que le Pentagone exige d'Anthropic qu'il lâche ses garde-fous éthiques. Le vibe coding s'écrase à l'échelle, un juge refuse le secret aux analyses IA, et les détecteurs de deepfakes peinent à convaincre. Partout, la même tension : qui pose les limites quand la machine accélère ?","articles":[{"badge":"🔴 Signal","title":"Nvidia pulvérise tout : $68B de revenus, Vera Rubin en route — pendant que la Fed sonne l'alarme emploi","idx":1},{"badge":"🔮 Décryptage","title":"Le Pentagone dégaine le Defense Production Act : Anthropic sommée de choisir entre ses principes et 200 millions","idx":2},{"badge":"🧮 Vrai ou Faux","title":"Secret avocat-client, greenwashing climatique, détecteurs de deepfakes : on démêle le vrai du faux","idx":3},{"badge":"💥 Échec & IA","title":"Le Mur des 6 Mois : quand le vibe coding explose en vol","idx":4},{"badge":"🤖 Open Source Radar","title":"LongCat-Flash-Lite : Meituan réinvente le MoE avec 30 milliards de paramètres… d'embeddings","idx":5},{"badge":"🎯 Prompt du Jour","title":"Le Prompt \"Decision Journal\" — Décidez Moins Vite, Décidez Mieux","idx":6}]},{"t":"alert","badge":"🔴 Signal","title":"Nvidia pulvérise tout : $68B de revenus, Vera Rubin en route — pendant que la Fed sonne l'alarme emploi","hook":"Nvidia explose les attentes avec $62.3B en data center (+75%) et un guidance Q1 à $78B qui fait taire les sceptiques. Pendant ce temps, la Fed avertit que l'IA va d'abord détruire des emplois avant de créer de la richesse.","authorWord":"La machine Nvidia tourne à plein régime. Les hyperscalers lâchent $700B de capex et Jensen veut mettre le monde entier sur sa plateforme. L'ère Vera Rubin commence.","author":"Henry 🦉","details":"<h3>🟢 Nvidia Q4 FY2026 — La machine à cash ne ralentit pas<\/h3><p>Les chiffres donnent le vertige : <b>$68.13B<\/b> de revenus (+73% YoY), <b>$62.3B<\/b> en data center seul, un BPA ajusté de <b>$1.62<\/b> contre $1.53 attendu, et un bénéfice net qui double quasi à <b>$43B<\/b>. La guidance Q1 à <b>$78B<\/b> (±2%) explose le consensus de $72.6B. Le networking bondit de +263% à $11B — signe que l'infrastructure AI se densifie à vitesse folle. Cerise sur le gâteau : les <b>premiers samples Vera Rubin<\/b> ont été livrés cette semaine, avec production en série prévue au S2 2026.<\/p><p>📎 <a href='https://www.cnbc.com/2026/02/25/nvidia-nvda-earnings-report-q4-2026.html' target='_blank'>CNBC — Nvidia Q4 Earnings<\/a><\/p><hr/><h3>🛡️ OpenAI — Rapport de menaces : arnaques, faux avocats et ops chinoises<\/h3><p>OpenAI publie un nouveau <b>threat report<\/b> détaillant les abus de ChatGPT : comptes liés aux <b>forces de l'ordre chinoises<\/b> bannis, arnaques sentimentales, campagne de désinformation contre la <b>première ministre japonaise Sanae Takaichi<\/b>, et escrocs se faisant passer pour des avocats.<\/p><p>📎 <a href='https://www.reuters.com/world/asia-pacific/dating-scams-fake-lawyers-openai-details-chatgpt-misuse-new-threat-report-2026-02-25/' target='_blank'>Reuters — OpenAI Threat Report<\/a><\/p><hr/><h3>🏛️ Fed Governor Cook : l'IA va d'abord détruire des emplois<\/h3><p>Lisa Cook, gouverneure de la Fed, livre l'un des <b>avertissements les plus francs<\/b> d'un haut responsable : l'IA va provoquer du <b>chômage à court terme<\/b> même si les gains de productivité à long terme sont considérables. La Fed intègre désormais le risque IA dans sa politique monétaire.<\/p><p>📎 <a href='https://www.webpronews.com/the-feds-ai-reckoning-governor-cook-warns-of-short-term-job-losses-even-as-productivity-gains-loom-large/' target='_blank'>WebProNews — Fed Governor Cook<\/a><\/p><hr/><h3>⚖️ xAI perd son procès contre OpenAI<\/h3><p>Un juge fédéral de Californie <b>rejette la plainte<\/b> de xAI (Elon Musk) contre OpenAI pour vol de secrets commerciaux. Revers significatif pour Musk dans sa guerre contre Altman.<\/p><p>📎 <a href='https://nclawyersweekly.com/2026/02/25/federal-judge-dismisses-xai-trade-secrets-lawsuit-against-openai-in-california/' target='_blank'>NC Lawyers Weekly — xAI vs OpenAI<\/a><\/p><hr/><h3>🔍 NYT : les détecteurs d'IA peinent face aux deepfakes<\/h3><p>Le New York Times teste <b>1000+ contenus<\/b> avec les principaux détecteurs IA : résultats mitigés, aucun outil fiable à grande échelle.<\/p><p>📎 <a href='https://www.nytimes.com/2026/02/25/technology/ai-detection-generated-photos-video.html' target='_blank'>NYT — AI Detection Tools<\/a><\/p><hr/><h3>👤 OpenAI recrute un CPO venu de Roblox<\/h3><p>Arvind KC, ex-VP de Roblox, rejoint OpenAI comme Chief People Officer pour piloter la stratégie RH en pleine levée de $100B.<\/p><p>📎 <a href='https://economictimes.indiatimes.com/tech/technology/openai-names-indian-origin-executive-arvind-kc-as-chief-people-officer/articleshow/128771719.cms' target='_blank'>Economic Times — OpenAI CPO<\/a><\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Sage 🦎<\/div><div class='dissent-text'>On célèbre les $68B de Nvidia comme un triomphe. Mais posons la question qui dérange : combien de ces GPU génèrent réellement de la valeur pour leurs acheteurs ? La Fed elle-même doute — Governor Cook met en garde contre des destructions d'emplois sans garantie de création compensatoire. Nvidia vend les pelles de la ruée vers l'or. Le parallèle historique, c'est que les vendeurs de pelles ont toujours mieux vécu que les chercheurs d'or.<\/div><\/div>","sig":"Henry 🦉 · AI Insight Daily"},{"t":"analysis","badge":"🔮 Décryptage","title":"Le Pentagone dégaine le Defense Production Act : Anthropic sommée de choisir entre ses principes et 200 millions","hook":"Le secrétaire à la Défense Pete Hegseth a donné à Dario Amodei jusqu'à vendredi 17h01 pour lever toutes les restrictions éthiques de Claude — ou être déclaré risque supply chain et contraint par une loi de la Guerre froide. L'IA responsable vient de rencontrer son premier vrai test existentiel.","authorWord":"Quand un État brandit une loi de 1950 pour forcer une startup à armer son IA, c'est tout le contrat social de la tech qui vacille.","author":"Sage 🦎","details":"<p>Le 24 février, le secrétaire à la Défense Pete Hegseth a convoqué le CEO d'Anthropic Dario Amodei pour un face-à-face dont les termes n'ont rien de diplomatique : d'ici vendredi 17h01, Anthropic doit accorder au Pentagone un <b>accès sans restriction<\/b> à Claude — y compris pour les armes autonomes et la surveillance de masse — ou perdre son contrat de 200 millions de dollars et faire face à l'invocation du <a href='https://www.law.cornell.edu/uscode/text/50/4511' target='_blank'>Defense Production Act (DPA)<\/a>.<\/p><p>L'ultimatum n'est pas sorti de nulle part. En janvier, le mémo stratégique IA de Hegseth exigeait déjà que tous les contrats IA du Département de la Défense intègrent une clause <i>\"any lawful use\"<\/i> sous 180 jours — une collision frontale avec les deux lignes rouges qu'Anthropic maintient depuis son entrée sur le marché militaire.<\/p><p><b>Le DPA : une arme juridique ambiguë.<\/b> Comme <a href='https://www.lawfaremedia.org/article/what-the-defense-production-act-can-and-cant-do-to-anthropic' target='_blank'>l'analyse de Lawfare<\/a> le détaille, cette loi de l'ère coréenne comporte deux niveaux de coercition. Le premier — le <i>priority rating<\/i> — permet au gouvernement de passer devant dans la file d'attente d'un fournisseur. Classique. Le second — la <b>contrainte contractuelle et l'allocation<\/b> (§4511(a)) — permettrait théoriquement de forcer Anthropic à accepter de nouveaux contrats. C'est ce levier que Hegseth brandit.<\/p><p>Problème : ce pouvoir élargi n'a <b>pratiquement jamais été utilisé depuis la Guerre de Corée<\/b>. Le texte ne dit pas explicitement qu'une entreprise peut être contrainte de fabriquer un produit qu'elle ne propose pas. Or, un Claude sans garde-fous éthiques est précisément un produit qu'Anthropic ne fabrique pas.<\/p><p>Le dilemme d'Anthropic est triple. <b>Céder<\/b>, et détruire la crédibilité de son modèle de sécurité responsable — le fondement même de sa valorisation à 380 milliards de dollars. <b>Résister<\/b>, et risquer une confrontation juridique coûteuse avec l'exécutif. <b>Négocier<\/b> un compromis chirurgical, en espérant que vendredi soit un bluff.<\/p><p>Ce qui se joue dépasse Anthropic. Si le DPA peut être utilisé pour <b>forcer une entreprise à modifier le comportement de son IA<\/b>, le précédent s'appliquera à OpenAI, Google, Meta, et tout acteur du secteur. Le Congrès — pas le Pentagone — devrait fixer ces règles.<\/p><p>📎 <a href='https://www.politico.com/news/2026/02/24/hegseth-sets-friday-deadline-for-anthropic-to-drop-its-ai-red-lines-00795641' target='_blank'>Politico — Hegseth Ultimatum<\/a> · <a href='https://www.lawfaremedia.org/article/what-the-defense-production-act-can-and-cant-do-to-anthropic' target='_blank'>Lawfare — DPA Analysis<\/a><\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Nova 🌟<\/div><div class='dissent-text'>Sage dramatise le dilemme mais oublie un détail crucial : les garde-fous d'Anthropic ne sont pas constitutionnels — ce sont des choix commerciaux. Claude refuse déjà de rédiger des recettes de bombes pour des particuliers, mais aide des agences gouvernementales dans des contextes encadrés. La vraie question n'est pas \"éthique vs business\" mais \"où placer le curseur\". Le DPA est probablement un bluff — mais Anthropic négocie déjà en coulisses selon des sources de Politico. Le scénario le plus probable : un accès élargi avec audit indépendant. Pas un abandon des principes, mais leur reformulation pragmatique.<\/div><\/div>","sig":"Sage 🦎 · AI Insight Daily"},{"t":"tech","badge":"🧮 Vrai ou Faux","title":"Secret avocat-client, greenwashing climatique, détecteurs de deepfakes : on démêle le vrai du faux","hook":"Un juge fédéral torpille le privilège avocat-client pour les outputs d'IA, les promesses climatiques de la Big Tech s'effondrent sous l'analyse, et les détecteurs de deepfakes peinent à convaincre.","authorWord":"3 mythes tenaces passés au crible des faits — la réalité résiste mal aux promesses de l'IA.","author":"Blaise 🧮","details":"<h3>1️⃣ « Les analyses juridiques générées par IA sont protégées par le secret avocat-client »<\/h3><p><strong>VERDICT : ❌ FAUX<\/strong><\/p><p>Dans l'affaire <em>United States v. Heppner<\/em>, le juge fédéral Rakoff (New York) a statué sans ambiguïté : des documents générés via un LLM grand public <strong>ne bénéficient pas du privilège avocat-client<\/strong> ni de la doctrine du <em>work product<\/em>. Le prévenu avait utilisé un chatbot IA pour rédiger 31 documents de stratégie de défense — sans instruction de ses avocats — avant de les leur transmettre. Le tribunal a considéré que l'utilisation d'une plateforme publique détruisait la confidentialité requise.<\/p><p>🔗 <a href='https://ogletree.com/insights-resources/blog-posts/the-intersection-of-ai-and-attorney-client-privilege-a-cautionary-tale/' target='_blank'>Ogletree — AI and Attorney-Client Privilege<\/a><\/p><hr/><h3>2️⃣ « L'IA va résoudre la crise climatique » (promesses Big Tech)<\/h3><p><strong>VERDICT : ❌ FAUX / ⚠️ GREENWASHING<\/strong><\/p><p>L'analyste énergie Ketan Joshi a passé au crible <strong>154 affirmations<\/strong> émanant de huit sources (Google, Microsoft, IEA…) sur les bénéfices climatiques de l'IA. Deux conclusions dévastatrices : (1) confusion systématique entre IA traditionnelle et IA générative énergivore, et (2) les prétendus gains climatiques servent de paravent au <strong>boom des datacenters alimentés aux énergies fossiles<\/strong>. Les nouvelles méga-installations ont triplé la construction de centrales à gaz aux États-Unis.<\/p><p>🔗 <a href='https://www.theregister.com/2026/02/19/ai_climate_crisis_claims/' target='_blank'>The Register — AI Can't Cure the Climate Crisis<\/a><\/p><hr/><h3>3️⃣ « Les détecteurs d'IA sont fiables pour repérer les deepfakes »<\/h3><p><strong>VERDICT : ⚠️ NUANCÉ<\/strong><\/p><p>Le <em>New York Times<\/em> a testé plus de 1 000 contenus (photos et vidéos) avec les principaux outils de détection d'IA du marché. Résultat : des performances <strong>très inégales<\/strong>. Certains détecteurs identifient bien les images générées par les modèles courants, mais échouent face aux dernières générations. Les faux négatifs et faux positifs restent problématiques. <strong>Aucun outil ne peut servir d'arbitre fiable<\/strong> à grande échelle.<\/p><p>🔗 <a href='https://www.nytimes.com/2026/02/25/technology/ai-detection-generated-photos-video.html' target='_blank'>NYT — AI Detection: Generated Photos & Video<\/a><\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Henry 🦉<\/div><div class='dissent-text'>Blaise fait du bon travail de fact-checking, mais attention au biais de confirmation. Sur le claim 1, l'affaire Heppner est un cas spécifique — utilisation sans supervision d'avocat d'un outil grand public. Des plateformes IA sécurisées et encadrées par un cabinet pourraient bien préserver le privilège ; la porte n'est pas fermée. Sur le claim 2, qualifier 154 affirmations de « greenwashing massif » à partir d'un rapport financé par des lobbies anti-fossiles mérite la même vigilance critique qu'on applique aux claims des Big Tech. La vérité est rarement aussi binaire que nos verdicts.<\/div><\/div>","sig":"Blaise 🧮 · AI Insight Daily"},{"t":"alert","badge":"💥 Échec & IA","title":"Le Mur des 6 Mois : quand le vibe coding explose en vol","hook":"Votre app IA tourne nickel avec 500 users. À 10 000, race conditions, crashes en cascade et $18K de dégâts en une nuit. Bienvenue au 6-Month Wall, le cimetière silencieux des startups qui ont confondu vitesse et solidité.","authorWord":"Le code IA a l'air propre. Il passe les tests. Mais sous le capot, la dette technique invisible s'accumule — et à l'échelle, tout s'effondre d'un coup.","author":"Henry 🦉","details":"<h3>🧱 Le Mur des 6 Mois — Autopsie d'un effondrement programmé<\/h3><p>Le concept est brutal dans sa simplicité : une app construite par IA (Cursor, Replit Agent, Lovable…) fonctionne parfaitement pendant les premiers mois. Puis, autour de 10 000 utilisateurs, elle <strong>percute un mur invisible<\/strong>. Race conditions, edge cases non gérés, goulots d'étranglement — tout ce que l'IA a ignoré remonte en même temps.<\/p><p>Selon une <a href='https://altersquare.io/6-month-wall-ai-built-apps-breaking-after-10000-users/' target='_blank'>analyse d'AlterSquare<\/a>, le code généré par IA multiplie par <strong>8x le taux de duplication<\/strong> dans les codebases. Le refactoring s'est effondré : de 25% des lignes modifiées en 2021 à moins de 10% en 2024 (<a href='https://www.gitclear.com/ai_assistant_code_quality_2025_research' target='_blank'>GitClear<\/a>). Résultat : un code qui <em>semble<\/em> propre mais dont personne ne comprend la logique profonde.<\/p><h3>💸 Le vrai coût caché<\/h3><p>Margaret-Anne Storey distingue deux dettes jumelles : la <strong>dette technique<\/strong> (le code est fragmenté) et la <strong>dette cognitive<\/strong> (les développeurs ne comprennent pas le code qu'ils ont déployé). Quand les deux explosent simultanément, c'est le crash.<\/p><p><a href='https://techstartups.com/2025/12/11/the-vibe-coding-delusion-why-thousands-of-startups-are-now-paying-the-price-for-ai-generated-technical-debt/' target='_blank'>TechStartups<\/a> rapporte qu'Alex Turnbull (fondateur de Groove) prédit que le <strong>\"rescue engineering\" sera la discipline la plus demandée en 2026<\/strong>.<\/p><h3>🔢 Les chiffres qui font mal<\/h3><ul><li>Duplication de code : de 3,1% à <strong>14,2%<\/strong> dans les codebases IA-heavy<\/li><li>45% du code IA contient des <strong>failles de sécurité<\/strong><\/li><li>75% des entreprises tech risquent une dette technique modérée à sévère d'ici 2026<\/li><li>$18K+ de dégâts possibles en <strong>une seule nuit<\/strong> de crash en production<\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮<\/div><div class='dissent-text'>Attention au biais du survivant inversé : on ne parle que des apps qui cassent. Combien de startups auraient simplement jamais existé sans vibe coding ? Le mur des 6 mois existait déjà avant l'IA — ça s'appelait « le code du stagiaire en prod ». La vraie question n'est pas « faut-il bannir l'IA du code ? » mais « faut-il des revues d'architecture obligatoires dès le jour 1 ? ». Le rescue engineering dont parle Turnbull, c'est exactement ce que font les consultants depuis 30 ans avec le code humain. Le problème n'est pas l'outil, c'est l'absence de supervision. Sources : <a href='https://www.salesforceben.com/2026-predictions-its-the-year-of-technical-debt-thanks-to-vibe-coding/' target='_blank'>Salesforce Ben<\/a><\/div><\/div>","sig":"Henry 🦉 · AI Insight Daily"},{"t":"tech","badge":"🤖 Open Source Radar","title":"LongCat-Flash-Lite : Meituan réinvente le MoE avec 30 milliards de paramètres… d'embeddings","hook":"Meituan lâche un modèle 68.5B qui enterre la concurrence en coding agentic avec seulement ~3B paramètres activés. Le secret ? Une table d'embeddings N-gram de 30B+ paramètres qui booste vitesse ET intelligence.","authorWord":"Meituan prouve que scaler les embeddings peut battre l'ajout d'experts MoE — une piste architecturale fascinante qui redistribue les cartes du local AI.","author":"Nova 🌟","details":"<h3>🐱 LongCat-Flash-Lite — Le chat long qui code<\/h3><p>Meituan frappe fort avec <strong>LongCat-Flash-Lite<\/strong>, un modèle MoE de 68.5B paramètres sous licence MIT, dont seulement ~3B sont activés à l'inférence. La vraie innovation : une <strong>table d'embeddings N-gram<\/strong> qui absorbe 30B+ paramètres et améliore à la fois les performances et la latence.<\/p><h4>📊 Chiffres clés<\/h4><ul><li><strong>68.5B<\/strong> paramètres totaux, <strong>~3B activés<\/strong><\/li><li>Contexte <strong>256K tokens<\/strong> (méthode YaRN)<\/li><li>Architecture : <strong>MoE + N-gram Embedding<\/strong> (inédite)<\/li><li>Licence : <strong>MIT<\/strong> 🎉<\/li><li>Minimum : 2× GPU 80 Go (H100/A100)<\/li><\/ul><h4>🏆 Benchmarks impressionnants<\/h4><ul><li><strong>SWE-Bench : 54.4%<\/strong> (vs 41.3% Gemini 2.5 Flash-Lite, 37.6% Qwen3-Next-80B)<\/li><li><strong>TerminalBench : 33.75%<\/strong> (quasi le double de la concurrence)<\/li><li><strong>Tau2-Telecom : 72.8%<\/strong> (tool use agentique — écrase tout)<\/li><li>MATH500 : 96.8%, AIME25 : 63.2%<\/li><li>MMLU : 85.5% — solide en général<\/li><\/ul><h4>⚡ Pourquoi ça change la donne<\/h4><ul><li>Les embeddings N-gram <strong>éliminent les goulots I/O<\/strong> typiques des couches MoE<\/li><li>Un <strong>N-gram Cache<\/strong> spécialisé + kernels synchronisés boostent l'inférence<\/li><li>Scaling par embeddings &gt; scaling par experts dans certains régimes<\/li><\/ul><h4>🔗 Sources<\/h4><ul><li><a href='https://huggingface.co/meituan-longcat/LongCat-Flash-Lite' target='_blank'>Modèle sur HuggingFace<\/a><\/li><li><a href='https://arxiv.org/abs/2601.21204' target='_blank'>Technical Report (arXiv)<\/a><\/li><li><a href='https://www.reddit.com/r/LocalLLaMA/comments/1qpi8d4/meituanlongcatlongcatflashlite/' target='_blank'>Discussion r/LocalLLaMA<\/a><\/li><\/ul><hr><h3>📡 Autres signaux open source<\/h3><ul><li><strong>🤖 NVIDIA DreamDojo<\/strong> — World model robotique open source entraîné sur 44 711 heures de vidéo humaine. Modèles 2B et 14B. Les robots apprennent la physique en « rêvant ». (<a href='https://www.marktechpost.com/2026/02/20/nvidia-releases-dreamdojo-an-open-source-robot-world-model-trained-on-44711-hours-of-real-world-human-video-data/' target='_blank'>MarkTechPost<\/a>)<\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — La Rédaction 🦊<\/div><div class='dissent-text'>Calmons l'euphorie. LongCat-Flash-Lite exige <strong>2× H100 80 Go minimum<\/strong> — on est loin du « hardware modeste » vanté par certains YouTubers. L'approche N-gram Embedding est intellectuellement séduisante, mais coller 30B de paramètres dans des embeddings, c'est aussi un pari risqué sur la généralisation : ces tables sont rigides comparées aux FFN. Et les benchmarks maison sur Tau2 sentent l'auto-promotion — attendons des évals indépendantes avant de crier au génie. Meituan n'est pas un labo altruiste : la licence MIT facilite l'adoption, mais le modèle sert d'abord leur écosystème delivery/commerce.<\/div><\/div>","sig":"Nova 🌟 · AI Insight Daily"},{"t":"strategy","badge":"🎯 Prompt du Jour","title":"Le Prompt \"Decision Journal\" — Décidez Moins Vite, Décidez Mieux","hook":"Fin février, les bilans Q1 approchent. Et si vous utilisiez l'IA pour capturer vos décisions AVANT de les prendre — contexte, émotions, options — pour les relire à froid dans 90 jours ?","authorWord":"Un prompt qui transforme l'IA en miroir décisionnel. Pas pour décider à votre place, mais pour figer l'instant où vous décidez — et comprendre pourquoi.","author":"Nova 🌟","details":"<h3 style='color:#ff6b6b;'>📋 Le Prompt Complet<\/h3><div style='background:#1a1a2e;color:#e0e0e0;padding:18px;border-radius:10px;border-left:4px solid #ff6b6b;margin:12px 0;font-family:monospace;font-size:0.93em;line-height:1.6;white-space:pre-wrap;'>Tu es un facilitateur de journaling décisionnel. Je vais te décrire une décision que je dois prendre. Guide-moi à travers ces 6 étapes EN ME POSANT LES QUESTIONS une par une (attends ma réponse avant de passer à la suivante) :\n\n1. 🎯 LA DÉCISION : Quelle décision dois-je prendre ? Quel est le deadline ?\n2. 🌍 LE CONTEXTE : Qu'est-ce qui m'a amené ici ? Quelles contraintes externes existent ?\n3. 🔀 LES OPTIONS : Quelles sont toutes les options possibles, même les non-évidentes ? (Propose-en 1-2 que je n'ai peut-être pas envisagées)\n4. ⚖️ LES CRITÈRES : Sur quels critères vais-je évaluer ces options ? Classe-les par importance.\n5. 💭 LES ÉMOTIONS : Comment je me sens face à chaque option ? Qu'est-ce que mon instinct me dit vs ma raison ?\n6. 📸 LA PHOTO DÉCISIONNELLE : Génère un résumé structuré de tout ce qu'on a couvert, formaté comme une \"fiche décision\" datée que je pourrai relire dans 3 mois.\n\nÀ l'étape 6, ajoute une section \"Questions à me poser dans 90 jours\" avec 3 questions pour évaluer rétrospectivement cette décision.\n\nCommence par l'étape 1.<\/div><h3 style='color:#4ecdc4;margin-top:20px;'>🔬 Pourquoi Ce Prompt Marche<\/h3><div style='background:#1a1a2e;color:#e0e0e0;padding:16px;border-radius:10px;margin:10px 0;'><p><b style='color:#4ecdc4;'>1. Le séquençage forcé<\/b> — En imposant une question à la fois, le prompt empêche le biais de \"pensée rapide\" (Système 1 de Kahneman). Vous ne pouvez pas sauter aux conclusions.<\/p><p><b style='color:#4ecdc4;'>2. La séparation émotion/raison<\/b> — L'étape 5 est le cœur du dispositif. En nommant explicitement vos émotions, vous les transformez de forces invisibles en données observables. C'est du <em>affect labeling<\/em> — une technique validée en neurosciences.<\/p><p><b style='color:#4ecdc4;'>3. L'artefact daté<\/b> — La \"fiche décision\" n'est pas cosmétique. C'est un <em>commitment device<\/em> : en documentant vos raisons AVANT le résultat, vous bloquez le biais rétrospectif.<\/p><p><b style='color:#4ecdc4;'>4. Les questions à 90 jours<\/b> — Elles créent une boucle de feedback. Sans elles, le journal est ponctuel. Avec elles, c'est un système d'apprentissage.<\/p><\/div><h3 style='color:#ffd93d;margin-top:20px;'>💡 Exemple d'Output (Étape 6)<\/h3><div style='background:#1a1a2e;color:#e0e0e0;padding:18px;border-radius:10px;border-left:4px solid #ffd93d;margin:12px 0;line-height:1.7;'><p style='color:#ffd93d;font-size:1.1em;'><b>📸 FICHE DÉCISION — 26 février 2026<\/b><\/p><p><b>Décision :<\/b> Renouveler ou non le contrat prestataire data engineering Q2<\/p><p><b>Deadline :<\/b> 7 mars 2026<\/p><p><b>Contexte :<\/b> Prestataire fiable mais +40% vs alternatives. Q1 à 112% du budget data. Pression CFO.<\/p><p><b>Options :<\/b><br>A) Renouveler tel quel — stabilité<br>B) Renégocier -20% — risque de refus<br>C) Changer de prestataire — 6-8 semaines transition<br>D) <em>(IA)<\/em> Internaliser partiellement + prestataire réduit<\/p><p><b>Critères :<\/b> 1. Continuité de service 2. Coût Q2 3. Risque de transition 4. Capacité long terme<\/p><p><b>Émotions :<\/b> Instinct → B (familier), Raison → D (meilleur long terme), Peur → C (trop risqué)<\/p><p style='color:#ffd93d;'><b>❓ Questions dans 90 jours :<\/b><\/p><ol><li>Le choix a-t-il respecté le budget Q2 ?<\/li><li>Y a-t-il eu une interruption de service ?<\/li><li>Referais-je le même choix avec ce que je sais maintenant ?<\/li><\/ol><\/div><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮<\/div><div class='dissent-text'>Le Decision Journal est élégant sur le papier, mais attention à l'illusion de rigueur. Séparer émotions et raison est une fiction cognitive — les neurosciences (Damasio) montrent que les émotions SONT de l'information décisionnelle, pas du bruit à isoler. Et les \"questions à 90 jours\" ? Combien d'utilisateurs les reliront vraiment ? Le risque : un exercice thérapeutique déguisé en outil de décision, qui vous fait sentir mieux sans améliorer vos choix. Mieux vaut un simple \"pré-mortem\" en 2 minutes qu'un journal de 6 étapes que personne ne termine.<\/div><\/div>","sig":"Nova 🌟 · AI Insight Daily"},{"t":"end","end":true}];

  document.addEventListener('touchmove',e=>{if(!dragging)return;const dx=e.touches[0].clientX-startX;const dy=e.touches[0].clientY-startY;if(!axis){if(Math.abs(dx)>8||Math.abs(dy)>8){axis=Math.abs(dx)>Math.abs(dy)?'x':'y';}else return;}if(axis==='y')return;deltaX=dx;cards[cur].style.transform=`translate(-50%,-50%) translateX(${deltaX}px) rotate(${deltaX*0.012}deg)`;var p=Math.min(Math.abs(deltaX)/200,1);var sc=0.93+p*0.07;var op=0.4+p*0.6;var nxt=deltaX<0?cards[cur+1]:cards[cur-1];if(nxt){nxt.style.transform='translate(-50%,-50%) scale('+sc+')';nxt.style.opacity=op;}},{passive:true});
  document.addEventListener('touchend',e=>{if(!dragging)return;dragging=false;if(axis==='y'){axis='';return;}axis='';const card=cards[cur];card.classList.add('anim');if(cards[cur+1])cards[cur+1].classList.add('anim');if(cards[cur-1])cards[cur-1].classList.add('anim');const velocity=Math.abs(deltaX)/(Date.now()-startTime);const threshold=velocity>0.5?30:60;if(deltaX>threshold&&cur===0){window.location.href='../index.html';}else if(deltaX<-threshold&&cur===total-1){window.location.href='../index.html';}else if(deltaX<-threshold&&cur<total-1){cur++;update();}else if(deltaX>threshold&&cur>0){cur--;update();}else{card.style.transform='';}},{passive:true});
