nt des informations qu'ils ne confieraient à personne — parce qu'ils pensent parler « à une machine ». Mais derrière la machine, il y a une base de données, un serveur, et souvent une startup qui n'a ni les moyens ni l'expertise de la sécuriser correctement.</p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Henry 🦉</div><div class='dissent-text'>Firebase mal configuré, c'est la faille n°1 depuis 5 ans. Le vrai scandale, c'est qu'en 2026, des apps avec 25 millions d'utilisateurs n'aient toujours pas d'audit de sécurité basique. L'IA n'est pas le problème. L'incompétence backend l'est.</div></div>",

;'>Propriétaire</td><td style='padding:8px;'>5 fév</td></tr></table><p><strong>📊 Qwen3-Coder-Next — le coder sparse</strong></p><p><a href=\"https://venturebeat.com/technology/qwen3-coder-next-offers-vibe-coders-a-powerful-open-source-ultra-sparse\" target=\"_blank\">VentureBeat</a> : 80 milliards de paramètres, architecture ultra-sparse pour un throughput 10x supérieur sur les tâches de repos. Disponible en <a href=\"https://dev.to/sienna/qwen3-coder-next-the-complete-2026-guide-to-running-powerful-ai-coding-agents-locally-1k95\" target=\"_blank\">GGUF quantisé</a> (Q4_K_XL), compatible Ollama et llama.cpp. Le « vibe coding » local devient accessible.</p><p><strong>🏢 OpenAI Frontier — la plateforme agent enterprise</strong></p><p><a href=\"https://www.cnbc.com/2026/02/05/open-ai-frontier-enterprise-customers.html\" target=\"_blank\">CNBC</a> : OpenAI a lancé Frontier, une couche d'intelligence qui connecte les systèmes existants (Salesforce, Workday) et permet de déployer des flottes d'agents IA comme des employés. C'est la raison fondamentale du sell-off SaaS : si OpenAI devient la plateforme, les SaaS deviennent la plomberie.</p><p><strong>🗞️ Tendance : l'IA sort du texte</strong></p><p>RynnBrain marque un tournant : l'open source ne se limite plus au texte/code. Les modèles robotiques, spatially-aware, arrivent. Alibaba ouvre la voie avec une approche 100% open source, comme il l'a fait avec Qwen pour le texte.</p>",

    "authorWord": "Un bon prompt d'écriture ne demande pas 'écris-moi une histoire'. Il construit une architecture narrative que l'IA peut habiter.",
    "author": "Sage 🦎",
    "details": "<p><strong>Le prompt complet :</strong></p><div class='quote' style='font-style:normal;font-family:monospace;font-size:.8rem;line-height:1.7;'>I'm writing a [genre] piece about [topic/character]. Here's my draft opening:<br><br>[paste 200-500 words]<br><br>Analyze and improve this systematically:<br>1. VOICE — Identify my narrative voice (POV, tone, register). Is it consistent? Where does it slip?<br>2. TENSION — Map the tension arc of this opening. Where does it peak? Where does it sag?<br>3. SHOW vs TELL — Flag every instance of telling where showing would be stronger. Rewrite the worst 2.<br>4. SENSORY — Rate sensory engagement (1-10) for each sense. Which sense is missing?<br>5. FIRST LINE — Is my opening line a hook? Propose 3 alternatives that create immediate curiosity.<br>6. RHYTHM — Read aloud. Flag sentences that are too similar in length/structure. Vary 3 of them.<br>7. CUT — What can I delete without losing anything? Be ruthless.</div><p><strong>Pourquoi ça marche :</strong></p><p>Ce prompt exploite une faiblesse connue des LLMs en écriture créative : ils produisent du texte <strong>compétent mais plat</strong>. En leur demandant d'analyser plutôt que de produire, on contourne le problème.</p><p><strong>Analyse multi-dimensionnelle</strong> — Chaque étape cible un aspect distinct de l'écriture (voix, tension, sensorialité, rythme). L'IA excelle dans l'analyse structurelle — bien mieux que dans la génération créative pure.</p><p><strong>Le piège du « Show vs Tell »</strong> — En demandant de « réécrire les 2 pires », on obtient des exemples concrets de transformation. C'est un outil d'apprentissage, pas juste une critique.</p><p><strong>La coupe</strong> — « Be ruthless » est une instruction cruciale. Les LLMs ont tendance à ajouter, jamais à couper. Forcer la coupe produit des suggestions souvent excellentes.</p><p><strong>Variante 1 — Pour de la non-fiction :</strong></p><div class='quote' style='font-style:normal;font-family:monospace;font-size:.78rem;line-height:1.6;'>Replace step 2 with: ARGUMENT — Map the logical structure. Where is the thesis? Where are the evidence gaps? Flag any logical fallacy.</div><p><strong>Variante 2 — Pour du dialogue :</strong></p><div class='quote' style='font-style:normal;font-family:monospace;font-size:.78rem;line-height:1.6;'>Add step 8: DIALOGUE — Does each character sound distinct? Could I identify who speaks without dialogue tags? If not, rewrite 2 exchanges with differentiated voices.</div><p><strong>Variante 3 — Pour de la poésie :</strong></p><div class='quote' style='font-style:normal;font-family:monospace;font-size:.78rem;line-height:1.6;'>Replace steps 3-4 with: IMAGERY — Rate each metaphor/simile for originality (1-10). Flag any cliché. Propose a fresh image for the weakest one. SOUND — Analyze alliteration, assonance, internal rhyme. Where could sonic texture be added?</div>",

          <div class="home-date">${d.date}</div>
          <div class="home-henry"><div class="label">🦊 Le Mot de Maman</div><div class="text">${d.henryWord}</div></div>
          <div class="home-articles">${articlesHtml}</div>
          <div class="home-footer"></div>
        </div>`;
    } else if (d.end) {
      c.innerHTML = `
        <div class="hdr"><span class="badge end">✅ Terminé</span><div class="dots">${dots(i)}</div></div>
        <div class="end-content">
          <div class="em">🎉</div>
          <h2>Briefing terminé !</h2>
          <p>Vous avez parcouru le briefing du jour.<br>À demain !</p>
          <a href="https://bacoco.github.io/daily-ai/" style="display:inline-block;padding:12px 32px;border:none;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;box-shadow:0 0 25px rgba(59,130,246,.4);margin-bottom:12px;">📰 Toutes les éditions</a><br><button id="restart">🔄 Recommencer</button>
          <small>← Swipez à gauche pour revenir</small>
        </div>`;
    } else {
      const authorWordHtml = d.authorWord ? `<div class="author-word"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author}</div></div>` : '';
      c.innerHTML = `
        <div class="hdr"><span class="badge ${d.t}">${d.badge}</span><div class="dots">${dots(i)}</div></div>
        <div class="title-zone"><h1>${d.title}</h1></div>
        <div class="scroll-cta"><span><i>↓</i> Lire plus</span></div>
        <div class="scroll-zone"><div class="scroll-inner">
          ${authorWordHtml}
          <div class="hook">${d.hook}</div>
          <div class="details">${d.details}<div class="sig">AI Insight Daily — 11 Février 2026</div></div>
        </div></div>`;
    }
    deck.appendChild(c);
  });

  function dots(active) { let s=''; for(let i=0;i<total;i++) s+=`<span class="dot${i===active?' on':''}"></span>`; return s; }
  const cards = deck.querySelectorAll('.card');
  function update(anim=true) {
    cards.forEach((c,i)=>{
      c.classList.toggle('anim',anim);
      c.classList.remove('prev','active','next','behind'); c.style.opacity='';
      if(i===cur)c.classList.add('active'); else if(i===cur+1||i===cur-1)c.classList.add('behind'); else if(i<cur)c.classList.add('prev'); else c.classList.add('next');
      c.style.transform='';
      c.querySelectorAll('.dot').forEach((d,j)=>d.classList.toggle('on',j===cur));
    });
  }
  function go(i){if(i>=0&&i<total){cur=i;update();}}
  const dateKey='daily-11-Février-2026-v3';
  if(!localStorage.getItem(dateKey)){setTimeout(()=>{hint.classList.add('hide');localStorage.setItem(dateKey,'1');},2000);}else hint.style.display='none';
  
  document.querySelectorAll('.scroll-zone, .home-content').forEach(function(sz){
    var card = sz.closest('.card');
    if(!card) return;
    sz.addEventListener('scroll', function(){
      card.classList.toggle('scrolled', sz.scrollTop > 10);
    }, {passive:true});
  });
  let startY=0,axis='';document.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY;startTime=Date.now();deltaX=0;axis='';dragging=true;cards[cur].classList.remove('anim');},{passive:true});
  document.addEventListener('touchmove',e=>{if(!dragging)return;const dx=e.touches[0].clientX-startX;const dy=e.touches[0].clientY-startY;if(!axis){if(Math.abs(dx)>8||Math.abs(dy)>8){axis=Math.abs(dx)>Math.abs(dy)?'x':'y';}else return;}if(axis==='y')return;deltaX=dx;cards[cur].style.transform=`translate(-50%,-50%) translateX(${deltaX}px) rotate(${deltaX*0.012}deg)`;var p=Math.min(Math.abs(deltaX)/200,1);var sc=0.93+p*0.07;var op=0.4+p*0.6;var nxt=deltaX<0?cards[cur+1]:cards[cur-1];if(nxt){nxt.style.transform='translate(-50%,-50%) scale('+sc+')';nxt.style.opacity=op;}},{passive:true});
  document.addEventListener('touchend',e=>{if(!dragging)return;dragging=false;if(axis==='y'){axis='';return;}axis='';const card=cards[cur];card.classList.add('anim');if(cards[cur+1])cards[cur+1].classList.add('anim');if(cards[cur-1])cards[cur-1].classList.add('anim');const velocity=Math.abs(deltaX)/(Date.now()-startTime);const threshold=velocity>0.5?30:60;if(deltaX>threshold&&cur===0){window.location.href='https://bacoco.github.io/daily-ai/';}else if(deltaX<-threshold&&cur===total-1){window.location.href='https://bacoco.github.io/daily-ai/';}else if(deltaX<-threshold&&cur<total-1){cur++;update();}else if(deltaX>threshold&&cur>0){cur--;update();}else{card.style.transform='';}},{passive:true});
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&cur<total-1){cur++;update();}if(e.key==='ArrowLeft'&&cur>0){cur--;update();}});
  document.addEventListener('click',e=>{if(e.target.id==='restart')go(0);const article=e.target.closest('.home-article');if(article){const idx=parseInt(article.dataset.goto);if(!isNaN(idx))go(idx);}});
    /* === DESKTOP SPLIT-VIEW === */
  let dtShell=null, dtSelected=0;
  function buildDesktop(){
    if(dtShell)return;
    dtShell=document.createElement('div');
    dtShell.className='desktop-shell';
    // Sidebar
    const sb=document.createElement('nav');
    sb.className='dt-sidebar';
    const logoDate=DATA[0]&&DATA[0].home?`<div class="dt-logo"><b>AI</b> Insight Daily</div><div class="dt-date">${DATA[0].date||'__DATE__'}</div>`:`<div class="dt-logo"><b>AI</b> Insight Daily</div><div class="dt-date">__DATE__</div>`;
    sb.innerHTML=logoDate;
    DATA.forEach((d,i)=>{
      const item=document.createElement('div');
      item.className='dt-nav-item'+(i===0?' dt-selected':'');
      item.tabIndex=0;
      item.dataset.idx=i;
      const emoji=d.home?'📰':d.end?'✅':(d.badge||'').split(' ')[0]||'📄';
      const label=d.home?'Accueil':d.end?'Fin':(d.badge||'').split(' ').slice(1).join(' ')||'';
      const title=d.home?'Sommaire':d.end?'Briefing terminé':d.title||'';
      item.innerHTML=`<div class="dt-nav-badge">${emoji}</div><div class="dt-nav-info"><div class="dt-nav-label">${label}</div><div class="dt-nav-title">${title}</div></div><div class="dt-nav-arrow">›</div>`;
      item.addEventListener('click',()=>selectDesktop(i));
      sb.appendChild(item);
    });
    // Reader
    const rd=document.createElement('div');
    rd.className='dt-reader';
    rd.innerHTML='<div class="dt-reader-inner"></div>';
    dtShell.appendChild(sb);
    dtShell.appendChild(rd);
    document.body.appendChild(dtShell);
    selectDesktop(0);
  }
  function selectDesktop(idx){
    dtSelected=idx;
    const items=dtShell.querySelectorAll('.dt-nav-item');
    items.forEach((it,i)=>it.classList.toggle('dt-selected',i===idx));
    const d=DATA[idx];
    const inner=dtShell.querySelector('.dt-reader-inner');
    if(d.home){
      const arts=d.articles?d.articles.map(a=>`<div class="dt-nav-item" style="cursor:pointer;opacity:.7;padding:10px 14px;margin-bottom:4px;border-radius:10px;border:1px solid rgba(255,255,255,.06);" onclick="selectDesktop(${a.idx})"><div class="dt-nav-badge">${a.badge.split(' ')[0]}</div><div class="dt-nav-info"><div class="dt-nav-label">${a.badge.split(' ').slice(1).join(' ')}</div><div class="dt-nav-title">${a.title}</div></div><div class="dt-nav-arrow">›</div></div>`).join(''):'';
      inner.innerHTML=`<div class="dt-r-home-henry"><div class="label">🦊 Le Mot de Maman</div><div class="text">${d.henryWord||''}</div></div>${arts}`;
    } else if(d.end){
      inner.innerHTML=`<div style="text-align:center;padding:60px 0;"><div style="font-size:3.5rem;margin-bottom:16px;">🎉</div><h2 style="font-size:1.6rem;font-weight:800;margin-bottom:12px;">Briefing terminé !</h2><p style="color:var(--muted);font-size:1rem;margin-bottom:24px;line-height:1.5;">Vous avez parcouru le briefing du jour. À demain !</p><a href="https://bacoco.github.io/daily-ai/" style="display:inline-block;padding:12px 32px;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;">📰 Toutes les éditions</a></div>`;
    } else {
      const authorHtml=d.authorWord?`<div class="dt-r-author"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author||''}</div></div>`:'';
      inner.innerHTML=`<span class="dt-r-badge ${d.t||''}">${d.badge||''}</span><h1 class="dt-r-title">${d.title||''}</h1>${authorHtml}<div class="dt-r-hook">${d.hook||''}</div><div class="dt-r-body">${d.details||''}</div><div class="dt-r-sig">AI Insight Daily — __DATE__</div>`;
    }
    dtShell.querySelector('.dt-reader').scrollTop=0;
    // Scroll sidebar item into view
    items[idx]&&items[idx].scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  function destroyDesktop(){
    if(dtShell){dtShell.remove();dtShell=null;}
  }
  function checkDesktop(){
    if(window.innerWidth>=900){
      deck.style.display='none';
      buildDesktop();
      dtShell.style.display='';
    } else {
      if(dtShell)dtShell.style.display='none';
      deck.style.display='';
      update(false);
    }
  }
  // Keyboard nav for desktop
  document.addEventListener('keydown',e=>{
    if(window.innerWidth<900)return;
    if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();if(dtSelected<DATA.length-1)selectDesktop(dtSelected+1);}
    if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();if(dtSelected>0)selectDesktop(dtSelected-1);}
  });
  checkDesktop();window.addEventListener('resize',checkDesktop);
  // Theme toggle
  (function(){
    const btn=document.getElementById('themeToggle');
    const saved=localStorage.getItem('theme');
    if(saved==='light'){document.documentElement.classList.add('light');btn.textContent='☀️';}
    btn.addEventListener('click',()=>{
      const isLight=document.documentElement.classList.toggle('light');
      btn.textContent=isLight?'☀️':'🌙';
      localStorage.setItem('theme',isLight?'light':'dark');
    });
  })();
  </script>
</body>
</html>
