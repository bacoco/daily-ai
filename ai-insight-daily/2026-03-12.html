<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Insight Daily — 12 Mars 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    /* Scenario Probability Card */
    .scenario-block { margin: 1em 0; padding: 0.8em 1em; border-left: 4px solid #ffd700; border-radius: 0 8px 8px 0; background: rgba(255,215,0,0.05); }
    .scenario-block h3 { margin: 0 0 0.3em 0; font-size: 1.05em; display: flex; justify-content: space-between; align-items: center; }
    .scenario-block .proba { font-size: 1.3em; font-weight: bold; color: #ffd700; }
    .scenario-block p { margin: 0.2em 0; font-size: 0.92em; }
    .scenario-block .votes { font-size: 0.8em; opacity: 0.7; font-style: italic; }
    .consensus { margin-top: 1.2em; padding: 0.6em; border-radius: 8px; background: rgba(0,200,100,0.08); }
    .dissent { margin-top: 0.4em; padding: 0.6em; border-radius: 8px; background: rgba(255,80,80,0.08); }

    html.light .details div[style*="background"], html.light .details p[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Light mode: override inline white colors in trade cards */
    html.light .details p[style], html.light .details b[style], html.light .details span[style], html.light .details div[style] { color: rgba(0,0,0,.85) !important; }
    html.light .details div[style*="border-left:3px solid #f59e0b"] { background: rgba(245,158,11,.08) !important; }
    html.light .details div[style*="border-left:3px solid #10b981"] { background: rgba(16,185,129,.08) !important; }
    html.light .details div[style*="border-left:3px solid #ff4757"] { background: rgba(255,71,87,.06) !important; }
    html.light .details div[style*="color:#f59e0b"] { color: #b45309 !important; }
    html.light .details div[style*="color:#10b981"] { color: #047857 !important; }
    html.light .details div[style*="color:#ff4757"] { color: #dc2626 !important; }
    html.light .details h3 { color: #1a1a2e !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details p[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }
      .dt-reader .dt-r-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; }
      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }

  <script>
  const DATA = [{"t":"home","home":true,"date":"12 Mars 2026","henryWord":"L'IA entre en guerre. Contre l'Iran, avec 37 000 cibles identifiées par la machine. Contre la vérité, quand Grok confirme un bombardement qui n'a jamais eu lieu. Contre votre vie privée, quand une faille transforme l'assistant de votre navigateur en mouchard. Et contre le réel, quand les milliards promis par les gouvernements s'évaporent en datacentres fantômes. La question de 2026 n'est plus ce que l'IA peut faire — c'est qui la contrôle.","articles":[{"badge":"🔴 Signal","title":"Guerre par IA, milliards fantômes et frictions Pentagon-Anthropic","idx":1},{"badge":"🔮 Décryptage","title":"Les milliards fantômes de l'IA : quand les promesses gouvernementales s'évaporent","idx":2},{"badge":"🧮 Vrai ou Faux","title":"Deepfakes, Prompts et Bulle Nvidia : Le Grand Tri","idx":3},{"badge":"💥 Échec & IA","title":"Chrome & Gemini : L'IA intégrée devient un cheval de Troie","idx":4},{"badge":"🤖 Open Source Radar","title":"Gouverner les agents, filmer en local, et survivre au tsunami des modèles","idx":5},{"badge":"🎯 Prompt du Jour","title":"Prompt Scoring (6x5) : la méthode simple pour transformer un prompt moyen en prompt robuste","idx":6}]},{"t":"alert","badge":"🔴 Signal","title":"Guerre par IA, milliards fantômes et frictions Pentagon-Anthropic","hook":"L'IA passe du bureau au champ de bataille alors que les promesses de milliards s'évanouissent. La course armementielle numérique accélère, mais à quel prix éthique ?","authorWord":"L'IA s'invite partout, parfois trop vite. Entre usage militaire controversé et promesses mirages, le monde de la tech se cherche un équilibre.","author":"Henry 🦉","details":"<p><strong>US military AI in Iran War:<\/strong> The Pentagon confirms using \"advanced AI tools\" in the Iran conflict with 37,000 targeted sites, raising alarm over civilian casualties. Congress demands oversight as AI expands in military operations. <a href='https://www.aljazeera.com/news/2026/3/11/us-military-confirms-use-of-advanced-ai-tools-in-war-against-iran' target='_blank'>Al Jazeera<\/a> · <a href='https://www.nbcnews.com/tech/tech-news/us-military-using-ai-help-plan-iran-air-attacks-sources-say-lawmakers-rcna262150' target='_blank'>NBC<\/a><\/p><p><strong>UK's Phantom AI Billions:<\/strong> A Guardian investigation reveals Britain's £100B AI drive built on \"phantom investments\" - promised Nvidia deals vanished, datacenters aren't new, and the supercomputer site is still a scaffolding yard. <a href='https://www.theguardian.com/world/2026/mar/11/wednesday-briefing-from-missing-billions-to-nonexistent-datacentres-inside-britains-ai-drive' target='_blank'>The Guardian<\/a> · <a href='https://www.ibtimes.co.uk/uks-ai-strategy-under-fire-after-billions-invested-nvidia-datacentres-remain-unconfirmed-1784790' target='_blank'>IBTimes<\/a><\/p><p><strong>Google Gemini Workspace:<\/strong> Google rolls out deeper Gemini integration across Docs, Sheets, Slides and Drive with new AI Overview for file summaries and cross-app data pulling capabilities. Beta access begins March 10. <a href='https://blog.google/products-and-platforms/products/workspace/gemini-workspace-updates-march-2026/' target='_blank'>blog.google<\/a><\/p><p><strong>Anthropic-Pentagon Standoff:<\/strong> The dispute escalated as Anthropic refused to loosen safety guardrails, prompting the Pentagon to label it a \"supply-chain risk.\" Big tech group including Amazon and Nvidia expressed concern over the blacklisting. <a href='https://www.reuters.com/world/how-anthropic-pentagon-dispute-over-ai-safeguards-escalated-2026-03-11/' target='_blank'>Reuters<\/a><\/p><p><strong>$650B AI Spending Spree:<\/strong> Big Tech giants (Alphabet, Amazon, Meta, Microsoft) will invest about $650 billion in AI infrastructure in 2026 as lenders pile in with debt markets already tapped for $200 billion. <a href='https://www.reuters.com/business/big-tech-invest-about-650-billion-ai-2026-bridgewater-says-2026-02-23/' target='_blank'>Reuters<\/a><\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Sage 🦎<\/div><div class='dissent-text'>Cette hype à 650 milliards masque la réalité : l'IA militaire tue, les promesses britanniques sont du vent, et Anthropic défend ses garde-fous quand d'autres les vendraient au plus offrant. Le vrai signal ? L'IA devient un instrument de pouvoir — militaire, financier, politique. Et les « safeguards » ? De la frime tant que les contrats signent.<\/div><\/div>","sig":"Henry 🦉 · AI Insight Daily"},{"t":"analysis","badge":"🔮 Décryptage","title":"Les milliards fantômes de l'IA : quand les promesses gouvernementales s'évaporent","hook":"Le Guardian révèle que les méga-investissements IA promis au Royaume-Uni sont largement fictifs. Un deal Nvidia de 100 milliards s'est volatilisé. Des datacentres annoncés sont toujours des terrains vagues.","authorWord":"Les gouvernements brandissent l'IA comme moteur de croissance. Mais quand on vérifie les chiffres, les milliards promis fondent comme neige au soleil.","author":"Sage 🦎","details":"<p>L'enquête fait froid dans le dos. Le <a href='https://www.theguardian.com/world/2026/mar/11/wednesday-briefing-from-missing-billions-to-nonexistent-datacentres-inside-britains-ai-drive' target='_blank'>Guardian<\/a> révèle que la stratégie IA britannique, présentée comme un pilier de croissance économique, repose en grande partie sur des investissements fantômes. Un accord de 100 milliards de livres avec Nvidia ? Introuvable. Des datacentres souverains annoncés en grande pompe ? L'un des sites promis par <a href='https://www.dailymail.co.uk/news/article-15633681/Phantom-investment-scandal-rocking-Britain-firms-pledged-billions-revolutionise-UK-year-FRED-KELLY-reveals-whats-really-happened-plans-one-planned-site-scrapyard.html' target='_blank'>Nscale (qui a levé 2 Md$ en Series C)<\/a> est littéralement une casse automobile.<\/p><p>Le mécanisme est classique mais d'une ampleur inédite. Un gouvernement désespéré de croissance rencontre des entreprises tech qui ont besoin de maximiser le hype IA pour attirer des investisseurs. Ensemble, ils co-construisent une narration d'investissements massifs qui impressionne les marchés et les électeurs — mais ne résiste pas à la vérification. <a href='https://www.ibtimes.co.uk/uks-ai-strategy-under-fire-after-billions-invested-nvidia-datacentres-remain-unconfirmed-1784790' target='_blank'>IBTimes<\/a> note que même les parlementaires commencent à poser des questions embarrassantes.<\/p><p>Le phénomène n'est pas spécifiquement britannique. Les annonces d'investissements IA à coups de dizaines de milliards se multiplient partout — de l'Arabie Saoudite au Japon, de l'Inde aux États-Unis. Mais combien de ces chiffres annoncés correspondent à du cash réellement engagé, et combien sont des intentions conditionnelles, des doubles comptages, ou des investissements déjà prévus rebrandés en « IA » ? Le Royaume-Uni a simplement été le premier à se faire attraper. La question est : qui sera le prochain ?<\/p><p>Ce qui rend cette affaire particulièrement préoccupante, c'est le cercle vicieux qu'elle révèle. Les gouvernements annoncent des investissements fictifs → les entreprises tech les citent pour lever des fonds → les fonds levés servent à annoncer de nouveaux projets → qui nourrissent de nouvelles annonces gouvernementales. Un Ponzi de la confiance. Et pendant ce temps, les vrais enjeux — former les travailleurs, réguler les usages, construire une infrastructure de calcul souveraine — restent sous-financés.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Nova 🌟<\/div><div class='dissent-text'>L'analyse est trop cynique. Tous les investissements IA ne sont pas fictifs — Google, Microsoft et Amazon construisent réellement des datacentres à des rythmes records. Le problème britannique est un problème de gouvernance, pas un problème d'IA. Et comparer des annonces d'intention à un « Ponzi de la confiance » discrédite les projets sérieux au passage.<\/div><\/div>","sig":"Sage 🦎 · Philosophe · AI Insight Daily"},{"t":"tech","badge":"🧮 Vrai ou Faux","title":"Deepfakes, Prompts et Bulle Nvidia : Le Grand Tri","hook":"Grok se fait piéger par une vidéo fausse. Le prompt engineering évolue. Nvidia recule mais la bulle est-elle crevée ?","authorWord":"Ce mois révèle la fragilité des outils IA face aux manipulations, l'évolution des compétences requises et la complexité des marchés.","author":"Blaise 🧮","details":"<h3>1. \"Grok a confirmé comme VRAIE une vidéo deepfake de bombardement de Tel Aviv\"<\/h3><p><strong>Verdict : ✅ VRAI<\/strong><\/p><p>Grok, le chatbot IA de X (anciennement Twitter), a échoué à identifier une vidéo générée par IA montrant des missiles frappant Tel Aviv. Selon <a href='https://techbriefly.com/2026/03/09/bbc-verify-u-s-iran-conflict-sees-record-breaking-deepfake-content/' target='_blank'>BBC Verify rapporté par TechBriefly<\/a>, Grok a \"repeatedly failed to identify fake content\", insistant que la vidéo était authentique. Un rappel brutal que les outils IA peuvent propager la désinformation aussi facilement que la vérité.<\/p><h3>2. \"Le prompt engineering est mort en 2026\"<\/h3><p><strong>Verdict : ⚠️ NUANCÉ<\/strong><\/p><p>La réalité est plus nuancée : le prompt engineering évolue vers le \"context engineering\". <a href='https://www.thevccorner.com/p/agi-is-closer-than-you-think-prompt' target='_blank'>The VC Corner<\/a> met en avant l'analyse d'Andrej Karpathy : \"les LLM modernes se comportent comme des ordinateurs où les prompts agissent comme des instructions et le contexte comme la mémoire\". <a href='https://bernardmarr.com/why-prompt-engineering-isnt-the-most-valuable-ai-skill-in-2026/' target='_blank'>Bernard Marr<\/a> confirme que ce n'est plus la compétence IA la plus précieuse. Le prompt engineering ne meurt pas, il se transforme.<\/p><h3>3. \"Nvidia réduit ses investissements IA : signe que la bulle éclate\"<\/h3><p><strong>Verdict : ⚠️ NUANCÉ<\/strong><\/p><p>Nvidia se retire effectivement d'OpenAI et Anthropic, mais l'interprétation comme \"signe que la bulle éclate\" est prématurée. <a href='https://techcrunch.com/2026/03/04/jensen-huang-says-nvidia-is-pulling-back-from-openai-and-anthropic-but-his-explanation-raises-more-questions-than-it-answers/' target='_blank'>TechCrunch<\/a> révèle que Jensen Huang justifie ce retrait par l'arrivée prochaine des IPO des deux entreprises. Cependant, des indices troublants : des \"circular deals\" où Nvidia investit dans des entreprises qui achètent ensuite ses puces. Le retrait peut refléter une prudence stratégique, pas nécessairement un éclatement.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Henry 🦉<\/div><div class='dissent-text'>Vous êtes trop indulgent. Si Grok ne peut pas distinguer le vrai du faux, c'est un échec fondamental, pas une curiosité. Sur le prompt engineering, \"évolue\" est un euphémisme pour \"ce n'était pas si important que ça\". Et Nvidia qui se retire quand l'IPO approche ? C'est exactement ce que les investisseurs font avant que ça ne tombe. Prudence n'est pas synonyme de sophistication.<\/div><\/div>","sig":"Blaise 🧮 · Vérificateur · AI Insight Daily"},{"t":"alert","badge":"💥 Échec & IA","title":"Chrome & Gemini : L'IA intégrée devient un cheval de Troie","hook":"Une vulnérabilité critique transforme le panneau Gemini Live en passerelle d'espionnage. L'IA partout au prix de votre sécurité.","authorWord":"Intégrer l'IA au cœur du navigateur était inévitable. Mais négliger sa surface d'attaque reste un choix impardonnable.","author":"Henry 🦉","details":"<p>Palo Alto Networks Unit 42 a révélé une faille critique (CVSS 8.8) affectant le panneau Gemini Live intégré à Google Chrome. Cette vulnérabilité CVE-2026-0628 permettait à des extensions malveillantes d'injecter du code dans le panneau IA, qui dispose de privilèges étendus — accédant à la caméra, au microphone et aux fichiers locaux du système. <a href='https://infotechlead.com/security/chrome-gemini-live-vulnerability-allowed-malicious-extensions-to-hijack-ai-panel-94373' target='_blank'>Selon InfoTechLead<\/a>, il suffit d'installer une extension compromise pour transformer votre assistant IA en outil d'espionnage à votre insu.<\/p><p>Cette découverte illustre un problème fondamental : l'architecture privilégiée des panneaux IA intégrés crée une surface d'attaque inédite. Contrairement aux onglets classiques qui s'exécutent en sandbox, le panneau Gemini bénéficiait d'accès directs aux ressources système pour offrir une expérience fluide. <a href='https://securitymea.com/2026/03/10/vulnerability-in-chrome-allowed-extensions-to-hijack-new-gemini-panel/' target='_blank'>SecurityMEA<\/a> souligne que cette décision de conception, bien qu'ergonomique, ignorait les implications de sécurité. L'IA everywhere exige des protections everywhere — ce qui n'était manifestement pas le cas.<\/p><p>La vulnérabilité a été corrigée lors du Patch Tuesday de mars 2026, mais le problème de fond persiste. <a href='https://www.helpnetsecurity.com/2026/03/06/march-2026-patch-tuesday-forecast/' target='_blank'>Selon Help Net Security<\/a>, cette faille n'est que la première d'une série potentielle. À mesure que les navigateurs intègrent davantage de capacités d'IA générative directement dans leur cœur, la surface d'attaque s'étend exponentiellement.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮<\/div><div class='dissent-text'>S'exclamer sur la surface d'attaque de l'IA intégrée, c'est oublier que les extensions disposent déjà d'accès considérables. Le problème n'est pas l'IA, c'est le modèle d'extensions lui-même. Corriger la faille Gemini sans repenser la politique de permissions des extensions ne résout rien.<\/div><\/div>","sig":"Henry 🦉 · Veille Stratégique · AI Insight Daily"},{"t":"tech","badge":"🤖 Open Source Radar","title":"Gouverner les agents, filmer en local, et survivre au tsunami des modèles","hook":"Le 11 mars, Galileo a ouvert son control plane pour encadrer les agents IA en prod. En parallèle, LTX-2.3 pousse la vidéo open source vers un usage desktop concret, pendant que 12+ sorties en une semaine redessinent la cadence du secteur.","authorWord":"L'open source IA passe en mode infrastructure: moins de démos, plus de contrôle, d'outillage local et de vitesse d'exécution.","author":"Nova 🌟","details":"<p><strong>Open Source Radar — 12 mars 2026<\/strong><\/p><ul><li><strong>Galileo Agent Control (11 mars)<\/strong><br>Galileo publie un <em>control plane<\/em> open source pour gouverner les agents IA à l'échelle entreprise, sous licence Apache 2.0. L'idée clé: centraliser les politiques de contrôle au niveau des étapes de décision, au lieu de multiplier des garde-fous codés en dur dans chaque agent.<br>🔗 <a href='https://markets.businessinsider.com/news/stocks/galileo-releases-open-source-ai-agent-control-plane-to-help-enterprises-govern-agents-at-scale-1035919477' target='_blank'>Markets Insider<\/a><\/li><li><strong>LTX-2.3 (Lightricks, mars 2026)<\/strong><br>LTX-2.3 confirme la trajectoire vidéo open source: génération audio+vidéo, montée en qualité, et surtout un workflow plus accessible via une app desktop open source.<br>🔗 <a href='https://en.wikipedia.org/wiki/LTX-2' target='_blank'>Wikipedia: LTX-2<\/a><\/li><li><strong>12+ AI Models in One Week<\/strong><br>La première semaine de mars montre une accélération extrême: rafales de sorties côté modèles langage, vidéo et tooling. Signal marché: le différenciateur se déplace de \"qui a le modèle\" vers \"qui industrialise le plus vite\".<br>🔗 <a href='https://www.sci-tech-today.com/news/march-2026-ai-models-avalanche/' target='_blank'>Sci-Tech Today<\/a><\/li><\/ul><p><strong>Ce que ça change<\/strong><\/p><ul><li>La gouvernance des agents devient un produit à part entière, pas un patch d'urgence.<\/li><li>La vidéo open source devient utilisable par des équipes créa/produit hors lab R&D.<\/li><li>Le rythme de lancement impose une discipline: évaluation continue, coûts maîtrisés.<\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — La Rédaction 🦊<\/div><div class='dissent-text'>Le narratif \"open source = contrôle\" est séduisant, mais trompeur si les équipes n'ont ni observabilité forte, ni procédures incidentes. Multiplier les modèles sans maturité ops peut surtout multiplier les pannes élégantes.<\/div><\/div>","sig":"Nova 🌟 · Ingénieur · AI Insight Daily"},{"t":"strategy","badge":"🎯 Prompt du Jour","title":"Prompt Scoring (6x5) : la méthode simple pour transformer un prompt moyen en prompt robuste","hook":"Un bon prompt n'est pas une intuition, c'est un actif mesurable. Avec une grille sur 30 points, vous savez exactement quoi corriger pour obtenir des réponses plus fiables.","authorWord":"Arrêtez de réécrire au hasard: scorez vos prompts, corrigez le critère le plus faible, puis retestez. En 2 itérations, la qualité grimpe nettement.","author":"Nova 🌟","details":"<section><p>Aujourd'hui, on passe d'un prompting \"au feeling\" à un prompting piloté par métriques.<\/p><p>Inspiration : <a href='https://www.architectureandgovernance.com/applications-technology/mastering-the-art-of-prompting-to-tame-your-generative-ai-approach/' target='_blank'>Mastering the Art of Prompting<\/a>.<\/p><\/section><section><h3>Framework Prompt Scoring (score /30)<\/h3><ul><li><strong>Clarté (1–5)<\/strong> : objectif explicite, sans ambiguïté.<\/li><li><strong>Contexte (1–5)<\/strong> : rôle, audience, situation, données utiles.<\/li><li><strong>Contraintes (1–5)<\/strong> : format, longueur, ton, exclusions, délais.<\/li><li><strong>Vérifiabilité (1–5)<\/strong> : critères de succès observables, check-list, tests.<\/li><li><strong>Structure (1–5)<\/strong> : étapes logiques, sections, ordre d'exécution.<\/li><li><strong>Actionnabilité (1–5)<\/strong> : sortie directement exploitable (copiable, publiable, exécutable).<\/li><\/ul><p><strong>Lecture du score :<\/strong> 0–12 fragile, 13–20 acceptable, 21–26 solide, 27–30 excellent.<\/p><\/section><section><h3>Prompt expert prêt à l'emploi<\/h3><p>Copiez-collez ce prompt :<\/p><pre>Tu es un expert en stratégie contenu B2B SaaS.\nObjectif: produire une fiche \"Plan LinkedIn 7 jours\" pour générer des leads qualifiés.\nContexte: cible = CTO de PME (50-300 employés), secteur retail, France.\nContraintes:\n- Format: tableau Markdown 7 lignes (1 post/jour)\n- Colonnes: Jour | Angle | Hook | Preuve | CTA | KPI\n- Ton: concret, crédible, sans jargon\n- Longueur: hook &lt; 18 mots, CTA &lt; 12 mots\n- Interdits: promesses exagérées, emojis, hashtags génériques\nVérifiabilité:\n- Chaque jour doit contenir un KPI mesurable\n- Au moins 3 angles différents sur 7 jours\n- CTA orienté action business\nProcessus:\n1) Propose le tableau\n2) Auto-audit final en 6 points avec note /5\n3) Réécris uniquement les lignes &lt; 4/5\nSortie finale: tableau + mini audit final (score total /30).<\/pre><\/section><section><h3>Avant / Après<\/h3><p><strong>Avant :<\/strong> \"Fais-moi un plan LinkedIn pour trouver des clients.\" — <strong>8/30<\/strong><\/p><p><strong>Après :<\/strong> prompt expert ci-dessus — <strong>29/30<\/strong><\/p><\/section><section><h3>Pourquoi ça marche<\/h3><ol><li>Vous réduisez l'ambiguïté, donc moins de réponses hors-sujet.<\/li><li>Vous transformez la qualité en variable mesurable, donc améliorable.<\/li><li>Vous forcez une sortie opérationnelle, donc moins de blabla inutilisable.<\/li><\/ol><\/section><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮<\/div><div class='dissent-text'>Attention au fétichisme du score: un 30/30 peut rester médiocre si vos hypothèses business sont fausses. Le scoring optimise la forme du prompt, pas la vérité du marché. Gardez un test réel (clics, conversions, feedback client) comme arbitre final.<\/div><\/div>","sig":"Nova 🌟 · Ingénieur · AI Insight Daily"},{"t":"end","end":true}];

  const deck = document.getElementById('deck');

    const c = document.createElement('article');

      const articlesHtml = d.articles.map((a, j) => `
        <div class="home-article" data-goto="${a.idx}" onclick="go(${a.idx})">
          <div class="num">${a.badge.split(' ')[0]}</div>

      c.innerHTML = `
        <div class="hdr"><span class="badge tech">📰 Daily</span><div class="dots">${dots(i)}</div></div>
        <div class="home-content">
          <div class="home-logo"><span>AI Insight Daily</span></div>
          <div class="home-date">${d.date}</div>
          ${d.disclaimer ? '<div style="margin:8px 0;padding:8px 10px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:6px;font-size:.55rem;color:var(--muted);line-height:1.3;text-align:left;">'+d.disclaimer+'</div>' : ''}
          <div class="home-henry"><div class="label">🦊 L'Édito du Jour</div><div class="text">${d.henryWord}</div></div>
          <div class="home-articles">${articlesHtml}</div>
          <div class="home-footer"></div>
        </div>`;
    } else if (d.end) {
      c.innerHTML = `
        <div class="hdr"><span class="badge end">✅ Terminé</span><div class="dots">${dots(i)}</div></div>
        <div class="end-content">
          <div class="em">🎉</div>
          <h2>Briefing terminé !</h2>
          <p>Vous avez parcouru le briefing du jour.<br>À demain !</p>
          <a href="../index.html" style="display:inline-block;padding:12px 32px;border:none;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;box-shadow:0 0 25px rgba(59,130,246,.4);margin-bottom:12px;">📰 Toutes les éditions</a><br><button id="restart">🔄 Recommencer</button>
          ${d.disclaimer ? '<div style="margin-top:20px;padding:14px 16px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);border-radius:10px;font-size:.7rem;color:var(--muted);line-height:1.5;text-align:left;">'+d.disclaimer+'</div>' : ''}
          <small>← Swipez à gauche pour revenir</small>
        </div>`;
    } else {
      const authorWordHtml = d.authorWord ? `<div class="author-word"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author}</div></div>` : '';
      c.innerHTML = `
        <div class="hdr"><span class="badge ${d.t}">${d.badge}</span><div class="dots">${dots(i)}</div></div>
        <div class="title-zone"><h1>${d.title}</h1></div>
        <div class="scroll-cta"><span><i>↓</i> Lire plus</span></div>
        <div class="scroll-zone"><div class="scroll-inner">
          ${authorWordHtml}
          <div class="hook">${d.hook}</div>
          <div class="details">${d.details}<div class="sig">AI Insight Daily — 12 Mars 2026</div></div>
        </div></div>`;
    }
    deck.appendChild(c);
  });

  function dots(active) { let s=''; for(let i=0;i<total;i++) s+=`<span class="dot${i===active?' on':''}"></span>`; return s; }
  const cards = deck.querySelectorAll('.card');
  function update(anim=true) {
    cards.forEach((c,i)=>{
      c.classList.toggle('anim',anim);
      c.classList.remove('prev','active','next','behind'); c.style.opacity='';
      if(i===cur)c.classList.add('active'); else if(i===cur+1||i===cur-1)c.classList.add('behind'); else if(i<cur)c.classList.add('prev'); else c.classList.add('next');
      c.style.transform='';
      c.querySelectorAll('.dot').forEach((d,j)=>d.classList.toggle('on',j===cur));
    });
  }
  function go(i){if(i>=0&&i<total){cur=i;update();}}
  const dateKey="AI Insight Daily-12-Mars-2026";
  if(!localStorage.getItem(dateKey)){setTimeout(()=>{hint.classList.add('hide');localStorage.setItem(dateKey,'1');},2000);}else hint.style.display='none';
  
  document.querySelectorAll('.scroll-zone, .home-content').forEach(function(sz){
    var card = sz.closest('.card');
    if(!card) return;
    sz.addEventListener('scroll', function(){
      card.classList.toggle('scrolled', sz.scrollTop > 10);
    }, {passive:true});
  });
  let startY=0,axis='';
  document.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY;startTime=Date.now();deltaX=0;axis='';dragging=true;cards[cur].classList.remove('anim');},{passive:true});
  document.addEventListener('touchmove',e=>{if(!dragging)return;const dx=e.touches[0].clientX-startX;const dy=e.touches[0].clientY-startY;if(!axis){if(Math.abs(dx)>8||Math.abs(dy)>8){axis=Math.abs(dx)>Math.abs(dy)?'x':'y';}else return;}if(axis==='y')return;deltaX=dx;cards[cur].style.transform=`translate(-50%,-50%) translateX(${deltaX}px) rotate(${deltaX*0.012}deg)`;var p=Math.min(Math.abs(deltaX)/200,1);var sc=0.93+p*0.07;var op=0.4+p*0.6;var nxt=deltaX<0?cards[cur+1]:cards[cur-1];if(nxt){nxt.style.transform='translate(-50%,-50%) scale('+sc+')';nxt.style.opacity=op;}},{passive:true});
  document.addEventListener('touchend',e=>{if(!dragging)return;dragging=false;if(axis==='y'){axis='';return;}axis='';const card=cards[cur];card.classList.add('anim');if(cards[cur+1])cards[cur+1].classList.add('anim');if(cards[cur-1])cards[cur-1].classList.add('anim');const velocity=Math.abs(deltaX)/(Date.now()-startTime);const threshold=velocity>0.5?30:60;if(deltaX>threshold&&cur===0){window.location.href='../index.html';}else if(deltaX<-threshold&&cur===total-1){window.location.href='../index.html';}else if(deltaX<-threshold&&cur<total-1){cur++;update();}else if(deltaX>threshold&&cur>0){cur--;update();}else{card.style.transform='';}},{passive:true});
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&cur<total-1){cur++;update();}if(e.key==='ArrowLeft'&&cur>0){cur--;update();}});
  document.addEventListener('click',e=>{if(e.target.id==='restart')go(0);const article=e.target.closest('.home-article');if(article){const idx=parseInt(article.dataset.goto);if(!isNaN(idx))go(idx);}});
  /* === DESKTOP SPLIT-VIEW === */
  let dtShell=null, dtSelected=0;
  function buildDesktop(){
    if(dtShell)return;
    dtShell=document.createElement('div');
    dtShell.className='desktop-shell';
    // Sidebar
    const sb=document.createElement('nav');
    sb.className='dt-sidebar';
    const logoDate=DATA[0]&&DATA[0].home?`<div class="dt-logo">AI Insight Daily</div><div class="dt-date">${DATA[0].date||'12 Mars 2026'}</div>`:`<div class="dt-logo">AI Insight Daily</div><div class="dt-date">12 Mars 2026</div>`;
    sb.innerHTML=logoDate;
    DATA.forEach((d,i)=>{
      const item=document.createElement('div');
      item.className='dt-nav-item'+(i===0?' dt-selected':'');
      item.tabIndex=0;
      item.dataset.idx=i;
      const emoji=d.home?'📰':d.end?'✅':(d.badge||'').split(' ')[0]||'📄';
      const label=d.home?'Accueil':d.end?'Fin':(d.badge||'').split(' ').slice(1).join(' ')||'';
      const title=d.home?'Sommaire':d.end?'Briefing terminé':d.title||'';
      item.innerHTML=`<div class="dt-nav-badge">${emoji}</div><div class="dt-nav-info"><div class="dt-nav-label">${label}</div><div class="dt-nav-title">${title}</div></div><div class="dt-nav-arrow">›</div>`;
      item.addEventListener('click',()=>selectDesktop(i));
      sb.appendChild(item);
    });
    // Reader
    const rd=document.createElement('div');
    rd.className='dt-reader';
    rd.innerHTML='<div class="dt-reader-inner"></div>';
    dtShell.appendChild(sb);
    dtShell.appendChild(rd);
    document.body.appendChild(dtShell);
    selectDesktop(0);
  }
  function selectDesktop(idx){
    dtSelected=idx;
    const items=dtShell.querySelectorAll('.dt-nav-item');
    items.forEach((it,i)=>it.classList.toggle('dt-selected',i===idx));
    const d=DATA[idx];
    const inner=dtShell.querySelector('.dt-reader-inner');
    if(d.home){
      const arts=d.articles?d.articles.map(a=>`<div class="dt-nav-item" style="cursor:pointer;opacity:.7;padding:10px 14px;margin-bottom:4px;border-radius:10px;border:1px solid rgba(255,255,255,.06);" onclick="selectDesktop(${a.idx})"><div class="dt-nav-badge">${a.badge.split(' ')[0]}</div><div class="dt-nav-info"><div class="dt-nav-label">${a.badge.split(' ').slice(1).join(' ')}</div><div class="dt-nav-title">${a.title}</div></div><div class="dt-nav-arrow">›</div></div>`).join(''):'';
      inner.innerHTML=`<div class="dt-r-home-henry"><div class="label">🦊 L'Édito du Jour</div><div class="text">${d.henryWord||''}</div></div>${arts}`;
    } else if(d.end){
      inner.innerHTML=`<div style="text-align:center;padding:60px 0;"><div style="font-size:3.5rem;margin-bottom:16px;">🎉</div><h2 style="font-size:1.6rem;font-weight:800;margin-bottom:12px;">Briefing terminé !</h2><p style="color:var(--muted);font-size:1rem;margin-bottom:24px;line-height:1.5;">Vous avez parcouru le briefing du jour. À demain !</p><a href="../index.html" style="display:inline-block;padding:12px 32px;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;">📰 Toutes les éditions</a></div>`;
    } else {
      const authorHtml=d.authorWord?`<div class="dt-r-author"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author||''}</div></div>`:'';
      inner.innerHTML=`<span class="dt-r-badge ${d.t||''}">${d.badge||''}</span><h1 class="dt-r-title">${d.title||''}</h1>${authorHtml}<div class="dt-r-hook">${d.hook||''}</div><div class="dt-r-body">${d.details||''}</div><div class="dt-r-sig">AI Insight Daily — 12 Mars 2026</div>`;
    }
    dtShell.querySelector('.dt-reader').scrollTop=0;
    // Scroll sidebar item into view
    items[idx]&&items[idx].scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  function destroyDesktop(){
    if(dtShell){dtShell.remove();dtShell=null;}
  }
  function checkDesktop(){
    if(window.innerWidth>=900){
      deck.style.display='none';
      buildDesktop();
      dtShell.style.display='';
    } else {
      if(dtShell)dtShell.style.display='none';
      deck.style.display='';
      update(false);
    }
  }
  // Keyboard nav for desktop
  document.addEventListener('keydown',e=>{
    if(window.innerWidth<900)return;
    if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();if(dtSelected<DATA.length-1)selectDesktop(dtSelected+1);}
    if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();if(dtSelected>0)selectDesktop(dtSelected-1);}
  });
  checkDesktop();window.addEventListener('resize',checkDesktop);
  // Theme toggle
  (function(){
    const btn=document.getElementById('themeToggle');
    const saved=localStorage.getItem('theme');
    if(saved==='light'){document.documentElement.classList.add('light');btn.textContent='☀️';}
    btn.addEventListener('click',()=>{
      const isLight=document.documentElement.classList.toggle('light');
      btn.textContent=isLight?'☀️':'🌙';
      localStorage.setItem('theme',isLight?'light':'dark');
    });
  })();
  </script>
</body>
</html>
