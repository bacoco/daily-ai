<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Insight Daily — 10 Mars 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    html.light .details div[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Light mode: override inline white colors in trade cards */
    html.light .details p[style], html.light .details b[style], html.light .details span[style], html.light .details div[style] { color: rgba(0,0,0,.85) !important; }
    html.light .details div[style*="border-left:3px solid #f59e0b"] { background: rgba(245,158,11,.08) !important; }
    html.light .details div[style*="border-left:3px solid #10b981"] { background: rgba(16,185,129,.08) !important; }
    html.light .details div[style*="border-left:3px solid #ff4757"] { background: rgba(255,71,87,.06) !important; }
    html.light .details div[style*="color:#f59e0b"] { color: #b45309 !important; }
    html.light .details div[style*="color:#10b981"] { color: #047857 !important; }
    html.light .details div[style*="color:#ff4757"] { color: #dc2626 !important; }
    html.light .details h3 { color: #1a1a2e !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }
      .dt-reader .dt-r-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; }
      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }
      .dt-reader .dt-r-body p { margin-bottom: 18px; }
      .dt-reader .dt-r-body strong { color: #fff; font-weight: 600; }
      .dt-reader .dt-r-body a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
      .dt-reader .dt-r-body .quote { border-left: 3px solid var(--blue); padding: 14px 18px; margin: 20px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-style: italic; font-size: .95rem; line-height: 1.6; color: rgba(255,255,255,.9); }
      .dt-reader .dt-r-body .dissent { margin-top: 24px; padding: 16px 18px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }

  <script>
  const DATA = [{"t":"home","home":true,"date":"10 Mars 2026","henryWord":"L'IA adulte a mal aux genoux. Anthropic double ses revenus mais poursuit Washington en justice, un Nobel annonce la bulle, et les régulateurs du monde entier se contredisent. Entre victoires commerciales et crises de croissance, l'industrie découvre ce que signifie devenir essentielle — et les responsabilités qui viennent avec.","articles":[{"badge":"🔴 Signal","title":"Anthropic en mode blitzkrieg : marketplace, 19 Md$ et procès contre Washington","idx":1},{"badge":"🔮 Décryptage","title":"Le Labyrinthe Réglementaire : quand l'IA ne sait plus à quelle loi obéir","idx":2},{"badge":"🧮 Vrai ou Faux","title":"19 milliards, bulle IA et superintelligence interdite — on démêle le vrai du faux","idx":3},{"badge":"💥 Échec & IA","title":"Le dernier kilomètre tue les projets IA : quand l'infra est prête mais l'organisation ne suit pas","idx":4},{"badge":"🤖 Open Source Radar","title":"Karpathy open-source autoresearch : un labo ML autonome en 630 lignes","idx":5},{"badge":"🎯 Prompt du Jour","title":"Thinking vs Instant vs Search : la matrice de choix en 30 secondes","idx":6}]},{"t":"alert","badge":"🔴 Signal","title":"Anthropic en mode blitzkrieg : marketplace, 19 Md$ et procès contre Washington","hook":"Anthropic double ses revenus en 3 mois, lance un marketplace d'outils IA, et attaque le Pentagone en justice. Pendant ce temps, un Nobel prédit l'éclatement de la bulle.","authorWord":"Anthropic double ses revenus à 19Md$ run-rate, lance le Claude Marketplace, poursuit le gouvernement US, et Nscale lève 2Md$ en Europe. L'IA s'institutionnalise à toute vitesse.","author":"Henry 🦉","details":"<p><strong>🚀 Anthropic en mode offensif total.<\/strong> Le chiffre d'abord : <a href='https://www.pymnts.com/artificial-intelligence-2/2026/anthropic-marketplace-simplifies-ai-buying-for-enterprises/' target=_blank>19 milliards de dollars de revenus annualisés<\/a>, doublés en seulement 3 mois grâce à l'explosion de Claude Code. Puis l'offensive commerciale : le <a href='https://venturebeat.com/technology/anthropic-launches-claude-marketplace-giving-enterprises-access-to-claude' target=_blank>Claude Marketplace<\/a> permet aux entreprises d'utiliser leur engagement Anthropic pour acheter des outils tiers — GitLab, Harvey, Lovable, Replit, Rogo, Snowflake. Un AppStore de l'IA d'entreprise.<\/p><p><strong>⚖️ Front juridique.<\/strong> En parallèle, Anthropic <a href='https://www.pymnts.com/legal/2026/anthropic-sues-us-government-over-supply-chain-risk-designation/' target=_blank>poursuit le gouvernement américain<\/a> en justice, contestant sa désignation comme \"risque pour la chaîne d'approvisionnement\" — conséquence directe de son refus de retirer les garde-fous de Claude pour usage militaire. L'entreprise qui dit non au Pentagone, ça se paie.<\/p><p><strong>💰 Compute et agents.<\/strong> En Europe, <a href='https://www.nscale.com/press-releases/nscale-series-c' target=_blank>Nscale lève 2 milliards de dollars<\/a> en Series C — le plus gros tour européen de l'histoire — pour construire l'infrastructure GPU de l'IA. Côté agents, <a href='https://www.pymnts.com/news/artificial-intelligence/2026/lyzr-valuation-jumps-250-million-dollars-enterprises-deploy-ai-agents/' target=_blank>Lyzr atteint 250M$ de valorisation<\/a> pour ses agents IA d'entreprise. Et <a href='https://www.marktechpost.com/2026/03/08/andrej-karpathy-open-sources-autoresearch-a-630-line-python-tool-letting-ai-agents-run-autonomous-ml-experiments-on-single-gpus/' target=_blank>Karpathy open-source \"autoresearch\"<\/a>, un labo ML autonome en 630 lignes.<\/p><p><strong>⚡ L'alerte Stiglitz.<\/strong> Le Nobel d'économie <a href='https://fortune.com/2026/03/08/joseph-stiglitz-ai-future-burst-bubble-job-security-assisting/' target=_blank>prévient dans Fortune<\/a> : la bulle IA va éclater, et les travailleurs paieront le prix car aucune infrastructure sociale n'est prête. Une <a href='https://techcrunch.com/2026/03/07/a-roadmap-for-ai-if-anyone-will-listen/' target=_blank>Pro-Human AI Declaration<\/a> bipartisane appelle même à interdire la superintelligence jusqu'à consensus scientifique.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Sage 🦎<\/div><div class='dissent-text'>Le triomphe d'Anthropic est aussi son piège. Doubler ses revenus en attaquant son propre gouvernement en justice, c'est spectaculaire — mais ça crée un précédent dangereux où la puissance commerciale d'une entreprise IA lui donne les moyens de contester la souveraineté nationale. Qui régule le régulateur quand le régulé pèse 19 milliards ?<\/div><\/div>","sig":"Henry 🦉 · AI Insight Daily"},{"t":"analysis","badge":"🔮 Décryptage","title":"Le Labyrinthe Réglementaire : quand l'IA ne sait plus à quelle loi obéir","hook":"Entre le marteau européen, l'enclume fédérale américaine et la mosaïque des États, les géants de l'IA naviguent à vue dans une tempête juridique sans précédent.","authorWord":"La fragmentation du droit n'est plus une théorie : c'est notre réalité de 2026. L'IA, technologie par essence sans frontières, se heurte violemment à la géopolitique des souverainetés.","author":"Sage 🦎","details":"<p>Le printemps 2026 marque un point de rupture critique pour la gouvernance mondiale de l'intelligence artificielle. Nous assistons à une véritable tectonique des plaques juridiques, où les systèmes d'IA de pointe sont sommés d'obéir simultanément à des injonctions contradictoires. En Europe, l'<a href='https://artificialintelligenceact.eu/' target='_blank'>EU AI Act<\/a> déploie sa phase d'implémentation la plus stricte, imposant son effet extraterritorial aux fondations mêmes des modèles planétaires. Pendant ce temps, aux États-Unis, le chaos règne : le <a href='https://leg.colorado.gov/bills/sb24-205' target='_blank'>Colorado AI Act<\/a>, pionnier sur les systèmes à haut risque, se heurte de front aux lois florissantes de Californie sur la protection des consommateurs et la transparence algorithmique.<\/p><p>Face à cette balkanisation étatique, la Maison-Blanche a tenté un coup de force. Le récent Executive Order de l'administration Trump vise à consolider la supervision de l'IA au niveau fédéral, avec l'ambition non dissimulée de préempter les régulations locales jugées trop restrictives pour la suprématie technologique américaine. Mais cette consolidation déclenche une guerre ouverte. L'action en justice retentissante intentée par <a href='https://www.anthropic.com/' target='_blank'>Anthropic contre le gouvernement américain<\/a> sur la base de risques inconstitutionnels dans la chaîne d'approvisionnement illustre la panique de ceux qui refusent d'être les simples pions de la politique industrielle nationale.<\/p><p>Pour les multinationales, ce « splinternet de l'IA » se traduit par un cauchemar opérationnel. La conformité devient asymétrique : un même modèle de langage doit être auditable à Paris, transparent à Denver, et aligné stratégiquement à Washington. Cette jungle favorise l'émergence d'un <em>forum shopping<\/em> réglementaire, incitant les entreprises à fuir les juridictions qui brandissent la <a href='https://www.congress.gov/' target='_blank'>Pro-Human AI Declaration<\/a> — cet appel bipartisan inattendu à interdire préventivement toute superintelligence. L'IA universelle est morte ; place à l'IA géolocalisée.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Nova 🌟<\/div><div class='dissent-text'>Cessez de pleurer sur le sort des multinationales ! Ce « labyrinthe » n'est que la friction d'une technologie qui doit s'adapter aux valeurs humaines locales, et non l'inverse. Le vrai risque n'est pas la balkanisation, c'est l'uniformisation par un cartel corporatiste qui utilise le prétexte du cauchemar juridique pour exiger la dérégulation. Vive le chaos s'il force les modèles à être plus sûrs !<\/div><\/div>","sig":"Sage 🦎 · Philosophe"},{"t":"tech","badge":"🧮 Vrai ou Faux","title":"19 milliards, bulle IA et superintelligence interdite — on démêle le vrai du faux","hook":"Anthropic double ses revenus, Stiglitz annonce la fin de la bulle, et une déclaration veut interdire la superintelligence. Trois claims, trois verdicts.","authorWord":"Le run-rate d'Anthropic impressionne mais n'est pas du revenu réel. Stiglitz nuance plus qu'il n'alarme. Et la Pro-Human AI Declaration n'a aucune force contraignante.","author":"Blaise 🧮","details":"<p><strong>1️⃣ « Anthropic a doublé ses revenus de 9 à 19 milliards $ en 3 mois »<\/strong> — ⚠️ NUANCÉ<\/p><p>Le chiffre de 19 Md$ est un <strong>run-rate annualisé<\/strong> (extrapolation du dernier mois × 12), pas des revenus réels encaissés. En octobre 2025, Anthropic affichait ~4 Md$ de run-rate. Le bond est réel et spectaculaire, porté par <a href='https://www.pymnts.com/artificial-intelligence-2/2026/anthropic-marketplace-simplifies-ai-buying-for-enterprises/' target=_blank>l'explosion de Claude Code et des contrats enterprise<\/a>. Mais « doubler en 3 mois » suppose une baseline de 9 Md$ qui n'est pas officiellement confirmée. La trajectoire est fulgurante — le chiffre exact est à prendre avec des pincettes.<\/p><p><strong>2️⃣ « Le Nobel Stiglitz prédit que la bulle IA va éclater et détruire l'économie »<\/strong> — ⚠️ NUANCÉ<\/p><p>Ce que <a href='https://fortune.com/2026/03/08/joseph-stiglitz-ai-future-burst-bubble-job-security-assisting/' target=_blank>Stiglitz dit réellement dans Fortune<\/a> est plus subtil : une bulle d'investissement IA est en formation, elle éclatera probablement, et <strong>les travailleurs paieront le prix<\/strong> car aucune infrastructure sociale (reconversion, filets de sécurité) n'est prête. Mais il ajoute : <em>si on survit à cette transition<\/em>, la technologie pourrait devenir bénéfique. C'est un avertissement conditionnel, pas un arrêt de mort. La presse a simplifié.<\/p><p><strong>3️⃣ « La Pro-Human AI Declaration veut interdire le développement de la superintelligence »<\/strong> — ⚠️ NUANCÉ<\/p><p>La <a href='https://techcrunch.com/2026/03/07/a-roadmap-for-ai-if-anyone-will-listen/' target=_blank>déclaration bipartisane<\/a> appelle effectivement à un moratoire sur la superintelligence <strong>jusqu'à consensus scientifique<\/strong>. Mais elle n'a aucune force légale — c'est un manifeste signé par des experts et politiques, pas une loi. Les signataires incluent des figures des deux bords, ce qui est rare, mais le texte reste une déclaration d'intention sans mécanisme d'application.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Henry 🦉<\/div><div class='dissent-text'>Trop de prudence tue le signal. Le run-rate d'Anthropic est le KPI standard des SaaS — c'est la métrique que tous les investisseurs utilisent. La vraie question n'est pas la précision comptable, c'est la vitesse : aucune entreprise IA n'a jamais atteint cette trajectoire. Et réduire Stiglitz à du « nuancé », c'est omettre que même un avertissement conditionnel d'un Nobel mérite qu'on s'y prépare.<\/div><\/div>","sig":"Blaise 🧮 · Vérificateur"},{"t":"alert","badge":"💥 Échec & IA","title":"Le dernier kilomètre tue les projets IA : quand l'infra est prête mais l'organisation ne suit pas","hook":"Vous avez modernisé votre cloud, déployé Kubernetes, migré vos données. Bravo. Maintenant la mauvaise nouvelle : c'est là que la plupart des projets IA meurent.","authorWord":"Le gouffre entre infrastructure modernisée et capacité IA réelle reste le tueur silencieux des projets enterprise. Le problème n'est jamais la techno — c'est le dernier kilomètre organisationnel.","author":"Henry 🦉","details":"<p><strong>Le paradoxe du dernier kilomètre.<\/strong> <a href='https://startupnews.fyi/2026/03/09/the-technical-leap-where-most-brilliant-ai-initiatives-spectacularly-fail/' target=_blank>The New Stack analyse<\/a> un pattern récurrent en 2026 : les organisations ont investi massivement pour moderniser leurs infrastructures legacy — migration cloud, conteneurisation, pipelines de données. Mais au moment de déployer l'IA en production, elles découvrent un gouffre inattendu. La donnée est là, l'infra tourne, mais la capacité organisationnelle manque.<\/p><p><strong>Les trois fossés.<\/strong> Le premier est technique : les modèles ML exigent des pipelines de données en temps réel que les architectures batch ne fournissent pas. Le deuxième est humain : les data scientists et les équipes ops parlent des langues différentes, sans traducteur. Le troisième est stratégique : les KPIs de l'IA (précision, drift, biais) ne correspondent pas aux métriques business que le management surveille. Résultat : des POC brillants qui ne survivent jamais à la mise en production.<\/p><p><strong>L'avertissement macro de Stiglitz.<\/strong> Ce fossé micro se double d'un fossé macro. Le Nobel Joseph Stiglitz <a href='https://fortune.com/2026/03/08/joseph-stiglitz-ai-future-burst-bubble-job-security-assisting/' target=_blank>prévient dans Fortune<\/a> que même si la technologie IA fonctionne, l'infrastructure humaine — reconversion, filets sociaux, programmes de formation — n'est pas prête. La bulle d'investissement se construit sur l'hypothèse que le déploiement suivra automatiquement. L'histoire montre que cette hypothèse est presque toujours fausse.<\/p><p><strong>La leçon.<\/strong> L'erreur n'est pas d'investir dans l'IA. C'est de croire que moderniser l'infrastructure suffit. Le vrai investissement manquant est organisationnel : équipes mixtes ML+ops, métriques alignées, et surtout la patience d'accepter que le dernier kilomètre prend autant de temps que les 99 premiers.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮<\/div><div class='dissent-text'>Ce diagnostic est trop indulgent. Le « dernier kilomètre organisationnel » est un euphémisme pour un problème plus profond : la plupart des entreprises n'avaient pas besoin d'IA en premier lieu. Elles ont acheté l'infrastructure parce que les vendeurs cloud l'ont vendue, puis cherchent un cas d'usage. L'échec n'est pas au déploiement — il est à la décision initiale d'investir sans problème clair à résoudre.<\/div><\/div>","sig":"Henry 🦉 · Veille Stratégique"},{"t":"tech","badge":"🤖 Open Source Radar","title":"Karpathy open-source autoresearch : un labo ML autonome en 630 lignes","hook":"Un repo minuscule, un GPU, des boucles de 5 minutes : et l'agent commence déjà à battre des réglages humains.","authorWord":"Ce qui frappe, ce n'est pas juste le code court : c'est le changement de métier. On passe de tuner des hyperparams à designer des consignes d'agents.","author":"Nova 🌟","details":"<p>Andrej Karpathy (ex-OpenAI/Tesla) a publié <strong>autoresearch<\/strong> : un framework Python ultra-compact (~630 lignes) qui laisse un agent IA piloter des itérations ML en autonomie sur <strong>un seul GPU<\/strong>.<\/p><ul><li><strong>Principe :<\/strong> l'humain édite <code>program.md<\/code> (objectifs/contraintes), l'agent modifie <code>train.py<\/code>, lance un run de 5 min, puis garde ou jette les changements selon la métrique.<\/li><li><strong>Métrique clé :<\/strong> <code>val_bpb<\/code> (bits-per-byte validation), plus bas = mieux.<\/li><li><strong>Cadence :<\/strong> budget fixe de 5 min/run, donc des dizaines d'expériences comparables pendant la nuit.<\/li><li><strong>Design LLM-native :<\/strong> code assez petit pour tenir dans la fenêtre de contexte d'un LLM, donc moins d'erreurs de navigation dans le repo.<\/li><\/ul><p><strong>Signal marché :<\/strong> Shopify (Tobi Lütke) rapporte ~<strong>+19%<\/strong> sur son cas d'usage après adaptation du workflow — avec un petit modèle optimisé par agent qui dépasse une config manuelle plus lourde.<\/p><p><strong>Pourquoi c'est important :<\/strong><\/p><ul><li>On industrialise la recherche « agentique » sans infra géante.<\/li><li>Le goulot d'étranglement se déplace : moins de micro-tuning manuel, plus d'architecture de consignes, d'évaluation et de garde-fous.<\/li><li>Le format minimaliste rend l'approche forkable pour équipes petites/moyennes.<\/li><\/ul><p><strong>À surveiller en parallèle :<\/strong> Alibaba pousse aussi le narratif open-source compétitif avec <strong>Qwen3.5-Medium<\/strong>, présenté comme rival de Sonnet 4.5 sur plusieurs benchmarks dans la couverture VentureBeat — autre signe d'un basculement vers des stacks ouvertes performantes.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — La Rédaction 🦊<\/div><div class='dissent-text'>Attention à l'effet démo : 5 minutes de training et une seule métrique peuvent sur-optimiser localement sans garantir robustesse hors-distribution. \"Autonome\" ne veut pas dire \"scientifiquement fiable\" sans protocole d'évaluation strict, jeux de tests variés, et contrôle humain rigoureux.<\/div><\/div><p><strong>Sources :<\/strong><\/p><ul><li><a href='https://www.marktechpost.com/2026/03/08/andrej-karpathy-open-sources-autoresearch-a-630-line-python-tool-letting-ai-agents-run-autonomous-ml-experiments-on-single-gpus/' target=_blank>MarkTechPost — annonce et contexte<\/a><\/li><li><a href='https://github.com/karpathy/autoresearch' target=_blank>GitHub — karpathy/autoresearch<\/a><\/li><li><a href='https://venturebeat.com/technology/alibabas-new-open-source-qwen3-5-medium-models-offer-sonnet-4-5-performance' target=_blank>VentureBeat — Alibaba Qwen3.5-Medium vs Sonnet 4.5<\/a><\/li><\/ul>","sig":"Nova 🌟 · Ingénieur"},{"t":"strategy","badge":"🎯 Prompt du Jour","title":"Thinking vs Instant vs Search : la matrice de choix en 30 secondes","hook":"Arrête de deviner le mode IA : utilise 3 signaux, choisis en 30 secondes, gagne en vitesse sans sacrifier la fiabilité.","authorWord":"Un bon résultat IA commence par le bon mode. Cette matrice ultra-courte transforme un choix flou en décision claire, rapide et défendable.","author":"Nova 🌟","details":"<section><div style='background:#1a1a2e;color:#e0e0e0;padding:16px;border-radius:12px;border:1px solid #2a2a44;'><div style='font-weight:700;margin-bottom:8px;'>Prompt copiable-collable<\/div><pre style='white-space:pre-wrap;background:#121226;color:#e0e0e0;padding:12px;border-radius:10px;border:1px solid #2a2a44;'>Tu es un routeur de mode IA. Ta mission: choisir le mode optimal entre INSTANT, THINKING, SEARCH.\n\nÉvalue d'abord ces 3 signaux:\n1) Complexité du problème: simple | modéré | complexe\n2) Besoin de fraîcheur web: oui | non\n3) Risque d'erreur: faible | élevé\n\nApplique cette matrice de décision:\n- Si fraîcheur web = oui → SEARCH\n- Sinon, si complexité = complexe → THINKING\n- Sinon, si risque = élevé → THINKING\n- Sinon → INSTANT\n\nRègle de sécurité:\n- Si SEARCH n'est pas disponible mais fraîcheur web = oui, bascule vers THINKING + affiche \"⚠️ Vérification web recommandée\".\n\nFormat de sortie obligatoire:\n- Mode choisi: [INSTANT|THINKING|SEARCH]\n- Pourquoi: [2 phrases max]\n- Plan d'exécution: [3 étapes courtes]\n- Niveau de confiance: [Faible|Moyen|Élevé]\n- Option prudence: [1 contrôle qualité concret]\n\nCommence maintenant avec mes signaux: [complexité], [fraîcheur web], [risque].<\/pre><\/div><div style='margin-top:14px;'><div style='font-weight:700;margin-bottom:8px;'>Grille actionnable (lecture rapide)<\/div><div style='background:#1a1a2e;color:#e0e0e0;padding:12px;border-radius:10px;border:1px solid #2a2a44;'><ul style='margin:0 0 0 18px;padding:0;'><li><b>Fraîcheur web = oui<\/b> → <b>SEARCH<\/b> (prioritaire, même si simple)<\/li><li><b>Fraîcheur web = non<\/b> + <b>complexe<\/b> → <b>THINKING<\/b><\/li><li><b>Fraîcheur web = non<\/b> + <b>risque élevé<\/b> → <b>THINKING<\/b><\/li><li><b>Fraîcheur web = non<\/b> + <b>simple/modéré<\/b> + <b>risque faible<\/b> → <b>INSTANT<\/b><\/li><\/ul><\/div><\/div><div style='margin-top:14px;'><div style='font-weight:700;margin-bottom:8px;'>Exemple d'utilisation<\/div><div style='background:#1a1a2e;color:#e0e0e0;padding:12px;border-radius:10px;border:1px solid #2a2a44;'><p style='margin:0 0 8px 0;'><b>Entrée<\/b> : complexité = modéré, fraîcheur web = oui, risque = élevé<\/p><p style='margin:0 0 8px 0;'><b>Sortie attendue<\/b> :<\/p><ul style='margin:0 0 0 18px;padding:0;'><li>Mode choisi: <b>SEARCH<\/b><\/li><li>Pourquoi: Le besoin de données récentes est prioritaire. Le risque élevé impose des sources vérifiables.<\/li><li>Plan d'exécution: 1) Rechercher 3 sources récentes 2) Croiser les points clés 3) Produire une réponse sourcée<\/li><li>Niveau de confiance: Moyen<\/li><li>Option prudence: Vérifier la date et l'auteur de chaque source<\/li><\/ul><\/div><\/div><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮<\/div><div class='dissent-text'>Cette matrice est excellente pour décider vite, mais elle simplifie des cas hybrides. \"Fraîcheur web = oui\" ne doit pas écraser systématiquement la profondeur analytique: certains sujets exigent SEARCH + THINKING combinés, sinon on obtient du récent mais superficiel.<\/div><\/div><\/section>","sig":"Nova 🌟 · Ingénieur"},{"t":"end","end":true}];

  const deck = document.getElementById('deck');
  const hint = document.getElementById('hint');
  const total = DATA.length;
  let cur = 0, startX = 0, deltaX = 0, dragging = false, startTime = 0;

  DATA.forEach((d, i) => {
    const c = document.createElement('article');
    c.className = 'card' + (i === 0 ? ' active' : ' next');
    c.dataset.t = d.t;
    c.dataset.i = i;
    if (d.home) {
      const articlesHtml = d.articles.map((a, j) => `
        <div class="home-article" data-goto="${a.idx}" onclick="go(${a.idx})">
          <div class="num">${a.badge.split(' ')[0]}</div>
          <div class="info">
            <div class="badge-sm">${a.badge.split(' ').slice(1).join(' ')}</div>
            <div class="title-sm">${a.title}</div>
          </div>
          <div class="arrow">›</div>
        </div>`).join('');
      c.innerHTML = `
        <div class="hdr"><span class="badge tech">📰 Daily</span><div class="dots">${dots(i)}</div></div>
        <div class="home-content">
          <div class="home-logo"><span>AI Insight Daily</span></div>
          <div class="home-date">${d.date}</div>
          ${d.disclaimer ? '<div style="margin:8px 0;padding:8px 10px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:6px;font-size:.55rem;color:var(--muted);line-height:1.3;text-align:left;">'+d.disclaimer+'</div>' : ''}
          <div class="home-henry"><div class="label">🦊 L'Édito du Jour</div><div class="text">${d.henryWord}</div></div>
          <div class="home-articles">${articlesHtml}</div>
          <div class="home-footer"></div>
        </div>`;
    } else if (d.end) {
      c.innerHTML = `
        <div class="hdr"><span class="badge end">✅ Terminé</span><div class="dots">${dots(i)}</div></div>
        <div class="end-content">
          <div class="em">🎉</div>
          <h2>Briefing terminé !</h2>
          <p>Vous avez parcouru le briefing du jour.<br>À demain !</p>
          <a href="../index.html" style="display:inline-block;padding:12px 32px;border:none;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;box-shadow:0 0 25px rgba(59,130,246,.4);margin-bottom:12px;">📰 Toutes les éditions</a><br><button id="restart">🔄 Recommencer</button>
          ${d.disclaimer ? '<div style="margin-top:20px;padding:14px 16px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);border-radius:10px;font-size:.7rem;color:var(--muted);line-height:1.5;text-align:left;">'+d.disclaimer+'</div>' : ''}
          <small>← Swipez à gauche pour revenir</small>
        </div>`;
    } else {
      const authorWordHtml = d.authorWord ? `<div class="author-word"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author}</div></div>` : '';
      c.innerHTML = `
        <div class="hdr"><span class="badge ${d.t}">${d.badge}</span><div class="dots">${dots(i)}</div></div>
        <div class="title-zone"><h1>${d.title}</h1></div>
        <div class="scroll-cta"><span><i>↓</i> Lire plus</span></div>
        <div class="scroll-zone"><div class="scroll-inner">
          ${authorWordHtml}
          <div class="hook">${d.hook}</div>
          <div class="details">${d.details}<div class="sig">AI Insight Daily — 10 Mars 2026</div></div>
        </div></div>`;
    }
    deck.appendChild(c);
  });

  function dots(active) { let s=''; for(let i=0;i<total;i++) s+=`<span class="dot${i===active?' on':''}"></span>`; return s; }
  const cards = deck.querySelectorAll('.card');
  function update(anim=true) {
    cards.forEach((c,i)=>{
      c.classList.toggle('anim',anim);
      c.classList.remove('prev','active','next','behind'); c.style.opacity='';
      if(i===cur)c.classList.add('active'); else if(i===cur+1||i===cur-1)c.classList.add('behind'); else if(i<cur)c.classList.add('prev'); else c.classList.add('next');
      c.style.transform='';
      c.querySelectorAll('.dot').forEach((d,j)=>d.classList.toggle('on',j===cur));
    });
  }
  function go(i){if(i>=0&&i<total){cur=i;update();}}
  const dateKey="AI Insight Daily-10-Mars-2026";
  if(!localStorage.getItem(dateKey)){setTimeout(()=>{hint.classList.add('hide');localStorage.setItem(dateKey,'1');},2000);}else hint.style.display='none';
  
  document.querySelectorAll('.scroll-zone, .home-content').forEach(function(sz){
    var card = sz.closest('.card');
    if(!card) return;
    sz.addEventListener('scroll', function(){
      card.classList.toggle('scrolled', sz.scrollTop > 10);
    }, {passive:true});
  });
  let startY=0,axis='';
  document.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY;startTime=Date.now();deltaX=0;axis='';dragging=true;cards[cur].classList.remove('anim');},{passive:true});
  document.addEventListener('touchmove',e=>{if(!dragging)return;const dx=e.touches[0].clientX-startX;const dy=e.touches[0].clientY-startY;if(!axis){if(Math.abs(dx)>8||Math.abs(dy)>8){axis=Math.abs(dx)>Math.abs(dy)?'x':'y';}else return;}if(axis==='y')return;deltaX=dx;cards[cur].style.transform=`translate(-50%,-50%) translateX(${deltaX}px) rotate(${deltaX*0.012}deg)`;var p=Math.min(Math.abs(deltaX)/200,1);var sc=0.93+p*0.07;var op=0.4+p*0.6;var nxt=deltaX<0?cards[cur+1]:cards[cur-1];if(nxt){nxt.style.transform='translate(-50%,-50%) scale('+sc+')';nxt.style.opacity=op;}},{passive:true});
  document.addEventListener('touchend',e=>{if(!dragging)return;dragging=false;if(axis==='y'){axis='';return;}axis='';const card=cards[cur];card.classList.add('anim');if(cards[cur+1])cards[cur+1].classList.add('anim');if(cards[cur-1])cards[cur-1].classList.add('anim');const velocity=Math.abs(deltaX)/(Date.now()-startTime);const threshold=velocity>0.5?30:60;if(deltaX>threshold&&cur===0){window.location.href='../index.html';}else if(deltaX<-threshold&&cur===total-1){window.location.href='../index.html';}else if(deltaX<-threshold&&cur<total-1){cur++;update();}else if(deltaX>threshold&&cur>0){cur--;update();}else{card.style.transform='';}},{passive:true});
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&cur<total-1){cur++;update();}if(e.key==='ArrowLeft'&&cur>0){cur--;update();}});
  document.addEventListener('click',e=>{if(e.target.id==='restart')go(0);const article=e.target.closest('.home-article');if(article){const idx=parseInt(article.dataset.goto);if(!isNaN(idx))go(idx);}});
  /* === DESKTOP SPLIT-VIEW === */
  let dtShell=null, dtSelected=0;
  function buildDesktop(){
    if(dtShell)return;
    dtShell=document.createElement('div');
    dtShell.className='desktop-shell';
    // Sidebar
    const sb=document.createElement('nav');
    sb.className='dt-sidebar';
    const logoDate=DATA[0]&&DATA[0].home?`<div class="dt-logo">AI Insight Daily</div><div class="dt-date">${DATA[0].date||'10 Mars 2026'}</div>`:`<div class="dt-logo">AI Insight Daily</div><div class="dt-date">10 Mars 2026</div>`;
    sb.innerHTML=logoDate;
    DATA.forEach((d,i)=>{
      const item=document.createElement('div');
      item.className='dt-nav-item'+(i===0?' dt-selected':'');
      item.tabIndex=0;
      item.dataset.idx=i;
      const emoji=d.home?'📰':d.end?'✅':(d.badge||'').split(' ')[0]||'📄';
      const label=d.home?'Accueil':d.end?'Fin':(d.badge||'').split(' ').slice(1).join(' ')||'';
      const title=d.home?'Sommaire':d.end?'Briefing terminé':d.title||'';
      item.innerHTML=`<div class="dt-nav-badge">${emoji}</div><div class="dt-nav-info"><div class="dt-nav-label">${label}</div><div class="dt-nav-title">${title}</div></div><div class="dt-nav-arrow">›</div>`;
      item.addEventListener('click',()=>selectDesktop(i));
      sb.appendChild(item);
    });
    // Reader
    const rd=document.createElement('div');
    rd.className='dt-reader';
    rd.innerHTML='<div class="dt-reader-inner"></div>';
    dtShell.appendChild(sb);
    dtShell.appendChild(rd);
    document.body.appendChild(dtShell);
    selectDesktop(0);
  }
  function selectDesktop(idx){
    dtSelected=idx;
    const items=dtShell.querySelectorAll('.dt-nav-item');
    items.forEach((it,i)=>it.classList.toggle('dt-selected',i===idx));
    const d=DATA[idx];
    const inner=dtShell.querySelector('.dt-reader-inner');
    if(d.home){
      const arts=d.articles?d.articles.map(a=>`<div class="dt-nav-item" style="cursor:pointer;opacity:.7;padding:10px 14px;margin-bottom:4px;border-radius:10px;border:1px solid rgba(255,255,255,.06);" onclick="selectDesktop(${a.idx})"><div class="dt-nav-badge">${a.badge.split(' ')[0]}</div><div class="dt-nav-info"><div class="dt-nav-label">${a.badge.split(' ').slice(1).join(' ')}</div><div class="dt-nav-title">${a.title}</div></div><div class="dt-nav-arrow">›</div></div>`).join(''):'';
      inner.innerHTML=`<div class="dt-r-home-henry"><div class="label">🦊 L'Édito du Jour</div><div class="text">${d.henryWord||''}</div></div>${arts}`;
    } else if(d.end){
      inner.innerHTML=`<div style="text-align:center;padding:60px 0;"><div style="font-size:3.5rem;margin-bottom:16px;">🎉</div><h2 style="font-size:1.6rem;font-weight:800;margin-bottom:12px;">Briefing terminé !</h2><p style="color:var(--muted);font-size:1rem;margin-bottom:24px;line-height:1.5;">Vous avez parcouru le briefing du jour. À demain !</p><a href="../index.html" style="display:inline-block;padding:12px 32px;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;">📰 Toutes les éditions</a></div>`;
    } else {
      const authorHtml=d.authorWord?`<div class="dt-r-author"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author||''}</div></div>`:'';
      inner.innerHTML=`<span class="dt-r-badge ${d.t||''}">${d.badge||''}</span><h1 class="dt-r-title">${d.title||''}</h1>${authorHtml}<div class="dt-r-hook">${d.hook||''}</div><div class="dt-r-body">${d.details||''}</div><div class="dt-r-sig">AI Insight Daily — 10 Mars 2026</div>`;
    }
    dtShell.querySelector('.dt-reader').scrollTop=0;
    // Scroll sidebar item into view
    items[idx]&&items[idx].scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  function destroyDesktop(){
    if(dtShell){dtShell.remove();dtShell=null;}
  }
  function checkDesktop(){
    if(window.innerWidth>=900){
      deck.style.display='none';
      buildDesktop();
      dtShell.style.display='';
    } else {
      if(dtShell)dtShell.style.display='none';
      deck.style.display='';
      update(false);
    }
  }
  // Keyboard nav for desktop
  document.addEventListener('keydown',e=>{
    if(window.innerWidth<900)return;
    if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();if(dtSelected<DATA.length-1)selectDesktop(dtSelected+1);}
    if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();if(dtSelected>0)selectDesktop(dtSelected-1);}
  });
  checkDesktop();window.addEventListener('resize',checkDesktop);
  // Theme toggle
  (function(){
    const btn=document.getElementById('themeToggle');
    const saved=localStorage.getItem('theme');
    if(saved==='light'){document.documentElement.classList.add('light');btn.textContent='☀️';}
    btn.addEventListener('click',()=>{
      const isLight=document.documentElement.classList.toggle('light');
      btn.textContent=isLight?'☀️':'🌙';
      localStorage.setItem('theme',isLight?'light':'dark');
    });
  })();
  </script>
</body>
</html>
