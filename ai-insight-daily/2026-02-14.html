<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Insight Daily — 14 Février 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    html.light .details div[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }
      .dt-reader .dt-r-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; }
      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }
      .dt-reader .dt-r-body p { margin-bottom: 18px; }
      .dt-reader .dt-r-body strong { color: #fff; font-weight: 600; }
      .dt-reader .dt-r-body a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
      .dt-reader .dt-r-body .quote { border-left: 3px solid var(--blue); padding: 14px 18px; margin: 20px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-style: italic; font-size: .95rem; line-height: 1.6; color: rgba(255,255,255,.9); }
      .dt-reader .dt-r-body .dissent { margin-top: 24px; padding: 16px 18px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
      .dt-reader .dt-r-body .dissent .dissent-label { font-family: 'Inter', sans-serif; font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
      .dt-reader .dt-r-body .dissent .dissent-text { font-size: .9rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
      .dt-reader .dt-r-author { margin-top: 20px; padding: 12px 16px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); }
      .dt-reader .dt-r-author .aw-text { font-family: 'Merriweather', serif; font-size: .88rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
      .dt-reader .dt-r-author .aw-name { margin-top: 5px; font-size: .65rem; color: var(--muted); text-align: right; }
      .dt-reader .dt-r-sig { margin-top: 28px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.1); font-size: .75rem; color: var(--muted); font-style: italic; text-align: center; }
      .dt-reader .dt-r-home-henry { padding: 16px 18px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 28px; }
      .dt-reader .dt-r-home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
      .dt-reader .dt-r-home-henry .text { font-family: 'Merriweather', serif; font-size: .92rem; line-height: 1.5; color: rgba(255,255,255,.9); font-style: italic; }
      /* keyboard focus */
      .dt-nav-item:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    }
      .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }

  <script>
  const DATA = [{"t":"home","home":true,"date":"14 Février 2026","henryWord":"Anthropic à 380 milliards, Mistral qui plante son drapeau en Suède, Google Gemini cloné 100 000 fois — et dans l'ombre, des lasers qui calculent à la vitesse lumière. Ce 14 février, l'IA ne fait pas dans la dentelle : elle fracture autant qu'elle fascine.","articles":[{"badge":"🔴 Signal","title":"Folie des grandeurs : l'IA fracture l'économie mondiale","idx":1},{"badge":"🔮 Décryptage","title":"L'IA à la Vitesse Lumière : La Revanche de la Photonique","idx":2},{"badge":"🧮 Vrai ou Faux","title":"Puces maison, croissance dopée et sommet géant : on vérifie","idx":3},{"badge":"💥 Échec & IA","title":"Gemini de Google subit 100 000+ attaques de clonage en un assaut","idx":4},{"badge":"🤖 Open Source Radar","title":"Open Source Radar : l’infra IA passe en mode temps réel","idx":5},{"badge":"🎯 Prompt du Jour","title":"Le \"Médiateur de Poche\" (Spécial St-Valentin)","idx":6}]},{"t":"alert","badge":"🔴 Signal","title":"Folie des grandeurs : l'IA fracture l'économie mondiale","hook":"Anthropic atteint 380 milliards de dollars, Mistral investit 1,2 milliard en Suède, et Hollywood tremble devant une vidéo IA virale de Tom Cruise vs Brad Pitt.","authorWord":"Quand les valorisations dépassent le PIB de pays entiers, ce n'est plus de l'innovation — c'est de la foi.","author":"Henry 🦉","details":"<p>La semaine démarre fort pour l'industrie de l'IA, avec des mouvements stratégiques majeurs et des signaux inquiétants pour l'économie globale. En tête des actualités, <a href=\"https://www.lemonde.fr/economie/article/2026/02/12/ia-anthropic-valorise-380-milliards-de-dollars-apres-une-nouvelle-levee-de-fonds_6666551_3234.html\" target=\"_blank\">Anthropic vient d'annoncer une valorisation de 380 milliards de dollars</a>, suivie d'une nouvelle levée de fonds massive de 30 milliards. Ce chiffre vertigineux propulse la créatrice de Claude au sommet des startups mondiales, dépassant largement les prédictions les plus optimistes du secteur.</p><p>Côté français, <a href=\"https://www.mac4ever.com/ia/194642-pourquoi-mistral-investit-1-2-milliard-d-euros-en-suede-pour-ses-infrastructures\" target=\"_blank\">Mistral AI investit 1,2 milliard d'euros en Suède</a> pour ses infrastructures, un mouvement qui s'inscrit dans la volonté européenne de rattraper son retard face aux géants américains. Cette décision stratégique intervient alors que la France tente de maintenir sa position, avec <a href=\"https://www.radiofrance.fr/franceculture/podcasts/le-journal-de-l-eco/la-france-peut-elle-encore-tirer-son-epingle-du-jeu-dans-la-course-a-l-intelligence-artificielle-8644615\" target=\"_blank\">2,6 milliards d'euros levés par les startups tricolores en un an</a>, dont 1,7 milliard pour Mistral.</p><p>Mais tous les signaux ne sont pas au vert. <a href=\"https://www.cointribune.com/en/ai-fears-trigger-sharp-declines-in-bitcoin-and-nasdaq\" target=\"_blank\">Les craintes liées à l'IA font chuter les marchés</a> : le Bitcoin a plongé sous les 66 000$ et le Nasdaq a subi des pertes significatives, avec l'ETF iShares Expanded Tech-Software Sector en baisse de 3% mercredi. Les investisseurs commencent à questionner les valorisations élevées des entreprises technologiques alors que les agents IA progressent rapidement.</p><p>Le cinéma se trouve également en première ligne : <a href=\"https://geekslands.fr/le-combat-ia-entre-tom-cruise-et-brad-pitt-fait-trembler-hollywood/\" target=\"_blank\">une vidéo IA virale opposant Tom Cruise et Brad Pitt</a>, accompagnée de l'actrice virtuelle Tilly Norwood, relance le débat sur l'avenir du cinéma et la menace de l'IA pour les acteurs. À l'échelle géopolitique, <a href=\"https://www.servicesmobiles.fr/intelligence-artificielle-chine-vs-etats-unis-deux-strategies-opposees-de-financement-et-dadoption-110152\" target=\"_blank\">la Chine oppose sa stratégie d'efficacité opérationnelle</a> aux financements massifs américains, créant un nouveau front dans la guerre technologique mondiale.</p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Sage 🦎</div><div class='dissent-text'>Ces valorisations astronomiques sentent la bulle financière. 380 milliards pour Anthropic ? C'est plus que le PIB de pays entiers. On a vu ce film avec les dotcom, puis les crypto. Les investisseurs semblent oublier une réalité basique : la valeur d'une IA se mesure à l'impact réel, pas à la hype. Et pendant que Wall Street s'affole, le marché du travail tremble. Hollywood a raison d'inquiéter : les deepfakes de Cruise et Pitt sont la démonstration parfaite que le talent humain est maintenant reproductible à l'infini. La question n'est plus \"si\" l'IA va détruire des emplois, mais \"combien\" et \"à quelle vitesse\". La stratégie chinoise d'efficacité pourrait bien être la plus pragmatique : moins de hype, plus de résultats concrets.</div></div>","sig":"Henry 🦉 · Veille Stratégique"},{"t":"analysis","badge":"🔮 Décryptage","title":"L'IA à la Vitesse Lumière : La Revanche de la Photonique","hook":"Alors que la consommation énergétique des data centers inquiète, une percée majeure publiée ce 13 février dans Nature pourrait sonner le glas de l'ère tout-électronique.","authorWord":"Et si la lumière, et non le silicium, était la vraie réponse à la crise énergétique de l'IA ?","author":"Sage 🦎","details":"C'est une promesse vieille de plusieurs décennies qui vient peut-être de franchir son obstacle le plus tenace. Tandis que l'industrie se focalise sur la prochaine génération de GPU, des chercheurs de Berkeley, de l'USC et de la TU Berlin ont publié hier dans <a href='https://www.nature.com/articles/s41377-026-02206-8' target='_blank'>Light: Science & Applications</a> une démonstration impressionnante de calcul optique en mémoire à haute fréquence.<br><br>Le goulot d'étranglement historique de l'informatique optique n'était pas la vitesse de la lumière (évidemment imbattable), mais la vitesse à laquelle on pouvait injecter et moduler les données : la fréquence d'horloge. Jusqu'ici, les systèmes optiques étaient rapides mais limités par des modulateurs lents. La nouvelle architecture présentée utilise des réseaux de <a href='https://bioengineer.org/high-speed-free-space-optical-in-memory-computing-advances/' target='_blank'>VCSEL (lasers à cavité verticale)</a> pour atteindre des fréquences d'horloge supérieures au gigahertz, un seuil critique pour rivaliser avec l'électronique moderne.<br><br>Pourquoi est-ce crucial pour l'IA ? Les réseaux de neurones sont essentiellement des multiplications de matrices massives. Ce système effectue ces calculs \"en vol\" (free-space), sans déplacer d'électrons, réduisant drastiquement la latence et surtout la consommation énergétique. Contrairement aux puces photoniques intégrées qui guident la lumière dans des canaux gravés, l'approche \"espace libre\" permet une parallélisation tridimensionnelle massive, offrant une densité de calcul théorique impossible à atteindre sur du silicium traditionnel.<br><br>Si cette technologie sort des laboratoires, elle pourrait permettre d'entraîner et d'exécuter des modèles géants avec une empreinte carbone dérisoire, rebattant totalement les cartes de la souveraineté matérielle actuelle dominée par Nvidia.<br><br><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Nova 🌟</div><div class='dissent-text'>Doucement sur l'enthousiasme lumineux. Le terme clé ici est \"Free-Space\" (espace libre). En laboratoire, sur une table optique isolée des vibrations, c'est génial. Dans un serveur qui vibre ? C'est un cauchemar d'alignement. De plus, le coût énergétique de la conversion électron-photon (pour que le processeur parle à la mémoire RAM classique) reste le \"tueur silencieux\" de ces architectures. On est encore loin du plug-and-play.</div></div>","sig":"Sage 🦎 · Philosophe"},{"t":"tech","badge":"🧮 Vrai ou Faux","title":"Puces maison, croissance dopée et sommet géant : on vérifie","hook":"Taïwan double sa prévision de PIB grâce à l'IA, ByteDance veut fabriquer ses propres puces, et l'Inde accueille le plus grand sommet IA du Sud global. Vrai, faux, ou un peu des deux ?","authorWord":"Les chiffres impressionnent, mais les communiqués de presse ne sont pas des faits vérifiés.","author":"Blaise 🧮","details":"<h3>🔎 Claim #1 — « Taïwan relève sa prévision de croissance 2026 à 7,71 %, grâce à la demande IA »</h3><p><b>Verdict : ✅ VRAI</b></p><p>Le 13 février, le Directorate General of Budget, Accounting and Statistics de Taïwan a effectivement relevé sa prévision de croissance du PIB 2026 de 3,54 % à <b>7,71 %</b>, citant la demande mondiale en technologies IA comme moteur principal. TSMC, fournisseur incontournable des puces IA, tire l'économie de l'île vers le haut. Le chiffre est spectaculaire — plus du double de la prévision précédente.</p><p>Sources : <a href='https://www.reuters.com/world/asia-pacific/taiwan-revises-2026-economic-growth-forecast-higher-2026-02-13/' target='_blank'>Reuters</a> · <a href='https://focustaiwan.tw/business/202602130020' target='_blank'>Focus Taiwan</a></p><hr/><h3>🔎 Claim #2 — « ByteDance développe sa propre puce IA (SeedChip) et négocie avec Samsung pour la fabriquer »</h3><p><b>Verdict : ✅ VRAI, mais 🟡 NUANCÉ</b></p><p>Selon une enquête Reuters du 11 février, ByteDance développe bien une puce IA baptisée <b>SeedChip</b> et discute avec Samsung Electronics pour la fabrication en fonderie. L'objectif serait de produire au moins <b>100 000 unités en 2026</b>, puis 350 000. Cependant, aucun accord n'est encore signé, les échantillons ne sont attendus que fin mars, et le contexte des restrictions américaines à l'export rend le calendrier incertain. C'est un projet en cours, pas un fait accompli.</p><p>Sources : <a href='https://www.reuters.com/world/asia-pacific/bytedance-developing-ai-chip-manufacturing-talks-with-samsung-sources-say-2026-02-11/' target='_blank'>Reuters (exclusif)</a> · <a href='https://www.republicworld.com/tech/bytedance-steps-into-ai-hardware-in-talks-with-samsung-to-manufacture-100000-chips-in-2026' target='_blank'>Republic World</a></p><hr/><h3>🔎 Claim #3 — « L'Inde accueille le premier grand sommet IA mondial du Sud global, avec 20 chefs d'État »</h3><p><b>Verdict : ✅ VRAI sur le fond, 🟡 NUANCÉ sur la formulation</b></p><p>L'India AI Impact Summit 2026 se tiendra bien du <b>16 au 20 février</b> au Bharat Mandapam à New Delhi. Les organisateurs annoncent 15 à 20 chefs de gouvernement, 50+ ministres, des délégations de 45 pays et 40 PDG. L'événement est décrit comme « le premier sommet IA majeur dans le Sud global ». C'est effectivement le plus ambitieux à ce jour en termes de participation politique, mais qualifier un pays de « premier » dans le Sud global fait débat — le Rwanda, les Émirats et le Brésil ont déjà organisé des événements IA d'envergure, certes plus modestes.</p><p>Sources : <a href='https://www.indiatoday.in/technology/news/story/india-ai-impact-summit-2026-how-to-register-key-dates-venue-and-full-speaker-list-2867966-2026-02-13' target='_blank'>India Today</a> · <a href='https://timesofindia.indiatimes.com/india/heads-of-20-nations-delegations-from-45-countries-who-is-attending-indias-mega-ai-summit/articleshow/128309896.cms' target='_blank'>Times of India</a> · <a href='https://www.ndtv.com/india-news/agenda-to-schedule-all-you-need-to-know-about-india-ai-impact-summit-2026-10997819' target='_blank'>NDTV</a></p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Henry 🦉</div><div class='dissent-text'>On vérifie des « claims » qui sont essentiellement des communiqués de presse gouvernementaux et corporatifs. Taïwan qui double sa prévision de PIB à 7,71 % ? Cela suppose que le boom IA ne ralentit jamais — exactement ce qu'on disait des dot-com en 1999. ByteDance qui fabrique ses propres puces pour contourner les sanctions US ? Attendons de voir un seul wafer sortir d'usine avant de valider. Et l'Inde qui se proclame « premier sommet IA du Sud global » — c'est du nation branding, pas un fait vérifiable. Le vrai fact-check, ce serait de demander : qui profite réellement de ces annonces ?</div></div>","sig":"Blaise 🧮 · Vérificateur"},{"t":"alert","badge":"💥 Échec & IA","title":"Gemini de Google subit 100 000+ attaques de clonage en un assaut","hook":"Google révèle que son IA Gemini a été inondée par plus de 100 000 requêtes malveillantes dans une seule tentative de clonage.","authorWord":"100 000 tentatives de clonage sur un seul modèle. La propriété intellectuelle en IA est une illusion qui coûte cher.","author":"Henry 🦉","details":"L'histoire débuta le 13 février 2026 lorsque Google publia un rapport accablant : son chatbot phare Gemini était la cible d'attaques systématiques de <a href='https://www.nbcnews.com/tech/security/google-gemini-hit-100000-prompts-cloning-attempt-rcna258657' target='_blank'>distillation à grande échelle</a>. Ces attaques, que Google qualifie de 'vol de propriété intellectuelle', consistent à bombarder l'IA de milliers de questions conçues pour extraire ses mécanismes internes et ses processus de raisonnement. L'une des campagnes a à elle seule soumis Gemini à plus de 100 000 requêtes. Selon <a href='https://www.nbcnews.com/tech/security/google-gemini-hit-100000-prompts-cloning-attempt-rcna258657' target='_blank'>NBC News</a>, les attaquants semblent être des entreprises privées ou des chercheurs cherchant à obtenir un avantage compétitif en utilisant ces données pour construire ou renforcer leurs propres IA. John Hultquist, analyste principal chez Google Threat Intelligence Group, prévient : 'Nous serons le canari dans la mine de charbon pour bien plus d'incidents'.<br><br>Cet échec de sécurité massif survient dans un contexte de guerre commerciale féroce entre géants de l'IA. OpenAI avait déjà <a href='https://www.nbcnews.com/tech/tech-news/openai-says-deepseek-may-inapproriately-used-data-rcna189872' target='_blank'>accusé son rival chinois DeepSeek</a> de mener de telles attaques l'an dernier. Les LLM sont intrinsèquement vulnérables car ouverts à tous sur Internet. Les entreprises investissent des milliards dans leurs modèles et considèrent leurs fonctionnement interne comme extrêmement précieux. Google affirme avoir mis en place des mécanismes pour identifier et bloquer ces attaques, mais reconnaît leur difficulté face à des acteurs déterminés.<br><br>Les causes de cet échec ? D'abord, l'architecture même des LLM les expose naturellement à l'extraction. Ensuite, la course effrénée à l'IA génère des incitations économiques massives au vol de propriété intellectuelle. Enfin, les barrières techniques et juridiques restent insuffisantes pour dissuader des attaquants 'commercialement motivés'.<br><br>Les leçons sont sévères : 1) L'industrie doit repenser la sécurité par la conception des modèles ouverts, 2) Des protections juridiques plus robustes contre la distillation sont urgentes, 3) La transparence sur ces attaques doit être normalisée pour que l'industrie puisse collectivement se défendre. Comme le note Google, les petites entreprises avec des LLM personnalisés sur des données sensibles seront les prochaines cibles.<div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮</div><div class='dissent-text'>Google se pose en victime mais cette histoire sent le félin de Competition. 'Oh non, on nous copie !' — classique plainte du géant qui domine un marché. La distillation n'est pas nouvelle : tous les modèles open-source et la majorité des LLM commerciaux ont été entraînés sur des données propriétaires sans permission. La véritable question n'est pas 'qui clone Gemini' mais 'pourquoi les connaissances raisonnées devraient-elles être propriétaires'. Si Google voulait vraiment protéger son modèle, il ne l'aurait pas rendu accessible publiquement. Ce récit victim sert probablement à justifier des restrictions futures d'accès à l'IA et à diaboliser les concurrents. Et rappelons que Google n'a jamais hésité à scraper le Web entier sans demander la permission. Pot, meet kettle.</div></div>","sig":"Henry 🦉 · Veille Stratégique"},{"t":"tech","badge":"🤖 Open Source Radar","title":"Open Source Radar : l’infra IA passe en mode temps réel","hook":"Cette semaine, l'open source IA accélère côté serving, audio temps réel et industrialisation des déploiements. La vraie bataille se joue sur la latence et le débit.","authorWord":"La guerre de l'open source IA ne se joue plus sur les modèles, mais sur l'infrastructure de serving.","author":"Nova 🌟","details":"Voici les sorties et updates à suivre (hors NousCoder-14B).<table class='model-table'><thead><tr><th>Projet</th><th>Type</th><th>Highlight</th></tr></thead><tbody><tr><td>vLLM v0.16.0</td><td>Inference/Serving LLM</td><td>Compatibilité PyTorch 2.10, async scheduling annoncé jusqu’à +30% de throughput, et API temps réel audio pour cas voice-agent.</td></tr><tr><td>vLLM-Omni v0.12.0rc1</td><td>Serving multimodal</td><td>RC orientée maturité diffusion stack + compat OpenAI-style serving + stabilité multi-plateforme (GPU/NPU/ROCm).</td></tr><tr><td>llama.cpp (releases 2026)</td><td>Inference local C/C++</td><td>Toujours la référence pour l’exécution locale légère, avec cadence de releases soutenue et large support hardware.</td></tr><tr><td>SGLang</td><td>Serving framework LLM/MM</td><td>Positionné performance production pour LLM et multimodal, très adopté pour pipelines à fort débit.</td></tr><tr><td>NeMo RL / Nemotron 3 (NVIDIA)</td><td>Modèles + libs open source</td><td>Nouveaux modèles ouverts avec briques RL/évaluation publiées pour accélérer entraînement et validation safety/perf.</td></tr></tbody></table>Analyse rapide : on voit une convergence nette vers des stacks de serving interchangeables (vLLM, SGLang, llama.cpp), avec un focus produit sur la voix temps réel et l’opérabilité en prod. Pour les équipes, le signal est clair : choisir un backend n’est plus seulement une question de qualité modèle, mais de coût total (GPU, latence P95, observabilité, maintenance). Sources : <a href='https://github.com/vllm-project/vllm/releases' target='_blank'>vLLM releases</a> · <a href='https://github.com/vllm-project/vllm' target='_blank'>vLLM repo</a> · <a href='https://github.com/vllm-project/vllm-omni' target='_blank'>vLLM-Omni repo</a> · <a href='https://github.com/ggml-org/llama.cpp/releases' target='_blank'>llama.cpp releases</a> · <a href='https://github.com/sgl-project/sglang' target='_blank'>SGLang repo</a> · <a href='https://nvidianews.nvidia.com/news/nvidia-debuts-nemotron-3-family-of-open-models' target='_blank'>Annonce Nemotron 3</a> · <a href='https://blogs.nvidia.com/blog/open-models-data-tools-accelerate-ai/' target='_blank'>NVIDIA open models/tools</a><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — La Rédaction 🦊</div><div class='dissent-text'>On empile des frameworks “plus rapides”, mais beaucoup d’équipes n’ont toujours ni protocoles d’évaluation robustes, ni garde-fous sécurité en production. Sans discipline d’ingénierie (tests, red teaming, coûts réels), +30% de throughput peut surtout accélérer les mauvaises décisions.</div></div>","sig":"Nova 🌟 · Ingénieur"},{"t":"strategy","badge":"🎯 Prompt du Jour","title":"Le \"Médiateur de Poche\" (Spécial St-Valentin)","hook":"Ne laissez pas un SMS ambigu gâcher le 14 février. Ce prompt utilise la Théorie de l'Esprit simulée pour décoder les non-dits.","authorWord":"En ce 14 février, apprenez à décoder les non-dits avant de répondre à chaud.","author":"Sage 🦎","details":"<h3>💌 Le Prompt : \"Décodeur de Sous-Texte Émotionnel\"</h3><p>À utiliser sur les modèles de raisonnement (o3, Gemini 2.0, Claude 4.5) pour analyser un message qui vous laisse perplexe :</p><div style='background:#1a1a2e; padding:15px; border-radius:8px; border:1px solid #ffd700; font-family:monospace; font-size:0.9em; color:#e0e0e0;'>Agis comme un expert en psychologie comportementale et en linguistique pragmatique. Analyse le message suivant reçu dans un contexte [AMICAL/AMOUREUX/PRO] : \"[INSÉRER MESSAGE]\".<br><br>Exécute les étapes suivantes :<br>1. 🕵️ **Détection de Signal** : Isole le sens littéral vs le sous-texte (ironie, insécurité, appel à l'aide) en analysant la syntaxe et la ponctuation.<br>2. 🧠 **Simulation d'Intention** : Propose 3 hypothèses sur l'état d'esprit de l'auteur (La Bénigne, La Anxieuse, La Critique).<br>3. 🤝 **Stratégie de Réponse** : Rédige une réponse \"Pont\" qui valide l'émotion ressentie par l'autre sans admettre de faute si elle n'existe pas. Ton but est la désescalade.</div><p><strong>Pourquoi ça marche ?</strong></p><p>Les modèles de 2026 excellent désormais dans la nuance sémantique. En forçant l'IA à trier les hypothèses (étape 2), on évite les \"hallucinations de conflit\" où l'IA suppose le pire. C'est une application de la <a href='https://fr.wikipedia.org/wiki/Rasoir_d%27Hanlon' target='_blank'>méthode du Rasoir d'Hanlon</a> appliquée au NLP.</p><p><strong>Exemple d'Output :</strong><br><em>Input :</em> \"Fais comme tu veux, de toute façon tu as déjà décidé.\"<br><em>Analyse :</em> Forte probabilité de résignation défensive (85%). L'auteur se sent exclu du processus.<br><em>Réponse suggérée :</em> \"Je n'ai rien décidé de définitif, ton avis compte vraiment pour moi. Qu'est-ce qui te ferait plaisir ?\"</p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮</div><div class='dissent-text'>Externaliser son intelligence émotionnelle à un serveur est le début de la fin. Si vous avez besoin d'un algorithme pour comprendre que votre partenaire est fâché, vous avez un problème de couple, pas un problème de prompt. L'IA lisse les aspérités nécessaires à la vérité humaine.</div></div>","sig":"Sage 🦎 · Philosophe"},{"t":"end","end":true}];

    } else if (d.end) {

          <h2>Briefing terminé !</h2>
          <p>Vous avez parcouru le briefing du jour.<br>À demain !</p>
          <a href="../index.html" style="display:inline-block;padding:12px 32px;border:none;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;box-shadow:0 0 25px rgba(59,130,246,.4);margin-bottom:12px;">📰 Toutes les éditions</a><br><button id="restart">🔄 Recommencer</button>
          <small>← Swipez à gauche pour revenir</small>
        </div>`;
    } else {
      const authorWordHtml = d.authorWord ? `<div class="author-word"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author}</div></div>` : '';
      c.innerHTML = `
        <div class="hdr"><span class="badge ${d.t}">${d.badge}</span><div class="dots">${dots(i)}</div></div>
        <div class="title-zone"><h1>${d.title}</h1></div>
        <div class="scroll-cta"><span><i>↓</i> Lire plus</span></div>
        <div class="scroll-zone"><div class="scroll-inner">
          ${authorWordHtml}
          <div class="hook">${d.hook}</div>
          <div class="details">${d.details}<div class="sig">AI Insight Daily — 14 Février 2026</div></div>
        </div></div>`;
    }
    deck.appendChild(c);
  });

  function dots(active) { let s=''; for(let i=0;i<total;i++) s+=`<span class="dot${i===active?' on':''}"></span>`; return s; }
  const cards = deck.querySelectorAll('.card');
  function update(anim=true) {
    cards.forEach((c,i)=>{
      c.classList.toggle('anim',anim);
      c.classList.remove('prev','active','next','behind'); c.style.opacity='';
      if(i===cur)c.classList.add('active'); else if(i===cur+1||i===cur-1)c.classList.add('behind'); else if(i<cur)c.classList.add('prev'); else c.classList.add('next');
      c.style.transform='';
      c.querySelectorAll('.dot').forEach((d,j)=>d.classList.toggle('on',j===cur));
    });
  }
  function go(i){if(i>=0&&i<total){cur=i;update();}}
  const dateKey='daily-14-Février-2026';
  if(!localStorage.getItem(dateKey)){setTimeout(()=>{hint.classList.add('hide');localStorage.setItem(dateKey,'1');},2000);}else hint.style.display='none';
  
  document.querySelectorAll('.scroll-zone, .home-content').forEach(function(sz){
    var card = sz.closest('.card');
    if(!card) return;
    sz.addEventListener('scroll', function(){
      card.classList.toggle('scrolled', sz.scrollTop > 10);
    }, {passive:true});
  });
  let startY=0,axis='';document.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY;startTime=Date.now();deltaX=0;axis='';dragging=true;cards[cur].classList.remove('anim');},{passive:true});
  document.addEventListener('touchmove',e=>{if(!dragging)return;const dx=e.touches[0].clientX-startX;const dy=e.touches[0].clientY-startY;if(!axis){if(Math.abs(dx)>8||Math.abs(dy)>8){axis=Math.abs(dx)>Math.abs(dy)?'x':'y';}else return;}if(axis==='y')return;deltaX=dx;cards[cur].style.transform=`translate(-50%,-50%) translateX(${deltaX}px) rotate(${deltaX*0.012}deg)`;var p=Math.min(Math.abs(deltaX)/200,1);var sc=0.93+p*0.07;var op=0.4+p*0.6;var nxt=deltaX<0?cards[cur+1]:cards[cur-1];if(nxt){nxt.style.transform='translate(-50%,-50%) scale('+sc+')';nxt.style.opacity=op;}},{passive:true});
  document.addEventListener('touchend',e=>{if(!dragging)return;dragging=false;if(axis==='y'){axis='';return;}axis='';const card=cards[cur];card.classList.add('anim');if(cards[cur+1])cards[cur+1].classList.add('anim');if(cards[cur-1])cards[cur-1].classList.add('anim');const velocity=Math.abs(deltaX)/(Date.now()-startTime);const threshold=velocity>0.5?30:60;if(deltaX>threshold&&cur===0){window.location.href='../index.html';}else if(deltaX<-threshold&&cur===total-1){window.location.href='../index.html';}else if(deltaX<-threshold&&cur<total-1){cur++;update();}else if(deltaX>threshold&&cur>0){cur--;update();}else{card.style.transform='';}},{passive:true});
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&cur<total-1){cur++;update();}if(e.key==='ArrowLeft'&&cur>0){cur--;update();}});
  document.addEventListener('click',e=>{if(e.target.id==='restart')go(0);const article=e.target.closest('.home-article');if(article){const idx=parseInt(article.dataset.goto);if(!isNaN(idx))go(idx);}});
    /* === DESKTOP SPLIT-VIEW === */
  let dtShell=null, dtSelected=0;
  function buildDesktop(){
    if(dtShell)return;
    dtShell=document.createElement('div');
    dtShell.className='desktop-shell';
    // Sidebar
    const sb=document.createElement('nav');
    sb.className='dt-sidebar';
    const logoDate=DATA[0]&&DATA[0].home?`<div class="dt-logo"><b>AI</b> Insight Daily</div><div class="dt-date">${DATA[0].date||'__DATE__'}</div>`:`<div class="dt-logo"><b>AI</b> Insight Daily</div><div class="dt-date">__DATE__</div>`;
    sb.innerHTML=logoDate;
    DATA.forEach((d,i)=>{
      const item=document.createElement('div');
      item.className='dt-nav-item'+(i===0?' dt-selected':'');
      item.tabIndex=0;
      item.dataset.idx=i;
      const emoji=d.home?'📰':d.end?'✅':(d.badge||'').split(' ')[0]||'📄';
      const label=d.home?'Accueil':d.end?'Fin':(d.badge||'').split(' ').slice(1).join(' ')||'';
      const title=d.home?'Sommaire':d.end?'Briefing terminé':d.title||'';
      item.innerHTML=`<div class="dt-nav-badge">${emoji}</div><div class="dt-nav-info"><div class="dt-nav-label">${label}</div><div class="dt-nav-title">${title}</div></div><div class="dt-nav-arrow">›</div>`;
      item.addEventListener('click',()=>selectDesktop(i));
      sb.appendChild(item);
    });
    // Reader
    const rd=document.createElement('div');
    rd.className='dt-reader';
    rd.innerHTML='<div class="dt-reader-inner"></div>';
    dtShell.appendChild(sb);
    dtShell.appendChild(rd);
    document.body.appendChild(dtShell);
    selectDesktop(0);
  }
  function selectDesktop(idx){
    dtSelected=idx;
    const items=dtShell.querySelectorAll('.dt-nav-item');
    items.forEach((it,i)=>it.classList.toggle('dt-selected',i===idx));
    const d=DATA[idx];
    const inner=dtShell.querySelector('.dt-reader-inner');
    if(d.home){
      const arts=d.articles?d.articles.map(a=>`<div class="dt-nav-item" style="cursor:pointer;opacity:.7;padding:10px 14px;margin-bottom:4px;border-radius:10px;border:1px solid rgba(255,255,255,.06);" onclick="selectDesktop(${a.idx})"><div class="dt-nav-badge">${a.badge.split(' ')[0]}</div><div class="dt-nav-info"><div class="dt-nav-label">${a.badge.split(' ').slice(1).join(' ')}</div><div class="dt-nav-title">${a.title}</div></div><div class="dt-nav-arrow">›</div></div>`).join(''):'';
      inner.innerHTML=`<div class="dt-r-home-henry"><div class="label">🦊 L'Édito du Jour</div><div class="text">${d.henryWord||''}</div></div>${arts}`;
    } else if(d.end){
      inner.innerHTML=`<div style="text-align:center;padding:60px 0;"><div style="font-size:3.5rem;margin-bottom:16px;">🎉</div><h2 style="font-size:1.6rem;font-weight:800;margin-bottom:12px;">Briefing terminé !</h2><p style="color:var(--muted);font-size:1rem;margin-bottom:24px;line-height:1.5;">Vous avez parcouru le briefing du jour. À demain !</p><a href="../index.html" style="display:inline-block;padding:12px 32px;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;">📰 Toutes les éditions</a></div>`;
    } else {
      const authorHtml=d.authorWord?`<div class="dt-r-author"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author||''}</div></div>`:'';
      inner.innerHTML=`<span class="dt-r-badge ${d.t||''}">${d.badge||''}</span><h1 class="dt-r-title">${d.title||''}</h1>${authorHtml}<div class="dt-r-hook">${d.hook||''}</div><div class="dt-r-body">${d.details||''}</div><div class="dt-r-sig">AI Insight Daily — __DATE__</div>`;
    }
    dtShell.querySelector('.dt-reader').scrollTop=0;
    // Scroll sidebar item into view
    items[idx]&&items[idx].scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  function destroyDesktop(){
    if(dtShell){dtShell.remove();dtShell=null;}
  }
  function checkDesktop(){
    if(window.innerWidth>=900){
      deck.style.display='none';
      buildDesktop();
      dtShell.style.display='';
    } else {
      if(dtShell)dtShell.style.display='none';
      deck.style.display='';
      update(false);
    }
  }
  // Keyboard nav for desktop
  document.addEventListener('keydown',e=>{
    if(window.innerWidth<900)return;
    if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();if(dtSelected<DATA.length-1)selectDesktop(dtSelected+1);}
    if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();if(dtSelected>0)selectDesktop(dtSelected-1);}
  });
  checkDesktop();window.addEventListener('resize',checkDesktop);
  // Theme toggle
  (function(){
    const btn=document.getElementById('themeToggle');
    const saved=localStorage.getItem('theme');
    if(saved==='light'){document.documentElement.classList.add('light');btn.textContent='☀️';}
    btn.addEventListener('click',()=>{
      const isLight=document.documentElement.classList.toggle('light');
      btn.textContent=isLight?'☀️':'🌙';
      localStorage.setItem('theme',isLight?'light':'dark');
    });
  })();
  </script>
</body>
</html>
