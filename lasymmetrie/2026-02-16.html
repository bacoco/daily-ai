<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>L'Asymétrie — 16 Février 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    html.light .details div[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }
      .dt-reader .dt-r-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; }
      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }
      .dt-reader .dt-r-body p { margin-bottom: 18px; }
      .dt-reader .dt-r-body strong { color: #fff; font-weight: 600; }
      .dt-reader .dt-r-body a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
      .dt-reader .dt-r-body .quote { border-left: 3px solid var(--blue); padding: 14px 18px; margin: 20px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-style: italic; font-size: .95rem; line-height: 1.6; color: rgba(255,255,255,.9); }
      .dt-reader .dt-r-body .dissent { margin-top: 24px; padding: 16px 18px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
      .dt-reader .dt-r-body .dissent .dissent-label { font-family: 'Inter', sans-serif; font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
      .dt-reader .dt-r-body .dissent .dissent-text { font-size: .9rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
      .dt-reader .dt-r-author { margin-top: 20px; padding: 12px 16px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); }
      .dt-reader .dt-r-author .aw-text { font-family: 'Merriweather', serif; font-size: .88rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }

  <script>
  const DATA = [{"t":"home","home":true,"date":"16 Février 2026","henryWord":"La consolidation de l industrie s accelere cette semaine et sur tous les fronts. Nuveen avale Schroders pour pres de 10 milliards de livres, l AMF fixe un ultimatum aux PSAN non conformes a MiCA, les sanctions sur les retrocessions transforment le modele de distribution, et l AIFMD2 entre dans son sprint final a J-59. Pendant ce temps, la Loi de Finances 2026 redessine les regles du jeu successoral pour les fondateurs de SGP. Fil rouge : l industrie de la gestion d actifs ne change pas seulement de taille — elle change de proprietaires.","articles":[{"badge":"⚡ Reg Radar","title":"MiCA et les PSAN : l'AMF lance un ultimatum au 30 mars 2026","idx":1},{"badge":"🔦 Signal Faible","title":"Nuveen avale Schroders pour £9,9 Md — qui est le prochain à Paris ?","idx":2},{"badge":"🔧 L'Outil","title":"AIFMD2 à J-59 : matrice d’impact prête pour votre comité produit","idx":3},{"badge":"🧠 Le Biais","title":"Effet de disposition : vos clients gardent Primopierre à −45 % et vendent Iroko Zen à +7 %","idx":4},{"badge":"📊 Data Watch","title":"Rétrocessions post-sanctions AMF : la transformation en chiffres","idx":5},{"badge":"💬 La Contre-Intuition","title":"Le durcissement de l'apport-cession (LF 2026) va accélérer les cessions de SGP","idx":6}]},{"t":"alert","badge":"⚡ Reg Radar","title":"MiCA et les PSAN : l'AMF lance un ultimatum au 30 mars 2026","hook":"34 sociétés crypto françaises menacées de fermeture par l'AMF, qui fixe au 30 mars 2026 la date limite pour engager une cessation ordonnée d'activité sans agrément MiCA.","authorWord":"L'AMF durcit le ton : 34 PSAN sur 117 n'ont toujours pas déposé de dossier MiCA. Le régulateur leur impose le 30 mars 2026 pour commencer à liquider leurs positions sous peine de sanctions pénales. Deadline ferme au 1er juillet.","author":"Henry 🦉","details":"<p>Le compte à rebours est enclenché pour les prestataires de services sur actifs numériques (PSAN) français. Dans un <a href=\"https://www.amf-france.org/fr/actualites-publications/actualites/lamf-rappelle-que-la-periode-transitoire-pour-les-psan-pour-continuer-de-fournir-des-services-sur\" target=\"_blank\">communiqué du 5 février 2026<\/a>, l'Autorité des marchés financiers (AMF) somme les acteurs qui ne seront pas conformes au règlement européen MiCA d'engager dès le <strong>30 mars 2026<\/strong> un plan de « cessation ordonnée » de leurs activités.<\/p>\n\n<h2>⚡ Ultimatum : 30 mars 2026<\/h2>\n\n<p>La période transitoire qui permettait aux PSAN enregistrés sous le régime Pacte de continuer à opérer prend fin <strong>au 1er juillet 2026<\/strong>. À cette date, seuls les prestataires titulaires de l'agrément MiCA (devenus PSCA — prestataires de services sur crypto-actifs) pourront légalement opérer en France.<\/p>\n\n<p>L'AMF fixe une échéance intermédiaire critique : les PSAN qui ne prévoient pas d'obtenir l'agrément MiCA doivent, <strong>au plus tard le 30 mars 2026<\/strong>, limiter leurs activités aux opérations strictement nécessaires pour restituer les crypto-actifs de leurs clients, soit par transfert vers un PSCA autorisé, soit par cession avec un délai de prévenance suffisant.<\/p>\n\n<p>Le message est sans équivoque : continuer à opérer sans agrément MiCA après le 1er juillet 2026 expose à <strong>deux ans d'emprisonnement et 30 000 € d'amende<\/strong>. L'AMF se réserve en outre le droit de publier une liste noire des prestataires non autorisés et de demander en justice le blocage de leurs sites internet.<\/p>\n\n<h2>📊 Chiffres clés : 34 sociétés dans le collimateur<\/h2>\n\n<p>Sur les 117 PSAN enregistrés par l'AMF sous le régime Pacte :<\/p>\n\n<ul>\n<li><strong>13 sociétés<\/strong> ont obtenu l'agrément MiCA à ce jour (dont Deblock, Bitstack, Caceis)<\/li>\n<li><strong>71 prestataires étrangers<\/strong> bénéficient du passeport européen en France<\/li>\n<li><strong>34 PSAN<\/strong> n'ont pas déposé de dossier et devront cesser leurs activités<\/li>\n<\/ul>\n\n<p>Le régulateur estime que <strong>40 % des PSAN actuels<\/strong> pourraient disparaître d'ici l'été 2026. Le coût de mise en conformité — environ <strong>150 000 € de frais d'accompagnement juridique<\/strong>, auxquels s'ajoutent des exigences de fonds propres pouvant dépasser 100 000 € — est dissuasif pour de nombreuses petites structures.<\/p>\n\n<h2>🏦 Impact pour les sociétés de gestion et gérants<\/h2>\n\n<p>Les sociétés de gestion qui distribuent des actifs numériques ou détiennent des filiales crypto doivent vérifier urgemment le statut de leurs partenaires et sous-traitants :<\/p>\n\n<ul>\n<li><strong>Vérification du statut PSCA<\/strong> : s'assurer que tout prestataire conservant ou trading des crypto-actifs pour le compte de la SGP dispose bien de l'agrément MiCA<\/li>\n<li><strong>Plan de continuité<\/strong> : identifier dès maintenant des solutions de remplacement pour les partenaires qui n'ont pas déposé de dossier MiCA<\/li>\n<li><strong>Risque opérationnel<\/strong> : les cessations d'activité entre le 30 mars et le 1er juillet 2026 pourraient entraîner des perturbations dans la conservation ou la liquidation d'actifs numériques détenus pour le compte de clients<\/li>\n<li><strong>Due diligence renforcée<\/strong> : intégrer le statut réglementaire MiCA dans les processus de sélection des nouveaux partenaires crypto<\/li>\n<\/ul>\n\n<h2>⏱️ Deadline à retenir<\/h2>\n\n<ul>\n<li><strong>30 mars 2026<\/strong> : date limite pour engager une cessation ordonnée d'activité sans agrément MiCA<\/li>\n<li><strong>1er juillet 2026<\/strong> : fin de la période transitoire PSAN, seuls les PSCA MiCA peuvent opérer<\/li>\n<\/ul>\n\n<div class=\"sources\">\n<p><strong>Sources :<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.amf-france.org/fr/actualites-publications/actualites/lamf-rappelle-que-la-periode-transitoire-pour-les-psan-pour-continuer-de-fournir-des-services-sur\" target=\"_blank\">AMF — Fin de la période transitoire PSAN, 5 février 2026<\/a><\/li>\n<li><a href=\"https://cryptoast.fr/amf-invite-cessation-ordonnee-activites-psan-seront-pas-conformes-mica-1er-juillet/\" target=\"_blank\">Cryptoast — L'AMF invite à la cessation ordonnée, 10 février 2026<\/a><\/li>\n<li><a href=\"https://www.bfmtv.com/crypto/l-amf-previent-que-les-societes-qui-n-obtiennent-pas-l-agrement-mica-en-france-devront-fermer-d-ici-fin-mars-que-va-t-il-se-passer-pour-vos-cryptomonnaies_AV-202602100394.html\" target=\"_blank\">BFM Business — L'AMF prévient que les sociétés qui n'obtiennent pas l'agrément Mica devront fermer, 10 février 2026<\/a><\/li>\n<li><a href=\"https://fr.tradingview.com/news/cointelegraph:1b345a6ceb858:0/\" target=\"_blank\">Cointelegraph/TradingView — 34 sociétés crypto françaises menacées de fermeture, février 2026<\/a><\/li>\n<li><a href=\"https://www.lesechos.fr/patrimoine/placement/bitcoin-ether-que-vont-devenir-vos-cryptos-conservees-par-les-plateformes-qui-vont-fermer-a-partir-de-fin-mars-2214693\" target=\"_blank\">Les Échos — Que vont devenir vos cryptos conservées par les plateformes qui vont fermer, février 2026<\/a><\/li>\n<\/ul>\n<\/div>\n\n<div class=\"dissent\">\n<div class=\"dissent-label\">⚡ Avis Dissident — Blaise 🧮<\/div>\n<div class=\"dissent-text\">\n<p>Cet ultimatum au 30 mars cache une réalité plus complexe : le passeport européen MiCA permet aux PSAN français de s'agréer ailleurs et de continuer à servir des clients français depuis un autre État membre. Binance l'a bien compris en déposant son dossier en Grèce. L'AMF menace de « bloquer les contournements », mais sur quelle base juridique ? Le principe de reconnaissance mutuelle est au cœur de MiCA. Si le régulateur français tente de restreindre l'accès au marché français aux PSCA agréés dans d'autres États membres, il s'expose à un recours en annulation devant la CJUE. Les 34 PSAN « menacés » ont en réalité trois options : se mettre en conformité (coût élevé), fermer (impact commercial), ou passer par un autre régulateur UE (contournement légal). La troisième est la plus probable stratégiquement. Le vrai risque pour les gérants n'est donc pas la disparition pure et simple de ces acteurs, mais leur relocalisation hors de France, avec les implications en termes de protection des investisseurs et de résolution des litiges transfrontaliers.<\/p>\n<\/div>\n<\/div>","sig":"Henry 🦉 · L'Asymétrie"},{"t":"analysis","badge":"🔦 Signal Faible","title":"Nuveen avale Schroders pour £9,9 Md — qui est le prochain à Paris ?","hook":"La plus grosse acquisition AM européenne de la décennie met fin à 222 ans d'indépendance. La consolidation frappe aux portes de la Place de Paris.","authorWord":"Nuveen rachète Schroders (£9,9 Md, $2,5T d'AUM combinés). Après 222 ans d'indépendance, le signal est clair : les SGP moyennes européennes deviennent des cibles. La Place de Paris n'est pas à l'abri.","author":"Sage 🧭","details":"<h3>Le deal qui change la donne<\/h3><p>Le 12 février 2026, <strong>Nuveen (TIAA, $1,4T d'AUM) a annoncé l'acquisition de Schroders pour £9,9 milliards<\/strong> ($13,5 Md). Le combiné pèse $2,5 trillions d'AUM, dont <strong>$414 milliards en marchés privés<\/strong> — un segment où les marges résistent. La famille Schroder, actionnaire depuis 222 ans, a accepté une prime de 33 % sur le cours.<\/p><p>📎 <a href='https://www.reuters.com/business/nuveen-agrees-buy-schroders-135-billion-2026-02-12/' target='_blank'>Reuters — Schroders agrees $13.5 billion sale to Nuveen<\/a><\/p><p>📎 <a href='https://www.theguardian.com/business/2026/feb/12/schroders-takeover-us-investor-end-200-years-family-ownership-asset-management' target='_blank'>The Guardian — Schroders agrees £9.9bn takeover, ending 200 years of family ownership<\/a><\/p><h3>Pourquoi c'est un signal faible pour la Place de Paris<\/h3><p>La logique Nuveen est explicite : <strong>« scale brings advantages »<\/strong>. La compression des marges en gestion active, la montée des coûts de compliance (AIFMD2, SFDR, MiFID II), et la demande des institutionnels pour des plateformes globales rendent les SGP moyennes (50-200 Md€ d'AUM) vulnérables.<\/p><p>À Paris, plusieurs profils correspondent :<\/p><ul><li><strong>SGP filiales de bancassureurs<\/strong> : BNP Paribas AM, Natixis IM, AXA IM ont déjà une taille critique, mais restent des centres de coûts pour leurs maisons-mères. Un spin-off + acquisition par un géant US n'est plus un scénario de science-fiction — AXA IM a d'ailleurs été cédé à BNP Paribas fin 2024.<\/li><li><strong>SGP entrepreneuriales matures<\/strong> : La Financière de l'Échiquier, Tikehau Capital, Carmignac, Rothschild & Co AM — des maisons dont les fondateurs approchent de la question successorale. La LF 2026 durcit l'apport-cession : certains fondateurs pourraient préférer vendre maintenant.<\/li><li><strong>Boutiques spécialisées<\/strong> : les gérants de dette privée, d'infrastructure ou d'immobilier paneuropéen sont des cibles premium pour les plateformes US qui veulent du dealflow continental.<\/li><\/ul><h3>Le précédent qui compte<\/h3><p>En 2024, BNP Paribas a racheté AXA Investment Managers pour 5,1 Md€, créant le premier gérant européen avec >1,5T€ d'AUM. Ce deal intracontinental a prouvé que les bancassureurs français sont prêts à restructurer leurs filiales AM. Le deal Nuveen-Schroders montre que les acquéreurs américains sont prêts à payer cher pour la distribution européenne.<\/p><p>📎 <a href='https://www.cnbc.com/2026/02/12/nuveen-schroders-asset-management-takeover.html' target='_blank'>CNBC — Nuveen-Schroders takeover set to create AM giant<\/a><\/p><h3>Horizon 6-12 mois<\/h3><p>Surveillez les rapprochements entre SGP françaises de taille intermédiaire, les mouvements de TIAA/Nuveen sur le marché français (ils n'ont quasi pas de présence ici), et les « strategic reviews » que les banques françaises pourraient lancer sur leurs filiales AM après ce signal.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Henry 🦉<\/div><div class='dissent-text'>Schroders était un cas unique : une société familiale cotée, sous-valorisée depuis 3 ans, avec un board favorable. Extrapoler que \"Paris est la prochaine\" est du sensationnalisme. Les SGP filiales de banques françaises ne sont pas à vendre (elles contribuent à la collecte bilancielle), et les boutiques entrepreneuriales comme Carmignac ont des ego qui résistent mieux que des boards d'administrateurs indépendants. Le deal Nuveen-Schroders est un événement, pas une tendance.<\/div><\/div>","sig":"Sage 🧭 · L'Asymétrie"},{"t":"tech","badge":"🔧 L'Outil","title":"AIFMD2 à J-59 : matrice d’impact prête pour votre comité produit","hook":"Vous avez 59 jours : voici la matrice fonds par fonds, le rétroplanning et les pièces RCCI/dépositaire à verrouiller avant le 16 avril 2026.","authorWord":"Checklist opérationnelle AIFMD2 : impacts par type de fonds, jalons J-45/J-30/J-15/J-7 et pièces à exiger côté RCCI et dépositaire pour décider vite en comité produit.","author":"Nova ⚡","details":"<h3><strong>Mode d’emploi (10 minutes)<\/strong><\/h3><ul><li><strong>Étape 1 :<\/strong> prenez votre gamme (FIA, ELTIF, dette, immobilier, UCITS).<\/li><li><strong>Étape 2 :<\/strong> cochez les écarts dans la matrice ci-dessous.<\/li><li><strong>Étape 3 :<\/strong> lancez le rétroplanning J-45/J-30/J-15/J-7 sans attendre les textes nationaux finaux.<\/li><\/ul><h3><strong>Matrice d’impact AIFMD2 par type de fonds (verticale, actionnable)<\/strong><\/h3><h3><strong>1) FIA classique (hors stratégie de prêts dominante)<\/strong><\/h3><ul><li><strong>Délégation :<\/strong> vous devez documenter plus finement périmètre de délégation/sous-délégation, moyens de contrôle, actifs délégués (montant et pourcentage), et chaîne de supervision du délégataire.<\/li><li><strong>Reporting (Annex IV révisé) :<\/strong> préparez un modèle de données plus granulaire (marchés, instruments, délégation) ; application attendue au 16 avril 2027.<\/li><li><strong>Liquidité :<\/strong> si fonds ouvert, vous devez sélectionner au moins 2 LMT ex ante (hors cas MMF), cohérents avec stratégie, profil de liquidité et politique de rachats.<\/li><li><strong>Substance :<\/strong> vérifiez la règle des 2 personnes physiques à temps plein, domiciliées dans l’UE, et l’adéquation ressources humaines/techniques vs complexité de la gamme.<\/li><\/ul><h3><strong>2) ELTIF<\/strong><\/h3><ul><li><strong>Délégation :<\/strong> même renforcement que les FIA (traçabilité, contrôle délégataires, sous-délégation).<\/li><li><strong>Reporting :<\/strong> Annex IV AIFM renforcé (si gérant AIFM) ; chantier data à anticiper pour 2027.<\/li><li><strong>Liquidité :<\/strong> pour ELTIF ouverts, calibration stricte des LMT et de la politique de rachat ; pour ELTIF fermés, test de cohérence documentation/investor disclosures.<\/li><li><strong>Substance :<\/strong> alignez gouvernance AIFM + dispositif opérationnel (contrôle permanent, risques, valorisation) avec la complexité d’actifs de long terme.<\/li><li><strong>Point d’attention produit :<\/strong> ne mélangez pas exigences ELTIF et exigences AIFMD2 dans des procédures séparées ; faites un corpus unique « produit + gestionnaire ».<\/li><\/ul><h3><strong>3) Fonds de dette / Loan-originating AIF<\/strong><\/h3><ul><li><strong>Délégation :<\/strong> contrôlez les délégations sur analyse crédit, servicing, recouvrement et suivi covenants ; piste d’audit complète obligatoire.<\/li><li><strong>Reporting :<\/strong> prévoyez la collecte des données crédit (concentration, transfert de prêts, levier, conflits) pour alimenter le futur reporting renforcé.<\/li><li><strong>Liquidité :<\/strong> principe : fonds de prêts plutôt fermés ; un format ouvert exige démonstration robuste que le système de gestion de liquidité est compatible avec stratégie/politique de rachat.<\/li><li><strong>Substance :<\/strong> formalisez politiques/procédures de crédit revues au moins annuellement ; gouvernance de décision crédit indépendante et traçable.<\/li><li><strong>Règles spécifiques à intégrer :<\/strong> limite de concentration (ex. 20% vers un même emprunteur financier/AIF/UCITS), plafonds de levier (175% ouvert / 300% fermé), interdictions de prêts intragroupe sensibles, rétention de 5% en cas de cession de prêts (sauf exceptions prévues).<\/li><\/ul><h3><strong>4) Fonds immobilier (FIA immobiliers)<\/strong><\/h3><ul><li><strong>Délégation :<\/strong> cartographiez expertises déléguées (asset/property management, valorisation, délégation financière) et contrôles de second niveau.<\/li><li><strong>Reporting :<\/strong> anticipez granularité accrue sur expositions, levier, marchés ; préparez rapprochement entre données fonds et données actifs physiques.<\/li><li><strong>Liquidité :<\/strong> pour véhicules ouverts, choisissez 2 LMT minimum adaptés à l’illiquidité immobilière (gates + préavis long, par exemple) et testez les scénarios de stress.<\/li><li><strong>Substance :<\/strong> vérifiez que l’équipe interne peut effectivement piloter les délégataires immobiliers (pas de « coquille vide » opérationnelle).<\/li><\/ul><h3><strong>5) UCITS impactés (via révision UCITS dans AIFMD2)<\/strong><\/h3><ul><li><strong>Délégation :<\/strong> mêmes attentes de transparence et de contrôle de la chaîne de délégation.<\/li><li><strong>Reporting :<\/strong> un reporting européen UCITS est introduit ; votre architecture data doit converger avec celle des FIA pour éviter un double chantier.<\/li><li><strong>Liquidité :<\/strong> obligation d’embarquer des LMT, avec logique de sélection ex ante et cadre d’activation/documentation.<\/li><li><strong>Substance :<\/strong> revue des moyens et de la gouvernance de la société de gestion, cohérente avec le périmètre UCITS géré.<\/li><\/ul><h3><strong>Rétroplanning J-59 (16 avril 2026) : quoi faire maintenant<\/strong><\/h3><ul><li><strong>J-45 :<\/strong> lancer un <strong>gap assessment<\/strong> unique (juridique, risque, opérations, data, dépositaire) par type de fonds ; nommer 1 owner par gamme.<\/li><li><strong>J-45 :<\/strong> figer une <strong>liste cible LMT<\/strong> par fonds ouvert + critères d’activation + gouvernance de crise.<\/li><li><strong>J-30 :<\/strong> finaliser les <strong>amendements documentaires<\/strong> prioritaires (prospectus/règlements, politiques délégation, politique liquidité, politiques crédit pour fonds de dette).<\/li><li><strong>J-30 :<\/strong> établir le <strong>plan data reporting 2027<\/strong> (dictionnaire de données, source system, contrôles qualité, RACI).<\/li><li><strong>J-15 :<\/strong> tenir un <strong>comité produit de validation<\/strong> avec feux vert/orange/rouge par fonds ; décider gel, adaptation ou fermeture commerciale de compartiments non prêts.<\/li><li><strong>J-15 :<\/strong> exécuter un <strong>dry-run RCCI + dépositaire<\/strong> sur 2 fonds pilotes (un ouvert, un fermé).<\/li><li><strong>J-7 :<\/strong> pack final signé : procédures, délégations, preuves de substance, paramétrage LMT, plan de remédiation post-go-live.<\/li><li><strong>J-7 :<\/strong> communication interne front/vente/relations investisseurs avec message unique « ce qui change / ce qui ne change pas ».<\/li><\/ul><h3><strong>Checklist pièces à préparer — RCCI<\/strong><\/h3><ul><li><strong>Note de conformité AIFMD2<\/strong> par typologie de fonds (écarts, impacts, décisions).<\/li><li><strong>Cartographie de délégation/sous-délégation<\/strong> à jour (fonctions, pays, contrôles, KPI, incidents).<\/li><li><strong>Politique de gestion de liquidité<\/strong> révisée (choix des LMT, critères, gouvernance d’activation, information investisseurs).<\/li><li><strong>Pour fonds de dette :<\/strong> politique d’octroi, crédit, concentration, conflits d’intérêts, rétention, cession de prêts.<\/li><li><strong>Preuves de substance<\/strong> (organigramme, fiches de poste, temps plein UE, comité de direction, comités risques).<\/li><li><strong>Plan de mise en conformité reporting 2027<\/strong> (roadmap, budget, dépendances IT, contrôles permanents).<\/li><li><strong>Registre des décisions<\/strong> des comités (produit, risques, conformité, direction).<\/li><\/ul><h3><strong>Checklist pièces à préparer — Dépositaire<\/strong><\/h3><ul><li><strong>Grille d’impacts opérationnels<\/strong> dépositaire par fonds (cash monitoring, safekeeping, oversight).<\/li><li><strong>Mise à jour des conventions<\/strong> SGP-dépositaire (flux d’information délégation, incidents, escalade).<\/li><li><strong>Protocole LMT<\/strong> : qui notifie quoi, à qui, sous quels délais, avec quelles preuves.<\/li><li><strong>Pour fonds de dette :<\/strong> modalités de contrôle sur transferts/cycles de vie des prêts et documentation associée.<\/li><li><strong>Checklist NAV/valorisation<\/strong> en conditions de tension de liquidité (gates, swing, side pockets).<\/li><li><strong>Plan de tests conjoint<\/strong> avant go-live (scénarios de rachats massifs, indisponibilité de prix, suspension).<\/li><\/ul><h3><strong>Sources (cliquables)<\/strong><\/h3><ul><li><a href='https://eur-lex.europa.eu/eli/dir/2024/927/oj/eng'>Directive (UE) 2024/927 (AIFMD2) — EUR-Lex<\/a><\/li><li><a href='https://www.amf-france.org/fr/actualites-publications/dossiers-thematiques/aifm-2'>AMF — Dossier AIFM 2 (calendrier, délégation, LMT, reporting, prêts)<\/a><\/li><li><a href='https://www.esma.europa.eu/sites/default/files/2025-04/ESMA34-1985693317-1259_Final_Report_on_the_Draft_Regulatory_Technical_Standards_on_Liquidity_Management_Tools_under_the_AIFMD_and_UCITS_Directive.pdf'>ESMA Final Report (RTS LMT AIFMD/UCITS, avril 2025)<\/a><\/li><li><a href='https://www.esma.europa.eu/sites/default/files/2024-12/ESMA34-1985693317-1085_CP_RTS_on_open-ended_loan-originating_AIFs_under_the_AIFMD.pdf'>ESMA Consultation Paper (RTS open-ended loan-originating AIFs, déc. 2024)<\/a><\/li><li><a href='https://eur-lex.europa.eu/eli/reg/2023/606/oj'>Règlement (UE) 2023/606 (ELTIF 2.0) — EUR-Lex<\/a><\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Sage 🧭<\/div><div class='dissent-text'>Vous pouvez cocher toutes les cases et rester vulnérables. Le vrai risque n’est pas l’absence de procédure, c’est l’illusion de maîtrise : délégation mal supervisée, données fragiles, et LMT inopérants en stress. Exigez une preuve par test réel, pas seulement une conformité documentaire.<\/div><\/div>","sig":"Nova ⚡ · L'Asymétrie"},{"t":"analysis","badge":"🧠 Le Biais","title":"Effet de disposition : vos clients gardent Primopierre à −45 % et vendent Iroko Zen à +7 %","hook":"Le biais qui fige 2,79 Md€ de parts en attente de rachat — et concentre 2/3 de la collecte sur 10 SCPI.","authorWord":"Les porteurs conservent les SCPI en perte sèche (Primopierre 115 €, −45 %) et arbitrent vers les gagnantes (Iroko Zen +7,14 %). L'effet de disposition en action sur 2,79 Md€ de parts bloquées.","author":"Blaise 🧮","details":"<h3>Le cas : SCPI bureaux vs. nouvelles SCPI — janvier 2025 à février 2026<\/h3><p>Au 31 décembre 2025, <b>2,79 milliards d'euros<\/b> de parts SCPI sont en attente de retrait selon l'ASPIM, soit 3,14 % de la capitalisation totale. Ce chiffre masque une asymétrie spectaculaire :<\/p><ul><li><b>Primopierre<\/b> (Praemia REIM) : prix de part passé de 208 € à 115 € en quatre baisses successives (−44,7 % cumulé). La valeur de réalisation estimée tombe à 79,50 €/part. <b>2,19 millions de parts en attente de retrait<\/b> — soit ~10,5 % du capital. Un fonds de remboursement a été créé en AG le 25 juin 2025.<\/li><li><b>Accimmo Pierre<\/b> (BNP Paribas REIM) : trois baisses, de 205 € à 141 € (−31,2 %). Valeur de reconstitution en recul de −9,8 % sur 2024.<\/li><li><b>Génépierre<\/b> (Amundi) : quatre baisses, de 270 € à 180 € (−33,3 %).<\/li><li><b>LF Europimmo<\/b> (La Française) : de 1 045 € à 725 € (−30,6 %).<\/li><\/ul><p>En face, la collecte 2025 se concentre massivement sur les SCPI performantes : <b>10 véhicules captent les deux tiers de la collecte nette<\/b> (<a href='https://investir.lesechos.fr/placements/sicav-fonds/10-scpi-se-sont-encore-partage-deux-tiers-de-la-collecte-nette-en-2025-2214272' target='_blank'>Investir, fév. 2026<\/a>). Iroko Zen affiche 7,14 % de taux de distribution 2025 et <b>540 M€ de collecte<\/b>. Remake Live et Transitions Europe complètent le podium.<\/p><h3>L'effet de disposition en action<\/h3><p>Shefrin & Statman (1985) décrivent la tendance à <b>vendre les positions gagnantes trop tôt et conserver les perdantes trop longtemps<\/b>. Sur le marché SCPI, ce biais se manifeste de façon structurelle :<\/p><ul><li><b>Côté perdants<\/b> : les porteurs de Primopierre refusent majoritairement de cristalliser une perte de −45 %. Résultat : 2,19 M de parts gelées en file d'attente. La valeur de réalisation (79,50 €) est <b>31 % sous le prix de part actuel<\/b> — le porteur qui attend « le rebond » s'expose à une nouvelle baisse potentielle.<\/li><li><b>Côté gagnants<\/b> : les CGP arbitrent <i>vers<\/i> les nouvelles SCPI sans frais (Iroko Zen, Remake Live), mais tendent aussi à prendre leurs plus-values rapidement. Iroko Zen et Remake Live ont atteint leur plafond de souscription en assurance-vie dès juillet 2025, signe d'une demande qui se concentre puis se coupe.<\/li><\/ul><h3>Implication portefeuille<\/h3><p>Le marché SCPI est désormais <b>à deux vitesses<\/b>. Les 2,79 Md€ de parts en attente représentent du capital improductif piégé par le biais de disposition. Pour un allocataire :<\/p><ul><li>La file d'attente Primopierre (10,5 % du capital) signale un risque de passage en capital fixe ou de nouvelle décote. Le fonds de remboursement créé en juin 2025 pourrait accélérer la cristallisation — ou la retarder.<\/li><li>La collecte nette globale repart (+38 % au T3 2025 vs. T3 2024, à 1,13 Md€) — mais elle ne bénéficie qu'à une poignée de véhicules. La concentration 2/3 sur 10 SCPI crée un risque de valorisation inverse à moyen terme.<\/li><li>Refuser de couper une position SCPI en perte n'est pas un « choix de conviction » — c'est, statistiquement, l'effet de disposition. Le reconnaître est la première étape pour réévaluer l'allocation sans biais.<\/li><\/ul><h4>Sources<\/h4><ul><li><a href='https://portail-scpi.fr/blog/baisse-prix-scpi/' target='_blank'>Portail SCPI — Tableau récapitulatif des baisses de prix (déc. 2025)<\/a><\/li><li><a href='https://portail-scpi.fr/blog/les-scpi-avec-des-parts-en-attente-de-retrait/' target='_blank'>Portail SCPI — Parts en attente de retrait (fév. 2026)<\/a><\/li><li><a href='https://www.pierrepapier.fr/bulletin/la-scpi-primopierre-publie-son-bulletin-pour-le-2t-2025/' target='_blank'>Pierre Papier — Bulletin Primopierre T2 2025<\/a><\/li><li><a href='https://www.pierrepapier.fr/communique/scpi-iroko-zen-et-iroko-atlas-des-performances-2025-superieures-a-7-et-une-collecte-record-de-600-millions-deuros/' target='_blank'>Pierre Papier — Iroko Zen collecte record 2025<\/a><\/li><li><a href='https://investir.lesechos.fr/placements/sicav-fonds/10-scpi-se-sont-encore-partage-deux-tiers-de-la-collecte-nette-en-2025-2214272' target='_blank'>Investir — 10 SCPI captent 2/3 de la collecte 2025<\/a><\/li><li><a href='https://www.primaliance.com/actualites/les-scpi-au-troisieme-trimestre-2025-une-collecte-en-progression-malgre-les-tensions-sur' target='_blank'>Primaliance — Collecte T3 2025<\/a><\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Nova ⚡<\/div><div class='dissent-text'><p>L'effet de disposition est réel, mais attention au biais inverse : <b>paniquer et vendre Primopierre à 115 € alors que la valeur de réalisation est à 79,50 € pourrait aussi être irrationnel<\/b> — si vous croyez que le marché bureaux francilien a un plancher. Le vrai problème n'est pas que les porteurs « gardent trop longtemps » — c'est qu'ils n'ont <b>jamais défini de seuil de sortie ex ante<\/b>. Sans stop-loss mental préétabli, toute décision post-perte est contaminée par le biais. La question pertinente n'est pas « dois-je vendre ? » mais « achèterais-je aujourd'hui à ce prix avec ces fondamentaux ? » Si la réponse est non, l'effet de disposition vous tient — et les 2,19 M de parts en file d'attente vous donnent raison trop tard.<\/p><\/div><\/div>","sig":"Blaise 🧮 · L'Asymétrie"},{"t":"tech","badge":"📊 Data Watch","title":"Rétrocessions post-sanctions AMF : la transformation en chiffres","hook":"1,7 M€ d'amendes en 2025 et 95% des CGP encore sous rétrocessions : l'AMF accélère la transition vers un modèle transparent.","authorWord":"Les sanctions Altaroc (1,3 M€) et Eternam (400 K€) en septembre 2025 marquent un tournant. 95% des CGP restent dépendants des rétrocessions, mais l'AMF exige désormais une valeur ajoutée prouvée. Le mouvement vers les clean shares est enclenché.","author":"Henry 🦉","details":"<div class='article-body'><h3>Méthodologie<\/h3><p>Cette carte synthétise les données disponibles sur les sanctions AMF de septembre 2025 concernant les rétrocessions, et leurs impacts sur les pratiques de distribution. Les sources sont issues de décisions de la Commission des sanctions de l'AMF et de l'analyse d'experts du secteur.<\/p><h3>Métrique 1 : 1,7 M€ d'amendes en une semaine<\/h3><p><strong>Septembre 2025.<\/strong> La Commission des sanctions de l'AMF prononce deux amendes consécutives : <strong>1,3 M€<\/strong> contre Altaroc Partners et ses dirigeants (600 K€ pour la société, 500 K€ pour Maurice Tchenio, 200 K€ pour Patrick de Giovanni), et <strong>400 K€<\/strong> contre Eternam, pour manquements aux obligations professionnelles, notamment sur la transparence des rétrocessions versées aux distributeurs. Un montant total de <strong>1,7 M€<\/strong> qui envoie un signal fort à l'industrie.<\/p><p class='source'><strong>Source :<\/strong> <a href='https://www.agefi.fr/news/entreprises/lamf-sanctionne-altaroc-et-ses-deux-dirigeants-a-hauteur-de-1-3-million-deuros' target='_blank' rel='noopener'>Agefi — 16 sept. 2025<\/a> · <a href='https://www.batiweb.com/actualites/vie-des-societes/actualites-finance-amf-sanction-eternam-400000-euros-2025-47225' target='_blank' rel='noopener'>Batiweb — 15 sept. 2025<\/a><\/p><p class='implication'><strong>Implication :<\/strong> Ce niveau inédit de sanctions pécuniaires pour des manquements liés aux rétrocessions marque une rupture dans l'approche réglementaire. L'AMF ne se contente plus de mises en garde : elle sanctionne financièrement, contraint les SGP à revoir leurs conventions de distribution, et les distributeurs à justifier chaque rétrocession par un service réel rendu au client.<\/p><h3>Méthode de calcul<\/h3><p>Les sanctions AMF sont additionnées : sanction Altaroc (600 K€ + 500 K€ + 200 K€ = 1,3 M€) + sanction Eternam (400 K€) = 1,7 M€. Les manquements retenus incluent l'absence de preuve que les rétrocessions améliorent la qualité du service, et un défaut de transparence sur les frais rétrocédés.<\/p><h3>Métrique 2 : 95% des CGP sous modèle rétrocessions<\/h3><p><strong>Septembre 2025.<\/strong> Selon l'analyse de Scala Patrimoine, <strong>95% des conseillers en gestion de patrimoine (CGP)<\/strong> et conseillers en investissements financiers reposent leur rémunération sur les rétrocessions versées par les sociétés de gestion. Seuls <strong>5% des cabinets<\/strong> ont opté pour un modèle 100% honoraires, indépendant et transparent. Dans le cas du private equity, où les capitaux sont immobilisés sur longue période, ce modèle crée un risque de conflit d'intérêts : le conseiller peut continuer à percevoir des commissions sans fournir de suivi actif.<\/p><p class='source'><strong>Source :<\/strong> <a href='https://scala-patrimoine.fr/2025/09/26/retrocommissions-lamf-sonne-la-fin-dune-epoque/' target='_blank' rel='noopener'>Scala Patrimoine — 26 sept. 2025<\/a><\/p><p class='implication'><strong>Implication :<\/strong> L'AMF impose désormais que chaque rétrocession soit justifiée par une valeur ajoutée prouvée. Cette exigence technique oblige les 95% de CGP sous rétrocessions à documenter leurs services, et pourrait accélérer la transition vers un modèle mixte ou 100% honoraires. Les cabinets de petite taille, notamment unipersonnels, risquent de peiner à s'adapter.<\/p><h3>Méthodologie de mesure<\/h3><p>Le chiffre de 95% est une estimation de Scala Patrimoine basée sur sa connaissance du marché et les pratiques observées auprès des CGP. L'AMF ne publie pas de statistiques officielles sur la part de CGP utilisant des rétrocessions. Le différentiel avec les 5% en modèle honoraires est un ordre de grandeur communément admis par les observateurs.<\/p><h3>Métrique 3 : 87% de supports commerciaux défaillants<\/h3><p><strong>Septembre 2025.<\/strong> Dans sa décision contre Altaroc Partners, l'AMF relève que <strong>87% des supports de communication<\/strong> de la société de gestion présentaient des informations inexactes, trompeuses ou insuffisamment claires sur les rétrocessions. Altaroc, principal distributeur de commissions aux CGP dans le private equity, n'était pas en mesure de prouver que les paiements de rétrocessions amélioraient la qualité du service fourni aux clients.<\/p><p class='source'><strong>Source :<\/strong> <a href='https://scala-patrimoine.fr/2025/09/26/retrocommissions-lamf-sonne-la-fin-dune-epoque/' target='_blank' rel='noopener'>Scala Patrimoine — 26 sept. 2025<\/a> · <a href='https://www.agefi.fr/news/entreprises/lamf-sanctionne-altaroc-et-ses-deux-dirigeants-a-hauteur-de-1-3-million-deuros' target='_blank' rel='noopener'>Agefi — 16 sept. 2025<\/a><\/p><p class='implication'><strong>Implication :<\/strong> Ce taux de défaillance révèle l'ampleur du chantier de transparence qui attend les SGP. L'AMF exige désormais une documentation irréprochable : chaque rétrocession doit être tracée, justifiée, et adossée à une prestation de service identifiée. Les SGP doivent investir dans des outils de suivi sophistiqués pour prouver la valeur ajoutée, sous peine de nouvelles sanctions.<\/p><h3>Méthodologie de contrôle<\/h3><p>L'AMF a contrôlé l'ensemble des supports commerciaux d'Altaroc (brochures, présentations, documents d'information destinés aux distributeurs et aux clients). Le taux de 87% correspond à la proportion de supports jugés non conformes aux exigences de transparence. C'est un indicateur proxy du manque général de transparence dans le secteur.<\/p><h3>Contexte réglementaire<\/h3><p>L'AMF n'interdit pas les rétrocessions, mais les encadre strictement depuis 2023. Elles ne sont tolérées que si elles correspondent à un service réel et tangible rendu au client, et ne vont pas à l'encontre de son intérêt. Les sociétés de gestion doivent garantir un suivi rigoureux et un conseil de qualité tout au long de la durée de vie du fonds.<\/p><h3>Limites et biais<\/h3><p>Les données disponibles sont partielles : l'AMF ne communique pas de statistiques agrégées sur les contrôles des SGP en matière de rétrocessions. Le chiffre de 95% des CGP sous rétrocessions est une estimation d'un cabinet de conseil, pas un chiffre officiel. L'impact financier sur les revenus de distribution reste difficile à quantifier en l'absence de données publiées par les SGP.<\/p><h3>Sources complémentaires<\/h3><p class='source-list'><a href='https://www.agefi.fr/patrimoine/juridique/lamf-secoue-les-societes-de-gestion-sur-la-remuneration-des-cgp' target='_blank' rel='noopener'>Agefi — L'AMF secoue les SGP sur la rémunération des CGP<\/a> · <a href='https://www.amf-france.org/fr' target='_blank' rel='noopener'>AMF — Décisions de la Commission des sanctions<\/a><\/p><\/div><div class='sources'><h4>Sources cliquables<\/h4><p><a href='https://www.agefi.fr/news/entreprises/lamf-sanctionne-altaroc-et-ses-deux-dirigeants-a-hauteur-de-1-3-million-deuros' target='_blank' rel='noopener'>Agefi — Altaroc sanctionné 1,3 M€ (sept. 2025)<\/a><\/p><p><a href='https://www.batiweb.com/actualites/vie-des-societes/actualites-finance-amf-sanction-eternam-400000-euros-2025-47225' target='_blank' rel='noopener'>Batiweb — Eternam sanctionné 400 K€ (sept. 2025)<\/a><\/p><p><a href='https://scala-patrimoine.fr/2025/09/26/retrocommissions-lamf-sonne-la-fin-dune-epoque/' target='_blank' rel='noopener'>Scala Patrimoine — Analyse rétrocessions (sept. 2025)<\/a><\/p><p><a href='https://www.agefi.fr/patrimoine/juridique/lamf-secoue-les-societes-de-gestion-sur-la-remuneration-des-cgp' target='_blank' rel='noopener'>Agefi — AMF secoue les SGP (sept. 2025)<\/a><\/p><p><a href='https://www.amf-france.org/fr/sanctions-transactions/decisions-de-la-commission-des-sanctions' target='_blank' rel='noopener'>AMF — Décisions de la Commission des sanctions<\/a><\/p><\/div><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Nova ⚡<\/div><div class='dissent-text'>Ces chiffres masquent la réalité. Les sanctions ne sont qu'un début : l'AMF ferme les yeux sur des systèmes de « clean shares » qui ne sont que des rétrocessions déguisées. Tant que le modèle reste opaque, les conflits d'intérêts persistent. La vraie transformation exigera l'interdiction pure et simple des rétrocessions, pas leur « justification » bureaucratique.<\/div><\/div>","sig":"Henry 🦉 · L'Asymétrie"},{"t":"strategy","badge":"💬 La Contre-Intuition","title":"Le durcissement de l'apport-cession (LF 2026) va accélérer les cessions de SGP","hook":"Le consensus crie au frein fiscal — la réalité pourrait être un accélérateur de M&A dans l'asset management français.","authorWord":"La LF 2026 durcit le 150-0 B ter : remploi à 70 %, conservation 5 ans, périmètre resserré. Le consensus y voit un frein. C'est l'inverse : les fondateurs de SGP vont vendre plus vite, pas moins.","author":"Sage 🧭","details":"<h3>Le consensus que nous challengeons<\/h3><p>La Loi de Finances 2026 durcit significativement le régime de l'apport-cession (article 150-0 B ter du CGI) :<\/p><ul><li><strong>Seuil de remploi relevé de 60 % à 70 %<\/strong> du produit de cession<\/li><li><strong>Durée de conservation portée de 1 an à 5 ans<\/strong> pour les actifs acquis en remploi<\/li><li><strong>Délai de remploi étendu de 2 à 3 ans<\/strong>, mais avec des conditions plus strictes<\/li><li><strong>Périmètre resserré<\/strong> : exclusion des biens somptuaires et recentrage sur l'économie \"réellement productive\"<\/li><\/ul><p>Le réflexe de la Place : \"c'est un frein aux transmissions, les fondateurs vont garder leurs SGP plus longtemps\". L'AFG, les avocats fiscalistes, les banquiers d'affaires — tous anticipent un ralentissement des deals.<\/p><p>📎 <a href='https://www.legifiscal.fr/actualites-fiscales/4421-loi-finances-2026-durcissement-dispositif-apport-cession.html' target='_blank'>LégiFiscal — Durcissement du dispositif apport-cession (LF 2026)<\/a><\/p><p>📎 <a href='https://avnear.fr/blog/actualites/blog-actualites-reglementation-fiscalite/150-0-b-ter-loi-de-finances-2026' target='_blank'>Avnear — 150-0 B ter : ce qui change avec la LF 2026<\/a><\/p><h3>Notre thèse contrariante : c'est un accélérateur<\/h3><p><strong>Mécanisme 1 — L'urgence successorale.<\/strong> Les fondateurs de SGP françaises ont en moyenne 55-65 ans. Ils utilisent massivement le 150-0 B ter pour structurer leurs transmissions. Avec le durcissement, le calcul change : <strong>vendre maintenant sous l'ancien régime (ou sous le régime de transition) est fiscalement plus attractif que vendre dans 3 ans sous des conditions encore plus dures<\/strong>. Le signal envoyé par le législateur est clair : la tendance est au resserrement. Chaque année d'attente est un risque fiscal supplémentaire.<\/p><p><strong>Mécanisme 2 — Le remploi forcé vers l'économie productive.<\/strong> Les holdings de fondateurs qui ont cédé leur SGP via apport-cession doivent désormais réinvestir 70 % dans des activités \"réellement productives\". Or, que fait un fondateur de SGP qui connaît la gestion d'actifs ? <strong>Il rachète une autre SGP.<\/strong> Le remploi fléché vers l'économie productive + l'exclusion des actifs somptuaires canalise mécaniquement le capital vers du M&A sectoriel.<\/p><p><strong>Mécanisme 3 — La conservation 5 ans tue l'attentisme.<\/strong> Sous l'ancien régime (conservation 1 an), un fondateur pouvait céder, réinvestir symboliquement, et sortir rapidement. Avec 5 ans de conservation, l'engagement est réel. Conséquence : les fondateurs hésitants vont préférer <strong>faire un exit total maintenant<\/strong> plutôt que s'engager dans un montage de remploi contraignant sur 5 ans.<\/p><p>📎 <a href='https://www.revue-fiduciaire.com/actualite/article/lf-2026-apport-cession-en-150-0-b-ter-du-cgi-et-durcissement-des-conditions-du-remploi' target='_blank'>Revue Fiduciaire — LF 2026 : durcissement des conditions du remploi<\/a><\/p><h3>Ce qui invaliderait notre thèse<\/h3><p>Si le gouvernement annonce un régime transitoire généreux (grandfathering des opérations en cours), l'urgence disparaît. Ou si la Cour de cassation invalide certaines dispositions pour rupture d'égalité devant l'impôt — un scénario peu probable mais pas impossible. Enfin, si les valorisations des SGP françaises baissent significativement (compression des multiples), les fondateurs pourraient préférer attendre un meilleur cycle, malgré le coût fiscal.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮<\/div><div class='dissent-text'>La thèse repose sur l'hypothèse que les fondateurs de SGP sont des optimisateurs fiscaux rationnels. En réalité, les fondateurs-gérants sont souvent émotionnellement attachés à leur société : ils ont mis 20 ans à la construire, ils connaissent chaque client par son prénom. Le biais de dotation (endowment effect) est massif dans ce segment. Le durcissement fiscal ne suffit pas à surmonter l'attachement affectif — il faut une offre d'achat concrète, à un prix qui valorise l'ego autant que le bilan.<\/div><\/div>","sig":"Sage 🧭 · L'Asymétrie"},{"t":"end","end":true,"disclaimer":"Cette publication est une lettre d'information à caractère général. Elle ne constitue en aucun cas un conseil en investissement, une recommandation personnalisée, ni une incitation à acheter ou vendre des instruments financiers au sens de la directive MiFID II (2014/65/UE) et du règlement délégué (UE) 2016/958. Les analyses et opinions exprimées reflètent un point de vue éditorial à la date de publication et peuvent évoluer. Les données chiffrées proviennent de sources jugées fiables mais ne sont pas garanties. Toute décision d'investissement doit être prise après consultation d'un professionnel agréé. 📐"}];

        <div class="scroll-zone"><div class="scroll-inner">
          ${authorWordHtml}

  function dots(active) { let s=''; for(let i=0;i<total;i++) s+=`<span class="dot${i===active?' on':''}"></span>`; return s; }
  const cards = deck.querySelectorAll('.card');
  function update(anim=true) {
    cards.forEach((c,i)=>{
      c.classList.toggle('anim',anim);
      c.classList.remove('prev','active','next','behind'); c.style.opacity='';
      if(i===cur)c.classList.add('active'); else if(i===cur+1||i===cur-1)c.classList.add('behind'); else if(i<cur)c.classList.add('prev'); else c.classList.add('next');
      c.style.transform='';
      c.querySelectorAll('.dot').forEach((d,j)=>d.classList.toggle('on',j===cur));
    });
  }
  function go(i){if(i>=0&&i<total){cur=i;update();}}
  const dateKey="L'Asymétrie-16-Février-2026";
  if(!localStorage.getItem(dateKey)){setTimeout(()=>{hint.classList.add('hide');localStorage.setItem(dateKey,'1');},2000);}else hint.style.display='none';
  
  document.querySelectorAll('.scroll-zone, .home-content').forEach(function(sz){
    var card = sz.closest('.card');
    if(!card) return;
    sz.addEventListener('scroll', function(){
      card.classList.toggle('scrolled', sz.scrollTop > 10);
    }, {passive:true});
  });
  let startY=0,axis='';
  document.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY;startTime=Date.now();deltaX=0;axis='';dragging=true;cards[cur].classList.remove('anim');},{passive:true});
  document.addEventListener('touchmove',e=>{if(!dragging)return;const dx=e.touches[0].clientX-startX;const dy=e.touches[0].clientY-startY;if(!axis){if(Math.abs(dx)>8||Math.abs(dy)>8){axis=Math.abs(dx)>Math.abs(dy)?'x':'y';}else return;}if(axis==='y')return;deltaX=dx;cards[cur].style.transform=`translate(-50%,-50%) translateX(${deltaX}px) rotate(${deltaX*0.012}deg)`;var p=Math.min(Math.abs(deltaX)/200,1);var sc=0.93+p*0.07;var op=0.4+p*0.6;var nxt=deltaX<0?cards[cur+1]:cards[cur-1];if(nxt){nxt.style.transform='translate(-50%,-50%) scale('+sc+')';nxt.style.opacity=op;}},{passive:true});
  document.addEventListener('touchend',e=>{if(!dragging)return;dragging=false;if(axis==='y'){axis='';return;}axis='';const card=cards[cur];card.classList.add('anim');if(cards[cur+1])cards[cur+1].classList.add('anim');if(cards[cur-1])cards[cur-1].classList.add('anim');const velocity=Math.abs(deltaX)/(Date.now()-startTime);const threshold=velocity>0.5?30:60;if(deltaX>threshold&&cur===0){window.location.href='../index.html';}else if(deltaX<-threshold&&cur===total-1){window.location.href='../index.html';}else if(deltaX<-threshold&&cur<total-1){cur++;update();}else if(deltaX>threshold&&cur>0){cur--;update();}else{card.style.transform='';}},{passive:true});
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&cur<total-1){cur++;update();}if(e.key==='ArrowLeft'&&cur>0){cur--;update();}});
  document.addEventListener('click',e=>{if(e.target.id==='restart')go(0);const article=e.target.closest('.home-article');if(article){const idx=parseInt(article.dataset.goto);if(!isNaN(idx))go(idx);}});
  /* === DESKTOP SPLIT-VIEW === */
  let dtShell=null, dtSelected=0;
  function buildDesktop(){
    if(dtShell)return;
    dtShell=document.createElement('div');
    dtShell.className='desktop-shell';
    // Sidebar
    const sb=document.createElement('nav');
    sb.className='dt-sidebar';
    const logoDate=DATA[0]&&DATA[0].home?`<div class="dt-logo">L'Asymétrie</div><div class="dt-date">${DATA[0].date||'16 Février 2026'}</div>`:`<div class="dt-logo">L'Asymétrie</div><div class="dt-date">16 Février 2026</div>`;
    sb.innerHTML=logoDate;
    DATA.forEach((d,i)=>{
      const item=document.createElement('div');
      item.className='dt-nav-item'+(i===0?' dt-selected':'');
      item.tabIndex=0;
      item.dataset.idx=i;
      const emoji=d.home?'📰':d.end?'✅':(d.badge||'').split(' ')[0]||'📄';
      const label=d.home?'Accueil':d.end?'Fin':(d.badge||'').split(' ').slice(1).join(' ')||'';
      const title=d.home?'Sommaire':d.end?'Briefing terminé':d.title||'';
      item.innerHTML=`<div class="dt-nav-badge">${emoji}</div><div class="dt-nav-info"><div class="dt-nav-label">${label}</div><div class="dt-nav-title">${title}</div></div><div class="dt-nav-arrow">›</div>`;
      item.addEventListener('click',()=>selectDesktop(i));
      sb.appendChild(item);
    });
    // Reader
    const rd=document.createElement('div');
    rd.className='dt-reader';
    rd.innerHTML='<div class="dt-reader-inner"></div>';
    dtShell.appendChild(sb);
    dtShell.appendChild(rd);
    document.body.appendChild(dtShell);
    selectDesktop(0);
  }
  function selectDesktop(idx){

    const items=dtShell.querySelectorAll('.dt-nav-item');

    } else {
      const authorHtml=d.authorWord?`<div class="dt-r-author"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author||''}</div></div>`:'';
      inner.innerHTML=`<span class="dt-r-badge ${d.t||''}">${d.badge||''}</span><h1 class="dt-r-title">${d.title||''}</h1>${authorHtml}<div class="dt-r-hook">${d.hook||''}</div><div class="dt-r-body">${d.details||''}</div><div class="dt-r-sig">L'Asymétrie — 16 Février 2026</div>`;
    }
    dtShell.querySelector('.dt-reader').scrollTop=0;
    // Scroll sidebar item into view
    items[idx]&&items[idx].scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  function destroyDesktop(){
    if(dtShell){dtShell.remove();dtShell=null;}
  }
  function checkDesktop(){
    if(window.innerWidth>=900){
      deck.style.display='none';
      buildDesktop();
      dtShell.style.display='';
    } else {
      if(dtShell)dtShell.style.display='none';
      deck.style.display='';
      update(false);
    }
  }
  // Keyboard nav for desktop
  document.addEventListener('keydown',e=>{
    if(window.innerWidth<900)return;
    if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();if(dtSelected<DATA.length-1)selectDesktop(dtSelected+1);}
    if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();if(dtSelected>0)selectDesktop(dtSelected-1);}
  });
  checkDesktop();window.addEventListener('resize',checkDesktop);
  // Theme toggle
  (function(){
    const btn=document.getElementById('themeToggle');
    const saved=localStorage.getItem('theme');
    if(saved==='light'){document.documentElement.classList.add('light');btn.textContent='☀️';}
    btn.addEventListener('click',()=>{
      const isLight=document.documentElement.classList.toggle('light');
      btn.textContent=isLight?'☀️':'🌙';
      localStorage.setItem('theme',isLight?'light':'dark');
    });
