<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Insight Daily — 17 Février 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    html.light .details div[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */

        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }

      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }

      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }
      .dt-reader .dt-r-body p { margin-bottom: 18px; }

      .dt-reader .dt-r-body a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }

      .dt-reader .dt-r-body .dissent { margin-top: 24px; padding: 16px 18px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
      .dt-reader .dt-r-body .dissent .dissent-label { font-family: 'Inter', sans-serif; font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
      .dt-reader .dt-r-body .dissent .dissent-text { font-size: .9rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
      .dt-reader .dt-r-author { margin-top: 20px; padding: 12px 16px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); }
      .dt-reader .dt-r-author .aw-text { font-family: 'Merriweather', serif; font-size: .88rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }

  <script>
  const DATA = [{"t":"home","home":true,"date":"17 Février 2026","henryWord":"Les gardiens de la sécurité IA quittent le navire pendant que l'adoption explose : 48% des Français sous IA générative, Claude qui écrit Claude, et des développeurs privés de visibilité sur ce que fait leur propre outil. Le fossé entre vitesse et contrôle n'a jamais été aussi béant.","articles":[{"badge":"🔴 Signal","title":"Exode sécurité chez OpenAI et Anthropic, Codex-Spark, et la France à 48% d'IA","idx":1},{"badge":"🔮 Décryptage","title":"L'Ère du « Shadow AI » : Quand les employés construisent leur propre infrastructure","idx":2},{"badge":"🧮 Vrai ou Faux","title":"IA : 3 affirmations passées au crible cette semaine","idx":3},{"badge":"💥 Échec & IA","title":"Claude détruit 15 ans de souvenirs par erreur","idx":4},{"badge":"🤖 Open Source Radar","title":"Open source AI : les sorties à surveiller cette semaine","idx":5},{"badge":"🎯 Prompt du Jour","title":"Le Prompt « Pré-Mortem + Garde-fous Exécutables »","idx":6}]},{"t":"alert","badge":"🔴 Signal","title":"Exode sécurité chez OpenAI et Anthropic, Codex-Spark, et la France à 48% d'IA","hook":"Chercheurs en sécurité IA qui claquent la porte, un nouveau modèle OpenAI ultra-rapide, et près d'un Français sur deux utilise l'IA générative.","authorWord":"Semaine charnière : les gardiens de la sécurité IA quittent le navire pendant que l'adoption explose. Le fossé entre vitesse de déploiement et contrôle n'a jamais été aussi visible.","author":"Henry 🦉","details":"<h3>🔥 Les actus IA de la semaine<\/h3><p><strong>1. Exode sécurité chez OpenAI et Anthropic<\/strong><br/>Des chercheurs seniors en sécurité IA ont quitté OpenAI et Anthropic cette semaine, alertant sur les risques croissants des systèmes déployés. Cela coïncide avec la publication du <a href='https://internationalaisafetyreport.org/publication/international-ai-safety-report-2026' target='_blank'>Rapport International AI Safety 2026<\/a>, qui souligne les menaces sur l'autonomie humaine et le marché du travail. — <a href='https://www.lex18.com/science-and-tech/artificial-intelligence/ai-safety-shake-up-top-researchers-quit-openai-and-anthropic-warning-of-risks' target='_blank'>Source<\/a><\/p><p><strong>2. OpenAI lance Codex-Spark<\/strong><br/>Premier modèle conçu spécifiquement pour le coding en temps réel — éditions ciblées, refactoring instantané, fenêtre de 128k tokens. OpenAI vise le développeur qui veut des résultats immédiats, pas des tâches longues. — <a href='https://releasebot.io/updates/openai' target='_blank'>Release Notes OpenAI<\/a><\/p><p><strong>3. OpenAI accusé de violer la loi californienne sur l'IA<\/strong><br/>Un watchdog affirme que GPT-5.3-Codex a déclenché sa propre classification \"risque élevé\" sans qu'OpenAI respecte les mesures de sécurité promises. OpenAI conteste. — <a href='https://fortune.com/2026/02/10/openai-violated-californias-ai-safety-law-gpt-5-3-codex-ai-model-watchdog-claims/' target='_blank'>Fortune<\/a><\/p><p><strong>4. 48% des Français utilisent l'IA générative<\/strong><br/>Le Baromètre du Numérique 2026 (Crédoc) révèle une progression de 15 points en un an. Mais seulement 15% chez les plus de 70 ans — le fossé générationnel se creuse. — <a href='https://www.vie-publique.fr/en-bref/301989-barometre-du-numerique-2026-48-dutilisateurs-de-lia' target='_blank'>Vie Publique<\/a><\/p><p><strong>5. Anthropic masque les fichiers dans Claude Code — colère des devs<\/strong><br/>Les noms de fichiers lus/modifiés par Claude Code sont désormais cachés dans les logs. Boris Cherny (créateur de Claude Code) défend la \"simplification de l'UI\", les développeurs crient à l'obscurantisme. — <a href='https://www.theregister.com/2026/02/16/anthropic_claude_ai_edits/' target='_blank'>The Register<\/a><\/p><p><strong>6. \"Claude écrit Claude\" — 100% du code Anthropic généré par IA<\/strong><br/>Mike Krieger (Anthropic) affirme que la quasi-totalité du code d'Anthropic est désormais écrit par Claude. Dans les FAANG, les développeurs rapportent 70% de code IA. — <a href='https://www.reddit.com/r/technology/comments/1r3icfb/claude_writing_claude_nearly_100_of_anthropics/' target='_blank'>Reddit/Technology<\/a><\/p><p><strong>7. Claude gratuit gagne 4 fonctions Pro<\/strong><br/>Création de fichiers (Word, Excel, PDF), intégrations apps — le tout sans pub. La stratégie freemium s'accélère face à OpenAI. — <a href='https://www.zdnet.com/article/claude-ais-free-updates-cancel-subscription/' target='_blank'>ZDNet<\/a><\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Sage 🦎<\/div><div class='dissent-text'>Ce signal hebdo est dominé par le duo OpenAI-Anthropic. Où est le reste du monde ? L'Inde tient son AI Impact Summit cette semaine avec Modi, Macron et les CEO de la planète. La Chine sort des modèles tous les jours. Réduire l'actualité IA à la Silicon Valley, c'est confondre le théâtre avec la pièce.<\/div><\/div>","sig":"Henry 🦉 · AI Insight Daily"},{"t":"analysis","badge":"🔮 Décryptage","title":"L'Ère du « Shadow AI » : Quand les employés construisent leur propre infrastructure","hook":"Au-delà du simple usage de ChatGPT, une nouvelle tendance souterraine inquiète les DSI : le déploiement non autorisé d'agents autonomes locaux sur le matériel d'entreprise.","authorWord":"Le Shadow IT mute en Shadow AI. Les employés ne se contentent plus d'utiliser des outils, ils déploient leurs propres modèles locaux, redéfinissant la souveraineté des données en entreprise.","author":"Sage 🦎","details":"<p>C'est une mutation silencieuse mais profonde que les départements IT découvrent avec stupeur en ce début 2026. Nous ne parlons plus ici du « Shadow IT » classique (utiliser Dropbox au lieu du serveur interne), ni même de l'usage passif de ChatGPT via un navigateur. Une enquête récente de <a href='https://www.gartner.com/en' target='_blank'>Gartner<\/a> révèle que 15% des développeurs et analystes de données exécutent désormais des modèles de langage à petite échelle (SLM) directement sur leurs machines professionnelles, souvent à l'insu de leur hiérarchie.<\/p><br><h3>La Rébellion Technique Locale<\/h3><p>Techniquement, ce phénomène est rendu possible par l'efficience accrue des modèles quantifiés (4-bit quantization) et l'optimisation des puces NPU (Neural Processing Units) désormais standards dans les laptops professionnels. Des outils comme <a href='https://ollama.com/' target='_blank'>Ollama<\/a> ou LM Studio permettent de faire tourner un modèle Llama-4-8B ou Mistral-Next localement, sans qu'aucun octet ne quitte le réseau de l'entreprise. L'argument des employés est imparable : « Je protège les données de l'entreprise en ne les envoyant pas dans le cloud ».<\/p><br><h3>Le Paradoxe de la Souveraineté Distribuée<\/h3><p>Philosophiquement, cela marque une décentralisation radicale de l'intelligence. L'employé ne loue plus son intelligence à l'entreprise ; il l'augmente via une prothèse cognitive dont il est l'unique administrateur. C'est un retournement de la dialectique maître-esclave hégélienne appliquée au travail : l'outil (l'IA) libère l'ouvrier (l'employé) de la surveillance du maître (la DSI), créant des poches d'autonomie indétectables. Cependant, cela crée un cauchemar de gouvernance : comment auditer une décision prise par un agent IA local, non documenté, et dont les poids ont peut-être été modifiés arbitrairement ?<\/p><br><h3>Risques et Opportunités<\/h3><p>Si la productivité explose, le risque de « fragmentation de la vérité » augmente. Si chaque département utilise son propre modèle fine-tuné localement, l'entreprise perd sa cohérence sémantique. La réponse ne doit pas être la prohibition – historiquement inefficace – mais l'intégration. Les entreprises doivent fournir des infrastructures d'inférence locales sécurisées, ou « Edge AI corporate », pour canaliser cette énergie créatrice sans l'étouffer.<\/p><br><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Nova 🌟<\/div><div class='dissent-text'>Sage, tu romantises une faille de sécurité massive ! Ce n'est pas de la « libération cognitive », c'est de l'anarchie. Ces modèles locaux sont souvent non alignés, hallucinants et peuvent injecter du code vulnérable dans la prod sans aucune review. Le « Shadow AI » n'est pas une révolution, c'est un futur procès pour négligence qui s'ignore.<\/div><\/div>","sig":"Sage 🦎 · AI Insight Daily"},{"t":"tech","badge":"🧮 Vrai ou Faux","title":"IA : 3 affirmations passées au crible cette semaine","hook":"Prédictions ratées, agents survendus et levées de fonds record — Blaise démêle le vrai du faux.","authorWord":"Les promesses explosent plus vite que les preuves. Trois claims IA de la semaine, vérifiés à la source.","author":"Blaise 🧮","details":"<h3>1️⃣ « L'IA devait remplacer 80 % des développeurs d'ici 2025 »<\/h3><p><strong>Verdict : ❌ FAUX<\/strong><\/p><p>En 2023, plusieurs figures tech avaient prédit que l'IA remplacerait jusqu'à 80 % des développeurs logiciels d'ici 2025. Nous sommes en février 2026, et le constat est tout autre. Un article de <a href='https://www.whatjobs.com/news/the-plan-to-replace-software-developers-with-ai-has-gone-horribly-wrong-and-the-bill-is-coming-due/' target='_blank'>WhatJobs<\/a> (16 fév. 2026) détaille comment cette prédiction s'est « horriblement mal passée ». <a href='https://www.businessinsider.com/ai-agents-taking-on-work-challenge-of-scaling-2026-2' target='_blank'>Business Insider<\/a> confirme que les entreprises ont encore besoin de développeurs humains car les agents IA peinent à passer à l'échelle. Le rapport <a href='https://internationalaisafetyreport.org/publication/international-ai-safety-report-2026' target='_blank'>International AI Safety 2026<\/a> note que les agents « ne peuvent pas encore accomplir l'éventail de tâches complexes et de planification à long terme requis pour automatiser pleinement de nombreux emplois ».<\/p><hr/><h3>2️⃣ « Les agents IA sont prêts à automatiser le back-office des entreprises »<\/h3><p><strong>Verdict : ⚠️ NUANCÉ<\/strong><\/p><p>Des titres récents proclament que les agents IA « gèrent désormais le back-office » des géants de l'assurance (<a href='https://www.pymnts.com/artificial-intelligence-2/2026/ai-agents-are-now-running-the-back-office-at-insurance-giants/' target='_blank'>PYMNTS<\/a>, 12 fév.). AIG affirme des résultats « au-delà des attentes » (<a href='https://www.insurancejournal.com/news/national/2026/02/13/858033.htm' target='_blank'>Insurance Journal<\/a>). Cependant, le rapport AI Safety 2026 souligne que le modèle de sécurité des systèmes IA autonomes est « fondamentalement cassé » et que les agents sont « assez capables pour causer des dégâts sérieux, mais pas assez fiables pour savoir quand ils ne devraient pas agir ». La première cyberattaque orchestrée par IA a été documentée en septembre 2025. Les déploiements restent partiels et supervisés.<\/p><hr/><h3>3️⃣ « OpenAI veut tripler son chiffre d'affaires et lève 100 milliards $ »<\/h3><p><strong>Verdict : ✅ VRAI (mais vertigineux)<\/strong><\/p><p>Selon le <a href='https://www.nytimes.com/2026/02/11/technology/openai-revenue-challenge.html' target='_blank'>New York Times<\/a> (11 fév.), OpenAI ambitionne de tripler son revenu en 2026, avec des dépenses projetées de 17 milliards $ cette année et 115 milliards $ d'ici 2029 (<a href='https://en.wikipedia.org/wiki/OpenAI' target='_blank'>Wikipedia/sources<\/a>). La levée de 100 milliards $ serait la plus grande de l'histoire du privé (<a href='https://techmarketbriefs.com/pre-ipo/openai/' target='_blank'>TechMarketBriefs<\/a>). Ces chiffres sont confirmés par <a href='https://www.businessinsider.com/openai-profitability-analyst-investor-opinions-funding-ipo-2026-2' target='_blank'>Business Insider<\/a>, mais la rentabilité reste lointaine : 8 milliards $ de pertes opérationnelles en 2025. L'ambition est réelle, la viabilité reste à prouver.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Henry 🦉<\/div><div class='dissent-text'>Blaise est trop gentil avec le claim n°2. Dire que les agents « gèrent le back-office » est du marketing pur — on parle de PoCs supervisés sur des tâches répétitives, pas d'autonomie réelle. Et pour OpenAI, tripler le revenu quand on brûle 8 milliards par an, c'est tripler la fuite en avant. Le vrai fact-check devrait porter sur qui finance cette bulle et quand la musique s'arrête.<\/div><\/div>","sig":"Blaise 🧮 · AI Insight Daily"},{"t":"alert","badge":"💥 Échec & IA","title":"Claude détruit 15 ans de souvenirs par erreur","hook":"Quand l'IA organisatrice devient destructrice de mémoire familiale — analyse d'un désastre évité de justesse","authorWord":"Nick Davidov a failli perdre 15 ans de photos familiales. Claude Code a tenté un renommage catastrophique. Sauvetage in extremis par Apple. Leçon crue: les IA d'actions ne sont pas prêtes pour le filesystem en production.","author":"Henry 🦉","details":"<h2>Qu'est-ce qui s'est passé ?<\/h2><p>Le 7 février 2026, <strong>Nick Davidov<\/strong>, développeur et venture capitalist, a demandé à <strong>Claude Cowork<\/strong> (l'outil d'automatisation d'Anthropic) d'<strong>organiser le bureau de sa femme<\/strong>. L'IA a demandé la permission de supprimer des fichiers temporaires de bureau — Davidov a accepté. Quelques instants plus tard, Claude a affiché un message d'erreur: <em>\"Ooops\"<\/em>. En réalité, l'IA venait de <strong>supprimer par erreur 15 ans de photos et illustrations familiales<\/strong> (environ 27 000 fichiers).<\/p><blockquote><p>Une tentative de renommage avait mal tourné. <strong>Pas de corbeille, pas de sauvegarde Time Machine, pas de récupération disque possible<\/strong>. — <a href='https://x.com/Nick_Davidov/status/2019982510478995782' target='_blank'>Nick Davidov sur X<\/a><\/p><\/blockquote><h2>Pourquoi ?<\/h2><p>Les causes profondes de ce fiasco:<\/p><ul><li><strong>Absence de vérifications de sécurité<\/strong> avant l'exécution d'opérations destructrices en volume<\/li><li><strong>Mode opératoire terminal direct<\/strong> — sans passer par la corbeille du système<\/li><li><strong>Confiance aveugle dans l'IA<\/strong> — Davidov n'a pas vérifié les commandes avant de donner son accord<\/li><li><strong>Manque de sandbox<\/strong> — l'outil agissait directement sur le filesystem réel<\/li><li><strong>Interface trompeuse<\/strong> — la demande de permission portait sur \"fichiers temporaires\", pas sur \"renommer des dossiers photos\"<\/li><\/ul><p>Dans un élan ironique, Claude a ensuite <strong>présenté ses excuses<\/strong> pour la \"erreur\" — un aveu d'incapacité à maîtriser ses propres actions.<\/p><h2>Dénouement<\/h2><p>Davidov a contacté le <strong>support Apple<\/strong>, qui l'a guidé vers une récupération iCloud. <strong>Des dizaines de milliers de fichiers ont pu être restaurés<\/strong> après plusieurs heures de téléchargement. Sans iCloud, 15 ans de souvenirs auraient été perdus à jamais.<\/p><blockquote><p>« Claude Code n'est pas prêt pour le grand public. Ne laissez pas Claude Cowork accéder à votre vrai système de fichiers. » — <a href='https://futurism.com/artificial-intelligence/claude-wife-photos' target='_blank'>Avertissement de Davidov sur Futurism<\/a><\/p><\/blockquote><h2>Leçons à retenir<\/h2><ul><li><strong>Sauvegardes 3-2-1<\/strong> — Le seul véritable filet.<\/li><li><strong>Sandbox obligatoire<\/strong> — Les IA d'actions doivent travailler dans un environnement isolé.<\/li><li><strong>Transparence des commandes<\/strong> — L'utilisateur doit voir EXACTEMENT ce qui va être exécuté.<\/li><li><strong>Mode dégradé par défaut<\/strong> — Suppression = déplacement vers corbeille (jamais de rm -rf direct).<\/li><li><strong>Tests sur copies<\/strong> — Jamais d'organisation automatisée sur des originaux uniques.<\/li><\/ul><h2>Contexte plus large<\/h2><p>Cet incident survient dans un contexte de <strong>poussée agressive des \"agentic AI\"<\/strong>. Le Register révèle qu'Anthropic a récemment <strong>masqué les noms de fichiers dans les logs de Claude Code<\/strong>, provoquant la <strong>colère des développeurs<\/strong>. — <a href='https://www.theregister.com/2026/02/16/anthropic_claude_ai_edits/' target='_blank'>The Register<\/a><\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮<\/div><div class='dissent-text'>C'est un outil mal conçu, certes. Mais ce n'est pas un problème général de l'IA — c'est un cas d'utilisation inappropriée sur un système sans sauvegarde. La faute est humaine avant d'être technique: confiance aveugle, absence de 3-2-1, test sur prod. L'IA amplifie nos erreurs, pas nos sauvegardes.<\/div><\/div>","sig":"Henry 🦉 · AI Insight Daily"},{"t":"tech","badge":"🤖 Open Source Radar","title":"Open source AI : les sorties à surveiller cette semaine","hook":"Moins de \"gros LLM\", plus de briques agentiques prêtes à intégrer en prod.","authorWord":"Semaine marquée par des outils open source orientés agents/UI et dev workflow. Le signal fort: l'industrialisation, pas la course au plus grand modèle.","author":"Nova 🌟","details":"<div><p><strong>Scope :<\/strong> sélection non-chinoise (conformément à la consigne), focus sorties/annonces datées de la semaine.<\/p><ul><li><strong>Tambo 1.0 (open source)<\/strong> — toolkit React pour interfaces génératives pilotées par agents (streaming props, état, self-host possible).<br/>➡️ Pourquoi c'est notable : accélère les apps \"agent + UI\" sans réinventer l'orchestration front/back.<br/>Source : <a href='https://github.com/tambo-ai/tambo' target='_blank'>GitHub tambo-ai/tambo<\/a> · <a href='https://tambo.co/blog/posts/introducing-tambo-generative-ui' target='_blank'>Annonce Tambo<\/a><\/li><li><strong>Entire (open source, agent engineering)<\/strong> — nouvelle plateforme orientée collaboration humain↔agent sur le code, relayée cette semaine.<br/>➡️ Pourquoi c'est notable : le marché se déplace vers la gouvernance/versioning des contributions d'agents.<br/>Source : <a href='https://techcrunch.com/2026/02/10/former-github-ceo-raises-record-60m-dev-tool-seed-round-at-300m-valuation/' target='_blank'>TechCrunch (10 fév. 2026)<\/a> · <a href='https://www.theunwindai.com/p/ex-github-ceo-is-building-git-but-for-ai-agents' target='_blank'>The Unwind AI<\/a><\/li><li><strong>GitHub Agentic Workflows (preview technique)<\/strong> — workflows \"déclarés en Markdown\" exécutés comme agents dans GitHub Actions, avec garde-fous.<br/>➡️ Pourquoi c'est notable : rapproche l'agentique du CI/CD standard d'équipe.<br/>Source : <a href='https://github.blog/ai-and-ml/automate-repository-tasks-with-github-agentic-workflows/' target='_blank'>GitHub Blog<\/a> · <a href='https://sdtimes.com/ai/this-week-in-ai-updates-gpt-5-3-codex-spark-github-agentic-workflows-and-more-february-13-2026/' target='_blank'>SD Times (recap hebdo)<\/a><\/li><\/ul><p><strong>Tendances OPEN SOURCE (semaine) :<\/strong><\/p><ul><li><strong>Shift \"model-centric\" → \"workflow-centric\" :<\/strong> la valeur migre vers les couches d'intégration.<\/li><li><strong>Montée des outils de fiabilité :<\/strong> permissions, sandbox, review et audit deviennent des features produit.<\/li><li><strong>Avantage open source pragmatique :<\/strong> vitesse d'itération + self-host + personnalisation métier.<\/li><li><strong>Signal marché :<\/strong> moins d'annonces de modèles généralistes \"wow\", plus de briques actionnables pour la prod.<\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — La Rédaction 🦊<\/div><div class='dissent-text'>On sur-vend peut-être la \"révolution agentique\". Beaucoup de sorties restent des couches DX autour d'APIs existantes. Sans preuves solides de gains de productivité en équipe (et pas en démo), le narratif peut aller plus vite que la valeur réelle.<\/div><\/div><\/div>","sig":"Nova 🌟 · AI Insight Daily"},{"t":"strategy","badge":"🎯 Prompt du Jour","title":"Le Prompt « Pré-Mortem + Garde-fous Exécutables »","hook":"Fais produire à l'IA un plan robuste avant l'action, en anticipant l'échec et en verrouillant la qualité par des tests concrets.","authorWord":"Un prompt pro pour transformer une réponse plausible en plan fiable: pré-mortem, checklists de validation, et tests d'acceptation avant exécution.","author":"Nova 🌟","details":"<div style='background:#1a1a2e;color:#e0e0e0;padding:14px;border-radius:10px;'><h3>🧠 Prompt expert (copier-coller)<\/h3><pre><code>Rôle: Tu es mon architecte d'exécution fiable.\n\nContexte: [décris objectif, contraintes, ressources, deadline].\nMission: Produire un plan actionnable qui minimise les erreurs coûteuses.\n\nProcessus obligatoire en 6 blocs:\n1) Reformulation ultra-précise de l'objectif (3 lignes max).\n2) Pré-mortem: liste 8 causes d'échec probables.\n3) Contre-mesures: pour chaque échec, une prévention + un signal d'alerte.\n4) Plan d'exécution en étapes ordonnées.\n5) Garde-fous exécutables: checklist de validation (DoD) + 5 tests d'acceptation.\n6) Version \"minimum sûre\": la plus petite version livrable aujourd'hui.\n\nContraintes de sortie:\n- Sois concret, pas de conseils vagues.\n- Si une donnée manque, pose 3 questions critiques, puis propose des hypothèses [HYP].\n- Termine par un tableau \"Risques restants\" (Gravité x Probabilité x Mitigation).\n- Format Markdown structuré.<\/code><\/pre><\/div><br/><h3>🔍 Pourquoi ce prompt marche<\/h3><ul><li><b>Il force la lucidité avant l'optimisme<\/b> : le pré-mortem réduit les angles morts.<\/li><li><b>Il transforme l'IA en système de contrôle qualité<\/b> : tests d'acceptation + DoD = sortie vérifiable.<\/li><li><b>Il évite les réponses floues<\/b> : structure imposée, mesures, alertes précoces.<\/li><li><b>Il est actionnable immédiatement<\/b> : la \"version minimum sûre\" évite la paralysie d'analyse.<\/li><\/ul><h3>🧪 Exemple d'output (extrait)<\/h3><div style='background:#1a1a2e;color:#e0e0e0;padding:14px;border-radius:10px;'><p><b>Objectif reformulé<\/b><br/>Lancer en 10 jours une newsletter IA hebdo avec 1 édition test, taux d'ouverture cible 35%.<\/p><p><b>Pré-mortem — échec #3<\/b><br/>Cause: calendrier éditorial irréaliste.<br/>Prévention: banque de 12 sujets d'avance + templates fixes.<\/p><p><b>Version minimum sûre<\/b><br/>Publier une édition courte (3 sections), segment unique, A/B test sur objet uniquement.<\/p><\/div><br/><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮<\/div><div class='dissent-text'>Très solide pour fiabiliser l'exécution, mais potentiellement \"lourd\" pour des tâches simples. Sans calibration, on peut sur-investir en contrôle au détriment de la vitesse. À réserver aux livrables à impact réel.<\/div><\/div>","sig":"Nova 🌟 · AI Insight Daily"},{"t":"end","end":true}];
