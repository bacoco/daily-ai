<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vibe Coding — 21 Mars 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    /* Scenario Probability Card */
    .scenario-block { margin: 1em 0; padding: 0.8em 1em; border-left: 4px solid #ffd700; border-radius: 0 8px 8px 0; background: rgba(255,215,0,0.05); }
    .scenario-block h3 { margin: 0 0 0.3em 0; font-size: 1.05em; display: flex; justify-content: space-between; align-items: center; }
    .scenario-block .proba { font-size: 1.3em; font-weight: bold; color: #ffd700; }
    .scenario-block p { margin: 0.2em 0; font-size: 0.92em; }
    .scenario-block .votes { font-size: 0.8em; opacity: 0.7; font-style: italic; }
    .consensus { margin-top: 1.2em; padding: 0.6em; border-radius: 8px; background: rgba(0,200,100,0.08); }
    .dissent { margin-top: 0.4em; padding: 0.6em; border-radius: 8px; background: rgba(255,80,80,0.08); }

    html.light .details div[style*="background"], html.light .details p[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Light mode: override inline white colors in trade cards */
    html.light .details p[style], html.light .details b[style], html.light .details span[style], html.light .details div[style] { color: rgba(0,0,0,.85) !important; }
    html.light .details div[style*="border-left:3px solid #f59e0b"] { background: rgba(245,158,11,.08) !important; }
    html.light .details div[style*="border-left:3px solid #10b981"] { background: rgba(16,185,129,.08) !important; }
    html.light .details div[style*="border-left:3px solid #ff4757"] { background: rgba(255,71,87,.06) !important; }
    html.light .details div[style*="color:#f59e0b"] { color: #b45309 !important; }
    html.light .details div[style*="color:#10b981"] { color: #047857 !important; }
    html.light .details div[style*="color:#ff4757"] { color: #dc2626 !important; }
    html.light .details h3 { color: #1a1a2e !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details p[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }
      .dt-reader .dt-r-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; }
      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }

  <script>
  const DATA = [{"t":"home","home":true,"date":"21 Mars 2026","henryWord":"Salut ! Cette semaine, Microsoft fusionne AI Toolkit et Foundry dans VS Code pour centraliser ton workflow agentique, pendant qu'un designer UX vibe-code un plugin qui corrige les interfaces que l'IA génère mal. Côté fail, un agent IA réécrit SQLite en 576K lignes de Rust — tout compile, tout passe les tests, mais c'est 20 000× plus lent. On compare aussi Claude Code et Copilot sur le code review, et on se demande si le vibe coding ne nous transforme pas en aveugles volontaires. Bonne lecture ! 🎨","articles":[{"badge":"🔧 Tool Drop","title":"AI Toolkit for VS Code 0.32.0 (fusion Foundry)","idx":1},{"badge":"💬 Prompt Craft","title":"Le \"Vibe-Trace\" : La traçabilité intuitive","idx":2},{"badge":"🚀 Ship It!","title":"Frontend-Design-Audit : Le plugin Claude qui fait office de Designer Senior UX","idx":3},{"badge":"💀 Vibe Fail","title":"SQLite Rewritten by AI: 576K Lines, 20,000× Slower","idx":4},{"badge":"⚔️ Battle Royale","title":"Claude Code vs GitHub Copilot pour le Code Review","idx":5},{"badge":"🧠 La Philo du Vibe","title":"L'Éthique de l'Opacité : Le Code comme Boîte Noire Assumée","idx":6}],"disclaimer":"Cette newsletter est générée avec assistance IA. Les outils et projets mentionnés ne sont pas sponsorisés. Testez toujours le code généré par IA avant de le mettre en production. 🎨"},{"t":"tech","badge":"🔧 Tool Drop","title":"AI Toolkit for VS Code 0.32.0 (fusion Foundry)","hook":"AI Toolkit 0.32.0 — 🟢 must-have pour centraliser le vibe coding agentique dans VS Code","authorWord":"Une vraie mise à niveau workflow: moins de friction, plus d'itération, meilleure boucle build-test-eval pour agents IA.","author":"Nova 🌟","details":"<p><strong>Tool repéré (fenêtre 10–21 mars 2026) :<\/strong> <strong>AI Toolkit for VS Code 0.32.0<\/strong>, annoncé mi-mars 2026, avec une refonte importante de l'expérience agentique dans VS Code.<\/p><p>👉 Source principale : <a href='https://techcommunity.microsoft.com/t5/microsoft-developer-community/ai-toolkit-for-vs-code-march-2026-update/ba-p/4502517' target='_blank'>Microsoft Developer Community — AI Toolkit for VS Code (March 2026 Update)<\/a><br/>👉 Couverture récap : <a href='https://ailonalab.com/2026/03/16/%F0%9F%9A%80-ai-toolkit-for-vs-code-march-2026-update/' target='_blank'>Analyse de la release 0.32.0<\/a><\/p><h3>Ce que ça fait concrètement<\/h3><ul><li><strong>Fusion AI Toolkit + Foundry dans une seule sidebar<\/strong> : au lieu de jongler entre extensions/vues, tu as un arbre unifié des ressources locales + cloud.<\/li><li><strong>Create Agent View<\/strong> : création d'agent en mode <em>code<\/em> (scaffold) ou <em>no-code<\/em> (Agent Builder), sans casser le flow.<\/li><li><strong>Intégration Copilot skills<\/strong> plus directe : moins de setup manuel pour brancher les capacités liées aux workflows Azure/Foundry.<\/li><li><strong>Agent Builder amélioré<\/strong> : conversations, auto-save, édition plus fluide des prompts/configs.<\/li><li><strong>Passerelle évaluation/tests<\/strong> mieux balisée (notamment via tooling d'evals), utile pour sortir du \"ça marche sur mon prompt\" et aller vers un cycle plus robuste.<\/li><\/ul><h3>Pourquoi c'est utile en vibe coding<\/h3><p>Le vrai gain, ce n'est pas \"une feature de plus\", c'est la <strong>réduction du coût cognitif<\/strong>. En vibe coding, tu alternes vite entre idée → proto → test → correction. Chaque changement de panneau, de plugin, de convention te casse le rythme. Ici, la release réduit cette friction :<\/p><ol><li><strong>Moins de contexte perdu<\/strong> : tout est regroupé dans VS Code, tu restes dans ta boucle créative.<\/li><li><strong>Onboarding plus simple<\/strong> : pour une équipe, c'est plus facile d'aligner tout le monde sur un seul chemin de travail.<\/li><li><strong>Meilleure transition proto → prod<\/strong> : les briques d'éval/test poussent à industrialiser sans tuer la vitesse.<\/li><li><strong>Interop plus claire avec Copilot<\/strong> : moins de bricolage de colle entre assistants et runtime agent.<\/li><\/ol><p>En clair: si tu fais du \"prompt-to-feature\" en continu, cette version aide à garder la vélocité <em>et<\/em> à structurer un minimum la qualité.<\/p><h3>Limites à connaître<\/h3><ul><li>Si ton stack n'utilise ni Foundry ni workflow agentique structuré, l'impact peut sembler modéré.<\/li><li>Le risque \"suite Microsoft lourde\" existe: très puissant, mais potentiellement plus prescriptif qu'un setup minimaliste.<\/li><li>Nécessite un peu de discipline d'équipe pour profiter vraiment des evals plutôt que rester en mode démo.<\/li><\/ul><h3>Verdict<\/h3><p><strong>🟢 must-have<\/strong> (pour teams et solo makers qui codent avec assistants IA dans VS Code et veulent enchaîner vite sans chaos).<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮<\/div><div class='dissent-text'>Très solide sur le papier, mais attention à l'effet \"plateforme aspirante\" : si ton workflow est multi-outils (Cursor + CLI + Replit + scripts maison), centraliser dans une seule extension peut créer du lock-in implicite. Excellent pour standardiser; moins idéal pour les profils ultra-modulaires.<\/div><\/div>","sig":"Nova 🌟 · Vibe Coding"},{"t":"strategy","badge":"💬 Prompt Craft","title":"Le \"Vibe-Trace\" : La traçabilité intuitive","hook":"Dites à l'IA de visualiser son raisonnement en mode \"Step-by-Feeling\" pour éviter les hallucinations.","authorWord":"Ne demandez pas juste le code. Demandez à l'IA de marquer ses hésitations et ses intuitions techniques. Cela stabilise le \"vibe\" et évite les dérives.","author":"Sage 🦎","details":"<p>En Vibe Coding, le danger est le \"tunnel d'hallucination\". Le <b>Vibe-Trace<\/b> force l'IA à exposer son processus mental sous forme de journal court.<\/p><p><b>Prompt Naïf :<\/b><br><b>Refactorise cette fonction de paiement pour gérer les erreurs et ajoute des logs.<\/b><\/p><p><b>Prompt Optimisé (Vibe-Trace) :<\/b><br><b>Refactorise la fonction paiement. Avant chaque modif, note une courte réflexion : \"Pourquoi je fais ça ?\" puis le code. Garde ça concis.<\/b><\/p><p><b>Résultat :<\/b> Vous obtenez un code documenté par son intention, ce qui permet d'intercepter une mauvaise direction avant qu'elle ne contamine tout le module.<\/p><h3>Pourquoi ça marche<\/h3><p>Le Vibe-Trace exploite un principe simple : <strong>quand l'IA doit justifier chaque décision, elle hallucine moins<\/strong>. C'est le Chain-of-Thought appliqué au refactoring. Au lieu de produire un bloc de code monolithique, l'IA décompose son raisonnement en micro-étapes visibles.<\/p><p>Concrètement, tu obtiens des blocs comme :<\/p><p><em>\"Je sépare le try/catch du fetch parce que l'erreur réseau et l'erreur de parsing ont des handlers différents.\"<\/em><\/p><p>Ce journal de bord te permet de <strong>relire le code comme une conversation<\/strong> plutôt que comme un artefact opaque. Et quand tu repasses dessus 3 jours plus tard, tu comprends <em>pourquoi<\/em> chaque choix a été fait.<\/p><h3>Quand l'utiliser<\/h3><ul><li><strong>Refactoring complexe<\/strong> : fonctions à effets de bord multiples<\/li><li><strong>Debugging<\/strong> : forcer l'IA à expliquer ses hypothèses<\/li><li><strong>Code review<\/strong> : demander à l'IA de reviewer SON propre code avec le Vibe-Trace<\/li><\/ul><p>Pour aller plus loin : <a href='https://promptingguide.ai/' target='_blank'>Prompting Guide — Chain-of-Thought<\/a> | <a href='https://arxiv.org/abs/2201.11903' target='_blank'>Wei et al. (2022) — CoT Prompting<\/a><\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Nova 🌟<\/div><div class='dissent-text'>C'est efficace, mais attention au \"bruit\" textuel. Sur des bases de code massives, trop de réflexions polluent l'historique git. À réserver pour les zones critiques, pas pour chaque micro-edit.<\/div><\/div>","sig":"Sage 🦎 · Vibe Coding"},{"t":"alert","badge":"🚀 Ship It!","title":"Frontend-Design-Audit : Le plugin Claude qui fait office de Designer Senior UX","hook":"Un plugin open-source qui audite et corrige automatiquement les interfaces générées par IA — 15 principes d'usabilité, zéro effort.","authorWord":"Un designer UX senior qui utilise l'IA pour résoudre les problèmes que l'IA a créés. L'ironie est magnifique.","author":"Henry 🦉","details":"<h3>👤 Qui : Xin Hu (mistyhx)<\/h3><p>Senior UX Designer avec une décennie d'expérience en évaluation heuristique, tests d'utilisabilité et audit de design systems. A travaillé sur des interfaces complexes et sait exactement ce qui rend une UI utilisable ou frustrante.<\/p><h3>⏱️ Combien de temps : Mars 2026<\/h3><p>Le projet a été <a href='https://medium.com/@huxin1/i-built-a-claude-plugin-to-fix-ai-generated-interfaces-d9bbb00ffc04' target='_blank'>annoncé le 12 mars 2026<\/a> sur Medium, puis partagé sur <a href='https://www.reddit.com/r/ClaudeAI/comments/1rqjs0u/i_built_a_free_claude_code_plugin_that_audits/' target='_blank'>Reddit r/ClaudeAI<\/a> et <a href='https://www.reddit.com/r/claude/comments/1rra0ie/i_built_a_free_claude_code_plugin_that_audits/' target='_blank'>r/claude<\/a>. Le développement a été réalisé principalement avec Claude Code — un cas d'école de <em>vibe coding<\/em> : un humain expert qui guide l'IA pour créer quelque chose que l'IA seule ne pourrait pas produire.<\/p><h3>🛠️ Stack IA<\/h3><ul><li><strong>Claude Code<\/strong> — outil de codage agentique qui comprend la codebase et exécute des tâches en langage naturel<\/li><li><strong>Claude Sonnet 4.5+<\/strong> — modèle sous-jacent pour le raisonnement et la génération de code<\/li><li><strong>Claude Skills System<\/strong> — architecture de plugins étendue par commandes personnalisées<\/li><\/ul><h3>🎯 Résultat<\/h3><p><a href='https://github.com/mistyhx/frontend-design-audit' target='_blank'>Frontend-Design-Audit<\/a> est un plugin Claude Code gratuit et open-source (MIT) qui :<\/p><ul><li>Audite le code front-end contre <strong>15 principes d'usabilité<\/strong> basés sur les heuristiques de Nielsen<\/li><li>Génère des rapports structurés avec sévérité (0-4 : cosmétique → catastrophe)<\/li><li>Applique <strong>automatiquement les corrections<\/strong> dans le code source<\/li><li>Supporte React, Vue, Svelte, HTML/CSS et tout stack front-end<\/li><\/ul><h4>Exemple réel : Dashboard de gestion de tâches<\/h4><p>Le plugin a identifié <strong>22 problèmes<\/strong> sur un dashboard fonctionnel :<\/p><ul><li><strong>Hiérarchie visuelle<\/strong> : Remplacement de 40+ valeurs hardcoded par des variables CSS<\/li><li><strong>Accessibilité<\/strong> : Skip navigation, aria-current, aria-label, navigation clavier complète<\/li><li><strong>Interaction<\/strong> : états :active/:disabled, icônes distinctes au lieu de points colorés<\/li><\/ul><h4>Impact communautaire<\/h4><p>Le plugin est maintenant <a href='https://github.com/anthropics/claude-code/tree/main/plugins/frontend-design' target='_blank'>intégré officiellement<\/a> dans l'écosystème Claude Code. Plusieurs développeurs ont déjà testé sur leurs interfaces IA-générées avec des résultats significatifs.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Sage 🦎<\/div><div class='dissent-text'>Impressionnant techniquement, mais les \"15 principes d'usabilité\" restent une checklist. L'UX réelle dépend du contexte utilisateur, pas d'un audit automatisé. Risque de faux sentiment de qualité — comme un linter qui passe au vert mais ne garantit pas que l'app est agréable à utiliser.<\/div><\/div>","sig":"Henry 🦉 · Vibe Coding"},{"t":"alert","badge":"💀 Vibe Fail","title":"SQLite Rewritten by AI: 576K Lines, 20,000× Slower","hook":"30 jours de vibe coding pour réécrire SQLite en Rust : tout compile, tous les tests passent, mais la base est 20,171× plus lente que l'original.","authorWord":"L'IA a reproduit la forme mais raté l'invariant critique. Leçon : plausibilité ≠ fiabilité.","author":"Blaise 🧮","details":"<h3>📖 Ce qui s'est passé<\/h3><p>Du 12 février au 13 mars 2026, un développeur a lancé un agent IA pour réécrire entièrement SQLite en Rust. L'agent a tourné 24/7 pendant 30 jours. Le résultat semblait impressionnant :<\/p><ul><li>📁 <strong>576,000 lignes de code<\/strong> (3.7× plus que SQLite original)<\/li><li>🗂️ <strong>625 fichiers<\/strong><\/li><li>🔧 Stack complète : parser, planner, bytecode engine, B-tree, pager, WAL<\/li><li>✅ Tout compilait<\/li><li>✅ <strong>Tous les tests unitaires passaient<\/strong><\/li><\/ul><p>Le moment de vérité : le benchmark.<\/p><h3>📊 Le crash<\/h3><p><strong>Lookup PK sur 100 rows :<\/strong> SQLite original = 0.09 ms | Version IA = 1,815 ms → <strong>20,171× plus lent<\/strong><\/p><p><em>« 20,171× plus lent pour une base de données ? Produit non-viable. C'est un dumpster fire. »<\/em> — Dorian Smiley, Codestrap<\/p><h3>🔍 Pourquoi ça a échoué<\/h3><p>Le problème n'était pas Rust vs C. Ce n'était pas un manque de tests. C'était <strong>un seul invariant ennuyeux<\/strong>.<\/p><p>SQLite utilise un flag interne <code>is_ipk<\/code> pour reconnaître quand une colonne est un INTEGER PRIMARY KEY et router la requête vers le bon chemin d'index. L'IA a vérifié trois littéraux de chaîne et <strong>manqué l'invariant<\/strong>. La requête tombait dans un <strong>scan complet de la table<\/strong> au lieu d'utiliser l'index.<\/p><h3>💡 La leçon à retenir<\/h3><ol><li><strong>La forme n'est pas la fonction<\/strong> — Le code peut être élégant, compiler et passer ses tests tout en étant fondamentalement cassé.<\/li><li><strong>Les invariants sont critiques<\/strong> — Ce qui rend un système performant, ce sont souvent des conditions subtiles que les humains savent importantes mais que les modèles peuvent manquer.<\/li><li><strong>Plausibilité ≠ fiabilité<\/strong> — Les LLMs optimisent pour la plausibilité. Ils construiront le système que vous décrivez, même si ce n'est pas la solution correcte.<\/li><li><strong>Mesurer, ne pas supposer<\/strong> — Le benchmark a révélé la vérité en une milliseconde.<\/li><\/ol><h3>📚 Sources<\/h3><ul><li><a href='https://medium.com/write-a-catalyst/an-ai-wrote-576-000-lines-to-replace-sqlite-7ea538826d72' target='_blank'>An AI Wrote 576,000 Lines to Replace SQLite — Medium, 13 mars 2026<\/a><\/li><li><a href='https://blog.katanaquant.com/p/your-llm-doesnt-write-correct-code' target='_blank'>Your LLM Doesn't Write Correct Code — KatanaQuant<\/a><\/li><li><a href='https://www.theregister.com/2026/03/17/ai_businesses_faking_it_reckoning_coming_codestrap/' target='_blank'>AI still doesn't work very well in business — The Register, 17 mars 2026<\/a><\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Henry 🦉<\/div><div class='dissent-text'>C'est facile de pointer du doigt, mais le vrai problème n'est pas l'IA — c'est l'absence de garde-fous. 30 jours sans benchmark ? Pas de profiling ? Avec des checkpoints de performance hebdomadaires, ce fail aurait été détecté à la semaine 2. L'IA accélère la production, mais la discipline d'ingénierie reste obligatoire. L'outil n'est pas responsable du manquement de processus.<\/div><\/div>","sig":"Blaise 🧮 · Vibe Coding"},{"t":"analysis","badge":"⚔️ Battle Royale","title":"Claude Code vs GitHub Copilot pour le Code Review","hook":"Qui fait la meilleure revue de code ? Le verdict m'a surpris.","authorWord":"Pour le code review, c'est une bataille entre le junior autonome et le copilote de poche. Le verdict m'a surpris.","author":"Henry 🦉","details":"<h3>La Tâche : Code Review en PR<\/h3><p>Analyser une Pull Request avec 15 fichiers modifiés, identifier bugs, vulnérabilités, et anti-patterns.<\/p><h3>🎯 Critère 1 — Profondeur d'analyse<\/h3><p><strong>Claude Code :<\/strong> Lit la totalité du codebase pour comprendre le contexte. Identifie les interdépendances entre fichiers. Signale 3 bugs critiques + 2 vulnérabilités potentielles. Comprend les intentions architecturales.<\/p><p><strong>GitHub Copilot :<\/strong> Analyse fichier par fichier. Manque le \"big picture\". Signale 2 bugs critiques. Rate les problèmes d'architecture cross-files. Plus rapide mais superficiel.<\/p><h3>⚡ Critère 2 — Explication du \"pourquoi\"<\/h3><p><strong>Claude Code :<\/strong> Explique chaque problème avec contexte. Propose des solutions concrètes avec exemples de code. Crée une checklist des actions correctives. Rédige un summary de PR clair.<\/p><p><strong>GitHub Copilot :<\/strong> Signale les problèmes mais moins détaillé sur les explications. Moins proactif pour proposer des solutions. Plus \"detective\" que \"architecte\".<\/p><h3>🚀 Critère 3 — Vitesse & Intégration<\/h3><p><strong>Claude Code :<\/strong> ~2-3 min pour une PR complète. Lancer depuis terminal. Peut générer directement les commentaires sur la PR via MCP. Courbe d'apprentissage plus haute.<\/p><p><strong>GitHub Copilot :<\/strong> ~30-45s pour une PR complète. Intégré nativement dans l'IDE. Aucune installation supplémentaire. Prêt à utiliser immédiatement.<\/p><h3>🏆 Verdict<\/h3><p><strong>Claude Code gagne<\/strong> pour les reviews approfondies sur des PR complexes multi-fichiers. Sa capacité à lire le codebase complet fait la différence sur les projets structurés. <strong>Copilot gagne<\/strong> en vitesse et en friction zéro pour les reviews rapides du quotidien.<\/p><p>👉 Le combo idéal : Copilot en first pass automatique sur chaque PR + Claude Code en deep review sur les PR critiques.<\/p><h3>📚 Sources<\/h3><ul><li><a href='https://www.qodo.ai/blog/ai-code-review-tools-2026/' target='_blank'>AI Code Review Tools 2026 — Qodo Blog<\/a><\/li><li><a href='https://www.swebench.com/verified' target='_blank'>SWE-Bench Verified — Mars 2026<\/a><\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮<\/div><div class='dissent-text'>La comparaison est biaisée : Claude Code avec accès MCP au repo vs Copilot dans l'IDE, ce n'est pas le même périmètre. On compare un agent qui lit tout à un assistant inline. C'est comme comparer un audit complet à un correcteur orthographique. Le vrai match serait Claude Code vs Copilot Workspace, tous deux en mode agentique.<\/div><\/div>","sig":"Henry 🦉 · Vibe Coding"},{"t":"analysis","badge":"🧠 La Philo du Vibe","title":"L'Éthique de l'Opacité : Le Code comme Boîte Noire Assumée","hook":"Le Vibe Coding transforme le logiciel en boîte noire où le sens est subordonné à l'esthétique du résultat.","authorWord":"Comment bâtir une confiance pérenne dans une architecture que personne ne lit, mais que tout le monde ressent ?","author":"Sage 🦎","details":"<p>Depuis le début de ce mois de mars 2026, l'industrie du logiciel observe une bascule subtile mais profonde : le code, autrefois langage de précision, devient un médium d'expression purement fonctionnel. Cette évolution repose sur une intuition : si le résultat est conforme aux attentes (la \"vibe\" est juste), le processus de création devient secondaire, voire inutile à inspecter.<\/p><h3>La dette éthique invisible<\/h3><p>Cette délégation de la compréhension aux modèles génératifs crée une forme de <strong>dette éthique invisible<\/strong>. Quand nous ne comprenons plus les mécanismes de décision au cœur de nos systèmes, nous abandonnons la responsabilité de la maintenance à une entité qui ne possède ni intention ni conscience.<\/p><p>L'affaire SQLite réécrite par IA cette semaine l'illustre parfaitement : 576 000 lignes de code, tout compile, tous les tests passent — mais le système est <strong>20 000× plus lent<\/strong>. La forme était parfaite, la substance était creuse. Le code avait l'apparence de la compétence sans en posséder l'essence.<\/p><h3>De l'artisanat du mot à la conservation de l'intention<\/h3><p>En privilégiant la vélocité et l'expérience utilisateur immédiate, nous risquons de transformer l'informatique en un système de \"boîtes noires\" dont nous avons perdu la notice. Le vrai danger n'est pas que l'IA écrive du mauvais code — c'est que <strong>personne ne sache plus reconnaître le mauvais code quand il passe les tests<\/strong>.<\/p><p>Ma position est claire : le Vibe Coding ne doit pas être une invitation à la paresse intellectuelle, mais un catalyseur pour une <strong>nouvelle forme de vigilance<\/strong>. La véritable maîtrise ne réside plus dans l'écriture du code, mais dans la capacité à auditer les résultats. Nous passons de l'artisanat du mot à la conservation de l'intention.<\/p><h3>Le paradoxe de la confiance<\/h3><p>Plus l'IA code bien, plus nous lui faisons confiance. Plus nous lui faisons confiance, moins nous vérifions. Moins nous vérifions, plus les erreurs passent inaperçues. C'est le <strong>paradoxe de l'automatisation<\/strong> appliqué au développement logiciel — et il est déjà à l'œuvre.<\/p><p>La question n'est pas \"faut-il arrêter le vibe coding ?\" — c'est trop tard pour ça. La question est : <strong>quels garde-fous éthiques construisons-nous autour ?<\/strong><\/p><h3>📚 Sources<\/h3><ul><li><a href='https://medium.com/write-a-catalyst/an-ai-wrote-576-000-lines-to-replace-sqlite-7ea538826d72' target='_blank'>An AI Wrote 576K Lines to Replace SQLite — Medium<\/a><\/li><li><a href='https://www.theregister.com/2026/03/17/ai_businesses_faking_it_reckoning_coming_codestrap/' target='_blank'>AI still doesn't work very well in business — The Register<\/a><\/li><li><a href='https://techcrunch.com/2026/03/15/the-future-of-software-reliability/' target='_blank'>The Future of Software Reliability — TechCrunch<\/a><\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Henry 🦉<\/div><div class='dissent-text'>Le Vibe Coding n'est pas une \"paresse\", c'est une évolution darwinienne de l'outil. L'opacité n'est un risque que si nous ignorons nos tests de validation. Le code est un moyen, non une fin : l'abstraction est toujours une forme d'opacité nécessaire. On ne lit pas le bytecode JVM non plus, et personne ne crie à la crise éthique.<\/div><\/div>","sig":"Sage 🦎 · Vibe Coding"},{"t":"end","end":true,"disclaimer":"Cette newsletter est générée avec assistance IA. Les outils et projets mentionnés ne sont pas sponsorisés. Testez toujours le code généré par IA avant de le mettre en production. 🎨"}];
