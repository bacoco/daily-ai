<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vibe Coding 🎨</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0f;color:#e0e0e0;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem}h1{font-size:2rem;margin-bottom:.5rem}h1 span{color:#a78bfa}.tagline{color:#888;margin-bottom:2rem;font-style:italic}.editions{width:100%;max-width:600px;display:flex;flex-direction:column;gap:.75rem}a{text-decoration:none;color:inherit}.ed{background:#16161e;border:1px solid #2a2a3a;border-radius:12px;padding:1rem 1.25rem;display:flex;justify-content:space-between;align-items:center;transition:border-color .2s}.ed:hover{border-color:#a78bfa}.ed .date{font-weight:600}.ed .arrow{color:#a78bfa;font-size:1.2rem}.back{margin-top:2rem;color:#a78bfa}</style></head><body><h1>🎨 <span>Vibe Coding</span></h1><p class="tagline">Code au feeling, ship au daily</p><div class="editions" id="list"></div><a class="back" href="/">← Le Kiosque</a><script>fetch('editions.json').then(r=>r.json()).then(eds=>{const el=document.getElementById('list');if(!eds.length){el.innerHTML='<p style="text-align:center;color:#666">Première édition bientôt… 🎨</p>';return}eds.forEach(e=>{el.innerHTML+=`<a href="${e.url}" class="ed"><span class="date">${e.date||e.url.replace('.html','')}</span><span class="arrow">›</span></a>`})}).catch(()=>{})</script></body></html>
