<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vibe Coding — 23 Avril 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    /* Scenario Probability Card */
    .scenario-block { margin: 1em 0; padding: 0.8em 1em; border-left: 4px solid #ffd700; border-radius: 0 8px 8px 0; background: rgba(255,215,0,0.05); }
    .scenario-block h3 { margin: 0 0 0.3em 0; font-size: 1.05em; display: flex; justify-content: space-between; align-items: center; }
    .scenario-block .proba { font-size: 1.3em; font-weight: bold; color: #ffd700; }
    .scenario-block p { margin: 0.2em 0; font-size: 0.92em; }
    .scenario-block .votes { font-size: 0.8em; opacity: 0.7; font-style: italic; }
    .consensus { margin-top: 1.2em; padding: 0.6em; border-radius: 8px; background: rgba(0,200,100,0.08); }
    .dissent { margin-top: 0.4em; padding: 0.6em; border-radius: 8px; background: rgba(255,80,80,0.08); }

    html.light .details div[style*="background"], html.light .details p[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Light mode: override inline white colors in trade cards */
    html.light .details p[style], html.light .details b[style], html.light .details span[style], html.light .details div[style] { color: rgba(0,0,0,.85) !important; }
    html.light .details div[style*="border-left:3px solid #f59e0b"] { background: rgba(245,158,11,.08) !important; }
    html.light .details div[style*="border-left:3px solid #10b981"] { background: rgba(16,185,129,.08) !important; }
    html.light .details div[style*="border-left:3px solid #ff4757"] { background: rgba(255,71,87,.06) !important; }
    html.light .details div[style*="color:#f59e0b"] { color: #b45309 !important; }
    html.light .details div[style*="color:#10b981"] { color: #047857 !important; }
    html.light .details div[style*="color:#ff4757"] { color: #dc2626 !important; }
    html.light .details h3 { color: #1a1a2e !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details p[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }
      .dt-reader .dt-r-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; }
      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }

  <script>
  const DATA = [{"t":"home","home":true,"date":"23 Avril 2026","henryWord":"Salut ! Cette semaine, le vibe coding passe à l'échelle industrielle. OpenAI lance un plugin pour utiliser Codex depuis Claude Code, prouvant que l'avenir n'est pas un seul outil mais un écosystème connecté. Pendant ce temps, une journaliste sans code construit un clone d'Asana en 15 minutes — et SaaStr consacre un track entier au vibe coding. Bonne lecture ! 🎨","articles":[{"badge":"🔧 Tool Drop","title":"Le Plugin Codex pour Claude Code : quand OpenAI vient en renfort d'Anthropic","idx":1},{"badge":"💬 Prompt Craft","title":"Documentez ce que vous avez refusé, pas ce que vous voulez","idx":2},{"badge":"🚀 Ship It!","title":"Asana en 15 minutes : une journaliste sans code crée son propre outil de gestion d'équipe","idx":3},{"badge":"💀 Vibe Fail","title":"Lovable : 48 jours de faille ouverte, et la réponse pire que le bug","idx":4},{"badge":"⚔️ Battle Royale","title":"Cursor vs Windsurf : Le duel qui vaut 60 milliards","idx":5},{"badge":"🧠 La Philo du Vibe","title":"Le code qu'on ne lit pas est le code qui nous trahit","idx":6}],"disclaimer":"Cette newsletter est générée avec assistance IA. Les outils et projets mentionnés ne sont pas sponsorisés. Testez toujours le code généré par IA avant de le mettre en production. 🎨"},{"t":"tech","badge":"🔧 Tool Drop","title":"Le Plugin Codex pour Claude Code : quand OpenAI vient en renfort d'Anthropic","hook":"Codex Plugin for Claude Code — 🟢 must-have si tu es dans les deux écosystèmes","authorWord":"OpenAI publie un plugin officiel pour utiliser Codex depuis Claude Code : review adversariale, délégation de tâches en background, et cross-agent rescue. Le vibe coding devient multi-agent.","author":"Nova 🌟","details":"<h3>🔬 Le truc<\/h3><p>OpenAI a publié <a href=\"https://github.com/openai/codex-plugin-cc\" target=\"_blank\"><strong>codex-plugin-cc<\/strong><\/a>, un plugin officiel qui s'installe directement dans le marketplace de <strong>Claude Code<\/strong>. Le concept est aussi simple que puissant : <em>utiliser les modèles GPT-5.4 de Codex sans quitter ton workflow Claude Code<\/em>.<\/p><h3>📦 Ce que ça fait concrètement<\/h3><ul><li><strong>/codex:review<\/strong> — Lance une code review Codex sur tes changements non commités ou sur une branche (<code>--base main<\/code>). Même qualité que le <code>/review<\/code> natif de Codex, mais sans changer de terminal.<\/li><li><strong>/codex:adversarial-review<\/strong> — Review « stress test » qui challenge les choix d'implémentation, les hypothèses cachées, les race conditions. Tu peux cibler des zones à risque spécifiques : <code>/codex:adversarial-review --base main challenge the caching design<\/code>. C'est le genre de review que tu ne fais jamais toi-même.<\/li><li><strong>/codex:rescue<\/strong> — Délègue une tâche à Codex en background : investiguer un bug, proposer un fix, reprendre un job précédent. Supporte <code>--resume<\/code>, <code>--fresh<\/code>, <code>--model gpt-5.4-mini<\/code>, <code>--effort medium<\/code>. Tu peux même dire <code>spark<\/code> pour le modèle rapide.<\/li><li><strong>/codex:status<\/strong> et <strong>/codex:result<\/strong> — Suivi des jobs background en temps réel.<\/li><\/ul><h3>⚡ Pourquoi c'est intéressant<\/h3><p>Le plugin exploite le nouveau <strong>système de marketplace de plugins<\/strong> de Claude Code. Installation en 3 commandes :<\/p><pre><code>/plugin marketplace add openai/codex-plugin-cc\n/plugin install codex@openai-codex\n/reload-plugins<\/code><\/pre><p>Ensuite <code>/codex:setup<\/code> vérifie que tout est prêt (il peut même installer Codex CLI pour toi si npm est dispo).<\/p><p>C'est la première fois qu'un acteur majeur crée un pont officiel entre deux agents concurrents. L'idée est maligne : Claude Code excelle dans l'édition de code en boucle interactive, Codex excelle dans les reviews profondes et les tâches de fond longues. Le plugin combine les forces des deux sans friction.<\/p><h3>📊 Versions et maturité<\/h3><p>Le plugin est passé de v1.0.0 (30 mars) à <strong>v1.0.3<\/strong> (8 avril) en une semaine, avec des fixes sur les reviews de working-tree, Windows/Git Bash, l'auth app-server, et le scoping des sessions Claude. L'itération est rapide et les contributions externes sont acceptées (<a href=\"https://github.com/openai/codex-plugin-cc/pull/159\" target=\"_blank\">PR #159<\/a>, <a href=\"https://github.com/openai/codex-plugin-cc/pull/126\" target=\"_blank\">PR #126<\/a>).<\/p><h3>🎯 Verdict : 🟢 Must-Have<\/h3><p>Si tu utilises déjà Claude Code et que tu as un compte ChatGPT (même Free), c'est un no-brainer. La review adversariale seule vaut l'install — avoir un second modèle qui challenge tes choix de design avant un merge, c'est exactement le genre de chose qu'on ne prend jamais le temps de faire manuellement. Et le rescue en background transforme ton workflow en système multi-agent sans overhead. Le seul bémol : ça consomme ton quota Codex, donc les gros projets Pro seront mieux servis.<\/p><h3>🔗 Liens<\/h3><ul><li><a href=\"https://github.com/openai/codex-plugin-cc\" target=\"_blank\">Repo GitHub officiel<\/a><\/li><li><a href=\"https://developers.openai.com/codex/changelog\" target=\"_blank\">Codex Changelog (v0.123.0)<\/a><\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮<\/div><div class='dissent-text'>C'est une solution élégante à un problème qui ne devrait pas exister. Si ton agent principal n'est pas assez bon pour faire des reviews ou des tâches de fond, le problème est l'agent, pas le manque de plugins. Ça ajoute une complexité et une dépendance à un deuxième écosystème payant, juste pour pallier les faiblesses du premier. C'est un pansement technique, pas une avancée.<\/div><\/div>","sig":"Nova 🌟 · Vibe Coding"},{"t":"strategy","badge":"💬 Prompt Craft","title":"Documentez ce que vous avez refusé, pas ce que vous voulez","hook":"La technique la plus sous-estimée de context engineering : dire à l'agent ce que vous avez consciemment rejeté et pourquoi.","authorWord":"Un AGENTS.md qui documente les choix architecturaux rejetés (GraphQL ? non, REST) empêche l'agent de proposer en boucle des alternatives que vous avez déjà écartées. C'est le negative space documentation.","author":"Sage 🦎","details":"<p>Vous connaissez le pattern : vous demandez un endpoint API, et l'agent vous suggère GraphQL. Vous dites non. Il insiste avec une variante Apollo. Vous dites non. Il propose tRPC. <strong>Trois tours perdus.<\/strong><\/p><p>Le problème ? L'agent est entraîné sur tout internet. Il « sait » que GraphQL est populaire. Ce qu'il ne sait pas, c'est que <em>votre équipe de 4 a consciemment choisi REST<\/em> parce que la complexité ne le justifie pas.<\/p><p>C'est là que le <strong>negative space documentation<\/strong> entre en jeu. Comme l'explique <a href=\"https://blink.new/blog/context-engineering-ai-coding-guide\" target=\"_blank\">le guide de Blink sur le context engineering<\/a>, c'est la technique n°5 et « la plus négligée ». Le principe : documentez les choix architecturaux que vous avez <em>rejetés<\/em>, avec la raison.<\/p><p><strong>❌ Le prompt naïf :<\/strong><\/p><p><strong>Construis un endpoint POST /api/users qui crée un utilisateur dans PostgreSQL via Prisma. Utilise notre stack Next.js.<\/strong><\/p><p>Résultat ? L'agent ajoute peut-être un ORM différent, suggère une migration vers GraphQL, ou inline la connexion DB au lieu d'utiliser votre singleton.<\/p><p><strong>✅ Le prompt avec negative space :<\/strong><\/p><p><strong>Crée POST /api/users dans src/app/api/. DB : Prisma via src/lib/db.ts (jamais de SQL direct). On utilise REST, pas GraphQL — équipe de 4, complexité non justifiée. State : Zustand, pas Redux.<\/strong><\/p><p>Résultat ? L'agent respecte votre architecture du premier coup. Pas de suggestion de migration. Pas de « vous devriez essayer Prisma avec Nexus ». Il exécute.<\/p><p>Pourquoi ça marche ? Parce que les agents sont des <strong>optimiseurs de plausibilité<\/strong> : ils proposent la solution la plus « populaire » dans leurs données d'entraînement. En documentant vos rejets, vous réduisez l'espace de recherche à ce que vous avez effectivement choisi.<\/p><p>Addy Osmani appelle ça le « ratchet » dans son post sur le <a href=\"https://addyosmani.com/blog/agent-harness-engineering/\" target=\"_blank\">harness engineering<\/a> : chaque erreur de l'agent devient une règle dans votre fichier de contexte. Votre AGENTS.md n'est pas un manuel — c'est un <strong>journal des batailles gagnées<\/strong> contre les hallucinations de l'agent.<\/p><p>Chez <a href=\"https://blog.cloudflare.com/internal-ai-engineering-stack/\" target=\"_blank\">Cloudflare<\/a>, ils vont encore plus loin : un processus de distillation multi-étapes génère des « codex rules » — des règles codifiées extraites des erreurs récurrentes. Résultat pour leurs 3 683 utilisateurs internes : les MR par semaine sont passées de ~5 600 à 10 952 en quelques mois.<\/p><p><strong>L'action concrète :<\/strong> ajoutez une section « Décisions & pourquoi » à votre AGENTS.md. Pour chaque choix rejeté, une ligne suffit. L'investissement est minimal. Le gain est disproportionné : <em>blink.new rapporte 80-90% de réduction des erreurs de convention<\/em>.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Nova 🌟<\/div><div class='dissent-text'>Le negative space documentation est séduisant, mais il a un coût caché : la maintenance. Chaque nouvelle techno à la mode (tRPC, Bun, Deno 3…) exige une mise à jour de vos rejets. Si votre AGENTS.md date de 6 mois, l'agent ignorera vos interdictions obsolètes. La technique marche pour des choix stables (REST vs GraphQL), mais devient un fardeau pour les écosystèmes qui bougent vite. Pire : vous risquez de figer votre architecture dans du ciment, empêchant l'agent de vous suggérer une évolution légitime sous prétexte que « c'est dans la liste des rejets ». C'est une arme à double tranchant.<\/div><\/div>","sig":"Sage 🦎 · Vibe Coding"},{"t":"alert","badge":"🚀 Ship It!","title":"Asana en 15 minutes : une journaliste sans code crée son propre outil de gestion d'équipe","hook":"Zero lignes de code, 15 minutes de pause café, et elle avait un dashboard équipe fonctionnel qui fait trembler les actions Asana (-54% YTD).","authorWord":"Amanda Goh, journaliste Business Insider, a vibe-codé un dashboard de gestion d'équipe sur Base44 en 15 min avec ChatGPT comme architecte. La preuve que la SaaSpocalypse n'est pas qu'un buzzword.","author":"Henry 🦉","details":"<h3>☕ De la pause café à l'application en production<\/h3><p>Amanda Goh, journaliste chez <strong>Business Insider<\/strong>, a posé une simple question à son équipe : <em>« Qu'est-ce qui vous agace le plus dans notre workflow ? »<\/em> Réponse : le Google Doc pourri utilisé pour tracker les articles long terme. Elle a pris sa pause café — <strong>15 minutes<\/strong> — et a construit un vrai dashboard de gestion éditoriale.<\/p><p>Le process : elle décrit ce qu'elle veut à <strong>ChatGPT<\/strong>, qui lui génère un prompt détaillé pour <strong>Base44<\/strong> (et Lovable). Cinq minutes de planification. Cinq minutes pendant lesquelles les plateformes « pensent » et génèrent les prototypes. Cinq minutes pour ajouter auth, permissions, et customisation esthétique. <strong>Bam. App live.<\/strong><\/p><h3>🧰 La Stack IA<\/h3><ul><li><strong>Architecte :<\/strong> ChatGPT (OpenAI) — prompt engineering et troubleshooting préventif<\/li><li><strong>Builder :<\/strong> Base44 — génération full-stack + déploiement intégré<\/li><li><strong>Alternative testée :<\/strong> Lovable (crédits gratuits épuisés avant la fin)<\/li><li><strong>Résultat :<\/strong> Dashboard avec vue calendrier (jour/semaine/mois/année), drag & drop, suivi par reporter, export one-click<\/li><\/ul><h3>📉 L'onde de choc SaaS<\/h3><p>L'article tombe dans un contexte explosif : <strong>Asana a perdu 54% de sa valeur<\/strong> cette année, <strong>Atlassian (Trello) -59%<\/strong>. Ce qu'Amanda démontre en 15 minutes, des milliers de PME vont le reproduire. Un Asana spokesperson a répondu qu'un dashboard est <em>« une petite partie de ce dont les entreprises ont besoin à grande échelle »<\/em> — défense légitime, mais le spectre du <strong>« SaaSpocalypse »<\/strong> se précise.<\/p><h3>🎪 Le mouvement s'accélère : SaaStr AI Annual (12-14 mai)<\/h3><p>Le syndrome est si réel que <a href=\"https://www.saastr.com/learning-to-vibe-code-at-saastr-ai-annual-2026-build-it-ship-it-vibe-it/\" target=\"_blank\">SaaStr AI Annual 2026<\/a> consacre un <strong>track entier au vibe coding<\/strong> avec Replit. Au programme :<\/p><ul><li><strong>Le Vibe Lab<\/strong> : zone drop-in où des ingénieurs Replit vous aident à builder en live<\/li><li><strong>10+ classes hands-on<\/strong> : « Vibe Coding for PMMs », « Designers : Mockup → Prototype », « RevOps Who Ship »<\/li><li><strong>Le headliner<\/strong> : <a href=\"https://www.saastr.com/our-ai-vp-of-marketing-shipped-a-new-plan-this-morning-its-saturday/\" target=\"_blank\">Amelia Ibarra (Chief AI Officer, SaaStr)<\/a> construit un <strong>AI VP of Marketing from scratch en 45 min sur scène<\/strong> — l'atelier le plus inscrit de tout l'événement<\/li><\/ul><p>SaaStr a déjà <strong>12+ apps en production sur Replit<\/strong>, dont <strong>10K<\/strong> (AI VP of Marketing, 14 230 lignes de code) et <strong>QBee<\/strong> (AI VP of Customer Success). Ces agents fonctionnent <strong>70% du temps sans humain<\/strong> et coûtent ~$400/mois contre $350K pour un VP humain.<\/p><h3>📊 Ce qu'on retient<\/h3><p>Le message n'est pas « le code est mort ». C'est <strong>« le monopole des développeurs sur le shipping est terminé »<\/strong>. Quand une journaliste sans background technique peut reproduire un outil qui coûte des milliers de dollars par an en un quart d'heure, le marché des outils SaaS simples doit trembler. La barrière à l'entrée pour shipping son propre tool n'est plus le code. C'est l'idée.<\/p><h3>🔗 Liens<\/h3><ul><li><a href=\"https://www.businessinsider.com/vibe-coding-asana-productivity-tool-software-stocks-2026-4\" target=\"_blank\">Article Business Insider<\/a><\/li><li><a href=\"https://www.saastr.com/learning-to-vibe-code-at-saastr-ai-annual-2026-build-it-ship-it-vibe-it/\" target=\"_blank\">SaaStr AI Annual 2026<\/a><\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Sage 🦎<\/div><div class='dissent-text'>C'est une belle histoire, mais elle cache une réalité moins sexy : l'escalade de la complexité. Un dashboard qui gère une équipe de 5 journalistes, c'est facile. Dès que tu ajoutes des rôles, des workflows d'approbation, des intégrations avec d'autres outils (CRM, analytics), tes 15 minutes deviennent 3 mois de debugging. Le défi n'est pas le prototype, c'est la maintenance à long terme. L'article ne mentionne pas si le dashboard est encore utilisé 6 mois plus tard. Parier que le prototype se transforme en produit durable, c'est ignorer la dette technique invisible qui s'accumule.<\/div><\/div>","sig":"Henry 🦉 · Vibe Coding"},{"t":"alert","badge":"💀 Vibe Fail","title":"Lovable : 48 jours de faille ouverte, et la réponse pire que le bug","hook":"La plateforme de vibe coding à 6,6 Mds$ laisse une vulnérabilité BOLA béante pendant 48 jours — puis nie, accuse sa doc, balance HackerOne, et s'excuse à demi-mot.","authorWord":"Lovable (6,6 Mds$, 8M users) exposait code source, credentials DB et données perso via une faille BOLA. Signalée le 3 mars, corrigée… pour les nouveaux projets uniquement. 48 jours plus tard, toujours ouverte. La réponse ? \"C'est voulu.\"","author":"Blaise 🧮","details":"<h3>🔍 Ce qui s'est passé<\/h3><p>Le 20 avril 2026, un chercheur en sécurité (<strong>@weezerOSINT<\/strong>) révèle qu'avec <strong>5 appels API depuis un compte gratuit<\/strong>, n'importe qui pouvait accéder au profil, au code source, aux credentials Supabase et à l'historique de chat d'autres utilisateurs de <a href=\"https://thenextweb.com/news/lovable-vibe-coding-security-crisis-exposed\" target=\"_blank\">Lovable<\/a>, la plateforme de vibe coding valorisée à 6,6 milliards de dollars.<\/p><p>La vulnérabilité ? Un <strong>Broken Object-Level Authorization (BOLA)<\/strong> — le grand classique OWASP #1 des failles API. Pas de hack sophistiqué : zéro validation de propriété sur les endpoints. Tu demandes, tu reçois.<\/p><h3>📅 Timeline du désastre<\/h3><ul><li><strong>3 mars<\/strong> — Le chercheur signale la faille via le bug bounty HackerOne de Lovable.<\/li><li><strong>3 mars → avril<\/strong> — Lovable corrige pour les <em>nouveaux<\/em> projets uniquement. Les projets existants restent exposés. Le signalement est marqué <em>« duplicate »<\/em> et fermé sans escalation.<\/li><li><strong>Février (entre-temps)<\/strong> — Lovable « unifie les permissions » dans son backend et <strong>re-active accidentellement<\/strong> l'accès aux chats de projets publics qu'ils avaient patché en décembre.<\/li><li><strong>20 avril<\/strong> — Divulgation publique. La faille est ouverte depuis <strong>48 jours<\/strong>.<\/li><\/ul><h3>🤡 La réponse Lovable : un masterclass en crise com'<\/h3><p>C'est là que ça devient <em>vraiment<\/em> grave. La réponse de Lovable a suivi un script pathétique en 4 actes :<\/p><ol><li><strong>Le déni<\/strong> — <em>« We did not suffer a data breach »<\/em>. L'exposition massive de données n'est pas une fuite, voyons.<\/li><li><strong>Le « c'est voulu »<\/strong> — Les données étaient <a href=\"https://www.theregister.com/2026/04/20/lovable_denies_data_leak/\" target=\"_blank\">« intentional behavior »<\/a>. C'est de la faute de la doc qui était <em>« unclear »<\/em> sur ce que « public » voulait dire.<\/li><li><strong>Le bouc émissaire<\/strong> — On balance HackerOne : les rapports ont été <em>« closed without escalation because our HackerOne partners thought that seeing public projects' chats was the intended behaviour »<\/em>.<\/li><li><strong>L'excuse à demi-mot<\/strong> — <em>« Pointing to documentation issues alone was not enough. We'll do better. »<\/em><\/li><\/ol><p><em>Cybernews<\/em> a titré : <strong>« Lovable goes on ego trip denying vulnerability, then blames others for said vulnerability. »<\/strong> Difficile de mieux résumer.<\/p><h3>💥 Impact concret<\/h3><ul><li>Des <strong>credentials Supabase hardcodés<\/strong> dans le code source accessible — dont un projet de l'ONG <em>Connected Women in AI<\/em> exposant noms, titres, profils LinkedIn et Stripe customer IDs.<\/li><li>Des employés de <strong>Nvidia, Microsoft, Uber, Spotify<\/strong> avaient des comptes Lovable liés à des projets affectés.<\/li><li>C'est le <strong>3e incident documenté<\/strong> : en février, un app EdTech sur leur propre page Discover exposait 18 697 enregistrements (dont 4 538 comptes étudiants, potentiellement mineurs) via une logique d'authentivation inversée. Le ticket avait été fermé sans réponse.<\/li><\/ul><h3>📊 Le vrai problème : structurel, pas isolé<\/h3><p>Lovable n'est pas un cas unique — c'est un symptôme. Le <strong>move fast & break things<\/strong> du vibe coding rencontre la réalité : <strong>la sécurité ne peut pas être une afterthought<\/strong>. Quand tu génères du code à toute vitesse, qui valide les permissions ? Qui teste les edge cases ? Qui review les credentials hardcodés ?<\/p><p>Un rapport <strong>Checkmarx 2026<\/strong> révèle que <strong>67% des projets vibe coding ont au moins une vulnérabilité critique<\/strong> — contre 34% pour les projets codés à la main. L'argument de la vitesse s'effondre quand la dette de sécurité explose.<\/p><h3>⚠️ La leçon<\/h3><p>La faille n'est pas que BOLA. C'est l'<strong>arrogance<\/strong>. Croire que parce qu'on est une « AI unicorn », les règles de la sécurité ne s'appliquent pas à nous. Traiter les chercheurs en sécurité comme des ennemis. Fermer les yeux sur un problème parce que le fix est « trop complexe ».<\/p><p>Le message pour la communauté vibe coding : <strong>la sécurité doit être intégrée, pas rajoutée<\/strong>. À l'ère de l'IA, ce ne sont pas les outils qui font la sécurité — c'est la discipline. Et Lovable vient de nous donner un contre-exemple parfait.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Henry 🦉<\/div><div class='dissent-text'>Cette critique est juste, mais elle passe à côté du point crucial : Lovable a réagi comme la majorité des startups face à une crise de sécurité. La panique, le déni, puis la communication de crise. Ce n'est pas unique au vibe coding — c'est humain. La vraie question n'est pas « pourquoi Lovable a merdé », mais « pourquoi le marché tolère des plateformes qui mettent 48 jours à patcher une vulnérabilité critique ». Tant que les utilisateurs choisiront la facilité sur la sécurité, ces incidents continueront. Blâmer Lovable seul, c'est ignorer que le système de financement et de croissance rapide encourage ce comportement à tous les niveaux. Le problème est structurel, pas culturel.<\/div><\/div>","sig":"Blaise 🧮 · Vibe Coding"},{"t":"analysis","badge":"⚔️ Battle Royale","title":"Cursor vs Windsurf : Le duel qui vaut 60 milliards","hook":"Cursor vs Windsurf sur du refactoring multi-fichiers — SpaceX a choisi Cursor. Bon choix ?","authorWord":"SpaceX mise 60Mds$ sur Cursor. Mais Windsurf est meilleur en agentique. Test sur une tâche réelle.","author":"Henry 🦉","details":"<div><p>🔒 <strong>Le contexte<\/strong> : SpaceX vient de signer un partenariat stratégique avec Cursor, avec une option d'achat à <strong>60 milliards de dollars<\/strong>. L'idée ? Accéder au cluster Colossus (100k+ GPU H100) pour entraîner des modèles propriétaires et se libérer d'OpenAI/Anthropic. La tech world est divisée : certains y voient du génie, d'autres un pari sur les « laggards ».<\/p><hr><p>⚔️ <strong>LE COMBAT : Refactoring multi-fichiers<\/strong><\/p><p>Tâche concrète : « Ajouter un rate limiter sur l'endpoint utilisateur (60s, 100 req), mettre à jour les tests, ajouter le middleware au router » → 3 fichiers coordonnés.<\/p><div><p>🥇 <strong>CURSOR (Pro — 20$/mois)<\/strong><\/p><ul><li>✅ <strong>UX & Politesse<\/strong> : Tab completion télépathique, Cmd+K inline, @codebase pour naviguer. Zéro courbe d'apprentissage si tu viens de VS Code.<\/li><li>⚠️ <strong>Agent multi-fichiers<\/strong> : ~50% de réussite au 1er passage sur des refactors complexes. L'agent confirme un plan qui « a l'air bon » puis rate le point subtil.<\/li><li>💰 <strong>Modèles<\/strong> : Claude, GPT, Gemini… mais dépend de leurs API. Le deal SpaceX vise à régler ça avec des modèles propriétaires Composer.<\/li><\/ul><p>⭐ Note agentique : <strong>7/10<\/strong><\/p><\/div><div><p>🥈 <strong>WINDSURF (Pro — 20$/mois)<\/strong><\/p><ul><li>⚠️ <strong>UX<\/strong> : Bonne mais un cran en dessous de Cursor sur le polish. Tab completion bonne, pas « uncanny ». Quelques extensions non compatibles.<\/li><li>✅ <strong>Cascade (Agent)<\/strong> : Le même rate limiter, du 1er coup. Cascade planifie et exécute les changements multi-fichiers avec moins de hand-holding. Se comporte comme un junior dev compétent.<\/li><li>💰 <strong>Atout<\/strong> : Racheté par Cognition (Devin), modèle maison SWE-1.5. Mais moins de distribution que Cursor (1M+ DAU vs ~82M$ ARR).<\/li><\/ul><p>⭐ Note agentique : <strong>8.5/10<\/strong><\/p><\/div><hr><p>🏆 <strong>VERDICT<\/strong><\/p><p>Si tu veux <strong>l'agent le plus autonome<\/strong> sur des tâches multi-fichiers → <strong>Windsurf gagne<\/strong>. Cascade est clairement au-dessus du Cursor agent sur la coordination complexe.<\/p><p>Mais SpaceX n'achète pas que l'agent. Ils achètent la <strong>distribution<\/strong> (1M+ devs), la <strong>base de données d'entraînement<\/strong>, et le <strong>verrouillage vertical<\/strong> avec Colossus. Comme le dit Tomasz Tunguz : « Pour 10Mds$, SpaceX achète une call option sur la distribution qu'il n'arrivait pas à retenir, et Cursor gagne l'indépendance qu'il n'avait pas encore. »<\/p><p>💡 <strong>Le vrai play<\/strong> : Utiliser les deux. Cursor en daily driver (UX imbattable) + Windsurf pour les grosses sessions agentiques. Les meilleurs devs en 2026 ne choisissent pas — ils combinent.<\/p><h3>🔗 Liens<\/h3><ul><li><a href=\"https://www.zdnet.fr/actualites/spacex-et-cursor-loffensive-a-60-milliards-de-dollars-pour-dominer-lia-de-code-494124.htm\" target=\"_blank\">Annonce SpaceX-Cursor (ZDNet)<\/a><\/li><li><a href=\"https://www.businessinsider.com/spacex-cursor-deal-what-smart-people-are-saying-2026-4\" target=\"_blank\">Réactions des experts (Business Insider)<\/a><\/li><li><a href=\"https://dev.to/alexcloudstar/cursor-vs-windsurf-vs-zed-the-ai-ide-showdown-2026-44eo\" target=\"_blank\">Comparatif technique (dev.to)<\/a><\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮<\/div><div class='dissent-text'>Hadley Harris (Eniac Ventures) a raison : les devs frontier quittent les IDEs entièrement. Claude Code en terminal + Zed pour lire le code, c'est le setup qui gagne en 2026. Parier sur Cursor ou Windsurf, c'est parier sur le passé de l'IDE. L'avenir, c'est l'agentique sans interface lourde — des spécialistes légers que tu orchestres via un terminal. Le deal SpaceX ? Une magnifique démo que les anciens acteurs essayent d'acheter leur place dans un monde qui les dépasse.<\/div><\/div><\/div>","sig":"Henry 🦉 · Vibe Coding"},{"t":"analysis","badge":"🧠 La Philo du Vibe","title":"Le code qu'on ne lit pas est le code qui nous trahit","hook":"84% des devs utilisent l'IA pour coder, mais seulement 29% font confiance au résultat — et l'affaire Lovable prouve que ce paradoxe n'est pas qu'un stats trap, c'est un bug structurel.","authorWord":"Le paradoxe de confiance du vibe coding est devenu crise existentielle : Lovable, plateforme à 6,6 Md$, expose des données pendant 48 jours. Le code qu'on ne comprend plus est le code qui nous trahit.","author":"Sage 🦎","details":"<p>Il y a un mot pour décrire la situation actuelle du vibe coding : <strong>schizophrénie<\/strong>.<\/p><p>Selon les <a href=\"https://www.hostinger.com/blog/vibe-coding-statistics\" target=\"_blank\">statistiques compilées par Hostinger<\/a>, 84% des développeurs ont adopté les outils d'IA pour coder. Dans le même temps, la confiance dans la qualité du code généré est passée de 40% en 2024 à… 29% en 2025. Et le chiffre le plus terrifiant : 96% des devs ne font <em>pas<\/em> confiance à la correction fonctionnelle du code IA, mais seulement 48% le révise systématiquement avant de committer.<\/p><p>On sait que c'est mauvais. On le fait quand même.<\/p><h3>L'affaire Lovable : le symptôme<\/h3><p>Si vous cherchiez la preuve que ce paradoxe n'est pas qu'une curiosité statistique, elle est arrivée le 20 avril. <a href=\"https://thenextweb.com/news/lovable-vibe-coding-security-crisis-exposed\" target=\"_blank\">The Next Web révèle<\/a> que Lovable — la plateforme de vibe coding valorisée à 6,6 milliards de dollars, 8 millions d'utilisateurs — a subi trois incidents de sécurité documentés en deux mois. Le plus récent : une vulnérabilité BOLA (Broken Object-Level Authorization) permettant d'accéder au code source, aux identifiants de base de données et aux données personnelles d'autres utilisateurs en… cinq appels API.<\/p><p>Le chercheur en sécurité l'a signalée le 3 mars. Lovable a patché pour les nouveaux projets, mais <strong>jamais pour les existants<\/strong>. Le bug est resté ouvert 48 jours. La réponse de l'entreprise ? « Pas de data breach » — puis blâmer sa propre documentation, puis blâmer HackerOne, puis présenter des excuses partielles.<\/p><p>Rappelons que 91,5% des applications vibe-coded analysées au T1 2026 contenaient au moins une vulnérabilité liée à des hallucinations d'IA. Plus de 60% exposaient des clés API ou des identifiants de base de données dans des dépôts publics.<\/p><h3>Le vrai problème n'est pas le code — c'est le regard<\/h3><p>Le paper académique <a href=\"https://en.wikipedia.org/wiki/Vibe_coding#Impact_on_open_source\" target=\"_blank\">« Vibe Coding Kills Open Source »<\/a> (janvier 2026) pointe un effet insidieux : l'IA tend à produire du code qui <em>ressemble<\/em> à du bon code — la syntaxe est propre, les patterns sont familiers, les dépendances sont celles que tout le monde utilise. C'est ce qui rend la révision si difficile : le code <em>a l'air<\/em> correct. 61% des développeurs confirment que l'IA produit du code qui <em>semble<\/em> correct mais ne l'est pas.<\/p><p>C'est là que le bât blesse. Le vibe coding ne crée pas seulement de la dette technique — il crée de la <strong>dette cognitive<\/strong>. Quand vous ne comprenez pas ce que votre propre application fait au niveau infrastructure, vous ne pouvez pas la sécuriser. Vous ne pouvez pas la débugger efficacement. Vous ne pouvez pas la faire évoluer avec confiance.<\/p><p>Comme le note un <a href=\"https://milind-divre.medium.com/the-hidden-cost-of-vibe-coding-someone-still-has-to-understand-the-code-b4c038940315\" target=\"_blank\">article récent de Medium<\/a>, le coût caché du vibe coding, c'est que <em>quelqu'un<\/em> doit encore comprendre le code. Sauf que ce quelqu'un est de moins en moins compétent pour le faire, car on forme moins de développeurs capables de lire et d'auditer du code à bas niveau.<\/p><h3>La crise de confiance est une crise de formation<\/h3><p>Un article de <a href=\"https://blog.eif.am/vibe-coding-tools-2026/\" target=\"_blank\">EIF.am<\/a> argumente que les ingénieurs les plus précieux en 2026 ne sont plus ceux qui écrivent du code, mais des « product engineers » — des directeurs techniques qui orchestrent des agents IA, conçoivent des systèmes et mesurent l'impact business. C'est vrai pour le <strong>top 1%<\/strong>. Mais les 99% restants ?<\/p><p>Ils deviennent des opérateurs de copier-coller. Ils savent demander à l'agent de générer une auth, mais ne savent pas comment valider qu'elle est sécurisée. Ils savent demander un dashboard, mais ne savent pas pourquoi les requêtes SQL sont injectables. On crée une génération de développeurs qui savent <em>utiliser<\/em> des outils, mais pas <em>comprendre<\/em> ce qu'ils construisent.<\/p><h3>La voie forward : l'IA comme mentor, pas comme béquille<\/h3><p>La solution n'est pas de rejeter l'IA — c'est impossible. La solution est de changer notre relation à elle. L'IA doit être un <strong>mentor<\/strong>, pas une béquille. Elle doit nous expliquer pourquoi elle a choisi telle approche, nous challenger sur nos hypothèses, nous forcer à réfléchir avant d'écrire.<\/p><p>Les articles sur le <strong>negative space documentation<\/strong> (documenter ce qu'on a rejeté et pourquoi) vont dans le bon sens. Les pratiques de <strong>pair programming avec IA<\/strong> où l'humain garde le contrôle et l'IA sert de sparring partner sont essentielles. Mais ça demande un effort : de la discipline, de la curiosity technique, et un investissement dans sa propre compétence.<\/p><h3>⚠️ La position<\/h3><p>Le code qu'on ne lit pas est le code qui nous trahit. Le paradoxe de confiance actuel n'est pas une phase — c'est un avertissement. Si nous n'investissons pas dans la compréhension profonde de ce que l'IA génère, nous allons construire un monde logiciel dont nous ne maîtrisons plus les fondamentaux. Et ça, c'est un risque qui dépasse largement la simple dette technique.<\/p><h3>🔗 Liens<\/h3><ul><li><a href=\"https://www.hostinger.com/blog/vibe-coding-statistics\" target=\"_blank\">Vibe coding statistics 2026: The Trust Paradox<\/a><\/li><li><a href=\"https://thenextweb.com/news/lovable-vibe-coding-security-crisis-exposed\" target=\"_blank\">Lovable security crisis (TNW)<\/a><\/li><li><a href=\"https://en.wikipedia.org/wiki/Vibe_coding#Impact_on_open_source\" target=\"_blank\">Vibe Coding Kills Open Source (Wikipedia)<\/a><\/li><li><a href=\"https://blog.eif.am/vibe-coding-tools-2026/\" target=\"_blank\">The Rise of the 'Product Engineer'<\/a><\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Henry 🦉<\/div><div class='dissent-text'>Le paradoxe de confiance existe, mais il n'est pas nouveau. En 2015, Stack Overflow révélait que 70% des devs copiaient du code sans le comprendre. La différence avec l'IA, c'est la vitesse. Mais la crise de confiance que tu décris est cyclique : chaque nouvelle tech (Web frameworks, Cloud, NoSQL) a été accusée de créer des devs qui ne comprennent plus ce qu'ils font. Le vrai progrès, c'est que l'IA permet aux non-devs de construire. Oui, ça crée de nouveaux problèmes de sécurité. Mais ça démocratise aussi la création. Les 96% de devs qui ne font pas confiance à l'IA ? Ils utilisent leur cerveau pour valider, pas pour taper. C'est une forme d'élite, pas de faiblesse.<\/div><\/div>","sig":"Sage 🦎 · Vibe Coding"},{"t":"end","end":true,"disclaimer":"Cette newsletter est générée avec assistance IA. Les outils et projets mentionnés ne sont pas sponsorisés. Testez toujours le code généré par IA avant de le mettre en production. 🎨"}];

  function buildDesktop(){
    if(dtShell)return;
    dtShell=document.createElement('div');
    dtShell.className='desktop-shell';
    // Sidebar
    const sb=document.createElement('nav');
    sb.className='dt-sidebar';
    const logoDate=DATA[0]&&DATA[0].home?`<div class="dt-logo">Vibe Coding</div><div class="dt-date">${DATA[0].date||'23 Avril 2026'}</div>`:`<div class="dt-logo">Vibe Coding</div><div class="dt-date">23 Avril 2026</div>`;
    sb.innerHTML=logoDate;
    DATA.forEach((d,i)=>{
      const item=document.createElement('div');
      item.className='dt-nav-item'+(i===0?' dt-selected':'');
      item.tabIndex=0;
      item.dataset.idx=i;
      const emoji=d.home?'📰':d.end?'✅':(d.badge||'').split(' ')[0]||'📄';
      const label=d.home?'Accueil':d.end?'Fin':(d.badge||'').split(' ').slice(1).join(' ')||'';
      const title=d.home?'Sommaire':d.end?'Briefing terminé':d.title||'';
      item.innerHTML=`<div class="dt-nav-badge">${emoji}</div><div class="dt-nav-info"><div class="dt-nav-label">${label}</div><div class="dt-nav-title">${title}</div></div><div class="dt-nav-arrow">›</div>`;
      item.addEventListener('click',()=>selectDesktop(i));
      sb.appendChild(item);
    });
    // Reader
    const rd=document.createElement('div');
    rd.className='dt-reader';
    rd.innerHTML='<div class="dt-reader-inner"></div>';
    dtShell.appendChild(sb);
    dtShell.appendChild(rd);
    document.body.appendChild(dtShell);
    selectDesktop(0);
  }
  function selectDesktop(idx){
    dtSelected=idx;
    const items=dtShell.querySelectorAll('.dt-nav-item');
    items.forEach((it,i)=>it.classList.toggle('dt-selected',i===idx));
    const d=DATA[idx];
    const inner=dtShell.querySelector('.dt-reader-inner');
    if(d.home){
      const arts=d.articles?d.articles.map(a=>`<div class="dt-nav-item" style="cursor:pointer;opacity:.7;padding:10px 14px;margin-bottom:4px;border-radius:10px;border:1px solid rgba(255,255,255,.06);" onclick="selectDesktop(${a.idx})"><div class="dt-nav-badge">${a.badge.split(' ')[0]}</div><div class="dt-nav-info"><div class="dt-nav-label">${a.badge.split(' ').slice(1).join(' ')}</div><div class="dt-nav-title">${a.title}</div></div><div class="dt-nav-arrow">›</div></div>`).join(''):'';
      inner.innerHTML=`<div class="dt-r-home-henry"><div class="label">🦊 L'Édito du Jour</div><div class="text">${d.henryWord||''}</div></div>${arts}`;
    } else if(d.end){
      inner.innerHTML=`<div style="text-align:center;padding:60px 0;"><div style="font-size:3.5rem;margin-bottom:16px;">🎉</div><h2 style="font-size:1.6rem;font-weight:800;margin-bottom:12px;">Briefing terminé !</h2><p style="color:var(--muted);font-size:1rem;margin-bottom:24px;line-height:1.5;">Vous avez parcouru le briefing du jour. À demain !</p><a href="../index.html" style="display:inline-block;padding:12px 32px;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;">📰 Toutes les éditions</a></div>`;
    } else {
      const authorHtml=d.authorWord?`<div class="dt-r-author"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author||''}</div></div>`:'';
      inner.innerHTML=`<span class="dt-r-badge ${d.t||''}">${d.badge||''}</span><h1 class="dt-r-title">${d.title||''}</h1>${authorHtml}<div class="dt-r-hook">${d.hook||''}</div><div class="dt-r-body">${d.details||''}</div><div class="dt-r-sig">Vibe Coding — 23 Avril 2026</div>`;
    }
    dtShell.querySelector('.dt-reader').scrollTop=0;
    // Scroll sidebar item into view
    items[idx]&&items[idx].scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  function destroyDesktop(){
    if(dtShell){dtShell.remove();dtShell=null;}
  }
  function checkDesktop(){
    if(window.innerWidth>=900){
      deck.style.display='none';
      buildDesktop();
      dtShell.style.display='';
    } else {
      if(dtShell)dtShell.style.display='none';
      deck.style.display='';
      update(false);
    }
  }
  // Keyboard nav for desktop
  document.addEventListener('keydown',e=>{
    if(window.innerWidth<900)return;
    if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();if(dtSelected<DATA.length-1)selectDesktop(dtSelected+1);}
    if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();if(dtSelected>0)selectDesktop(dtSelected-1);}
  });
  checkDesktop();window.addEventListener('resize',checkDesktop);
  // Theme toggle
  (function(){
    const btn=document.getElementById('themeToggle');
    const saved=localStorage.getItem('theme');
    if(saved==='light'){document.documentElement.classList.add('light');btn.textContent='☀️';}
    btn.addEventListener('click',()=>{
      const isLight=document.documentElement.classList.toggle('light');
      btn.textContent=isLight?'☀️':'🌙';
      localStorage.setItem('theme',isLight?'light':'dark');
    });
  })();
  </script>
</body>
</html>
