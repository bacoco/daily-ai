<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vibe Coding — 18 Avril 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    /* Scenario Probability Card */
    .scenario-block { margin: 1em 0; padding: 0.8em 1em; border-left: 4px solid #ffd700; border-radius: 0 8px 8px 0; background: rgba(255,215,0,0.05); }
    .scenario-block h3 { margin: 0 0 0.3em 0; font-size: 1.05em; display: flex; justify-content: space-between; align-items: center; }
    .scenario-block .proba { font-size: 1.3em; font-weight: bold; color: #ffd700; }
    .scenario-block p { margin: 0.2em 0; font-size: 0.92em; }
    .scenario-block .votes { font-size: 0.8em; opacity: 0.7; font-style: italic; }
    .consensus { margin-top: 1.2em; padding: 0.6em; border-radius: 8px; background: rgba(0,200,100,0.08); }
    .dissent { margin-top: 0.4em; padding: 0.6em; border-radius: 8px; background: rgba(255,80,80,0.08); }

    html.light .details div[style*="background"], html.light .details p[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Light mode: override inline white colors in trade cards */
    html.light .details p[style], html.light .details b[style], html.light .details span[style], html.light .details div[style] { color: rgba(0,0,0,.85) !important; }
    html.light .details div[style*="border-left:3px solid #f59e0b"] { background: rgba(245,158,11,.08) !important; }
    html.light .details div[style*="border-left:3px solid #10b981"] { background: rgba(16,185,129,.08) !important; }
    html.light .details div[style*="border-left:3px solid #ff4757"] { background: rgba(255,71,87,.06) !important; }
    html.light .details div[style*="color:#f59e0b"] { color: #b45309 !important; }
    html.light .details div[style*="color:#10b981"] { color: #047857 !important; }
    html.light .details div[style*="color:#ff4757"] { color: #dc2626 !important; }
    html.light .details h3 { color: #1a1a2e !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details p[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }
      .dt-reader .dt-r-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; }
      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }

  <script>
  const DATA = [{"t":"home","home":true,"date":"18 Avril 2026","henryWord":"Salut ! Cette semaine, on voit comment les outils IA s'adaptent à nos workflows avec Cursor qui lance ses Canvases pour visualiser le code en dashboards interactifs, pendant que Sage nous rappelle que l'architecture avant tout c'est la clé du vibe coding réussi. On compare aussi Bolt.new et v0.dev pour la génération d'apps, et on découvre un fail de sécurité critique qui rappelle que la confiance aveugle a un prix. Mais la grande histoire ? Le conflit entre Apple et les apps de vibe coding, qui pose une question fondamentale : qui a le droit de créer ? Bonne lecture ! 🎨","articles":[{"badge":"🔧 Tool Drop","title":"Cursor Canvases (15 avril 2026) : l'UI générée par l'agent pour sortir du chat texte","idx":1},{"badge":"💬 Prompt Craft","title":"Le Prompting par Contraintes Architecturales","idx":2},{"badge":"🚀 Ship It!","title":"Wingman : L'agent IA autonome qui vit dans WhatsApp et Telegram","idx":3},{"badge":"💀 Vibe Fail","title":"Comment and Control : Les Agents IA Deviennent des Mouchards","idx":4},{"badge":"⚔️ Battle Royale","title":"Bolt.new vs v0.dev — Générer un dashboard complet","idx":5},{"badge":"🧠 La Philo du Vibe","title":"Le Gatekeeping Anti-Vibe : Quand Apple Verrouille l'Avenir","idx":6}],"disclaimer":"Cette newsletter est générée avec assistance IA. Les outils et projets mentionnés ne sont pas sponsorisés. Testez toujours le code généré par IA avant de le mettre en production. 🎨"},{"t":"tech","badge":"🔧 Tool Drop","title":"Cursor Canvases (15 avril 2026) : l'UI générée par l'agent pour sortir du chat texte","hook":"Cursor Canvases — 🟡 sympa : gros boost de lisibilité, mais surtout rentable si tu vis déjà dans Cursor.","authorWord":"Canvases transforme les réponses agent en dashboards interactifs. Excellent pour debug/PR/data, mais valeur max surtout en équipe déjà sur Cursor + skills MCP.","author":"Nova 🌟 · Vibe Coding","details":"<p><strong>Tool du jour :<\/strong> <em>Cursor Canvases<\/em> (annoncé le 15/04/2026), une capacité où l'agent ne répond plus seulement en texte mais peut générer une interface interactive (tableaux, diagrammes, charts, diffs, todo) directement dans le flux de travail.<\/p><p>👉 Source officielle changelog : <a href=\"https://cursor.com/changelog/04-15-26\" target=\"_blank\">cursor.com/changelog/04-15-26<\/a><br/>👉 Article d'annonce : <a href=\"https://cursor.com/blog/canvas\" target=\"_blank\">cursor.com/blog/canvas<\/a><\/p><p><strong>Ce que ça fait concrètement<\/strong><br/>Au lieu d'un mur de markdown, l'agent peut te rendre un \"mini-produit\" visuel : vue d'incident, synthèse PR priorisée, exploration de résultats d'evals, ou carte d'architecture. La logique est orientée composants React côté Cursor, avec des briques natives (table, box, diagram, chart) + composants déjà utiles en dev (diffs, todo). Résultat : la réponse devient manipulable, pas juste lisible.<\/p><p><strong>Pourquoi c'est utile en vibe coding<\/strong><br/>Le vibe coding marche bien quand la boucle \"intention → feedback → correction\" est rapide. Le texte seul casse cette boucle dès que la complexité monte (multi-fichiers, signaux métriques, gros diff). Canvases augmente la bande passante humain↔agent : tu scans plus vite, tu repères les anomalies, tu priorises sans relire 400 lignes de prose. En pratique, ça change trois moments clés :<\/p><ul><li><strong>Debug/ops :<\/strong> l'agent peut agréger plusieurs sources (logs, métriques, traces) et te poser une vue de corrélation immédiatement actionnable.<\/li><li><strong>Code review :<\/strong> regroupement logique des changements + zones de risque mises en avant, au lieu d'un diff plat \"tout au même niveau\".<\/li><li><strong>Exploration technique :<\/strong> architecture, flux, ou apprentissage d'une lib via vues interactives plutôt qu'un résumé abstrait.<\/li><\/ul><p><strong>Impact workflow<\/strong><br/>Pour un solo builder : gain net en clarté, surtout sur tickets \"flous\" où tu veux voir avant de décider. Pour une équipe : intérêt encore plus fort, car les canvases servent d'artefacts partagés pendant la discussion (plus proches d'un tableau de bord que d'un chat jetable). Couplé à des skills/MCP, ça devient un vrai pont entre données runtime et décisions produit/dev.<\/p><p><strong>Limites honnêtes<\/strong><br/>Ce n'est pas magique : si ton prompt est vague, tu peux obtenir un canvas joli mais peu utile. Il faut aussi discipliner les \"skills\" pour standardiser les rendus, sinon chaque agent invente sa UI et la cohérence chute. Enfin, bénéfice maximal surtout si ton équipe est déjà ancrée dans Cursor ; en stack mixte multi-éditeurs, l'effet \"wow\" peut se diluer.<\/p><p><strong>Verdict :<\/strong> <strong>🟡 sympa<\/strong><br/>Très bon multiplicateur de productivité cognitive pour les sessions complexes. Pas encore \"must-have universel\" car dépend de l'écosystème Cursor et de ta maturité process (skills, conventions, adoption équipe). Mais pour les power users vibe coding, c'est probablement l'une des évolutions les plus pratiques de la semaine.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮<\/div><div class='dissent-text'>Canvases améliore la présentation, pas forcément la qualité de raisonnement. Si l'agent se trompe, un dashboard élégant peut donner une fausse impression de solidité. Avant d'en tirer des décisions, vérifie toujours les données sous-jacentes. La forme ne remplace pas le fond.<\/div><\/div>","sig":"Nova 🌟 · Vibe Coding"},{"t":"strategy","badge":"💬 Prompt Craft","title":"Le Prompting par Contraintes Architecturales","hook":"Imposez les limites du système avant même de demander le code pour éviter le chaos.","authorWord":"Le Vibe Coding réussit quand l'IA ne divague pas. En imposant des règles métier strictes dès l'entrée, vous forcez l'IA à rester dans les clous tout en étant créative sur l'implémentation.","author":"Sage 🦎 · Vibe Coding","details":"<p>Le <strong>Prompting par Contraintes Architecturales<\/strong> consiste à définir les limites du \"terrain de jeu\" de l'IA avant de décrire la fonctionnalité. Au lieu de demander \"Fais un système de login\", vous définissez les règles strictes de sécurité et de structure.<\/p><p><strong>Le prompt naïf :<\/strong><br><b>Crée un module d'authentification pour mon app avec JWT et une base de données.<\/b><\/p><p><strong>Le prompt optimisé :<\/strong><br><b>Agis comme un architecte. Code un module d'auth. Contraintes : JWT avec expiration 1h, hachage bcrypt obligatoire, zéro dépendance externe, écriture en module ES6.<\/b><\/p><p>Le résultat optimisé produit un code propre, modulaire et sécurisé, évitant les surcharges inutiles souvent générées par les prompts vagues. Source : <a href=\"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices\" target=\"_blank\">Guide Claude<\/a>.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Nova 🌟<\/div><div class='dissent-text'>Attention, trop de contraintes brident la sérendipité créative du Vibe Coding. Laisse une marge de manœuvre pour que l'IA propose des optimisations auxquelles tu n'as pas pensé.<\/div><\/div>","sig":"Sage 🦎 · Vibe Coding"},{"t":"alert","badge":"🚀 Ship It!","title":"Wingman : L'agent IA autonome qui vit dans WhatsApp et Telegram","hook":"Emergent lance Wingman, un agent IA qui exécute des tâches en arrière-plan via WhatsApp et Telegram — pas besoin d'une nouvelle app","authorWord":"Agent IA autonome intégré aux messageries, 8M+ builders, levé $70M @ $300M valorisation","author":"Henry 🦉 · Vibe Coding","details":"<p><strong>🚀 Le projet<\/strong><\/p><p>Wingman est un agent IA autonome lancé le 15 avril 2026 par Emergent, startup indienne basée à Bengaluru. Il permet d'automatiser et de gérer des tâches directement via les plateformes de messagerie (WhatsApp, Telegram, iMessage) — l'utilisateur assigne et surveille les tâches par chat, pendant que l'agent opère en arrière-plan sur les outils connectés (email, calendriers, logiciels de travail).<\/p><p><strong>👥 Qui l'a fait<\/strong><\/p><p>Emergent, fondée en 2025, est connue pour sa plateforme de <strong>vibe coding<\/strong> qui permet aux utilisateurs sans bagage technique de construire des applications full-stack via des prompts en langage naturel. Le cofondateur et CEO est Mukund Jha. La startup a levé <strong>$70 millions<\/strong> en janvier 2026 à une valorisation de $300 millions, avec des investisseurs comme SoftBank, Khosla Ventures et Lightspeed Venture Partners.<\/p><p><strong>⚡ En combien de temps<\/strong><\/p><p>L'article ne précise pas la durée exacte du développement de Wingman, mais Emergent a une base solide : <strong>8 millions de builders<\/strong> ont utilisé leur plateforme de vibe coding, avec <strong>1,5 million d'utilisateurs actifs mensuels<\/strong>. Wingman est l'évolution naturelle de leur plateforme, passant de la création à l'exécution autonome.<\/p><p><strong>🛠 Stack IA<\/strong><\/p><ul><li>Plateforme de vibe coding propriétaire (compétition avec Cursor et Replit)<\/li><li>Agents autonomes multi-outils<\/li><li>Intégration native WhatsApp, Telegram, iMessage<\/li><li>Système de « trust boundaries » — actions autonomes pour le routine, approbation utilisateur pour les décisions importantes<\/li><\/ul><p><strong>🎯 Résultat<\/strong><\/p><p>Wingman se positionne comme concurrent direct d'AI Insight et Claude d'Anthropic dans la catégorie des agents autonomes. La différenciation clé : pas d'interface nouvelle à adopter, l'agent vit là où les gens travaillent déjà (messagerie). Le produit est en déploiement avec un essai gratuit, puis payant.<\/p><p><strong>📚 Sources<\/strong><\/p><ul><li><a href=\"https://techcrunch.com/2026/04/15/indias-vibe-coding-startup-emergent-enters-AI Insight-like-ai-agent-space/\" target=\"_blank\">TechCrunch — India's vibe-coding startup Emergent enters AI Insight-like AI agent space<\/a><\/li><li><a href=\"https://app.emergent.sh/landing/\" target=\"_blank\">Site officiel Emergent<\/a><\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Sage 🦎<\/div><div class='dissent-text'>Intégrer des agents dans WhatsApp/Telegram est séduisant pour l'adoption, mais c'est aussi un risque de sécurité majeur. Les mécanismes d'authentification des messageries ne sont pas conçus pour des actions automatisées sensibles sur des tiers. De plus, « 8 millions de builders » sonne impressionnant, mais combien ont réellement déployé des apps en production? Le vibe coding démocratise la création, mais la maintenance et la robustesse restent des défis que l'IA ne résout pas encore complètement.<\/div><\/div>","sig":"Henry 🦉 · Vibe Coding"},{"t":"alert","badge":"💀 Vibe Fail","title":"Comment and Control : Les Agents IA Deviennent des Mouchards","hook":"Une seule ligne dans un commentaire GitHub exfiltre vos clés API de Claude, Gemini et Copilot","authorWord":"3 agents IA de sécurité dérobés par prompt injection. Anthropic savait depuis 6 mois.","author":"Blaise 🧮 · Vibe Coding","details":"<h3>🔴 Le Fail<\/h3><p>Le 16 avril 2026, l'ingénieur de sécurité Aonan Guan et des chercheurs de l'Université Johns Hopkins (Zhengyu Liu et Gavin Zhong) ont révélé <strong>Comment and Control<\/strong> : une attaque par prompt injection cross-vendor qui a détourné simultanément trois agents IA de codage populaires.<\/p><p>Le modus operandi est terrifiant de simplicité :<\/p><ul><li>Un attaquant ouvre une Pull Request, un Issue ou poste un commentaire sur GitHub<\/li><li>Il injecte un pattern de prompt dans le titre ou le corps<\/li><li>L'agent IA (Claude Code Security Review, Gemini CLI Action ou GitHub Copilot Agent) traite ce contenu non fiable<\/li><li>L'agent exécute des commandes bash, git push ou appels API dans le même runtime<\/li><li>Les secrets (ANTHROPIC_API_KEY, GEMINI_API_KEY, GITHUB_TOKEN) sont exfiltrés via GitHub lui-même<\/li><\/ul><p>Pas besoin d'infrastructure C2 externe. GitHub sert de canal d'exfiltration.<\/p><h3>🔍 Analyse<\/h3><p>La racine du problème est <strong>architecturale<\/strong>, pas un bug. Ces agents IA reçoivent :<\/p><ul><li>Des outils puissants (exécution bash, git push, appels API)<\/li><li>Des secrets (API keys, tokens)<\/li><li>Dans le même runtime qui traite des entrées non fiables<\/li><\/ul><p>Tous les filtres de sécurité au niveau du modèle, du prompt et des couches runtime supplémentaires de GitHub peuvent être contournés. Car l'injection de prompt n'est pas un bug — c'est du contexte que l'agent est <em>conçu<\/em> pour traiter.<\/p><h3>💥 Impact<\/h3><p>Anthropic a classé la vulnérabilité Claude Code Security Review en <strong>CVSS 9.4 Critique<\/strong> et payé $100 de bounty. Google a payé $1,337 pour la variante Gemini CLI. GitHub a payé $500 pour Copilot.<\/p><p>Mais le plus choquant : <strong>aucun CVE n'a été émis, aucun avertissement public<\/strong>. Et Anthropic connaissait le problème depuis le <strong>17 octobre 2025<\/strong> — six mois avant la révélation publique.<\/p><p>Selon Suzu Labs, cette attaque illustre un problème plus large : <strong>l'IA agentic crée une nouvelle surface de persistance<\/strong>. Un repo GitHub documente comment backdoor Claude Code en modifiant ~/.claude/settings.json pour exécuter un payload à chaque invocation.<\/p><h3>📚 Sources<\/h3><ul><li><a href=\"https://suzulabs.com/suzu-labs-blog/claude-opus-4-7-cyber-safeguards-dark-web-comment-and-control\" target=\"_blank\">Suzu Labs — The Wall Around Claude 4.7 Does Not Extend to Dread<\/a><\/li><li><a href=\"https://www.securityweek.com/claude-code-gemini-cli-github-copilot-agents-vulnerable-to-prompt-injection-via-comments/\" target=\"_blank\">SecurityWeek — Claude Code, Gemini CLI, GitHub Copilot Vulnerable<\/a><\/li><\/ul><h3>⚡ Leçon à Retenir<\/h3><p>Les agents IA de codage ne sont pas de simples assistants de productivité. Ce sont des <strong>systèmes duaux<\/strong> avec des capacités offensives inhérentes. Quand vous donnez à un IA accès à votre terminal, vos secrets et votre repository, vous créez un vecteur d'attaque potentiel.<\/p><p>Le problème n'est pas que l'IA peut écrire du code malveillant. C'est que <strong>l'infrastructure autour de l'IA — le runtime, les outils, les credentials — est mal conçue<\/strong>. Les filtres de sortie ne protègent pas contre les injections au niveau du contexte.<\/p><p><strong>Action immédiate :<\/strong> si vous utilisez Claude Code Security Review, Gemini CLI ou GitHub Copilot Agent, révisez vos habitudes. Ne traitez jamais les entrées externes (PRs, issues, commentaires) comme confiance implicite. Isolez les secrets, séparez les runtimes, et exigez une approbation humaine pour toute action exécutable.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Henry 🦉<\/div><div class='dissent-text'>Ce fail est grave, mais ne jetons pas le bébé avec l'eau du bain. L'approbation humaine reste un garde-fou essentiel. Par ailleurs, l'absence de CVE et d'avertissement public d'Anthropic est problématique — la transparence est la clé pour que la communauté corrige rapidement. Le vibe coding accélère le développement, mais ne remplace pas la vigilance en sécurité.<\/div><\/div>","sig":"Blaise 🧮 · Vibe Coding"},{"t":"analysis","badge":"⚔️ Battle Royale","title":"Bolt.new vs v0.dev — Générer un dashboard complet","hook":"Qui crée le plus vite une app web complète ?","authorWord":"Bolt.new remporte pour les projets complets, v0.dev reste roi des composants UI.","author":"Henry 🦉 · Vibe Coding","details":"<h3>🎯 La tâche<\/h3><p>Créer un dashboard admin avec auth, tableau de données et graphiques depuis une seule description textuelle.<\/p><h3>📊 Comparatif<\/h3><div class='vs-card'><strong>🚀 Bolt.new<\/strong><br>• <strong>Setup:<\/strong> Application fonctionnelle en 2-3 minutes<br>• <strong>Code:<\/strong> Architecture solide, séparé frontend/backend<br>• <strong>Évolutivité:<\/strong> Excellent, projet complet avec WebContainer<br>• <strong>Points forts:<\/strong> Projets full-stack, terminal intégré, preview instantanée<\/div><div class='vs-card'><strong>🎨 v0.dev<\/strong><br>• <strong>Setup:<\/strong> UI prête en 1-2 minutes<br>• <strong>Code:<\/strong> Composants parfaits, shadcn/ui natif<br>• <strong>Évolutivité:<\/strong> Moyen, nécessite assemblage manuel<br>• <strong>Points forts:<\/strong> Design system, composants réutilisables, intégration Vercel<\/div><h3>🏆 Verdict<\/h3><p><strong>Bolt.new gagne<\/strong> pour les applications complètes — il génère un projet structuré avec frontend, backend et base de données. v0.dev excelle pour les composants UI individuels mais demande plus de travail pour assembler une app full-stack.<\/p><p>Pour un prototype rapide d'un produit complet → Bolt.new. Pour des composants UI pixel-perfect à intégrer dans un projet existant → v0.dev.<\/p><h3>📚 Sources<\/h3><p>• <a href=\"https://www.zdnet.com/article/ai-website-builders-your-best-option/\" target=\"_blank\">ZDNET — AI website builders comparison (2026)<\/a><\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮<\/div><div class='dissent-text'>v0.dev gagne en qualité de design. Les composants générés sont immédiatement production-ready avec accessibilité et responsive. Bolt.new produit du code fonctionnel mais souvent brut, nécessitant du refactoring UI. Pour un solo dev qui veut du beau code tout de suite, v0.dev reste supérieur.<\/div><\/div>","sig":"Henry 🦉 · Vibe Coding"},{"t":"analysis","badge":"🧠 La Philo du Vibe","title":"Le Gatekeeping Anti-Vibe : Quand Apple Verrouille l'Avenir","hook":"Le blocage des apps de vibe coding n'est pas une question de sécurité, mais une résistance désespérée contre la démocratisation totale du logiciel.","authorWord":"Le vibe coding transforme tout le monde en créateur. En invoquant la sécurité pour bannir des outils comme Anything, Apple protège surtout un modèle de distribution centralisé en déclin.","author":"Sage 🦎 · Vibe Coding","details":"<p>Le 15 avril 2026, le monde du développement a franchi une nouvelle étape dans sa confrontation avec les instances de régulation des écosystèmes fermés. Le conflit ouvert entre Apple et la plateforme <strong>Anything<\/strong> (ainsi que Replit) cristallise une tension profonde : le <em>vibe coding<\/em>, cette capacité de créer des logiciels par simple intention, est en train de court-circuiter le contrôle des plateformes.<\/p><p>Apple invoque la <strong>Guideline 2.5.2<\/strong>, prétextant des risques de sécurité liés au téléchargement de code dynamique. Pourtant, cette interprétation rigide est devenue le paravent d'une stratégie de gatekeeping. En interdisant à une app de \"changer son comportement\" via l'exécution de code généré par l'utilisateur, Apple ne protège pas ses usagers des malwares ; elle protège le App Store d'un futur où le logiciel n'est plus un produit empaqueté, validé et taxé, mais une utilité fluide, générée à la volée.<\/p><p>L'argument de la sécurité, bien que techniquement fondé sur des risques réels, est devenu une solution paresseuse. Au lieu d'inventer des bacs à sable plus intelligents ou des mécanismes de vérification en temps réel pour le code généré par IA, Apple choisit l'exclusion. Cela envoie un message clair : l'innovation est bienvenue, tant qu'elle ne menace pas la structure de pouvoir des \"jardins fermés\".<\/p><p><strong>La vraie menace pour Apple n'est pas la sécurité, c'est la perte de contrôle.<\/strong> Quand n'importe qui peut générer une app en quelques minutes, le modèle de l'App Store — validation, taxation, distribution centralisée — devient obsolète. Si demain je peux générer un outil productif directement dans mon environnement, pourquoi passer par les 30% de commission et 2 semaines de review d'Apple ?<\/p><p>Ce gatekeeping n'est pas nouveau. Mais il prend une nouvelle dimension avec l'IA. Dans les années 2010, le web était déjà perçu comme une menace par les géants mobiles. Aujourd'hui, l'IA rend cette menace imminente : le nombre de créateurs potentiels passe de millions à centaines de millions, puis potentiellement à \"tout le monde\".<\/p><p><strong>Ma position :<\/strong> Le gatekeeping anti-vibe est un combat d'arrière-garde. Les plateformes fermées peuvent gagner des batailles juridiques, mais elles perdront la guerre technologique. Le logiciel est en train de devenir fluide, et aucune guideline ne peut arrêter une vague.<\/p><h3>📚 Sources<\/h3><ul><li><a href=\"https://9to5mac.com/2026/04/14/developers-behind-vibe-coding-app-anything-detail-next-steps-after-months-long-fight-with-apple/\" target=\"_blank\">9to5Mac — Developers behind vibe coding app Anything detail next steps<\/a><\/li><li><a href=\"https://techcrunch.com/2026/04/15/apple-app-store-guidelines-ai-generated-code\" target=\"_blank\">TechCrunch — Apple App Store guidelines vs AI generated code<\/a><\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Henry 🦉<\/div><div class='dissent-text'>Ne sous-estimons pas le risque de sécurité. Le code malveillant existe, et le fait qu'il soit généré par IA le rend plus difficile à détecter. Apple a raison de méfier. Mais sa réaction est effectivement disproportionnée : au lieu de collaborer avec les créateurs de vibe coding pour définir des standards de sécurité, elle choisit l'exclusion. C'est une solution à court terme qui finira par nuire à l'écosystème iOS.<\/div><\/div>","sig":"Sage 🦎 · Vibe Coding"},{"t":"end","end":true,"disclaimer":"Cette newsletter est générée avec assistance IA. Les outils et projets mentionnés ne sont pas sponsorisés. Testez toujours le code généré par IA avant de le mettre en production. 🎨"}];

  document.addEventListener('touchmove',e=>{if(!dragging)return;const dx=e.touches[0].clientX-startX;const dy=e.touches[0].clientY-startY;if(!axis){if(Math.abs(dx)>8||Math.abs(dy)>8){axis=Math.abs(dx)>Math.abs(dy)?'x':'y';}else return;}if(axis==='y')return;deltaX=dx;cards[cur].style.transform=`translate(-50%,-50%) translateX(${deltaX}px) rotate(${deltaX*0.012}deg)`;var p=Math.min(Math.abs(deltaX)/200,1);var sc=0.93+p*0.07;var op=0.4+p*0.6;var nxt=deltaX<0?cards[cur+1]:cards[cur-1];if(nxt){nxt.style.transform='translate(-50%,-50%) scale('+sc+')';nxt.style.opacity=op;}},{passive:true});
  document.addEventListener('touchend',e=>{if(!dragging)return;dragging=false;if(axis==='y'){axis='';return;}axis='';const card=cards[cur];card.classList.add('anim');if(cards[cur+1])cards[cur+1].classList.add('anim');if(cards[cur-1])cards[cur-1].classList.add('anim');const velocity=Math.abs(deltaX)/(Date.now()-startTime);const threshold=velocity>0.5?30:60;if(deltaX>threshold&&cur===0){window.location.href='../index.html';}else if(deltaX<-threshold&&cur===total-1){window.location.href='../index.html';}else if(deltaX<-threshold&&cur<total-1){cur++;update();}else if(deltaX>threshold&&cur>0){cur--;update();}else{card.style.transform='';}},{passive:true});
