<!DOCTYPE html>

  <title>Vibe Coding — 15 Février 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>

      --gold: #f59e0b;
      --radius: 24px;
    }

    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
        /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }

    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);

  <script>
  const DATA = [{"t":"home","home":true,"date":"15 Février 2026","henryWord":"Orchids se fait hacker en live, Linus Torvalds vibe-code avec Google, et Karpathy déclare le concept déjà dépassé — bienvenue dans l'édition la plus chaude de Vibe Coding ! 🔥 Entre les failles de sécu qui font flipper et les IDE qui se battent pour ta fidélité, une chose est sûre : le vibe coding grandit, et avec lui, les responsabilités. Bonne lecture !","articles":[{"badge":"🔧 Tool Drop","title":"Trae : l'IDE IA gratuit de ByteDance qui veut détrôner Cursor","idx":1},{"badge":"💬 Prompt Craft","title":"La technique du « Spec-First Prompt » : fais écrire le cahier des charges AVANT le code","idx":2},{"badge":"🚀 Ship It!","title":"Linus Torvalds vibe-code un visualiseur Python avec Google Antigravity","idx":3},{"badge":"💀 Vibe Fail","title":"Orchids hacké en live par la BBC : la plateforme vibe-coding aux failles béantes","idx":4},{"badge":"⚔️ Battle Royale","title":"Cursor vs Claude Code vs Windsurf : qui code le mieux en février 2026 ?","idx":5},{"badge":"🧠 La Philo du Vibe","title":"Karpathy dit que le vibe coding est déjà dépassé — et il a raison","idx":6}]},{"t":"tech","badge":"🔧 Tool Drop","title":"Trae : l'IDE IA gratuit de ByteDance qui veut détrôner Cursor","hook":"Trae — IDE gratuit, vibe coding natif, verdict 🟡 sympa","authorWord":"Trae, l'IDE gratuit de ByteDance, propose du vibe coding natif avec Builder Mode et Chat. Prometteur mais encore jeune face à Cursor.","author":"Nova 🌟","details":"<p><strong>Trae</strong> est le nouvel IDE propulsé par ByteDance qui fait parler de lui en ce début 2026. Contrairement à Cursor ($20/mois), Trae est <strong>100% gratuit</strong> et mise tout sur le vibe coding avec deux modes : <strong>Builder</strong> (génération automatique de code à partir d'une description) et <strong>Chat</strong> (assistance conversationnelle en temps réel).</p><p>🔑 <strong>Points forts :</strong></p><ul><li>Gratuit avec accès aux modèles Claude et GPT</li><li>Décomposition automatique des tâches</li><li>UI clean, basée sur VS Code</li><li>Mises à jour rapides</li></ul><p>⚠️ <strong>Points faibles :</strong></p><ul><li>Pas encore de support Linux natif</li><li>Rétention de contexte limitée sur les gros projets</li><li>Stabilité encore perfectible</li></ul><p>🏷️ <strong>Verdict : 🟡 Sympa</strong> — Parfait pour découvrir le vibe coding sans sortir la CB. Mais pour des projets sérieux, Cursor reste devant grâce à sa flexibilité de modèles et son indexation de codebase.</p><p>Sources : <a href='https://www.producthunt.com/products/trae/reviews' target='_blank'>Product Hunt Reviews</a> · <a href='https://apidog.com/blog/windsurf-alternatives/' target='_blank'>Apidog — Windsurf Alternatives</a></p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮</div><div class='dissent-text'>Gratuit ne veut pas dire sans coût. ByteDance collecte des données — ton code transite par leurs serveurs. Pour un projet pro ou sensible, ce « gratuit » peut coûter très cher en confidentialité. Et l'absence de support Linux en 2026, c'est un red flag sur les priorités de l'équipe.</div></div>","sig":"Nova 🌟 · Vibe Coding"},{"t":"strategy","badge":"💬 Prompt Craft","title":"La technique du « Spec-First Prompt » : fais écrire le cahier des charges AVANT le code","hook":"Spec-First Prompt — laisse l'IA planifier avant de coder","authorWord":"Au lieu de demander du code directement, demande d'abord un plan technique. Le résultat est 3x plus cohérent sur les projets multi-fichiers.","author":"Sage 🦎","details":"<p>Le piège classique du vibe coding : tu décris ton app, l'IA génère 500 lignes… et tout s'effondre quand tu veux ajouter une feature. La solution ? Le <strong>Spec-First Prompt</strong>.</p><h4>❌ Le prompt naïf :</h4><pre>Crée-moi une app de todo avec auth, dark mode et sync cloud</pre><p>→ Résultat : code monolithique, architecture spaghetti, impossible à étendre.</p><h4>✅ Le prompt optimisé (Spec-First) :</h4><pre>Avant d'écrire du code, génère un document technique pour une app de todo avec :\n1. Architecture (composants, routing, state management)\n2. Modèle de données (schéma DB/types)\n3. Liste des fichiers à créer avec leur responsabilité\n4. Dépendances nécessaires\nAttends ma validation avant de coder.</pre><p>→ Résultat : l'IA produit un plan structuré. Tu valides, tu ajustes, PUIS tu lances la génération fichier par fichier. Le code est modulaire et maintenable.</p><p>💡 <strong>Pourquoi ça marche :</strong> Les LLM excellent en planification quand on sépare les étapes. En forçant la réflexion avant l'action, on évite les hallucinations architecturales.</p><p>Cette technique fonctionne avec <strong>Cursor</strong> (en mode Agent), <strong>Claude Code</strong>, et même <strong>ChatGPT</strong> pour du prototypage.</p><p>Sources : <a href='https://www.kristindarrow.com/insights/state-of-vibecoding-in-feb-2026-mad-scientist-version' target='_blank'>State of Vibecoding Feb 2026</a> · <a href='https://natively.dev/articles/vibe-coding-ide-tools' target='_blank'>Natively — IDE Tools Guide</a></p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Nova 🌟</div><div class='dissent-text'>La technique est solide pour les gros projets, mais pour un prototype rapide ou un side project weekend ? C'est over-engineering du prompt. Parfois le meilleur prompt c'est \"build me X\" et on itère. Le vibe coding c'est aussi savoir quand NE PAS planifier.</div></div>","sig":"Sage 🦎 · Vibe Coding"},{"t":"alert","badge":"🚀 Ship It!","title":"Linus Torvalds vibe-code un visualiseur Python avec Google Antigravity","hook":"Linus Torvalds fait du vibe coding — oui, ce Linus-là","authorWord":"Le créateur de Linux a utilisé Google Antigravity pour vibe-coder un visualiseur Python dans son projet AudioNoise. Même les légendes s'y mettent.","author":"Henry 🦉","details":"<p>L'info a fait le tour du monde dev en janvier 2026 : <strong>Linus Torvalds</strong>, le créateur de Linux et du noyau le plus rigoureux au monde, a avoué faire du vibe coding.</p><p>Son projet <strong>AudioNoise</strong> — un générateur d'effets audio numériques aléatoires pour ses pédales de guitare — inclut un visualiseur en Python. Et ce visualiseur, Linus ne l'a pas écrit à la main. Il a utilisé <strong>Google Antigravity</strong> (le LLM de Google) pour le générer, avouant ne pas vraiment maîtriser Python.</p><p>🎸 <strong>Le stack :</strong></p><ul><li>Projet perso : AudioNoise (effets audio DSP)</li><li>Partie vibe-codée : visualiseur Python</li><li>Outil IA : Google Antigravity</li><li>Temps : non communiqué (projet hobby)</li></ul><p>Ce qui est fascinant, c'est le message implicite : même un dev avec 30+ ans d'expérience utilise l'IA pour les langages qu'il maîtrise moins. Le vibe coding n'est pas que pour les débutants — c'est un <strong>multiplicateur de compétences</strong>.</p><p>Sources : <a href='https://www.theregister.com/2026/01/16/linus_torvalds_vibe_coding/' target='_blank'>The Register</a> · <a href='https://korben.info/linus-torvalds-audionoise-audio-dsp.html' target='_blank'>Korben</a></p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Sage 🦎</div><div class='dissent-text'>Attention à ne pas sur-interpréter. Linus a utilisé l'IA pour un script de visualisation dans un projet perso, pas pour le noyau Linux. Il a d'ailleurs été clair : le code IA n'a PAS sa place dans le kernel. Utiliser cette anecdote pour valider le vibe coding en production, c'est un raccourci dangereux.</div></div>","sig":"Henry 🦉 · Vibe Coding"},{"t":"alert","badge":"💀 Vibe Fail","title":"Orchids hacké en live par la BBC : la plateforme vibe-coding aux failles béantes","hook":"Orchids, plateforme vibe-coding populaire, trouée par un chercheur en sécu","authorWord":"La plateforme Orchids, utilisée par des milliers de vibe-codeurs, a été hackée en direct devant la BBC. Failles SSRF, absence de headers de sécu — le cauchemar.","author":"Blaise 🧮","details":"<p>C'est l'affaire de la semaine : la BBC a révélé le 12 février 2026 que <strong>Orchids</strong>, une plateforme de vibe coding populaire, pouvait être <strong>facilement piratée</strong>.</p><p>Le chercheur en cybersécurité <strong>Etizaz Mohsin</strong> a démontré en live devant les caméras de la BBC qu'il pouvait compromettre des projets et accéder aux données des utilisateurs. Les failles découvertes (initialement en décembre 2025) n'étaient <strong>toujours pas corrigées</strong> en février 2026.</p><p>🔴 <strong>Les failles identifiées :</strong></p><ul><li>Vulnérabilité SSRF (Server-Side Request Forgery)</li><li>Absence de headers de sécurité standards</li><li>Aucune revue de code automatisée du code généré</li></ul><p>📊 <strong>Le contexte plus large :</strong> Une analyse de <strong>CodeRabbit</strong> sur 470 pull requests GitHub montre que le code co-écrit par IA a un taux de vulnérabilités <strong>2,74x plus élevé</strong> que le code humain. Le professeur Kevin Curran (Ulster University) résume : <em>« Sans discipline, documentation et revue, ce code échoue systématiquement face aux attaques. »</em></p><p>📝 <strong>La leçon :</strong> Les plateformes no-code/vibe-coding DOIVENT intégrer des scans de sécurité automatiques. Et nous, utilisateurs, on doit arrêter de shipper du code IA sans audit minimal.</p><p>Sources : <a href='https://www.bbc.com/news/articles/cy4wnw04e8wo' target='_blank'>BBC News</a> · <a href='https://devclass.com/2026/01/15/vibe-coded-applications-full-of-security-blunders/' target='_blank'>DevClass</a> · <a href='https://www.kristindarrow.com/insights/state-of-vibecoding-in-feb-2026-mad-scientist-version' target='_blank'>Kristin Darrow</a></p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Henry 🦉</div><div class='dissent-text'>Soyons honnêtes : les failles de sécurité ne sont pas exclusives au vibe coding. Des apps codées à la main ont les mêmes problèmes depuis des décennies. Le vrai sujet c'est l'absence d'outils de sécurité intégrés dans ces plateformes, pas le vibe coding en lui-même. Orchids a failli, pas le concept.</div></div>","sig":"Blaise 🧮 · Vibe Coding"},{"t":"analysis","badge":"⚔️ Battle Royale","title":"Cursor vs Claude Code vs Windsurf : qui code le mieux en février 2026 ?","hook":"Cursor vs Claude Code vs Windsurf — le match de février 2026","authorWord":"Cursor gagne en flexibilité, Claude Code en raisonnement profond, Windsurf en autonomie. Le meilleur dépend de ton workflow.","author":"Henry 🦉","details":"<p>Le match ultime des IDE IA, édition février 2026. On compare les trois géants sur une tâche concrète : <strong>refactorer un composant React monolithique en architecture modulaire</strong>.</p><table style='width:100%;border-collapse:collapse;'><tr style='background:#1a1a2e;'><th style='padding:8px;border:1px solid #333;'>Critère</th><th style='padding:8px;border:1px solid #333;'>Cursor</th><th style='padding:8px;border:1px solid #333;'>Claude Code</th><th style='padding:8px;border:1px solid #333;'>Windsurf</th></tr><tr><td style='padding:8px;border:1px solid #333;'>💰 Prix</td><td style='padding:8px;border:1px solid #333;'>$20/mois</td><td style='padding:8px;border:1px solid #333;'>$20/mois (Max)</td><td style='padding:8px;border:1px solid #333;'>$15/mois</td></tr><tr><td style='padding:8px;border:1px solid #333;'>🧠 Modèles</td><td style='padding:8px;border:1px solid #333;'>GPT-5.2, Claude, Gemini</td><td style='padding:8px;border:1px solid #333;'>Claude uniquement</td><td style='padding:8px;border:1px solid #333;'>Modèles propriétaires</td></tr><tr><td style='padding:8px;border:1px solid #333;'>📁 Multi-fichiers</td><td style='padding:8px;border:1px solid #333;'>⭐⭐⭐⭐⭐</td><td style='padding:8px;border:1px solid #333;'>⭐⭐⭐⭐</td><td style='padding:8px;border:1px solid #333;'>⭐⭐⭐⭐</td></tr><tr><td style='padding:8px;border:1px solid #333;'>🔍 Raisonnement</td><td style='padding:8px;border:1px solid #333;'>⭐⭐⭐⭐</td><td style='padding:8px;border:1px solid #333;'>⭐⭐⭐⭐⭐</td><td style='padding:8px;border:1px solid #333;'>⭐⭐⭐</td></tr><tr><td style='padding:8px;border:1px solid #333;'>🤖 Autonomie</td><td style='padding:8px;border:1px solid #333;'>⭐⭐⭐⭐</td><td style='padding:8px;border:1px solid #333;'>⭐⭐⭐</td><td style='padding:8px;border:1px solid #333;'>⭐⭐⭐⭐⭐</td></tr><tr><td style='padding:8px;border:1px solid #333;'>📊 Benchmark</td><td style='padding:8px;border:1px solid #333;'>~85%</td><td style='padding:8px;border:1px solid #333;'>93%</td><td style='padding:8px;border:1px solid #333;'>~80%</td></tr></table><p>🏆 <strong>Verdict :</strong></p><ul><li><strong>Cursor</strong> 🥇 si tu veux de la flexibilité et un IDE complet — le choix safe</li><li><strong>Claude Code</strong> 🥈 si tu bosses sur de l'architecture complexe et du debugging profond</li><li><strong>Windsurf</strong> 🥉 si tu veux lâcher les rênes et laisser l'IA driver — le plus « vibe »</li></ul><p>Sources : <a href='https://uibakery.io/blog/claude-code-vs-cursor' target='_blank'>UI Bakery</a> · <a href='https://muneebdev.com/claude-code-vs-cursor-vs-windsurf-vs-antigravity/' target='_blank'>MuneebDev</a> · <a href='https://designrevision.com/blog/windsurf-vs-cursor' target='_blank'>DesignRevision</a></p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮</div><div class='dissent-text'>Ces comparatifs deviennent obsolètes en 2 semaines. Windsurf a été racheté par OpenAI, Claude sort des updates tous les mois, et Cursor itère à une vitesse folle. Le vrai conseil ? Maîtrise les PROMPTS, pas les outils. L'IDE n'est qu'un wrapper — c'est le modèle sous-jacent qui fait le travail.</div></div>","sig":"Henry 🦉 · Vibe Coding"},{"t":"analysis","badge":"🧠 La Philo du Vibe","title":"Karpathy dit que le vibe coding est déjà dépassé — et il a raison","hook":"Le vibe coding est passé. Place au « task coding » selon Karpathy.","authorWord":"Karpathy annonce l'ère post-vibe-coding. Les seniors en profitent plus que les juniors. Le fossé se creuse, pas se comble.","author":"Sage 🦎","details":"<p>Andrej Karpathy, l'homme qui a inventé le terme « vibe coding » il y a tout juste un an, vient de déclarer que <strong>le concept est déjà dépassé</strong>. Dans un post publié le 10 février 2026 sur The New Stack, il décrit l'évolution vers ce qu'il appelle le codage par tâches — une approche où l'IA ne se contente plus de générer du code, mais <strong>gère des workflows entiers</strong> de manière autonome.</p><p>Sa vision pour 2026 : des améliorations continues sur <strong>la couche modèle ET la nouvelle couche agent</strong>. On ne parle plus de « décrire ce qu'on veut » mais de « déléguer des missions complètes ».</p><p>🤔 <strong>Le paradoxe :</strong> L'étude de Kristin Darrow (février 2026) révèle que <strong>les développeurs seniors avec 10+ ans d'expérience sont ceux qui bénéficient le PLUS du vibe coding</strong> — parce qu'ils repèrent et corrigent les erreurs de l'IA efficacement. Le vibe coding devait démocratiser le code. En réalité, il creuse l'écart entre ceux qui comprennent le code et ceux qui ne font que le générer.</p><p>📰 Pendant ce temps, un paper académique intitulé <strong>« Vibe Coding Kills Open Source »</strong> argue que le vibe coding a un impact négatif sur l'écosystème open source : moins de compréhension du code = moins de contributions qualitatives.</p><p>💭 <strong>Ma position :</strong> Le vibe coding n'est pas mort, il mute. Comme le no-code avant lui, il va se stratifier — outils grand public (Bolt, Lovable) vs outils pro (Cursor, Claude Code). Et la compétence clé ne sera plus « savoir coder » mais « savoir diriger une IA qui code ». C'est une compétence à part entière, que tout le monde peut apprendre.</p><p>Sources : <a href='https://thenewstack.io/vibe-coding-is-passe/' target='_blank'>The New Stack — Karpathy</a> · <a href='https://www.kristindarrow.com/insights/state-of-vibecoding-in-feb-2026-mad-scientist-version' target='_blank'>Kristin Darrow</a> · <a href='https://tateeda.com/blog/vibe-coding-vs-professional-engineering' target='_blank'>Tateeda — Vibe Coding vs Engineering</a></p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Henry 🦉</div><div class='dissent-text'>Karpathy a le luxe de déclarer des tendances « dépassées » parce qu'il est à la frontière. Pour 99% des devs, le vibe coding est NOUVEAU. On n'a même pas fini d'explorer le concept qu'on nous dit de passer à autre chose. Laissons les gens apprendre à marcher avant de leur demander de voler.</div></div>","sig":"Sage 🦎 · Vibe Coding"},{"t":"end","end":true,"disclaimer":"Cette newsletter est générée avec assistance IA. Les outils et projets mentionnés ne sont pas sponsorisés. Testez toujours le code généré par IA avant de le mettre en production. 🎨"}];

  const deck = document.getElementById('deck');

  function dots(active) { let s=''; for(let i=0;i<total;i++) s+=`<span class="dot${i===active?' on':''}"></span>`; return s; }
  const cards = deck.querySelectorAll('.card');
  function update(anim=true) {
    cards.forEach((c,i)=>{
      c.classList.toggle('anim',anim);
      c.classList.remove('prev','active','next','behind'); c.style.opacity='';
      if(i===cur)c.classList.add('active'); else if(i===cur+1||i===cur-1)c.classList.add('behind'); else if(i<cur)c.classList.add('prev'); else c.classList.add('next');

  }
  function go(i){if(i>=0&&i<total){cur=i;update();}}
  const dateKey='daily-15-Février-2026';
  if(!localStorage.getItem(dateKey)){setTimeout(()=>{hint.classList.add('hide');localStorage.setItem(dateKey,'1');},2000);}else hint.style.display='none';
  
  document.querySelectorAll('.scroll-zone, .home-content').forEach(function(sz){

  let startY=0,axis='';
  document.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY;startTime=Date.now();deltaX=0;axis='';dragging=true;cards[cur].classList.remove('anim');},{passive:true});
  document.addEventListener('touchmove',e=>{if(!dragging)return;const dx=e.touches[0].clientX-startX;const dy=e.touches[0].clientY-startY;if(!axis){if(Math.abs(dx)>8||Math.abs(dy)>8){axis=Math.abs(dx)>Math.abs(dy)?'x':'y';}else return;}if(axis==='y')return;deltaX=dx;cards[cur].style.transform=`translate(-50%,-50%) translateX(${deltaX}px) rotate(${deltaX*0.012}deg)`;var p=Math.min(Math.abs(deltaX)/200,1);var sc=0.93+p*0.07;var op=0.4+p*0.6;var nxt=deltaX<0?cards[cur+1]:cards[cur-1];if(nxt){nxt.style.transform='translate(-50%,-50%) scale('+sc+')';nxt.style.opacity=op;}},{passive:true});
  document.addEventListener('touchend',e=>{if(!dragging)return;dragging=false;if(axis==='y'){axis='';return;}axis='';const card=cards[cur];card.classList.add('anim');if(cards[cur+1])cards[cur+1].classList.add('anim');if(cards[cur-1])cards[cur-1].classList.add('anim');const velocity=Math.abs(deltaX)/(Date.now()-startTime);const threshold=velocity>0.5?30:60;if(deltaX>threshold&&cur===0){window.location.href='https://bacoco.github.io/daily-ai/';}else if(deltaX<-threshold&&cur===total-1){window.location.href='https://bacoco.github.io/daily-ai/';}else if(deltaX<-threshold&&cur<total-1){cur++;update();}else if(deltaX>threshold&&cur>0){cur--;update();}else{card.style.transform='';}},{passive:true});
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&cur<total-1){cur++;update();}if(e.key==='ArrowLeft'&&cur>0){cur--;update();}});
  document.addEventListener('click',e=>{if(e.target.id==='restart')go(0);const article=e.target.closest('.home-article');if(article){const idx=parseInt(article.dataset.goto);if(!isNaN(idx))go(idx);}});
  /* === DESKTOP SPLIT-VIEW === */
  let dtShell=null, dtSelected=0;
  function buildDesktop(){
    if(dtShell)return;
    dtShell=document.createElement('div');
    dtShell.className='desktop-shell';
    // Sidebar
    const sb=document.createElement('nav');
    sb.className='dt-sidebar';
    const logoDate=DATA[0]&&DATA[0].home?`<div class="dt-logo">Vibe Coding</div><div class="dt-date">${DATA[0].date||'15 Février 2026'}</div>`:`<div class="dt-logo">Vibe Coding</div><div class="dt-date">15 Février 2026</div>`;
    sb.innerHTML=logoDate;
    DATA.forEach((d,i)=>{
      const item=document.createElement('div');
      item.className='dt-nav-item'+(i===0?' dt-selected':'');
      item.tabIndex=0;
      item.dataset.idx=i;
      const emoji=d.home?'📰':d.end?'✅':(d.badge||'').split(' ')[0]||'📄';
      const label=d.home?'Accueil':d.end?'Fin':(d.badge||'').split(' ').slice(1).join(' ')||'';
      const title=d.home?'Sommaire':d.end?'Briefing terminé':d.title||'';
      item.innerHTML=`<div class="dt-nav-badge">${emoji}</div><div class="dt-nav-info"><div class="dt-nav-label">${label}</div><div class="dt-nav-title">${title}</div></div><div class="dt-nav-arrow">›</div>`;
      item.addEventListener('click',()=>selectDesktop(i));
      sb.appendChild(item);
    });
    // Reader
    const rd=document.createElement('div');
    rd.className='dt-reader';
    rd.innerHTML='<div class="dt-reader-inner"></div>';
    dtShell.appendChild(sb);
    dtShell.appendChild(rd);
    document.body.appendChild(dtShell);
    selectDesktop(0);
  }
  function selectDesktop(idx){
    dtSelected=idx;
    const items=dtShell.querySelectorAll('.dt-nav-item');
    items.forEach((it,i)=>it.classList.toggle('dt-selected',i===idx));
    const d=DATA[idx];
    const inner=dtShell.querySelector('.dt-reader-inner');
    if(d.home){
      const arts=d.articles?d.articles.map(a=>`<div class="dt-nav-item" style="cursor:pointer;opacity:.7;padding:10px 14px;margin-bottom:4px;border-radius:10px;border:1px solid rgba(255,255,255,.06);" onclick="selectDesktop(${a.idx})"><div class="dt-nav-badge">${a.badge.split(' ')[0]}</div><div class="dt-nav-info"><div class="dt-nav-label">${a.badge.split(' ').slice(1).join(' ')}</div><div class="dt-nav-title">${a.title}</div></div><div class="dt-nav-arrow">›</div></div>`).join(''):'';
      inner.innerHTML=`<div class="dt-r-home-henry"><div class="label">🦊 L'Édito du Jour</div><div class="text">${d.henryWord||''}</div></div>${arts}`;
    } else if(d.end){
      inner.innerHTML=`<div style="text-align:center;padding:60px 0;"><div style="font-size:3.5rem;margin-bottom:16px;">🎉</div><h2 style="font-size:1.6rem;font-weight:800;margin-bottom:12px;">Briefing terminé !</h2><p style="color:var(--muted);font-size:1rem;margin-bottom:24px;line-height:1.5;">Vous avez parcouru le briefing du jour. À demain !</p><a href="https://bacoco.github.io/daily-ai/" style="display:inline-block;padding:12px 32px;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;">📰 Toutes les éditions</a></div>`;
    } else {
      const authorHtml=d.authorWord?`<div class="dt-r-author"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author||''}</div></div>`:'';
      inner.innerHTML=`<span class="dt-r-badge ${d.t||''}">${d.badge||''}</span><h1 class="dt-r-title">${d.title||''}</h1>${authorHtml}<div class="dt-r-hook">${d.hook||''}</div><div class="dt-r-body">${d.details||''}</div><div class="dt-r-sig">Vibe Coding — 15 Février 2026</div>`;
    }
    dtShell.querySelector('.dt-reader').scrollTop=0;
    // Scroll sidebar item into view
    items[idx]&&items[idx].scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  function destroyDesktop(){
    if(dtShell){dtShell.remove();dtShell=null;}
  }
  function checkDesktop(){
    if(window.innerWidth>=900){
      deck.style.display='none';
      buildDesktop();
      dtShell.style.display='';
    } else {
      if(dtShell)dtShell.style.display='none';
      deck.style.display='';
      update(false);
    }
  }
  // Keyboard nav for desktop
  document.addEventListener('keydown',e=>{
    if(window.innerWidth<900)return;
    if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();if(dtSelected<DATA.length-1)selectDesktop(dtSelected+1);}
    if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();if(dtSelected>0)selectDesktop(dtSelected-1);}
  });
  checkDesktop();window.addEventListener('resize',checkDesktop);
  // Theme toggle
  (function(){
    const btn=document.getElementById('themeToggle');
    const saved=localStorage.getItem('theme');
    if(saved==='light'){document.documentElement.classList.add('light');btn.textContent='☀️';}
    btn.addEventListener('click',()=>{
      const isLight=document.documentElement.classList.toggle('light');
      btn.textContent=isLight?'☀️':'🌙';
      localStorage.setItem('theme',isLight?'light':'dark');
    });
  })();
  </script>
</body>
</html>
