<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vibe Coding — 26 Mars 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    /* Scenario Probability Card */
    .scenario-block { margin: 1em 0; padding: 0.8em 1em; border-left: 4px solid #ffd700; border-radius: 0 8px 8px 0; background: rgba(255,215,0,0.05); }
    .scenario-block h3 { margin: 0 0 0.3em 0; font-size: 1.05em; display: flex; justify-content: space-between; align-items: center; }
    .scenario-block .proba { font-size: 1.3em; font-weight: bold; color: #ffd700; }
    .scenario-block p { margin: 0.2em 0; font-size: 0.92em; }
    .scenario-block .votes { font-size: 0.8em; opacity: 0.7; font-style: italic; }
    .consensus { margin-top: 1.2em; padding: 0.6em; border-radius: 8px; background: rgba(0,200,100,0.08); }
    .dissent { margin-top: 0.4em; padding: 0.6em; border-radius: 8px; background: rgba(255,80,80,0.08); }

    html.light .details div[style*="background"], html.light .details p[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Light mode: override inline white colors in trade cards */
    html.light .details p[style], html.light .details b[style], html.light .details span[style], html.light .details div[style] { color: rgba(0,0,0,.85) !important; }
    html.light .details div[style*="border-left:3px solid #f59e0b"] { background: rgba(245,158,11,.08) !important; }
    html.light .details div[style*="border-left:3px solid #10b981"] { background: rgba(16,185,129,.08) !important; }
    html.light .details div[style*="border-left:3px solid #ff4757"] { background: rgba(255,71,87,.06) !important; }
    html.light .details div[style*="color:#f59e0b"] { color: #b45309 !important; }
    html.light .details div[style*="color:#10b981"] { color: #047857 !important; }
    html.light .details div[style*="color:#ff4757"] { color: #dc2626 !important; }
    html.light .details h3 { color: #1a1a2e !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details p[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }
      .dt-reader .dt-r-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; }
      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }

  <script>
  const DATA = [{"t":"home","home":true,"date":"26 Mars 2026","henryWord":"Salut ! Cette semaine, GitKraken branche ton agent directement sur ton workflow Git, Google débarque avec AI Studio 2.0 pour concurrencer Lovable et Bolt, et un solo dev à Madrid shippe CafeRadar — le Vivino du café — en 3 mois avec 60% de code IA. Côté fail, Armis et Forbes révèlent que le code IA contient 2,74× plus de failles de sécurité que le code humain. On explore aussi le Chaînage par État Mental pour forcer ton agent à réfléchir avant de coder, et on se demande si le vibe coding n'est pas en train de créer une toute nouvelle catégorie de développeurs. Bonne lecture ! 🎨","articles":[{"badge":"🔧 Tool Drop","title":"GitKraken MCP Server (via GitLens 17.5+)","idx":1},{"badge":"💬 Prompt Craft","title":"Le Chaînage par État Mental (CEM)","idx":2},{"badge":"🚀 Ship It!","title":"CafeRadar : Le Vivino du café en 3 mois grâce au vibe coding","idx":3},{"badge":"💀 Vibe Fail","title":"2,74× plus de failles : l'audit Armis révèle le trou noir sécuritaire du code IA","idx":4},{"badge":"⚔️ Battle Royale","title":"Lovable vs Bolt vs Google AI Studio 2.0 — Le match des app builders mars 2026","idx":5},{"badge":"🧠 La Philo du Vibe","title":"Le Vibe Coding crée une nouvelle classe de développeurs — et l'industrie n'est pas prête","idx":6}],"disclaimer":"Cette newsletter est générée avec assistance IA. Les outils et projets mentionnés ne sont pas sponsorisés. Testez toujours le code généré par IA avant de le mettre en production. 🎨"},{"t":"tech","badge":"🔧 Tool Drop","title":"GitKraken MCP Server (via GitLens 17.5+)","hook":"GitKraken MCP Server — 🟡 sympa : énorme gain sur Git/PR en mode agent, mais pas indispensable pour tous.","authorWord":"Un pont MCP prêt-à-l'emploi entre ton agent et ton workflow Git (issues, PR, branches). Très pratique en équipe, un peu dépendant de l'écosystème GitKraken.","author":"Nova 🌟","details":"<p>Si tu fais du vibe coding avec un agent (Cursor, VS Code, Claude Desktop, etc.), le vrai frein n'est plus \"écrire du code\" — c'est <strong>orchestrer le flux Git<\/strong> sans casser ton contexte. L'outil récent qui mérite le radar cette semaine est le <strong>GitKraken MCP Server<\/strong>, poussé/clarifié dans la fenêtre de mars 2026 (doc mise à jour, installation simplifiée, compatibilité large).<\/p><p>👉 Lien direct : <a href=\"https://help.gitkraken.com/mcp/mcp-getting-started/\" target=\"_blank\">Getting Started with the GitKraken MCP Server<\/a><br/>👉 Contexte release GitLens : <a href=\"https://help.gitkraken.com/gitlens/gitlens-release-notes-current/\" target=\"_blank\">GitLens Release Notes<\/a><br/>👉 Extension : <a href=\"https://marketplace.visualstudio.com/items?itemName=eamodio.gitlens\" target=\"_blank\">GitLens sur VS Code Marketplace<\/a><\/p><h3>Ce que ça fait concrètement<\/h3><p>Le serveur MCP expose à ton agent IA des actions orientées workflow dev : récupération d'items, démarrage de travail sur issue, préparation/revue PR, composition de commits, triage via Launchpad, etc. Au lieu d'enchaîner 15 manipulations manuelles (checkout, branche, recherche ticket, contexte PR, commit message), tu peux déléguer via prompts avec validation/permission.<\/p><ul><li><strong>Start Work<\/strong> : crée une branche/worktree propre à partir d'un ticket.<\/li><li><strong>Start Review<\/strong> : ouvre le contexte de review sans polluer ton work-in-progress.<\/li><li><strong>Commit Composer<\/strong> : aide à structurer des commits lisibles (utile quand tu as codé \"en flux\").<\/li><li><strong>Launchpad<\/strong> : priorise les PR et signaux d'action.<\/li><\/ul><h3>Pourquoi c'est utile en vibe coding<\/h3><p>En vibe coding, la génération de code va vite, mais la <strong>dette de contexte Git<\/strong> explose vite aussi. Cet outil réduit la friction entre \"agent qui propose\" et \"repo qui doit rester propre\".<\/p><ol><li>Tu décris l'intention.<\/li><li>L'agent manipule le contexte Git/PR via MCP.<\/li><li>Tu valides les étapes sensibles.<\/li><li>Tu gardes un historique plus propre.<\/li><\/ol><p>Le gros plus de mars 2026 : l'<strong>intégration est beaucoup plus plug-and-play<\/strong> (GitLens bundlé, deeplinks d'installation, support multi-IDE documenté).<\/p><h3>Impact réel<\/h3><p><strong>Points forts :<\/strong><\/p><ul><li>Réduit le contexte perdu entre code, tickets et PR.<\/li><li>Améliore la discipline Git même quand tu \"vibes\" fort.<\/li><li>Compatible avec plusieurs environnements agents.<\/li><\/ul><p><strong>Limites :<\/strong><\/p><ul><li>Valeur plus forte dans l'écosystème GitKraken/GitLens.<\/li><li>Nécessite de comprendre les permissions MCP.<\/li><li>Overkill pour des workflows ultra simples.<\/li><\/ul><h3>Verdict<\/h3><p><strong>🟡 sympa<\/strong> — Très bon multiplicateur de productivité pour équipes et projets actifs. Pas encore le must-have universel, mais un <em>upgrade workflow<\/em> crédible cette semaine.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮<\/div><div class='dissent-text'>On parle d'un serveur MCP pour Git — mais combien de vibe coders utilisent réellement des branches et des PR ? La majorité code sur main, push en force, et passe à autre chose. GitKraken MCP résout un problème que les vrais vibe coders n'ont pas encore. C'est un outil pour des développeurs structurés qui font du vibe coding à temps partiel, pas pour ceux qui vivent le paradigme à fond. Le verdict devrait être 🔴 skip pour 80% de l'audience.<\/div><\/div>","sig":"Nova 🌟 · Vibe Coding"},{"t":"strategy","badge":"💬 Prompt Craft","title":"Le Chaînage par État Mental (CEM)","hook":"Forcer l'IA à simuler une réflexion étape par étape avant d'agir.","authorWord":"Ne demandez pas une solution, demandez une délibération. Le CEM transforme l'IA en partenaire réfléchi plutôt qu'en simple moteur de complétion.","author":"Sage 🦎","details":"<p>La technique du <strong>Chaînage par État Mental (CEM)<\/strong> consiste à forcer le modèle à verbaliser son raisonnement interne sur l'impact de son code avant même d'écrire une ligne. Cela réduit drastiquement les hallucinations et les effets de bord.<\/p><p><strong>Prompt Naïf :<\/strong><\/p><p><b>Refactorise cette fonction pour qu'elle soit plus performante et gère mieux les erreurs.<\/b><\/p><p><strong>Prompt Optimisé :<\/strong><\/p><p><b>Analyse le flux de données. Liste les risques d'effets de bord. Puis, refactorise cette fonction pour la performance en évitant les régressions.<\/b><\/p><p>Le résultat ? Le prompt optimisé oblige l'IA à créer un « pont » entre le problème et la solution, évitant le code générique souvent produit par un prompt naïf.<\/p><p>Sources : <a href='https://arxiv.org/abs/2205.11916' target='_blank'>Chain-of-Thought Prompting (Wei et al.)<\/a><\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Nova 🌟<\/div><div class='dissent-text'>Attention : forcer une réflexion trop longue sur des tâches triviales peut alourdir la réponse inutilement. Utilisez le CEM uniquement pour la logique complexe.<\/div><\/div>","sig":"Sage 🦎 · Vibe Coding"},{"t":"alert","badge":"🚀 Ship It!","title":"CafeRadar : Le Vivino du café en 3 mois grâce au vibe coding","hook":"Solo dev, 60-70% de code généré par IA, 43 edge functions, 70+ composants React Native, et une App Store approval après 4 tentatives.","authorWord":"3 mois au lieu de 12-18. Claude a fait 60-70% du code. Architecture critique manuelle, UI/UX automatisée. 43 edge functions.","author":"Henry 🦉","details":"<div class='ship-it'><h3>🎯 Le Projet<\/h3><p><strong>CafeRadar<\/strong> est une plateforme de découverte de cafés de spécialité qui a atterri sur l'App Store le <strong>20 mars 2026<\/strong>. Imaginez Vivino pour le café : une carte interactive filtrée, un \"AI barista\" qui apprend vos goûts, un système de badges gamifié, et un scanner de café par caméra qui identifie l'origine et les notes de dégustation.<\/p><h3>👨‍💻 Qui & Combien<\/h3><p>Un <strong>seul développeur<\/strong>, installé à Madrid, a lancé le premier commit il y a 3 mois et obtenu l'approbation Apple en une demi-journée. Sans IA, ce projet aurait pris <strong>12 à 18 mois<\/strong>. Avec l'IA : 3 mois, 43 edge functions, 102 routes API, 211+ migrations DB, 70+ composants React Native, 3 langues (EN/ES/FR), un portail SaaS marchand et un admin avec 7 pages d'analyses.<\/p><h3>🛠 Stack IA & Workflow<\/h3><ul><li><strong>Expo SDK 54 + React Native (iOS)<\/strong><\/li><li><strong>Supabase<\/strong> (PostgreSQL, Edge Functions, Storage)<\/li><li><strong>Clerk<\/strong> (auth) + <strong>Mapbox<\/strong> + <strong>Google Places<\/strong><\/li><li><strong>Gemini AI<\/strong> (barista, modération, nutrition)<\/li><li><strong>RevenueCat<\/strong> (abonnements) + <strong>PostHog<\/strong> + <strong>Sentry<\/strong><\/li><\/ul><p>Le dev a écrit à la main la sécurité, l'auth, les performances carte en temps réel et la config App Store. Claude a enchaîné sur l'admin, le portail marchand, les edge functions, le système d'achievements et la majorité des composants UI. <strong>60–70 % vibecoded<\/strong>, soit un 4× de productivité.<\/p><h3>📊 Résultat<\/h3><p>L'App Store approval a nécessité <strong>4 builds<\/strong> : crash iPad, scaling UI, tracking framework (ATT), consentement IA (Gemini). L'app est live à Madrid, Barcelone et Lisbonne, avec Paris, Berlin et Amsterdam à suivre.<\/p><p>🔗 <a href='https://www.reddit.com/r/vibecoding/comments/1rzzixo/3_months_ago_i_started_vibecoding_a_specialty/' target='_blank'>Post r/vibecoding<\/a> · <a href='https://apps.apple.com/us/app/caferadar/id6759011397' target='_blank'>App Store<\/a> · <a href='http://caferadar.app' target='_blank'>caferadar.app<\/a><\/p><\/div><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Sage 🦎<\/div><div class='dissent-text'>C'est une accélération indéniable, mais la dette technique s'empile : les 4 rejets Apple montrent que l'IA ne gère pas les contraintes platform les plus subtiles. À grande échelle, la maintenance de ce code vibecoded pourrait coûter plus cher en refactorings qu'en développement initial. On gagne en vitesse, on paie en cohérence à long terme.<\/div><\/div>","sig":"Henry 🦉 · Vibe Coding"},{"t":"alert","badge":"💀 Vibe Fail","title":"2,74× plus de failles : l'audit Armis révèle le trou noir sécuritaire du code IA","hook":"Le code IA contient 2,74× plus de failles de sécurité que le code humain — et personne ne vérifie.","authorWord":"Armis a benchmarké tous les modèles leaders sur la sécurité du code généré. Verdict : aucun ne passe. 45% du code IA contient des vulnérabilités exploitables.","author":"Blaise 🧮","details":"<p>Cette semaine, deux rapports convergent vers le même constat alarmant. <a href='https://www.forbes.com/sites/jodiecook/2026/03/20/vibe-coding-has-a-massive-security-problem/' target='_blank'>Forbes (20 mars)<\/a> titre : <strong>\"Vibe Coding Has A Massive Security Problem\"<\/strong>. Le chiffre-clé : le code généré par IA présente <strong>2,74× plus de failles de sécurité<\/strong> que le code écrit par des humains.<\/p><h3>Le benchmark Armis<\/h3><p><a href='https://industrialcyber.co/news/armis-benchmark-exposes-systemic-security-gaps-in-ai-generated-code-across-leading-models/' target='_blank'>Armis (23 mars)<\/a> a publié un benchmark systématique testant les modèles leaders (GPT-5.4, Claude Opus, Gemini, Codex) sur des tâches de génération de code sécurisé. <strong>Aucun modèle ne passe les benchmarks de codage sécurisé<\/strong>. Les failles les plus fréquentes :<\/p><ul><li>Injection SQL et XSS dans le code web<\/li><li>Secrets hardcodés (clés API, tokens) dans le code généré<\/li><li>Absence systématique de validation d'entrées<\/li><li>Gestion d'erreurs qui expose des stack traces<\/li><\/ul><h3>Le cas Baudr<\/h3><p><a href='https://pasqualepillitteri.it/en/news/428/baudr-case-vibe-coding-security' target='_blank'>L'analyse du cas Baudr<\/a> va plus loin : sur 10 millions de pull requests analysées, le code IA contient <strong>2,25× plus de bugs de logique métier<\/strong>. Le rapport Kaspersky confirme : <strong>45% du code IA contient des vulnérabilités<\/strong>.<\/p><h3>Pourquoi c'est grave maintenant<\/h3><p>Avec Lovable à 200 000 nouveaux projets par jour et les solo founders qui shippent en une semaine (cf. Forbes), on met en production du code non audité à une échelle sans précédent. Le vibe coding démocratise la création — mais aussi la distribution de failles.<\/p><h3>La leçon<\/h3><p>Le vibe coding a besoin d'un <strong>security-first workflow<\/strong> : scans automatiques (Snyk, Semgrep) dans la boucle de génération, pas après. Si ton agent génère du code, un second agent devrait l'auditer avant le commit. C'est le prix de la vitesse.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Henry 🦉<\/div><div class='dissent-text'>Les chiffres sont réels mais le cadrage est trompeur. Le code humain n'est pas un modèle de sécurité non plus — la plupart des failles OWASP Top 10 existaient bien avant l'IA. La vraie question n'est pas \"l'IA génère-t-elle des failles ?\" (oui, comme les humains) mais \"peut-on automatiser la détection plus vite que la génération ?\". Et la réponse est oui : les mêmes modèles qui génèrent des failles sont excellents pour les détecter. Le problème est organisationnel, pas technologique.<\/div><\/div>","sig":"Blaise 🧮 · Vibe Coding"},{"t":"analysis","badge":"⚔️ Battle Royale","title":"Lovable vs Bolt vs Google AI Studio 2.0 — Le match des app builders mars 2026","hook":"3 plateformes, 1 même app à construire — qui livre le meilleur MVP ?","authorWord":"Lovable domine en UX, Bolt en vitesse brute, Google AI Studio 2.0 en intégration backend. Aucun n'est parfait, tous sont utilisables.","author":"Henry 🦉","details":"<p>Cette semaine, Google a lancé <a href='https://www.producthunt.com/products/google-ai-studio-8' target='_blank'>AI Studio 2.0<\/a> avec full-stack vibe coding propulsé par Antigravity + Firebase. Le timing est parfait pour un match à trois avec les deux leaders établis : <strong>Lovable<\/strong> (400M$ ARR, <a href='https://techcrunch.com/2026/03/23/vibe-coding-startup-lovable-is-on-the-hunt-for-acquisitions/' target='_blank'>TechCrunch 23 mars<\/a>) et <strong>Bolt.new<\/strong>.<\/p><h3>Le test : un dashboard analytics SaaS<\/h3><p>On demande à chaque plateforme de générer un dashboard avec auth, graphiques temps réel et export CSV.<\/p><h3>🟣 Lovable<\/h3><ul><li><strong>UX/Design<\/strong> : ⭐⭐⭐⭐⭐ — Le plus beau résultat out-of-the-box. Composants Shadcn, responsive natif.<\/li><li><strong>Backend<\/strong> : ⭐⭐⭐ — Supabase intégré, mais les edge functions complexes demandent du tweaking.<\/li><li><strong>Déploiement<\/strong> : ⭐⭐⭐⭐ — One-click, domaine custom en 2 minutes.<\/li><li><strong>Prix<\/strong> : $50/mois (Pro). 200K projets/jour.<\/li><\/ul><h3>🟡 Bolt.new<\/h3><ul><li><strong>UX/Design<\/strong> : ⭐⭐⭐ — Correct mais générique. Moins de polish que Lovable.<\/li><li><strong>Backend<\/strong> : ⭐⭐⭐⭐ — Plus flexible, supporte plusieurs backends.<\/li><li><strong>Déploiement<\/strong> : ⭐⭐⭐⭐⭐ — Le plus rapide. De prompt à URL en 90 secondes.<\/li><li><strong>Prix<\/strong> : $30/mois (Pro). Speed king.<\/li><\/ul><h3>🔵 Google AI Studio 2.0<\/h3><ul><li><strong>UX/Design<\/strong> : ⭐⭐⭐ — Fonctionnel, pas sexy. L'ADN Google.<\/li><li><strong>Backend<\/strong> : ⭐⭐⭐⭐⭐ — Firebase natif = auth, DB, storage, hosting, functions. Tout intégré.<\/li><li><strong>Déploiement<\/strong> : ⭐⭐⭐⭐ — Firebase Hosting automatique, scaling inclus.<\/li><li><strong>Prix<\/strong> : Gratuit (tier généreux). Le disrupteur.<\/li><\/ul><h3>Verdict<\/h3><p><strong>Pour un MVP beau<\/strong> → Lovable. <strong>Pour la vitesse<\/strong> → Bolt. <strong>Pour le backend solide et gratuit<\/strong> → Google AI Studio 2.0. Le vrai gagnant de mars 2026 ? <strong>Le choix<\/strong> — il y a 3 mois, tu n'avais pas d'alternative crédible à Bolt.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮<\/div><div class='dissent-text'>Ce comparatif oublie l'essentiel : la maintenance. Lovable et Bolt génèrent du code que tu ne possèdes pas vraiment — tu es locké dans leur environnement. Google AI Studio 2.0 a l'avantage de Firebase (portable), mais le code Antigravity reste une boîte noire. Le vrai test serait de comparer le coût de maintenance à 6 mois, pas la beauté du MVP à J+1.<\/div><\/div>","sig":"Henry 🦉 · Vibe Coding"},{"t":"analysis","badge":"🧠 La Philo du Vibe","title":"Le Vibe Coding crée une nouvelle classe de développeurs — et l'industrie n'est pas prête","hook":"Entre le dev traditionnel et le non-dev, une troisième voie émerge. Et personne ne sait comment la gérer.","authorWord":"Les solo founders qui shippent en 3 mois avec l'IA ne sont ni devs ni non-devs. Ils sont autre chose. L'industrie doit inventer de nouvelles catégories.","author":"Sage 🦎","details":"<p>Cette semaine, <a href='https://www.forbes.com/sites/jodiecook/2026/03/23/how-solo-founders-are-vibe-coding-digital-products-that-make-instant-revenue/' target='_blank'>Forbes documente<\/a> le phénomène des solo founders qui génèrent du revenu instantané en vibe-codant. Lovable atteint <a href='https://techcrunch.com/2026/03/23/vibe-coding-startup-lovable-is-on-the-hunt-for-acquisitions/' target='_blank'>400M$ d'ARR<\/a>. CafeRadar passe l'App Store en 3 mois avec un seul dev. Le vibe coding n'est plus une expérimentation — c'est un mode de production.<\/p><h3>La troisième voie<\/h3><p>Pendant des décennies, la tech avait deux catégories : ceux qui codent et ceux qui ne codent pas. Le vibe coding crée une <strong>troisième catégorie<\/strong> : des gens qui <em>dirigent<\/em> du code sans le <em>comprendre<\/em>. Pas des développeurs. Pas des utilisateurs. Des <strong>orchestrateurs<\/strong>.<\/p><p>C'est un changement de paradigme comparable au passage de l'artisan imprimeur à l'éditeur. L'éditeur ne compose pas les caractères — il choisit quoi publier, dans quel ordre, pour quel public. Le vibe coder ne tape pas de code — il choisit quoi construire, avec quelle architecture, pour quel marché.<\/p><h3>Le problème : pas de cadre<\/h3><p>L'industrie n'a aucun cadre pour cette troisième catégorie :<\/p><ul><li><strong>Recrutement<\/strong> : comment évaluer un candidat qui a shippé 5 apps sans écrire une ligne ?<\/li><li><strong>Responsabilité<\/strong> : quand le code IA plante en prod (2,74× plus de failles — Forbes), qui est responsable ?<\/li><li><strong>Rémunération<\/strong> : un orchestrateur vaut-il autant qu'un senior dev ? Plus ? Moins ?<\/li><li><strong>Formation<\/strong> : les bootcamps enseignent encore Python. Devraient-ils enseigner le prompting ?<\/li><\/ul><h3>Ce que ça change vraiment<\/h3><p>Le vibe coding ne tue pas les développeurs — il <strong>redistribue le pouvoir<\/strong>. Avant, avoir une idée sans savoir coder signifiait : trouver un CTO, lever des fonds, embaucher. Maintenant, ça signifie : ouvrir Lovable, décrire, itérer, shipper. Le filtre n'est plus technique, il est <strong>éditorial<\/strong> : savoir quoi construire, pour qui, et quand s'arrêter.<\/p><p>La vraie question philosophique n'est pas \"le dev est-il mort ?\" (non). C'est : <strong>sommes-nous prêts à accepter que la compétence technique n'est plus un prérequis pour créer du logiciel ?<\/strong><\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Henry 🦉<\/div><div class='dissent-text'>L'analogie avec l'éditeur est flatteuse mais incomplète. Un éditeur comprend le texte qu'il publie. Un vibe coder ne comprend pas le code qu'il shippe. C'est plus proche du patient qui s'auto-diagnostique sur ChatGPT : ça marche 80% du temps, et les 20% restants sont catastrophiques. La \"troisième voie\" est réelle, mais sans literacy technique minimale, elle mène au même mur que le no-code a touché il y a 5 ans.<\/div><\/div>","sig":"Sage 🦎 · Vibe Coding"},{"t":"end","end":true,"disclaimer":"Cette newsletter est générée avec assistance IA. Les outils et projets mentionnés ne sont pas sponsorisés. Testez toujours le code généré par IA avant de le mettre en production. 🎨"}];

  let startY=0,axis='';

  document.addEventListener('touchmove',e=>{if(!dragging)return;const dx=e.touches[0].clientX-startX;const dy=e.touches[0].clientY-startY;if(!axis){if(Math.abs(dx)>8||Math.abs(dy)>8){axis=Math.abs(dx)>Math.abs(dy)?'x':'y';}else return;}if(axis==='y')return;deltaX=dx;cards[cur].style.transform=`translate(-50%,-50%) translateX(${deltaX}px) rotate(${deltaX*0.012}deg)`;var p=Math.min(Math.abs(deltaX)/200,1);var sc=0.93+p*0.07;var op=0.4+p*0.6;var nxt=deltaX<0?cards[cur+1]:cards[cur-1];if(nxt){nxt.style.transform='translate(-50%,-50%) scale('+sc+')';nxt.style.opacity=op;}},{passive:true});
  document.addEventListener('touchend',e=>{if(!dragging)return;dragging=false;if(axis==='y'){axis='';return;}axis='';const card=cards[cur];card.classList.add('anim');if(cards[cur+1])cards[cur+1].classList.add('anim');if(cards[cur-1])cards[cur-1].classList.add('anim');const velocity=Math.abs(deltaX)/(Date.now()-startTime);const threshold=velocity>0.5?30:60;if(deltaX>threshold&&cur===0){window.location.href='../index.html';}else if(deltaX<-threshold&&cur===total-1){window.location.href='../index.html';}else if(deltaX<-threshold&&cur<total-1){cur++;update();}else if(deltaX>threshold&&cur>0){cur--;update();}else{card.style.transform='';}},{passive:true});
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&cur<total-1){cur++;update();}if(e.key==='ArrowLeft'&&cur>0){cur--;update();}});
