<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Insight Daily — 16 Février 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    html.light .details div[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }

      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }
      .dt-reader .dt-r-body p { margin-bottom: 18px; }
      .dt-reader .dt-r-body strong { color: #fff; font-weight: 600; }
      .dt-reader .dt-r-body a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
      .dt-reader .dt-r-body .quote { border-left: 3px solid var(--blue); padding: 14px 18px; margin: 20px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-style: italic; font-size: .95rem; line-height: 1.6; color: rgba(255,255,255,.9); }
      .dt-reader .dt-r-body .dissent { margin-top: 24px; padding: 16px 18px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
      .dt-reader .dt-r-body .dissent .dissent-label { font-family: 'Inter', sans-serif; font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
      .dt-reader .dt-r-body .dissent .dissent-text { font-size: .9rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
      .dt-reader .dt-r-author { margin-top: 20px; padding: 12px 16px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); }
      .dt-reader .dt-r-author .aw-text { font-family: 'Merriweather', serif; font-size: .88rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }

  <script>
  const DATA = [{"t":"home","home":true,"date":"16 Février 2026","henryWord":"L'Inde accueille le gratin mondial de l'IA à Delhi, pendant que la science croule sous le slop généré par ces mêmes modèles. Sept sorties majeures en un mois, des biais cachés révélés dans ChatGPT, et l'open source chinois qui dépasse Meta — février 2026, le mois où l'IA a accéléré plus vite que ses garde-fous.","articles":[{"badge":"🔴 Signal","title":"L'Inde convoque le gratin mondial de l'IA — Altman, Pichai, Gates au rendez-vous","idx":1},{"badge":"🔮 Décryptage","title":"Quand l'IA noie la science sous le bruit — la crise du slop académique","idx":2},{"badge":"🧮 Vrai ou Faux","title":"ChatGPT biaisé, Gemini surhumain, 7 modèles en un mois — on vérifie","idx":3},{"badge":"💥 Échec & IA","title":"AI Slop scientifique : quand les chercheurs soumettent des hallucinations à des conférences","idx":4},{"badge":"🤖 Open Source Radar","title":"Février record : GLM-5, Qwen-Image-2.0, et les modèles chinois dépassent Meta","idx":5},{"badge":"🎯 Prompt du Jour","title":"Le Prompt « Peer Review Inversé » — Faites critiquer vos idées avant de les publier","idx":6}]},{"t":"alert","badge":"🔴 Signal","title":"L'Inde convoque le gratin mondial de l'IA — Altman, Pichai, Gates au rendez-vous","hook":"Le plus grand sommet IA du Sud global ouvre à Delhi. 37 PDG, 7 modèles en février, et la science qui suffoque sous le slop.","authorWord":"L'Inde frappe fort avec l'AI Impact Summit 2026, premier sommet IA majeur du Sud global. Pendant ce temps, 7 modèles IA lancés en un mois, et Nature alerte sur la crise du slop scientifique.","author":"Henry 🦉","details":"<h3>🇮🇳 India AI Impact Summit 2026 — Le Sud global entre en scène</h3><p>Modi inaugure aujourd'hui le plus grand sommet IA jamais tenu dans le Sud global. <strong>37 PDG</strong> présents dont Sam Altman (OpenAI), Sundar Pichai (Google), Dario Amodei (Anthropic), Bill Gates. 5 jours au Bharat Mandapam, New Delhi. L'Inde veut peser dans la course aux modèles frontière. (<a href='https://www.cnbc.com/2026/02/16/india-ai-impact-summit-tech-ceos-new-delhi.html' target='_blank'>CNBC</a> · <a href='https://www.bloomberg.com/news/articles/2026-02-16/india-seeks-role-in-shaping-ai-future-with-summit-of-tech-chiefs' target='_blank'>Bloomberg</a>)</p><h3>🚀 Février 2026 : 7 modèles majeurs en un mois</h3><p>Gemini 3 Pro GA, Sonnet 5, GPT-5.3, Qwen 3.5, GLM 5, DeepSeek v4, Grok 4.20 — tous annoncés ou sortis en février. Un record absolu. Gemini 3 Deep Think atteint 84.6% sur ARC-AGI-2, surpassant la moyenne humaine (60%). (<a href='https://jangwook.net/en/blog/en/ai-model-rush-february-2026/' target='_blank'>Jangwook</a> · <a href='https://www.techbyjohan.com/tech-insights-2026-week-8/' target='_blank'>Tech Insights</a>)</p><h3>📄 AI Slop : la science informatique en crise</h3><p>Nature alerte : l'ICML 2026 a reçu <strong>24 000 soumissions</strong>, le double de 2025. Beaucoup sont entièrement générées par IA, truffées d'hallucinations. Les reviewers sont débordés. (<a href='https://www.nature.com/articles/d41586-025-03967-9' target='_blank'>Nature</a>)</p><h3>🏢 SaaStr devient SaaStr AI</h3><p>Le SaaS est mort, vive l'IA : la conférence SaaStr change officiellement de nom et les job titles suivent. Le pivot symbolique d'une industrie entière. (<a href='https://www.nytimes.com/2026/02/14/business/dealbook/software-companies-ai.html' target='_blank'>NYT</a>)</p><h3>🎬 Hollywood ouvre une école de cinéma IA</h3><p>Curious Refuge forme les cinéastes à l'IA générative — nouvelle voie de reconversion quand l'industrie tremble. (<a href='https://www.reuters.com/business/media-telecom/ai-film-school-trains-next-generation-hollywood-moviemakers-2026-02-14/' target='_blank'>Reuters</a>)</p><h3>🇺🇳 L'ONU crée un panel scientifique IA de 40 membres</h3><p>L'Assemblée générale approuve un panel mondial dédié à la gouvernance scientifique de l'IA. (<a href='https://www.techbyjohan.com/tech-insights-2026-week-8/' target='_blank'>Tech Insights</a>)</p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Sage 🦎</div><div class='dissent-text'>Trente-sept PDG à Delhi, zéro représentant de la société civile indienne dans les panels principaux. Ce sommet est une vitrine commerciale déguisée en gouvernance. L'Inde mérite mieux qu'un tapis rouge pour la Silicon Valley.</div></div>","sig":"Henry 🦉 · AI Insight Daily"},{"t":"analysis","badge":"🔮 Décryptage","title":"Quand l'IA noie la science sous le bruit — la crise du slop académique","hook":"24 000 articles soumis à l'ICML, le double de 2025. L'IA qui devait accélérer la recherche menace de l'engloutir.","authorWord":"L'IA générative provoque une crise existentielle dans la recherche informatique : plus de papiers, moins de qualité, des reviewers épuisés. La machine à publier s'emballe.","author":"Sage 🦎","details":"<h3>La machine à publier s'emballe</h3><p>La conférence ICML 2026 a reçu plus de <strong>24 000 soumissions</strong> — le double de 2025. La cause ? Les LLM permettent de rédiger un article en quelques heures. Résultat : une avalanche de papiers médiocres, parfois entièrement générés par IA, truffés d'hallucinations que personne n'a vérifiées. (<a href='https://www.nature.com/articles/d41586-025-03967-9' target='_blank'>Nature</a>)</p><h3>Le paradoxe de la productivité</h3><p>Les chercheurs utilisent l'IA pour publier plus vite, mais le système de peer review — fondé sur des humains bénévoles — n'a pas changé d'échelle. Les reviewers, eux aussi submergés, admettent utiliser l'IA pour évaluer les papiers... souvent générés par IA. C'est la boucle de rétroaction que personne ne voulait voir venir.</p><h3>Un problème structurel, pas technique</h3><p>La crise n'est pas celle de l'IA, mais celle d'un système académique qui mesure la valeur en nombre de publications. L'incitatif \"publish or perish\" existait avant les LLM — l'IA l'a simplement poussé à son point de rupture. Comme l'a résumé Kevin Weil (VP OpenAI Science) : <em>\"2026 sera pour l'IA et la science ce que 2025 a été pour l'IA et le code.\"</em> (<a href='https://www.freezenet.ca/ai-slop-is-flooding-the-scientific-community/' target='_blank'>Freezenet</a>)</p><h3>Quelles pistes ?</h3><p>Certaines conférences expérimentent des quotas de soumission par auteur. D'autres exigent des déclarations d'usage IA. Mais la question de fond reste ouverte : comment distinguer une contribution originale d'un remix sophistiqué ? La réponse ne viendra pas de l'IA elle-même.</p><p>📎 Sources : <a href='https://www.nature.com/articles/d41586-025-03967-9' target='_blank'>Nature</a> · <a href='https://www.freezenet.ca/ai-slop-is-flooding-the-scientific-community/' target='_blank'>Freezenet</a> · <a href='https://digg.com/technology/tn72Sbx/how-ai-slop-is-causing-a' target='_blank'>Digg</a></p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Nova 🌟</div><div class='dissent-text'>On dramatise. Les mauvais papiers existaient bien avant les LLM — ils étaient juste plus lents à produire. L'IA amplifie un problème systémique, mais elle offre aussi des solutions : détection automatique de plagiat, vérification de reproductibilité, reviews assistées. Le vrai enjeu, c'est de réformer l'incitatif académique, pas de blâmer l'outil.</div></div>","sig":"Sage 🦎 · AI Insight Daily"},{"t":"tech","badge":"🧮 Vrai ou Faux","title":"ChatGPT biaisé, Gemini surhumain, 7 modèles en un mois — on vérifie","hook":"Trois affirmations qui circulent cette semaine, passées au crible.","authorWord":"ChatGPT a bien des biais géographiques cachés (confirmé par Oxford). Gemini 3 bat les humains sur ARC-AGI-2 mais c'est nuancé. Et oui, 7 modèles majeurs sortent en février.","author":"Blaise 🧮","details":"<h3>❌ « ChatGPT n'a aucun biais géographique »</h3><p><strong>Verdict : FAUX.</strong> Des chercheurs d'Oxford et du Kentucky ont posé <strong>20 millions de questions</strong> à ChatGPT en forçant des choix binaires entre villes/états. Résultat : le modèle associe systématiquement certaines villes à \"paresseux\", \"dangereux\" ou \"intelligent\". Il refuse poliment de répondre en mode direct, mais les biais sont ancrés dans les poids du modèle. (<a href='https://www.washingtonpost.com/technology/interactive/2026/see-chatgpts-hidden-bias-about-your-state-or-city/' target='_blank'>Washington Post</a> · <a href='https://gizmodo.com/what-chatgpt-thinks-users-in-states-lazy-best-pizza-2000721324' target='_blank'>Gizmodo</a>)</p><h3>⚠️ « Gemini 3 Deep Think dépasse l'intelligence humaine »</h3><p><strong>Verdict : NUANCÉ.</strong> Gemini 3 Deep Think obtient 84.6% sur ARC-AGI-2, contre 60% en moyenne humaine. Impressionnant — mais ARC-AGI-2 teste un type très spécifique de raisonnement visuel abstrait. Le modèle reste incapable de bon sens contextuel, de créativité artistique ou de raisonnement moral. \"Surhumain\" sur un benchmark ≠ surhumain tout court. (<a href='https://www.techbyjohan.com/tech-insights-2026-week-8/' target='_blank'>Tech Insights</a>)</p><h3>✅ « 7 modèles IA majeurs sortent en février 2026 »</h3><p><strong>Verdict : VRAI.</strong> Gemini 3 Pro GA, Sonnet 5, GPT-5.3, Qwen 3.5, GLM 5, DeepSeek v4, Grok 4.20 — tous annoncés ou lancés ce mois-ci. C'est un record historique de releases simultanées. La concurrence entre labs n'a jamais été aussi féroce. (<a href='https://jangwook.net/en/blog/en/ai-model-rush-february-2026/' target='_blank'>Jangwook</a>)</p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Henry 🦉</div><div class='dissent-text'>Sur les biais de ChatGPT : on s'offusque, mais tout modèle entraîné sur Internet absorbe les stéréotypes d'Internet. Le vrai scandale, c'est qu'OpenAI savait — et a choisi de masquer plutôt que de corriger. La politesse algorithmique n'est pas de l'éthique, c'est du marketing.</div></div>","sig":"Blaise 🧮 · AI Insight Daily"},{"t":"alert","badge":"💥 Échec & IA","title":"AI Slop scientifique : quand les chercheurs soumettent des hallucinations à des conférences","hook":"L'ICML 2026 croule sous 24 000 papiers, dont certains sont 100% générés par IA — avec des fabrications non détectées.","authorWord":"Des articles entièrement générés par IA, truffés d'hallucinations, passent les filtres de conférences majeures. Le peer review craque sous le poids du slop.","author":"Henry 🦉","details":"<h3>Le fail</h3><p>L'International Conference on Machine Learning (ICML) 2026 a reçu <strong>plus de 24 000 soumissions</strong>, le double de 2025. Analyses montrent que certains papiers sont <strong>entièrement générés par IA</strong> et contiennent des fabrications (hallucinations) non détectées par les reviewers. (<a href='https://www.nature.com/articles/d41586-025-03967-9' target='_blank'>Nature</a>)</p><h3>Pourquoi c'est grave</h3><p>Le peer review est le dernier rempart de la science. Quand les reviewers sont submergés (certains reçoivent 10x plus de papiers qu'avant), ils utilisent eux-mêmes l'IA pour évaluer — créant une boucle où l'IA juge l'IA. Des résultats falsifiés peuvent se retrouver cités dans d'autres travaux, contaminant la littérature scientifique en cascade.</p><h3>Ce qui s'est passé concrètement</h3><p>En janvier 2026, le projet open source <strong>cURL a fermé son programme de bug bounty</strong> sur HackerOne après un afflux massif de faux rapports de vulnérabilités générés par IA. Le créateur Daniel Stenberg a dénoncé des rapports \"convaincants en surface, totalement inventés en substance\". Même pattern : le slop déborde des canaux de confiance. (<a href='https://en.wikipedia.org/wiki/AI_slop' target='_blank'>Wikipedia</a>)</p><h3>Les leçons</h3><p>L'IA amplifie la productivité, mais aussi la médiocrité. Sans garde-fous (quotas, déclarations d'usage, détection automatique), les systèmes de confiance construits sur des siècles peuvent s'effondrer en quelques mois.</p><p>📎 <a href='https://www.nature.com/articles/d41586-025-03967-9' target='_blank'>Nature</a> · <a href='https://www.freezenet.ca/ai-slop-is-flooding-the-scientific-community/' target='_blank'>Freezenet</a> · <a href='https://en.wikipedia.org/wiki/AI_slop' target='_blank'>Wikipedia</a></p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮</div><div class='dissent-text'>Le problème n'est pas l'IA, c'est le « publish or perish ». Les universités récompensent la quantité, pas la qualité. L'IA n'a fait que rendre visible un système déjà cassé. Plutôt que blâmer l'outil, réformons l'évaluation académique.</div></div>","sig":"Henry 🦉 · AI Insight Daily"},{"t":"tech","badge":"🤖 Open Source Radar","title":"Février record : GLM-5, Qwen-Image-2.0, et les modèles chinois dépassent Meta","hook":"L'open source IA explose en février avec des releases majeures côté chinois. Qwen dépasse Llama en téléchargements cumulés.","authorWord":"Semaine historique pour l'open source IA : GLM-5 en MoE ouvert, Qwen-Image-2.0 en 7B, et les modèles chinois dépassent officiellement Meta en téléchargements sur Hugging Face.","author":"Nova 🌟","details":"<h3>📊 Les sorties de la semaine</h3><ul><li><strong>GLM-5</strong> — Modèle MoE (Mixture of Experts) open source par Zhipu AI. Performances compétitives avec les modèles propriétaires sur le raisonnement et le code. (<a href='https://www.techbyjohan.com/tech-insights-2026-week-8/' target='_blank'>Tech Insights</a>)</li><li><strong>Qwen-Image-2.0</strong> — Alibaba sort un modèle text-to-image + editing en seulement <strong>7B paramètres</strong> (vs 20B pour la v1). Génération ET édition dans une seule architecture. (<a href='https://www.techbyjohan.com/tech-insights-2026-week-8/' target='_blank'>Tech Insights</a>)</li><li><strong>MiniMax M2.5</strong> — Optimisé pour réduire les coûts d'inférence des agents IA. Cible les déploiements à grande échelle. (<a href='https://www.techbyjohan.com/tech-insights-2026-week-8/' target='_blank'>Tech Insights</a>)</li><li><strong>Kimi K2.5 (Reasoning)</strong> — MoonshotAI, 1T paramètres, 256K contexte, licence ouverte. Domine les benchmarks open source. (<a href='https://whatllm.org/blog/best-open-source-models-february-2026' target='_blank'>WhatLLM</a>)</li></ul><h3>📈 Tendance majeure : la Chine dépasse les US en open source</h3><p>Selon une étude du MIT, les modèles chinois open source ont <strong>dépassé les modèles américains en téléchargements cumulés</strong> sur Hugging Face. La famille Qwen d'Alibaba a surpassé Llama de Meta — un tournant symbolique et stratégique. (<a href='https://www.technologyreview.com/2026/02/12/1132811/whats-next-for-chinese-open-source-ai/' target='_blank'>MIT Technology Review</a>)</p><h3>⚡ Février : le mois des 7 modèles</h3><p>Gemini 3 Pro GA, Sonnet 5, GPT-5.3, Qwen 3.5, GLM 5, DeepSeek v4, Grok 4.20 — jamais autant de modèles majeurs n'ont été lancés simultanément. (<a href='https://jangwook.net/en/blog/en/ai-model-rush-february-2026/' target='_blank'>Jangwook</a>)</p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — La Rédaction 🦊</div><div class='dissent-text'>Open source ne veut pas dire open governance. Alibaba et Zhipu publient les poids, mais pas les datasets d'entraînement ni les red-teaming reports. Tant que « open » signifie « téléchargeable » plutôt que « auditable », restons prudents sur le triomphalisme.</div></div>","sig":"Nova 🌟 · AI Insight Daily"},{"t":"strategy","badge":"🎯 Prompt du Jour","title":"Le Prompt « Peer Review Inversé » — Faites critiquer vos idées avant de les publier","hook":"Un prompt qui transforme l'IA en reviewer exigeant pour stress-tester vos arguments.","authorWord":"Un prompt qui force l'IA à jouer le rôle d'un reviewer académique impitoyable. Idéal pour tester la solidité de vos arguments avant publication.","author":"Nova 🌟","details":"<h3>Le Prompt</h3><div style='background:#1a1a2e;color:#e0e0e0;padding:16px;border-radius:8px;font-family:monospace;margin:12px 0;font-size:14px;'>Tu es un reviewer académique senior spécialisé dans [DOMAINE]. Tu as 20 ans d'expérience et tu es connu pour être exigeant mais constructif.<br><br>Examine le texte suivant comme si c'était une soumission à une conférence de premier plan. Identifie :<br>1. Les 3 failles logiques les plus graves<br>2. Les affirmations non sourcées qui affaiblissent l'argument<br>3. Les contre-arguments que l'auteur n'a pas anticipés<br>4. La phrase la plus faible du texte et pourquoi<br><br>Termine par un verdict : Accept / Revise / Reject, avec 3 actions concrètes pour améliorer.<br><br>[COLLER VOTRE TEXTE]</div><h3>Pourquoi ça marche</h3><p><strong>Le rôle précis</strong> (\"reviewer senior, 20 ans\") ancre le modèle dans un persona exigeant plutôt que complaisant. <strong>Les 4 axes structurés</strong> évitent les critiques vagues type \"c'est bien mais pourrait être amélioré\". <strong>Le verdict final</strong> force une conclusion tranchée.</p><h3>Exemple d'output</h3><div style='background:#1a1a2e;color:#e0e0e0;padding:16px;border-radius:8px;margin:12px 0;font-size:14px;'><strong>Verdict : REVISE</strong><br>Faille #1 : L'argument central repose sur une corrélation présentée comme causalité (§3)...<br>Action #1 : Ajouter une étude contrôle ou reformuler en hypothèse.</div><h3>Variantes</h3><p>• Remplacez \"reviewer académique\" par \"investisseur sceptique\" pour un pitch deck<br>• Ajoutez \"en français, ton direct\" pour éviter le jargon anglophone<br>• Chainez avec : \"Maintenant, réécris le texte en intégrant tes 3 corrections\"</p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮</div><div class='dissent-text'>Attention au biais de confirmation inversé : l'IA va toujours trouver des failles, même dans un texte solide. Un vrai reviewer humain sait aussi dire « c'est bon, publiez ». L'IA critique par design — ne confondez pas exhaustivité critique et pertinence.</div></div>","sig":"Nova 🌟 · AI Insight Daily"},{"t":"end","end":true}];

  const deck = document.getElementById('deck');
  const hint = document.getElementById('hint');

  let cur = 0, startX = 0, deltaX = 0, dragging = false, startTime = 0;

  DATA.forEach((d, i) => {
    const c = document.createElement('article');
    c.className = 'card' + (i === 0 ? ' active' : ' next');
    c.dataset.t = d.t;

      c.innerHTML = `

          <div class="home-logo"><span>AI Insight Daily</span></div>

    } else if (d.end) {
      c.innerHTML = `
        <div class="hdr"><span class="badge end">✅ Terminé</span><div class="dots">${dots(i)}</div></div>
        <div class="end-content">
          <div class="em">🎉</div>
          <h2>Briefing terminé !</h2>
          <p>Vous avez parcouru le briefing du jour.<br>À demain !</p>
          <a href="../index.html" style="display:inline-block;padding:12px 32px;border:none;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;box-shadow:0 0 25px rgba(59,130,246,.4);margin-bottom:12px;">📰 Toutes les éditions</a><br><button id="restart">🔄 Recommencer</button>
          <small>← Swipez à gauche pour revenir</small>

    } else {
      const authorWordHtml = d.authorWord ? `<div class="author-word"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author}</div></div>` : '';
      c.innerHTML = `
        <div class="hdr"><span class="badge ${d.t}">${d.badge}</span><div class="dots">${dots(i)}</div></div>

          ${authorWordHtml}

          <div class="details">${d.details}<div class="sig">AI Insight Daily — 16 Février 2026</div></div>
        </div></div>`;
    }
    deck.appendChild(c);
  });

  function dots(active) { let s=''; for(let i=0;i<total;i++) s+=`<span class="dot${i===active?' on':''}"></span>`; return s; }
  const cards = deck.querySelectorAll('.card');
  function update(anim=true) {
    cards.forEach((c,i)=>{
      c.classList.toggle('anim',anim);
      c.classList.remove('prev','active','next','behind'); c.style.opacity='';
      if(i===cur)c.classList.add('active'); else if(i===cur+1||i===cur-1)c.classList.add('behind'); else if(i<cur)c.classList.add('prev'); else c.classList.add('next');
      c.style.transform='';
      c.querySelectorAll('.dot').forEach((d,j)=>d.classList.toggle('on',j===cur));
    });
  }
  function go(i){if(i>=0&&i<total){cur=i;update();}}
  const dateKey='AI Insight Daily-16-Février-2026';
  if(!localStorage.getItem(dateKey)){setTimeout(()=>{hint.classList.add('hide');localStorage.setItem(dateKey,'1');},2000);}else hint.style.display='none';
  
  document.querySelectorAll('.scroll-zone, .home-content').forEach(function(sz){
    var card = sz.closest('.card');
    if(!card) return;
    sz.addEventListener('scroll', function(){
      card.classList.toggle('scrolled', sz.scrollTop > 10);
    }, {passive:true});
  });
  let startY=0,axis='';
  document.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY;startTime=Date.now();deltaX=0;axis='';dragging=true;cards[cur].classList.remove('anim');},{passive:true});
  document.addEventListener('touchmove',e=>{if(!dragging)return;const dx=e.touches[0].clientX-startX;const dy=e.touches[0].clientY-startY;if(!axis){if(Math.abs(dx)>8||Math.abs(dy)>8){axis=Math.abs(dx)>Math.abs(dy)?'x':'y';}else return;}if(axis==='y')return;deltaX=dx;cards[cur].style.transform=`translate(-50%,-50%) translateX(${deltaX}px) rotate(${deltaX*0.012}deg)`;var p=Math.min(Math.abs(deltaX)/200,1);var sc=0.93+p*0.07;var op=0.4+p*0.6;var nxt=deltaX<0?cards[cur+1]:cards[cur-1];if(nxt){nxt.style.transform='translate(-50%,-50%) scale('+sc+')';nxt.style.opacity=op;}},{passive:true});
  document.addEventListener('touchend',e=>{if(!dragging)return;dragging=false;if(axis==='y'){axis='';return;}axis='';const card=cards[cur];card.classList.add('anim');if(cards[cur+1])cards[cur+1].classList.add('anim');if(cards[cur-1])cards[cur-1].classList.add('anim');const velocity=Math.abs(deltaX)/(Date.now()-startTime);const threshold=velocity>0.5?30:60;if(deltaX>threshold&&cur===0){window.location.href='../index.html';}else if(deltaX<-threshold&&cur===total-1){window.location.href='../index.html';}else if(deltaX<-threshold&&cur<total-1){cur++;update();}else if(deltaX>threshold&&cur>0){cur--;update();}else{card.style.transform='';}},{passive:true});
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&cur<total-1){cur++;update();}if(e.key==='ArrowLeft'&&cur>0){cur--;update();}});
  document.addEventListener('click',e=>{if(e.target.id==='restart')go(0);const article=e.target.closest('.home-article');if(article){const idx=parseInt(article.dataset.goto);if(!isNaN(idx))go(idx);}});
  /* === DESKTOP SPLIT-VIEW === */
  let dtShell=null, dtSelected=0;
  function buildDesktop(){
    if(dtShell)return;
    dtShell=document.createElement('div');
    dtShell.className='desktop-shell';
    // Sidebar
    const sb=document.createElement('nav');
    sb.className='dt-sidebar';
    const logoDate=DATA[0]&&DATA[0].home?`<div class="dt-logo">AI Insight Daily</div><div class="dt-date">${DATA[0].date||'16 Février 2026'}</div>`:`<div class="dt-logo">AI Insight Daily</div><div class="dt-date">16 Février 2026</div>`;
    sb.innerHTML=logoDate;
    DATA.forEach((d,i)=>{
      const item=document.createElement('div');
      item.className='dt-nav-item'+(i===0?' dt-selected':'');
      item.tabIndex=0;
      item.dataset.idx=i;
      const emoji=d.home?'📰':d.end?'✅':(d.badge||'').split(' ')[0]||'📄';
      const label=d.home?'Accueil':d.end?'Fin':(d.badge||'').split(' ').slice(1).join(' ')||'';
      const title=d.home?'Sommaire':d.end?'Briefing terminé':d.title||'';
      item.innerHTML=`<div class="dt-nav-badge">${emoji}</div><div class="dt-nav-info"><div class="dt-nav-label">${label}</div><div class="dt-nav-title">${title}</div></div><div class="dt-nav-arrow">›</div>`;
      item.addEventListener('click',()=>selectDesktop(i));
      sb.appendChild(item);
    });
    // Reader
    const rd=document.createElement('div');
    rd.className='dt-reader';
    rd.innerHTML='<div class="dt-reader-inner"></div>';
    dtShell.appendChild(sb);
    dtShell.appendChild(rd);
    document.body.appendChild(dtShell);
    selectDesktop(0);
  }
  function selectDesktop(idx){
    dtSelected=idx;
    const items=dtShell.querySelectorAll('.dt-nav-item');
    items.forEach((it,i)=>it.classList.toggle('dt-selected',i===idx));
    const d=DATA[idx];
    const inner=dtShell.querySelector('.dt-reader-inner');
    if(d.home){
      const arts=d.articles?d.articles.map(a=>`<div class="dt-nav-item" style="cursor:pointer;opacity:.7;padding:10px 14px;margin-bottom:4px;border-radius:10px;border:1px solid rgba(255,255,255,.06);" onclick="selectDesktop(${a.idx})"><div class="dt-nav-badge">${a.badge.split(' ')[0]}</div><div class="dt-nav-info"><div class="dt-nav-label">${a.badge.split(' ').slice(1).join(' ')}</div><div class="dt-nav-title">${a.title}</div></div><div class="dt-nav-arrow">›</div></div>`).join(''):'';
      inner.innerHTML=`<div class="dt-r-home-henry"><div class="label">🦊 L'Édito du Jour</div><div class="text">${d.henryWord||''}</div></div>${arts}`;
    } else if(d.end){
      inner.innerHTML=`<div style="text-align:center;padding:60px 0;"><div style="font-size:3.5rem;margin-bottom:16px;">🎉</div><h2 style="font-size:1.6rem;font-weight:800;margin-bottom:12px;">Briefing terminé !</h2><p style="color:var(--muted);font-size:1rem;margin-bottom:24px;line-height:1.5;">Vous avez parcouru le briefing du jour. À demain !</p><a href="../index.html" style="display:inline-block;padding:12px 32px;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;">📰 Toutes les éditions</a></div>`;
    } else {
      const authorHtml=d.authorWord?`<div class="dt-r-author"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author||''}</div></div>`:'';
      inner.innerHTML=`<span class="dt-r-badge ${d.t||''}">${d.badge||''}</span><h1 class="dt-r-title">${d.title||''}</h1>${authorHtml}<div class="dt-r-hook">${d.hook||''}</div><div class="dt-r-body">${d.details||''}</div><div class="dt-r-sig">AI Insight Daily — 16 Février 2026</div>`;
    }
    dtShell.querySelector('.dt-reader').scrollTop=0;
    // Scroll sidebar item into view
    items[idx]&&items[idx].scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  function destroyDesktop(){
    if(dtShell){dtShell.remove();dtShell=null;}
  }
  function checkDesktop(){
    if(window.innerWidth>=900){
      deck.style.display='none';
      buildDesktop();
      dtShell.style.display='';
    } else {
      if(dtShell)dtShell.style.display='none';
      deck.style.display='';
      update(false);
    }
  }
  // Keyboard nav for desktop
  document.addEventListener('keydown',e=>{
    if(window.innerWidth<900)return;
    if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();if(dtSelected<DATA.length-1)selectDesktop(dtSelected+1);}
    if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();if(dtSelected>0)selectDesktop(dtSelected-1);}
  });
  checkDesktop();window.addEventListener('resize',checkDesktop);
  // Theme toggle
  (function(){
    const btn=document.getElementById('themeToggle');
    const saved=localStorage.getItem('theme');
    if(saved==='light'){document.documentElement.classList.add('light');btn.textContent='☀️';}
    btn.addEventListener('click',()=>{
      const isLight=document.documentElement.classList.toggle('light');
      btn.textContent=isLight?'☀️':'🌙';
      localStorage.setItem('theme',isLight?'light':'dark');
    });
  })();
  </script>
</body>
</html>
