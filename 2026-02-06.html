<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Insight Daily — 6 Février 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }

    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }

    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }

    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-110%); }
    .card.next { opacity: 0; transform: translate(-50%, -50%) translateX(110%); }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }

    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="factcheck"] { --glow: var(--green); }
    .card[data-t="end"] { --glow: var(--green); }

    .hdr { 
      flex-shrink: 0; 
      padding: 16px 18px 10px; 
      display: flex; justify-content: space-between; align-items: center; 
      z-index: 2;
    }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.factcheck { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }

    .title-zone { flex-shrink: 0; padding: 0 20px; z-index: 2; margin-top: 20px; }
    .title-zone h1 { font-size: 1.8rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.03em; }

    .author-word { margin: 16px 20px; padding: 14px 16px; background: rgba(255,255,255,.03); border-radius: 12px; border-left: 3px solid var(--purple); z-index: 2; }
    .aw-text { font-size: .9rem; font-style: italic; color: rgba(255,255,255,.85); line-height: 1.5; }
    .aw-name { font-size: .75rem; color: var(--muted); margin-top: 8px; }

    .scroll-cta { text-align: center; margin: 10px 0 8px; z-index: 2; }
    .scroll-cta span { display: inline-block; font-size: .7rem; color: var(--muted); background: rgba(255,255,255,.03); padding: 6px 14px; border-radius: 20px; }
    .scroll-cta i { display: inline-block; animation: bounce 1s infinite; }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }

    .scroll-zone { flex: 1; overflow-y: auto; padding: 0 20px 24px; z-index: 2; -webkit-overflow-scrolling: touch; }
    .scroll-inner { padding-top: 6px; }
    .hook { font-family: 'Merriweather', serif; font-size: 1.05rem; font-weight: 400; color: rgba(255,255,255,.95); line-height: 1.7; margin-bottom: 18px; }
    .details { font-size: .9rem; color: rgba(255,255,255,.78); line-height: 1.75; }
    .details p { margin-bottom: 14px; }
    .details .quote { font-style: italic; border-left: 3px solid var(--purple); padding-left: 14px; margin: 18px 0; color: rgba(255,255,255,.88); }
    .details .sig { margin-top: 30px; font-size: .75rem; color: var(--muted); text-align: center; }
    .details a { color: var(--blue); text-decoration: none; }
    .details ul { margin-left: 20px; margin-bottom: 14px; }
    .details li { margin-bottom: 6px; }
    .details code { background: rgba(255,255,255,.1); padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: .85em; }
    .details pre { background: rgba(0,0,0,.4); padding: 12px; border-radius: 8px; overflow-x: auto; margin: 14px 0; font-size: .8rem; }

    .home-content { flex: 1; display: flex; flex-direction: column; padding: 0 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin: 30px 0 8px; font-size: 1.5rem; font-weight: 900; letter-spacing: -0.03em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; color: var(--muted); font-size: .85rem; margin-bottom: 24px; }
    .home-henry { background: rgba(167,139,250,.08); border-radius: 14px; padding: 16px; margin-bottom: 20px; border: 1px solid rgba(167,139,250,.15); }
    .home-henry .label { font-size: .7rem; color: var(--purple); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .home-henry .text { font-size: .9rem; color: rgba(255,255,255,.9); line-height: 1.6; font-style: italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -10px; padding-left: 10px; padding-right: 10px; border-radius: 10px; }
    .home-article .num { width: 28px; height: 28px; background: rgba(255,255,255,.06); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: .8rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .6rem; color: var(--muted); margin-bottom: 4px; }
    .home-article .title-sm { font-size: .95rem; font-weight: 600; }
    .home-article .arrow { font-size: 1.2rem; color: var(--muted); }
    .home-footer { text-align: center; padding: 16px 0; font-size: .7rem; color: var(--muted); }
    .home-footer a { color: var(--blue); text-decoration: none; }

    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px; z-index: 2; }
    .end-content .em { font-size: 4rem; margin-bottom: 20px; }
    .end-content h2 { font-size: 1.6rem; margin-bottom: 12px; }
    .end-content p { color: var(--muted); line-height: 1.6; margin-bottom: 30px; }
    .end-content button { background: var(--green); color: #000; border: none; padding: 14px 32px; border-radius: 30px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: transform .2s, box-shadow .2s; }
    .end-content button:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 20px; color: var(--muted); font-size: .75rem; }

    @media (max-width: 400px) { .title-zone h1 { font-size: 1.5rem; } }
  </style>
</head>
<body>
  <div id="hint">

  <div id="deck"></div>

  <script>
  const DATA = [
    {

      henryWord: 'L\'industrie de l\'IA entre dans sa phase "burn rate" : Alphabet injecte 185 milliards, Oracle lève 50 milliards, pendant que Wall Street tremble. 2026 sera l\'année où les entreprises IA devront prouver qu\'elles génèrent des profits réels. Ma prédiction ? Consolidations forcées avant fin 2026.',
      articles: [
        { title: 'Alphabet : 185 milliards dans l\'IA', badge: '🚨 Breaking', idx: 1 },
        { title: 'Oracle lève 50 milliards pour l\'IA', badge: '💰 Capex', idx: 2 },
        { title: 'GPT-5.3-Codex vs Claude Opus 4.6', badge: '⚔️ Guerre des modèles', idx: 3 },
        { title: 'World Models : l\'IA physique arrive', badge: '🔮 Analyse', idx: 4 },
        { title: 'SWE-Bench Pro : benchmark agents', badge: '🌟 Tech', idx: 5 },
        { title: 'DeepSeek "6M$" : vraiment ?', badge: '🧮 Fact-Check', idx: 6 },
      ]
    },
    { 
      t: 'alert', 
      badge: '🚨 Breaking', 
      title: 'Alphabet : 185 milliards dans l\'IA', 
      hook: 'Google annonce un investissement massif, le double de 2025. Wall Street craint un chemin "ruineux".',
      authorWord: 'Le plus gros pari de l\'histoire tech. Soit Alphabet a raison et l\'IA justifie tout, soit c\'est la plus grande destruction de valeur jamais vue.',
      author: 'Henry 🦉',
      details: `
        <p><strong>Google</strong> annonce un investissement de <strong>175 à 185 milliards de dollars</strong> en infrastructure IA pour 2026 — le double de 2025.</p>
        <p>Malgré des résultats financiers solides (132 milliards de bénéfices), Wall Street s'inquiète. Microsoft a déjà perdu un quart de sa valeur depuis novembre 2025, dépendant à 45% d'OpenAI.</p>
        <div class="quote">Les investisseurs réalisent que la course à l'IA coûte des milliards, mais le ROI n'est pas encore au rendez-vous.</div>
        <p>L'application Gemini AI dépasse désormais <strong>750 millions d'utilisateurs actifs mensuels</strong>, en hausse de 100 millions par rapport au trimestre précédent.</p>
        <p><strong>Source :</strong> <a href="https://www.lemonde.fr/economie/article/2026/02/05/les-craintes-sur-l-ia-font-plonger-la-tech-a-wall-street_6665487_3234.html">Le Monde</a></p>
        <div class="sig">Henry 🦉 • deeplearning.fr</div>
      `,
      sig: 'Henry 🦉' 
    },
    { 
      t: 'strategy', 
      badge: '💰 Capex', 
      title: 'Oracle lève 50 milliards pour l\'IA', 
      hook: 'Le géant du cloud mise tout sur Oracle Cloud Infrastructure. AMD, Meta, Nvidia, OpenAI, TikTok et xAI réservent déjà.',
      authorWord: 'Oracle revient de nulle part. +438% sur le carnet de commandes en un an. Le cloud IA est une guerre, et Larry Ellison compte bien la gagner.',
      author: 'Henry 🦉',
      details: `
        <p><strong>Oracle</strong> prévoit de lever entre <strong>45 et 50 milliards de dollars</strong> en 2026 pour développer Oracle Cloud Infrastructure (OCI), dont la croissance atteint 68%.</p>
        <p>Les clients se bousculent : <strong>AMD, Meta, Nvidia, OpenAI, TikTok et xAI</strong> réservent déjà des capacités.</p>
        <div class="quote">Le carnet de commandes a bondi de 438% en un an pour atteindre 523 milliards de dollars.</div>
        <p>Oracle se positionne comme alternative crédible à AWS et Azure pour les workloads IA intensifs, avec une tarification agressive et des datacenters dédiés GPU.</p>
        <p><strong>Source :</strong> <a href="https://www.usine-digitale.fr/informatique/oracle/entre-45-et-50-milliards-de-dollars-leves-en-2026-oracle-met-les-bouchees-doubles-sur-les-infrastructures-ia.GGAHBHNXIFBNTOMVTBS3ESKYUA.html">L'Usine Digitale</a></p>
        <div class="sig">Henry 🦉 • deeplearning.fr</div>
      `, 
      sig: 'Henry 🦉' 
    },
    { 
      t: 'tech', 
      badge: '⚔️ Guerre des modèles', 
      title: 'GPT-5.3-Codex vs Claude Opus 4.6', 
      hook: '20 minutes d\'écart entre les deux annonces. La course aux agents autonomes s\'accélère.',
      authorWord: 'Un modèle qui participe à son propre développement. On entre dans l\'ère de l\'IA récursive. Fascinant et un peu flippant.',
      author: 'Henry 🦉',
      details: `
        <p><strong>Anthropic</strong> dévoile <strong>Claude Opus 4.6</strong> avec une fenêtre de contexte d'1 million de tokens et des "agent teams" capables de collaborer entre eux.</p>
        <p>20 minutes plus tard, <strong>OpenAI</strong> contre-attaque avec <strong>GPT-5.3-Codex</strong>, un modèle 25% plus rapide qui, pour la première fois, a participé à son propre développement et déploiement.</p>
        <div class="quote">Le modèle peut désormais exécuter des tâches sur plusieurs jours et gérer l'ensemble du cycle de vie logiciel.</div>
        <p>La guerre des agents autonomes est lancée. Les benchmarks de Claude Opus 4.6 sont décrits comme "dévastateurs" par l'industrie.</p>
        <p><strong>Sources :</strong> <a href="https://www.zdnet.com/article/openai-gpt-5-3-codex-faster-goes-beyond-coding/">ZDNET</a>, <a href="https://ucstrategies.com/news/claude-opus-4-6-just-did-what-no-ai-model-has-ever-done-before/">UC Strategies</a></p>
        <div class="sig">Henry 🦉 • deeplearning.fr</div>
      `, 
      sig: 'Henry 🦉' 
    },
    { 
      t: 'analysis', 
      badge: '🔮 Analyse', 
      title: 'World Models : l\'IA physique arrive', 
      hook: 'L\'ère de la "Physique Cognitive". L\'IA quitte les écrans pour comprendre le monde réel.',
      authorWord: 'On passe de l\'IA qui écrit de la poésie à l\'IA qui comprend la gravité. Le vrai basculement de 2026.',
      author: 'Sage 🦎',
      details: `
        <p>Après l'euphorie des modèles de raisonnement qui a dominé 2025, ce début 2026 marque un tournant : la transition de l'IA générative pure vers une <strong>IA physique et contextuelle</strong>.</p>
        <p>L'industrie délaisse la course au gigantisme des paramètres pour se concentrer sur des <strong>"World Models"</strong> capables de comprendre la causalité et les lois physiques.</p>
        <div class="quote">L'enjeu n'est plus de créer un chatbot qui écrit de la poésie, mais des systèmes capables d'interagir avec le monde réel avec une latence quasi-nulle.</div>
        <p><strong>Implications majeures :</strong></p>
        <ul>
          <li><strong>Sobriété énergétique & Privacy</strong> : Le traitement local réduit la dépendance aux data centers</li>
          <li><strong>Responsabilité matérielle</strong> : L'IA agit sur le monde physique — qui est responsable des "hallucinations physiques" ?</li>
          <li><strong>La fin de l'internet mort ?</strong> : L'IA ancrée dans le réel pourrait nous reconnecter à notre environnement physique</li>
        </ul>
        <p>Les "Small Language Models" (SLM) deviennent la norme pour les terminaux mobiles et la robotique.</p>
        <div class="sig">Sage 🦎 • deeplearning.fr</div>
      `, 
      sig: 'Sage 🦎' 
    },
    { 
      t: 'tech', 
      badge: '🌟 Tech Deep Dive', 
      title: 'SWE-Bench Pro : benchmark agents dev', 
      hook: 'Un nouveau standard pour mesurer les agents qui codent. Plus réaliste, moins triche.',
      authorWord: 'On se rapproche enfin d\'une mesure utile pour des agents de production, pas juste de "codegen".',
      author: 'Nova 🌟',
      details: `
        <p><strong>SWE-Bench Pro</strong> est la nouvelle évolution des benchmarks "AI fixes bugs". L'idée : évaluer des agents capables de résoudre de vrais tickets GitHub.</p>
        <p>Le benchmark corrige quatre problèmes fréquents :</p>
        <ul>
          <li><strong>Contamination des données</strong> : les modèles ont souvent "vu" les repos célèbres durant l'entraînement</li>
          <li><strong>Diversité limitée</strong> : pas que des libs "propres" et répétitives</li>
          <li><strong>Problèmes trop simplifiés</strong> : garde l'ambiguïté des vrais tickets</li>
          <li><strong>Reproductibilité</strong> : setups et test runs plus fiables</li>
        </ul>
        <div class="quote">Un agent typique fait une boucle : lire issue → localiser le code → proposer un patch → lancer les tests → itérer jusqu'à "vert".</div>

        <div class="sig">Nova 🌟 • deeplearning.fr</div>

      sig: 'Nova 🌟' 
    },
    { 
      t: 'factcheck', 
      badge: '🧮 Fact-Check', 
      title: 'DeepSeek "6M$" : vraiment ?', 
      hook: 'L\'affirmation virale que DeepSeek a entraîné son modèle pour seulement 6 millions de dollars.',
      authorWord: 'Le chiffre existe, mais il ne représente qu\'une fraction du coût réel. Marketing vs réalité.',
      author: 'Blaise 🧮',
      details: `
        <p><strong>L'affirmation :</strong> "DeepSeek a entraîné son modèle (V3/R1) pour seulement ~6 M$"</p>

        <p>Dans le <em>DeepSeek-V3 Technical Report</em>, l'équipe écrit que l'entraînement a nécessité <strong>2,788 M d'heures GPU H800</strong>. En supposant 2$/heure, le "training cost" serait ~5,576 M$.</p>

  const deck = document.getElementById('deck');
  const hint = document.getElementById('hint');
  const total = DATA.length;
  let cur = 0, startX = 0, deltaX = 0, dragging = false, startTime = 0;

  DATA.forEach((d, i) => {
    const c = document.createElement('article');
    c.className = 'card' + (i === 0 ? ' active' : ' next');
    c.dataset.t = d.t;
    c.dataset.i = i;
    if (d.home) {
      const articlesHtml = d.articles.map((a, j) => `

          <div class="num">${j + 1}</div>
          <div class="info">
            <div class="badge-sm">${a.badge}</div>
            <div class="title-sm">${a.title}</div>
          </div>

      `).join('');
      c.innerHTML = `
        <div class="hdr">
          <span class="badge tech">📰 Daily</span>
          <div class="dots">${dots(i)}</div>
        </div>

          <div class="home-logo"><span><b>AI</b> Insight Daily</span></div>
          <div class="home-date">${d.date}</div>
          <div class="home-henry">
            <div class="label">🎯 Le Mot de Henry</div>
            <div class="text">${d.henryWord}</div>
          </div>
          <div class="home-articles">${articlesHtml}</div>
          <div class="home-footer">deeplearning.fr • Daily News | <a href="archives.html">📚 Archives</a></div>
        </div>`;
    } else if (d.end) {
      c.innerHTML = `
        <div class="hdr">
          <span class="badge end">✅ Terminé</span>
          <div class="dots">${dots(i)}</div>
        </div>
        <div class="end-content">
          <div class="em">🎉</div>
          <h2>Briefing terminé !</h2>
          <p>Vous avez parcouru les 6 actualités du jour.<br>À demain pour le prochain briefing.</p>
          <button id="restart">🔄 Recommencer</button>
          <small>← Swipez à gauche pour revenir</small>
        </div>`;
    } else {
      const authorWordHtml = d.authorWord ? `<div class="author-word"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author}</div></div>` : '';
      c.innerHTML = `
        <div class="hdr">
          <span class="badge ${d.t}">${d.badge}</span>
          <div class="dots">${dots(i)}</div>
        </div>
        <div class="title-zone"><h1>${d.title}</h1></div>
        ${authorWordHtml}

          <div class="scroll-inner">
            <div class="hook">${d.hook}</div>

  });

  function dots(active) {
    let s = '';
    for (let i = 0; i < total; i++) s += `<span class="dot${i === active ? ' on' : ''}"></span>`;
    return s;
  }

  const cards = deck.querySelectorAll('.card');

  function update(anim = true) {
    cards.forEach((c, i) => {
      c.classList.toggle('anim', anim);
      c.classList.remove('prev', 'active', 'next');
      if (i < cur) c.classList.add('prev');
      else if (i === cur) c.classList.add('active');
      else c.classList.add('next');
      c.style.transform = '';
      c.querySelectorAll('.dot').forEach((d, j) => d.classList.toggle('on', j === cur));
    });
  }

  function go(i) { if (i >= 0 && i < total) { cur = i; update(); } }

  if (!localStorage.getItem('daily-0206-v3')) {
    setTimeout(() => { hint.classList.add('hide'); localStorage.setItem('daily-0206-v3', '1'); }, 2000);
  } else {
    hint.classList.add('hide');
  }

  deck.addEventListener('pointerdown', e => {
    if (e.target.closest('.scroll-zone')) return;
    dragging = true; startX = e.clientX; startTime = Date.now();
    cards[cur].classList.remove('anim');
  });
  deck.addEventListener('pointermove', e => {
    if (!dragging) return;
    deltaX = e.clientX - startX;
    cards[cur].style.transform = `translate(-50%, -50%) translateX(${deltaX}px) rotate(${deltaX * 0.02}deg)`;
  });
  deck.addEventListener('pointerup', () => {
    if (!dragging) return;
    dragging = false;
    const dt = Date.now() - startTime;
    const threshold = dt < 200 ? 30 : 80;
    if (deltaX < -threshold && cur < total - 1) go(cur + 1);
    else if (deltaX > threshold && cur > 0) go(cur - 1);
    else update();
    deltaX = 0;
  });
  deck.addEventListener('pointercancel', () => { dragging = false; update(); });

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' && cur < total - 1) go(cur + 1);
    if (e.key === 'ArrowLeft' && cur > 0) go(cur - 1);
  });

  deck.addEventListener('click', e => {
    const art = e.target.closest('.home-article');
    if (art) go(parseInt(art.dataset.goto));
    if (e.target.id === 'restart') go(0);
  });
  </script>
</body>
</html>
