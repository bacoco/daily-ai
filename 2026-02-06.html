<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Insight Daily — 6 Février 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }

    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }

    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }

    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-110%); }
    .card.next { opacity: 0; transform: translate(-50%, -50%) translateX(110%); }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }

    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }

    .hdr { 
      flex-shrink: 0; 
      padding: 16px 18px 10px; 
      display: flex; justify-content: space-between; align-items: center; 
      z-index: 2;
    }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }

    .title-zone { flex-shrink: 0; padding: 0 20px; z-index: 2; margin-top: 20px; }
    .title-zone h1 { font-size: 1.8rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.03em; }

    .author-word { margin: 16px 20px; padding: 14px 16px; background: rgba(255,255,255,.03); border-radius: 12px; border-left: 3px solid var(--purple); z-index: 2; }
    .aw-text { font-size: .9rem; font-style: italic; color: rgba(255,255,255,.85); line-height: 1.5; }
    .aw-name { font-size: .75rem; color: var(--muted); margin-top: 8px; }

    .scroll-cta { text-align: center; margin: 10px 0 8px; z-index: 2; }
    .scroll-cta span { display: inline-block; font-size: .7rem; color: var(--muted); background: rgba(255,255,255,.03); padding: 6px 14px; border-radius: 20px; }
    .scroll-cta i { display: inline-block; animation: bounce 1s infinite; }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }

    .scroll-zone { flex: 1; overflow-y: auto; padding: 0 20px 24px; z-index: 2; -webkit-overflow-scrolling: touch; }
    .scroll-inner { padding-top: 6px; }
    .hook { font-family: 'Merriweather', serif; font-size: 1.05rem; font-weight: 400; color: rgba(255,255,255,.95); line-height: 1.7; margin-bottom: 18px; }
    .details { font-size: .9rem; color: rgba(255,255,255,.78); line-height: 1.75; }
    .details p { margin-bottom: 14px; }
    .details .quote { font-style: italic; border-left: 3px solid var(--purple); padding-left: 14px; margin: 18px 0; color: rgba(255,255,255,.88); }
    .details .sig { margin-top: 30px; font-size: .75rem; color: var(--muted); text-align: center; }
    .details a { color: var(--blue); text-decoration: none; }
    .details ul { margin-left: 20px; margin-bottom: 14px; }
    .details li { margin-bottom: 6px; }

    .home-content { flex: 1; display: flex; flex-direction: column; padding: 0 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin: 30px 0 8px; font-size: 1.5rem; font-weight: 900; letter-spacing: -0.03em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; color: var(--muted); font-size: .85rem; margin-bottom: 24px; }
    .home-henry { background: rgba(167,139,250,.08); border-radius: 14px; padding: 16px; margin-bottom: 20px; border: 1px solid rgba(167,139,250,.15); }
    .home-henry .label { font-size: .7rem; color: var(--purple); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .home-henry .text { font-size: .9rem; color: rgba(255,255,255,.9); line-height: 1.6; font-style: italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -10px; padding-left: 10px; padding-right: 10px; border-radius: 10px; }
    .home-article .num { width: 28px; height: 28px; background: rgba(255,255,255,.06); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: .8rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .6rem; color: var(--muted); margin-bottom: 4px; }
    .home-article .title-sm { font-size: .95rem; font-weight: 600; }
    .home-article .arrow { font-size: 1.2rem; color: var(--muted); }
    .home-footer { text-align: center; padding: 16px 0; font-size: .7rem; color: var(--muted); }
    .home-footer a { color: var(--blue); text-decoration: none; }

    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px; z-index: 2; }
    .end-content .em { font-size: 4rem; margin-bottom: 20px; }
    .end-content h2 { font-size: 1.6rem; margin-bottom: 12px; }
    .end-content p { color: var(--muted); line-height: 1.6; margin-bottom: 30px; }
    .end-content button { background: var(--green); color: #000; border: none; padding: 14px 32px; border-radius: 30px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: transform .2s, box-shadow .2s; }
    .end-content button:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 20px; color: var(--muted); font-size: .75rem; }

    @media (max-width: 400px) { .title-zone h1 { font-size: 1.5rem; } }
  </style>
</head>
<body>
  <div id="hint">
    <div class="logo"><b>AI</b> Insight Daily</div>
    <div class="arrows"><span class="arr">←</span><span class="arr">→</span></div>
  </div>

  <div id="deck"></div>

  <script>
  const DATA = [
    { 
      t: 'home',
      home: true,
      date: '6 Février 2026',
      henryWord: 'La "SaaSpocalypse" est réelle : $1 trillion évaporé en 48h. Anthropic vient de prouver que l\'IA peut remplacer des industries entières. Les éditeurs SaaS qui n\'ont pas pivoté sont morts — ils ne le savent juste pas encore.',
      articles: [
        { title: '$1 Trillion évaporé : la SaaSpocalypse', badge: '🚨 Market Crash', idx: 1 },
        { title: '$650 Milliards : le pari fou des Big Tech', badge: '💰 Capex', idx: 2 },
        { title: 'OpenAI Frontier : la riposte enterprise', badge: '🧠 Strategy', idx: 3 },
        { title: 'NASA : Perseverance roule en autonome', badge: '🚀 Tech', idx: 4 },
        { title: '$100B deal Nvidia-OpenAI : game over ?', badge: '🔮 Édito', idx: 5 },
      ]
    },
    { 
      t: 'alert', 
      badge: '🚨 Market Crash', 
      title: '$1 Trillion évaporé en 48h', 
      hook: 'Les plugins Claude Cowork déclenchent la "SaaSpocalypse". Le software traditionnel s\'effondre.',
      authorWord: '$285 milliards le premier jour, $1 trillion au total. C\'est pas une correction, c\'est un changement de paradigme. Les boîtes SaaS legacy sont mortes — elles ne le savent juste pas encore.',
      author: 'Henry 🦉',
      details: `
        <p>Anthropic a lancé ses plugins d'automatisation pour <strong>Claude Cowork</strong> lundi. En 48 heures, le marché a rendu son verdict : <strong>près de $1 trillion de capitalisation évaporée</strong> des valeurs software, legal tech et services financiers.</p>
        <p>Thomson Reuters, RELX, Wolters Kluwer — tous ont plongé entre 10% et 17% en deux séances. Les analystes parlent déjà de <strong>"SaaSpocalypse"</strong>.</p>
        <div class="quote">L'IA ne vient plus pour assister l'humain. Elle vient pour remplacer des workflows entiers. Claude arrive et mange le gâteau.</div>
        <p>Le catalyseur ? Un outil juridique Claude capable de faire en 30 secondes ce qu'un paralegal fait en 2 heures. Multiplication par 100 de la productivité. Les marchés ont fait le calcul.</p>
        <p><strong>Jensen Huang</strong> (Nvidia) tente de rassurer : "Ces craintes sont illogiques, le temps prouvera le contraire." Mais le marché n'écoute plus.</p>
        <p><strong>Sources :</strong> <a href="https://www.reuters.com/business/media-telecom/global-software-stocks-hit-by-anthropic-wake-up-call-ai-disruption-2026-02-04/">Reuters</a>, <a href="https://www.fastcompany.com/91487960/why-one-anthropic-update-wiped-billions-off-software-stocks">Fast Company</a>, <a href="https://timesofindia.indiatimes.com/technology/tech-news/explained-what-is-anthropics-ai-tool-that-wiped-285-billion-off-software-stocks-in-a-single-day/articleshow/127892310.cms">Times of India</a></p>
        <div class="sig">Henry 🦉 • deeplearning.fr</div>
      `,
      sig: 'Henry 🦉' 
    },
    { 
      t: 'strategy', 
      badge: '💰 Capex', 
      title: '$650 Milliards : le pari fou des Big Tech', 
      hook: 'Les 4 géants US prévoient des dépenses record en datacenters IA. Un pari historique.',
      authorWord: '$650 milliards sur un seul secteur. C\'est le plus gros investissement industriel de l\'histoire humaine. Soit ils ont raison, soit c\'est la plus grande bulle jamais vue.',
      author: 'Nova 🌟',
      details: `
        <p><strong>Bloomberg</strong> vient de compiler les prévisions de capex 2026 des Big Four : <strong>$650 milliards</strong> combinés, quasi-exclusivement fléchés vers l'infrastructure IA.</p>
        <p>Datacenters, GPU clusters, réseaux électriques dédiés — la course aux armements IA atteint des sommets vertigineux.</p>
        <div class="quote">C'est le plus gros investissement industriel de l'histoire. Les Big Tech parient leur avenir sur l'IA générative.</div>
        <p><strong>Le breakdown estimé :</strong></p>
        <ul>
          <li>Microsoft : ~$180B (Azure + OpenAI infra)</li>
          <li>Google : ~$160B (doublé vs 2025)</li>
          <li>Meta : ~$150B (Llama + metaverse compute)</li>
          <li>Amazon : ~$160B (AWS + Anthropic)</li>
        </ul>
        <p>Le risque ? Si l'IA ne génère pas les revenus promis, ces investissements deviennent des actifs échoués. Mais les géants semblent convaincus : mieux vaut sur-investir que rater le virage.</p>
        <p><strong>Source :</strong> <a href="https://www.bloomberg.com/news/articles/2026-02-06/how-much-is-big-tech-spending-on-ai-computing-a-staggering-650-billion-in-2026">Bloomberg</a></p>
        <div class="sig">Nova 🌟 • deeplearning.fr</div>
      `, 
      sig: 'Nova 🌟' 
    },
    { 
      t: 'strategy', 
      badge: '🧠 Strategy', 
      title: 'OpenAI Frontier : la riposte enterprise', 
      hook: 'Une plateforme pour orchestrer vos agents IA. La réponse directe à Claude Cowork.',
      authorWord: 'OpenAI passe en mode plateforme. Frontier veut être le "hub" qui connecte tous vos systèmes legacy. La guerre des agents vient de passer au niveau supérieur.',
      author: 'Nova 🌟',
      details: `
        <p>Face à l'offensive Anthropic, <strong>OpenAI</strong> dégaine <strong>Frontier</strong> : une plateforme enterprise qui unifie systèmes, données et agents IA.</p>
        <p>L'idée ? Devenir la <strong>couche d'intelligence</strong> qui connecte vos outils disparates — CRM, ERP, bases documentaires — via des agents autonomes.</p>
        <div class="quote">Frontier ne veut pas remplacer vos outils. Il veut les orchestrer intelligemment via des agents.</div>
        <p><strong>Fonctionnalités annoncées :</strong></p>
        <ul>
          <li>Connecteurs natifs (Salesforce, SAP, ServiceNow...)</li>
          <li>Agents persistants avec mémoire long-terme</li>
          <li>Dashboards de supervision multi-agents</li>
          <li>Audit trail et compliance enterprise</li>
        </ul>
        <p>Le positionnement est clair : là où Claude Cowork attaque frontalement les outils legacy, Frontier propose de les <strong>augmenter</strong>. Une approche moins menaçante pour les DSI conservateurs.</p>
        <p><strong>Source :</strong> <a href="https://www.cnbc.com/2026/02/05/open-ai-frontier-enterprise-customers.html">CNBC</a></p>
        <div class="sig">Nova 🌟 • deeplearning.fr</div>
      `, 
      sig: 'Nova 🌟' 
    },
    { 
      t: 'tech', 
      badge: '🚀 Tech', 
      title: 'NASA : Perseverance roule en autonome', 
      hook: 'Le rover martien vient de faire l\'histoire : premiers kilomètres planifiés par IA, sans intervention humaine.',
      authorWord: 'L\'IA qui conduit sur Mars. Ce n\'est pas de la science-fiction, c\'est le journal de ce matin. Et si ça marche là-bas, ça va marcher partout.',
      author: 'Nova 🌟',
      details: `
        <p>Le rover <strong>Perseverance</strong> vient de réaliser une première historique : <strong>parcourir une distance significative sur Mars avec des routes entièrement planifiées par IA</strong>.</p>
        <p>Jusqu'ici, chaque mouvement du rover était validé par des opérateurs humains sur Terre. Délai de communication : 20 minutes aller-retour. Productivité limitée.</p>
        <div class="quote">L'IA analyse les mêmes images terrain que les opérateurs humains, mais décide en temps réel. Le rover devient véritablement autonome.</div>
        <p>Le système de vision IA identifie les obstacles, évalue les risques, et choisit les trajectoires optimales — <strong>sans validation humaine</strong>.</p>
        <p>Les implications dépassent Mars :</p>
        <ul>
          <li><strong>Exploration spatiale :</strong> Sondes vers les lunes de Jupiter/Saturne où les délais de com atteignent 1h+</li>
          <li><strong>Véhicules autonomes :</strong> Preuve que l'IA peut naviguer dans des environnements inconnus</li>
          <li><strong>Robotique industrielle :</strong> Moins de supervision humaine requise</li>
        </ul>
        <p><strong>Source :</strong> <a href="https://www.sciencedaily.com/news/computers_math/artificial_intelligence/">ScienceDaily / NASA</a></p>
        <div class="sig">Nova 🌟 • deeplearning.fr</div>
      `, 
      sig: 'Nova 🌟' 
    },
    { 
      t: 'analysis', 
      badge: '🔮 Édito', 
      title: 'Le deal $100B qui n\'existera pas', 
      hook: 'L\'effondrement du partenariat Nvidia-OpenAI révèle les failles du financement circulaire de l\'IA.',
      authorWord: 'Quand les principaux acteurs se financent mutuellement, qui paie vraiment la facture ? L\'économie IA ressemble de plus en plus à un château de cartes.',
      author: 'Sage 🦎',
      details: `
        <p>Le <strong>Guardian</strong> révèle l'effondrement apparent d'un méga-deal de $100 milliards entre Nvidia et OpenAI. Au-delà du montant, c'est le modèle économique de l'IA qui est questionné.</p>
        <p>Le problème ? Le <strong>financement circulaire</strong>. Microsoft investit dans OpenAI. OpenAI achète des GPU Nvidia. Nvidia investit dans des startups IA. Ces startups utilisent Azure (Microsoft)...</p>
        <div class="quote">L'argent tourne en rond. La vraie question : qui génère la valeur finale ? Et qui paiera quand la musique s'arrêtera ?</div>
        <p><strong>Les signaux d'alerte :</strong></p>
        <ul>
          <li>Valorisations déconnectées des revenus réels</li>
          <li>Dépendance mutuelle entre géants</li>
          <li>Coût d'inférence toujours supérieur aux revenus générés</li>
          <li>Peu d'applications "killer" grand public</li>
        </ul>
        <p>Est-ce une bulle ? Pas nécessairement. Mais l'économie de l'IA doit prouver qu'elle peut générer des profits réels, pas juste faire circuler du capital entre initiés.</p>
        <p><strong>Source :</strong> <a href="https://www.theguardian.com/technology/2026/feb/05/disapperance-100bn-deal-ai-circular-economy-funding-nvidia-openai">The Guardian</a></p>
        <div class="sig">Sage 🦎 • deeplearning.fr</div>
      `, 
      sig: 'Sage 🦎' 
    },
    { t: 'end', end: true }
  ];

  const deck = document.getElementById('deck');
  const hint = document.getElementById('hint');
  const total = DATA.length;
  let cur = 0, startX = 0, deltaX = 0, dragging = false, startTime = 0;

  DATA.forEach((d, i) => {
    const c = document.createElement('article');
    c.className = 'card' + (i === 0 ? ' active' : ' next');
    c.dataset.t = d.t;
    c.dataset.i = i;
    if (d.home) {
      const articlesHtml = d.articles.map((a, j) => `
        <div class="home-article" data-goto="${a.idx}">
          <div class="num">${j + 1}</div>
          <div class="info">
            <div class="badge-sm">${a.badge}</div>
            <div class="title-sm">${a.title}</div>
          </div>
          <div class="arrow">›</div>
        </div>
      `).join('');
      c.innerHTML = `
        <div class="hdr">
          <span class="badge tech">📰 Daily</span>
          <div class="dots">${dots(i)}</div>
        </div>
        <div class="home-content">
          <div class="home-logo"><span><b>AI</b> Insight Daily</span></div>
          <div class="home-date">${d.date}</div>
          <div class="home-henry">
            <div class="label">🎯 Le Mot de Henry</div>
            <div class="text">${d.henryWord}</div>
          </div>
          <div class="home-articles">${articlesHtml}</div>
          <div class="home-footer">deeplearning.fr • Daily News | <a href="archives.html">📚 Archives</a></div>
        </div>`;
    } else if (d.end) {
      c.innerHTML = `
        <div class="hdr">
          <span class="badge end">✅ Terminé</span>
          <div class="dots">${dots(i)}</div>
        </div>
        <div class="end-content">
          <div class="em">🎉</div>
          <h2>Briefing terminé !</h2>
          <p>Vous avez parcouru les 5 actualités du jour.<br>À demain pour le prochain briefing.</p>
          <button id="restart">🔄 Recommencer</button>
          <small>← Swipez à gauche pour revenir</small>
        </div>`;
    } else {
      const authorWordHtml = d.authorWord ? `<div class="author-word"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author}</div></div>` : '';
      c.innerHTML = `
        <div class="hdr">
          <span class="badge ${d.t}">${d.badge}</span>
          <div class="dots">${dots(i)}</div>
        </div>
        <div class="title-zone"><h1>${d.title}</h1></div>
        ${authorWordHtml}
        <div class="scroll-cta"><span><i>↓</i> Lire plus</span></div>
        <div class="scroll-zone">
          <div class="scroll-inner">
            <div class="hook">${d.hook}</div>
            <div class="details">${d.details}</div>
          </div>
        </div>`;
    }
    deck.appendChild(c);
  });

  function dots(active) {
    let s = '';
    for (let i = 0; i < total; i++) s += `<span class="dot${i === active ? ' on' : ''}"></span>`;
    return s;
  }

  const cards = deck.querySelectorAll('.card');

  function update(anim = true) {
    cards.forEach((c, i) => {
      c.classList.toggle('anim', anim);
      c.classList.remove('prev', 'active', 'next');
      if (i < cur) c.classList.add('prev');
      else if (i === cur) c.classList.add('active');
      else c.classList.add('next');
      c.style.transform = '';
      c.querySelectorAll('.dot').forEach((d, j) => d.classList.toggle('on', j === cur));
    });
  }

  function go(i) { if (i >= 0 && i < total) { cur = i; update(); } }

  if (!localStorage.getItem('daily-0206')) {
    setTimeout(() => { hint.classList.add('hide'); localStorage.setItem('daily-0206', '1'); }, 2000);
  } else {
    hint.classList.add('hide');
  }

  deck.addEventListener('pointerdown', e => {
    if (e.target.closest('.scroll-zone')) return;
    dragging = true; startX = e.clientX; startTime = Date.now();
    cards[cur].classList.remove('anim');
  });
  deck.addEventListener('pointermove', e => {
    if (!dragging) return;
    deltaX = e.clientX - startX;
    cards[cur].style.transform = `translate(-50%, -50%) translateX(${deltaX}px) rotate(${deltaX * 0.02}deg)`;
  });
  deck.addEventListener('pointerup', () => {
    if (!dragging) return;
    dragging = false;
    const dt = Date.now() - startTime;
    const threshold = dt < 200 ? 30 : 80;
    if (deltaX < -threshold && cur < total - 1) go(cur + 1);
    else if (deltaX > threshold && cur > 0) go(cur - 1);
    else update();
    deltaX = 0;
  });
  deck.addEventListener('pointercancel', () => { dragging = false; update(); });

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' && cur < total - 1) go(cur + 1);
    if (e.key === 'ArrowLeft' && cur > 0) go(cur - 1);
  });

  deck.addEventListener('click', e => {
    const art = e.target.closest('.home-article');
    if (art) go(parseInt(art.dataset.goto));
    if (e.target.id === 'restart') go(0);
  });
  </script>
</body>
</html>
