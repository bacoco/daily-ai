<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Insight Daily</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }

    /* HINT */
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }

    /* DECK */
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }

    /* CARD */
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-110%); }
    .card.next { opacity: 0; transform: translate(-50%, -50%) translateX(110%); }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }

    /* GLOW */
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }

    /* HEADER */
    .hdr { 
      flex-shrink: 0; 
      padding: 16px 18px 10px; 
      display: flex; justify-content: space-between; align-items: center; 
      z-index: 2;
    }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }

    /* === TITRE CENTRÉ (fixe) === */
    .title-zone {
      flex-shrink: 0;
      padding: 20px 22px 16px;
      text-align: center;
      z-index: 2;
    }
    .title-zone h1 {
      font-size: 1.6rem;
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -0.02em;
    }

    /* === SCROLL CTA === */
    .scroll-cta {
      flex-shrink: 0;
      padding: 10px 20px 14px;
      text-align: center;
      z-index: 2;
    }
    .scroll-cta span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: .68rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .scroll-cta i {
      display: inline-block;
      animation: bounce 1.2s infinite;
    }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }

    /* === ZONE SCROLL (accroche + details) === */
    .scroll-zone { 
      flex: 1; 
      overflow-y: auto; 
      -webkit-overflow-scrolling: touch; 
      z-index: 1;
      overscroll-behavior: contain;
    }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }

    .scroll-inner { padding: 0 20px 30px; }

    /* Accroche */
    .hook {
      font-size: 1.1rem;
      font-weight: 600;
      line-height: 1.45;
      color: rgba(255,255,255,.9);
      padding: 16px 18px;
      margin-bottom: 22px;
      background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%);
      border-radius: 14px;
      border-left: 3px solid var(--glow, var(--blue));
    }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }

    /* Details */
    .details p { 
      font-family: 'Merriweather', Georgia, serif; 
      font-size: .9rem; 
      line-height: 1.8; 
      color: rgba(255,255,255,.8); 
      margin-bottom: 16px; 
      font-weight: 300; 
    }
    .details strong { color: #fff; font-weight: 600; }
    .details .quote {
      border-left: 3px solid var(--blue); 
      padding: 12px 16px; 
      margin: 18px 0;
      background: rgba(59,130,246,.08); 
      border-radius: 0 10px 10px 0;
      font-family: 'Merriweather', serif; 
      font-style: italic; 
      font-size: .92rem; 
      line-height: 1.55; 
      color: rgba(255,255,255,.9);
    }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { 
      margin-top: 22px; 
      padding-top: 14px; 
      border-top: 1px solid rgba(255,255,255,.1); 
      font-size: .72rem; 
      color: var(--muted); 
      font-style: italic;
      text-align: center;
    }

    /* Author word under title */
    .author-word {
      margin: 0 20px 10px;
      padding: 10px 14px;
      background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%);
      border-radius: 10px;
      border-left: 3px solid var(--gold);
      z-index: 2;
      flex-shrink: 0;
    }
    .author-word .aw-text {
      font-family: 'Merriweather', serif;
      font-size: .82rem;
      line-height: 1.5;
      color: rgba(255,255,255,.85);
      font-style: italic;
    }
    .author-word .aw-name {
      margin-top: 5px;
      font-size: .6rem;
      color: var(--muted);
      text-align: right;
    }

    /* END */
    .end-content { 
      flex: 1; 
      display: flex; flex-direction: column; 
      align-items: center; justify-content: center; 
      text-align: center; 
      padding: 30px 20px; 
      z-index: 2; 
    }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { 
      padding: 12px 32px; border: none; border-radius: 12px; 
      background: var(--green); color: #000; 
      font-size: .95rem; font-weight: 700; 
      cursor: pointer; 
      box-shadow: 0 0 25px rgba(16,185,129,.4); 
    }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }

    /* HOME CARD */
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      z-index: 2;
      overflow-y: auto;
    }
    .home-logo {
      text-align: center;
      margin-bottom: 8px;
    }
    .home-logo span {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: -0.02em;
    }
    .home-logo b {
      background: linear-gradient(135deg, var(--blue), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .home-date {
      text-align: center;
      font-size: .8rem;
      color: var(--muted);
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .home-henry {
      padding: 14px 16px;
      background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%);
      border-radius: 12px;
      border-left: 3px solid var(--gold);
      margin-bottom: 24px;
    }
    .home-henry .label {
      font-size: .65rem;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      font-weight: 700;
    }
    .home-henry .text {
      font-family: 'Merriweather', serif;
      font-size: .9rem;
      line-height: 1.55;
      color: rgba(255,255,255,.9);
      font-style: italic;
    }
    .home-articles {
      flex: 1;
    }
    .home-article {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255,255,255,.06);
      cursor: pointer;
      transition: background .2s;
    }
    .home-article:hover {
      background: rgba(255,255,255,.03);
      margin: 0 -20px;
      padding-left: 20px;
      padding-right: 20px;
    }
    .home-article:last-child { border-bottom: none; }
    .home-article .num {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(255,255,255,.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .75rem;
      font-weight: 700;
      color: var(--muted);
      flex-shrink: 0;
    }
    .home-article .info { flex: 1; }
    .home-article .badge-sm {
      font-size: .55rem;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .home-article .title-sm {
      font-size: .9rem;
      font-weight: 600;
      line-height: 1.3;
    }
    .home-article .arrow {
      color: var(--muted);
      font-size: 1.2rem;
    }
    .home-footer {
      text-align: center;
      padding-top: 16px;
      font-size: .7rem;
      color: var(--muted);
    }
    .home-footer a {
      color: var(--gold);
      text-decoration: none;
      margin-left: 8px;
    }
    .home-footer a:hover {
      text-decoration: underline;
    }

    /* Le Mot de Henry */
    .henry-word {
      margin-top: 24px;
      padding: 16px;
      background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,71,87,.05) 100%);
      border-radius: 12px;
      border: 1px solid rgba(245,158,11,.2);
    }
    .henry-word .label {
      font-size: .7rem;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
      font-weight: 700;
    }
    .henry-word .text {
      font-family: 'Merriweather', serif;
      font-size: .95rem;
      line-height: 1.6;
      color: rgba(255,255,255,.9);
      font-style: italic;
    }

    /* BG */
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
  </style>
</head>
<body>

  <div id="deck"></div>

  <script>
  const DATA = [
    {

      ]
    },
    { 
      t: 'alert', 
      badge: '🚨 Breaking', 
      title: 'Alphabet : 185 milliards dans l\'IA', 
      hook: 'Google annonce un investissement massif, le double de 2025. Wall Street craint un chemin "ruineux".',
      authorWord: 'Le plus gros pari de l\'histoire tech. Soit Alphabet a raison, soit c\'est la plus grande destruction de valeur jamais vue.',
      author: 'Henry 🦉',
      details: '<p><strong>Google</strong> annonce un investissement de <strong>175 à 185 milliards de dollars</strong> en infrastructure IA pour 2026 — le double de 2025.</p><p>Malgré des résultats financiers solides (132 milliards de bénéfices), Wall Street s\'inquiète. Microsoft a perdu un quart de sa valeur depuis novembre 2025.</p><div class="quote">Les investisseurs réalisent que la course à l\'IA coûte des milliards, mais le ROI n\'est pas encore au rendez-vous.</div><p>L\'application Gemini AI dépasse <strong>750 millions d\'utilisateurs actifs mensuels</strong>.</p><p><strong>Source :</strong> Le Monde</p>',

    },
    { 
      t: 'strategy', 
      badge: '💰 Capex', 
      title: 'Oracle lève 50 milliards', 
      hook: 'Le géant du cloud mise tout sur Oracle Cloud Infrastructure. AMD, Meta, Nvidia, OpenAI réservent déjà.',
      authorWord: 'Oracle revient de nulle part. +438% sur le carnet de commandes en un an.',
      author: 'Henry 🦉',
      details: '<p><strong>Oracle</strong> prévoit de lever entre <strong>45 et 50 milliards de dollars</strong> en 2026 pour développer OCI, dont la croissance atteint 68%.</p><p>Les clients se bousculent : <strong>AMD, Meta, Nvidia, OpenAI, TikTok et xAI</strong>.</p><div class="quote">Le carnet de commandes a bondi de 438% en un an pour atteindre 523 milliards de dollars.</div><p><strong>Source :</strong> L\'Usine Digitale</p>',
      sig: 'Henry 🦉' 
    },
    { 
      t: 'tech', 
      badge: '⚔️ Guerre', 
      title: 'GPT-5.3-Codex vs Claude Opus 4.6', 
      hook: '20 minutes d\'écart entre les deux annonces. La course aux agents autonomes s\'accélère.',

      details: '<p><strong>Anthropic</strong> dévoile <strong>Claude Opus 4.6</strong> avec une fenêtre de contexte d\'1 million de tokens et des "agent teams".</p><p>20 minutes plus tard, <strong>OpenAI</strong> contre-attaque avec <strong>GPT-5.3-Codex</strong>, 25% plus rapide, qui a participé à son propre développement.</p><div class="quote">Le modèle peut désormais exécuter des tâches sur plusieurs jours et gérer l\'ensemble du cycle de vie logiciel.</div><p><strong>Sources :</strong> ZDNET, UC Strategies</p>',

    {

    { 
      t: 'strategy', 
      badge: '🧮 Fact-Check', 
      title: 'DeepSeek "6M$" ?', 
      hook: 'L\'affirmation virale que DeepSeek a entraîné son modèle pour seulement 6 millions de dollars.',
      authorWord: 'Le chiffre existe, mais il ne représente qu\'une fraction du coût réel.',
      author: 'Blaise 🧮',
      details: '<p><strong>Affirmation :</strong> "DeepSeek a entraîné son modèle pour ~6 M$"</p><p style="font-size: 1.1rem; font-weight: 700; color: #f59e0b;">⚠️ VERDICT : NUANCÉ</p><p>Le papier technique indique ~5,576 M$ pour la run officielle, <strong>mais n\'inclut pas</strong> les coûts R&D, ablations, etc.</p><div class="quote">SemiAnalysis estime des dépenses CapEx de l\'ordre du milliard.</div><p><strong>Sources :</strong> ArXiv 2412.19437, SemiAnalysis</p>',
      sig: 'Blaise 🧮' 
    },
    { t: 'end', end: true }

  const deck = document.getElementById('deck');
  const hint = document.getElementById('hint');
  const total = DATA.length;
  let cur = 0, startX = 0, deltaX = 0, dragging = false, startTime = 0;

  DATA.forEach((d, i) => {
    const c = document.createElement('article');
    c.className = 'card' + (i === 0 ? ' active' : ' next');
    c.dataset.t = d.t;
    c.dataset.i = i;
    if (d.home) {
      const articlesHtml = d.articles.map((a, j) => `
        <div class="home-article" data-goto="${a.idx}">
          <div class="num">${j + 1}</div>
          <div class="info">
            <div class="badge-sm">${a.badge}</div>
            <div class="title-sm">${a.title}</div>
          </div>
          <div class="arrow">›</div>
        </div>
      `).join('');
      c.innerHTML = `
        <div class="hdr">
          <span class="badge tech">📰 Daily</span>
          <div class="dots">${dots(i)}</div>
        </div>
        <div class="home-content">
          <div class="home-logo"><span><b>AI</b> Insight Daily</span></div>
          <div class="home-date">${d.date}</div>
          <div class="home-henry">
            <div class="label">🎯 Le Mot de Henry</div>
            <div class="text">${d.henryWord}</div>
          </div>
          <div class="home-articles">${articlesHtml}</div>
          <div class="home-footer">deeplearning.fr • Daily News | <a href="archives.html">📚 Archives</a></div>
        </div>`;
    } else if (d.end) {
      c.innerHTML = `
        <div class="hdr">
          <span class="badge end">✅ Terminé</span>
          <div class="dots">${dots(i)}</div>
        </div>
        <div class="end-content">
          <div class="em">🎉</div>
          <h2>Briefing terminé !</h2>
          <p>Vous avez parcouru les 6 actualités du jour.<br>À demain pour le prochain briefing.</p>
          <button id="restart">🔄 Recommencer</button>
          <small>← Swipez à gauche pour revenir</small>
        </div>`;
    } else {
      const authorWordHtml = d.authorWord ? `<div class="author-word"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author}</div></div>` : '';
      c.innerHTML = `
        <div class="hdr">
          <span class="badge ${d.t}">${d.badge}</span>
          <div class="dots">${dots(i)}</div>
        </div>
        <div class="title-zone"><h1>${d.title}</h1></div>
        ${authorWordHtml}
        <div class="scroll-cta"><span><i>↓</i> Lire plus</span></div>
        <div class="scroll-zone">
          <div class="scroll-inner">
            <div class="hook">${d.hook}</div>
            <div class="details">${d.details}<div class="sig">deeplearning.fr • Daily News</div></div>
          </div>
        </div>`;
    }
    deck.appendChild(c);
  });

  function dots(active) {
    let s = '';
    for (let i = 0; i < total; i++) s += `<span class="dot${i === active ? ' on' : ''}"></span>`;
    return s;
  }

  const cards = deck.querySelectorAll('.card');

  function update(anim = true) {
    cards.forEach((c, i) => {
      c.classList.toggle('anim', anim);
      c.classList.remove('prev', 'active', 'next');
      if (i < cur) c.classList.add('prev');
      else if (i === cur) c.classList.add('active');
      else c.classList.add('next');
      c.style.transform = '';
      c.querySelectorAll('.dot').forEach((d, j) => d.classList.toggle('on', j === cur));
    });
  }

  function go(i) { if (i >= 0 && i < total) { cur = i; update(); } }

  if (!localStorage.getItem('daily-0206')) {
    setTimeout(() => { hint.classList.add('hide'); localStorage.setItem('daily-0206', '1'); }, 2000);
  } else hint.style.display = 'none';

  document.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
    startTime = Date.now();
    deltaX = 0;
    dragging = true;
    cards[cur].classList.remove('anim');
  }, { passive: true });

  document.addEventListener('touchmove', e => {
    if (!dragging) return;
    deltaX = e.touches[0].clientX - startX;
    cards[cur].style.transform = `translate(-50%, -50%) translateX(${deltaX}px) rotate(${deltaX * 0.012}deg)`;
  }, { passive: true });

  document.addEventListener('touchend', e => {
    if (!dragging) return;
    dragging = false;
    const card = cards[cur];
    card.classList.add('anim');
    const velocity = Math.abs(deltaX) / (Date.now() - startTime);
    const threshold = velocity > 0.5 ? 30 : 60;
    if (deltaX < -threshold && cur < total - 1) { cur++; update(); }
    else if (deltaX > threshold && cur > 0) { cur--; update(); }
    else { card.style.transform = ''; }
  }, { passive: true });

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' && cur < total - 1) { cur++; update(); }
    if (e.key === 'ArrowLeft' && cur > 0) { cur--; update(); }
  });

  document.addEventListener('click', e => {
    if (e.target.id === 'restart') go(0);
    const article = e.target.closest('.home-article');
    if (article) { const idx = parseInt(article.dataset.goto); if (!isNaN(idx)) go(idx); }
  });
  </script>
</body>
</html>
