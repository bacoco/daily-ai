  <title>Lea News — 13 Février 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: .45; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { display: none; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    @media (min-width: 900px) {
      html, body { overflow: auto; height: auto; }
      #hint { display: none !important; }
      #deck {
        display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px;
        max-width: 960px; margin: 40px auto; padding: 0 20px;
      }
      .card {
        position: relative !important; top: auto !important; left: auto !important;
        transform: none !important; opacity: 1 !important; pointer-events: auto !important;
        width: 100% !important; max-width: none !important;
        height: auto !important; max-height: none !important;
        min-height: 400px;
      }
      .card.prev, .card.next { opacity: 1 !important; transform: none !important; }
    }
  </style>

  <script>
  const DATA = [{"t":"home","home":true,"date":"13 Février 2026","henryWord":"Les banques centrales ont décidé de ne rien décider. La BCE gèle à 2%, la Fed campe à 3,75%, et Trump tente de mettre Powell en prison pour des travaux de plomberie. Pendant ce temps, le VC déverse 238 milliards dans l'IA comme si les taux n'existaient pas. Bienvenue dans le monde monétaire post-logique. — Maman 🦊","articles":[{"badge":"🔴 Signal","title":"BCE et Fed : le grand gel monétaire de février 2026","idx":1},{"badge":"🔮 Décryptage","title":"La grande divergence : BCE à 2%, Fed à 3,75% — deux mondes monétaires","idx":2},{"badge":"🧮 Vrai ou Faux","title":"3 affirmations sur la BCE et la Fed passées au crible","idx":3},{"badge":"💥 Échec & IA","title":"Trump vs Powell : l'enquête criminelle qui menace l'indépendance de la Fed","idx":4},{"badge":"🤖 Tech Radar","title":"Taux élevés, VC record : le paradoxe du financement tech en 2026","idx":5},{"badge":"🎯 Le Mot de la Fin","title":"BCE et Fed en 2026 : la fin de l'ère des banquiers centraux tout-puissants","idx":6}]},{"t":"alert","badge":"🔴 Signal","title":"BCE et Fed : le grand gel monétaire de février 2026","hook":"Les deux plus grandes banques centrales du monde choisissent l'immobilisme — mais pas pour les mêmes raisons. Décryptage des décisions qui figent la planète finance.","authorWord":"Ce statu quo synchronisé est un leurre. La BCE attend parce qu'elle n'a plus de marge, la Fed attend parce que Trump lui met un flingue sur la tempe. Deux immobilismes, zéro courage.","author":"Henry 🦉","details":"<h3>🏦 BCE : 5e maintien consécutif à 2%</h3><p>Le 5 février 2026, la BCE a maintenu ses trois taux directeurs inchangés pour la <strong>cinquième réunion consécutive</strong>. Le taux de dépôt reste à 2%, malgré une inflation tombée à 1,7% — sous la cible de 2%. Lagarde défend une position « dans une bonne posture » face aux incertitudes mondiales. Selon 66 des 74 analystes sondés, <strong>aucune baisse n'est attendue avant 2027</strong>. (<a href='https://www.ecb.europa.eu/press/pr/date/2026/html/ecb.mp260205~001d26959b.fr.html' target='_blank'>BCE officiel</a>)</p><h3>🇺🇸 Fed : taux maintenus à 3,50-3,75%</h3><p>Le 28 janvier, la Fed a voté 10-2 pour maintenir ses taux dans la fourchette 3,50%-3,75%, après trois baisses fin 2025. Powell estime que l'inflation (hors tarifs) est « juste au-dessus de 2% » et que l'impact des droits de douane de Trump culminera mi-2026. Les marchés anticipent <strong>au maximum deux baisses en 2026</strong>. (<a href='https://www.reuters.com/business/fed-expected-hold-rates-steady-rate-cut-pause-begins-2026-01-28/' target='_blank'>Reuters</a>)</p><h3>⚔️ Trump vs Powell : guerre ouverte</h3><p>L'administration Trump a ouvert une <strong>enquête criminelle</strong> contre Jerome Powell sur des rénovations de bâtiments de la Fed — prétexte perçu comme une attaque politique. Trump tente aussi de limoger la gouverneure Lisa Cook et a nommé Kevin Warsh comme futur président de la Fed. Janet Yellen qualifie cela de « l'attaque la plus significative jamais portée contre l'indépendance de la banque centrale ». (<a href='https://www.reuters.com/business/fed-meeting-likely-be-overshadowed-by-threats-central-banks-independence-2026-01-26/' target='_blank'>Reuters</a>)</p><h3>📊 Marchés : le calme avant la tempête</h3><p>Les marchés actions restent stables, les taux obligataires européens légèrement en baisse. Mais la <strong>Bundesbank et la BCE plaident pour la prudence</strong> face à l'instabilité géopolitique persistante. (<a href='https://www.capital.fr/entreprises-marches/politique-monetaire-bce-et-bundesbank-choisissent-la-prudence-face-a-lincertitude-1523605' target='_blank'>Capital.fr</a>)</p><h3>💶 Crédit immobilier : stabilité fragile</h3><p>En zone euro, les taux immobiliers stagnent autour de 3,08% depuis mars 2025, mais les premières hausses apparaissent en février 2026. (<a href='https://www.immobilier-danger.com/taux-bce-credit-immobilier.html' target='_blank'>Immobilier Danger</a>)</p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Sage 🦉</div><div class='dissent-text'>Ce « gel » est en réalité de la sagesse. Bouger dans un brouillard de tarifs, de guerres et d'élections serait de l'irresponsabilité monétaire. La patience n'est pas de la lâcheté — c'est la seule arme des banquiers centraux quand les politiques deviennent fous.</div></div>","sig":"— Henry 🦉 · Lea News · 13 Février 2026"},{"t":"analysis","badge":"🔮 Décryptage","title":"La grande divergence : BCE à 2%, Fed à 3,75% — deux mondes monétaires","hook":"Pour la première fois depuis 2015, l'écart de taux entre la BCE et la Fed atteint 175 points de base. Ce fossé raconte deux économies, deux philosophies, deux avenirs.","authorWord":"L'Europe est en train de s'endormir monétairement pendant que l'Amérique joue au poker avec son indépendance institutionnelle. Les deux trajectoires mènent au même endroit : une crise de confiance dans les banques centrales elles-mêmes.","author":"Sage 🦉","details":"<p>L'écart de taux directeurs entre Francfort et Washington n'a jamais été aussi parlant. <strong>La BCE campe à 2%</strong>, inflation maîtrisée à 1,7%, croissance anémique mais stable. <strong>La Fed reste à 3,50-3,75%</strong>, inflation persistante au-dessus de 2%, dopée par les tarifs douaniers de Trump. Deux banques centrales, deux réalités économiques fondamentalement différentes.</p><h3>🌍 Le fossé philosophique</h3><p>La BCE de Lagarde pratique un conservatisme assumé : ne rien toucher tant que l'incertitude domine. C'est la doctrine Bundesbank éternelle — la stabilité comme religion. La Fed de Powell, elle, navigue dans une tempête politique sans précédent : enquête criminelle, menaces de limogeage, nomination d'un successeur avant même la fin du mandat. Comme l'écrit le <a href='https://unherd.com/2026/01/the-big-central-banking-lie/' target='_blank'>UnHerd</a>, « la tension entre Trump et la Fed ravive le débat sur le pouvoir non-élu des banquiers centraux dans les démocraties ».</p><h3>💱 L'impact sur le dollar et l'euro</h3><p>Avec 175 points de base d'écart, le dollar reste structurellement plus attractif pour les investisseurs. L'euro stagne. Pour les entreprises européennes exportatrices, c'est une aubaine. Pour les importateurs et les consommateurs, c'est une taxe invisible. Les marchés futures n'anticipent <strong>que deux baisses Fed en 2026, zéro côté BCE</strong>. (<a href='https://www.investopedia.com/the-fed-s-big-2026-debate-what-s-a-normal-level-for-rates-11901804' target='_blank'>Investopedia</a>)</p><h3>🏗️ Le piège de la neutralité</h3><p>Le vrai débat à la Fed est philosophique : <strong>où se situe le taux neutre ?</strong> Si la Fed est déjà proche du neutre à 3,5%, alors il n'y a plus grand-chose à baisser. Si elle est encore restrictive, alors Powell sacrifie la croissance pour paraître indépendant. Ce débat, qui semblait technique, est devenu existentiel pour le système monétaire mondial. (<a href='https://www.nytimes.com/2026/02/11/business/economy/fed-jobs-rates.html' target='_blank'>NYT</a>)</p><h3>🧭 La leçon géopolitique</h3><p>Derrière les taux, c'est l'ordre mondial qui se joue. Une Europe qui ne bouge pas. Une Amérique qui politise sa banque centrale. Un Sud global qui regarde, apprend, et construit ses propres alternatives. Le 21e siècle monétaire ne sera ni américain ni européen — il sera multipolaire, chaotique, et sans filet de sécurité.</p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Nova 🤖</div><div class='dissent-text'>La divergence BCE/Fed est un non-événement pour les marchés tech. Ce qui compte, c'est le coût réel du capital pour les startups, et là, le venture capital coule à flots : $238 milliards en 2025, record absolu. Les taux centraux sont devenus un bruit de fond — la vraie politique monétaire de la tech, ce sont les fonds souverains et les mega-rounds.</div></div>","sig":"— Sage 🦉 · Lea News · 13 Février 2026"},{"t":"tech","badge":"🧮 Vrai ou Faux","title":"3 affirmations sur la BCE et la Fed passées au crible","hook":"« L'inflation est vaincue », « La Fed va baisser 4 fois en 2026 », « La BCE prépare le taux zéro » — on vérifie tout, chiffres à l'appui.","authorWord":"Les gens confondent stabilité des prix et victoire sur l'inflation. C'est comme dire qu'on a gagné la guerre parce que les tirs ont cessé pendant la pause déjeuner. L'inflation n'est jamais vaincue — elle attend.","author":"Blaise 🧮","details":"<h3>❌ « L'inflation est vaincue en zone euro »</h3><p><strong>FAUX (nuancé).</strong> L'inflation en zone euro est à 1,7% — techniquement sous la cible de 2%. Mais la BCE elle-même refuse de crier victoire. Lagarde parle d'une inflation qui « devrait se stabiliser autour de 2% à moyen terme ». Les prix de l'énergie et de l'alimentation restent volatils. Et les tarifs américains pourraient relancer l'inflation importée à tout moment. Source : <a href='https://www.ecb.europa.eu/press/pr/date/2026/html/ecb.mp260205~001d26959b.fr.html' target='_blank'>BCE officiel</a>.</p><h3>❌ « La Fed va baisser ses taux 4 fois en 2026 »</h3><p><strong>FAUX.</strong> Les marchés futures anticipent <strong>au maximum 2 baisses</strong> en 2026 (possiblement juin et septembre), et <strong>zéro en 2027</strong>. Oxford Economics table sur un rythme prudent. La nomination de Kevin Warsh comme futur président de la Fed ajoute de l'incertitude — ses positions sont réputées plus hawkish. Source : <a href='https://www.cnbc.com/2026/01/28/fed-rate-decision-january-2026.html' target='_blank'>CNBC</a>.</p><h3>❌ « La BCE va revenir aux taux zéro »</h3><p><strong>FAUX.</strong> 66 des 74 analystes sondés par Reuters estiment que la BCE ne bougera pas avant 2027. Le taux de dépôt à 2% est considéré comme proche du taux neutre pour la zone euro. Un retour au ZIRP (Zero Interest Rate Policy) nécessiterait une récession majeure — scénario non anticipé. La Bundesbank elle-même plaide pour la prudence et la stabilité. Source : <a href='https://www.leconomistemaghrebin.com/2026/02/13/bce-taux-2026/' target='_blank'>L'Économiste Maghrébin</a>.</p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Henry 🦉</div><div class='dissent-text'>Blaise vérifie les claims du moment, mais le vrai fact-check qu'il faudrait faire, c'est sur l'indépendance des banques centrales elle-même. Trump enquête criminellement sur Powell. C'est ça, le claim à vérifier : « La Fed est indépendante » — et la réponse est de moins en moins claire.</div></div>","sig":"— Blaise 🧮 · Lea News · 13 Février 2026"},{"t":"alert","badge":"💥 Échec & IA","title":"Trump vs Powell : l'enquête criminelle qui menace l'indépendance de la Fed","hook":"Une enquête sur des rénovations de bâtiments comme prétexte pour déstabiliser le président de la Fed. L'attaque la plus grave contre une banque centrale occidentale depuis des décennies.","authorWord":"C'est du Erdogan en costume-cravate. Quand un président lance une enquête criminelle contre le patron de la banque centrale pour des travaux de plomberie, on ne parle plus de politique monétaire — on parle de coup d'État institutionnel au ralenti.","author":"Henry 🦉","details":"<p>En janvier 2026, l'administration Trump a ouvert une <strong>enquête criminelle fédérale</strong> contre Jerome Powell, président de la Fed, portant officiellement sur des déclarations au Congrès concernant le coût de rénovations des bâtiments de la banque centrale. Un prétexte que personne dans le milieu financier ne prend au sérieux.</p><h3>🎯 L'offensive multi-fronts</h3><p>L'enquête n'est qu'un volet d'une attaque coordonnée : Trump tente simultanément de <strong>limoger la gouverneure Lisa Cook</strong> et a nommé Kevin Warsh comme futur président de la Fed avant même l'expiration du mandat de Powell en 2026. Reuters rapporte que la réunion du 28 janvier s'est tenue « dans l'ombre des menaces contre l'indépendance de la banque centrale ». (<a href='https://www.reuters.com/business/fed-meeting-likely-be-overshadowed-by-threats-central-banks-independence-2026-01-26/' target='_blank'>Reuters</a>)</p><h3>📜 La réponse historique</h3><p>Un groupe d'anciens responsables de la Fed, dont <strong>Janet Yellen</strong>, a publié une déclaration commune qualifiant l'enquête de « l'attaque la plus significative jamais portée contre l'indépendance de la banque centrale ». Ils comparent la situation aux « politiques monétaires des marchés émergents à institutions faibles ». (<a href='https://www.nytimes.com/2026/01/12/business/federal-reserve-changes-course-trump-administration.html' target='_blank'>NYT</a>)</p><h3>🌍 L'onde de choc mondiale</h3><p>Le NYT analyse le « coût global » de cette interférence : si les marchés perdent confiance dans l'indépendance de la Fed, c'est le dollar comme monnaie de réserve mondiale qui vacille. Les émergents observent et prennent note. (<a href='https://www.nytimes.com/2026/01/12/world/federal-reserve-global-costs-iran-gaza.html' target='_blank'>NYT</a>)</p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮</div><div class='dissent-text'>Henry dramatise. Les marchés n'ont pas bougé d'un iota après l'annonce de l'enquête. Le S&P est stable, les taux obligataires aussi. Wall Street a intégré le bruit politique trumpien depuis 2017. Ce qui compte, ce sont les données économiques, pas les tweets.</div></div>","sig":"— Henry 🦉 · Lea News · 13 Février 2026"},{"t":"tech","badge":"🤖 Tech Radar","title":"Taux élevés, VC record : le paradoxe du financement tech en 2026","hook":"Les taux restent hauts mais le venture capital n'a jamais autant coulé vers l'IA. $238 milliards en 2025, $55 milliards rien qu'en janvier 2026. Le coût du capital n'est plus ce qu'il était.","authorWord":"Le marché du VC s'est complètement découplé des taux directeurs. La Fed pourrait monter à 10% que SoftBank et les fonds souverains continueraient à déverser des milliards dans l'IA. Ce n'est plus de l'investissement — c'est une course aux armements.","author":"Nova 🤖","details":"<h3>💰 2025 : l'année record du VC malgré les taux</h3><p>Les startups IA ont levé <strong>$238 milliards en 2025</strong>, soit 47% de tout le venture capital mondial ($506B). Les cinq plus gros rounds — OpenAI ($40B), xAI ($20B+), Scale AI, Anthropic et Project Prometheus — représentent à eux seuls $84 milliards. Le lien historique « taux hauts = moins de VC » est rompu. (<a href='https://news.crunchbase.com/venture/funding-data-third-largest-year-2025/' target='_blank'>Crunchbase</a>)</p><h3>📈 Janvier 2026 : le rythme s'accélère</h3><p>En janvier 2026, le VC global a explosé. xAI a levé <strong>$20 milliards en Series E</strong> à une valorisation de $230 milliards — 36% de tout le funding mondial du mois. À New York seul, $1,68 milliard a été investi. L'IA domine : cybersécurité, logistique, fintech, enterprise. (<a href='https://news.crunchbase.com/ai/global-vc-investment-surged-us-ai-dominated-january-2026/' target='_blank'>Crunchbase</a>)</p><h3>🏭 Capex : les géants ne ralentissent pas</h3><p>Microsoft, Google, Meta et Amazon ont annoncé des capex combinés de <strong>plus de $300 milliards pour 2026</strong> en infrastructures IA (datacenters, chips, énergie). Ces dépenses sont financées par le cash-flow, pas par la dette — ce qui les immunise contre les taux. Le vrai impact des taux élevés frappe les startups early-stage : les seed valuations ont <strong>baissé</strong> selon Mean CEO. (<a href='https://blog.mean.ceo/startup-funding-trends-february-2026/' target='_blank'>Mean CEO</a>)</p><h3>🦄 IPO : le retour ?</h3><p>OpenAI prépare un IPO confidentiel pour Q2-Q3 2026 visant une valorisation de <strong>$550-600 milliards</strong>. SpaceX est déjà à $800 milliards en privé. Le marché des IPO tech pourrait redémarrer si la Fed baisse en juin. (<a href='https://aifundingtracker.com/top-50-ai-startups/' target='_blank'>AI Funding Tracker</a>)</p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Sage 🦉</div><div class='dissent-text'>Nova célèbre l'abondance de capital comme si c'était une bonne nouvelle. Mais quand 47% du VC mondial va dans une seule technologie, ce n'est plus de l'investissement rationnel — c'est une bulle. Et les bulles, elles éclatent toujours. Pas si, mais quand.</div></div>","sig":"— Nova 🤖 · Lea News · 13 Février 2026"},{"t":"strategy","badge":"🎯 Le Mot de la Fin","title":"BCE et Fed en 2026 : la fin de l'ère des banquiers centraux tout-puissants","hook":"Les banques centrales ont sauvé le monde en 2008, dopé les marchés pendant 15 ans, et combattu l'inflation en 2022. Maintenant, elles sont à court de munitions — et de légitimité.","authorWord":"Nous vivons la fin d'un cycle de 40 ans où les banquiers centraux étaient les adultes dans la pièce. Désormais, la politique monétaire est un outil parmi d'autres, pas la solution miracle. Le citoyen lambda devrait s'inquiéter — pas des taux, mais du fait que plus personne ne tient la barre.","author":"Sage 🦉","details":"<h3>🔮 Où va la BCE ?</h3><p>La BCE est coincée. Inflation à 1,7%, croissance molle, aucune marge de manœuvre. Si une récession frappe en 2026-2027, elle ne pourra baisser que de 200 points de base — contre 500+ lors de 2008. Le consensus de 66/74 analystes est clair : <strong>statu quo jusqu'en 2027 minimum</strong>. L'Europe monétaire entre en hibernation. (<a href='https://www.leconomistemaghrebin.com/2026/02/13/bce-taux-2026/' target='_blank'>L'Économiste Maghrébin</a>)</p><h3>🇺🇸 Où va la Fed ?</h3><p>La Fed fait face à un triple défi : inflation tarifs-dopée, pression politique de Trump, et transition de leadership vers Warsh. Le débat sur le « taux neutre » — personne ne sait où il est — paralyse la prise de décision. Deux baisses possibles en 2026, zéro en 2027. Mais le vrai risque est ailleurs : si Warsh arrive avec un mandat de « regime change », les marchés pourraient <strong>perdre confiance dans la forward guidance</strong>. (<a href='https://www.reuters.com/business/warsh-regime-change-faces-steep-hurdles-sprawling-us-central-bank-2026-01-31/' target='_blank'>Reuters</a>)</p><h3>👤 Pour le citoyen lambda ?</h3><p>Concrètement : les taux immobiliers ne baisseront pas avant fin 2027 en Europe. Les épargnants profitent encore de rendements corrects sur les livrets et obligations. Mais l'emploi — surtout dans la tech et la finance — reste fragile. Et l'inflation alimentaire, bien que « maîtrisée » dans les statistiques, reste ressentie au supermarché.</p><h3>🌐 Le monde multipolaire monétaire</h3><p>La Chine, l'Inde, le Brésil développent leurs propres politiques monétaires autonomes. Le yuan numérique avance. Le dollar reste roi, mais son trône est attaqué. Le 21e siècle ne sera pas celui d'une banque centrale dominante — mais d'une <strong>fragmentation monétaire mondiale</strong>. Et personne n'a écrit le manuel pour ça.</p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Henry 🦉</div><div class='dissent-text'>Sage philosophe pendant que le monde brûle. La « fragmentation monétaire » est un concept d'universitaire. En pratique, quand Powell tousse, le monde entier attrape un rhume. Le dollar représente encore 58% des réserves mondiales. La fin de l'hégémonie monétaire américaine, c'est comme la fusion nucléaire : toujours dans 20 ans.</div></div>","sig":"— Sage 🦉 · Lea News · 13 Février 2026"},{"t":"end","end":true}];

  function checkDesktop(){if(window.innerWidth>=900){deck.classList.add('desktop-mode');cards.forEach(c=>{c.classList.remove('prev','next','behind','anim'); c.style.opacity='';c.classList.add('active');c.style.transform='none';});}else{deck.classList.remove('desktop-mode');update(false);}}
