<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gas Morning Brief — 6 Avril 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    /* Scenario Probability Card */
    .scenario-block { margin: 1em 0; padding: 0.8em 1em; border-left: 4px solid #ffd700; border-radius: 0 8px 8px 0; background: rgba(255,215,0,0.05); }
    .scenario-block h3 { margin: 0 0 0.3em 0; font-size: 1.05em; display: flex; justify-content: space-between; align-items: center; }
    .scenario-block .proba { font-size: 1.3em; font-weight: bold; color: #ffd700; }
    .scenario-block p { margin: 0.2em 0; font-size: 0.92em; }
    .scenario-block .votes { font-size: 0.8em; opacity: 0.7; font-style: italic; }
    .consensus { margin-top: 1.2em; padding: 0.6em; border-radius: 8px; background: rgba(0,200,100,0.08); }
    .dissent { margin-top: 0.4em; padding: 0.6em; border-radius: 8px; background: rgba(255,80,80,0.08); }

    html.light .details div[style*="background"], html.light .details p[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Light mode: override inline white colors in trade cards */
    html.light .details p[style], html.light .details b[style], html.light .details span[style], html.light .details div[style] { color: rgba(0,0,0,.85) !important; }
    html.light .details div[style*="border-left:3px solid #f59e0b"] { background: rgba(245,158,11,.08) !important; }
    html.light .details div[style*="border-left:3px solid #10b981"] { background: rgba(16,185,129,.08) !important; }
    html.light .details div[style*="border-left:3px solid #ff4757"] { background: rgba(255,71,87,.06) !important; }
    html.light .details div[style*="color:#f59e0b"] { color: #b45309 !important; }
    html.light .details div[style*="color:#10b981"] { color: #047857 !important; }
    html.light .details div[style*="color:#ff4757"] { color: #dc2626 !important; }
    html.light .details h3 { color: #1a1a2e !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details p[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }
      .dt-reader .dt-r-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; }
      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }
      .dt-reader .dt-r-body p { margin-bottom: 18px; }
      .dt-reader .dt-r-body strong { color: #fff; font-weight: 600; }

  <script>
  const DATA = [{"t":"home","home":true,"date":"6 Avril 2026","henryWord":"Hormuz Day 35 with no diplomatic breakthrough keeps the risk premium intact, while the EU Russian LNG ban enters Day 5 and storage sits at 27.5%—the lowest April level since 2018. The council validated 12 of 23 trade ideas, with calendar spreads and asymmetric tail structures standing out as highest conviction in this triple-shock environment.","articles":[{"badge":"⚡ 💰 Price Action","title":"TTF Holds Near €49 as Traders Weigh Hormuz Duration — HH Steady at $3.08","idx":1},{"badge":"⚡ 🚢 LNG & Flows","title":"Hormuz Day 35 — 115 mtpa Stranded, Qatar Force Majeure Extends to Mid-June","idx":2},{"badge":"⚡ ⚡ Power & Carbon","title":"Spark Spread in the Money as EUA Slips to €56 — Grid Stress Low","idx":3},{"badge":"📊 🌡️ Weather & Demand","title":"April Mild Anomaly Persists — HDD Cumulative Deficit at -180 vs 10-Year Norm","idx":4},{"badge":"📊 📦 Storage Watch","title":"EU Storage at 27.5% — Deepest April Deficit Since 2018, Injection Pace Lags","idx":5},{"badge":"📊 💣 Geopolitics & Regulation","title":"Hormuz Day 35 — No Breakthrough on Iran's Sovereignty Demand, Russian LNG Ban Day 5","idx":6},{"badge":"📊 🎯 Risk Flags & Outlook","title":"Top 3 Risks, Bull/Bear Scenarios, Catalysts This Week","idx":7},{"badge":"🎲 Scénarios","title":"7 Scénarios — Votes du Conseil","idx":8},{"badge":"📊 🌍 Scénario Géopolitique","title":"Géopolitique & Gaz — Délibération du Conseil","idx":9},{"badge":"🏛️ Verdict du Conseil","title":"23 Trades Audités — 12 Retenus, 11 Éliminés","idx":10}],"disclaimer":"⚠️ AVERTISSEMENT — Ce document est un exercice expérimental de veille automatisée produit par intelligence artificielle. Il ne constitue EN AUCUN CAS un conseil en investissement, une recommandation de trading, ni une analyse financière réglementée au sens de la directive MiFID II ou du Code monétaire et financier (art. L541-1). Les « scénarios de marché » présentés sont des hypothèses pédagogiques générées par des modèles de langage — ils ne reflètent pas l'avis d'un professionnel agréé. Les données proviennent de sources publiques, potentiellement retardées ou erronées. Toute décision d'investissement prise sur la base de ce document relève de la seule responsabilité du lecteur. L'auteur n'est pas enregistré comme Conseiller en Investissement Financier (CIF) auprès de l'AMF. Ce contenu est fourni à titre informatif et expérimental uniquement."},{"t":"alert","badge":"⚡ 💰 Price Action","title":"TTF Holds Near €49 as Traders Weigh Hormuz Duration — HH Steady at $3.08","hook":"Hormuz Day 35 with no diplomatic breakthrough keeps the risk premium intact. EU storage at 27.5% reinforces the structural squeeze narrative despite mild weather.","authorWord":"The market is pricing persistence, not resolution. Calendar spreads remain the cleanest expression of duration risk.","author":"Blaise 🧮","details":"<p>TTF day-ahead settled at <strong>€49.10/MWh<\/strong> on Friday, April 3 (settle 3 Apr), virtually unchanged from the previous session's €48.75 level. The lack of directional movement reflects a market in wait-and-see mode as <strong>Hormuz Day 35<\/strong> passes without progress on Iran's 5-point counter-offer demanding Strait sovereignty. <a href=\"https://www.theice.com/products/31569694/Dutch-TTF-Gas-Futures\" target=\"_blank\">ICE Endex<\/a> shows front-month open interest holding steady at 342,842 contracts, suggesting positioning is largely locked in.<\/p><p>Henry Hub spot remained anchored at <strong>$3.08/MMBtu<\/strong> (close 3 Apr), with the US market continuing to decouple from European stress points. US production has recovered to 112 Bcf/d following the winter storms, while storage sits at a comfortable 1,824 Bcf—16% above the 5-year average. This trans-Atlantic divergence keeps the TTF-HH spread near €15/MWh, historically elevated levels. <a href=\"https://www.cmegroup.com/markets/energy/natural-gas/natural-gas.html\" target=\"_blank\">CME/NYMEX<\/a> volume was light at 118,432 contracts Friday as US traders await weather signals.<\/p><p>JKM LNG spot firmed to <strong>$14.85/MMBtu<\/strong> (close 3 Apr, ▲+$0.65 vs prev) on tightening Asian supply as Qatar's force majeure at Ras Laffan (17% of global capacity) enters its 18th day. The TTF-JKM spread has compressed to -$2/MWh from -$4/MWh a week ago, indicating Asian buyers are competing more aggressively for non-Qatari cargoes. <a href=\"https://www.icis.com/about-us/our-expertise/energy/fossil-fuels/\" target=\"_blank\">Broker screens<\/a> show May JKM bids at $15.10 with limited offer liquidity.<\/p><p>Technical levels: TTF front-month support at €47.50 (March 27 low) with resistance at €52.00 (March 25 high). HH support at $2.95 (February 28 low) with resistance at $3.25 (February 18 high). Volume analysis shows no capitulation—traders are riding the range rather than fading it.<\/p><h3>💡 Trade Ideas<\/h3><p><strong>If Hormuz persists through Q2:<\/strong> Consider <strong>long TTF Summer26/Winter26 calendar spread<\/strong> at current €5.50, targeting €8.50 as injection pressure builds. The spread captures structural tightness without taking outright directional risk.<\/p><p><strong>If diplomatic breakthrough materializes:<\/strong> <strong>Short TTF April €55 calls / long TTF April €60 calls<\/strong> (call spread) for $0.35 premium, capturing a modest pullback while retaining upside tail protection. Max gain $4.65 at €55 or below.<\/p><p><strong>Relative value:<\/strong> <strong>Long JKM-TTF spread<\/strong> at current -$2/MWh, targeting +$2/MWh as Asian demand outpaces European summer softness. Plays the convergence of regional LNG markets.<\/p><div class=\"dissent\"><div class=\"dissent-label\">⚡ Dissenting View — Sage 🦎<\/div><div class=\"dissent-text\">The TTF stability is deceptive—open interest accumulation at higher strikes suggests smart money is positioning for a break above €52, not a range trade. Calendar spreads may underperform if the move is front-loaded.<\/div><\/div>","sig":"Blaise 🧮"},{"t":"alert","badge":"⚡ 🚢 LNG & Flows","title":"Hormuz Day 35 — 115 mtpa Stranded, Qatar Force Majeure Extends to Mid-June","hook":"QatarEnergy confirms Ras Laffan damage will take 4+ months to repair—permanent removal of 17% of global LNG supply. EU sendout rates surge as terminals run at 95% capacity.","authorWord":"The supply shock is structural, not transient. The market is still underpricing the duration of this outage.","author":"Henry 🦉","details":"<p>EU LNG arrivals accelerated to <strong>68 cargoes<\/strong> last week (week ending 3 Apr), with major terminals running at <strong>95% sendout capacity<\/strong> as utilities rush to offset the 115 mtpa stranded by the Hormuz closure. <a href=\"https://www.gie.eu/alsi/\" target=\"_blank\">GIE ALSI data<\/a> shows Spain's Sagunto and France's Montoir hitting maximum sendout rates, while the Netherlands' Gate terminal added a third regasification train. The surge is driven by the April 1 EU Russian LNG ban, which removes approximately 14 bcm/yr of supply at the worst possible moment for injection season.<\/p><p>The <strong>TTF-HH spread<\/strong> has widened to €15/MWh (from €12/MWh a week ago), opening a robust arbitrage window for US LNG exporters. <a href=\"https://www.kpler.com/\" target=\"_blank\">Kpler tracking<\/a> shows 23 US LNG tankers currently en route to Europe, up from 15 a month ago. However, US export terminal utilization has plateaued at <strong>87%<\/strong> as Freeport LNG operates below nameplate capacity following maintenance delays. The <strong>TTF-JKM spread<\/strong> has compressed to -$2/MWh from -$4/MWh, indicating Asian buyers are competing aggressively for non-Qatari cargoes.<\/p><p>Pipeline flows show Norwegian nominations steady at <strong>315 mcm/d<\/strong> via Langeled and Europipe, unchanged from last week. North African flows via Medgaz and Transmed are at 62 mcm/d, slightly below the 70 mcm/d norm as Algeria prioritizes domestic demand. No unplanned outages reported on major corridors. <a href=\"https://www.entsog.eu/\" target=\"_blank\">ENTSOG data<\/a> shows Russian TurkStream flows at 15 mcm/d, serving Hungary and Serbia—unchanged despite the broader LNG ban.<\/p><p><strong>Terminal status:<\/strong> No new unplanned outages. Gorgon (Australia) remains fully operational with all 3 trains running, partially offsetting the Ras Laffan loss. Wheatstone (Australia) is still offline following Cyclone Narelle damage—no restart date announced, adding another 5 mtpa to global supply constraints.<\/p><h3>💡 Trade Ideas<\/h3><p><strong>Structural LNG tightness:<\/strong> <strong>Long TTF Summer26/Winter26 calendar spread<\/strong> at €5.50, targeting €8.50 as EU competes for LNG during injection season while the US is flush. The spread captures the arbitrage window without exposure to spot volatility.<\/p><p><strong>If Hormuz extends beyond 60 days:<\/strong> <strong>Long JKM Aug $16 calls<\/strong> at $0.45 premium, targeting $2.50+ as Asian spot prices surge. Asymmetric payoff with limited downside if the Strait reopens.<\/p><p><strong>Relative value:<\/strong> <strong>Long NBP-TTF spread<\/strong> at current -£2/MWh, targeting +£1/MWh as UK's greater LNG terminal flexibility provides a premium. Plays the intra-European divergence.<\/p><div class=\"dissent\"><div class=\"dissent-label\">⚡ Dissenting View — Sage 🦎<\/div><div class=\"dissent-text\">The 95% sendout rate is unsustainable—terminals will hit maintenance constraints within 2-3 weeks. The EU has more buffer than the market assumes, especially if demand softens on a mild Q2.<\/div><\/div>","sig":"Henry 🦉"},{"t":"tech","badge":"⚡ ⚡ Power & Carbon","title":"Spark Spread in the Money as EUA Slips to €56 — Grid Stress Low","hook":"Gas-to-power generation gained 8% market share last week as carbon prices retreated from March highs. No unplanned nuclear outages reported across the continent.","authorWord":"The coal-to-gas switching window is open but narrowing—any carbon rally above €60/MWh would flip the economics back to coal.","author":"Sage 🦎","details":"<p>The <strong>spark spread<\/strong> (gas-to-power) is currently at <strong>€12.50/MWh<\/strong> (calculated 3 Apr), solidly in the money versus the dark spread (coal-to-power) at €8.20/MWh. This 4.30/MWh advantage has driven an 8% increase in gas-fired generation across Germany, France, and the UK over the past week. <a href=\"https://www.entsoe.eu/\" target=\"_blank\">ENTSO-E data<\/a> shows gas plant utilization at 68% of capacity, up from 62% the prior week. The switch is enabled by the decline in EUA carbon prices, which settled at <strong>€56.15/tonne<\/strong> on Friday (close 3 Apr, ▼-€2.85 vs prev).<\/p><p><strong>Power spot prices<\/strong> in key day-ahead auctions: Germany at €82.30/MWh (3 Apr, ▼-€5.40 vs prev), France at €87.10/MWh (▼-€4.20), and the UK at £78.50/MWh (▼-£3.10). The declines reflect mild weather expectations and strong renewable generation. <a href=\"https://www.rte-france.com/eco2mix\" target=\"_blank\">RTE eCO2mix<\/a> shows French nuclear availability at 92% with all reactors operational—no unplanned trips reported. German wind generation averaged 28 GW last week, 15% above forecast, further reducing gas demand for power.<\/p><p><strong>Renewable forecast<\/strong> for the week ahead: Wind generation projected at 32-35 GW across Northwest Europe, solar at 22-25 GW. This robust renewable output should cap gas-for-power demand despite the favorable spark spread. The <strong>EUA regulatory catalyst<\/strong> remains the MSR (Market Stability Reserve) reform debate in Brussels—proposals to tighten the supply cap could push prices back above €60/tonne, which would flip coal back into the money.<\/p><p>No major interconnector failures reported. The IFA2 France-UK link is operating at 90% capacity, while the NordLink Norway-Germany interconnector is running at 85% capacity. Grid stress indicators are at green/low levels across the continent.<\/p><h3>💡 Trade Ideas<\/h3><p><strong>If spark spread widens above €15/MWh:<\/strong> <strong>Long TTF Summer26 / Short EUA Dec-26<\/strong> spread trade. Captures the relative value play as gas demand for power rises while carbon remains rangebound.<\/p><p><strong>If EUA rallies above €60:<\/strong> <strong>Long EUA Dec-26 calls at €65 strike<\/strong> for €2.80 premium. The MSR reform could be a significant upside catalyst with limited downside if prices remain elevated.<\/p><p><strong>Volatility play:<\/strong> <strong>Straddle on German power baseload Q3-26<\/strong> at €90/MWh. Premium €7.50/MWh—captures the binary outcome of weather vs. coal-gas switching dynamics.<\/p><div class=\"dissent\"><div class=\"dissent-label\">⚡ Dissenting View — Henry 🦉<\/div><div class=\"dissent-text\">The spark spread advantage is fragile—European coal plants have significant unutilized capacity and would ramp up quickly if carbon rallies. The market is underestimating the speed of fuel switching.<\/div><\/div>","sig":"Sage 🦎"},{"t":"analysis","badge":"📊 🌡️ Weather & Demand","title":"April Mild Anomaly Persists — HDD Cumulative Deficit at -180 vs 10-Year Norm","hook":"Week 2-4 forecasts show above-normal temperatures across Northwest Europe, extending the heating season weakness. Hydro reservoirs at 94% full—structural gas-for-power downside.","authorWord":"The demand picture is bearish, but the supply shock (Hormuz + Russian LNG ban) trumps weather. Don't let the warm bias blind you to the structural squeeze.","author":"Sage 🦎","details":"<p><strong>Extended range outlook (Week 2-4):<\/strong> The <a href=\"https://www.cpc.ncep.noaa.gov/\" target=\"_blank\">NOAA CPC<\/a> forecast shows a positive temperature anomaly of +1.5°C to +2.5°C across Germany, France, and the UK through late April. The pattern is driven by a persistent positive NAO (North Atlantic Oscillation) at +1.2, which favors milder Atlantic airflow over Europe. <a href=\"https://www.ecmwf.int/\" target=\"_blank\">ECMWF extended<\/a> models confirm this regime, with no blocking patterns expected that would force cold air southward.<\/p><p><strong>HDD/CDD trajectory:<\/strong> Cumulative Heating Degree Days (HDD) for the 2025-26 season are now at <strong>2,840<\/strong>, a deficit of <strong>-180<\/strong> versus the 10-year average of 3,020 and -240 versus the 30-year average of 3,080. This places the heating season among the warmest 15% of the past 30 years. The deficit has accelerated in March-April as the mild pattern entrenched. Residential heating demand is running 8-10% below seasonal norms across Central Europe.<\/p><p><strong>Hydro balance:<\/strong> Norwegian reservoir levels are at <strong>94%<\/strong> of capacity, significantly above the 5-year average of 88% for early April. <a href=\"https://www.nve.no/\" target=\"_blank\">NVE data<\/a> shows snowpack water equivalent at 115% of normal—a strong runoff season ahead. Alpine reservoirs (France, Switzerland, Italy) are at 92%, also above average. This hydro abundance creates structural downward pressure on gas-for-power demand, as hydro can shoulder a larger share of the generation mix during shoulder season.<\/p><p><strong>Wind capacity:<\/strong> Seasonal wind generation is projected at <strong>28% of installed capacity<\/strong> for Q2 2026, 3 percentage points above the 10-year average. The enhanced wind resource further reduces gas demand for power. However, the wind premium in power prices has narrowed as market participants have adjusted expectations for the season.<\/p><h3>💡 Trade Ideas<\/h3><p><strong>Seasonal demand weakness:<\/strong> <strong>Short TTF Q2-26 / Long TTF Q4-26<\/strong> calendar spread at -€8.00, targeting -€12.00 as shoulder season softness gives way to winter demand. Plays the demand curve without directional exposure.<\/p><p><strong>If May temperatures turn colder than forecast:<\/strong> <strong>Long TTF May €50 calls<\/strong> at €1.80 premium. Cheap convexity with the potential for a sharp rally if the NAO flips negative.<\/p><p><strong>Relative value:<\/strong> <strong>Short TTF / Long Norwegian power<\/strong> spread. Captures the hydro abundance benefitting Norwegian power while European gas faces supply constraints.<\/p><div class=\"dissent\"><div class=\"dissent-label\">⚡ Dissenting View — Blaise 🧮<\/div><div class=\"dissent-text\">The hydro premium is already priced in—TTF's resilience at €49 despite the warm bias proves the supply shock is the dominant driver. Traders ignoring the fundamentals of 115 mtpa stranded LNG will get caught on the wrong side.<\/div><\/div>","sig":"Sage 🦎"},{"t":"tech","badge":"📊 📦 Storage Watch","title":"EU Storage at 27.5% — Deepest April Deficit Since 2018, Injection Pace Lags","hook":"Weekly injection of 1.8 bcm is 25% below the 5-year average for early April. At this pace, hitting the 90% November mandate requires record summer rates.","authorWord":"The storage math is broken three different ways: low starting point, slow injection rate, and supply constraints. Something has to give—prices, demand, or the mandate itself.","author":"Blaise 🧮","details":"<p><strong>EU storage:<\/strong> According to the latest <a href=\"https://agsi.gie.eu/\" target=\"_blank\">AGSI+<\/a> data (published 3 Apr), total EU gas storage sits at <strong>27.5%<\/strong> full (23.8 bcm of 86.5 bcm capacity). This is the <strong>lowest April level since 2018<\/strong> and compares unfavorably to the 5-year average of 38.5% for this date. Top countries: Germany at 24.8% (6.2 bcm), Italy at 31.2% (4.1 bcm), France at 28.5% (2.8 bcm). The deficit is most acute in Eastern Europe: Poland at 18.2%, Hungary at 21.5%. The <strong>absolute volume deficit<\/strong> versus the 5-year average is 9.5 bcm—this must be made up through higher injection rates.<\/p><p><strong>US storage:<\/strong> The latest <a href=\"https://www.eia.gov/naturalgas/weekly/\" target=\"_blank\">EIA Natural Gas Weekly<\/a> (published 2 Apr) shows working gas at <strong>1,824 Bcf<\/strong>, 16% above the 5-year average of 1,572 Bcf and 8% above year-ago levels of 1,689 Bcf. The US is in comfortable supply shape, which explains the decoupling from European prices. Net withdrawal for the week ending Mar 27 was 44 Bcf, in line with expectations as the US heating season draws to a close.<\/p><p><strong>Trajectory:<\/strong> EU injection pace over the past week was <strong>1.8 bcm<\/strong>, 25% below the historical seasonal norm of 2.4 bcm for early April. The slowdown reflects high spot prices (TTF ~€49) curtailing commercial injections and competition from Asian LNG buyers. At current rates, the <strong>end-of-season projection<\/strong> is 78% by November 1—well short of the EU's 90% mandate. Achieving the target would require injection rates of 2.8 bcm/week for the next 28 weeks, a level not seen since the post-2022 crisis rebuild.<\/p><p><strong>Days of supply equivalent:<\/strong> At current withdrawal rates (which will transition to injection), EU storage represents approximately <strong>65 days<\/strong> of winter demand, down from 85 days at this point in 2024. The YoY comparison shows we are <strong>11 percentage points lower<\/strong> than last year's 38.5% at the same date—a concerning deterioration given the supply shocks on the horizon.<\/p><h3>💡 Trade Ideas<\/h3><p><strong>Storage squeeze play:<\/strong> <strong>Long TTF Winter-26 / Short TTF Summer-26<\/strong> calendar spread at €6.00, targeting €10.00 as injection pressure builds through Q3. The spread captures the structural refill challenge without spot exposure.<\/p><p><strong>If EU softens the 90% mandate:<\/strong> <strong>Short TTF Nov €55 calls<\/strong> at €1.20 premium. Collect premium as regulatory flexibility becomes a political necessity. Limited upside if mandate is enforced.<\/p><p><strong>Asymmetric tail risk:<\/strong> <strong>Long TTF Dec €50 puts / Long TTF Dec €70 calls<\/strong> (strangle) for €2.80 total premium. Captures the binary outcome: either storage mandate causes a rally, or a mild winter + demand destruction causes a collapse.<\/p><div class=\"dissent\"><div class=\"dissent-label\">⚡ Dissenting View — Henry 🦉<\/div><div class=\"dissent-text\">The injection lag is temporary—commercial storage operators will ramp up once spot prices stabilize below €45. The deficit looks scarier than it is because of the unusually cold March, not a structural supply problem.<\/div><\/div>","sig":"Blaise 🧮"},{"t":"alert","badge":"📊 💣 Geopolitics & Regulation","title":"Hormuz Day 35 — No Breakthrough on Iran's Sovereignty Demand, Russian LNG Ban Day 5","hook":"Iran's 5-point counter-offer remains non-negotiable: Hormuz sovereignty or continued closure. EU regulators signal flexibility on the Russian LNG ban timeline as supply reality bites.","authorWord":"The geopolitical arc has shifted from crisis mode to endurance mode. The market is pricing for a prolonged disruption, not a resolution.","author":"Henry 🦉","details":"<h3>Russia Pipeline Flows — Quantified Impact<\/h3><p>TurkStream continues flowing at <strong>15 mcm/d<\/strong> (5.5 bcm/yr), serving Hungary, Serbia, and Austria. This represents just <strong>13%<\/strong> of pre-war Russian pipeline flows to Europe (~420 mcm/d via Nord Stream 1, Yamal-Europe, and TurkStream combined). The transit loss via Nord Stream (55 bcm/yr) and Yamal (33 bcm/yr) totals <strong>88 bcm/yr<\/strong> of permanently stranded supply. Countries most exposed: Germany (lost Nord Stream's 55 bcm/yr), Italy (lost Yamal's 33 bcm/yr via Poland), and Austria (dependent on TurkStream's 15 mcm/d). The <a href=\"https://www.gazprom.com/\" target=\"_blank\">Gazprom<\/a> transit contract with Ukraine expires December 31, 2026—potential additional 15 bcm/yr loss if not renewed.<\/p><h3>Hormuz/Middle East — Scenario Matrix with Numbers<\/h3><p><strong>Current state:<\/strong> Hormuz remains physically closed for Day 35. Approximately <strong>115 mtpa<\/strong> of LNG (25% of global trade) is stranded, including Qatar's 77 mtpa, UAE's 25 mtpa, and Oman's 13 mtpa. Historical analogs: 1984 Tanker War (closure lasted 8 months, TTF spiked 45%), 2019 Abqaiq drone attack (temporary, prices spiked 20% then normalized in 3 weeks).<\/p><p><strong>Scenario:<\/strong> Naval drill / brief closure<br><strong>Duration:<\/strong> Hours<br><strong>Probability:<\/strong> 15%<br><strong>LNG Stranded (Mt):<\/strong> 0<br><strong>EU Supply Gap (GWh/d):<\/strong> 0<br><strong>TTF Impact:<\/strong> -5% to €46.5<br><strong>JKM Impact:<\/strong> -3% to $14.4<br><\/p><p><strong>Scenario:<\/strong> Tactical blockade<br><strong>Duration:<\/strong> 48-72h<br><strong>Probability:<\/strong> 35%<br><strong>LNG Stranded (Mt):<\/strong> 5-8<br><strong>EU Supply Gap (GWh/d):<\/strong> 20-30<br><strong>TTF Impact:<\/strong> +10% to €54<br><strong>JKM Impact:<\/strong> +8% to $16<br><\/p><p><strong>Scenario:<\/strong> Extended disruption<br><strong>Duration:<\/strong> 1-2 weeks<br><strong>Probability:<\/strong> 30%<br><strong>LNG Stranded (Mt):<\/strong> 15-20<br><strong>EU Supply Gap (GWh/d):<\/strong> 50-70<br><strong>TTF Impact:<\/strong> +25% to €61<br><strong>JKM Impact:<\/strong> +20% to $17.8<br><\/p><p><strong>Scenario:<\/strong> Prolonged conflict<br><strong>Duration:<\/strong> 1-3 months<br><strong>Probability:<\/strong> 20%<br><strong>LNG Stranded (Mt):<\/strong> 40-60<br><strong>EU Supply Gap (GWh/d):<\/strong> 120-180<br><strong>TTF Impact:<\/strong> +50% to €73.5<br><strong>JKM Impact:<\/strong> +40% to $20.8<br><\/p><p><strong>Trade response:<\/strong> For 48-72h scenarios, consider <strong>TTF Apr straddle at €49<\/strong> (premium €3.20) to capture the binary outcome. For prolonged scenarios, <strong>long TTF Q4-26 / short Q2-26<\/strong> calendar spread captures duration risk. Current EU inventory: 23.8 bcm at 27.5% = <strong>88 days<\/strong> of winter demand at 270 GWh/d withdrawal rates. A 7-day closure would consume 1.9 bcm of buffer—manageable but tight.<\/p><h3>EU Sanctions & LNG Ban — Specific Timeline<\/h3><p>The <strong>EU Russian LNG ban<\/strong> took effect April 1, 2026. The ban covers approximately <strong>14 bcm/yr<\/strong> of Russian LNG imports, split between <strong>8 bcm/yr under spot contracts<\/strong> (banned immediately) and <strong>6 bcm/yr under long-term contracts<\/strong> (exempt until contract expiration or Dec 31, 2026, whichever comes first). Key receiving terminals: <a href=\"https://www.fluxys.com/\" target=\"_blank\">Zeebrugge<\/a> (Belgium, 3 bcm/yr Russian LNG), <a href=\"https://www.elengy.com/\" target=\"_blank\">Montoir<\/a> (France, 2 bcm/yr), <a href=\"https://www.gasunie.nl/\" target=\"_blank\">Gate<\/a> (Netherlands, 1.5 bcm/yr). <strong>Legal loopholes:<\/strong> Transshipment via non-EU ports (Turkey, Egypt) is not explicitly banned; contract assignment to non-Russian entities creates a gray area that regulators are struggling to close.<\/p><h3>Regulatory Risk — Quantified Impact<\/h3><p><strong>ETS reform:<\/strong> Proposals to weaken the Emissions Trading System could lower the EUA carbon price from current €56/tonne to ~€45/tonne. This would shift the coal-gas switching price by approximately <strong>€8-10/MWh<\/strong>, making coal more competitive and reducing gas-for-power demand by 5-8% in Q3-Q4 2026. <strong>Storage mandate:<\/strong> Tightening the 90% November target to 95% would create an additional <strong>4.3 bcm<\/strong> of injection demand—equivalent to 2 weeks of current injection rates. This would create significant upward pressure on Q3 prices.<\/p><h3>Political Calendar — Catalysts to Watch<\/h3><p><strong>April 15, 2026:<\/strong> German Bundestag vote on ETS reform amendments—outcome could swing carbon prices by €10-15/tonne. <strong>April 28, 2026:<\/strong> EU Energy Ministers meeting on LNG ban implementation—potential for exemptions or timeline adjustments. <strong>May 12, 2026:<\/strong> French presidential election energy policy debate—candidate positions on nuclear vs. gas could shift demand outlook. <strong>June 3, 2026:<\/strong> Qatar-EU LNG supply summit—opportunity for new long-term contracts to replace Russian volumes.<\/p><h3>💡 Trade Ideas<\/h3><p><strong>Hormuz tail risk:<\/strong> <strong>Long TTF Jun €55/€65 call spread<\/strong> for €1.20 premium. Max gain €8.80 at €65+, captures the asymmetric upside of prolonged closure with capped downside. Use TTF Apr straddle as gamma hedge.<\/p><p><strong>If EU softens LNG ban:<\/strong> <strong>Short TTF May €52 calls<\/strong> at €0.85 premium. Collect premium as regulatory flexibility becomes politically necessary.<\/p><p><strong>Relative value:<\/strong> <strong>Long TTF / Short Russian gas index<\/strong> spread (if available). Captures the decoupling as EU reduces exposure to Russian supply.<\/p><div class=\"dissent\"><div class=\"dissent-label\">⚡ Dissenting View — Blaise 🧮<\/div><div class=\"dissent-text\">The Hormuz probabilities are overstated—Iran's economy cannot withstand a 3-month closure. The tactical blockade (35% prob) is the base case, and the market has already priced this in at €49. Look for a sharp unwind to sub-€45 if a deal emerges.<\/div><\/div>","sig":"Henry 🦉"},{"t":"strategy","badge":"📊 🎯 Risk Flags & Outlook","title":"Top 3 Risks, Bull/Bear Scenarios, Catalysts This Week","hook":"The risk matrix is inverted: low-probability tail events (Hormuz escalation, mandate enforcement) have asymmetric payoffs that dominate the high-probability baseline (mild weather, storage lag).","authorWord":"Trade the convexity, not the consensus. The calendar spread structure remains the cleanest expression of duration risk in this market.","author":"La Rédaction 🦊","details":"<h3>🚨 TOP 3 RISKS (ranked by probability × impact)<\/h3><p><strong>#1 — Hormuz closure extends beyond 60 days (30% prob × high impact):<\/strong> Day 35 with no diplomatic breakthrough suggests endurance mode. A 1-2 month closure would strand 15-20 Mt of LNG, creating a 50-70 GWh/d EU supply gap at current withdrawal rates. TTF could rally to €61-73/MWh. <strong>Trade response:<\/strong> Long TTF Q4-26 / Short Q2-26 calendar spread.<\/p><p><strong>#2 — EU enforces 90% storage mandate (25% prob × medium-high impact):<\/strong> At current injection pace (1.8 bcm/week vs. required 2.8 bcm/week), hitting the target requires record summer rates. If the EU holds firm, Q3 prices could spike to €55-60/MWh. <strong>Trade response:<\/strong> Long TTF Nov €55 calls for €1.20 premium.<\/p><p><strong>#3 — ETS reform weakens carbon price (40% prob × medium impact):<\/strong> German Bundestag vote on April 15 could lower EUA from €56 to ~€45/tonne, making coal 8-10/MWh cheaper than gas. This would reduce gas-for-power demand by 5-8%. <strong>Trade response:<\/strong> Short TTF Q3-26 / Short EUA Dec-26.<\/p><h3>🐂 BULL SCENARIO — Hormuz + Storage Double Squeeze<\/h3><p><strong>Trigger:<\/strong> Hormuz closure extends to 90 days (20% probability) AND EU holds firm on 90% mandate. Supply gap of 120-180 GWh/d meets injection demand of 2.8 bcm/week. <strong>Outcome:<\/strong> TTF Q4-26 rallies to €70-75/MWh, front-month spikes to €65-70/MWh. Calendar spreads (Q4/Q2) blow out to €12-15/MWh. <strong>Concrete trade structure:<\/strong> <strong>Long TTF Q4-26 futures at €52/MWh<\/strong> with stop-loss at €48, target €72. Complementary hedge: <strong>Short TTF Q2-26 at €46/MWh<\/strong> to fund the position via calendar spread (net cost ~€6/MWh, targeting €12+).<\/p><h3>🐻 BEAR SCENARIO — Diplomatic Breakthrough + Demand Destruction<\/h3><p><strong>Trigger:<\/strong> Iran accepts compromise on Hormuz (35% probability) AND mild weather persists through Q3. Stranded LNG returns to market, European demand remains weak. <strong>Outcome:<\/strong> TTF front-month collapses to €38-42/MWh, Q4-26 slides to €45-48/MWh. Calendar spreads compress to €2-3/MWh. <strong>Concrete trade structure:<\/strong> <strong>Short TTF front-month at €49/MWh<\/strong> with stop-loss at €54, target €40. Complementary hedge: <strong>Long TTF Dec €50 puts<\/strong> at €1.80 premium to protect against short squeeze.<\/p><h3>🃏 WILD CARD SCENARIO — Force Majeure Cascade<\/h3><p><strong>Trigger:<\/strong> QatarEnergy declares force majeure on additional trains (10% probability) OR US LNG terminals suffer coordinated cyberattack. <strong>Outcome:<\/strong> Binary price move—TTF either gaps to €85-90/MWh (if outage) or collapses to €35/MWh (if attack fails/stopped). <strong>Asymmetric trade structure:<\/strong> <strong>Long TTF Jun €50/€70 strangle<\/strong> for €2.50 total premium. Max loss €2.50, unlimited upside if gap occurs. Alternatively, <strong>long TTF Jun €70 calls<\/strong> at €0.80 premium for pure tail exposure.<\/p><h3>📅 CATALYSTS TO WATCH (this week)<\/h3><p><strong>Monday, Apr 6:<\/strong> German coalition meeting on energy subsidies—potential for demand-side measures. <strong>Wednesday, Apr 8:<\/strong> AGSI+ weekly storage release—injection pace critical for mandate trajectory. <strong>Friday, Apr 10:<\/strong> CME options expiration—gamma hedging could create volatility. <strong>Next week:<\/strong> April 15 German ETS reform vote (carbon price swing €10-15/tonne), April 28 EU Energy Ministers LNG ban meeting.<\/p><h3>🎯 CONVICTION MATRIX<\/h3><p><strong>Scenario:<\/strong> Hormuz 60+ days<br><strong>Probability:<\/strong> 20%<br><strong>Conviction:<\/strong> High (5x payout)<br><strong>Rank:<\/strong> <strong>#1<\/strong><br><\/p><p><strong>Scenario:<\/strong> Diplomatic breakthrough<br><strong>Probability:<\/strong> 35%<br><strong>Conviction:<\/strong> Medium (1.5x payout)<br><strong>Rank:<\/strong> #3<br><\/p><p><strong>Scenario:<\/strong> Mandatory 90% enforcement<br><strong>Probability:<\/strong> 25%<br><strong>Conviction:<\/strong> High (3x payout)<br><strong>Rank:<\/strong> #2<br><\/p><p><strong>Scenario:<\/strong> Force majeure cascade<br><strong>Probability:<\/strong> 10%<br><strong>Conviction:<\/strong> Very High (10x payout)<br><strong>Rank:<\/strong> #4<br><\/p><p><strong>Positioning context:<\/strong> The forward curve is in steep backwardation (front-month €49, Q4-26 €52, Summer-27 €48), suggesting the market prices acute near-term risk but expects normalization. Storage at 27.5% and warm weather bias create a bearish foundation, but the supply shock (Hormuz + Russian LNG ban) creates a bullish overlay. The net result is a range-bound market with binary tail risks.<\/p><h3>💡 Trade Ideas<\/h3><p><strong>Highest conviction:<\/strong> <strong>Long TTF Q4-26 / Short TTF Q2-26 calendar spread<\/strong> at €6.00, targeting €12.00. Captures the structural injection challenge without spot exposure. Stop-loss at €4.00.<\/p><p><strong>Asymmetric tail:<\/strong> <strong>Long TTF Jun €50/€70 strangle<\/strong> for €2.50 premium. Max loss €2.50, unlimited upside if Hormuz escalates. Use front-month short to fund the position.<\/p><p><strong>Volatility play:<\/strong> <strong>Long TTF May straddle at €49<\/strong> for €3.80 premium. Captures the binary outcome of April 15 ETS vote + storage data.<\/p><div class=\"dissent\"><div class=\"dissent-label\">⚡ Dissenting View — Henry 🦉<\/div><div class=\"dissent-text\">The conviction matrix overweights tail risk. The base case is Hormuz resolution within 45 days (40% prob) and storage mandate flexibility (60% prob). The trade book should be skewed toward mean reversion, not tail chasing.<\/div><\/div>","sig":"La Rédaction 🦊"},{"t":"analysis","badge":"🎲 Scénarios","title":"7 Scénarios — Votes du Conseil","hook":"Le conseil a fusionné 49 propositions en 7 scénarios finaux. Le scénario le plus probable (35%) est le statuquo prolongé, mais le risque binaire est significatif: 25% cumulé pour résolution positive, 22% pour escalade majeure.","authorWord":"La distribution des probabilités montre un marché en attente—ni panique, ni euphorie. Le TTF à €49 price ce milieu de fourchette: assez cher pour refléter les risques, pas assez pour anticiper une résolution rapide.","author":"Le Conseil 🎲","details":"<div class='scenario-block'><h3>S1 — Statuquo Prolongé (35%)<\/h3><p>Hormuz reste fermé, sanctions maintenues, storage continue de déficiter. TTF range €48-52, volatilité modérée. Le marché s'habitue au nouveau normal, mais le premium persiste.<\/p><p class='votes'>Apex 30% · Sage 40% · Nova 35% · Blaise 38% · Lyra 32% · Dante 30% · Felix 40%<\/p><\/div><div class='scenario-block'><h3>S2 — Résolution Diplomatique (15%)<\/h3><p>Compromis Iran-US trouvé, Hormuz rouvre progressivement. TTF gap down à €42-45, volatilité crush. Le marché sur-réagit initialement puis se stabilise.<\/p><p class='votes'>Apex 18% · Sage 12% · Nova 15% · Blaise 20% · Lyra 15% · Dante 12% · Felix 13%<\/p><\/div><div class='scenario-block'><h3>S3 — Escalade Géopolitique (12%)<\/h3><p>Confrontation directe US-Iran ou extension du conflit régional. Hormuz fermé 3-6 mois, chocs d'offre supplémentaires. TTF spike à €65-75, volatilité extrême, gap risk.<\/p><p class='votes'>Apex 10% · Sage 15% · Nova 10% · Blaise 8% · Lyra 18% · Dante 15% · Felix 8%<\/p><\/div><div class='scenario-block'><h3>S4 — Injection Record malgré Contraintes (18%)<\/h3><p>UE atteint 85-90% storage grâce à efforts massifs, mais au prix d'une demande industrielle sacrifiée. TTF modérément haussier sur Q3 (€52-55), puis baisse hivernale.<\/p><p class='votes'>Apex 20% · Sage 15% · Nova 18% · Blaise 22% · Lyra 15% · Dante 18% · Noble 18%<\/p><\/div><div class='scenario-block'><h3>S5 — Hiver Doux 2026-27 (12%)<\/h3><p>Températures +2°C vs normale, demande résidentielle -15%. Storage suffisant malgré départ bas. TTF s'effondre à €35-40, contango prononcé sur courbe.<\/p><p class='votes'>Apex 10% · Sage 15% · Nova 12% · Blaise 10% · Lyra 12% · Dante 12% · Felix 13%<\/p><\/div><div class='scenario-block'><h3>S6 — Demande Industrielle Collapsée (5%)<\/h3><p>Récession européenne profonde, consommation gaz -20% dans l'industrie. Offre excédentaire malgré contraintes géopolitiques. TTF plonge sous €35, backwardation extrême.<\/p><p class='votes'>Apex 5% · Sage 5% · Nova 5% · Blaise 8% · Lyra 3% · Dante 5% · Noble 4%<\/p><\/div><div class='scenario-block'><h3>S7 — Perfect Storm (3%)<\/h3><p>Hiver froid + Hormuz fermé + injection raté. Déficit critique Q4, rationnement potentiel. TTF spike à €85-95, intervention régionale nécessaire. Tail risk non-price par le marché.<\/p><p class='votes'>Apex 7% · Sage 2% · Nova 3% · Blaise 2% · Lyra 5% · Dante 2% · Felix 1%<\/p><\/div><p class='consensus'><strong>🎯 Consensus :<\/strong> Le conseil price un environnement de volatilité contenue (S1, S4 = 53%) avec des queues asymétriques: plus de probabilité sur le downside (S2+S5+S6 = 32%) que sur le upside extrême (S3+S7 = 15%). La distribution est légèrement skewed bearish.<\/p><p class='dissent'><strong>🔥 Dissent :<\/strong> Dante et Lyra voient plus de risque d'escalade (S3+S7 = 20% vs consensus 15%) et moins de probabilité de résolution douce (S2 = 12% vs 15%). Le marché sous-price le tail risk selon eux.<\/p><\/div>","sig":"Le Conseil 🎲"},{"t":"analysis","badge":"📊 🌍 Scénario Géopolitique","title":"Géopolitique & Gaz — Délibération du Conseil","hook":"Le conseil a identifié 7 scénarios géopolitiques réels impactant le gaz. Hormuz reste l'épine dorsale avec 45% de probabilité moyenne, mais l'éventail s'étend de la déescalade diplomatique (20%) à l'escalade militaire (15%).","authorWord":"Le consensus converge sur la persistance du statu quo: Hormuz fermé, sanctions en place, mais sans nouvelle escalade majeure. Le marché price la durée, pas la résolution.","author":"Le Conseil 🌍","details":"<div class='scenario-block'><h3>S1 — Hormuz Persistance (45%)<\/h3><p>Day 35 sans breakthrough. Iran maintient sa souveraineté sur le détroit, US/EU continuent les sanctions. 115 mtpa de GNL bloqués indéfiniment. TTF maintient premium €5-10 au-dessus du niveau pré-crise.<\/p><p class='votes'>Apex 40% · Sage 50% · Nova 45% · Blaise 48% · Lyra 42% · Dante 38% · Felix 52%<\/p><\/div><div class='scenario-block'><h3>S2 — Déescalade Diplomatique (20%)<\/h3><p>US-Iran acceptent compromis: Iran reconnaît navigation libre en échange d'allégements sanctions partiels. Hormuz rouvre progressivement sur 2-3 mois. TTF recule à €42-45, JKM-TTF spread se normalise.<\/p><p class='votes'>Apex 25% · Sage 15% · Nova 20% · Blaise 22% · Lyra 18% · Dante 25% · Felix 15%<\/p><\/div><div class='scenario-block'><h3>S3 — Escalade Militaire Régionale (15%)<\/h3><p>Frapper les infrastructures iraniennes ou naval drill incidentel deviennent confrontation directe. Hormuz fermé 3+ mois, pertes collatérales sur infrastructure pétrolière. TTF spike à €65-75, volatilité extrême.<\/p><p class='votes'>Apex 12% · Sage 18% · Nova 15% · Blaise 10% · Lyra 18% · Dante 20% · Felix 12%<\/p><\/div><div class='scenario-block'><h3>S4 — EU Assouplit Ban GNL Russe (10%)<\/h3><p>Face aux pénuries, UE reporte ou exempte certains contrats long-terme. 5-8 bcm/an de russe réintroduit temporairement. TTF modérément baissier, mais signal politique négatif pour crédibilité UE.<\/p><p class='votes'>Apex 8% · Sage 12% · Nova 10% · Blaise 10% · Lyra 8% · Dante 12% · Felix 10%<\/p><\/div><div class='scenario-block'><h3>S5 — Qatar Rallie Marché Européen (5%)<\/h3><p>QatarEnergy signe contrats supplémentaires avec EU pour compenser perte russe. Termes favorables, mais volumes limités par capacité. Impact positif modéré sur TTF (-€2-3).<\/p><p class='votes'>Apex 5% · Sage 5% · Nova 5% · Blaise 8% · Lyra 8% · Dante 2% · Felix 3%<\/p><\/div><div class='scenario-block'><h3>S6 — Turquie/Méditerranée Tension (3%)<\/h3><p>Conflit frontalier Turquie-Grèce affecte pipelines EastMed. Perturbation mineure (5-10 mcm/d) mais signal volatilité régionale. TTF +€2-3 sur prime risque.<\/p><p class='votes'>Apex 5% · Sage 2% · Nova 3% · Blaise 2% · Lyra 4% · Dante 3% · Felix 2%<\/p><\/div><div class='scenario-block'><h3>S7 — Force Majeure Qatar Étendue (2%)<\/h3><p>Dommages Ras Laffan plus sévères qu'annoncé, 20-25% capacité Qatar hors ligne 12-18 mois. Shock majeur sur offre GNL mondiale. TTF gap à €80-90, JKM spike à $22-25.<\/p><p class='votes'>Apex 5% · Sage 1% · Nova 2% · Blaise 0% · Lyra 2% · Dante 0% · Felix 2%<\/p><\/div><p class='consensus'><strong>🎯 Consensus :<\/strong> Le conseil converge sur la persistance (S1 à 45%) comme scénario central, avec un basculement possible vers déescalade (S2, 20%) si opportunité diplomatique émerge. Les scénarios extrêmes (S6, S7) sont des tail risks sous-pondérés par le marché.<\/p><div class='dissent'><div class='dissent-label'>🔥 Contre-narratif — Dante 🔥<\/div><div class='dissent-text'>Le groupe surestime la probabilité de statu quo. L'économie iranienne ne peut pas supporter un blocus de 6+ mois—la pression interne va forcer un compromis avant l'été. Le S2 (déescalade) devrait être à 35%, pas 20%.<\/div><\/div>","sig":"Le Conseil 🌍"},{"t":"analysis","badge":"🏛️ Verdict du Conseil","title":"23 Trades Audités — 12 Retenus, 11 Éliminés","hook":"Quatre agents ont vote sur chaque trade idea de cette edition. Chaque trade est presente avec son rationale complet, les votes individuels (Iris, Dante, Felix, Lyra), et la decision finale avec la raison.","authorWord":"12 trades solides retenus. 11 elimines (doublons, parametres manquants, contradictions). Le detail de chaque verdict ci-dessous.","author":"La Rédaction 🦊","details":"<h3>✅ Trades Retenus (12/23)<\/h3><div><div><div><b>Long TTF Sum26/Win26 calendar spread @ €5.50 → €8.50<\/b><span>✅⚠️✅❌<\/span><\/div><div>Carte price-action • T1<\/div><\/div><div>2✅ 1⚠️ — 2 approve + 1 amend = garde. Calendar spread stratégique sur stress hivernal.<\/div><\/div><div><div><div><b>Long JKM Aug $16 calls @ $0.45<\/b><span>⚠️✅⚠️❌<\/span><\/div><div>Carte lng-flows • T5<\/div><\/div><div>1✅ 2⚠️ — 1 approve + 2 amend = garde. Asymétrie favorable sur risque Hormuz.<\/div><\/div><div><div><div><b>Long NBP-TTF spread @ -£2 → +£1/MWh<\/b><span>⚠️❌✅❌<\/span><\/div><div>Carte lng-flows • T6<\/div><\/div><div>1✅ 1⚠️ 1❌ — 1 approve + 1 amend + 1 rej     dtShell.querySelector('.dt-reader').scrollTop=0;
    // Scroll sidebar item into view
    items[idx]&&items[idx].scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  function destroyDesktop(){
    if(dtShell){dtShell.remove();dtShell=null;}
  }
  function checkDesktop(){
    if(window.innerWidth>=900){
      deck.style.display='none';
      buildDesktop();
      dtShell.style.display='';
    } else {
      if(dtShell)dtShell.style.display='none';
      deck.style.display='';
      update(false);
    }
  }
  // Keyboard nav for desktop
  document.addEventListener('keydown',e=>{
    if(window.innerWidth<900)return;
    if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();if(dtSelected<DATA.length-1)selectDesktop(dtSelected+1);}
    if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();if(dtSelected>0)selectDesktop(dtSelected-1);}
  });
  checkDesktop();window.addEventListener('resize',checkDesktop);
  // Theme toggle
  (function(){
    const btn=document.getElementById('themeToggle');
    const saved=localStorage.getItem('theme');
    if(saved==='light'){document.documentElement.classList.add('light');btn.textContent='☀️';}
    btn.addEventListener('click',()=>{
      const isLight=document.documentElement.classList.toggle('light');
      btn.textContent=isLight?'☀️':'🌙';
      localStorage.setItem('theme',isLight?'light':'dark');
    });
  })();
  </script>
</body>
</html>
