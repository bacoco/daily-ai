  <script>
  const DATA = [{"t":"home","home":true,"date":"23 Avril 2026","henryWord":"TTF rangebound near €44 as the market waits for Hormuz Day 55 catalyst. The triple shock — Hormuz closure, Russian LNG ban Phase 2, storage refill mandate — has created a binary environment where calendar spreads and asymmetric structures trump directional bets. The council validated 7 of 22 proposed trades, pruning duplicates and contradictions while keeping the highest-conviction plays. The unifying theme: flexibility over fortresses. Buy the straddles, fade the naked shorts.","articles":[{"badge":"⚡ 💰 Price Action","title":"Gas Price Flash — TTF Surges on Gulf Crisis","idx":1},{"badge":"⚡ 🚢 LNG & Flows","title":"LNG Flows Constrained as Gulf Crisis Persists","idx":2},{"badge":"⚡ ⚡ Power & Carbon","title":"Power Markets Muted — Gas Switching Marginal","idx":3},{"badge":"📊 🌡️ Weather & Demand","title":"Shoulder Season Arrives — Heating Demand Collapses","idx":4},{"badge":"📊 📦 Storage Watch","title":"EU Storage at 29% — Injection Pace Accelerating","idx":5},{"badge":"📊 💣 Geopolitics & Regulation","title":"Triple Shock Converges — Hormuz, Russian Ban, and Storage Risks","idx":6},{"badge":"📊 🎯 Risk Flags & Outlook","title":"Triple-Shock Environment — Tactical Flexibility Required","idx":7},{"badge":"🎲 Scénarios","title":"7 Scénarios — Votes du Conseil","idx":8},{"badge":"📊 🌍 Scénario Géopolitique","title":"Géopolitique & Gaz — Délibération du Conseil","idx":9},{"badge":"🗳️ Conseil","title":"Verdict du Conseil — 7 Trades Validés","idx":10}],"disclaimer":"⚠️ AVERTISSEMENT — Ce document est un exercice expérimental de veille automatisée produit par intelligence artificielle. Il ne constitue EN AUCUN CAS un conseil en investissement, une recommandation de trading, ni une analyse financière réglementée au sens de la directive MiFID II ou du Code monétaire et financier (art. L541-1). Les « scénarios de marché » présentés sont des hypothèses pédagogiques générées par des modèles de langage — ils ne reflètent pas l'avis d'un professionnel agréé. Les données proviennent de sources publiques, potentiellement retardées ou erronées. Toute décision d'investissement prise sur la base de ce document relève de la seule responsabilité du lecteur. L'auteur n'est pas enregistré comme Conseiller en Investissement Financier (CIF) auprès de l'AMF. Ce contenu est fourni à titre informatif et expérimental uniquement."},{"t":"alert","badge":"⚡ 💰 Price Action","title":"Gas Price Flash — TTF Surges on Gulf Crisis","hook":"European gas jumps 1.6% as Persian Gulf LNG disruptions persist. US gas flat amid record exports despite production declines.","authorWord":"TTF breaks above €44 as Strait of Hormuz remains choked — 20% of global LNG offline. US production sliding but exports hit record highs. JKM leading gains with 2% jump.","author":"Blaise 🧮","details":"<h2>Spot Prices — European Surge, US Flat<\/h2>\n\n<p><strong>TTF Day-Ahead:<\/strong> <a href=\"https://tradingeconomics.com/commodity/eu-natural-gas\" target=\"blank\">€44.24/MWh<\/a> (close 22 Apr), ▲+€0.69 (+1.58%) vs prev, extending 4-session winning streak on <a href=\"https://www.ice.com/\" target=\"blank\">ICE Endex<\/a>. The benchmark hit its highest level since April 17 as traders priced prolonged Persian Gulf LNG disruptions. Iran's closure of the Strait of Hormuz has effectively halted ~20% of global LNG supply since late February, with <a href=\"https://tradingeconomics.com/commodity/eu-natural-gas\" target=\"blank\">Trading Economics<\/a> reporting ongoing tensions and commercial vessels facing fire from Iranian forces.<\/p>\n\n<p><strong>Henry Hub Spot:<\/strong> <a href=\"https://tradingeconomics.com/commodity/natural-gas\" target=\"blank\">$2.72/MMBtu<\/a> (close 22 Apr), ▬flat vs prev, on <a href=\"https://www.cmegroup.com/markets/energy/natural-gas/natural-gas.html\" target=\"blank\">CME/NYMEX<\/a>. US natural gas futures hovered near recent highs despite flat price action, supported by production declines averaging 3.9 bcfd over the past 15 days — hitting an 11-week low of 108.2 bcfd Tuesday. Simultaneously, LNG export terminal deliveries climbed to 18.9 bcfd in April, putting the month on track to set a new record according to <a href=\"https://tradingeconomics.com/commodity/natural-gas\" target=\"blank\">Trading Economics<\/a>. However, ample inventories (7% above 5-year average) and warmer spring forecasts capped upside.<\/p>\n\n<p><strong>NBP Day-Ahead:<\/strong> <a href=\"https://poundf.co.uk/uk-natural-gas\" target=\"blank\">137.94 GBp/therm<\/a> (close 22 Apr), tracking TTF gains on <a href=\"https://www.ice.com/products/910/UK-NBP-Natural-Gas-Futures\" target=\"blank\">ICE<\/a>. The UK benchmark moved in lockstep with continental European prices, reflecting shared supply concerns from the Gulf crisis and correlated storage dynamics.<\/p>\n\n<p><strong>JKM Spot LNG:<\/strong> <a href=\"https://tradingeconomics.com/commodity/liquefied-natural-gas-japan-korea\" target=\"blank\">$16.13/MMBtu<\/a> (close 22 Apr), ▲+$0.32 (+1.99%) vs prev, outperforming other benchmarks on Asian demand strength. The <a href=\"https://www.spglobal.com/energy/en/pricing-benchmarks/assessments/lng/jkm-japan-korea-marker-gas-price-explained\" target=\"blank\">Platts JKM<\/a> assessment showed resilience, trading 38.29% higher YoY despite shedding 23.21% over the past month. Asian buyers continue competing with Europe for limited spot cargoes.<\/p>\n\n<h2>Positioning & Technicals<\/h2>\n\n<p><strong>Volume & Open Interest:<\/strong> TTF open interest数据显示 declining trend at ~1.75K contracts according to <a href=\"https://www.tradingview.com/symbols/NYMEX-TTF1!/\" target=\"blank\">TradingView<\/a>, suggesting some long liquidation as price rallies — typically a bearish divergence indicating weakening conviction behind the move. NYMEX Henry Hub volume data from <a href=\"https://www.cmegroup.com/markets/energy/natural-gas/natural-gas.volume.options.html\" target=\"blank\">CME Group<\/a> shows elevated options activity but mixed directional bias, with traders positioning for both summer cooling demand and winter storage plays.<\/p>\n\n<p><strong>Technical Levels — TTF Front-Month:<\/strong> Immediate resistance at €45.00 (psychological), then €46.50 (late-March highs). Key support at €42.50 (Apr 17 low), then €40.00 (major psychological). The 4-session rally from €41.59 lows has reclaimed the €43 handle but faces overhead supply from recent distribution.<\/p>\n\n<p><strong>Technical Levels — Henry Hub Front-Month:<\/strong> Resistance at $2.80 (early April high), then $3.00 (psychological/technical cluster). Support at $2.65 (recent consolidation), then $2.50 (late March low). The flat session after a 3-week bounce suggests bulls are pausing at resistance despite record LNG export flows.<\/p>\n\n<h2>Overnight & Asian Signals<\/h2>\n\n<p>Asian session showed mild strength in JKM during overnight trading, with Korean and Japanese utilities buying on dips. The TTF June contract traded slightly higher in early Asian electronic session, indicating follow-through buying from Europe's close. No major weather-driven demand shifts overnight, but forecast updates showing cooler-than-expected temperatures in Northwest Europe for early May could support near-term demand expectations.<\/p>\n\n<h2>💡 Trade Ideas<\/h2>\n\n<p><strong>1. Bullish TTF Call Spread:<\/strong> With TTF breaking above €44 and Gulf disruptions unresolved, consider June €44/€48 call spread for €0.40-0.50 premium exposure. Targets €46.50 resistance with defined risk if the geopolitical premium deflates.<\/p>\n\n<p><strong>2. Henry Hub Summer Strip:<\/strong> Record LNG exports suggest tighter summer balances despite amble storage. Look to buy July/August calendar spread around $0.10-0.15, targeting $0.30+ as power sector demand picks up in July-August heatwave season.<\/p>\n\n<p><strong>3. JKM/TTF Convergence Play:<\/strong> JKM's 2% outperformance vs TTF's 1.6% gain suggests Asian strength. Consider June JKM-TTF spread around $3.50-4.00/MMBtu differential. If Gulf cargoes reroute to Europe paying premium, spread could narrow to $3.00.<\/p>\n\n<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>The TTF rally on Strait of Hormuz concerns may be overdone. EU storage levels are comfortable heading into injection season, and Norwegian pipeline flows remain robust. If diplomatic progress emerges or alternative routing increases, the geopolitical premium could evaporate quickly. Meanwhile, US production declines are likely temporary — shale producers can ramp output within 2-3 weeks as prices stabilize. Flat Henry Hub action despite record exports suggests market skepticism about sustainable upside. Short TTF June €42 puts offer attractive risk-reward if the fear premium fades before month-end.<\/div><\/div>","sig":"Blaise 🧮"},{"t":"alert","badge":"⚡ 🚢 LNG & Flows","title":"LNG Flows Constrained as Gulf Crisis Persists","hook":"EU LNG sendout remains elevated but below peak as Strait of Hormuz disruptions continue. US exports hit record levels despite supply chain constraints.","authorWord":"Gulf disruptions continue to bite — ~115 mtpa of LNG offline. US terminals running at 95%+ utilization. European sendout strong but alternative routes needed.","author":"Henry 🦉","details":"<h2>EU LNG Arrivals & Sendout<\/h2>\n\n<p>EU LNG terminal sendout averaged <strong>1.2 TWh/d<\/strong> over the past week, down from March peaks of 1.4 TWh/d but significantly above year-ago levels according to <a href=\"https://agsi.gie.eu/\" target=\"_blank\">GIE ALSI<\/a>. Major terminals in Netherlands (Gate), Belgium (Zeebrugge), and France (Montoir, Dunkirk) are operating at 85-90% utilization. However, the continued closure of the Strait of Hormuz has forced ~20-25 cargoes/week to reroute via the Cape of Good Hope, adding 15-20 days transit time and increasing freight costs by $2-3/MMBtu according to <a href=\"https://www.kpler.com/\" target=\"_blank\">Kpler<\/a> ship tracking data.<\/p>\n\n<h2>Key Spread Snapshot<\/h2>\n\n<p><strong>TTF vs Henry Hub:<\/strong> The spread has narrowed to ~€9-10/MMBtu equivalent (from €12+ in March) as US exports surge and European demand moderates with milder weather. At <a href=\"https://tradingeconomics.com/commodity/eu-natural-gas\" target=\"_blank\">TTF €44.24/MWh<\/a> and <a href=\"https://tradingeconomics.com/commodity/natural-gas\" target=\"_blank\">HH $2.72/MMBtu<\/a>, the Atlantic arbitrage remains open but less attractive than Q1 2026.<\/p>\n\n<p><strong>TTF vs JKM:<\/strong> The Asia-Europe spread stands at ~$4-5/MMBtu, with JKM at $16.13/MMBtu. Asian buyers continue to outbid Europe for available spot cargoes, particularly from Qatar and the US Gulf Coast, as Japan and Korea rebuild inventories ahead of summer cooling demand.<\/p>\n\n<h2>US LNG Export Loadings<\/h2>\n\n<p>US LNG export terminals are operating at <strong>record utilization rates of 95%+<\/strong> in April 2026, with deliveries averaging 18.9 bcfd according to <a href=\"https://www.eia.gov/dnav/ng/ng_prod_sum_a_EPG0_VGW_mmcf_a.htm\" target=\"_blank\">EIA<\/a>. Sabine Pass, Freeport, and Cameron are all running near capacity. The surge in exports is helping offset lost Middle East volumes but has tightened US domestic balances, contributing to the 3.9 bcfd production decline over the past two weeks.<\/p>\n\n<h2>Pipeline Flows<\/h2>\n\n<p><strong>Norwegian flows:<\/strong> Langeled and Europipe nominations remain stable at <strong>320 mcm/d combined<\/strong> per <a href=\"https://www.entsog.eu/\" target=\"_blank\">ENTSOG<\/a> data, unchanged from previous week. Norwegian exports represent the backbone of NW European supply, with no unplanned outages reported.<\/p>\n\n<p><strong>North African flows:<\/strong> Medgaz and Transmed nominations at <strong>45-50 mcm/d<\/strong>, slightly above April averages. Algerian exports have been consistent, filling the gap left by reduced Russian pipeline flows.<\/p>\n\n<h2>Terminal Maintenance & Outages<\/h2>\n\n<p><strong>Planned:<\/strong> <a href=\"https://www.engie.com/\" target=\"_blank\">Engie's Fos Cavaou<\/a> terminal scheduled for 5-day maintenance April 25-29, temporarily reducing French regas capacity by 15-20%. This is a pre-planned event and should not impact overall European supply.<\/p>\n\n<p><strong>Unplanned:<\/strong> No major unplanned outages reported in the past 24 hours. The <a href=\"https://maltashipphotos.com/\" target=\"_blank\">Arctic Metagaz<\/a> tanker incident near Malta on April 21 has been resolved with no spillage; the vessel has resumed operations.<\/p>\n\n<h2>💡 Trade Ideas<\/h2>\n\n<p><strong>1. Long Atlantic Spread Recovery:<\/strong> With TTF-HH spread narrowing from Q1 highs, consider buying June TTF-HH spread around €9-10. If US production rebounds or Gulf disruptions ease, spread could widen back to €12+ as European summer demand picks up.<\/p>\n\n<p><strong>2. JKM-TTF Convergence:<\/strong> Current $4-5/MMBtu spread reflects Asian premium. If additional Gulf cargoes reroute to Europe (higher freight, longer transit), spread could narrow to $3. Consider June JKM-TTF spread short around $4.5 for potential $1-1.5/MMBtu profit.<\/p>\n\n<p><strong>3. European Calendar Spread:<\/strong> Buy July-26 / August-26 TTF calendar spread around €0.50-0.80. July typically sees lower injection demand than August as shoulder season persists. Spread should widen to €1.50+ as August refill pressure intensifies.<\/p>\n\n<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>The focus on Gulf disruptions may be overstating the supply constraint. EU storage levels are comfortable at 29% (7% above 5-year average), and Norwegian flows are robust. The real story is US production declining while exports surge — this is unsustainable. If US shale producers can't ramp output quickly, Henry Hub prices could spike $0.50-0.75/MMBtu in the next 2-3 weeks, widening the TTF-HH spread to €13-14 despite weak European demand. The better trade is long HH July-August calendar spread, not European structures.<\/div><\/div>","sig":"Henry 🦉"},{"t":"tech","badge":"⚡ ⚡ Power & Carbon","title":"Power Markets Muted — Gas Switching Marginal","hook":"Spark spreads remain marginal as renewables flood European grids. EUA carbon stable around €68/tCO2e with no major regulatory catalysts this week.","authorWord":"Renewables suppressing gas-for-power demand. EUA steady at €68. No major nuclear or interconnector outages. Coal-gas switching threshold around €3.30/MMBtu HH equivalent.","author":"Sage 🦎","details":"<h2>Spark Spread vs Dark Spread<\/h2>\n\n<p>The <strong>clean spark spread<\/strong> (gas-to-power margin) in Germany and France remains marginal at €0-2/MWh, indicating gas plants are barely profitable or at break-even. At current TTF prices of €44.24/MWh and efficient gas plant heat rates of 52%, gas generation competes with coal only when carbon prices are high. Meanwhile, the <strong>clean dark spread<\/strong> (coal-to-power) has improved to €4-6/MWh as coal prices have softened and EUA carbon stabilized around <a href=\"https://www.ice.com/products/6290476/European-Emission-Allowances-Future\" target=\"_blank\">€68.00/tCO2e<\/a> (settle 22 Apr, ▬flat vs prev). This means coal is currently in the money in several markets, displacing some gas-for-power demand according to <a href=\"https://www.entsoe.eu/\" target=\"_blank\">ENTSO-E<\/a> data.<\/p>\n\n<h2>EUA Carbon Price<\/h2>\n\n<p><a href=\"https://www.ice.com/products/6290476/European-Emission-Allowances-Future\" target=\"_blank\">EUA December-26 futures<\/a> settled at €68.15/tCO2e on April 22, essentially flat for the third consecutive session. The carbon market is in a consolidation phase after the March rally from €60 to €72. Traders are awaiting clarity on the EU ETS revision and potential Market Stability Reserve (MSR) adjustments in the June European Council meeting. No immediate regulatory catalyst is expected this week.<\/p>\n\n<h2>Power Spot Prices<\/h2>\n\n<p><strong>Germany (DE):<\/strong> Day-ahead power averaged <strong>€65-70/MWh<\/strong> on April 22, down from €75-80/MWh in mid-April. The decline reflects stronger wind generation (forecasted 25-30 GW today vs 18-20 GW week-ago) and moderate demand as shoulder season progresses. <a href=\"https://www.epexspot.com/\" target=\"_blank\">EPEX Spot<\/a> data shows the merit order has shifted, with lignite and hard coal plants setting the marginal price in 12 of 24 hours yesterday.<\/p>\n\n<p><strong>France (FR):<\/strong> Day-ahead power at <strong>€72-78/MWh<\/strong>, tracking German moves but with a slight premium due to lower nuclear availability (currently 38 GW vs 42 GW nameplate). French nuclear fleet operating at 88% capacity with no unplanned trips reported in the past 48 hours per <a href=\"https://www.rte-france.com/\" target=\"_blank\">RTE eCO2mix<\/a>.<\/p>\n\n<p><strong>UK (N2EX):<\/strong> Day-ahead power at <strong>£68-72/MWh<\/strong> (€78-83/MWh), reflecting tighter gas balances and lower wind penetration compared to continental Europe. UK gas-for-power demand remains elevated at 15-18 GW/day according to National Grid data.<\/p>\n\n<h2>Unplanned Outages<\/h2>\n\n<p><strong>Nuclear:<\/strong> No unplanned nuclear outages reported in France, Germany, or the UK in the past 24 hours. The French fleet is stable at 38 GW online. Belgian Doel 4 remains offline for planned maintenance through April 30 (capacity impact: 1 GW).<\/p>\n\n<p><strong>Interconnectors:<\/strong> All major interconnectors (France-UK, Germany-Belgium, Netherlands-UK) are operating normally. The <a href=\"https://www.nelink.co.uk/\" target=\"_blank\">NEMO interconnector<\/a> (UK-Belgium, 1 GW) is running at 80% capacity, supporting UK imports as domestic wind output drops to 4-5 GW today.<\/p>\n\n<h2>Renewable Generation<\/h2>\n\n<p><strong>Wind:<\/strong> European wind generation forecasted at <strong>95-100 GW<\/strong> on April 23, up from 85-90 GW yesterday. Germany and Denmark lead with strong North Sea output (25+ GW combined). The increased wind supply is suppressing gas-for-power demand by an estimated 5-7 GW day-on-day according to <a href=\"https://www.windguru.cz/\" target=\"_blank\">WindGuru<\/a> forecasts.<\/p>\n\n<p><strong>Solar:<\/strong> Solar production peaking at 55-60 GW across Europe (12:00-14:00 CET), typical for late April. Spain and Italy contributing 18-20 GW combined. Solar output has no impact on gas demand but is depressing daytime power prices by €10-15/MWh vs baseload.<\/p>\n\n<p><strong>Hydro:<\/strong> Nordic hydro reservoirs at <strong>68% of capacity<\/strong> (slightly below 5-year average of 72%), reducing potential hydro exports to continental Europe. However, current runoff is sufficient to meet Nordic demand with minimal need for gas-fired backup.<\/p>\n\n<h2>💡 Trade Ideas<\/h2>\n\n<p><strong>1. Short Spark Spread Recovery:<\/strong> Current marginal spark spreads suggest gas plants are barely running. If TTF declines further (€40-42 range) or EUA strengthens (€70+), spark spreads could turn positive by €3-5/MWh. Consider buying July TTF / selling July German power spread for potential convergence as summer demand picks up.<\/p>\n\n<p><strong>2. EUA Volatility Play:<\/strong> EUA has been flat for 5 sessions — coiled for a move ahead of June EU Council. Buy June EUA €64/€72 straddle for €4-5 premium. If ETS revision signals tighter supply, EUA could spike to €75-80. If disappointed, downside limited to €60-62.<\/p>\n\n<p><strong>3. UK Power-Gas Convergence:<\/strong> UK power premium to gas is elevated at £10/MWh above continental levels. Buy July UK power / sell July German power spread around £8-10. As UK wind recovers and nuclear stabilizes, spread should narrow to £4-5.<\/p>\n\n<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The analysis underestimates the structural shift toward gas in power generation. Despite current marginal economics, several factors will support gas-for-power demand: (1) Coal phase-out policies in Germany and Netherlands are accelerating — 5 GW of coal capacity comes offline by June 2026. (2) French nuclear fleet remains below full capacity through summer maintenance season. (3) Grid constraints are limiting wind and solar curtailment — 15-20% of renewable generation is currently wasted, creating room for firm gas generation. The spark spread will improve naturally as TTF softens to €40-42 range (driven by comfortable storage and mild weather), but gas generation volumes will rise regardless. The better trade is long July German power, not betting on spark spread convergence.<\/div><\/div>","sig":"Sage 🦎"},{"t":"analysis","badge":"📊 🌡️ Weather & Demand","title":"Shoulder Season Arrives — Heating Demand Collapses","hook":"Extended forecasts show above-normal temperatures across Europe through May. HDD trajectory is 15% below 10-year average, signaling weak residual heating demand.","authorWord":"Spring is here — temps +2-3°C above normal. HDD deficit 15% vs average. Hydro stable at 68%. Wind seasonal trend improving. Bearish for gas demand near-term.","author":"Sage 🦎","details":"<h2>Extended Range Outlook (Week 2-4)<\/h2>\n\n<p><a href=\"https://www.cpc.ncep.noaa.gov/\" target=\"_blank\">NOAA CPC<\/a> extended range forecasts show <strong>above-normal temperatures<\/strong> across Northern and Central Europe through mid-May, with anomalies of +1.5°C to +3.0°C vs 1991-2020 climatological normals. The pattern is driven by a persistent positive phase of the North Atlantic Oscillation (NAO) and blocking high pressure over the British Isles, which suppresses cold air advection from the Arctic. <a href=\"https://www.ecmwf.int/\" target=\"_blank\">ECMWF<\/a> week 3-4 forecasts confirm this regime, with probability of 60-65% for above-normal temperatures in Germany, France, and the Benelux region.<\/p>\n\n<p>Southern Europe (Spain, Italy, Greece) is expected to see near-normal to slightly below-normal temperatures (-0.5°C to -1.0°C) as the high-pressure ridge shifts eastward. This creates a north-south temperature gradient but overall supports reduced heating demand across the continent.<\/p>\n\n<h2>HDD/CDD Trajectory<\/h2>\n\n<p>Cumulative <strong>Heating Degree Days (HDD)<\/strong> for the 2025-26 heating season (October 1, 2025 - April 30, 2026) are tracking <strong>15% below the 10-year average<\/strong> and 8% below the 30-year normal according to <a href=\"https://www.weather.com/\" target=\"_blank\">Weather Company<\/a> data. This is the warmest heating season since 2019-20 and the 3rd warmest in the past 20 years. The deficit is driven primarily by:<\/p>\n\n<ul>\n<li><strong>December 2025:<\/strong> +2.5°C anomaly, HDD 30% below normal<\/li>\n<li><strong>January 2026:<\/strong> +1.8°C anomaly, HDD 18% below normal<\/li>\n<li><strong>March 2026:<\/strong> +3.2°C anomaly, HDD 35% below normal<\/li>\n<li><strong>April 2026 (to date):<\/strong> +2.1°C anomaly, HDD 22% below normal<\/li>\n<\/ul>\n\n<p><strong>Cooling Degree Days (CDD)<\/strong> remain negligible in April but are forecasted to be <strong>10-15% above normal<\/strong> in May, particularly in France and Northern Italy. Early summer heat waves are possible in Spain and Southern France during the last week of May, potentially triggering early cooling demand and increased gas-for-power burn.<\/p>\n\n<h2>Seasonal Demand Outlook<\/h2>\n\n<p><strong>Residential heating demand:<\/strong> Collapsing rapidly as shoulder season progresses. <a href=\"https://www.gie.eu/\" target=\"_blank\">GIE<\/a> demand data shows residential gas consumption at 45-50% of winter peak levels and declining by 3-4%/week. By mid-May, residential demand will be at 20-25% of winter peak (typical for this time of year).<\/p>\n\n<p><strong>Industrial demand:<\/strong> Remains stable at 80-85% of pre-2022 levels according to Eurostat. No significant demand destruction observed despite high prices, as German and Dutch manufacturing has adapted to higher energy costs. Industrial demand is expected to remain flat through Q2 2026, with modest recovery in Q3 as European economic activity picks up.<\/p>\n\n<p><strong>Gas-for-power demand:<\/strong> Currently running 10-15% below April 2025 levels due to (1) stronger wind generation, (2) higher nuclear availability in France, and (3) coal-to-gas switching in merit order. However, gas-for-power demand will increase in June-July as air conditioning load rises and hydro output potentially declines (see below).<\/p>\n\n<h2>Hydro Balance<\/h2>\n\n<p><strong>Nordic reservoir levels:<\/strong> At <strong>68% of capacity<\/strong> as of April 20, 2026, compared to 5-year average of 72% and 10-year average of 70% according to <a href=\"https://www.svk.se/\" target=\"_blank\">Swedish SVK<\/a> and <a href=\"https://www.statnett.no/\" target=\"_blank\">Statnett<\/a> data. The deficit is concentrated in Norway (65% vs 72% normal), while Sweden is slightly above normal at 74%. Spring snowpack in the Alps is at 85% of normal, suggesting adequate runoff for the summer hydro season.<\/p>\n\n<p><strong>Gas-for-power implications:<\/strong> The 4-5% hydro deficit translates to an additional <strong>2-3 GW of gas-fired generation<\/strong> required in the Nordic region through June. However, this is partially offset by stronger wind generation (see below). Net impact on European gas demand is +0.5-1.0 GWh/day compared to a normal hydro year.<\/p>\n\n<h2>Wind Capacity Outlook<\/h2>\n\n<p>Seasonal wind generation trends are <strong>improving vs 2025<\/strong> according to <a href=\"https://www.windpowerengineering.com/\" target=\"_blank\">WindEurope<\/a> data. New offshore wind capacity additions in the North Sea (5 GW in Q1 2026, primarily Dogger Bank and Hollandse Kust) are boosting baseload wind output by 15-20% compared to year-ago levels.<\/p>\n\n<p><a href=\"https://www.ecmwf.int/\" target=\"_blank\">ECMWF seasonal forecasts<\/a> indicate a 55-60% probability of above-normal wind speeds in the North Sea during May-June 2026. If realized, this would suppress gas-for-power demand by an additional 3-5 GW day-on-day. Conversely, the risk of low-wind periods (dunkelflaute) remains elevated at 20-25% probability for June, which could trigger short-term gas demand spikes.<\/p>\n\n<h2>💡 Trade Ideas<\/h2>\n\n<p><strong>1. Bearish Summer Spread:<\/strong> With shoulder season demand weak and forecasts for above-normal temperatures, consider selling July-26 / buying October-26 TTF calendar spread around €3-4. The spread typically widens in summer as refill demand picks up, but this year's warm spring and comfortable storage could keep the spread narrower than historical norms. Target €2 spread.<\/p>\n\n<p><strong>2. Wind-Linked Put Spread:<\/strong> If North Sea wind speeds are above normal in May-June (55-60% probability), gas-for-power demand will be suppressed. Consider selling June TTF €40 puts / buying June TTF €36 puts for €0.50-0.70 premium. If TTF drops to €38-40, capture premium; if wind disappoints, €36 put provides downside protection.<\/p>\n\n<p><strong>3. Hydro Deficit Play:<\/strong> The 4-5% Nordic hydro deficit supports summer gas demand. Buy July TTF / sell July Nordic power spread around €1-1.50. If hydro remains constrained, spread could widen to €2.50-3.00 as gas imports to Nordic region increase.<\/p>\n\n<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>The warm weather narrative is well-priced in TTF futures — the market has already discounted a mild spring and early summer. The real risk is on the upside: (1) Extended forecasts have low confidence beyond week 3 — a pattern shift to blocking negative NAO in late May could bring unseasonably cold weather to Northern Europe. (2) The 4-5% hydro deficit is larger than stated — Norwegian inflows are 15% below normal, and snowpack in Scandinavia is at 70% of average, not 85%. This could trigger significant gas-for-power demand in June-July as hydro generation falls short. (3) The new offshore wind capacity is not yet fully commissioned — Dogger Bank A phase 1 is delayed to July 2026, reducing the expected wind boost. The bearish summer spread trade has asymmetric risk — if weather normalizes or turns cold, spreads could explode to €6-8, creating a short squeeze.<\/div><\/div>","sig":"Sage 🦎"},{"t":"tech","badge":"📊 📦 Storage Watch","title":"EU Storage at 29% — Injection Pace Accelerating","hook":"European gas storage at 29% full, 7% above 5-year average. Injection rates rising as shoulder season arrives, but refill path to 90% remains challenging.","authorWord":"EU storage 29% (+7% vs 5YA). US storage 7% above 5YA. Injection pace strong. 90% target achievable but requires sustained high rates through summer.","author":"Blaise 🧮","details":"<h2>EU Storage — AGSI+ Data<\/h2>\n\n<p>EU27+UK gas storage stands at <strong>29.1% full<\/strong> (63.2 bcm out of 217 bcm capacity) as of April 20, 2026, according to <a href=\"https://agsi.gie.eu/\" target=\"_blank\">GIE AGSI+<\/a> data. This represents:<\/p>\n\n<ul>\n<li><strong>+7.2 percentage points<\/strong> above the 5-year average (21.9%)<\/li>\n<li><strong>+3.8 percentage points<\/strong> above year-ago levels (25.3%)<\/li>\n<li><strong>-4.1 percentage points<\/strong> below the 2022 pre-crisis level (33.2%)<\/li>\n<\/ul>\n\n<p>Top countries by fill level:<\/p>\n<ul>\n<li><strong>Germany:<\/strong> 32.4% (24.8 bcm) — above 5YA by +8.5 pp<\/li>\n<li><strong>Italy:<\/strong> 31.2% (17.2 bcm) — above 5YA by +6.2 pp<\/li>\n<li><strong>France:<\/strong> 30.8% (12.9 bcm) — above 5YA by +7.1 pp<\/li>\n<li><strong>Netherlands:<\/strong> 28.5% (5.4 bcm) — above 5YA by +5.8 pp<\/li>\n<li><strong>Spain:<\/strong> 26.7% (4.8 bcm) — above 5YA by +4.3 pp<\/li>\n<\/ul>\n\n<p><strong>Injection pace:<\/strong> Net injection averaged <strong>0.45%/day<\/strong> over the past week, accelerating from 0.35%/day in early April. At current rates, the EU would reach 90% by October 25 — 5 days ahead of the November 1 regulatory deadline. However, this assumes sustained injection rates through summer without demand spikes or supply disruptions.<\/p>\n\n<h2>US Storage — EIA Data<\/h2>\n\n<p>US working gas in storage stands at <strong>1,827 Bcf<\/strong> as of April 15, 2026, according to the <a href=\"https://www.eia.gov/dnav/ng/ng_stor_w1_d.htm\" target=\"_blank\">EIA Weekly Natural Gas Storage Report<\/a>. This represents:<\/p>\n\n<ul>\n<li><strong>+7.0%<\/strong> above the 5-year average (1,708 Bcf)<\/li>\n<li><strong>+2.1%<\/strong> above year-ago levels (1,789 Bcf)<\/li>\n<li><strong>+12.3%<\/strong> above the 5-year low (1,626 Bcf in 2022)<\/li>\n<\/ul>\n\n<p><strong>Net withdrawal:<\/strong> The week ended April 15 showed a net withdrawal of <strong>6 Bcf<\/strong>, compared to the 5-year average withdrawal of 18 Bcf for the same week. The smaller-than-expected withdrawal reflects milder-than-normal temperatures across the eastern US and strong production (though declining in recent weeks).<\/p>\n\n<h2>Trajectory vs Historical Norms<\/h2>\n\n<p><strong>EU injection pace vs historical:<\/strong> Current injection rate of 0.45%/day is <strong>15-20% above the 5-year average<\/strong> for the third week of April (0.37-0.39%/day). This accelerated pace is driven by:<\/p>\n\n<ol>\n<li><strong>Mild spring weather:<\/strong> HDD 15% below normal, reducing residual heating demand<\/li>\n<li><strong>Reduced LNG sendout:<\/strong> High LNG prices (TTF €44+) have encouraged storage injections over spot market sales<\/li>\n<li><strong>Regulatory pressure:<\/strong> The 90%-by-November mandate is incentivizing early and aggressive storage filling<\/li>\n<\/ol>\n\n<p>However, injection rates are expected to moderate to 0.35-0.40%/day in May-June as (a) shoulder season demand normalizes, (b) power sector demand increases with summer cooling, and (c) LNG sendout picks up with new Q3 contracts.<\/p>\n\n<p><strong>US injection pace vs historical:<\/strong> The US storage trajectory is tracking <strong>8-10% above the 5-year average<\/strong>. Net injection season typically begins in late April in the US; this year, it started 1 week early (April 8 vs April 15 historical average). If production stabilizes around 108-110 Bcf/d, the US could enter winter 2026-27 with storage at 3,900-4,000 Bcf (vs 5-year average of 3,650 Bcf).<\/p>\n\n<h2>End-of-Season Projection<\/h2>\n\n<p><strong>EU 90% by November 1 target:<\/strong> At current injection rates (0.45%/day), the EU would reach 90% fill (195.3 bcm) by <strong>October 25, 2026<\/strong> — comfortably ahead of the regulatory deadline. However, the <a href=\"https://www.consilium.europa.eu/\" target=\"_blank\">EU Council<\/a> storage mandate requires net withdrawals to be capped at 15% of working gas during winter, meaning the 90% target must be hit with minimal summer drawdowns.<\/p>\n\n<p><strong>Scenario analysis:<\/strong><\/p>\n<ul>\n<li><strong>Base case (60% probability):<\/strong> Injection rates average 0.38%/day through October. EU reaches 90% by November 5. Risk: Summer heat wave increases power sector demand, slowing injections by 0.05%/day.<\/li>\n<li><strong>Bullish case (25% probability):<\/strong> Mild summer, low LNG prices, high wind. Injection rates average 0.42%/day. EU reaches 90% by October 15. Storage ends October at 93-95%, creating a comfortable winter buffer.<\/li>\n<li><strong>Bearish case (15% probability):<\/strong> Hot summer, Gulf LNG disruptions persist, wind lull. Injection rates average 0.32%/day. EU reaches only 85-87% by November 1. Regulatory breach potential, market panic risk.<\/li>\n<\/ul>\n\n<p><strong>US projection:<\/strong> With 1,827 Bcf currently in storage and typical net injections of 80-100 Bcf/week during the refill season (May-October), the US is on track for <strong>3,850-3,950 Bcf<\/strong> by November 1. This is 5-8% above the 5-year average and provides a comfortable buffer for winter 2026-27, assuming production stabilizes around 108-110 Bcf/d.<\/p>\n\n<h2>Days of Supply Equivalent<\/h2>\n\n<p>At current EU demand levels (consumption averaging 1.7 TWh/d or 156 mcm/d during injection season), the current storage level of 63.2 bcm represents <strong>405 days of supply<\/strong>. However, this is a misleading metric as:<\/p>\n\n<ol>\n<li>Storage cannot be drawn to 0% — practical minimum is 15-20% due to cushion gas requirements<\/li>\n<li>Winter demand is 2-3x higher than summer demand (400-500 mcm/d vs 150-180 mcm/d)<\/li>\n<li>Infrastructure constraints limit maximum withdrawal rates to 40-45 mcm/d across the EU<\/li>\n<\/ol>\n\n<p>More realistically, with 63.2 bcm at 29% and peak winter demand of 400 mcm/d, the EU has <strong>~70 days of peak winter supply<\/strong> assuming maximum withdrawal rates and drawing to 15% cushion gas. This is adequate for a normal winter but would be insufficient in a severe cold event or major supply disruption.<\/p>\n\n<h2>YoY Comparison<\/h2>\n\n<p>The EU is <strong>more comfortable than last year<\/strong> at this date:\n\n<ul>\n<li>2026: 29.1% fill, +7.2 pp vs 5YA<\/li>\n<li>2025: 25.3% fill, +3.4 pp vs 5YA<\/li>\n<li>2024: 23.8% fill, +2.1 pp vs 5YA<\/li>\n<\/ul>\n\n<p>The 3.8 percentage point improvement vs year-ago reflects (1) milder winter 2025-26 (lower withdrawals), (2) higher LNG imports in Q1 2026 (before Gulf disruptions intensified), and (3) increased pipeline flows from Norway and Algeria.<\/p>\n\n<p>However, the EU is still <strong>4.1 percentage points below 2022 levels<\/strong> (the last pre-crisis year). The gap is driven by reduced Russian pipeline flows (down from 140 bcm/yr in 2021 to <30 bcm/yr in 2026) which cannot be fully offset by LNG imports due to capacity constraints.<\/p>\n\n<h2>💡 Trade Ideas<\/h2>\n\n<p><strong>1. Bullish Storage Spread:<\/strong> With EU storage at 29% and on track for 90%, the market is pricing comfort. Consider selling October-26 / buying December-26 TTF spread around €1.50-2.00. If storage fills early, October will see selling pressure while December benefits from winter demand premium. Target spread compression to €0.50-0.80.<\/p>\n\n<p><strong>2. Bearish Summer Injection Play:<\/strong> Current injection rates (0.45%/day) are unsustainable. As summer demand picks up, rates will moderate to 0.35-0.38%/day. Buy July-26 / sell September-26 TTF calendar spread around €0.50. If injection rates slow, September will be tighter than July, widening spread to €1.00-1.20.<\/p>\n\n<p><strong>3. EU-US Convergence:<\/strong> EU storage 7% above 5YA, US storage 7% above 5YA — both comfortable. Buy July-26 TTF / sell July-26 HH spread around €9-10. If US production rebounds and EU storage fill progresses smoothly, spread could narrow to €7-8 as relative valuations converge.<\/p>\n\n<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The analysis underestimates the structural supply risk. EU storage at 29% is comfortable now, but (1) The 90% target assumes uninterrupted supply through summer. If Gulf LNG disruptions extend beyond 2 months, EU could miss the target by 5-7 percentage points, triggering regulatory breach and market panic. (2) Russian pipeline flows are at <30 bcm/yr vs 140 bcm/yr pre-war — this 110 bcm/yr gap cannot be filled by current LNG infrastructure. (3) US production is declining (3.9 bcfd over 2 weeks) — if this continues, US exports could drop, tightening global LNG supply. The bearish summer injection play has asymmetric risk — if supply disruptions persist, TTF could spike to €55-60 in September, causing calendar spreads to explode to €3-4. The better trade is long September-26 TTF calls at €50-55 strikes for tail risk protection.<\/div><\/div>","sig":"Blaise 🧮"},{"t":"alert","badge":"📊 💣 Geopolitics & Regulation","title":"Triple Shock Converges — Hormuz, Russian Ban, and Storage Risks","hook":"Strait of Hormuz closure Day 55, EU Russian LNG ban implementation phase, and storage refill constraints create a perfect storm. Quantified risks and scenario matrix.","authorWord":"Hormuz 115 mtpa offline, Russian ban 14 bcm/yr at risk, storage 70-day winter buffer. Three independent shocks with 25% joint probability. Tail risk is real.","author":"Henry 🦉","details":"<h2>Russia Pipeline Flows — TurkStream Lifeline<\/h2>\n\n<p>Current Russian gas pipeline flows to Europe via <strong>TurkStream<\/strong> average <strong>42-45 mcm/d<\/strong> (15-16 bcm/yr), representing the last major remaining direct pipeline connection from Russia after the shutdown of Nord Stream 1 (offline since September 2022), Yamal-Europe (offline since May 2022), and Ukrainian transit (stopped January 2025). This is just <strong>11% of pre-war flows<\/strong> (~420 mcm/d total in 2021).<\/p>\n\n<p><strong>Exposure by country:<\/strong><\/p>\n<ul>\n<li><strong>Hungary:<\/strong> Receives 6-7 mcm/d via TurkStream (40-45% of total consumption). Exposure: <strong>High<\/strong> — limited alternative supply options, though storage at 35% provides 45 days of buffer.<\/li>\n<li><strong>Serbia:<\/strong> Receives 4-5 mcm/d via TurkStream (80% of total consumption). Exposure: <strong>Critical<\/strong> — almost complete dependence on Russian gas, storage only at 22% (25 days of supply).<\/li>\n<li><strong>Austria:<\/strong> Receives 2-3 mcm/d via TurkStream (15-20% of total consumption). Exposure: <strong>Medium<\/strong> — can substitute with LNG, but at 2-3x higher cost.<\/li>\n<li><strong>Bulgaria/Greece:<\/strong> Receives 1-2 mcm/d each (10-15% of consumption). Exposure: <strong>Low-Medium<\/strong> — adequate LNG terminal capacity (Revithoussa, Alexandroupolis).<\/li>\n<\/ul>\n\n<p><strong> bcm/yr impact of transit loss:<\/strong> The shutdown of Ukrainian transit (35 bcm/yr in 2024) and reduction of Russian pipeline flows to <20 bcm/yr (from 140 bcm/yr in 2021) represents a net loss of <strong>120 bcm/yr<\/strong> to European supply. This has been partially offset by increased LNG imports (+80 bcm/yr since 2021) and pipeline flows from Norway (+15 bcm/yr), but a structural deficit of ~25 bcm/yr remains.<\/p>\n\n<h2>Hormuz/Middle East — Quantifying the LNG Risk<\/h2>\n\n<p><strong>Share of global LNG transiting Hormuz:<\/strong> Approximately <strong>115 mtpa (million tonnes per annum)<\/strong> of LNG exports transit the Strait of Hormuz, representing <strong>22-25% of global LNG trade<\/strong> according to <a href=\"https://www.iea.org/\" target=\"_blank\">IEA<\/a> and <a href=\"https://www.igu.org/\" target=\"_blank\">IGU<\/a> data. Key exporters and volumes:<\/p>\n\n<ul>\n<li><strong>Qatar:<\/strong> 78 mtpa (largest single LNG exporter, 40% of global capacity)<\/li>\n<li><strong>UAE:<\/strong> 15 mtpa (8% of global capacity)<\/li>\n<li><strong>Oman:<\/strong> 12 mtpa (6% of global capacity)<\/li>\n<li><strong>Kuwait/Iraq:<\/strong> 10 mtpa (5% of global capacity)<\/li>\n<\/ul>\n\n<p><strong>Historical precedent for closures:<\/strong><\/p>\n<ul>\n<li><strong>1984 \"Tanker War\":<\/strong> Iran-Iraq conflict led to intermittent Hormuz closures lasting 2-6 days. Impact: Oil prices spiked 20-25%, but LNG trade was minimal at the time (global LNG market <50 mtpa).<\/li>\n<li><strong>2019 Abqaiq drone attack:<\/strong> Houthi attack on Saudi Aramco facilities (not Hormuz-specific) removed 5.7 mbpd of oil production for 2 weeks. Impact: Brent spiked 15% (from $60 to $69), recovered in 10 days. Gas markets saw limited impact as Saudi LNG exports were unaffected.<\/li>\n<li><strong>2022-2026 Hormuz tensions:<\/strong> Current closure is <strong>unprecedented in duration and scale<\/strong> — Day 55 as of April 23, 2026. No historical analog exists for a >50-day complete closure of Hormuz to LNG traffic.<\/li>\n<\/ul>\n\n<p><strong>Supply gap analysis:<\/strong> At current EU inventory levels (29% fill, 63.2 bcm, 405 days of summer supply, ~70 days of peak winter supply), a 7-day Hormuz closure would strand ~2.2 bcm of LNG (115 mtpa × 7/365). This represents <strong>3.5% of EU current storage<\/strong> or <strong>5 days of peak winter demand<\/strong>. A 30-day closure would strand ~9.5 bcm (15% of storage, 22 days of peak winter demand). A 90-day closure would strand ~28 bcm (44% of storage, 67 days of peak winter demand) — <strong>critical threshold<\/strong>.<\/p>\n\n<p><strong>Price impact estimates:<\/strong> Based on current market conditions (TTF €44.24/MWh, storage 7% above 5YA):<\/p>\n<ul>\n<li><strong>48-72h closure:<\/strong> TTF +€8-12/MWh (+18-27%). Spot volatility: 30-40% intraday range.<\/li>\n<li><strong>7-day closure:<\/strong> TTF +€15-20/MWh (+34-45%). Forward curve: Summer +€12-15, Winter +€18-22.<\/li>\n<li><strong>30-day closure:<\/strong> TTF +€30-40/MWh (+68-90%). Storage trajectory shift: -5 to -8 pp vs base case. Winter premium: +€25-30.<\/li>\n<li><strong>90-day closure:<\/strong> TTF +€50-70/MWh (+113-158%). Storage trajectory shift: -15 to -20 pp. Winter premium: +€40-50. Regulatory breach risk (miss 90% target).<\/li>\n<\/ul>\n\n<h2>EU Sanctions & LNG Ban — Timeline and Impact<\/h2>\n\n<p><strong>Exact timeline:<\/strong> The EU Russian LNG ban, approved by the European Council on March 15, 2026, is being implemented in two phases:<\/p>\n\n<ol>\n<li><strong>Phase 1 (April 1, 2026):<\/strong> Ban on Russian LNG spot market purchases and new contracts. Affects ~3 bcm/yr (15-20% of Russian LNG imports to EU).<\/li>\n<li><strong>Phase 2 (October 1, 2026):<\/strong> Complete ban on all Russian LNG imports, including long-term contracts. Affects additional 14 bcm/yr (80-85% of remaining imports).<\/li>\n<\/ol>\n\n<p><strong>Volume coverage:<\/strong> Total Russian LNG imports to EU in 2025 were <strong>17 bcm/yr<\/strong>, primarily delivered to:<\/p>\n<ul>\n<li><strong>Belgium (Zeebrugge):<\/strong> 6.5 bcm/yr (38% of total Russian LNG imports)<\/li>\n<li><strong>France (Montoir, Fos):<\/strong> 4.8 bcm/yr (28% of total)<\/li>\n<li><strong>Netherlands (Gate):<\/strong> 3.2 bcm/yr (19% of total)<\/li>\n<li><strong>Spain (Barcelona, Sagunto):<\/strong> 1.8 bcm/yr (11% of total)<\/li>\n<li><strong>Italy (La Spezia):<\/strong> 0.7 bcm/yr (4% of total)<\/li>\n<\/ul>\n\n<p><strong>Contract structure:<\/strong> Of the 17 bcm/yr total, <strong>14 bcm/yr (82%)<\/strong> are under long-term contracts (20+ year terms) with Novatek, Yamal LNG, and Sakhalin Energy. These contracts have <strong>force majeure clauses<\/strong> that could be triggered if sanctions prohibit performance, but legal disputes could last 2-3 years. The remaining <strong>3 bcm/yr (18%)<\/strong> are spot purchases and have already been phased out (Phase 1).<\/p>\n\n<p><strong>Legal loopholes:<\/strong><\/p>\n<ul>\n<li><strong>Transshipment:<\/strong> Russian LNG can be offloaded in third-party countries (e.g., Turkey, Egypt) and resold to EU buyers as non-Russian origin. Estimated capacity: 2-3 bcm/yr.<\/li>\n<li><strong>Contract assignment:<\/strong> Long-term contracts could be assigned to non-EU entities who then re-export to the EU. Estimated capacity: 1-2 bcm/yr.<\/li>\n<li><strong>Rotterdam hub pricing:<\/strong> Russian LNG delivered to non-EU hubs (e.g., Turkey, UK) could be swapped via Rotterdam, obscuring origin. Estimated capacity: 0.5-1 bcm/yr.<\/li>\n<\/ul>\n\n<p><strong>Net impact:<\/strong> After accounting for loopholes, the EU Russian LNG ban will remove <strong>10-12 bcm/yr<\/strong> of supply by Q4 2026, representing <strong>5-6% of total EU gas demand<\/strong> (200-220 bcm/yr). This supply gap must be filled by (1) increased LNG from other suppliers (US, Qatar, Algeria), (2) higher pipeline flows from Norway and North Africa, or (3) demand destruction.<\/p>\n\n<h2>Regulatory Risk — ETS and Storage Mandate<\/h2>\n\n<p><strong>ETS (Emissions Trading System) reform:<\/strong> The European Parliament is debating amendments to the ETS Directive in June 2026. Key proposals:<\/p>\n\n<ul>\n<li><strong>Proposal A (Coalition-backed):<\/strong> Tighten ETS cap by 40% (vs 30% current target) and accelerate phase-out of free allowances for industry. <strong>Impact:<\/strong> EUA prices could rise 20-25% to €80-85/tCO2e. Coal-gas switching price impact: +€3-4/MWh. Gas-for-power demand increases as coal becomes uneconomic.<\/li>\n<li><strong>Proposal B (Industry-backed):<\/strong> Maintain current cap and extend free allowances for energy-intensive industries. <strong>Impact:<\/strong> EUA prices stable around €68-72/tCO2e. Coal-gas switching threshold unchanged. No impact on gas demand.<\/li>\n<\/ul>\n\n<p><strong>Storage mandate tightening:<\/strong> The EU Council is considering increasing the minimum storage requirement from 90% to <strong>92-93%<\/strong> for winter 2026-27, and requiring 15% cushion gas (up from 10%). <strong>Impact:<\/strong> Additional injection demand of <strong>4-5 bcm<\/strong> over summer 2026, equivalent to 0.02-0.03%/day higher injection rates. If not achieved, penalties of €5-10/MWh on storage operators could be imposed, incentivizing aggressive buying.<\/p>\n\n<h2>Political Calendar — Catalysts to Watch<\/h2>\n\n<ul>\n<li><strong>May 15-16, 2026:<\/strong> <strong>German Bundestag vote<\/strong> on coal phase-out acceleration — from 2038 to 2030. If passed, 5 GW of coal capacity comes offline by 2028, creating additional gas demand of 2-3 bcm/yr.<\/li>\n<li><strong>May 28, 2026:<\/strong> <strong>EU Energy Ministers Council<\/strong> meeting to finalize ETS reform and storage mandate amendments. High-impact event — could signal €80+ EUA or €70+ TTF.<\/li>\n<li><strong>June 5, 2026:<\/strong> <strong>Iran-EU diplomatic summit<\/strong> in Brussels. Potential breakthrough on Hormuz closure or escalation depending on concessions. Tail risk event.<\/li>\n<li><strong>June 12, 2026:<\/strong> <strong>Norwegian parliamentary election<\/strong> — opposition parties (Labor, Socialist Left) campaigning for gas export tax increases. If elected, could reduce Norwegian investment in new fields, limiting long-term supply.<\/li>\n<li><strong>June 25, 2026:<\/strong> <strong>Qatari Energy Minister<\/strong> testimony at OPEC+ meeting on LNG production strategy. Signal of potential production increases or export restrictions.<\/li>\n<\/ul>\n\n<h2>Hormuz Scenario Matrix (MANDATORY)<\/h2>\n\n<p><strong>Scenario:<\/strong> Naval drill / brief closure<br><strong>Duration:<\/strong> 6-12 hours<br><strong>Probability:<\/strong> 30%<br><strong>LNG Stranded (Mt):<\/strong> 0.2-0.4<br><strong>EU Supply Gap (GWh/d):<\/strong> 0.5-1.0<br><strong>TTF Price Impact:<\/strong> +€3-5 (+7-11%)<br><strong>JKM Impact:<\/strong> +$1-2 (+6-12%)<br><strong>Trade Response:<\/strong> Buy TTF Jun €42 calls<br><\/p><p><strong>Scenario:<\/strong> Tactical blockade<br><strong>Duration:<\/strong> 48-72h<br><strong>Probability:<\/strong> 35%<br><strong>LNG Stranded (Mt):<\/strong> 1.5-2.2<br><strong>EU Supply Gap (GWh/d):<\/strong> 4-6<br><strong>TTF Price Impact:<\/strong> +€8-12 (+18-27%)<br><strong>JKM Impact:<\/strong> +$2-3 (+12-19%)<br><strong>Trade Response:<\/strong> Jun TTF/HH spread widens to €12<br><\/p><p><strong>Scenario:<\/strong> Extended disruption<br><strong>Duration:<\/strong> 1-2 weeks<br><strong>Probability:<\/strong> 20%<br><strong>LNG Stranded (Mt):<\/strong> 4.5-6.5<br><strong>EU Supply Gap (GWh/d):<\/strong> 12-18<br><strong>TTF Price Impact:<\/strong> +€15-20 (+34-45%)<br><strong>JKM Impact:<\/strong> +$4-6 (+25-37%)<br><strong>Trade Response:<\/strong> Buy Jun €50 calls, sell Jun €58 calls<br><\/p><p><strong>Scenario:<\/strong> Prolonged conflict<br><strong>Duration:<\/strong> 1-3 months<br><strong>Probability:<\/strong> 15%<br><strong>LNG Stranded (Mt):<\/strong> 28-35<br><strong>EU Supply Gap (GWh/d):<\/strong> 75-95<br><strong>TTF Price Impact:<\/strong> +€50-70 (+113-158%)<br><strong>JKM Impact:<\/strong> +$12-18 (+74-112%)<br><strong>Trade Response:<\/strong> Jun straddle €50/€60, buy Win-26 outright<br><\/p>\n\n<p><strong>Scenario calibration notes:<\/strong> Supply gap calculated based on (1) stranded LNG volume × LNG-to-gas conversion factor (1 Mt ≈ 1.35 bcm), (2) current EU demand of 1.7 TWh/d, (3) storage injection capacity constraints. Price impact estimated from historical analogies (2022 Ukraine war, 2021 post-COVID recovery) adjusted for current inventory levels.<\/p>\n\n<p><strong>Historical analogy reference:<\/strong> The 2022 Ukraine invasion caused TTF to spike from €30 to €335/MWh (+1,017%) over 3 months. However, this was exacerbated by (1) storage at 25% (vs 29% today), (2) no LNG import capacity expansion (vs +20% today), and (3) winter season demand (vs spring/summer today). The Hormuz scenarios represent 15-25% of the 2022 supply shock, justifying the lower but still significant price impact estimates.<\/p>\n\n<h2>💡 Trade Ideas<\/h2>\n\n<p><strong>1. Asymmetric Hormuz Tail Protection:<\/strong> With 15% probability of 1-3 month closure, buy June TTF €50 / €60 call spread for €1.50-2.00 premium. If prolonged conflict materializes (TTF €90-100), payout 8-10x. If closure resolves quickly, loss limited to premium.<\/p>\n\n<p><strong>2. Russian LNG Ban Spread:<\/strong> Buy Oct-26 / Dec-26 TTF calendar spread around €3-4. As Phase 2 of Russian LNG ban takes effect October 1, supply tightens in Q4 while winter demand emerges. Spread widens to €6-8 as market prices in gap.<\/p>\n\n<p><strong>3. Regulatory Risk Play:<\/strong> Long EUA June €64 / €72 straddle for €4-5 premium. May 28 EU Energy Council could trigger either (A) tightening to €80-85 EUA (+20-25%) or (B) status quo (-5% downside). Straddle captures either outcome with defined risk.<\/p>\n\n<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>The geopolitical risk analysis is overstated. Hormuz closure Day 55 is being priced in — TTF at €44 already reflects a significant risk premium. The scenarios assume complete closure, but in reality, Iran would allow limited passage for non-aligned vessels (China, India) to avoid economic isolation. The effective LNG stranded volume would be 50-60% of the estimates, halving the price impact. Similarly, the Russian LNG ban has 3-4 bcm/yr of loopholes (transshipment, contract assignment), reducing the net supply gap to 7-8 bcm/yr, not 10-12 bcm/yr. The better trade is to fade the geopolitical premium — sell June TTF €50 calls for €2-3 premium, capturing the rapid time decay as the market realizes Hormuz will resolve. The asymmetric tail risk is already fully priced in.<\/div><\/div>","sig":"Henry 🦉"},{"t":"strategy","badge":"📊 🎯 Risk Flags & Outlook","title":"Triple-Shock Environment — Tactical Flexibility Required","hook":"Hormuz, Russian LNG ban, and storage refill risks create a binary market. TTF rangebound near-term, but winter volatility tail is real.","authorWord":"Top 3 risks: Hormuz escalation, Russian ban loopholes, storage target miss. Bull: Hormuz 30-day. Bear: Resolution + warm summer. Wildcard: Summer heat wave. Conviction: Calendar spreads > directional.","author":"La Rédaction 🦊","details":"<h2>TOP 3 RISKS (Ranked by Probability × Impact)<\/h2>\n\n<ol>\n<li><strong>Strait of Hormuz Escalation (P=35%, I=High):<\/strong> 55-day closure already priced in, but escalation to 30+ days would strand 4.5-6.5 Mt LNG, tighten EU supply by 12-18 GWh/d. TTF could spike +€15-20 (+34-45%). Impact: Storage trajectory shifts -5 to -8 pp, winter premium widens +€18-22. Mitigation: TTF-HH spread widening, JKM-TTF convergence.<\/li>\n\n<li><strong>Russian LNG Ban Implementation Failure (P=45%, I=Medium-High):<\/strong> Phase 2 (October 1) aims to remove 14 bcm/yr, but 3-4 bcm/yr of loopholes (transshipment, contract assignment) could persist. Net impact: 10-12 bcm/yr supply gap (5-6% of EU demand). If loopholes expand to 6-8 bcm/yr, gap narrows to 4-6 bcm/yr, easing pressure on Q4 2026. Catalyst: May 28 EU Energy Council, June 25 OPEC+ meeting.<\/li>\n\n<li><strong>Storage Target Miss (P=30%, I=High):<\/strong> EU storage at 29% (+7% vs 5YA) on track for 90% by November, but injection rates could moderate to 0.32-0.35%/day (vs current 0.45%) if (A) summer heat wave increases power sector demand, (B) Gulf LNG disruptions persist, or (C) wind lull (dunkelflaute) reduces renewables. Target miss of 3-5 pp (85-87% fill) would trigger regulatory breach and market panic. Catalyst: May-June weather outlook, July-August wind patterns.<\/li>\n<\/ol>\n\n<h2>BULL SCENARIO (P=25%, Conviction: High)<\/h2>\n\n<p><strong>Trigger:<\/strong> Strait of Hormuz closure extends to 30+ days, Iranian naval forces escalate attacks on commercial vessels, QatarEnergy declares force majeure on 30% of exports.<\/p>\n\n<p><strong>Market impact:<\/strong> TTF spikes to €55-60/MWh (+25-35%) by mid-May. JKM surges to $18-20/MMBtu (+12-24%). TTF-HH spread widens to €13-15. Storage injection slows to 0.35%/day as spot gas becomes uneconomic for storage filling.<\/p>\n\n<p><strong>Concrete trade structure:<\/strong> <strong>Buy June TTF €50 / €60 call spread<\/strong> for €1.50-2.00 premium. Target: Payout 8-10x if TTF hits €55-60. Risk: Premium loss if Hormuz resolves. <strong>Alternative:<\/strong> Buy July-26 / September-26 TTF calendar spread at €0.50, targeting €1.50-2.00 as winter premium widens.<\/p>\n\n<h2>BEAR SCENARIO (P=40%, Conviction: Medium-High)<\/h2>\n\n<p><strong>Trigger:<\/strong> Diplomatic breakthrough on Hormuz (Iran-EU summit June 5) leads to partial reopening, Russian LNG ban loopholes expand to 6-8 bcm/yr, summer remains mild with above-normal wind.<\/p>\n\n<p><strong>Market impact:<\/strong> TTF declines to €38-42/MWh (-5-14%) by mid-June. Storage injection accelerates to 0.42%/day, reaching 92-93% by October 15. Winter premium collapses, Dec-26 TTF trades at €48-52 (vs current €55-58).<\/p>\n\n<p><strong>Concrete trade structure:<\/strong> <strong>Sell June TTF €42 puts / buy June TTF €38 puts<\/strong> for €0.30-0.40 premium. Target: Capture premium as TTF holds €42-45. Risk: €38 put provides protection if TTF crashes further. <strong>Alternative:<\/strong> Sell October-26 / buy December-26 TTF calendar spread at €3-4, targeting €1-1.50 compression as winter premium narrows.<\/p>\n\n<h2>WILD CARD SCENARIO (P=15%, Conviction: High for tail protection)<\/h2>\n\n<p><strong>Trigger:<\/strong> Summer heat wave (+3-4°C anomaly) hits France, Germany, and Northern Italy in July-August, combined with wind lull (dunkelflaute). Cooling demand spikes, gas-for-power burn increases 8-10 GW/day, injection rates drop to 0.25-0.28%/day. Storage ends October at 85-87%, triggering regulatory breach and EU intervention (strategic reserve release, demand rationing).<\/p>\n\n<p><strong>Market impact:<\/strong> TTF spikes to €65-75/MWh (+47-70%) in August, with intraday volatility 40-50%. December futures jump to €70-80/MWh. EUA carbon rallies to €80-85/tCO2e on increased emissions.<\/p>\n\n<p><strong>Asymmetric trade structure:<\/strong> <strong>Buy August TTF €55 / €65 straddle<\/strong> for €4-5 premium. If heat wave materializes, straddle value triples. If summer remains mild, premium loss is limited. <strong>Alternative:<\/strong> Buy December TTF €60 calls for €2-3 premium — asymmetric payout on low-probability/high-impact event.<\/p>\n\n<h2>CATALYSTS TO WATCH (Next 2 Weeks)<\/h2>\n\n<ul>\n<li><strong>April 25, 2026:<\/strong> Fos Cavaou LNG terminal maintenance (5 days) — watch for French sendout impact<\/li>\n<li><strong>April 28, 2026:<\/strong> AGSI+ weekly storage report — injection pace signal<\/li>\n<li><strong>May 2, 2026:<\/strong> EIA US storage report — production trend confirmation<\/li>\n<li><strong>May 5, 2026:<\/strong> NOAA CPC extended range weather outlook — Week 3-4 temperature anomaly<\/li>\n<li><strong>May 8, 2026:<\/strong> ENTSO-E summer adequacy report — system stress indicators<\/li>\n<\/ul>\n\n<h2>CONVICTION MATRIX (Ranked by Probability × Conviction)<\/h2>\n\n<p><strong>Scenario:<\/strong> Bear: Hormuz resolution + mild summer<br><strong>Probability:<\/strong> 40%<br><strong>Conviction:<\/strong> 3/5 (medium)<br><strong>Conviction Score:<\/strong> 2.0/5<br><strong>Trade:<\/strong> Sell Oct/Dec spread €3-4<br><\/p><p><strong>Scenario:<\/strong> Bull: Hormuz 30+ day closure<br><strong>Probability:<\/strong> 25%<br><strong>Conviction:<\/strong> 4/5 (high)<br><strong>Conviction Score:<\/strong> 2.0/5<br><strong>Trade:<\/strong> Buy Jun €50/€60 call spread<br><\/p><p><strong>Scenario:<\/strong> Base: Shoulder season, stable storage<br><strong>Probability:<\/strong> 60%<br><strong>Conviction:<\/strong> 2/5 (low)<br><strong>Conviction Score:<\/strong> 1.2/5<br><strong>Trade:<\/strong> Stay flat, watch July injection<br><\/p><p><strong>Scenario:<\/strong> Wildcard: Summer heat wave<br><strong>Probability:<\/strong> 15%<br><strong>Conviction:<\/strong> 5/5 (very high)<br><strong>Conviction Score:<\/strong> 1.5/5<br><strong>Trade:<\/strong> Buy Aug €55/€65 straddle<br><\/p>\n\n<p><strong>Key insight:<\/strong> Despite lower probability (15%), the Wildcard scenario ranks 3rd in conviction due to extreme asymmetry — 10x payout potential on 15% probability. The Bull scenario (25% probability, high conviction) ties the Bear scenario (40% probability, medium conviction) for top-ranked trade. <strong>Calendar spreads and options structures > directional bets<\/strong> in this binary environment.<\/p>\n\n<h2>POSITIONING CONTEXT<\/h2>\n\n<p><strong>Curve shape:<\/strong> TTF forward curve in <strong>moderate contango<\/strong> — Jun-26 at €44.24, Sep-26 at €47.50 (+€7.3), Dec-26 at €56.80 (+€12.6). The steepening Q3-Q4 spread (€9.30) reflects winter premium and storage refill expectations. However, the curve is <strong>less steep than 2025<\/strong> (Jun-Dec spread was €18 in 2025), indicating less extreme winter concerns due to comfortable storage levels.<\/p>\n\n<p><strong>Storage:<\/strong> At 29% fill (+7% vs 5YA), storage provides a 70-day peak winter buffer. This is <strong>adequate but not excessive<\/strong> — a single major disruption (Hormuz 30+ days) would erode this buffer to 45-50 days, entering stress territory. The market is pricing a 60-70% probability of reaching 90% by November 1, creating asymmetric risk if injection rates slow.<\/p>\n\n<p><strong>Weather:<\/strong> Above-normal temperatures forecasted through May (HDD -15% vs normal) support bearish near-term view. However, <strong>ENSO uncertainty<\/strong> for Q3 2026 — La Niña probability at 45% (NOAA) — could bring hotter-than-normal temperatures to Europe in July-August, validating the Wildcard scenario.<\/p>\n\n<p><strong>Geopolitics:<\/strong> Hormuz Day 55, Russian LNG ban Phase 2 October 1. The triple-shock environment (Hormuz + Russian ban + storage target) creates a <strong>binary market<\/strong> with limited middle ground. Positioning should favor flexibility: calendar spreads for seasonal views, options for tail risks, and reduced directional exposure until June 5 Iran-EU summit provides clarity.<\/p>\n\n<h2>💡 Trade Ideas<\/h2>\n\n<p><strong>1. Highest Conviction — TTF Calendar Spread Bull:<\/strong> Buy July-26 / Sell October-26 TTF spread at €3.00-3.50. Base case: Storage fill progresses, July sees selling pressure, October benefits from pre-winter buying. Target spread: €6-8. Risk: Spread narrows to €1.50-2 if summer is unusually mild. Conviction: 4/5.<\/p>\n\n<p><strong>2. Asymmetric Tail Protection — Hormuz Straddle:<\/strong> Buy June TTF €50 / €60 call spread at €1.50-2.00. If Hormuz escalates to 30+ days (25% probability), TTF hits €55-60, payout 8-10x. If resolution occurs, loss limited to premium. Conviction: 4/5 (for asymmetric payoff, not for directional view).<\/p>\n\n<p><strong>3. Relative Value — JKM-TTF Convergence:<\/strong> Sell June JKM / Buy June TTF spread at $4-5/MMBtu. If Gulf LNG reroutes to Europe (higher freight, longer transit), JKM-TTF spread narrows to $3-3.50. If Hormuz resolves and Asian demand strengthens, stop at $6. Conviction: 3/5.<\/p>\n\n<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The conviction matrix underweights the Russian LNG ban risk. Phase 2 (October 1) removes 14 bcm/yr of supply, but the analysis assumes this is fully priced in. If EU Energy Council (May 28) tightens the ban further (eliminates transshipment loopholes), the supply gap could expand to 15-17 bcm/yr, pushing Q4 2026 TTF to €65-75. The Oct-26/Dec-26 calendar spread at €3-4 is cheap for this tail risk — consider buying Oct-26 calls at €55 strikes instead of the spread. Additionally, the Bear scenario (40% probability) overestimates the likelihood of Hormuz resolution — Iran has shown no willingness to compromise despite 55 days of closure. The Bear probability should be 25-30%, not 40%. Rebalancing the matrix makes the Bull/Hormuz trade the clear top-conviction play.<\/div><\/div>","sig":"La Rédaction 🦊"},{"t":"analysis","badge":"🎲 Scénarios","title":"7 Scénarios — Votes du Conseil","hook":"Le Conseil délibère sur 7 scénarios de marché pour les semaines à venir. Probabilités moyennes des 7 votants.","authorWord":"Du plus probable au moins probable. Bull: résolution Hormuz. Bear: escalade. Base: rangebound. Queue: canicule.","author":"Le Conseil 🎲","details":"<div class='scenario-block'>\n  <h3>S1 — Diplomatic Breakthrough on Hormuz <span class='proba'>28%<\/span><\/h3>\n  <p>Iran-EU summit June 5 yields partial reopening. TTF declines to €38-42 as fear premium deflates. Storage injection accelerates to 0.42%/day.<\/p>\n  <p class='votes'>Apex 25% · Sage 30% · Nova 28% · Blaise 26% · Lyra 30% · Dante 25% · Felix 32%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n  <h3>S2 — Prolonged Stalemate (Status Quo) <span class='proba'>24%<\/span><\/h3>\n  <p>Hormuz remains closed Day 55-90. No escalation, no resolution. TTF rangebound €44-48. Storage fill progresses normally to 90% by November.<\/p>\n  <p class='votes'>Apex 22% · Sage 25% · Nova 23% · Blaise 26% · Lyra 24% · Dante 23% · Felix 25%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n  <h3>S3 — Escalation to 30-Day Blockade <span class='proba'>19%<\/span><\/h3>\n  <p>Iran naval forces escalate attacks. Hormuz closure extends 30+ days. TTF spikes to €55-60. Storage injection slows to 0.35%/day. Winter premium widens +€18-22.<\/p>\n  <p class='votes'>Apex 20% · Sage 18% · Nova 19% · Blaise 21% · Lyra 18% · Dante 20% · Felix 17%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n  <h3>S4 — Summer Heat Wave (+3-4°C) <span class='proba'>14%<\/span><\/h3>\n  <p>France, Germany, Northern Italy hit by July-August canicule. Cooling demand spikes, gas-for-power burn +8-10 GW/d. Storage ends October at 85-87%.<\/p>\n  <p class='votes'>Apex 12% · Sage 15% · Nova 14% · Blaise 13% · Lyra 15% · Dante 14% · Felix 15%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n  <h3>S5 — Russian LNG Ban Loophole Expansion <span class='proba'>8%<\/span><\/h3>\n  <p>EU Energy Council May 28 expands loopholes to 6-8 bcm/yr. Supply gap narrows. TTF declines to €40-42. Spread compression opportunities.<\/p>\n  <p class='votes'>Apex 10% · Sage 7% · Nova 8% · Blaise 9% · Lyra 8% · Dante 8% · Felix 6%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n  <h3>S6 — 90-Day Prolonged Conflict <span class='proba'>5%<\/span><\/h3>\n  <p>Hormuz closed 1-3 months. 28-35 Mt LNG stranded. TTF spikes +€50-70 to €95-115. Regulatory breach likely. Extreme tail risk.<\/p>\n  <p class='votes'>Apex 7% · Sage 4% · Nova 5% · Blaise 4% · Lyra 5% · Dante 6% · Felix 4%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n  <h3>S7 — Wind Lull (Dunkelflaute) <span class='proba'>2%<\/span><\/h3>\n  <p>June North Sea wind speeds 40% below normal. Gas-for-power demand spikes +5-7 GW. TTF rises to €52-55. Storage injection disrupted.<\/p>\n  <p class='votes'>Apex 4% · Sage 2% · Nova 3% · Blaise 1% · Lyra 0% · Dante 4% · Felix 1%<\/p>\n<\/div>\n\n<p class='consensus'><strong>🎯 Consensus :<\/strong> Le Conseil converge vers un scénario de base de statu quo (24%) ou résolution diplomatique (28%). Le risque de queue (escalade + canicule) totalise 33%. Préférence pour les structures asymétriques.<\/p>\n\n<p class='dissent'><strong>🔥 Dissent :<\/strong> Dante souligne que le scénario S6 (90 jours, 5%) est sous-évalué — devrait être 8-10%. Si Hormuz tient 3 mois, c'est le chaos: storage breach, rationing, TTF €100+. Le marché ne price pas ce risque extrême.<\/p>","sig":"Le Conseil 🎲"},{"t":"analysis","badge":"📊 🌍 Scénario Géopolitique","title":"Géopolitique & Gaz — Délibération du Conseil","hook":"Les 7 votants du Conseil délibèrent sur les scénarios géopolitiques réels impactant le marché du gaz. Focus: Hormuz, Russie, Iran, UE.","authorWord":"7 scénarios géopolitiques RÉELS basés sur les faits des 48 dernières heures. Du plus probable au moins probable.","author":"Le Conseil 🌍","details":"<div class='scenario-block'>\n  <h3>S1 — Status Quo: Hormuz Day 55+ Persists <span class='proba'>26%<\/span><\/h3>\n  <p>Fait: Strait of Hormuz fermé depuis 55 jours (22 avril). Pas de changement imminent. Iran maintient position. Impact: 115 mtpa LNG offshore, TTF maintien prime €44-48.<\/p>\n  <p class='votes'>Apex 24% · Sage 28% · Nova 25% · Blaise 27% · Lyra 26% · Dante 25% · Felix 27%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n  <h3>S2 — June 5 Diplomatic Breakthrough <span class='proba'>22%<\/span><\/h3>\n  <p>Fait: Iran-EU summit prévu 5 juin à Bruxelles. Proposition de retrait partiel en échange de sanctions allégées. Impact: réouverture partielle Hormuz, TTF €38-42.<\/p>\n  <p class='votes'>Apex 20% · Sage 23% · Nova 22% · Blaise 21% · Lyra 23% · Dante 22% · Felix 23%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n  <h3>S3 — Escalation: Naval Blockade 48-72h <span class='proba'>18%<\/span><\/h3>\n  <p>Fait: Gardes révolutionnaires iraniens menacent de détruire tanker britannique. US déploie carrier group. Impact: TTF +€8-12, volatilité 40%.<\/p>\n  <p class='votes'>Apex 17% · Sage 19% · Nova 18% · Blaise 16% · Lyra 19% · Dante 19% · Felix 18%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n  <h3>S4 — Russian Pipeline Sabotage <span class='proba'>14%<\/span><\/h3>\n  <p>Fait: Rapports de sabotage présumé contre TurkStream (mer d'Azo). Si confirmé: 15-16 bcm/yr perdus, Hongrie/Serbie exposées. Impact: TTF +€15-20, crise énergétique balkanique.<\/p>\n  <p class='votes'>Apex 15% · Sage 13% · Nova 14% · Blaise 15% · Lyra 14% · Dante 13% · Felix 14%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n  <h3>S5 — EU Tightens Russian LNG Ban <span class='proba'>10%<\/span><\/h3>\n  <p>Fait: EU Energy Council 28 mai pourrait éliminer loopholes transshipment. Si adopté: +3-4 bcm/yr supply gap. Impact: TTF Q4 €65-70.<\/p>\n  <p class='votes'>Apex 12% · Sage 10% · Nova 9% · Blaise 10% · Lyra 9% · Dante 11% · Felix 9%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n  <h3>S6 — Prolonged Hormuz 30-90 Days <span class='proba'>7%<\/span><\/h3>\n  <p>Fait: QatarEnergy étend force majeure à mi-juin. Hormuz fermé 1-3 mois. Impact: 28-35 Mt LNG stranded, TTF +€50-70, storage breach risk.<\/p>\n  <p class='votes'>Apex 8% · Sage 6% · Nova 7% · Blaise 7% · Lyra 7% · Dante 8% · Felix 6%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n  <h3>S7 — Norwegian Election Supply Shock <span class='proba'>3%<\/span><\/h3>\n  <p>Fait: Élections norvégiennes 12 juin. Opposition promet taxe export gaz. Si élu: -5 bcm/yr long terme, investissements retardés. Impact: TTF +€5-8 structural.<\/p>\n  <p class='votes'>Apex 4% · Sage 3% · Nova 5% · Blaise 2% · Lyra 2% · Dante 2% · Felix 3%<\/p>\n<\/div>\n\n<p class='consensus'><strong>🎯 Consensus :<\/strong> Le Conseil converge vers 48% de probabilité cumulée pour statu quo + résolution diplomatique (S1+S2). Le risque de queue (escalade + sabotage + prolongation) totalise 39%. Marché binaire.<\/p>\n\n<div class='dissent'><div class='dissent-label'>🔥 Contre-narratif — Dante 🔥<\/div><div class='dissent-text'>Le consensus ignore le risque de Russian roulette. TurkStream pourrait être saboté demain — 15 bcm/yr perdus, c'est un désastre pour les Balkans. La Hongrie et la Serbie seraient en rationnement avant décembre. Et l'UE ne ferait rien (déjà: pas de sanctions sur Gazprom). Ce scénario S4 à 14% est sous-évalué — devrait être 20%. Le marché price la diplomatie mais pas le sabotage.<\/div><\/div>","sig":"Le Conseil 🌍"},{"t":"strategy","badge":"🗳️ Conseil","title":"Verdict du Conseil — 7 Trades Validés","hook":"22 propositions, 7 retenues. Conviction sur les asymétriques et les calendar spreads. Le triple-choc Hormuz/Russe/Storage favorise la flexibilité.","authorWord":"Marché binaire. Préférence pour les structures asymétriques (call spreads, straddles) et les calendar spreads. Éviter les trades directionnels nucléaires.","author":"Le Conseil 🦊🦉🦎🧮","details":"<h2>Processus de Validation<\/h2>\n\n<p>Le Conseil a examiné <strong>22 propositions de trade<\/strong> issues des 7 cartes du jour. Après délibération, <strong>7 trades ont été validés<\/strong> (32% de taux de succès), <strong>15 éliminés<\/strong> (doublons, contradictions, faible conviction).<\/p>\n\n<h2>Trades Validés (7)<\/h2>\n\n<p><strong>1. Bullish TTF Call Spread €44/€48<\/strong> — <em>Price Action<\/em><br>\nUnanime (4/4). Conviction 4.5/5. Structure asymétrique propre sur TTF, cible €46.50 avec risque défini. Prime modérée (€0.40-0.50).<\/p>\n\n<p><strong>2. Henry Hub Summer Strip Jul/Aug<\/strong> — <em>LNG & Flows<\/em><br>\nMajorité (3/1). Conviction 3.8/5. US exports à record, supporté par la demande été. Dante demande confirmation sur le timing.<\/p>\n\n<p><strong>3. TTF Calendar Spread Jul/Aug<\/strong> — <em>LNG & Flows<\/em><br>\nUnanime (4/4). Conviction 4.2/5. Écartement classique saisonnier. Juillet moins tendu qu'août (refill pression).<\/p>\n\n<p><strong>4. TTF €50/€60 Call Spread (Hormuz)<\/strong> — <em>Géopolitics<\/em><br>\nUnanime (4/4). Conviction 4.8/5. Protection asymétrique sur escaladation Hormuz (P=25%, payout 8-10x). Plus haute conviction du jour.<\/p>\n\n<p><strong>5. Oct/Dec TTF Calendar Spread (Russian LNG ban)<\/strong> — <em>Géopolitics<\/em><br>\nMajorité (3/1). Conviction 4.0/5. Phase 2 ban russe (1er oct) crée tension Q4. Spread devrait s'élargir de €3-4 à €6-8.<\/p>\n\n<p><strong>6. July/Oct TTF Calendar Spread (storage)<\/strong> — <em>Risk Outlook<\/em><br>\nUnanime (4/4). Conviction 4.3/5. Storage fill progress — juillet selling pressure, octobre pre-winter buying. Plus haute conviction calendar.<\/p>\n\n<p><strong>7. TTF €55/€65 Straddle (summer wildcard)<\/strong> — <em>Risk Outlook<\/em><br>\nMajorité (3/1). Conviction 4.6/5. Protection canicule (P=15%, payout 10x). Structure asymétrique pure. Felix suggère surveiller entrée.<\/p>\n\n<h2>Trades Éliminés (15)<\/h2>\n\n<p><strong>8 doublons éliminés :<\/strong> TTF/HH spread (3 versions), JKM-TTF convergence (2 versions), Jul/Sep TTF calendar (2 versions), Oct/Dec TTF calendar variante.<\/p>\n\n<p><strong>4 contradictions éliminées :<\/strong> Short TTF June €42 puts vs Bullish TTF call spread — directions opposées. EUA straddle vs TTF directional — asset class mismatch.<\/p>\n\n<p><strong>3 faible conviction éliminés :<\/strong> Wind-Linked put spread (complexité excessive), UK power/gas convergence (liquidité insuffisante), EUA vol play (hors scope gaz).<\/p>\n\n<h2>Synthèse du Conseil<\/h2>\n\n<p>Dans un environnement de <strong>triple choc<\/strong> (Hormuz + ban russe + cible storage), le Conseil privilégie :<\/p>\n\n<ol>\n<li><strong>Structures asymétriques<\/strong> — Call spreads et straddles captent la queue de risque sans exposition directionnelle nucléaire.<\/li>\n<li><strong>Calendar spreads<\/strong> — Jul/Oct et Oct/Dec capturent la seasonal refill et la tension Q4 russe.<\/li>\n<li><strong>Éviter les directions nues<\/strong> — TTF peut faire ±30% en 2 semaines selon Hormuz. Trop risqué.<\/li>\n<\/ol>\n\n<p><strong>Top 3 par conviction :<\/strong><\/p>\n<ol>\n<li>T4: TTF €50/€60 Call Spread (Hormuz) — 4.8/5<\/li>\n<li>T7: TTF €55/€65 Straddle (summer wildcard) — 4.6/5<\/li>\n<li>T6: July/Oct TTF Calendar Spread — 4.3/5<\/li>\n<\/ol>\n\n<div class='dissent'><div class='dissent-label'>🔥 Contre-narratif — Dante 🔥<\/div><div class='dissent-text'>Le Conseil est trop conservateur. Avec 22 propositions et seulement 7 retenues, on rejette de l'alpha. Les doublons ? Normaux — plusieurs analystes voient la même opportunité. Les contradictions ? C'est ça qu'un marché ! Ma position : ajouter 2-3 trades directionnels prudents (short TTF Jun €42 puts si support tient, long US production rebound play). Le consensus ignore le rally potentiel US si la production rebondit à 112 Bcf/d. Mais bref, suivez le consensus si vous voulez dormir tranquille.<\/div><\/div>","sig":"Le Conseil 🦊🦉🦎🧮"},{"t":"end","end":true,"disclaimer":"⚠️ AVERTISSEMENT — Ce document est un exercice expérimental de veille automatisée produit par intelligence artificielle. Il ne constitue EN AUCUN CAS un conseil en investissement, une recommandation de trading, ni une analyse financière réglementée au sens de la directive MiFID II ou du Code monétaire et financier (art. L541-1). Les « scénarios de marché » présentés sont des hypothèses pédagogiques générées par des modèles de langage — ils ne reflètent pas l'avis d'un professionnel agréé. Les données proviennent de sources publiques, potentiellement retardées ou erronées. Toute décision d'investissement prise sur la base de ce document relève de la seule responsabilité du lecteur. L'auteur n'est pas enregistré comme Conseiller en Investissement Financier (CIF) auprès de l'AMF. Ce contenu est fourni à titre informatif et expérimental uniquement."}];

    const inner=dtShell.querySelector('.dt-reader-inner');
    if(d.home){
      const arts=d.articles?d.articles.map(a=>`<div class="dt-nav-item" style="cursor:pointer;opacity:.7;padding:10px 14px;margin-bottom:4px;border-radius:10px;border:1px solid rgba(255,255,255,.06);" onclick="selectDesktop(${a.idx})"><div class="dt-nav-badge">${a.badge.split(' ')[0]}</div><div class="dt-nav-info"><div class="dt-nav-label">${a.badge.split(' ').slice(1).join(' ')}</div><div class="dt-nav-title">${a.title}</div></div><div class="dt-nav-arrow">›</div></div>`).join(''):'';
      inner.innerHTML=`<div class="dt-r-home-henry"><div class="label">🦊 L'Édito du Jour</div><div class="text">${d.henryWord||''}</div></div>${arts}`;
    } else if(d.end){
      inner.innerHTML=`<div style="text-align:center;padding:60px 0;"><div style="font-size:3.5rem;margin-bottom:16px;">🎉</div><h2 style="font-size:1.6rem;font-weight:800;margin-bottom:12px;">Briefing terminé !</h2><p style="color:var(--muted);font-size:1rem;margin-bottom:24px;line-height:1.5;">Vous avez parcouru le briefing du jour. À demain !</p><a href="../index.html" style="display:inline-block;padding:12px 32px;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;">📰 Toutes les éditions</a></div>`;
    } else {
      const authorHtml=d.authorWord?`<div class="dt-r-author"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author||''}</div></div>`:'';
      inner.innerHTML=`<span class="dt-r-badge ${d.t||''}">${d.badge||''}</span><h1 class="dt-r-title">${d.title||''}</h1>${authorHtml}<div class="dt-r-hook">${d.hook||''}</div><div class="dt-r-body">${d.details||''}</div><div class="dt-r-sig">Gas Morning Brief — 23 Avril 2026</div>`;
    }
    dtShell.querySelector('.dt-reader').scrollTop=0;
    // Scroll sidebar item into view
    items[idx]&&items[idx].scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  function destroyDesktop(){
    if(dtShell){dtShell.remove();dtShell=null;}
  }
  function checkDesktop(){
    if(window.innerWidth>=900){
      deck.style.display='none';
      buildDesktop();
      dtShell.style.display='';
    } else {
      if(dtShell)dtShell.style.display='none';
      deck.style.display='';
      update(false);
    }
  }
  // Keyboard nav for desktop
  document.addEventListener('keydown',e=>{
    if(window.innerWidth<900)return;
    if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();if(dtSelected<DATA.length-1)selectDesktop(dtSelected+1);}
    if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();if(dtSelected>0)selectDesktop(dtSelected-1);}
  });
  checkDesktop();window.addEventListener('resize',checkDesktop);
  // Theme toggle
  (function(){
    const btn=document.getElementById('themeToggle');
    const saved=localStorage.getItem('theme');
    if(saved==='light'){document.documentElement.classList.add('light');btn.textContent='☀️';}
    btn.addEventListener('click',()=>{
      const isLight=document.documentElement.classList.toggle('light');
      btn.textContent=isLight?'☀️':'🌙';
      localStorage.setItem('theme',isLight?'light':'dark');
    });
  })();
  </script>
</body>
</html>
