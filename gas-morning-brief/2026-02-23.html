<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gas Morning Brief — 23 Février 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;

      --green: #10b981;

      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }

    html.light .details p { color: rgba(0,0,0,.75); }

    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }

    html.light .home-henry .text { color: rgba(0,0,0,.85); }

    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    html.light .details div[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }

    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */

      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }

        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */

        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }

      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;

        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }

      .dt-reader .dt-r-body a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }

      .dt-reader .dt-r-body .dissent .dissent-text { font-size: .9rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
      .dt-reader .dt-r-author { margin-top: 20px; padding: 12px 16px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); }
      .dt-reader .dt-r-author .aw-text { font-family: 'Merriweather', serif; font-size: .88rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }

  <script>
  const DATA = [{"t":"home","home":true,"date":"23 Février 2026","henryWord":"TTF holds €31.55 as EU storage scrapes 30.9% — a 10pp YoY deficit and the lowest late-Feb reading since 2022. Record LNG arrivals (14.2 Mt) meet depleted Norwegian hydro, an April 25 Russian LNG ban, and Hormuz drills. EUA crashes 23% on Merz ETS bombshell. The refill math barely works — if it doesn't, Q3 reprices violently.","articles":[{"badge":"⚡ 💰 Price Action","title":"TTF Holds Above €31 as NBP Spikes on Front-Month Squeeze; HH Steady Post-Storm Normalisation","idx":1},{"badge":"⚡ 🚢 LNG & Flows","title":"Record EU LNG Imports as Storage Hits 30% — Golden Pass Nears First Cargo","idx":2},{"badge":"⚡ ⚡ Power & Carbon","title":"EUA Crashes to €69 on Merz ETS Review Bombshell — Spark Spread Compresses as Renewables Outperform","idx":3},{"badge":"📊 🌡️ Weather & Demand","title":"Siberian Squeeze: Depleted Hydro & Storage Rewrite the End-of-Winter Playbook","idx":4},{"badge":"📊 📦 Storage Watch","title":"EU Stocks Scrape 31% — Ten Points Below Last Year as Winter Bites Hard","idx":5},{"badge":"📊 💣 Geopolitics & Regulation","title":"Hormuz Drills, Storage Crisis & EU LNG Ban Countdown","idx":6},{"badge":"📊 🎯 Risk Flags & Outlook","title":"The Refill Equation: 31% Storage + Hormuz + LNG Ban = Asymmetric Upside","idx":7}]},{"t":"alert","badge":"⚡ 💰 Price Action","title":"TTF Holds Above €31 as NBP Spikes on Front-Month Squeeze; HH Steady Post-Storm Normalisation","hook":"TTF front-month opened Monday near €31.55/MWh after mild-weather selling stalled on thin weekend liquidity. Henry Hub consolidates at $3.01 while JKM sags to $10.78 — the Atlantic-Pacific arb is compressing fast.","authorWord":"Europe firm on storage anxiety (35% full vs 43% YoY); US post-Fern calm masks tight late-season balance. NBP front-month jumped 3.7% — watch for squeeze into expiry.","author":"Blaise 🧮","details":"<b>📊 Spot & Settlement Snapshot (last session Fri 20-Feb / Mon 23-Feb open)</b><br><br>• <b>TTF front-month (Mar-26):</b> ~€31.55/MWh (Mon 23-Feb indicative), up ~€1.25/MWh (+4.1%) vs Thu 18-Feb settle of €30.30 — <a href='https://www.worldenergynews.com/news/gas-prices-europe-fall-forecasts-warmer-temperatures-771322' target='_blank'>LSEG/ICE via World Energy News</a>. Live API showing €31.32 — <a href='https://www.oilpriceapi.com/live/dutch-ttf-gas-price' target='_blank'>OilPriceAPI (ICE Endex)</a>.<br>• <b>Henry Hub (Mar-26 futures):</b> $3.01/MMBtu (settle 18-Feb), spot last at $3.25 (9-Feb). Down 59.7% from Fern-spike high of $7.46 on 28-Jan — <a href='https://www.aga.org/research-policy/resource-library/natural-gas-market-indicators-february-19-2026/' target='_blank'>AGA / CME-NYMEX</a>. EIA STEO forecasts 2026 average ~$4.30.<br>• <b>NBP spot (Mon 23-Feb):</b> 80.25p/therm (+0.8% d/d); Mar-26 forward 77.65p (+3.7% d/d, −4.3% w/w) — <a href='https://www.smart-energy.uk/post/daily-energy-market-report' target='_blank'>Smart Energy UK</a>.<br>• <b>JKM (Mar-26):</b> $10.780/MMBtu (settle Thu 20-Feb) — <a href='https://lngprime.com/europe/atlantic-lng-rates-rise-above-30000-per-day/178130/' target='_blank'>LNG Prime / CME</a>. Asian demand soft; Atlantic LNG shipping rates firming above $30k/day.<br><br><b>📐 Technicals & Positioning</b><br>TTF Mar-26 bounced off the €30.00 psychological support (tested 18-Feb) and is now consolidating in a €30.30–32.90 range. Resistance at €33.00 (20-Feb intraday high); a break above opens €35. HH Mar-26 range-bound $2.85–$3.25; the $3.00 level is pivoting. NBP Sum-26 fell 4.1% to 74.91p suggesting forward curve in early contango.<br><br><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎</div><div class='dissent-text'>The €30 TTF floor may not hold. Milder weather forecasts through early March, combined with a wave of US LNG exports (production on track for >120 Bcf/d per EIA), could swamp European demand. JKM weakness at $10.78 signals Asia isn't competing for cargoes — every uncommitted cargo heads to Europe, pressuring TTF below €29.</div></div><br><b>💡 Trade Ideas</b><br>1. <b>TTF Mar/Apr calendar spread — sell the squeeze:</b> With Mar-26 at ~€31.55 and Apr-26 at ~€29.50 (LSEG), the €2.05 backwardation looks rich given warming forecasts. Consider selling the Mar/Apr spread targeting €1.20 contraction into March expiry. Risk: late cold snap.<br>2. <b>HH Mar-26 $3.25 calls — cheap upside for cold tail:</b> With front-month pinned at $3.01 and late-Feb/early-Mar cold still possible, buying Mar $3.25 calls offers asymmetric payoff.<br>3. <b>TTF-JKM relative value — long the spread:</b> TTF at ~$10.95/MMBtu equivalent vs JKM at $10.78 — the spread has collapsed to ~$0.17. Consider going long JKM-TTF targeting $1.50+ rewidening as Asian restocking begins in Q2.<div style=\"margin-top:20px;padding:16px;background:rgba(167,139,250,.08);border-left:3px solid #a78bfa;border-radius:0 10px 10px 0;\"><div style=\"font-size:.7rem;color:#a78bfa;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:10px;\">📊 Conseil de Rédaction — Votes</div><div style=\"margin-bottom:6px;font-size:.82rem;line-height:1.5;\"><b>T1</b>: ✅ [4✅ 0⚠️ 0❌] Iris ✅ Dante ✅ Felix ✅ Lyra ✅</div><div style=\"margin-bottom:6px;font-size:.82rem;line-height:1.5;\"><b>T2</b>: ✅ [3✅ 1⚠️ 0❌] Iris ✅ Dante ⚠️ Felix ✅ Lyra ✅ — <em>Dante: préciser delta et sizing</em></div><div style=\"margin-bottom:6px;font-size:.82rem;line-height:1.5;\"><b>T3</b>: ✅ [2✅ 2⚠️ 0❌] Iris ⚠️ Dante ⚠️ Felix ✅ Lyra ✅ — <em>Amender: ajouter entry level et stop-loss</em></div></div>","sig":"Blaise 🧮 · Gas Morning Brief"},{"t":"alert","badge":"⚡ 🚢 LNG & Flows","title":"Record EU LNG Imports as Storage Hits 30% — Golden Pass Nears First Cargo","hook":"Europe on track for record 14.2Mt LNG imports in Feb as storage scrapes 30%; Golden Pass pulled 300 MMcf/d feed gas on Wed 18 Feb, first export cargo expected March.","authorWord":"Record EU arrivals, 57% from US. Golden Pass pre-commissioning. Baltic ice disrupts Mukran FSRU. Hormuz reopened after Iran drills.","author":"Henry 🦉","details":"<h3>🚢 EU LNG Arrivals</h3><p>Europe is set for a <b>record 14.20 Mt</b> of LNG imports in February, up from 13.67 Mt in January — a <b>22% YoY increase</b> (<a href='https://oilprice.com/Latest-Energy-News/World-News/Europe-Set-for-Another-Record-LNG-Import-Month.html' target='_blank'>OilPrice/Kpler, 23 Feb</a>). US cargoes account for <b>57% (8.05 Mt)</b>. Chinese LNG imports slumped to <b>3.38 Mt</b> — lowest since Apr 2018 — freeing spot cargoes for Europe.</p><p>EU gas storage at <b>~30%</b> vs 5-year avg of 49% for this time of year. Kpler projects March US LNG to Europe rising to <b>11.19 Mt</b>.</p><h3>📊 Spread Snapshot</h3><p><b>TTF:</b> ~€32.90/MWh (~$10.60/MMBtu) as of 20 Feb. <b>HH:</b> Below $3.00 spot on 18 Feb. <b>TTF-HH spread:</b> ~$7.60/MMBtu — transatlantic arb <b>wide open</b>. <b>JKM:</b> ~$10.78 — European pull dominates the spot barrel.</p><h3>🇺🇸 US LNG Terminals</h3><p><b>Golden Pass:</b> Pulled <b>300 MMcf/d</b> feed gas on 18 Feb as commissioning accelerates. First cargo expected March (<a href='https://www.reuters.com/business/energy/golden-pass-moves-closer-producing-first-lng-with-increased-natural-gas-flows-2026-02-18/' target='_blank'>Reuters, 18 Feb</a>).<br><b>Plaquemines:</b> Ramping — part of 18 Bcf/d new Gulf Coast capacity (<a href='https://www.naturalgasintel.com/news/natural-gas-pipeline-buildout-accelerates-as-18-bcfd-lng-wave-advances/' target='_blank'>NGI, 20 Feb</a>).</p><h3>🔧 Outages</h3><p><b>Mukran FSRU:</b> Heavy Baltic ice disrupting operations. Germany's icebreaker <i>Neuwerk</i> engine failure on 12 Feb (<a href='https://maritime-executive.com/article/german-icebreaker-malfunctions-impacting-lng-imports' target='_blank'>Maritime Executive, 16 Feb</a>). Sendout constrained.</p><h3>🌊 Hormuz</h3><p>Iran closed Strait <b>briefly on 17 Feb</b> for IRGC drills. Reopened same day (<a href='https://www.reuters.com/world/middle-east/iran-shut-hormuz-strait-few-hours-tuesday-iranian-media-confirms-2026-02-17/' target='_blank'>Reuters</a>). Second drill in weeks — risk premium lingers.</p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎</div><div class='dissent-text'>Record arrivals mask a fragile equilibrium. Storage at 30% entering shoulder season is dangerously low — if one Norwegian field trips or a second Hormuz closure lasts 48h+, TTF spikes €45+ within days. Golden Pass first-cargo optimism is premature — Sabine Pass took months from feed gas to reliable loadings.</div></div><h3>💡 Trade Ideas</h3><ul><li><b>Long TTF Q3-26 vs Short TTF Cal-27:</b> Refill panic front-loads summer buying. Buy Jul-26, sell Cal-27 at ~€2 backwardation — target €5+ widening.</li><li><b>Long TTF-HH spread (Apr-26):</b> At $7.60 the arb is wide but with Golden Pass not yet exporting and storage critically low, target $9/MMBtu.</li><li><b>Buy TTF €40 call (May-26):</b> Tail-risk hedge for Hormuz or Norwegian outage. Premium ~€1.50/MWh, asymmetric payoff.</li></ul><div style=\"margin-top:20px;padding:16px;background:rgba(167,139,250,.08);border-left:3px solid #a78bfa;border-radius:0 10px 10px 0;\"><div style=\"font-size:.7rem;color:#a78bfa;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:10px;\">📊 Conseil de Rédaction — Votes</div><div style=\"margin-bottom:6px;font-size:.82rem;line-height:1.5;\"><b>T4</b>: ✅ [4✅ 0⚠️ 0❌] Iris ✅ Dante ✅ Felix ✅ Lyra ✅</div><div style=\"margin-bottom:6px;font-size:.82rem;line-height:1.5;\"><b>T5</b>: ✅ [2✅ 1⚠️ 1❌] Iris ✅ Dante ❌ Felix ⚠️ Lyra ✅ — <em>Doublon T24 — gardé ici, retiré de Card 7</em></div><div style=\"margin-bottom:6px;font-size:.82rem;line-height:1.5;\"><b>T6</b>: ❌ [1✅ 2⚠️ 1❌] Iris ✅ Dante ❌ Felix ⚠️ Lyra ⚠️ — <em>❌ Doublon T19/T23 — consolidé dans Card 7</em></div></div>","sig":"Henry 🦉 · Gas Morning Brief"},{"t":"tech","badge":"⚡ ⚡ Power & Carbon","title":"EUA Crashes to €69 on Merz ETS Review Bombshell — Spark Spread Compresses as Renewables Outperform","hook":"Carbon prices collapsed 23% in February from €90 to €69/t after Germany's Merz floated ETS 'revision or postponement'. German power prices flat YTD as strong renewables offset gas tightness.","authorWord":"Carbon is the wildcard nobody's watching — a 23% crash in 3 weeks rewrites coal-gas switching economics and refill incentives.","author":"Sage 🦎","details":"<h3>🏭 EUA Carbon — February Collapse</h3><p>EUA Dec-26 contract plunged from <b>€90/t in early January</b> to <b>€69.2/t on 16 Feb</b> — a <b>23% decline</b> (<a href='https://gmk.center/en/news/carbon-prices-in-europe-fall-in-february-amid-calls-for-ets-review/' target='_blank'>GMK Center / ICE, 18 Feb 2026</a>). The trigger: German Chancellor <b>Friedrich Merz announced on 11 Feb</b> at an Antwerp industrial forum that the EU ETS could be \"revised or postponed\", sparking a wave of long-position liquidation by investment funds. EUA dropped from €78 to €72.5 in a single session, then to €70.7 by week-end.</p><p>Merz later partially walked back the comments after an EU leaders' meeting in Belgium, but <b>uncertainty persists</b>. Carbon Pulse reported that market participants see no clarity on either short-term or long-term ETS prospects. The Feb 9 reading was <b>€81.35</b> (<a href='https://tradingeconomics.com/commodity/carbon' target='_blank'>Trading Economics</a>), suggesting a partial bounce before renewed selling.</p><h3>⚡ Power & Spark Spread</h3><p>German baseload power is down <b>€1.47/MWh (−1.5%) YTD</b> (<a href='https://tradingeconomics.com/germany/electricity-price' target='_blank'>Trading Economics, 23 Feb</a>). The <b>clean spark spread</b> (gas-to-power margin adjusted for carbon) has compressed significantly: with EUA down 23% and TTF relatively stable at ~€32, the carbon component of power generation cost has shrunk — making gas plants more competitive vs coal, but overall power prices softer due to strong renewable output.</p><p>Wind generation across Germany has been <b>recovering from the Siberian high-pressure block</b> that suppressed output in early-mid Feb. Solar is ramping seasonally. The combination keeps day-ahead power prices under pressure despite tight gas fundamentals.</p><h3>🔑 Cross-Commodity Implications</h3><p>The EUA collapse has knock-on effects:<br>• <b>Coal-gas switching threshold drops</b>: lower carbon cost makes coal more competitive, potentially reducing gas-for-power demand<br>• <b>Refill incentive impact</b>: if power prices fall, gas demand for generation eases, slightly alleviating the storage refill pressure<br>• <b>Political risk premium</b>: Merz's comments introduced a new source of uncertainty — will the EU actually weaken the ETS?</p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉</div><div class='dissent-text'>Merz's ETS comments are political theatre ahead of German coalition talks — the EU Commission won't dismantle the ETS, it's the crown jewel of climate policy. The €69 level is a buying opportunity: MSR (Market Stability Reserve) continues to absorb surplus allowances, and the 2027 ETS2 extension is structurally bullish. The Feb selloff was positioning-driven, not fundamental. Carbon bounces to €80+ by Q2 once the political noise clears.</div></div><h3>💡 Trade Ideas</h3><ul><li><b>Long EUA Dec-26 at €70-72:</b> If Merz walk-back holds, the MSR absorption continues to tighten supply. Target €85 by Q2. Stop below €65. The 23% discount from Jan highs offers compelling entry.</li><li><b>Short clean dark spread Q2-26:</b> Lower carbon makes coal more competitive, compressing the dark spread (coal-to-power margin). If EUA stays below €75, coal generation increases at the expense of gas — short the dark spread to capture this shift.</li><li><b>Long TTF Q2-26 puts as EUA hedge:</b> If carbon stays weak → lower gas-for-power demand → TTF downside risk in Q2. Buy TTF Q2 puts at €29-30 as a cross-commodity play on the EUA weakness feed-through.</li></ul><div style=\"margin-top:20px;padding:16px;background:rgba(167,139,250,.08);border-left:3px solid #a78bfa;border-radius:0 10px 10px 0;\"><div style=\"font-size:.7rem;color:#a78bfa;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:10px;\">📊 Conseil de Rédaction — Votes</div><div style=\"margin-bottom:6px;font-size:.82rem;line-height:1.5;\"><b>T7</b>: ✅ [4✅ 0⚠️ 0❌] Iris ✅ Dante ✅ Felix ✅ Lyra ✅</div><div style=\"margin-bottom:6px;font-size:.82rem;line-height:1.5;\"><b>T8</b>: ✅ [2✅ 2⚠️ 0❌] Iris ⚠️ Dante ⚠️ Felix ✅ Lyra ✅ — <em>Amender: préciser marché et tenor</em></div><div style=\"margin-bottom:6px;font-size:.82rem;line-height:1.5;\"><b>T9</b>: ✅ [1✅ 3⚠️ 0❌] Iris ✅ Dante ⚠️ Felix ⚠️ Lyra ⚠️ — <em>⚠️ Contradiction avec T12 — recadrer comme hedge explicite</em></div></div>","sig":"Sage 🦎 · Gas Morning Brief"},{"t":"analysis","badge":"📊 🌡️ Weather & Demand","title":"Siberian Squeeze: Depleted Hydro & Storage Rewrite the End-of-Winter Playbook","hook":"Norwegian reservoirs 18 TWh below normal and EU gas storage at 31% are compounding a historically tight end-of-heating-season balance. La Niña fade leaves Week 2-4 outlook ambiguous — but the damage is already done.","authorWord":"Hydro deficit + storage drawdown = structural repricing of summer refill risk. The market hasn't fully priced the tail.","author":"Sage 🦎","details":"<h3>🌡️ Week 2-4 Temperature Outlook</h3><p><a href='https://www.cpc.ncep.noaa.gov/products/predictions/WK34/' target='_blank'>NOAA CPC (20 Feb)</a>: La Niña transitioning to ENSO-neutral (60% probability by Apr). For Europe: <b>reduced blocking probability</b> in Mar 7-20 window, gradual return toward seasonal norms after the extreme Siberian high that dominated Feb.</p><h3>📈 HDD Trajectory</h3><p>The Siberian event pushed cumulative HDDs significantly above the 5yr mean. EU storage fell to <b>32.5%</b> on 18 Feb (<a href='https://eu.news-pravda.com/world/2026/02/20/169523.html' target='_blank'>GIE/AGSI+</a>) — <b>25pp below last year</b>. Net withdrawals averaged 1.2-1.7 TWh/day during the cold snap (<a href='https://brusselssignal.eu/2026/02/dangerously-low-germanys-gas-storage-has-fallen-to-record-lows/' target='_blank'>Brussels Signal, 16 Feb</a>).</p><h3>💧 Norway Hydro: Alarm Bells</h3><p>Norwegian reservoirs <b>~18 TWh below normal</b> (<a href='https://www.nve.no/energi/analyser-og-statistikk/magasinstatistikk/' target='_blank'>NVE, 11 Feb</a>). Low snowpack compounds — spring melt may underperform. Analyst Tor Reier Lilleholt: conditions <b>drier than 2010/2011 crisis</b>. This supports Nordic power prices and increases gas-for-power demand via interconnectors.</p><h3>💨 Wind: Feb Underperformance</h3><p>Siberian high suppressed North Sea/Baltic wind capacity well below typical Feb (30-35% onshore). Zonal flow return in March should improve but Feb deficit already forced additional gas burn.</p><h3>💡 Trade Ideas</h3><ul><li><b>Long W26-27 vs short Summer 26 TTF:</b> Weak hydro keeps gas-for-power demand elevated through summer. Target €3-5 widening.</li><li><b>Long Q2 Nordic power vs short Q2 German power:</b> Norway hydro deficit structural; German wind recovery eases continental prices.</li><li><b>TTF Apr-26 calls (€35-38 strike):</b> Cheap optionality on late cold snap. Storage at these levels = any extended March heating demand pushes TTF to stress territory.</li><li><b>Long Summer 26 EUA:</b> If gas-for-power runs hot due to hydro deficit, carbon intensity rises.</li></ul><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮</div><div class='dissent-text'>Over-extrapolating a single Siberian event. La Niña decay correlates with milder European springs (2017, 2021 analogs). If March delivers +1-2°C anomalies, heating demand collapses, wind recovers, and the storage gap narrows faster than consensus expects. Norwegian snowpack is low but not catastrophic. EU LNG import capacity is ~200 bcm/yr — the refill toolkit is vastly larger than 2022.</div></div><div style=\"margin-top:20px;padding:16px;background:rgba(167,139,250,.08);border-left:3px solid #a78bfa;border-radius:0 10px 10px 0;\"><div style=\"font-size:.7rem;color:#a78bfa;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:10px;\">📊 Conseil de Rédaction — Votes</div><div style=\"margin-bottom:6px;font-size:.82rem;line-height:1.5;\"><b>T10</b>: ✅ [4✅ 0⚠️ 0❌] Iris ✅ Dante ✅ Felix ✅ Lyra ✅</div><div style=\"margin-bottom:6px;font-size:.82rem;line-height:1.5;\"><b>T11</b>: ✅ [2✅ 2⚠️ 0❌] Iris ⚠️ Dante ⚠️ Felix ✅ Lyra ✅ — <em>Amender: ajouter entry level</em></div><div style=\"margin-bottom:6px;font-size:.82rem;line-height:1.5;\"><b>T12</b>: ❌ [0✅ 3⚠️ 1❌] Iris ⚠️ Dante ❌ Felix ⚠️ Lyra ⚠️ — <em>❌ Doublon cluster €40 calls + contradiction Q2</em></div><div style=\"margin-bottom:6px;font-size:.82rem;line-height:1.5;\"><b>T13</b>: ❌ [0✅ 1⚠️ 3❌] Iris ❌ Dante ❌ Felix ❌ Lyra ⚠️ — <em>❌ Rejeté 3/4 — doublon T7, aucun paramètre</em></div></div>","sig":"Sage 🦎 · Gas Morning Brief"},{"t":"tech","badge":"📊 📦 Storage Watch","title":"EU Stocks Scrape 31% — Ten Points Below Last Year as Winter Bites Hard","hook":"EU storage at 30.9% is the lowest late-February reading since 2022, a full 10pp below last year. US stocks at 2,070 Bcf sit 123 Bcf under the 5-year average with weeks of withdrawal season remaining.","authorWord":"Storage buffers eroding fast on both sides of the Atlantic — the refill race to 90% by November starts from a deep hole this year.","author":"Blaise 🧮","details":"<h3>🇪🇺 EU Storage — AGSI+ (Gas Day: 21 Feb 2026)</h3><p><b>EU Aggregate:</b> <b>30.88%</b> full — 352.8 TWh of 1,142.6 TWh (~35.3 bcm of ~114.3 bcm)<br>🇩🇪 Germany: <b>20.53%</b> — 51.5 TWh<br>🇫🇷 France: <b>21.14%</b> — 26.6 TWh<br>🇳🇱 Netherlands: <b>11.85%</b> — 17.1 TWh<br>🇦🇹 Austria: <b>37.22%</b> — 37.5 TWh<br>Daily net withdrawal: 2,362.6 GWh/d | Days of supply: ~149</p><p>Source: <a href='https://agsi.gie.eu/' target='_blank'>GIE AGSI+</a>, gas day 21 Feb 2026.</p><h3>🇺🇸 US Storage — EIA (Week ending 13 Feb 2026)</h3><p>Working gas: <b>2,070 Bcf</b> | Weekly change: -144 Bcf | vs Year-ago: <b>-59 Bcf</b> | vs 5-year avg: <b>-123 Bcf</b></p><p>Source: <a href='https://www.eia.gov/naturalgas/storage/' target='_blank'>EIA Weekly Natural Gas Storage Report</a>, released 19 Feb 2026.</p><h3>📉 Trajectory & YoY</h3><p><b>EU:</b> 30.88% vs 40.95% same date last year — a stark <b>10.1pp deficit</b>. Netherlands at 11.85% particularly exposed. From here, the EU needs to inject ~59pp (~67.5 bcm) over 7 months (Apr–Oct) to reach 90% by Nov 1. The 5yr avg injection adds ~55-62pp — <b>almost zero margin for error</b>.</p><h3>💡 Trade Ideas</h3><ul><li><b>TTF Q3-26 calls (strike €30-32):</b> Injection-season demand could spike TTF if LNG gets diverted to Asia. Jul-Sep calls look undervalued given the 10pp starting deficit.</li><li><b>TTF Summer/Winter spread (Q3-26 vs Q1-27):</b> Refill panic front-loads summer buying. Buy Q3 / sell Q1-27 — target €5+ widening from current ~€2 backwardation.</li><li><b>HH Mar/Apr spread:</b> US -123 Bcf deficit supports near-term backwardation. The spread could widen if late-season cold persists.</li><li><b>TTF Oct-26 straddles:</b> Storage optionality — if EU reaches ~85% by Oct, winter spreads collapse; if it stalls at 80%, they explode.</li></ul><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉</div><div class='dissent-text'>The 10pp YoY deficit looks alarming but last year's 41% was the highest late-Feb reading in years — a tough comp. The 5yr avg for this date is ~34%, putting us only 3pp below normal. EU demand destruction is structural: industrial gas -15-20% below pre-2022. LNG import capacity expanded by 40 bcm since 2022. The refill math works even with a lazy injection season — panic is premature.</div></div><div style=\"margin-top:20px;padding:16px;background:rgba(167,139,250,.08);border-left:3px solid #a78bfa;border-radius:0 10px 10px 0;\"><div style=\"font-size:.7rem;color:#a78bfa;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:10px;\">📊 Conseil de Rédaction — Votes</div><div style=\"margin-bottom:6px;font-size:.82rem;line-height:1.5;\"><b>T14</b>: ❌ [1✅ 2⚠️ 1❌] Iris ✅ Dante ❌ Felix ⚠️ Lyra ⚠️ — <em>❌ Doublon T22 — consolidé dans Card 7</em></div><div style=\"margin-bottom:6px;font-size:.82rem;line-height:1.5;\"><b>T15</b>: ✅ [4✅ 0⚠️ 0❌] Iris ✅ Dante ✅ Felix ✅ Lyra ✅</div><div style=\"margin-bottom:6px;font-size:.82rem;line-height:1.5;\"><b>T16</b>: ❌ [0✅ 1⚠️ 3❌] Iris ❌ Dante ⚠️ Felix ❌ Lyra ❌ — <em>❌ Rejeté 3/4 — aucune direction, cible ou rationale</em></div><div style=\"margin-bottom:6px;font-size:.82rem;line-height:1.5;\"><b>T17</b>: ✅ [3✅ 1⚠️ 0❌] Iris ⚠️ Dante ✅ Felix ✅ Lyra ✅</div></div>","sig":"Blaise 🧮 · Gas Morning Brief"},{"t":"alert","badge":"📊 💣 Geopolitics & Regulation","title":"Hormuz Drills, Storage Crisis & EU LNG Ban Countdown","hook":"Iran's live-fire Hormuz drills and US-Iran nuclear brinkmanship keep the geopolitical risk premium alive. EU storage at record-low 31% with the Russian LNG ban clock ticking toward April 25.","authorWord":"Hormuz drills, storage at historic lows, EU LNG ban April 25 — structural tightness meets geopolitical vol.","author":"Henry 🦉","details":"<h3>🇷🇺🇺🇦 Russia–Ukraine: Transit Dead, TurkStream Sole Conduit</h3><p>Ukrainian gas transit <b>ceased 1 January 2025</b> after Kyiv refused to extend the deal (<a href='https://oilprice.com/Latest-Energy-News/World-News/Russia-Raises-Pipeline-Gas-Supply-to-Europe-via-TurkStream.html' target='_blank'>OilPrice, Feb 2026</a>). <b>TurkStream remains the only Russian pipeline route</b> into Europe. Oil transit via Druzhba briefly disrupted by Russian strike on 12 Feb (<a href='https://www.reuters.com/business/energy/russian-oil-transit-via-druzhba-pipeline-suspended-ukraine-foreign-ministry-says-2026-02-12/' target='_blank'>Reuters, 12 Feb</a>).</p><h3>🇮🇷 Strait of Hormuz: Brinkmanship Escalates</h3><p>Iran conducted <b>live-fire military drills 16-17 Feb</b> including missile launches, just before Geneva nuclear talks (<a href='https://www.nytimes.com/2026/02/16/world/middleeast/iran-strait-hormuz-exercise-talks-geneva-trump.html' target='_blank'>NYT, 16 Feb</a>; <a href='https://www.foxnews.com/world/iran-fires-live-missiles-strait-hormuz-trump-envoys-arrive-nuclear-talks' target='_blank'>Fox News, 17 Feb</a>). Strait <b>briefly closed 17-18 Feb</b> (<a href='https://www.dailymail.co.uk/news/article-15569989/Iran-shuts-Strait-Hormuz-military-drill-warning-world-damage-global-economy-Trump-orders-attack.html' target='_blank'>Daily Mail, 18 Feb</a>). Trump declared 'massive Armada heading to Iran'; US military build-up in Arabian Sea continues (<a href='https://www.cnbc.com/2026/02/19/trump-us-iran-nuclear-talks-oil-prices-russia.html' target='_blank'>CNBC, 19 Feb</a>). <b>Risk: sustained disruption removes ~20% of global LNG trade.</b></p><h3>🇳🇴 Norway Maintenance</h3><p>Equinor summer turnaround (May-Sep) typically removes 10-20 mcm/d at peak. No formal 2026 schedule yet — watch for Gassco announcements in March/April.</p><h3>🚫 EU Russian LNG Ban</h3><p>EU gave <b>final approval 26 Jan 2026</b>: LNG imports under short-term contracts <b>banned from 25 April 2026</b>, pipeline gas from 17 June, full ban by end-2027. This removes ~15-18 bcm/yr of Russian LNG supply to Europe during the critical refill season — adding urgency to secure alternative cargoes.</p><h3>🎯 Storage Mandate</h3><p>EU 90% by Nov 1 mandate with storage at 31% = need to inject ~60 bcm Apr-Oct. An <b>unprecedented refill rate</b> required. If the Russian LNG ban kicks in simultaneously, available supply contracts sharply.</p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮</div><div class='dissent-text'>The geopolitical fear premium is overcooked. Iran closed Hormuz for hours — not days. The drills are domestic theatre for hardliners, not a prelude to sustained blockade. Trump's 'Armada' rhetoric is negotiating leverage for Geneva, not a war signal. The EU LNG ban has exemptions for long-term contracts and a force majeure clause. Russian LNG replacement is manageable with record US exports. The real risk is overhedging geopolitics and missing the bearish LNG supply wave.</div></div><h3>💡 Trade Ideas</h3><ul><li><b>Long TTF Q2-26 straddle (€31 ATM):</b> Geopolitical binary — Hormuz escalation sends TTF €40+, full de-escalation drops to €27. Vol is cheap relative to event density. 60-day expiry captures the April LNG ban catalyst.</li><li><b>Long TTF May-26 €40 calls:</b> Tail-risk hedge for Hormuz closure during refill season. Premium ~€1-1.50/MWh — if strait closes 48h+ during April injection start, these go deep ITM.</li><li><b>Short Russian LNG exposure — long TTF Apr-May spread:</b> If the April 25 ban bites, May will trade at a premium to April as the market reprices post-ban tightness. Sell Apr / buy May targeting €1.50 contango widening.</li><li><b>Long Brent crude / short TTF ratio:</b> If Hormuz escalates, crude spikes harder than gas (oil more exposed to strait). This ratio trade captures the differentiated impact. Target 2.5x from current ~2.1x.</li></ul><div style=\"margin-top:20px;padding:16px;background:rgba(167,139,250,.08);border-left:3px solid #a78bfa;border-radius:0 10px 10px 0;\"><div style=\"font-size:.7rem;color:#a78bfa;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:10px;\">📊 Conseil de Rédaction — Votes</div><div style=\"margin-bottom:6px;font-size:.82rem;line-height:1.5;\"><b>T18</b>: ✅ [4✅ 0⚠️ 0❌] Iris ✅ Dante ✅ Felix ✅ Lyra ✅</div><div style=\"margin-bottom:6px;font-size:.82rem;line-height:1.5;\"><b>T19</b>: ❌ [1✅ 0⚠️ 3❌] Iris ✅ Dante ❌ Felix ❌ Lyra ❌ — <em>❌ Doublon T6/T23 — 3ème occurrence éliminée</em></div><div style=\"margin-bottom:6px;font-size:.82rem;line-height:1.5;\"><b>T20</b>: ✅ [3✅ 1⚠️ 0❌] Iris ⚠️ Dante ✅ Felix ✅ Lyra ✅</div><div style=\"margin-bottom:6px;font-size:.82rem;line-height:1.5;\"><b>T21</b>: ✅ [1✅ 3⚠️ 0❌] Iris ⚠️ D   function dots(active) { let s=''; for(let i=0;i<total;i++) s+=`<span class="dot${i===active?' on':''}"></span>`; return s; }
  const cards = deck.querySelectorAll('.card');
  function update(anim=true) {
    cards.forEach((c,i)=>{
      c.classList.toggle('anim',anim);
      c.classList.remove('prev','active','next','behind'); c.style.opacity='';
      if(i===cur)c.classList.add('active'); else if(i===cur+1||i===cur-1)c.classList.add('behind'); else if(i<cur)c.classList.add('prev'); else c.classList.add('next');
      c.style.transform='';
      c.querySelectorAll('.dot').forEach((d,j)=>d.classList.toggle('on',j===cur));
    });
  }
  function go(i){if(i>=0&&i<total){cur=i;update();}}
  const dateKey="Gas Morning Brief-23-Février-2026";
  if(!localStorage.getItem(dateKey)){setTimeout(()=>{hint.classList.add('hide');localStorage.setItem(dateKey,'1');},2000);}else hint.style.display='none';
  
  document.querySelectorAll('.scroll-zone, .home-content').forEach(function(sz){
    var card = sz.closest('.card');
    if(!card) return;
    sz.addEventListener('scroll', function(){
      card.classList.toggle('scrolled', sz.scrollTop > 10);
    }, {passive:true});
  });
  let startY=0,axis='';
  document.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY;startTime=Date.now();deltaX=0;axis='';dragging=true;cards[cur].classList.remove('anim');},{passive:true});
  document.addEventListener('touchmove',e=>{if(!dragging)return;const dx=e.touches[0].clientX-startX;const dy=e.touches[0].clientY-startY;if(!axis){if(Math.abs(dx)>8||Math.abs(dy)>8){axis=Math.abs(dx)>Math.abs(dy)?'x':'y';}else return;}if(axis==='y')return;deltaX=dx;cards[cur].style.transform=`translate(-50%,-50%) translateX(${deltaX}px) rotate(${deltaX*0.012}deg)`;var p=Math.min(Math.abs(deltaX)/200,1);var sc=0.93+p*0.07;var op=0.4+p*0.6;var nxt=deltaX<0?cards[cur+1]:cards[cur-1];if(nxt){nxt.style.transform='translate(-50%,-50%) scale('+sc+')';nxt.style.opacity=op;}},{passive:true});
  document.addEventListener('touchend',e=>{if(!dragging)return;dragging=false;if(axis==='y'){axis='';return;}axis='';const card=cards[cur];card.classList.add('anim');if(cards[cur+1])cards[cur+1].classList.add('anim');if(cards[cur-1])cards[cur-1].classList.add('anim');const velocity=Math.abs(deltaX)/(Date.now()-startTime);const threshold=velocity>0.5?30:60;if(deltaX>threshold&&cur===0){window.location.href='../index.html';}else if(deltaX<-threshold&&cur===total-1){window.location.href='../index.html';}else if(deltaX<-threshold&&cur<total-1){cur++;update();}else if(deltaX>threshold&&cur>0){cur--;update();}else{card.style.transform='';}},{passive:true});
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&cur<total-1){cur++;update();}if(e.key==='ArrowLeft'&&cur>0){cur--;update();}});
  document.addEventListener('click',e=>{if(e.target.id==='restart')go(0);const article=e.target.closest('.home-article');if(article){const idx=parseInt(article.dataset.goto);if(!isNaN(idx))go(idx);}});
  /* === DESKTOP SPLIT-VIEW === */
  let dtShell=null, dtSelected=0;
  function buildDesktop(){
    if(dtShell)return;
    dtShell=document.createElement('div');
    dtShell.className='desktop-shell';
    // Sidebar
    const sb=document.createElement('nav');
    sb.className='dt-sidebar';
    const logoDate=DATA[0]&&DATA[0].home?`<div class="dt-logo">Gas Morning Brief</div><div class="dt-date">${DATA[0].date||'23 Février 2026'}</div>`:`<div class="dt-logo">Gas Morning Brief</div><div class="dt-date">23 Février 2026</div>`;
    sb.innerHTML=logoDate;
    DATA.forEach((d,i)=>{
      const item=document.createElement('div');
      item.className='dt-nav-item'+(i===0?' dt-selected':'');
      item.tabIndex=0;
      item.dataset.idx=i;
      const emoji=d.home?'📰':d.end?'✅':(d.badge||'').split(' ')[0]||'📄';
      const label=d.home?'Accueil':d.end?'Fin':(d.badge||'').split(' ').slice(1).join(' ')||'';
      const title=d.home?'Sommaire':d.end?'Briefing terminé':d.title||'';
      item.innerHTML=`<div class="dt-nav-badge">${emoji}</div><div class="dt-nav-info"><div class="dt-nav-label">${label}</div><div class="dt-nav-title">${title}</div></div><div class="dt-nav-arrow">›</div>`;
      item.addEventListener('click',()=>selectDesktop(i));
      sb.appendChild(item);
    });
    // Reader
    const rd=document.createElement('div');
    rd.className='dt-reader';
    rd.innerHTML='<div class="dt-reader-inner"></div>';
    dtShell.appendChild(sb);
    dtShell.appendChild(rd);
    document.body.appendChild(dtShell);
    selectDesktop(0);
  }
  function selectDesktop(idx){
    dtSelected=idx;
    const items=dtShell.querySelectorAll('.dt-nav-item');
    items.forEach((it,i)=>it.classList.toggle('dt-selected',i===idx));
    const d=DATA[idx];
    const inner=dtShell.querySelector('.dt-reader-inner');
    if(d.home){
      const arts=d.articles?d.articles.map(a=>`<div class="dt-nav-item" style="cursor:pointer;opacity:.7;padding:10px 14px;margin-bottom:4px;border-radius:10px;border:1px solid rgba(255,255,255,.06);" onclick="selectDesktop(${a.idx})"><div class="dt-nav-badge">${a.badge.split(' ')[0]}</div><div class="dt-nav-info"><div class="dt-nav-label">${a.badge.split(' ').slice(1).join(' ')}</div><div class="dt-nav-title">${a.title}</div></div><div class="dt-nav-arrow">›</div></div>`).join(''):'';
      inner.innerHTML=`<div class="dt-r-home-henry"><div class="label">🦊 L'Édito du Jour</div><div class="text">${d.henryWord||''}</div></div>${arts}`;
    } else if(d.end){
      inner.innerHTML=`<div style="text-align:center;padding:60px 0;"><div style="font-size:3.5rem;margin-bottom:16px;">🎉</div><h2 style="font-size:1.6rem;font-weight:800;margin-bottom:12px;">Briefing terminé !</h2><p style="color:var(--muted);font-size:1rem;margin-bottom:24px;line-height:1.5;">Vous avez parcouru le briefing du jour. À demain !</p><a href="../index.html" style="display:inline-block;padding:12px 32px;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;">📰 Toutes les éditions</a></div>`;
    } else {
      const authorHtml=d.authorWord?`<div class="dt-r-author"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author||''}</div></div>`:'';
      inner.innerHTML=`<span class="dt-r-badge ${d.t||''}">${d.badge||''}</span><h1 class="dt-r-title">${d.title||''}</h1>${authorHtml}<div class="dt-r-hook">${d.hook||''}</div><div class="dt-r-body">${d.details||''}</div><div class="dt-r-sig">Gas Morning Brief — 23 Février 2026</div>`;
    }
    dtShell.querySelector('.dt-reader').scrollTop=0;
    // Scroll sidebar item into view
    items[idx]&&items[idx].scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  function destroyDesktop(){
    if(dtShell){dtShell.remove();dtShell=null;}
  }
  function checkDesktop(){
    if(window.innerWidth>=900){
      deck.style.display='none';
      buildDesktop();
      dtShell.style.display='';
    } else {
      if(dtShell)dtShell.style.display='none';
      deck.style.display='';
      update(false);
    }
  }
  // Keyboard nav for desktop
  document.addEventListener('keydown',e=>{
    if(window.innerWidth<900)return;
    if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();if(dtSelected<DATA.length-1)selectDesktop(dtSelected+1);}
    if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();if(dtSelected>0)selectDesktop(dtSelected-1);}
  });
  checkDesktop();window.addEventListener('resize',checkDesktop);
  // Theme toggle
  (function(){
    const btn=document.getElementById('themeToggle');
    const saved=localStorage.getItem('theme');
    if(saved==='light'){document.documentElement.classList.add('light');btn.textContent='☀️';}
    btn.addEventListener('click',()=>{
      const isLight=document.documentElement.classList.toggle('light');
      btn.textContent=isLight?'☀️':'🌙';
      localStorage.setItem('theme',isLight?'light':'dark');
    });
  })();
  </script>
</body>
</html>
