<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gas Morning Brief — 23 Février 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;

      --green: #10b981;

      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }

    html.light .details p { color: rgba(0,0,0,.75); }

    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }

    html.light .home-henry .text { color: rgba(0,0,0,.85); }

    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    html.light .details div[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }

    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */

      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }

        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */

        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }

      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;

        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }

      .dt-reader .dt-r-body a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }

      .dt-reader .dt-r-body .dissent .dissent-text { font-size: .9rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
      .dt-reader .dt-r-author { margin-top: 20px; padding: 12px 16px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); }
      .dt-reader .dt-r-author .aw-text { font-family: 'Merriweather', serif; font-size: .88rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }

  <script>
  const DATA = [{"t":"home","home":true,"date":"23 Février 2026","henryWord":"REFILL OR DIE — TTF 31.69€, stocks 31% (record), backwardation anormale. 19 trades proposés, validés par un conseil de 4 : 12 validés, 3 amendés, 3 rejetés. Le Q3-26 est le champ de bataille.","articles":[{"badge":"⚡ 💰 Price Action","title":"Prix & Courbe","idx":1},{"badge":"⚡ 🚢 LNG & Flows","title":"LNG & Flux : Hormuz, vague US et bras de fer asiatique","idx":2},{"badge":"⚡ ⚡ Power & Carbon","title":"Power & Cross-Commodity","idx":3},{"badge":"📊 🌡️ Weather & Demand","title":"Météo & Demande","idx":4},{"badge":"📊 📦 Storage Watch","title":"Storage Watch","idx":5},{"badge":"📊 💣 Geopolitics & Regulation","title":"Geopolitics & Regulation","idx":6},{"badge":"📊 🎯 Risk Flags & Outlook","title":"Risk Flags, Outlook & Trade Ideas — Validées par le Conseil","idx":7}]},{"title":"Prix & Courbe","hook":"TTF à 31.69 € — la backwardation Summer/Winter défie la logique de stockage","details":"<p><strong>TTF Mar-26 : 31.69 €/MWh<\/strong> — en recul de 15% sur le mois, −33% sur un an. Le range de janvier (27.54–40.04) s'est resserré, mais c'est la <strong>structure de la courbe<\/strong> qui mérite toute l'attention.<\/p><p>🔴 <strong>Signal d'alerte : backwardation Summer > Winter.<\/strong> L'été se traite <em>au-dessus<\/em> de l'hiver — une anomalie qui tue l'incitation économique au stockage. Tant que cette structure persiste, aucun opérateur rationnel n'injecte. Pour que le refill démarre, il faut un retour en <strong>contango<\/strong> (Winter > Summer).<\/p><p>📊 <strong>Niveaux clés :<\/strong> Support à <strong>29.50<\/strong> (creux de janvier), résistance à <strong>35<\/strong> (MM20). Consensus Trading Economics : ~32.09 fin Q1, ~37.04 à 12 mois.<\/p><hr/><p>💡 <strong>Idées de trades :<\/strong><\/p><ul><li><strong>Normalisation de courbe :<\/strong> Short Summer26 / Long Winter26-27 — pari sur le retour en contango quand le marché repricera le besoin de remplissage<\/li><li><strong>Scénario panique stockage :<\/strong> Position inverse (long le spread) si vous anticipez une backwardation durable — signal de stress<\/li><li><strong>Range outright :<\/strong> Straddle ATM 32 — ❌ REJETÉ (1A/1M/2R). Felix+Lyra: contradictoire avec le #14 (long straddle Q2) mieux construit. Préférer le long straddle Q2-26 validé en carte Geopolitics<\/li><li><strong>Calendar spread Q2/Q3-26 :<\/strong> Capturer la prime d'injection saisonnière — historiquement Q3 > Q2 en contango normal<\/li><\/ul><p>⚡ La question n'est plus <em>où va le prix<\/em>, mais <em>quand la courbe se retourne<\/em>. C'est elle qui dictera le tempo du remplissage — et donc la sécurité de l'hiver prochain.<\/p>","authorWord":"La courbe forward est le vrai baromètre — pas le spot. Surveillez le spread Summer/Winter comme le lait sur le feu.","author":"Felix 🐱","sig":"Felix 🐱 · Stratège Éditorial","t":"alert","badge":"⚡ 💰 Price Action"},{"title":"LNG & Flux : Hormuz, vague US et bras de fer asiatique","hook":"L'Europe attend 73.6 Mt de GNL en 2026 (+29 % YoY) mais entre la fermeture éclair d'Hormuz et le déferlement des trains US, chaque cargo compte.","details":"<p><strong>Approvisionnement européen.<\/strong> Kpler prévoit 73.6 Mt d'importations GNL en Europe en 2026, +29 % sur un an. Deux moteurs : le ramp-up de <em>Plaquemines<\/em> et <em>Golden Pass<\/em> côté US, et la réorientation de cargos spot depuis l'Asie lors des creux de demande saisonniers.<\/p><p><strong>Le facteur Hormuz.<\/strong> La fermeture brève du détroit le 17 février — par lequel transitent ~20 % du GNL mondial (Qatar principalement) — a provoqué un pic intraday sur le JKM. Les commentaires de Trump sur une « frappe limitée » ont calmé le marché, mais le risque reste binaire : toute ré-escalade bloquerait les flux qataris vers l'Europe <em>et<\/em> l'Asie simultanément.<\/p><p><strong>Flux norvégiens.<\/strong> Stables malgré quelques maintenances ponctuelles — pas de signal d'alerte pour le moment.<\/p><p><strong>Compétition asiatique.<\/strong> L'Asie reste le juge de paix. Tout rebond de la demande chinoise ou japonaise aspire les cargos spot et resserre le marché européen. Le spread JKM-TTF est le thermomètre à surveiller.<\/p><hr/><p><strong>🎯 Idées de trade<\/strong><\/p><ul><li><strong>Scénario Hormuz ré-escalade :<\/strong> Long spread JKM-TTF + long calls OTM TTF Summer 26 — le marché a repricé la détente trop vite, l'optionalité est bon marché.<\/li><li><strong>Scénario US flood :<\/strong> Plaquemines + Golden Pass livrent à plein régime → short Q2-26, ou bear put spread 30/25 pour profiter du downside avec risque capé.<\/li><li><strong>Scénario demande asiatique :<\/strong> Rebond industriel chinois → long TTF Q3 outright ou via call spreads 33/38 pour jouer la contagion haussière.<\/li><\/ul><p><em>TTF spot : 31.69 €/MWh | Henry Hub EIA avg : $12.40/MMBtu<\/em><\/p>","authorWord":"Hormuz déjà oublié ? Le marché a la mémoire courte — pas les tankers.","author":"Iris 👁️","sig":"Iris 👁️ · Éditrice","t":"alert","badge":"⚡ 🚢 LNG & Flows"},{"title":"Power & Cross-Commodity","hook":"Les renouvelables allemandes écrasent le spark spread — et si le gaz perdait son meilleur client ?","details":"<p>À 31.69 €/MWh, le TTF reste confortablement au-dessus du seuil de switching charbon-gaz (~17 €/MWh). Mais le vrai sujet du jour n'est pas le charbon — c'est l'éolien. La surperformance des renouvelables en Allemagne comprime les prix power et réduit mécaniquement le gas burn. Moins de gaz brûlé dans les centrales = moins de demande = pression baissière.<\/p><p><strong>💡 Trade 1 — Short spark spread :<\/strong> Si les renouvelables continuent de surperformer, le spread power vs gas se comprime. Shorter le spark spread Q2-26 capture cette dynamique sans parier directement sur la direction du TTF.<\/p><p><strong>💡 Trade 2 — Floor de switching :<\/strong> Attention au scénario inverse. Si le TTF glisse sous ~28 €/MWh, le switching charbon→gaz s'accélère brutalement, créant un plancher naturel de demande. C'est le put gratuit du marché — ne shortez pas le gaz aveuglément en dessous de ce seuil.<\/p><p><strong>💡 Trade 3 — Short ratio crude/gas :<\/strong> Le spike pétrole sur les tensions à Hormuz s'est déjà dégonflé. Le ratio crude/gas reste étiré. Si la prime géopolitique continue de s'évaporer côté brut alors que le gaz garde ses fondamentaux hivernaux, shorter ce ratio offre un bon risk/reward.<\/p><p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Dante 🔥<\/div><div class='dissent-text'>Le consensus parie sur les renouvelables comme fossoyeurs du gas burn. Rappel : en février 2025, un anticyclone de 10 jours avait réduit l'éolien allemand à néant et fait exploser le spark spread de 40%. La météo donne, la météo reprend. Shorter le spark spread sans hedge météo, c'est jouer à la roulette avec Éole.<\/div><\/div><\/p>","authorWord":"Le marché regarde le TTF — moi je regarde les éoliennes. Et elles tournent un peu trop bien pour les bulls.","author":"Dante 🔥","sig":"Dante 🔥 · Avocat du Diable","t":"tech","badge":"⚡ ⚡ Power & Carbon"},{"title":"Météo & Demande","hook":"Le redoux s'installe — la pression sur les stocks s'allège, mais le déficit reste béant.","details":"<p>Les prévisions météo pour la dernière semaine de février confirment un <strong>redoux généralisé<\/strong> sur l'Europe de l'Ouest, avec des températures 2 à 4 °C au-dessus des normales saisonnières. Résultat immédiat : le TTF Mar-26 recule à <strong>31,69 €/MWh<\/strong> (−1,07 % d/d, −15,3 % m/m), les marchés intégrant une demande de chauffage en net repli.<\/p><p>En Allemagne, la <strong>production renouvelable reste soutenue<\/strong> (éolien + solaire), ce qui comprime davantage les appels au gaz dans le mix électrique. Les soutirages de stockage ralentissent sensiblement.<\/p><p>Toutefois, le <strong>taux de remplissage européen reste historiquement bas à 31 %<\/strong> — un niveau qui laisse très peu de marge en cas de retour du froid tardif. La question centrale : le redoux de fin d'hiver suffira-t-il à freiner le déficit de stockage avant la saison d'injection ?<\/p><h4>💡 Idées de trade<\/h4><ul><li><strong>Scénario doux prolongé (bearish CT) :<\/strong> vente Mar-26 ou Q2-26 futures ; bear put spreads sur Mar-26 pour capter la décrue avec risque limité.<\/li><li><strong>Scénario vague de froid tardive (bullish spike) :<\/strong> achat de calls Mar-26 ou Apr-26 — prime encore contenue grâce au redoux, bon point d'entrée pour couvrir le tail risk.<\/li><\/ul>","authorWord":"Fin d'hiver en douceur, mais 31 % de stockage, c'est un filet de sécurité bien mince. La météo commande — restez agiles.","author":"Atlas 🗺️","sig":"Atlas 🗺️ · Veilleur","t":"analysis","badge":"📊 🌡️ Weather & Demand"},{"title":"Storage Watch","hook":"EU storage at 31% — historic low, 17pp below 5yr avg. Refill season will be a battle.","details":"<p>🔴 <b>EU storage: 31.09%<\/b> as of 20/02 — the lowest mid-February level on record. The 5-year average sits around 48%, putting us <b>16.9pp below normal<\/b>.<\/p><p>Country breakdown:<br>🇩🇪 Germany: 22.3% (51.55 TWh)<br>🇫🇷 France: 23% (26.57 TWh)<br>🇳🇱 Netherlands: 13.7%<br>All at historic lows for this time of year.<\/p><p>The math is brutal: reaching the <b>90% EU refill target<\/b> by October requires massive injections from April onward. LNG imports are forecast at 73.6 Mt in 2026 (+29% YoY), but the curve structure works against storage — <b>Summer TTF trades at a premium to Winter<\/b> (backwardation), killing any economic incentive to inject.<\/p><h4>💡 Trade Ideas<\/h4><p><b>Bullish refill scenario<\/b> — If the market prices in forced buying to meet targets:<br>→ Long <b>Q3-26 TTF<\/b> (injection demand peak)<br>→ Long <b>Summer 26 / Winter 27 spread<\/b> (refill pressure lifts summer)<br>→ Long <b>call Q3-26 strike 35€<\/b> for convex upside<\/p><p><b>Contango flip<\/b> — If the curve normalizes and summer dips below winter:<br>→ Storage economics restore, injection flows freely<br>→ <b>Sell the Summer/Winter spread<\/b> — the panic premium fades<\/p><p><b>Tail risk<\/b> — If stocks fail to recover by mid-summer:<br>→ Forced buying risk escalates → <b>long OTM calls Summer 26<\/b><br>→ Regulators may intervene, adding political premium<\/p>","authorWord":"The curve says don't inject. The regulation says you must. Someone's going to blink — and when they do, Q3 will move fast.","author":"Henry 🦉","sig":"Henry 🦉 · Veille Stratégique","t":"tech","badge":"📊 📦 Storage Watch"},{"title":"Geopolitics & Regulation","hook":"Hormuz scare + EU storage gap = two-front squeeze on gas","details":"<p><strong>🌍 Strait of Hormuz — brief closure, lasting premium<\/strong><\/p><p>On Feb 17, Iran partially restricted Strait of Hormuz transit during US-Iran negotiations — a pointed reminder that ~20% of global LNG exports (principally Qatari cargoes) funnel through a single chokepoint. Crude surged ~4.5% intraday, then added another 2% to touch 6-month highs before correcting on Trump's 'limited strike' comments, which markets read as de-escalatory. Lombardier flags a temporary spike to $100/bbl as plausible if tensions re-escalate — and at that level, fuel-switching dynamics would drag gas prices sharply higher.<\/p><p><strong>🇪🇺 EU storage regulation — the quiet forcing function<\/strong><\/p><p>Meanwhile, the EU's 90%-by-November storage mandate looms large. Current levels sit at just 31%, well below the seasonal trajectory needed. The arithmetic is uncomfortable: utilities must inject roughly 60 bcm between now and October. If summer spot stays elevated, the regulation effectively forces buying at any price — a policy-driven bid floor that the market hasn't fully discounted.<\/p><p><strong>💡 Trade ideas<\/strong><\/p><ul><li><strong>Geopolitical vol play:<\/strong> Long straddle TTF Q2-26 — captures repricing in either direction. Complement with long OTM calls Summer 26 (strikes 40–45 €/MWh) as asymmetric tail-risk hedge on Hormuz escalation.<\/li><li><strong>Regulatory forcing:<\/strong> If Brussels enforces the 90% target strictly → forced Q3 buying is near-certain. Position via long Q3-26 TTF futures or call spreads 35/45 to capture the injection-season squeeze.<\/li><li><strong>De-escalation fade — ❌ REJETÉ À L'UNANIMITÉ (0A/0M/4R). Le conseil est formel : vendre de la vol avec des stocks à 31% et Hormuz instable = risque illimité à la hausse. \"Dangereux\" (Iris). \"On ne vend pas de la vol quand le marché crie le stress\" (Lyra).<\/li><\/ul><p>Two catalysts, one conclusion: optionality is cheap relative to the range of outcomes. The question isn't <em>whether<\/em> to hedge, but which tail you're more afraid of.<\/p>","authorWord":"Between Hormuz gunboat diplomacy and Brussels storage mandates, the gas market is caught in a geopolitical-regulatory pincer. Vol is your friend here — own it on both sides until the fog clears.","author":"Blaise 🧮","sig":"Blaise 🧮 · Juriste","t":"alert","badge":"📊 💣 Geopolitics & Regulation"},{"title":"Risk Flags, Outlook & Trade Ideas — Validées par le Conseil","hook":"19 trades proposés, 4 conseillers, La Rédaction tranche : 12 validés, 3 rejetés, 4 amendés. Le refill Q3 est LA conviction unanime.","details":"<p><strong>🎯 Synthèse — Le paradoxe de février 2026<\/strong><\/p><p>Le marché gaz européen présente une contradiction rare : les prix spot chutent (−15% m/m, −33% YoY) alors que les fondamentaux structurels n'ont jamais été aussi tendus. La backwardation Summer/Winter — <em>anormale<\/em> — signale que le marché refuse de rémunérer le stockage. Or avec 31% de remplissage (NL à 13.7%, record bas), l'Europe doit injecter ~50 bcm en 6 mois.<\/p><hr/><p><strong>🗳️ RÉSULTATS DU CONSEIL DE VALIDATION<\/strong><\/p><p>19 idées de trade soumises au vote de <strong>Iris 👁️<\/strong> (qualité), <strong>Dante 🔥<\/strong> (avocat du diable), <strong>Felix 🐱<\/strong> (stratégie), <strong>Lyra 🎵<\/strong> (synthèse). La Rédaction 🦊 tranche les égalités.<\/p><p><strong>Trade:<\/strong> <strong>#17 Long calls Q3-26 strike 35€<\/strong><br><strong>Verdict:<\/strong> ✅<br><strong>Votes:<\/strong> <strong>4/4<\/strong><br><strong>Commentaires du conseil:<\/strong> 🦉 Unanimité. Iris: \"Meilleur ratio conviction/risque\". Dante: \"LE trade structurel\". Felix: \"4 cartes convergent vers Q3 long\". Lyra: \"Asymétrie parfaite\"<br><\/p><p><strong>Trade:<\/strong> <strong>#3 Long Q3 + Sum26/Win27 spread<\/strong><br><strong>Verdict:<\/strong> ✅<br><strong>Votes:<\/strong> <strong>3A/1M<\/strong><br><strong>Commentaires du conseil:<\/strong> Felix amende: fusionner le call 35€ avec #17 pour éviter doublon. Triptyque refill incontournable.<br><\/p><p><strong>Trade:<\/strong> <strong>#2 Long calls Mar/Apr-26 (cold snap)<\/strong><br><strong>Verdict:<\/strong> ✅<br><strong>Votes:<\/strong> <strong>3/3<\/strong><br><strong>Commentaires du conseil:<\/strong> Dante: \"Assurance légitime, gardez les primes petites\". Hedge naturel du #1.<br><\/p><p><strong>Trade:<\/strong> <strong>#5 Long OTM calls Summer 26 (tail risk)<\/strong><br><strong>Verdict:<\/strong> ✅<br><strong>Votes:<\/strong> <strong>3/3<\/strong><br><strong>Commentaires du conseil:<\/strong> Dante: \"Vérifiez le skew avant d'entrer\". Iris: \"Si stocks bas en mai, ces calls explosent\".<br><\/p><p><strong>Trade:<\/strong> <strong>#8 Call spreads TTF Q3 33/38 (Asie)<\/strong><br><strong>Verdict:<\/strong> ✅<br><strong>Votes:<\/strong> <strong>3/3<\/strong><br><strong>Commentaires du conseil:<\/strong> Dante: \"Double moteur Asie+refill. Surveillez les PMI chinois\". Felix: \"Convergence légitime, pas doublon\".<br><\/p><p><strong>Trade:<\/strong> <strong>#10 Floor switching ~28€<\/strong><br><strong>Verdict:<\/strong> ✅<br><strong>Votes:<\/strong> <strong>3/3<\/strong><br><strong>Commentaires du conseil:<\/strong> Dante: \"Le garde-fou le plus intelligent du tableau\". Règle de discipline, pas un trade directionnel.<br><\/p><p><strong>Trade:<\/strong> <strong>#1 Bear put spread Mar-26 (météo douce)<\/strong><br><strong>Verdi
