<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gas Morning Brief — 24 Mars 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    /* Scenario Probability Card */
    .scenario-block { margin: 1em 0; padding: 0.8em 1em; border-left: 4px solid #ffd700; border-radius: 0 8px 8px 0; background: rgba(255,215,0,0.05); }
    .scenario-block h3 { margin: 0 0 0.3em 0; font-size: 1.05em; display: flex; justify-content: space-between; align-items: center; }
    .scenario-block .proba { font-size: 1.3em; font-weight: bold; color: #ffd700; }
    .scenario-block p { margin: 0.2em 0; font-size: 0.92em; }
    .scenario-block .votes { font-size: 0.8em; opacity: 0.7; font-style: italic; }
    .consensus { margin-top: 1.2em; padding: 0.6em; border-radius: 8px; background: rgba(0,200,100,0.08); }
    .dissent { margin-top: 0.4em; padding: 0.6em; border-radius: 8px; background: rgba(255,80,80,0.08); }

    html.light .details div[style*="background"], html.light .details p[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Light mode: override inline white colors in trade cards */
    html.light .details p[style], html.light .details b[style], html.light .details span[style], html.light .details div[style] { color: rgba(0,0,0,.85) !important; }
    html.light .details div[style*="border-left:3px solid #f59e0b"] { background: rgba(245,158,11,.08) !important; }
    html.light .details div[style*="border-left:3px solid #10b981"] { background: rgba(16,185,129,.08) !important; }
    html.light .details div[style*="border-left:3px solid #ff4757"] { background: rgba(255,71,87,.06) !important; }
    html.light .details div[style*="color:#f59e0b"] { color: #b45309 !important; }
    html.light .details div[style*="color:#10b981"] { color: #047857 !important; }
    html.light .details div[style*="color:#ff4757"] { color: #dc2626 !important; }
    html.light .details h3 { color: #1a1a2e !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details p[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }
      .dt-reader .dt-r-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; }
      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }
      .dt-reader .dt-r-body p { margin-bottom: 18px; }

  <script>
  const DATA = [{"t":"home","home":true,"date":"24 Mars 2026","henryWord":"Ultimatum night defines the session: Trump's 48h deadline expires at 21:00 UTC with no diplomatic breakthrough, and the probability-weighted TTF sits at €70.5/MWh — 19% above the €59.3 spot. The Council validated 15 of 20 trade ideas, eliminating 5 doublons and contradictions; the TTF Apr straddle (unanimous) and Win-26 outright long remain highest conviction as three binary catalysts converge this week.","articles":[{"badge":"⚡ 💰 Price Action","title":"Ultimatum Night: TTF Opens at €59.3 as Market Braces for Binary Outcome","idx":1},{"badge":"⚡ 🚢 LNG & Flows","title":"Ras Laffan Trickle Continues — EU Terminals Run Hot as Cargo Competition Intensifies","idx":2},{"badge":"⚡ ⚡ Power & Carbon","title":"Spark Spreads Tighten; Carbon Slumps","idx":3},{"badge":"📊 🌡️ Weather & Demand","title":"Storage Resilience vs. Structural Injection Needs","idx":4},{"badge":"📊 📦 Storage Watch","title":"28.9% Full — Europe Faces Its Steepest Refill Since 2022","idx":5},{"badge":"📊 💣 Geopolitics & Regulation","title":"Trump Ultimatum Expires Tonight as Hormuz Choke Tightens — EU LNG Ban T-7 Days","idx":6},{"badge":"📊 🎯 Risk Flags & Outlook","title":"Three Triggers, One Week: Ultimatum × April Ban × Refill Panic","idx":7},{"badge":"🎲 Scénarios","title":"7 Market Scenarios — Council Probability Votes","idx":8},{"badge":"📊 🌍 Scénario Géopolitique","title":"Ultimatum Night — 7 Geopolitical Scenarios Impacting Gas Markets","idx":9},{"badge":"🏛️ Verdict du Conseil","title":"20 Trades Audités — 15 Retenus, 5 Éliminés","idx":10}],"disclaimer":"⚠️ AVERTISSEMENT — Ce document est un exercice expérimental de veille automatisée produit par intelligence artificielle. Il ne constitue EN AUCUN CAS un conseil en investissement, une recommandation de trading, ni une analyse financière réglementée au sens de la directive MiFID II ou du Code monétaire et financier (art. L541-1). Les « scénarios de marché » présentés sont des hypothèses pédagogiques générées par des modèles de langage — ils ne reflètent pas l'avis d'un professionnel agréé. Les données proviennent de sources publiques, potentiellement retardées ou erronées. Toute décision d'investissement prise sur la base de ce document relève de la seule responsabilité du lecteur. L'auteur n'est pas enregistré comme Conseiller en Investissement Financier (CIF) auprès de l'AMF. Ce contenu est fourni à titre informatif et expérimental uniquement."},{"t":"alert","badge":"⚡ 💰 Price Action","title":"Ultimatum Night: TTF Opens at €59.3 as Market Braces for Binary Outcome","hook":"TTF day-ahead settled at €59.3/MWh (close 23 Mar, ◆ flat vs prev) as the market consolidates ahead of Trump's ultimatum expiry tonight. Rabobank lifts Q2 TTF forecast to €61/MWh — the Ras Laffan shock has permanently repriced the forward curve.","authorWord":"Binary night ahead. TTF coiled at €59, options vol spiking. The market is hedging both tails — and it should be.","author":"Blaise 🧮","details":"<p><b>📊 Settlement Snapshot (23 Mar 2026):<\/b> TTF day-ahead settled at <b>€59.3/MWh<\/b> (ICE Endex, ◆ flat vs 20 Mar close of €82.5 post-spike — the 28% retracement over the weekend reflects profit-taking, not resolution). <a href='https://www.theice.com/products/27996665/Dutch-TTF-Gas-Futures' target='_blank'>ICE TTF<\/a>. Henry Hub front-month at <b>$2.90/MMBtu<\/b> (NYMEX settle 21 Mar, ▼-$0.03 vs prev), continuing its total decoupling from global gas — the Atlantic basin arbitrage is blown to historic widths at ~$18/MMBtu TTF-equivalent. <a href='https://www.cmegroup.com/markets/energy/natural-gas/natural-gas.html' target='_blank'>CME HH<\/a>. JKM assessed around <b>$17.5/MMBtu<\/b> (S&P Global Platts 21 Mar, ▼-$1.5 vs Thu spike), retreating from $19+ panic levels but still 35% above pre-war. NBP front-month near <b>58p/therm<\/b> (ICE 21 Mar, tracking TTF parity).<\/p><p><b>📈 Technical Levels:<\/b> TTF front-month trades in a <b>€55–€65 consolidation range<\/b> after the Ras Laffan spike to €82.5 and rapid retracement. Key resistance at <b>€65<\/b> (50% Fib of the spike-to-current move); support at <b>€52<\/b> (pre-ultimatum range top). A clean break above €65 targets €75–80 retest; below €52 opens €45 (ceasefire scenario). <b>Implied volatility on TTF Apr options has surged to ~85%<\/b> — pricing a ±€10/MWh weekly move. HH remains range-bound $2.80–$3.00, completely insulated.<\/p><p><b>⚠️ Overnight Signal:<\/b> Asian LNG trading was thin over the weekend with JKM pulling back, but Globex TTF futures showed <b>late-Sunday bid interest around €60–61<\/b> — suggesting Asian/ME accounts positioning for a gap higher if the ultimatum triggers US strikes. Open interest on TTF Apr futures rose 4% Friday, indicating new positions rather than short-covering.<\/p><h3>💡 Trade Ideas<\/h3><ul><li><b>T1 — TTF Apr €65/€80 call spread:<\/b> ~€2.5 debit captures the escalation scenario (20% prob) with 6:1 payoff. If strikes happen overnight, TTF gaps to €80+.<\/li><li><b>T2 — Long TTF Apr / Short HH Apr relative value:<\/b> The spread is at historic wides (~€56/MWh equiv). Any Hormuz resolution compresses this faster than outright TTF falls.<\/li><li><b>T3 — TTF Apr €55/€50 put spread:<\/b> ~€1.8 debit for ceasefire hedge (25% prob). If back-channel deal materializes, TTF could gap to €45–48.<\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>The vol surface is already pricing Armageddon. At 85% IV, you're paying through the nose for directional options. The smarter trade is selling TTF Apr straddles at €59 and collecting premium — the base case (40% prob) is range-bound consolidation at €55–65 while the market waits for the next headline. Theta is your friend in headline-driven markets.<\/div><\/div>","sig":"Blaise 🧮"},{"t":"alert","badge":"⚡ 🚢 LNG & Flows","title":"Ras Laffan Trickle Continues — EU Terminals Run Hot as Cargo Competition Intensifies","hook":"Qatari LNG loadings remain at 83% of nameplate after the Mar 20 missile damage, with 4–5 spot cargoes per week diverted to Asia's higher bids. Norwegian pipeline flows hold steady but cannot compensate — Europe's LNG dependency is being stress-tested in real time.","authorWord":"Europe's molecule hunt enters crisis mode. Asian buyers outbidding EU by $2/MMBtu. The cargo war is here.","author":"Henry 🦉","details":"<p><b>🚢 LNG Arrivals & Sendout:<\/b> EU LNG terminal sendout rates averaged <b>~12.5 GWh/day<\/b> over the past 48 hours — down ~8% from the pre-Ras Laffan baseline of ~13.6 GWh/day. <a href='https://alsi.gie.eu/' target='_blank'>GIE ALSI data<\/a> shows 6 cargoes discharged at EU terminals over the weekend (Gate Rotterdam, Montoir, Bilbao, Sines, Revithoussa, Świnoujście). The pipeline remains thin: <b>no new spot bookings from Qatar<\/b> are visible on the forward schedule through end-March. US cargoes from Sabine Pass and Cameron LNG are filling the gap, but transit times of 10–12 days mean the full re-routing impact won't be felt until early April.<\/p><p><b>📊 Spread Snapshot:<\/b> TTF-HH spread at <b>~€56/MWh equivalent (~$18/MMBtu)<\/b> — the widest in the post-2022 era, making every US cargo destined for Europe hugely profitable. JKM-TTF spread has <b>flipped to Asia's favour by ~$1.5/MMBtu<\/b> (JKM $17.5 vs TTF equiv ~$16), pulling flexible cargoes eastward. This is the core tension: Europe needs molecules but Asia is outbidding. The arb window for Sabine Pass → Europe remains wide open at ~$15/MMBtu netback.<\/p><p><b>🔧 Pipeline & Infrastructure:<\/b> Norwegian flows via <a href='https://www.entsog.eu/transparency-platform' target='_blank'>Langeled and Europipe II<\/a> remain at <b>~310 mcm/day combined<\/b> — steady and near maximum. Algerian flows via Medgaz at <b>~28 mcm/day<\/b> (nominal capacity 32 mcm/day). TurkStream southbound to Hungary/Serbia at <b>~42 mcm/day<\/b> — unchanged but under threat from the broader conflict dynamics. <b>No unplanned outages<\/b> reported at major EU terminals today. Golden Pass LNG (Texas) commissioning remains on track for first cargo Q2 2026 — a medium-term relief valve.<\/p><h3>💡 Trade Ideas<\/h3><ul><li><b>T4 — Long JKM-TTF Q2 spread:<\/b> Asian premium holds as Qatari spot redirects East. Target $2–3/MMBtu widening from current $1.5.<\/li><li><b>T6 — Short Sabine Pass-to-EU freight proxy:<\/b> As more US cargoes chase EU netbacks, shipping rates on the Atlantic route spike. Consider freight derivatives if accessible.<\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>The market is overestimating the Ras Laffan impact. 17% offline means 83% is still running — and Qatar has a track record of rapid repairs on its older trains. The real risk is in Hormuz, not Ras Laffan. If the Strait stays under selective passage (base case), Qatari cargoes will flow — just slower and more expensive. Don't confuse delays with destruction.<\/div><\/div>","sig":"Henry 🦉"},{"t":"tech","badge":"⚡ ⚡ Power & Carbon","title":"Spark Spreads Tighten; Carbon Slumps","hook":"Gas-to-power margins face severe pressure as EUA prices drift lower toward €66.65.","authorWord":"Power markets are navigating a high-volatility environment with tight gas supplies squeezing dispatch margins.","author":"Sage 🦎","details":"European power day-ahead prices remain elevated, with gas-to-power spark spreads currently underperforming dark spreads in core markets like Germany and the UK. Coal-to-power generation holds a marginal economic advantage as natural gas costs remain disconnected from fundamentals, driven by regional geopolitical risk. The <a href=https://www.theice.com/products/197/Emissions-Futures/data?marketId=5396590 target=_blank>EUA carbon market<\/a> closed at €66.65, reflecting a cautious sentiment amid lower industrial demand, despite high gas reliance for baseload balancing. <a href=https://transparency.entsoe.eu/ target=_blank>ENTSO-E data<\/a> highlights persistent nuclear maintenance schedules and interconnector constraints, keeping spot prices sensitive to renewable intermittency, which remains below seasonal norms today.<br><br><h3>💡 Trade Ideas<\/h3><ul><li><strong>Long Spark Spread (Dec 26):<\/strong> Buy TTF/Sell EUA, aiming to capture gas-to-power margin recovery.<\/li><li><strong>Bearish EUA (Dec 26):<\/strong> Sell strikes at €65, betting on sustained industrial weakness.<\/li><li><strong>Long Power Spot (DE):<\/strong> Buy day-ahead, looking for volatility from nuclear downtime and low wind output.<\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>Do not underestimate the reflexive nature of the EUA market. Should the Ras Laffan disruption extend, carbon could decouple and rally sharply as fuel switching from gas back to coal is constrained by emission quotas.<\/div><\/div>","sig":"Sage 🦎"},{"t":"analysis","badge":"📊 🌡️ Weather & Demand","title":"Storage Resilience vs. Structural Injection Needs","hook":"Persistent +2°C anomalies are easing near-term heating demand, yet the structural deficit remains acute with EU storage at a historic 28.9% low. As we transition to injection season, the market must reconcile these mild weather tailwinds against the daunting 70+ bcm replenishment requirement.","authorWord":"Market complacency is the primary danger here. Stay long the storage recovery spread, as the current mild weather is a temporary cushion, not a fundamental cure for our structural inventory hole.","author":"Sage 🦎","details":"<p>The Week 2-4 outlook shows continued mild deviations across Northwest Europe, suppressing Heating Degree Day (HDD) accumulation and keeping residential gas demand below the five-year mean. While this thermal relief is welcome, the underlying supply-demand imbalance is stubborn; seasonal demand shifts are underway, but the window for rebuilding inventory is tightening, necessitating a sustained injection pace that is currently missing from the forward curve.<\/p><p>Hydro balances remain healthy in the Nordics, potentially dampening power-to-gas switching demand in the immediate term. However, wind capacity forecasts for early April appear volatile; if wind generation underperforms, the marginal cost of balancing the grid will lean heavily on gas-fired generation, potentially offsetting any weather-driven demand savings and complicating the critical injection trajectory.<\/p><h3>💡 Trade Ideas<\/h3><ul><li><strong>Sell TTF May/June '26 Calendar Spread:<\/strong> Leverage the current mild weather to capture potential downside in the near-month as storage injections struggle to ramp up.<\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>The market is overly discounting the impact of low storage. Even with mild temps, the inventory deficit creates a floor that will prevent prices from breaking lower as Q3 approaches.<\/div><\/div>","sig":"Sage 🦎"},{"t":"tech","badge":"📊 📦 Storage Watch","title":"28.9% Full — Europe Faces Its Steepest Refill Since 2022","hook":"EU storage sits at 28.9%, the lowest end-of-winter level since the 2022 energy crisis, with ~70 bcm needed to hit the 90% mandate by November 1. The injection window opens under a perfect storm: Ras Laffan 17% offline and the Russian LNG ban kicking in April 1.","authorWord":"Historic deficit. 70 bcm to inject in 210 days. The maths are brutal — and the market knows it.","author":"Blaise 🧮","details":"<p><b>📊 EU Storage Snapshot (AGSI+ 23-Mar-2026):<\/b> Aggregate fill at <b>28.9%<\/b> (~27.5 bcm of ~95 bcm working capacity). This is <b>12 percentage points below the 5-year average<\/b> of ~41% for late March, and the lowest since March 2022. Year-on-year, storage is down ~18 pp from 47% at this point in 2025. At current withdrawal-adjusted consumption, EU reserves cover roughly <b>28–32 days of demand<\/b> — razor-thin heading into injection season. <a href='https://agsi.gie.eu/' target='_blank'>[AGSI+ Data]<\/a><\/p><p><b>🇺🇸 US Context (EIA):<\/b> US working gas stocks sit near ~1,650 Bcf, roughly 10% below the 5-year average. The Henry Hub forward curve is backwardated through summer, incentivising US exports — but <b>global LNG supply is constrained<\/b> with Ras Laffan's 17% outage removing ~12 mtpa of Qatari capacity. Europe must compete harder for flexible cargoes. <a href='https://www.eia.gov/naturalgas/weekly/' target='_blank'>[EIA Weekly]<\/a><\/p><p><b>🔮 Refill Projection:<\/b> To reach 90% (~85.5 bcm) by Nov 1, Europe must inject <b>~58 bcm net over ~210 days<\/b> — an average rate of <b>~0.28 bcm/day<\/b>. For context, the 2022 panic-refill averaged ~0.25 bcm/day with maximum policy support. With the <b>Russian LNG import ban effective April 1<\/b> removing ~15 bcm/yr of supply, pipeline flows from Norway/Algeria and spot LNG must fill the gap. Any sustained heatwave driving power-sector gas demand could derail the trajectory by mid-summer. <a href='https://ec.europa.eu/commission/presscorner/detail/en/ip_22_3131' target='_blank'>[EU Storage Regulation]<\/a><\/p><p><b>💡 Trade Ideas:<\/b><br>① <b>Buy TTF Q3-26 / Sell TTF Q4-26 spread<\/b> — summer injection demand should keep Q3 elevated relative to a (hopefully) fuller Q4. Target €2–3/MWh widening.<br>② <b>Long TTF Oct-26 calls (€42–€45 strike)<\/b> — if the refill trajectory falls behind by July, autumn panic premium re-emerges. Defined risk, asymmetric payoff.<br>③ <b>Short JKM–TTF Q3 spread<\/b> — European desperation for LNG cargoes compresses the Asia-Europe differential as EU buyers bid up flexible supply.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The 90% mandate is a political target, not a physical law. If TTF stays above €40, demand destruction kicks in hard — industrial load already down 15% from 2021 peaks. Mild summer + demand response could see Europe comfortable at 80% by October without any supply miracle. The market is pricing worst-case; I'd fade the hysteria and sell TTF summer vol.<\/div><\/div>","sig":"Blaise 🧮"},{"t":"alert","badge":"📊 💣 Geopolitics & Regulation","title":"Trump Ultimatum Expires Tonight as Hormuz Choke Tightens — EU LNG Ban T-7 Days","hook":"Trump's 48-hour ceasefire ultimatum to Iran expires Monday evening with no diplomatic breakthrough in sight, while Hormuz selective passage has already cut Ras Laffan loadings 17% and the EU's Russian LNG import ban takes effect April 1. The convergence of three simultaneous supply-side political shocks leaves European gas balanced on a knife-edge at 28.9% storage.","authorWord":"Ultimatum night. Hormuz narrowing. Russian LNG ban in 7 days. Three political shocks converging on a 28.9% storage buffer — this is the most dangerous week for European gas since Feb 2022.","author":"Henry 🦉","details":"<h3>🇺🇸 Trump Ultimatum — Clock Hits Zero<\/h3><p>President Trump's 48-hour ultimatum to Iran — issued Saturday evening demanding a halt to missile strikes on Israeli territory — expires approximately <b>21:00 UTC Monday March 24<\/b>. Tehran's public response has been defiant: Foreign Minister Araghchi stated Sunday that Iran 'does not negotiate under threat.' Three scenarios emerge: <b>(1)<\/b> Trump escalates with secondary sanctions on Iranian oil buyers (60% probability), immediately removing ~1.2 mb/d of crude and tightening the energy complex; <b>(2)<\/b> a face-saving back-channel pause (25%); or <b>(3)<\/b> direct US military action against Iranian assets (15%), which would send TTF well above €80. The <b>USS Eisenhower<\/b> and <b>USS Truman<\/b> carrier groups remain stationed in the Arabian Sea and Eastern Med respectively.<\/p><h3>🚢 Hormuz Selective Passage — Current Status<\/h3><p>Iran's IRGC Navy has maintained 'enhanced inspection' of vessels transiting the Strait of Hormuz since Day 18 of the conflict. Impact so far:<\/p><p><strong>Metric:<\/strong> Ras Laffan LNG loadings<br><strong>Pre-War:<\/strong> ~82 mtpa rate<br><strong>Current:<\/strong> ~68 mtpa rate<br><strong>Δ:<\/strong> <b>−17%<\/b><br><\/p><p><strong>Metric:<\/strong> Hormuz daily transits<br><strong>Pre-War:<\/strong> ~65 vessels<br><strong>Current:<\/strong> ~48 vessels<br><strong>Δ:<\/strong> −26%<br><\/p><p><strong>Metric:<\/strong> Avg transit delay<br><strong>Pre-War:<\/strong> 1-2 hrs<br><strong>Current:<\/strong> 8-14 hrs<br><strong>Δ:<\/strong> +6-12 hrs<br><\/p><p><strong>Metric:<\/strong> Qatari spot cargoes diverted<br><strong>Pre-War:<\/strong> 0<br><strong>Current:<\/strong> ~4/week<br><strong>Δ:<\/strong> —<br><\/p><h3>🔴 HORMUZ SCENARIO MATRIX<\/h3><p><strong>Scenario:<\/strong> <b>A: Status Quo<\/b> — Selective delays continue<br><strong>Prob.:<\/strong> 40%<br><strong>Duration:<\/strong> 4-8 weeks<br><strong>TTF Impact:<\/strong> €55-65<br><strong>JKM Impact:<\/strong> $16-18<br><\/p><p><strong>Scenario:<\/strong> <b>B: Escalation<\/b> — Full LNG carrier blockade<br><strong>Prob.:<\/strong> 20%<br><strong>Duration:<\/strong> 2-6 weeks<br><strong>TTF Impact:<\/strong> <b>€80-110<\/b><br><strong>JKM Impact:<\/strong> $22-30<br><\/p><p><strong>Scenario:<\/strong> <b>C: De-escalation<\/b> — Back-channel ceasefire<br><strong>Prob.:<\/strong> 25%<br><strong>Duration:<\/strong> 1-2 weeks<br><strong>TTF Impact:<\/strong> €42-48<br><strong>JKM Impact:<\/strong> $13-14<br><\/p><p><strong>Scenario:<\/strong> <b>D: US Military Strike<\/b><br><strong>Prob.:<\/strong> 10%<br><strong>Duration:<\/strong> Days-weeks<br><strong>TTF Impact:<\/strong> <b>€90-130+<\/b><br><strong>JKM Impact:<\/strong> $28-35+<br><\/p><p><strong>Scenario:<\/strong> <b>E: Mine/Tanker Incident<\/b><br><strong>Prob.:<\/strong> 5%<br><strong>Duration:<\/strong> Weeks-months<br><strong>TTF Impact:<\/strong> <b>€100-150<\/b><br><strong>JKM Impact:<\/strong> $30-40<br><\/p><p><b>Probability-weighted TTF:<\/b> (0.40×60)+(0.20×95)+(0.25×45)+(0.10×110)+(0.05×125) = <b>€70.5/MWh<\/b> — implying ~19% upside risk from current €59.3 spot.<\/p><h3>🇪🇺 EU Russian LNG Ban — April 1 Countdown<\/h3><p>The EU's ban on Russian LNG imports under the 15th sanctions package takes full legal effect <b>April 1<\/b>. Key numbers: EU imported <b>15.5 bcm<\/b> of Russian LNG in 2025 (~5% of supply), primarily via <b>Yamal LNG<\/b> into Zeebrugge and Montoir. Long-term contracts (~10 bcm/yr) may claim exemption under existing 'contract sanctity' clauses, but <b>~5.5 bcm of spot/short-term Russian LNG is definitively banned<\/b>. The timing couldn't be worse: losing 5.5 bcm of spot supply just as injection season begins with storage at 28.9%.<\/p><h3>🇷🇺 TurkStream & Pipeline Flows<\/h3><p>TurkStream delivers <b>~42 mcm/day<\/b> to Hungary, Serbia, and parts of SE Europe — roughly <b>15 bcm/yr<\/b>, or ~4% of EU consumption. This remains the last Russian pipeline route into Europe after the Yamal-Europe and Nord Stream shutdowns. Budapest's Orbán government has resisted EU pressure to diversify, but the volume is stable. Risk: if Turkey mediates or escalation pulls Ankara into the conflict, this flow could be disrupted — removing the last Russian pipe molecule.<\/p><h3>📅 Political Calendar — Next 2-4 Weeks<\/h3><ul><li><b>Tonight (24 Mar):<\/b> Trump ultimatum expires ~21:00 UTC<\/li><li><b>25-28 Mar:<\/b> EU Energy Council emergency session (Brussels) — storage mandate review, possible ETS suspension debate<\/li><li><b>1 Apr:<\/b> EU Russian LNG import ban effective<\/li><li><b>2-3 Apr:<\/b> OPEC+ monitoring committee — output policy amid oil surge<\/li><li><b>7-11 Apr:<\/b> IMF Spring Meetings — energy security on agenda<\/li><\/ul><h3>💡 Trade Ideas<\/h3><ul><li><b>T8 — Long TTF Win-26 outright (Scenario A/B):<\/b> If Hormuz drags on 4-8 weeks, the refill failure feeds directly into winter premium. Target €70+.<\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>The scenario matrix overweights tail risks. Markets have priced in Hormuz since Day 1 — the risk premium is already embedded in the €59 price. The most probable path (Status Quo + April LNG ban) is already consensus. The real risk nobody's pricing is a diplomatic breakthrough: Trump wants a deal before midterms, and Iran's economy is buckling under sanctions. A surprise ceasefire would crash TTF 30% overnight. Position for the unexpected, not the expected.<\/div><\/div>","sig":"Henry 🦉"},{"t":"strategy","badge":"📊 🎯 Risk Flags & Outlook","title":"Three Triggers, One Week: Ultimatum × April Ban × Refill Panic","hook":"The probability-weighted TTF sits at €70.5/MWh — 19% above spot — telling you the market is underpricing tail risk tonight. The week's three catalysts (ultimatum expiry, EU Energy Council, April 1 ban) make this the highest-event-density period since Hormuz Day 1.","authorWord":"Three binary events in 7 days. The straddle is the trade. Pick your direction after the dust settles, not before.","author":"La Rédaction 🦊","details":"<h3>🎯 TOP 3 RISKS (Probability × Impact)<\/h3><ol><li><b>Trump Ultimatum Escalation (Tonight):<\/b> 15% probability of direct US military action → TTF €90-130. Even secondary sanctions (60% prob) tighten the energy complex and add €5-10/MWh to TTF. <b>Risk Score: 9/10.<\/b><\/li><li><b>EU Russian LNG Ban Implementation (Apr 1):<\/b> 95% probability of enforcement, removing ~5.5 bcm/yr of spot supply at the worst possible time. Already partially priced but the physical impact on injection rates is NOT priced. <b>Risk Score: 7/10.<\/b><\/li><li><b>Refill Trajectory Failure (Ongoing):<\/b> 28.9% storage needs 0.28 bcm/day injection — above the 2022 panic pace. If April injection starts slow (cold snap, LNG disruption), the market reprices Win-26 by €10-15. <b>Risk Score: 8/10.<\/b><\/li><\/ol><h3>📈 BULL SCENARIO: Escalation Cascade (TTF €80-110)<\/h3><p>Trump ultimatum triggers US strikes on Iranian naval assets → Hormuz fully closes → TTF gaps to €80+ Monday morning. EU emergency session accelerates to Thursday. OPEC+ holds output steady, Brent hits $120+. LNG cargoes globally reroute away from Gulf, stranding 20% of global supply. TTF tests 2022 highs.<\/p><p><b>Trade:<\/b> TTF Apr €65/€80 call spread (T1) at €2.5 debit. Or outright long TTF Apr futures with €55 stop.<\/p><h3>📉 BEAR SCENARIO: Diplomatic Breakthrough (TTF €42-48)<\/h3><p>Trump privately negotiates a 72-hour ceasefire through Oman back-channel. Iran agrees to 'humanitarian pause' in exchange for sanctions relief signal. Hormuz reopens within days. TTF crashes 30% to €42-45. JKM collapses to $13. Panic unwind of long positions.<\/p><p><b>Trade:<\/b> TTF Apr €55/€50 put spread (T3) at €1.8 debit. Or short TTF futures with €65 stop.<\/p><h3>🃏 WILD CARD: Mine/Tanker Attack in Strait (TTF €100-150)<\/h3><p>IRGC deploys naval mines or attacks an LNG carrier transiting Hormuz — low probability (5%) but catastrophic impact. Global LNG insurance rates quadruple overnight. All carriers reroute via Cape of Good Hope (+12 days). TTF spikes above €100 in a 2022-style panic.<\/p><p><b>Trade:<\/b> Deep OTM TTF Apr €90 calls — cheap premium (~€0.5), massive asymmetry if this materializes.<\/p><h3>🧭 CONVICTION MATRIX<\/h3><p><strong>Trade:<\/strong> TTF Apr €59 straddle<br><strong>Prob:<\/strong> 75%<br><strong>Payoff:<\/strong> 2-3x<br><strong>Expected Value:<\/strong> <b>HIGH<\/b><br><strong>Conviction:<\/strong> ⭐⭐⭐⭐⭐<br><\/p><p><strong>Trade:<\/strong> Long TTF Win-26<br><strong>Prob:<\/strong> 60%<br><strong>Payoff:<\/strong> 1.5-2x<br><strong>Expected Value:<\/strong> HIGH<br><strong>Conviction:<\/strong> ⭐⭐⭐⭐<br><\/p><p><strong>Trade:<\/strong> JKM-TTF Q2 widener<br><strong>Prob:<\/strong> 55%<br><strong>Payoff:<\/strong> 1.5x<br><strong>Expected Value:<\/strong> MEDIUM<br><strong>Conviction:<\/strong> ⭐⭐⭐<br><\/p><p><strong>Trade:<\/strong> TTF Apr €65/€80 call spread<br><strong>Prob:<\/strong> 30%<br><strong>Payoff:<\/strong> 5-6x<br><strong>Expected Value:<\/strong> HIGH<br><strong>Conviction:<\/strong> ⭐⭐⭐⭐<br><\/p><p><strong>Trade:<\/strong> TTF Apr €55/€50 put spread<br><strong>Prob:<\/strong> 25%<br><strong>Payoff:<\/strong> 3x<br><strong>Expected Value:<\/strong> MEDIUM<br><strong>Conviction:<\/strong> ⭐⭐⭐<br><\/p><h3>📅 CATALYSTS TO WATCH THIS WEEK<\/h3><ul><li><b>Mon 24 Mar ~21:00 UTC:<\/b> Trump ultimatum expires<\/li><li><b>Tue 25 Mar:<\/b> ICE TTF Apr expiry positioning — watch open interest shifts<\/li><li><b>Wed 26 Mar:<\/b> EIA weekly storage report (US)<\/li><li><b>Thu 27 Mar:<\/b> EU Energy Council emergency session — storage mandate + ETS review<\/li><li><b>Fri 28 Mar:<\/b> AGSI+ weekly update — first full post-ultimatum storage read<\/li><\/ul><h3>📊 POSITIONING CONTEXT<\/h3><p>The TTF forward curve is in <b>steep backwardation<\/b> from Apr through Q3, then flattening into winter — the market prices acute near-term risk but expects resolution before heating season. <b>Net speculative long positioning on ICE TTF<\/b> rose 12% last week to near all-time highs. Combined with 28.9% storage and three binary events this week, the setup favours <b>vol-buying strategies<\/b> over directional bets. The straddle is the highest-conviction trade in the book right now.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The risk matrix is too focused on Hormuz. The sleeper risk is the EU Energy Council on Thursday: if Brussels suspends the ETS or delays the Russian LNG ban under political pressure, that's a bigger medium-term bearish catalyst than any ceasefire. Watch the politicians, not the generals. The institutional short on EUA is the hidden trade of the week.<\/div><\/div>","sig":"La Rédaction 🦊"},{"t":"analysis","badge":"🎲 Scénarios","title":"7 Market Scenarios — Council Probability Votes","hook":"The Council weighs 7 scenarios for gas markets this week, from range-bound consolidation to 2022-style panic. The probability-weighted TTF sits at €68/MWh — significantly above current spot, signaling the market is underpricing upside tail risk.","authorWord":"Le Conseil 🎲","author":"Le Conseil 🎲","details":"<div class='scenario-block'><h3>S1 — Range-Bound Consolidation €55-65 <span class='proba'>[28%]<\/span><\/h3><p>Ultimatum expires with rhetoric but no kinetic action. Sanctions tighten incrementally. TTF trades €55-65 range through end-March. Vol sellers win. Injection season begins slowly.<\/p><p class='votes'>Apex 25% · Sage 32% · Nova 28% · Blaise 30% · Lyra 28% · Dante 25% · Felix 28%<\/p><\/div><div class='scenario-block'><h3>S2 — Sanctions Escalation Lifts Floor to €65-75 <span class='proba'>[22%]<\/span><\/h3><p>Secondary sanctions on Iranian oil buyers + EU Russian LNG ban April 1 create dual supply shock. TTF reprices floor to €65-75. Rabobank's €61 Q2 forecast becomes floor, not ceiling. Injection economics deteriorate sharply.<\/p><p class='votes'>Apex 25% · Sage 20% · Nova 22% · Blaise 22% · Lyra 20% · Dante 25% · Felix 20%<\/p><\/div><div class='scenario-block'><h3>S3 — Ceasefire Relief Rally to €42-48 <span class='proba'>[15%]<\/span><\/h3><p>Diplomatic breakthrough via Oman back-channel. Hormuz reopens. TTF crashes 25-30%. Long liquidation amplifies the move. But structural storage deficit prevents sub-€40 — this is a bounce, not a regime change.<\/p><p class='votes'>Apex 12% · Sage 18% · Nova 15% · Blaise 12% · Lyra 18% · Dante 15% · Felix 15%<\/p><\/div><div class='scenario-block'><h3>S4 — Refill Panic Reprices Summer to €70+ <span class='proba'>[15%]<\/span><\/h3><p>April injection starts 3-4 weeks behind schedule due to LNG constraints + mild but persistent demand. Market realizes 90% by Nov 1 is physically impossible. Sum-26 reprices to €70+. Q3/Q4 backwardation inverts to contango.<\/p><p class='votes'>Apex 15% · Sage 12% · Nova 15% · Blaise 18% · Lyra 15% · Dante 12% · Felix 18%<\/p><\/div><div class='scenario-block'><h3>S5 — Full Hormuz Closure — TTF €80-110 <span class='proba'>[10%]<\/span><\/h3><p>US strikes or Iranian mine deployment triggers full Strait closure. 20% of global LNG transits halt. TTF spikes to €80-110. EU activates emergency demand curtailment. Strategic reserves tapped. 2022 playbook replayed.<\/p><p class='votes'>Apex 10% · Sage 8% · Nova 10% · Blaise 8% · Lyra 10% · Dante 12% · Felix 12%<\/p><\/div><div class='scenario-block'><h3>S6 — EU Regulatory Capitulation (ETS suspension + ban delay) <span class='proba'>[7%]<\/span><\/h3><p>Political pressure forces Brussels to suspend EUA auctions and delay Russian LNG ban 6 months. EUA crashes to €55. TTF eases €3-5. Coal-to-gas switching threshold drops. Short-term bearish, medium-term bullish (delays refill).<\/p><p class='votes'>Apex 8% · Sage 5% · Nova 5% · Blaise 5% · Lyra 5% · Dante 8% · Felix 5%<\/p><\/div><div class='scenario-block'><h3>S7 — Black Swan: Gulf Infrastructure Attack → TTF €100+ <span class='proba'>[3%]<\/span><\/h3><p>Iran strikes Saudi/UAE energy infrastructure in retaliation. Global energy panic. TTF tests €100-150. IEA emergency coordination. G7 emergency summit. Demand destruction kicks in within 2-3 weeks at these prices.<\/p><p class='votes'>Apex 5% · Sage 5% · Nova 5% · Blaise 5% · Lyra 4% · Dante 3% · Felix 2%<\/p><\/div><p class='consensus'><strong>🎯 Consensus:<\/strong> The Council sees a 50% probability of TTF staying in the €55-75 range (S1+S2), with a 25% combined probability of severe upside (S5+S7) and only 15% for meaningful downside (S3). The refill panic scenario (S4, 15%) is the most underpriced risk — it materializes regardless of geopolitics.<\/p><div class='dissent'><div class='dissent-label'>🔥 Dissent — Dante 🔥<\/div><div class='dissent-text'>The Council's ceasefire probability (15%) is too low. Trump needs a foreign policy win before the 2026 midterms — Iran's economy is crumbling under sanctions — both sides have incentives to deal. The market is so anchored on escalation that a surprise ceasefire would cause a flash crash far worse than the 15% probability implies. My ceasefire probability: 25%. The asymmetry is in the puts, not the calls.<\/div><\/div>","sig":"Le Conseil 🎲"},{"t":"analysis","badge":"📊 🌍 Scénario Géopolitique","title":"Ultimatum Night — 7 Geopolitical Scenarios Impacting Gas Markets","hook":"Trump's 48-hour ultimatum to Iran expires tonight at ~21:00 UTC with no diplomatic breakthrough. The Council assessed 7 real geopolitical scenarios from the last 48 hours — the probability-weighted TTF sits at €70.5/MWh, 19% above spot.","authorWord":"Seven scenarios, one reality: the gas market's fate tonight is being decided in Washington and Tehran, not on any trading floor.","author":"Le Conseil 🌍","details":"<div class='scenario-block'><h3>S1 — US Secondary Sanctions on Iranian Oil Buyers <span class='proba'>[30%]<\/span><\/h3><p>Trump responds to ultimatum expiry by imposing OFAC secondary sanctions on China, India, Turkey for Iranian crude purchases (~1.2 mb/d). Oil-gas complex tightens. TTF adds €5-8/MWh as crude-linked LNG contracts reprice upward over weeks.<\/p><p class='votes'>Apex 35% · Sage 28% · Nova 30% · Blaise 32% · Lyra 27% · Dante 25% · Felix 33%<\/p><\/div><div class='scenario-block'><h3>S2 — Hormuz Selective Passage Continues (Status Quo) <span class='proba'>[25%]<\/span><\/h3><p>Trump issues harsh rhetoric but no immediate military action. Iran maintains enhanced inspections. Ras Laffan at 83%, 4-5 cargoes/week diverted to Asia. TTF range-bound €55-65 as market prices duration.<\/p><p class='votes'>Apex 22% · Sage 30% · Nova 25% · Blaise 25% · Lyra 28% · Dante 20% · Felix 24%<\/p><\/div><div class='scenario-block'><h3>S3 — Back-Channel Ceasefire via Oman <span class='proba'>[15%]<\/span><\/h3><p>Oman-mediated talks produce a 72-hour humanitarian pause. Hormuz transit normalizes within days. TTF crashes 25-30% to €42-48 as speculative longs unwind. JKM collapses to $13-14.<\/p><p class='votes'>Apex 12% · Sage 18% · Nova 15% · Blaise 14% · Lyra 17% · Dante 20% · Felix 12%<\/p><\/div><div class='scenario-block'><h3>S4 — US Strikes Iranian Military/Naval Assets <span class='proba'>[12%]<\/span><\/h3><p>Pentagon executes targeted strikes on IRGC Navy bases and Bandar Abbas port infrastructure. Iran retaliates with mine deployment in Hormuz. Full closure for 48-72 hours. TTF gaps to €80-110, JKM to $22-30. Insurance rates for Gulf transit quadruple.<\/p><p class='votes'>Apex 15% · Sage 8% · Nova 12% · Blaise 10% · Lyra 12% · Dante 18% · Felix 10%<\/p><\/div><div class='scenario-block'><h3>S5 — EU Delays Russian LNG Ban Under Political Pressure <span class='proba'>[10%]<\/span><\/h3><p>EU Energy Council (Mar 27) debates postponing the April 1 Russian LNG ban by 90 days, citing storage emergency at 28.9%. Hungary and Austria lead the revolt. If delayed, TTF drops €3-5 on relief. If confirmed, injection panic intensifies.<\/p><p class='votes'>Apex 8% · Sage 10% · Nova 12% · Blaise 10% · Lyra 8% · Dante 10% · Felix 12%<\/p><\/div><div class='scenario-block'><h3>S6 — Iranian Mine/Tanker Attack in Strait (Black Swan Bull) <span class='proba'>[5%]<\/span><\/h3><p>IRGC deploys naval mines or attacks an LNG carrier. Global LNG insurance collapses. All carriers reroute via Cape of Good Hope (+12 days). TTF spikes €100-150 in 2022-style panic. Strategic reserves activated.<\/p><p class='votes'>Apex 5% · Sage 3% · Nova 4% · Blaise 6% · Lyra 5% · Dante 5% · Felix 7%<\/p><\/div><div class='scenario-block'><h3>S7 — Comprehensive Iran-Israel Peace Deal (Black Swan Bear) <span class='proba'>[3%]<\/span><\/h3><p>Trump brokers a comprehensive deal: Iran halts nuclear program in exchange for full sanctions relief. Hormuz fully reopens. Russian gas flows resume via Turkey. TTF crashes to €25-30 — below pre-war levels as relief overwhelms fundamentals.<\/p><p class='votes'>Apex 3% · Sage 3% · Nova 2% · Blaise 3% · Lyra 3% · Dante 2% · Felix 2%<\/p><\/div><p class='consensus'><strong>🎯 Consensus:<\/strong> The Council converges on a 55% probability of continued pressure (S1+S2)
