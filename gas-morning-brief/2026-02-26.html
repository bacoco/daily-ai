<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gas Morning Brief — 26 Février 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    html.light .details div[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */

        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }

      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }
      .dt-reader .dt-r-body p { margin-bottom: 18px; }
      .dt-reader .dt-r-body strong { color: #fff; font-weight: 600; }
      .dt-reader .dt-r-body a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
      .dt-reader .dt-r-body .quote { border-left: 3px solid var(--blue); padding: 14px 18px; margin: 20px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-style: italic; font-size: .95rem; line-height: 1.6; color: rgba(255,255,255,.9); }
      .dt-reader .dt-r-body .dissent { margin-top: 24px; padding: 16px 18px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
      .dt-reader .dt-r-body .dissent .dissent-label { font-family: 'Inter', sans-serif; font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
      .dt-reader .dt-r-body .dissent .dissent-text { font-size: .9rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
      .dt-reader .dt-r-author { margin-top: 20px; padding: 12px 16px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); }
      .dt-reader .dt-r-author .aw-text { font-family: 'Merriweather', serif; font-size: .88rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }

  <script>
  const DATA = [{"t":"home","home":true,"date":"26 Février 2026","henryWord":"The warm reprieve is a mirage. Storage at 30% with the Russian LNG ban activating in five weeks means the refill math is brutal — and a stratospheric vortex disruption could extend winter demand just as the market prices spring. Asymmetry favours upside protection.","articles":[{"badge":"⚡ 💰 Price Action","title":"HH Bounces Off 5-Month Low at $2.86 — TTF Holds €31.50 as Regas Margins Turn Positive","idx":1},{"badge":"⚡ 🚢 LNG & Flows","title":"US Export Dip Meets Europe's Insatiable Appetite — Finland Terminal Struggles at 15% Utilization","idx":2},{"badge":"⚡ ⚡ Power & Carbon","title":"Wind Fades From March — Prompt Power Braces for Nuclear Gaps","idx":3},{"badge":"📊 🌡️ Weather & Demand","title":"Omega Block to Polar Vortex: Europe's Week 2-4 Demand Whipsaw","idx":4},{"badge":"📊 📦 Storage Watch","title":"Withdrawal Pace Accelerates — EU Drops Below 30.5%, Refill Math Turns Brutal","idx":5},{"badge":"📊 💣 Geopolitics & Regulation","title":"April LNG Ban Countdown & the Canadian TTF Pivot","idx":6},{"badge":"📊 🎯 Risk Flags & Outlook","title":"Three Triggers: Vortex Disruption × April LNG Ban × Storage Panic Injection","idx":7},{"badge":"🏛️ Verdict du Conseil","title":"21 Trades Audités — 15 Retenus, 6 Éliminés","idx":8}]},{"t":"alert","badge":"⚡ 💰 Price Action","title":"HH Bounces Off 5-Month Low at $2.86 — TTF Holds €31.50 as Regas Margins Turn Positive","hook":"Henry Hub March futures clawed back to $2.985 after touching a 5-month low, but the ascending channel is broken and technicals scream bearish. TTF holds firm at €31.50 with a widening premium over NBP pulling LNG cargoes into Europe.","authorWord":"HH whipsawed from Storm Fern highs to 5-month lows — now stuck between EIA's $4.12 forecast and a bearish chart. TTF-NBP spread divergence is the real trade.","author":"Blaise 🧮","details":"<p><b>🇺🇸 Henry Hub:<\/b> March futures settled at <b>$2.985/MMBtu<\/b> (midday 25 Feb, ▲+$0.07 vs prev session; <a href='https://naturalgasintel.com/news/midday-futures-natural-gas-climbs-ahead-of-march-contract-roll-off/' target='_blank'>NGI<\/a>), bouncing from a 5-month intraday low near $2.86 (close 24 Feb; <a href='https://www.onenewspage.com/n/Markets/1zte55o1uq/Natural-Gas-Winter-Spike-Erased-As-Futures-Sink.htm' target='_blank'>OneNewsPage<\/a>). April contract firmed to <b>$2.921<\/b> (midday 25 Feb, ▲+$0.09; NGI) as March roll-off positioning kicked in with rising LNG feed gas demand. The bounce came despite warmer forecasts — traders eyeing Golden Pass ramp-up as a structural floor. A brief <b>CME Globex technical halt<\/b> on natgas and metals rattled order flow mid-session (<a href='https://www.reuters.com/business/cme-group-halts-metals-natural-gas-trading-technical-issues-2026-02-25/' target='_blank'>Reuters<\/a>).<\/p><p><b>🇪🇺 TTF:<\/b> Front-month trading around <b>€31.45–31.50/MWh<\/b> (session 25 Feb; <a href='https://europeangashub.com/ttf-gas-prices-rise-as-premium-boosts-european-regas-margins.html' target='_blank'>European Gas Hub<\/a>), holding above the 5-week lows posted last week. The TTF premium over JKM has widened meaningfully, pulling DES NWE–TTF spreads to levels that return most continental regas terminals to <b>positive merchant margins<\/b> — a structural shift that should attract incremental LNG cargoes to Europe. NBP has weakened relative to TTF, creating intra-European divergence and limiting UK terminal economics.<\/p><p><b>📊 Technicals & Positioning:<\/b> HH has <b>broken below its ascending channel<\/b> from the 2023 lows — the 100 SMA crossed below the 200 SMA, confirming bearish momentum (<a href='https://fxdailyreport.com/natural-gas-natgas-usd-price-technical-analysis-for-february-25-2026/' target='_blank'>FX Daily Report<\/a>). Key support at <b>$2.86<\/b> (yesterday's low); a failure reopens $2.50–$1.90 range. Resistance sits at the broken channel floor near <b>$3.08–3.10<\/b>. For TTF, €31.00 is near-term support with €32.50 as resistance. Note the massive disconnect: EIA just hiked its HH forecast to <b>$4.60/MMBtu for Feb and $4.12 for March<\/b> — a 40% upward revision driven by Storm Fern inventory damage (<a href='https://markets.financialcontent.com/stocks/article/marketminute-2026-2-25-winter-storm-fern-triggers-historic-energy-crisis-eia-hikes-natural-gas-price-forecasts-by-40' target='_blank'>MarketMinute<\/a>) — yet spot has crashed 35% below that forecast. Either the EIA is stale or the market is pricing a warm finish to winter too aggressively.<\/p><p><b>💡 Trade Ideas:<\/b><br>1. <b>Long HH Apr/May spread<\/b> (CME NG J6–K6): With April moving to prompt and LNG feed gas demand rising, the front spread could tighten. Entry around –$0.06; target flat; stop at –$0.12.<br>2. <b>Long TTF–NBP Mar spread<\/b> (ICE): The widening TTF premium with positive regas margins should persist as storage sits near 5-year lows. Consider buying the TTF-NBP differential at current ~€2.50/MWh equivalent, targeting €3.50.<br>3. <b>HH Apr $3.25 calls<\/b> (CME NG options): If EIA's $4.12 March forecast has any validity and the market has overshot to the downside, cheap OTM calls offer asymmetric upside. Indicative premium ~$0.05–0.08/MMBtu.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>The HH bounce is a dead cat. Warm March forecasts and rising Haynesville production mean the path of least resistance is lower — $2.50 before $3.50. The TTF-NBP spread trade looks attractive but liquidity in the cross is thin and the NBP March expiry is imminent. Better to wait for April spreads to establish.<\/div><\/div>","sig":"Blaise 🧮 — Gas Morning Brief"},{"t":"alert","badge":"⚡ 🚢 LNG & Flows","title":"US Export Dip Meets Europe's Insatiable Appetite — Finland Terminal Struggles at 15% Utilization","hook":"US weekly LNG loadings fell to 34 cargoes (w/e Feb 18, −3 w/w per EIA), even as Europe hoovers up a record 14.2 Mt for February. Finland's Inkoo FSRU limps at 15% utilization — a diversification headache as storage sits at barely 30%.","authorWord":"Record EU arrivals mask fragile supply chains: US dip, Mukran ice aftermath, Finnish underuse all flash yellow.","author":"Henry 🦉","details":"<p><b>🚢 EU LNG Arrivals & Sendout:<\/b> Europe is set to import <b>14.20 Mt<\/b> of LNG in February (Kpler forecast, 23 Feb), up from 13.67 Mt in January and <b>+22% YoY<\/b> — a new monthly record. US-origin cargoes account for 57% at 8.05 Mt. Russian LNG volumes edged down to ~1.6 Mt (vs 1.68 Mt in Jan). Since the start of the heating season (Oct 2025), cumulative LNG flows have exceeded <a href='https://tass.com/economy/2091659' target='_blank'>60 bcm<\/a> per TASS/GIE data. Despite these record arrivals, EU storage has drawn down to ~30% full vs a 5-year average of 49% — the structural deficit remains acute.<\/p><p><b>🇺🇸 US Export Loadings:<\/b> <a href='https://lngprime.com/americas/us-weekly-lng-exports-drop-to-34-cargoes/178094/' target='_blank'>US plants shipped 34 cargoes<\/a> in the week ending 18 Feb (EIA data, 20 Feb), <b>down 3 cargoes w/w<\/b>. Sabine Pass loaded 7 cargoes, Corpus Christi 6. US total export capacity is running at ~15 Bcf/d (<a href='https://jpt.spe.org/a-decade-after-first-sabine-pass-cargo-us-lng-exports-hit-15-bcf-d' target='_blank'>SPE/EIA, 25 Feb<\/a>). Golden Pass commissioning continues but no commercial cargo yet. Kpler projects US→EU volumes surging to 11.19 Mt in March as refill urgency mounts.<\/p><p><b>📊 Spread Snapshot:<\/b> TTF front-month settled at <b>€31.45/MWh<\/b> (24 Feb close). With Asian demand at multi-year lows — China Feb LNG imports forecast at just 3.38 Mt, lowest since April 2018 (Kpler, 23 Feb) — the TTF-JKM spread remains narrow, keeping the Atlantic Basin arbitrage wide open for European buyers.<\/p><p><b>⚠️ Terminal Status:<\/b> Germany's Mukran FSRU (Deutsche ReGas) has resumed sendout after ~3 weeks of ice blockage, but downstream impacts linger — Czech Republic pipeline receipts from Germany restarted at only ~10 mcm/d (<a href='https://eadaily.com/en/news/2026/02/23/lng-for-ukraine-and-the-czech-republic-is-stuck-the-successful-fight-against-ice-in-germany-has-backfired-on-everyone' target='_blank'>EADaily, 23 Feb<\/a>/ENTSOG). Finland's Inkoo FSRU is running at just <b>15% utilization<\/b> in 2026, averaging ~2 mcm/d sendout (<a href='https://eadaily.com/en/news/2026/02/25/the-lng-terminal-has-become-a-headache-for-finland-diversification-has-gone-wrong' target='_blank'>EADaily, 25 Feb<\/a>/GIE). Norwegian pipeline nominations (Langeled, Europipe) remain stable with no material changes flagged on ENTSOG in the last 48h.<\/p><p><b>💡 Trade Ideas:<\/b><br/>1. <b>Long TTF Mar/Apr spread:<\/b> With storage at 30% and refill mandates kicking in, March sendout demand should stay elevated vs April shoulder softening. Entry ~€1.50/MWh, target €2.50.<br/>3. <b>Long TTF Summer 26 outright:<\/b> Storage at 30% vs 90% fill mandate creates a structural bid under Summer 26. Buy dips below €28/MWh.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>Record LNG floods are the story, not the marginal US dip. Chinese demand weakness is a gift for European buyers — the real risk is that China restocks aggressively in Q2, snapping the JKM-TTF spread back. Finland's underutilization is a political issue, not a market signal. Focus on the 60 bcm already delivered and the refill math, not terminal utilization rates.<\/div><\/div>","sig":"Henry 🦉 — Gas Morning Brief"},{"t":"tech","badge":"⚡ ⚡ Power & Carbon","title":"Wind Fades From March — Prompt Power Braces for Nuclear Gaps","hook":"German day-ahead crashed 20% to €75/MWh as wind surged, but forecasts flip sub-normal from 2 Mar. With Heysham and Hartlepool still offline, the spark spread squeeze is about to reverse.","authorWord":"Wind masking structural tightness — watch the March flip.","author":"Sage 🦎","details":"<p><b>Power Spot:<\/b> UK day-ahead baseload settled at <b>£77.37/MWh<\/b> (25 Feb close; <a href='https://www.prestigebusiness.energy/marketreports/energy-market-update25february2026' target='_blank'>Prestige 25 Feb<\/a>). German OTC day-ahead fell 20.6% to <b>€75/MWh<\/b> (25 Feb, LSEG via <a href='https://uk.marketscreener.com/news/german-otc-day-ahead-baseload-power-price-down-20-6-at-75-eur-mwh-lseg-data-ce7e5cdbda81f62c' target='_blank'>MarketScreener<\/a>). French day-ahead for 26 Feb indicated around <b>€64.31/MWh<\/b> (<a href='https://www.kelwatt.fr/prix/electricite-spot-cours-marche-gros' target='_blank'>Kelwatt/EPEX<\/a>). Renewables drove the selloff: UK wind hit 17.2 GW (44.6% of mix) mid-week, but the forecast flips bearish — <b>wind drops below seasonal normal from 2 March through at least 11 March<\/b> across NW Europe. That's the setup for a prompt snap-back.<\/p><p><b>Carbon:<\/b> EUA Dec-26 settled at <b>€70.67/t<\/b> (25 Feb close, −€0.67 vs 20 Feb's €71.34; <a href='https://www.prestigebusiness.energy/marketreports/energy-market-update25february2026' target='_blank'>Prestige<\/a>). Down from €92+ in mid-January — a 23% rout driven by fund selling and ETS review noise (<a href='https://seekingalpha.com/article/4872767-eu-carbon-price-slides-amid-policy-noise-fund-selling' target='_blank'>Seeking Alpha/ING<\/a>). UKA Dec-26 at <b>£45.62/t<\/b> (25 Feb, −£1.93 w/w). The €69 support held last week; <a href='https://www.reuters.com/sustainability/boards-policy-regulation/industry-asks-eu-keep-free-carbon-permits-longer-2026-02-24/' target='_blank'>Reuters reports<\/a> BusinessEurope is lobbying to extend free allocations, keeping headline risk alive ahead of EC's Q3 ETS reform proposal. Clean spark spreads compressed as gas and carbon both eased, but <b>gas remains in the money over coal<\/b> — dark spreads are deeply negative at current coal prices ($116/t ARA) and carbon costs.<\/p><p><b>Nuclear & Outages:<\/b> UK nuclear fleet is under stress — Hartlepool 2 offline since Jun 2025, Heysham 2-7 tripped mid-Feb, Torness 2 in planned outage until April. French fleet broadly stable but weak wind forecasts for France into early March. The combination of fading wind + nuclear gaps = gas-for-power demand likely to spike in the first week of March.<\/p><p><b>💡 Trade Ideas:<\/b><br/>1. <b>Buy UK Mar day-ahead baseload vs sell Feb<\/b> — structural tightness from nuclear outages + wind drop-off should lift Mar prompt vs the wind-suppressed Feb print. Target £80–85/MWh.<br/>2. <b>Long EUA Dec-26 at €70–71<\/b> — €69 support has held twice; if March Council delivers no concrete ETS dilution, the overshoot unwinds toward €78–80. Stop below €68.<br/><\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The EUA at €70 is not a buy — it's a falling knife. The EC review in Q3 is real, not noise, and the market priced €83/t average for 2026 assuming no policy dilution. With BusinessEurope lobbying hard and competitiveness concerns mounting, the next stop is €65. The wind fade is a 10-day weather blip, not a structural story — solar ramps hard in March.<\/div><\/div>","sig":"Sage 🦎 — Gas Morning Brief"},{"t":"analysis","badge":"📊 🌡️ Weather & Demand","title":"Omega Block to Polar Vortex: Europe's Week 2-4 Demand Whipsaw","hook":"A textbook omega block is baking central Europe 12-15°C above normal this week — but a high-impact polar vortex disruption entering official scenario for March 2 threatens a violent cold reversal just as heating demand was being written off.","authorWord":"Omega warmth masks a stratospheric time bomb. The vol regime is two-way — don't fade the whipsaw.","author":"Sage 🦎","details":"<p><b>Week 1 (now):<\/b> A powerful <a href='https://www.severe-weather.eu/global-weather/heat-dome-taste-of-spring-omega-block-end-february-2026-europe-mk/' target='_blank'>omega blocking pattern<\/a> is driving temperatures 12–15°C above the long-term average across central and western Europe (25 Feb, Severe Weather EU). Readings in the low-to-mid 20s°C are expected from Iberia through Germany and the Benelux through end-February. HDDs are collapsing — the last 7 days have tracked ~30% below the 10-year normal for late February across the NW European heating basket. The prompt-month March gas contract is <a href='https://www.naturalgasintel.com/news/market-open-natural-gas-edges-higher-ahead-of-expiration-but-warm-outlook-limits-upside/' target='_blank'>weakening into expiry<\/a> (26 Feb, NGI), with mild early-March weather priced in and limited fundamental catalysts.<\/p><p><b>Weeks 2-4 (Mar 8-22) — The Reversal Risk:<\/b> Meteorologist Andrej Flis flags a <a href='https://global-recruit.co.uk/25-2043-a-polar-vortex-disruption-on-march-2-2026-enters-official-high-impact-scenario-cold-arctic-air-could-spill-southward-explains-meteorologist-andrej-flis-mauvaise-nouvelle-for-travel/' target='_blank'>major polar vortex disruption entering official high-impact status on March 2<\/a> (26 Feb). When the stratospheric vortex weakens or splits, Arctic air masses migrate southward with a 10-14 day lag — placing the cold-air arrival squarely in the Mar 12-20 window. If this materialises, the HDD trajectory flips from a cumulative deficit vs the 30-year norm to a potential surplus, reigniting residential heating demand just as the market has positioned for spring shoulder. The <a href='https://wmo.int/media/update/global-seasonal-climate-update-march-april-may-2026' target='_blank'>WMO MAM 2026 seasonal outlook<\/a> (20 Feb) still leans above-normal for 30-60°N, but acknowledges elevated blocking-pattern uncertainty.<\/p><p><b>Demand Structure:<\/b> Industrial gas demand across NW Europe remains structurally soft (German manufacturing PMI sub-50 for 24 consecutive months), providing a floor under storage but limiting upside demand response. The real swing variable is residential heating: a 5°C miss vs current warm-biased Week 2-3 forecasts would add an estimated 15-20 mcm/d of incremental demand across the EU heating corridor. Meanwhile, accelerated Alpine snowmelt from this week's heat dome complicates the spring hydro refill picture — rapid runoff now means less gradual summer melt, potentially tightening the hydro-gas substitution balance in Q2.<\/p><p><b>💡 Trade Ideas:<\/b><br/>1. <b>Buy TTF Mar 12-21 HDD call spreads<\/b> — the vortex disruption lag targets this window; market is pricing near-zero cold risk for mid-March. Asymmetric payoff if Arctic air spills south.<br/><\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>The polar vortex disruption scenario is a low-probability tail. Most SSW events fail to deliver sustained surface cold in March — the climatological base rate is ~30% for meaningful mid-latitude impact. The market knows this and has correctly priced the warm consensus. Don't buy lottery tickets when storage is the real story.<\/div><\/div>","sig":"Sage 🦎 — Gas Morning Brief"},{"t":"tech","badge":"📊 📦 Storage Watch","title":"Withdrawal Pace Accelerates — EU Drops Below 30.5%, Refill Math Turns Brutal","hook":"EU storage hit 30.3% on Feb 24 with withdrawals running 5% above the 5-year norm. The sprint from sub-25% end-of-season lows to the 90% November mandate now requires record injection rates.","authorWord":"30.3% EU storage. 2,070 Bcf US. Both sides of the Atlantic drawing faster than seasonal norms — and refill season hasn't even started.","author":"Blaise 🧮","details":"<p><b>🇪🇺 EU Storage — AGSI+ Data (Feb 24)<\/b><br>EU aggregate storage fell to <b>30.34%<\/b> full (~347 TWh of 1,143 TWh working volume), shedding 0.25 percentage points in a single gas day (<a href='https://agsi.gie.eu/' target='_blank'>AGSI+, Feb 25 update<\/a>). That's roughly <b>33 bcm<\/b> remaining of ~108 bcm total capacity. As of Feb 17, levels sat <b>16.4 pp below the 5-year average<\/b> and down sharply from 43.3% a year ago — a <b>13 pp YoY deficit<\/b> (<a href='https://tass.com/economy/2088951' target='_blank'>TASS, Feb 19<\/a>). Germany is the worst performer at <b>22.99%<\/b> by Feb 16 (<a href='https://news-pravda.com/world/2026/02/22/2088296.html' target='_blank'>News-Pravda, Feb 22<\/a>). Net withdrawals since the Oct 13 heating season start have exceeded <b>56 bcm<\/b> — already 1 bcm more than the total volume injected last summer (<a href='https://tass.com/economy/2088951' target='_blank'>TASS<\/a>).<\/p><p><b>📉 Trajectory & End-of-Season Projection<\/b><br>The 7-day withdrawal pace (Feb 17–24) averaged ~0.3 pp/day. If this continues through a late-March heating season end, EU storage would exit winter at <b>~21–23%<\/b> — approaching the 2022 trough of 25–26% and within striking distance of the 2018 all-time low of 17.7% (<a href='https://logos-pres.md/en/news/european-gas-market-low-reserves-and-geopolitical-risks/' target='_blank'>Logos Press<\/a>). From a 22% starting point, reaching the <b>90% regulatory mandate by Nov 1<\/b> requires injecting ~73 bcm in roughly 7 months — that's <b>10.4 bcm/month<\/b>, well above the 2023 record injection pace of ~9 bcm/month. At current EU consumption rates (~3.5 TWh/day per AGSI+), remaining storage covers roughly <b>99 days of gross withdrawals<\/b>.<\/p><p><b>🇺🇸 US Storage — EIA (Week Ending Feb 13)<\/b><br>US working gas stood at <b>2,070 Bcf<\/b> after a 144 Bcf withdrawal, sitting <b>59 Bcf below year-ago<\/b> and <b>123 Bcf under the 5-year average<\/b> (<a href='https://www.premierenergymanagement.com/post/eia-natural-gas-storage-report-week-ending-february-13-2026' target='_blank'>Premier Energy, Feb 20<\/a>). East and Midwest regions are running 17–18% below 5-year norms. The next EIA report (week ending Feb 20) is expected to show a much smaller draw as mild weather crushed heating demand. Feed gas to LNG terminals held at 18.0 Bcf/d, keeping export-driven structural demand intact.<\/p><p><b>💡 Trade Ideas<\/b><br>1. <b>Long TTF Summer Q3 2026 vs short Winter Q4 2026:<\/b> If refill panic materializes, summer prices must rise to incentivize aggressive injection — the summer-winter spread compresses. Entry near current levels; target €2–3/MWh compression.<br>3. <b>Long Henry Hub Mar–Apr spread:<\/b> US storage deficit to 5-year average widens if late-season cold returns. The mild-weather reprieve creates a dip-buying opportunity on the front spread.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The 90% mandate is a political target, not a physical law. The EU watered it down once in 2023 and will do so again if the cost of compliance becomes politically unbearable. At current TTF levels, the refill incentive is already priced in — buying summer on the assumption of panic is buying the consensus, not the contrarian trade. Watch for a mandate revision before betting on brute-force injection.<\/div><\/div>","sig":"Blaise 🧮 — Gas Morning Brief"},{"t":"alert","badge":"📊 💣 Geopolitics & Regulation","title":"April LNG Ban Countdown & the Canadian TTF Pivot","hook":"Europe's Russian LNG import ban kicks in April 2026 — and buyers are already locking in Atlantic Basin alternatives priced against TTF. The supply chain restructuring is no longer theoretical.","authorWord":"Russian LNG ban April 2026. Centrica locks 10yr Canadian gas at TTF. EU sanctions architecture hardening despite Hungarian vetoes.","author":"Henry 🦉","details":"<p><b>🔒 The April 2026 Inflection Point<\/b><\/p><p>The EU's 19th sanctions package — now <a href='https://usa.news-pravda.com/russia/2026/02/24/667103.html' target='_blank'>extended through February 2027<\/a> — includes the landmark ban on Russian LNG imports effective April 2026. This is the structural shift the market has been pricing for months: ~15-18 bcm/yr of Russian LNG that flowed to European terminals must now find alternative homes in Asia, while Europe must source replacements. Arctic LNG 2 remains hobbled by sanctions on ice-class carriers, with only sporadic shipments reaching buyers via shadow fleet transfers. The ban's implementation will be the first real stress-test of whether Europe can enforce maritime restrictions on LNG as effectively as it has on crude.<\/p><p><b>🇨🇦 Canadian Gas Goes TTF-Linked: A Structural Signal<\/b><\/p><p><a href='https://www.lngindustry.com/liquid-natural-gas/25022026/centrica-energy-and-whitecap-enter-long-term-natural-gas-supply-agreement/' target='_blank'>Centrica's 10-year deal with Whitecap<\/a> for 50,000 MMBtu/d of Canadian feed gas — priced against TTF, not Henry Hub — is a quiet revolution. It signals that European buyers are building long-term Atlantic Basin supply chains with European price exposure baked in from the wellhead. As LNG Canada Phase 1 ramps and Cedar LNG/Woodfibre progress, Western Canada becomes a credible diversification leg. The TTF-linkage aligns producer and buyer incentives around European seasonality and storage cycles rather than US Gulf Coast dynamics.<\/p><p><b>🏛️ Sanctions Architecture: Hardening Despite Fractures<\/b><\/p><p><a href='https://www.euronews.com/2026/02/22/hungary-blocks-adoption-of-eu-sanctions-package-until-ukrainian-oil-supplies-resume' target='_blank'>Hungary's veto of the 20th package<\/a> grabs headlines, but the structural trajectory is clear: each successive package ratchets tighter. The 20th package pivots toward maritime enforcement — legal frameworks for stopping, inspecting and potentially confiscating tankers carrying Russian oil. For gas, the key watch is whether future packages extend maritime restrictions to LNG carriers, which would further constrain Arctic LNG 2 and Yamal spot reloads to Asia.<\/p><p><b>💡 Trade Ideas<\/b><\/p><p>1. <b>Long TTF Q3-26 / Short TTF Q3-27:<\/b> The April Russian LNG ban creates a one-time tightening in summer injection season 2026 as replacement cargoes are sourced. By 2027, Canadian and US Gulf Coast volumes will have adjusted. Target +€2-3/MWh spread widening.<br>2. <b>Long JKM-TTF Q2-26:<\/b> Russian LNG displaced from Europe must find Asian homes, compressing JKM premium. But European replacement demand should support TTF. Fade the JKM-TTF spread narrowing.<br>3. <b>Long TTF Winter-26 calls (€42-45 strike):<\/b> If the April ban implementation is messy or Arctic LNG 2 disruptions cascade, winter 26 storage could start from a lower base. Cheap optionality on regulatory execution risk.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>The April LNG ban is already fully priced — TTF forward curves embed the displacement. Hungarian vetoes are noise; sanctions only tighten at the margin. The Canadian deal is a 2028 delivery — irrelevant for the 2026 curve. Focus on the storage math, not the geopolitical theater.<\/div><\/div>","sig":"Henry 🦉 — Gas Morning Brief"},{"t":"strategy","badge":"📊 🎯 Risk Flags & Outlook","title":"Three Triggers: Vortex Disruption × April LNG Ban × Storage Panic Injection","hook":"The market is complacently pricing warm weather and smooth refill — but three tail risks could shatter this consensus in weeks, not months. Asymmetry favours upside protection.","authorWord":"Warm consensus masks three triggers that could break the range: polar vortex Mar 12, Russian LNG ban Apr 1, and refill rate stress-test from 22%.","author":"La Rédaction 🦊","details":"<p><b>🔴 TOP 3 RISKS (ranked by probability × impact)<\/b><\/p><p>1. <b>Storage refill failure<\/b> (probability: 35%, impact: HIGH) — EU storage exiting winter at ~22% means the 90% Nov 1 mandate requires 10.4 bcm/month injection — above the 2023 record of ~9 bcm/month. If the April Russian LNG ban disrupts even 2 bcm of monthly supply during peak injection, the math breaks.<br>2. <b>Polar vortex disruption cold snap<\/b> (probability: 25%, impact: MEDIUM-HIGH) — The March 2 stratospheric event, if it delivers surface cold by Mar 12-20, extends heating season by 2-3 weeks and delays injection start. Every week of delayed injection from a 22% starting point is ~1.5 bcm of lost refill capacity.<br>3. <b>Chinese LNG restocking snap-back<\/b> (probability: 20%, impact: MEDIUM) — China's Feb imports at 3.38 Mt are the lowest since 2018. A policy-driven restocking push in Q2 would absorb the surplus cargoes currently flowing to Europe, tightening Atlantic Basin arbitrage.<\/p><p><b>🐂 BULL SCENARIO:<\/b> Cold mid-March (vortex delivers) + messy April LNG ban implementation + Chinese restocking → TTF spikes to €38-42/MWh by April. <b>Trade:<\/b> Long TTF Apr €35 calls (ICE), ~€0.80/MWh premium; risk/reward 4:1 if TTF touches €38.<\/p><p><b>🐻 BEAR SCENARIO:<\/b> Warm March-April extends into May + EU waters down 90% mandate to 80% + Golden Pass first cargo adds structural supply → TTF tests €26-28/MWh. <b>Trade:<\/b> Long TTF Apr €28 puts (ICE), ~€0.40/MWh; requires a sustained warm pattern to pay off.<\/p><p><b>🃏 WILD CARD:<\/b> Arctic LNG 2 ice-class carrier seized or Arctic route blocked → Russian LNG supply permanently impaired + insurance costs spike for shadow fleet → TTF gaps above €45. <b>Trade:<\/b> Long TTF Win-26 €50 calls for ~€0.30/MWh — lottery ticket with 15:1 payoff on a tail event.<\/p><p><b>📅 CATALYSTS THIS WEEK:<\/b><br>• Thu 26 Feb: EIA US storage report (week ending Feb 20) — small draw expected, but any surprise deepens the deficit narrative<br>• Thu 26 Feb: March HH contract expiry/roll — positioning squeeze risk<br>• Fri 27 Feb: GIE AGSI+ weekly update — will EU break below 30%?<br>• Mon 2 Mar: Polar vortex disruption onset — watch stratospheric temperature models<br>• Tue 1 Apr: Russian LNG import ban activation — implementation clarity needed<\/p><p><b>📊 CONVICTION MATRIX:<\/b><br>• Highest conviction: Long TTF Summer-26 outright — storage refill bid is structural (probability 60%, payoff 2:1)<br>• Best asymmetry: Long TTF Apr €35 calls — cheap optionality on vortex + ban combo (probability 25%, payoff 4:1)<br>• Contrarian: Short JKM-TTF Q2 — Chinese weakness persists while Europe bids aggressively (probability 40%, payoff 1.5:1)<\/p><p><b>💡 Trade Ideas:<\/b><br>1. <b>Long TTF Apr €35 call / Short TTF Apr €28 put (risk reversal):<\/b> Collect put premium to fund upside; net cost near zero. Expresses the view that downside is limited by storage but upside is explosive on any supply disruption.<br>3. <b>Long HH Apr straddle:<\/b> EIA storage report + March expiry + weather model volatility = realised vol should exceed implied. Buy the Apr $3.00 straddle.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The bull case relies on three low-probability events coinciding. The base case is simpler: warm spring, orderly LNG ban implementation (most Russian volumes already rerouted), and a modest mandate revision to 85%. TTF drifts to €28-30 by April as the storage fear premium bleeds out. Don't fight the seasonal pattern with tail-risk trades.<\/div><\/div>","sig":"La Rédaction 🦊 — Gas Morning Brief"},{"t":"analysis","badge":"🏛️ Verdict du Conseil","title":"21 Trades Audités — 15 Retenus, 6 Éliminés","hook":"Quatre agents ont vote sur chaque trade idea de cette edition. Chaque trade est presente avec son rationale complet, les votes individuels (Iris, Dante, Felix, Lyra), et la decision finale avec la raison.","authorWord":"15 trades solides retenus. 6 elimines (doublons, parametres manquants, contradictions). Le detail de chaque verdict ci-dessous.","author":"La Rédaction 🦊","details":"<h3>✅ Trades Retenus (15/21)<\/h3><div style=\"margin:12px 0;padding:14px 16px;background:rgba(16,185,129,.06);border-left:3px solid #10b981;border-radius:0 12px 12px 0;\"><div style=\"margin-bottom:6px;\"><div style=\"display:flex;justify-content:space-between;align-items:flex-start;\"><b style=\"font-size:.95rem;line-height:1.3;\">Long HH Apr/May spread (CME NG J6-K6)<\/b><span style=\"font-size:.8rem;white-space:nowrap;margin-left:10p       btn.textContent=isLight?'☀️':'🌙';
      localStorage.setItem('theme',isLight?'light':'dark');
    });
  })();
  </script>
</body>
</html>
