<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gas Morning Brief — 20 Février 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    html.light .details div[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }

      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }
      .dt-reader .dt-r-body p { margin-bottom: 18px; }
      .dt-reader .dt-r-body strong { color: #fff; font-weight: 600; }
      .dt-reader .dt-r-body a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
      .dt-reader .dt-r-body .quote { border-left: 3px solid var(--blue); padding: 14px 18px; margin: 20px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-style: italic; font-size: .95rem; line-height: 1.6; color: rgba(255,255,255,.9); }
      .dt-reader .dt-r-body .dissent { margin-top: 24px; padding: 16px 18px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
      .dt-reader .dt-r-body .dissent .dissent-label { font-family: 'Inter', sans-serif; font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
      .dt-reader .dt-r-body .dissent .dissent-text { font-size: .9rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
      .dt-reader .dt-r-author { margin-top: 20px; padding: 12px 16px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); }
      .dt-reader .dt-r-author .aw-text { font-family: 'Merriweather', serif; font-size: .88rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }

  <script>
  const DATA = [{"t":"home","home":true,"date":"20 Février 2026","henryWord":"HH breaks below  on a yawn-inducing EIA print while EU storage scrapes multi-year lows at 33%. The market is sleepwalking into refill season — record LNG arrivals mask a structural deficit that one March cold snap could expose. Watch the tails, not the base case.","articles":[{"badge":"⚡ 💰 Price Action","title":"HH March Settles Below $3 as EIA Draw Fails to Inspire — TTF Holds €31.88","idx":1},{"badge":"⚡ 🚢 LNG & Flows","title":"LNG Floods Europe as Record January Imports Meet Weak Asian Demand","idx":2},{"badge":"⚡ ⚡ Power & Carbon","title":"EUA Rebounds Above €71 but Political ETS Overhang Persists","idx":3},{"badge":"📊 🌡️ Weather & Demand","title":"Europe Turns Mild Into Late February — US Weekend Cold a Short-Lived Blip","idx":4},{"badge":"📊 📦 Storage Watch","title":"EU Storage at ~33% — Germany Hits Record Low 24% as Refill Clock Ticks","idx":5},{"badge":"📊 💣 Geopolitics & Regulation","title":"Russia-Ukraine Talks Collapse — EU Russian LNG Ban Countdown Enters Final Phase","idx":6},{"badge":"📊 🎯 Risk Flags & Outlook","title":"Storage Squeeze vs LNG Comfort — The Bull/Bear Divide Widens","idx":7}]},{"t":"alert","badge":"⚡ 💰 Price Action","title":"HH March Settles Below $3 as EIA Draw Fails to Inspire — TTF Holds €31.88","hook":"Henry Hub March futures closed down 0.86% to ~$2.98/MMBtu on Feb 19 despite a 144 Bcf EIA withdrawal. TTF day-ahead held near €31.88/MWh as mild European temps cap upside.","authorWord":"HH front-month slipped below the psychological $3 level after a nearly in-line EIA storage draw failed to spark buying interest. TTF remains rangebound near €32 as a warming Europe offsets low storage anxiety.","author":"Blaise 🧮","details":"<p><strong>Henry Hub<\/strong> March futures settled at <strong>~$2.98/MMBtu<\/strong> (close 19 Feb) ▼−0.86% vs prev, breaking below the key $3 support. The <a href='https://www.eia.gov/dnav/ng/ng_stor_wkly_s1_w.htm' target='_blank'>EIA reported<\/a> a net withdrawal of <strong>144 Bcf<\/strong> for the week ended Feb 14, bringing total working gas to <strong>2.07 Tcf<\/strong> — 123 Bcf below the 5-year average and 59 Bcf below year-ago. Despite the draw, the print was largely in line with consensus, triggering a sell-the-news reaction.<\/p><p><strong>TTF<\/strong> day-ahead traded near <strong>€31.88/MWh<\/strong> (close 19 Feb) ◆ roughly flat vs prev, as <a href='https://oilprice.com/Latest-Energy-News/World-News/European-Gas-Prices-Slide-as-Mild-Weather-Tempers-Supply-Fears.html' target='_blank'>mild European weather<\/a> continued to temper supply fears. Month-to-date, HH prompt-month has averaged $3.23/MMBtu within a tight $3.01–$3.51 range.<\/p><p><strong>Key levels:<\/strong> HH support at $2.90 (rising trendline from summer 2025); resistance at $3.10–$3.15. TTF support at €30.50; resistance at €33. Weekend cold in the US (single digits through Tuesday) could offer a short-term bounce, but the seasonal trend favors softening demand into March.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>The $3 break may be a bear trap. US storage at 123 Bcf below the 5-year average entering late February — with weekend cold approaching — suggests the market is underpricing late-season weather risk. A sharp cold snap in early March could force rapid repositioning above $3.20.<\/div><\/div>","sig":"Blaise 🧮 · Gas Morning Brief"},{"t":"alert","badge":"⚡ 🚢 LNG & Flows","title":"LNG Floods Europe as Record January Imports Meet Weak Asian Demand","hook":"European LNG imports hit a monthly record in January but storage remains critically low. Mukran reopens after Baltic ice lockdown as US LNG export utilization stays high.","authorWord":"Record LNG arrivals can't mask the storage deficit. Europe is pulling every available cargo while Asia stays quiet — but the real test comes when restocking season begins in April.","author":"Henry 🦉","details":"<p><strong>European LNG arrivals<\/strong> hit a <a href='https://www.naturalgasintel.com/news/europes-storage-deficit-expected-to-continue-pulling-us-lng-during-strong-restocking-season/' target='_blank'>monthly record in January 2026<\/a>, driven by Europe's storage deficit pulling US cargoes across the Atlantic. Weak Asian demand — particularly from China and Japan — has widened the TTF-JKM spread, making Europe the premium destination for spot LNG.<\/p><p><strong>Mukran LNG terminal<\/strong> (Germany) has <a href='https://oilprice.com/Latest-Energy-News/World-News/Germanys-Mukran-LNG-Terminal-Reopens-After-Frozen-Baltic-Is-Cleared.amp.html' target='_blank'>reopened after Baltic Sea ice restrictions<\/a> were cleared, restoring a critical import route for both Germany and the Czech Republic. The terminal had achieved record deliveries in Q2 2025 before winter ice disrupted operations.<\/p><p><strong>Pipeline flows:<\/strong> Norway remains the primary pipeline supplier alongside the Netherlands and Belgium. Russian direct pipeline gas to Germany remains effectively zero, though indirect 'hidden' routes persist in small volumes. <a href='https://www.naturalgasintel.com/news/lng-floods-europe-keeping-lid-on-ttf-prices-despite-storage-deficit/' target='_blank'>The LNG flood is keeping TTF prices capped<\/a> despite the underlying storage anxiety, with analysts projecting EU storage could end the heating season at just ~26% by end of March.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>The record LNG flow narrative overstates the cushion. If Asian demand resurges in Q2 (as Chinese industrial recovery signals suggest), the arbitrage window closes fast. Europe cannot count on continued Asian weakness to solve its 26% end-of-winter storage problem.<\/div><\/div>","sig":"Henry 🦉 · Gas Morning Brief"},{"t":"tech","badge":"⚡ ⚡ Power & Carbon","title":"EUA Rebounds Above €71 but Political ETS Overhang Persists","hook":"EU carbon prices clawed back above €71/mtCO2e after hitting fresh lows, but the Merz ETS review bombshell continues to weigh on sentiment. Spark spreads remain compressed.","authorWord":"Carbon is finding a floor near €71 after the Merz-induced selloff, but the political uncertainty around ETS reform keeps a lid on any sustained recovery. Gas-to-power economics remain tight.","author":"Sage 🦎","details":"<p><strong>EUA carbon<\/strong> (Dec 2026 contract) recovered to <strong>~€71/mtCO2e<\/strong> (mid-Feb), climbing back from the sharp selloff triggered by Chancellor Merz's call to revise or postpone the ETS. <a href='https://www.spglobal.com/energy/en/news-research/latest-news/energy-transition/021326-eu-carbon-prices-hit-fresh-lows-as-political-rift-over-ets-intensifies' target='_blank'>S&P Global reported EUAs at €72.95<\/a> on Feb 12 before the political shockwave. Merz later softened his stance, but the damage to long-term carbon confidence lingers.<\/p><p><strong>Power markets:<\/strong> European day-ahead prices reflect the mild weather regime, with reduced heating demand easing gas-for-power call. The <a href='https://www.qualenergia.it/pro/documenti/quota-rinnovabili-4-9-21-31-pun-5-9-21-e-mwh-11309-petrolio-wti-b-6929-co2-3-9-21-e-ton-6133/' target='_blank'>Italian PUN settled at €112.12/MWh<\/a> (19 Feb). Spark spreads remain compressed as gas prices hover near €32/MWh — the gas-to-power switch price sits around €35/MWh at current carbon levels, meaning coal remains marginally competitive in some regions.<\/p><p>Wind generation across NW Europe has been above seasonal norms this week, further reducing gas burn for power. The key watch is the ETS policy trajectory: any concrete EU Commission action on Merz's proposal could send EUAs sharply in either direction.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The ETS political noise is overblown. The EU Commission has repeatedly defended the system, and Merz backtracked within days. Carbon below €70 would be a structural buying opportunity — the 2030 reduction targets haven't changed, and the MSR continues to absorb surplus allowances.<\/div><\/div>","sig":"Sage 🦎 · Gas Morning Brief"},{"t":"analysis","badge":"📊 🌡️ Weather & Demand","title":"Europe Turns Mild Into Late February — US Weekend Cold a Short-Lived Blip","hook":"European temperatures are warming toward spring-like levels this weekend while a sharp but brief US cold snap enters Saturday. The structural heating demand decline is accelerating.","authorWord":"The weather setup is bearish for gas demand on both sides of the Atlantic through early March. Europe's mild spell reduces withdrawal pressure on critically low storage, while the US cold is too brief to shift the seasonal trajectory.","author":"Sage 🦎","details":"<p><strong>Europe Week 2-4:<\/strong> After a cold start to February (which contributed to record German storage draws), conditions are <a href='https://meteonews.ch/en/News/N16207/Mild-with-heavy-rainfall-in-some-regions-%E2%80%93-Interim-report-February-2026' target='_blank'>turning significantly milder<\/a> over the weekend, with temporary spring-like conditions and highs well into double digits across Central Europe. Paris is expected to reach 11°C by the weekend after near-freezing midweek conditions.<\/p><p><strong>US outlook:<\/strong> <a href='https://www.aga.org/research-policy/resource-library/natural-gas-market-indicators-february-19-2026/' target='_blank'>NOAA projects above-normal temperatures<\/a> for most of the continental US into early March, with probabilities reaching 80% in portions of the Midwest. A weekend cold system (single digits and 20s through Tuesday) will briefly spike demand, but it's the last significant cold pulse before spring moderation.<\/p><p><strong>HDD trajectory:<\/strong> For the week ending Feb 14, US temperatures were 16.2% warmer than the previous year and 9.3% warmer than the 30-year normal (population-weighted HDDs). Cumulative heating demand for the 2025-26 season is tracking above normal due to Winter Storm Fern's impact in January, but the February deficit is narrowing rapidly.<\/p><p><strong>Structural demand:<\/strong> European residential heating demand is decelerating as the season winds down. Alpine snow conditions remain strong (positive for hydro reservoir replenishment in spring), while wind generation has been above seasonal averages across NW Europe, reducing gas-for-power call.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>The mild outlook may be lulling markets into complacency. March cold snaps have historically caught European markets off-guard (see March 2013, 2018). With EU storage at multi-year lows, even a 5-day cold deviation from the mild baseline could trigger outsized price reactions.<\/div><\/div>","sig":"Sage 🦎 · Gas Morning Brief"},{"t":"tech","badge":"📊 📦 Storage Watch","title":"EU Storage at ~33% — Germany Hits Record Low 24% as Refill Clock Ticks","hook":"EU gas storage has fallen below end-of-last-heating-season levels. Germany at a record-low 24% and Netherlands below 15% — the 90% by November 1 mandate looks increasingly challenging.","authorWord":"The storage picture is the most concerning structural factor in European gas. At ~33% with 6 weeks of winter remaining, the refill race to 90% by November will require sustained LNG inflows and price incentives throughout summer.","author":"Blaise 🧮","details":"<p><strong>EU storage:<\/strong> Total EU gas storage stands at approximately <strong>~33%<\/strong> full (~35.9 bcm), having fallen <a href='https://tass.com/economy/2088951' target='_blank'>below end-of-last-heating-season levels<\/a>. This is the lowest mid-February reading in roughly 8 years. Analysts project EU storage could reach just <strong>~26% by end of March<\/strong> when winter officially ends.<\/p><p><strong>Country spotlight:<\/strong> <a href='https://brusselssignal.eu/2026/02/dangerously-low-germanys-gas-storage-has-fallen-to-record-lows/' target='_blank'>Germany has hit a record low of 23.95%<\/a> (60.14 TWh of working gas), while <a href='https://tass.com/economy/2087703' target='_blank'>Netherlands has fallen below 15%<\/a> — both all-time lows for mid-February. These two countries represent the largest share of EU underground storage capacity.<\/p><p><strong>US storage:<\/strong> The <a href='https://www.eia.gov/dnav/ng/ng_stor_wkly_s1_w.htm' target='_blank'>EIA reported<\/a> total working gas at <strong>2.07 Tcf<\/strong> (week ending Feb 14), 123 Bcf below the 5-year average of 2.193 Tcf and 59 Bcf below year-ago. The South Central deficit is particularly notable for summer 2026 pricing.<\/p><p><strong>Refill outlook:<\/strong> The EU's 90% storage mandate by November 1 will require an aggressive refill season starting in April. At current levels, Europe needs to inject ~60+ bcm over ~7 months — feasible but requiring consistently high LNG imports and premium pricing to attract cargoes away from Asia. EIA's February STEO projects US inventories could enter the 2026-27 heating season ~5% above the 5-year average, a more comfortable picture.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The 26% end-of-March projection assumes normal weather. If March delivers even average cold, we could exit winter below 22% — a level that would trigger panic buying and send TTF summer strip sharply higher. The market is not pricing the tail risk of a failed refill season.<\/div><\/div>","sig":"Blaise 🧮 · Gas Morning Brief"},{"t":"alert","badge":"📊 💣 Geopolitics & Regulation","title":"Russia-Ukraine Talks Collapse — EU Russian LNG Ban Countdown Enters Final Phase","hook":"Oil prices surged 3% after Russia-Ukraine talks broke down. Russian oil transit via Ukraine blocked since Jan 27, and the EU's Russian LNG import ban deadline approaches — reshaping supply routes.","authorWord":"The geopolitical backdrop is tightening. Failed peace talks, Ukraine oil transit blockade, and the approaching EU Russian LNG ban create a structural supply risk premium that markets are underpricing at current TTF levels.","author":"Henry 🦉","details":"<p><strong>Russia-Ukraine:<\/strong> <a href='https://oilprice.com/Energy/Crude-Oil/Oil-Prices-Surge-Nearly-3-After-Russia-Ukraine-Talks-Break-Down.html' target='_blank'>Peace talks have broken down<\/a>, with oil prices surging nearly 3% on the news. Russian oil transit through Ukraine has been blocked since January 27, 2026, with Hungary's Foreign Minister confirming the halt. The Geneva process appears stalled, removing any near-term prospect of sanctions relief or restored energy flows.<\/p><p><strong>EU Russian LNG ban:<\/strong> The EU's ban on Russian LNG imports is approaching its implementation deadline (~67 days from mid-Feb). This will primarily impact <a href='https://www.arctictoday.com/' target='_blank'>Arctic LNG 2 cargoes<\/a> and Yamal LNG transshipments. Russia's Parliament has ratified a cooperation agreement with China on the Yamal LNG project, signaling a pivot to Asian offtake — but Arctic shipping constraints and sanctions on ice-class vessels complicate this redirect. A German icebreaker sent to rescue a stranded LNG tanker itself <a href='https://eu.news-pravda.com/world/2026/02/16/168711.html' target='_blank'>broke down and got stuck in Arctic ice<\/a>, highlighting the operational fragility of the Northern Sea Route.<\/p><p><strong>ETS regulation:<\/strong> The Merz ETS controversy has eased after he walked back his most aggressive statements, but <a href='https://gmk.center/en/news/carbon-prices-in-europe-fall-in-february-amid-calls-for-ets-review/' target='_blank'>calls for ETS review persist<\/a> across multiple EU member states. The EU CBAM (Carbon Border Adjustment Mechanism) has formally commenced in 2026, adding cost pressure to high-carbon imports.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>The Russian LNG ban's actual supply impact may be overstated. Most Russian LNG was already being redirected to Asia before the ban, and European terminals have ample capacity for alternative suppliers. The ban is more symbolic than structural at this point.<\/div><\/div>","sig":"Henry 🦉 · Gas Morning Brief"},{"t":"strategy","badge":"📊 🎯 Risk Flags & Outlook","title":"Storage Squeeze vs LNG Comfort — The Bull/Bear Divide Widens","hook":"Markets are caught between record-low EU storage and record-high LNG arrivals. The next catalyst is whether Asian demand resurges before Europe's refill season.","authorWord":"The risk distribution is asymmetric: downside from here is limited by storage fundamentals while upside tail risks (cold snap, Asian demand return, LNG ban disruption) could produce outsized moves. The market is pricing the base case while ignoring the tails.","author":"La Rédaction 🦊","details":"<p><strong>TOP 3 RISKS (probability × impact):<\/strong><\/p><ol><li><strong>Failed EU refill season<\/strong> (Medium prob, Very High impact): EU storage exiting winter at ~26% means the 90%-by-November mandate requires a historically aggressive injection pace. Any disruption — Asian demand surge, LNG outages, pipeline maintenance — could make the target unachievable, sending TTF summer strip to €40+.<\/li><li><strong>Late-season cold snap<\/strong> (Medium prob, High impact): March cold events have historically caught markets off-guard. With German storage at record-low 24%, even a 5-day cold deviation could trigger panic buying and outsized price moves.<\/li><li><strong>ETS policy shock<\/strong> (Low prob, High impact): The Merz controversy opened a political fault line. Any concrete EU Commission action to weaken the ETS could crash EUA prices to €60, altering gas-to-power economics and indirectly pressuring TTF.<\/li><\/ol><p><strong>BULL SCENARIO (1-2 weeks):<\/strong> Weekend US cold extends into a broader pattern shift. Asian LNG spot demand ticks up, narrowing the TTF-JKM arbitrage. Short covering pushes HH back above $3.15, TTF to €34. Probability: ~25%.<\/p><p><strong>BEAR SCENARIO (1-2 weeks):<\/strong> Mild weather dominates both continents into early March. LNG arrivals stay at flood levels. EIA next-week print comes in soft. HH tests $2.80, TTF drifts toward €29. Probability: ~35%.<\/p><p><strong>CATALYSTS TO WATCH:<\/strong><\/p><ul><li><strong>Feb 20-22:<\/strong> US weekend cold intensity — actual vs forecast<\/li><li><strong>Feb 26 (Wed):<\/strong> Next EIA storage report<\/li><li><strong>Late Feb:<\/strong> ECMWF March outlook update — any cold signal changes everything<\/li><li><strong>Ongoing:<\/strong> EU Russian LNG ban implementation details<\/li><li><strong>Early March:<\/strong> AGSI+ end-of-February storage print — the last winter reading<\/li><\/ul><p><strong>POSITIONING CONTEXT:<\/strong> The TTF forward curve is in mild contango (summer above winter) reflecting refill anxiety. HH curve is flat-to-backwardated as the market prices post-Fern normalization. Fund positioning shows elevated shorts in HH — a crowded trade if weather surprises. Storage + weather + LNG all point to a rangebound market near-term with asymmetric upside tail risk.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The asymmetric framing understates the bear case. New US LNG export capacity (Golden Pass, Plaquemines expansion) coming online in H1 2026 could structurally oversupply the Atlantic basin. If Asian demand stays weak, TTF could trend toward €25 by summer — well below what the refill anxiety narrative suggests.<\/div><\/div>","sig":"La Rédaction 🦊 · Gas Morning Brief"},{"t":"end","end":true,"disclaimer":"This document is an automated summary for informational purposes only. It does not constitute investment advice, trading recommendation, or regulated financial analysis. Data comes from free public sources, potentially delayed (15-30 min for prices, D+1 for EIA/GIE stocks). Figures may contain errors from scraping or AI interpretation. Always verify on primary sources before any decision. Generated by LLM — qualitative analyses reflect statistical patterns, not expert judgment."}];

  document.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY;startTime=Date.now();deltaX=0;axis='';dragging=true;cards[cur].classList.remove('anim');},{passive:true});
  document.addEventListener('touchmove',e=>{if(!dragging)return;const dx=e.touches[0].clientX-startX;const dy=e.touches[0].clientY-startY;if(!axis){if(Math.abs(dx)>8||Math.abs(dy)>8){axis=Math.abs(dx)>Math.abs(dy)?'x':'y';}else return;}if(axis==='y')return;deltaX=dx;cards[cur].style.transform=`translate(-50%,-50%) translateX(${deltaX}px) rotate(${deltaX*0.012}deg)`;var p=Math.min(Math.abs(deltaX)/200,1);var sc=0.93+p*0.07;var op=0.4+p*0.6;var nxt=deltaX<0?cards[cur+1]:cards[cur-1];if(nxt){nxt.style.transform='translate(-50%,-50%) scale('+sc+')';nxt.style.opacity=op;}},{passive:true});
  document.addEventListener('touchend',e=>{if(!dragging)return;dragging=false;if(axis==='y'){axis='';return;}axis='';const card=cards[cur];card.classList.add('anim');if(cards[cur+1])cards[cur+1].classList.add('anim');if(cards[cur-1])cards[cur-1].classList.add('anim');const velocity=Math.abs(deltaX)/(Date.now()-startTime);const threshold=velocity>0.5?30:60;if(deltaX>threshold&&cur===0){window.location.href='../index.html';}else if(deltaX<-threshold&&cur===total-1){window.location.href='../index.html';}else if(deltaX<-threshold&&cur<total-1){cur++;update();}else if(deltaX>threshold&&cur>0){cur--;update();}else{card.style.transform='';}},{passive:true});
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&cur<total-1){cur++;update();}if(e.key==='ArrowLeft'&&cur>0){cur--;update();}});
  document.addEventListener('click',e=>{if(e.target.id==='restart')go(0);const article=e.target.closest('.home-article');if(article){const idx=parseInt(article.dataset.goto);if(!isNaN(idx))go(idx);}});
  /* === DESKTOP SPLIT-VIEW === */
  let dtShell=null, dtSelected=0;
  function buildDesktop(){
    if(dtShell)return;
    dtShell=document.createElement('div');
    dtShell.className='desktop-shell';
    // Sidebar
    const sb=document.createElement('nav');
    sb.className='dt-sidebar';
    const logoDate=DATA[0]&&DATA[0].home?`<div class="dt-logo">Gas Morning Brief</div><div class="dt-date">${DATA[0].date||'20 Février 2026'}</div>`:`<div class="dt-logo">Gas Morning Brief</div><div class="dt-date">20 Février 2026</div>`;
    sb.innerHTML=logoDate;
    DATA.forEach((d,i)=>{
      const item=document.createElement('div');
      item.className='dt-nav-item'+(i===0?' dt-selected':'');
      item.tabIndex=0;
      item.dataset.idx=i;
      const emoji=d.home?'📰':d.end?'✅':(d.badge||'').split(' ')[0]||'📄';
      const label=d.home?'Accueil':d.end?'Fin':(d.badge||'').split(' ').slice(1).join(' ')||'';
      const title=d.home?'Sommaire':d.end?'Briefing terminé':d.title||'';
      item.innerHTML=`<div class="dt-nav-badge">${emoji}</div><div class="dt-nav-info"><div class="dt-nav-label">${label}</div><div class="dt-nav-title">${title}</div></div><div class="dt-nav-arrow">›</div>`;
      item.addEventListener('click',()=>selectDesktop(i));
      sb.appendChild(item);
    });
    // Reader
    const rd=document.createElement('div');
    rd.className='dt-reader';
    rd.innerHTML='<div class="dt-reader-inner"></div>';
    dtShell.appendChild(sb);
    dtShell.appendChild(rd);
    document.body.appendChild(dtShell);
    selectDesktop(0);
  }
  function selectDesktop(idx){
    dtSelected=idx;
    const items=dtShell.querySelectorAll('.dt-nav-item');
    items.forEach((it,i)=>it.classList.toggle('dt-selected',i===idx));
    const d=DATA[idx];
    const inner=dtShell.querySelector('.dt-reader-inner');
    if(d.home){
      const arts=d.articles?d.articles.map(a=>`<div class="dt-nav-item" style="cursor:pointer;opacity:.7;padding:10px 14px;margin-bottom:4px;border-radius:10px;border:1px solid rgba(255,255,255,.06);" onclick="selectDesktop(${a.idx})"><div class="dt-nav-badge">${a.badge.split(' ')[0]}</div><div class="dt-nav-info"><div class="dt-nav-label">${a.badge.split(' ').slice(1).join(' ')}</div><div class="dt-nav-title">${a.title}</div></div><div class="dt-nav-arrow">›</div></div>`).join(''):'';
      inner.innerHTML=`<div class="dt-r-home-henry"><div class="label">🦊 L'Édito du Jour</div><div class="text">${d.henryWord||''}</div></div>${arts}`;
    } else if(d.end){
      inner.innerHTML=`<div style="text-align:center;padding:60px 0;"><div style="font-size:3.5rem;margin-bottom:16px;">🎉</div><h2 style="font-size:1.6rem;font-weight:800;margin-bottom:12px;">Briefing terminé !</h2><p style="color:var(--muted);font-size:1rem;margin-bottom:24px;line-height:1.5;">Vous avez parcouru le briefing du jour. À demain !</p><a href="../index.html" style="display:inline-block;padding:12px 32px;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;">📰 Toutes les éditions</a></div>`;
    } else {
      const authorHtml=d.authorWord?`<div class="dt-r-author"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author||''}</div></div>`:'';
      inner.innerHTML=`<span class="dt-r-badge ${d.t||''}">${d.badge||''}</span><h1 class="dt-r-title">${d.title||''}</h1>${authorHtml}<div class="dt-r-hook">${d.hook||''}</div><div class="dt-r-body">${d.details||''}</div><div class="dt-r-sig">Gas Morning Brief — 20 Février 2026</div>`;
    }
    dtShell.querySelector('.dt-reader').scrollTop=0;
    // Scroll sidebar item into view
    items[idx]&&items[idx].scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  function destroyDesktop(){
    if(dtShell){dtShell.remove();dtShell=null;}
  }
  function checkDesktop(){
    if(window.innerWidth>=900){
      deck.style.display='none';
      buildDesktop();
      dtShell.style.display='';
    } else {
      if(dtShell)dtShell.style.display='none';
      deck.style.display='';
      update(false);
    }
  }
  // Keyboard nav for desktop
  document.addEventListener('keydown',e=>{
    if(window.innerWidth<900)return;
    if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();if(dtSelected<DATA.length-1)selectDesktop(dtSelected+1);}
    if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();if(dtSelected>0)selectDesktop(dtSelected-1);}
  });
  checkDesktop();window.addEventListener('resize',checkDesktop);
  // Theme toggle
  (function(){
    const btn=document.getElementById('themeToggle');
    const saved=localStorage.getItem('theme');
    if(saved==='light'){document.documentElement.classList.add('light');btn.textContent='☀️';}
    btn.addEventListener('click',()=>{
      const isLight=document.documentElement.classList.toggle('light');
      btn.textContent=isLight?'☀️':'🌙';
      localStorage.setItem('theme',isLight?'light':'dark');
    });
  })();
  </script>
</body>
</html>
