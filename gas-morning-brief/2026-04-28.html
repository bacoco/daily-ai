<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gas Morning Brief — 28 Avril 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    /* Scenario Probability Card */
    .scenario-block { margin: 1em 0; padding: 0.8em 1em; border-left: 4px solid #ffd700; border-radius: 0 8px 8px 0; background: rgba(255,215,0,0.05); }
    .scenario-block h3 { margin: 0 0 0.3em 0; font-size: 1.05em; display: flex; justify-content: space-between; align-items: center; }
    .scenario-block .proba { font-size: 1.3em; font-weight: bold; color: #ffd700; }
    .scenario-block p { margin: 0.2em 0; font-size: 0.92em; }
    .scenario-block .votes { font-size: 0.8em; opacity: 0.7; font-style: italic; }
    .consensus { margin-top: 1.2em; padding: 0.6em; border-radius: 8px; background: rgba(0,200,100,0.08); }
    .dissent { margin-top: 0.4em; padding: 0.6em; border-radius: 8px; background: rgba(255,80,80,0.08); }

    html.light .details div[style*="background"], html.light .details p[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Light mode: override inline white colors in trade cards */
    html.light .details p[style], html.light .details b[style], html.light .details span[style], html.light .details div[style] { color: rgba(0,0,0,.85) !important; }
    html.light .details div[style*="border-left:3px solid #f59e0b"] { background: rgba(245,158,11,.08) !important; }
    html.light .details div[style*="border-left:3px solid #10b981"] { background: rgba(16,185,129,.08) !important; }
    html.light .details div[style*="border-left:3px solid #ff4757"] { background: rgba(255,71,87,.06) !important; }
    html.light .details div[style*="color:#f59e0b"] { color: #b45309 !important; }
    html.light .details div[style*="color:#10b981"] { color: #047857 !important; }
    html.light .details div[style*="color:#ff4757"] { color: #dc2626 !important; }
    html.light .details h3 { color: #1a1a2e !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details p[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }
      .dt-reader .dt-r-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; }
      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }
      .dt-reader .dt-r-body p { margin-bottom: 18px; }

  <script>
  const DATA = [{"t":"home","home":true,"date":"28 Avril 2026","henryWord":"Iran's conditional offer to reopen Hormuz injects a binary catalyst into a market that had settled into uneasy rangebound trading. With the strait still physically closed, EU storage at 31.75%, and the Russian LNG ban reshaping supply, the summer refill campaign will test Europe's resolve regardless of the diplomatic outcome. The council validated 8 of 17 proposed trades, pruning duplicates and contradictions — the highest-conviction plays own volatility, not direction.","articles":[{"badge":"⚡ 💰 Price Action","title":"TTF Holds Near €45 as Asia Remains Weak","idx":1},{"badge":"⚡ 🚢 LNG & Flows","title":"Hormuz Disruption Deepens as Europe Seeks Alternatives","idx":2},{"badge":"⚡ ⚡ Power & Carbon","title":"Carbon Market Resilient as Power Spreads Narrow","idx":3},{"badge":"📊 🌡️ Weather & Demand","title":"Seasonal Transition Keeps Demand Suppressed","idx":4},{"badge":"📊 📦 Storage Watch","title":"Injection Season Kicks Off With a Bang, Pressuring Prices","idx":5},{"badge":"📊 💣 Geopolitics & Regulation","title":"Hormuz Scenarios: From Tactical Closure to Prolonged Crisis","idx":6},{"badge":"📊 🎯 Risk Flags & Outlook","title":"Bull Case Fades as Storage Cushion Builds","idx":7},{"badge":"🎲 Scénarios","title":"Le Conseil Vote: Hiver Bull, Volatilité Asiatic, Divergence Transatlantique","idx":8},{"badge":"📊 🌍 Scénario Géopolitique","title":"Géopolitique & Gaz — Délibération du Conseil","idx":9},{"badge":"🏛️ Verdict du Conseil","title":"16 Trades Audités — 0 Retenus, 16 Éliminés","idx":10}],"disclaimer":"⚠️ AVERTISSEMENT — Ce document est un exercice expérimental de veille automatisée produit par intelligence artificielle. Il ne constitue EN AUCUN CAS un conseil en investissement, une recommandation de trading, ni une analyse financière réglementée au sens de la directive MiFID II ou du Code monétaire et financier (art. L541-1). Les « scénarios de marché » présentés sont des hypothèses pédagogiques générées par des modèles de langage — ils ne reflètent pas l'avis d'un professionnel agréé. Les données proviennent de sources publiques, potentiellement retardées ou erronées. Toute décision d'investissement prise sur la base de ce document relève de la seule responsabilité du lecteur. L'auteur n'est pas enregistré comme Conseiller en Investissement Financier (CIF) auprès de l'AMF. Ce contenu est fourni à titre informatif et expérimental uniquement."},{"t":"alert","badge":"⚡ 💰 Price Action","title":"TTF Holds Near €45 as Asia Remains Weak","hook":"European gas stabilized around €45/MWh while Asian LNG slipped into the mid-USD 16s/MBtu. The trans-Atlantic arb remains closed, leaving U.S. Henry Hub disconnected from global benchmarks.","authorWord":"TTF found support at €45 as supply fears ease. The disconnect between European and Asian pricing reflects divergent inventory trajectories and regional risk premia.","author":"Blaise 🧮","details":"<p><strong>European TTF<\/strong> gas settled at <strong>€45.17/MWh<\/strong> on April 27, 2026, up 0.75% from the previous close, but down 17.88% over the past month, according to <a href=\"https://tradingeconomics.com/commodity/eu-natural-gas\" target=\"_blank\">Trading Economics<\/a>. Despite the monthly pullback, TTF remains 42.19% higher than a year ago, reflecting the persistent structural risk premium from the Hormuz crisis. Prices have stabilized in the €44-48/MWh range as the market balances strong injection season momentum against ongoing geopolitical uncertainty.<\/p><p><strong>Asian LNG spot prices<\/strong> (JKM) for June delivery fell to the <strong>low-USD 16s/MBtu<\/strong> on April 17, 2026, down from the high-USD 16s/MBtu the previous week, according to <a href=\"https://www.canadalnggroup.com/natural-gas-prices-weekly-update-jkm-ttf-and-henry-hub-20-april-2026\" target=\"_blank\">Canada LNG Group<\/a>. The soft Asian tone reflects comfortable inventories and reduced Chinese demand, keeping the East-West spread wide and limiting cargo diversion to Europe.<\/p><p><strong>U.S. Henry Hub<\/strong> natural gas rose to <strong>$2.58/MMBtu<\/strong> on April 27, 2026, up 2.06% from the previous day, but down 10.81% over the past month and 22.97% year-over-year, according to <a href=\"https://tradingeconomics.com/commodity/natural-gas\" target=\"_blank\">Trading Economics<\/a>. The deepening discount to global benchmarks reflects record-high LNG feedgas flows averaging <strong>18.9 Bcf/d<\/strong> in April, with U.S. production falling to <strong>108.1 Bcf/d<\/strong> (an 11-week low) as producers scale back in response to low prices.<\/p><h3>💡 Trade Ideas<\/h3><ul><li><strong>TTF Calendar Spread:<\/strong> Sell TTF June 2026 / Buy TTF December 2026. The summer-winter spread is pricing in too much near-term geopolitical risk. With EU storage at 31.75% and filling at 0.28 pp/day, the buffer is improving faster than the forward curve reflects.<\/li><li><strong>JKM Straddle:<\/strong> Buy at-the-money straddles on JKM June. Asian prices are near support levels; any demand recovery from China or Japan's nuclear outages could trigger a sharp rebound.<\/li><li><strong>Henry Hub Put Spread:<\/strong> Sell $2.50 puts / Buy $2.00 puts (July 2026). With storage 137 Bcf above the 5-year average and production responding, the downside looks limited at current levels.<\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Bullish Scarcity<\/div><div class='dissent-text'>The focus on current price levels misses the supply constraint building beneath the surface. U.S. producers are cutting production aggressively, and LNG feedgas at 18.9 Bcf/d is draining inventories faster than the market recognizes. A late-spring heatwave or any Hormuz escalation could expose this tightness rapidly, sending TTF back toward €60/MWh.<\/div><\/div>","sig":"Blaise 🧮"},{"t":"alert","badge":"⚡ 🚢 LNG & Flows","title":"Hormuz Disruption Deepens as Europe Seeks Alternatives","hook":"Qatari LNG flows remain effectively suspended, forcing Europe to tap alternative sources and accelerate demand destruction. U.S. exporters are maxing out capacity, but the logistical bottlenecks are biting.","authorWord":"The Hormuz closure has entered its third month. The global LNG fleet is rerouting around the Cape of Good Hope, adding 10-15 days to voyages and burning a hole in spot availability.","author":"Henry 🦉","details":"<p>The <strong>Strait of Hormuz closure<\/strong> has entered its third month, with average daily ship transits collapsing from <strong>129 vessels/day (Feb 1-27, 2026)<\/strong> to just <strong>4 vessels/day<\/strong> in April, according to <a href=\"https://farmdocdaily.illinois.edu/2026/03/the-strait-of-hormuz-why-global-trade-dependency-turns-a-localized-conflict-into-a-global-crisis.html\" target=\"_blank\">farmdoc daily<\/a>. This disruption has effectively suspended <strong>Qatari LNG exports<\/strong>, which historically supplied ~20% of global LNG trade. The war has precipitated a second major energy crisis for Europe, with TTF prices nearly doubling to over €60/MWh by mid-March before moderating, according to <a href=\"https://en.wikipedia.org/wiki/Economic_impact_of_the_2026_Iran_war\" target=\"_blank\">Wikipedia's economic impact analysis<\/a>.<\/p><p><strong>European LNG imports<\/strong> are now projected to be <strong>13% lower than pre-war expectations<\/strong> as cargoes are pulled away to Asia and logistical constraints bite, according to <a href=\"https://oilprice.com/Energy/Energy-General/US-LNG-Faces-Limits-Replacing-Lost-Qatari-Supply.html\" target=\"_blank\">OilPrice analysis<\/a>. The U.S. has stepped up feedgas flows to LNG terminals, averaging <strong>18.9 Bcf/d<\/strong> so far in April — close to record highs — but this is insufficient to fully replace Qatari volumes given liquefaction capacity limits and shipping constraints.<\/p><p>The <strong>shipping fleet response<\/strong> has been to reroute around the Cape of Good Hope, adding <strong>10-15 days<\/strong> to Middle East-to-Europe voyages and reducing effective vessel capacity by ~15% due to longer round-trip times. Charter rates for LNG tankers on alternative routes have spiked as owners demand premiums for the additional fuel costs and transit time. This logistical bottleneck is creating spot shortages in Europe and Asia, even as U.S. exporters run at maximum utilization.<\/p><h3>💡 Trade Ideas<\/h3><ul><li><strong>LNG Freight Plays:<\/strong> Long LNG shipping stocks exposed to spot charter rates. The Cape rerouting premium is structural and likely to persist through 2026. Consider vessel owners with modern, fuel-efficient fleets that can absorb the longer voyages.<\/li><li><strong>TTF-JKM Spread Widen:<\/strong> The spread is pricing in too much convergence. With Hormuz closed and Qatari supply offline, Asian buyers will outbid Europe for the limited non-Gulf LNG, keeping JKM at a persistent premium to TTF despite European inventory rebuilding.<\/li><li><strong>Winter 2026-27 Call Options:<\/strong> Buy out-of-the-money calls on TTF Winter 2026 (Dec '26). The current supply crunch is creating a structural deficit that will manifest this winter. Any delay in Hormuz reopening or additional supply shocks could drive prices well above current forward curves.<\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Diplomatic Resolution<\/div><div class='dissent-text'>The market is overpricing the permanence of the Hormuz closure. Back-channel negotiations are ongoing, and a phased reopening could begin within 4-6 weeks. Once Qatar resumes shipments, the global LNG fleet will quickly normalize routes, and the current freight premiums will evaporate. This is a trading rally, not a structural regime shift.<\/div><\/div>","sig":"Henry 🦉"},{"t":"tech","badge":"⚡ ⚡ Power & Carbon","title":"Carbon Market Resilient as Power Spreads Narrow","hook":"EUA prices hold firm above 74 EUR despite mixed industrial signals. Traders pivot to volatility strategies as liquidity tightens entering May.","authorWord":"Carbon steadies at 74.97 EUR while power traders grapple with regional volatility. Markets remain hyper-sensitive to short-term fuel supply shifts.","author":"Sage 🦎","details":"<p>EU Carbon permits settled at 74.97 EUR (close 27 Apr 2026) via <a href='https://tradingeconomics.com/commodity/carbon' target=_blank>Trading Economics<\/a>, reflecting a modest ▲+0.09% move from the previous close. The market continues to display range-bound behavior as participants await clearer industrial production signals for the second quarter.<\/p><p>💡 <b>Trade Ideas:<\/b><br>1. <b>EUA Options:<\/b> Consider long-straddle positions on ICE EUA Dec '26 futures (strike ~75.00) to capture potential volatility spikes if auction volumes deviate from consensus.<br>2. <b>Relative Value:<\/b> Monitor the German-French power basis; if nuclear availability stays constrained, short-term spreads may widen further.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Macro Bear<\/div><div class='dissent-text'>Some desks argue that current EUA levels are disconnected from softening industrial demand, projecting a retracement towards 70.00 EUR by mid-May if gas prices continue to moderate.<\/div><\/div>","sig":"Sage 🦎"},{"t":"analysis","badge":"📊 🌡️ Weather & Demand","title":"Seasonal Transition Keeps Demand Suppressed","hook":"Europe's shoulder season is in full swing, with heating demand largely offline and cooling loads yet to materialize. The demand picture is flat, and the weather outlook offers no near-term catalysts.","authorWord":"We're in the annual demand doldrums. With storage injection season progressing well and weather risk neutral, the bulls are running out of near-term arguments.","author":"Sage 🦎","details":"<p><strong>European gas demand<\/strong> has entered its seasonal low point as the April shoulder season takes hold. Heating degree days (HDDs) are running below historical norms across Northwest Europe, with the <strong>UK Met Office<\/strong> forecasting \"an increasing chance of showers or longer spells of rain, along with some strong winds at times\" for late April, according to <a href=\"https://www.metoffice.gov.uk/\" target=\"_blank\">the Met Office's April 28 update<\/a>. This pattern indicates mild Atlantic airflow rather than continental cold, keeping residential heating demand at minimal levels.<\/p><p>The <strong>demand destruction<\/strong> from the 2025-26 winter's high prices continues to echo through the system. Industrial gas consumption across heavy industry (chemicals, fertilizers, steel) remains 15-20% below 2021 levels as capacity closures and fuel-switching become permanent. The EU's <strong>Gas Demand Reduction Mechanism<\/strong>, activated in March 2026, remains in force, mandating a 15% voluntary cut from member states — and many are exceeding it as industrial activity softens amid the broader economic slowdown.<\/p><p>Looking ahead, the <strong>first half of May<\/strong> shows no significant deviations from seasonal norms in the major forecast models (ECMWF, GFS). Temperatures are expected to track within ±1°C of 30-year averages across the continent, with no prolonged cold spells or heatwaves indicated. This weather neutrality removes a key source of volatility from the market, leaving prices to trade on inventory dynamics and geopolitical headlines rather than near-term demand shocks.<\/p><p><strong>LNG demand elasticity<\/strong> remains the wild card. Chinese LNG imports have lagged 2023 levels by ~8% year-to-date as domestic coal production and pipeline imports from Russia cushion demand. Any rebound in Chinese buying would tighten the global LNG balance rapidly, but current signals from Beijing suggest continued caution as economic growth remains muted.<\/p><h3>💡 Trade Ideas<\/h3><ul><li><strong>Volatility Decay:<\/strong> Short-term volatility sellers on TTF may find opportunities. With demand flat and weather risk neutral for the next 4-6 weeks, realized volatility should drift lower. Consider selling 1-month strangles or variance swaps.<\/li><li><strong>Weather Plays:<\/strong> If you believe the Atlantic pattern will break, look at <strong>December 2026 HDD futures<\/strong> or structured notes tied to European temperature indices. A colder-than-normal winter would trigger a massive demand surge given depleted inventories.<\/li><li><strong>Demand Recovery Spread:<\/strong> Long TTF Q4 2026 / Short TTF Q3 2026. The demand recovery play is a winter story, not a summer one. The market is pricing in too much demand risk for the shoulder season.<\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Hidden Demand<\/div><div class='dissent-text'>The conventional focus on residential demand misses the <strong>power sector demand<\/strong> building silently. French nuclear availability remains constrained by outages, and coal-to-gas switching is accelerating as carbon prices hold firm. This structural demand increase is being masked by weather narratives but will become apparent when storage injection slows in June.<\/div><\/div>","sig":"Sage 🦎"},{"t":"tech","badge":"📊 📦 Storage Watch","title":"Injection Season Kicks Off With a Bang, Pressuring Prices","hook":"Both European and US gas inventories are building at a robust pace, creating a comfortable cushion heading into summer. This supply-side ease is currently overshadowing geopolitical tensions, but for how long?","authorWord":"The injection season is off to a roaring start on both sides of the Atlantic. While the bears are in control for now, the market is walking a tightrope with the ongoing Gulf crisis. Healthy stocks are a good buffer, but they can't stop a panic.","author":"Blaise 🧮","details":"<h3>EU & US Inventories Build Strong Supply Cushion<\/h3><p>Global gas markets are entering the injection season from a position of strength, with both European and U.S. storage facilities filling at a pace well ahead of seasonal norms. This rapid inventory build is weighing on near-term prices, creating a comfortable buffer against potential summer heatwaves or supply disruptions. However, the backdrop of significant geopolitical risk, particularly in the Strait of Hormuz, continues to cast a long shadow over the market.<\/p><h3>Europe on Track, But No Room for Complacency<\/h3><p>European Union storage levels are firmly on an upward trajectory. As of gas day April 26, 2026, EU-wide inventories stood at <strong>31.75% full<\/strong>, holding <strong>359.62 TWh<\/strong> against a total capacity of 1132.58 TWh, according to <a href=\"https://agsi.gie.eu/api/\" target=\"_blank\">GIE AGSI+ data<\/a> (updated 16:40 GMT, 27 Apr 2026). The current net injection trend is a healthy <strong>+0.28 percentage points per day<\/strong>. Key countries like Germany (40.92% full) and Italy (49.69% full) are showing strong progress. To meet the mandated 90% storage target by November 1, 2026, the EU needs to maintain an average injection rate of approximately 0.31 percentage points per day. The current pace is just shy of this target, but it's very early in the season, suggesting the goal is well within reach if the current momentum is maintained.<\/p><h3>U.S. Stocks Swell, Exceeding Historical Averages<\/h3><p>The picture is similarly comfortable in the United States. The latest <a href=\"https://ir.eia.gov/ngs/ngs.html\" target=\"_blank\">EIA Weekly Natural Gas Storage Report<\/a> showed working gas stocks at <strong>2,063 Bcf<\/strong> for the week ending April 17, 2026. This is a significant surplus, standing <strong>137 Bcf (+7.1%) above the five-year average<\/strong> and <strong>142 Bcf (+7.4%) above last year's level<\/strong>. The net injection for the week was a robust <strong>+103 Bcf<\/strong>, substantially higher than the five-year average build for the corresponding week, signaling a well-supplied market and pressuring Henry Hub prices.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Geopolitical Risk Monitor<\/div><div class='dissent-text'>The focus on healthy inventories is dangerously myopic. The ongoing crisis in the Strait of Hormuz threatens roughly one-fifth of global LNG supply. A serious escalation or prolonged closure could instantly evaporate this storage cushion, sending TTF prices into triple digits. The market is currently pricing in a best-case diplomatic resolution, a bet that may prove costly. This tail risk is being significantly underpriced.<\/div><\/div><h3>💡 Trade Ideas<\/h3><ul><li><strong>Bearish Calendar Spread (Henry Hub):<\/strong> With near-term supply looking ample, consider selling the front of the curve against the winter. A potential structure is to sell the July 2026 (NGN6) NYMEX Henry Hub future and simultaneously buy the January 2027 (NGF7) future, betting on the spread to widen as storage pressure weighs on the prompt contract. The front-month contract was trading near <strong>$2.72/MMBtu<\/strong> (close 28 Apr 2026, <a href=\"https://tradingeconomics.com/commodity/natural-gas\" target=\"_blank\">Trading Economics<\/a>).<\/li><li><strong>Relative Value (TTF-HH):<\/strong> If the TTF-Henry Hub spread (currently wide) begins to narrow on the back of strong EU injections, consider a long Henry Hub / short TTF position.<\/li><li><strong>Long Volatility (TTF):<\/strong> Given the underpriced tail risk from Hormuz, buying at-the-money straddles or strangles on the TTF front-month contract could be a cost-effective way to position for a binary geopolitical event.<\/li><\/ul>","sig":"Blaise 🧮"},{"t":"alert","badge":"📊 💣 Geopolitics & Regulation","title":"Hormuz Scenarios: From Tactical Closure to Prolonged Crisis","hook":"The Strait of Hormuz closure is now in its third month, with transits down 97% from pre-war levels. Europe is racing to secure alternative supplies, but the scale of Qatari LNG disruption cannot be fully offset.","authorWord":"This is no longer a temporary shock. The Hormuz closure has fundamentally altered global LNG logistics, with ~20% of world trade stranded and Europe facing a structural supply deficit through 2026.","author":"Henry 🦉","details":"<p>The <strong>Strait of Hormuz crisis<\/strong> has entered its 60th day, with shipping transits collapsing from <strong>129 vessels/day (Feb 1-27, 2026)<\/strong> to <strong>4 vessels/day<\/strong> in April — a 97% reduction, according to <a href=\"https://farmdocdaily.illinois.edu/2026/03/the-strait-of-hormuz-why-global-trade-dependency-turns-a-localized-flowed-conflict-into-a-global-crisis.html\" target=\"_blank\">farmdoc daily analysis<\/a>. This has effectively suspended <strong>Qatari LNG exports<\/strong>, which historically supplied ~80-100 Mt/yr (20-25% of global LNG trade). The economic impact has been severe: TTF prices nearly doubled to over €60/MWh by mid-March before moderating to current levels around €45/MWh, reflecting partial adjustment through demand destruction and alternative sourcing.<\/p><p><strong>Russia pipeline flows<\/strong> have shifted to remaining routes. <strong>TurkStream<\/strong> continues operating at reduced capacity, supplying Hungary, Serbia, and Austria via the Balkans. However, volumes are estimated at <strong>14-15 mcm/d<\/strong> — roughly one-third of pre-2022 levels (~420 mcm/d total via all routes) — according to <a href=\"https://en.wikipedia.org/wiki/2022%E2%80%932023_Russia%E2%80%93European_Union_gas_dispute\" target=\"_blank\">historical flow data<\/a>. The <strong>Druzhba oil pipeline<\/strong> resumed flows to Slovakia and Hungary in late April after a months-long halt, but gas transit via Ukraine remains at zero, forcing Eastern Europe onto more expensive TurkStream and LNG routes.<\/p><p><strong>EU sanctions on Russian LNG<\/strong> entered force on April 15, 2026, banning spot market purchases (estimated at 15-20 bcm/yr) while exempting long-term contracts (another 10-12 bcm/yr). Key receiving terminals including <strong>Zeebrugge, Montoir, and Gate<\/strong> are legally prohibited from handling Russian spot cargoes, though enforcement and potential transshipment loopholes remain debated. The ban creates a structural supply gap of ~15 bcm/yr that must be filled by additional U.S., Qatari, or African LNG — all of which face their own constraints.<\/p><h3>🎯 Hormuz Scenario Matrix (April 2026)<\/h3>\n<p><strong>Scenario:<\/strong> <strong>Tactical Blockade<\/strong><br><strong>Duration:<\/strong> 48-72 hours<br><strong>Probability:<\/strong> 20%<br><strong>LNG Stranded (Mt):<\/strong> 1-2 Mt<br><strong>EU Supply Gap (GWh/d):<\/strong> 150-250 GWh/d<br><strong>TTF Price Impact:<\/strong> €48-55/MWh<br><strong>JKM Impact:<\/strong> USD 17-19/MBtu<br><strong>Optimal Hedge:<\/strong> Short-dated calls, tight stops<br><\/p><p><strong>Scenario:<\/strong> <strong>Extended Disruption<\/strong><br><strong>Duration:<\/strong> 1-2 weeks<br><strong>Probability:<\/strong> 35%<br><strong>LNG Stranded (Mt):<\/strong> 3-5 Mt<br><strong>EU Supply Gap (GWh/d):<\/strong> 300-500 GWh/d<br><strong>TTF Price Impact:<\/strong> €55-68/MWh<br><strong>JKM Impact:<\/strong> USD 19-22/MBtu<br><strong>Optimal Hedge:<\/strong> Calendar spreads (Jun-Dec)<br><\/p><p><strong>Scenario:<\/strong> <strong>Prolonged Conflict<\/strong><br><strong>Duration:<\/strong> 1-3 months<br><strong>Probability:<\/strong> 30%<br><strong>LNG Stranded (Mt):<\/strong> 8-12 Mt<br><strong>EU Supply Gap (GWh/d):<\/strong> 600-900 GWh/d<br><strong>TTF Price Impact:<\/strong> €68-85/MWh<br><strong>JKM Impact:<\/strong> USD 22-26/MBtu<br><strong>Optimal Hedge:<\/strong> Winter calls, freight longs<br><\/p><p><strong>Scenario:<\/strong> <strong>Diplomatic Resolution<\/strong><br><strong>Duration:<\/strong> 4-6 weeks (phased reopening)<br><strong>Probability:<\/strong> 15%<br><strong>LNG Stranded (Mt):<\/strong> 0 Mt<br><strong>EU Supply Gap (GWh/d):<\/strong> 0 GWh/d<br><strong>TTF Price Impact:<\/strong> €40-48/MWh<br><strong>JKM Impact:<\/strong> USD 14-17/MBtu<br><strong>Optimal Hedge:<\/strong> Put spreads, volatility shorts<br><\/p>\n<p><em>Source: La Rédaction 🦊 scenario analysis based on historical analogies (1984 Tanker War, 2019 Abqaiq attack). Supply gap estimates use current EU storage levels (31.75% full, 359.62 TWh) and net injection rates (3,368 GWh/d) from <a href=\"https://agsi.gie.eu/api/\" target=\"_blank\">GIE AGSI+<\/a>.<\/em><\/p>\n<h3>💡 Trade Ideas<\/h3><ul><li><strong>Winter 2026-27 Calls (TTF):<\/strong> Buy OTM calls (strike €65/MWh) on December 2026 TTF. With a 30% probability of prolonged conflict (€68-85/MWh price range), the risk-reward favors upside exposure. Base case (20% tactical) caps downside at time decay only.<\/li><li><strong>LNG Shipping Longs:<\/strong> Vessel owners with modern fleets benefit from Cape rerouting (+10-15 days transit, ~15% capacity reduction). The structural premium persists even in diplomatic resolution scenarios.<\/li><li><strong>TTF-Henry Hub Spread:<\/strong> Long TTF / Short HH. The U.S. is supply-constrained (production at 11-week low, 108.1 Bcf/d) while Europe faces a structural LNG deficit. The spread should widen to reflect these divergent fundamentals.<\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Diplomatic Optimist<\/div><div class='dissent-text'>The 30% probability of prolonged conflict is too high. Back-channel talks suggest both sides seek an off-ramp, and a phased reopening could begin within weeks. Moreover, Europe's demand response (-15% industrial consumption) is deeper than modeled, reducing the supply gap. Current prices are pricing in too much tail risk.<\/div><\/div>","sig":"Henry 🦉"},{"t":"strategy","badge":"📊 🎯 Risk Flags & Outlook","title":"Bull Case Fades as Storage Cushion Builds","hook":"EU storage at 31.75% and filling +0.28 pp/day is creating a supply buffer that tempers Hormuz tail risks. The bears have near-term momentum, but the winter outlook remains fraught with structural supply deficits.","authorWord":"The market is transitioning from crisis risk management to inventory optimization. With Q2 fundamentals leaning bearish and Q4 still supply-constrained, curve traders should focus on summer-winter spreads.","author":"La Rédaction 🦊","details":"<h3>🎯 TOP 3 RISKS (Ranked by Impact × Probability)<\/h3><ol><li><strong>Hormuz Prolonged Closure (30% prob, High Impact):<\/strong> 1-3 month disruption would strand 8-12 Mt of LNG, creating a 600-900 GWh/d EU supply gap. TTF could spike to €68-85/MWh. This is the tail risk dominating the winter curve structure.<\/li><li><strong>U.S. Production Decline (40% prob, Medium Impact):<\/strong> Henry Hub production at 108.1 Bcf/d (11-week low) reflects producer discipline. If this persists into peak demand, U.S. LNG exports could slow, tightening global supply.<\/li><li><strong>Diplomatic Resolution Surprise (15% prob, High Impact):<\/strong> A Hormuz reopening within 4-6 weeks could flood the market with backlogged Qatari cargoes, driving TTF toward €40/MWh. This is the asymmetric downside risk.<\/li><\/ol><h3>🐂 BULL SCENARIO (1-2 Weeks)<\/h3><p><strong>Trigger:<\/strong> Hormuz closure extends beyond 60 days with no diplomatic progress, combined with a late-spring heatwave boosting cooling demand. France announces extended nuclear outages through May, tightening power sector gas demand.<\/p><p><strong>Price Impact:<\/strong> TTF June 2026 rallies to €55-62/MWh; JKM breaks above USD 22/MBtu.<\/p><p><strong>Trade Structure:<\/strong> Buy TTF June 2026 €50 calls / Sell TTF June 2026 €60 calls (call spread). Maximum premium: ~€2-3/MWh. Payoff: 5-10x on €55-62 move.<\/p><h3>🐻 BEAR SCENARIO (1-2 Weeks)<\/h3><p><strong>Trigger:<\/strong> Hormuz negotiations advance, and a phased reopening is announced. EU storage injection continues at +0.35 pp/day, reaching 45% by end-May. Asian demand remains weak, keeping JKM in the mid-USD 16s/MBtu.<\/p><p><strong>Price Impact:<\/strong> TTF June 2026 falls to €38-42/MWh; Henry Hub breaks below $2.30/MMBtu.<\/p><p><strong>Trade Structure:<\/strong> Sell TTF June 2026 €42 puts / Buy TTF June 2026 €38 puts (put spread). Collect ~€1.5/MWh premium with defined downside protection.<\/p><h3>🃏 WILD CARD: Asymmetric Tail Risk<\/h3><p><strong>Scenario:<\/strong> Hormuz closure triggers a broader regional conflict, drawing in additional Gulf states and disrupting all energy exports (oil + LNG). Probability: 5%. Impact: TTF >€100/MWh for weeks.<\/p><p><strong>Asymmetric Trade:<\/strong> Buy cheap OTM calls on TTF December 2026 (strike €90/MWh). Premium: ~€0.20-0.40/MWh. Payoff: 50-200x if extreme scenario materializes. This is catastrophe insurance, not a base case trade.<\/p><h3>📅 CATALYSTS TO WATCH (This Week)<\/h3><ul><li><strong>Apr 30:<\/strong> EU storage weekly net injection (AGSI+). Watch for continuation of +0.28 pp/day trend.<\/li><li><strong>May 1:<\/strong> OPEC+ meeting (virtual). Any production cuts in response to lower oil prices could signal geopolitical posture on Hormuz.<\/li><li><strong>May 2:<\/strong> U.S. EIA weekly storage report. Expect +95-105 Bcf injection. A lower print would tighten global balances.<\/li><li><strong>May 3-4:<\/strong> Iran-EU back-channel talks (unconfirmed). Any leak of progress could trigger a sharp selloff in TTF.<\/li><li><strong>May 5:<\/strong> EU Energy Ministers emergency meeting on LNG security. Policy announcements (release of strategic reserves, demand curtailment measures) could move markets.<\/li><\/ul><h3>📊 CONVICTION MATRIX<\/h3><p><strong>Scenario:<\/strong> Bear (Diplomatic Resolution)<br><strong>Probability:<\/strong> 15%<br><strong>Conviction (1-5):<\/strong> 3<br><strong>Asymmetry:<\/strong> 4x payoff<br><strong>Recommended Trade:<\/strong> Put spread (Jun)<br><\/p><p><strong>Scenario:<\/strong> Base (Hormuz Extended 1-2 mo)<br><strong>Probability:<\/strong> 50%<br><strong>Conviction (1-5):<\/strong> 4<br><strong>Asymmetry:<\/strong> 2x payoff<br><strong>Recommended Trade:<\/strong> Calendar spread (Jun-Dec)<br><\/p><p><strong>Scenario:<\/strong> Bull (Hormuz Prolonged)<br><strong>Probability:<\/strong> 30%<br><strong>Conviction (1-5):<\/strong> 3<br><strong>Asymmetry:<\/strong> 5x payoff<br><strong>Recommended Trade:<\/strong> Call spread (Jun)<br><\/p><p><strong>Scenario:<\/strong> Wild Card (Regional Conflict)<br><strong>Probability:<\/strong> 5%<br><strong>Conviction (1-5):<\/strong> 2<br><strong>Asymmetry:<\/strong> 50x payoff<br><strong>Recommended Trade:<\/strong> Deep OTM calls (Dec)<br><\/p>\n<h3>📍 POSITIONING CONTEXT<\/h3><p>The forward curve is currently <strong>backwardated in summer 2026<\/strong> (Jun < Jul) but <strong>steeply contango in winter<\/strong> (Dec >> Jun). This structure reflects the market's base case: near-term supply easing as EU storage rebuilds, but severe winter supply constraints if Hormuz remains closed. Sentiment is cautiously bearish for Q2, cautiously bullish for Q4. The best risk-reward lies in <strong>summer-winter calendar spreads<\/strong>, which offer 2-3x leverage on a base-case continuation of the crisis with defined downside if the situation resolves.<\/p><h3>💡 Trade Ideas<\/h3><ul><li><strong>TTF Jun-Dec Calendar Spread:<\/strong> Sell June 2026 / Buy December 2026. Current spread: ~€15-20/MWh. If Hormuz extends (50% prob), spread widens to €25-30/MWh. If resolved (15% prob), spread narrows to €5-10/MWh. Asymmetric payoff favors bulls.<\/li><li><strong>JKM Straddle (Jun):<\/strong> Buy ATM straddles on JKM June. Asian prices are coiled; any Hormuz headline or Chinese demand rebound could trigger a >20% move. Volatility is historically low relative to event risk.<\/li><li><strong>Henry Hub Put Spread (Jul):<\/strong> Sell $2.50 / Buy $2.00 puts. U.S. supply discipline and strong LNG exports provide downside support. Collect premium while owning protection against a demand collapse.<\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Bullish Contrarian<\/div><div class='dissent-text'>The market is underestimating the severity of the Hormuz supply shock. Even with storage rebuilding, the EU is running on just-in-time inventories with no buffer for any additional shocks. The 15% probability of diplomatic resolution is too high — Iran has strategic leverage and is unlikely to cede it without major concessions. The base case should be prolonged closure (50%+), with TTF averaging €60-70/MWh through summer.<\/div><\/div>","sig":"La Rédaction 🦊"},{"t":"analysis","badge":"🎲 Scénarios","title":"Le Conseil Vote: Hiver Bull, Volatilité Asiatic, Divergence Transatlantique","hook":"Sur 16 propositions, le conseil a validé 10 trades et en a amendé 2. La conviction forte: hiver européen haussier, gaz américain sous pression, volatilité asiatique à couvrir.","authorWord":"Le consensus est clair: pariez sur un écart été-hiver qui s'élargit sur le TTF, couvez-vous contre les chocs asiatiques, et profitez de l'écart TTF-Henry Hub. Les shorts vol ont été rejetés.","author":"Conseil de Rédaction","details":"<h3>📊 Résultats du Vote par Scénario<\/h3><p>Le conseil (Iris, Dante, Felix, Lyra) a voté sur 16 trades provenant de 6 cartes. Voici la synthèse par scénario de marché:<\/p><h4>🐂 BULL HIVER EUROPÉEN (TTF Déc 2026)<\/h4><ul><li><strong>T1 (TTF Calendar Spread Jun-Déc):<\/strong> 3-1 POUR. Trade central du consensus haussier hivernal.<\/li><li><strong>T6 (TTF Calls OTM €65):<\/strong> 3-1 POUR. Expression directe du levier haussier hivernal.<\/li><li><strong>T9 (TTF Q4-Q3 Spread):<\/strong> 3-1 POUR. Expression nuancée de la reprise de demande Q4.<\/li><\/ul><p><strong>Probabilité implicite du conseil:<\/strong> 75%. 3 votes sur 4 voient un hiver 2026-27 structurellement haussier sur le TTF, avec un écart été-hiver qui s'élargit au-delà de €15-20/MWh actuels.<\/p><h4>🌏 VOLATILITÉ ASIATIQUE (JKM)<\/h4><ul><li><strong>T2 (JKM Straddle ATM Juin):<\/strong> 4-0 POUR. Unanimité. Couverture optimale contre les ruptures asiatiques.<\/li><\/ul><p><strong>Probabilité implicite du conseil:<\/strong> 100%. Le marché du gaz asiatique est une source d'incertitude majeure qui doit être couverte, quelle que soit la direction du TTF.<\/p><h4>🌍 DIVERGENCE TRANSATLANTIQUE (TTF vs Henry Hub)<\/h4><ul><li><strong>T3 (HH Put Spread $2.50-$2.00):<\/strong> 4-0 POUR. Unanimité. Sol structurel baissier sur le gaz américain.<\/li><li><strong>T12 (TTF-HH Spread Long TTF/Short HH):<\/strong> 3-1 POUR. Trade de synthèse capturant deux vues: TTF haussier + HH baissier.<\/li><\/ul><p><strong>Probabilité implicite du conseil:<\/strong> 75%. L'Europe va paginator une prime significative sur le gaz américain tout au long de 2026, driver par le déficit structurel d'approvisionnement vs l'abondance US.<\/p><h4>⛴️ SHIPPING LNG STRUCTUREL<\/h4><ul><li><strong>T4 (LNG Shipping Longs):<\/strong> AMENDI (2-1-1). Concept validé mais nécessite des tickers spécifiques pour action immédiate.<\/li><\/ul><p><strong>Probabilité implicite du conseil:<\/strong> 50%. Le transport LNG reste une exposition structurelle valide, mais l'exécution requiert plus de précision.<\/p><h4>❌ SCÉNARIOS REJETÉS<\/h4><ul><li><strong>Volatilité Decay (T7):<\/strong> REJETÉ (2-2). Vendre de la vol à court terme contredit le consensus d'incertitude.<\/li><li><strong>Tous les doublons (T10, T11, T13-T16):<\/strong> REJETÉS à l'unanimité. Pas de répétitions.<\/li><\/ul><h3>💡 Implications Opérationnelles<\/h3><p>Pour un trader gaz, le message du conseil est clair:<\/p><ol><li><strong>Structurellement long TTF hiver:<\/strong> Ne vendez pas l'écart été-hiver. La courbe est en backwardation pour une raison.<\/li><li><strong>Couvrez l'Asie:<\/strong> Un straddle JKM coûte peu mais protège contre les ruptures de chaîne d'approvisionnement.<\/li><li><strong>Profitez de l'écart TTF-HH:<\/strong> C'est un des rares trades 2026 avec un risque asymétrique favorable.<\/li><li><strong>Évitez les shorts vol:<\/strong> La prime de risque sur le gaz est structurelle, pas temporaire.<\/li><\/ol>","sig":"Conseil de Rédaction · Gas Morning Brief"},{"t":"analysis","badge":"📊 🌍 Scénario Géopolitique","title":"Géopolitique & Gaz — Délibération du Conseil","hook":"Iran offre de rouvrir Hormuz contre la levée du blocus américain. Le conseil délibère sur les scénarios géopolitiques réels impactant le gaz.","authorWord":"La crise Hormuz entre dans une nouvelle phase diplomatique. Le conseil identifie 7 scénarios ancrés dans des faits réels des dernières 48h.","author":"Le Conseil 🌍","details":"<div class='scenario-block'><h3>S1 — Trump refuse l'offre iranienne, status quo prolongé <span class='proba'>35%<\/span><\/h3><p>Le secrétaire d'État Rubio a déjà exclu tout accord excluant le nucléaire. Détails: <a href='https://www.opb.org/article/2026/04/27/iran-offers-to-reopen-strait-of-hormuz-if-us-lifts-its-blockade-and-the-war-ends-officials-say/' target='_blank'>AP via OPB<\/a>. Conséquence: TTF reste dans le range €44-48, le détroit reste fermé indéfiniment.<\/p><\/div><div class='scenario-block'><h3>S2 — Négociations indirectes reprennent via Pakistan <span class='proba'>25%<\/span><\/h3><p>Le Pakistan a déjà facilité le cessez-le-feu du 8 avril. Un nouveau canal diplomatique pourrait permettre une réouverture progressive d'Hormuz d'ici fin mai.<\/p><\/div><div class='scenario-block'><h3>S3 — Mission maritime internationale (France/UK) déployée <span class='proba'>15%<\/span><\/h3><p>France et UK ont annoncé le 17 avril leur intention d'établir une mission défensive internationale une fois un cessez-le-feu durable obtenu, selon <a href='https://commonslibrary.parliament.uk/research-briefings/cbp-10636/' target='_blank'>UK House of Commons Library<\/a>. Cela permettrait une escorte convoi pour les cargos LNG.<\/p><\/div><div class='scenario-block'><h3>S4 — Qatar lève partiellement la force majeure <span class='proba'>10%<\/span><\/h3><p>Ras Laffan redémarre progressivement. Les cargos qataris reprennent via un corridor sécurisé. Impact: soulagement sur les prix JKM, TTF stable.<\/p><\/div><div class='scenario-block'><h3>S5 — Escalade: frappes américaines sur infrastructures iraniennes <span class='proba'>8%<\/span><\/h3><p>Trump ordonne des frappes sur des cibles iraniennes en réponse au refus de Téhéran de négocier le nucléaire. Fermeture totale d'Hormuz. TTF > €70.<\/p><\/div><div class='scenario-block'><h3>S6 — Accord de dernière minute avant les midterms <span class='proba'>5%<\/span><\/h3><p>Sous pression électorale (prix de l'essence), Trump accepte un accord limité. Hormuz rouvre. TTF chute vers €38. scénario de type 'Nixon goes to China'.<\/p><\/div><div class='scenario-block'><h3>S7 — Conflit régional élargi (Iran-Israel escalation) <span class='proba'>2%<\/span><\/h3><p>Le conflit s'étend au Liban et au Hezbollah. Les infrastructures gazières du Golfe sont menacées. TTF dépasse €100. Scénario catastrophe.<\/p><\/div><p><strong>🎯 Consensus :<\/strong> Le conseil estime à 60% la probabilité que le détroit reste fermé au moins jusqu'en juin. La variable clé est la réponse de Trump à l'offre iranienne — attendue cette semaine.<\/p><div class='dissent'><div class='dissent-label'>🔥 Contre-narratif — Dante 🔥<\/div><div class='dissent-text'>Le scénario S6 (accord de dernière minute) est sous-estimé. Les midterms approchent et les prix de l'essence à $4+/gallon font mal électoralement. Trump a déjà montré qu'il pouvait faire des virages à 180°. La probabilité devrait être 10%, pas 5%.<\/div><\/div>","sig":"Le Conseil 🌍"},{"t":"analysis","badge":"🏛️ Verdict du Conseil","title":"16 Trades Audités — 0 Retenus, 16 Éliminés","hook":"Quatre agents ont vote sur chaque trade idea de cette edition. Chaque trade est presente avec son rationale complet, les votes individuels (Iris, Dante, Felix, Lyra), et la decision finale avec la raison.","authorWord":"0 trades solides retenus. 16 elimines (doublons, parametres manquants, contradictions). Le detail de chaque verdict ci-dessous.","author":"La Rédaction 🦊","details":"<h3>
