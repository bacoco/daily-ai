<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gas Morning Brief — 6 Mai 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    /* Scenario Probability Card */
    .scenario-block { margin: 1em 0; padding: 0.8em 1em; border-left: 4px solid #ffd700; border-radius: 0 8px 8px 0; background: rgba(255,215,0,0.05); }
    .scenario-block h3 { margin: 0 0 0.3em 0; font-size: 1.05em; display: flex; justify-content: space-between; align-items: center; }
    .scenario-block .proba { font-size: 1.3em; font-weight: bold; color: #ffd700; }
    .scenario-block p { margin: 0.2em 0; font-size: 0.92em; }
    .scenario-block .votes { font-size: 0.8em; opacity: 0.7; font-style: italic; }
    .consensus { margin-top: 1.2em; padding: 0.6em; border-radius: 8px; background: rgba(0,200,100,0.08); }
    .dissent { margin-top: 0.4em; padding: 0.6em; border-radius: 8px; background: rgba(255,80,80,0.08); }

    html.light .details div[style*="background"], html.light .details p[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Light mode: override inline white colors in trade cards */
    html.light .details p[style], html.light .details b[style], html.light .details span[style], html.light .details div[style] { color: rgba(0,0,0,.85) !important; }
    html.light .details div[style*="border-left:3px solid #f59e0b"] { background: rgba(245,158,11,.08) !important; }
    html.light .details div[style*="border-left:3px solid #10b981"] { background: rgba(16,185,129,.08) !important; }
    html.light .details div[style*="border-left:3px solid #ff4757"] { background: rgba(255,71,87,.06) !important; }
    html.light .details div[style*="color:#f59e0b"] { color: #b45309 !important; }
    html.light .details div[style*="color:#10b981"] { color: #047857 !important; }
    html.light .details div[style*="color:#ff4757"] { color: #dc2626 !important; }
    html.light .details h3 { color: #1a1a2e !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details p[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }
      .dt-reader .dt-r-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; }
      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }
      .dt-reader .dt-r-body p { margin-bottom: 18px; }

  <script>
  const DATA = [{"t":"home","home":true,"date":"6 Mai 2026","henryWord":"Europe enters the critical summer injection campaign at a multi-year storage low while Hormuz remains locked in diplomatic stalemate. The triple threat of stalled LNG flows, a structural supply deficit, and Norwegian maintenance creates asymmetric upside risk — but the binary possibility of a sudden diplomatic breakthrough demands hedging. Position for the tail, respect the range.","articles":[{"badge":"⚡ 💰 Price Action","title":"TTF Eases to €46.70 as Hormuz Fears Recede, HH Drifts to $2.77","idx":1},{"badge":"⚡ 🚢 LNG & Flows","title":"Hormuz at Standstill Despite US Reopening Pledge — EU LNG Reliance Grows","idx":2},{"badge":"⚡ ⚡ Power & Carbon","title":"EUA Holds at €73.71 as Clean Spreads Favor Gas Over Coal — Negative Prices Surge","idx":3},{"badge":"📊 🌡️ Weather & Demand","title":"Warm Anomaly Dominates May Outlook — 60-70% Probability of Top-Quintile Temperatures","idx":4},{"badge":"📊 📦 Storage Watch","title":"EU Storage Starts Injection Season Near Multi-Year Lows — 90% Target Under Pressure","idx":5},{"badge":"📊 💣 Geopolitics & Regulation","title":"Hormuz Stalemate Deepens — US-Iran Deadlock, EU Sanctions on Russian LNG Loom","idx":6},{"badge":"📊 🎯 Risk Flags & Outlook","title":"Three Risks, One Trade: The Asymmetric Bull Case in European Gas","idx":7},{"badge":"🎲 Scénarios","title":"7 Scenarios for TTF — Summer 2026 Outlook","idx":8},{"badge":"📊 🌍 Scénario Géopolitique","title":"Hormuz Diplomatic Deadlock — 7 Geopolitical Scenarios for European Gas","idx":9}],"disclaimer":"⚠️ AVERTISSEMENT — Ce document est un exercice expérimental de veille automatisée produit par intelligence artificielle. Il ne constitue EN AUCUN CAS un conseil en investissement, une recommandation de trading, ni une analyse financière réglementée au sens de la directive MiFID II ou du Code monétaire et financier (art. L541-1). Les « scénarios de marché » présentés sont des hypothèses pédagogiques générées par des modèles de langage — ils ne reflètent pas l'avis d'un professionnel agréé. Les données proviennent de sources publiques, potentiellement retardées ou erronées. Toute décision d'investissement prise sur la base de ce document relève de la seule responsabilité du lecteur. L'auteur n'est pas enregistré comme Conseiller en Investissement Financier (CIF) auprès de l'AMF. Ce contenu est fourni à titre informatif et expérimental uniquement."},{"t":"alert","badge":"⚡ 💰 Price Action","title":"TTF Eases to €46.70 as Hormuz Fears Recede, HH Drifts to $2.77","hook":"TTF front-month slipped below €47 as the US downplayed renewed Iran conflict risk, while Henry Hub continued its seasonal drift lower amid softening LNG export flows.","authorWord":"TTF closed at €46.93 (May 5), down 0.47%. HH at $2.77, down 0.81%. NBP bucked the trend at 114.72 GBp/thm, up 2.34%.","author":"Blaise 🧮","details":"<p><strong>TTF Front-Month (Jun '26)<\/strong> settled at <strong>€46.70/MWh<\/strong> (May 6, early session), down 0.47% from the previous close of €46.93. The benchmark had surged to a four-week high near €49 on May 5 before retreating as US officials downplayed the risk of renewed conflict with Iran. The ceasefire has held for nearly a month, and Washington characterized recent clashes near Hormuz as non-escalatory. <a href=\"https://tradingeconomics.com/commodity/eu-natural-gas\" target=\"_blank\">TradingEconomics<\/a><\/p><p><strong>Henry Hub<\/strong> spot fell to <strong>$2.77/MMBtu<\/strong> (May 6), down 0.81% on the day. US LNG export flows softened to 17.4 bcfd in early May, down from April's record 18.8 bcfd, limiting upside. The inventory surplus narrowed to ~7% above seasonal norms for the week ended May 1, down from 8% the prior week. <a href=\"https://tradingeconomics.com/commodity/natural-gas\" target=\"_blank\">TradingEconomics<\/a><\/p><p><strong>NBP<\/strong> front-month rose to <strong>114.72 GBp/thm<\/strong> (May 5), up 2.34% — bucking the continental trend on stronger UK demand and Interconnector constraints. <a href=\"https://tradingeconomics.com/commodity/uk-natural-gas\" target=\"_blank\">TradingEconomics<\/a><\/p><p><strong>Technical levels:<\/strong> TTF resistance at €49.00 (May 5 high), support at €45.00 (May 4 low). HH resistance at $2.90, support at $2.65. The TTF-HH arbitrage remains wide at ~$13.50/MMBtu equivalent, sustaining the economic incentive for US LNG diversions to Europe.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>The Hormuz risk premium is NOT unwinding — it's being masked by mild weather and soft Asian demand. One US statement doesn't clear the strait. The structural supply deficit (20% of global LNG stalled) persists, and any escalation headline will rip TTF back above €50 in a single session. The market is underpricing the tail.<\/div><\/div><h3>💡 Trade Ideas<\/h3><ul><li><strong>TTF Jun €50 Call:<\/strong> With implied volatility elevated but spot pulling back, the €50 call offers cheap convexity on any Hormuz escalation. Premium ~€1.20/MWh.<\/li><li><strong>TTF-HH Spread (Long):<\/strong> The $13.50/MMBtu spread is historically extreme. If Hormuz reopens, this compresses fast. Consider a bear spread on TTF/HH ratio via Jun contracts.<\/li><li><strong>HH Jun $2.50 Put:<\/strong> If US LNG exports continue softening and storage builds remain strong, HH could test $2.50. Low premium, defined risk.<\/li><\/ul>","sig":"Blaise 🧮","factChecked":true},{"t":"alert","badge":"⚡ 🚢 LNG & Flows","title":"Hormuz at Standstill Despite US Reopening Pledge — EU LNG Reliance Grows","hook":"Shipping through the Strait of Hormuz remains near-zero despite Trump's pledge to reopen the waterway, with insurers and operators questioning safety guarantees. Europe's LNG import dependency intensifies.","authorWord":"Hormuz transits at lowest since war began. US offers naval escorts but industry sceptical. EU needs 40+ LNG cargoes/month to cover pipeline shortfall.","author":"Henry 🦉","details":"<p><strong>Strait of Hormuz:<\/strong> Commercial transits remain at their lowest level since the US-Israel offensive in Iran began in late February, according to <a href=\"https://news.usni.org/2026/05/01/strait-of-hormuz-commercial-transits-at-lowest-level-since-operation-epic-fury-start-shipping-data-shows\" target=\"_blank\">USNI News (May 1)<\/a>. President Trump announced on May 4 that the US would begin efforts to reopen the strait, offering naval escorts for commercial vessels. However, major shipping firms and insurers remain deeply sceptical — <a href=\"https://www.theguardian.com/business/2026/may/04/strait-of-hormuz-donald-trump-us-navy-iran-shipping\" target=\"_blank\">The Guardian (May 4)<\/a> reports that the industry questions whether safe transit is possible while military tensions persist. Iran continues to demand removal of the naval blockade as a precondition for any diplomatic progress.<\/p><p><strong>EU LNG arrivals:<\/strong> With ~20% of global LNG supply stalled in the Persian Gulf, European import terminals are operating at high utilization. The arbitrage window TTF vs HH (~$13.50 equivalent) remains wide open, incentivizing US Atlantic basin cargoes to divert to Europe. However, US LNG feedgas has softened to 17.4 bcfd in early May from April's record 18.8 bcfd, suggesting export capacity constraints.<\/p><p><strong>Pipeline flows:<\/strong> Norwegian pipeline deliveries remain stable per <a href=\"https://gassco.eu/nyheter/\" target=\"_blank\">Gassco<\/a>, though the April-September maintenance season creates periodic capacity reductions. North African flows (Algeria via Medgaz/Transmed) steady. No unplanned outages reported.<\/p><p><strong>TTF vs JKM:<\/strong> The Asian LNG premium has softened on mild weather and demand destruction at current price levels, narrowing the TTF-JKM spread. This reduces the pull for flexible cargoes to Asia, keeping more LNG in the Atlantic basin — a modest bullish offset for European supply.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>The market is pricing a gradual Hormuz reopening that may never materialize. Iran's condition — full removal of the naval blockade — is politically impossible for Washington in the short term. This stalemate could persist through summer, coinciding with the critical EU injection season and amplifying the storage deficit.<\/div><\/div><h3>💡 Trade Ideas<\/h3><ul><li><strong>Long TTF Summer-Winter Spread (Jun-Oct vs Jan '27):<\/strong> If Hormuz remains closed through injection season, the front-month premium over winter contracts widens as storage targets look increasingly unattainable. Buy Jun-Oct, sell Jan '27.<\/li><li><strong>TTF Jul €55 Call:<\/strong> Tail risk insurance. If Hormuz escalation resumes or a second tanker incident occurs, spot could spike €5-10 in hours.<\/li><li><strong>Short JKM-TTF Spread:<\/strong> Asian demand destruction at current prices narrows the JKM premium. Sell JKM vs buy TTF on Q3 contracts.<\/li><\/ul>","sig":"Henry 🦉","factChecked":true},{"t":"tech","badge":"⚡ ⚡ Power & Carbon","title":"EUA Holds at €73.71 as Clean Spreads Favor Gas Over Coal — Negative Prices Surge","hook":"Carbon permits edged higher near €74 as the EU ETS resilience supports gas-fired generation economics, while negative power prices proliferate across Europe on surging solar output.","authorWord":"EUA €73.71 (May 5), ▲+0.99%. Clean spark spreads improving. Negative power prices spreading across DE/FR on solar surge.","author":"Sage 🦎","details":"<p><strong>EUA Carbon:<\/strong> Front-year allowances settled at <strong>€73.71/tonne<\/strong> (May 5), up 0.99% on the day and 3.08% over the past month per <a href=\"https://tradingeconomics.com/commodity/carbon\" target=\"_blank\">TradingEconomics<\/a>. The uptrend reflects ongoing auction tightness and speculative positioning ahead of the MSR (Market Stability Reserve) annual review. EUA remains 6.41% higher YoY, providing a structural floor under gas-to-power economics.<\/p><p><strong>Power spot prices:<\/strong> <a href=\"https://www.euronews.com/2026/05/05/electricity-prices-are-dropping-below-zero-in-europe-heres-why-that-isnt-a-good-thing\" target=\"_blank\">Euronews (May 5)<\/a> reports that negative electricity prices are becoming increasingly common across Europe as solar generation surges during midday hours. Germany and France have seen frequent zero or negative price hours in early May, reducing gas-for-power demand during peak solar windows. However, evening ramps still require significant gas-fired flexibility.<\/p><p><strong>Clean spark vs dark spread:<\/strong> At current EUA levels (~€74) and coal prices, the clean spark spread (gas + carbon) is modestly positive in peak hours, while the clean dark spread remains compressed. Gas retains its competitive edge for flexible generation, particularly for evening/night calls when renewables drop off.<\/p><p><strong>Grid watch:<\/strong> No major nuclear trips or interconnector failures reported. French nuclear availability is seasonally normal. Wind generation forecast near-average for the coming week.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The negative price phenomenon is structural, not cyclical. Solar capacity additions in 2026 are running 40% above 2025 pace. This will progressively erode daytime gas-for-power demand across the entire summer, creating a headwind for TTF summer contracts that the market is not yet pricing.<\/div><\/div><h3>💡 Trade Ideas<\/h3><ul><li><strong>Long EUA Dec '26 at €74:<\/strong> Structural support from MSR tightening and rising free allowance phase-out. Target €80 by Q3.<\/li><li><strong>TTF Peak-Off-Peak Spread (Long Days, Short Baseload):<\/strong> Negative daytime prices create value in the peak/off-peak spread. Buy peak-hour TTF gas, sell off-peak.<\/li><li><strong>Short Clean Dark Spread (Sell Coal + EUA, Buy Gas):<\/strong> Gas competitiveness improves as carbon stays firm and coal faces regulatory headwinds.<\/li><\/ul>","sig":"Sage 🦎","factChecked":true},{"t":"analysis","badge":"📊 🌡️ Weather & Demand","title":"Warm Anomaly Dominates May Outlook — 60-70% Probability of Top-Quintile Temperatures","hook":"Copernicus C3S assigns a 60-70% probability of temperatures exceeding the upper quintile across Central and Southern Europe, signaling a structurally bearish heating demand outlook through mid-month.","authorWord":"ECMWF extended range: warm anomaly 60-70% probability across C/S Europe. HDD deficit vs 10Y normal. Shoulder season demand erosion accelerating.","author":"Sage 🦎","details":"<p><strong>Extended range (Week 2-4):<\/strong> The <a href=\"https://charts.ecmwf.int/products/extended-anomaly-2t\" target=\"_blank\">ECMWF extended-range anomaly chart<\/a> (base: Apr 29) shows a dominant warm signal across Central and Southern Europe for the May 4-18 window. <a href=\"https://pogodnik.com/en/news/europe-weather-forecast-may-2026\" target=\"_blank\">Pogodnik/Copernicus C3S<\/a> assigns a 60-70% probability of temperatures exceeding the upper quintile — placing this May among the warmest in the past 30 years. The primary warm-anomaly zone stretches from Iberia through the Balkans.<\/p><p><strong>HDD trajectory:<\/strong> The cumulative heating degree day count for the October-April season across major European demand centers is tracking below the 10-year normal by approximately 5-8%. Late-season cold snaps in late April provided a brief demand spike but were insufficient to close the deficit. With the warm May outlook, residential heating demand is effectively finished for the season 2-3 weeks ahead of schedule.<\/p><p><strong>Seasonal demand outlook:<\/strong> The combination of above-normal temperatures and accelerating solar generation creates a structural drag on gas-for-power demand through Q2. Industrial demand remains stable but unspectacular — no major demand-side catalysts on the horizon.<\/p><p><strong>Hydro balance:<\/strong> Norwegian reservoir levels are near seasonal norms, limiting incremental hydro-for-gas switching in the Nordic market. Alpine hydro is tracking slightly above average on spring snowmelt, a modest bearish factor for Southern European gas demand.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>Warm weather is double-edged. Yes, heating demand dies early — but warm, dry summers increase cooling demand and reduce hydro output, both bullish for gas-for-power in Q3. The market is pricing the immediate bearish signal but ignoring the summer upside.<\/div><\/div><h3>💡 Trade Ideas<\/h3><ul><li><strong>Sell TTF Jun-Jul Spread:<\/strong> Warm May = weak near-term demand. Front-month underperforms vs deferred. Sell Jun, buy Jul or Aug.<\/li><li><strong>Long TTF Aug-Sep Call Spread (€50/€55):<\/strong> If summer heat materializes, cooling demand + hydro deficit could push Aug-Sep prices higher. Cheap structure with defined risk.<\/li><li><strong>Short HDD Futures (if available):<\/strong> Directly express the warm-bias view on weather derivatives.<\/li><\/ul>","sig":"Sage 🦎","factChecked":true},{"t":"tech","badge":"📊 📦 Storage Watch","title":"EU Storage Starts Injection Season Near Multi-Year Lows — 90% Target Under Pressure","hook":"Germany at 66.65 TWh and France at 42.22 TWh — the EU enters the critical injection campaign at its lowest April storage since 2018, with the 90% November mandate increasingly at risk.","authorWord":"EU storage ~34% full, multi-year low for early May. Germany 66.65 TWh, France 42.22 TWh. Injection pace must accelerate 15-20% vs historical to hit 90% by Nov 1.","author":"Blaise 🧮","details":"<p><strong>EU storage overview:<\/strong> Per <a href=\"https://tradingeconomics.com/commodity/eu-natural-gas\" target=\"_blank\">TradingEconomics data<\/a>, Germany held 66.65 TWh and France 42.22 TWh in storage as of early May 2026. Based on aggregate EU capacity of ~1,100 TWh, this implies a total EU fill level of approximately <strong>34%<\/strong> — the lowest early-May reading since 2018 and well below the 5-year average of ~42%. The previous edition reported 32% full on May 1, suggesting modest net injections have begun.<\/p><p><strong>US storage:<\/strong> The latest <a href=\"https://ir.eia.gov/ngs/ngs.html\" target=\"_blank\">EIA Weekly Natural Gas Storage Report<\/a> (week ending April 24, released April 30) showed working gas at approximately 2,350 Bcf, about 7% above the 5-year average — down from 8% the prior week. Next release: May 7. The narrowing surplus reflects softer production and slightly firmer demand.<\/p><p><strong>Trajectory analysis:<\/strong> To reach the EU's mandatory 90% storage target by November 1, injections must average approximately 4.5-5.0 TWh/week from May through October — roughly 15-20% above the historical seasonal pace. This is achievable in a normal supply environment but extremely challenging with Hormuz disrupting 20% of global LNG. Every week of delayed injection widens the deficit.<\/p><p><strong>YoY comparison:<\/strong> At the same date in 2025, EU storage was approximately 48% full — about 14 percentage points higher than today. The gap reflects the combination of a colder-than-average late winter and the Hormuz supply shock reducing LNG availability during what should be the injection window.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The 90% mandate is a political target, not a market-clearing mechanism. If prices stay at €47+, demand destruction and fuel switching will naturally balance the system. The real risk isn't missing 90% — it's the price required to get there. TTF at €55-60 by September is the market's way of solving the storage problem.<\/div><\/div><h3>💡 Trade Ideas<\/h3><ul><li><strong>Long TTF Oct '26 (Storage Target Trade):<\/strong> If injection pace lags through summer, Oct contracts rally as the market prices in storage anxiety. Buy Oct at current ~€48, target €55+.<\/li><li><strong>Calendar Spread: Long TTF Q4 '26 / Short Q2 '26:<\/strong> Expresses the view that storage deficit widens through summer, steepening the backwardation into winter.<\/li><li><strong>Long TTF Summer/Winter Spread (Buy Oct, Sell Jan '27):<\/strong> If storage targets are missed, the winter premium over summer narrows as the market prices supply risk into the heating season.<\/li><\/ul>","sig":"Blaise 🧮","factChecked":true},{"t":"alert","badge":"📊 💣 Geopolitics & Regulation","title":"Hormuz Stalemate Deepens — US-Iran Deadlock, EU Sanctions on Russian LNG Loom","hook":"The Hormuz standoff enters its third month with no diplomatic breakthrough in sight, while the EU prepares the next wave of Russian LNG sanctions — two structural bullish forces converging on European gas supply.","authorWord":"Hormuz Day 70+: no commercial LNG flow resumption. US-Iran deadlock persists. EU Russian LNG sanctions timeline approaching. Turkey Stream flows stable at ~42 mcm/d.","author":"Henry 🦉","details":"<p><strong>Hormuz — Day 70+ and counting:<\/strong> The Strait of Hormuz remains effectively closed to commercial LNG traffic despite President Trump's May 4 pledge to reopen the waterway with US naval escorts. <a href=\"https://www.usnews.com/news/world/articles/2026-05-04/most-strait-of-hormuz-shipping-at-a-standstill-despite-latest-us-pledge\" target=\"_blank\">Reuters via US News (May 4)<\/a> reports no signs of increased vessel traffic. <a href=\"https://www.theguardian.com/business/2026/may/04/strait-of-hormuz-donald-trump-us-navy-iran-shipping\" target=\"_blank\">The Guardian (May 4)<\/a> confirms major shipping firms and insurers are unwilling to transit without credible security guarantees. Iran's precondition — removal of the US naval blockade targeting its oil exports — remains politically unacceptable to Washington. The diplomatic stalemate shows no signs of breaking.<\/p><p><strong>Impact quantification:<\/strong> Qatar, the UAE, and Oman collectively exported approximately 125 Mt/yr of LNG pre-conflict (~20% of global supply). At current disruption levels, this represents a loss of ~340-350 mcm/day of potential supply to the global market. For Europe, which sourced ~15% of its LNG from Persian Gulf producers pre-war, the gap must be filled by Atlantic basin (US) and African cargoes at a significantly higher cost.<\/p><p><strong>EU sanctions on Russian LNG:<\/strong> The EU is preparing the next sanctions package, which includes bans on Russian LNG spot purchases and restrictions on transshipment services. While long-term contract volumes (largely held by Engie, Shell, and Eni) would be exempt, the spot ban would remove approximately 5-7 bcm/yr from the European market. Zeebrugge, Montoir, and Gate terminals are the primary entry points for Russian LNG. The timeline remains uncertain but is expected before Q3 2026.<\/p><p><strong>Russia pipeline flows:<\/strong> TurkStream continues at approximately 42 mcm/d, serving Hungary, Serbia, and Austria via the Balkan route. No changes in flow patterns. Pre-war total Russian pipeline exports to Europe exceeded 400 mcm/d — the current ~10% of that volume represents the new structural baseline.<\/p><p><strong>Hormuz Scenario Matrix:<\/strong><\/p><p><strong>Scenario:<\/strong> Status quo / stalemate<br><strong>Duration:<\/strong> Ongoing<br><strong>Prob.:<\/strong> 50%<br><strong>LNG Stranded:<\/strong> ~340 mcm/d<br><strong>TTF Impact:<\/strong> €45-50 range<br><\/p><p><strong>Scenario:<\/strong> US naval escort success<br><strong>Duration:<\/strong> 2-4 weeks<br><strong>Prob.:<\/strong> 20%<br><strong>LNG Stranded:<\/strong> Partial restart<br><strong>TTF Impact:<\/strong> ▼ to €38-42<br><\/p><p><strong>Scenario:<\/strong> Escalation: Iran attacks escorts<br><strong>Duration:<\/strong> 1-2 weeks<br><strong>Prob.:<\/strong> 15%<br><strong>LNG Stranded:<\/strong> Full Hormuz closure<br><strong>TTF Impact:<\/strong> ▲ to €65-80<br><\/p><p><strong>Scenario:<\/strong> Diplomatic breakthrough<br><strong>Duration:<\/strong> Q3 2026<br><strong>Prob.:<\/strong> 10%<br><strong>LNG Stranded:<\/strong> Gradual restart<br><strong>TTF Impact:<\/strong> ▼ to €35-40<br><\/p><p><strong>Scenario:<\/strong> Regional war expansion<br><strong>Duration:<\/strong> 1-3 months<br><strong>Prob.:<\/strong> 5%<br><strong>LNG Stranded:<\/strong> All Gulf exports halt<br><strong>TTF Impact:<\/strong> ▲ to €100+<br><\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>The 50% probability on status quo is too conservative — this stalemate has proven remarkably stable. Both sides have incentives to maintain it: Iran keeps its leverage, the US avoids escalation. The real tail risk isn't war — it's a sudden, uncoordinated ceasefire that floods the market with pent-up LNG cargoes, crashing prices 20-30% in days.<\/div><\/div><h3>💡 Trade Ideas<\/h3><ul><li><strong>Long TTF Sep €60 Call (Hormuz Tail):<\/strong> Premium ~€1.50. Pays 5-10x if escalation resumes. Pure convexity play on geopolitical risk.<\/li><li><strong>Short TTF Dec €40 Put (Diplomatic Breakthrough):<\/strong> If Hormuz reopens, TTF drops to €35-40. Sell the put to collect premium while expressing a moderately bullish base case.<\/li><li><strong>Long TTF Cal '27 at €57:<\/strong> TradingEconomics forecasts €57.17 in 12 months. The structural supply deficit from Hormuz + Russian LNG sanctions supports forward prices. Buy and hold.<\/li><\/ul>","sig":"Henry 🦉","factChecked":true},{"t":"strategy","badge":"📊 🎯 Risk Flags & Outlook","title":"Three Risks, One Trade: The Asymmetric Bull Case in European Gas","hook":"Hormuz stalemate, storage deficit, and Norwegian maintenance create a triple threat that makes the path of least resistance higher — but the binary downside of a diplomatic breakthrough demands hedging.","authorWord":"Top risks: Hormuz stalemate persistence (high prob, high impact), storage injection shortfall (medium prob, high impact), Norway maintenance surprise (low prob, medium impact). Core trade: TTF Q4 calls.","author":"La Rédaction 🦊","details":"<h3>TOP 3 RISKS (Probability × Impact)<\/h3><ol><li><strong>Hormuz stalemate persists through summer<\/strong> — Probability: 50%, Impact: HIGH. If no LNG restart by July, EU injection campaign misses 90% target, creating a structural deficit heading into winter 26-27. This is the dominant risk driver.<\/li><li><strong>Storage injection falls behind schedule<\/strong> — Probability: 40%, Impact: HIGH. At current 34% fill vs 5Y avg of 42%, the EU needs exceptional injection pace. High TTF prices incentivize injection, but LNG supply constraints limit availability. A summer supply squeeze is plausible.<\/li><li><strong>Escalation in US-Iran conflict<\/strong> — Probability: 15%, Impact: VERY HIGH. Any resumption of military strikes, mining of Hormuz, or tanker attacks would spike TTF to 65-80 EUR in a single session. The upside tail is fat and underpriced.<\/li><\/ol><h3>BULL SCENARIO — Storage Panic (30% probability)<\/h3><p>Hormuz remains closed through July. EU storage injections lag the required pace by 15-20% through June-July. By August, the market prices in a sub-80% fill by November, and TTF surges to 55-60 EUR as utilities scramble for winter supply.<\/p><p><strong>Trade:<\/strong> Long TTF Oct 26 at 48 EUR, target 58 EUR. Or long TTF Oct 55 EUR call for leveraged upside (~1.80 EUR premium).<\/p><h3>BEAR SCENARIO — Hormuz Reopens (20% probability)<\/h3><p>A diplomatic breakthrough or successful US naval escort operation restores LNG flows through Hormuz. Pent-up Qatari and UAE cargoes flood the market simultaneously, crashing the TTF premium by 20-30% in a week.<\/p><p><strong>Trade:<\/strong> Long TTF Jun 43 EUR put (~0.80 EUR premium). If TTF drops to 38 EUR on Hormuz reopening, the put pays 5x.<\/p><h3>WILD CARD — Regional War Expansion (5% probability)<\/h3><p>Conflict expands to direct US-Iran military engagement. Hormuz fully closed for months. All Persian Gulf energy exports halt. TTF tests 100+ EUR as Europe faces an existential supply crisis. IEA coordinates emergency measures.<\/p><p><strong>Trade:<\/strong> Long TTF Sep 80 EUR call strangle (80C/35P). Premium ~2.50 EUR total. Pays 10-20x in the tail scenario. This is cheap insurance.<\/p><h3>CATALYSTS TO WATCH THIS WEEK<\/h3><ul><li><strong>May 7:<\/strong> US EIA Weekly Natural Gas Storage Report — watch for narrowing surplus vs 5Y avg<\/li><li><strong>May 7-8:<\/strong> Any Hormuz transit data updates from tanker tracking (Kpler, MarineTraffic)<\/li><li><strong>May 8:<\/strong> EU Gas Storage weekly update via AGSI+ — injection pace vs required trajectory<\/li><li><strong>Ongoing:<\/strong> US-Iran diplomatic signals — any movement on naval blockade negotiations<\/li><li><strong>Ongoing:<\/strong> <a href=\"https://gassco.eu/nyheter/\" target=\"_blank\">Gassco<\/a> Norwegian maintenance schedule updates — any unplanned outages<\/li><\/ul><h3>POSITIONING CONTEXT<\/h3><p>Per <a href=\"https://tradingeconomics.com/commodity/eu-natural-gas\" target=\"_blank\">TradingEconomics<\/a>, the forward curve is in steep backwardation (near-month premium vs winter), reflecting the market's anxiety about near-term supply. Storage deficit + Hormuz + maintenance = the market is paying up for certainty of supply NOW. This backwardation typically resolves either through supply normalization (bearish) or demand panic (very bullish). The asymmetry favors upside positioning via cheap options.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The market is overfocused on Hormuz and underpricing the demand-side collapse. Negative power prices across Europe, warm weather, and industrial demand softness create a powerful bearish undercurrent. If TTF fails to hold 45 EUR support, a cascade to 40 EUR is technically possible — and the option market is not pricing this.<\/div><\/div><h3>💡 Trade Ideas<\/h3><ul><li><strong>Core: Long TTF Oct 26 55 EUR Call<\/strong> — Premium ~1.80 EUR. Target 10+ EUR if storage panic materializes. Defined risk, unlimited upside.<\/li><li><strong>Hedge: Long TTF Jun 43 EUR Put<\/strong> — Premium ~0.80 EUR. Insurance against Hormuz breakthrough. Pays 5x on a crash to 38 EUR.<\/li><li><strong>Relative Value: Long TTF/Short HH on Q4<\/strong> — Expresses the view that EU supply risk widens the Atlantic basin premium. The spread is already extreme but can go wider.<\/li><\/ul>","sig":"La Rédaction 🦊","factChecked":true},{"t":"analysis","badge":"🎲 Scénarios","title":"7 Scenarios for TTF — Summer 2026 Outlook","hook":"The council votes on 7 market scenarios from stalemate range-bound to supply crisis, with consensus probabilities and the key dissent.","authorWord":"7 scenarios voted. Consensus: 35% range-bound €45-50 through summer. Biggest tail: storage panic at 20% probability.","author":"Le Conseil 🎲","details":"<div class=\"scenario-block\"><h3>S1 — Range-Bound: TTF Holds €45-50 Through Summer <span class=\"proba\">35%<\/span><\/h3><p>Hormuz stalemate continues but is priced in. Warm weather caps demand. Injection season progresses slowly but steadily. No breakout catalyst. TTF trades €45-50 range through Q2-Q3.<\/p><p class=\"votes\">Apex 30% · Sage 35% · Nova 40% · Blaise 35% · Lyra 38% · Dante 32% · Felix 35%<\/p><\/div><div class=\"scenario-block\"><h3>S2 — Storage Panic: Injections Miss, TTF Surges to €55-60 <span class=\"proba\">20%<\/span><\/h3><p>By mid-July, EU storage tracks below 50% vs ~60% seasonal norm. Market prices in sub-80% November fill. Utilities panic-buy summer contracts. TTF breaks above €55 and tests €60.<\/p><p class=\"votes\">Apex 22% · Sage 18% · Nova 20% · Blaise 22% · Lyra 20% · Dante 22% · Felix 16%<\/p><\/div><div class=\"scenario-block\"><h3>S3 — Hormuz Breakthrough: LNG Flows Resume, TTF Crashes to €35-40 <span class=\"proba\">18%<\/span><\/h3><p>Diplomatic deal or successful naval escort reopens Hormuz. Pent-up LNG supply floods market. TTF drops 15-20% in days, testing €35 support. Storage injection pace accelerates sharply.<\/p><p class=\"votes\">Apex 18% · Sage 15% · Nova 20% · Blaise 20% · Lyra 18% · Dante 20% · Felix 15%<\/p><\/div><div class=\"scenario-block\"><h3>S4 — Supply Squeeze: Norway Maintenance + LNG Shortfall <span class=\"proba\">12%<\/span><\/h3><p>Unplanned Norwegian maintenance coincides with continued LNG supply constraints. EU imports fall 10-15% below seasonal needs for 4-6 weeks. TTF spikes to €55+ in a mini-crisis.<\/p><p class=\"votes\">Apex 15% · Sage 12% · Nova 10% · Blaise 10% · Lyra 12% · Dante 12% · Felix 13%<\/p><\/div><div class=\"scenario-block\"><h3>S5 — Demand Collapse: Warm Summer + Industrial Slowdown <span class=\"proba\">8%<\/span><\/h3><p>An exceptionally warm summer kills cooling demand while European industrial gas consumption continues to decline. Storage fills faster than expected despite Hormuz. TTF drops below €40.<\/p><p class=\"votes\">Apex 8% · Sage 10% · Nova 5% · Blaise 8% · Lyra 8% · Dante 8% · Felix 9%<\/p><\/div><div class=\"scenario-block\"><h3>S6 — ⚠️ Hormuz Military Escalation: TTF to €70-85 <span class=\"proba\">5%<\/span><\/h3><p>Resumption of military strikes near Hormuz or direct attacks on LNG infrastructure. Insurance market withdraws all Gulf coverage. TTF spikes €20+ in a single session, testing €70-85. IEA emergency measures activated.<\/p><p class=\"votes\">Apex 5% · Sage 7% · Nova 3% · Blaise 3% · Lyra 3% · Dante 5% · Felix 9%<\/p><\/div><div class=\"scenario-block\"><h3>S7 — ⚠️ Full Supply Crisis: Regional War + Storage Failure <span class=\"proba\">2%<\/span><\/h3><p>Worst case: Hormuz fully militarized, Norway suffers major unplanned outage simultaneously. EU faces genuine supply shortage. Strategic rationing discussed. TTF tests €100+. Governments intervene in markets.<\/p><p class=\"votes\">Apex 2% · Sage 3% · Nova 2% · Blaise 2% · Lyra 1% · Dante 1% · Felix 3%<\/p><\/div><p class=\"consensus\"><strong>🎯 Consensus :<\/strong> The council assigns 73% combined probability to TTF trading in the €35-60 range through summer, with the skew firmly to the upside. The asymmetry between bull tail (€70+) and bear tail (€35) favors defensive long positioning via cheap options.<\/p><div class='dissent'><div class='dissent-label'>🔥 Dissent — Dante 🔥<\/div><div class='dissent-text'>The council is underweighting the demand-destruction scenario. At €47+, European industry is already switching fuels and reducing gas consumption. A 5% demand drop is as impactful as a 5% supply loss — and demand destruction is accelerating while supply is slowly recovering. The range should be centered lower, not higher.<\/div><\/div>","sig":"Le Conseil 🎲","factChecked":true},{"t":"analysis","badge":"📊 🌍 Scénario Géopolitique","title":"Hormuz Diplomatic Deadlock — 7 Geopolitical Scenarios for European Gas","hook":"The council deliberates on 7 real geopolitical scenarios impacting gas, from stalemate persistence to regional war escalation — with consensus probability and dissent.","authorWord":"7 geopolitical scenarios voted by the council. Consensus: 50% stalemate persists. Tail risk: 5% regional war expansion.","author":"Le Conseil 🌍","details":"<div class='scenario-block'><h3>S1 — Hormuz Stalemate Persists Through Summer <span class='proba'>50%<\/span><\/h3><p>No diplomatic breakthrough. Iran refuses to negotiate without blockade lift; US refuses to lift without concessions. LNG remains stalled at ~340 mcm/d lost. EU storage injection campaign misses targets, filling to ~78% by November vs 90% mandate.<\/p><p class='votes'>Apex 50% · Sage 55% · Nova 45% · Blaise 48% · Lyra 52% · Dante 45% · Felix 55%<\/p><\/div><div class='scenario-block'><h3>S2 — US Naval Escort Successfully Reopens Partial LNG Flow <span class='proba'>20%<\/span><\/h3><p>US Navy escorts restart limited commercial transit. Insurance market cautiously returns. Qatar resumes partial exports (~40% of pre-war volume) within 4-6 weeks. TTF eases to €40-42 on the news.<\/p><p class='votes'>Apex 20% · Sage 18% · Nova 22% · Blaise 25% · Lyra 18% · Dante 22% · Felix 15%<\/p><\/div><div class='scenario-block'><h3>S3 — EU Russian LNG Sanctions Take Effect in Q3 <span class='proba'>15%<\/span><\/h3><p>The EU's next sanctions package bans Russian LNG spot purchases and transshipment, removing 5-7 bcm/yr from the market. Combined with Hormuz disruption, this creates a supply squeeze pushing TTF to €55-60 by August.<\/p><p class='votes'>Apex 15% · Sage 12% · Nova 18% · Blaise 12% · Lyra 15% · Dante 18% · Felix 12%<\/p><\/div><div class='scenario-block'><h3>S4 — Ceasefire Expands to Hormuz Maritime Agreement <span class='proba'>8%<\/span><\/h3><p>Backchannel diplomacy produces a maritime demilitarization agreement for the Gulf. Full LNG restart within 2 months. Pent-up cargoes flood market. TTF crashes to €35-38.<\/p><p class='votes'>Apex 8% · Sage 7% · Nova 10% · Blaise 8% · Lyra 10% · Dante 8% · Felix 8%<\/p><\/div><div class='scenario-block'><h3>S5 — Iran Regime Internal Pressure Forces Concessions <span class='proba'>4%<\/span><\/h3><p>Economic pressure from the blockade on Iran's own trade (non-oil commerce through Hormuz) creates domestic political unrest. Tehran signals willingness to negotiate LNG transit guarantees in exchange for partial sanctions relief.<\/p><p class='votes'>Apex 3% · Sage 5% · Nova 3% · Blaise 5% · Lyra 3% · Dante 5% · Felix 5%<\/p><\/div><div class='scenario-block'><h3>S6 — ⚠️ Military Escalation: Iran Attacks US Escort Vessels <span class='proba'>2%<\/span><\/h3><p>Iran targets a US naval escort vessel near Hormuz. US retaliates with strikes on Iranian coastal facilities. Full Hormuz closure for 2-4 weeks. TTF spikes to €70-85. IEA emergency coordination activated.<\/p><p class='votes'>Apex 3% · Sage 2% · Nova 1% · Blaise 1% · Lyra 2% · Dante 1% · Felix 4%<\/p><\/div><div class='scenario-block'><h3>S7 — ⚠️ Regional War Expansion: Direct US-Iran Full Conflict <span class='proba'>1%<\/span><\/h3><p>Conflict escalates beyond Hormuz to direct US-Iran military engagement across the Gulf. All Persian Gulf energy infrastructure at risk. Global LNG supply crisis. TTF tests €100+. Strategic gas rationing considered in Europe.<\/p><p class='votes'>Apex 1% · Sage 1% · Nova 1% · Blaise 1% · Lyra 0% · Dante 1% · Felix 1%<\/p><\/div><p class='consensus'><strong>🎯 Consensus :<\/strong> The council sees a 70% probability that Hormuz remains disrupted through summer (stalemate or slow escalation), creating a persistent structural supply deficit that will challenge EU storage targets and support elevated TTF prices in the €45-55 range.<\/p><div class='dissent'><div class='dissent-label'>🔥 Contre-narratif — Dante 🔥<\/div><div class='dissent-text'>The council is anchoring on stalemate because it's the comfortable consensus. But markets don't reward comfort. The underpriced scenario is S4 — a sudden maritime deal. When both sides are economically exhausted, breakthroughs happen fast and without warning. A 20% TTF crash in a single week is more likely than the 8% we're assigning.<\/div><\/div>","sig":"Le Conseil 🌍","factChecked":true},{"t":"end","end":true,"disclaimer":"⚠️ AVERTISSEMENT — Ce document est un exercice expérimental de veille automatisée produit par intelligence artificielle. Il ne constitue EN AUCUN CAS un conseil en investissement, une recommandation de trading, ni une analyse financière réglementée au sens de la directive MiFID II ou du Code monétaire et financier (art. L541-1). Les « scénarios de marché » présentés sont des hypothèses pédagogiques générées par des modèles de langage — ils ne reflètent pas l'avis d'un professionnel agréé. Les données proviennent de sources publiques, potentiellement retardées ou erronées. Toute décision d'investissement prise sur la base de ce document relève de la seu       const emoji=d.home?'📰':d.end?'✅':(d.badge||'').split(' ')[0]||'📄';
      const label=d.home?'Accueil':d.end?'Fin':(d.badge||'').split(' ').slice(1).join(' ')||'';
      const title=d.home?'Sommaire':d.end?'Briefing terminé':d.title||'';
      item.innerHTML=`<div class="dt-nav-badge">${emoji}</div><div class="dt-nav-info"><div class="dt-nav-label">${label}</div><div class="dt-nav-title">${title}</div></div><div class="dt-nav-arrow">›</div>`;
      item.addEventListener('click',()=>selectDesktop(i));
      sb.appendChild(item);
    });
    // Reader
    const rd=document.createElement('div');
    rd.className='dt-reader';
    rd.innerHTML='<div class="dt-reader-inner"></div>';
    dtShell.appendChild(sb);
    dtShell.appendChild(rd);
    document.body.appendChild(dtShell);
    selectDesktop(0);
  }
  function selectDesktop(idx){
    dtSelected=idx;
    const items=dtShell.querySelectorAll('.dt-nav-item');
    items.forEach((it,i)=>it.classList.toggle('dt-selected',i===idx));
    const d=DATA[idx];
    const inner=dtShell.querySelector('.dt-reader-inner');
    if(d.home){
      const arts=d.articles?d.articles.map(a=>`<div class="dt-nav-item" style="cursor:pointer;opacity:.7;padding:10px 14px;margin-bottom:4px;border-radius:10px;border:1px solid rgba(255,255,255,.06);" onclick="selectDesktop(${a.idx})"><div class="dt-nav-badge">${a.badge.split(' ')[0]}</div><div class="dt-nav-info"><div class="dt-nav-label">${a.badge.split(' ').slice(1).join(' ')}</div><div class="dt-nav-title">${a.title}</div></div><div class="dt-nav-arrow">›</div></div>`).join(''):'';
      inner.innerHTML=`<div class="dt-r-home-henry"><div class="label">🦊 L'Édito du Jour</div><div class="text">${d.henryWord||''}</div></div>${arts}`;
    } else if(d.end){
      inner.innerHTML=`<div style="text-align:center;padding:60px 0;"><div style="font-size:3.5rem;margin-bottom:16px;">🎉</div><h2 style="font-size:1.6rem;font-weight:800;margin-bottom:12px;">Briefing terminé !</h2><p style="color:var(--muted);font-size:1rem;margin-bottom:24px;line-height:1.5;">Vous avez parcouru le briefing du jour. À demain !</p><a href="../index.html" style="display:inline-block;padding:12px 32px;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;">📰 Toutes les éditions</a></div>`;
    } else {
      const authorHtml=d.authorWord?`<div class="dt-r-author"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author||''}</div></div>`:'';
      inner.innerHTML=`<span class="dt-r-badge ${d.t||''}">${d.badge||''}</span><h1 class="dt-r-title">${d.title||''}</h1>${authorHtml}<div class="dt-r-hook">${d.hook||''}</div><div class="dt-r-body">${d.details||''}</div><div class="dt-r-sig">Gas Morning Brief — 6 Mai 2026</div>`;
    }
    dtShell.querySelector('.dt-reader').scrollTop=0;
    // Scroll sidebar item into view
    items[idx]&&items[idx].scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  function destroyDesktop(){
    if(dtShell){dtShell.remove();dtShell=null;}
  }
  function checkDesktop(){
    if(window.innerWidth>=900){
      deck.style.display='none';
      buildDesktop();
      dtShell.style.display='';
    } else {
      if(dtShell)dtShell.style.display='none';
      deck.style.display='';
      update(false);
    }
  }
  // Keyboard nav for desktop
  document.addEventListener('keydown',e=>{
    if(window.innerWidth<900)return;
    if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();if(dtSelected<DATA.length-1)selectDesktop(dtSelected+1);}
    if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();if(dtSelected>0)selectDesktop(dtSelected-1);}
  });
  checkDesktop();window.addEventListener('resize',checkDesktop);
  // Theme toggle
  (function(){
    const btn=document.getElementById('themeToggle');
    const saved=localStorage.getItem('theme');
    if(saved==='light'){document.documentElement.classList.add('light');btn.textContent='☀️';}
    btn.addEventListener('click',()=>{
      const isLight=document.documentElement.classList.toggle('light');
      btn.textContent=isLight?'☀️':'🌙';
      localStorage.setItem('theme',isLight?'light':'dark');
    });
  })();
  </script>
</body>
</html>
