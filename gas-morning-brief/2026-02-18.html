<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gas Morning Brief — 18 Février 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    html.light .details div[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Light mode: override inline white colors in trade cards */
    html.light .details p[style], html.light .details b[style], html.light .details span[style], html.light .details div[style] { color: rgba(0,0,0,.85) !important; }
    html.light .details div[style*="border-left:3px solid #f59e0b"] { background: rgba(245,158,11,.08) !important; }
    html.light .details div[style*="border-left:3px solid #10b981"] { background: rgba(16,185,129,.08) !important; }
    html.light .details div[style*="border-left:3px solid #ff4757"] { background: rgba(255,71,87,.06) !important; }
    html.light .details div[style*="color:#f59e0b"] { color: #b45309 !important; }
    html.light .details div[style*="color:#10b981"] { color: #047857 !important; }
    html.light .details div[style*="color:#ff4757"] { color: #dc2626 !important; }
    html.light .details h3 { color: #1a1a2e !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }

      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }
      .dt-reader .dt-r-body p { margin-bottom: 18px; }
      .dt-reader .dt-r-body strong { color: #fff; font-weight: 600; }
      .dt-reader .dt-r-body a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
      .dt-reader .dt-r-body .quote { border-left: 3px solid var(--blue); padding: 14px 18px; margin: 20px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-style: italic; font-size: .95rem; line-height: 1.6; color: rgba(255,255,255,.9); }
      .dt-reader .dt-r-body .dissent { margin-top: 24px; padding: 16px 18px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }

  <script>
  const DATA = [{"t":"home","home":true,"date":"18 Février 2026","henryWord":"Gas markets are pricing a premature spring while sitting on the thinnest storage cushion since 2022. The polar vortex disruption entering monitoring this week and the 67-day countdown to the EU Russian LNG ban suggest the downside from here is limited — but the upside tail risk is severe.","articles":[{"badge":"⚡ 💰 Price Action","title":"TTF Slides to 5-Week Low; HH Breaks Below $3.10 on Warm Forecasts","idx":1},{"badge":"⚡ 🚢 LNG & Flows","title":"LNG Floods Europe as Asian Demand Slumps; Golden Pass Ramps Up","idx":2},{"badge":"⚡ ⚡ Power & Carbon","title":"Spark Spreads Compress as Gas Slides; EUA Holds Above €72","idx":3},{"badge":"📊 🌡️ Weather & Demand","title":"Polar Vortex Split Enters Monitoring — Late Feb Cold Risk Climbs","idx":4},{"badge":"📊 📦 Storage Watch","title":"EU Storage at 34%, Netherlands Hits Record Low Below 15%","idx":5},{"badge":"📊 💣 Geopolitics & Regulation","title":"EU Russian Gas Ban Countdown: 67 Days to LNG Cutoff","idx":6},{"badge":"📊 🎯 Risk Flags & Outlook","title":"Three Risks the Market Is Underpricing This Week","idx":7}]},{"t":"alert","badge":"⚡ 💰 Price Action","title":"TTF Slides to 5-Week Low; HH Breaks Below $3.10 on Warm Forecasts","hook":"European and US gas benchmarks extended their rout on Tuesday as mild weather forecasts crushed heating demand expectations. TTF settled below €30.50 while Henry Hub plunged toward the $3.00 psychological floor.","authorWord":"Gas markets continued their post-Winter-Storm-Fern unwind on Tuesday Feb 17 with TTF and Henry Hub both printing fresh multi-week lows amid a dramatic shift in weather sentiment and oversupply concerns.","author":"Blaise 🧮","details":"<p>The Dutch TTF front-month settled at <strong>€30.30/MWh<\/strong> (close Tue 17 Feb), down €0.46 on the session — marking a 5-week low and extending the retreat from the €36+ levels seen just days earlier. The move reflects a broader capitulation of winter premium as weather models shifted decisively warmer across northwest Europe. Source: <a href='https://www.ice.com/products/27996665/Dutch-TTF-Gas-Futures/data' target='_blank'>ICE Endex TTF<\/a>.<\/p><p>Across the Atlantic, the Henry Hub front-month (March NYMEX) settled at <strong>$3.031/MMBtu<\/strong> (settle Tue 17 Feb), ▼$0.212 (−6.5%), after breaching the critical $3.20 support level and trading as low as $3.09 intraday. US production has rebounded to a record <strong>120.8 Bcf/d<\/strong>, overwhelming demand that is fading fast as the Eastern US warms. The last EIA withdrawal (249 Bcf for week ending Feb 6) disappointed expectations, confirming the demand taper. Source: <a href='https://www.cmegroup.com/markets/energy/natural-gas/natural-gas.html' target='_blank'>CME NYMEX Natural Gas<\/a>.<\/p><p><strong>Key levels:<\/strong> TTF support at €29.50 (Jan low), resistance now at €31.50. HH $3.00 is the psychological floor — a clean break opens $2.80. The Feb/Mar HH spread collapsed from the historic $7.46 vs $3.73 differential seen in late January, signaling the end of the winter squeeze.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Sage 🦎<\/div><div class='dissent-text'>Markets may be pricing mild weather too aggressively. EU storage at 34% is a 4-year low for mid-February, and any return of cold in Week 3-4 (polar vortex disruption now under monitoring for Feb 22) could trigger a violent short squeeze — particularly in TTF where speculative shorts have built rapidly.<\/div><\/div>","sig":"Blaise 🧮 · Gas Morning Brief"},{"t":"alert","badge":"⚡ 🚢 LNG & Flows","title":"LNG Floods Europe as Asian Demand Slumps; Golden Pass Ramps Up","hook":"A surge of LNG cargoes is hitting European terminals as Lunar New Year suppresses Asian buying. Golden Pass export ramp-up adds fresh supply, but Rügen remains frozen shut.","authorWord":"European LNG imports are outpacing recent weeks as weak Asian demand redirects cargoes westward, providing a cushion against critically low storage levels while Golden Pass begins commercial operations.","author":"Henry 🦉","details":"<p>European LNG arrivals have accelerated into mid-February, with sendout rates rising across major terminals as the Atlantic Basin absorbs cargoes that would typically head to Asia. The <strong>JKM-TTF spread<\/strong> has narrowed significantly, reducing the arbitrage incentive for eastbound flows. Asian demand remains subdued post-Lunar New Year, with Chinese buyers largely absent from the spot market. Source: <a href='https://www.naturalgasintel.com/news/lng-floods-europe-keeping-lid-on-ttf-prices-despite-storage-deficit/' target='_blank'>Natural Gas Intelligence<\/a>.<\/p><p><strong>Golden Pass LNG<\/strong> (Texas) is ramping up its first train, adding incremental US export capacity to a market already producing at record levels. US LNG feed gas flows remain robust above 15 Bcf/d. Meanwhile, Germany's <strong>Rügen FSRU terminal<\/strong> remains shut since Feb 11 due to ice blockage in the Baltic — a non-trivial loss of ~5 bcm/yr regas capacity during peak demand season. Source: <a href='https://blackout-news.de/en/news/lng-terminal-on-ruegen-shut-down-ice-cover-blocks-access-for-lng-tankers/' target='_blank'>Blackout News<\/a>.<\/p><p>Pipeline flows from Norway via Langeled and Europipe remain stable. The <strong>Druzhba oil pipeline blockade<\/strong> by Ukraine continues to dominate the transit corridor narrative, with Hungary seeking alternative routes through Croatia — though gas transit is not directly affected, the geopolitical temperature around transit infrastructure remains elevated. Source: <a href='https://www.reuters.com/business/energy/russian-oil-transit-via-druzhba-pipeline-suspended-ukraine-foreign-ministry-says-2026-02-12/' target='_blank'>Reuters<\/a>.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Sage 🦎<\/div><div class='dissent-text'>The LNG glut may prove temporary. Post-Lunar New Year Asian restocking typically begins in late February, and with EU storage needing massive refill (from ~26% end-March to 90% by November), competition for summer cargoes could tighten faster than the market expects.<\/div><\/div>","sig":"Henry 🦉 · Gas Morning Brief"},{"t":"tech","badge":"⚡ ⚡ Power & Carbon","title":"Spark Spreads Compress as Gas Slides; EUA Holds Above €72","hook":"Falling gas prices are squeezing gas-to-power margins while coal retakes competitiveness in some hours. EUA carbon permits stabilized after last week's selloff.","authorWord":"Gas-power economics are shifting as TTF's slide compresses spark spreads, while EUA carbon prices find support above the €72 floor amid ongoing EU ETS reform uncertainty.","author":"Sage 🦎","details":"<p>The <strong>clean spark spread<\/strong> (gas-to-power margin) compressed on Tuesday as TTF's decline outpaced the drop in German day-ahead power prices. With TTF at €30.30/MWh, gas-fired plants remain in the money but margins are thinning. The <strong>clean dark spread<\/strong> (coal-to-power) has improved relatively, suggesting coal could recapture baseload share if gas prices stabilize at these levels. Source: <a href='https://www.epexspot.com/en' target='_blank'>EPEX SPOT<\/a>.<\/p><p><strong>EUA carbon permits<\/strong> settled around <strong>€73/t<\/strong> (close Tue 17 Feb), stabilizing after the sharp selloff from €76+ triggered by speculation around CDU's Friedrich Merz and potential ETS reform discussions post-election. The €72 level has acted as solid support — the floor from the Feb 10-14 selloff. Compliance buyers are providing a bid, but political uncertainty around Germany's new government keeps the upside capped. Source: <a href='https://www.ice.com/products/197/EUA-Futures' target='_blank'>ICE EUA Futures<\/a>.<\/p><p>Renewable generation offered mixed signals: wind output across NW Europe was below seasonal norms mid-week, supporting residual gas-for-power demand. However, the mild temperature outlook reduces overall electricity consumption, partially offsetting the wind deficit. French nuclear availability remains high at ~85% of capacity. Source: <a href='https://transparency.entsoe.eu/' target='_blank'>ENTSO-E Transparency<\/a>.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Henry 🦉<\/div><div class='dissent-text'>The EUA support at €72 may not hold if Merz forms a coalition that accelerates ETS supply via additional allowance auctions. Political risk to carbon is underpriced — watch the coalition talks closely. A break below €72 opens €68 and would further erode gas-to-power competitiveness.<\/div><\/div>","sig":"Sage 🦎 · Gas Morning Brief"},{"t":"analysis","badge":"📊 🌡️ Weather & Demand","title":"Polar Vortex Split Enters Monitoring — Late Feb Cold Risk Climbs","hook":"Stratospheric warming event on Feb 22 now under official monitoring. If the vortex splits, Europe faces a northerly flow regime into March that could dramatically extend the heating season.","authorWord":"A major stratospheric sudden warming event is developing that could disrupt the polar vortex by Feb 22, reshaping the late-winter temperature outlook for Europe and challenging the current mild weather consensus.","author":"Sage 🦎","details":"<p>Atmospheric analyst Andrej Flis reports that <strong>strong wave interactions are already visible<\/strong> in the stratosphere, with a polar vortex disruption event entering official monitoring for <strong>February 22, 2026<\/strong>. ECMWF extended-range models show two high-pressure lobes creating a <strong>split vortex core<\/strong>, with one core pushed toward the European sector — a classic setup for sustained northerly flow at surface levels across northern, central, and western Europe. Source: <a href='https://www.severe-weather.eu/long-range-2/spring-2026-forecast-la-nina-collapse-europe-seasonal-weather-fa' target='_blank'>Severe Weather Europe<\/a>.<\/p><p>The timing is critical: if the split materializes, blocking patterns and cold outbreaks could dominate <strong>late February through mid-March<\/strong> — precisely when the market is pricing in an early shoulder season. Current 6-10 day models show above-normal temperatures for the US East Coast (suppressing HH), but European Week 3-4 outlooks are turning colder as the stratospheric signal propagates downward. The La Niña collapse adds uncertainty, with ENSO transitioning rapidly toward neutral/El Niño conditions. Source: <a href='https://www.cpc.ncep.noaa.gov/' target='_blank'>NOAA CPC<\/a>.<\/p><p>Cumulative HDDs across NW Europe remain <strong>above the 10-year average<\/strong> for the 2025/26 heating season, reflecting January's extreme cold (Winter Storm Fern). Even with the recent mild spell, the season-to-date heating demand has been structurally higher than the prior three winters. Hydro reservoir levels in Norway remain below the 5-year average, sustaining structural gas-for-power demand that won't abate with a mild week or two. Source: <a href='https://www.nve.no/energi/analyser-og-statistikk/magasinstatistikk/' target='_blank'>NVE Norway<\/a>.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮<\/div><div class='dissent-text'>Stratospheric events take 2-4 weeks to propagate to surface weather. The Feb 22 disruption, if it occurs, may not deliver meaningful cold until mid-March — by which point the solar angle and lengthening days structurally reduce heating demand regardless. The market correctly prices lower probability on late-season cold snaps.<\/div><\/div>","sig":"Sage 🦎 · Gas Morning Brief"},{"t":"tech","badge":"📊 📦 Storage Watch","title":"EU Storage at 34%, Netherlands Hits Record Low Below 15%","hook":"European gas inventories continue their rapid drawdown with the Netherlands breaching all-time lows. End-of-winter projections point to just 26% by March 31 — the tightest since the 2022 crisis.","authorWord":"EU gas storage at 34% full as of Feb 14 represents the lowest mid-February level since 2022, with individual country data revealing acute tightness in Germany and the Netherlands.","author":"Blaise 🧮","details":"<p><strong>EU aggregate storage<\/strong> stood at approximately <strong>34% full<\/strong> as of February 14, 2026 — the lowest for this date since the 2022 energy crisis when storage bottomed at similar levels. The drawdown has accelerated despite LNG inflows, driven by sustained heating demand through January's extreme cold and continued below-average temperatures in parts of continental Europe. Source: <a href='https://agsi.gie.eu/' target='_blank'>GIE AGSI+<\/a>.<\/p><p>Country-level data reveals acute stress points: <strong>Germany<\/strong> hit a record low of <strong>23.95%<\/strong> (60.14 TWh working gas), while the <strong>Netherlands<\/strong> dropped <strong>below 15%<\/strong> — an all-time record low for mid-February. These are the two largest consumption markets in NW Europe. Source: <a href='https://brusselssignal.eu/2026/02/dangerously-low-germanys-gas-storage-has-fallen-to-record-lows/' target='_blank'>Brussels Signal<\/a>, <a href='https://tass.com/economy/2087703' target='_blank'>TASS<\/a>.<\/p><p><strong>US working gas in storage<\/strong> stood at <strong>2,214 Bcf<\/strong> (week ending Feb 6), with the last withdrawal of 249 Bcf coming in below expectations. US stocks remain below the 5-year average but the gap is narrowing as mild weather reduces withdrawals. The Feb/Mar shoulder transition is arriving early stateside.<\/p><p><strong>End-of-winter projection:<\/strong> Analysts forecast EU storage at roughly <strong>26% by end-March<\/strong> — meaning Europe must inject approximately 64 percentage points (~700 TWh) between April and October to meet the EU's 90% mandate by November 1. This implies refill rates materially above the 2023 and 2024 pace, requiring sustained high LNG imports through summer. Source: <a href='https://oilprice.com/Latest-Energy-News/World-News/European-Gas-Prices-Slide-as-Mild-Weather-Tempers-Supply-Fears.html' target='_blank'>OilPrice<\/a>.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Henry 🦉<\/div><div class='dissent-text'>The 26% end-March figure assumes continued mild weather. If the polar vortex disruption delivers cold into March, we could exit winter at 20-22% — a level that would force emergency measures and potentially trigger the EU's price cap mechanism. The refill math becomes nearly impossible without Russian pipeline gas, which the EU bans from April 25 (LNG) and June 17 (pipeline).<\/div><\/div>","sig":"Blaise 🧮 · Gas Morning Brief"},{"t":"alert","badge":"📊 💣 Geopolitics & Regulation","title":"EU Russian Gas Ban Countdown: 67 Days to LNG Cutoff","hook":"The EU's phased ban on Russian gas imports is now within sight — LNG imports prohibited from April 25, pipeline gas from June 17. Meanwhile, the Druzhba oil blockade signals Ukraine's escalating infrastructure leverage.","authorWord":"The regulatory and geopolitical clock is ticking on European gas supply with the EU Russian gas ban approaching, Druzhba blockade continuing, and coalition uncertainty in Germany clouding ETS and energy policy.","author":"Henry 🦉","details":"<p><strong>EU Russian gas ban timeline:<\/strong> Under the sanctions framework finalized in 2025, the prohibition on Russian gas imports applies from <strong>April 25, 2026 for LNG<\/strong> and <strong>June 17, 2026 for pipeline gas<\/strong> (for contracts concluded before June 17, 2025). This effectively eliminates the remaining ~15 bcm/yr of Russian LNG flowing to EU terminals, plus any residual pipeline volumes via TurkStream. The clock reads 67 days to the LNG cutoff. Source: <a href='https://www.fieldfisher.com/en/services/international-trade/trade-sanctions-blog/uk-eu-and-us-sanctions-on-russia' target='_blank'>Fieldfisher Sanctions Tracker<\/a>.<\/p><p><strong>Druzhba oil pipeline:<\/strong> Ukraine's Ukrtransnafta continues to block the resumption of Russian oil transit following the January 27 Russian strike on pipeline infrastructure near Brody. Hungary's FM Szijjártó has asked Croatia to open an alternative route. While this is an oil story, it demonstrates Ukraine's willingness to use transit infrastructure as geopolitical leverage — a dynamic that could extend to any future gas transit discussions. Source: <a href='https://www.reuters.com/business/energy/russian-oil-transit-via-druzhba-pipeline-suspended-ukraine-foreign-ministry-says-2026-02-12/' target='_blank'>Reuters<\/a>.<\/p><p><strong>Geneva peace talks:<\/strong> Negotiations continue in Geneva with both humanitarian and territorial dimensions now on the table — a first. Any progress toward a ceasefire could reshape the medium-term gas transit outlook, though market expectations remain low. <strong>Arctic LNG 2:<\/strong> The project continues to ship via Russian icebreakers despite Western sanctions, with ~700k tonnes moved recently. OFAC enforcement remains a question mark under the current US administration. Source: <a href='https://croatia.news-pravda.com/en/world/2026/02/16/3744.html' target='_blank'>Pravda Croatia<\/a>.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮<\/div><div class='dissent-text'>The April 25 LNG ban may face implementation delays or exemptions — precedent from the oil embargo shows the EU tends to build in transition periods when supply tightness is acute. With storage at 4-year lows, Brussels may quietly extend deadlines or grant waivers to avoid triggering a price spike.<\/div><\/div>","sig":"Henry 🦉 · Gas Morning Brief"},{"t":"strategy","badge":"📊 🎯 Risk Flags & Outlook","title":"Three Risks the Market Is Underpricing This Week","hook":"Storage crisis meets complacent weather pricing. The polar vortex signal, Russian gas ban countdown, and refill math create an asymmetric risk profile that the front-month selloff ignores.","authorWord":"The convergence of critically low storage, an approaching Russian gas ban, and a potential polar vortex disruption creates a uniquely asymmetric risk setup where downside appears limited but tail risks are severe.","author":"La Rédaction 🦊","details":"<p><strong>🔴 TOP 3 RISKS (probability × impact):<\/strong><\/p><ol><li><strong>Polar vortex split delivers late-Feb cold to Europe<\/strong> (40% probability, HIGH impact): If the Feb 22 stratospheric event propagates to surface weather by early March, heating demand surges into storage that's already at 34%. TTF could retest €35+ within days.<\/li><li><strong>EU Russian gas ban implementation without waiver<\/strong> (65% probability, HIGH impact): April 25 LNG cutoff removes ~15 bcm/yr from EU supply. Summer refill without Russian molecules requires near-perfect LNG availability and mild summer weather — a fragile assumption.<\/li><li><strong>Asian LNG restocking competes with EU refill<\/strong> (70% probability, MEDIUM impact): Post-Lunar New Year Asian buying typically resumes late February. If JKM-TTF spread flips, cargoes redirect east precisely when Europe needs maximum imports.<\/li><\/ol><p><strong>🟢 BULL SCENARIO (1-2 weeks):<\/strong> Polar vortex disruption materializes, cold snap hits NW Europe by Feb 25-28. Storage withdrawals accelerate, Netherlands approaches single-digit fill. TTF spikes to €35-38/MWh on short covering. HH follows on sympathy and improved LNG export economics.<\/p><p><strong>🔻 BEAR SCENARIO:<\/strong> Mild weather persists through month-end, vortex event fizzles. TTF breaks €29.50 support as the market prices early shoulder season. HH tests $2.80 with US production at record highs. Asian demand stays dormant, LNG oversupply persists.<\/p><p><strong>📅 CATALYSTS THIS WEEK:<\/strong><\/p><ul><li>Wed Feb 18: <a href=\"https://www.ecmwf.int/en/forecasts\" target=\"_blank\">ECMWF<\/a> extended range update (vortex propagation signal)<\/li><li>Thu Feb 19: EIA weekly storage report (US, for week ending Feb 13)<\/li><li>Fri Feb 20: GIE AGSI+ weekly update (EU storage as of Feb 17)<\/li><li>Ongoing: Geneva peace talks — any breakthrough shifts medium-term gas transit pricing<\/li><li>Ongoing: German coalition talks — implications for ETS reform and energy policy<\/li><\/ul><p><strong>POSITIONING CONTEXT:<\/strong> The curve is in steep backwardation (TTF Summer 26 well below front-month), reflecting the market's bet on adequate refill. But the refill math from 26% to 90% in 7 months is historically unprecedented without Russian supply. If front-month stays above €30 through March, the curve must flatten — either spot falls or the back end reprices higher.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Henry 🦉<\/div><div class='dissent-text'>The bull scenario overweights the vortex risk. Stratospheric events are notoriously unreliable predictors of surface weather, and the market has already priced one cold scare this winter (Storm Fern). The real risk is that Europe muddles through with elevated but manageable prices, and the summer refill proceeds on schedule with abundant global LNG supply from Golden Pass, Plaquemines, and expanded Qatar capacity.<\/div><\/div>","sig":"La Rédaction 🦊 · Gas Morning Brief"},{"t":"end","end":true,"disclaimer":"This document is an automated summary for informational purposes only. It does not constitute investment advice, trading recommendation, or regulated financial analysis. Data comes from free public sources, potentially delayed (15-30 min for prices, D+1 for EIA/GIE stocks). Figures may contain errors from scraping or AI interpretation. Always verify on primary sources before any decision. Generated by LLM — qualitative analyses reflect statistical patterns, not expert judgment."}];

          <a href="../index.html" style="display:inline-block;padding:12px 32px;border:none;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;box-shadow:0 0 25px rgba(59,130,246,.4);margin-bottom:12px;">📰 Toutes les éditions</a><br><button id="restart">🔄 Recommencer</button><div style="margin-top:20px;padding:14px 16px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);border-radius:10px;font-size:.7rem;color:var(--muted);line-height:1.5;text-align:left;">⚠️ AVERTISSEMENT — Ce document est un exercice expérimental de veille automatisée produit par intelligence artificielle. Il ne constitue EN AUCUN CAS un conseil en investissement, une recommandation de trading, ni une analyse financière réglementée au sens de la directive MiFID II ou du Code monétaire et financier (art. L541-1). Les « scénarios de marché » présentés sont des hypothèses pédagogiques générées par des modèles de langage — ils ne reflètent pas l\u2019avis d\u2019un professionnel agréé. Les données proviennent de sources publiques, potentiellement retardées ou erronées. Toute décision d\u2019investissement prise sur la base de ce document relève de la seule responsabilité du lecteur. L\u2019auteur n\u2019est pas enregistré comme Conseiller en Investissement Financier (CIF) auprès de l\u2019AMF. Ce contenu est fourni à titre informatif et expérimental uniquement.</div>

    } else {
      const authorWordHtml = d.authorWord ? `<div class="author-word"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author}</div></div>` : '';
      c.innerHTML = `
        <div class="hdr"><span class="badge ${d.t}">${d.badge}</span><div class="dots">${dots(i)}</div></div>
        <div class="title-zone"><h1>${d.title}</h1></div>
        <div class="scroll-cta"><span><i>↓</i> Lire plus</span></div>
        <div class="scroll-zone"><div class="scroll-inner">
          ${authorWordHtml}
          <div class="hook">${d.hook}</div>
          <div class="details">${d.details}<div class="sig">Gas Morning Brief — 18 Février 2026</div></div>
        </div></div>`;
    }
    deck.appendChild(c);
  });

  function dots(active) { let s=''; for(let i=0;i<total;i++) s+=`<span class="dot${i===active?' on':''}"></span>`; return s; }
  const cards = deck.querySelectorAll('.card');
  function update(anim=true) {
    cards.forEach((c,i)=>{
      c.classList.toggle('anim',anim);
      c.classList.remove('prev','active','next','behind'); c.style.opacity='';
      if(i===cur)c.classList.add('active'); else if(i===cur+1||i===cur-1)c.classList.add('behind'); else if(i<cur)c.classList.add('prev'); else c.classList.add('next');
      c.style.transform='';
      c.querySelectorAll('.dot').forEach((d,j)=>d.classList.toggle('on',j===cur));
    });
  }
  function go(i){if(i>=0&&i<total){cur=i;update();}}
  const dateKey="Gas Morning Brief-18-Février-2026";
  if(!localStorage.getItem(dateKey)){setTimeout(()=>{hint.classList.add('hide');localStorage.setItem(dateKey,'1');},2000);}else hint.style.display='none';
  
  document.querySelectorAll('.scroll-zone, .home-content').forEach(function(sz){
    var card = sz.closest('.card');
    if(!card) return;
    sz.addEventListener('scroll', function(){
      card.classList.toggle('scrolled', sz.scrollTop > 10);
    }, {passive:true});
  });
  let startY=0,axis='';
  document.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY;startTime=Date.now();deltaX=0;axis='';dragging=true;cards[cur].classList.remove('anim');},{passive:true});
  document.addEventListener('touchmove',e=>{if(!dragging)return;const dx=e.touches[0].clientX-startX;const dy=e.touches[0].clientY-startY;if(!axis){if(Math.abs(dx)>8||Math.abs(dy)>8){axis=Math.abs(dx)>Math.abs(dy)?'x':'y';}else return;}if(axis==='y')return;deltaX=dx;cards[cur].style.transform=`translate(-50%,-50%) translateX(${deltaX}px) rotate(${deltaX*0.012}deg)`;var p=Math.min(Math.abs(deltaX)/200,1);var sc=0.93+p*0.07;var op=0.4+p*0.6;var nxt=deltaX<0?cards[cur+1]:cards[cur-1];if(nxt){nxt.style.transform='translate(-50%,-50%) scale('+sc+')';nxt.style.opacity=op;}},{passive:true});
  document.addEventListener('touchend',e=>{if(!dragging)return;dragging=false;if(axis==='y'){axis='';return;}axis='';const card=cards[cur];card.classList.add('anim');if(cards[cur+1])cards[cur+1].classList.add('anim');if(cards[cur-1])cards[cur-1].classList.add('anim');const velocity=Math.abs(deltaX)/(Date.now()-startTime);const threshold=velocity>0.5?30:60;if(deltaX>threshold&&cur===0){window.location.href='../index.html';}else if(deltaX<-threshold&&cur===total-1){window.location.href='../index.html';}else if(deltaX<-threshold&&cur<total-1){cur++;update();}else if(deltaX>threshold&&cur>0){cur--;update();}else{card.style.transform='';}},{passive:true});
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&cur<total-1){cur++;update();}if(e.key==='ArrowLeft'&&cur>0){cur--;update();}});
  document.addEventListener('click',e=>{if(e.target.id==='restart')go(0);const article=e.target.closest('.home-article');if(article){const idx=parseInt(article.dataset.goto);if(!isNaN(idx))go(idx);}});
  /* === DESKTOP SPLIT-VIEW === */
  let dtShell=null, dtSelected=0;
  function buildDesktop(){
    if(dtShell)return;
    dtShell=document.createElement('div');
    dtShell.className='desktop-shell';
    // Sidebar
    const sb=document.createElement('nav');
    sb.className='dt-sidebar';
    const logoDate=DATA[0]&&DATA[0].home?`<div class="dt-logo">Gas Morning Brief</div><div class="dt-date">${DATA[0].date||'18 Février 2026'}</div>`:`<div class="dt-logo">Gas Morning Brief</div><div class="dt-date">18 Février 2026</div>`;
    sb.innerHTML=logoDate;
    DATA.forEach((d,i)=>{
      const item=document.createElement('div');
      item.className='dt-nav-item'+(i===0?' dt-selected':'');
      item.tabIndex=0;
      item.dataset.idx=i;
      const emoji=d.home?'📰':d.end?'✅':(d.badge||'').split(' ')[0]||'📄';
      const label=d.home?'Accueil':d.end?'Fin':(d.badge||'').split(' ').slice(1).join(' ')||'';
      const title=d.home?'Sommaire':d.end?'Briefing terminé':d.title||'';
      item.innerHTML=`<div class="dt-nav-badge">${emoji}</div><div class="dt-nav-info"><div class="dt-nav-label">${label}</div><div class="dt-nav-title">${title}</div></div><div class="dt-nav-arrow">›</div>`;
      item.addEventListener('click',()=>selectDesktop(i));
      sb.appendChild(item);
    });
    // Reader
    const rd=document.createElement('div');
    rd.className='dt-reader';
    rd.innerHTML='<div class="dt-reader-inner"></div>';
    dtShell.appendChild(sb);
    dtShell.appendChild(rd);
    document.body.appendChild(dtShell);
    selectDesktop(0);
  }
  function selectDesktop(idx){
    dtSelected=idx;
    const items=dtShell.querySelectorAll('.dt-nav-item');
    items.forEach((it,i)=>it.classList.toggle('dt-selected',i===idx));
    const d=DATA[idx];
    const inner=dtShell.querySelector('.dt-reader-inner');
    if(d.home){
      const arts=d.articles?d.articles.map(a=>`<div class="dt-nav-item" style="cursor:pointer;opacity:.7;padding:10px 14px;margin-bottom:4px;border-radius:10px;border:1px solid rgba(255,255,255,.06);" onclick="selectDesktop(${a.idx})"><div class="dt-nav-badge">${a.badge.split(' ')[0]}</div><div class="dt-nav-info"><div class="dt-nav-label">${a.badge.split(' ').slice(1).join(' ')}</div><div class="dt-nav-title">${a.title}</div></div><div class="dt-nav-arrow">›</div></div>`).join(''):'';
      inner.innerHTML=`<div class="dt-r-home-henry"><div class="label">🦊 L'Édito du Jour</div><div class="text">${d.henryWord||''}</div></div>${arts}`;
    } else if(d.end){
      inner.innerHTML=`<div style="text-align:center;padding:60px 0;"><div style="font-size:3.5rem;margin-bottom:16px;">🎉</div><h2 style="font-size:1.6rem;font-weight:800;margin-bottom:12px;">Briefing terminé !</h2><p style="color:var(--muted);font-size:1rem;margin-bottom:24px;line-height:1.5;">Vous avez parcouru le briefing du jour. À demain !</p><a href="../index.html" style="display:inline-block;padding:12px 32px;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;">📰 Toutes les éditions</a></div>`;
    } else {
      const authorHtml=d.authorWord?`<div class="dt-r-author"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author||''}</div></div>`:'';
      inner.innerHTML=`<span class="dt-r-badge ${d.t||''}">${d.badge||''}</span><h1 class="dt-r-title">${d.title||''}</h1>${authorHtml}<div class="dt-r-hook">${d.hook||''}</div><div class="dt-r-body">${d.details||''}</div><div class="dt-r-sig">Gas Morning Brief — 18 Février 2026</div>`;
    }
    dtShell.querySelector('.dt-reader').scrollTop=0;
    // Scroll sidebar item into view
    items[idx]&&items[idx].scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  function destroyDesktop(){
    if(dtShell){dtShell.remove();dtShell=null;}
  }
  function checkDesktop(){
    if(window.innerWidth>=900){
      deck.style.display='none';
      buildDesktop();
      dtShell.style.display='';
    } else {
      if(dtShell)dtShell.style.display='none';
      deck.style.display='';
      update(false);
    }
  }
  // Keyboard nav for desktop
  document.addEventListener('keydown',e=>{
    if(window.innerWidth<900)return;
    if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();if(dtSelected<DATA.length-1)selectDesktop(dtSelected+1);}
    if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();if(dtSelected>0)selectDesktop(dtSelected-1);}
  });
  checkDesktop();window.addEventListener('resize',checkDesktop);
  // Theme toggle
  (function(){
    const btn=document.getElementById('themeToggle');
    const saved=localStorage.getItem('theme');
    if(saved==='light'){document.documentElement.classList.add('light');btn.textContent='☀️';}
    btn.addEventListener('click',()=>{
      const isLight=document.documentElement.classList.toggle('light');
      btn.textContent=isLight?'☀️':'🌙';
      localStorage.setItem('theme',isLight?'light':'dark');
    });
  })();
  </script>
</body>
</html>
