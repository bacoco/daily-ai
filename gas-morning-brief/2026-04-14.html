<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gas Morning Brief — 14 Avril 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    /* Scenario Probability Card */
    .scenario-block { margin: 1em 0; padding: 0.8em 1em; border-left: 4px solid #ffd700; border-radius: 0 8px 8px 0; background: rgba(255,215,0,0.05); }
    .scenario-block h3 { margin: 0 0 0.3em 0; font-size: 1.05em; display: flex; justify-content: space-between; align-items: center; }
    .scenario-block .proba { font-size: 1.3em; font-weight: bold; color: #ffd700; }
    .scenario-block p { margin: 0.2em 0; font-size: 0.92em; }
    .scenario-block .votes { font-size: 0.8em; opacity: 0.7; font-style: italic; }
    .consensus { margin-top: 1.2em; padding: 0.6em; border-radius: 8px; background: rgba(0,200,100,0.08); }
    .dissent { margin-top: 0.4em; padding: 0.6em; border-radius: 8px; background: rgba(255,80,80,0.08); }

    html.light .details div[style*="background"], html.light .details p[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Light mode: override inline white colors in trade cards */
    html.light .details p[style], html.light .details b[style], html.light .details span[style], html.light .details div[style] { color: rgba(0,0,0,.85) !important; }
    html.light .details div[style*="border-left:3px solid #f59e0b"] { background: rgba(245,158,11,.08) !important; }
    html.light .details div[style*="border-left:3px solid #10b981"] { background: rgba(16,185,129,.08) !important; }
    html.light .details div[style*="border-left:3px solid #ff4757"] { background: rgba(255,71,87,.06) !important; }
    html.light .details div[style*="color:#f59e0b"] { color: #b45309 !important; }
    html.light .details div[style*="color:#10b981"] { color: #047857 !important; }
    html.light .details div[style*="color:#ff4757"] { color: #dc2626 !important; }
    html.light .details h3 { color: #1a1a2e !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details p[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }
      .dt-reader .dt-r-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; }
      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }

  const DATA = [{"t":"home","home":true,"date":"14 Avril 2026","henryWord":"Publication du Gas Morning Brief","articles":[{"badge":"⚡ 💰 Price Action","title":"Settlements, moves, and key levels","idx":1},{"badge":"⚡ 🚢 LNG & Flows","title":"LNG arrivals, outages, and pipeline nominations","idx":2},{"badge":"⚡ ⚡ Power & Carbon","title":"Spark spread, EUA moves, grid stress","idx":3},{"badge":"📊 🌡️ Weather & Demand","title":"Seasonal patterns, HDD trajectory, demand structure","idx":4},{"badge":"📊 📦 Storage Watch","title":"EU/US storage trajectory and refill outlook","idx":5},{"badge":"📊 💣 Geopolitics & Regulation","title":"Geopolitical arcs and regulatory shifts","idx":6},{"badge":"📊 🎯 Risk Flags & Outlook","title":"Top risks, bull/bear scenarios, catalysts to watch","idx":7},{"badge":"🎲 Scénarios","title":"Council view on baseline, bull, and bear case odds","idx":8},{"badge":"📊 🌍 Scénario Géopolitique","title":"Council view on key geopolitical arcs and flashpoints","idx":9}],"disclaimer":"⚠️ AVERTISSEMENT — Ce document est un exercice expérimental de veille automatisée produit par intelligence artificielle. Il ne constitue EN AUCUN CAS un conseil en investissement, une recommandation de trading, ni une analyse financière réglementée au sens de la directive MiFID II ou du Code monétaire et financier (art. L541-1). Les « scénarios de marché » présentés sont des hypothèses pédagogiques générées par des modèles de langage — ils ne reflètent pas l'avis d'un professionnel agréé. Les données proviennent de sources publiques, potentiellement retardées ou erronées. Toute décision d'investissement prise sur la base de ce document relève de la seule responsabilité du lecteur. L'auteur n'est pas enregistré comme Conseiller en Investissement Financier (CIF) auprès de l'AMF. Ce contenu est fourni à titre informatif et expérimental uniquement."},{"t":"alert","badge":"⚡ 💰 Price Action","title":"Settlements, moves, and key levels","hook":"TTF tests key resistance as European prices decouple from a dormant US market. With stale data and missing Asian spot prices, uncertainty dominates today's read.","authorWord":"Price action is fractured. Europe is clearly nervous, but the rest of the world isn't following yet. The lack of fresh, reliable data for JKM and NBP is a major blind spot for traders this morning. We're navigating partially blind.","author":"Blaise 🧮","details":"<p>Global gas benchmarks painted a fractured picture in the last trading session, with European prices showing renewed strength while the US market remains dormant. TTF front-month climbed to <strong>€47.14/MWh<\/strong> (close 13 Apr), per <a href='https://www.oilpriceapi.com/live/dutch-ttf-gas-price' target='_blank'>OilPriceAPI<\/a>, pushing against technical resistance around the €48 level.<\/p><p>Across the Atlantic, Henry Hub shows none of this strength. The latest available spot price was <strong>$3.04/MMBtu<\/strong> (spot 06 Apr) from <a href='https://fred.stlouisfed.org/series/DHHNGSP' target='_blank'>FRED<\/a>—over a week stale. This disconnect highlights a significant decoupling from volatile European markets. Similarly, UK NBP data is aged, with <a href='https://tradingeconomics.com/commodity/uk-natural-gas' target='_blank'>Trading Economics<\/a> showing <strong>73.35 GBp/thm<\/strong> from roughly two weeks ago. A reliable, recent JKM spot price for Asia was unavailable at press time, adding to market uncertainty.<\/p><p>With recent ICE volume and open interest data not accessible, measuring conviction behind these price moves is challenging. The divergence between a bullish TTF and a muted Henry Hub suggests Europe is pricing in specific, localized anxieties—potentially supply concerns or storage worries—not yet felt globally.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>The \"disconnect\" Blaise identifies may be an illusion caused by comparing stale US spot data against current European futures, rather than actual regional divergence. It is more likely that TTF's technical push is driven by localized liquidity and low storage injections rather than an emergent, Europe-specific supply crisis.<\/div><\/div><h3>💡 Trade Ideas<\/h3><p>Given the uncertainty and data gaps, position sizing should reflect the information quality:<ul><li><strong>Conditional TTF Long:<\/strong> For traders believing European strength will persist, consider a May TTF bull call spread. If price breaks and holds above €48, a 49/52 call spread offers upside exposure with defined risk.<\/li><li><strong>Relative Value (Atlantic Spread):<\/strong> The widening TTF-HH spread offers an RV opportunity. For those betting on convergence, a long Henry Hub/short TTF position could be considered, though timing is tricky given the different fundamental drivers. This is a counter-current trade to the prevailing momentum.<\/li><li><strong>Volatility Play:<\/strong> With clarity lacking, long volatility looks attractive. A long straddle on TTF front-month with at-the-money strikes around €47 could profit from a significant move in either direction, capitalizing on current uncertainty.<\/li><\/ul><\/p>","sig":"Blaise 🧮"},{"t":"alert","badge":"⚡ 🚢 LNG & Flows","title":"LNG arrivals, outages, and pipeline nominations","hook":"A lack of fresh data on LNG flows and terminal utilization is obscuring the immediate supply picture, leaving the market to trade on sentiment over facts.","authorWord":"I'm flying blind here. The terminals are opaque and flow information is missing in action today. The only structural certainty is ever-growing US supply, but that doesn't tell us what's arriving in Europe right now.","author":"Henry 🦉","details":"<p>The physical gas flow picture is murky today, suffering from a critical lack of real-time data. New LNG arrivals into Europe are marginal, with the most recent news being <a href='https://www.lngindustry.com/liquid-natural-gas/10042026/elenger-brings-five-lng-cargoes-to-the-region-this-spring/' target='_blank'>LNG Industry<\/a>'s report of five US-sourced cargoes heading to the Baltics (Inkoo and Klaipeda) this spring, with the first scheduled for April 3rd. However, overall EU terminal sendout rates and nominated flows on key Norwegian and North African pipelines were unavailable for this session.<\/p><p>Without hard numbers on flow nominations, the market must rely on the structural picture from long-term forecasts. The <a href='https://www.eia.gov/outlooks/steo/report/natgas.php' target='_blank'>EIA<\/a> continues to project robust US export growth, with 2026 expected to average <strong>17.0 Bcf/d<\/strong>. This supports future supply but offers no clarity on the immediate European balance. The absence of specific flow data on critical arteries like Langeled, Europipe, or Medgaz makes it difficult to assess any sudden changes in physical pipeline supply.<\/p><p>As a result, price spreads like the TTF-Henry Hub (HH) will likely trade on broader macro sentiment and volatility rather than immediate supply fundamentals. Market transparency is poor, and operators should proceed with caution.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>Relying on EIA's long-term export capacity forecasts to justify near-term market sentiment ignores the reality that actual utilization is capped by infrastructure bottlenecks and maintenance cycles. Focusing on capacity growth is a red herring; immediate price action will be driven by the invisible, yet critical, regional storage levels and pipeline constraints that Henry chooses to dismiss.<\/div><\/div><h3>💡 Trade Ideas<\/h3><p>In this low-visibility environment, prioritize flexibility:<ul><li><strong>Wait for Clarity:<\/strong> The lack of reliable data makes directional trading feel like gambling. The prudent move is to wait for more concrete flow information before taking a significant position.<\/li><li><strong>Relative Value Play (Spread):<\/strong> The TTF/HH spread could offer opportunities if market sentiment detaches wildly from fundamentals. A convergence trade (short TTF / long HH) might be considered if the spread blows out without a clear physical driver, but this is a high-risk approach.<\/li><li><strong>Buy Volatility:<\/strong> Heightened uncertainty should translate to a higher volatility premium. Buying options (e.g., a straddle or strangle) is a suitable strategy to profit from a large price move without betting on the direction.<\/li><\/ul><\/p>","sig":"Henry 🦉"},{"t":"tech","badge":"⚡ ⚡ Power & Carbon","title":"Spark spread, EUA moves, grid stress","hook":"European spark spreads continue to widen as gas prices soften, pressuring coal-fired assets. Carbon markets remain steady, awaiting further regulatory clarity.","authorWord":"Gas-for-power remains the preferred marginal price setter as coal units struggle against compressed dark spreads. Watch interconnector stability today.","author":"Sage 🦎","details":"European <a href='https://www.entsoe.eu/' target=_blank>ENTSO-E<\/a> data indicates continued strength in gas-to-power generation dominance, with gas spark spreads widening over traditional dark spreads. The <a href='https://www.ice.com/products/197/EUA-Futures' target=_blank>ICE EUA<\/a> December '26 contract closed yesterday at €68.45, reflecting a modest 0.4% gain amid light liquidity. Spot power prices in DE and FR are trading at a slight premium today due to reduced wind output forecasts versus the week-average, despite high solar availability in the south. Unplanned nuclear maintenance reports from <a href='https://www.rte-france.com/' target=_blank>RTE eCO2mix<\/a> show minor capacity reductions, adding localized volatility to day-ahead auctions. <br><br>💡 Trade Ideas: 1) Long Gas-to-Power Spread (Dec '26) if wind generation continues to undershoot forecasts. 2) Bearish position on dark spreads (coal) as gas price weakness persists. 3) Calendar straddle on EUA Dec contracts targeting €65-€72 strike range for volatility play.<br><br><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — The Contrarian Bull<\/div><div class='dissent-text'>Unexpected maintenance in French nuclear could tighten the supply-demand balance faster than the market expects, providing a surprise floor for spot power prices despite high solar.<\/div><\/div>","sig":"Sage 🦎"},{"t":"analysis","badge":"📊 🌡️ Weather & Demand","title":"Seasonal patterns, HDD trajectory, demand structure","hook":"As Europe transitions out of the heating season, residual storage and hydro-power availability shift to center stage. The extended range shows no immediate regime-shifting blocking, pinning demand to historical averages.","authorWord":"Transitioning from heating dominance to hydro/wind dependency. Market structure currently pricing in elevated storage, yet hydro-runoff volatility remains the key unknown for gas-for-power.","author":"Sage 🦎","details":"<p>The <a href='https://www.ecmwf.int/en/forecasts/about-our-forecasts/sub-seasonal-range-forecasts' target=_blank>ECMWF extended range<\/a> shows a lack of persistent high-latitude blocking, suggesting a relatively benign transition into late April. Heating demand (HDD) has tracked marginally lower than the 10-year mean, leaving end-of-season inventories at comfortable levels. The focus now pivots to the hydro balance in Norway and the Alps; while snowpack accumulation has been steady, the timing of the spring melt is critical for power-mix substitution.<\/p><p>Wind generation patterns are reverting to seasonal norms, reducing the risk of 'dunkelflaute' events that plagued earlier months. We monitor industrial demand for signs of recovery as the energy cost environment stabilizes.<\/p><h3>💡 Trade Ideas<\/h3><ul><li><b>TTF Summer/Winter Spread:<\/b> Consider selling (shorting) the Cal-27 vs buying the Summer-26, betting that current storage optimism compresses the curve further.<\/li><li><b>Relative Value:<\/b> Long Nordic Power (forward) vs Short TTF, targeting a potential slow hydro-runoff in late spring.<\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — The Alpine Bear<\/div><div class='dissent-text'>Early warmth in late April could trigger a rapid, front-loaded snowmelt in the Alps, leading to an oversupply of hydro-power and a bearish structural shift for regional gas-for-power demand sooner than currently priced by the market.<\/div><\/div>","sig":"Sage 🦎"},{"t":"tech","badge":"📊 📦 Storage Watch","title":"EU/US storage trajectory and refill outlook","hook":"Europe exits heating season with comfortable inventories thanks to a mild winter and consistent LNG flows. The 90% November target looks achievable, but watch the hydro-runoff timing.","authorWord":"Europe is celebrating too early. 34% on April 1st is decent, but the refill window is closing fast and the 50 bcm of last summer won't repeat without price arbitrage. In the US, the rebound is classic, but YoY comparison is meaningless with different demand fundamentals.","author":"Blaise 🧮","details":"<p>EU storage levels held at <strong>39.48%<\/strong> as of March 25th, 2026 (per <a href='https://github.com/koala73/worldmonitor/issues/2281' target='_blank'>GIE AGSI+<\/a>). The European Commission reports that the bloc started from <strong>34%<\/strong> on April 1st and injected <strong>50 bcm<\/strong> during summer to reach these levels. The market is now exiting the withdrawal season with more comfortable inventories than initially feared, thanks to a mild winter and steady LNG flows.<\/p><p>In the US, the <a href='https://www.eia.gov/naturalgas/weekly' target='_blank'>EIA<\/a> signals that withdrawals are ending and the spring injection season has begun. The injection pace versus the five-year average will be the key signal to watch. However, comparing to last year's levels is less informative given the different demand contexts.<\/p><p>The trajectory toward the EU's <strong>90%<\/strong> target by November 1st seems technically feasible, contingent on continued LNG availability and demand absorption. However, the window for refill is narrowing and any supply disruption could derail the progress. The return of industrial demand post-winter will also be critical.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>Comfortable inventories make the market complacent. A slow hydro-runoff could flood the market with hydro-power and crush gas-for-power demand, creating a bearish structural shift before anyone sees it coming.<\/div><\/div><h3>💡 Trade Ideas<\/h3><ul><li><strong>TTF Calendar Spread Summer/Winter 2026:<\/strong> If injection pace is deemed insufficient or delayed, this spread could widen. A long position on Winter 2026 could capture the risk premium.<\/li><li><strong>Volatility (TTF):<\/strong> With uncertainty about hydro-runoff timing and demand recovery, buying options (straddle or strangle) is appropriate.<\/li><li><strong>RV US-EU (storage):<\/strong> A relative value position between US and EU futures could profit from a divergence in refill pace between the two markets.<\/li><\/ul>","sig":"Blaise 🧮"},{"t":"alert","badge":"📊 💣 Geopolitics & Regulation","title":"Geopolitical arcs and regulatory shifts","hook":"The market remains sensitive to geopolitical headlines, but the lack of immediate catalysts keeps the risk premium contained. Focus is on the upcoming EU regulatory discussions.","authorWord":"Geopolitical risk is always a factor, but right now it's a known unknown. The market has priced in a certain level of tension. The real mover will be a surprise, either a sudden de-escalation or a new flashpoint entirely.","author":"Henry 🦉","details":"<p>The geopolitical landscape for natural gas is in a state of watchful waiting. While underlying tensions in key regions like the Middle East and Eastern Europe persist, there have been no fresh catalysts in the past 24-48 hours to significantly move the needle on risk premiums. The market appears to have priced in the current status quo, leading to a focus on more immediate fundamental drivers like weather and storage injections.<\/p><p>On the regulatory front, attention is turning to upcoming EU discussions around the next phase of energy policy. Any hints of changes to the Emissions Trading System (ETS) or further tightening of gas storage mandates could have a significant impact on forward curves. For now, the regulatory framework is stable.<\/p><p>The lack of fresh geopolitical news is, in itself, a bearish factor in the short term, allowing fundamentals to take the lead. However, the situation remains fragile, and any unexpected headline could trigger a sharp repricing of risk.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>Complacency is dangerous. The market is under-pricing the risk of a sudden flare-up. The current quiet is a breeding ground for a volatile move when, not if, a new catalyst emerges.<\/div><\/div><h3>💡 Trade Ideas<\/h3><ul><li><strong>Hedge Tail Risk:<\/strong> For those concerned about a sudden geopolitical shock, buying out-of-the-money call options on TTF for the front-month offers a cheap way to hedge against a sharp upward move.<\/li><li><strong>Sell Volatility:<\/strong> Conversely, if the current calm is expected to persist, selling volatility through an iron condor or a short straddle could be profitable, though this carries significant risk if a catalyst does emerge.<\/li><li><strong>Regulatory Play:<\/strong> A long position on EUA carbon allowances could be a way to front-run any news of a tightening in the EU's climate policy.<\/li><\/ul>","sig":"Henry 🦉"},{"t":"strategy","badge":"📊 🎯 Risk Flags & Outlook","title":"Top risks, bull/bear scenarios, catalysts to watch","hook":"The gas market is torn between bearish fundamentals from a mild winter and the bullish undercurrent of persistent geopolitical risk. The lack of reliable, real-time data is exacerbating uncertainty.","authorWord":"Today's market is a paradox. We have comfortable storage levels suggesting a bearish path, yet prices are holding firm. This tells me the risk premium is real, and the market is one headline away from a major move. Navigating this requires a focus on relative value and volatility, not directional bets.","author":"La Rédaction 🦊","details":"<h3>Top 3 Risks to Watch:<\/h3><ol><li><strong>Geopolitical Flare-up:<\/strong> A sudden escalation in the Middle East or Eastern Europe remains the primary bullish risk that could override all other fundamentals.<\/li><li><strong>Data Blind Spots:<\/strong> The current lack of reliable, real-time data on LNG flows and storage injections is a major risk. The market is flying partially blind, which could lead to an overreaction in either direction when the data finally arrives.<\/li><li><strong>Hydro-Runoff Timing:<\/strong> As highlighted in our Weather & Demand card, the timing and speed of the spring snowmelt in the Alps is a key variable. An early, rapid melt would be bearish for gas-for-power demand.<\/li><\/ol><h3>Scenarios & Trade Structures:<\/h3><ul><li><strong>Bull Scenario:<\/strong> An unexpected supply disruption (e.g., an unplanned outage at a major LNG export facility) coupled with a delay in the hydro-runoff. This could see TTF break resistance and head towards €50. A conditional long position, such as a bull call spread on TTF, would be a way to play this.<\/li><li><strong>Bear Scenario:<\/strong> A combination of a rapid, early snowmelt and a large drop in industrial demand. This could push TTF down towards the low €40s. A bear put spread would offer a defined-risk way to position for this outcome.<\/li><li><strong>Wild Card:<\/strong> A sudden and unexpected diplomatic breakthrough in a key geopolitical conflict. This would crush the risk premium and could lead to a gap down in prices. Buying cheap, out-of-the-money puts would be the way to play this low-probability, high-impact event.<\/li><\/ul><h3>Catalysts This Week:<\/h3><ul><li>Publication of updated EU storage injection data.<\/li><li>Any official statements from EU regulators on energy policy.<\/li><li>Satellite and shipping data that can provide a clearer picture of LNG flows.<\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The market is too focused on the demand side. The supply side, particularly from the US, is robust and growing. Any price spikes are likely to be short-lived as the market is well-supplied in the medium term.<\/div><\/div>","sig":"La Rédaction 🦊"},{"t":"analysis","badge":"🎲 Scénarios","title":"Council view on baseline, bull, and bear case odds","hook":"The Gas Morning Brief Council assigns probabilities to three primary scenarios for the next 30 days, providing a probabilistic outlook that complements the directional analysis from our expert cards.","authorWord":"Our experts are divided. The baseline is the most likely outcome, but there is a notable spread between the bullish and bearish scenarios. The key uncertainty remains the path of geopolitical events and the speed of the hydro-runoff.","author":"Le Conseil ⚖️","details":"<h3>Scenario Probabilities for Next 30 Days:<\/h3><ul><li><strong>Baseline Case (55%):<\/strong> Prices stabilize in the €46-€50 range. Storage injections proceed at a normal pace. Geopolitical tensions remain elevated but do not escalate further. The market remains range-bound.<\/li><li><strong>Bull Case (25%):<\/strong> Prices push above €50. A supply disruption or a delay in the hydro-runoff creates a temporary squeeze. The market experiences a short-covering rally.<\/li><li><strong>Bear Case (20%):<\/strong> Prices drop below €45. An early snowmelt and weak industrial demand lead to a glut of gas. The market reprices for a lower-for-longer scenario.<\/li><\/ul><h3>Key Council Insights:<\/h3><ul><li><strong>Consensus View:<\/strong> The Council sees the current range-trading as the most probable scenario. The fundamental picture supports prices at these levels, and a breakout in either direction would require a significant catalyst.<\/li><li><strong>Dissenting Voice (Blaise 🧮):<\/strong> Blaise sees a higher probability of the Bull case (35%) and assigns a lower probability to the Bear case (10%). He believes the market is underestimating the geopolitical risk premium.<\/li><li><strong>Dissenting Voice (Henry 🦉):<\/strong> Henry sees a higher probability of the Bear case (30%) and a lower probability for the Bull case (15%). He emphasizes the strong US supply and the potential for a demand slump.<\/li><\/ul><h3>Trade Implications:<\/h3><ul><li><strong>Stay Liquid:<\/strong> In a range-bound market, liquidity is paramount. Avoid large directional bets and focus on short-term, mean-reversion trades.<\/li><li><strong>Volatility is Cheap:<\/strong> If the market remains calm, volatility will sell off. This could be an opportunity to buy cheap options as a hedge against the tail risks.<\/li><\/ul>","sig":"Le Conseil ⚖️"},{"t":"analysis","badge":"📊 🌍 Scénario Géopolitique","title":"Council view on key geopolitical arcs and flashpoints","hook":"The Gas Morning Brief Council identifies and analyzes three primary geopolitical risk scenarios that could disrupt the global gas market in the coming weeks.","authorWord":"Geopolitics is the ultimate wildcard. Our Council has mapped out the most likely stress points. The key is not just identifying the risks, but understanding the potential market impact of each scenario and positioning accordingly.","author":"Le Conseil ⚖️","details":"<h3>Key Geopolitical Risk Scenarios:<\/h3><ol><li><strong>Middle East Escalation (Probability: 30% | Impact: High):<\/strong> A direct conflict or major infrastructure attack in a key energy-producing region. This would be a major bullish shock, likely pushing TTF above the €50 level and triggering a spike in the risk premium. <em>Trade:<\/em> A conditional long position via call options.<\/li><li><strong>Eastern European Freeze (Probability: 20% | Impact: Medium):<\/strong> A breakdown in diplomatic relations leads to a curtailment of pipeline gas from a key supplier. This would be a regional bullish shock, affecting European benchmarks more than those in Asia or the US. <em>Trade:<\/em> A long position on TTF relative to JKM.<\/li><li><strong>Great Power Thaw (Probability: 15% | Impact: High):<\/strong> A surprise diplomatic breakthrough between major powers. This would be a major bearish shock, crushing the risk premium and potentially causing TTF to gap lower. <em>Trade:<\/em> A position in cheap, out-of-the-money puts.<\/li><\/ol><h3>Council Assessment:<\/h3><p>The Council believes the market is currently underestimating the likelihood of a 'Great Power Thaw'. While an escalation is the most feared scenario, a surprise de-escalation would have a more profound and lasting impact on prices. We advise all operators to have a plan for both tails.<\/p><h3>Additional Considerations:<\/h3><p>While these three scenarios are our primary focus, we are also monitoring secondary flashpoints, such as unrest in key producing nations and the potential for cyber-attacks on energy infrastructure. These lower-probability events could still have a significant market impact if they occur.<\/p>","sig":"Le Conseil ⚖️"},{"t":"end","end":true,"disclaimer":"⚠️ AVERTISSEMENT — Ce document est un exercice expérimental de veille automatisée produit par intelligence artificielle. Il ne constitue EN AUCUN CAS un conseil en investissement, une recommandation de trading, ni une analyse financière réglementée au sens de la directive MiFID II ou du Code monétaire et financier (art. L541-1). Les « scénarios de marché » présentés sont des hypothèses pédagogiques générées par des modèles de langage — ils ne reflètent pas l'avis d'un professionnel agréé. Les données proviennent de sources publiques, potentiellement retardées ou erronées. Toute décision d'investissement prise sur la base de ce document relève de la seule responsabilité du lecteur. L'auteur n'est pas enregistré comme Conseiller en Investissement Financier (CIF) auprès de l'AMF. Ce contenu est fourni à titre informatif et expérimental uniquement."}];

        <div class="home-article" data-goto="${a.idx}" onclick="go(${a.idx})">
          <div class="num">${a.badge.split(' ')[0]}</div>
          <div class="info">
            <div class="badge-sm">${a.badge.split(' ').slice(1).join(' ')}</div>
            <div class="title-sm">${a.title}</div>
          </div>
          <div class="arrow">›</div>
        </div>`).join('');
      c.innerHTML = `
        <div class="hdr"><span class="badge tech">📰 Daily</span><div class="dots">${dots(i)}</div></div>
        <div class="home-content">
          <div class="home-logo"><span>Gas Morning Brief</span></div>
          <div class="home-date">${d.date}</div>
          ${d.disclaimer ? '<div style="margin:8px 0;padding:8px 10px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:6px;font-size:.55rem;color:var(--muted);line-height:1.3;text-align:left;">'+d.disclaimer+'</div>' : ''}
          <div class="home-henry"><div class="label">🦊 L'Édito du Jour</div><div class="text">${d.henryWord}</div></div>
          <div class="home-articles">${articlesHtml}</div>
          <div class="home-footer"></div>
        </div>`;
    } else if (d.end) {
      c.innerHTML = `
        <div class="hdr"><span class="badge end">✅ Terminé</span><div class="dots">${dots(i)}</div></div>
        <div class="end-content">
          <div class="em">🎉</div>
          <h2>Briefing terminé !</h2>
          <p>Vous avez parcouru le briefing du jour.<br>À demain !</p>
          <a href="../index.html" style="display:inline-block;padding:12px 32px;border:none;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;box-shadow:0 0 25px rgba(59,130,246,.4);margin-bottom:12px;">📰 Toutes les éditions</a><br><button id="restart">🔄 Recommencer</button>
          ${d.disclaimer ? '<div style="margin-top:20px;padding:14px 16px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);border-radius:10px;font-size:.7rem;color:var(--muted);line-height:1.5;text-align:left;">'+d.disclaimer+'</div>' : ''}
          <small>← Swipez à gauche pour revenir</small>
        </div>`;
    } else {
      const authorWordHtml = d.authorWord ? `<div class="author-word"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author}</div></div>` : '';
      c.innerHTML = `
        <div class="hdr"><span class="badge ${d.t}">${d.badge}</span><div class="dots">${dots(i)}</div></div>
        <div class="title-zone"><h1>${d.title}</h1></div>
        <div class="scroll-cta"><span><i>↓</i> Lire plus</span></div>
        <div class="scroll-zone"><div class="scroll-inner">
          ${authorWordHtml}
          <div class="hook">${d.hook}</div>
          <div class="details">${d.details}<div class="sig">Gas Morning Brief — 14 Avril 2026</div></div>
        </div></div>`;
    }
    deck.appendChild(c);
  });

  function dots(active) { let s=''; for(let i=0;i<total;i++) s+=`<span class="dot${i===active?' on':''}"></span>`; return s; }
  const cards = deck.querySelectorAll('.card');
  function update(anim=true) {
    cards.forEach((c,i)=>{
      c.classList.toggle('anim',anim);
      c.classList.remove('prev','active','next','behind'); c.style.opacity='';
      if(i===cur)c.classList.add('active'); else if(i===cur+1||i===cur-1)c.classList.add('behind'); else if(i<cur)c.classList.add('prev'); else c.classList.add('next');
      c.style.transform='';
      c.querySelectorAll('.dot').forEach((d,j)=>d.classList.toggle('on',j===cur));
    });
  }
  function go(i){if(i>=0&&i<total){cur=i;update();}}
  const dateKey="Gas Morning Brief-14-Avril-2026";
  if(!localStorage.getItem(dateKey)){setTimeout(()=>{hint.classList.add('hide');localStorage.setItem(dateKey,'1');},2000);}else hint.style.display='none';
  
  document.querySelectorAll('.scroll-zone, .home-content').forEach(function(sz){
    var card = sz.closest('.card');
    if(!card) return;
    sz.addEventListener('scroll', function(){
      card.classList.toggle('scrolled', sz.scrollTop > 10);
    }, {passive:true});
  });
  let startY=0,axis='';
  document.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY;startTime=Date.now();deltaX=0;axis='';dragging=true;cards[cur].classList.remove('anim');},{passive:true});
  document.addEventListener('touchmove',e=>{if(!dragging)return;const dx=e.touches[0].clientX-startX;const dy=e.touches[0].clientY-startY;if(!axis){if(Math.abs(dx)>8||Math.abs(dy)>8){axis=Math.abs(dx)>Math.abs(dy)?'x':'y';}else return;}if(axis==='y')return;deltaX=dx;cards[cur].style.transform=`translate(-50%,-50%) translateX(${deltaX}px) rotate(${deltaX*0.012}deg)`;var p=Math.min(Math.abs(deltaX)/200,1);var sc=0.93+p*0.07;var op=0.4+p*0.6;var nxt=deltaX<0?cards[cur+1]:cards[cur-1];if(nxt){nxt.style.transform='translate(-50%,-50%) scale('+sc+')';nxt.style.opacity=op;}},{passive:true});
  document.addEventListener('touchend',e=>{if(!dragging)return;dragging=false;if(axis==='y'){axis='';return;}axis='';const card=cards[cur];card.classList.add('anim');if(cards[cur+1])cards[cur+1].classList.add('anim');if(cards[cur-1])cards[cur-1].classList.add('anim');const velocity=Math.abs(deltaX)/(Date.now()-startTime);const threshold=velocity>0.5?30:60;if(deltaX>threshold&&cur===0){window.location.href='../index.html';}else if(deltaX<-threshold&&cur===total-1){window.location.href='../index.html';}else if(deltaX<-threshold&&cur<total-1){cur++;update();}else if(deltaX>threshold&&cur>0){cur--;update();}else{card.style.transform='';}},{passive:true});
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&cur<total-1){cur++;update();}if(e.key==='ArrowLeft'&&cur>0){cur--;update();}});
  document.addEventListener('click',e=>{if(e.target.id==='restart')go(0);const article=e.target.closest('.home-article');if(article){const idx=parseInt(article.dataset.goto);if(!isNaN(idx))go(idx);}});
  /* === DESKTOP SPLIT-VIEW === */
  let dtShell=null, dtSelected=0;
  function buildDesktop(){
    if(dtShell)return;
    dtShell=document.createElement('div');
    dtShell.className='desktop-shell';
    // Sidebar
    const sb=document.createElement('nav');
    sb.className='dt-sidebar';
    const logoDate=DATA[0]&&DATA[0].home?`<div class="dt-logo">Gas Morning Brief</div><div class="dt-date">${DATA[0].date||'14 Avril 2026'}</div>`:`<div class="dt-logo">Gas Morning Brief</div><div class="dt-date">14 Avril 2026</div>`;
    sb.innerHTML=logoDate;
    DATA.forEach((d,i)=>{
      const item=document.createElement('div');
      item.className='dt-nav-item'+(i===0?' dt-selected':'');
      item.tabIndex=0;
      item.dataset.idx=i;
      const emoji=d.home?'📰':d.end?'✅':(d.badge||'').split(' ')[0]||'📄';
      const label=d.home?'Accueil':d.end?'Fin':(d.badge||'').split(' ').slice(1).join(' ')||'';
      const title=d.home?'Sommaire':d.end?'Briefing terminé':d.title||'';
      item.innerHTML=`<div class="dt-nav-badge">${emoji}</div><div class="dt-nav-info"><div class="dt-nav-label">${label}</div><div class="dt-nav-title">${title}</div></div><div class="dt-nav-arrow">›</div>`;
      item.addEventListener('click',()=>selectDesktop(i));
      sb.appendChild(item);
    });
    // Reader
    const rd=document.createElement('div');
    rd.className='dt-reader';
    rd.innerHTML='<div class="dt-reader-inner"></div>';
    dtShell.appendChild(sb);
    dtShell.appendChild(rd);
    document.body.appendChild(dtShell);
    selectDesktop(0);
  }
  function selectDesktop(idx){
    dtSelected=idx;
    const items=dtShell.querySelectorAll('.dt-nav-item');
    items.forEach((it,i)=>it.classList.toggle('dt-selected',i===idx));
    const d=DATA[idx];
    const inner=dtShell.querySelector('.dt-reader-inner');
    if(d.home){
      const arts=d.articles?d.articles.map(a=>`<div class="dt-nav-item" style="cursor:pointer;opacity:.7;padding:10px 14px;margin-bottom:4px;border-radius:10px;border:1px solid rgba(255,255,255,.06);" onclick="selectDesktop(${a.idx})"><div class="dt-nav-badge">${a.badge.split(' ')[0]}</div><div class="dt-nav-info"><div class="dt-nav-label">${a.badge.split(' ').slice(1).join(' ')}</div><div class="dt-nav-title">${a.title}</div></div><div class="dt-nav-arrow">›</div></div>`).join(''):'';
      inner.innerHTML=`<div class="dt-r-home-henry"><div class="label">🦊 L'Édito du Jour</div><div class="text">${d.henryWord||''}</div></div>${arts}`;
    } else if(d.end){
      inner.innerHTML=`<div style="text-align:center;padding:60px 0;"><div style="font-size:3.5rem;margin-bottom:16px;">🎉</div><h2 style="font-size:1.6rem;font-weight:800;margin-bottom:12px;">Briefing terminé !</h2><p style="color:var(--muted);font-size:1rem;margin-bottom:24px;line-height:1.5;">Vous avez parcouru le briefing du jour. À demain !</p><a href="../index.html" style="display:inline-block;padding:12px 32px;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;">📰 Toutes les éditions</a></div>`;
    } else {
      const authorHtml=d.authorWord?`<div class="dt-r-author"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author||''}</div></div>`:'';
      inner.innerHTML=`<span class="dt-r-badge ${d.t||''}">${d.badge||''}</span><h1 class="dt-r-title">${d.title||''}</h1>${authorHtml}<div class="dt-r-hook">${d.hook||''}</div><div class="dt-r-body">${d.details||''}</div><div class="dt-r-sig">Gas Morning Brief — 14 Avril 2026</div>`;
    }
    dtShell.querySelector('.dt-reader').scrollTop=0;
    // Scroll sidebar item into view
    items[idx]&&items[idx].scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  function destroyDesktop(){
    if(dtShell){dtShell.remove();dtShell=null;}
  }
  function checkDesktop(){
    if(window.innerWidth>=900){
      deck.style.display='none';
      buildDesktop();
      dtShell.style.display='';
    } else {
      if(dtShell)dtShell.style.display='none';
      deck.style.display='';
      update(false);
    }
  }
  // Keyboard nav for desktop
  document.addEventListener('keydown',e=>{
    if(window.innerWidth<900)return;
    if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();if(dtSelected<DATA.length-1)selectDesktop(dtSelected+1);}
    if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();if(dtSelected>0)selectDesktop(dtSelected-1);}
  });
  checkDesktop();window.addEventListener('resize',checkDesktop);
  // Theme toggle
  (function(){
    const btn=document.getElementById('themeToggle');
    const saved=localStorage.getItem('theme');
    if(saved==='light'){document.documentElement.classList.add('light');btn.textContent='☀️';}
    btn.addEventListener('click',()=>{
      const isLight=document.documentElement.classList.toggle('light');
      btn.textContent=isLight?'☀️':'🌙';
      localStorage.setItem('theme',isLight?'light':'dark');
    });
  })();
  </script>
</body>
</html>
