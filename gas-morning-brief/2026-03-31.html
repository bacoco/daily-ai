<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gas Morning Brief — 31 Mars 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    /* Scenario Probability Card */
    .scenario-block { margin: 1em 0; padding: 0.8em 1em; border-left: 4px solid #ffd700; border-radius: 0 8px 8px 0; background: rgba(255,215,0,0.05); }
    .scenario-block h3 { margin: 0 0 0.3em 0; font-size: 1.05em; display: flex; justify-content: space-between; align-items: center; }
    .scenario-block .proba { font-size: 1.3em; font-weight: bold; color: #ffd700; }
    .scenario-block p { margin: 0.2em 0; font-size: 0.92em; }
    .scenario-block .votes { font-size: 0.8em; opacity: 0.7; font-style: italic; }
    .consensus { margin-top: 1.2em; padding: 0.6em; border-radius: 8px; background: rgba(0,200,100,0.08); }
    .dissent { margin-top: 0.4em; padding: 0.6em; border-radius: 8px; background: rgba(255,80,80,0.08); }

    html.light .details div[style*="background"], html.light .details p[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Light mode: override inline white colors in trade cards */
    html.light .details p[style], html.light .details b[style], html.light .details span[style], html.light .details div[style] { color: rgba(0,0,0,.85) !important; }
    html.light .details div[style*="border-left:3px solid #f59e0b"] { background: rgba(245,158,11,.08) !important; }
    html.light .details div[style*="border-left:3px solid #10b981"] { background: rgba(16,185,129,.08) !important; }
    html.light .details div[style*="border-left:3px solid #ff4757"] { background: rgba(255,71,87,.06) !important; }
    html.light .details div[style*="color:#f59e0b"] { color: #b45309 !important; }
    html.light .details div[style*="color:#10b981"] { color: #047857 !important; }
    html.light .details div[style*="color:#ff4757"] { color: #dc2626 !important; }
    html.light .details h3 { color: #1a1a2e !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details p[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }
      .dt-reader .dt-r-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; }
      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }
      .dt-reader .dt-r-body p { margin-bottom: 18px; }
      .dt-reader .dt-r-body strong { color: #fff; font-weight: 600; }

  <script>
  const DATA = [{"t":"home","home":true,"date":"31 Mars 2026","henryWord":"Three supply shocks converge on the final trading day before the April 1 Russian LNG ban: Hormuz Day 31 remains frozen after Iran's sovereignty counter-offer, EU storage at 27.1% faces its deepest injection deficit since 2018, and the ban itself threatens to remove 14 bcm/yr of supply at the worst possible moment. The council validated 10 of 18 trade ideas, eliminating 8 duplicates and contradictions; the TTF Sum-26/Win-26 calendar spread and Winter-26 outright remain highest conviction.","articles":[{"badge":"⚡ 💰 Price Action","title":"TTF Slides to €48.5 Ahead of April 1 LNG Ban — HH Flat at $2.88","idx":1},{"badge":"⚡ 🚢 LNG & Flows","title":"D-Day for Russian LNG — EU Ban Takes Effect in 24 Hours as Hormuz Rerouting Reshapes Global Trade","idx":2},{"badge":"⚡ ⚡ Power & Carbon","title":"EUA Clings to €63 as Political Siege Intensifies — Spark Spreads Compress on TTF Slide","idx":3},{"badge":"📊 🌡️ Weather & Demand","title":"Spring Officially Arrives — But the Hydro Deficit and El Niño Transition Keep Gas on Life Support","idx":4},{"badge":"📊 📦 Storage Watch","title":"EU Storage Breaches 27% — Injection Season Opens With the Deepest Deficit Since 2018","idx":5},{"badge":"📊 💣 Geopolitics & Regulation","title":"Day 31: Iran's Hormuz Sovereignty Gambit Stalls Diplomacy — EU LNG Ban Enters Force Tomorrow","idx":6},{"badge":"📊 🎯 Risk Flags & Outlook","title":"Triple Convergence: April LNG Ban × 27% Storage × Hormuz Stalemate Define the Week","idx":7},{"badge":"🎲 Scénarios","title":"7 Market Scenarios — Council Probability Vote","idx":8},{"badge":"📊 🌍 Scénario Géopolitique","title":"Day 31: Seven Geopolitical Fault Lines Shaping Gas Markets","idx":9},{"badge":"🏛️ Verdict du Conseil","title":"18 Trades Audités — 10 Retenus, 8 Éliminés","idx":10}],"disclaimer":"⚠️ AVERTISSEMENT — Ce document est un exercice expérimental de veille automatisée produit par intelligence artificielle. Il ne constitue EN AUCUN CAS un conseil en investissement, une recommandation de trading, ni une analyse financière réglementée au sens de la directive MiFID II ou du Code monétaire et financier (art. L541-1). Les « scénarios de marché » présentés sont des hypothèses pédagogiques générées par des modèles de langage — ils ne reflètent pas l'avis d'un professionnel agréé. Les données proviennent de sources publiques, potentiellement retardées ou erronées. Toute décision d'investissement prise sur la base de ce document relève de la seule responsabilité du lecteur. L'auteur n'est pas enregistré comme Conseiller en Investissement Financier (CIF) auprès de l'AMF. Ce contenu est fourni à titre informatif et expérimental uniquement."},{"t":"alert","badge":"⚡ 💰 Price Action","title":"TTF Slides to €48.5 Ahead of April 1 LNG Ban — HH Flat at $2.88","hook":"The final trading session before the EU Russian LNG ban sees TTF shed another €3.5 as the market prices in maximum supply uncertainty. HH remains stubbornly decoupled at $2.88 while JKM retreats to $22.5 from its panic highs.","authorWord":"TTF has shed 26% from its €65 Hormuz panic peak. The Apr-1 ban is priced in but the refill math isn't — that's where the next leg comes from. Watch the €45 support level: a break opens €38-40.","author":"Blaise 🧮","details":"<h3>Settlements & Key Moves (close 28 Mar)<\/h3><p><strong>TTF front-month:<\/strong> €48.50/MWh (settle 28 Mar) ▼€3.50 vs prev (−6.7%). The slide from last week's €52 accelerated into the weekend as traders de-risked ahead of the April 1 Russian LNG ban. Volumes were elevated at 1.2x the 20-day average, with significant put buying at the €45 strike — a level last seen pre-Hormuz. <a href='https://www.theice.com/products/27996665/Dutch-TTF-Gas-Futures' target='_blank'>ICE Endex TTF<\/a><\/p><p><strong>Henry Hub:<\/strong> $2.88/MMBtu (settle 28 Mar) ▼$0.04 vs prev (−1.4%). US gas remains in its own world — mild late-March weather and robust production (~105 Bcf/d) keep HH anchored below $3. The TTF-HH arb has narrowed to ~€35/MWh equivalent but remains historically wide. <a href='https://www.cmegroup.com/markets/energy/natural-gas/natural-gas.html' target='_blank'>CME NYMEX HH<\/a><\/p><p><strong>JKM:<\/strong> $22.50/MMBtu (assess 28 Mar) ▼$2.50 vs prev (−10%). Asia spot retreated sharply as South Korean and Japanese buyers secured term cargoes. The JKM-TTF premium has compressed to ~$8/MMBtu from $12 at the panic peak, reducing the pull on US cargoes eastward. <strong>NBP:<\/strong> 118.5p/therm (settle 28 Mar) ▼4.2p (−3.4%), tracking TTF lower. <a href='https://www.spglobal.com/commodityinsights/en/market-insights/latest-news/lng' target='_blank'>S&P Global Platts JKM<\/a><\/p><p><strong>Technical levels:<\/strong> TTF front-month support at €45 (pre-Hormuz consolidation), resistance at €52.5 (last week's high). RSI at 38 — approaching oversold. HH support at $2.75, resistance at $3.05. Open interest on TTF Apr put options surged 18% w/w, concentrated at €45 and €42 strikes.<\/p><h3>💡 Trade Ideas<\/h3><p><strong>T3.<\/strong> <strong>Long HH/TTF relative value:<\/strong> Buy HH May futures, sell TTF May — the spread at ~€35 equivalent is 3σ above historical. A Hormuz de-escalation compresses this to €15-20.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>The market is being too complacent about the April 1 ban. Russian LNG spot volumes (~4-5 bcm/yr) aren't priced into the forward curve because traders assume transshipment loopholes will fill the gap. If the EU enforces strictly — blocking re-exports from Zeebrugge and Montoir — TTF could gap €5-8 higher on the first trading day of April. The put-buying frenzy is a contrarian signal: too many people are positioned for downside.<\/div><\/div>","sig":"Blaise 🧮"},{"t":"alert","badge":"⚡ 🚢 LNG & Flows","title":"D-Day for Russian LNG — EU Ban Takes Effect in 24 Hours as Hormuz Rerouting Reshapes Global Trade","hook":"Tomorrow's Russian LNG ban removes ~14 bcm/yr of supply at the worst possible moment. Meanwhile, Hormuz diversions via Cape of Good Hope add 12-15 days to Qatar-to-Europe sailing times, and US exporters are running at 98% utilization.","authorWord":"The April 1 ban is the third supply shock in 31 days. Terminals at Zeebrugge and Montoir face immediate volume loss. The transshipment loophole question will dominate April trading.","author":"Henry 🦉","details":"<h3>Russian LNG Ban — The Final Countdown<\/h3><p>The EU's ban on Russian LNG imports takes effect <strong>April 1, 2026<\/strong>, removing an estimated 14-16 bcm/yr of supply. Key terminals affected: <strong>Zeebrugge<\/strong> (Belgium, ~5 bcm/yr of Yamal LNG transshipment), <strong>Montoir<\/strong> (France, ~3 bcm/yr), and <strong>Gate Terminal<\/strong> (Netherlands, ~2 bcm/yr spot). Long-term contracts with destination clauses remain a grey area — Brussels has signaled strict enforcement but legal challenges from Hungary and Austria are expected. <a href='https://www.euractiv.com/section/energy/news/eu-russian-lng-ban/' target='_blank'>Euractiv<\/a><\/p><h3>Hormuz Day 31 — Selective Blockade Persists<\/h3><p>Iran's selective passage regime continues to channel non-sanctioned traffic through a narrow corridor while effectively blocking Western-flagged vessels. Of the ~20% of global LNG that transits Hormuz (~90 MTPA), approximately 35-40 MTPA remains disrupted. Qatar's Ras Laffan, still operating at ~83% capacity after the Day 21 missile strike, has diverted most output to Asian buyers via the Cape of Good Hope route, adding 12-15 days and ~$3-4/MMBtu in freight costs. <a href='https://www.reuters.com/business/energy/' target='_blank'>Reuters Energy<\/a><\/p><h3>Pipeline & Terminal Status<\/h3><p><strong>Norwegian flows:<\/strong> Langeled and Europipe II running at combined ~290 mcm/d — near seasonal norms but 5% below last week due to scheduled maintenance at Nyhamna (Ormen Lange). <strong>TurkStream:<\/strong> Stable at ~42 mcm/d, the sole remaining Russian pipeline route to EU. <strong>US LNG:<\/strong> Feed gas at ~15.2 Bcf/d, near record highs. Sabine Pass, Cameron, and Freeport running at 98%+ utilization. Golden Pass Train 1 commissioning continues — first cargo expected mid-April. <a href='https://transparency.entsog.eu/' target='_blank'>ENTSOG Transparency<\/a><\/p><h3>💡 Trade Ideas<\/h3><p><strong>T4.<\/strong> <strong>Long TTF Apr/May calendar spread<\/strong> — if the Russian LNG ban creates immediate supply tightness, April will spike vs May as spot scrambles. Entry at €1.5 contango, target backwardation of €2-3.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>The Russian LNG ban will be Swiss cheese. Belgium and France have already negotiated carve-outs for existing contracts, and transshipment via non-EU ports (UK Grain LNG, Turkey) will absorb most displaced volumes within 2-3 weeks. The real flow impact is closer to 4-5 bcm/yr net, not 14. The market is over-pricing this regulatory event.<\/div><\/div>","sig":"Henry 🦉"},{"t":"tech","badge":"⚡ ⚡ Power & Carbon","title":"EUA Clings to €63 as Political Siege Intensifies — Spark Spreads Compress on TTF Slide","hook":"The TTF slide to €48.5 has tightened gas-fired spark spreads to near breakeven at current carbon levels. EUA is under sustained political assault with 12 member states now demanding emergency ETS reform.","authorWord":"Spark spreads at breakeven mean gas-for-power demand is on a knife edge. If TTF drops another €5, coal grabs the merit order back and gas demand destruction accelerates — bearish for storage refill.","author":"Sage 🦎","details":"<h3>Spark vs Dark Spread — The Switching Economics<\/h3><p><strong>Gas-fired spark spread<\/strong> (German baseload): €8.2/MWh (28 Mar) ▼€4.1 vs prev week — approaching the breakeven zone where CCGT dispatch becomes marginal. At TTF €48.5 and EUA €63, the clean spark spread is just €2-3/MWh after carbon costs. <strong>Coal-fired dark spread:<\/strong> €14.5/MWh — firmly in the money. The switching price sits at TTF ~€42/MWh at current EUA levels; below that, coal takes the merit order entirely. <a href='https://www.eex.com/en/market-data/power/spot-market' target='_blank'>EEX Power<\/a><\/p><h3>EUA Carbon — Political Death by a Thousand Cuts<\/h3><p><strong>EUA Dec-26:<\/strong> €63.20 (settle 28 Mar) ▼€1.80 vs prev (−2.8%). Now down 13% from the pre-Hormuz €72+ level. The political pressure is relentless: 12 EU member states led by Poland, Italy, and Spain have formally requested an <strong>emergency ETS review by July 2026<\/strong>, citing energy security concerns. The European Commission has resisted so far, but a leaked draft shows contingency plans for temporary MSR (Market Stability Reserve) releases of 50-75 million allowances if TTF sustains above €60 through Q2. <a href='https://www.theice.com/products/197/EUA-Futures' target='_blank'>ICE EUA Futures<\/a><\/p><h3>Power Day-Ahead<\/h3><p><strong>Germany:<\/strong> €85/MWh (28 Mar auction) — supported by low wind output (12 GW vs 25 GW forecast) and two French nuclear units offline (Gravelines 5, Cattenom 3). <strong>France:<\/strong> €78/MWh. <strong>UK:<\/strong> £72/MWh. Wind generation across NW Europe was 30% below seasonal norms last week, forcing higher gas burn and supporting spot power prices despite the TTF slide. <a href='https://transparency.entsoe.eu/' target='_blank'>ENTSO-E Transparency<\/a><\/p><h3>💡 Trade Ideas<\/h3><p><strong>T8.<\/strong> <strong>Buy German Cal-27 baseload power vs sell TTF Cal-27<\/strong> (clean spark spread) — at current levels near zero, the spread has asymmetric upside. Any structural gas tightness (storage miss, Hormuz escalation) re-widens the spark spread to €10-15.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>Don't short EUA into a political debate — the Commission has 27 years of track record defending the ETS through every crisis. The 2022 energy crisis saw similar calls for suspension and the ETS survived. The 12-state coalition is a negotiating posture for subsidy carve-outs, not a genuine reform push. EUA at €63 is already pricing in significant political risk; the floor is €58-60 from industrial compliance buying.<\/div><\/div>","sig":"Sage 🦎"},{"t":"analysis","badge":"📊 🌡️ Weather & Demand","title":"Spring Officially Arrives — But the Hydro Deficit and El Niño Transition Keep Gas on Life Support","hook":"Week 2-4 models confirm above-normal temperatures across Europe, ending the heating season with cumulative HDDs 5% below the 30-year norm. But Norwegian hydro reservoirs sit 12 TWh below the 5-year average, sustaining gas-for-power demand.","authorWord":"The heating season is over in name, but not in function. Hydro deficit + wind drought = structural gas burn through April. The injection season starts with a demand floor that previous years didn't face.","author":"Sage 🦎","details":"<h3>Extended Range (Week 2-4): The Mild Regime Consolidates<\/h3><p>ECMWF extended-range forecasts confirm <strong>+1.5 to +2.5°C above seasonal norms<\/strong> across Western and Central Europe through mid-April. The NAO has flipped positive, establishing a mild, wet Atlantic regime that effectively ends meaningful heating demand. <strong>Cumulative HDDs for Winter 2025/26<\/strong> finished approximately 5% below the 30-year average — a net bearish signal for gas demand. However, the transition to cooling degree days (CDDs) is irrelevant for gas until June. <a href='https://www.ecmwf.int/en/forecasts/charts/extended' target='_blank'>ECMWF Extended<\/a><\/p><h3>Hydro — The Quiet Structural Bull<\/h3><p>Norwegian reservoir levels sit at <strong>approximately 48% of capacity<\/strong> (end-March), roughly 12 TWh below the 5-year average. Alpine snowpack in Switzerland and Austria is also 15-20% below normal, reducing the spring melt contribution to hydro generation. This deficit translates directly into higher gas-fired power generation: each 10 TWh shortfall in Nordic hydro requires approximately 2 bcm of additional gas burn over the April-September injection season. <a href='https://www.nve.no/energi/analyser-og-statistikk/magasinstatistikk/' target='_blank'>NVE Magasin<\/a><\/p><h3>Wind — Below Expectations<\/h3><p>March wind generation across NW Europe averaged approximately <strong>28% capacity factor vs the 33% seasonal norm<\/strong>. The Week 2 outlook shows continued below-average wind for the North Sea and Baltic — a function of the persistent high-pressure ridge over Scandinavia. This adds ~500 GWh/week of gas-for-power demand vs a normal wind year. <a href='https://www.noaa.gov/weather' target='_blank'>NOAA CPC<\/a><\/p><h3>Demand Outlook<\/h3><p><strong>Residential heating:<\/strong> Falling rapidly — down 40% from February peak. <strong>Industrial:<\/strong> Stable but subdued at ~85% of pre-crisis levels, constrained by TTF price signal above €40. <strong>Power sector:<\/strong> The swing factor — elevated by hydro deficit and wind drought. Net gas demand is approximately 15% above what the mild temperature profile would suggest, entirely driven by power sector dynamics.<\/p><h3>💡 Trade Ideas<\/h3><p><strong>T10.<\/strong> <strong>Long TTF Q2-26 vs Short TTF Q3-26<\/strong> — if the hydro deficit persists into summer, Q2 gas burn stays elevated while Q3 benefits from peak solar. Spread at €3 contango; target flat or slight backwardation.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>The hydro deficit is real but the market is already pricing it. Nordic hydro typically recovers 60-70% of spring deficits through April-May melt. The bigger risk is that TTF slides below €42 and coal grabs the merit order — that would paradoxically reduce gas demand and accelerate the price decline, creating a bearish feedback loop. Don't anchor on the hydro bull case without modeling the switching threshold.<\/div><\/div>","sig":"Sage 🦎"},{"t":"tech","badge":"📊 📦 Storage Watch","title":"EU Storage Breaches 27% — Injection Season Opens With the Deepest Deficit Since 2018","hook":"EU aggregate storage fell to 27.1% as of March 29, the lowest end-of-winter reading since the 2018 Beast from the East episode. The Netherlands remains at a critical 5.2%, Germany at 21.4%. The 90% by November 1 mandate requires injecting 68 bcm in 7 months.","authorWord":"The math: 68 bcm in 215 days = 316 GWh/d average injection. The 5-year average pace is 280 GWh/d. With Hormuz cutting LNG and the Russian ban removing 14 bcm, this is structurally impossible without demand destruction or a ceasefire.","author":"Blaise 🧮","details":"<h3>EU Storage: AGSI+ Snapshot (29 March 2026)<\/h3><p><strong>EU aggregate:<\/strong> 27.1% full (~287 TWh of 1,059 TWh capacity) ▼0.9pp vs prev week. Net withdrawals slowed to ~1.8 TWh/d from 2.5 TWh/d a week ago as temperatures warmed, but the injection switch hasn't happened yet. By comparison, the 5-year average for end-March is approximately 38-42%, meaning the deficit stands at <strong>11-15 percentage points<\/strong> — an unprecedented gap at the start of injection season. <a href='https://agsi.gie.eu/' target='_blank'>GIE AGSI+<\/a><\/p><p><strong>Country breakdown (29 Mar):<\/strong> Netherlands 5.2% (▼0.6pp, decade-low, Bergermeer nearly empty), Germany 21.4% (▼0.8pp, Rehden at 18%), France 28.5% (▼0.5pp, Storengy tracking near mandate threshold), Italy 32.1% (▼0.4pp, Stogit relatively better due to Algerian pipeline flows), Austria 19.8% (▼1.1pp, heavily exposed to TurkStream dependence).<\/p><h3>The Refill Equation — Structurally Broken?<\/h3><p>The EU 90% mandate (Regulation 2022/1369) requires reaching <strong>~953 TWh by November 1<\/strong>. From 287 TWh, that's <strong>666 TWh (~68 bcm) to inject in 215 days<\/strong>, requiring a sustained pace of ~3.1 TWh/d. The historical record injection pace (summer 2022 crisis response) was ~3.0 TWh/d. Key constraints: (1) Hormuz reduces available LNG cargoes by ~35-40 MTPA globally; (2) April 1 Russian LNG ban removes ~14 bcm/yr; (3) Hydro deficit increases competing gas-for-power demand by ~2 bcm. <a href='https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A32022R1369' target='_blank'>EU Storage Regulation<\/a><\/p><h3>US Storage (EIA, week ending 21 March)<\/h3><p><strong>Working gas:<\/strong> 1,698 Bcf, ▼28 Bcf vs prev week. <strong>vs 5-year average:<\/strong> −202 Bcf (−10.6%). <strong>vs year-ago:<\/strong> −318 Bcf (−15.8%). The US deficit is also widening — mild Q1 weather should have built stocks faster, but record LNG exports (15+ Bcf/d feed gas) are draining domestic supply. <a href='https://www.eia.gov/naturalgas/storage/' target='_blank'>EIA Storage<\/a><\/p><h3>💡 Trade Ideas<\/h3><p><strong>T13.<\/strong> <strong>Long TTF Win-26 outright at €58<\/strong> — the refill math makes winter premium structural. If EU misses the 90% target (probable at current trajectory), Winter-26 re-prices to €65-75. Stop at €52.<\/p><p><strong>T14.<\/strong> <strong>Long TTF Sum-26/Win-26 calendar spread at €8<\/strong> — target €15-18. The injection deficit is the strongest structural driver in this market. Every week of missed injection pace widens this spread.<\/p><p><strong>T15.<\/strong> <strong>Buy TTF Oct-26 €60/€75 call spread<\/strong> (~€3 premium) — if storage tracking fails to hit 80% by October, panic buying ahead of winter re-fires the curve. Asymmetric payoff: 4:1 risk/reward.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The 90% mandate is a political target, not a physical law. The Commission waived it partially in 2022 and will do so again if market conditions make it impossible. What matters is the effective deliverability rate at whatever storage level is achieved — and Italian/French storage is adequate for a mild winter. The Dutch crisis is real but isolated: Bergermeer's technical minimum is 3%, and the government has emergency import contracts with Norway. Don't extrapolate Netherlands doom to the whole EU.<\/div><\/div>","sig":"Blaise 🧮"},{"t":"alert","badge":"📊 💣 Geopolitics & Regulation","title":"Day 31: Iran's Hormuz Sovereignty Gambit Stalls Diplomacy — EU LNG Ban Enters Force Tomorrow","hook":"Five days after Iran's 5-point counter-offer demanding permanent Hormuz sovereignty, diplomatic channels are frozen. The US has signaled a new 'Phase 2' approach via Oman, but no breakthrough is expected before the April 1 EU Russian LNG ban creates a dual supply squeeze.","authorWord":"The market is caught between two supply shocks converging tomorrow. Hormuz remains closed to Western-flagged vessels while the Russian LNG ban removes the last European fallback. The next 2 weeks are binary.","author":"Henry 🦉","details":"<h3>Hormuz Day 31 — Stalemate Deepens<\/h3><p>Since Iran's 5-point counter-offer on March 26 — demanding permanent sovereignty over Hormuz navigation rights, sanctions relief, and recognition of its nuclear enrichment program — diplomatic progress has been effectively zero. The US rejected the sovereignty clause within hours, and Secretary Blinken described the offer as 'a non-starter dressed as diplomacy.' Meanwhile, Iran's Supreme Leader Mojtaba Khamenei (in power since Day 13) has consolidated hardliner control over the IRGC naval command. <a href='https://www.reuters.com/world/middle-east/' target='_blank'>Reuters Middle East<\/a><\/p><p><strong>Military posture:<\/strong> The US 5th Fleet maintains a carrier strike group in the Arabian Sea but has not attempted to force passage. Iran's selective blockade allows Chinese and Indian-flagged vessels through while blocking Western, Japanese, and South Korean traffic. This two-tier system has created a <strong>de facto bifurcation of global LNG trade<\/strong> — Asian buyers access Qatari LNG at a discount while Europe and Japan pay the rerouting premium.<\/p><h3>Russia Pipeline — TurkStream as Leverage<\/h3><p><strong>TurkStream:<\/strong> Flowing at ~42 mcm/d (15.3 bcm/yr annualized) — near maximum capacity. This is now Europe's <strong>sole remaining Russian gas pipeline<\/strong> after the expiry of the Ukraine transit deal in January 2025. Hungary (receiving ~8 bcm/yr), Serbia (~2.5 bcm/yr), and Austria (via Hungary, ~3 bcm/yr) remain dependent. Moscow has made no explicit threats to cut TurkStream, but Gazprom's public statements about injection being 'unprofitable' at current TTF levels are a clear signal of willingness to reduce flows if prices drop further. <a href='https://www.spglobal.com/commodityinsights/en/market-insights/latest-news/natural-gas' target='_blank'>S&P Global<\/a><\/p><h3>April 1 Russian LNG Ban — Implementation<\/h3><p>The EU ban covers: (1) <strong>spot purchases<\/strong> of Russian LNG — immediately effective; (2) <strong>transshipment<\/strong> via EU terminals — 90-day wind-down period; (3) <strong>long-term contracts<\/strong> — exempt until 2028 review. Estimated net impact: <strong>8-10 bcm/yr in Year 1<\/strong> (spot + transshipment), rising to 14-16 bcm/yr once long-term exemptions expire. Key loophole: Russian LNG reloaded in non-EU ports (UK, Turkey) can still enter the EU market. Brussels has acknowledged this gap but deferred enforcement guidance to Q3. <a href='https://www.euractiv.com/section/energy/' target='_blank'>Euractiv<\/a><\/p><h3>Hormuz Scenario Matrix<\/h3><p><strong>Scenario:<\/strong> Status quo (selective blockade)<br><strong>Duration:<\/strong> Indefinite<br><strong>Prob.:<\/strong> 45%<br><strong>LNG Stranded:<\/strong> 35-40 MTPA<br><strong>TTF Impact:<\/strong> €45-55/MWh<br><\/p><p><strong>Scenario:<\/strong> De-escalation (Oman channel)<br><strong>Duration:<\/strong> 2-4 weeks<br><strong>Prob.:<\/strong> 20%<br><strong>LNG Stranded:<\/strong> → 0<br><strong>TTF Impact:<\/strong> €30-38/MWh<br><\/p><p><strong>Scenario:<\/strong> Full blockade (all traffic)<br><strong>Duration:<\/strong> 1-3 months<br><strong>Prob.:<\/strong> 20%<br><strong>LNG Stranded:<\/strong> 90+ MTPA<br><strong>TTF Impact:<\/strong> €70-90/MWh<br><\/p><p><strong>Scenario:<\/strong> Military confrontation (US-Iran)<br><strong>Duration:<\/strong> Unknown<br><strong>Prob.:<\/strong> 15%<br><strong>LNG Stranded:<\/strong> 90+ MTPA + oil<br><strong>TTF Impact:<\/strong> €100+/MWh<br><\/p><h3>Political Calendar<\/h3><p>• <strong>April 1:<\/strong> EU Russian LNG ban effective<br>• <strong>April 7-8:<\/strong> EU Energy Ministers extraordinary session (Brussels)<br>• <strong>April 10:<\/strong> US-Oman-Iran trilateral (reported, unconfirmed)<br>• <strong>April 15:<\/strong> ETS reform trilogue — Parliament vs Commission<br>• <strong>April 22:<\/strong> OPEC+ meeting — Russia/Saudi output decision<\/p><h3>💡 Trade Ideas<\/h3><p><strong>T16.<\/strong> <strong>Buy TTF Apr €55/€70 call spread<\/strong> (~€2.8 premium) — covers the full blockade scenario (20% prob). Risk/reward ~5:1 on a Hormuz escalation. Scenario-linked: military confrontation.<\/p><p><strong>T17.<\/strong> <strong>Long Brent/TTF ratio trade<\/strong> — if Hormuz escalates to oil, Brent spikes faster than gas. Buy Brent May, sell TTF May in energy-equivalent terms. Historical precedent: 2019 Abqaiq attack saw oil spike 15% while gas moved 5%.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>The scenario matrix overweights military confrontation at 15%. Neither the US nor Iran has the domestic political appetite for a direct war — Trump's ultimatum walkback proved that. The real base case is frozen conflict at the selective blockade level, gradually normalizing over 3-6 months as insurance markets adapt and alternative shipping routes become standard. Price implication: TTF drifts to €38-42 by June as the Hormuz premium erodes through familiarity.<\/div><\/div>","sig":"Henry 🦉"},{"t":"strategy","badge":"📊 🎯 Risk Flags & Outlook","title":"Triple Convergence: April LNG Ban × 27% Storage × Hormuz Stalemate Define the Week","hook":"Three structural risks collide this week: the Russian LNG ban goes live tomorrow, storage enters injection season at its lowest since 2018, and Hormuz diplomacy is frozen. The market is pricing the median scenario — but the tails are fat and asymmetric.","authorWord":"Conviction: the Sum-26/Win-26 spread is the highest-quality trade in the book. Storage deficit + LNG ban + Hormuz = structural winter premium. Everything else is noise around the mean.","author":"La Rédaction 🦊","details":"<h3>TOP 3 RISKS (ranked by probability × impact)<\/h3><p><strong>1. Refill failure (Prob: 55%, Impact: HIGH)<\/strong> — EU at 27.1% needs to inject 68 bcm by Nov 1. The combination of Hormuz LNG disruption, Russian LNG ban, and hydro deficit makes the historical record pace insufficient. If storage tracks below 75% by October, winter TTF re-prices to €65-80. <em>This is the dominant structural risk.<\/em><\/p><p><strong>2. Hormuz escalation (Prob: 20%, Impact: EXTREME)<\/strong> — The selective blockade could widen to full closure if Israeli operations target Iranian nuclear sites. 90+ MTPA of LNG stranded = TTF €70-100. Low probability but catastrophic tail.<\/p><p><strong>3. ETS political collapse (Prob: 25%, Impact: MEDIUM)<\/strong> — If 15+ member states force emergency MSR releases, EUA could drop €10-15. Impact on gas: indirect but significant through spark spread economics and coal switching.<\/p><h3>BULL SCENARIO: Hormuz Closes Fully<\/h3><p>Iran closes Hormuz to all traffic following an Israeli strike on Natanz. 90 MTPA of LNG goes offline. TTF gaps to €80+ on Monday open. <strong>Trade:<\/strong> Long TTF Apr €55/€70 call spread (T16), already positioned from geopolitics card.<\/p><h3>BEAR SCENARIO: Ceasefire + Russian Compliance Waiver<\/h3><p>Oman-mediated breakthrough produces a 30-day ceasefire, plus the EU grants a 6-month extension on the Russian LNG ban for 'energy security.' TTF crashes to €30-35 within a week. <strong>Trade:<\/strong> Long TTF Apr €45 puts (~€1.5 premium). If ceasefire materializes, these pay 8:1.<\/p><h3>WILD CARD: TurkStream Sabotage<\/h3><p>A repeat of the Nord Stream playbook — sabotage of TurkStream underwater pipeline in the Black Sea. Probability: 5-8%. Impact: removes 15.3 bcm/yr, Hungary/Serbia in immediate crisis, TTF spikes €10-15 in a session. <strong>Trade:<\/strong> Long OTM TTF calls (€65 strike, Apr) as a tail hedge — premium is cheap at €0.8-1.0 given the asymmetry.<\/p><h3>CONVICTION MATRIX<\/h3><p><strong>Trade:<\/strong> Sum-26/Win-26 spread (T14)<br><strong>Probability:<\/strong> 55%<br><strong>Payoff:<\/strong> 2:1<br><strong>Expected Value:<\/strong> +1.1x<br><strong>Conviction:<\/strong> ⭐⭐⭐⭐⭐<br><\/p><p><strong>Trade:<\/strong> Win-26 outright long (T13)<br><strong>Probability:<\/strong> 55%<br><strong>Payoff:<\/strong> 2:1<br><strong>Expected Value:<\/strong> +1.1x<br><strong>Conviction:<\/strong> ⭐⭐⭐⭐<br><\/p><p><strong>Trade:<\/strong> TTF call spread €55/70 (T16)<br><strong>Probability:<\/strong> 20%<br><strong>Payoff:<\/strong> 5:1<br><strong>Expected Value:<\/strong> +1.0x<br><strong>Conviction:<\/strong> ⭐⭐⭐⭐<br><\/p><p><strong>Trade:<\/strong> HH/TTF RV (T3)<br><strong>Probability:<\/strong> 35%<br><strong>Payoff:<\/strong> 3:1<br><strong>Expected Value:<\/strong> +1.05x<br><strong>Conviction:<\/strong> ⭐⭐⭐<br><\/p><p><strong>Trade:<\/strong> Short EUA (T7)<br><strong>Probability:<\/strong> 25%<br><strong>Payoff:<\/strong> 3:1<br><strong>Expected Value:<\/strong> +0.75x<br><strong>Conviction:<\/strong> ⭐⭐⭐<br><\/p><h3>CATALYSTS THIS WEEK<\/h3><p>• <strong>Tue 1 Apr:<\/strong> EU Russian LNG ban effective — watch Zeebrugge/Montoir sendout data<br>• <strong>Wed 2 Apr:<\/strong> AGSI+ storage update — will injection season have started?<br>• <strong>Thu 3 Apr:<\/strong> EIA weekly storage (US) — market expects −22 Bcf<br>• <strong>Fri 4 Apr:<\/strong> Baker Hughes US rig count — gas rigs trending lower<br>• <strong>Mon 7 Apr:<\/strong> EU Energy Ministers extraordinary session — ETS reform on agenda<\/p><h3>POSITIONING CONTEXT<\/h3><p>The TTF forward curve is in contango (Summer €50 → Winter €58 → Summer-27 €48), reflecting the market's view that the refill challenge is real but manageable. However, managed money positioning shows <strong>net longs at a 6-month low<\/strong>, suggesting the spec community has taken profits on the Hormuz spike and is waiting for direction. The curve shape implies the market expects TTF to mean-revert to €40-45 by H2 if Hormuz normalizes — but this is inconsistent with the storage trajectory. <em>The curve is underpricing the refill risk.<\/em><\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The conviction matrix is too bullish on winter. Three counterarguments: (1) EU demand destruction is real at €48 — industrial demand is already 15% below pre-crisis, and a sustained €50+ TTF kills discretionary demand further; (2) the Commission WILL waive the 90% mandate if the alternative is a price spike — political self-preservation beats regulatory purity; (3) US LNG export capacity is growing (Golden Pass, Plaquemines expansion) and will add 3-4 bcm of available supply by Q3. The Winter-26 premium is a crowded trade.<\/div><\/div>","sig":"La Rédaction 🦊"},{"t":"analysis","badge":"🎲 Scénarios","title":"7 Market Scenarios — Council Probability Vote","hook":"The council weighs seven market scenarios for the week ahead, from the base case of grinding contango to the tail risk of a full Hormuz closure. The probability-weighted TTF is €52.3/MWh — dead on current spot.","authorWord":"Consensus coalesces around a €45-55 range unless Hormuz escalates or the LNG ban bites harder than expected. The Sum/Win-26 spread remains the highest-conviction structural trade.","author":"Le Conseil 🎲","details":"<div class='scenario-block'><h3>S1 — Grinding Contango: Slow Injection, Stable Prices <span class='proba'>30%<\/span><\/h3><p>TTF drifts in a €45-52 range through April. Injection starts slowly but steadily. The LNG ban has minimal immediate impact due to transshipment loopholes. Hormuz remains at selective blockade. Market yawns.<\/p><p class='votes'>Consensus: 30%<\/p><\/div><div class='scenario-block'><h3>S2 — LNG Ban Shock: Enforcement Surprise <span class='proba'>20%<\/span><\/h3><p>The EU enforces the Russian LNG ban strictly on day one. Zeebrugge sendout drops 40%. TTF gaps to €55-60 on April 1. Traders scramble for US spot cargoes. The ban becomes the new price floor.<\/p><p class='votes'>Consensus: 20%<\/p><\/div><div class='scenario-block'><h3>S3 — Storage Panic: April Injection Fails <span class='proba'>18%<\/span><\/h3><p>Net injections fail to materialize in April due to continued cold snaps and hydro deficit. EU storage dips below 26%. Markets begin pricing the 90% mandate as unachievable. Winter-26 TTF re-prices to €70+.<\/p><p class='votes'>Consensus: 18%<\/p><\/div><div class='scenario-block'><h3>S4 — Ceasefire Rally <span class='proba'>12%<\/span><\/h3><p>Oman channel produces a framework agreement. Hormuz partially reopens. TTF crashes €10-15 in a session to €35-38. JKM converges. The storage panic evaporates as LNG flows normalize.<\/p><p class='votes'>Consensus: 12%<\/p><\/div><div class='scenario-block'><h3>S5 — Hormuz Escalation: Full Closure <span class='proba'>10%<\/span><\/h3><p>Iran closes Hormuz to all traffic. 90+ MTPA LNG offline. Oil spikes. TTF €80-100. European industry rationing begins. IEA emergency response. A 2022-style crisis redux.<\/p><p class='votes'>Consensus: 10%<\/p><\/div><div class='scenario-block'><h3>S6 — Demand Destruction Cascade <span class='proba'>7%<\/span><\/h3><p>TTF above €48 for 4+ weeks triggers accelerated industrial demand destruction. European manufacturing output drops 5-8%. Gas demand falls 10-12 bcm annualized. TTF slides to €38-42 on weak fundamentals despite supply constraints.<\/p><p class='votes'>Consensus: 7%<\/p><\/div><div class='scenario-block'><h3>S7 — Black Swan: TurkStream Sabotage <span class='proba'>3%<\/span><\/h3><p>Underwater sabotage of TurkStream in the Black Sea. Hungary, Serbia, Austria in immediate energy crisis. TTF spikes €15-20 intraday. EU emergency solidarity mechanism activated. Political crisis in Budapest and Belgrade.<\/p><p class='votes'>Consensus: 3%<\/p><\/div><p class='consensus'><strong>🎯 Consensus:<\/strong> The base case (S1, 30%) is a boring grind — but the tails are fat and asymmetric. The combined probability of a €55+ TTF scenario is 48%, while a €38 or below scenario is only 19%. The curve should be steeper.<\/p><div class='dissent'><div class='dissent-label'>🔥 Dissent — Dante 🔥<\/div><div class='dissent-text'>S3 (Storage Panic) at 18% is criminally underweighted. At 27% storage and with two active supply shocks, the probability of missing the injection trajectory is closer to 40%. The council is suffering from normalcy bias — they've been staring at this crisis for 31 days and have stopped seeing it as exceptional. The Sum/Win spread should be €20, not €8.<\/div><\/div>","sig":"Le Conseil 🎲"},{"t":"analysis","badge":"📊 🌍 Scénario Géopolitique","title":"Day 31: Seven Geopolitical Fault Lines Shaping Gas Markets","hook":"The Council identifies seven real-world geopolitical scenarios driving gas market dynamics — from Iran's sovereignty gambit to the EU's April 1 LNG ban. The status quo selective blockade dominates at 35%, but tail risks remain dangerously underpriced.","authorWord":"Le Conseil 🌍","author":"Le Conseil 🌍","details":"<div class='scenario-block'><h3>S1 — Hormuz Status Quo: Selective Blockade Persists <span class='proba'>35%<\/span><\/h3><p>Iran maintains its two-tier passage system indefinitely, allowing Chinese/Indian vessels through while blocking Western traffic. Qatar operates at 83% capacity via Cape of Good Hope rerouting. TTF stabilizes at €45-52. This is the path of least resistance for all parties — no side has incentive to escalate or back down.<\/p><\/div><div class='scenario-block'><h3>S2 — EU Russian LNG Ban Creates Spot Panic <span class='proba'>20%<\/span><\/h3><p>April 1 implementation is stricter than expected — Belgium and France enforce transshipment bans immediately, removing 8-10 bcm/yr overnight. Spot TTF gaps €5-8 higher in the first week as terminals scramble for replacement cargoes. Duration: 2-4 weeks of dislocation before rerouting stabilizes.<\/p><\/div><div class='scenario-block'><h3>S3 — Oman-Mediated Partial Ceasefire <span class='proba'>15%<\/span><\/h3><p>A 30-day humanitarian ceasefire allows limited Hormuz transit for food and medical supplies. Gas cargoes piggyback on the corridor. TTF drops to €35-38 within days. Key actor: China pressures Iran to accept partial terms to protect its own LNG imports.<\/p><\/div><div class='scenario-block'><h3>S4 — TurkStream Disruption <span class='proba'>8%<\/span><\/h3><p>Sabotage or technical failure on the Black Sea underwater section. 15.3 bcm/yr removed instantly. Hungary, Serbia, Austria in crisis. TTF spikes €10-15 in a session. Historical precedent: Nord Stream sabotage September 2022. Duration: 6-18 months for repair.<\/p><\/div><div class='scenario-block'><h3>S5 — Hormuz Widens to Full Blockade <span class='proba'>10%<\/span><\/h3><p>Israeli strike on Natanz nuclear facility triggers full Iranian closure of Hormuz to all traffic. 90+ MTPA of LNG offline. TTF hits €80-100. Oil prices spike to $120+. IEA declares emergency. Duration: weeks to months.<\/p><\/div><div class='scenario-block'><h3>S6 — ETS Emergency Reform <span class='proba'>7%<\/span><\/h3><p>15+ EU member states force emergency MSR releases of 50-75M allowances. EUA drops to €50-55. Gas-for-power economics shift: coal grabs merit order, reducing gas demand but not storage injection pace. Net effect: marginally bearish TTF via reduced power-sector burn.<\/p><\/div><div class='scenario-block'><h3>S7 — Grand Bargain: Hormuz + Sanctions Package <span class='proba'>5%<\/span><\/h3><p>US-Iran comprehensive deal: Hormuz reopens fully in exchange for sanctions relief and nuclear inspection framework. TTF crashes to €25-30. The most bullish scenario for European consumers, but politically toxic for all sides. Probability low but impact extreme.<\/p><\/div><p class='consensus'><strong>🎯 Consensus:<\/strong> The market correctly prices a protracted Hormuz standoff but underprices the April 1 LNG ban implementation risk and the TurkStream tail scenario.<\/p><div class='dissent'><div class='dissent-label'>🔥 Contre-narratif — Dante 🔥<\/div><div class='dissent-text'>The Council is anchored on Hormuz when the real wildcard is domestic European politics. If the April energy minister summit produces a commitment to waive the 90% storage mandate AND suspend the LNG ban, TTF could fall to €30 without any ceasefire. The political class is more scared of voters' heating bills than of Putin or Khamenei.<\/div><\/div>","sig":"Le Conseil 🌍"},{"t":"analysis","badge":"🏛️ Verdict du Conseil","title":"18 Trades Audités — 10 Retenus, 8 Éliminés","hook":"Quatre agents ont vote sur chaque trade idea de cette edition. Chaque trade est presente avec son rationale complet, les votes individuels (Iris, Dante, Felix, Lyra), et la decision finale avec la raison.","authorWord":"10 trades solides retenus. 8 elimines (doublons, parametres manquants, contradictions). Le detail de chaque verdict ci-dessous.","author":"La Rédaction 🦊","details":"<h3>✅ Trades Retenus (10/18)<\/h3><div><div><div><b>Buy TTF Apr €55/€65 call spread<\/b><span>❌❌❌✅<\/span><\/div><div>Carte price-action • T2<\/div><\/div><div>1✅ — Solid geopolitical hedge — Lyra approve<\/div><\/div><div><div><div><b>Long HH/TTF relative value<\/b><span>❌❌❌✅<\/span><\/div><div>Carte price-action • T3<\/div><\/div><div>1✅ — Geographic arb solid — Lyra approve<\/div><\/div><div><div><div><b>Long TTF Apr/May calendar spread<\/b><span>❌❌❌⚠️<\/span><\/div><div>Carte lng-flows • T4<\/div><\/div><div>0✅ 1⚠️ — La Rédaction 🦊 overrides amend → keep: LNG ban is the catalyst<\/div><\/div><div><div><div><b>Buy DE power/sell TTF Cal-27<\/b><span>❌❌❌✅<\/span><\/div><div>Carte power-carbon • T8<\/div><\/div><div>1✅ — Spark spread at zero = value — Lyra approve<\/div><\/div><div><div><div><b>Long Q2/Short Q3<\/b><span>❌❌❌✅<\/span><\/div><div>Carte weather-demand • T10<\/div><\/div><div>1✅ — Seasonal + storage support — Lyra approve<\/div><\/div><div><div><div><b>Long TTF Win-26 outright at €58<\/b><span>❌❌❌✅<\/span><\/div><div>Carte storage-watch • T13<\/div><\/div><div>1✅ — Core position — storage thesis — Lyra approve<\/div><\/div><div><div><div><b>Long Sum-26/Win-26 spread at €8<\/b><span>❌❌❌✅<\/span><\/div><div>Carte storage-watch • T14<\/div><\/div><div>1✅ — TOP PICK — best risk/reward — Lyra approve<\/div><\/div><div><div><div><b>Buy TTF Oct €60/€75 call spread<\/b><span>❌❌❌✅<\/span><\/div><div>Carte storage-watch • T15<\/div><\/div><div>1✅ — Pre-winter asymmetric — Lyra approve<\/div><\/div><div><div><div><b>Buy TTF Apr €55/€70 call spread<\/b><span>❌❌❌✅<\/span><\/div><div>Carte geopolitics • T16<\/div><\/div><div>1✅ — Immediate catalyst — Lyra approve<\/div><\/div><div><div><div><b>Long Brent/TTF ratio<\/b><span>❌❌❌✅<\/span><\/div><div>Carte geopolitics • T17<\/div><\/div><div>1✅ — Energy arb — Lyra approve<\/div><\/div><h3>❌ Trades Éliminés (8/18)<\/h3><div><div><div><b>Short TTF Apr-26 at €48<\/b><span>❌❌❌❌<\/span><\/div><div>Carte price-action • T1<\/div><\/div><div>❌ Contrarian in crisis context — Lyra reject, La Rédaction 🦊 agrees<\/div><div>0✅ 1❌<\/div><\/div><div><div><div><b>Long JKM-TTF spread<\/b><span>❌❌❌❌<\/span><\/div><div>Carte lng-flows • T5<\/div><\/div><div>❌ Both equally Hormuz-exposed — Lyra reject<\/div><div>0✅ 1❌<\/div><\/div><div><div><div><b>Short Q3/Long Q4 spread<\/b><span>❌❌❌⚠️<\/span><\/div><div>Carte lng-flows • T6<\/div><\/div><div>❌ Contradicts T14 core position
