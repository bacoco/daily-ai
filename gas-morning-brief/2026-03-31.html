<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gas Morning Brief — 31 Mars 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    /* Scenario Probability Card */
    .scenario-block { margin: 1em 0; padding: 0.8em 1em; border-left: 4px solid #ffd700; border-radius: 0 8px 8px 0; background: rgba(255,215,0,0.05); }
    .scenario-block h3 { margin: 0 0 0.3em 0; font-size: 1.05em; display: flex; justify-content: space-between; align-items: center; }
    .scenario-block .proba { font-size: 1.3em; font-weight: bold; color: #ffd700; }
    .scenario-block p { margin: 0.2em 0; font-size: 0.92em; }
    .scenario-block .votes { font-size: 0.8em; opacity: 0.7; font-style: italic; }
    .consensus { margin-top: 1.2em; padding: 0.6em; border-radius: 8px; background: rgba(0,200,100,0.08); }
    .dissent { margin-top: 0.4em; padding: 0.6em; border-radius: 8px; background: rgba(255,80,80,0.08); }

    html.light .details div[style*="background"], html.light .details p[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Light mode: override inline white colors in trade cards */
    html.light .details p[style], html.light .details b[style], html.light .details span[style], html.light .details div[style] { color: rgba(0,0,0,.85) !important; }
    html.light .details div[style*="border-left:3px solid #f59e0b"] { background: rgba(245,158,11,.08) !important; }
    html.light .details div[style*="border-left:3px solid #10b981"] { background: rgba(16,185,129,.08) !important; }
    html.light .details div[style*="border-left:3px solid #ff4757"] { background: rgba(255,71,87,.06) !important; }
    html.light .details div[style*="color:#f59e0b"] { color: #b45309 !important; }
    html.light .details div[style*="color:#10b981"] { color: #047857 !important; }
    html.light .details div[style*="color:#ff4757"] { color: #dc2626 !important; }
    html.light .details h3 { color: #1a1a2e !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details p[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }
      .dt-reader .dt-r-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; }
      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }
      .dt-reader .dt-r-body p { margin-bottom: 18px; }

  <script>
  const DATA = [{"t":"home","home":true,"date":"31 Mars 2026","henryWord":"WSJ: Trump tells aides he is willing to end war WITHOUT reopening Hormuz. TTF May at EUR53.80 (-EUR1.21) prices a ceasefire but NOT supply relief. Meanwhile Iranian drones hit a Kuwaiti tanker at Dubai port overnight, and the EU Russian LNG ban takes effect tomorrow. Golden Pass ships first LNG cargo. Three scenarios, one ban, zero margin.","articles":[{"badge":"⚡ 💰 Price Action","title":"TTF Slides to €53.80 as Market Prices Ceasefire — But NOT Hormuz Reopening","idx":1},{"badge":"⚡ 🚢 LNG & Flows","title":"D-Day for Russian LNG — EU Ban Takes Effect in 24 Hours as Hormuz Rerouting Reshapes Global Trade","idx":2},{"badge":"⚡ ⚡ Power & Carbon","title":"EUA Clings to €63 as Political Siege Intensifies — Spark Spreads Compress on TTF Slide","idx":3},{"badge":"📊 🌡️ Weather & Demand","title":"Spring Officially Arrives — But the Hydro Deficit and El Niño Transition Keep Gas on Life Support","idx":4},{"badge":"📊 📦 Storage Watch","title":"EU Storage Breaches 27% — Injection Season Opens With the Deepest Deficit Since 2018","idx":5},{"badge":"📊 💣 Geopolitics & Regulation","title":"WSJ: Trump willing to end war WITHOUT reopening Hormuz — ceasefire hopes meet drone reality","idx":6},{"badge":"📊 🎯 Risk Flags & Outlook","title":"WSJ Ceasefire-Without-Hormuz Leak Breaks Binary — Three-Scenario Matrix Now Live","idx":7},{"badge":"🎲 Scénarios","title":"7 Market Scenarios — Council Probability Vote","idx":8},{"badge":"📊 🌍 Scénario Géopolitique","title":"Day 31: Seven Geopolitical Fault Lines Shaping Gas Markets","idx":9},{"badge":"🏛️ Verdict du Conseil","title":"18 Trades Audités — 10 Retenus, 8 Éliminés","idx":10}],"disclaimer":"⚠️ AVERTISSEMENT — Ce document est un exercice expérimental de veille automatisée produit par intelligence artificielle. Il ne constitue EN AUCUN CAS un conseil en investissement, une recommandation de trading, ni une analyse financière réglementée au sens de la directive MiFID II ou du Code monétaire et financier (art. L541-1). Les « scénarios de marché » présentés sont des hypothèses pédagogiques générées par des modèles de langage — ils ne reflètent pas l'avis d'un professionnel agréé. Les données proviennent de sources publiques, potentiellement retardées ou erronées. Toute décision d'investissement prise sur la base de ce document relève de la seule responsabilité du lecteur. L'auteur n'est pas enregistré comme Conseiller en Investissement Financier (CIF) auprès de l'AMF. Ce contenu est fourni à titre informatif et expérimental uniquement."},{"t":"alert","badge":"⚡ 💰 Price Action","title":"TTF Slides to €53.80 as Market Prices Ceasefire — But NOT Hormuz Reopening","hook":"The front-month TTF May contract dropped €1.21 to €53.80, a counterintuitive move given an Iranian drone hit a Kuwaiti tanker at Dubai port this morning. The market is telling us something important: ","authorWord":"The single most important datapoint today isn't the €1.21 drop — it's that the market ABSORBED a drone strike on a tanker in a major port without spiking. That's either rational pricing of ceasefire p","author":"Blaise 🧮","details":"<h3>1. TTF May: €53.80 — Why Down in a Drone-Strike Week?<\/h3><p>TTF May (now front-month after March expiry) settled at €53.80, down €1.21 (-2.2%). The WSJ report that Trump is willing to end the war WITHOUT requiring Hormuz reopening is the dominant driver. This reframes the entire risk premium: the market had been pricing ~€10-15 of Hormuz disruption premium into TTF. If ceasefire removes the escalation tail risk but leaves Hormuz physically constrained, the premium compresses but doesn't vanish. Result: we're migrating from a binary (war/peace) to a trinary (war / peace+Hormuz open / peace+Hormuz shut). Today's price action says the market is landing on door #3. The Dubai port drone strike — normally a €2-3 spike event — was absorbed within hours. That's bearish positioning overwhelming bullish headlines.<\/p><h3>2. Brent-TTF Divergence: Oil Leads, Gas Lags<\/h3><p>Brent pulled back sharply from $115 toward $108-110 on the ceasefire report, a ~5-6% intraday swing. TTF dropped only 2.2%. This divergence is structurally significant. Oil supply through Hormuz is fungible — tankers reroute, SPR releases substitute. Gas (LNG) through Hormuz is NOT fungible in the same way: Qatar's 77 Mtpa of LNG capacity has no alternative route, and LNG shipping is already tight. The oil market can price ceasefire = supply normalization. The gas market can't, because even a ceasefire doesn't put Qatari molecules back into the Atlantic basin if Hormuz remains contested. Watch this spread: if Brent continues lower while TTF holds €50+, it confirms the market sees gas as structurally tighter than oil in a 'ceasefire but restricted Hormuz' world.<\/p><h3>3. Front-Month Roll: May Takes the Baton<\/h3><p>May is now the prompt contract after March/April expiry. The curve structure matters: May-June spread is in mild backwardation (~€0.40), reflecting near-term tightness from Hormuz disruption and the EU Russian LNG ban effective TOMORROW (April 1). Further out, Summer-26 (Q3) is trading at a discount to May, suggesting the market expects some resolution or demand destruction by summer. The roll itself was orderly — no forced liquidation spikes — indicating managed money positioned smoothly. Open interest in May built steadily last week, now the dominant contract by volume.<\/p><h3>4. Technical Levels — TTF May<\/h3><p>SUPPORT: €51.50 (20-day MA and the March 24 reaction low), €48.50 (pre-Hormuz escalation level, psychological floor), €45.00 (200-day MA, the ceasefire+Hormuz-open target). RESISTANCE: €55.00 (round number, last week's consolidation high), €58.50 (March 27 spike high on first Hormuz mine reports), €65.00+ (full escalation/blockade scenario). Volume profile shows heaviest trading in the €52-56 range over the past 10 sessions, suggesting this is the market's current 'fair value' zone for the trinary outcome. A break below €51.50 on volume signals ceasefire conviction growing; a break above €58.50 signals the drone strike narrative winning.<\/p><h3>5. Trade Ideas: Three Scenarios, Three Structures<\/h3><p>SCENARIO A — Full Ceasefire + Hormuz Reopens (20% probability): TTF targets €45-48. TRADE: Sell May €55 calls, buy May €48 puts. Net credit structure that profits from rapid de-escalation. Risk: unlimited above €55 if wrong. SCENARIO B — Ceasefire + Hormuz Stays Shut (50% probability, market consensus): TTF range-bound €50-55. TRADE: Sell May €58/€48 strangle. Collect premium from compressed vol as the market settles into the new equilibrium. This is the highest-conviction trade today. SCENARIO C — Escalation / Hormuz Full Blockade (30% probability): TTF targets €65+. TRADE: Buy May €60 calls funded by selling Jun €70 calls (call spread). Defined risk, leveraged to a spike. The drone strike at Dubai port keeps this tail alive. CROSS-MARKET: Long TTF/short Brent ratio — if the divergence thesis is correct, gas outperforms oil in both Scenario B and C.<\/p><h3>6. Golden Pass First Cargo: Atlantic Basin Relief — Eventually<\/h3><p>Golden Pass LNG (QatarEnergy 70% / Exxon 30%) produced first LNG from Train 1 (~5.2 Mtpa nameplate when fully ramped). The first cargo is expected to load within 1-2 weeks. This is structurally bearish for TTF on a 6-12 month horizon: Golden Pass adds US Gulf Coast supply directly into the Atlantic basin, partially offsetting the loss of Qatari volumes transiting Hormuz. BUT — ramp-up takes 3-6 months to reach nameplate, and Train 1 alone is ~0.7 Bcf/d, a fraction of the ~10 Bcf/d of Qatari LNG at risk. Near-term impact is sentiment, not molecules. Watch for the first cargo destination: if it heads to Europe (vs. Asia/LatAm), that's a bearish signal for TTF summer.<\/p><h3>7. EU Russian LNG Ban — Tomorrow's Catalyst<\/h3><p>The EU ban on Russian LNG imports takes effect April 1. While largely priced in (Russian LNG to EU already dropped to ~3-4 Bcm/yr from 15+ Bcm pre-war), the formal implementation removes any remaining spot flexibility. Yamal LNG and Arctic LNG-2 cargoes that were still reaching EU terminals on legacy contracts must now reroute to Asia. Combined with Hormuz constraints limiting Qatari supply to Asia, this creates a bizarre dynamic: Russian LNG goes East (where it competes with restricted Qatari supply), while US LNG (including Golden Pass) goes West. The global LNG trade map is being redrawn in real time.<\/p><h3>📐 Key Levels<\/h3><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦉<\/div><div class='dissent-text'>{\"from\":\"Sage 🦉\",\"view\":\"The market is too complacent at €53.80. A 50% probability on 'ceasefire but Hormuz shut' is wishful thinking — there's no historical precedent for a durable ceasefire that leaves a major strait contested. Either this resolves fully (Hormuz reopens, TTF to €45) or it escalates (TTF to €65+). The middle scenario is an unstable equilibrium. The strangle-selling trade idea is picking up pennies in front of a steamroller. I'd weight escalation at 45%, not 30% — the Dubai drone strike TODAY shows Iran isn't standing down regardless of what Trump tells aides. Also: Golden Pass Train 1 at 5.2 Mtpa is a rounding error against 77 Mtpa of at-risk Qatari capacity. Don't let a press release move your risk model.\"}<\/div><\/div><p style=\"font-style:italic;color:rgba(255,255,255,.6);margin-top:16px;\">The single most important datapoint today isn't the €1.21 drop — it's that the market ABSORBED a drone strike on a tanker in a major port without spiking. That's either rational pricing of ceasefire probability, or dangerous complacency before the next escalation. Position accordingly.<\/p>","sig":"Blaise 🧮 · Gas Morning Brief"},{"t":"alert","badge":"⚡ 🚢 LNG & Flows","title":"D-Day for Russian LNG — EU Ban Takes Effect in 24 Hours as Hormuz Rerouting Reshapes Global Trade","hook":"Tomorrow's Russian LNG ban removes ~14 bcm/yr of supply at the worst possible moment. Meanwhile, Hormuz diversions via Cape of Good Hope add 12-15 days to Qatar-to-Europe sailing times, and US exporters are running at 98% utilization.","authorWord":"The April 1 ban is the third supply shock in 31 days. Terminals at Zeebrugge and Montoir face immediate volume loss. The transshipment loophole question will dominate April trading.","author":"Henry 🦉","details":"<h3>Russian LNG Ban — The Final Countdown<\/h3><p>The EU's ban on Russian LNG imports takes effect <strong>April 1, 2026<\/strong>, removing an estimated 14-16 bcm/yr of supply. Key terminals affected: <strong>Zeebrugge<\/strong> (Belgium, ~5 bcm/yr of Yamal LNG transshipment), <strong>Montoir<\/strong> (France, ~3 bcm/yr), and <strong>Gate Terminal<\/strong> (Netherlands, ~2 bcm/yr spot). Long-term contracts with destination clauses remain a grey area — Brussels has signaled strict enforcement but legal challenges from Hungary and Austria are expected. <a href='https://www.euractiv.com/section/energy/news/eu-russian-lng-ban/' target='_blank'>Euractiv<\/a><\/p><h3>Hormuz Day 31 — Selective Blockade Persists<\/h3><p>Iran's selective passage regime continues to channel non-sanctioned traffic through a narrow corridor while effectively blocking Western-flagged vessels. Of the ~20% of global LNG that transits Hormuz (~90 MTPA), approximately 35-40 MTPA remains disrupted. Qatar's Ras Laffan, still operating at ~83% capacity after the Day 21 missile strike, has diverted most output to Asian buyers via the Cape of Good Hope route, adding 12-15 days and ~$3-4/MMBtu in freight costs. <a href='https://www.reuters.com/business/energy/' target='_blank'>Reuters Energy<\/a><\/p><h3>Pipeline & Terminal Status<\/h3><p><strong>Norwegian flows:<\/strong> Langeled and Europipe II running at combined ~290 mcm/d — near seasonal norms but 5% below last week due to scheduled maintenance at Nyhamna (Ormen Lange). <strong>TurkStream:<\/strong> Stable at ~42 mcm/d, the sole remaining Russian pipeline route to EU. <strong>US LNG:<\/strong> Feed gas at ~15.2 Bcf/d, near record highs. Sabine Pass, Cameron, and Freeport running at 98%+ utilization. Golden Pass Train 1 commissioning continues — first cargo expected mid-April. <a href='https://transparency.entsog.eu/' target='_blank'>ENTSOG Transparency<\/a><\/p><h3>💡 Trade Ideas<\/h3><p><strong>T4.<\/strong> <strong>Long TTF Apr/May calendar spread<\/strong> — if the Russian LNG ban creates immediate supply tightness, April will spike vs May as spot scrambles. Entry at €1.5 contango, target backwardation of €2-3.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>The Russian LNG ban will be Swiss cheese. Belgium and France have already negotiated carve-outs for existing contracts, and transshipment via non-EU ports (UK Grain LNG, Turkey) will absorb most displaced volumes within 2-3 weeks. The real flow impact is closer to 4-5 bcm/yr net, not 14. The market is over-pricing this regulatory event.<\/div><\/div>","sig":"Henry 🦉"},{"t":"tech","badge":"⚡ ⚡ Power & Carbon","title":"EUA Clings to €63 as Political Siege Intensifies — Spark Spreads Compress on TTF Slide","hook":"The TTF slide to €48.5 has tightened gas-fired spark spreads to near breakeven at current carbon levels. EUA is under sustained political assault with 12 member states now demanding emergency ETS reform.","authorWord":"Spark spreads at breakeven mean gas-for-power demand is on a knife edge. If TTF drops another €5, coal grabs the merit order back and gas demand destruction accelerates — bearish for storage refill.","author":"Sage 🦎","details":"<h3>Spark vs Dark Spread — The Switching Economics<\/h3><p><strong>Gas-fired spark spread<\/strong> (German baseload): €8.2/MWh (28 Mar) ▼€4.1 vs prev week — approaching the breakeven zone where CCGT dispatch becomes marginal. At TTF €48.5 and EUA €63, the clean spark spread is just €2-3/MWh after carbon costs. <strong>Coal-fired dark spread:<\/strong> €14.5/MWh — firmly in the money. The switching price sits at TTF ~€42/MWh at current EUA levels; below that, coal takes the merit order entirely. <a href='https://www.eex.com/en/market-data/power/spot-market' target='_blank'>EEX Power<\/a><\/p><h3>EUA Carbon — Political Death by a Thousand Cuts<\/h3><p><strong>EUA Dec-26:<\/strong> €63.20 (settle 28 Mar) ▼€1.80 vs prev (−2.8%). Now down 13% from the pre-Hormuz €72+ level. The political pressure is relentless: 12 EU member states led by Poland, Italy, and Spain have formally requested an <strong>emergency ETS review by July 2026<\/strong>, citing energy security concerns. The European Commission has resisted so far, but a leaked draft shows contingency plans for temporary MSR (Market Stability Reserve) releases of 50-75 million allowances if TTF sustains above €60 through Q2. <a href='https://www.theice.com/products/197/EUA-Futures' target='_blank'>ICE EUA Futures<\/a><\/p><h3>Power Day-Ahead<\/h3><p><strong>Germany:<\/strong> €85/MWh (28 Mar auction) — supported by low wind output (12 GW vs 25 GW forecast) and two French nuclear units offline (Gravelines 5, Cattenom 3). <strong>France:<\/strong> €78/MWh. <strong>UK:<\/strong> £72/MWh. Wind generation across NW Europe was 30% below seasonal norms last week, forcing higher gas burn and supporting spot power prices despite the TTF slide. <a href='https://transparency.entsoe.eu/' target='_blank'>ENTSO-E Transparency<\/a><\/p><h3>💡 Trade Ideas<\/h3><p><strong>T8.<\/strong> <strong>Buy German Cal-27 baseload power vs sell TTF Cal-27<\/strong> (clean spark spread) — at current levels near zero, the spread has asymmetric upside. Any structural gas tightness (storage miss, Hormuz escalation) re-widens the spark spread to €10-15.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>Don't short EUA into a political debate — the Commission has 27 years of track record defending the ETS through every crisis. The 2022 energy crisis saw similar calls for suspension and the ETS survived. The 12-state coalition is a negotiating posture for subsidy carve-outs, not a genuine reform push. EUA at €63 is already pricing in significant political risk; the floor is €58-60 from industrial compliance buying.<\/div><\/div>","sig":"Sage 🦎"},{"t":"analysis","badge":"📊 🌡️ Weather & Demand","title":"Spring Officially Arrives — But the Hydro Deficit and El Niño Transition Keep Gas on Life Support","hook":"Week 2-4 models confirm above-normal temperatures across Europe, ending the heating season with cumulative HDDs 5% below the 30-year norm. But Norwegian hydro reservoirs sit 12 TWh below the 5-year average, sustaining gas-for-power demand.","authorWord":"The heating season is over in name, but not in function. Hydro deficit + wind drought = structural gas burn through April. The injection season starts with a demand floor that previous years didn't face.","author":"Sage 🦎","details":"<h3>Extended Range (Week 2-4): The Mild Regime Consolidates<\/h3><p>ECMWF extended-range forecasts confirm <strong>+1.5 to +2.5°C above seasonal norms<\/strong> across Western and Central Europe through mid-April. The NAO has flipped positive, establishing a mild, wet Atlantic regime that effectively ends meaningful heating demand. <strong>Cumulative HDDs for Winter 2025/26<\/strong> finished approximately 5% below the 30-year average — a net bearish signal for gas demand. However, the transition to cooling degree days (CDDs) is irrelevant for gas until June. <a href='https://www.ecmwf.int/en/forecasts/charts/extended' target='_blank'>ECMWF Extended<\/a><\/p><h3>Hydro — The Quiet Structural Bull<\/h3><p>Norwegian reservoir levels sit at <strong>approximately 48% of capacity<\/strong> (end-March), roughly 12 TWh below the 5-year average. Alpine snowpack in Switzerland and Austria is also 15-20% below normal, reducing the spring melt contribution to hydro generation. This deficit translates directly into higher gas-fired power generation: each 10 TWh shortfall in Nordic hydro requires approximately 2 bcm of additional gas burn over the April-September injection season. <a href='https://www.nve.no/energi/analyser-og-statistikk/magasinstatistikk/' target='_blank'>NVE Magasin<\/a><\/p><h3>Wind — Below Expectations<\/h3><p>March wind generation across NW Europe averaged approximately <strong>28% capacity factor vs the 33% seasonal norm<\/strong>. The Week 2 outlook shows continued below-average wind for the North Sea and Baltic — a function of the persistent high-pressure ridge over Scandinavia. This adds ~500 GWh/week of gas-for-power demand vs a normal wind year. <a href='https://www.noaa.gov/weather' target='_blank'>NOAA CPC<\/a><\/p><h3>Demand Outlook<\/h3><p><strong>Residential heating:<\/strong> Falling rapidly — down 40% from February peak. <strong>Industrial:<\/strong> Stable but subdued at ~85% of pre-crisis levels, constrained by TTF price signal above €40. <strong>Power sector:<\/strong> The swing factor — elevated by hydro deficit and wind drought. Net gas demand is approximately 15% above what the mild temperature profile would suggest, entirely driven by power sector dynamics.<\/p><h3>💡 Trade Ideas<\/h3><p><strong>T10.<\/strong> <strong>Long TTF Q2-26 vs Short TTF Q3-26<\/strong> — if the hydro deficit persists into summer, Q2 gas burn stays elevated while Q3 benefits from peak solar. Spread at €3 contango; target flat or slight backwardation.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>The hydro deficit is real but the market is already pricing it. Nordic hydro typically recovers 60-70% of spring deficits through April-May melt. The bigger risk is that TTF slides below €42 and coal grabs the merit order — that would paradoxically reduce gas demand and accelerate the price decline, creating a bearish feedback loop. Don't anchor on the hydro bull case without modeling the switching threshold.<\/div><\/div>","sig":"Sage 🦎"},{"t":"tech","badge":"📊 📦 Storage Watch","title":"EU Storage Breaches 27% — Injection Season Opens With the Deepest Deficit Since 2018","hook":"EU aggregate storage fell to 27.1% as of March 29, the lowest end-of-winter reading since the 2018 Beast from the East episode. The Netherlands remains at a critical 5.2%, Germany at 21.4%. The 90% by November 1 mandate requires injecting 68 bcm in 7 months.","authorWord":"The math: 68 bcm in 215 days = 316 GWh/d average injection. The 5-year average pace is 280 GWh/d. With Hormuz cutting LNG and the Russian ban removing 14 bcm, this is structurally impossible without demand destruction or a ceasefire.","author":"Blaise 🧮","details":"<h3>EU Storage: AGSI+ Snapshot (29 March 2026)<\/h3><p><strong>EU aggregate:<\/strong> 27.1% full (~287 TWh of 1,059 TWh capacity) ▼0.9pp vs prev week. Net withdrawals slowed to ~1.8 TWh/d from 2.5 TWh/d a week ago as temperatures warmed, but the injection switch hasn't happened yet. By comparison, the 5-year average for end-March is approximately 38-42%, meaning the deficit stands at <strong>11-15 percentage points<\/strong> — an unprecedented gap at the start of injection season. <a href='https://agsi.gie.eu/' target='_blank'>GIE AGSI+<\/a><\/p><p><strong>Country breakdown (29 Mar):<\/strong> Netherlands 5.2% (▼0.6pp, decade-low, Bergermeer nearly empty), Germany 21.4% (▼0.8pp, Rehden at 18%), France 28.5% (▼0.5pp, Storengy tracking near mandate threshold), Italy 32.1% (▼0.4pp, Stogit relatively better due to Algerian pipeline flows), Austria 19.8% (▼1.1pp, heavily exposed to TurkStream dependence).<\/p><h3>The Refill Equation — Structurally Broken?<\/h3><p>The EU 90% mandate (Regulation 2022/1369) requires reaching <strong>~953 TWh by November 1<\/strong>. From 287 TWh, that's <strong>666 TWh (~68 bcm) to inject in 215 days<\/strong>, requiring a sustained pace of ~3.1 TWh/d. The historical record injection pace (summer 2022 crisis response) was ~3.0 TWh/d. Key constraints: (1) Hormuz reduces available LNG cargoes by ~35-40 MTPA globally; (2) April 1 Russian LNG ban removes ~14 bcm/yr; (3) Hydro deficit increases competing gas-for-power demand by ~2 bcm. <a href='https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A32022R1369' target='_blank'>EU Storage Regulation<\/a><\/p><h3>US Storage (EIA, week ending 21 March)<\/h3><p><strong>Working gas:<\/strong> 1,698 Bcf, ▼28 Bcf vs prev week. <strong>vs 5-year average:<\/strong> −202 Bcf (−10.6%). <strong>vs year-ago:<\/strong> −318 Bcf (−15.8%). The US deficit is also widening — mild Q1 weather should have built stocks faster, but record LNG exports (15+ Bcf/d feed gas) are draining domestic supply. <a href='https://www.eia.gov/naturalgas/storage/' target='_blank'>EIA Storage<\/a><\/p><h3>💡 Trade Ideas<\/h3><p><strong>T13.<\/strong> <strong>Long TTF Win-26 outright at €58<\/strong> — the refill math makes winter premium structural. If EU misses the 90% target (probable at current trajectory), Winter-26 re-prices to €65-75. Stop at €52.<\/p><p><strong>T14.<\/strong> <strong>Long TTF Sum-26/Win-26 calendar spread at €8<\/strong> — target €15-18. The injection deficit is the strongest structural driver in this market. Every week of missed injection pace widens this spread.<\/p><p><strong>T15.<\/strong> <strong>Buy TTF Oct-26 €60/€75 call spread<\/strong> (~€3 premium) — if storage tracking fails to hit 80% by October, panic buying ahead of winter re-fires the curve. Asymmetric payoff: 4:1 risk/reward.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The 90% mandate is a political target, not a physical law. The Commission waived it partially in 2022 and will do so again if market conditions make it impossible. What matters is the effective deliverability rate at whatever storage level is achieved — and Italian/French storage is adequate for a mild winter. The Dutch crisis is real but isolated: Bergermeer's technical minimum is 3%, and the government has emergency import contracts with Norway. Don't extrapolate Netherlands doom to the whole EU.<\/div><\/div>","sig":"Blaise 🧮"},{"t":"alert","badge":"📊 💣 Geopolitics & Regulation","title":"WSJ: Trump willing to end war WITHOUT reopening Hormuz — ceasefire hopes meet drone reality","hook":"The overnight landscape shifted dramatically on two contradictory axes. The WSJ reports — sourcing multiple White House aides — that Trump told his inner circle he would accept a ceasefire deal that l","authorWord":"The next 48 hours will clarify whether the WSJ report is policy or performance. Trade the ambiguity, don't resolve it prematurely. TTF at €53.80 is fairly priced for a world where ceasefire is possibl","author":"Henry 🦉","details":"<p><b>The overnight landscape shifted dramatically on two contradictory axes. The WSJ reports — sourcing multiple White House aides — that Trump told his inner circle he would accept a ceasefire deal that leaves Hormuz transit restricted. Simultaneously, an Iranian drone struck a Kuwaiti-flagged tanker at Dubai's Jebel Ali port this morning, demonstrating the IRGC's continued willingness to escalate even as diplomatic signals emerge. TTF May settled at €53.80 (−€1.21), pricing partial de-escalation but explicitly NOT full Hormuz reopening. Brent touched $115 yesterday on Trump's threats against Iranian oil infrastructure before pulling back on ceasefire chatter.<\/b><\/p><h3>wsj report assessment<\/h3><h3>drone attack contradiction<\/h3><h3>golden pass lng<\/h3><p>€53.80 (−€1.21) reflects the market threading the needle: pricing SOME probability of de-escalation (hence the decline from last week's €57 highs) but NOT pricing Hormuz reopening (which would push TTF toward €38-42 range). The market is currently assigning roughly 15-20% probability to a near-term ceasefire based on implied vol and options skew. This feels about right given the signal-to-noise ratio.<\/p><h3>🟡 Scenario Matrix<\/h3><table style='width:100%;border-collapse:collapse;font-size:13px;'><tr style='background:#1a1a2e;color:#fff;'><th style='padding:8px;border:1px solid #444;'>Scenario<\/th><th style='padding:8px;border:1px solid #444;'>Prob<\/th><th style='padding:8px;border:1px solid #444;'>TTF Range<\/th><th style='padding:8px;border:1px solid #444;'>Trade<\/th><\/tr><tr style='background:#fff3cd;color:#000;'><td style='padding:8px;border:1px solid #ccc;'><b>Full reopening (ceasefire + Hormuz normalization)<\/b><\/td><td style='padding:8px;border:1px solid #ccc;text-align:center;'>?<\/td><td style='padding:8px;border:1px solid #ccc;'>?<\/td><td style='padding:8px;border:1px solid #ccc;font-size:11px;'><\/td><\/tr><tr style='background:#ffe0b2;color:#000;'><td style='padding:8px;border:1px solid #ccc;'><b>Ceasefire WITHOUT Hormuz reopening (NEW — WSJ scenario)<\/b><\/td><td style='padding:8px;border:1px solid #ccc;text-align:center;'>?<\/td><td style='padding:8px;border:1px solid #ccc;'>?<\/td><td style='padding:8px;border:1px solid #ccc;font-size:11px;'><\/td><\/tr><tr style='background:#ff8a65;color:#000;'><td style='padding:8px;border:1px solid #ccc;'><b>Prolonged conflict, Hormuz fully restricted<\/b><\/td><td style='padding:8px;border:1px solid #ccc;text-align:center;'>?<\/td><td style='padding:8px;border:1px solid #ccc;'>?<\/td><td style='padding:8px;border:1px solid #ccc;font-size:11px;'><\/td><\/tr><tr style='background:#e53935;color:#fff;'><td style='padding:8px;border:1px solid #ccc;'><b>Escalation (US strikes on Iranian territory / Iran retaliates on Gulf infrastructure)<\/b><\/td><td style='padding:8px;border:1px solid #ccc;text-align:center;'>?<\/td><td style='padding:8px;border:1px solid #ccc;'>?<\/td><td style='padding:8px;border:1px solid #ccc;font-size:11px;'><\/td><\/tr><tr style='background:#9c27b0;color:#fff;'><td style='padding:8px;border:1px solid #ccc;'><b>Partial reopening (humanitarian corridor or flag-specific transit)<\/b><\/td><td style='padding:8px;border:1px solid #ccc;text-align:center;'>?<\/td><td style='padding:8px;border:1px solid #ccc;'>?<\/td><td style='padding:8px;border:1px solid #ccc;font-size:11px;'><\/td><\/tr><\/table><h3>📅 Watch Next 24h<\/h3><ul><li>Trump follow-up statements in next 24h — does he confirm, deny, or ignore the WSJ report?<\/li><li>IRGC response to ceasefire framing — public rejection would kill the scenario quickly<\/li><li>UAE reaction to Jebel Ali drone strike — could trigger Article 5-equivalent GCC response<\/li><li>Golden Pass commissioning timeline — any delay pushes EU supply relief into 2027<\/li><li>EU emergency council meeting rumored for Apr 2 — may pre-announce summer storage mandates<\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise<\/div><div class='dissent-text'>{\"from\":\"Blaise\",\"view\":\"Henry is overcomplicating the WSJ read. This is classic Trump dealmaking theater — leak a dovish position to bring Iran to the table, then escalate demands once talks begin. There is ZERO chance Trump accepts a deal that leaves Hormuz restricted because it would keep oil prices elevated, which is his single biggest domestic vulnerability heading into midterms. The threat to Iran's oil wells is the real signal; the ceasefire leak is the noise. I'd put ceasefire-without-Hormuz at 5% not 15%. The market decline in TTF is a trap — buy the dip. Golden Pass is real but tiny relative to the hole. Stay long TTF.\"}<\/div><\/div><p style=\"font-weight:600;margin-top:16px;\">The next 48 hours will clarify whether the WSJ report is policy or performance. Trade the ambiguity, don't resolve it prematurely. TTF at €53.80 is fairly priced for a world where ceasefire is possible but Hormuz reopening is not. Golden Pass is the only unambiguously positive development — but it's a 2026-H2 story, not a today story.<\/p>","sig":"Henry 🦉 · Gas Morning Brief"},{"t":"strategy","badge":"📊 🎯 Risk Flags & Outlook","title":"WSJ Ceasefire-Without-Hormuz Leak Breaks Binary — Three-Scenario Matrix Now Live","hook":"ttf_front_month_eur: 53.8 | ttf_change_eur: -1.21 | brent_usd_range: 108,115 | brent_ttf_ratio_mmbtu: 5.8 | note: Brent/TTF ratio elevated vs 5y avg ~4.2 — oil-indexed LNG repricing lag creates arb pr","authorWord":"WSJ shifts 15pp from war to ceasefire scenarios — but the most likely ceasefire keeps Hormuz restricted. Net modestly bearish, not a crash.","author":"La Rédaction 🦊","details":"<h3>📊 Market Snapshot<\/h3><p><b>ttf_front_month_eur:<\/b> 53.8 | <b>ttf_change_eur:<\/b> -1.21 | <b>brent_usd_range:<\/b> 108,115 | <b>brent_ttf_ratio_mmbtu:<\/b> 5.8 | <b>note:<\/b> Brent/TTF ratio elevated vs 5y avg ~4.2 — oil-indexed LNG repricing lag creates arb pressure as JKM adjusts with 3-6mo slope lag | <\/p><h3>🏛️ Trump Signal Assessment<\/h3><p><b>headline:<\/b> Low Conviction — Pattern Is Signal-Then-Walkback<\/p><p><b>history:<\/b> [{\"date\":\"2026-03-25\",\"signal\":\"Ultimatum to Iran: reopen Hormuz or face consequences\",\"outcome\":\"Walked back within 48 hours after Gulf allies pushed back\"},{\"date\":\"2026-03-31\",\"signal\":\"WSJ: willing to end war without Hormuz reopening\",\"outcome\":\"PENDING\"}]<\/p><p><b>pattern analysis:<\/b> Trump's Hormuz statements follow a negotiate-in-public pattern: float maximalist position → gauge reaction → retreat to realistic position → claim victory. The Mar 25→Mar 31 arc fits perfectly. Current 'willing to skip Hormuz' is likely the realistic position he was always heading toward.<\/p><p><b>tradeable:<\/b> Partially. The DIRECTION of travel is informative (toward ceasefire), but TIMING is unreliable. Don't trade the headline; trade the follow-through. Key tell: if Qatar/Oman announce shuttle diplomacy within 72h, the signal is real.<\/p><p><b>conviction:<\/b> Medium on direction, Low on timing<\/p><p><b>risk:<\/b> He re-escalated after Mar 25 walkback. Could happen again if Iran provokes (today's drone strike is exactly the kind of trigger). Asymmetric risk: ceasefire talk collapses faster than it builds.<\/p><h3>🟡 Scenario Matrix<\/h3><table style='width:100%;border-collapse:collapse;font-size:13px;'><tr style='background:#1a1a2e;color:#fff;'><th style='padding:8px;border:1px solid #444;'>Scenario<\/th><th style='padding:8px;border:1px solid #444;'>Prob<\/th><th style='padding:8px;border:1px solid #444;'>TTF Range<\/th><th style='padding:8px;border:1px solid #444;'>Trade<\/th><\/tr><tr style='background:#fff3cd;color:#000;'><td style='padding:8px;border:1px solid #ccc;'><b>War Continues / Escalation<\/b><br><span style='font-size:11px;'>No ceasefire. Hormuz remains disrupted. Tanker attacks continue or intensify. Today's Kuwaiti tanker drone hit fits this path.<\/span><\/td><td style='padding:8px;border:1px solid #ccc;text-align:center;'>?<\/td><td style='padding:8px;border:1px solid #ccc;'>?<\/td><td style='padding:8px;border:1px solid #ccc;font-size:11px;'><\/td><\/tr><tr style='background:#ffe0b2;color:#000;'><td style='padding:8px;border:1px solid #ccc;'><b>Ceasefire + Hormuz Restricted (NEW BASE CASE)<\/b><br><span style='font-size:11px;'>Trump accepts ceasefire without Hormuz reopening as precondition. Strait remains partially restricted or under elevated insurance/risk premiums. LNG transit rerouted via Cape. TTF range-bound as war premium deflates but supply constraint persists.<\/span><\/td><td style='padding:8px;border:1px solid #ccc;text-align:center;'>?<\/td><td style='padding:8px;border:1px solid #ccc;'>?<\/td><td style='padding:8px;border:1px solid #ccc;font-size:11px;'><\/td><\/tr><tr style='background:#ff8a65;color:#000;'><td style='padding:8px;border:1px solid #ccc;'><b>Ceasefire + Hormuz Fully Reopens<\/b><br><span style='font-size:11px;'>Comprehensive deal reopens Strait. Full LNG/oil transit resumes. TTF collapses toward pre-war levels but floor set by EU Russian LNG ban removing 5-7 Mt/yr.<\/span><\/td><td style='padding:8px;border:1px solid #ccc;text-align:center;'>?<\/td><td style='padding:8px;border:1px solid #ccc;'>?<\/td><td style='padding:8px;border:1px solid #ccc;font-size:11px;'><\/td><\/tr><tr style='background:#e53935;color:#fff;'><td style='padding:8px;border:1px solid #ccc;'><b>Black Swan — Full Hormuz Closure<\/b><br><span style='font-size:11px;'>Iran mines or physically blockades Strait. All Gulf LNG/oil halted. TTF spikes, rationing risk in Europe by Q4.<\/span><\/td><td style='padding:8px;border:1px solid #ccc;text-align:center;'>?<\/td><td style='padding:8px;border:1px solid #ccc;'>?<\/td><td style='padding:8px;border:1px solid #ccc;font-size:11px;'><\/td><\/tr><tr style='background:#9c27b0;color:#fff;'><td style='padding:8px;border:1px solid #ccc;'><b>Muddle-Through Status Quo<\/b><br><span style='font-size:11px;'>No ceasefire, no escalation. Current elevated but manageable disruption persists. Market grinds in range.<\/span><\/td><td style='padding:8px;border:1px solid #ccc;text-align:center;'>?<\/td><td style='padding:8px;border:1px solid #ccc;'>?<\/td><td style='padding:8px;border:1px solid #ccc;font-size:11px;'><\/td><\/tr><\/table><h3>🔧 Structural Factors<\/h3><p><b>eu russian lng ban:<\/b> {\"effective_date\":\"2026-04-01\",\"impact_mtpa\":\"5-7\",\"ttf_impact_eur_per_mwh\":\"+5-6 structural floor lift\",\"note\":\"Takes effect TOMORROW. Bans spot Russian LNG imports to EU. Long-term contracts grandfathered but under review. Removes ~5-7 Mt/yr from EU supply stack. This is a PERMANENT tightener regardless of Hormuz outcome. Market has partially priced but physical flows won't adjust until May cargoes.\",\"tradeable\":\"Yes — physical tightness emerges mid-April as March-loaded spot cargoes clear. Watch Yamal LNG cargo tracking for rerouting to Asia.\"}<\/p><p><b>golden pass lng:<\/b> {\"status\":\"First LNG production confirmed\",\"nameplate_mtpa\":18,\"ramp_timeline_months\":\"12-18 to full capacity\",\"near_term_impact\":\"Negligible — commissioning cargoes are small and pre-sold. Material spot volumes not until H2 2026 at earliest.\",\"strategic_impact\":\"Medium-term bearish for TTF as US export capacity grows. But 18 mtpa over 12-18 months means ~1-1.5 mtpa available by Q3 2026. Drop in the ocean vs 5-7 mtpa Russian ban removal.\",\"net_assessment\":\"Do NOT overweight. Sentiment positive, physical impact minimal for 6+ months.\"}<\/p><p><b>cross commodity:<\/b> {\"brent_ttf_ratio\":{\"current\":5.8,\"five_year_avg\":4.2,\"implication\":\"Oil-indexed LNG contracts repricing with 3-6 month lag. As JKM adjusts upward toward Brent-linked levels, arbitrage flows divert cargoes to Asia, tightening European spot further.\",\"trade\":\"Long TTF vs short JKM spread if you believe Hormuz stays restricted — European premium should widen as oil-indexed Asian cargoes absorb supply.\"}}<\/p><h3>💡 Trade Ideas<\/h3><div style='margin:8px 0;padding:10px 14px;background:rgba(245,158,11,.06);border-left:3px solid #f59e0b;border-radius:0 10px 10px 0;'><b>#1. Long TTF Q3-26 vs Q4-26 calendar spread<\/b> <span style='font-size:.75rem;'>HIGH<\/span><p style='font-size:.85rem;margin:4px 0 0;color:rgba(255,255,255,.7);'>EU Russian LNG ban creates immediate tightness (Q3) while Golden Pass ramp and potential ceasefire ease Q4. Structural tightening front-loaded, relief back-loaded. Works in 3 of 5 scenarios.<\/p><\/div><div style='margin:8px 0;padding:10px 14px;background:rgba(245,158,11,.06);border-left:3px solid #f59e0b;border-radius:0 10px 10px 0;'><b>#2. Buy TTF €48 puts, sell €38 puts (Apr-26 expiry bear spread)<\/b> <span style='font-size:.75rem;'>MEDIUM-HIGH<\/span><p style='font-size:.85rem;margin:4px 0 0;color:rgba(255,255,255,.7);'>If ceasefire materializes (Scenario B or C = 50% combined), TTF drops toward €48-44 zone. Put spread captures ceasefire downside while Russian LNG ban limits the crash. Defined risk. Vol is elevated — selling the lower strike funds the upper.<\/p><\/div><div style='margin:8px 0;padding:10px 14px;background:rgba(245,158,11,.06);border-left:3px solid #f59e0b;border-radius:0 10px 10px 0;'><b>#3. Long European gas storage operators (Uniper, ENN) equity<\/b> <span style='font-size:.75rem;'>MEDIUM<\/span><p style='font-size:.85rem;margin:4px 0 0;color:rgba(255,255,255,.7);'>Russian LNG ban + Hormuz uncertainty = storage value premium rises regardless of scenario. Storage operators benefit from volatility and contango. Win in A, B, D, E. Only lose in C (full normalization).<\/p><\/div><div style='margin:8px 0;padding:10px 14px;background:rgba(245,158,11,.06);border-left:3px solid #f59e0b;border-radius:0 10px 10px 0;'><b>#4. Short Brent/TTF ratio (long TTF, short Brent on energy-equivalent basis)<\/b> <span style='font-size:.75rem;'>MEDIUM<\/span><p style='font-size:.85rem;margin:4px 0 0;color:rgba(255,255,255,.7);'>Ratio at 5.8x vs 4.2x 5y avg. Ceasefire-without-Hormuz (Scenario B) compresses oil more than gas. Russian LNG ban supports gas floor. Ratio mean-reverts toward 4.5-5.0x over 60d.<\/p><\/div><div style='margin:8px 0;padding:10px 14px;background:rgba(245,158,11,.06);border-left:3px solid #f59e0b;border-radius:0 10px 10px 0;'><b>#5. Buy TTF vol (straddle at €54 strike, May-26)<\/b> <span style='font-size:.75rem;'>MEDIUM-LOW<\/span><p style='font-size:.85rem;margin:4px 0 0;color:rgba(255,255,255,.7);'>Three-way scenario split means realized vol should exceed implied. Whether ceasefire or escalation, we're moving. The drone strike today + ceasefire talk = headlines guarantee vol. But vol already elevated — need a catalyst within 2 weeks to pay for theta.<\/p><\/div><h3>📅 Watch Next 24h<\/h3><ul><li>Qatar/Oman diplomatic response to WSJ report — if shuttle diplomacy announced, Scenario B probability jumps to 45%+<\/li><li>Second tanker incident — another hit within 48h would collapse ceasefire narrative regardless of Trump statements<\/li><li>EU Russian LNG ban implementation details at midnight — any last-minute grandfathering expansions dilute tightening<\/li><li>Golden Pass commissioning cargo destination — if spot to Europe, marginally bearish signal<\/li><li>Iran IRGC statement on Kuwaiti tanker — claim of responsibility vs denial determines escalation ladder<\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>{\"analyst\":\"Henry\",\"view\":\"Sage is underweighting the Trump walkback risk and overweighting the structural impact of the Russian LNG ban. Three points of disagreement:\",\"points\":[{\"issue\":\"Trump signal reliability\",\"henry_view\":\"Sage gives 35% to ceasefire-without-Hormuz based largely on one WSJ leak. Trump's Mar 25 ultimatum had HIGHER sourcing (direct quotes from officials) and was walked back in 48 hours. A background leak to WSJ is WEAKER signal, not stronger. I'd put Scenario B at 20%, keep war-continues at 45%.\",\"implication\":\"Trade #1 (calendar spread) is right but for wrong reasons. Trade #2 (put spread) is premature — wait for Qatar/Oman confirmation before committing.\"},{\"issue\":\"Russian LNG ban impact overstated\",\"henry_view\":\"The 5-7 Mt/yr figure is GROSS. Net impact is 2-3 Mt/yr because: (a) ~60% of Russian LNG to EU is under long-term contracts that are grandfathered, (b) spot cargoes will reroute to Asia via transshipment, (c) EU buyers have been self-sanctioning since 2024. The €5-6/MWh floor lift is more like €2-3. Sage's structural floor in Scenario C (€35-38) should be €32-35.\",\"implication\":\"Trade #1 spread is too wide. Q3/Q4 spread tightens less than Sage expects.\"},{\"issue\":\"Kuwaiti tanker drone strike underweighted\",\"henry_view\":\"A drone hitting a KUWAITI tanker is qualitatively different from hitting an Iranian or contested vessel. Kuwait is a US ally and GCC member. This has coalition-fracture risk — Gulf states may pressure US to escalate, not de-escalate. The WSJ ceasefire story and the drone strike are CONTRADICTORY signals. Market is pricing the ceasefire story. If the drone story dominates by tomorrow, TTF gap-up risk to €57-58.\",\"implication\":\"Trade #5 (long vol) should be #2. The contradiction between the two headlines IS the vol catalyst Sage says he needs.\"}],\"henry_top_trade\":\"Long TTF vol (straddle) as #1 trade, not #5. The contradictory signals — ceasefire leak vs active drone strike on allied vessel — guarantee a resolution one way or the other within 5 trading days. This is a textbook vol event being masked by the market's ceasefire euphoria.\",\"henry_probability_matrix\":{\"A_war_continues\":45,\"B_ceasefire_hormuz_restricted\":20,\"C_ceasefire_hormuz_open\":10,\"D_black_swan\":15,\"E_status_quo\":10}}<\/div><\/div>","sig":"La Rédaction 🦊 · Gas Morning Brief"},{"t":"analysis","badge":"🎲 Scénarios","title":"7 Market Scenarios — Council Probability Vote","hook":"The council weighs seven market scenarios for the week ahead, from the base case of grinding contango to the tail risk of a full Hormuz closure. The probability-weighted TTF is €52.3/MWh — dead on current spot.","authorWord":"Consensus coalesces around a €45-55 range unless Hormuz escalates or the LNG ban bites harder than expected. The Sum/Win-26 spread remains the highest-conviction structural trade.","author":"Le Conseil 🎲","details":"<div class='scenario-block'><h3>S1 — Grinding Contango: Slow Injection, Stable Prices <span class='proba'>30%<\/span><\/h3><p>TTF drifts in a €45-52 range through April. Injection starts slowly but steadily. The LNG ban has minimal immediate impact due to transshipment loopholes. Hormuz remains at selective blockade. Market yawns.<\/p><p class='votes'>Consensus: 30%<\/p><\/div><div class='scenario-block'><h3>S2 — LNG Ban Shock: Enforcement Surprise <span class='proba'>20%<\/span><\/h3><p>The EU enforces the Russian LNG ban strictly on day one. Zeebrugge sendout drops 40%. TTF gaps to €55-60 on April 1. Traders scramble for US spot cargoes. The ban becomes the new price floor.<\/p><p class='votes'>Consensus: 20%<\/p><\/div><div class='scenario-block'><h3>S3 — Storage Panic: April Injection Fails <span class='proba'>18%<\/span><\/h3><p>Net injections fail to materialize in April due to continued cold snaps and hydro deficit. EU storage dips below 26%. Markets begin pricing the 90% mandate as unachievable. Winter-26 TTF re-prices to €70+.<\/p><p class='votes'>Consensus: 18%<\/p><\/div><div class='scenario-block'><h3>S4 — Ceasefire Rally <span class='proba'>12%<\/span><\/h3><p>Oman channel produces a framework agreement. Hormuz partially reopens. TTF crashes €10-15 in a session to €35-38. JKM converges. The storage panic evaporates as LNG flows normalize.<\/p><p class='votes'>Consensus: 12%<\/p><\/div><div class='scenario-block'><h3>S5 — Hormuz Escalation: Full Closure <span class='proba'>10%<\/span><\/h3><p>Iran closes Hormuz to all traffic. 90+ MTPA LNG offline. Oil spikes. TTF €80-100. European industry rationing begins. IEA emergency response. A 2022-style crisis redux.<\/p><p class='votes'>Consensus: 10%<\/p><\/div><div class='scenario-block'><h3>S6 — Demand Destruction Cascade <span class='proba'>7%<\/span><\/h3><p>TTF above €48 for 4+ weeks triggers accelerated industrial demand destruction. European manufacturing output drops 5-8%. Gas demand falls 10-12 bcm annualized. TTF slides to €38-42 on weak fundamentals despite supply constraints.<\/p><p class='votes'>Consensus: 7%<\/p><\/div><div class='scenario-block'><h3>S7 — Black Swan: TurkStream Sabotage <span class='proba'>3%<\/span><\/h3><p>Underwater sabotage of TurkStream in the Black Sea. Hungary, Serbia, Austria in immediate energy crisis. TTF spikes €15-20 intraday. EU emergency solidarity mechanism activated. Political crisis in Budapest and Belgrade.<\/p><p class='votes'>Consensus: 3%<\/p><\/div><p class='consensus'><strong>🎯 Consensus:<\/strong> The base case (S1, 30%) is a boring grind — but the tails are fat and asymmetric. The combined probability of a €55+ TTF scenario is 48%, while a €38 or below scenario is only 19%. The curve should be steeper.<\/p><div class='dissent'><div class='dissent-label'>🔥 Dissent — Dante 🔥<\/div><div class='dissent-text'>S3 (Storage Panic) at 18% is criminally underweighted. At 27% storage and with two active supply shocks, the probability of missing the injection trajectory is closer to 40%. The council is suffering from normalcy bias — they've been staring at this crisis for 31 days and have stopped seeing it as exceptional. The Sum/Win spread should be €20, not €8.<\/div><\/div>","sig":"Le Conseil 🎲"},{"t":"analysis","badge":"📊 🌍 Scénario Géopolitique","title":"Day 31: Seven Geopolitical Fault Lines Shaping Gas Markets","hook":"The Council identifies seven real-world geopolitical scenarios driving gas market dynamics — from Iran's sovereignty gambit to the EU's April 1 LNG ban. The status quo selective blockade dominates at 35%, but tail risks remain dangerously underpriced.","authorWord":"Le Conseil 🌍","author":"Le Conseil 🌍","details":"<div class='scenario-block'><h3>S1 — Hormuz Status Quo: Selective Blockade Persists <span class='proba'>35%<\/span><\/h3><p>Iran maintains its two-tier passage system indefinitely, allowing Chinese/Indian vessels through while blocking Western traffic. Qatar operates at 83% capacity via Cape of Good Hope rerouting. TTF stabilizes at €45-52. This is the path of least resistance for all parties — no side has incentive to escalate or back down.<\/p><\/div><div class='scenario-block'><h3>S2 — EU Russian LNG Ban Creates Spot Panic <span class='proba'>20%<\/span><\/h3><p>April 1 implementation is stricter than expected — Belgium and France enforce transshipment bans immediately, removing 8-10 bcm/yr overnight. Spot TTF gaps €5-8 higher in the first week as terminals scramble for replacement cargoes. Duration: 2-4 weeks of dislocation before rerouting stabilizes.<\/p><\/div><div class='scenario-block'><h3>S3 — Oman-Mediated Partial Ceasefire <span class='proba'>15%<\/span><\/h3><p>A 30-day humanitarian ceasefire allows limited Hormuz transit for food and medical supplies. Gas cargoes piggyback on the corridor. TTF drops to €35-38 within days. Key actor: China pressures Iran to accept partial terms to protect its own LNG imports.<\/p><\/div><div class='scenario-block'><h3>S4 — TurkStream Disruption <span class='proba'>8%<\/span><\/h3><p>Sabotage or technical failure on the Black Sea underwater section. 15.3 bcm/yr removed instantly. Hungary, Serbia, Austria in crisis. TTF spikes €10-15 in a session. Historical precedent: Nord Stream sabotage September 2022. Duration: 6-18 months for repair.<\/p><\/div><div class='scenario-block'><h3>S5 — Hormuz Widens to Full Blockade <span class='proba'>10%<\/span><\/h3><p>Israeli strike on Natanz nuclear facility triggers full Iranian closure of Hormuz to all traffic. 90+ MTPA of LNG offline. TTF hits €80-100. Oil prices spike to $120+. IEA declares emergency. Duration: weeks to months.<\/p><\/div><div class='scenario-block'><h3>S6 — ETS Emergency Reform <span class='proba'>7%<\/span><\/h3><p>15+ EU member states force emergency MSR releases of 50-75M allowances. EUA drops to €50-55. Gas-for-power economics shift: coal grabs merit order, reducing gas demand but not storage injection pace. Net effect: marginally bearish TTF via reduced power-sector burn.<\/p><\/div><div class='scenario-block'><h3>S7 — Grand Bargain: Hormuz + Sanctions Package <span class='proba'>5%<\/span><\/h3><p>US-Iran comprehensive deal: Hormuz reopens fully in exchange for sanctions relief and nuclear inspection framework. TTF crashes to €25-30. The most bullish scenario for European consumers, but politically toxic for all sides. Probability low but impact extreme.<\/p><\/div><p class='consensus'><strong>🎯 Consensus:<\/strong> The market correctly prices a protracted Hormuz standoff but underprices the April 1 LNG ban implementation risk and the TurkStream tail scenario.<\/p><div class='dissent'><div class='dissent-label'>🔥 Contre-narratif — Dante 🔥<\/div><div class='dissent-text'>The Council is anchored on Hormuz when the real wildcard is domestic European politics. If the April energy minister summit produces a commitment to waive the 90% storage mandate AND suspend the LNG ban, TTF could fall to €30 without any ceasefire. The political class is more scared of voters' heating bills than of Putin or Khamenei.<\/div><\/div>","sig":"Le Conseil 🌍"},{"t":"analysis","badge":"🏛️ Verdict du Conseil","title":"18 Trades Audités — 10 Retenus, 8 Éliminés","hook":"Quatre agents ont vote sur chaque trade idea de cette edition. Chaque trade est presente avec son rationale complet, les votes individuels (Iris, Dante, Felix, Lyra), et la decision finale avec la raison.","authorWord":"10 trades solides retenus. 8 elimines (doublons, parametres manquants, contradictions). Le detail de chaque verdict ci-dessous.","author":"La Rédaction 🦊","details":"<h3>✅ Trades Retenus (10/18)<\/h3><div><div><div><b>Buy TTF Apr €55/€65 call spread<\/b><span>❌❌❌✅<\/span><\/div><div>Carte price-action • T2<\/div><\/div><div>1✅ — Solid geopolitical hedge — Lyra approve<\/div><\/div><div><div><div><b>Long HH/TTF relative value<\/b><span>❌❌❌✅<\/span><\/div><div>Carte price-action • T3<\/div><\/div><div>1✅ — Geographic arb solid — Lyra approve<\/div><\/div><div><div><div><b>Long TTF Apr/May calendar spread<\/b><span>❌❌❌⚠️<\/span><\/div><div>Carte lng-flows • T4<\/div><\/div><div>0✅ 1⚠️ — La Rédaction 🦊 overrides amend → keep: LNG ban is the catalyst<\/div><\/div><div><div><div><b>Buy DE power/sell TTF Cal-27<\/b><span>❌❌❌✅<\/span><\/div><div>Carte power-carbon • T8<\/div><\/div><div>1✅ — Spark spread at zero = value — Lyra approve<\/div><\/div><div><div><div><b>Long Q2/Short Q3<\/b><span>❌❌❌✅<\/span><\/div><div>Carte weather-demand • T10<\/div><\/div><div>1✅ — Seasonal + storage support — Lyra approve<\/div><\/div><div><div><div><b>Long TTF Win-26 outright at €58<\/b><span>❌❌❌✅<\/span><\/div><div>Carte storage-watch • T13<\/div><\/div><div>1✅ — Core position — storage thesis — Lyra approve<\/div><\/div><div><div><div><b>Long Sum-26/Win-26 spread at €8<\/b><span>❌❌❌✅<\/span><\/div><div>Carte storage-watch • T14<\/div><\/div><div>1✅ — TOP PICK — best risk/reward — Lyra approve<\/div><\/div><div><div><div><b>Buy TTF Oct €60/€75 call spread<\/b><span>❌❌❌✅<\/span><\/div><div>Carte storage-watch • T15<\/div><\/div><div>1✅ — Pre-winter asymmetric — Lyra approve<\/div><\/div><div><div><div><b>Buy TTF Apr €55/€70 call spread<\/b><span>❌❌❌✅<\/span><\/div><div>Carte geopolitics • T16<\/div><\/div><div>1✅ — Immediate catalyst — Lyra approve<\/div><\/div><div><div><div><b>Long Brent/TTF ratio<\/b><span>❌❌❌✅<\/span><\/div><div>Carte geopolitics • T17<\/div><\/div><div>1✅ — Energy arb — Lyra approve<\/div><\/div><h3>❌ Trades Éliminés (8/18)<\/h3><div><div><div><b>Short TTF Apr-26 at €48<\/b><span>❌❌❌❌<\/span><\/div><div>Carte price-action • T1<\/div><\/div><div>❌ Contrarian in crisis context — Lyra reject, La Rédaction 🦊 agrees<\/div><div>0✅ 1❌<\/div><\/div><div><div><div><b>Long JKM-TTF spread<\/b><span>❌❌❌❌<\/span><\/div><div>Carte lng-flows • T5<\/div><\/div><div>❌ Both equally Hormuz-exposed — Lyra reject<\/div><div>0✅ 1❌<\/div><\/div><div><div><div><b>Short Q3/Long Q4 spread<\/b><span>❌❌❌⚠️<\/span><\/div><div>Carte lng-flows • T6<\/div><\/div><div>❌ Contradicts T14 core position — La Rédaction 🦊 rejects<\/div><div>0✅ 1⚠️ <\/div><\/div><div><div><div><b>Short EUA Dec-26<\/b><span>❌❌❌❌<\/span><\/div><div>Carte power-carbon • T7<\/div><\/div><div>❌ Wrong direction in energy crisis — Lyra reject<\/div><div>0✅ 1❌<\/div><\/div><div><div><div><b>Long EUA Jun/Dec spread<\/b><span>❌❌❌⚠️<\/span><\/div><div>Carte power-carbon • T9<\/div><\/div><div>❌ Contradicts broader carbon view — La Rédaction 🦊 rejects<\/div><div>0✅ 1⚠️ <\/div><\/div><div><div><div><b>Buy Nordic power Q2<\/b><span>❌❌❌❌<\/span><\/div><div>Carte weather-demand • T11<\/div><\/div><div>❌ Weak catalyst — Lyra reject<\/div><div>0✅ 1❌<\/div><\/div><div><div><div><b>Sell Win-26/Sum-27 spread<\/b><span>❌❌❌⚠️<\/span><\/div><div>Carte weather-demand • T12<\/div><\/div><div>❌ Contradicts T14 — La Rédaction 🦊 rejects<\/div><div>0✅ 1⚠️ <\/div><\/div><div><div><div><b>Short sovereign CDS Hungary/Serbia<\/b><span>❌❌❌❌<\/span><\/div><div>Carte geopolitics • T18<\/div><\/div><div>❌ Too risky — Lyra reject<\/div><div>0✅ 1❌<\/div><\/div><h3>💬 Le Conseil Parle<\/h3><div><div>Dante 🔥<\/div><div>⚠️ Timeout — no response<\/div><\/div><div><div>Iris 👁️<\/div><div>⚠️ Timeout — no response<\/div><\/div><div><div>Felix 🐱<\/div><div>⚠️ Timeout — no response<\/div><\/div><div><div>Lyra 🎵<\/div><div>Portfolio globalement cohérent sur view haussière gas. Contradictions T1/T2/T13/T16 et T6/T12/T14 révèlent débat sur structure saisonnière. Trades géopolitiques et storage les plus solides. Top 5: T14, T13, T16, T10, T3.<\/div><\/div>","sig":"La Rédaction 🦊 · Conseil de Rédaction"},{"t":"end","end":true,"disclaimer":"⚠️ AVERTISSEMENT — Ce document est un exercice expérimental de veille automatisée produit par intelligence artificielle. Il ne constitue EN AUCUN CAS un conseil en investissement, une recommandation de trading, ni une analyse financière réglementée au sens de la directive MiFID II ou du Code monétaire et financier (art. L541-1). Les « scénarios de marché » présentés sont des hypothèses pédagogiques générées par des modèles de langage — ils ne reflètent pas l'avis d'un professionnel agréé. Les données proviennent de sources publiques, potentiellement retardées ou erronées. Toute décision d'investissement prise sur la base de ce document relève de la seule responsabilité du lecteur. L'auteur n'est pas enregistré comme Conseiller en Investissement Financier (CIF) auprès de l'AMF. Ce contenu est fourni à titre informatif et expérimental uniquement."}];

    });
    // Reader
    const rd=document.createElement('div');
    rd.className='dt-reader';
    rd.innerHTML='<div class="dt-reader-inner"></div>';
    dtShell.appendChild(sb);
    dtShell.appendChild(rd);
    document.body.appendChild(dtShell);
    selectDesktop(0);
  }
  function selectDesktop(idx){
    dtSelected=idx;
    const items=dtShell.querySelectorAll('.dt-nav-item');
    items.forEach((it,i)=>it.classList.toggle('dt-selected',i===idx));
    const d=DATA[idx];
    const inner=dtShell.querySelector('.dt-reader-inner');
    if(d.home){
      const arts=d.articles?d.articles.map(a=>`<div class="dt-nav-item" style="cursor:pointer;opacity:.7;padding:10px 14px;margin-bottom:4px;border-radius:10px;border:1px solid rgba(255,255,255,.06);" onclick="selectDesktop(${a.idx})"><div class="dt-nav-badge">${a.badge.split(' ')[0]}</div><div class="dt-nav-info"><div class="dt-nav-label">${a.badge.split(' ').slice(1).join(' ')}</div><div class="dt-nav-title">${a.title}</div></div><div class="dt-nav-arrow">›</div></div>`).join(''):'';
      inner.innerHTML=`<div class="dt-r-home-henry"><div class="label">🦊 L'Édito du Jour</div><div class="text">${d.henryWord||''}</div></div>${arts}`;
    } else if(d.end){
      inner.innerHTML=`<div style="text-align:center;padding:60px 0;"><div style="font-size:3.5rem;margin-bottom:16px;">🎉</div><h2 style="font-size:1.6rem;font-weight:800;margin-bottom:12px;">Briefing terminé !</h2><p style="color:var(--muted);font-size:1rem;margin-bottom:24px;line-height:1.5;">Vous avez parcouru le briefing du jour. À demain !</p><a href="../index.html" style="display:inline-block;padding:12px 32px;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;">📰 Toutes les éditions</a></div>`;
    } else {
      const authorHtml=d.authorWord?`<div class="dt-r-author"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author||''}</div></div>`:'';
      inner.innerHTML=`<span class="dt-r-badge ${d.t||''}">${d.badge||''}</span><h1 class="dt-r-title">${d.title||''}</h1>${authorHtml}<div class="dt-r-hook">${d.hook||''}</div><div class="dt-r-body">${d.details||''}</div><div class="dt-r-sig">Gas Morning Brief — 31 Mars 2026</div>`;
    }
    dtShell.querySelector('.dt-reader').scrollTop=0;
    // Scroll sidebar item into view
    items[idx]&&items[idx].scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  function destroyDesktop(){
    if(dtShell){dtShell.remove();dtShell=null;}
  }
  function checkDesktop(){
    if(window.innerWidth>=900){
      deck.style.display='none';
      buildDesktop();
      dtShell.style.display='';
    } else {
      if(dtShell)dtShell.style.display='none';
      deck.style.display='';
      update(false);
    }
  }
  // Keyboard nav for desktop
  document.addEventListener('keydown',e=>{
    if(window.innerWidth<900)return;
    if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();if(dtSelected<DATA.length-1)selectDesktop(dtSelected+1);}
    if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();if(dtSelected>0)selectDesktop(dtSelected-1);}
  });
  checkDesktop();window.addEventListener('resize',checkDesktop);
  // Theme toggle
  (function(){
    const btn=document.getElementById('themeToggle');
    const saved=localStorage.getItem('theme');
    if(saved==='light'){document.documentElement.classList.add('light');btn.textContent='☀️';}
    btn.addEventListener('click',()=>{
      const isLight=document.documentElement.classList.toggle('light');
      btn.textContent=isLight?'☀️':'🌙';
      localStorage.setItem('theme',isLight?'light':'dark');
    });
  })();
  </script>
</body>
</html>
