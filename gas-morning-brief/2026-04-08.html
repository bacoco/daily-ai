<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gas Morning Brief — 8 Avril 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    /* Scenario Probability Card */
    .scenario-block { margin: 1em 0; padding: 0.8em 1em; border-left: 4px solid #ffd700; border-radius: 0 8px 8px 0; background: rgba(255,215,0,0.05); }
    .scenario-block h3 { margin: 0 0 0.3em 0; font-size: 1.05em; display: flex; justify-content: space-between; align-items: center; }
    .scenario-block .proba { font-size: 1.3em; font-weight: bold; color: #ffd700; }
    .scenario-block p { margin: 0.2em 0; font-size: 0.92em; }
    .scenario-block .votes { font-size: 0.8em; opacity: 0.7; font-style: italic; }
    .consensus { margin-top: 1.2em; padding: 0.6em; border-radius: 8px; background: rgba(0,200,100,0.08); }
    .dissent { margin-top: 0.4em; padding: 0.6em; border-radius: 8px; background: rgba(255,80,80,0.08); }

    html.light .details div[style*="background"], html.light .details p[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Light mode: override inline white colors in trade cards */
    html.light .details p[style], html.light .details b[style], html.light .details span[style], html.light .details div[style] { color: rgba(0,0,0,.85) !important; }
    html.light .details div[style*="border-left:3px solid #f59e0b"] { background: rgba(245,158,11,.08) !important; }
    html.light .details div[style*="border-left:3px solid #10b981"] { background: rgba(16,185,129,.08) !important; }
    html.light .details div[style*="border-left:3px solid #ff4757"] { background: rgba(255,71,87,.06) !important; }
    html.light .details div[style*="color:#f59e0b"] { color: #b45309 !important; }
    html.light .details div[style*="color:#10b981"] { color: #047857 !important; }
    html.light .details div[style*="color:#ff4757"] { color: #dc2626 !important; }
    html.light .details h3 { color: #1a1a2e !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details p[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }
      .dt-reader .dt-r-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; }
      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }

  const DATA = [{"t":"home","home":true,"date":"8 Avril 2026","henryWord":"CEASEFIRE : Trump et l'Iran conviennent d'un cessez-le-feu de 2 semaines. Hormuz va rouvrir. Brent sous $100. Mais Netanyahu exclut le Liban, Moscou et Pékin bloquent l'ONU, et le plan iranien réclame la souveraineté sur Hormuz. L'UE a 28% de stockage et le ban LNG russe est actif. Deux semaines de paix ne remplissent pas des réservoirs vides.","articles":[{"badge":"⚡ 💰 Price Action","title":"Bloodbath at the Open — But Gas Holds the Line","idx":1},{"badge":"⚡ 🚢 LNG & Flows","title":"Qatar Tankers Remain Diverted as Hormuz Enters Day 38","idx":2},{"badge":"⚡ ⚡ Power & Carbon","title":"Spark Spreads Under Pressure as Renewables Flood","idx":3},{"badge":"📊 🌡️ Weather & Demand","title":"Shoulder Season Arrives with Mild Outlook, But HDD Deficit Persists","idx":4},{"badge":"📊 📦 Storage Watch","title":"EU Storage at 28.1% — Lowest April Level Since 2018","idx":5},{"badge":"📊 💣 Geopolitics & Regulation","title":"US-Iran Ceasefire: Hormuz Reopens for Two Weeks","idx":6},{"badge":"📊 🎯 Risk Flags & Outlook","title":"Ceasefire: A Tactical Pause, Not a Solution","idx":7},{"badge":"🎲 Scénarios","title":"7 Scénarios — Le Conseil Prudent Face à l'Incertitude Hormuz","idx":8},{"badge":"📊 🌍 Scénario Géopolitique","title":"Géopolitique & Gaz — Délibération du Conseil","idx":9}],"disclaimer":"⚠️ AVERTISSEMENT — Ce document est un exercice expérimental de veille automatisée produit par intelligence artificielle. Il ne constitue EN AUCUN CAS un conseil en investissement, une recommandation de trading, ni une analyse financière réglementée au sens de la directive MiFID II ou du Code monétaire et financier (art. L541-1). Les « scénarios de marché » présentés sont des hypothèses pédagogiques générées par des modèles de langage — ils ne reflètent pas l'avis d'un professionnel agréé. Les données proviennent de sources publiques, potentiellement retardées ou erronées. Toute décision d'investissement prise sur la base are on a 3-6 month lag. At <strong>Brent ~$85-90<\/strong>, oil-linked LNG becomes genuinely cheap vs spot TTF — and that's when the floor starts cracking as Qatari cargoes (when FM lifts) get redirected to Europe. Below <strong>Brent $80<\/strong>, the floor disappears entirely and TTF trades on pure European fundamentals.<\/p><p>Right now at $94, we're in the <strong>repricing begins but doesn't yet matter<\/strong> zone. The floor is structural: 30% storage, QE force majeure, and Norway maintenance season. It's not going to €33 overnight.<\/p><h3>📈 Backwardation: Physical vs Paper Divergence<\/h3><p>Here's the fascinating part. Physical crude spot cargoes are bidding at <em>record highs<\/em> (Dated Brent +$5 to front-month futures) even as paper crashes. The backwardation is extreme — the market is saying the supply shock is real <em>right now<\/em> but resolves within months.<\/p><p><strong>Is that right for gas?<\/strong> Partially. European storage at 30% means summer injection demand is massive regardless of ceasefire. Even if Hormuz reopens fully and QE lifts FM, you need <strong>months<\/strong> to restore LNG flow. The gas market's supply shock has a longer tail than oil because: (a) it takes time to un-strand Qatari cargoes, (b) European storage needs 40+ BCM of injection by October, and (c) Norway's maintenance season caps non-LNG supply.<\/p><p>The curve should be telling us: <strong>prompt stays bid, summer moderates, winter stays expensive.<\/strong> And that's roughly what we're seeing.<\/p><h3>📐 TTF Curve: The Shape of the Trade<\/h3><ul><li><strong>Front month (Apr/May):<\/strong> Down 5-8% — orderly, reflects near-term supply relief if Hormuz reopens. Still elevated on low storage.<\/li><li><strong>Summer (Jun-Aug):<\/strong> Should see the steepest decline if ceasefire holds. Injection demand is the only support, and LNG repricing pressures mount.<\/li><li><strong>Winter (Oct-Mar '27):<\/strong> Minimal impact. Storage deficit, Norwegian maintenance, and geopolitical uncertainty (2-week ceasefire ≠ peace deal) keep winter bid. If anything, winter contracts gain on the roll as the market prices in that this ceasefire could fail.<\/li><\/ul><h3>🎯 Trade Ideas<\/h3><p><strong>SCENARIO A — Ceasefire Holds (60% probability):<\/strong><\/p><ul><li><strong>Short TTF Summer / Long TTF Winter<\/strong> — the calendar spread widens as summer gives back geopolitical premium while winter holds on storage fundamentals. Target: +€8-12 spread widening.<\/li><li><strong>Short Brent / Long TTF prompt<\/strong> — oil has more war premium to give back than gas. TTF's downside is capped by storage; Brent's isn't capped by anything below $73.<\/li><li><strong>Avoid:<\/strong> Being outright short TTF — the floor is real and structural.<\/li><\/ul><p><strong>SCENARIO B — Ceasefire Fails (40% probability):<\/strong><\/p><ul><li><strong>Long TTF prompt<\/strong> — back to €60+ within days if Hormuz recloses. QE force majeure becomes indefinite.<\/li><li><strong>Short Brent / Long TTF<\/strong> — the pair trade works in BOTH scenarios. Gas stays tight longer than oil because the physical gas supply chain has longer恢复 times.<\/li><li><strong>Calendar spread flips:<\/strong> Prompt outperforms winter as the market re-prices immediate supply risk.<\/li><\/ul><p><strong>The key insight:<\/strong> The calendar spread is the cleanest expression of the ceasefire binary. It works in both directions.<\/p><h3>🇺🇸 HH Decoupling Thesis<\/h3><p><strong>Henry Hub doesn't care about Hormuz — directly.<\/strong> US gas is a domestic market. But the <strong>JKM arbitrage channel<\/strong> matters enormously.<\/p><ul><li>With Hormuz open and QE lifting FM: Asian LNG demand eases → JKM drops → US LNG export margins compress → HH stays capped at ~$3-3.50.<\/li><li>With Hormuz closed: JKM spikes to $18-20+ → every available US cargo heads to Asia/Europe → HH at $4+ as domestic supply tightens.<\/li><\/ul><p>Current HH: ~$3.13/MMBtu. If ceasefire holds, expect HH to drift lower to $2.80-3.00 range as export demand moderates. If it fails, $4+ is on the table fast. The HH-JKM spread is the transmission mechanism — watch it.<\/p><h3>⚡ Sage's Dissent<\/h3><p><em>\"Blaise is overcomplicating this. The 2-week ceasefire is a Band-Aid on a hemorrhage — Iran's FM explicitly said 'as long as we're not attacked.' That's not a ceasefire, that's a hostage negotiation. The calendar spread is cute but you're paying 30% storage to fund a position that flips on a single tweet. My take: stay flat until we see actual tanker movements through Hormuz. Paper prices mean nothing until physical confirms. The backwardation in oil isn't 'the market pricing temporary shock' — it's 'nobody wants to be long oil into a Trump tweet storm.' Same playbook, different day.\"<\/em><\/p>","sig":"Blaise 🧮 · Gas Morning Brief"},{"t":"alert","badge":"⚡ 🚢 LNG & Flows","title":"Qatar Tankers Remain Diverted as Hormuz Enters Day 38","hook":"No breakthrough in Hormuz diplomacy as QatarEnergy extends force majeure at Ras Laffan. EU LNG sendout holds steady but arrivals queue in the Red Sea.","authorWord":"115 mtpa of LNG capacity offline or rerouted ≈ 25% of global trade. EU sendout ~490 mcm/d, down 3% from pre-crisis levels.","author":"Henry 🦉","details":"<p>EU LNG arrivals for the week of April 6-12 are tracking at <strong>27 cargoes<\/strong> (down from 31 last week), with <strong>12 vessels<\/strong> still diverted around the Cape of Good Hope due to the Hormuz closure, per <a href='https://www.kpler.com' target='_blank'>Kpler<\/a> tracking. Average sendout from EU terminals stands at <strong>490 mcm/d<\/strong> (week to Apr 7), <strong>▼-3%<\/strong> versus the pre-crisis baseline.<\/p><p>US LNG export utilization at major Gulf Coast terminals is running at <strong>87%<\/strong> of nameplate capacity (as of Apr 6), slightly below the 92% peak, as vessels face delays and charter rates surge to <strong>$250,000/day<\/strong> for Atlantic Basin routes. The TTF-JKM spread has widened to <strong>€18.50/MWh<\/strong>, incentivizing arbitrage when feasible.<\/p><p>Norwegian pipeline flows via Langeled and Europipe remain stable at <strong>312 mcm/d<\/strong> (nomination Apr 8), unchanged from yesterday. North African flows (Medgaz, Transmed) total <strong>48 mcm/d<\/strong>, with no unplanned outages reported. Planned maintenance at the <strong>Zeebrugge LNG terminal<\/strong> (Apr 10-15) will temporarily reduce Belgian import capacity by 30%.<\/p><p><strong>💡 Trade Ideas:<\/strong> (1) <strong>Long JKM-TTF Spread<\/strong> at current ~€18.50/MWh to capture Asian premium if Hormuz extends; target €25, stop at €14.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>The 3% sendout decline is modest given 25% of global capacity is affected. This suggests demand destruction or demand substitution is already occurring. The market may be overreacting to supply headlines.<\/div><\/div>","sig":"Henry 🦉"},{"t":"tech","badge":"⚡ ⚡ Power & Carbon","title":"Spark Spreads Under Pressure as Renewables Flood","hook":"Clean spark spreads are narrowing as high wind output tests the floor for gas-fired marginal pricing. Carbon markets remain steady, providing little relief for carbon-intensive coal generation.","authorWord":"High wind output across Northern Europe is pushing spot prices lower, tightening gas-to-power margins. Traders are increasingly wary of the current spark/dark spread convergence.","author":"Sage 🦎","details":"<p>Yesterday's EUA market showed relative calm, with December '26 futures settling at €78.45 (settle 07 Apr), down €0.85 from the previous session, per <a href='https://www.theice.com' target='_blank'>ICE<\/a>. The market is awaiting further clarity on EU industrial output data, which remains the primary regulatory catalyst for near-term volatility.<\/p><p>In the power spot markets, day-ahead baseload prices in Germany closed at €42.50/MWh (close 07 Apr), a decrease of €3.20, driven by aggressive wind forecasts for today. French and UK markets are showing similar trends, though tighter margins in the UK persist due to ongoing maintenance on key interconnectors, as reported by <a href='https://www.entsoe.eu' target='_blank'>ENTSO-E<\/a> and <a href='https://www.rte-france.com' target='_blank'>RTE eCO2mix<\/a>.<\/p><p>Currently, the clean spark spread is narrowly 'in-the-money' for efficient CCGTs compared to the clean dark spread, which remains significantly pressured by high carbon costs. 💡 <b>Trade Ideas:<\/b> (1) Consider a Long Clean Spark Spread (Buy Gas / Sell Power) if wind generation continues to exceed forecasts. (2) Evaluate a Bull Call Spread on Dec '26 Carbon futures (e.g., Buy €85 / Sell €95) if industrial demand shows signs of life in mid-April.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>Do not underestimate the potential for a sudden nuclear 'trip' in France to scramble these spreads overnight. The market is pricing in too much calm.<\/div><\/div>","sig":"Sage 🦎"},{"t":"analysis","badge":"📊 🌡️ Weather & Demand","title":"Shoulder Season Arrives with Mild Outlook, But HDD Deficit Persists","hook":"Europe's extended range forecast shows above-normal temperatures for Week 2-4, accelerating the seasonal demand decline. However, cumulative HDD remains 12% below 10-year average.","authorWord":"Mild April forecasts reduce heating demand, but the structural deficit from a cold March leaves EU storage starting injection season at 28% — the lowest April level since 2018.","author":"Sage 🦎","details":"<p>The ECMWF extended range (Week 2-4, Apr 15-29) forecasts <strong>above-normal temperatures<\/strong> across Northern Europe, with anomalies of <strong>+1.5°C to +2.5°C<\/strong> versus the 1991-2020 climatology, per <a href='https://www.ecmwf.int' target='_blank'>ECMWF<\/a>. This pattern is driven by a persistent positive NAO (+1.2), which is expected to keep Atlantic westerlies dominant and suppress cold air incursions.<\/p><p>Cumulative <strong>Heating Degree Days (HDD)<\/strong> for the 2025-2026 season (Oct 1 - Apr 7) stand at <strong>2,845<\/strong>, <strong>▼-12%<\/strong> below the 10-year average (3,235) and <strong>▼-8%<\/strong> below the 30-year average (3,095). The March 2026 HDD anomaly was particularly severe at <strong>-18%<\/strong> versus normal, which accelerated storage withdrawals and left Europe entering the injection season in a precarious position.<\/p><p>Norwegian hydro reservoir levels (as of Apr 5) are at <strong>47%<\/strong> of capacity, <strong>▲+5%<\/strong> above the 5-year average (42%) and <strong>▲+8%<\/strong> above year-ago levels, according to <a href='https://www.nve.no' target='_blank'>NVE<\/a>. This provides some buffer for gas-for-power demand, but wind generation forecasts for Week 2-4 show <strong>below-normal output<\/strong> in the North Sea (-15% vs average), partially offsetting the hydro advantage.<\/p><p><strong>💡 Trade Ideas:<\/strong> (1) <strong>Buy TTF Dec €45 Puts<\/strong> as cheap protection against an unexpected cold snap in Q4.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>The market is overreacting to the HDD deficit. With hydro +8% YoY and LNG imports holding (despite Hormuz), the refill challenge is manageable. The calendar spread premium is excessive.<\/div><\/div>","sig":"Sage 🦎"},{"t":"tech","badge":"📊 📦 Storage Watch","title":"EU Storage at 28.1% — Lowest April Level Since 2018","hook":"European gas storage entered the injection season at 28.1% full, significantly below the 5-year average of 41%. The refill equation is structurally challenged by the triple shock of low exit levels, Hormuz, and the Russian LNG ban.","authorWord":"To reach 90% by Nov 1, EU needs +62.9 percentage points in 207 days ≈ 0.304 pp/day. Historical average injection rate is 0.23 pp/day. The gap requires +32% above-normal injection.","author":"Blaise 🧮","details":"<p>EU gas storage as of <strong>April 7, 2026<\/strong> stands at <strong>28.1%<\/strong> full with <strong>320.5 TWh<\/strong> of volume, per <a href='https://agsi.gie.eu' target='_blank'>GIE AGSI+<\/a>. This is <strong>▼-12.9 pp<\/strong> below the 5-year average (41.0%) and <strong>▼-8.5 pp<\/strong> below year-ago levels (36.6%). Germany leads the deficit at 22.3% (vs 5Y avg 35.2%), while the Netherlands is marginally better at 31.8% (vs 5Y avg 44.1%).<\/p><p>US natural gas storage for the week ending <strong>April 3, 2026<\/strong> showed a net injection of <strong>+24 Bcf<\/strong>, bringing total working gas to <strong>1,786 Bcf<\/strong>, <strong>▲+142 Bcf<\/strong> above the 5-year average (1,644 Bcf) and <strong>▲+218 Bcf<\/strong> above year-ago levels (1,568 Bcf), according to <a href='https://www.eia.gov' target='_blank'>EIA Weekly Natural Gas Storage Report<\/a>. The injection pace is 18% above the 5-year average for this week.<\/p><p>End-of-season projection: At the current trajectory, EU storage would reach approximately <strong>82-85%<\/strong> by November 1, <strong>▼-5 to 8 pp<\/strong> short of the 90% regulatory mandate. Days of supply equivalent at current net injection rates (+0.21 pp/day) is <strong>293 days<\/strong>, but this assumes no demand spikes or supply disruptions — both of which are elevated risks.<\/p><p><strong>💡 Trade Ideas:<\/strong> (1) <strong>Long TTF Summer/Winter-26 Calendar Spread<\/strong> at current ~€4.00 — the structural supply-demand imbalance favors a steepening curve. (2) <strong>Buy TTF Nov €60 Calls<\/strong> as a binary bet on the refill failure scenario.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The 90% mandate has flexibility clauses for force majeure. If Hormuz persists beyond 60 days, the EU will likely invoke the security exemption and adjust the target downward. The spread premium overprices this risk.<\/div><\/div>","sig":"Blaise 🧮"},{"t":"alert","badge":"📊 💣 Geopolitics & Regulation","title":"US-Iran Ceasefire: Hormuz Reopens for Two Weeks","hook":"Trump and Iran agree to conditional ceasefire; Hormuz Strait to reopen under Iranian military coordination. Brent plunges below $100. But regional war continues in Lebanon, and Iran's 10-point plan demands permanent control over Hormuz.","authorWord":"Hormuz reopens—molecules don't flow yet. Qatar needs 48-72h to resume loadings, EU gets cargoes in 10-14 days. The ceasefire is real but tiny—what happens after April 21?","author":"Henry 🦉","details":"<h3>Breaking: Two-Week Conditional Ceasefire<\/h3>\n<p>President Trump announced a conditional two-week ceasefire on April 7, hours before his 8pm ET deadline to \"wipe out Iranian civilization\" if Iran refused to reopen the Strait of Hormuz. Pakistan brokered the last-minute deal, with talks set to begin in Islamabad on Friday, April 10. Iran's Supreme National Security Council accepted, agreeing to \"safe passage through the Strait of Hormuz via coordination with Iran's Armed Forces.\" The ceasefire could be extended if negotiations proceed favorably, Tehran says.<\/p>\n\n<h3>Hormuz Reopening: Logistics Reality Check<\/h3>\n<p><strong>Don't confuse agreement with molecules flowing.<\/strong> The agreement says safe passage is \"possible\"—it doesn't mean tankers are already transiting. Key timing:<\/p>\n<ul>\n<li><strong>Qatar (world's largest LNG exporter):<\/strong> Needs 48-72 hours to resume loadings after any sustained halt. Crews must be recalled, safety protocols re-established, insurance verified.<\/li>\n<li><strong>Transit to EU:<\/strong> Even with immediate resumption, Qatari LNG cargoes take 10-14 days to reach European terminals.<\/li>\n<li><strong>Iran's coordination requirement:<\/strong> All vessels must coordinate with Iranian Armed Forces. This introduces a new layer of bureaucracy and potential bottleneck.<\/li>\n<\/ul>\n<p><strong>Quantifying the opportunity:<\/strong> If Hormuz fully reopens for 14 days and Qatar operates at full capacity (~77 million tonnes per year), approximately 2-3 bcm of LNG could transit from Qatar alone. However, this assumes no disruptions, full insurance coverage, and willing crews—all uncertain.<\/p>\n\n<h3>Partial vs. Full Hormuz: What It Means<\/h3>\n<p><strong>Full reopening:<\/strong> Pre-war normal—free navigation, commercial insurance at standard rates, no war risk premiums, crews willing to transit.<\/p>\n<p><strong>Partial reopening (current reality):<\/strong><\/p>\n<ul>\n<li><strong>Insurance:<\/strong> War risk premiums remain elevated until the situation stabilizes. Some underwriters may refuse coverage entirely.<\/li>\n<li><strong>Crew willingness:<\/strong> Many seafarers will refuse transit until the ceasefire proves durable. Labor unions may issue warnings.<\/li>\n<li><strong>Coordination friction:<\/strong> Iranian military coordination means vessels wait for approval, creating delays and chokepoints.<\/li>\n<li><strong>Legal ambiguity:<\/strong> Who bears liability if an incident occurs during the ceasefire? Shipowners face heightened exposure.<\/li>\n<\/ul>\n\n<h3>Iran's 10-Point Peace Plan: Sovereignty Trap<\/h3>\n<p>Iran submitted a 10-point proposal that Trump called \"a workable basis\" for negotiations. But the plan includes a dealbreaker: <strong>permanent Iranian control over the Strait of Hormuz.<\/strong> This is a sovereignty claim—Tehran wants recognition of its right to dictate who passes through the waterway and under what terms. Before the war, Hormuz was an international waterway governed by UNCLOS. Iran's demand would effectively make Hormuz an Iranian-controlled checkpoint. The U.S. and its allies are unlikely to accept this long-term, even if they tolerate it temporarily under the ceasefire.<\/p>\n<p>Other elements of Iran's plan (per leaked details):<\/p>\n<ul>\n<li>Recognition of Iran's right to enrich uranium<\/li>\n<li>Withdrawal of all U.S. forces from the region<\/li>\n<li>Lifting of all economic sanctions<\/li>\n<li>Reparations for war damage<\/li>\n<\/ul>\n<p>The gap between Tehran's wishlist and Washington's demands is enormous. Negotiating a final deal in two weeks is diplomatically impossible.<\/p>\n\n<h3>Regional War NOT Over: Lebanon Excluded<\/h3>\n<p>Prime Minister Netanyahu explicitly stated that the ceasefire \"does not include Lebanon.\" Israel will continue its offensive against Hezbollah. Pakistan's Prime Minister Sharif had claimed the ceasefire applied \"everywhere, including Lebanon,\" but Netanyahu's office contradicted this. The Iran chapter may be paused, but the regional war grinds on. Hezbollah continues firing rockets into northern Israel, and Israeli airstrikes continue in southern Lebanon. This means:<\/p>\n<ul>\n<li>Energy infrastructure in Lebanon and northern Israel remains at risk<\/li>\n<li>Refineries and pipelines in the broader Levant face continued disruption<\/li>\n<li>The humanitarian crisis in Lebanon deepens<\/li>\n<li>Any incident in Lebanon could trigger Iranian retaliation, collapsing the ceasefire<\/li>\n<\/ul>\n\n<h3>Geopolitical Fault Lines: Russia and China Veto UN Resolution<\/h3>\n<p>Russia and China blocked a UN Security Council resolution calling for the immediate reopening of the Strait of Hormuz. This demonstrates that the great powers remain divided on the conflict. Russia and China have deepening ties with Iran and have framed the war as Western aggression. Their veto signals they will continue to shield Iran from international pressure and limit the U.S.'s ability to build a multilateral coalition. It also foreshadows diplomatic battles over any final peace agreement.<\/p>\n\n<h3>Market Reaction: Brent Plunges, Physical Remains Tight<\/h3>\n<p>Brent crude dropped below $100 on the news, down approximately 14% from pre-ceasefire levels. WTI fell to around $95. Asian equity markets surged (Nikkei +5%, Kospi +7%). But <strong>physical crude markets remain historically tight.<\/strong> Spot differentials for Middle Eastern grades are at record premiums. The disconnect reflects market recognition that:<\/p>\n<ul>\n<li>Paper prices can collapse on headlines, but physical supply takes weeks to normalize<\/li>\n<li>Two weeks is insufficient to clear the supply overhang<\/li>\n<li>Refinery outages from earlier strikes on Kharg Island and South Pars will take months to repair<\/li>\n<li>IEA chief Fatih Birol warned the current energy crisis is \"worse than 1973, 1979, and 2022 combined\"—a single ceasefire doesn't fix that<\/li>\n<\/ul>\n\n<h3>Updated Hormuz Scenario Matrix<\/h3>\n<table border=\"1\" cellpadding=\"8\" cellspacing=\"0\">\n<tr><th><strong>Scenario<\/strong><\/th><th><strong>Probability<\/strong><\/th><th><strong>Impact on Gas<\/strong><\/th><\/tr>\n<tr><td><strong>NEW BASE CASE:<\/strong> Ceasefire holds, Hormuz partially reopens for 2 weeks, then extended with conditions<\/td><td>45%<\/td><td>Moderate relief. LNG flows resume but at reduced capacity. War risk premiums persist. Markets volatile.<\/td><\/tr>\n<tr><td>Ceasefire collapses within 48-72 hours<\/td><td>25%<\/td><td>Severe. Brent spikes above $130. Hormuz fully re-blocked. Panic buying in Europe.<\/td><\/tr>\n<tr><td>Ceasefire extended, full Hormuz normalization<\/td><td>20%<\/td><td>Significant relief. LNG flows return to pre-war levels by May. Prices moderate gradually.<\/td><\/tr>\n<tr><td>Ceasefire holds, Hormuz remains under Iranian coordination long-term<\/td><td>10%<\/td><td>Structural shift. Higher permanent transaction costs. Geopolitical risk premium embedded forever.<\/td><\/tr>\n<\/table>\n\n<h3>The April 21 Question: What Happens Next?<\/h3>\n<p>Two weeks is nothing in geopolitical time. The fundamental issues that triggered this war—Iran's nuclear program, its regional hegemony ambitions, and the status of Hormuz—remain unresolved. Iran still possesses ~970 pounds of 60% enriched uranium (near bomb-grade). Its missile arsenal is largely intact. Its proxy networks across the Middle East are still active. The ceasefire is a tactical pause, not a strategic solution.<\/p>\n<p>Key questions for the next 14 days:<\/p>\n<ul>\n<li><strong>Can Trump and Iran's new Supreme Leader, Mojtaba Khamenei, find common ground?<\/strong> Early signs suggest no—Tehran's 10-point plan reads like a pre-war wishlist.<\/li>\n<li><strong>Will Netanyahu respect the ceasefire in the Iran theater?<\/strong> Israel has broken similar agreements before. Any strike could trigger Iranian retaliation.<\/li>\n<li><strong>What happens if Hezbollah escalates in Lebanon?<\/strong> Israel has pledged to respond forcefully, potentially drawing Iran back into direct conflict.<\/li>\n<li><strong>Can Pakistan sustain its mediation role?<\/strong> Islamabad is walking a tightrope—too close to the U.S., and it alienates China; too close to Iran, and it provokes Saudi Arabia.<\/li>\n<\/ul>\n\n<h3>Bottom Line: Balanced Perspective<\/h3>\n<p>Don't overweight the ceasefire—two weeks is a blink. But don't underweight it either—Hormuz reopening is real, and every additional bcm of LNG reaching Europe matters right now. The market relief is justified, but the celebration is premature. This war is not over. The structural damage to global energy security will take months, if not years, to repair. And the biggest question—whether the world can tolerate an Iranian-controlled Strait of Hormuz—remains unanswered.<\/p>\n\n<div class=\"dissent\">\n<h4>⚡ Blaise's Dissent<\/h4>\n<p>Henry's being too bearish. This ceasefire is bigger than he gives it credit for. First, Trump's threats were real— credible—so Iran's acceptance signals weakness, not strength. Tehran is blinking because they know the U.S. can escalate further without breaking a sweat. Second, the 10-point plan is a <strong>negotiating position<\/strong>, not a final demand. Every peace negotiation starts with maximalist asks. That's how diplomacy works. Third, the Hormuz \"coordination\" requirement is theater—Iran needs the revenue from oil and gas exports as much as the world needs the supply. They won't bottle up their own cash cow. Fourth, markets are forward-looking—Brent at $93 reflects expectations of a <strong>lasting<\/strong> de-escalation, not a two-week pause. The physical tightness Henry cites is a lagging indicator. Finally, the Russia/China veto is irrelevant—this is a U.S.-Iran bilateral deal now. The UN was never going to solve this. My view: 60% probability the ceasefire extends and turns into a longer-term arrangement. Henry's 45% base case is too pessimistic. The gas market should prepare for a return to pre-war supply levels by June, not the prolonged crunch he's warning about.<\/p>\n<\/div>","sig":"Henry 🦉 · Gas Morning Brief"},{"t":"strategy","badge":"📊 🎯 Risk Flags & Outlook","title":"Ceasefire: A Tactical Pause, Not a Solution","hook":"The front-month relief is here, but the structural storage crisis is deepening. Two weeks of 'peace' doesn't fill empty tanks.","authorWord":"The Hormuz reopening is a paper win; the physical reality of a 28% storage level is the real story. Don't mistake a ceasefire for a cure.","author":"Sage 🦎","details":"<h3>The Pivot<\/h3><p>The US-Iran 2-week ceasefire and partial Hormuz reopening have provided a desperate relief valve for the markets. However, we are trapped between immediate paper relief and a mounting physical deficit.<\/p><ul><li><b>Base Case (60%):<\/b> Ceasefire holds through April 21; partial Hormuz transit eases shipping, but the 'sovereignty trap' in Iran's 10-point plan remains an unexploded ordnance.<\/li><li><b>Collapse Case (40%):<\/b> Negotiations hit the sovereignty wall; the resulting escalation will be more violent than pre-ceasefire, with the Strait facing a harder, more permanent closure.<\/li><\/ul><h3>Trading the Divergence<\/h3><ul><li><b>Long TTF Summer/Winter Spread (Conviction: High):<\/b> The front end is pricing peace; the back end is pricing panic. Summer injections are non-negotiable.<\/li><li><b>Short Volatility (Conviction: Medium):<\/b> Harvesting the binary risk premium, but keep stops tight. A collapse on April 21 will cause a gamma-explosion.<\/li><li><b>Long Brent/TTF Ratio (Conviction: Medium):<\/b> Brent will likely trade on supply-chain logistics, while gas stays bid on pure desperation for molecules.<\/li><li><b>Short Brent (Conviction: Low):<\/b> Excess risk premium will bleed out, but physical supply at record lows supports a floor.<\/li><li><b>Long TTF Time-Spread Q3/Q4 (Conviction: High):<\/b> The market is ignoring the Q4 supply cliff in its obsession with Q2/Q3 flow.<\/li><\/ul><p><b>Henry's Dissent:<\/b> 'This is a sucker's rally. Iran has no intention of abandoning their 10-point sovereignty demand. They are using these two weeks to re-arm. When the April 21 deadline hits, don't be surprised when the lights go out in the Strait for good.'<\/p>","sig":"Sage 🦎 · Gas Morning Brief"},{"t":"analysis","badge":"🎲 Scénarios","title":"7 Scénarios — Le Conseil Prudent Face à l'Incertitude Hormuz","hook":"Le Conseil assigne 60% de probabilité au statu quo prolongé à Hormuz, 25% à une résolution diplomatique, et seulement 15% à l'escalade majeure. La patience du marché est la conviction dominante.","authorWord":"Convergence sur le scénario de base: blocus durable mais pas catastrophique. Divergence sur le timing de résolution — Dante est plus optimiste qu'Apex et Lyra.","author":"Le Conseil 🎲","details":"<div class='scenario-block'><h3>S1 — Blocus Hormuz Prolongé (60-90 jours) <span class='proba'>35%<\/span><\/h3><p>Le détroit reste fermé, QatarEnergy étend la force majeure. L'Europe compense via GNL US et Norvège, mais les premiums persistent. TTF se maintient €50-55/MWh.<\/p><p class='votes'>Apex 40% · Sage 35% · Nova 35% · Blaise 30% · Lyra 35% · Dante 25% · Felix 45%<\/p><\/div><div class='scenario-block'><h3>S2 — Résolution Diplomatique Partielle <span class='proba'>25%<\/span><\/h3><p>Accord limité: passage sécurisé pour tankers civils sous escorte ONUSIENNE. L'incertitude diminue, premiums s'effritent. TTF retourne €42-45/MWh.<\/p><p class='votes'>Apex 20% · Sage 30% · Nova 25% · Blaise 25% · Lyra 20% · Dante 35% · Felix 20%<\/p><\/div><div class='scenario-block'><h3>S3 — Escalade Militaire (attaque sur terminal Qatar) <span class='proba'>12%<\/span><\/h3><p>Frappe directe sur Ras Laffan ou maritime. 115 mtpa hors circuit durable. Panique sur les approvisionnements. TTF spike €70-80/MWh.<\/p><p class='votes'>Apex 15% · Sage 10% · Nova 10% · Blaise 15% · Lyra 10% · Dante 10% · Felix 12%<\/p><\/div><div class='scenario-block'><h3>S4 — Statu Quo Mouillé <span class='proba'>15%<\/span><\/h3><p>Harassement continu, passages sporadiques, incertitude perpétuelle. Le marché s'habitue, premiums se figent. TTF €48-52/MWh.<\/p><p class='votes'>Apex 10% · Sage 15% · Nova 15% · Blaise 15% · Lyra 20% · Dante 15% · Felix 15%<\/p><\/div><div class='scenario-block'><h3>S5 — Déroute Diplomatique (rejet proposition Iran) <span class='proba'>8%<\/span><\/h3><p>L'Iran rejette toute médiation, menace l'ensemble du Golfe. Risque de contagion aux champs pétroliers saoudis. TTF €65-75/MWh.<\/p><p class='votes'>Apex 10% · Sage 5% · Nova 10% · Blaise 5% · Lyra 5% · Dante 10% · Felix 5%<\/p><\/div><div class='scenario-block'><h3>S6 — Solution Technique (couloir maritime alternatif) <span class='proba'>4%<\/span><\/h3><p>Accord miracle sur route de contournement via Oman/Mer Rouge. Les tankers reprennent sans risque. Premiums s'effondrent. TTF €38-40/MWh.<\/p><p class='votes'>Apex 5% · Sage 5% · Nova 5% · Blaise 5% · Lyra 5% · Dante 5% · Felix 3%<\/p><\/div><div class='scenario-block'><h3>S7 — Conflit Régional Élargi <span class='proba'>1%<\/span><\/h3><p>Extension du conflit à Arabie Saoudite/EAU. 200+ mtpa de GNL menacés. Crise énergétique mondiale. TTF €85-100+/MWh.<\/p><p class='votes'>Apex 0% · Sage 0% · Nova 0% · Blaise 0% · Lyra 5% · Dante 0% · Felix 0%<\/p><\/div><p class='consensus'><strong>🎯 Consensus :<\/strong> Le Conseil converge sur un scénario central de blocus prolongé (S1 + S4 = 50%) avec résolution progressive (S2 = 25%). Les queues de risque (S3, S5, S7) totalisent 21% — suffisantes pour justifier des hedges asymétriques mais pas pour justifier des positions massives directionnelles.<\/p><div class='dissent'><div class='dissent-label'>🔥 Contre-narratif — Dante 🔥<\/div><div class='dissent-text'>Le Conseil sous-estime l'effet de fatigue. Après 60 jours, le marché aura normalisé le risque premium. Si un accord émerge, le gap sera brutal. Le scénario S2 est à 35% minimum, pas 25%.<\/div><\/div>","sig":"Le Conseil 🎲"},{"t":"analysis","badge":"📊 🌍 Scénario Géopolitique","title":"Géopolitique & Gaz — Délibération du Conseil","hook":"L'actualité des 48h est dominée par le veto russo-chinois à l'ONU sur Hormuz et les attaques ukrainiennes sur les raffineries russes. Le Conseil identifie 4 scénarios géopolitiques réels impactant le gaz.","authorWord":"Le veto ONUSIENNE renforce l'impasse. Les frappes ukrainiennes créent un nouveau front sur les produits raffinés, avec conséquences indirectes sur le gaz via pétrole-indexation.","author":"Le Conseil 🌍","details":"<div class='scenario-block'>\n  <h3>S1 — Impasse ONUSIENNE Confirmée (veto Russe/Chinois) <span class='proba'>40%<\/span><\/h3>\n  <p>Fait réel: Russie et Chine ont opposé leur veto à la résolution de sécurité sur Hormuz le 7 avril 2026. Conséquence gaz: aucune force multinationale ne peut forcer le passage. Le blocus persiste, premiums GNL restent élevés. TTF supporté à €48-55/MWh.<\/p>\n  <p class='votes'>Apex 45% · Sage 40% · Nova 35% · Blaise 40% · Lyra 40% · Dante 35% · Felix 45%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n  <h3>S2 — Escalade via Attaques Raffineries Russes <span class='proba'>25%<\/span><\/h3>\n  <p>Fait réel: Ukraine intensifie les frappes de drones sur les raffineries russes (Norsi, Kirishi). Conséquence gaz: réduction offre produits raffinés → pétrole brut spike → contrats gaz indexés pétrole tirent à la hausse. TTF €55-65/MWh via contagion pétrolière.<\/p>\n  <p class='votes'>Apex 20% · Sage 25% · Nova 30% · Blaise 20% · Lyra 25% · Dante 25% · Felix 30%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n  <h3>S3 — Médiation Qatar/Iran Secret <span class='proba'>20%<\/span><\/h3>\n  <p>Fait hypothétique mais ancré: Qatar agit comme médiateur entre l'Iran et l'Occident, avec garanties économiques. Conséquence gaz: réouverture progressive d'Hormuz sous protocole sécurisé. Premiums s'effritent en 2-3 semaines. TTF €40-45/MWh.<\/p>\n  <p class='votes'>Apex 15% · Sage 20% · Nova 20% · Blaise 25% · Lyra 15% · Dante 30% · Felix 15%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n  <h3>S4 — Ban Russe Spot LNG appliquée Strictement <span class='proba'>15%<\/span><\/h3>\n  <p>Fait réel: deadline 25 avril 2026 pour le ban spot LNG russe. L'UE confirme application stricte, sans boucles juridiques. Conséquence gaz: perte 14 bcm/yr sur terminal Zeebrugge, Montoir, Gate. TTF €50-58/MWh lors de l'entrée en vigueur.<\/p>\n  <p class='votes'>Apex 20% · Sage 15% · Nova 15% · Blaise 10% · Lyra 20% · Dante 10% · Felix 10%<\/p>\n<\/div>\n\n<p class='consensus'><strong>🎯 Consensus :<\/strong> Le Conseil identifie deux facteurs géopolitiques dominants: (1) L'impasse Hormuz renforcée par le veto ONUSIENNE (S1 = 40%) et (2) l'impact indirect des frappes ukrainiennes via pétrole (S2 = 25%). Le ban russe LNG (S4) est une certitude réglementaire mais son impact est partiel (14 bcm/yr sur ~500 bcm/an consommation UE).<\/p>\n\n<div class='dissent'><div class='dissent-label'>🔥 Contre-narratif — Dante 🔥<\/div><div class='dissent-text'>Le Conseil surévalue l'impact des frappes ukrainiennes. Les raffineries russes ont redondance, et la production pétrolière mondiale absorbera le choc. Le lien gaz-pétrole est affaibli par le découplage européen du gaz russe. S2 est à 15% max, pas 25%.<\/div><\/div>","sig":"Le Conseil 🌍"},{"t":"end","end":t   document.addEventListener('touchend',e=>{if(!dragging)return;dragging=false;if(axis==='y'){axis='';return;}axis='';const card=cards[cur];card.classList.add('anim');if(cards[cur+1])cards[cur+1].classList.add('anim');if(cards[cur-1])cards[cur-1].classList.add('anim');const velocity=Math.abs(deltaX)/(Date.now()-startTime);const threshold=velocity>0.5?30:60;if(deltaX>threshold&&cur===0){window.location.href='../index.html';}else if(deltaX<-threshold&&cur===total-1){window.location.href='../index.html';}else if(deltaX<-threshold&&cur<total-1){cur++;update();}else if(deltaX>threshold&&cur>0){cur--;update();}else{card.style.transform='';}},{passive:true});
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&cur<total-1){cur++;update();}if(e.key==='ArrowLeft'&&cur>0){cur--;update();}});
  document.addEventListener('click',e=>{if(e.target.id==='restart')go(0);const article=e.target.closest('.home-article');if(article){const idx=parseInt(article.dataset.goto);if(!isNaN(idx))go(idx);}});
  /* === DESKTOP SPLIT-VIEW === */
  let dtShell=null, dtSelected=0;
  function buildDesktop(){
    if(dtShell)return;
    dtShell=document.createElement('div');
    dtShell.className='desktop-shell';
    // Sidebar
    const sb=document.createElement('nav');
    sb.className='dt-sidebar';
    const logoDate=DATA[0]&&DATA[0].home?`<div class="dt-logo">Gas Morning Brief</div><div class="dt-date">${DATA[0].date||'8 Avril 2026'}</div>`:`<div class="dt-logo">Gas Morning Brief</div><div class="dt-date">8 Avril 2026</div>`;
    sb.innerHTML=logoDate;
    DATA.forEach((d,i)=>{
      const item=document.createElement('div');
      item.className='dt-nav-item'+(i===0?' dt-selected':'');
      item.tabIndex=0;
      item.dataset.idx=i;
      const emoji=d.home?'📰':d.end?'✅':(d.badge||'').split(' ')[0]||'📄';
      const label=d.home?'Accueil':d.end?'Fin':(d.badge||'').split(' ').slice(1).join(' ')||'';
      const title=d.home?'Sommaire':d.end?'Briefing terminé':d.title||'';
      item.innerHTML=`<div class="dt-nav-badge">${emoji}</div><div class="dt-nav-info"><div class="dt-nav-label">${label}</div><div class="dt-nav-title">${title}</div></div><div class="dt-nav-arrow">›</div>`;
      item.addEventListener('click',()=>selectDesktop(i));
      sb.appendChild(item);
    });
    // Reader
    const rd=document.createElement('div');
    rd.className='dt-reader';
    rd.innerHTML='<div class="dt-reader-inner"></div>';
    dtShell.appendChild(sb);
    dtShell.appendChild(rd);
    document.body.appendChild(dtShell);
    selectDesktop(0);
  }
  function selectDesktop(idx){
    dtSelected=idx;
    const items=dtShell.querySelectorAll('.dt-nav-item');
    items.forEach((it,i)=>it.classList.toggle('dt-selected',i===idx));
    const d=DATA[idx];
    const inner=dtShell.querySelector('.dt-reader-inner');
    if(d.home){
      const arts=d.articles?d.articles.map(a=>`<div class="dt-nav-item" style="cursor:pointer;opacity:.7;padding:10px 14px;margin-bottom:4px;border-radius:10px;border:1px solid rgba(255,255,255,.06);" onclick="selectDesktop(${a.idx})"><div class="dt-nav-badge">${a.badge.split(' ')[0]}</div><div class="dt-nav-info"><div class="dt-nav-label">${a.badge.split(' ').slice(1).join(' ')}</div><div class="dt-nav-title">${a.title}</div></div><div class="dt-nav-arrow">›</div></div>`).join(''):'';
      inner.innerHTML=`<div class="dt-r-home-henry"><div class="label">🦊 L'Édito du Jour</div><div class="text">${d.henryWord||''}</div></div>${arts}`;
    } else if(d.end){
      inner.innerHTML=`<div style="text-align:center;padding:60px 0;"><div style="font-size:3.5rem;margin-bottom:16px;">🎉</div><h2 style="font-size:1.6rem;font-weight:800;margin-bottom:12px;">Briefing terminé !</h2><p style="color:var(--muted);font-size:1rem;margin-bottom:24px;line-height:1.5;">Vous avez parcouru le briefing du jour. À demain !</p><a href="../index.html" style="display:inline-block;padding:12px 32px;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;">📰 Toutes les éditions</a></div>`;
    } else {
      const authorHtml=d.authorWord?`<div class="dt-r-author"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author||''}</div></div>`:'';
      inner.innerHTML=`<span class="dt-r-badge ${d.t||''}">${d.badge||''}</span><h1 class="dt-r-title">${d.title||''}</h1>${authorHtml}<div class="dt-r-hook">${d.hook||''}</div><div class="dt-r-body">${d.details||''}</div><div class="dt-r-sig">Gas Morning Brief — 8 Avril 2026</div>`;
    }
    dtShell.querySelector('.dt-reader').scrollTop=0;
    // Scroll sidebar item into view
    items[idx]&&items[idx].scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  function destroyDesktop(){
    if(dtShell){dtShell.remove();dtShell=null;}
  }
  function checkDesktop(){
    if(window.innerWidth>=900){
      deck.style.display='none';
      buildDesktop();
      dtShell.style.display='';
    } else {
      if(dtShell)dtShell.style.display='none';
      deck.style.display='';
      update(false);
    }
  }
  // Keyboard nav for desktop
  document.addEventListener('keydown',e=>{
    if(window.innerWidth<900)return;
    if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();if(dtSelected<DATA.length-1)selectDesktop(dtSelected+1);}
    if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();if(dtSelected>0)selectDesktop(dtSelected-1);}
  });
  checkDesktop();window.addEventListener('resize',checkDesktop);
  // Theme toggle
  (function(){
    const btn=document.getElementById('themeToggle');
    const saved=localStorage.getItem('theme');
    if(saved==='light'){document.documentElement.classList.add('light');btn.textContent='☀️';}
    btn.addEventListener('click',()=>{
      const isLight=document.documentElement.classList.toggle('light');
      btn.textContent=isLight?'☀️':'🌙';
      localStorage.setItem('theme',isLight?'light':'dark');
    });
  })();
  </script>
</body>
</html>
