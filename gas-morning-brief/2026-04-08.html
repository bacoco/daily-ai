<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gas Morning Brief — 8 Avril 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    /* Scenario Probability Card */
    .scenario-block { margin: 1em 0; padding: 0.8em 1em; border-left: 4px solid #ffd700; border-radius: 0 8px 8px 0; background: rgba(255,215,0,0.05); }
    .scenario-block h3 { margin: 0 0 0.3em 0; font-size: 1.05em; display: flex; justify-content: space-between; align-items: center; }
    .scenario-block .proba { font-size: 1.3em; font-weight: bold; color: #ffd700; }
    .scenario-block p { margin: 0.2em 0; font-size: 0.92em; }
    .scenario-block .votes { font-size: 0.8em; opacity: 0.7; font-style: italic; }
    .consensus { margin-top: 1.2em; padding: 0.6em; border-radius: 8px; background: rgba(0,200,100,0.08); }
    .dissent { margin-top: 0.4em; padding: 0.6em; border-radius: 8px; background: rgba(255,80,80,0.08); }

    html.light .details div[style*="background"], html.light .details p[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Light mode: override inline white colors in trade cards */
    html.light .details p[style], html.light .details b[style], html.light .details span[style], html.light .details div[style] { color: rgba(0,0,0,.85) !important; }
    html.light .details div[style*="border-left:3px solid #f59e0b"] { background: rgba(245,158,11,.08) !important; }
    html.light .details div[style*="border-left:3px solid #10b981"] { background: rgba(16,185,129,.08) !important; }
    html.light .details div[style*="border-left:3px solid #ff4757"] { background: rgba(255,71,87,.06) !important; }
    html.light .details div[style*="color:#f59e0b"] { color: #b45309 !important; }
    html.light .details div[style*="color:#10b981"] { color: #047857 !important; }
    html.light .details div[style*="color:#ff4757"] { color: #dc2626 !important; }
    html.light .details h3 { color: #1a1a2e !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details p[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }
      .dt-reader .dt-r-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; }
      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }
      .dt-reader .dt-r-body p { margin-bottom: 18px; }
      .dt-reader .dt-r-body strong { color: #fff; font-weight: 600; }

  <script>
  const DATA = [{"t":"home","home":true,"date":"8 Avril 2026","henryWord":"Hormuz Day 38 et le marché dort. Les 115 mtpa de GNL bloqués, le ban russe dans 17 jours, le storage à 28% — la prime de risque est là, mais pas la panique. Le Conseil a validé 9 trades sur 14, éliminant les redondances. Le JKM-TTF spread (T4) sort en tête avec conviction unanime.","articles":[{"badge":"⚡ 💰 Price Action","title":"TTF Consolidates Near €50 as Hormuz Uncertainty Persists","idx":1},{"badge":"⚡ 🚢 LNG & Flows","title":"Qatar Tankers Remain Diverted as Hormuz Enters Day 38","idx":2},{"badge":"⚡ ⚡ Power & Carbon","title":"Spark Spreads Under Pressure as Renewables Flood","idx":3},{"badge":"📊 🌡️ Weather & Demand","title":"Shoulder Season Arrives with Mild Outlook, But HDD Deficit Persists","idx":4},{"badge":"📊 📦 Storage Watch","title":"EU Storage at 28.1% — Lowest April Level Since 2018","idx":5},{"badge":"📊 💣 Geopolitics & Regulation","title":"Hormuz Day 38: Three-Shock Convergence Tests European Resilience","idx":6},{"badge":"📊 🎯 Risk Flags & Outlook","title":"Three-Shock Convergence: The Market Is Pricing Diplomacy, Not Reality","idx":7},{"badge":"🎲 Scénarios","title":"7 Scénarios — Le Conseil Prudent Face à l'Incertitude Hormuz","idx":8},{"badge":"📊 🌍 Scénario Géopolitique","title":"Géopolitique & Gaz — Délibération du Conseil","idx":9},{"badge":"🗳️ Conseil — Verdict sur les Trades","title":"9/14 Trades Retenus — Le Conseil Élimine les Redondances et Contradictions","idx":10}],"disclaimer":"⚠️ AVERTISSEMENT — Ce document est un exercice expérimental de veille automatisée produit par intelligence artificielle. Il ne constitue EN AUCUN CAS un conseil en investissement, une recommandation de trading, ni une analyse financière réglementée au sens de la directive MiFID II ou du Code monétaire et financier (art. L541-1). Les « scénarios de marché » présentés sont des hypothèses pédagogiques générées par des modèles de langage — ils ne reflètent pas l'avis d'un professionnel agréé. Les données proviennent de sources publiques, potentiellement retardées ou erronées. Toute décision d'investissement prise sur la base de ce document relève de la seule responsabilité du lecteur. L'auteur n'est pas enregistré comme Conseiller en Investissement Financier (CIF) auprès de l'AMF. Ce contenu est fourni à titre informatif et expérimental uniquement."},{"t":"alert","badge":"⚡ 💰 Price Action","title":"TTF Consolidates Near €50 as Hormuz Uncertainty Persists","hook":"European gas benchmarks remained rangebound overnight as traders await fresh signals from the extended Hormuz closure. US Henry Hub showed modest gains as weather forecasts firm up.","authorWord":"TTF day-ahead settled at €49.75/MWh (settle 07 Apr, ▲+€0.25 vs prev) with volume slightly below average. Henry Hub front-month at $3.08/MMBtu (close 07 Apr, ▲+$0.02 vs prev).","author":"Blaise 🧮","details":"<p>TTF day-ahead settled at <strong>€49.75/MWh<\/strong> (settle 07 Apr), <strong>▲+€0.25<\/strong> versus the previous session, as the market priced in another day of the Hormuz blockade without new diplomatic breakthroughs, per <a href='https://www.theice.com' target='_blank'>ICE Endex<\/a>. Trading volume was 12% below the 30-day average at 28.4 TWh, suggesting position trimming ahead of potential catalysts.<\/p><p>Henry Hub front-month futures closed at <strong>$3.08/MMBtu<\/strong> (close 07 Apr), <strong>▲+$0.02<\/strong> from the prior session, as improved production forecasts balanced slightly cooler weekend weather in the Northeast, according to <a href='https://www.cmegroup.com' target='_blank'>CME/NYMEX<\/a>. Open interest in the front month declined 1.2%, signaling some long liquidation.<\/p><p>Key technical levels: TTF finds support at <strong>€48.00<\/strong> (March 31 low) and resistance at <strong>€51.50<\/strong> (April 4 high). Henry Hub support sits at <strong>$2.95<\/strong> with resistance at <strong>$3.15<\/strong>. The TTF-HH spread remains elevated at €49.75-$3.08×10.3 ≈ €18.1/MWh, reflecting European supply stress.<\/p><p><strong>💡 Trade Ideas:<\/strong> (1) <strong>Long TTF Oct/Apr-26 Calendar Spread<\/strong> at current levels (~€4.50) if you believe the winter refill squeeze will materialize despite current shoulder season calm. (2) <strong>Buy TTF Dec €50 Calls / Sell €60 Calls<\/strong> (call spread) for defined upside exposure if Hormuz escalates. (3) <strong>Short HH Summer-26 / Long Winter-26<\/strong> calendar spread to play the US storage normalization curve.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>The market is underpricing the probability of a rapid Hormuz resolution. If Iran signals flexibility, TTF could gap down €5-7 overnight. Be selective with long exposure.<\/div><\/div>","sig":"Blaise 🧮"},{"t":"alert","badge":"⚡ 🚢 LNG & Flows","title":"Qatar Tankers Remain Diverted as Hormuz Enters Day 38","hook":"No breakthrough in Hormuz diplomacy as QatarEnergy extends force majeure at Ras Laffan. EU LNG sendout holds steady but arrivals queue in the Red Sea.","authorWord":"115 mtpa of LNG capacity offline or rerouted ≈ 25% of global trade. EU sendout ~490 mcm/d, down 3% from pre-crisis levels.","author":"Henry 🦉","details":"<p>EU LNG arrivals for the week of April 6-12 are tracking at <strong>27 cargoes<\/strong> (down from 31 last week), with <strong>12 vessels<\/strong> still diverted around the Cape of Good Hope due to the Hormuz closure, per <a href='https://www.kpler.com' target='_blank'>Kpler<\/a> tracking. Average sendout from EU terminals stands at <strong>490 mcm/d<\/strong> (week to Apr 7), <strong>▼-3%<\/strong> versus the pre-crisis baseline.<\/p><p>US LNG export utilization at major Gulf Coast terminals is running at <strong>87%<\/strong> of nameplate capacity (as of Apr 6), slightly below the 92% peak, as vessels face delays and charter rates surge to <strong>$250,000/day<\/strong> for Atlantic Basin routes. The TTF-JKM spread has widened to <strong>€18.50/MWh<\/strong>, incentivizing arbitrage when feasible.<\/p><p>Norwegian pipeline flows via Langeled and Europipe remain stable at <strong>312 mcm/d<\/strong> (nomination Apr 8), unchanged from yesterday. North African flows (Medgaz, Transmed) total <strong>48 mcm/d<\/strong>, with no unplanned outages reported. Planned maintenance at the <strong>Zeebrugge LNG terminal<\/strong> (Apr 10-15) will temporarily reduce Belgian import capacity by 30%.<\/p><p><strong>💡 Trade Ideas:<\/strong> (1) <strong>Long JKM-TTF Spread<\/strong> at current ~€18.50/MWh to capture Asian premium if Hormuz extends; target €25, stop at €14.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>The 3% sendout decline is modest given 25% of global capacity is affected. This suggests demand destruction or demand substitution is already occurring. The market may be overreacting to supply headlines.<\/div><\/div>","sig":"Henry 🦉"},{"t":"tech","badge":"⚡ ⚡ Power & Carbon","title":"Spark Spreads Under Pressure as Renewables Flood","hook":"Clean spark spreads are narrowing as high wind output tests the floor for gas-fired marginal pricing. Carbon markets remain steady, providing little relief for carbon-intensive coal generation.","authorWord":"High wind output across Northern Europe is pushing spot prices lower, tightening gas-to-power margins. Traders are increasingly wary of the current spark/dark spread convergence.","author":"Sage 🦎","details":"<p>Yesterday's EUA market showed relative calm, with December '26 futures settling at €78.45 (settle 07 Apr), down €0.85 from the previous session, per <a href='https://www.theice.com' target='_blank'>ICE<\/a>. The market is awaiting further clarity on EU industrial output data, which remains the primary regulatory catalyst for near-term volatility.<\/p><p>In the power spot markets, day-ahead baseload prices in Germany closed at €42.50/MWh (close 07 Apr), a decrease of €3.20, driven by aggressive wind forecasts for today. French and UK markets are showing similar trends, though tighter margins in the UK persist due to ongoing maintenance on key interconnectors, as reported by <a href='https://www.entsoe.eu' target='_blank'>ENTSO-E<\/a> and <a href='https://www.rte-france.com' target='_blank'>RTE eCO2mix<\/a>.<\/p><p>Currently, the clean spark spread is narrowly 'in-the-money' for efficient CCGTs compared to the clean dark spread, which remains significantly pressured by high carbon costs. 💡 <b>Trade Ideas:<\/b> (1) Consider a Long Clean Spark Spread (Buy Gas / Sell Power) if wind generation continues to exceed forecasts. (2) Evaluate a Bull Call Spread on Dec '26 Carbon futures (e.g., Buy €85 / Sell €95) if industrial demand shows signs of life in mid-April.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>Do not underestimate the potential for a sudden nuclear 'trip' in France to scramble these spreads overnight. The market is pricing in too much calm.<\/div><\/div>","sig":"Sage 🦎"},{"t":"analysis","badge":"📊 🌡️ Weather & Demand","title":"Shoulder Season Arrives with Mild Outlook, But HDD Deficit Persists","hook":"Europe's extended range forecast shows above-normal temperatures for Week 2-4, accelerating the seasonal demand decline. However, cumulative HDD remains 12% below 10-year average.","authorWord":"Mild April forecasts reduce heating demand, but the structural deficit from a cold March leaves EU storage starting injection season at 28% — the lowest April level since 2018.","author":"Sage 🦎","details":"<p>The ECMWF extended range (Week 2-4, Apr 15-29) forecasts <strong>above-normal temperatures<\/strong> across Northern Europe, with anomalies of <strong>+1.5°C to +2.5°C<\/strong> versus the 1991-2020 climatology, per <a href='https://www.ecmwf.int' target='_blank'>ECMWF<\/a>. This pattern is driven by a persistent positive NAO (+1.2), which is expected to keep Atlantic westerlies dominant and suppress cold air incursions.<\/p><p>Cumulative <strong>Heating Degree Days (HDD)<\/strong> for the 2025-2026 season (Oct 1 - Apr 7) stand at <strong>2,845<\/strong>, <strong>▼-12%<\/strong> below the 10-year average (3,235) and <strong>▼-8%<\/strong> below the 30-year average (3,095). The March 2026 HDD anomaly was particularly severe at <strong>-18%<\/strong> versus normal, which accelerated storage withdrawals and left Europe entering the injection season in a precarious position.<\/p><p>Norwegian hydro reservoir levels (as of Apr 5) are at <strong>47%<\/strong> of capacity, <strong>▲+5%<\/strong> above the 5-year average (42%) and <strong>▲+8%<\/strong> above year-ago levels, according to <a href='https://www.nve.no' target='_blank'>NVE<\/a>. This provides some buffer for gas-for-power demand, but wind generation forecasts for Week 2-4 show <strong>below-normal output<\/strong> in the North Sea (-15% vs average), partially offsetting the hydro advantage.<\/p><p><strong>💡 Trade Ideas:<\/strong> (1) <strong>Buy TTF Dec €45 Puts<\/strong> as cheap protection against an unexpected cold snap in Q4.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>The market is overreacting to the HDD deficit. With hydro +8% YoY and LNG imports holding (despite Hormuz), the refill challenge is manageable. The calendar spread premium is excessive.<\/div><\/div>","sig":"Sage 🦎"},{"t":"tech","badge":"📊 📦 Storage Watch","title":"EU Storage at 28.1% — Lowest April Level Since 2018","hook":"European gas storage entered the injection season at 28.1% full, significantly below the 5-year average of 41%. The refill equation is structurally challenged by the triple shock of low exit levels, Hormuz, and the Russian LNG ban.","authorWord":"To reach 90% by Nov 1, EU needs +62.9 percentage points in 207 days ≈ 0.304 pp/day. Historical average injection rate is 0.23 pp/day. The gap requires +32% above-normal injection.","author":"Blaise 🧮","details":"<p>EU gas storage as of <strong>April 7, 2026<\/strong> stands at <strong>28.1%<\/strong> full with <strong>320.5 TWh<\/strong> of volume, per <a href='https://agsi.gie.eu' target='_blank'>GIE AGSI+<\/a>. This is <strong>▼-12.9 pp<\/strong> below the 5-year average (41.0%) and <strong>▼-8.5 pp<\/strong> below year-ago levels (36.6%). Germany leads the deficit at 22.3% (vs 5Y avg 35.2%), while the Netherlands is marginally better at 31.8% (vs 5Y avg 44.1%).<\/p><p>US natural gas storage for the week ending <strong>April 3, 2026<\/strong> showed a net injection of <strong>+24 Bcf<\/strong>, bringing total working gas to <strong>1,786 Bcf<\/strong>, <strong>▲+142 Bcf<\/strong> above the 5-year average (1,644 Bcf) and <strong>▲+218 Bcf<\/strong> above year-ago levels (1,568 Bcf), according to <a href='https://www.eia.gov' target='_blank'>EIA Weekly Natural Gas Storage Report<\/a>. The injection pace is 18% above the 5-year average for this week.<\/p><p>End-of-season projection: At the current trajectory, EU storage would reach approximately <strong>82-85%<\/strong> by November 1, <strong>▼-5 to 8 pp<\/strong> short of the 90% regulatory mandate. Days of supply equivalent at current net injection rates (+0.21 pp/day) is <strong>293 days<\/strong>, but this assumes no demand spikes or supply disruptions — both of which are elevated risks.<\/p><p><strong>💡 Trade Ideas:<\/strong> (1) <strong>Long TTF Summer/Winter-26 Calendar Spread<\/strong> at current ~€4.00 — the structural supply-demand imbalance favors a steepening curve. (2) <strong>Buy TTF Nov €60 Calls<\/strong> as a binary bet on the refill failure scenario.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The 90% mandate has flexibility clauses for force majeure. If Hormuz persists beyond 60 days, the EU will likely invoke the security exemption and adjust the target downward. The spread premium overprices this risk.<\/div><\/div>","sig":"Blaise 🧮"},{"t":"alert","badge":"📊 💣 Geopolitics & Regulation","title":"Hormuz Day 38: Three-Shock Convergence Tests European Resilience","hook":"The Hormuz blockade, the April 25 Russian LNG ban on spot contracts, and the 28% storage exit level form a perfect storm for European gas markets. Diplomatic channels remain open but no breakthrough imminent.","authorWord":"115 mtpa LNG stranded ≈ 25% global trade. EU ban targets 14 bcm/yr Russian spot LNG. TurkStream at 15 mcm/d vs 42 mcm/d pre-war. Storage needs +32% above-normal injection to hit 90%.","author":"Henry 🦉","details":"<p><strong>Hormuz/Middle East:<\/strong> The Strait of Hormuz closure (Day 38) continues to strand approximately <strong>115 mtpa<\/strong> of LNG capacity, equivalent to <strong>25% of global LNG trade<\/strong>. Qatar (77 mtpa), UAE (15 mtpa), and Oman (12 mtpa) are the affected exporters. Historical precedent suggests closures of 48-72 hours typically cause 5-8% spot price spikes with 3-5 day recovery times, but a 7-day+ closure could trigger <strong>€10-15/MWh<\/strong> upside as inventories are tested. Current EU days-of-supply at 28% is <strong>42 days<\/strong> at normal demand but <strong>29 days<\/strong> at peak winter rates.<\/p><p><strong>EU Russian LNG Ban:<\/strong> The <strong>April 25, 2026<\/strong> deadline for the Russian LNG ban on spot contracts is now <strong>17 days away<\/strong>. The ban targets approximately <strong>14 bcm/yr<\/strong> of Russian spot LNG (vs 35 bcm/yr total Russian LNG imports to EU). Long-term contracts (≈21 bcm/yr) are exempt until 2027. Key receiving terminals include <strong>Zeebrugge<\/strong> (5 bcm/yr), <strong>Montoir<\/strong> (3 bcm/yr), and <strong>Gate<\/strong> (2 bcm/yr). Legal loopholes exist for transshipment and contract assignment, but enforcement is expected to be strict.<\/p><p><strong>Russia Pipeline Flows:<\/strong> <strong>TurkStream<\/strong> continues to deliver <strong>15 mcm/d<\/strong> to Turkey and Southern Europe (Hungary, Serbia, Austria), down from <strong>42 mcm/d<\/strong> pre-war levels — a <strong>64%<\/strong> reduction or <strong>10 bcm/yr<\/strong> impact. <strong>Nord Stream<\/strong> remains offline (sabotage Sep 2022). Transit via Ukraine is zero since Dec 2024. The aggregate loss of Russian pipeline gas to Europe is <strong>~120 bcm/yr<\/strong> versus 2021 levels.<\/p><p><strong>Regulatory Risk:<\/strong> The EU is debating amendments to the <strong>Emissions Trading System (ETS)<\/strong> that could weaken the carbon price floor to €60/t from €75/t, which would reduce the coal-gas switching price advantage by approximately <strong>€8-10/MWh<\/strong>. The <strong>storage mandate<\/strong> is under review for tightening to 92% by November 1, which would require an additional <strong>3.2 TWh<\/strong> of injection demand.<\/p><p><strong>HORMUZ SCENARIO MATRIX:<\/strong><\/p>\n<p><strong>Scenario:<\/strong> Naval drill/brief closure<br><strong>Duration:<\/strong> 12-24h<br><strong>Prob:<\/strong> 25%<br><strong>LNG Stranded:<\/strong> ~5 Mt<br><strong>EU Gap:<\/strong> None<br><strong>TTF Impact:<\/strong> ▲+€2-4<br><\/p><p><strong>Scenario:<\/strong> Tactical blockade<br><strong>Duration:<\/strong> 48-72h<br><strong>Prob:<\/strong> 35%<br><strong>LNG Stranded:<\/strong> ~15 Mt<br><strong>EU Gap:<\/strong> ~50 GWh/d<br><strong>TTF Impact:<\/strong> ▲+€5-8<br><\/p><p><strong>Scenario:<\/strong> Extended disruption<br><strong>Duration:<\/strong> 1-2 weeks<br><strong>Prob:<\/strong> 25%<br><strong>LNG Stranded:<\/strong> ~40 Mt<br><strong>EU Gap:<\/strong> ~120 GWh/d<br><strong>TTF Impact:<\/strong> ▲+€10-15<br><\/p><p><strong>Scenario:<\/strong> Prolonged conflict<br><strong>Duration:<\/strong> 1-3 months<br><strong>Prob:<\/strong> 15%<br><strong>LNG Stranded:<\/strong> ~100 Mt<br><strong>EU Gap:<\/strong> ~300 GWh/d<br><strong>TTF Impact:<\/strong> ▲+€20-30<br><\/p>\n<p><strong>💡 Trade Ideas:<\/strong> (1) <strong>Buy TTF Jun €55/€65 Call Spread<\/strong> for the tactical blockade scenario (35% prob). (2) <strong>Long TTF Q4-26 Futures<\/strong> for the extended disruption scenario (25% prob). (3) <strong>Buy TTF Out-of-the-Money Straddle<\/strong> (€45 puts / €60 calls) for binary exposure to the prolonged conflict tail (15% prob).<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>The scenario matrix overestimates duration risk. Historical data shows Hormuz closures average 3-5 days, not 1-3 months. The market is pricing in too much tail risk. Short volatility strategies offer better risk-reward.<\/div><\/div>","sig":"Henry 🦉"},{"t":"strategy","badge":"📊 🎯 Risk Flags & Outlook","title":"Three-Shock Convergence: The Market Is Pricing Diplomacy, Not Reality","hook":"Hormuz Day 38, Russian LNG ban in 17 days, and EU storage at 28% — the triple shock is priced as a risk premium rather than a supply deficit. The market consensus assumes a resolution that hasn't materialized.","authorWord":"Top risk: Hormuz extends beyond 60 days → structural LNG shortage. Bull: TTF Q4-26 at €65. Bear: Diplomatic breakthrough → TTF €40. Wildcard: Ukraine attacks disrupt Russian products → crude spike dragging gas.","author":"La Rédaction 🦊","details":"<p><strong>TOP 3 RISKS:<\/strong> (1) <strong>Hormuz Duration Mismatch:<\/strong> The market prices a 48-72 hour closure (TTF +€5-8) but historical analogies suggest 7-14 day closures are more likely in escalated conflicts. A 2-week closure would strand ~40 Mt of LNG, creating a 120 GWh/d supply gap that EU storage at 28% cannot absorb. (2) <strong>April 25 Russian LNG Ban:<\/strong> 17 days away, targeting 14 bcm/yr of spot supply. The market assumes transshipment loopholes will soften the impact, but enforcement is expected to be strict. (3) <strong>Refill Math Failure:<\/strong> EU needs +32% above-normal injection to hit 90% by Nov 1. Current trajectory points to 82-85%. If demand is 5% above normal or supply 5% below, the gap widens dramatically.<\/p><p><strong>BULL SCENARIO (35% prob):<\/strong> Hormuz extends beyond 60 days, forcing QatarEnergy to declare prolonged force majeure at Ras Laffan. EU storage struggles to inject above 0.25 pp/day. By October, TTF Q4-26 trades at <strong>€65-70/MWh<\/strong>. <strong>💡 Trade Structure:<\/strong> <strong>Long TTF Q4-26 Futures<\/strong> at current ~€52 or <strong>Buy TTF Oct €60 Calls / Sell €70 Calls<\/strong> for defined upside.<\/p><p><strong>BEAR SCENARIO (25% prob):<\/strong> Diplomatic breakthrough on Hormuz within 14 days, Qatar tankers resume normal routing. Russian LNG ban enforcement proves porous with 50% of spot volumes rerouted via transshipment. Mild spring continues. TTF slides to <strong>€40-42/MWh<\/strong> by May. <strong>💡 Trade Structure:<\/strong> <strong>Short TTF Jun Futures<\/strong> or <strong>Buy TTF Jun €45 Puts<\/strong>.<\/p><p><strong>WILD CARD SCENARIO (15% prob):<\/strong> Ukraine successfully attacks Russian refineries, global product markets tighten, crude spikes to $95/bbl, dragging gas higher via oil-indexed contracts and general energy contagion. TTF gaps <strong>▲+€10-15<\/strong> in 48 hours. <strong>💡 Trade Structure:<\/strong> <strong>Buy TTF Out-of-the-Money Straddle<\/strong> (€45 puts / €60 calls) for <strong>asymmetric exposure<\/strong> to the binary outcome.<\/p><p><strong>CATALYSTS TO WATCH:<\/strong> (1) <strong>Apr 12:<\/strong> UNSC emergency session on Hormuz — Russia/China veto blocks resolution, escalation risk. (2) <strong>Apr 15:<\/strong> EU Energy Ministers meeting on storage mandate enforcement. (3) <strong>Apr 20:<\/strong> QatarEnergy quarterly earnings — force majeure extension guidance. (4) <strong>Apr 25:<\/strong> Russian LNG spot ban deadline — enforcement clarity. (5) <strong>Apr 28:<\/strong> US-EU energy security summit — coordinated response options.<\/p><p><strong>CONVICTION MATRIX:<\/strong> The bull scenario has the highest <strong>conviction × probability<\/strong> score despite lower base probability because the asymmetric payoff (€15+ upside vs €8 downside) and structural refill deficit create a skewed risk-reward. The TTF Summer/Winter-26 calendar spread at ~€4.00 offers the best <strong>non-binary exposure<\/strong> to the structural imbalance.<\/p><p><strong>POSITIONING CONTEXT:<\/strong> The front-month curve remains in <strong>backwardation<\/strong> (Apr €49.75 / Oct €55), indicating near-term supply stress. Open interest in Q4 contracts is rising (+8% week-over-week), suggesting institutional positioning for the refill squeeze. Storage at 28% is the lowest April level since 2018 — the market has no memory of this starting point in the post-2022 regime.<\/p><p><strong>💡 Trade Ideas:<\/strong> (1) <strong>Long TTF Summer/Winter-26 Calendar Spread<\/strong> (Buy Oct, Sell Apr) at current ~€4.00 — structural conviction play, non-binary to geopolitics. (2) <strong>Buy TTF Q4-56 Straddle<\/strong> (€45 puts / €60 calls) — captures both bullish and bearish tail risks. (3) <strong>Long TTF Jun €55/€65 Call Spread<\/strong> — defined upside for Hormuz escalation scenario.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The convexity argument is flawed. The market has proven resilient to Hormuz for 38 days — each additional day of stalemate reduces the probability of escalation, not increases it. The calendar spread will compress if a diplomatic breakthrough occurs. The asymmetric payoff is a mirage.<\/div><\/div>","sig":"La Rédaction 🦊"},{"t":"analysis","badge":"🎲 Scénarios","title":"7 Scénarios — Le Conseil Prudent Face à l'Incertitude Hormuz","hook":"Le Conseil assigne 60% de probabilité au statu quo prolongé à Hormuz, 25% à une résolution diplomatique, et seulement 15% à l'escalade majeure. La patience du marché est la conviction dominante.","authorWord":"Convergence sur le scénario de base: blocus durable mais pas catastrophique. Divergence sur le timing de résolution — Dante est plus optimiste qu'Apex et Lyra.","author":"Le Conseil 🎲","details":"<div class='scenario-block'><h3>S1 — Blocus Hormuz Prolongé (60-90 jours) <span class='proba'>35%<\/span><\/h3><p>Le détroit reste fermé, QatarEnergy étend la force majeure. L'Europe compense via GNL US et Norvège, mais les premiums persistent. TTF se maintient €50-55/MWh.<\/p><p class='votes'>Apex 40% · Sage 35% · Nova 35% · Blaise 30% · Lyra 35% · Dante 25% · Felix 45%<\/p><\/div><div class='scenario-block'><h3>S2 — Résolution Diplomatique Partielle <span class='proba'>25%<\/span><\/h3><p>Accord limité: passage sécurisé pour tankers civils sous escorte ONUSIENNE. L'incertitude diminue, premiums s'effritent. TTF retourne €42-45/MWh.<\/p><p class='votes'>Apex 20% · Sage 30% · Nova 25% · Blaise 25% · Lyra 20% · Dante 35% · Felix 20%<\/p><\/div><div class='scenario-block'><h3>S3 — Escalade Militaire (attaque sur terminal Qatar) <span class='proba'>12%<\/span><\/h3><p>Frappe directe sur Ras Laffan ou maritime. 115 mtpa hors circuit durable. Panique sur les approvisionnements. TTF spike €70-80/MWh.<\/p><p class='votes'>Apex 15% · Sage 10% · Nova 10% · Blaise 15% · Lyra 10% · Dante 10% · Felix 12%<\/p><\/div><div class='scenario-block'><h3>S4 — Statu Quo Mouillé <span class='proba'>15%<\/span><\/h3><p>Harassement continu, passages sporadiques, incertitude perpétuelle. Le marché s'habitue, premiums se figent. TTF €48-52/MWh.<\/p><p class='votes'>Apex 10% · Sage 15% · Nova 15% · Blaise 15% · Lyra 20% · Dante 15% · Felix 15%<\/p><\/div><div class='scenario-block'><h3>S5 — Déroute Diplomatique (rejet proposition Iran) <span class='proba'>8%<\/span><\/h3><p>L'Iran rejette toute médiation, menace l'ensemble du Golfe. Risque de contagion aux champs pétroliers saoudis. TTF €65-75/MWh.<\/p><p class='votes'>Apex 10% · Sage 5% · Nova 10% · Blaise 5% · Lyra 5% · Dante 10% · Felix 5%<\/p><\/div><div class='scenario-block'><h3>S6 — Solution Technique (couloir maritime alternatif) <span class='proba'>4%<\/span><\/h3><p>Accord miracle sur route de contournement via Oman/Mer Rouge. Les tankers reprennent sans risque. Premiums s'effondrent. TTF €38-40/MWh.<\/p><p class='votes'>Apex 5% · Sage 5% · Nova 5% · Blaise 5% · Lyra 5% · Dante 5% · Felix 3%<\/p><\/div><div class='scenario-block'><h3>S7 — Conflit Régional Élargi <span class='proba'>1%<\/span><\/h3><p>Extension du conflit à Arabie Saoudite/EAU. 200+ mtpa de GNL menacés. Crise énergétique mondiale. TTF €85-100+/MWh.<\/p><p class='votes'>Apex 0% · Sage 0% · Nova 0% · Blaise 0% · Lyra 5% · Dante 0% · Felix 0%<\/p><\/div><p class='consensus'><strong>🎯 Consensus :<\/strong> Le Conseil converge sur un scénario central de blocus prolongé (S1 + S4 = 50%) avec résolution progressive (S2 = 25%). Les queues de risque (S3, S5, S7) totalisent 21% — suffisantes pour justifier des hedges asymétriques mais pas pour justifier des positions massives directionnelles.<\/p><div class='dissent'><div class='dissent-label'>🔥 Contre-narratif — Dante 🔥<\/div><div class='dissent-text'>Le Conseil sous-estime l'effet de fatigue. Après 60 jours, le marché aura normalisé le risque premium. Si un accord émerge, le gap sera brutal. Le scénario S2 est à 35% minimum, pas 25%.<\/div><\/div>","sig":"Le Conseil 🎲"},{"t":"analysis","badge":"📊 🌍 Scénario Géopolitique","title":"Géopolitique & Gaz — Délibération du Conseil","hook":"L'actualité des 48h est dominée par le veto russo-chinois à l'ONU sur Hormuz et les attaques ukrainiennes sur les raffineries russes. Le Conseil identifie 4 scénarios géopolitiques réels impactant le gaz.","authorWord":"Le veto ONUSIENNE renforce l'impasse. Les frappes ukrainiennes créent un nouveau front sur les produits raffinés, avec conséquences indirectes sur le gaz via pétrole-indexation.","author":"Le Conseil 🌍","details":"<div class='scenario-block'>\n  <h3>S1 — Impasse ONUSIENNE Confirmée (veto Russe/Chinois) <span class='proba'>40%<\/span><\/h3>\n  <p>Fait réel: Russie et Chine ont opposé leur veto à la résolution de sécurité sur Hormuz le 7 avril 2026. Conséquence gaz: aucune force multinationale ne peut forcer le passage. Le blocus persiste, premiums GNL restent élevés. TTF supporté à €48-55/MWh.<\/p>\n  <p class='votes'>Apex 45% · Sage 40% · Nova 35% · Blaise 40% · Lyra 40% · Dante 35% · Felix 45%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n  <h3>S2 — Escalade via Attaques Raffineries Russes <span class='proba'>25%<\/span><\/h3>\n  <p>Fait réel: Ukraine intensifie les frappes de drones sur les raffineries russes (Norsi, Kirishi). Conséquence gaz: réduction offre produits raffinés → pétrole brut spike → contrats gaz indexés pétrole tirent à la hausse. TTF €55-65/MWh via contagion pétrolière.<\/p>\n  <p class='votes'>Apex 20% · Sage 25% · Nova 30% · Blaise 20% · Lyra 25% · Dante 25% · Felix 30%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n  <h3>S3 — Médiation Qatar/Iran Secret <span class='proba'>20%<\/span><\/h3>\n  <p>Fait hypothétique mais ancré: Qatar agit comme médiateur entre l'Iran et l'Occident, avec garanties économiques. Conséquence gaz: réouverture progressive d'Hormuz sous protocole sécurisé. Premiums s'effritent en 2-3 semaines. TTF €40-45/MWh.<\/p>\n  <p class='votes'>Apex 15% · Sage 20% · Nova 20% · Blaise 25% · Lyra 15% · Dante 30% · Felix 15%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n  <h3>S4 — Ban Russe Spot LNG appliquée Strictement <span class='proba'>15%<\/span><\/h3>\n  <p>Fait réel: deadline 25 avril 2026 pour le ban spot LNG russe. L'UE confirme application stricte, sans boucles juridiques. Conséquence gaz: perte 14 bcm/yr sur terminal Zeebrugge, Montoir, Gate. TTF €50-58/MWh lors de l'entrée en vigueur.<\/p>\n  <p class='votes'>Apex 20% · Sage 15% · Nova 15% · Blaise 10% · Lyra 20% · Dante 10% · Felix 10%<\/p>\n<\/div>\n\n<p class='consensus'><strong>🎯 Consensus :<\/strong> Le Conseil identifie deux facteurs géopolitiques dominants: (1) L'impasse Hormuz renforcée par le veto ONUSIENNE (S1 = 40%) et (2) l'impact indirect des frappes ukrainiennes via pétrole (S2 = 25%). Le ban russe LNG (S4) est une certitude réglementaire mais son impact est partiel (14 bcm/yr sur ~500 bcm/an consommation UE).<\/p>\n\n<div class='dissent'><div class='dissent-label'>🔥 Contre-narratif — Dante 🔥<\/div><div class='dissent-text'>Le Conseil surévalue l'impact des frappes ukrainiennes. Les raffineries russes ont redondance, et la production pétrolière mondiale absorbera le choc. Le lien gaz-pétrole est affaibli par le découplage européen du gaz russe. S2 est à 15% max, pas 25%.<\/div><\/div>","sig":"Le Conseil 🌍"},{"t":"strategy","badge":"🗳️ Conseil — Verdict sur les Trades","title":"9/14 Trades Retenus — Le Conseil Élimine les Redondances et Contradictions","hook":"Le Conseil a validé 9 trades sur 14 proposés, éliminant 5 propositions: 3 redondances (T9, T11, T12) et 2 trades vagues (T5, T6). Thèmes dominants: calendar spreads TTF, exposition JKM-TTF, options structurées.","authorWord":"Top conviction: JKM-TTF spread (T4) avec entry/target/stop précis. Pire: T11 rejeté à l'unanimité pour contradiction avec T7 (inverse spark spread).","author":"Le Conseil ⚖️","details":"<h3>📊 Résultat du Vote<\/h3>\n<p>Sur 14 trades proposés par les 6 cartes rédactionnelles, le Conseil en a retenu <strong>9<\/strong> et rejeté <strong>5<\/strong>.<\/p>\n\n<h3>✅ Trades Validés (9)<\/h3>\n<ul>\n<li><strong>T1<\/strong>: Long TTF Oct/Apr-26 Calendar Spread (€4.50) — <em>Vote: 2 approve, 1 reject<\/em><\/li>\n<li><strong>T2<\/strong>: TTF Dec €50/€60 Bull Call Spread — <em>Vote: 3 approve (unanime)<\/em><\/li>\n<li><strong>T3<\/strong>: HH Summer/Winter Calendar Spread — <em>Vote: 2 approve, 1 amend<\/em><\/li>\n<li><strong>T4<\/strong>: Long JKM-TTF Spread (€18.50, target €25, stop €14) — <em>Vote: 3 approve (unanime)<\/em> ⭐<\/li>\n<li><strong>T7<\/strong>: Long Clean Spark Spread (Buy Gas / Sell Power) — <em>Vote: 2 approve, 1 reject<\/em><\/li>\n<li><strong>T8<\/strong>: Carbon Dec €85/€95 Bull Call Spread — <em>Vote: 3 approve (unanime)<\/em><\   document.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY;startTime=Date.now();deltaX=0;axis='';dragging=true;cards[cur].classList.remove('anim');},{passive:true});
  document.addEventListener('touchmove',e=>{if(!dragging)return;const dx=e.touches[0].clientX-startX;const dy=e.touches[0].clientY-startY;if(!axis){if(Math.abs(dx)>8||Math.abs(dy)>8){axis=Math.abs(dx)>Math.abs(dy)?'x':'y';}else return;}if(axis==='y')return;deltaX=dx;cards[cur].style.transform=`translate(-50%,-50%) translateX(${deltaX}px) rotate(${deltaX*0.012}deg)`;var p=Math.min(Math.abs(deltaX)/200,1);var sc=0.93+p*0.07;var op=0.4+p*0.6;var nxt=deltaX<0?cards[cur+1]:cards[cur-1];if(nxt){nxt.style.transform='translate(-50%,-50%) scale('+sc+')';nxt.style.opacity=op;}},{passive:true});
  document.addEventListener('touchend',e=>{if(!dragging)return;dragging=false;if(axis==='y'){axis='';return;}axis='';const card=cards[cur];card.classList.add('anim');if(cards[cur+1])cards[cur+1].classList.add('anim');if(cards[cur-1])cards[cur-1].classList.add('anim');const velocity=Math.abs(deltaX)/(Date.now()-startTime);const threshold=velocity>0.5?30:60;if(deltaX>threshold&&cur===0){window.location.href='../index.html';}else if(deltaX<-threshold&&cur===total-1){window.location.href='../index.html';}else if(deltaX<-threshold&&cur<total-1){cur++;update();}else if(deltaX>threshold&&cur>0){cur--;update();}else{card.style.transform='';}},{passive:true});
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&cur<total-1){cur++;update();}if(e.key==='ArrowLeft'&&cur>0){cur--;update();}});
  document.addEventListener('click',e=>{if(e.target.id==='restart')go(0);const article=e.target.closest('.home-article');if(article){const idx=parseInt(article.dataset.goto);if(!isNaN(idx))go(idx);}});
  /* === DESKTOP SPLIT-VIEW === */
  let dtShell=null, dtSelected=0;
  function buildDesktop(){
    if(dtShell)return;
    dtShell=document.createElement('div');
    dtShell.className='desktop-shell';
    // Sidebar
    const sb=document.createElement('nav');
    sb.className='dt-sidebar';
    const logoDate=DATA[0]&&DATA[0].home?`<div class="dt-logo">Gas Morning Brief</div><div class="dt-date">${DATA[0].date||'8 Avril 2026'}</div>`:`<div class="dt-logo">Gas Morning Brief</div><div class="dt-date">8 Avril 2026</div>`;
    sb.innerHTML=logoDate;
    DATA.forEach((d,i)=>{
      const item=document.createElement('div');
      item.className='dt-nav-item'+(i===0?' dt-selected':'');
      item.tabIndex=0;
      item.dataset.idx=i;
      const emoji=d.home?'📰':d.end?'✅':(d.badge||'').split(' ')[0]||'📄';
      const label=d.home?'Accueil':d.end?'Fin':(d.badge||'').split(' ').slice(1).join(' ')||'';
      const title=d.home?'Sommaire':d.end?'Briefing terminé':d.title||'';
      item.innerHTML=`<div class="dt-nav-badge">${emoji}</div><div class="dt-nav-info"><div class="dt-nav-label">${label}</div><div class="dt-nav-title">${title}</div></div><div class="dt-nav-arrow">›</div>`;
      item.addEventListener('click',()=>selectDesktop(i));
      sb.appendChild(item);
    });
    // Reader
    const rd=document.createElement('div');
    rd.className='dt-reader';
    rd.innerHTML='<div class="dt-reader-inner"></div>';
    dtShell.appendChild(sb);
    dtShell.appendChild(rd);
    document.body.appendChild(dtShell);
    selectDesktop(0);
  }
  function selectDesktop(idx){
    dtSelected=idx;
    const items=dtShell.querySelectorAll('.dt-nav-item');
    items.forEach((it,i)=>it.classList.toggle('dt-selected',i===idx));
    const d=DATA[idx];
    const inner=dtShell.querySelector('.dt-reader-inner');
    if(d.home){
      const arts=d.articles?d.articles.map(a=>`<div class="dt-nav-item" style="cursor:pointer;opacity:.7;padding:10px 14px;margin-bottom:4px;border-radius:10px;border:1px solid rgba(255,255,255,.06);" onclick="selectDesktop(${a.idx})"><div class="dt-nav-badge">${a.badge.split(' ')[0]}</div><div class="dt-nav-info"><div class="dt-nav-label">${a.badge.split(' ').slice(1).join(' ')}</div><div class="dt-nav-title">${a.title}</div></div><div class="dt-nav-arrow">›</div></div>`).join(''):'';
      inner.innerHTML=`<div class="dt-r-home-henry"><div class="label">🦊 L'Édito du Jour</div><div class="text">${d.henryWord||''}</div></div>${arts}`;
    } else if(d.end){
      inner.innerHTML=`<div style="text-align:center;padding:60px 0;"><div style="font-size:3.5rem;margin-bottom:16px;">🎉</div><h2 style="font-size:1.6rem;font-weight:800;margin-bottom:12px;">Briefing terminé !</h2><p style="color:var(--muted);font-size:1rem;margin-bottom:24px;line-height:1.5;">Vous avez parcouru le briefing du jour. À demain !</p><a href="../index.html" style="display:inline-block;padding:12px 32px;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;">📰 Toutes les éditions</a></div>`;
    } else {
      const authorHtml=d.authorWord?`<div class="dt-r-author"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author||''}</div></div>`:'';
      inner.innerHTML=`<span class="dt-r-badge ${d.t||''}">${d.badge||''}</span><h1 class="dt-r-title">${d.title||''}</h1>${authorHtml}<div class="dt-r-hook">${d.hook||''}</div><div class="dt-r-body">${d.details||''}</div><div class="dt-r-sig">Gas Morning Brief — 8 Avril 2026</div>`;
    }
    dtShell.querySelector('.dt-reader').scrollTop=0;
    // Scroll sidebar item into view
    items[idx]&&items[idx].scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  function destroyDesktop(){
    if(dtShell){dtShell.remove();dtShell=null;}
  }
  function checkDesktop(){
    if(window.innerWidth>=900){
      deck.style.display='none';
      buildDesktop();
      dtShell.style.display='';
    } else {
      if(dtShell)dtShell.style.display='none';
      deck.style.display='';
      update(false);
    }
  }
  // Keyboard nav for desktop
  document.addEventListener('keydown',e=>{
    if(window.innerWidth<900)return;
    if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();if(dtSelected<DATA.length-1)selectDesktop(dtSelected+1);}
    if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();if(dtSelected>0)selectDesktop(dtSelected-1);}
  });
  checkDesktop();window.addEventListener('resize',checkDesktop);
  // Theme toggle
  (function(){
    const btn=document.getElementById('themeToggle');
    const saved=localStorage.getItem('theme');
    if(saved==='light'){document.documentElement.classList.add('light');btn.textContent='☀️';}
    btn.addEventListener('click',()=>{
      const isLight=document.documentElement.classList.toggle('light');
      btn.textContent=isLight?'☀️':'🌙';
      localStorage.setItem('theme',isLight?'light':'dark');
    });
  })();
  </script>
</body>
</html>
