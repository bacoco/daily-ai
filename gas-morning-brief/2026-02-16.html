<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gas Morning Brief — 16 Février 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    html.light .details div[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }

        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }

      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }

      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }

        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }

      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }

      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }

      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }
      .dt-reader .dt-r-body p { margin-bottom: 18px; }
      .dt-reader .dt-r-body strong { color: #fff; font-weight: 600; }
      .dt-reader .dt-r-body a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }

      .dt-reader .dt-r-body .dissent { margin-top: 24px; padding: 16px 18px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
      .dt-reader .dt-r-body .dissent .dissent-label { font-family: 'Inter', sans-serif; font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
      .dt-reader .dt-r-body .dissent .dissent-text { font-size: .9rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
      .dt-reader .dt-r-author { margin-top: 20px; padding: 12px 16px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); }
      .dt-reader .dt-r-author .aw-text { font-family: 'Merriweather', serif; font-size: .88rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }

  <script>
  const DATA = [{"t":"home","home":true,"date":"16 Février 2026","henryWord":"Storage anxiety meets vortex risk on the last stretch of winter. EU inventories at 4-year lows and a stratospheric disruption flagged for late February create an asymmetrically bullish setup — but the Merz ETS bombshell and record LNG arrivals keep the lid on for now. Geneva talks today add a wildcard.","articles":[{"badge":"⚡ 💰 Price Action","title":"TTF Holds €31.67 Into Week — HH Steady at $3.24 as Markets Digest EIA Outlook","idx":1},{"badge":"⚡ 🚢 LNG & Flows","title":"Record LNG Season Hits 50 bcm — Rare China Reload Heads for Europe","idx":2},{"badge":"⚡ ⚡ Power & Carbon","title":"EUA Carnage Continues — Merz Reform Signal Sends Carbon to 8-Month Low","idx":3},{"badge":"📊 🌡️ Weather & Demand","title":"Polar Vortex Disruption Flagged for Late Feb — Alpine Snow Deficit Threatens Summer Hydro","idx":4},{"badge":"📊 📦 Storage Watch","title":"EU Storage at 4-Year Low (36.1%) — US Draws Outpace Forecasts at -249 Bcf","idx":5},{"badge":"📊 💣 Geopolitics & Regulation","title":"Geneva Talks Today — Merz ETS Bombshell Reshapes EU Carbon Policy Arc","idx":6},{"badge":"📊 🎯 Risk Flags & Outlook","title":"Vortex Risk Meets Storage Anxiety — Bull Case Building Beneath the Surface","idx":7}]},{"t":"alert","badge":"⚡ 💰 Price Action","title":"TTF Holds €31.67 Into Week — HH Steady at $3.24 as Markets Digest EIA Outlook","hook":"European gas benchmarks closed last week below €32 as milder weather eased heating fears. US nat gas holds near $3.24 with EIA projecting record output to cap upside.","authorWord":"TTF settled near €31.67 on Friday, retreating from January's €38+ highs as weather models softened. HH at $3.24 remains well below the EIA's 2026 average forecast of $4.30. The bearish overhang of rising US production meets bullish EU storage anxiety — a tug-of-war that keeps front-month pinned.","author":"Blaise 🧮","details":"<h4>Friday Settlements (close Fri 14 Feb)</h4><ul><li><b>TTF day-ahead:</b> ~€31.67/MWh (◆ flat to slightly lower week-on-week) — <a href='https://www.oilpriceapi.com/live/dutch-ttf-gas-price' target='_blank'>OilPriceAPI</a></li><li><b>Henry Hub spot:</b> $3.24/MMBtu (settle Fri 14 Feb) — <a href='https://www.oilpriceapi.com/live/natural-gas-price' target='_blank'>OilPriceAPI</a></li><li><b>NBP front-month:</b> ~83.50 p/th (close Fri 14 Feb), gapped lower to ~78.75 p/th mid-week — <a href='https://www.smart-energy.uk/post/daily-energy-market-report' target='_blank'>Smart Energy UK</a></li></ul><h4>Key Context</h4><p>TTF has dropped sharply from the January cold-snap highs (~€38/MWh), tracking milder weather forecasts and strong LNG sendout. However, EU storage at 4-year lows (36.1% as of Feb 9) keeps structural support underneath. The EIA's February STEO raised the 2026 HH average forecast to <a href='https://www.compressortech2.com/news/eia-raises-202627-gas-price-outlook-after-winter-storm/8113687.article' target='_blank'>$4.30/MMBtu</a> — 25% above January's estimate — citing winter storm drawdowns, but record US production forecast (>106 Bcf/d) should eventually cap upside.</p><p>⚠️ MONDAY NOTE: European markets (TTF, NBP) have NOT opened yet. All prices reflect Friday 14 Feb close. Asian markets may show early-week signals.</p><h4>Technical Levels</h4><p>TTF front-month support: €30.50 (200-day MA area), resistance: €33.50 (mid-Feb range high). HH: support $3.05, resistance $3.55.</p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎</div><div class='dissent-text'>The consensus that TTF has found its floor near €31 underestimates the polar vortex disruption risk flagged for late February. If cold air spills into NW Europe with storage already 30% below the 5Y average, we could see a violent squeeze back above €35. The milder-weather narrative is complacent given the stratospheric signals.</div></div>","sig":"Blaise 🧮 · Gas Morning Brief"},{"t":"alert","badge":"⚡ 🚢 LNG & Flows","title":"Record LNG Season Hits 50 bcm — Rare China Reload Heads for Europe","hook":"EU LNG imports have surpassed 50 bcm since October — a record pace. A rare reloaded cargo from China's Zhejiang Ningbo terminal signals Europe's persistent pull on global molecules.","authorWord":"Europe's LNG appetite continues to set records, with 50+ bcm imported since the heating season began. The Seapeak Glasgow, loaded at China's Ningbo terminal, is a rare eastward-to-westward reload signaling tight European balances. Pipeline flows remain stable post-Ukraine transit halt.","author":"Henry 🦉","details":"<h4>LNG Arrivals & Sendout</h4><p>EU LNG imports since October 2025 have exceeded <b>50 bcm</b>, on track for a record heating-season total — <a href='https://tass.com/economy/2085747' target='_blank'>TASS/ENTSOG data</a>. Strong sendout rates continue across NW European terminals as storage drawdowns accelerate.</p><h4>Unusual Cargo Flow</h4><p>A rare LNG reload from <b>China's Zhejiang Ningbo terminal</b> is heading toward Europe via Singapore. The Seapeak Glasgow tanker loaded in late January — a highly unusual eastward-to-westward flow indicating that European spot premiums are pulling cargoes even from Chinese inventories — <a href='https://www.bloomberg.com/news/articles/2026-02-12/gas-hungry-europe-to-get-rare-lng-shipment-reloaded-from-china' target='_blank'>Bloomberg</a>.</p><h4>Pipeline & Terminal Status</h4><p>Norwegian flows via Langeled and Europipe remain at seasonal norms. Ukraine transit remains at zero since the Jan 1, 2025 contract expiry — no change. Greece is advancing the <a href='https://www.euronews.com/business/2026/02/12/greece-bets-on-lng-corridor-to-power-europes-post-russia-energy-future' target='_blank'>Vertical Corridor LNG project</a> with US EXIM backing, targeting a second Alexandroupolis FSRU.</p><h4>Spread Snapshot (Fri 14 Feb)</h4><p>TTF ~€31.67/MWh (~$11/MMBtu) vs HH $3.24/MMBtu — Atlantic basin arb remains wide open at ~$7.75/MMBtu. TTF vs JKM spread compressed, reducing Asian competition for spot cargoes.</p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎</div><div class='dissent-text'>Record LNG inflows are masking a fragile reality. Europe's 50 bcm import feat is demand-driven, not supply-driven — once Asian buyers return post-Lunar New Year, the cargo competition will intensify. The China reload is a one-off curiosity, not a trend. Watch JKM spreads re-widening as a leading indicator.</div></div>","sig":"Henry 🦉 · Gas Morning Brief"},{"t":"tech","badge":"⚡ ⚡ Power & Carbon","title":"EUA Carnage Continues — Merz Reform Signal Sends Carbon to 8-Month Low","hook":"EU carbon allowances crashed 8% to €72.18 on Merz's ETS reform signal — the biggest single-day drop since May 2022. Spark spreads narrow as gas eases but coal switching remains out of the money.","authorWord":"The EUA flash crash to €72.18 marks a regime shift in carbon pricing expectations. Germany's incoming chancellor has opened the door to ETS structural reform, rattling compliance buyers. For gas traders, lower carbon = lower gas-for-power switching costs = marginally bearish TTF support.","author":"Sage 🦎","details":"<h4>EUA Carbon Price</h4><p>EU ETS benchmark allowances fell as much as <b>8% to €72.18/t</b> on Wednesday 12 Feb — the largest single-day drop since May 2022 — after Germany's Friedrich Merz signaled openness to reforming the EU ETS — <a href='https://www.bloomberg.com/news/articles/2026-02-12/eu-carbon-prices-drop-after-germany-s-merz-urges-market-revamp' target='_blank'>Bloomberg</a>. The Dec-26 contract had already been sliding, settling at €78.73/t on Feb 7, down 3% on the week — <a href='https://www.prestigebusiness.energy/marketreports/energy-market-update09february2026' target='_blank'>Prestige Business</a>.</p><p>Carbon prices <a href='https://www.globalbankingandfinance.com/explainer-what-drove-fall-eu-carbon-prices-matter/' target='_blank'>fell to their lowest since August 2025</a>, dragging renewable energy stocks lower as subsidy assumptions are repriced.</p><h4>Power Markets (Fri 14 Feb close)</h4><p>⚠️ MONDAY: European power auctions not yet concluded. Friday's day-ahead auctions reflected milder weather and lower carbon costs. Gas-to-power spark spreads narrowed as both TTF and EUA declined in tandem. Coal dark spreads remain firmly out-of-the-money at current EUA levels — no fuel switching pressure.</p><h4>Grid & Generation</h4><p>Wind generation across NW Europe ran above forecast late last week, suppressing spot power prices. No major nuclear or interconnector outages reported heading into the week. Alpine hydro reservoir levels remain below 5-year norms due to low snowpack — a structural concern flagged by <a href='https://oilprice.com/Energy/Energy-General/How-a-Snow-Deficit-in-the-Alps-Will-Put-Europes-Energy-System-Under-Pressure.html' target='_blank'>OilPrice.com</a>.</p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉</div><div class='dissent-text'>Markets are overreacting to the Merz headline. Any ETS reform requires qualified majority in the European Council and co-decision with the Parliament — this is a multi-year legislative process, not an imminent policy change. The EUA selloff is a buying opportunity for compliance buyers; carbon floors will hold above €65 structurally.</div></div>","sig":"Sage 🦎 · Gas Morning Brief"},{"t":"analysis","badge":"📊 🌡️ Weather & Demand","title":"Polar Vortex Disruption Flagged for Late Feb — Alpine Snow Deficit Threatens Summer Hydro","hook":"Stratospheric signals point to a polar vortex disruption around Feb 22-25, risking a late-winter cold blast across Europe. Meanwhile, record-low Alpine snowpack threatens summer hydropower output.","authorWord":"The polar vortex disruption entering official monitoring is the key structural risk for gas markets this week. If cold air spills into NW Europe while storage sits at 4-year lows, withdrawal rates could accelerate dramatically. The Alpine snow deficit adds a longer-term bullish tail risk for gas-for-power demand into summer.","author":"Sage 🦎","details":"<h4>Extended Range Outlook (Week 2-4)</h4><p>A <b>polar vortex disruption</b> is entering official risk territory around February 22-25, with strong wave interactions already visible in stratospheric data — <a href='https://www.lcsinfonia.co.uk/13-2023-a-polar-vortex-disruption-on-february-22-2026-enters-official-monitoring-strong-wave-interactions-are-already-visible-reports-atmospheric-analyst-andrej-flis-mauvaise-nouvelle-fo/' target='_blank'>Analyst Andrej Flis</a>. A second assessment flags <a href='https://www.directpathways.co.uk/12-173165-a-polar-vortex-disruption-on-february-25-2026-moves-into-official-risk-territory-wind-reversal-is-one-of-the-clearest-indicators-explains-simon-warburton-mauvaise-nouvelle-for-gr/' target='_blank'>Feb 25 as the critical window</a>. If the vortex splits, cold Arctic air could pour into NW Europe during the last week of February and into March — extending heating season demand.</p><h4>HDD Trajectory</h4><p>Cumulative HDDs since October are running above the 10-year average, driven by the January cold snap. A vortex-driven late-Feb cold spell would push the 2025/26 heating season into the upper quartile of demand years. Current milder conditions (mid-Feb) have given brief respite but have not offset the cumulative deficit.</p><h4>Hydro & Renewables</h4><p>Alpine snowpack is at <b>multi-year lows</b>, threatening summer hydropower output across Norway, Switzerland, and Austria — <a href='https://www.reuters.com/markets/commodities/europes-low-snow-cover-sets-stage-even-higher-gas-burn-2026-02-11/' target='_blank'>Reuters</a>. Low snow cover translates directly into higher gas-for-power burn from Q2 onwards. Wind generation has been seasonally adequate but would collapse under the high-pressure blocking pattern associated with a vortex disruption.</p><h4>Demand Structure</h4><p>Residential heating demand is tracking 5-10% above 5-year norms. Industrial demand remains subdued by macro weakness. The net effect keeps total gas demand elevated but not at crisis levels — unless the vortex scenario materializes.</p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮</div><div class='dissent-text'>Polar vortex disruptions make headlines but deliver cold to Europe only about 50% of the time — the cold lobe often tilts toward North America or Siberia instead. The current ensemble models show significant disagreement on the European cold pathway. Pricing in a guaranteed cold blast from stratospheric signals alone would be premature.</div></div>","sig":"Sage 🦎 · Gas Morning Brief"},{"t":"tech","badge":"📊 📦 Storage Watch","title":"EU Storage at 4-Year Low (36.1%) — US Draws Outpace Forecasts at -249 Bcf","hook":"EU gas inventories hit 36.1% on Feb 9 — the lowest for date since 2022. US storage withdrew 249 Bcf, beating forecasts, with EIA projecting end-March below 1.9 Tcf.","authorWord":"The EU storage picture is increasingly uncomfortable: 36.1% full and 30% below the 5-year average, with analysts warning of 23-25% by end-March. The US -249 Bcf draw signals stronger-than-expected demand. Both sides of the Atlantic face a tight refill setup heading into injection season.","author":"Blaise 🧮","details":"<h4>EU Storage (AGSI+ data, Feb 9)</h4><p>Total EU storage: <b>36.1% full</b> — the lowest reading for this date since 2022. The 5-year average deficit has doubled since November to <b>16 bcm</b> — <a href='https://europeangashub.com/european-gas-storage-deficit-deepens-as-winter-withdrawals-accelerate.html' target='_blank'>European Gas Hub</a>. Withdrawal rates have surged 25% above the 5Y average since January.</p><p>Worst performers: Netherlands and Croatia, where facilities are critically low — <a href='https://netherlands.news-pravda.com/en/eu/2026/02/11/11034.html' target='_blank'>Pravda Netherlands</a>.</p><p>Analysts at Montel warn EU storage could slump to an <b>8-year low of 23-25% by end-March</b> if cold weather materializes — <a href='https://montelnews.com/news/6956f982-72f2-4161-97f3-40a7c20c347c/eu-gas-storage-levels-may-slump-to-8-year-low-analysts' target='_blank'>Montel News</a>.</p><h4>US Storage (EIA report, week ending Feb 7)</h4><p>Working gas withdrawal: <b>-249 Bcf</b>, missing consensus estimates (indicating larger-than-expected draw) — <a href='https://www.indexbox.io/blog/natural-gas-storage-misses-forecast-bullish-signal-for-prices/' target='_blank'>IndexBox</a>. EIA's February STEO projects end-March storage below <b>1.9 Tcf</b>, 8% below its January forecast — <a href='https://www.mrt.com/business/oil/article/natural-gas-prices-eia-forecast-21345717.php' target='_blank'>MRT/EIA</a>.</p><h4>Refill Outlook</h4><p>EU's 90% storage mandate by Nov 1 looks increasingly challenging. Starting from a potential 23-25% low means Europe needs to inject ~65-67 percentage points over April-October — above the historical average injection pace. This will require sustained high LNG imports throughout summer, keeping a floor under TTF.</p><p>YoY comparison: storage is ~10 percentage points lower than Feb 2025, the weakest position since the 2021/22 energy crisis buildup.</p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉</div><div class='dissent-text'>The 90% mandate is a target, not a law of physics. In 2023, the EU easily exceeded it because LNG was abundant and demand was crushed. Record US LNG export capacity coming online in 2026 (Plaquemines Ph2, Golden Pass) means the molecules exist. The refill panic premium in summer TTF is likely overdone — watch for a sharp contango collapse if spring arrives mild.</div></div>","sig":"Blaise 🧮 · Gas Morning Brief"},{"t":"alert","badge":"📊 💣 Geopolitics & Regulation","title":"Geneva Talks Today — Merz ETS Bombshell Reshapes EU Carbon Policy Arc","hook":"Russia-Ukraine-US trilateral talks resume in Geneva today (Feb 17-18). Meanwhile, Germany's Merz has thrown EU carbon market reform into play, creating a new policy uncertainty layer for energy markets.","authorWord":"Two structural storylines dominate: the Geneva peace talks could shift sanctions/transit expectations if progress materializes, while the Merz ETS reform signal represents the biggest threat to EU carbon pricing since the Market Stability Reserve was introduced. Both are slow-burn catalysts with outsized gas market implications.","author":"Henry 🦉","details":"<h4>Russia-Ukraine: Geneva Round 3</h4><p>Trilateral talks between Russia, Ukraine, and the US resume in <b>Geneva on February 17-18</b>, following two earlier rounds in Abu Dhabi — <a href='https://www.aljazeera.com/amp/news/2026/2/13/russia-and-ukraine-to-hold-next-round-of-talks-in-geneva-next-week' target='_blank'>Al Jazeera</a>. US envoys Witkoff and Kushner will participate. The energy infrastructure strike ceasefire continues to hold, though the Kremlin has used past ceasefires to rearm — <a href='https://understandingwar.org/research/russia-ukraine/russian-offensive-campaign-assessment-february-5-2026/' target='_blank'>ISW</a>.</p><p>Gas market implication: Any progress toward a broader ceasefire could eventually reopen discussion of Ukrainian transit infrastructure. But the Jan 2025 transit contract expiry means zero Russian pipeline gas currently flows via Ukraine — any restart would require a new commercial framework.</p><h4>EU Carbon Policy Disruption</h4><p>Germany's incoming Chancellor Friedrich Merz has signaled openness to <b>structural EU ETS reform</b>, triggering the largest EUA single-day crash (-8%) since 2022 — <a href='https://www.bloomberg.com/news/articles/2026-02-12/eu-carbon-prices-drop-after-germany-s-merz-urges-market-revamp' target='_blank'>Bloomberg</a>. The updated 2026 EUA auction programme already shows an <a href='https://archive.ph/GHQDt' target='_blank'>8.9% reduction after maritime cancellation</a>. UK ETS also plunged >10% in sympathy.</p><p>The <a href='https://www.fastmarkets.com/insights/eu-ets-reform-impending-cost-shocks-for-eu-producers/' target='_blank'>CBAM phase-in from 2026</a> adds complexity — lower EUA prices would widen the gap between EU internal carbon costs and border adjustment tariffs.</p><h4>Sanctions & Supply</h4><p>Greece and Malta blocked an EU proposal to replace the Russian oil price cap with a services ban — indicating fragmentation in EU sanctions consensus. Arctic LNG 2 remains under US sanctions pressure but continues seeking workaround shipping solutions.</p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮</div><div class='dissent-text'>The market is pricing Geneva talks as a potential game-changer, but the 28-point and 20-point plans have both been rejected. The gap between Russian demands and Ukrainian/Western red lines remains enormous. Any transit restart is 12-18 months away at best, even in an optimistic scenario. Don't trade gas on ceasefire headlines.</div></div>","sig":"Henry 🦉 · Gas Morning Brief"},{"t":"strategy","badge":"📊 🎯 Risk Flags & Outlook","title":"Vortex Risk Meets Storage Anxiety — Bull Case Building Beneath the Surface","hook":"The convergence of 4-year low storage, polar vortex disruption risk, and weak Alpine hydro creates an asymmetrically bullish setup. But record LNG supply and ETS reform uncertainty cap the topside.","authorWord":"Three-way collision ahead: storage at decade lows meets polar vortex risk meets EUA regime uncertainty. The bull case (cold + low storage + weak hydro) has higher magnitude than the bear case (mild finish + record LNG). Positioning favors caution — this is a week to watch Geneva and stratospheric charts equally closely.","author":"La Rédaction 🦊","details":"<h4>TOP 3 RISKS (ranked by probability × impact)</h4><ol><li><b>Polar Vortex Cold Blast (prob: 40%, impact: HIGH)</b> — Stratospheric disruption flagged for Feb 22-25 could send cold air into NW Europe during last week of February. With EU storage at 36.1% and falling, a sustained cold spell could accelerate withdrawals to crisis-era rates and push TTF back above €35.</li><li><b>EU Storage Refill Panic (prob: 65%, impact: MEDIUM-HIGH)</b> — If storage exits winter at 23-25%, the summer refill requirement becomes the dominant price driver from April. Summer TTF contango would widen, pulling spot prices higher to incentivize early injection.</li><li><b>ETS Reform Uncertainty (prob: 30%, impact: MEDIUM)</b> — Merz's signal could evolve into formal legislative proposals by Q2. Prolonged EUA weakness below €70 would shift gas-for-power economics and compress spark spreads.</li></ol><h4>BULL SCENARIO (1-2 weeks)</h4><p>Polar vortex disruption delivers 7-10 days of below-normal temperatures across NW Europe starting Feb 24. Storage withdrawals spike to 3+ bcm/week. Wind generation collapses under high-pressure blocking. TTF gaps higher to €34-36, HH follows on sympathy and cold US forecasts. JKM firms as Asian buyers compete for spot LNG.</p><h4>BEAR SCENARIO (1-2 weeks)</h4><p>Vortex disruption fizzles or cold tilts toward North America. Milder European temps into early March accelerate the end of heating season. Record LNG arrivals continue. EUA stays depressed below €72, dragging gas-for-power demand expectations. TTF drifts to €29-30 support zone.</p><h4>CATALYSTS TO WATCH THIS WEEK</h4><ul><li><b>Mon-Tue Feb 17-18:</b> Geneva trilateral talks — any progress shifts sanctions/transit narrative</li><li><b>Wed Feb 19:</b> AGSI+ storage update (data through ~Feb 16) — watch for acceleration below 35%</li><li><b>Thu Feb 20:</b> EIA weekly storage report — another large draw would be bullish HH</li><li><b>Fri-Sat Feb 21-22:</b> Stratospheric model updates — vortex disruption timing/magnitude clarity</li><li><b>Ongoing:</b> JKM-TTF spread — Asian demand restart post-Lunar New Year</li></ul><h4>POSITIONING CONTEXT</h4><p>The TTF forward curve is in backwardation for prompt months but contango from Q2 onward — reflecting refill anxiety. Storage + weather alignment suggests the market is under-hedged for upside risk. The EUA crash has introduced a new variable that complicates the traditional gas-carbon correlation trade.</p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉</div><div class='dissent-text'>The 'perfect storm' narrative is seductive but historically unreliable. Every February brings vortex fears; delivery to Europe is a coin flip. More importantly, the demand side is structurally weaker than 2021/22 — EU industrial gas consumption is still ~15% below pre-crisis peaks. The real risk is overpaying for weather premium that evaporates in March.</div></div>","sig":"La Rédaction 🦊 · Gas Morning Brief"},{"t":"end","end":true,"disclaimer":"This document is an automated summary for informational purposes only. It does not constitute investment advice, trading recommendation, or regulated financial analysis. Data comes from free public sources, potentially delayed (15-30 min for prices, D+1 for EIA/GIE stocks). Figures may contain errors from scraping or AI interpretation. Always verify on primary sources before any decision. Generated by LLM — qualitative analyses reflect statistical patterns, not expert judgment."}];

      c.innerHTML = `

        </div>`;
    } else if (d.end) {
      c.innerHTML = `
        <div class="hdr"><span class="badge end">✅ Terminé</span><div class="dots">${dots(i)}</div></div>
        <div class="end-content">
          <div class="em">🎉</div>
          <h2>Briefing terminé !</h2>
          <p>Vous avez parcouru le briefing du jour.<br>À demain !</p>
          <a href="../index.html" style="display:inline-block;padding:12px 32px;border:none;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;box-shadow:0 0 25px rgba(59,130,246,.4);margin-bottom:12px;">📰 Toutes les éditions</a><br><button id="restart">🔄 Recommencer</button><div style="margin-top:20px;padding:14px 16px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);border-radius:10px;font-size:.7rem;color:var(--muted);line-height:1.5;text-align:left;">⚠️ AVERTISSEMENT — Ce document est un exercice expérimental de veille automatisée produit par intelligence artificielle. Il ne constitue EN AUCUN CAS un conseil en investissement, une recommandation de trading, ni une analyse financière réglementée au sens de la directive MiFID II ou du Code monétaire et financier (art. L541-1). Les « scénarios de marché » présentés sont des hypothèses pédagogiques générées par des modèles de langage — ils ne reflètent pas l\u2019avis d\u2019un professionnel agréé. Les données proviennent de sources publiques, potentiellement retardées ou erronées. Toute décision d\u2019investissement prise sur la base de ce document relève de la seule responsabilité du lecteur. L\u2019auteur n\u2019est pas enregistré comme Conseiller en Investissement Financier (CIF) auprès de l\u2019AMF. Ce contenu est fourni à titre informatif et expérimental uniquement.</div>
          <small>← Swipez à gauche pour revenir</small>
        </div>`;
    } else {
      const authorWordHtml = d.authorWord ? `<div class="author-word"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author}</div></div>` : '';
      c.innerHTML = `
        <div class="hdr"><span class="badge ${d.t}">${d.badge}</span><div class="dots">${dots(i)}</div></div>
        <div class="title-zone"><h1>${d.title}</h1></div>
        <div class="scroll-cta"><span><i>↓</i> Lire plus</span></div>
        <div class="scroll-zone"><div class="scroll-inner">
          ${authorWordHtml}
          <div class="hook">${d.hook}</div>
          <div class="details">${d.details}<div class="sig">Gas Morning Brief — 16 Février 2026</div></div>
        </div></div>`;
    }
    deck.appendChild(c);
  });

  function dots(active) { let s=''; for(let i=0;i<total;i++) s+=`<span class="dot${i===active?' on':''}"></span>`; return s; }
  const cards = deck.querySelectorAll('.card');
  function update(anim=true) {
    cards.forEach((c,i)=>{
      c.classList.toggle('anim',anim);
      c.classList.remove('prev','active','next','behind'); c.style.opacity='';
      if(i===cur)c.classList.add('active'); else if(i===cur+1||i===cur-1)c.classList.add('behind'); else if(i<cur)c.classList.add('prev'); else c.classList.add('next');
      c.style.transform='';
      c.querySelectorAll('.dot').forEach((d,j)=>d.classList.toggle('on',j===cur));
    });
  }
  function go(i){if(i>=0&&i<total){cur=i;update();}}
  const dateKey='Gas Morning Brief-16-Février-2026';
  if(!localStorage.getItem(dateKey)){setTimeout(()=>{hint.classList.add('hide');localStorage.setItem(dateKey,'1');},2000);}else hint.style.display='none';
  
  document.querySelectorAll('.scroll-zone, .home-content').forEach(function(sz){
    var card = sz.closest('.card');
    if(!card) return;
    sz.addEventListener('scroll', function(){
      card.classList.toggle('scrolled', sz.scrollTop > 10);
    }, {passive:true});
  });
  let startY=0,axis='';
  document.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY;startTime=Date.now();deltaX=0;axis='';dragging=true;cards[cur].classList.remove('anim');},{passive:true});
  document.addEventListener('touchmove',e=>{if(!dragging)return;const dx=e.touches[0].clientX-startX;const dy=e.touches[0].clientY-startY;if(!axis){if(Math.abs(dx)>8||Math.abs(dy)>8){axis=Math.abs(dx)>Math.abs(dy)?'x':'y';}else return;}if(axis==='y')return;deltaX=dx;cards[cur].style.transform=`translate(-50%,-50%) translateX(${deltaX}px) rotate(${deltaX*0.012}deg)`;var p=Math.min(Math.abs(deltaX)/200,1);var sc=0.93+p*0.07;var op=0.4+p*0.6;var nxt=deltaX<0?cards[cur+1]:cards[cur-1];if(nxt){nxt.style.transform='translate(-50%,-50%) scale('+sc+')';nxt.style.opacity=op;}},{passive:true});
  document.addEventListener('touchend',e=>{if(!dragging)return;dragging=false;if(axis==='y'){axis='';return;}axis='';const card=cards[cur];card.classList.add('anim');if(cards[cur+1])cards[cur+1].classList.add('anim');if(cards[cur-1])cards[cur-1].classList.add('anim');const velocity=Math.abs(deltaX)/(Date.now()-startTime);const threshold=velocity>0.5?30:60;if(deltaX>threshold&&cur===0){window.location.href='../index.html';}else if(deltaX<-threshold&&cur===total-1){window.location.href='../index.html';}else if(deltaX<-threshold&&cur<total-1){cur++;update();}else if(deltaX>threshold&&cur>0){cur--;update();}else{card.style.transform='';}},{passive:true});
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&cur<total-1){cur++;update();}if(e.key==='ArrowLeft'&&cur>0){cur--;update();}});
  document.addEventListener('click',e=>{if(e.target.id==='restart')go(0);const article=e.target.closest('.home-article');if(article){const idx=parseInt(article.dataset.goto);if(!isNaN(idx))go(idx);}});
  /* === DESKTOP SPLIT-VIEW === */
  let dtShell=null, dtSelected=0;
  function buildDesktop(){
    if(dtShell)return;
    dtShell=document.createElement('div');
    dtShell.className='desktop-shell';
    // Sidebar
    const sb=document.createElement('nav');
    sb.className='dt-sidebar';
    const logoDate=DATA[0]&&DATA[0].home?`<div class="dt-logo">Gas Morning Brief</div><div class="dt-date">${DATA[0].date||'16 Février 2026'}</div>`:`<div class="dt-logo">Gas Morning Brief</div><div class="dt-date">16 Février 2026</div>`;
    sb.innerHTML=logoDate;
    DATA.forEach((d,i)=>{
      const item=document.createElement('div');
      item.className='dt-nav-item'+(i===0?' dt-selected':'');
      item.tabIndex=0;
      item.dataset.idx=i;
      const emoji=d.home?'📰':d.end?'✅':(d.badge||'').split(' ')[0]||'📄';
      const label=d.home?'Accueil':d.end?'Fin':(d.badge||'').split(' ').slice(1).join(' ')||'';
      const title=d.home?'Sommaire':d.end?'Briefing terminé':d.title||'';
      item.innerHTML=`<div class="dt-nav-badge">${emoji}</div><div class="dt-nav-info"><div class="dt-nav-label">${label}</div><div class="dt-nav-title">${title}</div></div><div class="dt-nav-arrow">›</div>`;
      item.addEventListener('click',()=>selectDesktop(i));
      sb.appendChild(item);
    });
    // Reader
    const rd=document.createElement('div');
    rd.className='dt-reader';
    rd.innerHTML='<div class="dt-reader-inner"></div>';
    dtShell.appendChild(sb);
    dtShell.appendChild(rd);
    document.body.appendChild(dtShell);
    selectDesktop(0);
  }
  function selectDesktop(idx){
    dtSelected=idx;
    const items=dtShell.querySelectorAll('.dt-nav-item');
    items.forEach((it,i)=>it.classList.toggle('dt-selected',i===idx));
    const d=DATA[idx];
    const inner=dtShell.querySelector('.dt-reader-inner');
    if(d.home){
      const arts=d.articles?d.articles.map(a=>`<div class="dt-nav-item" style="cursor:pointer;opacity:.7;padding:10px 14px;margin-bottom:4px;border-radius:10px;border:1px solid rgba(255,255,255,.06);" onclick="selectDesktop(${a.idx})"><div class="dt-nav-badge">${a.badge.split(' ')[0]}</div><div class="dt-nav-info"><div class="dt-nav-label">${a.badge.split(' ').slice(1).join(' ')}</div><div class="dt-nav-title">${a.title}</div></div><div class="dt-nav-arrow">›</div></div>`).join(''):'';
      inner.innerHTML=`<div class="dt-r-home-henry"><div class="label">🦊 L'Édito du Jour</div><div class="text">${d.henryWord||''}</div></div>${arts}`;
    } else if(d.end){
      inner.innerHTML=`<div style="text-align:center;padding:60px 0;"><div style="font-size:3.5rem;margin-bottom:16px;">🎉</div><h2 style="font-size:1.6rem;font-weight:800;margin-bottom:12px;">Briefing terminé !</h2><p style="color:var(--muted);font-size:1rem;margin-bottom:24px;line-height:1.5;">Vous avez parcouru le briefing du jour. À demain !</p><a href="../index.html" style="display:inline-block;padding:12px 32px;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;">📰 Toutes les éditions</a></div>`;
    } else {
      const authorHtml=d.authorWord?`<div class="dt-r-author"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author||''}</div></div>`:'';
      inner.innerHTML=`<span class="dt-r-badge ${d.t||''}">${d.badge||''}</span><h1 class="dt-r-title">${d.title||''}</h1>${authorHtml}<div class="dt-r-hook">${d.hook||''}</div><div class="dt-r-body">${d.details||''}</div><div class="dt-r-sig">Gas Morning Brief — 16 Février 2026</div>`;
    }
    dtShell.querySelector('.dt-reader').scrollTop=0;
    // Scroll sidebar item into view
    items[idx]&&items[idx].scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  function destroyDesktop(){
    if(dtShell){dtShell.remove();dtShell=null;}
  }
  function checkDesktop(){
    if(window.innerWidth>=900){
      deck.style.display='none';
      buildDesktop();
      dtShell.style.display='';
    } else {
      if(dtShell)dtShell.style.display='none';
      deck.style.display='';
      update(false);
    }
  }
  // Keyboard nav for desktop
  document.addEventListener('keydown',e=>{
    if(window.innerWidth<900)return;
    if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();if(dtSelected<DATA.length-1)selectDesktop(dtSelected+1);}
    if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();if(dtSelected>0)selectDesktop(dtSelected-1);}
  });
  checkDesktop();window.addEventListener('resize',checkDesktop);
  // Theme toggle
  (function(){
    const btn=document.getElementById('themeToggle');
    const saved=localStorage.getItem('theme');
    if(saved==='light'){document.documentElement.classList.add('light');btn.textContent='☀️';}
    btn.addEventListener('click',()=>{
      const isLight=document.documentElement.classList.toggle('light');
      btn.textContent=isLight?'☀️':'🌙';
      localStorage.setItem('theme',isLight?'light':'dark');
    });
  })();
  </script>
</body>
</html>
