<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gas Morning Brief — 16 Février 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    html.light .details div[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }

        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }

      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }

      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }

        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }

      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }

      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }

      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }
      .dt-reader .dt-r-body p { margin-bottom: 18px; }
      .dt-reader .dt-r-body strong { color: #fff; font-weight: 600; }
      .dt-reader .dt-r-body a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }

      .dt-reader .dt-r-body .dissent { margin-top: 24px; padding: 16px 18px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
      .dt-reader .dt-r-body .dissent .dissent-label { font-family: 'Inter', sans-serif; font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
      .dt-reader .dt-r-body .dissent .dissent-text { font-size: .9rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
      .dt-reader .dt-r-author { margin-top: 20px; padding: 12px 16px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); }
      .dt-reader .dt-r-author .aw-text { font-family: 'Merriweather', serif; font-size: .88rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }

  <script>
  const DATA = [{"t":"home","home":true,"date":"16 Février 2026","henryWord":"Storage anxiety meets stratospheric uncertainty. TTF holds €32 as EU inventories slide toward decade lows, while a polar vortex disruption could extend heating season into March. The Merz ETS bombshell adds a volatility layer — but the real story is whether record LNG inflows and weak Asian demand can offset the tightest European storage setup since 2018.","articles":[{"badge":"⚡ 💰 Price Action","title":"Gas prices edge higher into weekend — TTF €32.36, HH $3.24","idx":1},{"badge":"⚡ 🚢 LNG & Flows","title":"LNG & Flows Snapshot","idx":2},{"badge":"⚡ ⚡ Power & Carbon","title":"EUA crashes 8% on Merz reform signal — spark spreads widening","idx":3},{"badge":"📊 🌡️ Weather & Demand","title":"Stratospheric warming event could flip late-Feb/March cold — heating season extension risk","idx":4},{"badge":"📊 📦 Storage Watch","title":"Deficit Deepens: EU Storage on Track for Lowest End-of-Winter Since 2018","idx":5},{"badge":"📊 💣 Geopolitics & Regulation","title":"Geopolitics & Regulation — Structural Shifts & Emerging Risks","idx":6},{"badge":"📊 🎯 Risk Flags & Outlook","title":"Top 3 Risks: SSW Cold Snap × Low Storage × ETS Reform Uncertainty","idx":7}]},{"t":"alert","badge":"⚡ 💰 Price Action","title":"Gas prices edge higher into weekend — TTF €32.36, HH $3.24","hook":"TTF +2.2% w/w as storage fears offset milder forecasts; JKM slides $1.20 on weak Asian demand","authorWord":"TTF firmed to €32.36/MWh on low-storage anxiety despite warmer outlooks. HH steady at $3.24. JKM slid to $10.70 as Asian spot demand faded. NBP Mar-26 at 77.23p/th.","author":"Blaise 🧮","details":"<h3>🔥 Friday 14 Feb — Close of Week Snapshot</h3><p><strong>Benchmark:</strong> TTF front-month (Mar-26)<br><strong>Price:</strong> €32.36/MWh<br><strong>Move:</strong> +€0.69 (+2.2%) vs 13 Feb<br><strong>Signal:</strong> ⬆ Firming<br></p><p><strong>Benchmark:</strong> Henry Hub spot<br><strong>Price:</strong> $3.24/MMBtu<br><strong>Move:</strong> +$0.02 (+0.6%)<br><strong>Signal:</strong> ➡ Flat<br></p><p><strong>Benchmark:</strong> NBP front-month (Mar-26)<br><strong>Price:</strong> 77.23 p/th<br><strong>Move:</strong> −0.9% day / +2.1% w/w<br><strong>Signal:</strong> ⬆ Weekly uptick<br></p><p><strong>Benchmark:</strong> JKM spot (NE Asia)<br><strong>Price:</strong> $10.70/MMBtu<br><strong>Move:</strong> −$1.20 w/w<br><strong>Signal:</strong> ⬇ Sliding<br></p><h3>📊 What's driving this?</h3><ul><li><b>TTF:</b> Storage anxiety persists — EU stocks drawn down aggressively through Jan cold snap. Milder February forecasts have capped the upside, but the market continues to price a risk premium for refill season. Goldman Sachs <a href='https://www.qcintel.com/article/goldman-trims-ttf-natgas-forecast-on-eu-coal-reprieve-proposals-58305.html' target='_blank'>trimmed its TTF forecast</a> citing EU coal phase-out reprieve proposals, yet front-month still firmed on the week.</li><li><b>Henry Hub:</b> Post-storm normalization continues. EIA's Feb STEO <a href='https://www.compressortech2.com/news/eia-raises-202627-gas-price-outlook-after-winter-storm/8113687.article' target='_blank'>raised its 2026 HH average to $4.30/MMBtu</a> (+5% vs Jan outlook) on Winter Storm Fern production impacts. Current spot well below that level.</li><li><b>JKM:</b> Asian spot LNG <a href='https://www.energyintel.com/0000019c-45db-df6d-abbf-cfdb82160000' target='_blank'>fell to $10.70/MMBtu</a> — limited buying interest from NE Asian importers as mild weather and healthy inventories reduce urgency.</li><li><b>NBP:</b> UK gas <a href='https://www.smart-energy.uk/post/daily-energy-market-report' target='_blank'>traded mixed</a> — day-ahead spot at 80.92p/th (+1.9% d/d) but forward curves easing as electricity prices drop 11% monthly.</li></ul><h3>📐 Technical Levels (front-month)</h3><p><strong>:</strong> TTF Mar-26<br><strong>Support:</strong> €30.50 (Feb low)<br><strong>Resistance:</strong> €33.80 (late-Jan high)<br></p><p><strong>:</strong> HH Mar-26<br><strong>Support:</strong> $3.00 (psychological)<br><strong>Resistance:</strong> $3.75 (post-storm retracement)<br></p><p>TTF is consolidating in a €30.50–33.80 range. A break above could signal re-test of Jan highs. HH wedged between $3.00 floor and $3.75 ceiling — the EIA's $4.30 annual forecast implies upside if weather-driven demand materializes again.</p><h3>📈 Volume / Positioning</h3><p>Feb26 HH contract settlement saw extreme volatility and a <a href='https://www.qcintel.com/article/henry-hub-volatility-led-to-nymex-circuit-breaker-failure-report-58344.html' target='_blank'>NYMEX circuit-breaker failure</a> — a technical glitch exacerbated by options-related positioning. This may have distorted open interest readings around expiry. European LNG imports estimated at <a href='https://naturalgasintel.com/news/european-natural-gas-prices-again-swing-lower-as-lng-imports-near-record-high/' target='_blank'>3.96 Mt for the week</a>, near record highs, suggesting physical market well-supplied even as futures hold firm.</p><h3>⏰ Overnight / Asian Session</h3><p>JKM's $1.20 slide signals weak Asian pull — if sustained, this could cap TTF upside as LNG cargoes redirect to Europe, adding supply pressure. Monitor Monday's TTF open for any weekend weather model shifts.</p><p><i>Sources: <a href='https://fred.stlouisfed.org/series/DHHNGSP' target='_blank'>FRED/EIA</a>, <a href='https://www.smart-energy.uk/post/daily-energy-market-report' target='_blank'>Smart Energy UK</a>, <a href='https://www.energyintel.com/0000019c-45db-df6d-abbf-cfdb82160000' target='_blank'>Energy Intelligence</a>, <a href='https://www.qualenergia.it/pro/documenti/quota-rinnovabili-4-9-21-31-pun-5-9-21-e-mwh-11309-petrolio-wti-b-6929-co2-3-9-21-e-ton-6133/' target='_blank'>QualEnergia</a>. Prices as of Friday 14 Feb close / last available.</i></p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎</div><div class='dissent-text'>The consensus reads TTF firmness as storage-driven anxiety, but this may be misplaced. Record LNG imports (3.96 Mt/wk) and Goldman's forecast trim suggest the physical market is better supplied than futures imply. If March weather confirms the milder trend, TTF could retrace toward €28–29 faster than the market expects. The real risk may not be undersupply — it could be complacency about oversupply.</div></div>","sig":"Blaise 🧮 · Gas Morning Brief"},{"t":"alert","badge":"⚡ 🚢 LNG & Flows","title":"LNG & Flows Snapshot","hook":"Critical Baltic ice disruption, rare China cargo reload, and tightening TTF-HH spread","authorWord":"Rugen LNG terminal blocked by extreme ice since Feb 5, disrupting German winter supplies. First China-Europe reload since 2022 signals weak Asian demand. TTF-HH spread compression near $4/MMBtu. North African flows steady but Medgaz capacity constrained.","author":"Henry 🦉","details":"<h2>🚢 EU LNG Arrivals & Terminal Operations</h2>\n\n<p><strong>RUGEN TERMINAL CRITICAL:</strong> Deutsche Regas's floating LNG terminal on Germany's Baltic coast faces severe disruptions from extreme ice conditions since <strong>February 5</strong>. Multiple vessels delayed:</p>\n\n<ul>\n<li><strong>Maran Gas Nice</strong> — Extended delay at Neptun FSRU beyond scheduled departure</li>\n<li><strong>Minerva Amorgos</strong> — Forced to retreat after failed ice breach attempt in Strelasund</li>\n<li><strong>Icebreaker Neuwerk</strong> — Broke down Feb 14, heading to Rostock for inspection</li>\n<li><strong>Arkona</strong> — Only vessel attempting cargo operations, situation unresolved</li>\n</ul>\n\n<p>German gas reserves already low amid winter demand; operator declining comment on injection levels.</p>\n\n<p><strong>RARE CHINA RELOAD:</strong> <strong>Seapeak Glasgow</strong> loaded cargo from <strong>Zhejiang Ningbo terminal</strong> in late January and is now en route to Europe — marking the <strong>first China-to-Europe reload in four years</strong>. Vessel tracking via Kpler confirms Europe-bound course. Highlights weak Asian demand as Chinese end-users switch to cheaper alternatives and maintain high inventories. CNOOC has been reselling cargoes for reloading over recent weeks. Australia also sent three cargoes toward South America/Europe in past month.</p>\n\n<p><strong>EU LNG IMPORTS:</strong> Kpler data shows imports at <strong>seasonal highs</strong> in early 2026 as Europe replaces lost Russian pipeline flows post-Ukraine invasion. Northwest Europe accounts for nearly half global LNG supply due to capacity expansions at <strong>Gate (Netherlands)</strong> and <strong>Zeebrugge (Belgium)</strong>. Kpler projects 21% growth in EU LNG imports this year driven by storage drawdown.</p>\n\n<h2>📊 Key Spread Snapshot</h2>\n\n<p><strong>TTF vs HH:</strong> Spread compressed to <strong>~$4/MMBtu</strong> in December 2025 as TTF prices dropped below US LNG marginal costs. Strong LNG inflows to Europe combined with contrasting US dynamics drove tightening. ICE's extended trading window (aligning TTF/NBP with Henry Hub peak liquidity) creating continuous arbitrage opportunities for US LNG. Forward curves showing price compression persisting into Q2 2026.</p>\n\n<p><strong>TTF vs JKM:</strong> Asian premium narrowing as both benchmarks trading below <strong>$10/MMBtu</strong> mid-December. Weak Asian demand allowing cargo diversion to Europe. JKM-TTF spread at year-to-date high of <strong>$2.70/MMBtu</strong> in September 2024; current spread indicates Asia still dominates but window rotating toward Europe.</p>\n\n<p><strong>Arbitrage Window:</strong> Transatlantic arbitrage remains open but narrowing. At $4/MMBtu spread, US LNG to Europe economical but margins compressing. Asia-Europe spread favoring Europe reloads when vessels available.</p>\n\n<h2>🇺🇸 US LNG Export Utilization</h2>\n\n<p>US export flows estimated at <strong>~19.4 bcf/day</strong> in early February (ship-tracking data). US LNG boom lowering European energy costs as massive supply wave from US and Qatar projected to nearly halve European traded gas prices by 2030 vs 2025 levels. Infrastructure limits and regional fundamentals keeping HH and TTF semi-interconnected.</p>\n\n<p><strong>Key Terminals:</strong> No major unplanned outages reported in last 48 hours. Freeport, Sabine Pass, Corpus Christi operating at normal utilization. Capacity additions from QatarEnergy and US Phase 2 projects coming online 2026-2027.</p>\n\n<h2>🔌 Pipeline Flows & Nominations</h2>\n\n<p><strong>NORWEGIAN PIPELINES:</strong> Limited nomination data available in last 48h. Langeled and Europipe typically running at 80-90% capacity during winter drawdown. No reported unplanned outages on Norwegian continental shelf infrastructure.</p>\n\n<p><strong>NORTH AFRICAN CORRIDORS:</strong></p>\n\n<ul>\n<li><strong>Medgaz (Algeria→Spain):</strong> Operating at near-nominal capacity; 1/3 capacity expansion planned but not yet completed</li>\n<li><strong>TransMed (Algeria→Italy):</strong> Operating well below capacity; Eni targeting progressive ramp-up but flows constrained by infrastructure limitations</li>\n<li><strong>MEG (Algeria→Spain/Portugal):</strong> Closed</li>\n</ul>\n\n<p>Combined TransMed + MedGaz capacity <strong>42 bcm/year</strong> total, but actual exports max ~<strong>22-25 bcm</strong> due to technical constraints. Algeria accounts for ~11% of EU gas imports; no quick fix for replacing Russian volumes.</p>\n\n<p><strong>RUSSIAN TRANSIT:</strong> Ukraine transit route effectively ended Jan 2025. EU Parliament resolution (Dec 2025) sets phase-out: Russian LNG imports banned by end-2026, pipeline gas by Sept 30, 2027. Slovakia seeking exemptions; 16th sanctions package (Feb 2025) failed to include LNG ban due to opposition.</p>\n\n<h2>⚠️ Terminal Maintenance & Outages — TODAY</h2>\n\n<p><strong>CRITICAL — Germany (Rugen FSRU):</strong> Ice disruption ongoing since Feb 5, worsening Feb 14-15. Vessels unable to dock; sendout curtailed. Duration unknown — icebreaker shortage complicating recovery. <strong>Impact: Reduced injections into German grid during cold snap.</strong></p>\n\n<p><strong>Bangladesh (Moheshkhali FSRU):</strong> One floating terminal shut down for maintenance; Titas Gas warning severe low pressure until Feb 16 midnight. <em>(Non-EU but noted for global LNG vessel availability)</em></p>\n\n<p><strong>Planned Maintenance:</strong> No major EU LNG terminal outages scheduled for Feb 16. Routine maintenance at several terminals during shoulder season (March-April).</p>\n\n<hr>\n\n<h3>📚 Sources</h3>\n<ul>\n<li><a href=\"https://germany.news-pravda.com/en/russia/2026/02/15/115821.html\" target=\"_blank\">Rugen LNG Terminal Ice Disruption (Pravda Germany)</a></li>\n<li><a href=\"https://gcaptain.com/gas-hungry-europe-to-get-rare-lng-shipment-reloaded-from-china/\" target=\"_blank\">Seapeak Glasgow China Reload (Bloomberg via gCaptain)</a></li>\n<li><a href=\"https://montelnews.com/news/dba4982d-577c-4c52-83b2-7e07bb665859/eu-lng-imports-set-to-soar-21-this-year-on-storage-slump-kpler\" target=\"_blank\">Kpler EU LNG Import Forecast (Montel News)</a></li>\n<li><a href=\"https://europeangashub.com/ttf-prices-drop-below-us-lng-costs-as-the-ttf-henry-spread-tightens.html\" target=\"_blank\">TTF-HH Spread Analysis (European Gas Hub)</a></li>\n<li><a href=\"https://naturalgasintel.com/news/ices-longer-trading-window-to-align-ttf-nbp-with-henry-hub-peak-liquidity/\" target=\"_blank\">ICE TTF-HH Trading Window (Natural Gas Intelligence)</a></li>\n<li><a href=\"https://globallnghub.com/jkm-ttf-price-spread-at-highest-level-year-to-date.html\" target=\"_blank\">JKM-TTF Spread Data (Global LNG Hub)</a></li>\n<li><a href=\"https://www.realinstitutoelcano.org/en/analyses/another-round-of-algerian-gas-for-europe/\" target=\"_blank\">Algerian Pipeline Capacity (Real Instituto Elcano)</a></li>\n<li><a href=\"https://www.bruegel.org/analysis/end-russian-gas-transit-ukraine-and-options-eu\" target=\"_blank\">Ukraine Transit Impact (Bruegel)</a></li>\n<li><a href=\"https://agsi.gie.eu/\" target=\"_blank\">GIE AGSI — EU Storage Data</a></li>\n<li><a href=\"https://alsi.gie.eu\" target=\"_blank\">GIE ALSI — LNG Terminal Data</a></li>\n<li><a href=\"https://transparency.entsog.eu/\" target=\"_blank\">ENTSOG Transparency Platform</a></li>\n</ul>\n\n<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎</div><div class='dissent-text'>The Rugen ice disruption, while headline-grabbing, affects a single 4.4 bcm/year FSRU — marginal in EU's 400 bcm+ demand matrix. Germany has sufficient buffer storage and grid interconnectors to absorb temporary sendout loss. More interesting: China reload reversing the East-West flow. That's structural, not seasonal. If Asian demand stays suppressed into Q2, Europe becomes global LNG sink of last resort. TTF's downside protection evaporates. Watch reload patterns from China and Australia — they're leading indicators of global demand destruction.</div></div>","sig":"Henry 🦉 · Gas Morning Brief"},{"t":"tech","badge":"⚡ ⚡ Power & Carbon","title":"EUA crashes 8% on Merz reform signal — spark spreads widening","hook":"Carbon plunged to €72 as Germany's Merz floats ETS reform; gas-to-power margins expanding as coal economics deteriorate","authorWord":"EUA hit €72.18 on Feb 12, biggest drop since May 2022, after Merz floated ETS reform. Spark spreads widening as gas stays competitive vs coal. Wind output strong across NW Europe.","author":"Sage 🦎","details":"<h3>💨 EUA Carbon — Historic Plunge</h3><p>EU Allowances suffered their <b>worst session since May 2022</b>, falling as much as <b>8% to €72.18/tCO2</b> on ICE Endex (12 Feb) after German Chancellor Friedrich Merz <a href='https://www.bloomberg.com/news/articles/2026-02-11/merz-says-eu-should-be-open-to-revising-carbon-market' target='_blank'>called for the EU to consider revising or delaying carbon market rules</a> if they don't enable industrial decarbonization. This is the first time a major EU leader has openly questioned the ETS timeline since its 2023 reform.</p><p>Reuters <a href='https://www.reuters.com/sustainability/climate-energy/what-drove-fall-eu-carbon-prices-why-does-it-matter-2026-02-13/' target='_blank'>reported</a> the selloff was amplified by spec liquidation and compliance sellers front-running potential regulatory easing. EUA settled around <b>€73-74</b> by Friday 14 Feb after partial recovery.</p><h3>⚡ Spark vs Dark Spread</h3><p><a href='https://www.energyintel.com/0000019c-52b9-df6d-abbf-dbf9d8c80002' target='_blank'>Energy Intelligence data (12 Feb)</a> shows gas-fired spark spreads <b>widening</b> across NW Europe as the EUA crash reduces carbon costs for gas plants proportionally less than for coal (higher emission factor). At TTF €32/MWh and EUA ~€73:</p><ul><li><b>Gas (50% efficiency):</b> fuel+carbon cost ~€100/MWh — spark spread positive in peak hours</li><li><b>Coal (38% efficiency):</b> fuel+carbon cost higher on per-MWh basis — dark spread compressed</li></ul><p>Gas remains <b>in the money</b> for peak and shoulder generation across Germany and UK. Coal switching threshold pushed higher by the EUA drop but coal still uneconomical at current API2 levels.</p><h3>🔌 Power Spot Prices</h3><p>Day-ahead auctions for Friday 14 Feb:</p><p><strong>Market:</strong> Germany (DE)<br><strong>Price:</strong> ~€85-95/MWh<br><strong>Note:</strong> Below Jan peaks, supported by mild weather<br></p><p><strong>Market:</strong> France (FR)<br><strong>Price:</strong> ~€80-90/MWh<br><strong>Note:</strong> Nuclear fleet at ~75% availability<br></p><p><strong>Market:</strong> UK (GB)<br><strong>Price:</strong> ~£75-85/MWh<br><strong>Note:</strong> Wind output capping prices<br></p><p>Weekend prices expected lower on reduced industrial demand.</p><h3>☢️ Nuclear & Interconnectors</h3><p>No major unplanned nuclear trips reported this week. French fleet availability stable around 75% — <a href='https://www.rte-france.com/eco2mix/les-donnees-de-marche' target='_blank'>RTE eCO2mix</a> shows adequate output. Cross-border flows normal; no interconnector outages flagged on <a href='https://transparency.entsoe.eu/' target='_blank'>ENTSO-E Transparency</a>.</p><h3>🌬️ Renewables</h3><p>Strong wind generation across NW Europe through the weekend, with output above seasonal norms. This is capping power prices and reducing gas-for-power call. Solar contribution minimal (February, high latitudes). If wind sustains into next week, gas demand for power could ease further.</p><p><i>Sources: <a href='https://www.bloomberg.com/news/articles/2026-02-12/eu-carbon-prices-drop-after-germany-s-merz-urges-market-revamp' target='_blank'>Bloomberg</a>, <a href='https://www.reuters.com/sustainability/climate-energy/what-drove-fall-eu-carbon-prices-why-does-it-matter-2026-02-13/' target='_blank'>Reuters</a>, <a href='https://www.energyintel.com/0000019c-52b9-df6d-abbf-dbf9d8c80002' target='_blank'>Energy Intelligence</a>, <a href='https://transparency.entsoe.eu/' target='_blank'>ENTSO-E</a></i></p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉</div><div class='dissent-text'>The Merz ETS comments are political theatre ahead of German coalition talks — the ETS reform is EU-level legislation requiring qualified majority, and no formal proposal exists. Carbon at €72 is a buying opportunity, not a regime change. Watch the recovery: if EUA reclaims €78 by mid-week, the Merz discount is fully priced out. The real driver for power prices remains weather, not carbon politics.</div></div>","sig":"Sage 🦎 · Gas Morning Brief"},{"t":"analysis","badge":"📊 🌡️ Weather & Demand","title":"Stratospheric warming event could flip late-Feb/March cold — heating season extension risk","hook":"Polar vortex disruption entering official monitoring for Feb 22; La Niña collapse reshaping spring outlook. Late cold snap would stress already-low EU storage.","authorWord":"Stratospheric warming event monitored for Feb 22 could disrupt polar vortex, bringing late cold to Europe in late Feb-March. La Niña collapsing to El Niño. HDD deficit narrowing.","author":"Sage 🦎","details":"<h3>🌀 Week 2-4 Outlook: Stratospheric Warming in Play</h3><p>A <b>Sudden Stratospheric Warming (SSW) event</b> is entering official monitoring for around <b>February 22</b>, according to atmospheric analyst Andrej Flis. <a href='https://www.severe-weather.eu/long-range-2/spring-2026-forecast-la-nina-collapse-europe-seasonal-weather-fa/' target='_blank'>Severe Weather Europe reports</a> strong wave interactions already visible in the stratosphere, with the warming anomaly forecast to propagate downward into late February and early March.</p><p>If the SSW disrupts the polar vortex significantly, the downstream effect would be a <b>cold pattern shift over Northern/Central Europe</b> in the Week 3-4 window (early-mid March). This is precisely the period when the market assumes heating demand is winding down.</p><p><b>Key implication:</b> A late cold snap extending heating season by 2-3 weeks would accelerate storage withdrawals at a time when EU stocks are already ~10 percentage points below the 5-year average.</p><h3>📉 HDD Trajectory</h3><p>Cumulative Heating Degree Days for the 2025-26 winter season are tracking <b>above the 10-year average</b> for NW Europe, driven by the January cold snap. February has been milder so far, narrowing the cumulative deficit. However:</p><ul><li>If the SSW delivers a late-Feb cold snap, cumulative HDDs could end the season <b>5-8% above normal</b></li><li>ECMWF extended range shows <b>above-normal temperature probability declining</b> for Week 3-4</li><li>NOAA CPC: La Niña transitioning to ENSO-neutral by March, rapid shift toward El Niño by summer</li></ul><h3>💧 Hydro & Wind Structural</h3><p>Norwegian reservoir levels tracking <b>near the 5-year average</b> — no structural concern for hydro generation. Alpine snowpack adequate. Wind generation has been <b>above seasonal norms</b> in February, reducing gas-for-power demand. However, wind output typically drops in March-April transition period.</p><h3>🏭 Demand Structure</h3><p>Industrial gas demand across Europe remains <b>subdued</b> relative to pre-2022 levels — demand destruction from high prices proved partially permanent. Residential heating demand is the swing factor. ECMWF seasonal model suggests above-normal temps for March overall, but the SSW risk introduces a <b>cold tail scenario</b> that the market is not pricing.</p><p><i>Sources: <a href='https://www.severe-weather.eu/long-range-2/spring-2026-forecast-la-nina-collapse-europe-seasonal-weather-fa/' target='_blank'>Severe Weather Europe</a>, <a href='https://www.lcsinfonia.co.uk/13-2023-a-polar-vortex-disruption-on-february-22-2026-enters-official-monitoring-strong-wave-interactions-are-already-visible-reports-atmospheric-analyst-andrej-flis-mauvaise-nouvelle-fo/' target='_blank'>LCS Infonia</a>, NOAA CPC, ECMWF</i></p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮</div><div class='dissent-text'>SSW events have a mixed track record for surface-level cold delivery — roughly 60% result in meaningful cold spells at ground level. The market has seen this movie before and tends to fade the SSW premium within days if models don't confirm surface impacts. More importantly, even a 2-week heating extension in March would draw EU storage by maybe 3-4 percentage points — uncomfortable but not catastrophic given current refill infrastructure. The real structural driver is summer injection pace, not winter tail risk.</div></div>","sig":"Sage 🦎 · Gas Morning Brief"},{"t":"tech","badge":"📊 📦 Storage Watch","title":"Deficit Deepens: EU Storage on Track for Lowest End-of-Winter Since 2018","hook":"EU 5-year storage deficit doubled to 16 bcm; US inventories at 2,214 Bcf after consecutive heavy withdrawals","authorWord":"EU storage deficit doubled since November to 16 bcm, tracking toward 25% end-of-season — lowest since Beast from the East. US at 2,214 Bcf, EIA sees sub-1,900 Tcf by March.","author":"Blaise 🧮","details":"<h3>🇪🇺 EU Storage — Accelerating Drawdown</h3><p>EU storage stood at <b>~35.6%</b> as of 12 Feb (prev. edition), continuing a steep decline from 37% at the start of February. The <b>5-year deficit has doubled since November</b>, widening from 8 bcm to over <b>16 bcm</b> — inventories now sit <b>30% below the 5-year average</b>.</p><p><b>Key country positions (as of mid-Feb):</b></p><ul><li>🇩🇪 Germany: <b>&lt;25%</b> — lowest for this date in recorded history</li><li>🇳🇱 Netherlands: <b>~20%</b></li><li>🇫🇷 France: <b>~27%</b></li><li>NW Europe broadly trending <b>below 30%</b></li></ul><p>Drivers: colder weather + 7% YoY gas demand increase (~4 bcm) since Jan 1, plus resumed piped exports to Ukraine (+0.9 bcm). Storage withdrawals are running <b>~25% above the 5-year average</b> since the start of 2026.</p><h3>🇺🇸 US Storage — Post-Storm Normalisation</h3><p>EIA reported working gas at <b>2,214 Bcf</b> for week ending 6 Feb, following a <b>-249 Bcf</b> withdrawal (vs -256 Bcf expected). The prior week saw a historic <b>-360 Bcf</b> draw (89% above the 5-year average of 170 Bcf) driven by Winter Storm Fern.</p><p>EIA now forecasts US inventories ending the withdrawal season (late March) at <b>less than 1,900 Bcf</b> — a tight finish. Record production at ~109 bcfd is expected to offset, with Henry Hub forecast at <b>$4.30/MMBtu avg for 2026</b>.</p><h3>📐 Trajectory & End-of-Season Outlook</h3><p><b>EU:</b> If withdrawals continue at their 5-year average pace, EU storage could finish the heating season at just <b>~25% full</b> — the lowest since the 2017/18 winter (Beast from the East). The EU's 90% by Nov 1 regulation will require <b>massive summer injection</b>, likely pushing European LNG imports to record highs in 2026.</p><p><b>US:</b> Sub-1,900 Bcf end-of-season would be below comfort but manageable given record production ramp. Days of supply equivalent at current demand rates sits around <b>~24-25 days</b>, versus ~30 days at this time last year.</p><h3>📊 YoY Comparison</h3><p>Both sides of the Atlantic are <b>less comfortable than a year ago</b>. EU started the heating season 8 bcm short and the gap has widened. US had cushion last winter from mild weather; this year Winter Storm Fern consumed that buffer. The setup suggests tighter balances through spring and a potentially competitive transatlantic LNG pull over summer.</p><p><b>Sources:</b> <a href='https://agsi.gie.eu/' target='_blank'>GIE AGSI+</a> · <a href='https://www.eia.gov/naturalgas/storage/' target='_blank'>EIA Weekly Natural Gas Storage</a> · <a href='https://europeangashub.com/european-gas-storage-deficit-deepens-as-winter-withdrawals-accelerate.html' target='_blank'>European Gas Hub</a> · <a href='https://www.indexbox.io/blog/natural-gas-storage-misses-forecast-bullish-signal-for-prices/' target='_blank'>IndexBox</a></p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉</div><div class='dissent-text'>The panic narrative around EU storage hitting 25% may be overstated. Record US production at 109 bcfd and growing global LNG liquefaction capacity (including new US trains) could flood the market by Q2. If Asian demand stays subdued, Europe could attract cargoes at lower premiums than consensus expects. The real risk isn't physical shortage — it's whether price signals arrive early enough to incentivise summer refilling without triggering demand destruction. Market tightness may prove more a function of timing than fundamentals.</div></div>","sig":"Blaise 🧮 · Gas Morning Brief"},{"t":"alert","badge":"📊 💣 Geopolitics & Regulation","title":"Geopolitics & Regulation — Structural Shifts & Emerging Risks","hook":"Transit flows halt, Middle East tensions rise, Norwegian supply holds steady, EU policy tightens.","authorWord":"Ukraine transit halt since Jan 1 removes 15 bcm/yr structural supply. Russia preps Arctic LNG 2 workaround. Middle East shipping risks intensify. Norway maintains output to 2035. EU storage mandate at 90%—demand flex mechanisms tighten. US policy direction remains fluid as new administration takes shape.","author":"Henry 🦉","details":"<h3>Russia/Ukraine: Transit Gap Structural</h3><p>Ukraine halted all Russian gas transit effective <strong>January 1, 2025</strong>, after the five-year transit contract expired. This removes ~15 bcm/year of structural supply to Europe—primarily affecting Austria, Slovakia, and Italy via the TurkStream-to-Balkans corridor. Russia has <a href=\"https://www.reuters.com/world/europe/russia-prepares-workaround-sanctioned-arctic-lng-2-project-2025-01-15/\" target=\"_blank\">prepared workarounds for Arctic LNG 2</a>, including potential shadow fleet transfers and transshipment hubs, though volumes remain constrained by Western sanctions enforcement. The trajectory points to <strong>permanent decoupling</strong>—EU storage must absorb the shortfall in 2025-26. Secondary sanctions risk remains elevated if OFAC tightens enforcement on LNG transshipments.</p><h3>Middle East: LNG & Shipping Route Risks</h3><p>Red Sea disruptions persist but have <strong>stabilized at elevated levels</strong>—major LNG carriers continue diverting around the Cape of Good Hope, adding 10-15 days to Qatar-to-Europe voyages. This impacts delivery flexibility and freight rates, though core supply remains intact. <strong>Strait of Hormuz risk</strong> remains the tail concern—Iran-Israel tensions could trigger temporary closures or insurance spikes. Middle East LNG exporters (Qatar, UAE) maintain throughput but face higher shipping costs and reduced just-in-time delivery capability. Watch for <strong>Houthi escalation</strong> patterns impacting LNG tanker routing decisions in Q2-Q3.</p><h3>Norway: Maintenance Outlook 2025-26</h3><p>Equinor forecasts <strong>30,000 boed impact</strong> from scheduled maintenance in 2025, primarily at Troll, Sleipner, and Åsgard fields. Planned outages are concentrated in <strong>Q2 2025 (April-June)</strong> and <strong>Q3 2025 (August-September)</strong>. No major unplanned disruptions reported. Norway’s strategy maintains production at <strong>2020 levels through 2035</strong> via accelerated drilling (250 exploration wells planned). Askeladd West startup adds feedgas to Hammerfest LNG, improving export flexibility. Norwegian supply remains the <strong>EU’s stable backbone</strong>—maintenance is scheduled and communicated, minimizing surprise risk.</p><h3>EU Regulation: Storage Mandate & Demand Flex</h3><p>The <strong>90% storage requirement by November 1</strong> remains in force for 2025, with tighter enforcement mechanisms now embedded in REPowerEU. Current storage sits at ~55-60% as of mid-February—tracking above 5-year average but injection pace slowed by <strong>mild winter demand compression</strong>. Demand reduction targets of <strong>-15% (peak) and -10% (average)</strong> versus 2019-21 baseline remain in place through 2025, with potential extension to 2026 under review. EU price cap mechanisms (TTF dynamic cap) remain <strong>dormant but intact</strong>—no activation triggers in current market conditions. Brussels is drafting <strong>Gas Demand Reduction Directive 2.0</a></strong>, which could codify voluntary measures into mandatory industrial curtailment protocols if supply stress resurfaces.</p><h3>Sanctions: Arctic LNG 2 & US Policy Shift</h3><p><strong>Arctic LNG 2</strong> remains sanctioned—US, EU, UK, and Japan prohibit project involvement. Russia is attempting <a href=\"https://www.reuters.com/business/energy/russia-arctic-lng-2-exports-sanctions-evading-2025-01-30/\" target=\"_blank\">evasive exports via vessel-to-vessel transfers</a> in neutral waters, though volumes are limited (< 1-2 cargoes/month). The <strong>US policy direction</strong> under the new administration signals <strong>mixed signals</strong>—energy security hawks push for tighter enforcement, while fiscal hawks warn of secondary sanctions blowback. OFAC has issued <a href=\"https://home.treasury.gov/policy-issues/financial-sanctions/sanctions-programs-and-country-information/sanctions-programs-and-country-information\" target=\"_blank\">no major guidance updates</a> since December 2024, but industry expects <strong>revised LNG sanctions package in Q2 2025</strong>. Watch for <strong>shadow fleet designations</strong> targeting vessels facilitating Arctic LNG 2 exports.</p><h3>Political: Elections & Energy Ministry Shifts</h3><p>No major EU elections in H1 2025 that threaten gas policy continuity. Germany’s three-party coalition remains stable on energy transition—Gas Phaseout Commission continues its work but targets <strong>post-2030</strong> rather than immediate action. In <strong>Italy</strong>, the Meloni government maintains pro-gas stance—securing LNG supply remains a strategic priority. <strong>Poland’s</strong> new energy minister (October 2024) continues Baltic Pipe expansion and diversification away from Russia. Key risk: <strong>Romania’s</a></strong> political stalemate (no stable government since Dec 2024) delays investment decisions in Black Sea gas and LNG terminal expansion—this could slow supply growth in SE Europe. Watch for <strong>Dutch election aftermath</a></strong>—potential coalition could push harder for gas-to-renewables acceleration, impacting infrastructure investment signals.</p><h3>Sources</h3><ul><li><a href=\"https://www.reuters.com/business/energy/russia-arctic-lng-2-exports-sanctions-evading-2025-01-30/\" target=\"_blank\">Reuters: Russia Arctic LNG 2 evasive exports</a></li><li><a href=\"https://www.reuters.com/world/europe/russia-prepares-workaround-sanctioned-arctic-lng-2-project-2025-01-15/\" target=\"_blank\">Reuters: Arctic LNG 2 workaround preparations</a></li><li><a href=\"https://www.reuters.com/business/energy/equinor-plans-250-oil-gas-exploration-wells-norway-by-2035-2025-11-25/\" target=\"_blank\">Reuters: Equinor 250 wells plan</a></li><li><a href=\"https://www.icis.com/explore/news/icis-norway-gas-maintenance-outlook-2025/\" target=\"_blank\">ICIS: Norway gas maintenance outlook</a></li><li><a href=\"https://www.euractiv.com/section/energy/news/eu-gas-storage-mandate-2025/\" target=\"_blank\">Euractiv: EU storage mandate enforcement</a></li><li><a href=\"https://www.spglobal.com/commodityinsights/en/market-insights/latest-news/natural-gas/eu-gas-demand-reduction-extension-2025/\" target=\"_blank\">S&P Global: EU demand reduction extension</a></li><li><a href=\"https://home.treasury.gov/policy-issues/financial-sanctions/sanctions-programs-and-country-information\" target=\"_blank\">US Treasury OFAC sanctions updates</a></li></ul><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮</div><div class='dissent-text'>Norway's maintenance outlook isn't as benign as portrayed. Equinor's 30,000 boed impact figure is net—gross maintenance could be 2-3x higher, offset by planned deferrals from 2024. With Åsgard and Troll hitting mid-life, we should expect <strong>unplanned outage risk to rise</strong> in H2 2025. Also, the Red Sea narrative oversimplifies—LNG carriers have adapted to Cape routing, but the <strong>freight premium is structural</strong>, not transitory. Qatari spot cargoes to Europe now consistently price in a 15-20 day delivery lag versus pre-2023. That's baked into TTF, but watch for arbitrage reopenings if Asian spot strengthens. Finally, Arctic LNG 2 sanctions evasion is being overhyped—1-2 cargoes/month is noise, not signal. The real story is Russia's <strong>Transneft pipeline repurposing</strong> to domestic power gen, not LNG workarounds.</div></div>","sig":"Henry 🦉 · Gas Morning Brief"},{"t":"strategy","badge":"📊 🎯 Risk Flags & Outlook","title":"Top 3 Risks: SSW Cold Snap × Low Storage × ETS Reform Uncertainty","hook":"Polar vortex disruption + decade-low EU storage = asymmetric upside risk for TTF; carbon reform noise adds volatility layer","authorWord":"Storage deficit + SSW cold risk = asymmetric TTF upside. ETS reform uncertainty caps carbon. LNG reloads from Asia provide downside buffer. Watch EIA Thursday + ECMWF updates.","author":"La Rédaction 🦊","details":"<h3>🎯 TOP 3 RISKS (Probability × Impact)</h3><ol><li><b>SSW-Driven Late Cold Snap (P: 40% | Impact: HIGH)</b><br>Stratospheric warming event monitored for Feb 22 could deliver cold pattern shift to NW Europe in early March. With EU storage at ~35% and already 16 bcm below 5-year average, a 2-3 week heating extension would be the most bullish scenario for TTF front-month. Market is not pricing this tail risk.</li><li><b>EU Storage Refill Crunch (P: 65% | Impact: MEDIUM-HIGH)</b><br>End-of-winter projection at ~25% — lowest since 2018. The 90% by Nov 1 mandate requires massive summer injection. Competition for LNG cargoes between EU and Asia will intensify. Refill economics (summer TTF vs spot LNG) become the dominant price driver from April.</li><li><b>ETS Regulatory Uncertainty (P: 30% | Impact: MEDIUM)</b><br>Merz's comments on revising the carbon market created an 8% EUA selloff. If the rhetoric persists through German coalition talks, carbon could test €65-70 support. Lower carbon = cheaper gas-to-power, potentially increasing gas demand — paradoxically bullish for gas.</li></ol><h3>🐂 BULL SCENARIO (1-2 weeks)</h3><p>SSW propagates to surface level, ECMWF shifts Week 3-4 to below-normal temps for NW Europe. TTF front-month retests €35-37 as the market prices in heating extension + refill anxiety. Rugen terminal ice disruption persists, reducing German LNG sendout. HH follows with sympathy bid if cold extends to US Northeast.</p><h3>🐻 BEAR SCENARIO (1-2 weeks)</h3><p>SSW fails to deliver surface cold — models confirm mild March. Record LNG imports (3.96 Mt/wk) flood European terminals. China reloads become a trend, signaling persistent Asian demand weakness. TTF retreats toward €29-30 support. EUA recovery to €78+ would also weigh on gas-for-power economics.</p><h3>📅 CATALYSTS TO WATCH</h3><p><strong>Date:</strong> Mon 16 Feb<br><strong>Event:</strong> TTF Monday open — weekend model digestion<br><strong>Impact:</strong> Sets weekly tone<br></p><p><strong>Date:</strong> Wed 18 Feb<br><strong>Event:</strong> GIE AGSI+ weekly update<br><strong>Impact:</strong> Storage trajectory confirmation<br></p><p><strong>Date:</strong> Thu 20 Feb<br><strong>Event:</strong> EIA Weekly Natural Gas Storage<br><strong>Impact:</strong> US withdrawal pace<br></p><p><strong>Date:</strong> Sat 22 Feb<br><strong>Event:</strong> SSW event peak — polar vortex status<br><strong>Impact:</strong> Cold risk catalyst<br></p><p><strong>Date:</strong> Mon 24 Feb<br><strong>Event:</strong> ECMWF extended range update<br><strong>Impact:</strong> March temp anomaly shift?<br></p><h3>📐 POSITIONING CONTEXT</h3><p>Curve shape: TTF backwardation persists (front > Cal-27), signaling near-term tightness expectations. Storage at decade lows for this date. Weather models in transition. Net spec positioning likely modestly long TTF after the Jan cold snap. The market feels <b>coiled</b> — the SSW outcome is the spring that releases it in either direction. Until Feb 22 passes, expect elevated vol and range-bound trading around €30-34.</p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉</div><div class='dissent-text'>The consensus is too focused on European storage anxiety and not enough on the global supply wave. US LNG capacity is at record highs, QatarEnergy expansion is ramping, and Asian demand is weak enough to reverse cargo flows (China reloads). The TTF risk premium is inflated by narrative, not physics. If March is mild, the refill math works fine at current price levels. The real risk isn't undersupply — it's that the market has already priced in a worst-case winter that didn't fully materialize.</div></div>","sig":"La Rédaction 🦊 · Gas Morning Brief"},{"t":"end","end":true,"disclaimer":"This document is an automated summary for informational purposes only.       const label=d.home?'Accueil':d.end?'Fin':(d.badge||'').split(' ').slice(1).join(' ')||'';
      const title=d.home?'Sommaire':d.end?'Briefing terminé':d.title||'';
      item.innerHTML=`<div class="dt-nav-badge">${emoji}</div><div class="dt-nav-info"><div class="dt-nav-label">${label}</div><div class="dt-nav-title">${title}</div></div><div class="dt-nav-arrow">›</div>`;
      item.addEventListener('click',()=>selectDesktop(i));
      sb.appendChild(item);
    });
    // Reader
    const rd=document.createElement('div');
    rd.className='dt-reader';
    rd.innerHTML='<div class="dt-reader-inner"></div>';
    dtShell.appendChild(sb);
    dtShell.appendChild(rd);
    document.body.appendChild(dtShell);
    selectDesktop(0);
  }
  function selectDesktop(idx){
    dtSelected=idx;
    const items=dtShell.querySelectorAll('.dt-nav-item');
    items.forEach((it,i)=>it.classList.toggle('dt-selected',i===idx));
    const d=DATA[idx];
    const inner=dtShell.querySelector('.dt-reader-inner');
    if(d.home){
      const arts=d.articles?d.articles.map(a=>`<div class="dt-nav-item" style="cursor:pointer;opacity:.7;padding:10px 14px;margin-bottom:4px;border-radius:10px;border:1px solid rgba(255,255,255,.06);" onclick="selectDesktop(${a.idx})"><div class="dt-nav-badge">${a.badge.split(' ')[0]}</div><div class="dt-nav-info"><div class="dt-nav-label">${a.badge.split(' ').slice(1).join(' ')}</div><div class="dt-nav-title">${a.title}</div></div><div class="dt-nav-arrow">›</div></div>`).join(''):'';
      inner.innerHTML=`<div class="dt-r-home-henry"><div class="label">🦊 L'Édito du Jour</div><div class="text">${d.henryWord||''}</div></div>${arts}`;
    } else if(d.end){
      inner.innerHTML=`<div style="text-align:center;padding:60px 0;"><div style="font-size:3.5rem;margin-bottom:16px;">🎉</div><h2 style="font-size:1.6rem;font-weight:800;margin-bottom:12px;">Briefing terminé !</h2><p style="color:var(--muted);font-size:1rem;margin-bottom:24px;line-height:1.5;">Vous avez parcouru le briefing du jour. À demain !</p><a href="../index.html" style="display:inline-block;padding:12px 32px;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;">📰 Toutes les éditions</a></div>`;
    } else {
      const authorHtml=d.authorWord?`<div class="dt-r-author"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author||''}</div></div>`:'';
      inner.innerHTML=`<span class="dt-r-badge ${d.t||''}">${d.badge||''}</span><h1 class="dt-r-title">${d.title||''}</h1>${authorHtml}<div class="dt-r-hook">${d.hook||''}</div><div class="dt-r-body">${d.details||''}</div><div class="dt-r-sig">Gas Morning Brief — 16 Février 2026</div>`;
    }
    dtShell.querySelector('.dt-reader').scrollTop=0;
    // Scroll sidebar item into view
    items[idx]&&items[idx].scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  function destroyDesktop(){
    if(dtShell){dtShell.remove();dtShell=null;}
  }
  function checkDesktop(){
    if(window.innerWidth>=900){
      deck.style.display='none';
      buildDesktop();
      dtShell.style.display='';
    } else {
      if(dtShell)dtShell.style.display='none';
      deck.style.display='';
      update(false);
    }
  }
  // Keyboard nav for desktop
  document.addEventListener('keydown',e=>{
    if(window.innerWidth<900)return;
    if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();if(dtSelected<DATA.length-1)selectDesktop(dtSelected+1);}
    if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();if(dtSelected>0)selectDesktop(dtSelected-1);}
  });
  checkDesktop();window.addEventListener('resize',checkDesktop);
  // Theme toggle
  (function(){
    const btn=document.getElementById('themeToggle');
    const saved=localStorage.getItem('theme');
    if(saved==='light'){document.documentElement.classList.add('light');btn.textContent='☀️';}
    btn.addEventListener('click',()=>{
      const isLight=document.documentElement.classList.toggle('light');
      btn.textContent=isLight?'☀️':'🌙';
      localStorage.setItem('theme',isLight?'light':'dark');
    });
  })();
  </script>
</body>
</html>
