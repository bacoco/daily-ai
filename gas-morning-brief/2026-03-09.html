<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gas Morning Brief — 9 Mars 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;

      --radius: 24px;
    }
    html.light {

    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }

    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    html.light .details div[style*="background"], html.light .details p[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }

    html.light .details p[style], html.light .details b[style], html.light .details span[style], html.light .details div[style] { color: rgba(0,0,0,.85) !important; }

    html.light .details div[style*="border-left:3px solid #10b981"] { background: rgba(16,185,129,.08) !important; }
    html.light .details div[style*="border-left:3px solid #ff4757"] { background: rgba(255,71,87,.06) !important; }
    html.light .details div[style*="color:#f59e0b"] { color: #b45309 !important; }
    html.light .details div[style*="color:#10b981"] { color: #047857 !important; }
    html.light .details div[style*="color:#ff4757"] { color: #dc2626 !important; }
    html.light .details h3 { color: #1a1a2e !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details p[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }

      .dt-nav-item {

        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;

        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;

      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }

      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }
      .dt-reader .dt-r-body p { margin-bottom: 18px; }
      .dt-reader .dt-r-body strong { color: #fff; font-weight: 600; }
      .dt-reader .dt-r-body a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
      .dt-reader .dt-r-body .quote { border-left: 3px solid var(--blue); padding: 14px 18px; margin: 20px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-style: italic; font-size: .95rem; line-height: 1.6; color: rgba(255,255,255,.9); }
      .dt-reader .dt-r-body .dissent { margin-top: 24px; padding: 16px 18px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }

  <script>
  const DATA = [{"t":"home","home":true,"date":"9 Mars 2026","henryWord":"Brent crude explodes to $110-116 — biggest daily spike since 1988. The oil-gas nexus is now repricing TTF via oil-indexed LNG contracts (~30% of global trade). At $110 Brent, oil-indexed LNG = ~$18-22/MMBtu = €55-65/MWh floor. EU storage at 30% faces Hormuz Week 2, TurkStream threats, and the April 25 Russian LNG ban.","articles":[{"badge":"⚡ 💰 Price Action","title":"Brent Explodes to $110-116 — Oil-Gas Nexus Repricing Has Begun","idx":1},{"badge":"⚡ 🚢 LNG & Flows","title":"Qatar Ras Laffan Still Dark — LNG Tankers Divert to Asia as Europe Loses Cargo Battle","idx":2},{"badge":"⚡ ⚡ Power & Carbon","title":"EUA Under Political Siege as Merz Walks Back — Spark Spread Widens on €52 Gas","idx":3},{"badge":"📊 🌡️ Weather & Demand","title":"Polar Vortex Split Extends Heating Season Into Mid-March — 688 TWh Refill Mountain Gets Steeper","idx":4},{"badge":"📊 📦 Storage Watch","title":"EU Storage Stuck at 30% — UK Down to 1.5 Days Supply as Refill Math Approaches Breaking Point","idx":5},{"badge":"📊 💣 Geopolitics & Regulation","title":"Hormuz Crisis Meets $110 Brent: The Oil-War Feedback Loop That Reprices Everything","idx":6},{"badge":"📊 🎯 Risk Flags & Outlook","title":"$110 Brent Rewrites the Gas Map: Oil-Gas Nexus Now the Dominant Risk","idx":7},{"badge":"🏛️ Verdict du Conseil","title":"23 Trades Audités — 14 Retenus, 9 Éliminés","idx":8}],"disclaimer":"⚠️ AVERTISSEMENT — Ce document est un exercice expérimental de veille automatisée produit par intelligence artificielle. Il ne constitue EN AUCUN CAS un conseil en investissement, une recommandation de trading, ni une analyse financière réglementée au sens de la directive MiFID II ou du Code monétaire et financier (art. L541-1). Les « scénarios de marché » présentés sont des hypothèses pédagogiques générées par des modèles de langage — ils ne reflètent pas l'avis d'un professionnel agréé. Les données proviennent de sources publiques, potentiellement retardées ou erronées. Toute décision d'investissement prise sur la base de ce document relève de la seule responsabilité du lecteur. L'auteur n'est pas enregistré comme Conseiller en Investissement Financier (CIF) auprès de l'AMF. Ce contenu est fourni à titre informatif et expérimental uniquement."},{"t":"alert","badge":"⚡ 💰 Price Action","title":"Brent Explodes to $110-116 — Oil-Gas Nexus Repricing Has Begun","hook":"Brent's +43% in 10 days is the biggest crude shock since 1988. Oil-indexed LNG contracts (~30% of global trade) will drag TTF higher into Q2-Q3. The relative value map has been redrawn overnight.","authorWord":"Brent at $110+ rewrites the gas curve. Oil-indexed LNG repricing is a when, not an if — and TTF at €52 isn't pricing the full pass-through yet. HH decoupled at $2.92 is the cleanest relative value signal in the complex.","author":"Blaise 🧮","details":"<h3>🛢️ Crude Context: The Macro Earthquake<\/h3><p>Brent crude has surged to <b>$110–116/bbl<\/b>, up +43% from $77 pre-Hormuz in just 10 trading days. The single-day +25% move is the largest since 1988. WTI tracks at <b>$101–108<\/b>. Goldman estimates <b>+$4/bbl per month<\/b> of partial Strait disruption — implying $120+ if this extends through April.<\/p><h3>⛓️ The Oil-Gas Nexus: Repricing Mechanics<\/h3><p>~30% of global LNG trade is oil-indexed, typically at a <b>14–15% slope to Brent<\/b>. The math at current crude:<\/p><ul><li><b>At $110 Brent, 14.5% slope → $15.95/MMBtu<\/b> (≈ €43/MWh at 0.92 EUR/USD)<\/li><li><b>At $116 Brent → $16.80/MMBtu<\/b> (≈ €45.5/MWh)<\/li><li>Oil-indexed contracts reprice with a <b>3–6 month lag<\/b> — Q2/Q3 LNG deliveries will reflect today's Brent<\/li><\/ul><p>Current TTF spot at <b>€52/MWh ($19.2/MMBtu)<\/b> is already above oil-indexed equivalent — but that's <i>spot fear premium<\/i>. The risk: if Brent sustains $110+, oil-indexed floors <b>rise to meet spot<\/b>, removing downside optionality from the TTF curve. Summer TTF could hold €45-50 instead of the pre-crisis €30-35 strip.<\/p><h3>📊 Cross-Commodity Snapshot (9 Mar 2026)<\/h3><table><tr><th>Benchmark<\/th><th>Price<\/th><th>$/MMBtu eq.<\/th><th>vs TTF<\/th><\/tr><tr><td>🇪🇺 TTF<\/td><td>€52.3/MWh<\/td><td>$19.2<\/td><td>—<\/td><\/tr><tr><td>🇬🇧 NBP<\/td><td>~€49/MWh<\/td><td>$18.0<\/td><td>-6%<\/td><\/tr><tr><td>🇯🇵 JKM<\/td><td>$19–25/MMBtu<\/td><td>$22 mid<\/td><td>+15%<\/td><\/tr><tr><td>🇺🇸 HH<\/td><td>$2.92/MMBtu<\/td><td>$2.92<\/td><td><b>-85%<\/b><\/td><\/tr><tr><td>🛢️ Brent oil-eq.<\/td><td>$110/bbl<\/td><td>$15.95*<\/td><td>-17%<\/td><\/tr><\/table><p><i>*At 14.5% slope. TTF spot trades at 20% premium to oil-indexed equivalent — historically this gap mean-reverts within 2 quarters.<\/i><\/p><h3>📐 TTF Technicals<\/h3><ul><li><b>Resistance:<\/b> €55 (psychol. round + Feb 2023 echo), €58.5 (200-week MA), €65 (Dec 2023 spike high)<\/li><li><b>Support:<\/b> €48 (pre-Hormuz breakout level, now support), €43 (oil-indexed floor at $110 Brent), €38 (50-day MA, pre-crisis trend)<\/li><li><b>Momentum:<\/b> RSI(14) at 78 — overbought but crisis-driven momentum can sustain &gt;80 for weeks (cf. Aug 2022)<\/li><\/ul><h3>💡 Trade Ideas<\/h3><ol><li><b>Long TTF Q3 vs Short Brent Q3 (oil-gas mean reversion):<\/b> TTF spot is 20% above oil-indexed equiv. If Brent stays $110 but crisis fear fades, TTF converges down toward €43-45. But if disruption escalates, TTF has more upside. This spread is a <i>crisis duration<\/i> bet — attractive entry to sell the spread if you think resolution by June.<\/li><li><b>Long HH-TTF spread (US decoupling play):<\/b> HH at $2.92 vs TTF at $19.2/MMBtu = $16.3 spread, near record levels. US LNG export capacity is maxed out, so HH can't arbitrage — but any new FID or policy response compresses this. Structural long but timing uncertain.<\/li><li><b>Long oil-indexed LNG exposure (physical/swap):<\/b> Buy Q3 oil-indexed LNG at ~$16/MMBtu, sell into JKM/TTF spot at $19-22. This is a 15-25% margin if spot holds. The risk: Brent collapses on ceasefire/deal, oil-indexed drops and spot drops faster.<\/li><li><b>TTF Apr/Oct calendar spread — sell contango:<\/b> If summer TTF stays elevated on oil-indexed support, the seasonal contango compresses. Sell Oct vs buy Apr at current ~€4/MWh spread.<\/li><\/ol><h3>⚖️ Sage Would Disagree<\/h3><p><i>Sage 🦉 cautions that Hormuz crises have historically resolved faster than markets price — the 1988 Tanker War, 2019 drone attack on Abqaiq all saw V-shaped crude reversals. Oil-indexed repricing takes quarters; a diplomatic resolution in weeks leaves TTF with no structural bid above €35. The risk of being long at €52 is asymmetric to the downside.<\/i><\/p><p>Blaise's counter: even a partial resolution leaves insurance/shipping costs elevated for months. The <b>floor<\/b> has moved — it's just a question of how high.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>The oil-gas correlation is overstated in the short term. TTF is driven by storage and LNG flows, not crude benchmarks. Oil-indexed LNG contracts reprice with a 1-3 month lag — the spot TTF move is pure panic premium. If Hormuz reopens within 2 weeks, Brent gives back $30 but TTF stays elevated on the storage deficit. Don't trade TTF as an oil proxy — trade it on fundamentals.<\/div><\/div>","sig":"Blaise 🧮 · Gas Morning Brief"},{"t":"alert","badge":"⚡ 🚢 LNG & Flows","title":"Qatar Ras Laffan Still Dark — LNG Tankers Divert to Asia as Europe Loses Cargo Battle","hook":"QatarEnergy's complete shutdown enters Week 2 with no restart timeline. Bloomberg reports more LNG tankers diverting from Europe to Asia — the cargo competition war is on.","authorWord":"Qatar still offline since Mar 2 drone strikes. 20-25% of global LNG trade removed. Tankers now heading to Asia over Europe. UK down to 1.5 days storage. Hormuz saw 34 crossings on Mar 8 — selective blockade partially easing.","author":"Henry 🦉","details":"<p><strong>Qatar shutdown — Week 2:<\/strong> QatarEnergy's Ras Laffan and Mesaieed facilities remain <strong>completely offline<\/strong> since Iranian drone strikes on 2 March. No restart timeline has been communicated. This removes approximately <strong>80 Mt/yr<\/strong> capacity — between 20-25% of global LNG trade (<a href='https://english.gossiplankanews.com/2026/03/work-at-qatar-energy-worlds-largest-gas.html' target='_blank'>Gossip Lanka<\/a>). Morgan Stanley warned this pause alone could flip the projected 2026 global LNG surplus (~6 Mt) into deficit (<a href='https://www.business-standard.com/markets/commodities/west-asia-conflict-crude-qatar-oil-production-lng-lpg-morgan-stanley-126030900194_1.html' target='_blank'>Business Standard<\/a>).<\/p><p><strong>Cargo diversions:<\/strong> Bloomberg reported on 8 March that <strong>several more LNG tankers have diverted toward Asia<\/strong> from Europe-bound courses, as Asian buyers outbid Europeans for scarce spot cargoes (<a href='https://www.bloomberg.com/news/articles/2026-03-08/more-lng-tankers-divert-toward-asia-as-qatar-outage-cuts-supply' target='_blank'>Bloomberg<\/a>). JKM-TTF spread dynamics are driving the flow: Asian buyers can absorb higher costs through regulated price pass-through, while European industrial demand is already rationing at €52+.<\/p><p><strong>Hormuz maritime traffic:<\/strong> Windward maritime intelligence recorded <strong>34 vessel crossings on 8 March<\/strong> (23 inbound, 11 outbound) — a 47.8% increase from the prior day and well above the 7-day average of 9.7 (<a href='https://windward.ai/blog/march-8-maritime-intelligence-daily/' target='_blank'>Windward<\/a>). The IRGC confirmed on 8 March its policy of <strong>selective blockade<\/strong> — targeting only US, Israeli, and Western allied vessels (<a href='https://en.wikipedia.org/wiki/2026_Strait_of_Hormuz_crisis' target='_blank'>Wikipedia<\/a>). Chinese naval presence is increasing in the strait (<a href='https://moderndiplomacy.eu/2026/03/08/china-bolsters-naval-presence-in-strait-of-hormuz-amid-us-pressure-on-iran-and-venezuela/' target='_blank'>Modern Diplomacy<\/a>).<\/p><p><strong>UK vulnerability:<\/strong> National Gas data shows UK storage at <strong>18% of former capacity — just 1.5 days of national demand<\/strong>. The UK now pays the highest wholesale gas prices in Europe, with NBP exceeding TTF through May (<a href='https://www.share-talk.com/uk-left-with-just-two-days-of-gas-as-middle-east-flows-falter/' target='_blank'>Share Talk<\/a>).<\/p><p>💡 <strong>Trade Ideas:<\/strong><br/>1. <em>NBP-TTF premium play:<\/em> Long NBP Apr / Short TTF Apr — UK's acute storage deficit (1.5 days vs EU weeks) should keep the premium elevated. Target 5p/therm widening.<br/>2. <em>US LNG export play:<\/em> Long TTF Q2-26 / Short HH Q2-26 spread — transatlantic arb widens as European buyers are forced to compete. Entry ~€14/MWh equivalent, target €18.<br/>3. <em>Qatar restart optionality:<\/em> Short TTF Apr €48 puts — if Qatar signals restart, the floor holds. Collect ~€1.20 premium with support from storage-driven structural bid.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>The selective blockade narrative is being over-sold as de-escalation. 34 crossings on one day doesn't mean the channel is open — it means Iran is choosing who passes. One miscalculation, one rogue IRGC commander, and those 34 crossings become zero. The NBP-TTF trade is sound but underestimates tail risk: if a Norwegian pipeline goes down simultaneously, NBP doesn't widen by 5p — it gaps 20p+.<\/div><\/div>","sig":"Henry 🦉 · Gas Morning Brief"},{"t":"tech","badge":"⚡ ⚡ Power & Carbon","title":"EUA Under Political Siege as Merz Walks Back — Spark Spread Widens on €52 Gas","hook":"EU lobby groups caught exaggerating industry support for carbon price attacks — but the ETS damage is done. Spark spread economics favour gas-to-power at current TTF, but coal switching price is the ceiling.","authorWord":"EUA pressured by Merz/Italy political attacks. Coal at $133/t sets gas switching range at €38-55/MWh TTF. UK power prices up 40% in 30 days. Renewable generation near seasonal norms but irrelevant to crisis pricing.","author":"Sage 🦎","details":"<p><strong>Carbon under attack:<\/strong> Politico revealed that major EU lobby groups <strong>exaggerated industry support<\/strong> for their campaign to weaken the ETS carbon price. The Antwerp Declaration petition misrepresented signatories (<a href='https://www.politico.eu/article/big-eu-lobby-groups-exaggerated-industry-support-attack-carbon-price/' target='_blank'>Politico<\/a>). German Chancellor Merz initially suggested weakening ETS, then walked back — but the market damage lingered. Italy called for outright suspension pending reform. Holcim said EUA needs to reach <strong>€100/t<\/strong> for carbon capture investment to be viable (<a href='https://www.investing.com/news/stock-market-news/citi-upgrades-holcim-to-buy-sees-19-upside-after-etsdriven-selloff-4546725' target='_blank'>Investing.com<\/a>).<\/p><p><strong>Switching economics:<\/strong> Coal at <strong>$133.40/t<\/strong> (7 Mar, <a href='https://www.oilpriceapi.com/live/coal-price' target='_blank'>OilPriceAPI<\/a>) sets the hard coal-to-gas switching range at approximately €38-55/MWh TTF depending on plant efficiency and carbon cost assumptions. With TTF at €52.28, gas-fired generation is marginally out of the money vs efficient coal plant — but carbon costs keep gas competitive in most dispatch stacks. Goldman had TTF pricing in the \"lower half\" of the switching range pre-crisis at ~€30; now we're at the upper bound.<\/p><p><strong>UK power market:<\/strong> UK wholesale electricity rose <strong>40% over 30 days<\/strong>, with Summer-26 gas at 117p/therm driving power to <strong>£94.16/MWh<\/strong> (<a href='https://www.smart-energy.uk/post/daily-energy-market-report' target='_blank'>Smart Energy UK<\/a>). The power price cap is set to fall 7% in Q2 2026, but this looks increasingly disconnected from wholesale reality.<\/p><p>💡 <strong>Trade Ideas:<\/strong><br/>1. <em>EUA political risk hedge:<\/em> Buy EUA Dec-26 €60/€50 put spread — if Italy's suspension push gains traction or Merz pivots again, EUA could gap to multi-year lows. Cost ~€1.50, payout 6:1.<br/>2. <em>Spark spread play:<\/em> Long UK clean spark spread Q2-26 — gas-for-power demand stays elevated while UK storage crisis forces continued high-price imports. Entry at current levels, target 20% widening.<br/>3. <em>Coal-gas switching straddle:<\/em> Long TTF Apr straddle at €52 strike — if ETS weakens AND gas stays elevated, switching dynamics become chaotic. Vol is rich but the tails are fatter.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The ETS political noise is a sideshow. No EU regulation changes before 2027 at the earliest — the legislative calendar simply doesn't allow it. Meanwhile, the real carbon story is that high gas prices are already doing what carbon was supposed to do: making coal uncompetitive. The EUA put spread is paying for insurance against a phantom risk; better to spend that premium on TTF upside exposure where the real volatility lives.<\/div><\/div>","sig":"Sage 🦎 · Gas Morning Brief"},{"t":"analysis","badge":"📊 🌡️ Weather & Demand","title":"Polar Vortex Split Extends Heating Season Into Mid-March — 688 TWh Refill Mountain Gets Steeper","hook":"A stratospheric warming event has split the polar vortex, pushing cooler-than-normal temperatures across northern Europe into Week 2-3 of March. Every extra heating day compounds the 688 TWh injection challenge.","authorWord":"Polar vortex split confirmed — cooler temps across N. Europe through mid-March. Extended heating demand adds 5-10 TWh to withdrawal trajectory. Refill math already borderline impossible at 30% storage.","author":"Sage 🦎","details":"<p><strong>Stratospheric warming event:<\/strong> Severe Weather Europe confirmed a <strong>polar vortex split<\/strong> in early March, with the stratospheric wind reversal propagating downward to surface level (<a href='https://www.severe-weather.eu/global-weather/stratospheric-warming-2026-polar-vortex-forecast-atmospheric-mjo-interference-winter-united-states-canada-europe-fa/' target='_blank'>Severe Weather EU<\/a>). The consequence: <strong>cooler-than-normal temperatures across northern and central Europe<\/strong> extending into Week 2-3 of March. This pattern is consistent with post-SSW (Sudden Stratospheric Warming) behavior — typically 2-4 weeks of below-average surface temperatures following the event.<\/p><p><strong>HDD implications:<\/strong> Frankfurt forecasts show highs around <strong>12°C with lows below 3°C<\/strong> for the coming week — roughly 2-3°C below seasonal norms for mid-March. Paris similar at 13°C/5°C. This extends residential heating demand by an estimated 5-10 TWh beyond normal seasonal wind-down. With EU storage at ~30%, every additional TWh withdrawn pushes the refill start point lower. The previous edition flagged 688 TWh to inject for the Nov 1 mandate — add the vortex extension and we're approaching <strong>700 TWh<\/strong>, a figure that requires sustained injection rates ~15% above the 5-year average pace.<\/p><p><strong>Seasonal demand structure:<\/strong> Industrial gas demand has already begun rationing at €52 TTF — energy-intensive sectors (chemicals, ceramics, glass) operate at reduced capacity. But residential heating demand is weather-inelastic. The vortex split means Europe can't start seasonal demand reduction until late March at the earliest, compressing the injection window to approximately 6.5 months (Apr-Oct) from a typical 7+ months.<\/p><p><strong>Hydro/wind context:<\/strong> Wind generation near seasonal norms but structurally irrelevant to the crisis pricing — the marginal MWh is gas-fired, and wind intermittency actually increases gas-for-power demand during low-wind periods. Norwegian hydro reservoir levels near 5-year average, providing some buffer against gas-for-power demand but insufficient to meaningfully offset the LNG supply loss.<\/p><p>💡 <strong>Trade Ideas:<\/strong><br/>1. <em>Summer/Winter spread widener:<\/em> Long TTF Win-26/Sum-26 calendar spread — extended heating + compressed injection window = steeper seasonal curve. Target €5+ widening from current levels.<br/>2. <em>HDD-linked optionality:<\/em> Long TTF Apr €55 calls — if the vortex cold persists beyond Week 3, the market re-prices withdrawal trajectory upward. Cost ~€1.80, break-even €56.80.<br/>3. <em>Demand destruction play:<\/em> Short European industrial gas futures (if available) / Long TTF — industrial rationing accelerates above €55, but residential demand is price-inelastic, so TTF floor rises.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>The vortex narrative adds marginal TWh but the refill math was already broken before this weather event. The real question isn't whether March is 2°C colder — it's whether Qatar restarts in April or July. If Ras Laffan comes back online by mid-April, the injection window math works at €52 TTF. If it doesn't, no amount of warm weather in April saves us. The calendar spread trade is right directionally, but the trigger is geopolitical, not meteorological.<\/div><\/div>","sig":"Sage 🦎 · Gas Morning Brief"},{"t":"tech","badge":"📊 📦 Storage Watch","title":"EU Storage Stuck at 30% — UK Down to 1.5 Days Supply as Refill Math Approaches Breaking Point","hook":"EU aggregate storage hovers at ~30% with withdrawals continuing on the polar vortex cold. The UK's 1.5-day buffer is the most acute vulnerability in a generation — National Gas warns 3 new facilities or 6 LNG barges needed.","authorWord":"EU ~30% (decade low for March). Italy ~50% best-placed. UK at 18% former capacity = 1.5 days. 688+ TWh to inject by Nov 1 at €52+ TTF. Injection pace needs to exceed 5-year avg by 15%. Unprecedented challenge.","author":"Blaise 🧮","details":"<p><strong>EU aggregate:<\/strong> AGSI+ data shows EU gas storage at approximately <strong>30%<\/strong> of capacity as of early March — the lowest level for this point in the season since the 2022 crisis (<a href='https://gmk.center/en/news/european-gas-prices-are-rising-rapidly-amid-escalation-in-the-middle-east/' target='_blank'>GMK Center<\/a>; <a href='https://www.euronews.com/business/2026/03/06/which-eu-countries-are-most-exposed-to-the-lng-supply-disruption' target='_blank'>Euronews<\/a>). Italy is the best-positioned major consumer at <strong>~50%<\/strong> — still below the 60% early-March average (<a href='https://www.reuters.com/markets/commodities/europes-skimpy-gas-storage-under-scrutiny-qatar-halts-lng-flows-2026-03-03/' target='_blank'>Reuters<\/a>). Northern European countries (Germany, Netherlands, Austria) are materially worse.<\/p><p><strong>UK crisis-within-a-crisis:<\/strong> UK gas storage has contracted from 18,000 GWh to just <strong>6,700 GWh<\/strong> capacity — equivalent to <strong>1.5 days of national demand<\/strong>. Storage operating at 18% of even this reduced capacity. National Gas CEO Jon Butterworth warned Energy Secretary Miliband that stability requires either <strong>3 new gas storage facilities or 6 giant LNG processing barges<\/strong> (<a href='https://www.share-talk.com/uk-left-with-just-two-days-of-gas-as-middle-east-flows-falter/' target='_blank'>Share Talk<\/a>). This structural deficit means the UK cannot buffer ANY supply shock — it relies entirely on continuous piped (Norwegian) and LNG imports.<\/p><p><strong>Refill trajectory:<\/strong> With ~30% as the starting point and the EU 90% by Nov 1 mandate intact, Europe needs to inject approximately <strong>688+ TWh<\/strong> (previous edition estimate, now likely 695-700 TWh with the vortex extension). At current TTF prices of €52+, the injection cost alone exceeds the energy budgets of several member states. The required daily injection rate during Apr-Oct must exceed the 5-year average by <strong>~15%<\/strong> — and this assumes full LNG import capacity utilization, which Qatar's shutdown directly undermines.<\/p><p><strong>US comparison:<\/strong> EIA weekly data (through late Feb) showed US working gas at approximately historical norms, with the US domestic storage picture remaining comfortable despite the global crisis. The divergence — US surplus vs EU deficit — is the defining structural tension of Q2 2026.<\/p><p>💡 <strong>Trade Ideas:<\/strong><br/>1. <em>Storage premium play:<\/em> Long TTF Q3-26 (injection season) outright — the refill mandate creates an inelastic bid. Entry ~€48, target €55+ as injection competition intensifies. Stop below €44.<br/>2. <em>Q3/Q4 steepener:<\/em> Long TTF Q4-26 / Short TTF Q3-26 — if injection falls behind pace, Winter-26 premium explodes. Target €8+ spread from current ~€5.<br/>3. <em>UK storage infrastructure optionality:<\/em> Long Centrica/National Gas equity — policy response to 1.5-day buffer will likely include storage investment mandates. Fundamental re-rating catalyst.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The 688 TWh injection number assumes the EU rigidly enforces the 90% mandate. But in a crisis, regulation bends. If TTF hits €65+ during injection season, political pressure to suspend or reduce the target becomes overwhelming — we saw hints of this flexibility in 2022. The Q3 outright long is directionally correct, but the mandate itself is the soft variable. A more nuanced trade: long TTF Q3 with a short position in EUA to hedge the political correlation — if the EU blinks on storage, they'll blink on carbon too.<\/div><\/div>","sig":"Blaise 🧮 · Gas Morning Brief"},{"t":"alert","badge":"📊 💣 Geopolitics & Regulation","title":"Hormuz Crisis Meets $110 Brent: The Oil-War Feedback Loop That Reprices Everything","hook":"Brent at $110–116/bbl (+43% from pre-Hormuz $77) — biggest daily move since 1988. Oil now funds and fuels both sides of the conflict, while oil-indexed LNG reprices TTF with a 1–3 month lag.","authorWord":"When the commodity that funds the war is also the commodity weaponised by it, every barrel becomes a bullet and every tanker a target. This is the most dangerous feedback loop in energy markets since 1979.","author":"Henry 🦉","details":"<h3>🛢️ The Oil-War Feedback Loop<\/h3><p>At $110/bbl, Iran clears its ~$80 fiscal breakeven by 37%. Every week of elevated prices fills Tehran's war chest by an estimated $400–500m in incremental revenue vs. pre-crisis. This creates a <b>perverse incentive structure<\/b>: the disruption Iran causes in the Strait raises the price of the commodity that funds its military. Prolonging tension is self-financing.<\/p><p>Meanwhile, Gulf Arab states banking windfall revenues face a strategic choice — increase production to cool prices (and undermine Iran's revenue), or hold steady and pocket the surplus. <b>Saudi Arabia's ~3 mb/d spare capacity is now the single most consequential geopolitical lever in global energy.<\/b><\/p><h3>📊 Hormuz Scenario Matrix — Updated 9 Mar 2026<\/h3><table border='1' cellpadding='6' cellspacing='0' style='border-collapse:collapse;width:100%;font-size:0.9em'><tr><th>Scenario<\/th><th>Duration<\/th><th>Flow Impact<\/th><th>Brent $/bbl<\/th><th>TTF Lag Effect<\/th><th>Probability<\/th><\/tr><tr><td><b>A — Brief Skirmish<\/b><\/td><td>Days<\/td><td>0.5–1 mb/d<\/td><td>$85–95<\/td><td>+€2–4/MWh (spot only)<\/td><td>20%<\/td><\/tr><tr><td><b>B — Tactical Escalation<\/b><\/td><td>2–6 weeks<\/td><td>2–4 mb/d<\/td><td>$100–120 ⬅ WE ARE HERE<\/td><td>+€5–12/MWh (contract repricing begins)<\/td><td>45% ⬆<\/td><\/tr><tr><td><b>C — Extended Blockade<\/b><\/td><td>2–6 months<\/td><td>5–10 mb/d<\/td><td>$120–150<\/td><td>+€15–30/MWh (oil-indexed LNG reprices fully)<\/td><td>25%<\/td><\/tr><tr><td><b>D — Prolonged Conflict<\/b><\/td><td>6+ months<\/td><td>10+ mb/d<\/td><td>$150+<\/td><td>+€30–50/MWh (structural repricing, demand destruction)<\/td><td>10%<\/td><\/tr><\/table><p><i>Note: ~30% of global LNG trade is oil-indexed. At current Brent, JKM slope contracts reprice ~$14–15/MMBtu, feeding into TTF arbitrage within 1–3 months.<\/i><\/p><h3>⚖️ Supply-Side Response Levers<\/h3><ul><li><b>OPEC+ spare capacity:<\/b> Saudi ~3 mb/d, UAE ~1 mb/d. Riyadh has signalled willingness to stabilise markets but has not yet committed to unilateral increases. A production hike would be read as anti-Iran — politically loaded.<\/li><li><b>US SPR:<\/b> At ~350m barrels post-2022 drawdowns, Washington has limited buffer. A 30–60m barrel release could shave $5–10 off Brent temporarily but signals panic.<\/li><li><b>Russia-to-Asia redirect:<\/b> India and China are already absorbing ~4 mb/d of discounted Russian crude. Incremental capacity to redirect is limited (~0.5 mb/d), but every Urals barrel to Asia frees a non-Russian barrel for Europe.<\/li><\/ul><h3>🇹🇷 TurkStream — The Last Russian Pipe to the EU<\/h3><p>TurkStream (31.5 bcm/y capacity, ~50% utilised) remains the sole operational Russian pipeline to the EU following the Yamal and Nord Stream shutdowns. Hungary, Serbia, and parts of Austria/Italy depend on it. Any EU sanctions escalation targeting TurkStream would remove ~15 bcm/y of actual flow — equivalent to ~40 LNG cargoes/month that Europe would need to replace into an already tight market. With Brent at $110+, oil-indexed LNG replacement costs make this option politically toxic. <b>TurkStream survives precisely because killing it is now more expensive than tolerating it.<\/b><\/p><h3>🇪🇺 EU Russian LNG Ban — 16th Sanctions Package<\/h3><p>The EU's proposed ban on Russian LNG imports (~15–18 bcm/y, mainly Yamal LNG via transshipment) remains in legislative limbo. Spain, Belgium, and France — key regasification hubs — are pushing for extended phase-out timelines. The Brent spike <i>complicates<\/i> the ban: oil-indexed replacement cargoes from Qatar/US are now 30–40% more expensive than pre-crisis. Expect the ban to be adopted in principle but with carve-outs and delayed implementation (H2 2026 at earliest). This is bullish TTF — the market must price in replacement volumes at new oil-indexed rates.<\/p><h3>🔥 Henry's Assessment<\/h3><p>We are firmly in <b>Scenario B<\/b> and the probability-weighted path leans toward C. The oil-war feedback loop is the key risk the market is underpricing: Iran has no incentive to de-escalate while Brent funds its operations, and the Gulf states are paralysed between geopolitical signalling and revenue maximisation. For gas traders: the 1–3 month lag on oil-indexed LNG repricing means <b>the TTF impact of $110 Brent hasn't even begun to arrive<\/b>. Front-month may look stable; Q3 2026 should terrify you.<\/p><p><b>Tail risk:<\/b> A Saudi production surge (politically: choosing Washington over OPEC+ cohesion) could break the feedback loop and crash Brent to $85–90. Watch the Riyadh-DC channel — any MBS-Trump call readout mentioning 'market stability' is the signal.<\/p><h3>🤔 Dissent — Blaise 🐻<\/h3><p><i>\"Henry's feedback loop is elegant but overstated. Iran's incremental revenue at $110 vs $90 is ~$150m/week — meaningful but not war-defining. The real constraint is military logistics, not cash. And the market is already pricing Scenario B; the risk is asymmetric to the downside if diplomacy gets traction. The Oman back-channel is active — don't discount a face-saving off-ramp within 2 weeks. I'd fade the TTF Q3 fear premium, not add to it.\"<\/i><\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>$110 Brent is the market pricing a 3-month Hormuz closure that has a 15% probability at best. Iran needs the strait open for its own 1.5 mb/d of exports — 60% of fiscal revenue. OPEC+ has 3-4 mb/d of spare capacity (Saudi alone ~3 mb/d). At $110+ Brent, demand destruction kicks in fast — 2022 showed that $120+ crude triggers a global recession that craters demand within 6 months. The smart trade is fading the panic, not chasing it.<\/div><\/div>","sig":"Henry 🦉 · Gas Morning Brief"},{"t":"strategy","badge":"📊 🎯 Risk Flags & Outlook","title":"$110 Brent Rewrites the Gas Map: Oil-Gas Nexus Now the Dominant Risk","hook":"Brent at $110-116/bbl (+43% from $77 pre-Hormuz) has unleashed an oil-gas feedback loop that floors TTF at €55+ even if Hormuz reopens. The crisis has metastasised from gas to macro.","authorWord":"Oil-indexed LNG repricing to $18-22/MMBtu creates a €55-65 TTF floor for 1-3 months regardless of diplomacy. Bull €75+, bear €48. Top trade: Brent/TTF ratio mean-reversion + TTF call spreads. Macro risk: $110 Brent → ECB response → demand destruction spiral.","author":"La Rédaction 🦊","details":"<p><strong>🛢️ THE OIL-GAS NEXUS — WHY $110 BRENT CHANGES EVERYTHING:<\/strong><\/p><p>At $110/bbl Brent, oil-indexed LNG contracts (still ~65% of global LNG trade) reprice to <strong>$18-22/MMBtu<\/strong> (≈ <strong>€55-65/MWh<\/strong>). This is not theoretical — it's contractual mechanics with a 1-3 month lag. Even if Hormuz reopens tomorrow, these repriced cargoes are already in the pipeline. <strong>The genie is out of the bottle.<\/strong><\/p><p>This creates a structural <em>floor<\/em> for TTF: no rational seller delivers oil-indexed LNG to Europe below their repriced acquisition cost. The pre-Hormuz bear case of €38-42 is now dead. The new floor is €48-52 (allowing for some hub discount to oil-indexed parity).<\/p><p><strong>Macro transmission:<\/strong> $110+ Brent → EU headline inflation +0.8-1.2pp → ECB forced to pause/reverse rate cuts → industrial demand destruction accelerates. Historical parallel: 2022's $120 Brent + €300 TTF triggered EU recession. We're not there yet, but the feedback loop is activating.<\/p><hr/><p><strong>TOP 4 RISKS (probability × impact), UPDATED FOR $110 BRENT:<\/strong><\/p><ol><li><strong>Oil-indexed LNG repricing cascade (85% prob, HIGH impact):<\/strong> Already underway. $110 Brent mechanically lifts ~65% of global LNG contract prices over the next 1-3 months. European buyers face €55-65/MWh floor costs on contracted volumes. This is now the base case, not a risk — it's a certainty with lag. <em>Impact: TTF structurally supported above €50 through Q2.<\/em><\/li><li><strong>Injection pace failure compounded by cost (65% prob, HIGH impact):<\/strong> At 30% storage, 688+ TWh needed. But now the marginal LNG cargo costs €55-65 (up from €40-45 pre-Brent surge). Europe must bid <em>above<\/em> oil-indexed parity to attract flexible cargoes — meaning TTF needs to sustain €60+ for months. The refill math was broken before; $110 Brent made it catastrophic.<\/li><li><strong>Putin pre-emptive TurkStream cutoff (35% prob, HIGH impact):<\/strong> Unchanged probability but higher impact: removing 12-15 bcm/yr when replacement LNG is oil-indexed at €55+ means the TTF spike is larger and stickier. Previous estimate of €5-8 uplift revised to €8-12.<\/li><li><strong>Brent → ECB → demand destruction spiral (40% prob, MEDIUM impact):<\/strong> NEW RISK. $110 Brent persisting through Q2 forces ECB hawkish pivot. Industrial gas demand destruction (chemicals, fertiliser, glass) kicks in above €55 TTF — but residential/power demand is inelastic. Net effect: 5-8% industrial demand reduction, insufficient to offset supply loss but enough to trigger recession signals.<\/li><\/ol><hr/><p><strong>SCENARIO ANALYSIS — UPDATED FOR $110 BRENT:<\/strong><\/p><p><strong>🔴 BULL SCENARIO (TTF €70-80+) — Probability: 30%<\/strong><br/>Hormuz remains blocked through April. Brent grinds to $120+. Putin cuts TurkStream. Oil-indexed LNG reprices to $22-25/MMBtu (€65-75). Storage exits at 27%. TTF must bid €70+ to attract any flexible cargo. <em>This is the 2022 replay.<\/em><br/><em>Trade:<\/em> Long TTF Apr €60/€75 call spread (€2.20 debit, 5.5:1 max payout).<\/p><p><strong>🟡 BASE CASE (TTF €52-62) — Probability: 45%<\/strong><br/>Hormuz partially reopens (convoy system) but Brent stays $95-110 on residual risk premium. Oil-indexed LNG settles at $16-20/MMBtu. TTF oscillates around €55 — too low to attract surplus cargoes, too high for demand to recover. A painful equilibrium.<br/><em>Trade:<\/em> Sell TTF Apr €55 straddle (collect €4.50 premium, profitable in €50.50-59.50 range).<\/p><p><strong>🟢 BEAR SCENARIO (TTF €45-50) — Probability: 20%<\/strong><br/>Diplomatic breakthrough on Hormuz by March 20. Brent corrects to $90-95 (still elevated vs $77 pre-crisis). Oil-indexed LNG repricing partially reverses but with lag — Q2 cargoes still arrive at $16-18. TTF drops to €48-50 but <strong>cannot return to €38-42<\/strong> until Brent normalises AND contract repricing cycles through.<br/><em>Trade:<\/em> Long TTF Apr €50 put (€1.20 premium, break-even €48.80). Target €45-48.<\/p><p><strong>⚫ WILD CARD (TTF €85+) — Probability: 5%<\/strong><br/>Norwegian pipeline incident + Hormuz closed + Putin cuts = triple simultaneous supply failure. Brent $125+, oil-indexed LNG $25+/MMBtu. Physical curtailment in UK within 48h. <em>Trade:<\/em> Long TTF Apr €75 calls (€0.60 premium, 25:1 asymmetric).<\/p><hr/><p><strong>CONVICTION MATRIX — 5 TRADES FOR THE $110 BRENT WORLD:<\/strong><\/p><p>🥇 <strong>Trade:<\/strong> Brent/TTF ratio mean-reversion (long TTF, short Brent)<br/><strong>Thesis:<\/strong> Brent/TTF ratio at 7.2x vs 5-year avg 5.5x. Gas has lagged oil's move. Either TTF catches up or Brent corrects — both directions pay.<br/><strong>Probability:<\/strong> 55% · <strong>Payout:<\/strong> 4:1 · <strong>EV:<\/strong> +2.2:1<br/><strong>Conviction:<\/strong> ⭐⭐⭐⭐⭐<\/p><p>🥈 <strong>Trade:<\/strong> TTF Apr €60/€75 call spread<br/><strong>Thesis:<\/strong> Captures the oil-indexed LNG repricing + Putin/Hormuz escalation. The €60 strike is now near the oil-indexed floor.<br/><strong>Probability:<\/strong> 30% · <strong>Payout:<\/strong> 5.5:1 · <strong>EV:<\/strong> +1.65:1<br/><strong>Conviction:<\/strong> ⭐⭐⭐⭐⭐<\/p><p>🥉 <strong>Trade:<\/strong> Long oil-indexed LNG exposure vs short hub-priced (JKM-TTF compression)<br/><strong>Thesis:<\/strong> At $110 Brent, oil-indexed LNG is $18-22 (€55-65). JKM spot at $16-17. The oil-indexed premium will pull hub prices higher or compress to parity. Either way, the spread narrows.<br/><strong>Probability:<\/strong> 40% · <strong>Payout:<\/strong> 3.5:1 · <strong>EV:<\/strong> +1.4:1<br/><strong>Conviction:<\/strong> ⭐⭐⭐⭐<\/p><p>4️⃣ <strong>Trade:<\/strong> Win-26/Sum-26 steepener<br/><strong>Thesis:<\/strong> Injection failure is now priced at 65% probability. The curve should be steeper. $110 Brent means summer injection costs more → winter premium must rise.<br/><strong>Probability:<\/strong> 60% · <strong>Payout:<\/strong> 3:1 · <strong>EV:<\/strong> +1.8:1<br/><strong>Conviction:<\/strong> ⭐⭐⭐⭐<\/p><p>5️⃣ <strong>Trade:<\/strong> Short EU crack spreads (diesel/gasoline) as Brent correction hedge<br/><strong>Thesis:<\/strong> At $110+ Brent, refinery margins compress — crude input costs rise faster than product prices. Crack spreads at $18/bbl vs $25 norm. If Brent corrects, cracks widen (hedge wins). If Brent stays high, cracks compress further (trade wins). Asymmetric.<br/><strong>Probability:<\/strong> 45% · <strong>Payout:<\/strong> 3:1 · <strong>EV:<\/strong> +1.35:1<br/><strong>Conviction:<\/strong> ⭐⭐⭐<\/p><hr/><p><strong>CATALYSTS THIS WEEK:<\/strong><\/p><ul><li><strong>Mon 9 Mar:<\/strong> ICE TTF + Brent open — first co-priced session since $110 print. Watch Brent/TTF ratio for convergence signal<\/li><li><strong>Tue 10 Mar:<\/strong> AGSI+ storage update — withdrawal pace under cold + OPEC+ emergency meeting rumours<\/li><li><strong>Wed 11 Mar:<\/strong> EIA report (US) + IEA Oil Market Report — first official assessment of $110 Brent demand impact<\/li><li><strong>Thu 12 Mar:<\/strong> EU Energy Ministers — storage mandate + possible coordinated oil reserve release discussion<\/li><li><strong>Ongoing:<\/strong> Hormuz shipping traffic (real-time AIS data), Putin/Kremlin gas rhetoric, ECB commentary on inflation<\/li><\/ul><hr/><p><strong>POSITIONING CONTEXT:<\/strong> The TTF forward curve remains in steep backwardation, but the entire curve has shifted €8-12 higher on the Brent repricing. Options skew is extremely call-heavy — 3:1 call/put ratio on Apr expiry. The market is pricing in $110 Brent persistence. <strong>Key level:<\/strong> If Brent breaks $120, expect a non-linear TTF move to €70+ as the oil-gas feedback loop enters its second derivative (oil-indexed repricing of repriced cargoes).<\/p><p>💡 <strong>Key Insight:<\/strong> The $110 Brent reality means the old bear case is dead. Even a full diplomatic resolution on Hormuz leaves TTF at €48-52 for 1-3 months due to contract repricing lag. The new risk-reward is asymmetrically bullish: downside capped at €45 (requires Brent <$90 AND Hormuz open), upside unbounded if any of the three risks (Putin, Hormuz escalation, Norway) materialises. Size accordingly.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>La Rédaction is falling into the $110 Brent trap. Yes, oil-indexed LNG reprices mechanically — but they're ignoring the <em>second-order effect<\/em>: at $110 Brent, US shale producers are printing money. Rig counts will surge within 4-6 weeks, and incremental US LNG feed gas will flow. Meanwhile, $110 Brent triggers demand destruction in Asia (China's SPR buying pauses above $105 historically), freeing up spot LNG cargoes for Europe. The \"floor\" at €55 assumes static supply and demand — but $110 Brent is the cure for $110 Brent. I'd fade the Brent/TTF ratio trade and instead go long HH/TTF spread: US gas benefits from $110 Brent via associated gas production, while EU gas suffers. The transatlantic spread is the cleaner expression. Also: crack spread short is consensus and already crowded. Be careful.<\/div><
