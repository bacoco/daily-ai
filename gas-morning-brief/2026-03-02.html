<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gas Morning Brief — 2 Mars 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    html.light .details div[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }
      .dt-reader .dt-r-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; }
      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }
      .dt-reader .dt-r-body p { margin-bottom: 18px; }
      .dt-reader .dt-r-body strong { color: #fff; font-weight: 600; }
      .dt-reader .dt-r-body a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
      .dt-reader .dt-r-body .quote { border-left: 3px solid var(--blue); padding: 14px 18px; margin: 20px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-style: italic; font-size: .95rem; line-height: 1.6; color: rgba(255,255,255,.9); }
      .dt-reader .dt-r-body .dissent { margin-top: 24px; padding: 16px 18px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
      .dt-reader .dt-r-body .dissent .dissent-label { font-family: 'Inter', sans-serif; font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
      .dt-reader .dt-r-body .dissent .dissent-text { font-size: .9rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
      .dt-reader .dt-r-author { margin-top: 20px; padding: 12px 16px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); }
      .dt-reader .dt-r-author .aw-text { font-family: 'Merriweather', serif; font-size: .88rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }

  <script>
  const DATA = [{"t":"home","home":true,"date":"2 Mars 2026","henryWord":"Hormuz effectively closed since Feb 28 after US-Israel strikes on Iran. 20% of global LNG stranded. EU storage at 30% faces a three-front supply squeeze: Hormuz shutdown, TurkStream sabotage risk, and EU Russian LNG ban from April 25.","articles":[{"badge":"⚡ 💰 Price Action","title":"Hormuz Shutdown Rewrites the Board — TTF & JKM Set for Monster Gap Higher at Monday Open","idx":1},{"badge":"⚡ 🚢 LNG & Flows","title":"Hormuz Shuts Down — 150 Tankers Stranded as 20% of Global LNG Supply Goes Dark","idx":2},{"badge":"⚡ ⚡ Power & Carbon","title":"Hormuz Blows Up the Merit Order — Spark Spreads Face Annihilation","idx":3},{"badge":"📊 🌡️ Weather & Demand","title":"Final Vortex Collapse: Winter's Last Cold Card Is Being Played","idx":4},{"badge":"📊 📦 Storage Watch","title":"Below 30% — The Deliverability Cliff Meets the Hormuz Wildcard","idx":5},{"badge":"📊 💣 Geopolitics & Regulation","title":"Hormuz Shutdown: 20% of Global LNG at Risk After US-Israel Strikes on Iran","idx":6},{"badge":"📊 🎯 Risk Flags & Outlook","title":"Three Fault Lines: Hormuz Shutdown × Storage Crisis × Vortex Collapse","idx":7},{"badge":"🏛️ Verdict du Conseil","title":"21 Trades Audités — 13 Retenus, 8 Éliminés","idx":8}]},{"t":"alert","badge":"⚡ 💰 Price Action","title":"Hormuz Shutdown Rewrites the Board — TTF & JKM Set for Monster Gap Higher at Monday Open","hook":"150+ tankers anchored as Iran closes Hormuz after US-Israel weekend strikes — Friday's €31.35 TTF close is already ancient history. Expect double-digit percentage gaps on TTF and JKM when screens light up.","authorWord":"Hormuz closed. 150 tankers stuck. TTF €31.35 Friday is stale — Monday gap higher could be historic. HH less exposed but LNG export basis blows out. This is a regime change session.","author":"Blaise 🧮","details":"<p><b>Friday Settlement Recap:<\/b> TTF March closed at <b>€31.35/MWh<\/b> (−€0.57, −1.8%), pinned in the €30–32 range all week per <a href='https://www.worldenergynews.com/news/prices-for-gas-europe-are-mixed-traders-771742' target='_blank'>LSEG/Reuters<\/a>. HH front-month settled near <b>$2.86–2.92/MMBtu<\/b> at 5-month lows after Storm Fern premiums fully evaporated (<a href='https://markets.financialcontent.com/stocks/article/marketminute-2026-2-26-natural-gas-prices-break-support-as-winter-storm-fern-premium-evaporates' target='_blank'>MarketMinute<\/a>). NBP March around 78–80 GBp/therm, lifted by Norwegian outages at Ormen Lange, Oseberg and Aasta Hansteen (nominations at 316 mcm, lowest of 2026). EU storage at 30.19% — draw rate slowing on mild weather.<\/p><p><b>🚨 HORMUZ — The Only Story That Matters:<\/b> US-Israel strikes hit Iran over the weekend. Iran's Revolutionary Guards issued VHF radio warnings prohibiting Hormuz transit. <a href='https://www.theguardian.com/business/2026/mar/01/oil-price-surge-iran-us-israel-strikes-markets' target='_blank'>The Guardian<\/a> reports <b>150+ tankers carrying crude, LNG and products have dropped anchor<\/b> in open waters. A tanker was attacked on Sunday. Insurance markets have effectively withdrawn war-risk cover, making Hormuz a de facto no-go zone. Qatar — the world's largest LNG exporter — ships almost exclusively through Hormuz. <a href='https://www.cnbc.com/2026/03/01/experts-weigh-potential-scenarios-for-oil-if-strait-of-hormuz-closes.html' target='_blank'>CNBC<\/a> reports Brent expected to gap to $74–80; <a href='https://www.kpler.com/blog/us-iran-conflict-strait-of-hormuz-crisis-reshapes-global-oil-markets' target='_blank'>Kpler<\/a> models $85–90 in sustained closure. For gas: <b>TTF could gap €5–8 higher<\/b> (to €36–39 range) on Monday open given Qatari LNG disruption risk. JKM spot likely spikes above $15/MMBtu from ~$12.50 Friday. Asian buyers will scramble.<\/p><p><b>Technical Levels (pre-gap):<\/b> TTF March — Friday's €30–32 range is now irrelevant; watch <b>€35 (Oct 2023 high) and €40 psychological<\/b> as upside targets. Support only matters if ceasefire headlines hit: €31.35 (Friday close), €30.00 (floor). HH front-month — less directly exposed but LNG export basis (Sabine Pass netback) explodes; watch $3.20 resistance (50-DMA), then $3.50. Support at $2.86 (Friday low). <b>Open interest:<\/b> expect massive spec buying on TTF/JKM at open; Friday's positioning was bearish-leaning (mild weather, ample supply narrative) — forced short covering will amplify the move.<\/p><p><b>💡 Trade Ideas:<\/b><br>2. <b>Long JKM Mar vs short TTF Mar spread<\/b> — Asian panic buying should outpace European moves given Qatar dependency; JKM-TTF spread widens.<br>3. <b>Long HH Apr $3.00/$3.50 call spread<\/b> — secondary play via LNG export pull; HH upside is capped vs global benchmarks but the $2.86 low is likely the cycle bottom if Hormuz stays shut &gt;48h.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>Markets will gap — that's obvious. But Iran has <i>never<\/i> fully closed Hormuz for more than hours. The IRGC warning may be posturing; US Navy escort convoys could restore transit within days. Remember 2019: Iran attacked tankers, oil spiked $5 then gave it all back within a week. The risk is buying the spike into a ceasefire. Wait for clarity before chasing — sell the vol, don't buy it.<\/div><\/div>","sig":"Blaise 🧮 · Quant & Price Action"},{"t":"alert","badge":"⚡ 🚢 LNG & Flows","title":"Hormuz Shuts Down — 150 Tankers Stranded as 20% of Global LNG Supply Goes Dark","hook":"Iran's de facto closure of the Strait of Hormuz has stranded 150+ tankers and frozen Qatar's 77 mtpa LNG export machine. Monday's open faces massive spot premium blowouts across TTF and JKM as the biggest supply shock since 2022 hits global gas.","authorWord":"Hormuz is closed in all but name. Qatar LNG is offline. Monday will be violent.","author":"Henry 🦉","details":"<p><b>🔴 Hormuz Crisis — The Mother of All LNG Disruptions<\/b><br>Following US-Israel strikes on Iran on Feb 28, Iran's Revolutionary Guards warned tankers that <a href='https://www.theguardian.com/business/2026/mar/01/us-israel-strikes-iran-oil-price' target='_blank'>no ship would pass<\/a> through the Strait of Hormuz. <a href='https://www.kpler.com/blog/us-iran-conflict-strait-of-hormuz-crisis-reshapes-global-oil-markets' target='_blank'>Kpler confirms<\/a> the Strait is effectively closed for commercial shipping — 14+ LNG tankers have U-turned, slowed, or stopped. Reuters reports <a href='https://www.reuters.com/business/energy/oil-gas-majors-traders-suspend-shipments-via-hormuz-us-attacks-iran-sources-say-2026-02-28/' target='_blank'>150+ tankers anchored<\/a> in open Gulf waters beyond the Strait, with oil majors and traders suspending all shipments. Traffic through Hormuz has <b>dropped 60–70%<\/b>. Qatar accounts for ~20% of global LNG supply (~77 mtpa) — all of it transits Hormuz. Without tanker offtake, Qatar and UAE may be forced to shut down LNG production entirely as liquefaction plants need continuous tanker flow to maintain refrigeration cycles. There is simply <b>no substitute<\/b> for these volumes — unlike oil, LNG cannot be rerouted through pipelines.<\/p><p><b>📊 Spreads & Monday Open Scenarios<\/b><br>Brent closed Friday near $73/bbl; scenario analysis suggests Monday opens $5–18 higher in contained cases, $20–40+ if harassment escalates. LNG spot premiums (JKM/TTF) could widen <b>$5–25+/MMBtu<\/b>. TTF was already elevated at ~€31/MWh pre-crisis; expect a gap higher at Monday open. The <b>TTF-HH arb is about to explode<\/b> as Atlantic Basin cargoes become the only game in town. War risk insurance has jumped 100–300%, adding $1–2M per voyage for Cape reroutes (10–15 extra days). A global bidding war for non-Hormuz cargoes is underway.<\/p><p><b>🚢 Pre-Crisis EU Flows Were Already at Records<\/b><br>Before Hormuz blew up, Europe was on track for <a href='https://oilprice.com/Latest-Energy-News/World-News/Europe-Set-for-Another-Record-LNG-Import-Month.html' target='_blank'>another record LNG import month<\/a> — February hit 14.2 Mt with weaker Chinese demand diverting cargoes westward. <a href='https://www.prismnews.com/news/us-lng-exports-hit-1119m-tons-as-europe-takes-record-cargoes' target='_blank'>US LNG exports hit 11.19 Mt<\/a> with record EU absorption. <a href='https://poland.news-pravda.com/en/world/2026/02/27/51393.html' target='_blank'>Naftogaz received its first US LNG cargo<\/a> via Klaipeda — a symbolic milestone now overshadowed by Hormuz. Norwegian pipeline flows remain the critical lifeline — any maintenance event would compound the crisis.<\/p><p><b>💡 Trade Ideas<\/b><br>1. <b>Long TTF Apr-26 outright<\/b> — gap higher inevitable; target €45–55/MWh on sustained Hormuz disruption. Stop below €28.<br>3. <b>Long TTF Q3-26 vs short HH Q3-26<\/b> — transatlantic arb blows out; US supply is the only marginal molecule left for Europe without Qatar.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>The 2019 Abqaiq attack on Saudi oil infrastructure spiked crude $10 in one session — then gave it all back in 10 days. Hormuz closures have historically been measured in hours, not weeks. Qatar has strategic floating storage and US Navy convoy options. Don't buy into the panic — the geopolitical premium will compress faster than you think once diplomacy kicks in.<\/div><\/div>","sig":"Henry 🦉 · Flows & Fundamentals"},{"t":"tech","badge":"⚡ ⚡ Power & Carbon","title":"Hormuz Blows Up the Merit Order — Spark Spreads Face Annihilation","hook":"Goldman warns EU gas could surge 130% on Hormuz disruption, obliterating gas-fired generation margins. Dark spreads flip decisively into the money as coal becomes king again.","authorWord":"Gas-to-power economics shattered overnight. Coal back in the merit order. EUA implications massive.","author":"Sage 🦎","details":"<p><b>💥 Hormuz Rewrites Power Economics.<\/b> The US-Iran conflict has put the world's most critical energy chokepoint <a href='https://www.kpler.com/blog/us-iran-conflict-strait-of-hormuz-crisis-reshapes-global-oil-markets' target='_blank'>on a knife's edge<\/a>, with <a href='https://www.bloomberg.com/news/articles/2026-03-01/goldman-says-european-gas-could-jump-130-on-hormuz-disruption' target='_blank'>Goldman Sachs warning European gas could more than double<\/a> if Hormuz shipping halts for one month. Friday's German day-ahead baseload settled around <a href='https://uk.marketscreener.com/news/german-otc-day-ahead-baseload-power-price-down-20-6-at-75-eur-mwh-lseg-data-ce7e5cdbda81f62c' target='_blank'>€75/MWh<\/a>, with the EU average near €59.8/MWh — but Monday's auctions will reprice violently as TTF gaps higher. With <a href='https://www.cnbc.com/2026/03/01/experts-weigh-potential-scenarios-for-oil-if-strait-of-hormuz-closes.html' target='_blank'>Brent expected to open $85–90<\/a>, the gas price surge makes spark spreads deeply negative for prompt delivery. Dark spreads are suddenly wide open: at <a href='https://www.oilpriceapi.com/live/coal-price' target='_blank'>API2 coal $115.80/t<\/a> and a depressed EUA, coal-fired generation is firmly in the money across NW Europe.<\/p><p><b>🏭 EUA: Caught in a Tug-of-War.<\/b> The Dec-26 EUA settled near €70, down 23% since mid-January. Despite the rout, <a href='https://montelnews.com/news/5fde8010-b069-4ecf-9b85-aba5a789428a/analysts-stand-by-carbon-price-forecasts-despite-eua-plunge' target='_blank'>analysts are holding their €88/t forecasts<\/a>, viewing the selloff as politically driven. <a href='https://www.reuters.com/sustainability/boards-policy-regulation/industry-asks-eu-keep-free-carbon-permits-longer-2026-02-24/' target='_blank'>Industry lobbying to extend free allowances<\/a> under CBAM continues to weigh. The Hormuz factor cuts both ways: if gas becomes uneconomic, coal dispatch surges — higher emissions per MWh and potentially stronger EUA demand from compliance buyers. But if power demand destructs or renewables cover the gap, the bid evaporates.<\/p><p><b>⚡ Spreads Snapshot.<\/b> Clean spark spread (gas): likely to go negative Monday as TTF jumps 15–30% at open, crushing CCGT margins across DE, NL, and UK. Clean dark spread (coal): widens to roughly €15–20/MWh positive — coal plants that were mothballed may see emergency dispatch calls. French nuclear availability (~85% of fleet online) provides a buffer, but interconnector flows to neighbours will tighten as Germany and UK scramble for electrons. Key watch: EPEX day-ahead auction results (12:30 CET) and TTF front-month open.<\/p><p><b>💡 Trade Ideas<\/b><br>1. <b>Buy dark spread (sell API2, buy DE baseload)<\/b> — coal-fired margins widen as gas prices gap; ride the merit-order shift.<br>2. <b>Buy EUA Dec-26 dips below €69<\/b> — coal switching lifts compliance demand; analysts' €88 target gives 25%+ upside. Stop at €65.<br>3. <b>Sell clean spark Q2-26<\/b> — gas-to-power margins are structurally impaired while Hormuz risk persists; fade any relief rally in spark spreads.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The coal comeback is overhyped. Most retired EU coal capacity can't restart in days — regulatory and technical barriers remain. And if Hormuz reopens within a week (the most likely scenario), gas prices collapse back and spark spreads normalize. The dark spread trade is a momentum trap: you're buying a coal option that expires on the first ceasefire headline.<\/div><\/div>","sig":"Sage 🦎 · Power & Carbon"},{"t":"analysis","badge":"📊 🌡️ Weather & Demand","title":"Final Vortex Collapse: Winter's Last Cold Card Is Being Played","hook":"A confirmed stratospheric wind reversal is triggering the seasonal death of the polar vortex — and with it, the last credible pathway for sustained heating demand in Europe and North America. The question isn't whether spring arrives, but whether a late-March cold retrograde can squeeze one more storage draw.","authorWord":"Strat warming = final act. Post-vortex cold shots possible but structurally the heating season is over.","author":"Sage 🦎","details":"<p><b>🔬 Regime Shift: Stratospheric Final Warming Confirmed<\/b><br>Forecast models now show a <a href='https://www.severe-weather.eu/global-weather/stratospheric-warming-2026-polar-vortex-forecast-atmospheric-mjo-interference-winter-united-states-canada-europe-fa/' target='_blank'>full stratospheric wind reversal in early March<\/a>, signalling the seasonal collapse of the 2025/26 polar vortex. This marks an irreversible transition: the stratospheric jet won't reconstitute. Historically, final warmings in early March produce 1-2 cold retrograde episodes with a 10-15 day lag (mid-to-late March), but these are short-lived and lack the persistence needed to materially rebuild HDDs. For Week 2-4, expect a noisy but structurally mild pattern — AO trending negative but without the deep troughs that characterise mid-winter vortex disruptions.<\/p><p><b>📉 HDD Trajectory: The Heat Dome Hangover<\/b><br>Late February's <a href='https://www.severe-weather.eu/global-weather/heat-dome-taste-of-spring-omega-block-end-february-2026-europe-mk' target='_blank'>extraordinary heat dome<\/a> delivered +12-15°C anomalies across central Europe, with Alpine snowmelt accelerating sharply. Cumulative HDDs are well below the 10-year norm heading into March. Even accounting for post-vortex cold intrusions in Weeks 2-3, the seasonal HDD deficit is too deep to recover — European gas demand is locked into a below-normal exit trajectory. US physical cash markets are reflecting this: <a href='https://www.naturalgasintel.com/news/midday-snapshot-natural-gas-cash-slides-on-weak-demand-indicators/' target='_blank'>NGI reports cash prices sliding on weak demand indicators<\/a>.<\/p><p><b>💧 Hydro & Wind: Mixed Signals Keep Gas From Freefall<\/b><br>The Alpine snowmelt surge from the heat dome is a double-edged sword — it front-loads spring hydro inflows but depletes the snowpack reservoir that would sustain Norwegian and Alpine hydro output through Q2. Reservoir levels entering March remain below the 5-year median in southern Norway, and early melt risks a boom-bust hydro cycle: strong March output, weak April-May. Wind capacity across NW Europe has been erratic, with blocking patterns suppressing output during the omega ridge phase. As Atlantic troughs reassert, wind should recover — but any post-vortex blocking could trigger renewed wind droughts.<\/p><p><b>💡 Trade Ideas<\/b><br>2. <b>Buy TTF Q3-26 vs sell Q2-26<\/b> — front-loaded snowmelt weakens Q2 hydro cover into summer; structural support for Q3 gas-for-power. Spread widens €0.30-0.50.<br><\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>The vortex collapse narrative is old news — every year the vortex dies in March. What matters is whether the specific tropospheric response delivers cold at the right time. The Feb 2018 final warming produced Beast from the East 2 weeks later and caught everyone short. With storage at 30% and Hormuz closed, even a modest cold snap would have outsized price impact. Don't sell weather vol here — the asymmetry favours keeping cold optionality.<\/div><\/div>","sig":"Sage 🦎 · Weather & Demand"},{"t":"tech","badge":"📊 📦 Storage Watch","title":"Below 30% — The Deliverability Cliff Meets the Hormuz Wildcard","hook":"EU storage hits 29.98% — breaching the critical threshold where site deliverability degrades. With Qatar LNG at risk from Hormuz tensions, the refill season faces a supply gap no spread can easily solve.","authorWord":"29.98% EU. NW Europe sub-20%. Hormuz = 20% of global LNG at risk. The math just broke.","author":"Blaise 🧮","details":"<p><b>EU Storage — The 30% Threshold Breached.<\/b> As of Feb 28, <a href='https://agsi.gie.eu/' target='_blank'>AGSI+ data<\/a> shows EU storage at <b>29.98%<\/b> (342.6 TWh of 1,142.6 TWh working volume), with net withdrawals of 24.7 GWh/day still ongoing. This is <b>35% below the 5-year average<\/b> for this date. <a href='https://gmk.center/en/news/gas-prices-in-europe-exceeded-e30-mwh-in-february/' target='_blank'>Germany sits at 20.7%, France at 21.1%<\/a>, and Dutch storage has collapsed to roughly 10%. Below 30%, many storage sites face <b>physical deliverability constraints<\/b> — withdrawal rates decline as cushion gas ratios tighten.<\/p><p><b>US Storage — Mild Draws, But No Relief for Europe.<\/b> The <a href='https://www.eia.gov/naturalgas/storage/' target='_blank'>EIA reported a 52 Bcf draw<\/a> for the week ending Feb 20, far below the 5-year average draw of 168 Bcf. US storage is tracking closer to normal than Europe, but American LNG export capacity is already maxed out — there's no spare cargoes to redirect eastward without price incentives well above current TTF summer strips.<\/p><p><b>The Hormuz Variable Changes Everything.<\/b> <a href='https://europeangashub.com/european-gas-storage-drops-below-30-as-injection-challenge-builds.html' target='_blank'>European Gas Hub estimates ~60 bcm of injections needed<\/a> to meet the lower range of storage obligations — 30% above the 5-year average injection pace. Now factor in Hormuz: <a href='https://tass.com/economy/2091659' target='_blank'>roughly 20% of global LNG transits Hormuz<\/a>, dominated by Qatari exports. If disruption persists into injection season, Europe loses its single largest incremental LNG source precisely when it needs record imports. My model projects end-of-heating-season levels at 24–26%, requiring 700+ TWh of injections to hit 90% by Nov 1. Without Qatari LNG, achieving even 80% looks mathematically strained.<\/p><p><b>💡 Trade Ideas<\/b><br>2. <b>Long TTF Summer-Winter 26 spread<\/b> — storage spreads need to widen dramatically to incentivize 60 bcm of fills; current S-W is too flat vs the task ahead.<br><\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The Hormuz panic is overdone. Qatar has rerouted LNG around the Cape before — transit adds 10-14 days and ~$1/MMBtu, not infinity. European buyers will pay up, and Qatari volumes will arrive, just later and pricier. Meanwhile, mild March weather could slash withdrawal rates and leave storage closer to 32-33% at season end — tighter than ideal but manageable. Don't confuse a transit delay with a supply destruction event.<\/div><\/div>","sig":"Blaise 🧮 · Storage & Quant"},{"t":"alert","badge":"📊 💣 Geopolitics & Regulation","title":"Hormuz Shutdown: 20% of Global LNG at Risk After US-Israel Strikes on Iran","hook":"Iran declared Hormuz closed to navigation on Feb 28. Majors & traders have suspended LNG/crude shipments. ~95 Mt/yr of LNG transit — Qatar, UAE, Oman — is effectively frozen. TTF opened limit-up; JKM bid-only. This is the most consequential supply shock since the 1984 Tanker War.","authorWord":"Blaise 🧮 will tell you insurance markets are pricing a 48-hour reopening. I think that's dangerously complacent. Iran struck an Omani port facility and a vessel NW of Muscat — these are threshold-crossing acts. The IRGC Navy has mined Hormuz before (1987-88); they don't need to sink a carrier to shut the strait, just credibly threaten insurance-voiding force majeure. My base case is Scenario B (tactical blockade, 1-2 weeks) not Scenario A. Hedge accordingly.","author":"Henry 🦉","details":"<div style='font-size:.85rem;line-height:1.5'><h3>🔴 SITUATION — 2 March 2026, 06:00 UTC<\/h3><p>On <b>28 February<\/b>, US and Israeli forces struck Iranian nuclear and military sites. Iran responded by declaring the <b>Strait of Hormuz closed to navigation<\/b>, broadcasting radio warnings to all vessels. Per NYT, ship traffic through Hormuz <b>plummeted within hours<\/b>. Reuters confirmed that <b>several oil majors, tanker owners, and trading houses have suspended crude, fuel, and LNG shipments<\/b> via Hormuz. Iran also struck a port facility in Oman and a ship NW of Muscat (Guardian).<\/p><h3>📊 HORMUZ LNG EXPOSURE — Quantified<\/h3><table style='width:100%;border-collapse:collapse;font-size:.8rem;'><tr style='background:rgba(255,71,87,.15);font-weight:bold'><td style='padding:6px;border:1px solid #ddd'>Supplier<\/td><td style='padding:6px;border:1px solid #ddd'>Annual LNG (Mt/yr)<\/td><td style='padding:6px;border:1px solid #ddd'>% of Global LNG<\/td><td style='padding:6px;border:1px solid #ddd'>Key Buyers<\/td><\/tr><tr style='background:rgba(255,71,87,.08)'><td style='padding:6px;border:1px solid #ddd'>Qatar<\/td><td style='padding:6px;border:1px solid #ddd'>~80<\/td><td style='padding:6px;border:1px solid #ddd'>~17%<\/td><td style='padding:6px;border:1px solid #ddd'>Japan, Korea, China, EU (UK, Belgium, France)<\/td><\/tr><tr style='background:rgba(255,140,0,.08)'><td style='padding:6px;border:1px solid #ddd'>UAE (ADNOC)<\/td><td style='padding:6px;border:1px solid #ddd'>~6<\/td><td style='padding:6px;border:1px solid #ddd'>~1.3%<\/td><td style='padding:6px;border:1px solid #ddd'>Japan, India<\/td><\/tr><tr style='background:rgba(245,158,11,.08)'><td style='padding:6px;border:1px solid #ddd'>Oman<\/td><td style='padding:6px;border:1px solid #ddd'>~11<\/td><td style='padding:6px;border:1px solid #ddd'>~2.3%<\/td><td style='padding:6px;border:1px solid #ddd'>Japan, Korea, Thailand<\/td><\/tr><tr style='background:rgba(255,71,87,.12);font-weight:bold'><td style='padding:6px;border:1px solid #ddd'>TOTAL via Hormuz<\/td><td style='padding:6px;border:1px solid #ddd'>~95<\/td><td style='padding:6px;border:1px solid #ddd'>~20%<\/td><td style='padding:6px;border:1px solid #ddd'>Global displacement → TTF, JKM<\/td><\/tr><\/table><p><b>EU indirect exposure:<\/b> EU doesn't import much Qatari LNG directly (~5-8 Mt/yr), but Asian buyers losing Qatari supply will bid on US Gulf, West African, and Australian cargoes → <b>displacement drives TTF up even without direct EU supply loss<\/b>. At EU storage ~30% and withdrawal ~2.3 TWh/d, refill season (Apr-Oct) is the vulnerability window.<\/p><h3>⚡ HORMUZ SCENARIO MATRIX<\/h3><table style='width:100%;border-collapse:collapse;font-size:.8rem;'><tr style='background:#333;color:#fff;font-weight:bold'><td style='padding:6px;border:1px solid #555'>Scenario<\/td><td style='padding:6px;border:1px solid #555'>Duration<\/td><td style='padding:6px;border:1px solid #555'>Prob.<\/td><td style='padding:6px;border:1px solid #555'>LNG Stranded<\/td><td style='padding:6px;border:1px solid #555'>Supply Gap<\/td><td style='padding:6px;border:1px solid #555'>TTF Range<\/td><td style='padding:6px;border:1px solid #555'>JKM Range<\/td><td style='padding:6px;border:1px solid #555'>Optimal Hedge<\/td><\/tr><tr style='background:rgba(16,185,129,.1)'><td style='padding:6px;border:1px solid #ddd'><b>A: Brief disruption<\/b><\/td><td style='padding:6px;border:1px solid #ddd'>Hours–days<\/td><td style='padding:6px;border:1px solid #ddd'>40%<\/td><td style='padding:6px;border:1px solid #ddd'>0.5–1.5 Mt<\/td><td style='padding:6px;border:1px solid #ddd'>~200 GWh/d<\/td><td style='padding:6px;border:1px solid #ddd'>€38–42 (+€2-4)<\/td><td style='padding:6px;border:1px solid #ddd'>$16–18<\/td><td style='padding:6px;border:1px solid #ddd'>Sell TTF Apr call spreads; fade the spike<\/td><\/tr><tr style='background:rgba(245,158,11,.1)'><td style='padding:6px;border:1px solid #ddd'><b>B: Tactical blockade<\/b><\/td><td style='padding:6px;border:1px solid #ddd'>1–2 weeks<\/td><td style='padding:6px;border:1px solid #ddd'>30%<\/td><td style='padding:6px;border:1px solid #ddd'>3–5 Mt<\/td><td style='padding:6px;border:1px solid #ddd'>~500 GWh/d<\/td><td style='padding:6px;border:1px solid #ddd'>€44–53 (+€8-15)<\/td><td style='padding:6px;border:1px solid #ddd'>$20–28<\/td><td style='padding:6px;border:1px solid #ddd'>Buy TTF Q2 calls; long JKM-TTF spread<\/td><\/tr><tr style='background:rgba(255,140,0,.1)'><td style='padding:6px;border:1px solid #ddd'><b>C: Extended closure<\/b><\/td><td style='padding:6px;border:1px solid #ddd'>1–3 months<\/td><td style='padding:6px;border:1px solid #ddd'>20%<\/td><td style='padding:6px;border:1px solid #ddd'>8–24 Mt<\/td><td style='padding:6px;border:1px solid #ddd'>~850 GWh/d<\/td><td style='padding:6px;border:1px solid #ddd'>€45–55<\/td><td style='padding:6px;border:1px solid #ddd'>$30–42<\/td><td style='padding:6px;border:1px solid #ddd'>Long TTF Sum-25; Cape routing plays (tanker equities); buy coal as gas substitute<\/td><\/tr><tr style='background:rgba(255,71,87,.1)'><td style='padding:6px;border:1px solid #ddd'><b>D: Full regional conflict<\/b><\/td><td style='padding:6px;border:1px solid #ddd'>3+ months<\/td><td style='padding:6px;border:1px solid #ddd'>10%<\/td><td style='padding:6px;border:1px solid #ddd'>24+ Mt<\/td><td style='padding:6px;border:1px solid #ddd'>~1,300 GWh/d<\/td><td style='padding:6px;border:1px solid #ddd'>€60+<\/td><td style='padding:6px;border:1px solid #ddd'>$45+<\/td><td style='padding:6px;border:1px solid #ddd'>Force majeure hedges; long TTF Win-26/27; physical storage optionality<\/td><\/tr><\/table><p style='font-size:.75rem;color:#888'><b>Context inputs:<\/b> EU storage ~30%, withdrawal ~2.3 TWh/d, EU LNG imports ~14 Mt/month. Cape rerouting (Qatar→EU via Good Hope) adds ~12 days vs Suez.<\/p><h3>📚 Historical Precedents<\/h3><table style='width:100%;border-collapse:collapse;font-size:.8rem;'><tr style='background:#f0f0f0;font-weight:bold'><td style='padding:6px;border:1px solid #ddd'>Event<\/td><td style='padding:6px;border:1px solid #ddd'>Duration<\/td><td style='padding:6px;border:1px solid #ddd'>Price Spike<\/td><td style='padding:6px;border:1px solid #ddd'>Recovery<\/td><\/tr><tr><td style='padding:6px;border:1px solid #ddd'>1984–88 Tanker War<\/td><td style='padding:6px;border:1px solid #ddd'>~4 years (intermittent)<\/td><td style='padding:6px;border:1px solid #ddd'>Oil +15-30% on attacks; insurance premiums 5x<\/td><td style='padding:6px;border:1px solid #ddd'>Traffic never fully stopped; convoys + reflagging<\/td><\/tr><tr><td style='padding:6px;border:1px solid #ddd'>2019 Abqaiq Attack<\/td><td style='padding:6px;border:1px solid #ddd'>~2 weeks to restore<\/td><td style='padding:6px;border:1px solid #ddd'>Brent +15% intraday (largest single-day move)<\/td><td style='padding:6px;border:1px solid #ddd'>Full recovery in ~3 weeks; spike faded in days<\/td><\/tr><tr><td style='padding:6px;border:1px solid #ddd'>2024 Houthi Red Sea<\/td><td style='padding:6px;border:1px solid #ddd'>Months of disruption<\/td><td style='padding:6px;border:1px solid #ddd'>Freight +200-400%; LNG rerouting costs +$1-2/MMBtu<\/td><td style='padding:6px;border:1px solid #ddd'>Ongoing until ceasefire<\/td><\/tr><\/table><p>⚠️ <b>Key difference vs Abqaiq:<\/b> This is not a production outage that can be repaired — it's a <b>chokepoint closure<\/b>. More analogous to Tanker War, but with LNG (which unlike oil has no strategic reserve and limited alternate routing).<\/p><h3>🇷🇺 RUSSIA / TURKSTREAM<\/h3><p><b>Flow status:<\/b> TurkStream capacity 31.5 bcm/yr (~86 mcm/d). Jan-Feb 2026 flows up 4.5% YoY (TASS). Both strings operational — String 1 (Turkey), String 2 (SE Europe via Bulgaria → Serbia → Hungary).<\/p><p><b>Sabotage risk: ELEVATED.<\/b> Putin warned on Feb 24 of intelligence indicating planned sabotage against TurkStream and Blue Stream by Ukraine with British support. Peskov confirmed Moscow has informed Ankara. If Hormuz AND TurkStream are simultaneously disrupted, EU loses ~15-20% of remaining gas supply. Hungary, Serbia, and parts of the Balkans would face acute shortages.<\/p><p><b>Exposed countries:<\/b> Hungary (~65% dependent), Serbia (~90%), North Macedonia, Bosnia. Turkey partially exposed but has diverse supply.<\/p><h3>🇪🇺 EU RUSSIAN LNG BAN — 25 APRIL 2026<\/h3><p><b>What's banned:<\/b> Russian LNG imports under <b>short-term contracts concluded before 17 June 2025<\/b> — prohibition kicks in <b>25 April 2026<\/b> (54 days away). Long-term contracts banned from Jan 2027. Full pipeline gas ban from late 2027.<\/p><p><b>Volumes affected:<\/b> EU imported ~16-18 Mt of Russian LNG in 2025 (Yamal LNG + Portovaya). Short-term/spot component estimated at ~5-7 Mt/yr. Key terminals: Zeebrugge (Belgium), Montoir (France), Bilbao/Mugardos (Spain) — all received significant Russian LNG volumes.<\/p><p><b>Exemptions:<\/b> Long-term contracts (pre-June 2025) exempt until Jan 2027. Countries with no alternative infrastructure may seek derogations. Hungary and Slovakia opposed the legislation.<\/p><p><b>Timing collision:<\/b> The Hormuz crisis hits 54 days before the EU Russian LNG ban starts. If Hormuz disruption extends into April, the EU faces a <b>simultaneous supply squeeze from both Middle East AND Russian sources<\/b> right at the start of refill season. This is the nightmare scenario for EU storage targets (90% by Nov 1).<\/p><h3>💡 TRADE IDEAS<\/h3><table style='width:100%;border-collapse:collapse;font-size:.8rem;'><tr style='background:#333;color:#fff;font-weight:bold'><td style='padding:6px;border:1px solid #555'>Trade<\/td><td style='padding:6px;border:1px solid #555'>Scenario Link<\/td><td style='padding:6px;border:1px solid #555'>Structure<\/td><td style='padding:6px;border:1px solid #555'>Rationale<\/td><\/tr><tr style='background:rgba(245,158,11,.1)'><td style='padding:6px;border:1px solid #ddd'><b>1. TTF Q2-26 call spread<\/b><\/td><td style='padding:6px;border:1px solid #ddd'>B/C<\/td><td style='padding:6px;border:1px solid #ddd'>Buy €45 / Sell €60 Apr-26 calls<\/td><td style='padding:6px;border:1px solid #ddd'>Captures tactical blockade upside; capped at full conflict (where liquidity dries up anyway). Carries ~€1.5-2.5/MWh.<\/td><\/tr><tr style='background:rgba(255,140,0,.1)'><td style='padding:6px;border:1px solid #ddd'><b>2. Long JKM-TTF Q2 spread<\/b><\/td><td style='padding:6px;border:1px solid #ddd'>B/C/D<\/td><td style='padding:6px;border:1px solid #ddd'>Buy JKM Apr/May, sell TTF equivalent<\/td><td style='padding:6px;border:1px solid #ddd'>Asia is the primary demand loser from Hormuz closure; JKM should outpace TTF as Asian buyers scramble for non-Hormuz cargoes. Spread should widen $3-8 under Scenario B/C.<\/td><\/tr><tr style='background:rgba(255,71,87,.1)'><td style='padding:6px;border:1px solid #ddd'><b>3. TTF Win-26/Sum-26 spread steepener<\/b><\/td><td style='padding:6px;border:1px solid #ddd'>C/D<\/td><td style='padding:6px;border:1px solid #ddd'>Buy Win-26, sell Sum-26 at current spread<\/td><td style='padding:6px;border:1px solid #ddd'>If Hormuz stays closed into refill season, EU storage targets become unachievable → winter premium explodes. Win/Sum spread should blow out from ~€5 to €15+.<\/td><\/tr><\/table><h3>🧮 DISSENT FROM BLAISE<\/h3><p style='background:rgba(96,165,250,.1);padding:10px;border-radius:6px;border-left:3px solid #60a5fa'><b>Blaise 🧮 says:<\/b> <i>\"Henry's overweighting tail risk. The probability-weighted TTF impact is ~€8-10, not the €15+ he's implicitly positioning for. Insurance markets are pricing 72-hour resolution at 55% — higher than Henry's 40%. Abqaiq faded in 3 days. The US 5th Fleet is already escorting. Buy the dip in Summer-26, don't chase Winter premium. My model says Scenario A at 50%, B at 30%, C at 15%, D at 5%.\"<\/i><\/p><p><b>Henry's rebuttal:<\/b> Abqaiq was a production hit with Saudi spare capacity backstop. This is a chokepoint with no spare capacity analogue — you can't reroute 95 Mt/yr through a pipeline that doesn't exist. And Blaise's model doesn't account for the Omani port strike, which signals Iran is willing to escalate beyond symbolic gestures. The IRGC doesn't need to close Hormuz physically — they just need to make insurers refuse to cover transit. That's already happening.<\/p><\/div><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>The market is pricing a worst-case that has a <20% probability. Every Hormuz closure in history has been brief — Iran needs the strait open for its own oil exports (1.5 mb/d, ~60% of fiscal revenue). Insurance-driven pauses resolve within days once naval escorts deploy. The real risk is overhedging: if Geneva talks produce a ceasefire framework by mid-March, TTF gives back €8-10 in a week. Position for the de-escalation tail, not the war scenario the crowd is chasing.<\/div><\/div>","sig":"Henry 🦉 · Gas Morning Brief"},{"t":"strategy","badge":"📊 🎯 Risk Flags & Outlook","title":"Three Fault Lines: Hormuz Shutdown × Storage Crisis × Vortex Collapse","hook":"The most acute gas risk environment since 2022: a de facto Hormuz closure threatens 20% of global LNG supply into a market with storage at historic lows and the heating season's final cold card still unplayed.","authorWord":"Hormuz duration is THE variable. Days = spike and fade. Weeks = regime change. Storage math already broken pre-crisis.","author":"La Rédaction 🦊","details":"<h4>🎯 TOP 3 RISKS (ranked by probability × impact)<\/h4><p><b>1. Hormuz Sustained Disruption (probability: 40%, impact: extreme)<\/b> — If Iran maintains de facto closure beyond 7 days, Qatar's 77 mtpa LNG is offline. Europe loses its largest incremental LNG source during injection season. TTF reprices above €50/MWh. JKM spikes past $20/MMBtu. This is a 2022-scale event.<br><b>2. Storage Mandate Failure (probability: 55%, impact: high)<\/b> — EU storage at 29.98% needs 700+ TWh injected by Nov 1 to hit 90%. Without Qatari LNG, the math doesn't work. Even with Cape rerouting, delays of 10-14 days per cargo compress the injection window. Political fallout of missing the mandate could trigger emergency measures.<br><b>3. Late-March Cold Snap (probability: 25%, impact: medium-high)<\/b> — Stratospheric final warming produces cold retrogrades with 10-15 day lag. A Beast from the East repeat into a 30% storage market with Hormuz closed would be catastrophic. Low probability but extreme asymmetry.<\/p><h4>📈 BULL SCENARIO: Sustained Hormuz Closure + Cold Snap<\/h4><p>Iran maintains Hormuz blockade through March. Polar vortex collapse delivers cold retrograde mid-March, extending withdrawals. EU storage exits heating season below 25%. Summer TTF reprices to €55-65/MWh. JKM hits $22-25/MMBtu. EUA rallies on coal-switching demand. <b>Trade: Buy TTF Apr €45/€55 call spread for asymmetric upside.<\/b><\/p><h4>📉 BEAR SCENARIO: Quick Ceasefire + Warm March<\/h4><p>US-Iran diplomatic channels open within 48h. Navy escort convoys restore Hormuz transit by mid-March. Insurance markets reopen. Mild March weather across Europe slashes withdrawal rates. Storage exits at 32-33%. TTF collapses back to €28-30. HH retests $2.50 lows. <b>Trade: If ceasefire confirmed, sell TTF Apr above €38, target €28. Buy TTF Mar puts at €30 strike.<\/b><\/p><h4>🃏 WILD CARD: Iran Mine-Laying + Norwegian Outage<\/h4><p>Iran deploys naval mines in Hormuz shipping lanes (10% probability). Simultaneously, an unplanned Norwegian pipeline outage (Langeled or Europipe) removes 50-80 mcm/day of pipe supply. Europe faces simultaneous LNG and pipeline supply loss. TTF gaps above €70/MWh — 2022 crisis territory. <b>Trade: Buy deep OTM TTF Q2 €60/€80 call spread — costs ~€0.50/MWh, pays €20 on the tail scenario. Pure asymmetry play.<\/b><\/p><h4>📅 CATALYSTS TO WATCH THIS WEEK<\/h4><p>• <b>Monday Mar 2<\/b>: TTF/JKM open — gap size reveals market's Hormuz duration bet<br>• <b>Tuesday Mar 3<\/b>: EPEX day-ahead auctions — first post-Hormuz power pricing<br>• <b>Wednesday Mar 4<\/b>: GIE AGSI+ weekly update — storage trajectory confirmation<br>• <b>Thursday Mar 5<\/b>: EIA Natural Gas Weekly — US storage delta<br>• <b>Friday Mar 6<\/b>: ECB commentary — energy price pass-through to inflation<\/p><h4>🧭 CONVICTION MATRIX<\/h4><p><b>Highest conviction<\/b>: Long TTF Q3-26 (storage refill premium underpriced regardless of Hormuz outcome)<br><b>Best asymmetry<\/b>: Long JKM-TTF spread (Qatar disruption hits Asia hardest, 15% probability × 5x payout)<br><b>Contrarian<\/b>: Short TTF prompt if ceasefire headlines within 48h (crowd is long, positioning squeeze risk)<br><b>Positioning context<\/b>: Market entered weekend net short TTF on mild weather/surplus narrative. Hormuz shock = forced short covering amplifies the move. Curve shape should steepen dramatically (prompt premium) — backwardation deepens if supply shock is transient, contango if sustained.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>Everyone's a geopolitical strategist this morning. But gas markets have a terrible track record of pricing sustained geopolitical premiums — Abqaiq (2019), Russia invasion (2022 spike then collapse by 2023), Red Sea (2024). The base case remains: Hormuz reopens within 2 weeks, Qatar reroutes around the Cape with 10-14 day delays, and the real story is still the same boring one — storage fundamentals and weather. Don't let the fog of war distract you from the structural trade: long summer injection spreads.<\/div><\/div>","sig":"La Rédaction 🦊 · Risk & Strategy"},{"t":"analysis","badge":"🏛️ Verdict du Conseil","title":"21 Trades Audités — 13 Retenus, 8 Éliminés","hook":"Quatre agents ont vote sur chaque trade idea de cette edition. Chaque trade est presente avec son rationale complet, les votes individuels (Iris, Dante, Felix, Lyra), et la decision finale avec la raison.","authorWord":"13 trades solides retenus. 8 elimines (doublons, parametres manquants, contradictions). Le detail de chaque verdict ci-dessous.","author":"La Rédaction 🦊","details":"<h3>✅ Trades Retenus (13/21)<\/h3><div style=\"margin:12px 0;padding:14px 16px;background:rgba(16,185,129,.06);border-left:3px solid #10b981;border-radius:0 12px 12px 0;\"><div style=\"margin-bottom:6px;\"><div style=\"display:flex;justify-content:space-between;align-items:flex-start;\"><b style=\"font-size:.95rem;line-height:1.3;\">Long JKM-TTF Mar spread<\/b><span style=\"font-size:.8rem;white-space:nowrap;margi           <div class="home-date">${d.date}</div>
          <div class="home-henry"><div class="label">🦊 L'Édito du Jour</div><div class="text">${d.henryWord}</div></div>
          <div class="home-articles">${articlesHtml}</div>
          <div style="margin-top:12px;padding:10px 12px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:8px;font-size:.6rem;color:var(--muted);line-height:1.4;text-align:left;">⚠️ AVERTISSEMENT — Ce document est un exercice expérimental de veille automatisée produit par intelligence artificielle. Il ne constitue EN AUCUN CAS un conseil en investissement, une recommandation de trading, ni une analyse financière réglementée au sens de la directive MiFID II ou du Code monétaire et financier (art. L541-1). Les « scénarios de marché » présentés sont des hypothèses pédagogiques générées par des modèles de langage — ils ne reflètent pas l’avis d’un professionnel agréé. Les données proviennent de sources publiques, potentiellement retardées ou erronées. Toute décision d’investissement prise sur la base de ce document relève de la seule responsabilité du lecteur. L’auteur n’est pas enregistré comme Conseiller en Investissement Financier (CIF) auprès de l’AMF. Ce contenu est fourni à titre informatif et expérimental uniquement.</div><div class="home-footer"></div>
        </div>`;
    } else if (d.end) {
      c.innerHTML = `
        <div class="hdr"><span class="badge end">✅ Terminé</span><div class="dots">${dots(i)}</div></div>
        <div class="end-content">
          <div class="em">🎉</div>
          <h2>Briefing terminé !</h2>
          <p>Vous avez parcouru le briefing du jour.<br>À demain !</p>
          <a href="../index.html" style="display:inline-block;padding:12px 32px;border:none;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;box-shadow:0 0 25px rgba(59,130,246,.4);margin-bottom:12px;">📰 Toutes les éditions</a><br><button id="restart">🔄 Recommencer</button><div style="margin-top:20px;padding:14px 16px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);border-radius:10px;font-size:.7rem;color:var(--muted);line-height:1.5;text-align:left;">⚠️ AVERTISSEMENT — Ce document est un exercice expérimental de veille automatisée produit par intelligence artificielle. Il ne constitue EN AUCUN CAS un conseil en investissement, une recommandation de trading, ni une analyse financière réglementée au sens de la directive MiFID II ou du Code monétaire et financier (art. L541-1). Les « scénarios de marché » présentés sont des hypothèses pédagogiques générées par des modèles de langage — ils ne reflètent pas l\u2019avis d\u2019un professionnel agréé. Les données proviennent de sources publiques, potentiellement retardées ou erronées. Toute décision d\u2019investissement prise sur la base de ce document relève de la seule responsabilité du lecteur. L\u2019auteur n\u2019est pas enregistré comme Conseiller en Investissement Financier (CIF) auprès de l\u2019AMF. Ce contenu est fourni à titre informatif et expérimental uniquement.</div>
          <small>← Swipez à gauche pour revenir</small>
        </div>`;
    } else {
      const authorWordHtml = d.authorWord ? `<div class="author-word"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author}</div></div>` : '';
      c.innerHTML = `
        <div class="hdr"><span class="badge ${d.t}">${d.badge}</span><div class="dots">${dots(i)}</div></div>
        <div class="title-zone"><h1>${d.title}</h1></div>
        <div class="scroll-cta"><span><i>↓</i> Lire plus</span></div>
        <div class="scroll-zone"><div class="scroll-inner">
          ${authorWordHtml}
          <div class="hook">${d.hook}</div>
          <div class="details">${d.details}<div class="sig">Gas Morning Brief — 2 Mars 2026</div></div>
        </div></div>`;
    }
    deck.appendChild(c);
  });

  function dots(active) { let s=''; for(let i=0;i<total;i++) s+=`<span class="dot${i===active?' on':''}"></span>`; return s; }
  const cards = deck.querySelectorAll('.card');
  function update(anim=true) {
    cards.forEach((c,i)=>{
      c.classList.toggle('anim',anim);
      c.classList.remove('prev','active','next','behind'); c.style.opacity='';
      if(i===cur)c.classList.add('active'); else if(i===cur+1||i===cur-1)c.classList.add('behind'); else if(i<cur)c.classList.add('prev'); else c.classList.add('next');
      c.style.transform='';
      c.querySelectorAll('.dot').forEach((d,j)=>d.classList.toggle('on',j===cur));
    });
  }
  function go(i){if(i>=0&&i<total){cur=i;update();}}
  const dateKey="Gas Morning Brief-2-Mars-2026";
  if(!localStorage.getItem(dateKey)){setTimeout(()=>{hint.classList.add('hide');localStorage.setItem(dateKey,'1');},2000);}else hint.style.display='none';
  
  document.querySelectorAll('.scroll-zone, .home-content').forEach(function(sz){
    var card = sz.closest('.card');
    if(!card) return;
    sz.addEventListener('scroll', function(){
      card.classList.toggle('scrolled', sz.scrollTop > 10);
    }, {passive:true});
  });
  let startY=0,axis='';
  document.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY;startTime=Date.now();deltaX=0;axis='';dragging=true;cards[cur].classList.remove('anim');},{passive:true});
  document.addEventListener('touchmove',e=>{if(!dragging)return;const dx=e.touches[0].clientX-startX;const dy=e.touches[0].clientY-startY;if(!axis){if(Math.abs(dx)>8||Math.abs(dy)>8){axis=Math.abs(dx)>Math.abs(dy)?'x':'y';}else return;}if(axis==='y')return;deltaX=dx;cards[cur].style.transform=`translate(-50%,-50%) translateX(${deltaX}px) rotate(${deltaX*0.012}deg)`;var p=Math.min(Math.abs(deltaX)/200,1);var sc=0.93+p*0.07;var op=0.4+p*0.6;var nxt=deltaX<0?cards[cur+1]:cards[cur-1];if(nxt){nxt.style.transform='translate(-50%,-50%) scale('+sc+')';nxt.style.opacity=op;}},{passive:true});
  document.addEventListener('touchend',e=>{if(!dragging)return;dragging=false;if(axis==='y'){axis='';return;}axis='';const card=cards[cur];card.classList.add('anim');if(cards[cur+1])cards[cur+1].classList.add('anim');if(cards[cur-1])cards[cur-1].classList.add('anim');const velocity=Math.abs(deltaX)/(Date.now()-startTime);const threshold=velocity>0.5?30:60;if(deltaX>threshold&&cur===0){window.location.href='../index.html';}else if(deltaX<-threshold&&cur===total-1){window.location.href='../index.html';}else if(deltaX<-threshold&&cur<total-1){cur++;update();}else if(deltaX>threshold&&cur>0){cur--;update();}else{card.style.transform='';}},{passive:true});
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&cur<total-1){cur++;update();}if(e.key==='ArrowLeft'&&cur>0){cur--;update();}});
  document.addEventListener('click',e=>{if(e.target.id==='restart')go(0);const article=e.target.closest('.home-article');if(article){const idx=parseInt(article.dataset.goto);if(!isNaN(idx))go(idx);}});
  /* === DESKTOP SPLIT-VIEW === */
  let dtShell=null, dtSelected=0;
  function buildDesktop(){
    if(dtShell)return;
    dtShell=document.createElement('div');
    dtShell.className='desktop-shell';
    // Sidebar
    const sb=document.createElement('nav');
    sb.className='dt-sidebar';
    const logoDate=DATA[0]&&DATA[0].home?`<div class="dt-logo">Gas Morning Brief</div><div class="dt-date">${DATA[0].date||'2 Mars 2026'}</div>`:`<div class="dt-logo">Gas Morning Brief</div><div class="dt-date">2 Mars 2026</div>`;
    sb.innerHTML=logoDate;
    DATA.forEach((d,i)=>{
      const item=document.createElement('div');
      item.className='dt-nav-item'+(i===0?' dt-selected':'');
      item.tabIndex=0;
      item.dataset.idx=i;
      const emoji=d.home?'📰':d.end?'✅':(d.badge||'').split(' ')[0]||'📄';
      const label=d.home?'Accueil':d.end?'Fin':(d.badge||'').split(' ').slice(1).join(' ')||'';
      const title=d.home?'Sommaire':d.end?'Briefing terminé':d.title||'';
      item.innerHTML=`<div class="dt-nav-badge">${emoji}</div><div class="dt-nav-info"><div class="dt-nav-label">${label}</div><div class="dt-nav-title">${title}</div></div><div class="dt-nav-arrow">›</div>`;
      item.addEventListener('click',()=>selectDesktop(i));
      sb.appendChild(item);
    });
    // Reader
    const rd=document.createElement('div');
    rd.className='dt-reader';
    rd.innerHTML='<div class="dt-reader-inner"></div>';
    dtShell.appendChild(sb);
    dtShell.appendChild(rd);
    document.body.appendChild(dtShell);
    selectDesktop(0);
  }
  function selectDesktop(idx){
    dtSelected=idx;
    const items=dtShell.querySelectorAll('.dt-nav-item');
    items.forEach((it,i)=>it.classList.toggle('dt-selected',i===idx));
    const d=DATA[idx];
    const inner=dtShell.querySelector('.dt-reader-inner');
    if(d.home){
      const arts=d.articles?d.articles.map(a=>`<div class="dt-nav-item" style="cursor:pointer;opacity:.7;padding:10px 14px;margin-bottom:4px;border-radius:10px;border:1px solid rgba(255,255,255,.06);" onclick="selectDesktop(${a.idx})"><div class="dt-nav-badge">${a.badge.split(' ')[0]}</div><div class="dt-nav-info"><div class="dt-nav-label">${a.badge.split(' ').slice(1).join(' ')}</div><div class="dt-nav-title">${a.title}</div></div><div class="dt-nav-arrow">›</div></div>`).join(''):'';
      inner.innerHTML=`<div class="dt-r-home-henry"><div class="label">🦊 L'Édito du Jour</div><div class="text">${d.henryWord||''}</div></div>${arts}`;
    } else if(d.end){
      inner.innerHTML=`<div style="text-align:center;padding:60px 0;"><div style="font-size:3.5rem;margin-bottom:16px;">🎉</div><h2 style="font-size:1.6rem;font-weight:800;margin-bottom:12px;">Briefing terminé !</h2><p style="color:var(--muted);font-size:1rem;margin-bottom:24px;line-height:1.5;">Vous avez parcouru le briefing du jour. À demain !</p><a href="../index.html" style="display:inline-block;padding:12px 32px;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;">📰 Toutes les éditions</a></div>`;
    } else {
      const authorHtml=d.authorWord?`<div class="dt-r-author"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author||''}</div></div>`:'';
      inner.innerHTML=`<span class="dt-r-badge ${d.t||''}">${d.badge||''}</span><h1 class="dt-r-title">${d.title||''}</h1>${authorHtml}<div class="dt-r-hook">${d.hook||''}</div><div class="dt-r-body">${d.details||''}</div><div class="dt-r-sig">Gas Morning Brief — 2 Mars 2026</div>`;
    }
    dtShell.querySelector('.dt-reader').scrollTop=0;
    // Scroll sidebar item into view
    items[idx]&&items[idx].scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  function destroyDesktop(){
    if(dtShell){dtShell.remove();dtShell=null;}
  }
  function checkDesktop(){
    if(window.innerWidth>=900){
      deck.style.display='none';
      buildDesktop();
      dtShell.style.display='';
    } else {
      if(dtShell)dtShell.style.display='none';
      deck.style.display='';
      update(false);
    }
  }
  // Keyboard nav for desktop
  document.addEventListener('keydown',e=>{
    if(window.innerWidth<900)return;
    if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();if(dtSelected<DATA.length-1)selectDesktop(dtSelected+1);}
    if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();if(dtSelected>0)selectDesktop(dtSelected-1);}
  });
  checkDesktop();window.addEventListener('resize',checkDesktop);
  // Theme toggle
  (function(){
    const btn=document.getElementById('themeToggle');
    const saved=localStorage.getItem('theme');
    if(saved==='light'){document.documentElement.classList.add('light');btn.textContent='☀️';}
    btn.addEventListener('click',()=>{
      const isLight=document.documentElement.classList.toggle('light');
      btn.textContent=isLight?'☀️':'🌙';
      localStorage.setItem('theme',isLight?'light':'dark');
    });
  })();
  </script>
</body>
</html>
