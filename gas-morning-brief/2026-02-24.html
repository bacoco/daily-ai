<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gas Morning Brief — 24 Février 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;

      --green: #10b981;

      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {

    }

    html.light .details p { color: rgba(0,0,0,.75); }

    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }

    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    html.light .details div[style*="background"], html.light .details p[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Light mode: override inline white colors in trade cards */
    html.light .details p[style], html.light .details b[style], html.light .details span[style], html.light .details div[style] { color: rgba(0,0,0,.85) !important; }
    html.light .details div[style*="border-left:3px solid #f59e0b"] { background: rgba(245,158,11,.08) !important; }
    html.light .details div[style*="border-left:3px solid #10b981"] { background: rgba(16,185,129,.08) !important; }
    html.light .details div[style*="border-left:3px solid #ff4757"] { background: rgba(255,71,87,.06) !important; }
    html.light .details div[style*="color:#f59e0b"] { color: #b45309 !important; }
    html.light .details div[style*="color:#10b981"] { color: #047857 !important; }
    html.light .details div[style*="color:#ff4757"] { color: #dc2626 !important; }
    html.light .details h3 { color: #1a1a2e !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details p[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }

      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }

        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }

      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }
      .dt-reader .dt-r-body p { margin-bottom: 18px; }
      .dt-reader .dt-r-body strong { color: #fff; font-weight: 600; }
      .dt-reader .dt-r-body a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
      .dt-reader .dt-r-body .quote { border-left: 3px solid var(--blue); padding: 14px 18px; margin: 20px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-style: italic; font-size: .95rem; line-height: 1.6; color: rgba(255,255,255,.9); }
      .dt-reader .dt-r-body .dissent { margin-top: 24px; padding: 16px 18px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }

  <script>
  const DATA = [{"t":"home","home":true,"date":"24 Février 2026","henryWord":"Hormuz tensions collide with EU storage at historic lows — the gas market is caught between record LNG arrivals and a geopolitical tinderbox. The 30.8% storage level and Alpine hydro deficit make this week's data releases critical inflection points for Q2 positioning.","articles":[{"badge":"⚡ 💰 Price Action","title":"TTF Eases to €32 After Iran Whipsaw — HH Eyes Gap Higher on Bomb Cyclone","idx":1},{"badge":"⚡ 🚢 LNG & Flows","title":"Record Feb LNG Floods Europe — Mukran Back Online, Golden Pass Commissioning","idx":2},{"badge":"⚡ ⚡ Power & Carbon","title":"EUA Slides to €71.66 as ETS Review Chorus Grows; German Power Spikes 69% on Monday Demand","idx":3},{"badge":"📊 🌡️ Weather & Demand","title":"Alpine Snow Deficit Meets Polar Vortex Risk: The Spring Refill Trap","idx":4},{"badge":"📊 📦 Storage Watch","title":"EU Storage Crashes to 30.8% — Historic Lows Deepen the Refill Nightmare","idx":5},{"badge":"📊 💣 Geopolitics & Regulation","title":"Hormuz Drills, Geneva Collapse & EU Russian Gas Phase-Out — Triple Pressure on European Gas","idx":6},{"badge":"📊 🎯 Risk Flags & Outlook","title":"Three Fault Lines: Hormuz × Storage × Hydro Define the Week's Risk Map","idx":7},{"badge":"🏛️ Verdict du Conseil","title":"21 Trades Audités — 13 Retenus, 8 Éliminés","idx":8}]},{"t":"alert","badge":"⚡ 💰 Price Action","title":"TTF Eases to €32 After Iran Whipsaw — HH Eyes Gap Higher on Bomb Cyclone","hook":"TTF gave back most of last week's geopolitical spike, settling near €32/MWh into the weekend. Henry Hub sits at $3.05 with a rare East Coast blizzard threatening a weather-premium gap when Globex reopens tonight.","authorWord":"TTF surged €3.25 to €32.70/MWh on Feb 19 as US-Iran tensions rattled Strait of Hormuz transit risk (Reuters via Baird Maritime), then unwound sharply: Thursday's settlement…","author":"Blaise 🧮","details":"<b>TTF</b> surged €3.25 to €32.70/MWh on Feb 19 as US-Iran tensions rattled Strait of Hormuz transit risk (<a href='https://www.bairdmaritime.com/shipping/tankers/gas/europe-gas-market-rattled-by-supply-fears-on-us-iran-tensions' target='_blank'>Reuters via Baird Maritime</a>), then unwound sharply: Thursday's settlement printed €31.88/MWh (settle 20 Feb, ▲+0.21 vs prev, <a href='https://www.londoncommoditybrokers.com/index.php/2026/02/20/london-commodity-news-198/' target='_blank'>London Commodity Brokers</a>), and Friday closed near €32.00/MWh (close 21 Feb, ▲+0.12 vs Thu, <a href='https://www.investing.com/analysis/natural-gas-price-near-305-as-bomb-cyclone-and-global-supply-stress-collide-200675436' target='_blank'>Investing.com</a>) — a controlled 4.5% pullback from the spike. <b>NBP</b> settled ~77.65p/therm (close 21 Feb, ▼−5.4% w/w, Investing.com). EU storage at 32.5% vs 43.3% YoY (<a href='https://www.bairdmaritime.com/shipping/tankers/gas/europe-gas-market-rattled-by-supply-fears-on-us-iran-tensions' target='_blank'>GIE via Reuters</a>) keeps the floor firm — any fresh supply disruption narrative finds dry tinder. Key TTF technical levels: support at €31.00 (Thursday's post-spike low zone), resistance at €32.70 (Iran-spike high 19 Feb). A Monday gap above €32.70 would signal geopolitical premium is re-loading; a break below €31 reopens the €29–30 range.\n\n<b>Henry Hub</b> March futures closed $3.047/MMBtu (close 21 Feb, ▲+1.7% d/d, <a href='https://www.investing.com/analysis/natural-gas-price-near-305-as-bomb-cyclone-and-global-supply-stress-collide-200675436' target='_blank'>Investing.com</a>). Spot settled $3.01/MMBtu (settle 18 Feb, <a href='https://www.aga.org/research-policy/resource-library/natural-gas-market-indicators-february-19-2026/' target='_blank'>AGA</a>), with EIA STEO projecting $4.30 avg for 2026 — a massive cash-to-curve disconnect. A bomb cyclone bearing down on the US Northeast creates the classic Sunday-Globex gap setup: utilities scramble, shorts cover, and the $3.05→$3.30+ move can happen in hours. HH support at $2.90; resistance at $3.25–3.30. <b>JKM</b> tracking in the $14.50–15.00/MMBtu range, with Asian buyers quiet ahead of shoulder season but watching US-Iran developments closely.\n\n💡 <b>Trade Ideas:</b> (1) <b>Buy HH Mar 3.15/3.40 call spread</b> (~$0.06 debit) — captures a bomb cyclone gap with defined risk; theta is your enemy so size for a 48h hold max. (2) <b>Sell TTF Mar/Apr spread</b> around +€0.80 — the Iran spike premium should bleed out if no fresh catalyst; target +€0.40 with stop at +€1.20. \n\n<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎</div><div class='dissent-text'>The Iran spike was a one-day wonder — TTF gave it all back in 48 hours. With EU storage draws decelerating and milder weather, the path of least resistance for TTF is lower. The bomb cyclone hype on HH is similarly overdone: outages cap actual burn, and the post-storm pattern shows these weather spikes get sold within days. The real story is structural oversupply building as LNG floods in — fade the geopolitics, sell the weather rallies.</div></div>","sig":"Blaise 🧮 — Quantitative Analysis"},{"t":"alert","badge":"⚡ 🚢 LNG & Flows","title":"Record Feb LNG Floods Europe — Mukran Back Online, Golden Pass Commissioning","hook":"Europe on track for 14.2 Mt of LNG imports in February (+22% YoY) as weak Asian demand redirects cargoes westward. Germany's Mukran FSRU resumes after Baltic ice disruption while Golden Pass pulls 300 MMcf/d in pre-export commissioning.","authorWord":"EU LNG Arrivals & Sendout: Kpler forecasts February imports at 14.20 Mt, surpassing January's 13.67 Mt and marking a record month (OilPrice, 23 Feb). US cargoes supply 57% (8.05…","author":"Henry 🦉","details":"<b>EU LNG Arrivals & Sendout:</b> Kpler forecasts February imports at 14.20 Mt, surpassing January's 13.67 Mt and marking a record month (<a href='https://oilprice.com/Latest-Energy-News/World-News/Europe-Set-for-Another-Record-LNG-Import-Month.html' target='_blank'>OilPrice, 23 Feb</a>). US cargoes supply 57% (8.05 Mt), with March set to surge further to 11.19 Mt from US alone as Europe races to refill storage at just 30% vs the 49% five-year average. Russian LNG persists at 1.6 Mt, down marginally from 1.68 Mt in January. Chinese imports collapsed to 3.38 Mt — lowest since April 2018 — freeing spot volumes for Europe (<a href='https://naturalgasintel.com/news/lng-floods-europe-keeping-lid-on-ttf-prices-despite-storage-deficit/' target='_blank'>NGI, 20 Feb</a>). TTF front-month last settled ~€32.90/MWh (indicative, 20 Feb); JKM weakness keeps the TTF-JKM spread narrow near parity, closing the Asia arbitrage window and locking Atlantic cargoes into Europe. HH at ~$3.24/MMBtu (Fri 21 Feb settle) implies a TTF/HH ratio around 3.0x — elevated but supported by storage deficit.<br><br><b>Terminal & Pipeline Flash:</b> Germany's <a href='https://www.maritimegateway.com/mukran-lng-terminal-resumes-operations-after-icebreakers-cut-channel-through-frozen-baltic/' target='_blank'>Mukran FSRU resumed operations</a> after icebreakers cleared the Prorer Wiek bay; the Minerva Amorgos is now expected to dock imminently. February sendout at Mukran running below January's 4.4 TWh pace due to lost days. In the US, <a href='https://www.reuters.com/business/energy/golden-pass-moves-closer-producing-first-lng-with-increased-natural-gas-flows-2026-02-18/' target='_blank'>Golden Pass LNG</a> (Exxon/QatarEnergy) pulled 300 MMcf/d of feed gas on 18 Feb in commissioning mode — first export cargo expected March. Norwegian pipeline nominations running near seasonal norms. North African flows via Medgaz/Transmed stable week-on-week.<br><br>💡 <b>Trade Ideas:</b> (1) Buy TTF Q3-26/Q2-26 calendar spread — storage refill urgency should steepen the summer curve; target €1.50–2.00/MWh widening. (2) Buy TTF Apr-26 €35 calls (~€1.20 indicative) — storage at 30% creates asymmetric upside risk into injection season.<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎</div><div class='dissent-text'>Record LNG arrivals are a bearish signal hiding in plain sight. At 14.2 Mt/month, Europe is importing faster than it can inject once spring arrives — sendout constraints could create a bottleneck. The TTF €35 call thesis assumes storage panic, but the market has already priced in the deficit. More likely, prices grind sideways in the €30–34 range. The real risk is a JKM snapback if Chinese stimulus hits — that would yank cargoes back to Asia and the TTF trade reverses violently.</div></div>","sig":"Henry 🦉 — Deep Research"},{"t":"tech","badge":"⚡ ⚡ Power & Carbon","title":"EUA Slides to €71.66 as ETS Review Chorus Grows; German Power Spikes 69% on Monday Demand","hook":"EU carbon permits dropped 2.87% to €71.66 on Sunday's CFD, extending February's brutal 20% sell-off as multiple EU states call for ETS overhaul. German day-ahead power surged 69% to €114.79/MWh for Monday delivery while France printed just €31.78/MWh — a stunning €83 cross-border spread.","authorWord":"Carbon under siege. EUA Dec-26 settled around €71.66 on 23-Feb (CFD close, Trading Economics), down 2.87% on the session and now off ~20% year-to-date from January's €90+ levels.…","author":"Sage 🦎","details":"<b>Carbon under siege.</b> EUA Dec-26 settled around €71.66 on 23-Feb (CFD close, <a href='https://tradingeconomics.com/commodity/carbon' target='_blank'>Trading Economics</a>), down 2.87% on the session and now off ~20% year-to-date from January's €90+ levels. The catalyst is political: German Chancellor Merz floated an <a href='https://gmk.center/en/news/carbon-prices-in-europe-fall-in-february-amid-calls-for-ets-review/' target='_blank'>ETS 'revision or postponement'</a> on 12-Feb, sending EUAs from €78 to €72.50 in a single session. Czech PM Babiš and Italian steel lobby have piled on with calls for reform, while MEP Peter Liese suggested slowing free-allowance phase-outs from 2029. The <a href='https://politics-government.news-articles.net/content/2026/02/17/eu-carbon-market-launch-sparks-debate-over-costs.html' target='_blank'>ETS2 launch for buildings and transport</a> sparks debate over gas-heating cost pass-through.<br><br><b>Power: a tale of two grids.</b> Day-ahead Mon 24-Feb (<a href='https://euenergy.live/' target='_blank'>ENTSO-E</a>) shows Germany at €114.79/MWh, up 69% vs Friday's €67.9/MWh. France printed €31.78/MWh (+7% d/d) — nuclear fleet strong, cross-border flows maxing interconnectors. The €83/MWh DE-FR spread is among the widest this winter, pointing to low German wind. Clean spark spreads widening — with TTF Mar-26 around €46/MWh and carbon at ~€72/t, gas-fired units dispatched at strong margins. Clean dark spreads remain deeply negative, keeping coal out of merit.<br><br>💡 <b>Trade Ideas:</b> (1) <i>Sell EUA Dec-26 at €72, target €65, stop €77</i> — political headwinds and fund liquidation have momentum. (2) <i>Buy FR-DE power spread for week-ahead</i> — the €83 gap is stretched, mean-reverts as German wind picks up mid-week. (3) <i>Buy EUA put spread: long €70 put / short €60 put, Apr-26</i> — asymmetric downside if ETS reform rhetoric escalates into March European Council.<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉</div><div class='dissent-text'>The ETS review noise is just that — noise. Merz already retracted, Macron defended the system, and the Commission has zero appetite to reopen the ETS Directive before 2028. The €71 level reflects fund capitulation, not policy change. Carbon at €65 would trigger the Market Stability Reserve, squeezing supply automatically. Smart money is accumulating here, not selling. The short EUA trade has a terrible risk/reward below €70.</div></div>","sig":"Sage 🦎 — Pattern Recognition"},{"t":"analysis","badge":"📊 🌡️ Weather & Demand","title":"Alpine Snow Deficit Meets Polar Vortex Risk: The Spring Refill Trap","hook":"Europe's 60% Alpine snowpack deficit as of mid-Feb 2026 threatens a summer hydro shortfall just as storage sits at 34% — the lowest since 2022. Meanwhile, a polar vortex disruption flagged for early March could extend heating demand into week 2-4, compounding the refill challenge.","authorWord":"The structural setup heading into March–May 2026 is uniquely bearish for European gas balances. EU storage stood at just 33-34% full as of 18 Feb 2026 — 11pp below last year and…","author":"Sage 🦎","details":"<b>The structural setup heading into March–May 2026 is uniquely bearish for European gas balances.</b> EU storage stood at just 33-34% full as of 18 Feb 2026 — 11pp below last year and well under the 50-58% historical average (<a href='https://www.bairdmaritime.com/shipping/tankers/gas/europe-gas-prices-slip-as-mild-and-windy-weather-curb-demand/' target='_blank'>Reuters, 18 Feb</a>). Germany's reserves hit 23% on 18 Feb, lowest since 2011. Net withdrawals since heating season start exceeded 55 bcm. The cumulative HDD overshoot from the Jan-Feb cold snap has been the primary driver.<br><br><b>Week 2-4 outlook: polar vortex disruption adds cold tail risk.</b> Meteorologists flagged a stratospheric warming event around 2-4 Mar 2026, with the jet stream sagging southward — potentially delivering another cold anomaly through mid-March. The <a href='https://wmo.int/media/update/global-seasonal-climate-update-march-april-may-2026' target='_blank'>WMO MAM 2026 update</a> projects above-normal temps for the seasonal mean, but doesn't preclude a sharp early-March cold snap adding 5-10 bcm of unplanned demand. Near-term, mild and windy conditions provided relief: TTF fell to €29.70/MWh on 18 Feb (<a href='https://www.bairdmaritime.com/shipping/tankers/gas/europe-gas-prices-slip-as-mild-and-windy-weather-curb-demand/' target='_blank'>Reuters</a>). TTF still climbed ~12% on risk premium (<a href='https://naturalgasintel.com/news/mild-weather-forecasts-clash-with-rising-lng-risk-premiums-in-europe-and-asia/' target='_blank'>NGI</a>).<br><br><b>The hydro time bomb.</b> Switzerland reported ~60% less snowpack than normal as of mid-Feb 2026 (<a href='https://tass.com/economy/2089139' target='_blank'>TASS, 19 Feb</a>). Alpine hydro generation depends on spring melt — a 60% deficit implies materially lower output May-September, forcing higher gas-for-power burn during injection season. If Europe needs 90% storage by Nov (EU mandate), every TWh of lost hydro translates into incremental gas demand during refill. The Gaidar Institute warns of a price surge and winter 2026/27 crisis if this plays out.<br><br>💡 <b>Trade Ideas:</b> (1) <b>Buy TTF Winter 26/27 calls, strike €38-40/MWh</b> — if storage fails to reach 90% by Nov, winter premium reprices violently. (2) <b>Short Nordic hydro (ENOQ3-26) vs long TTF Q3-26</b> — Alpine snow deficit = Nordic reservoirs also at risk; gas substitutes for hydro at the margin.<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮</div><div class='dissent-text'>The Alpine hydro narrative is real but overpriced. Snow data from mid-February doesn't account for March precipitation, which historically delivers 30-40% of cumulative snowpack in the Alps. One wet March changes the entire trajectory. Moreover, the WMO seasonal outlook points to above-normal temps — if heating season ends early, the 33% storage starting point is manageable with record LNG imports. The Q3 trade assumes worst-case hydro AND worst-case weather. Statistically, getting both is a tail event.</div></div>","sig":"Sage 🦎 — Pattern Recognition"},{"t":"tech","badge":"📊 📦 Storage Watch","title":"EU Storage Crashes to 30.8% — Historic Lows Deepen the Refill Nightmare","hook":"EU gas inventories hit 30.78% on Feb 22, now ~17 pp below the 5-year average and the lowest on record for this date. With 57+ bcm withdrawn since October and refill season weeks away, the path to 90% by November 1 looks exceptionally steep.","authorWord":"🇪🇺 EU Storage — Record Deficit WidensAs of gas day Feb 22, AGSI+ data shows EU aggregate storage at 30.78% (351.7 TWh, ~32.4 bcm). This is the lowest for late February in AGSI+…","author":"Blaise 🧮","details":"<b>🇪🇺 EU Storage — Record Deficit Widens</b><br><br>As of gas day Feb 22, <a href='https://agsi.gie.eu' target='_blank'>AGSI+ data</a> shows EU aggregate storage at <b>30.78%</b> (351.7 TWh, ~32.4 bcm). This is the lowest for late February in AGSI+ history, sitting ~<b>17 pp below the 5-year average</b>. Net withdrawals since Oct 13 exceeded <a href='https://news-pravda.com/world/2026/02/22/2088916.html' target='_blank'>57 bcm</a>, ~25% faster than norm. <a href='https://www.gurufocus.com/news/8626259/germanys-gas-storage-levels-at-historic-lows-amid-eu-lng-import-ban-plans' target='_blank'>Germany at ~24%</a>, <a href='https://tass.com/economy/2087703' target='_blank'>Netherlands below 15%</a> — both all-time lows for mid-Feb.<br><br><b>🇺🇸 US Storage — Deficit Building</b><br><br><a href='https://www.premierenergymanagement.com/post/eia-natural-gas-storage-report-week-ending-february-13-2026' target='_blank'>EIA for week ending Feb 13</a>: 144 Bcf withdrawal, working gas <b>2,070 Bcf</b> — 59 Bcf below last year, <b>123 Bcf (5.6%) below 5-year avg</b>. Next report expected ~34 Bcf draw, inventories near 2,036 Bcf.<br><br><b>📐 Trajectory & Refill Math</b><br><br>EU must refill from ~32 bcm to ~103 bcm (90%) by Nov 1 — a <b>~71 bcm injection over ~220 days</b>. 5-year avg build is 60-65 bcm. Even with <a href='https://naturalgasintel.com/news/lng-floods-europe-keeping-lid-on-ttf-prices-despite-storage-deficit/' target='_blank'>record LNG arrivals</a>, Europe needs injection rates 10-15% above historical peaks sustained Apr-Oct. Market consensus: <b>75-82% end-of-season fill</b>. At current rates, EU storage = ~<b>35 days of supply</b> vs 52 days YoY — 33% compression.<br><br>💡 <b>Trade Ideas:</b> (1) <b>Buy TTF Winter 26/27 vs sell Summer 26 spread</b> — if 90% target is missed, winter premium reprices to €10+/MWh. <div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉</div><div class='dissent-text'>The panic is priced in. Record LNG sendout in Q1 2026 is partially compensating, and TTF hasn't broken above €50 despite alarming headlines. If mild shoulder season materializes, early injection could surprise to the upside. EU regulators have tools — demand curtailment, strategic reserves — that didn't exist pre-2022. The storage gap is real but the market's refill premium may be overshooting. Summer 26 at €36+ already reflects worst-case; the asymmetry now favors fading the fear.</div></div>","sig":"Blaise 🧮 — Quantitative Analysis"},{"t":"alert","badge":"📊 💣 Geopolitics & Regulation","title":"Hormuz Drills, Geneva Collapse & EU Russian Gas Phase-Out — Triple Pressure on European Gas","hook":"Iran's live-fire closure of Strait of Hormuz sections and the breakdown of Russia-Ukraine talks in Geneva have reignited dual supply-risk premia in gas markets. Meanwhile, EU Regulation 2026/261 codifies a legally binding phase-out of Russian gas imports.","authorWord":"Middle East: Hormuz chokepoint risk at multi-year highs. Iran temporarily closed sections of Hormuz during live-fire drills — through which ~20% of global oil and ~25% of global…","author":"Henry 🦉","details":"<b>Middle East: Hormuz chokepoint risk at multi-year highs.</b> Iran temporarily <a href='https://www.aljazeera.com/news/2026/2/22/iran-us-tensions-what-would-blocking-strait-of-hormuz-mean-for-oil-lng' target='_blank'>closed sections of Hormuz</a> during live-fire drills — through which ~20% of global oil and ~25% of global LNG transit. The USS Gerald R. Ford carrier group is steaming toward the Gulf. <a href='https://think.ing.com/articles/the-commodities-feed-oil-spikes-as-us-iran-conflict-concerns-intensify190226/' target='_blank'>ING notes</a> de-escalation pathways are narrowing. Any disruption to Qatari LNG would be immediately bullish for TTF spot and summer fills.<br><br><b>Russia/Ukraine: Geneva talks collapse.</b> Second-round talks <a href='https://oilprice.com/Energy/Crude-Oil/Oil-Prices-Surge-Nearly-3-After-Russia-Ukraine-Talks-Break-Down.html' target='_blank'>broke down after 90 minutes</a>. Oil surged ~3%. Eased sanctions on Russian energy firmly off the table for H1 2026. Ukrainian transit via Sudzha remains at zero since Jan 2025; TurkStream flows continue but politically fragile. Arctic LNG 2 under Western sanctions with shadow-fleet shipments sporadic.<br><br><b>EU Regulation: Phase-out goes legal.</b> EU adopted <a href='https://rokas.com/the-eu-strategy-for-the-gradual-phase-out-of-russian-natural-gas-and-the-strategic-role-of-lng-infrastructure/' target='_blank'>Regulation 2026/261</a>, converting REPowerEU into enforceable law — binding targets to eliminate Russian gas imports. 90% storage mandate in force. Equinor's Norwegian maintenance typically starts May; early turnarounds would compound refill challenge.<br><br>💡 <b>Trade Ideas:</b> (1) <b>Buy TTF Q3-26 vs sell Cal-27</b> — geopolitical premium concentrates in near-term refill window; Cal-27 less reactive. Target €3-4/MWh widening.<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮</div><div class='dissent-text'>Markets are pricing Hormuz risk as if disruption is imminent, but Iran has used strait drills as leverage dozens of times without following through — the economic self-harm of closing Hormuz (Iran's own exports transit it) makes full blockade low-probability. The Geneva collapse was largely priced in. TTF Summer at current levels already embeds a healthy risk premium. The real driver remains weather and storage arithmetic, not headline risk.</div></div>","sig":"Henry 🦉 — Deep Research"},{"t":"strategy","badge":"📊 🎯 Risk Flags & Outlook","title":"Three Fault Lines: Hormuz × Storage × Hydro Define the Week's Risk Map","hook":"The convergence of Strait of Hormuz military tensions, EU storage at historic lows (30.8%), and Alpine snowpack deficit creates a uniquely asymmetric risk landscape. The week's catalysts could tilt the balance decisively — traders must position for volatility, not direction.","authorWord":"TOP 3 RISKS (ranked by probability × impact):1. Hormuz escalation (Prob: 20%, Impact: Extreme) — Iran's live-fire drills and USS Ford deployment create a genuine chokepoint risk.…","author":"La Rédaction 🦊","details":"<b>TOP 3 RISKS (ranked by probability × impact):</b><br>1. <b>Hormuz escalation (Prob: 20%, Impact: Extreme)</b> — Iran's live-fire drills and USS Ford deployment create a genuine chokepoint risk. Any disruption to Qatari LNG (~25% of global supply) would spike TTF by €10-15/MWh within days. The market is pricing ~5% disruption probability — too low given the military posture.<br>2. <b>Early March cold snap (Prob: 35%, Impact: High)</b> — Polar vortex disruption flagged for 2-4 Mar could push EU storage below 28% before injection season starts, triggering regulatory panic buying and TTF above €38.<br>3. <b>ETS political intervention (Prob: 25%, Impact: Medium)</b> — March European Council could amplify ETS review rhetoric, pushing EUA below €65 and reshaping spark spread economics for Q2.<br><br><b>BULL SCENARIO:</b> Hormuz military incident + March cold snap coincide. TTF gaps to €38-42/MWh, HH follows via LNG cargo diversion above $3.50. <i>Trade: Buy TTF Mar-26 €35/€40 call spread (~€1.00 debit), or outright long TTF Apr-26 futures with €32 stop.</i><br><br><b>BEAR SCENARIO:</b> Iran de-escalation + WMO mild March materializes. TTF slides to €28-29, HH retests $2.75 as weather premium evaporates. <i>Trade: Buy TTF Mar €30 puts (~€0.60).</i><br><br><b>WILD CARD:</b> Qatar declares force majeure on LNG shipments citing Hormuz risk (10% prob, 10x impact). JKM explodes to $20+, TTF follows to €50+. <i>Trade: Buy deep OTM TTF Apr €45 calls (~€0.15 each) — lottery ticket with 20:1 payout if tail materializes.</i><br><br><b>CATALYSTS THIS WEEK:</b><br>• Mon 24 Feb: Globex open — bomb cyclone gap on HH?<br>• Tue 25 Feb: Iran nuclear talks update (IAEA board)<br>• Wed 26 Feb: US EIA weekly storage (week ending Feb 20)<br>• Thu 27 Feb: GIE AGSI+ update, ENTSO-E winter review<br>• Fri 28 Feb: US PCE inflation — macro risk for energy complex<br><br><b>CONVICTION MATRIX:</b> Highest conviction = long TTF Summer 26 via options (storage refill + hydro deficit = structural bid). Best asymmetry = OTM TTF calls for Hormuz tail (cheap vol, massive payout). Avoid = outright short positions with this many binary catalysts outstanding.<br><br><b>POSITIONING CONTEXT:</b> Forward curve in steep contango (Summer 26 > Spot) — market pricing refill anxiety. Storage at 30.8% suggests speculative longs are building but not yet crowded. Weather models shifting bearish near-term (mild), bullish medium-term (cold snap). Net positioning favors cautious long bias with protective puts.<br><br><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉</div><div class='dissent-text'>The risk map looks scary on paper, but the market has already absorbed most of these catalysts. TTF at €32 with storage at 30.8% implies the refill premium is fully priced. Hormuz drills are geopolitical theatre — Iran needs the strait open more than anyone. The cold snap probability is being overweighted by traders burned by January's mild surprise. The highest-probability outcome this week is a grinding sideways range of €30-33, which punishes both directional bets. The best trade is selling straddles, not buying them.</div></div>","sig":"La Rédaction 🦊 — Strategic Synthesis"},{"t":"analysis","badge":"🏛️ Verdict du Conseil","title":"21 Trades Audités — 13 Retenus, 8 Éliminés","hook":"Quatre agents ont vote sur chaque trade idea de cette edition. Chaque trade est presente avec son rationale complet, les votes individuels (Iris, Dante, Felix, Lyra), et la decision finale avec la raison.","authorWord":"13 trades solides retenus. 8 elimines (doublons, parametres manquants, contradictions). Le detail de chaque verdict ci-dessous.","author":"La Rédaction 🦊","de
