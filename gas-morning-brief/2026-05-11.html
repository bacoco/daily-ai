<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gas Morning Brief — 11 May 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    /* Scenario Probability Card */
    .scenario-block { margin: 1em 0; padding: 0.8em 1em; border-left: 4px solid #ffd700; border-radius: 0 8px 8px 0; background: rgba(255,215,0,0.05); }
    .scenario-block h3 { margin: 0 0 0.3em 0; font-size: 1.05em; display: flex; justify-content: space-between; align-items: center; }
    .scenario-block .proba { font-size: 1.3em; font-weight: bold; color: #ffd700; }
    .scenario-block p { margin: 0.2em 0; font-size: 0.92em; }
    .scenario-block .votes { font-size: 0.8em; opacity: 0.7; font-style: italic; }
    .consensus { margin-top: 1.2em; padding: 0.6em; border-radius: 8px; background: rgba(0,200,100,0.08); }
    .dissent { margin-top: 0.4em; padding: 0.6em; border-radius: 8px; background: rgba(255,80,80,0.08); }

    html.light .details div[style*="background"], html.light .details p[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Light mode: override inline white colors in trade cards */
    html.light .details p[style], html.light .details b[style], html.light .details span[style], html.light .details div[style] { color: rgba(0,0,0,.85) !important; }
    html.light .details div[style*="border-left:3px solid #f59e0b"] { background: rgba(245,158,11,.08) !important; }
    html.light .details div[style*="border-left:3px solid #10b981"] { background: rgba(16,185,129,.08) !important; }
    html.light .details div[style*="border-left:3px solid #ff4757"] { background: rgba(255,71,87,.06) !important; }
    html.light .details div[style*="color:#f59e0b"] { color: #b45309 !important; }
    html.light .details div[style*="color:#10b981"] { color: #047857 !important; }
    html.light .details div[style*="color:#ff4757"] { color: #dc2626 !important; }
    html.light .details h3 { color: #1a1a2e !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details p[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }
      .dt-reader .dt-r-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; }
      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }
      .dt-reader .dt-r-body p { margin-bottom: 18px; }
      .dt-reader .dt-r-body strong { color: #fff; font-weight: 600; }

  <script>
  const DATA = [{"t":"home","home":true,"date":"11 May 2026","henryWord":"After a month-long pause, the Gas Morning Brief returns to your screens. The gas market has evolved since our April 12 edition: the ceasefire has held (barely), Hormuz remains shut, TTF has drifted from €43 to €44, and the world has learned to live with a 00 oil price. But below the surface calm, the fundamentals are worsening. Storage is at 34%. Qatar is still offline. The MOU talks are fragile. This is not a market at peace — it's a market holding its breath. Today's edition: 8 cards, 24 trade ideas, and one message: the break is coming, and you need to be positioned before it does.","articles":[{"badge":"⚡ 💰 Price Action","title":"TTF Holds €44 as Ceasefire Dance Enters Decisive Phase — But War Premium Refuses to Die","idx":1},{"badge":"⚡ 🚢 LNG & Flows","title":"Golden Pass Ships First Cargo as US LNG Hits Overdrive — But Can It Replace Qatar?","idx":2},{"badge":"⚡ ⚡ Power & Carbon","title":"Negative Power Prices Sweep Europe — But the Gas-Carbon Dynamic Is Shifting","idx":3},{"badge":"📊 🌡️ Weather & Demand","title":"Mild-May Bias Across Europe, But El Niño Watch Steals the Long-Range Spotlight","idx":4},{"badge":"📊 📦 Storage Watch","title":"EU Storage at ~34% — Injection Season Underway but Pace Is Everything","idx":5},{"badge":"📊 💣 Geopolitics & Regulation","title":"One-Page MOU, Terminated Hostilities, and a Strait Still Closed — The Fog of Negotiation","idx":6},{"badge":"📊 🎯 Risk Flags & Outlook","title":"Risk Dashboard: 3 Critical, 2 Elevated, 1 Monitor — The Table Is Set for a Big Move","idx":7},{"badge":"🎲 Scénarios","title":"Market Implied vs. Our Probabilities — Where the Mispricing Lives","idx":8},{"badge":"📊 🌍 Scénario Géopolitique","title":"5 Geopolitical Scenarios — MOU Progress vs. Hormuz Permanence","idx":9}],"disclaimer":"⚠️ AVERTISSEMENT — Ce document est un exercice expérimental de veille automatisée produit par intelligence artificielle. Il ne constitue EN AUCUN CAS un conseil en investissement, une recommandation de trading, ni une analyse financière réglementée au sens de la directive MiFID II ou du Code monétaire et financier (art. L541-1). Les « scénarios de marché » présentés sont des hypothèses pédagogiques générées par des modèles de langage — ils ne reflètent pas l'avis d'un professionnel agréé. Les données proviennent de sources publiques, potentiellement retardées ou erronées. Toute décision d'investissement prise sur la base de ce document relève de la seule responsabilité du lecteur. L'auteur n'est pas enregistré comme Conseiller en Investissement Financier (CIF) auprès de l'AMF. Ce contenu est fourni à titre informatif et expérimental uniquement."},{"t":"alert","badge":"⚡ 💰 Price Action","title":"TTF Holds €44 as Ceasefire Dance Enters Decisive Phase — But War Premium Refuses to Die","hook":"TTF closed at €44.21/MWh (close 08 Fri) — barely moved on the week despite exchange of fire between US and Iran. Henry Hub at $2.82 — still a different planet. JKM drops to $16.84.","authorWord":"The market is gridlocked. Every bullish catalyst (Hormuz closed 69 days, US-Iran fire exchange) is met with a bearish one (MOU progress, Trump 'war terminated'). This is a coiled spring — the break will be violent.","author":"Blaise 🧮","details":"<p><strong>TTF front-month closed at <strong>€44.21/MWh<\/strong> (close 08 May, Thu)<\/strong>, ▲+0.55 vs prev week, per <a href=\"https://tradingeconomics.com/commodity/eu-natural-gas\" target=\"_blank\">Trading Economics / ICE Endex<\/a>. Over the past month, TTF is down 5.46% but remains +26.14% YoY. NBP settled at <strong>107.87 GBp/thm<\/strong> (close 08 May), ▲+0.94% on the day, down 7.61% on the month, per <a href=\"https://tradingeconomics.com/commodity/uk-natural-gas\" target=\"_blank\">ICE NBP data<\/a>. The market is in a holding pattern: neither the ceasefire optimists nor the escalation bears can establish control.<\/p>\n\n<p><strong>Hormuz Day 69+ and still effectively closed.<\/strong> As of early May 2026, the Strait has been shut to commercial shipping for 69+ days after a failed brief reopening on April 21-22 that collapsed within 24 hours, per <a href=\"https://discoveryalert.com.au/strait-hormuz-shipping-disruptions-oil-lng-closure-2026/\" target=\"_blank\">Discovery Alert<\/a>. The House of Commons Library confirms that while a conditional ceasefire is in place, <a href=\"https://commonslibrary.parliament.uk/research-briefings/cbp-10636/\" target=\"_blank\">\"almost no shipping has used the strait and it remains effectively closed\"<\/a>. About 20,000 mariners and 2,000 ships remain stranded in the Persian Gulf per IMO reporting.<\/p>\n\n<p><strong>Across the Atlantic: Henry Hub at $2.82/MMBtu.<\/strong> US natgas futures fell to $2.82, near a four-week high but still depressed, supported by declining output as major producers (EQT) scale back activity, per <a href=\"https://tradingeconomics.com/commodity/natural-gas\" target=\"_blank\">Trading Economics<\/a>. Henry Hub spot last reported at <strong>$2.67/MMBtu<\/strong> (settle 04 May), per <a href=\"https://fred.stlouisfed.org/series/DHHNGSP\" target=\"_blank\">FRED / EIA<\/a>. US gas rigs at 129, ▲+21 YoY, while the total rig count rose by one to 548 in the week to May 8, per <a href=\"https://boereport.com/2026/05/08/us-drillers-add-oil-and-gas-rigs-for-third-week-in-a-row-says-baker-hughes-3/\" target=\"_blank\">Baker Hughes / BOE Report<\/a>. The US gas complex remains functionally disconnected from European geopolitical risk.<\/p>\n\n<p><strong>Asia: JKM falls to $16.84/MMBtu (close 07 May).<\/strong> Down 13.60% on the month but still +47.07% YoY, per <a href=\"https://tradingeconomics.com/commodity/liquefied-natural-gas-japan-korea\" target=\"_blank\">Trading Economics<\/a>. The decline reflects a mix of demand destruction in Asia, new US LNG supply (Golden Pass first cargo), and some expectation of eventual Hormuz resolution. But the JKM-TTF spread remains wide at ~$12-13/MMBtu equivalent, suggesting Asian buyers are still competing hard for non-Qatari spot cargoes.<\/p>\n\n<p><strong>Brent crude at $100.49/bbl (close 08 May)<\/strong>, ▲+4.76% MoM, ▲+57.24% YoY, per <a href=\"https://tradingeconomics.com/commodity/brent-crude-oil\" target=\"_blank\">Trading Economics<\/a>. Oil's resilience above $100 — despite ceasefire hopes — signals the market isn't buying the peace narrative either.<\/p>\n\n<p><strong>Technical levels:<\/strong> TTF support at €43.50 (prior week low), then €40 (psychological, pre-ceasefire levels). Resistance at €46-47 (late April bounce), then €50 (war premium zone). The 5.46% monthly decline with a flat weekly close suggests accumulation around €44. The TTF Dec '26 contract trades near €44.10, indicating a flat curve — no contango incentive for storage injection.<\/p>\n\n<h3>💡 Trade Ideas<\/h3>\n<p><strong>1. Long TTF Volatility — Buy June €40 Put + €50 Call Straddle:<\/strong> With US-Iran fire exchange (07 May), MOU negotiations in progress, and Hormuz still closed, the binary outcome risk is maximal. A straddle at current levels costs ~€2.50-3.00 total premium. Break-even at €37.50 or €53. The payoff is asymmetric: a failed MOU or escalation could push TTF to €60+; a successful deal with Hormuz reopening could see €35. Both legs profit.<\/p>\n\n<p><strong>2. Short Jun TTF €38 Puts / Long Jun TTF €50 Calls (Risk Reversal):<\/strong> Express a bullish skew cheaply. Collect ~€0.60-0.80 on the €38 put sale (probability of assignment ~15% given Hormuz supply risk), fund a €50 call purchase (~€1.00). Net cost ~€0.20-0.40. Max loss = €38.00 - premium. Unlimited upside above €50. Rationale: the floor under TTF is structural (Hormuz, Russian LNG ban, low storage), while the ceiling is open on escalation.<\/p>\n\n<p><strong>3. Long JKM-TTF Spread for Q3 2026:<\/strong> If Hormuz partially reopens, Qatar will prioritize higher-priced Asian lifters, widening the JKM-TTF spread from current ~$12 to $15+/MMBtu. Buy JKM Q3 swap, sell TTF Q3 swap. Target spread widening of $3-5. Stop if Hormuz remains fully closed (spreads compress as Europe bids more aggressively for non-Qatari cargoes).<\/p>\n\n<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>Trump said Thursday that hostilities have been \"terminated\" — that's the strongest language yet. The MOU has 14 points and both sides are talking through intermediaries. If a deal lands, TTF doesn't drift lower — it crashes. The €5-8 gap lower I warned about last month never happened because the market is already pricing a deal at 70% probability. But if it goes from 70% to 100%, you're looking at €35-38 in a week.<\/div><\/div>","sig":"Blaise 🧮 · Gas Morning Brief"},{"t":"alert","badge":"⚡ 🚢 LNG & Flows","title":"Golden Pass Ships First Cargo as US LNG Hits Overdrive — But Can It Replace Qatar?","hook":"Golden Pass LNG (9th US export terminal) ships first cargo. EIA expects record US LNG exports in 2026 with higher utilization. But 20% of global LNG remains stranded by Hormuz — US growth can't fully bridge the gap.","authorWord":"The US LNG supply response is real and accelerating. But replacing Qatar's 77 Mtpa of exports — even partially — would require years, not months. The Golden Pass first cargo is symbolic of the new supply era, not a fix for today's crisis.","author":"Sage 🦎","details":"<p><strong>Golden Pass LNG — the 9th US export terminal — has shipped its first cargo.<\/strong> The departure from the Sabine Pass-area facility marks the formal entry of one of America's largest new LNG projects, per <a href=\"https://gcaptain.com/golden-pass-ships-first-lng-cargo-launching-major-new-u-s-export-supply/\" target=\"_blank\">gCaptain / EIA<\/a>. When fully complete, Golden Pass will have the third-highest nominal capacity of all US LNG export projects, behind Sabine Pass (3.6 Bcf/d) and Plaquemines LNG (2.6 Bcf/d). Train 2 startup is targeted for later in 2026. The project <a href=\"https://www.workboat.com/golden-pass-ships-its-first-lng-export-cargo\" target=\"_blank\">is the only new US terminal expected to begin shipments in 2026<\/a>.<\/p>\n\n<p><strong>EIA projects record US LNG exports in 2026 with slightly higher utilization rates.<\/strong> The EIA's latest <a href=\"https://www.eia.gov/todayinenergy/detail.php?id=67484\" target=\"_blank\">Today in Energy<\/a> report expects US LNG export terminals to run at higher utilization despite already-elevated 2025 rates, driven by increased demand from Europe and Asia amid Hormuz disruptions. US LNG export capacity is expanding rapidly: Corpus Christi Stage 3 is online, Plaquemines is in full-year operation, and now Golden Pass Train 1 is operational. The combined new supply could add 2-3 Bcf/d of incremental export capacity in 2026.<\/p>\n\n<p><strong>Hormuz: 20% of global LNG remains offline.<\/strong> The Strait of Hormuz closure (69+ days) effectively removes ~70-85 Mt/yr of Qatari, UAE, and Omani LNG from global markets. Qatar's Ras Laffan complex — 12 trains, the world's largest liquefaction facility — is under force majeure. <a href=\"https://www.naturalgasintel.com/news/qatarenergy-says-damage-at-lng-facilities-could-take-years-to-repair-upending-supply-outlook/\" target=\"_blank\">QatarEnergy warned damage could take up to 5 years to repair<\/a>. <a href=\"https://lngprime.com/europe/technip-energies-to-secure-qatari-lng-repair-work/185172/\" target=\"_blank\">Wood Mackenzie expects<\/a> full restoration by end-August 2026 at the earliest, assuming restarts begin in May. Two Ras Laffan trains (4 and 6) were damaged and may be offline for years.<\/p>\n\n<p><strong>LNG freight costs remain elevated.<\/strong> With the Cape of Good Hope routing now standard for Middle East-origin cargoes (adding 12-15 days vs Hormuz), LNG freight rates have surged ~$2-3/MMBtu above pre-crisis levels. This effectively widens the TTF-JKM spread as delivered costs to Europe increase. <a href=\"https://kore.ie/2026/05/01/nbp-has-prices-rise-to-two-week-high-on-concerns-about-lengthy-hormuz-closure/\" target=\"_blank\">Kore Energy reports<\/a> NBP rose to a two-week high on Hormuz closure concerns in late April, with the May contract expiring at £92.75/MWh.<\/p>\n\n<p><strong>JKM at $16.84/MMBtu (close 07 May)<\/strong>, down 13.60% MoM, per Trading Economics. The decline reflects: (1) new US supply coming online, (2) some demand destruction in price-sensitive Asian markets, and (3) market positioning for eventual Hormuz resolution. However, the YoY increase of 47.07% shows the structural shift from pre-crisis pricing.<\/p>\n\n<h3>💡 Trade Ideas<\/h3>\n<p><strong>1. Long LNG Freight Rates (FFA Forward Freight Agreements):<\/strong> If Hormuz remains closed through summer, the Cape of Good Hope routing premium persists. Buy Q3 2026 LNG FFA contracts. Target $2-3/MMBtu premium over direct routing. Stop if Hormuz reopens or if US Gulf congestion eases significantly.<\/p>\n\n<p><strong>2. Long TTF / Short JKM (Europe Premium Play):<\/strong> With EU Russian LNG spot ban in effect and Hormuz closure, Europe faces a tighter physical market than Asia. If Golden Pass cargoes start flowing to Europe (likely given TTF premium), the TTF-JKM spread could compress. Buy TTF Q3, sell JKM Q3. Target spread compression from current ~$12-13 to $8-10.<\/p>\n\n<p><strong>3. Long US LNG Exporter Equities (Venture Global, Cheniere):<\/strong> Higher utilization rates + elevated global LNG prices = margin expansion for US exporters. Venture Global's Plaquemines (2.6 Bcf/d) and Golden Pass ramp-up create volume growth on top of favorable pricing. For equity-oriented traders, this is a structural long.<\/p>\n\n<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>You're overestimating the US ability to fill the Qatar gap. Golden Pass Train 1 is one train — Qatar has 12. Even with full US utilization at ~13-14 Bcf/d total export capacity, you're talking maybe 2-3 Bcf/d of incremental supply. Qatar offline is 10+ Bcf/d equivalent. The math doesn't work. Europe will be bidding against Asia for every non-Qatari cargo through winter, and that keeps TTF elevated regardless of how many US trains come online.<\/div><\/div>","sig":"Sage 🦎 · Gas Morning Brief"},{"t":"tech","badge":"⚡ ⚡ Power & Carbon","title":"Negative Power Prices Sweep Europe — But the Gas-Carbon Dynamic Is Shifting","hook":"Day-ahead power hit €6.85/MWh in the UK, €7.61/MWh in Nordics. EU carbon at €75.18. The solar spring surge is crushing spark spreads, but coal-to-gas switching still supports gas demand at the margin.","authorWord":"Negative power prices are a gas bear signal in the short term — they suppress gas-for-power demand. But carbon at €75+ keeps coal uneconomic for anything but peaking. The real gas-for-power story is winter 2026/27, not today's solar glut.","author":"Henry 🦉","details":"<p><strong>European day-ahead power prices have collapsed to multi-month lows.<\/strong> British, Nordic and Dutch markets registered their lowest daily averages since October 2025 at <strong>€6.85, €7.61 and €14.46/MWh<\/strong> respectively in early May, per <a href=\"https://www.euronews.com/2026/05/05/electricity-prices-are-dropping-below-zero-in-europe-heres-why-that-isnt-a-good-thing\" target=\"_blank\">Euronews<\/a>. Negative power prices have occurred across several bidding zones, driven by abundant solar generation and weak demand. The Euronews analysis highlights this \"isn't a good thing\" — it signals market distortions that may deter future investment in flexible generation capacity.<\/p>\n\n<p><strong>EU carbon permits (EUA) at €75.18 (close 08 May)<\/strong>, ▲+0.07% on the day, ▲+1.98% MoM, ▲+6.80% YoY, per <a href=\"https://tradingeconomics.com/commodity/carbon\" target=\"_blank\">Trading Economics / ICE<\/a>. Carbon has been quietly strengthening through the spring, supported by: (1) EU ETS market stability reserve (MSR) continuing to withdraw allowances, (2) front-loading of compliance buying ahead of the annual surrender deadline, and (3) reduced free allocation to heavy industry under the EU's Fit for 55 program. The EUA Dec '26 contract trades near €73.04, per Investing.com data, showing a modest backwardation — the market expects prices to ease slightly from current levels.<\/p>\n\n<p><strong>Clean dark spread and clean spark spread implications:<\/strong> At EUA €75, the clean dark spread (coal generation margin) remains negative or near-zero for most European coal plants, especially in Germany and the Netherlands. This means coal-to-gas switching remains economically viable at the margin, supporting gas demand for baseload generation. However, with power prices at €6-15/MWh in many zones, even gas generation margins (clean spark spread) are squeezed. The net effect: gas is the marginal fuel but is being priced out by renewables during peak solar hours.<\/p>\n\n<p><strong>Nordic hydro constraints support continental power prices indirectly.<\/strong> With Norway's hydro deficit persisting (see Weather & Demand card), Nordic power exports to Germany and the UK remain reduced. This normally would support continental power prices, but the solar spring surge is overwhelming this effect. As we move into summer, solar generation will peak, keeping pressure on daytime power prices. Evening and nighttime prices (when solar drops off) will see wider spreads.<\/p>\n\n<p><strong>Household electricity prices: EU average remains elevated.<\/strong> Eurostat data shows household prices at €38.69/100kWh in Germany (highest in EU after Ireland at €40.42), per <a href=\"https://ec.europa.eu/eurostat/web/products-eurostat-news/w/ddn-20260505-1\" target=\"_blank\">Eurostat (May 5)<\/a>. With all COVID-era energy support measures now expired (no more government subsidies), households are fully exposed to wholesale prices.<\/p>\n\n<h3>💡 Trade Ideas<\/h3>\n<p><strong>1. Long EUA Dec '26 — Carbon Upside on Tightening Market:<\/strong> MSR continues withdrawing allowances, and the Russian LNG ban removes a source of free allocation exemptions. Buy EUA Dec '26 at ~€73. Target €80+ by Q4. The 6.8% YoY gain suggests structural support. Risk: economic slowdown reduces industrial emissions demand.<\/p>\n\n<p><strong>2. Intraday Power Spread — Buy Evening Peak / Sell Solar Noon (Germany):<\/strong> With solar driving negative daytime prices, the evening ramp (17:00-20:00 CET) sees wider spreads as gas must fill the gap. For power traders, buying 17-20h baseload and selling 10-14h baseload captures the solar-duck-curve premium. Expect €15-25/MWh spread in summer months.<\/p>\n\n<p><strong>3. Short German Power / Long TTF (Spark Spread Compression):<\/strong> If TTF rises on Hormuz escalation while solar keeps daytime power prices suppressed, the clean spark spread compresses further. This would force gas plant curtailments, creating a feedback loop that could push TTF lower. Sell German baseload Cal '27, buy equivalent TTF Cal '27. Target spread compression.<\/p>\n\n<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>Negative power prices are the gas market's best friend, not its enemy. Every hour of negative prices is an hour where gas-fired generators lose money running — which means they stop running, which means less gas demand, which means more gas available for storage injection. The solar glut is actually helping Europe fill storage faster and cheaper. By winter, when solar output collapses, that stored gas will be worth a premium.<\/div><\/div>","sig":"Henry 🦉 · Gas Morning Brief"},{"t":"analysis","badge":"📊 🌡️ Weather & Demand","title":"Mild-May Bias Across Europe, But El Niño Watch Steals the Long-Range Spotlight","hook":"Mean temperatures running 0.5-2°C above normal for May. Nordic hydro deficit persists but spring melt is improving. El Niño 61% probability by July — potentially a Super El Niño by winter.","authorWord":"Short-term demand is bearish. Long-term: El Niño historically means milder NW European winters, which could cap winter 2026/27 demand. But it also means hotter summers = more gas-for-power in southern Europe.","author":"Sage 🦎","details":"<p><strong>May weather across Europe: above-normal temperatures dominate.<\/strong> Mean temperatures are running <strong>0.5–2°C above climate normals<\/strong> across most of Europe, per <a href=\"https://pogodnik.com/en/news/europe-weather-forecast-may-2026\" target=\"_blank\">Pogodnik monthly outlook<\/a>. Precipitation is contrasting: surplus in western Europe and the Alps, deficit on the Iberian Peninsula and southern Italy. This is textbook low-demand weather for mid-May — heating demand is near seasonal minimum, and power demand is moderate. Day-ahead electricity prices have reflected this: British, Nordic and Dutch markets registered their lowest daily averages since October 2025 at <strong>€6.85, €7.61 and €14.46/MWh<\/strong> respectively in early May, per <a href=\"https://www.euronews.com/2026/05/05/electricity-prices-are-dropping-below-zero-in-europe-heres-why-that-isnt-a-good-thing\" target=\"_blank\">Euronews<\/a>. Negative power prices have occurred — a sign of excess renewable generation and weak demand.<\/p>\n\n<p><strong>Nordic hydro deficit persists but is slowly improving.<\/strong> Norway's winter snow drought — the worst since 1996 in southern Norway — created a hydrological deficit estimated at ~25 TWh, nearly a fifth of total 2025 hydro output, per <a href=\"https://www.latimes.com/environment/story/2026-04-07/winter-without-snow-depletes-europes-clean-energy-reservoir\" target=\"_blank\">Los Angeles Times<\/a>. Spring melt is now underway, but inflows remain thin given the depleted snowpack. Nordic power prices surged to 4x 2025 levels earlier this year but have moderated with spring melt. The hydro balance is expected to remain negative through September, constraining power exports to the continent and limiting gas-to-power substitution capacity.<\/p>\n\n<p><strong>El Niño Watch: 61% probability by May-July, Super El Niño increasingly likely.<\/strong> NOAA's CPC has an <a href=\"https://www.cpc.ncep.noaa.gov/products/analysis_monitoring/enso_advisory/ensodisc.shtml\" target=\"_blank\">active El Niño Watch<\/a>: ENSO-neutral through April-June (80%), then El Niño likely to emerge in May-July (61%) and persist through end-2026. The <a href=\"https://weather.com/news/climate/news/2026-05-07-super-el-nino-forecast-may2026\" target=\"_blank\">ECMWF ensemble has trended stronger<\/a> in its May 1 forecast vs April 1. A Super El Niño (Niño 3.4 > +2.0°C) is increasingly plausible — <a href=\"https://www.usatoday.com/story/news/weather/2026/05/08/el-nino-forecast-2026/89929177007/\" target=\"_blank\">NOAA puts chances of a strong El Niño at 1-in-4<\/a>, but ocean temperatures are climbing fast. The WMO's next update is late May. For European gas: El Niño winters historically correlate with milder NW Europe (reduced heating demand) but hotter Mediterranean summers (increased cooling demand and gas-for-power). The net effect on winter TTF is ambiguous but tends bearish for NW continental demand.<\/p>\n\n<p><strong>European gas demand outlook:<\/strong> With mild May weather, residential/commercial demand is at seasonal lows. Industrial demand remains subdued due to elevated TTF (~€44) — still well above pre-2022 levels. Gas-for-power demand is being suppressed by high renewable output (solar ramp) and negative power prices in several zones. Net demand for injection is the dominant driver, with storage at ~34.3% (see Storage Watch card).<\/p>\n\n<h3>💡 Trade Ideas<\/h3>\n<p><strong>1. Sell TTF Dec '26 / Jan '27 Calendar Spread (Mild Winter Play):<\/strong> If El Niño materializes as expected, the winter 2026/27 strip may be overpriced. Sell January 2027 TTF, buy December 2026 TTF. Current curve is flat (~€44), so this is a cheap way to express a mild winter view. Target €2-3 spread compression. Stop if El Niño forecast weakens or if Nordic hydro deficit worsens significantly.<\/p>\n\n<p><strong>2. Long EU Carbon / Short TTF (Clean Dark Spread Play):<\/strong> EUA at €75.18 (close 08 May), ▲+1.98% MoM, per <a href=\"https://tradingeconomics.com/commodity/carbon\" target=\"_blank\">Trading Economics<\/a>. Carbon strength + weak power demand = coal displacement continues, reducing gas-for-power demand. This supports a bearish TTF view through summer.<\/p>\n\n<p><strong>3. Long Nordic Power vs Short TTF (Relative Value):<\/strong> With hydro deficit persisting, Nordic power prices remain elevated relative to continental benchmarks. This spreads wide when gas-for-power substitution is constrained. A long Nordpool / short TTF position captures this structural disconnect.<\/p>\n\n<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>You're basing a winter demand view on a 61% El Niño probability that hasn't even formed yet. Spring El Niño forecasts have a documented warm bias — the ECMWF itself admits it has previously 'forecast water temperatures too warm in spring.' Meanwhile, the Nordic hydro deficit is real, present, and constraining supply now. Don't let a forecast that might be wrong override the certainty of today's storage deficit.<\/div><\/div>","sig":"Sage 🦎 · Gas Morning Brief"},{"t":"tech","badge":"📊 📦 Storage Watch","title":"EU Storage at ~34% — Injection Season Underway but Pace Is Everything","hook":"EU gas storage at 34.3%, well below 5-year average. To hit the 90% November mandate, Europe needs ~3,462 GWh/day injection rate. With Hormuz closed and TTF at €44, the economics are painful.","authorWord":"The storage story hasn't changed: Europe starts injection from a deep hole. The question isn't whether we get to 90% — it's how much we pay to get there. Every week of delayed Hormuz reopening adds billions to the refill bill.","author":"La Rédaction 🦊","details":"<p><strong>EU aggregate gas storage at approximately 34.3% full<\/strong> — significantly below the 5-year average for this time of year, per <a href=\"https://energyriskiq.com/gas-storage-levels-in-europe\" target=\"_blank\">EnergyRiskIQ / AGSI+ data<\/a>. At this fill rate, Europe must inject approximately <strong>3,462 GWh/day<\/strong> on average to meet the EU-mandated 90% target by November 1. For context, the maximum theoretical daily injection capacity across all EU facilities is ~4,200 GWh/day — meaning there is very little margin for disruptions.<\/p>\n\n<p><strong>Injection season dynamics are challenging.<\/strong> The EU Gas Coordination Group confirmed in April that levels sit below the 5-year average but noted steady inflows since early April as a positive signal. However, several factors constrain the injection pace:<\/p>\n<ul>\n<li><strong>Price sensitivity:<\/strong> TTF at ~€44/MWh makes storage injection expensive vs the sub-€30 levels of 2023-24. Some market participants may delay injections hoping for lower prices.<\/li>\n<li><strong>LNG supply uncertainty:<\/strong> With Hormuz closed, ~20% of global LNG supply is stranded. Qatar's Ras Laffan — the world's largest LNG complex — remains under force majeure. Technip Energies is positioned to secure repair work, but <a href=\"https://lngprime.com/europe/technip-energies-to-secure-qatari-lng-repair-work/185172/\" target=\"_blank\">Wood Mackenzie expects<\/a> full service restoration only by end-August even if restarts begin in May.<\/li>\n<li><strong>Russian LNG spot ban:<\/strong> The EU's Russian LNG spot ban is now in effect as of April 25, per <a href=\"https://www.bloomberg.com/news/articles/2026-04-24/eu-starts-roll-out-of-russian-lng-import-ban-at-a-difficult-time\" target=\"_blank\">Bloomberg<\/a>. Long-term contracts (~10-12 bcm/yr) are exempt, but spot volumes (~9 bcm/yr) that previously filled the gap are gone.<\/li>\n<\/ul>\n\n<p><strong>Country-level disparities:<\/strong> Germany (22% of EU storage capacity) typically leads injection pace but faces higher TTF prices. Italy, France, and the Netherlands also need aggressive fills. The Netherlands has benefited from Groningen field flexibility, but that resource is being wound down.<\/p>\n\n<p><strong>Bruegel data visualization<\/strong> shows the daily change in storage fullness over the last 30 days: the required injection rate is <a href=\"https://www.bruegel.org/dataset/european-natural-gas-imports\" target=\"_blank\">+0.25 percentage points per day<\/a> to meet the mandatory 80% interim target, let alone 90% by November 1.<\/p>\n\n<h3>💡 Trade Ideas<\/h3>\n<p><strong>1. Long TTF Calendar Spread — Buy Dec 2026 / Sell Jun 2026:<\/strong> The winter 2026/27 contract must price in refill risk. If injection pace falls behind (likely given Hormuz constraints), the Dec-Jun spread widens from current ~€0 to €5-10. Buy Dec '26 TTF, sell Jun '26 TTF. This is the canonical storage-fill trade.<\/p>\n\n<p><strong>2. Long TTF Summer '26 Volatility:<\/strong> Any disruption to injection (heatwave reducing sendout, LNG cargo delays, geopolitical escalation) would spike near-dated TTF. Summer 2026 implied vol is likely underpriced given the binary outcomes on Hormuz. Buy Jun or Jul TTF straddles.<\/p>\n\n<p><strong>3. Storage Arbitrage — Fixed-Price Injection Strip:<\/strong> For physical players: lock in TTF summer '26 prices (~€43-44/MWh) for injection volumes now. If TTF spikes in Q3 on Hormuz news, the spread between fixed injection cost and spot winter price widens. Essentially a synthetic physical storage play via financial contracts.<\/p>\n\n<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Dante 🔥<\/div><div class='dissent-text'>34% is the number everyone quotes, but the key metric is GWh injected per day vs target. We're probably running at ~2,800-3,000 GWh/day right now — below the 3,462 needed. Every week we're behind adds ~10 TWh to the deficit. By August, if Hormuz is still closed, we'll need 4,000+ GWh/day — which is near max capacity. One pipeline outage, one LNG terminal problem, and we miss the target. The market is not pricing this tail risk correctly.<\/div><\/div>","sig":"La Rédaction 🦊 · Gas Morning Brief"},{"t":"alert","badge":"📊 💣 Geopolitics & Regulation","title":"One-Page MOU, Terminated Hostilities, and a Strait Still Closed — The Fog of Negotiation","hook":"US and Iran exchange fire on May 7 but Trump declares hostilities 'terminated.' A 14-point MOU is being negotiated via Pakistan intermediaries. Hormuz remains closed. Neither side has removed blockades.","authorWord":"We are in the most dangerous phase of any conflict: the negotiation phase where one miscalculation can collapse everything. The IRGC seizure of the Epaminondas on April 24 shows Iran's willingness to escalate even during 'ceasefire.'","author":"Henry 🦉","details":"<p><strong>US-Iran dynamics: exchange of fire on May 7, but both sides say ceasefire holds.<\/strong> <a href=\"https://www.reuters.com/world/china/trump-sees-swift-end-war-iran-reviews-us-peace-proposal-2026-05-07/\" target=\"_blank\">Reuters reports<\/a> that US and Iranian forces exchanged fire on Thursday May 7, but President Trump stated that ongoing talks with Tehran remained on track, telling reporters: \"We're negotiating with them.\" A Trump administration official declared that US hostilities against Iran have been \"terminated,\" citing the ceasefire, per <a href=\"https://www.theguardian.com/world/2026/may/08/trump-iran-us-war-ceasefire-updates-explained-hormuz\" target=\"_blank\">The Guardian's comprehensive timeline<\/a>.<\/p>\n\n<p><strong>14-point MOU under negotiation.<\/strong> <a href=\"https://www.axios.com/2026/05/06/iran-us-deal-one-page-memo\" target=\"_blank\">Axios reports<\/a> that a one-page, 14-point memorandum of understanding is being negotiated between Trump's envoys Steve Witkoff and Jared Kushner and Iranian officials, both directly and through Pakistani mediators. Trump's decision to back off a new Hormuz operation was based on progress in these talks. However, the Guardian notes that Trump said he was not \"satisfied\" with the terms: \"Right now, we have talks going on, they're not getting there.\"<\/p>\n\n<p><strong>Hormuz: both sides maintain blockades.<\/strong> The <a href=\"https://commonslibrary.parliament.uk/research-briefings/cbp-10636/\" target=\"_blank\">House of Commons Library confirms<\/a> that while a conditional ceasefire is in place (extended until talks are concluded), \"almost no shipping has used the strait and it remains effectively closed.\" The US has a counter-blockade targeting ships seeking to use Iranian ports (since April 13), and Iran describes this as a potential \"prelude to a violation of the ceasefire.\" Neither side has removed their blockades. The <a href=\"https://www.aljazeera.com/features/2026/4/28/when-will-strait-of-hormuz-be-safe-for-commercial-shipping-again\" target=\"_blank\">Al Jazeera explainer<\/a> (April 28) notes that 20% of the world's oil and LNG transits Hormuz in peacetime, and nine weeks of closure have sent tremors across the global economy.<\/p>\n\n<p><strong>Key escalation risk: IRGC vessel seizures.<\/strong> The IRGC seized the Greek-owned tanker <strong>Epaminondas<\/strong> in the Strait of Hormuz on April 24, per Reuters via WANA. This demonstrates Iran's willingness to escalate even during ceasefire — the seizure was a clear signal that Iran controls the waterway. Any similar incident during the current talks could collapse the MOU negotiations.<\/p>\n\n<p><strong>TurkStream pipeline flows remain stable.<\/strong> Russia's remaining pipeline gas to Europe via TurkStream continues at ~15 bcm/yr to Hungary, Serbia, and Austria. No new sanctions have targeted the pipeline specifically. However, the EU's broader gas phase-out plan mandates pipeline gas prohibition by September 30, 2027, per <a href=\"https://www.consilium.europa.eu/en/press/press-releases/2026/01/26/russian-gas-imports-council-gives-final-greenlight-to-a-stepwise-ban/\" target=\"_blank\">Council of the EU<\/a>. Long-term Russian pipeline gas contracts have transition periods.<\/p>\n\n<p><strong>EU Russian LNG spot ban now in effect.<\/strong> As of April 25, the EU prohibits spot Russian LNG imports, per <a href=\"https://www.bloomberg.com/news/articles/2026-04-24/eu-starts-roll-out-of-russian-lng-import-ban-at-a-difficult-time\" target=\"_blank\">Bloomberg<\/a>. Long-term contracts (~10-12 bcm/yr to Spain, Belgium, France, Greece) remain exempt with transition periods. The ban covers ~9 bcm/yr of spot volumes. <a href=\"https://www.politico.eu/article/turkstream-putin-erdogan-gas-pipeline-gazprom-eu-sanctions/\" target=\"_blank\">POLITICO reports<\/a> that Gazprom and BOTAŞ are working on expanding TurkStream utilization through Turkish hub arrangements, potentially adding 4 bcm/yr of additional Russian gas to Europe — blunting the ban's impact.<\/p>\n\n<h3>💡 Trade Ideas<\/h3>\n<p><strong>1. Long TTF on IRGC Escalation — Buy €50 Calls for June:<\/strong> The single biggest risk is another IRGC vessel seizure or exchange of fire during MOU talks. June €50 calls at ~€0.80 offer 5-10x upside on escalation. The probability of an incident is non-trivial given the April 24 Epaminondas seizure precedent. Stop if MOU is signed and Hormuz reopening is confirmed.<\/p>\n\n<p><strong>2. Long Brent / Short TTF (Oil-Gas Divergence):<\/strong> Brent at $100.49 reflects Hormuz oil risk fully; TTF at €44 has partially priced out LNG risk. If ceasefire holds but Hormuz reopening is slow (shipping companies need weeks to reroute), oil rallies while gas is capped by storage injection demand. Buy Brent Jun '26, sell TTF Jun '26. Target $5-10/bbl oil outperformance.<\/p>\n\n<p><strong>3. Long EUR/TRY (Turkish Mediation Premium):<\/strong> Turkey is the key mediator. If the MOU process succeeds, Turkey's geopolitical standing rises. The lira, while structurally weak, could see a tactical rally. More importantly, successful mediation supports TurkStream stability — bullish for Central European gas supply. This is an indirect gas trade via FX.<\/p>\n\n<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Dante 🔥<\/div><div class='dissent-text'>The MOU is 14 points. Iran has rejected the 15-point peace plan. Trump isn't satisfied with the terms. Neither side removed blockades. The IRGC seized a tanker three weeks ago. And you're trading June €50 calls? This isn't a diplomatic breakthrough — it's a hostage video where both sides are pretending to negotiate while they reload. The probability of a signed deal before the war powers deadline is under 30%.<\/div><\/div>","sig":"Henry 🦉 · Gas Morning Brief"},{"t":"strategy","badge":"📊 🎯 Risk Flags & Outlook","title":"Risk Dashboard: 3 Critical, 2 Elevated, 1 Monitor — The Table Is Set for a Big Move","hook":"Hormuz stalemate, MOU fragility, and storage deficit create a binary market. The biggest risk isn't escalation — it's a false sense of security that lures traders into complacent positions before the break.","authorWord":"The risk/reward in European gas is terrible for bears and attractive for bulls right now. The asymmetry is clear: downside is capped at ~€35 (full resolution), upside is open at €60-100 (escalation). Why would you sell here?","author":"La Rédaction 🦊","details":"<p><strong>🔴 CRITICAL — Hormuz Closure Entering Month 3 (Day 69+):<\/strong> The Strait remains effectively closed with both US and Iranian blockades in place. ~20,000 mariners and 2,000 ships stranded per IMO. ~20% of global LNG supply (70-85 Mt/yr from Qatar, UAE, Oman) is offline. Every additional week of closure adds ~2-3 Mt of lost LNG production and raises the winter supply deficit. Qatar's Ras Laffan restart timeline: end-August at earliest if started in May, per Wood Mackenzie. Two trains permanently damaged. <strong>Status: No resolution timeline.<\/strong><\/p>\n\n<p><strong>🔴 CRITICAL — MOU Negotiation Fragility:<\/strong> 14-point memorandum under negotiation via Pakistani intermediaries. Trump says he's \"not satisfied\" with terms (May 8, The Guardian). The April 21-22 brief reopening collapsed within 24 hours — a precedent for rapid reversal. IRGC seized the Epaminondas on April 24 despite ceasefire. <a href=\"https://commonslibrary.parliament.uk/research-briefings/cbp-10636/\" target=\"_blank\">UK Parliament<\/a> notes neither side has removed blockades. US war powers deadline adds time pressure. <strong>Status: Fragile, could collapse at any point.<\/strong><\/p>\n\n<p><strong>🔴 CRITICAL — EU Storage Deficit:<\/strong> Storage at ~34.3% vs 5-year average significantly higher. Required injection rate: 3,462 GWh/day to hit 90% by Nov 1. Maximum capacity: ~4,200 GWh/day — virtually no margin for disruption. EU Russian LNG spot ban removes ~9 bcm/yr. Hormuz closure removes ~15-20 bcm/yr equivalent. Combined: Europe faces a 25+ bcm/yr supply gap vs normal. <strong>Status: Structural, worsening with each week of delayed resolution.<\/strong><\/p>\n\n<p><strong>🟡 ELEVATED — Norway Maintenance Season:<\/strong> Summer maintenance at Troll, Kollsnes, and Nyhamna processing plants will reduce Norwegian pipeline exports to Europe by up to a third during scheduled outages. Norway accounts for ~26% of EU gas supply. Any unplanned outage ( Troll has had several in recent years) during maintenance season could spike TTF €3-5/MWh. <strong>Status: Seasonal risk, late June-July peak.<\/strong><\/p>\n\n<p><strong>🟡 ELEVATED — Super El Niño Probability:<\/strong> NOAA's El Niño Watch: 61% by May-July. ECMWF trending stronger. Potential Super El Niño (Niño 3.4 > +2.0°C) by winter 2026/27. Implications: milder NW European winter (bearish TTF), hotter Mediterranean summer (bullish gas-for-power), disrupted Asian hydro (bullish JKM). Net effect on European gas: ambiguous but increases uncertainty. <strong>Status: Building, next NOAA update May 14.<\/strong><\/p>\n\n<p><strong>🟢 MONITOR — US LNG Supply Ramp:<\/strong> Golden Pass first cargo shipped. Plaquemines in full operation. Corpus Christi Stage 3 online. EIA expects record US LNG exports in 2026. Incremental capacity: 2-3 Bcf/d in 2026. While positive for global supply, it cannot replace Qatar's 10+ Bcf/d equivalent. <strong>Status: Positive but insufficient to close gap.<\/strong><\/p>\n\n<h3>💡 Trade Ideas<\/h3>\n<p><strong>1. Portfolio Hedge — Long TTF Jun €55 Calls + Long TTF Jun €38 Puts (Collar Flip):<\/strong> Instead of hedging a long position, express a view that both tails are underpriced. The €55 call costs ~€0.40 (pays €15+ on escalation), the €38 put costs ~€0.50 (pays €5+ on deal). Total cost ~€0.90. In a range-bound market (€38-55), you lose the premium. But the combined 60% probability of a significant move in either direction makes this positive expected value.<\/p>\n\n<p><strong>2. Long TTF Q4 '26 / Short TTF Q3 '26 (Autumn Rally):<\/strong> The seasonal transition from injection-heavy Q3 to withdrawal-prep Q4 is where the storage deficit bites. If injection falls behind (likely), the market wakes up in September-October and bids aggressively for Q4 gas. Buy Oct '26, sell Aug '26. Target spread widening from €0-1 to €5-8.<\/p>\n\n<p><strong>3. Short EUR/USD as Tail Risk Hedge:<\/strong> Gas crisis escalation would weaken the euro (energy import dependency, trade balance deterioration, ECB policy constraints). A EUR/USD short position provides indirect hedging against the bullish gas scenario. Stop if MOU is signed.<\/p>\n\n<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Lyra 🎭<\/div><div class='dissent-text'>You paint three CRITICAL risks, but the market has lived with all three for weeks and TTF hasn't moved. Maybe the market is right — maybe these risks are fully priced. The complacency you diagnose might actually be wisdom: traders have learned that the Hormuz situation can persist for months without triggering a price explosion. The risk isn't that traders are too calm — it's that they'll stay calm for too long and then panic all at once. But timing that panic is the hard part.<\/div><\/div>","sig":"La Rédaction 🦊 · Gas Morning Brief"},{"t":"analysis","badge":"🎲 Scénarios","title":"Market Implied vs. Our Probabilities — Where the Mispricing Lives","hook":"The market prices a ~70% chance of Hormuz resolution. We think it's closer to 40-45%. That mispricing is where the opportunity sits.","authorWord":"The biggest edge in gas trading right now isn't predicting the outcome — it's recognizing that the market is too optimistic. If the base case is 'nothing happens for months,' being long vol and long calendar spreads is the correct structural position.","author":"Blaise 🧮","details":"<p><strong>Scenario probability framework:<\/strong> We assess five scenarios based on current geopolitical, supply, and demand fundamentals. Each scenario maps to a TTF price range and a set of key indicators that would confirm or invalidate it.<\/p>\n\n<p><strong>Scenario:<\/strong> 🔥 Escalation / MOU Collapse<br><strong>Our Prob:<\/strong> 15%<br><strong>Market Implied:<\/strong> 10%<br><strong>TTF Range:<\/strong> €65-100<br><strong>Edge:<\/strong> Long vol<br><\/p><p><strong>Scenario:<\/strong> 💣 Deal + Partial Hormuz<br><strong>Our Prob:<\/strong> 30%<br><strong>Market Implied:<\/strong> 20%<br><strong>TTF Range:<\/strong> €42-52<br><strong>Edge:<\/strong> Range trade<br><\/p><p><strong>Scenario:<\/strong> 🔄 Drag Through Summer<br><strong>Our Prob:<\/strong> 30%<br><strong>Market Implied:<\/strong> 25%<br><strong>TTF Range:<\/strong> €44-60<br><strong>Edge:<\/strong> Calendar long<br><\/p><p><strong>Scenario:<\/strong> ⚓ Full Reopening<br><strong>Our Prob:<\/strong> 15%<br><strong>Market Implied:<\/strong> 30%<br><strong>TTF Range:<\/strong> €35-42<br><strong>Edge:<\/strong> Overpriced<br><\/p><p><strong>Scenario:<\/strong> 🔻 Super Bear<br><strong>Our Prob:<\/strong> 10%<br><strong>Market Implied:<\/strong> 15%<br><strong>TTF Range:<\/strong> €28-35<br><strong>Edge:<\/strong> Overpriced<br><\/p>\n\n<p><strong>Key divergence: the market is overpricing a positive resolution.<\/strong> The TTF Dec '26 contract at ~€44.10 (flat to front-month) suggests the market sees limited upside risk and is pricing in a gradual normalization. Our view is that the market is underpricing the probability of extended stalemate (Scenario 3: 30% vs implied 25%) and underpricing escalation risk (15% vs implied 10%). Conversely, the market overprices the 'clean deal' scenario (30% implied vs our 15%).<\/p>\n\n<p><strong>Confirmation triggers for each scenario:<\/strong><\/p>\n<ul>\n<li><strong>Escalation:<\/strong> IRGC vessel seizure, US military incident in Hormuz, Iran public rejection of MOU<\/li>\n<li><strong>Partial Deal:<\/strong> MOU signed with conditions, Iran announces toll framework, limited shipping resumes<\/li>\n<li><strong>Stalemate:<\/strong> Talks extended without agreement, both blockades maintained, Qatar restart not initiated<\/li>\n<li><strong>Full Reopening:<\/strong> Joint US-Iran announcement, IMO confirms safe passage, QatarEnergy declares end of force majeure<\/li>\n<li><strong>Super Bear:<\/strong> Full deal + Hormuz opening + El Niño confirmation (Niño 3.4 > +1.5°C by Aug) + mild European autumn<\/li>\n<\/ul>\n\n<h3>💡 Trade Ideas<\/h3>\n<p><strong>1. Convexity Position — Buy TTF Jun €40/€55 Strangle:<\/strong> The strangle (buy out-of-the-money puts and calls) captures the mispricing on both tails. Cost: ~€1.50-2.00 total premium. If our 45% combined escalation + stalemate probability is correct, the expected value is positive. The market's consensus 'range-bound' view underprices the probability of a €5+ move in either direction within 30 days.<\/p>\n\n<p><strong>2. Long Dec '26 / Short Jun '26 Calendar (Structural Bull):<\/strong> The flat TTF curve is the opportunity. Even in the base case (stalemate), winter 2026/27 must price in: (a) storage deficit requiring premium-priced injection, (b) Qatar offline through Q3 at minimum, (c) no Russian spot LNG, (d) potential for renewed escalation. Buy Dec '26 at €44.10, sell Jun '26 at €44.21. Target: spread widening to €5-10 by October. Risk: comprehensive deal removes premium.<\/p>\n\n<p><strong>3. Tail Hedge — Buy Jun €60 Calls (€0.30-0.40):<\/strong> Cheap insurance against the 15% escalation scenario. At €0.30, the cost is negligible relative to the €15-55 potential payoff if TTF spikes. This is portfolio insurance, not a directional bet.<\/p>\n\n<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Felix 🎯<\/div><div class='dissent-text'>You're anchoring on the market being 'too optimistic' because TTF is only at €44. But consider: even in your 30% stalemate scenario, TTF only reaches €60 by Q4 — that's a €16 move over 5 months. The implied move from current vol is pricing something similar. The real mispricing isn't directional — it's in the vol surface. Summer vol is too low relative to winter vol. The play is buy summer vol, sell winter vol.<\/div><\/div>","sig":"Blaise 🧮 · Gas Morning Brief"},{"t":"analysis","badge":"📊 🌍 Scénario Géopolitique","title":"5 Geopolitical Scenarios — MOU Progress vs. Hormuz Permanence","hook":"A 14-point MOU is on the table via Pakistani mediators. But Hormuz is closed for 69+ days, blockades persist on both sides, and the IRGC just seized a tanker. The tail risks are not symmetric.","authorWord":"The market is pricing a 70% chance of deal — but the odds of a clean, comprehensive resolution are much lower. The most probable outcome is a fudge: extended ceasefire, partial Hormuz opening under Iranian conditions, and persistent risk premium. Think €40-50 for months.","author":"La Rédaction 🦊","details":"<p><strong>🔥 BULL EXTREME — MOU Collapses, Full Escalation Resumes (15% prob):<\/strong> Iran rejects the MOU terms (Trump himself says he's \"not satisfied\"). IRGC escalates with another vessel seizure or direct attack on US mine-clearing operations in the Hormuz approach channel. The ceasefire formally collapses. Trump faces war powers deadline pressure and may escalate to force a resolution. TTF spikes to €65-80/MWh on the initial headline, with potential for €100+ if the Strait sees military escalation restricting all traffic. JKM surges past $25/MMBtu. Brent hits $120-130/bbl. Duration: weeks to months before any new ceasefire attempt.<\/p>\n\n<p><strong>💣 HIGH RISK — MOU Signed But Hormuz Remains Partially Closed (30% prob):<\/strong> The most likely path. Both sides agree to a ceasefire extension and framework MOU, but Iran insists on maintaining tolls and IRGC-coordinated passage. The US counter-blockade on Iranian ports persists. Commercial shipping gradually resumes but at 30-50% of pre-crisis volumes. Qatar begins partial Ras Laffan restarts (4-6 trains) with full restoration not expected before Q1 2027. TTF settles into a €42-52/MWh trading range with elevated volatility. LNG freight premium persists at $1-2/MMBtu above pre-crisis. Storage injection proceeds but at elevated cost. This scenario can persist for months — becoming the 'new normal' that the market slowly absorbs.<\/p>\n\n<p><strong>🔄 BASE CASE — Negotiations Drag Through Summer, Status Quo (30% prob):<\/strong> Talks continue via Pakistani mediators but progress is slow. Neither side makes meaningful concessions. Hormuz remains closed. Qatar cannot restart. EU storage continues filling with US and African LNG at elevated prices. TTF trades €44-50/MWh through summer with seasonal demand pickup pushing toward €55-60 in Q4. By October, if no deal is reached, the market prices in a winter with no Qatar LNG and below-target storage — potentially triggering emergency demand-reduction measures. The EU Gas Coordination Group activates Article 9 coordination. This is the slow-burn scenario.<\/p>\n\n<p><strong>⚓ MODERATE BULL — Comprehensive Deal, Full Hormuz Reopening (15% prob):<\/strong> Against expectations, the MOU is finalized with both sides agreeing to: (1) full Hormuz reopening under international monitoring, (2) removal of both blockades, (3) mutual ceasefire extension. QatarEnergy immediately begins Ras Laffan restart process. US Golden Pass and other new supply offsets the ramp-up period. TTF drops €5-8/MWh initially, then stabilizes at €38-42 as the market absorbs the Qatar restart timeline (end-August for full trains). The relief rally is front-loaded — by Q4, the market refocuses on winter fundamentals. This is the 'buy the rumor, sell the fact' scenario.<\/p>\n\n<p><strong>🔻 BEAR EXTREME — Deal + Rapid Reopening + Super El Niño Mild Winter (10% prob):<\/strong> The tail-bear scenario combines: (1) full MOU deal, (2) rapid Hormuz reopening within weeks, (3) Qatar accelerates Ras Laffan restart (training turbines from Asian facilities), (4) El Niño materializes as Super El Niño bringing mild NW European winter, and (5) Nordic hydro recovers faster than expected. TTF crashes to €30-35/MWh by autumn. The LNG freight premium collapses. JKM drops to $10-12/MMBtu. This scenario requires everything to break right — probability is low but not zero.<\/p>\n\n<h3>💡 Trade Ideas<\/h3>\n<p><strong>1. TTF Iron Condor — Sell €38 Puts + Sell €55 Calls (Range Trade):<\/strong> With 60% probability assigned to the €42-52 range (Scenarios 2+3), selling an iron condor captures premium while defining risk. Sell Jun €38 puts at ~€0.50 and Jun €55 calls at ~€0.40. Buy €35 puts and €60 calls as wings for protection. Net credit ~€0.60-0.70. Max profit at expiry between €38-55. Max loss = €3.00-3.10 (wing width minus credit). Rationale: the market is stuck in a range until there's a binary outcome.<\/p>\n\n<p><strong>2. Long Dec '26 TTF / Short Jun '26 TTF (Calendar Risk Premium):<\/strong> Even if near-term resolution occurs, the winter 2026/27 contract must price in: (a) Qatar restart uncertainty, (b) storage deficit, (c) potential for renewed escalation. The Dec-Jun spread at ~€0 is too flat given these risks. Buy Dec '26, sell Jun '26. Target spread widening to €5-8. Stop if comprehensive deal is signed and Hormuz fully reopens.<\/p>\n\n<p><strong>3. Long TTF Jun '26 €45 Calls / Short €50 Calls (Bull Call Spread):<\/strong> For traders who think the base case (slow negotiations, status quo) supports modest upside from current €44. Buy €45 calls at ~€1.20, sell €50 calls at ~€0.80. Net cost ~€0.40. Max profit = €4.60 at €50. Max loss = €0.40. Reward/risk ratio of 11.5:1. The thesis: even without escalation, the market drifts higher as storage deficit becomes apparent through summer.<\/p>\n\n<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Iris 🦋<\/div><div class='dissent-text'>Your probabilities sum to 100% but you're missing the 'muddle-through' scenario where Hormuz partially opens under Iranian conditions and stays that way indefinitely. That's not Scenario 2 (MOU signed) — it could happen without any MOU at all. Iran has every incentive to keep the strait under its control and collect tolls. The probability of 'no deal, partial opening, indefinite status quo' is higher than you think — maybe 20% on its own.<\/div><\/div>","sig":"La Rédaction 🦊 · Gas Morning Brief"},{"t":"end","end":true,"disclaimer":"⚠️ AVERTISSEMENT — Ce document est un exercice expérimental de veille automatisée produit par intelligence artificielle. Il ne constitue EN AUCUN CAS un conseil en investissement, une recommandation de trading, ni une analyse financière réglementée au sens de la directive MiFID II ou du Code monétaire et financier (art. L541-1). Les « scénarios de marché » présentés sont des hypothèses pédagogiques générées par des modèles de langage — ils ne reflètent pas l'avis d'un professionnel agréé. Les données proviennent de sources publiques, potentiellement retardées ou erronées. Toute décision d'investissement prise sur la base de ce document relève de la seule responsabilité du lecteur. L'auteur n'est pas enregistré comme Conseiller en Investissement Financier (C
