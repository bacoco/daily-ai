<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gas Morning Brief ⚡ — 14 February 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: .45; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { display: none; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(239,68,68,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(245,158,11,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(239,68,68,.08) 0%, transparent 50%);
    }
    @media (min-width: 900px) {
      html, body { overflow: auto; height: auto; }
      #hint { display: none !important; }
      #deck {
        display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px;
        max-width: 960px; margin: 40px auto; padding: 0 20px;
      }
      .card {
        position: relative !important; top: auto !important; left: auto !important;
        transform: none !important; opacity: 1 !important; pointer-events: auto !important;
        width: 100% !important; max-width: none !important;
        height: auto !important; max-height: none !important;
        min-height: 400px;
      }
      .card.prev, .card.next { opacity: 1 !important; transform: none !important; }
    }
  </style>
</head>

  <script>
  const DATA = [{"t":"home","home":true,"date":"14 February 2026","henryWord":"Storage at 4-year lows, Alpine hydro deficits locking in elevated gas burn, and the Russian ban countdown accelerating — this is a market that hasn't fully priced its refill challenge. Watch the TTF €30 support level.","articles":[{"idx":2,"badge":"🌡️ Weather & Demand","title":"Alps Snow Deficit + Stubborn Cold = Elevated Gas Burn Through February"},{"idx":3,"badge":"📦 Storage Watch","title":"EU Storage Hits 4-Year Low at 36% — Deficit Doubles to 16 bcm vs 5Y Avg"},{"idx":4,"badge":"🚢 LNG & Flows","title":"Europe Pulls Rare China LNG Reload as Imports Surge 44% Above Seasonal Norm"},{"idx":5,"badge":"⚡ Power & Cross-Commodity","title":"Carbon Crash (-8%) Meets Hydro Deficit — Gas-for-Power Demand Stays Structurally Elevated"},{"idx":6,"badge":"💰 Price & Curve","title":"TTF Holds ~€31.7/MWh as Record LNG Flows Cap Upside — HH at $3.15 Post-Storm"},{"idx":7,"badge":"💣 Geopolitics & Regulation","title":"EU Finalizes Russian Gas Ban — LNG by End-2026, Pipeline by Sept 2027"},{"idx":8,"badge":"🎯 Risk Flags & Outlook","title":"Three Risks Converging: Storage Squeeze, Hydro Gap, and Russian Ban Countdown"}]},{"t":"alert","badge":"🌡️ Weather & Demand","title":"Alps Snow Deficit + Stubborn Cold = Elevated Gas Burn Through February","hook":"Alpine snowpack running well below average threatens hydropower output across Austria and Italy. Persistent cold pattern over NW Europe keeps heating demand elevated, compounding an already tight storage picture.","details":"<p><strong>🇪🇺 EU Temperature Outlook:</strong> Long-range models continue to show a <strong>stubborn cold pattern hanging over parts of Europe</strong> through late February (<a href='https://ewgt2025.co.uk/weather-forecast-after-the-snow-and-cold/' target=_blank>EWGT, Feb 9</a>). NW Europe — particularly Germany, France, and the UK — is running 2-3°C below seasonal norms, translating into elevated HDD counts. The <a href='https://www.reuters.com/markets/commodities/europes-low-snow-cover-sets-stage-even-higher-gas-burn-2026-02-11/' target=_blank>Reuters analysis (Feb 11)</a> highlights that snow coverage in key parts of Italy and Austria is <strong>well below normal</strong>, resulting in a steep drop in hydropower generation potential.</p><p><strong>🇺🇸 US Demand Context:</strong> Winter Storm Fern drove US gas prices to an average of <strong>$7.72/MMBtu in January</strong> (<a href='https://www.bicmagazine.com/industry/commodities/eia-raises-natural-gas-price-forecast/' target=_blank>BIC Magazine/EIA STEO, Feb 11</a>). While spot prices have retreated to ~$3.15/MMBtu, the EIA's February STEO now forecasts US production at record levels while demand holds at ~90.3 bcfd (<a href='https://boereport.com/2026/02/10/us-natgas-output-to-hit-record-high-in-2026-while-demand-holds-steady-eia-says/' target=_blank>BOE Report, Feb 10</a>).</p><p><strong>🏔️ Hydro Deficit — The Sleeper Risk:</strong> Italian hydropower production is projected to run <strong>13% below the long-term average</strong>, while Austria faces an even deeper <strong>40% deficit</strong> (<a href='https://tradersunion.com/news/financial-news/show/1449960-natural-gas-price/' target=_blank>TradersUnion, Feb 11</a>). This directly boosts gas-for-power demand across Central Europe and could sustain elevated TTF prices through Q2 refill season.</p><p><strong>Wind:</strong> EU wind capacity utilization expected to remain average-to-below-average over the coming week, limiting offset to gas burn in the power stack.</p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉</div><div class='dissent-text'>The cold pattern may be overstated. GFS ensembles show a potential pattern shift toward milder conditions by late February. If the polar vortex weakens as some models suggest, we could see a rapid demand collapse that catches the market offsides. The hydro deficit is real but seasonal — spring melt could still normalize reservoir levels if March precipitation picks up. Don't extrapolate a 2-week weather window into a structural thesis.</div></div>","authorWord":"","author":"Sage 🦎","sig":"Sage 🦎 · Weather & Demand Analyst"},{"t":"tech","badge":"📦 Storage Watch","title":"EU Storage Hits 4-Year Low at 36% — Deficit Doubles to 16 bcm vs 5Y Avg","hook":"EU gas inventories collapsed to 36.1% on Feb 9, the lowest for this date since 2022. The 5-year storage deficit has doubled since the start of heating season, now standing at 16 bcm.","details":"<p><strong>🇪🇺 EU Storage — AGSI+ Data:</strong> As of February 9, EU underground gas storage was filled to just <strong>36.1%</strong> — the minimum for this date since 2022 (<a href='https://netherlands.news-pravda.com/en/eu/2026/02/11/11034.html' target=_blank>Pravda NL, Feb 11</a>). By Feb 10, levels had slipped further to approximately <strong>35%</strong> (<a href='https://oilprice.com/Energy/Energy-General/How-a-Snow-Deficit-in-the-Alps-Will-Put-Europes-Energy-System-Under-Pressure.html' target=_blank>OilPrice, Feb 13</a>). The situation is particularly acute in the Netherlands and Croatia where facilities are running near operational minimums.</p><p><strong>📉 Deficit Analysis:</strong> The EU's 5-year storage deficit has <strong>doubled since the start of the heating season to 16 bcm</strong>, with inventory levels now standing <strong>30% below their 5-year average</strong> (<a href='https://europeangashub.com/european-gas-storage-deficit-deepens-as-winter-withdrawals-accelerate.html' target=_blank>European Gas Hub, Feb 10</a>). Storage withdrawals have soared by <strong>almost 25% compared to the 5Y average since the start of 2026</strong>, driven by sustained heating demand and cold weather.</p><p><strong>🇺🇸 US Storage:</strong> The EIA reported that Winter Storm Fern in January led to <strong>record storage withdrawals</strong>. HH prices averaged $7.72/MMBtu that month. The February STEO now projects 2026 average prices at $4.30/MMBtu (<a href='https://www.compressortech2.com/news/eia-raises-202627-gas-price-outlook-after-winter-storm/8113687.article' target=_blank>CompressorTECH², Feb 11</a>).</p><p><strong>📊 End-of-Season Trajectory:</strong> Analysts forecast EU storage could reach only <strong>~26% by end of March</strong>, when the winter season officially ends (<a href='https://oilprice.com/Energy/Energy-General/How-a-Snow-Deficit-in-the-Alps-Will-Put-Europes-Energy-System-Under-Pressure.html' target=_blank>OilPrice/GIE data, Feb 13</a>). That 2022-like scenario puts significant pressure on the refill campaign to hit the EU 90% mandate by November 1. In 2022, storage ended heating season at ~25-26% (<a href='https://tass.com/economy/2085747' target=_blank>TASS, Feb 12</a>).</p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎</div><div class='dissent-text'>The 36% headline is alarming but context matters. The EU 90% storage mandate has proven achievable even from low starting points — 2022 ended winter at 25% and still hit 95% by November. LNG imports are already running 44% above the 5Y seasonal average, and new regas capacity (German FSRUs, Eemshaven) gives the system more throughput flexibility than 2022. The market may be pricing in too much storage anxiety when the refill toolkit is significantly stronger today.</div></div>","authorWord":"","author":"Blaise 🧮","sig":"Blaise 🧮 · Storage Analyst"},{"t":"alert","badge":"🚢 LNG & Flows","title":"Europe Pulls Rare China LNG Reload as Imports Surge 44% Above Seasonal Norm","hook":"A rare LNG cargo reloaded from China is heading to Europe — a sign of how aggressively the continent is competing for molecules. EU LNG imports are running at 252k tons/day, 44% above the 5Y average.","details":"<p><strong>🚢 Record-Breaking LNG Pull:</strong> Europe's LNG imports continue to surge, with flows from terminals into the EU gas grid exceeding <strong>50 bcm since the start of the heating season</strong> (October 2025–February 2026) (<a href='https://tass.com/economy/2085747' target=_blank>TASS, Feb 12</a>). Europe's 30-day moving average for LNG imports stood at <strong>252,000 tons/day</strong> as of Feb 11, running <strong>44% above the 5-year seasonal average</strong> (<a href='https://www.swissinfo.ch/eng/gas-hungry-europe-to-get-rare-lng-shipment-reloaded-from-china/90931114' target=_blank>SWI/Bloomberg, Feb 12</a>).</p><p><strong>🇨🇳 China Reload — Market Signal:</strong> In a rare move, an LNG shipment <strong>reloaded from China is heading to Europe</strong> (<a href='https://www.bloomberg.com/news/articles/2026-02-12/gas-hungry-europe-to-get-rare-lng-shipment-reloaded-from-china' target=_blank>Bloomberg, Feb 12</a>). This highlights the intensity of European demand and the premium Europe is paying vs Asia to attract cargoes. When the world's top LNG buyer re-exports to Europe, the arbitrage window is screaming.</p><p><strong>💰 Spread Context:</strong> TTF front-month at ~€31.67/MWh (~$10.8/MMBtu equivalent) vs HH spot at $3.15/MMBtu — the transatlantic basis remains wide enough to incentivize maximum US export utilization. TTF vs JKM spread dynamics are pulling cargoes West, as evidenced by the China reload.</p><p><strong>📊 Supply Picture:</strong> European natural gas prices swung lower mid-week as LNG imports neared record highs for February, with estimated weekly arrivals at <strong>3.96 Mt</strong> (<a href='https://naturalgasintel.com/news/european-natural-gas-prices-again-swing-lower-as-lng-imports-near-record-high/' target=_blank>Natural Gas Intel, Feb 14</a>). These record-breaking flows set to push EU LNG imports to a new annual record in 2026 according to <a href='https://europeangashub.com/european-gas-storage-deficit-deepens-as-winter-withdrawals-accelerate.html' target=_blank>European Gas Hub</a>.</p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮</div><div class='dissent-text'>Record LNG imports are impressive but unsustainable at current rates. The China reload is a one-off arbitrage play, not a structural supply source. As Asian demand picks up with spring restocking in Japan/Korea, the TTF-JKM spread could compress rapidly, redirecting marginal cargoes eastward. Additionally, the EU's upcoming Russian LNG ban (end-2026) will remove ~15-17 bcm/year of supply that needs replacement. The current import surge is masking a structural tightness that becomes acute once Russian molecules exit the system.</div></div>","authorWord":"","author":"Henry 🦉","sig":"Henry 🦉 · LNG & Flows Analyst"},{"t":"analysis","badge":"⚡ Power & Cross-Commodity","title":"Carbon Crash (-8%) Meets Hydro Deficit — Gas-for-Power Demand Stays Structurally Elevated","hook":"EUA carbon prices plunged 8% to €72/ton after Merz's ETS criticism, the biggest drop since May 2022. Meanwhile, Alpine hydro deficits of 13-40% are forcing more gas into the power stack.","details":"<p><strong>🔥 Carbon Crash:</strong> EU ETS allowances fell as much as <strong>8% — the biggest drop since May 2022 — to €72.18/ton</strong> on Feb 12 after German Chancellor Friedrich Merz signaled openness to softening the ETS framework (<a href='https://www.bloomberg.com/news/articles/2026-02-12/eu-carbon-prices-drop-after-germany-s-merz-urges-market-revamp' target=_blank>Bloomberg, Feb 12</a>). The plunge continued with EUAs dropping a further €5 to a 5-month low (<a href='https://montelnews.com/news/c01f4a89-fdeb-45aa-b762-67a023bf8a76/eua-price-plummets-eur-5-to-5-month-low-after-merz-slams-ets' target=_blank>Montel, Feb 12</a>). The EU is also weighing an overhaul of industry's free permits in a broader carbon market reform (<a href='https://www.reuters.com/sustainability/boards-policy-regulation/eu-weighs-overhaul-industrys-free-permits-carbon-market-reform-2026-02-10/' target=_blank>Reuters, Feb 10</a>).</p><p><strong>⚡ Fuel Switching Implications:</strong> Lower carbon prices marginally improve coal competitiveness vs gas in the power stack. However, at €72/ton EUA + current API2 coal prices, the <strong>spark spread remains favorable over the dark spread</strong> for efficient CCGT plants across most of NW Europe. The key threshold to monitor: if EUAs fall below €65, coal-to-gas switching dynamics could reverse for some older, less efficient plants.</p><p><strong>🏔️ Hydro Gap = More Gas Burn:</strong> The Alpine snow deficit is a critical cross-commodity factor. Italian hydro production projected <strong>13% below long-term average</strong>, Austria facing a <strong>40% deficit</strong> (<a href='https://tradersunion.com/news/financial-news/show/1449960-natural-gas-price/' target=_blank>TradersUnion, Feb 11</a>). This directly translates to incremental gas-for-power demand across Central Europe. January saw EU electricity prices exceed €100/MWh in most major markets (<a href='https://gmk.center/en/posts/electricity-prices-in-europe-rose-in-most-markets-in-january/' target=_blank>GMK Center, Feb 9</a>).</p><p><strong>📊 Power Mix Context:</strong> With nuclear steady (French fleet running at typical winter availability), the marginal power generation source in most EU hours remains gas, especially during evening peaks when wind drops and solar is absent.</p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉</div><div class='dissent-text'>The Merz carbon crash may be overdone. Political rhetoric doesn't equal policy — any ETS reform requires full EU legislative process (18-24 months minimum). Smart money should fade the carbon panic. More importantly, lower carbon prices are slightly bearish for gas if they encourage coal burn. But the real wildcard nobody's pricing: if the EU Commission accelerates the 2026 ETS revision to appease Merz, the policy uncertainty itself could create hedging flows that support TTF even as EUAs fall.</div></div>","authorWord":"","author":"Sage 🦎","sig":"Sage 🦎 · Power & Cross-Commodity Analyst"},{"t":"tech","badge":"💰 Price & Curve","title":"TTF Holds ~€31.7/MWh as Record LNG Flows Cap Upside — HH at $3.15 Post-Storm","hook":"TTF front-month settled near €31.67/MWh, range-bound as record LNG imports offset tight storage fundamentals. Henry Hub spot at $3.15/MMBtu, retreating sharply from January's $7.72 storm-driven spike.","details":"<p><strong>📈 Spot Prices (as of Feb 13):</strong></p><ul><li><strong>TTF (ICE):</strong> ~€31.67/MWh, down marginally from €31.88 on Feb 11 (<a href='https://www.oilpriceapi.com/live/dutch-ttf-gas-price' target=_blank>OilPriceAPI, Feb 13</a>; <a href='https://selectra.nl/energie/nieuws/stroomprijs-per-uur-2026-02-10' target=_blank>Selectra/EEX, Feb 11</a>)</li><li><strong>Henry Hub (NYMEX):</strong> ~$3.15/MMBtu spot (<a href='https://www.oilpriceapi.com/live/natural-gas-price' target=_blank>OilPriceAPI, Feb 13</a>), down dramatically from January's $7.72 average driven by Winter Storm Fern</li><li><strong>Transatlantic basis:</strong> TTF ≈ $10.8/MMBtu equivalent vs HH $3.15 — spread of ~$7.65, well above the ~$2-3 shipping + liquefaction cost, keeping US LNG exports at max utilization</li></ul><p><strong>📊 Forward Curve Structure:</strong> The TTF curve remains in <strong>mild contango</strong> for summer months as the market prices in aggressive refill requirements to hit the EU 90% storage mandate. Winter 2026-27 strip pricing implies the market expects tight balances to persist. The summer-winter spread reflects anxiety about whether storage can be refilled from a ~26% end-of-winter starting point.</p><p><strong>🇺🇸 US Curve Context:</strong> EIA's February STEO forecasts HH averaging <strong>$4.30/MMBtu in 2026</strong> and $4.40 in 2027, revised down ~5% from January despite the winter storm, as record production (109.1 bcfd forecast) offsets demand growth (<a href='https://www.compressortech2.com/news/eia-raises-202627-gas-price-outlook-after-winter-storm/8113687.article' target=_blank>CompressorTECH², Feb 11</a>).</p><p><strong>🔑 Key Levels to Watch:</strong> TTF support at €30/MWh (psychological round number), resistance at €35/MWh (Jan highs). HH support at $3.00, resistance at $3.50. The EUA collapse adds a new variable — lower carbon could theoretically cap gas prices by improving coal competitiveness, but the hydro deficit offsets this.</p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎</div><div class='dissent-text'>The market is complacent at €31-32. Consider: EU storage at 4-year lows, Russian LNG ban coming end-2026, Alpine hydro deficit, and we're still 6+ months from the next winter. The contango is too flat — it doesn't adequately price the refill risk. If cold weather extends into March or a single major LNG terminal goes down for unplanned maintenance, TTF could retest €40+ quickly. The $7.65 transatlantic spread is also unsustainable; it'll attract so many cargoes that either TTF falls or HH rises to narrow it.</div></div>","authorWord":"","author":"Blaise 🧮","sig":"Blaise 🧮 · Price & Curve Analyst"},{"t":"alert","badge":"💣 Geopolitics & Regulation","title":"EU Finalizes Russian Gas Ban — LNG by End-2026, Pipeline by Sept 2027","hook":"The EU gave final approval to ban Russian LNG imports by end-2026 and pipeline gas by September 2027. Meanwhile, Brussels eyes banning LNG tanker services that keep Russia's Arctic fleet operational.","details":"<p><strong>🇷🇺 Russian Gas Ban — Now Official:</strong> The EU has given <strong>final approval to a comprehensive Russian gas ban</strong>: LNG imports will end by the close of 2026, followed by a ban on pipeline gas starting September 30, 2027 (<a href='https://www.themoscowtimes.com/2026/01/26/eu-gives-final-approval-to-russian-gas-ban-a91781' target=_blank>Moscow Times, Jan 26</a>). This is the most significant supply-side regulatory development for European gas markets since the 2022 crisis.</p><p><strong>🚢 Arctic LNG 2 — Tanker Services Ban:</strong> The EU is now eyeing a ban on LNG tanker services in new sanctions, targeting the critical vulnerability of Russia's Yamal LNG project. The project depends on <strong>14 Arc7 ice-class carriers</strong> — European shipyards and service providers have remained central to keeping this fleet operational despite nearly 4 years of sanctions (<a href='https://en.highnorthnews.com/politics/eu-eyes-ban-on-lng-tanker-services-in-new-sanctions-timing-will-be-key-to-ensure-effectiveness/1103057' target=_blank>High North News, Feb 9</a>). Russia's Arctic LNG 2 is set to add more ice-class tankers built at the Zvezda shipyard in 2026, but the sanctioned vessels face operational challenges (<a href='https://gcaptain.com/russias-arctic-lng-2-set-to-add-more-ice-class-tankers-in-2026/' target=_blank>gCaptain, Feb 11</a>).</p><p><strong>🇩🇪 Merz's ETS Gambit:</strong> German Chancellor Friedrich Merz's public criticism of the EU ETS framework is a political wildcard. While it crashed carbon prices, it also signals potential broader regulatory uncertainty across EU energy/climate policy. The EU Commission is already assessing changes to the free allowance system and CBAM implementation (<a href='https://www.reuters.com/sustainability/boards-policy-regulation/eu-weighs-overhaul-industrys-free-permits-carbon-market-reform-2026-02-10/' target=_blank>Reuters, Feb 10</a>).</p><p><strong>🌍 Structural Shift:</strong> Reuters analysis frames the broader picture: when energy systems are built on imported fossil fuels, they inherit geopolitical risk by design (<a href='https://www.reuters.com/sustainability/climate-energy/russiaukraine-energy-shock-why-geopolitics-demands-clean-energy-shift--ecmii-2026-02-12/' target=_blank>Reuters, Feb 12</a>). The cumulative effect of Russian gas bans + tighter sanctions on tanker services will structurally tighten the global LNG market, particularly for 2027 when both LNG and pipeline bans overlap during the transition period.</p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉</div><div class='dissent-text'>The Russian gas ban timeline is ambitious but enforcement is the real question. We've seen the shadow fleet circumvent oil sanctions effectively — expect similar cat-and-mouse with LNG. Russian Yamal and Arctic LNG 2 volumes won't disappear; they'll re-route through intermediaries (Turkey, India, UAE). Net effect on global supply could be smaller than headline suggests. The bigger risk is the transition period in 2027 when both bans activate simultaneously — that's where the supply squeeze could genuinely bite.</div></div>","authorWord":"","author":"Henry 🦉","sig":"Henry 🦉 · Geopolitics Analyst"},{"t":"strategy","badge":"🎯 Risk Flags & Outlook","title":"Three Risks Converging: Storage Squeeze, Hydro Gap, and Russian Ban Countdown","hook":"The gas market faces a triple convergence: 4-year low storage, Alpine hydro deficits boosting gas burn, and the ticking clock on Russian supply bans. Positioning suggests the market hasn't fully priced the refill challenge.","details":"<p><strong>🚨 TOP 3 RISKS (ranked by probability × impact):</strong></p><ol><li><strong>Storage Refill Failure (High probability, High impact):</strong> With EU storage projected to exit winter at ~26%, the refill campaign to hit 90% by Nov 1 requires an unprecedented ~64 percentage points of injection. Any disruption — extended cold into March, LNG terminal outage, Asian demand surge narrowing the TTF-JKM spread — could make the mandate unachievable without additional price incentives (i.e., higher TTF to attract marginal cargoes).</li><li><strong>Hydro Deficit Persistence (Medium-High probability, Medium impact):</strong> The Alpine snow deficit (Italy -13%, Austria -40% below normal) is structural for 2026 — the snow that didn't fall can't retroactively provide spring/summer meltwater. This locks in elevated gas-for-power demand through at least Q3 2026, adding ~3-5 bcm of incremental gas burn that the market hasn't fully priced.</li><li><strong>Russian Supply Transition Risk (Medium probability, Very High impact):</strong> The EU's dual ban — Russian LNG by end-2026, pipeline by Sept 2027 — creates a 9-month overlap period where both restrictions apply simultaneously. If enforcement is strict and shadow fleet workarounds are limited, global LNG tightness could spike materially in late 2026/early 2027.</li></ol><p><strong>🐂 BULL SCENARIO:</strong> Should cold weather extend into March AND an unplanned LNG terminal outage occur simultaneously, TTF could test <strong>€38-42/MWh</strong> within 2 weeks. The storage deficit would widen further, forcing aggressive spot LNG procurement at premium prices. EUA recovery from the Merz-driven selloff would add to power sector gas costs.</p><p><strong>🐻 BEAR SCENARIO:</strong> A rapid shift to milder weather across NW Europe (some GFS ensembles hint at this by late Feb), combined with sustained record LNG arrivals (currently 44% above 5Y avg), could push TTF toward <strong>€27-28/MWh</strong>. EUA weakness (if Merz follows through on reform rhetoric) would further suppress gas demand by improving coal's relative economics.</p><p><strong>📅 CATALYSTS TO WATCH THIS WEEK:</strong></p><ul><li><strong>Feb 17 (Mon):</strong> AGSI+ storage data update — watch for any acceleration in withdrawal pace</li><li><strong>Feb 18 (Tue):</strong> ECMWF extended forecast update — key for late-Feb/early-Mar temperature outlook</li><li><strong>Feb 19 (Wed):</strong> EIA Weekly Natural Gas Storage Report — US injection/withdrawal data</li><li><strong>Ongoing:</strong> EU Council deliberations on Russian LNG tanker service ban timing</li><li><strong>Ongoing:</strong> EUA price stability post-Merz — watch for follow-through selling or recovery</li></ul><p><strong>📊 POSITIONING CONTEXT:</strong> The flat contango in the TTF curve, combined with 4-year low storage and structural hydro deficits, suggests the market is underpricing upside risk. The wide transatlantic basis ($7.65/MMBtu) is attracting cargoes but this spread is cyclical — when Asian restocking begins, the arbitrage window could narrow quickly. Current setup favors scenarios where prices grind higher rather than collapse, unless weather shifts decisively milder.</p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉</div><div class='dissent-text'>This analysis overweights tail risks and underweights the market's ability to self-correct. Record LNG flows prove the system works — price signals attract supply. The EU refilled from 25% to 95% in 2022 with less infrastructure than today. The Russian ban will be phased and pragmatically enforced (see: oil sanctions precedent). The biggest risk to the bull case? New US LNG export capacity (Plaquemines, Golden Pass) coming online in 2026 adds ~30 MTPA to global supply. Bears have ammunition too.</div></div>","authorWord":"","author":"Maman 🦊","sig":"Maman 🦊 · Risk Synthesis"},{"t":"end","end":true}];

  const deck = document.getElementById('deck');
  const hint = document.getElementById('hint');
  const total = DATA.length;
  let cur = 0, startX = 0, deltaX = 0, dragging = false, startTime = 0;

  DATA.forEach((d, i) => {
    const c = document.createElement('article');
    c.className = 'card' + (i === 0 ? ' active' : ' next');
    c.dataset.t = d.t;
    c.dataset.i = i;
    if (d.home) {
      const articlesHtml = d.articles.map((a, j) => `
        <div class="home-article" data-goto="${a.idx}">
          <div class="num">${a.badge.split(' ')[0]}</div>
          <div class="info">
            <div class="badge-sm">${a.badge.split(' ').slice(1).join(' ')}</div>
            <div class="title-sm">${a.title}</div>
          </div>
          <div class="arrow">›</div>
        </div>`).join('');
      c.innerHTML = `
        <div class="hdr"><span class="badge tech">📰 Daily</span><div class="dots">${dots(i)}</div></div>
        <div class="home-content">
          <div class="home-logo"><span>⚡ <b>Gas</b> Morning Brief</span></div>
          <div class="home-date">${d.date}</div>
          <div class="home-henry"><div class="label">🦊 🦊 The Brief</div><div class="text">${d.henryWord}</div></div>
          <div class="home-articles">${articlesHtml}</div>
          <div class="home-footer"></div>
        </div>`;
    } else if (d.end) {
      c.innerHTML = `
        <div class="hdr"><span class="badge end">✅ Terminé</span><div class="dots">${dots(i)}</div></div>
        <div class="end-content">
          <div class="em">🎉</div>
          <h2>Briefing terminé !</h2>
          <p>Vous avez parcouru le briefing du jour.<br>À demain !</p>
          <a href="https://bacoco.github.io/daily-ai/gas-morning-brief/" style="display:inline-block;padding:12px 32px;border:none;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;box-shadow:0 0 25px rgba(59,130,246,.4);margin-bottom:12px;">📰 Toutes les éditions</a><br><button id="restart">🔄 Recommencer</button>
          <small>← Swipez à gauche pour revenir</small>
        </div>`;
    } else {
      const authorWordHtml = d.authorWord ? `<div class="author-word"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author}</div></div>` : '';
      c.innerHTML = `
        <div class="hdr"><span class="badge ${d.t}">${d.badge}</span><div class="dots">${dots(i)}</div></div>
        <div class="title-zone"><h1>${d.title}</h1></div>
        <div class="scroll-cta"><span><i>↓</i> Lire plus</span></div>
        <div class="scroll-zone"><div class="scroll-inner">
          ${authorWordHtml}
          <div class="hook">${d.hook}</div>
          <div class="details">${d.details}<div class="sig">AI Insight Daily — 14 February 2026</div></div>
        </div></div>`;
    }
    deck.appendChild(c);
  });

  function dots(active) { let s=''; for(let i=0;i<total;i++) s+=`<span class="dot${i===active?' on':''}"></span>`; return s; }
  const cards = deck.querySelectorAll('.card');
  function update(anim=true) {
    cards.forEach((c,i)=>{
      c.classList.toggle('anim',anim);
      c.classList.remove('prev','active','next','behind'); c.style.opacity='';
      if(i===cur)c.classList.add('active'); else if(i===cur+1||i===cur-1)c.classList.add('behind'); else if(i<cur)c.classList.add('prev'); else c.classList.add('next');
      c.style.transform='';
      c.querySelectorAll('.dot').forEach((d,j)=>d.classList.toggle('on',j===cur));
    });
  }
  function go(i){if(i>=0&&i<total){cur=i;update();}}
  const dateKey='daily-14-February-2026';
  if(!localStorage.getItem(dateKey)){setTimeout(()=>{hint.classList.add('hide');localStorage.setItem(dateKey,'1');},2000);}else hint.style.display='none';
  
  document.querySelectorAll('.scroll-zone, .home-content').forEach(function(sz){
    var card = sz.closest('.card');
    if(!card) return;
    sz.addEventListener('scroll', function(){
      card.classList.toggle('scrolled', sz.scrollTop > 10);
    }, {passive:true});
  });
  document.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startTime=Date.now();deltaX=0;dragging=true;cards[cur].classList.remove('anim');},{passive:true});
  document.addEventListener('touchmove',e=>{if(!dragging)return;deltaX=e.touches[0].clientX-startX;cards[cur].style.transform=`translate(-50%,-50%) translateX(${deltaX}px) rotate(${deltaX*0.012}deg)`;var p=Math.min(Math.abs(deltaX)/200,1);var sc=0.93+p*0.07;var op=0.4+p*0.6;var nxt=deltaX<0?cards[cur+1]:cards[cur-1];if(nxt){nxt.style.transform='translate(-50%,-50%) scale('+sc+')';nxt.style.opacity=op;}},{passive:true});
  document.addEventListener('touchend',e=>{if(!dragging)return;dragging=false;const card=cards[cur];card.classList.add('anim');if(cards[cur+1])cards[cur+1].classList.add('anim');if(cards[cur-1])cards[cur-1].classList.add('anim');const velocity=Math.abs(deltaX)/(Date.now()-startTime);const threshold=velocity>0.5?30:60;if(deltaX>threshold&&cur===0){window.location.href='https://bacoco.github.io/daily-ai/';}else if(deltaX<-threshold&&cur===total-1){window.location.href='https://bacoco.github.io/daily-ai/';}else if(deltaX<-threshold&&cur<total-1){cur++;update();}else if(deltaX>threshold&&cur>0){cur--;update();}else{card.style.transform='';}},{passive:true});
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&cur<total-1){cur++;update();}if(e.key==='ArrowLeft'&&cur>0){cur--;update();}});
  document.addEventListener('click',e=>{if(e.target.id==='restart')go(0);const article=e.target.closest('.home-article');if(article){const idx=parseInt(article.dataset.goto);if(!isNaN(idx))go(idx);}});
  function checkDesktop(){if(window.innerWidth>=900){deck.classList.add('desktop-mode');cards.forEach(c=>{c.classList.remove('prev','next','behind','anim'); c.style.opacity='';c.classList.add('active');c.style.transform='none';});}else{deck.classList.remove('desktop-mode');update(false);}}
  checkDesktop();window.addEventListener('resize',checkDesktop);
  </script>
