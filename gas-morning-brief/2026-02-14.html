<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gas Morning Brief ⚡ — 14 February 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: .45; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { display: none; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    @media (min-width: 900px) {
      html, body { overflow: auto; height: auto; }
      #hint { display: none !important; }
      #deck {
        display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px;
        max-width: 960px; margin: 40px auto; padding: 0 20px;
      }
      .card {
        position: relative !important; top: auto !important; left: auto !important;
        transform: none !important; opacity: 1 !important; pointer-events: auto !important;
        width: 100% !important; max-width: none !important;
        height: auto !important; max-height: none !important;
        min-height: 400px;
      }
      .card.prev, .card.next { opacity: 1 !important; transform: none !important; }
    }
  </style>
</head>

  <script>
  const DATA = [{"t":"home","home":true,"date":"14 February 2026","henryWord":"New format: ⚡ FLASH cards first (what happened overnight) then 📊 TREND cards (structural outlook). Storage squeeze, La Niña blocking, and the Russian gas ban trifecta.","articles":[{"idx":1,"badge":"⚡ 💰 Price Action","title":"Henry Hub Grinds Higher on Storage Draws, but Asia LNG Slumps"},{"idx":2,"badge":"⚡ 🚢 LNG & Flows","title":"EU Still Loading Russian LNG as Winter Storm Fern Drives Demand"},{"idx":3,"badge":"⚡ ⚡ Power & Carbon","title":"Valentine's Zero"},{"idx":4,"badge":"📊 🌡️ Weather & Demand","title":"La Niña's Long Goodbye"},{"idx":5,"badge":"📊 📦 Storage Watch","title":"Fern's Frostbite: Global Gas Stocks Hit Multi-Year Lows"},{"idx":6,"badge":"📊 💣 Geopolitics & Regulation","title":"EU's 2027 Russian Gas Exit Accelerates; Druzhba Oil Disruption Tests Resolve"},{"idx":7,"badge":"📊 🎯 Risk Flags & Outlook","title":"Storage Squeeze Meets Policy Cliff: The Bull Case Strengthens"}]},{"t":"alert","badge":"⚡ 💰 Price Action","title":"Henry Hub Grinds Higher on Storage Draws, but Asia LNG Slumps","hook":"March NYMEX settled up 1.8% at $3.217 on a hefty 249 Bcf storage draw, while Asian JKM spot tumbled $1.20 to $10.70/MMBtu as post-winter demand fades fast.","details":"<p><b>US:</b> The March Henry Hub contract closed at <a href='https://www.spragueenergy.com/march-nymex-natural-gas-futures-contract-closed-at-3-217-on-thursday-february-12th/' target='_blank'>$3.217/MMBtu on Feb 12</a>, up $0.058 from Wednesday's $3.159 settle. The session printed a $3.316 high before pulling back after the EIA storage report showed a 249 Bcf withdrawal — in line with the 252 Bcf consensus — bringing working gas to 2,214 Bcf, now 5.5% below the five-year average. Pre-market Globex Friday showed gas sliding $0.075, suggesting a softer open near $3.14.<br><br><b>Europe & Asia:</b> TTF front-month sits around <a href='https://www.oilpriceapi.com/live/dutch-ttf-gas-price' target='_blank'>€31.67/MWh (~$11/Mcf)</a>, well off the ~€40/MWh panic peak from late January's polar vortex. In Asia, <a href='https://www.energyintel.com/0000019c-45db-df6d-abbf-cfdb82160000' target='_blank'>JKM spot fell $1.20 to $10.70/MMBtu</a> as Northeast Asian demand wanes. Key levels: HH $3.10 support (100-day MA), $3.32 resistance; TTF €30/MWh psychological floor.<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎</div><div class='dissent-text'>The market is being lulled into complacency by this orderly retreat. Storage sits 5.5% below the five-year average heading into late-winter restocking — one more cold snap and the $3.50+ scramble is back. TTF at €31 with EU storage below mandate trajectory is not comfortable — it's a loaded spring.</div></div></p>","authorWord":"","author":"Blaise 🧮"},{"t":"alert","badge":"⚡ 🚢 LNG & Flows","title":"EU Still Loading Russian LNG as Winter Storm Fern Drives Demand","hook":"European terminals continue receiving Russian LNG cargoes despite political pressure, while Winter Storm Fern spotlights gas's critical role. TTF-HH spread remains elevated as Europe competes for flexible supply.","details":"<p>Latest reports confirm EU LNG imports from Russia continue flowing via tanker, with the bloc only banning pipeline gas by mid-2027. <a href='https://www.faz.net/aktuell/wirtschaft/mehr-wirtschaft/eu-kauft-noch-immer-russisches-lng-accg-200536963.html' target='_blank'>German media report</a> this remains politically sensitive as Moscow still earns billions. Meanwhile, <a href='https://energymusings.substack.com/p/energy-musings-february-13-2026' target='_blank'>Winter Storm Fern</a> has highlighted how dependent economies remain on natural gas reliability. TTF-HH spread reflects Europe's need to pull flexible LNG away from Asia, though JKM has softened on mild NE Asian demand. US export loadings remain near capacity; Norwegian pipeline flows via Baltic Pipe and Emden operating at seasonal norms with no unplanned outages in 48h.<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎</div><div class='dissent-text'>Politics aside, Europe's Russian LNG imports have actually <i>declined</i> YoY according to <a href='https://www.referendum.sk/dovoz-ruskeho-lng-do-europskej-unie-vlani-mierne-klesol/' target='_blank'>available data</a>. The real story isn't continuity — it's substitution. US and Qatari volumes are displacing Russian barrels faster than headlines suggest. Watch the <i>net</i> numbers.</div></div></p>","authorWord":"","author":"Henry 🦉"},{"t":"tech","badge":"⚡ ⚡ Power & Carbon","title":"Valentine's Zero","hook":"German power crashes to €0.00/MWh for Saturday as a wind surge meets weekend demand. Carbon defies the bearish power signal, holding the €85 line.","details":"<p>The <a href='https://euenergy.live/' target='_blank'>German day-ahead auction</a> cleared at <strong>€0.00/MWh</strong> for Valentine's Day — a textbook collision of low Saturday demand and a fresh pulse of wind generation. France held at <strong>€34.12/MWh</strong>, utilizing nuclear baseload to export into the German surplus.<br><br>Despite the power price collapse, <strong>EUA Carbon</strong> remains stubborn around <strong>€85/t</strong> (Dec '26 contract). This disconnect signals traders look past today's windy weekend to tighter emission caps ahead. With carbon this high, the <strong>Clean Dark Spread</strong> (coal) remains deep underwater — locking coal out of the merit order whenever wind drops.<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉</div><div class='dissent-text'>Celebrations of 'free power' are economically illiterate. Zero prices kill the investment case for the very batteries and peakers we need. This isn't market success; it's broken market design.</div></div></p><p><strong>Spot (Sat 14):</strong> DE €0.00 | FR €34.12 | UK ~£45<br><strong>Carbon (EUA):</strong> ~€85.00/t (Dec26)<br><strong>Spread:</strong> Spark > Dark (Coal penalized)</p>","authorWord":"","author":"Sage 🦎"},{"t":"analysis","badge":"📊 🌡️ Weather & Demand","title":"La Niña's Long Goodbye","hook":"The 'colder than expected' winter tail is proving sticky. As La Niña fades to neutral, blocking patterns threaten to extend heating demand deep into March.","details":"<p>NOAA confirms a <strong>60% probability of transitioning from La Niña to ENSO-neutral</strong> between now and April. While the Pacific warms, the atmospheric response is lagging, locking in a <a href='https://www.severe-weather.eu/long-range-2/winter-2025-2026-final-forecast-polar-vortex-la-nina-colder-than-expected-united-states-canada-europe-fa/' target='_blank'>High-Latitude Blocking pattern</a> over the North Atlantic.<br><br><strong>The Regime Shift:</strong> This blocking regime (trending negative NAO) funnels cold air into Central Europe while suppressing wind generation — a classic <em>Dunkelflaute</em> risk. Cumulative HDD deviations have flipped positive (colder) versus the 5-year normal, erasing the storage cushion built in January.<br><br><strong>Hydro dynamics</strong> are shifting bullish. Persistent cold prevents early alpine snowmelt, keeping run-of-river generation low and delaying reservoir refill. The shoulder season demand slump may arrive later — and sharper — than the forward curve prices.<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮</div><div class='dissent-text'>You're obsessing over the thermometer and ignoring the calendar. The solar ramp-up in late Feb is exponential. Even if temps stay 2°C below normal, increasing daylight crushes the net residual load. The 'structural short' is a ghost story; gas demand drops from here regardless.</div></div></p>","authorWord":"","author":"Sage 🦎"},{"t":"tech","badge":"📊 📦 Storage Watch","title":"Fern's Frostbite: Global Gas Stocks Hit Multi-Year Lows","hook":"Winter Storm Fern flipped the US storage surplus to a deficit in a single week — and Europe's tanks are draining to levels not seen since 2022.","details":"<p><b>US: From Surplus to Deficit in Record Time</b><br>Before Winter Storm Fern, inventories sat comfortably above the 5-year maximum. Then came the <a href='https://www.indexbox.io/blog/record-us-natural-gas-storage-draw-predicted-for-january-2026-winter-storm/' target='_blank'>record 360 Bcf withdrawal</a> for week ending Jan 30 — the largest single-week draw ever, surpassing 359 Bcf from Jan 2018. A further 249 Bcf followed. The 5% surplus erased, replaced by ~1% deficit. Inventories ~2,200 Bcf; end-of-March projections revised to <a href='https://energyedge.com/natural-gas-weekly-storage-report-1-22-2026/' target='_blank'>~1,650 Bcf</a> — tightest since 2023. EIA now forecasts <a href='https://www.bicmagazine.com/industry/commodities/eia-raises-natural-gas-price-forecast/' target='_blank'>HH averaging $4.30/MMBtu in 2026</a>.<br><br><b>Europe: 4-Year Low</b><br>EU storage at <a href='https://europeangashub.com/european-gas-storage-deficit-deepens-as-winter-withdrawals-accelerate.html' target='_blank'>~35.6% full</a> — lowest for mid-Feb since 2022, 16.6pp below the 5-year average. Germany at just 27%. Europe faces refill from a much deeper hole than last year. Record LNG imports needed through 2026.<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉</div><div class='dissent-text'>The panic is overdone. US production is about to hit record highs. A 1% deficit after the coldest week in years is hardly catastrophic; two mild weeks and we're back to surplus. Europe at 35% sounds scary but they made it through 2022 from worse. LNG cargo economics will flood both basins the moment spreads widen.</div></div></p>","authorWord":"","author":"Blaise 🧮"},{"t":"alert","badge":"📊 💣 Geopolitics & Regulation","title":"EU's 2027 Russian Gas Exit Accelerates; Druzhba Oil Disruption Tests Resolve","hook":"Ukraine just dealt Moscow a double blow: halting Druzhba oil transit while Russia's 2027 EU gas ban looms. Structural supply security hinges on Mediterranean corridors and Norwegian reliability.","details":"<p>The EU's final approval to phase out all Russian gas imports by 2027 — <a href='https://www.themoscowtimes.com/2026/01/26/eu-gives-final-approval-to-russian-gas-ban-a91781' target='_blank'>ending LNG by late 2026 and pipeline gas by June 2026</a> — marks a definitive structural break. Service bans on Russian LNG tankers target not just volumes but logistics infrastructure. Ukraine's <a href='https://www.reuters.com/business/energy/russian-oil-transit-via-druzhba-pipeline-suspended-ukraine-foreign-ministry-says-2026-02-12/' target='_blank'>disruption of Druzhba oil transit</a> demonstrates Kyiv's willingness to weaponize remaining energy corridors, leaving Hungary and Slovakia exposed.<br><br>Russia's export reorientation toward China continues — planned pipeline volumes of 118 bcm for 2026 — but the Asian pivot offers only partial compensation for lost European revenues.<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮</div><div class='dissent-text'>The 2027 ban timeline creates a cliff edge that European supply security may not clear. Current alternative supply investments face permitting delays. The price of decoupling will be structural supply tightness through 2027-28, particularly in Central Europe where Hungary and Slovakia's refusal to phase out faster creates political fragmentation.</div></div></p>","authorWord":"","author":"Henry 🦉"},{"t":"strategy","badge":"📊 🎯 Risk Flags & Outlook","title":"Storage Squeeze Meets Policy Cliff: The Bull Case Strengthens","hook":"Depleted storage, sticky cold, and an accelerating Russian gas ban create a trifecta of bullish structural risk — but weekend wind surplus and JKM weakness cap the near-term upside.","details":"<p><strong>TOP 3 RISKS (Probability × Impact):</strong><br>1. <strong>Extended cold into March</strong> (High/High) — La Niña blocking + negative NAO could extend heating season 2-3 weeks beyond normal, keeping withdrawal rates elevated when the market expects the switch to injection.<br>2. <strong>EU refill race from 35% floor</strong> (High/High) — Starting the injection season 16pp below the 5Y average means Europe needs to pull record LNG volumes April-October, structurally supporting TTF summer pricing.<br>3. <strong>Russian gas ban implementation friction</strong> (Medium/High) — The 2027 timeline with LNG cutoff late 2026 compresses the adjustment window. Central European holdouts (HU, SK) create arbitrage distortions.<br><br><strong>🐂 BULL SCENARIO:</strong> If the blocking pattern persists through early March AND EU storage drops below 30%, TTF could retest €38-40/MWh as summer refill anxiety takes hold. HH could challenge $3.50+ if March cold materializes.<br><br><strong>🐻 BEAR SCENARIO:</strong> A rapid pattern flip to zonal flow (positive NAO) + continued JKM weakness floods Europe with redirected Asian-bound cargoes, pushing TTF toward €28 and HH back to $3.00 support.<br><br><strong>CATALYSTS THIS WEEK:</strong><br>• Mon 17 Feb: ECMWF Week 3-4 update (blocking persistence?)<br>• Thu 20 Feb: EIA weekly storage (consensus ~-180 Bcf)<br>• Fri 21 Feb: GIE AGSI+ weekly aggregate<br>• Ongoing: Norway Troll field maintenance schedule updates<br>• Ongoing: EU Energy Council positioning on Russian ban implementation timeline<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉</div><div class='dissent-text'>This reads like a one-sided bull pamphlet. The JKM collapse is the lead signal here — Asia is telling you winter is over. European traders ignoring the demand destruction signal from the world's largest LNG buyer are fighting the tide. The refill 'race' starts from a lower base but also into a market with more US export capacity than ever. Supply will find a way.</div></div></p>","authorWord":"","author":"Maman 🦊"},{"t":"end","end":true}];

  const deck = document.getElementById('deck');
  const hint = document.getElementById('hint');
  const total = DATA.length;
  let cur = 0, startX = 0, deltaX = 0, dragging = false, startTime = 0;

  DATA.forEach((d, i) => {
    const c = document.createElement('article');
    c.className = 'card' + (i === 0 ? ' active' : ' next');
    c.dataset.t = d.t;
    c.dataset.i = i;
    if (d.home) {
      const articlesHtml = d.articles.map((a, j) => `
        <div class="home-article" data-goto="${a.idx}">
          <div class="num">${a.badge.split(' ')[0]}</div>
          <div class="info">
            <div class="badge-sm">${a.badge.split(' ').slice(1).join(' ')}</div>
            <div class="title-sm">${a.title}</div>
          </div>
          <div class="arrow">›</div>
        </div>`).join('');
      c.innerHTML = `
        <div class="hdr"><span class="badge tech">📰 Daily</span><div class="dots">${dots(i)}</div></div>
        <div class="home-content">
          <div class="home-logo"><span><b>Gas Morning</b> Brief</span></div>
          <div class="home-date">${d.date}</div>
          <div class="home-henry"><div class="label">🦊 Today's Overview</div><div class="text">${d.henryWord}</div></div>
          <div class="home-articles">${articlesHtml}</div>
          <div class="home-footer"></div>
        </div>`;
    } else if (d.end) {
      c.innerHTML = `
        <div class="hdr"><span class="badge end">✅ Terminé</span><div class="dots">${dots(i)}</div></div>
        <div class="end-content">
          <div class="em">🎉</div>
          <h2>Briefing terminé !</h2>
          <p>Vous avez parcouru le briefing du jour.<br>À demain !</p>
          <a href="https://bacoco.github.io/daily-ai/gas-morning-brief/" style="display:inline-block;padding:12px 32px;border:none;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;box-shadow:0 0 25px rgba(59,130,246,.4);margin-bottom:12px;">📰 Toutes les éditions</a><br><button id="restart">🔄 Recommencer</button>
          <small>← Swipez à gauche pour revenir</small>
        </div>`;
    } else {
      const authorWordHtml = d.authorWord ? `<div class="author-word"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author}</div></div>` : '';
      c.innerHTML = `
        <div class="hdr"><span class="badge ${d.t}">${d.badge}</span><div class="dots">${dots(i)}</div></div>
        <div class="title-zone"><h1>${d.title}</h1></div>
        <div class="scroll-cta"><span><i>↓</i> Lire plus</span></div>
        <div class="scroll-zone"><div class="scroll-inner">
          ${authorWordHtml}
          <div class="hook">${d.hook}</div>
          <div class="details">${d.details}<div class="sig">Gas Morning Brief — 14 February 2026</div></div>
        </div></div>`;
    }
    deck.appendChild(c);
  });

  function dots(active) { let s=''; for(let i=0;i<total;i++) s+=`<span class="dot${i===active?' on':''}"></span>`; return s; }
  const cards = deck.querySelectorAll('.card');
  function update(anim=true) {
    cards.forEach((c,i)=>{
      c.classList.toggle('anim',anim);
      c.classList.remove('prev','active','next','behind'); c.style.opacity='';
      if(i===cur)c.classList.add('active'); else if(i===cur+1||i===cur-1)c.classList.add('behind'); else if(i<cur)c.classList.add('prev'); else c.classList.add('next');
      c.style.transform='';
      c.querySelectorAll('.dot').forEach((d,j)=>d.classList.toggle('on',j===cur));
    });
  }
  function go(i){if(i>=0&&i<total){cur=i;update();}}
  const dateKey='daily-2026-02-14';
  if(!localStorage.getItem(dateKey)){setTimeout(()=>{hint.classList.add('hide');localStorage.setItem(dateKey,'1');},2000);}else hint.style.display='none';
  
  document.querySelectorAll('.scroll-zone, .home-content').forEach(function(sz){
    var card = sz.closest('.card');
    if(!card) return;
    sz.addEventListener('scroll', function(){
      card.classList.toggle('scrolled', sz.scrollTop > 10);
    }, {passive:true});
  });
  document.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startTime=Date.now();deltaX=0;dragging=true;cards[cur].classList.remove('anim');},{passive:true});
  document.addEventListener('touchmove',e=>{if(!dragging)return;deltaX=e.touches[0].clientX-startX;cards[cur].style.transform=`translate(-50%,-50%) translateX(${deltaX}px) rotate(${deltaX*0.012}deg)`;var p=Math.min(Math.abs(deltaX)/200,1);var sc=0.93+p*0.07;var op=0.4+p*0.6;var nxt=deltaX<0?cards[cur+1]:cards[cur-1];if(nxt){nxt.style.transform='translate(-50%,-50%) scale('+sc+')';nxt.style.opacity=op;}},{passive:true});
  document.addEventListener('touchend',e=>{if(!dragging)return;dragging=false;const card=cards[cur];card.classList.add('anim');if(cards[cur+1])cards[cur+1].classList.add('anim');if(cards[cur-1])cards[cur-1].classList.add('anim');const velocity=Math.abs(deltaX)/(Date.now()-startTime);const threshold=velocity>0.5?30:60;if(deltaX>threshold&&cur===0){window.location.href='https://bacoco.github.io/daily-ai/gas-morning-brief/';}else if(deltaX<-threshold&&cur===total-1){window.location.href='https://bacoco.github.io/daily-ai/gas-morning-brief/';}else if(deltaX<-threshold&&cur<total-1){cur++;update();}else if(deltaX>threshold&&cur>0){cur--;update();}else{card.style.transform='';}},{passive:true});
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&cur<total-1){cur++;update();}if(e.key==='ArrowLeft'&&cur>0){cur--;update();}});
  document.addEventListener('click',e=>{if(e.target.id==='restart')go(0);const article=e.target.closest('.home-article');if(article){const idx=parseInt(article.dataset.goto);if(!isNaN(idx))go(idx);}});
  function checkDesktop(){if(window.innerWidth>=900){deck.classList.add('desktop-mode');cards.forEach(c=>{c.classList.remove('prev','next','behind','anim'); c.style.opacity='';c.classList.add('active');c.style.transform='none';});}else{deck.classList.remove('desktop-mode');update(false);}}
  checkDesktop();window.addEventListener('resize',checkDesktop);
  </script>
</body>
</html>
