<!DOCTYPE html>
<html lang="fr">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gas Morning Brief ⚡ — 14 February 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {

      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }

    html.light .card::before { opacity: .08; }

    html.light .home-henry .text { color: rgba(0,0,0,.85); }

    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }

    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
        /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */

  <script>
  const DATA = [{"t":"home","home":true,"date":"14 February 2026","henryWord":"v2 — All prices timestamped with session dates and deltas. ⚡ FLASH (overnight action, last 24h) then 📊 TREND (structural, dates explicit). Storage squeeze meets Russian ban countdown.","articles":[{"idx":1,"badge":"⚡ 💰 Price Action","title":"HH Grinds to $3.22 on Storage Draws; JKM Slumps as Asia Exits Winter"},{"idx":2,"badge":"⚡ 🚢 LNG & Flows","title":"Russian LNG Still Flowing to EU; Norwegian Pipes Steady"},{"idx":3,"badge":"⚡ ⚡ Power & Carbon","title":"Valentine's Zero: German Power at €0 on Wind Surge"},{"idx":4,"badge":"📊 🌡️ Weather & Demand","title":"La Niña's Long Goodbye: Blocking Extends Cold into March"},{"idx":5,"badge":"📊 📦 Storage Watch","title":"Fern's Frostbite: Record Draws Flip US to Deficit"},{"idx":6,"badge":"📊 💣 Geopolitics & Regulation","title":"EU's 2027 Russian Gas Exit: Druzhba Cut Tests Resolve"},{"idx":7,"badge":"📊 🎯 Risk Flags & Outlook","title":"Storage Squeeze + Blocking + Russian Ban = Bull Trifecta"}]},{"t":"alert","badge":"⚡ 💰 Price Action","title":"HH Grinds to $3.22 on Storage Draws; JKM Slumps as Asia Exits Winter","hook":"March NYMEX settled at $3.217/MMBtu (settle 12 Feb, ▲+$0.058 vs 11 Feb) on a 249 Bcf draw. Asian JKM collapsed to $10.70/MMBtu (close 13 Feb, ▼-$1.20 vs 12 Feb).","details":"<p><b>US — Henry Hub</b><br>March NYMEX settled at <b>$3.217/MMBtu</b> (settle 12 Feb), up $0.058 from Wednesday's $3.159. Session high $3.316 before pullback on the EIA 249 Bcf draw (vs 252 Bcf consensus). Pre-market Globex Friday indicated <b>~$3.15/MMBtu</b> (14 Feb 06:00 UTC, ▼-$0.07 vs settle). Source: <a href='https://www.spragueenergy.com/march-nymex-natural-gas-futures-contract-closed-at-3-217-on-thursday-february-12th/' target='_blank'>Sprague Energy</a><br><br><b>Europe — TTF</b><br>Front-month at <b>€31.67/MWh</b> (close 13 Feb, ~$11/Mcf), retreating from the ~€40/MWh polar vortex peak of late January. Source: <a href='https://www.oilpriceapi.com/live/dutch-ttf-gas-price' target='_blank'>OilPriceAPI</a><br><br><b>Asia — JKM</b><br>Spot fell to <b>$10.70/MMBtu</b> (close 13 Feb, ▼-$1.20 vs 12 Feb) as NE Asian demand normalizes. India shifting back to LPG above $10. Source: <a href='https://www.energyintel.com/0000019c-45db-df6d-abbf-cfdb82160000' target='_blank'>Energy Intelligence</a><br><br><b>Key levels:</b> HH $3.10 support (100-day MA) / $3.32 resistance (12 Feb high). TTF €30/MWh psychological floor.<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎</div><div class='dissent-text'>This orderly retreat is a trap. US storage 5.5% below the 5Y average heading into late-winter restocking — one cold snap and $3.50+ is back. TTF at €31 with EU storage below mandate trajectory is not comfortable — it's a loaded spring.</div></div></p>","authorWord":"","author":"Blaise 🧮"},{"t":"alert","badge":"⚡ 🚢 LNG & Flows","title":"Russian LNG Still Flowing to EU; Norwegian Pipes Steady","hook":"EU terminals keep receiving Russian LNG cargoes despite the looming 2027 ban. Norwegian pipeline nominations unchanged (13 Feb). TTF-HH spread elevated as Europe outbids Asia.","details":"<p><b>Russian LNG</b><br>EU imports of Russian LNG continue via tanker as the bloc's ban doesn't take effect until late 2026. <a href='https://www.faz.net/aktuell/wirtschaft/mehr-wirtschaft/eu-kauft-noch-immer-russisches-lng-accg-200536963.html' target='_blank'>FAZ reports (13 Feb)</a> Moscow still earning billions from European buyers.<br><br><b>Spreads (close 13 Feb)</b><br>TTF-HH: ~$7.85/MMBtu (TTF ~$11 vs HH $3.15) — wide arb keeps US cargoes flowing east. TTF-JKM: ~$0.30 premium (TTF >JKM, ◆ flat vs 12 Feb) — Europe outbidding Asia, unusual for mid-February.<br><br><b>Pipeline Flows (13 Feb 18:00 UTC)</b><br>Norwegian flows (Langeled + Europipe): at seasonal norms, no unplanned outages in 48h. Baltic Pipe: steady. <a href='https://energymusings.substack.com/p/energy-musings-february-13-2026' target='_blank'>Energy Musings (13 Feb)</a> notes Winter Storm Fern highlighted gas dependency. US LNG export loadings near capacity (Freeport, Cove Point steady).<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎</div><div class='dissent-text'>Russian LNG imports have actually <i>declined</i> YoY per <a href='https://www.referendum.sk/dovoz-ruskeho-lng-do-europskej-unie-vlani-mierne-klesol/' target='_blank'>available data</a>. The real story is substitution — US and Qatari volumes displacing Russian barrels faster than headlines suggest. Watch net numbers, not nominal flow.</div></div></p>","authorWord":"","author":"Henry 🦉"},{"t":"tech","badge":"⚡ ⚡ Power & Carbon","title":"Valentine's Zero: German Power at €0 on Wind Surge","hook":"German DA cleared at €0.00/MWh (auction 14 Feb) — weekend demand meets wind surplus. EUA carbon holds €85/t (close 13 Feb, ◆ flat vs 12 Feb).","details":"<p><b>Power Spot (DA auction 14 Feb)</b><br>Germany: <b>€0.00/MWh</b> — textbook collision of low Saturday demand + wind pulse. France: <b>€34.12/MWh</b>, exporting nuclear baseload into German surplus but interconnector limits biting. UK: ~£45/MWh. Source: <a href='https://euenergy.live/' target='_blank'>EU Energy Live</a><br><br><b>Carbon (close 13 Feb)</b><br>EUA Dec '26: <b>~€85/t</b> (◆ flat vs 12 Feb). Stubborn resilience despite power collapse signals traders pricing tighter caps ahead. Clean Dark Spread deep underwater — coal locked out of merit order when wind drops.<br><br><b>Gas-for-power signal:</b> With spark spread > dark spread (13 Feb), gas remains the marginal fuel for baseload. Any mid-week wind lull will snap gas-for-power demand right back up.<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉</div><div class='dissent-text'>Zero prices kill the investment case for batteries and peakers. This isn't market success — it's broken market design. When the wind dies Tuesday, expect a €80+ whipsaw in DA prices.</div></div></p><p><strong>Spot (14 Feb DA):</strong> DE €0.00 | FR €34.12 | UK ~£45<br><strong>Carbon EUA (close 13 Feb):</strong> ~€85/t<br><strong>Spread:</strong> Spark > Dark</p>","authorWord":"","author":"Sage 🦎"},{"t":"analysis","badge":"📊 🌡️ Weather & Demand","title":"La Niña's Long Goodbye: Blocking Extends Cold into March","hook":"ENSO transitioning to neutral (60% probability by April), but negative NAO blocking persists — threatening to extend heating season 2-3 weeks beyond normal.","details":"<p><b>Pattern Regime (as of NOAA CPC 13 Feb update)</b><br>NOAA confirms <b>60% probability of La Niña → ENSO-neutral</b> by April. But the atmospheric response lags: a <a href='https://www.severe-weather.eu/long-range-2/winter-2025-2026-final-forecast-polar-vortex-la-nina-colder-than-expected-united-states-canada-europe-fa/' target='_blank'>High-Latitude Blocking pattern</a> (negative NAO) remains locked over the North Atlantic through late February.<br><br><b>Cumulative HDD (heating season Oct 1 – 13 Feb)</b><br>HDD deviations have flipped positive (colder) vs the 5-year normal since mid-January, erasing the mild early-winter cushion. Central Europe (DE, PL, AT) running ~8% above normal HDDs since Jan 15.<br><br><b>Hydro & Wind (structural)</b><br>Persistent cold delays Alpine snowmelt → run-of-river generation below seasonal norms since early Feb. Reservoir refill pushed back. Wind generation: the blocking regime suppresses sustained westerlies, creating periodic <em>Dunkelflaute</em> windows (next risk: mid-week Feb 17-19 per ECMWF). Solar ramp-up accelerating but insufficient to offset in Feb.<br><br><b>Demand implication:</b> If blocking persists through early March, heating demand extends 2-3 weeks beyond normal → storage withdrawal season elongated → tighter refill starting point.<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮</div><div class='dissent-text'>Solar ramp-up in late Feb is exponential. Even 2°C below normal, increasing daylight crushes net residual load. Gas demand drops from here regardless of the block. Don't fight the calendar.</div></div></p>","authorWord":"","author":"Sage 🦎"},{"t":"tech","badge":"📊 📦 Storage Watch","title":"Fern's Frostbite: Record Draws Flip US to Deficit","hook":"The 360 Bcf record draw (week ending 30 Jan) erased the US surplus. EU at 35.6% (12 Feb) — lowest mid-Feb since 2022, 16.6pp below 5Y average.","details":"<p><b>US Storage (EIA report 13 Feb, data week ending 6 Feb)</b><br>Working gas: <b>2,214 Bcf</b> (▼-249 Bcf vs prior week). Now <b>5.5% below the 5-year average</b> — flipped from 5% surplus pre-Storm Fern. The <a href='https://www.indexbox.io/blog/record-us-natural-gas-storage-draw-predicted-for-january-2026-winter-storm/' target='_blank'>record 360 Bcf draw</a> (week ending 30 Jan) was the largest ever, surpassing 359 Bcf from Jan 2018. End-of-March projection revised to <a href='https://energyedge.com/natural-gas-weekly-storage-report-1-22-2026/' target='_blank'>~1,650 Bcf</a> — tightest since 2023. EIA Feb STEO now forecasts <a href='https://www.bicmagazine.com/industry/commodities/eia-raises-natural-gas-price-forecast/' target='_blank'>HH averaging $4.30/MMBtu for 2026</a>.<br><br><b>EU Storage (AGSI+ data 12 Feb)</b><br>EU aggregate: <b>35.6% full</b> — lowest for mid-Feb since 2022. <b>16.6pp below the 5-year average</b>. 5Y deficit doubled since Oct to 16 bcm. Germany at just 27%. <a href='https://europeangashub.com/european-gas-storage-deficit-deepens-as-winter-withdrawals-accelerate.html' target='_blank'>European Gas Hub analysis</a>.<br><br><b>Trajectory (seasonal context)</b><br>EU bottomed at 33.6% in late March 2025. Current pace suggests a lower bottom this year (~28-30% by end-March). The 90% by Nov 1 mandate will require aggressive procurement Apr-Oct, structurally supporting TTF summer strip. Both basins enter the final 6-8 weeks of withdrawal with trajectories well below norms.<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉</div><div class='dissent-text'>US production about to hit record highs — EIA says so. 1% deficit after the coldest week in years is hardly catastrophic. Two mild weeks = back to surplus. Europe made it through 2022 from worse. LNG cargo economics will flood both basins when spreads widen.</div></div></p>","authorWord":"","author":"Blaise 🧮"},{"t":"alert","badge":"📊 💣 Geopolitics & Regulation","title":"EU's 2027 Russian Gas Exit: Druzhba Cut Tests Resolve","hook":"EU approved full Russian gas phase-out by 2027 (LNG by late 2026, pipeline by June 2027). Ukraine halted Druzhba oil transit (12 Feb), leaving Hungary and Slovakia exposed.","details":"<p><b>Russian Gas Ban Timeline (approved Jan 2026)</b><br>The EU's <a href='https://www.themoscowtimes.com/2026/01/26/eu-gives-final-approval-to-russian-gas-ban-a91781' target='_blank'>final approval (26 Jan 2026)</a> phases out all Russian gas: LNG deliveries ending late 2026, pipeline gas by June 2027. Service bans on Russian LNG tankers target logistics infrastructure, not just volumes.<br><br><b>Druzhba Disruption (12 Feb)</b><br>Ukraine <a href='https://www.reuters.com/business/energy/russian-oil-transit-via-druzhba-pipeline-suspended-ukraine-foreign-ministry-says-2026-02-12/' target='_blank'>halted Druzhba oil transit</a> to Hungary and Slovakia — demonstrating willingness to weaponize remaining energy corridors. Central European supply security increasingly fragile.<br><br><b>Russia's Pivot East (ongoing)</b><br>Planned pipeline volumes to China: 118 bcm for 2026, but the Asian pivot offers only partial revenue compensation. Arctic LNG 2 remains under sanctions pressure, limiting new capacity.<br><br><b>Structural implication:</b> The compressed timeline (12 months to LNG cutoff) means European buyers must lock in alternative long-term contracts NOW. Every month of delay tightens the 2027 supply gap.<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮</div><div class='dissent-text'>The 2027 cliff edge may not clear cleanly. Mediterranean LNG terminals and interconnector capacity face permitting delays. Price of decoupling = structural tightness through 2027-28, especially Central Europe where Hungary/Slovakia refuse to phase out faster.</div></div></p>","authorWord":"","author":"Henry 🦉"},{"t":"strategy","badge":"📊 🎯 Risk Flags & Outlook","title":"Storage Squeeze + Blocking + Russian Ban = Bull Trifecta","hook":"Depleted storage, sticky cold patterns, and an accelerating Russian phase-out create structural bullish risk. JKM weakness and weekend wind surplus cap near-term upside.","details":"<p><b>TOP 3 RISKS (Probability × Impact):</b><br>1. <b>Extended cold into March</b> (High/High) — NAO blocking could extend heating 2-3 weeks beyond normal. Withdrawal season elongation at current deficit = tighter refill start.<br>2. <b>EU refill from 35% floor</b> (High/High) — 16pp below 5Y avg means record LNG needed Apr-Oct. Structurally supports TTF summer strip (currently ~€30-32/MWh).<br>3. <b>Russian ban implementation friction</b> (Medium/High) — 12-month countdown to LNG cutoff. Central European holdouts create arbitrage distortions.<br><br><b>🐂 BULL SCENARIO:</b> Blocking persists through early March + EU storage drops below 30% → TTF retests €38-40/MWh as summer refill panic builds. HH challenges $3.50+ if March cold materializes.<br><br><b>🐻 BEAR SCENARIO:</b> Rapid flip to zonal flow (positive NAO) + JKM stays soft → redirected Asian-bound cargoes flood Europe. TTF tests €28, HH back to $3.00 support.<br><br><b>CATALYSTS THIS WEEK:</b><br>• Mon 17 Feb: ECMWF Week 3-4 update (blocking persistence?)<br>• Thu 20 Feb: EIA weekly storage (consensus ~-180 Bcf)<br>• Fri 21 Feb: GIE AGSI+ weekly aggregate<br>• Ongoing: Norway Troll field maintenance schedule<br>• Ongoing: EU Energy Council on Russian ban implementation<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉</div><div class='dissent-text'>This reads like a bull pamphlet. JKM collapse is the lead signal — Asia is telling you winter is over. The refill 'race' starts lower but into a market with more US export capacity than ever. Supply will find a way.</div></div></p>","authorWord":"","author":"La Rédaction 🦊"},{"t":"end","end":true}];

    DATA.forEach((d,i)=>{
      const item=document.createElement('div');
      item.className='dt-nav-item'+(i===0?' dt-selected':'');
      item.tabIndex=0;
      item.dataset.idx=i;
      const emoji=d.home?'📰':d.end?'✅':(d.badge||'').split(' ')[0]||'📄';
      const label=d.home?'Accueil':d.end?'Fin':(d.badge||'').split(' ').slice(1).join(' ')||'';
      const title=d.home?'Sommaire':d.end?'Briefing terminé':d.title||'';
      item.innerHTML=`<div class="dt-nav-badge">${emoji}</div><div class="dt-nav-info"><div class="dt-nav-label">${label}</div><div class="dt-nav-title">${title}</div></div><div class="dt-nav-arrow">›</div>`;
      item.addEventListener('click',()=>selectDesktop(i));
      sb.appendChild(item);
    });
    // Reader
    const rd=document.createElement('div');
    rd.className='dt-reader';
    rd.innerHTML='<div class="dt-reader-inner"></div>';
    dtShell.appendChild(sb);
    dtShell.appendChild(rd);
    document.body.appendChild(dtShell);
    selectDesktop(0);
  }
  function selectDesktop(idx){
    dtSelected=idx;
    const items=dtShell.querySelectorAll('.dt-nav-item');
    items.forEach((it,i)=>it.classList.toggle('dt-selected',i===idx));
    const d=DATA[idx];
    const inner=dtShell.querySelector('.dt-reader-inner');
    if(d.home){
      const arts=d.articles?d.articles.map(a=>`<div class="dt-nav-item" style="cursor:pointer;opacity:.7;padding:10px 14px;margin-bottom:4px;border-radius:10px;border:1px solid rgba(255,255,255,.06);" onclick="selectDesktop(${a.idx})"><div class="dt-nav-badge">${a.badge.split(' ')[0]}</div><div class="dt-nav-info"><div class="dt-nav-label">${a.badge.split(' ').slice(1).join(' ')}</div><div class="dt-nav-title">${a.title}</div></div><div class="dt-nav-arrow">›</div></div>`).join(''):'';
      inner.innerHTML=`<div class="dt-r-home-henry"><div class="label">🦊 L'Édito du Jour</div><div class="text">${d.henryWord||''}</div></div>${arts}`;
    } else if(d.end){
      inner.innerHTML=`<div style="text-align:center;padding:60px 0;"><div style="font-size:3.5rem;margin-bottom:16px;">🎉</div><h2 style="font-size:1.6rem;font-weight:800;margin-bottom:12px;">Briefing terminé !</h2><p style="color:var(--muted);font-size:1rem;margin-bottom:24px;line-height:1.5;">Vous avez parcouru le briefing du jour. À demain !</p><a href="../index.html" style="display:inline-block;padding:12px 32px;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;">📰 Toutes les éditions</a></div>`;
    } else {
      const authorHtml=d.authorWord?`<div class="dt-r-author"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author||''}</div></div>`:'';
      inner.innerHTML=`<span class="dt-r-badge ${d.t||''}">${d.badge||''}</span><h1 class="dt-r-title">${d.title||''}</h1>${authorHtml}<div class="dt-r-hook">${d.hook||''}</div><div class="dt-r-body">${d.details||''}</div><div class="dt-r-sig">AI Insight Daily — __DATE__</div>`;
    }
    dtShell.querySelector('.dt-reader').scrollTop=0;
    // Scroll sidebar item into view
    items[idx]&&items[idx].scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  function destroyDesktop(){
    if(dtShell){dtShell.remove();dtShell=null;}
  }
  function checkDesktop(){
    if(window.innerWidth>=900){
      deck.style.display='none';
      buildDesktop();
      dtShell.style.display='';
    } else {
      if(dtShell)dtShell.style.display='none';
      deck.style.display='';
      update(false);
    }
  }
  // Keyboard nav for desktop
  document.addEventListener('keydown',e=>{
    if(window.innerWidth<900)return;
    if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();if(dtSelected<DATA.length-1)selectDesktop(dtSelected+1);}
    if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();if(dtSelected>0)selectDesktop(dtSelected-1);}
  });
  checkDesktop();window.addEventListener('resize',checkDesktop);
  // Theme toggle
  (function(){
    const btn=document.getElementById('themeToggle');
    const saved=localStorage.getItem('theme');
    if(saved==='light'){document.documentElement.classList.add('light');btn.textContent='☀️';}
    btn.addEventListener('click',()=>{
      const isLight=document.documentElement.classList.toggle('light');
      btn.textContent=isLight?'☀️':'🌙';
      localStorage.setItem('theme',isLight?'light':'dark');
    });
  })();
  </script>
</body>
</html>
