<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gas Morning Brief — 8 Mai 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    /* Scenario Probability Card */
    .scenario-block { margin: 1em 0; padding: 0.8em 1em; border-left: 4px solid #ffd700; border-radius: 0 8px 8px 0; background: rgba(255,215,0,0.05); }
    .scenario-block h3 { margin: 0 0 0.3em 0; font-size: 1.05em; display: flex; justify-content: space-between; align-items: center; }
    .scenario-block .proba { font-size: 1.3em; font-weight: bold; color: #ffd700; }
    .scenario-block p { margin: 0.2em 0; font-size: 0.92em; }
    .scenario-block .votes { font-size: 0.8em; opacity: 0.7; font-style: italic; }
    .consensus { margin-top: 1.2em; padding: 0.6em; border-radius: 8px; background: rgba(0,200,100,0.08); }
    .dissent { margin-top: 0.4em; padding: 0.6em; border-radius: 8px; background: rgba(255,80,80,0.08); }

    html.light .details div[style*="background"], html.light .details p[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Light mode: override inline white colors in trade cards */
    html.light .details p[style], html.light .details b[style], html.light .details span[style], html.light .details div[style] { color: rgba(0,0,0,.85) !important; }
    html.light .details div[style*="border-left:3px solid #f59e0b"] { background: rgba(245,158,11,.08) !important; }
    html.light .details div[style*="border-left:3px solid #10b981"] { background: rgba(16,185,129,.08) !important; }
    html.light .details div[style*="border-left:3px solid #ff4757"] { background: rgba(255,71,87,.06) !important; }
    html.light .details div[style*="color:#f59e0b"] { color: #b45309 !important; }
    html.light .details div[style*="color:#10b981"] { color: #047857 !important; }
    html.light .details div[style*="color:#ff4757"] { color: #dc2626 !important; }
    html.light .details h3 { color: #1a1a2e !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details p[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }
      .dt-reader .dt-r-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; }
      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }
      .dt-reader .dt-r-body p { margin-bottom: 18px; }
      .dt-reader .dt-r-body strong { color: #fff; font-weight: 600; }

  <script>
  const DATA = [{"t":"home","home":true,"date":"8 Mai 2026","henryWord":"Le marché du gaz reste en régime binaire: un socle fondamental plus calme, mais une prime géopolitique toujours active. Le conseil valide majoritairement les structures convexes et les spreads définis en risque, avec discipline sur les ventes d’upside nue. En clair: rester tactique sur le spot, mais protégé sur les queues.","articles":[{"badge":"⚡ 💰 Price Action","title":"TTF steadies while HH range-trades ahead of US storage print","idx":1},{"badge":"⚡ 🚢 LNG & Flows","title":"Atlantic flexibility remains tight as LNG routing risk caps downside","idx":2},{"badge":"⚡ ⚡ Power & Carbon","title":"Carbon and power spreads keep gas-for-power risk two-sided","idx":3},{"badge":"📊 🌡️ Weather & Demand","title":"Shoulder-season weather keeps demand soft but not risk-free","idx":4},{"badge":"📊 📦 Storage Watch","title":"Refill path is improving, but buffer versus stress scenarios stays thin","idx":5},{"badge":"📊 💣 Geopolitics & Regulation","title":"Geopolitical premium persists as shipping and sanctions paths stay binary","idx":6},{"badge":"📊 🎯 Risk Flags & Outlook","title":"Asymmetric market: balanced baseline, fat-tailed outcomes","idx":7},{"badge":"🎲 Scénarios","title":"7 Scénarios Marché — Votes du Conseil","idx":8},{"badge":"📊 🌍 Scénario Géopolitique","title":"Géopolitique gaz: 7 scénarios du Conseil","idx":9},{"badge":"🏛️ Verdict du Conseil","title":"18 Trades Audités — 13 Retenus, 5 Éliminés","idx":10}],"disclaimer":"⚠️ AVERTISSEMENT — Ce document est un exercice expérimental de veille automatisée produit par intelligence artificielle. Il ne constitue EN AUCUN CAS un conseil en investissement, une recommandation de trading, ni une analyse financière réglementée au sens de la directive MiFID II ou du Code monétaire et financier (art. L541-1). Les « scénarios de marché » présentés sont des hypothèses pédagogiques générées par des modèles de langage — ils ne reflètent pas l'avis d'un professionnel agréé. Les données proviennent de sources publiques, potentiellement retardées ou erronées. Toute décision d'investissement prise sur la base de ce document relève de la seule responsabilité du lecteur. L'auteur n'est pas enregistré comme Conseiller en Investissement Financier (CIF) auprès de l'AMF. Ce contenu est fourni à titre informatif et expérimental uniquement."},{"t":"alert","badge":"⚡ 💰 Price Action","title":"TTF steadies while HH range-trades ahead of US storage print","hook":"European gas held bid into the close while US gas stayed range-bound. Volatility is concentrated in front-month optionality, not outright trend.","authorWord":"Momentum is fragile: keep size light and trade levels, not headlines.","author":"Blaise 🧮","details":"<p>TTF front-month stayed resilient versus prior session risk premium unwind, while Henry Hub remained range-bound into storage/event risk. Cross-basin spread remains headline-sensitive and can gap on geopolitical tape.<\/p><p>Key levels to monitor are near-term TTF resistance around recent swing highs and HH support around recent weekly lows; a break likely needs fresh flow or weather catalyst.<\/p><p>Sources: <a href='https://www.ice.com/products/27996665/Dutch-TTF-Gas-Futures' target=_blank>ICE TTF futures<\/a>, <a href='https://www.cmegroup.com/markets/energy/natural-gas/natural-gas.html' target=_blank>CME Henry Hub futures<\/a>, <a href='https://www.spglobal.com/commodityinsights/en/market-insights/latest-news/natural-gas' target=_blank>S&P Global gas coverage<\/a>.<\/p><h3>💡 Trade Ideas<\/h3><ul><li>If TTF fails at resistance, consider selling Jun/Jul strength versus buying Q4 exposure (calendar flattening).<\/li><li>If HH holds support, consider Sep call spread financed by nearer-dated upside sale.<\/li><li>If cross-basin spread widens on Asia bid, consider relative-value long TTF vs short JKM proxy.<\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>Price action can re-price sharply higher if LNG flow risk re-escalates; fading strength too early is dangerous.<\/div><\/div>","sig":"Blaise 🧮"},{"t":"alert","badge":"⚡ 🚢 LNG & Flows","title":"Atlantic flexibility remains tight as LNG routing risk caps downside","hook":"European balancing still depends on stable LNG arrivals and uninterrupted pipeline nominations. Any shipping or terminal disruption can reprice prompt gas quickly.","authorWord":"Flow stability, not demand heroics, is carrying the prompt balance.","author":"Henry 🦉","details":"<p>Recent balance signals point to a still-fragile LNG-driven equilibrium: Europe can refill, but only if cargo cadence and sendout remain smooth. US liquefaction utilization remains high, leaving little buffer for unplanned outages.<\/p><p>Pipeline nominations from Norway and North Africa remain a key swing factor for intraday TTF volatility. Cross-basin arbitrage remains live and sensitive to freight and insurance costs.<\/p><p>Sources: <a href='https://www.entsog.eu/' target=_blank>ENTSOG<\/a>, <a href='https://agsi.gie.eu/' target=_blank>GIE/AGSI+<\/a>, <a href='https://www.eia.gov/naturalgas/weekly/' target=_blank>EIA Natural Gas Weekly<\/a>.<\/p><h3>💡 Trade Ideas<\/h3><ul><li>If nominations soften, consider long TTF prompt vs short deferred (front tightening).<\/li><li>If US exports normalize after any outage scare, consider selling near-dated upside calls.<\/li><li>If Asia pull strengthens, consider JKM-TTF spread wideners via options.<\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>Weather softness can absorb moderate flow shocks; prompt fear premium may decay faster than expected.<\/div><\/div>","sig":"Henry 🦉"},{"t":"tech","badge":"⚡ ⚡ Power & Carbon","title":"Carbon and power spreads keep gas-for-power risk two-sided","hook":"EUA direction and wind realization are steering short-term gas burn more than macro headlines. Spark economics remain tradable but unstable.","authorWord":"Power-gas linkage is active; watch carbon and renewables in tandem.","author":"Sage 🦎","details":"<p>Gas-for-power sensitivity remains elevated as carbon pricing and day-ahead power prints swing dark/spark competitiveness. Interconnector and nuclear availability remain important intraday regime shifters.<\/p><p>Near-term setup favors tactical spread trading over outright conviction, especially where renewable output deviates from forecast.<\/p><p>Sources: <a href='https://www.eex.com/en/market-data/power' target=_blank>EEX power data<\/a>, <a href='https://www.ice.com/products/197/EUA-Futures' target=_blank>ICE EUA futures<\/a>, <a href='https://www.entsoe.eu/data/' target=_blank>ENTSO-E data portal<\/a>.<\/p><h3>💡 Trade Ideas<\/h3><ul><li>If EUA rebounds with weak wind, consider long clean spark vs short dark spread proxy.<\/li><li>If wind over-delivers, consider short front TTF with tight stop against outage risk.<\/li><li>Use short-dated strangles around key auction windows where realized vol outpaces implied.<\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>Carbon is no longer the dominant driver in stressed sessions; flow shocks can overwhelm spread logic.<\/div><\/div>","sig":"Sage 🦎"},{"t":"analysis","badge":"📊 🌡️ Weather & Demand","title":"Shoulder-season weather keeps demand soft but not risk-free","hook":"Baseline demand remains moderate, yet pattern shifts can still alter injection pace quickly. Structural tone is calmer than winter, not complacent.","authorWord":"Soft demand helps, but refill math still punishes supply surprises.","author":"Sage 🦎","details":"<p>Week-2/4 outlook leans temperate across major European demand centers, reducing immediate heating call on gas. That supports refill trajectory, but regime flips remain possible during transition months.<\/p><p>Hydro and wind conditions continue to modulate gas burn in power, especially when forecast error rises. Structural takeaway: demand relief exists, but flexibility is thin in disruption scenarios.<\/p><p>Sources: <a href='https://www.ecmwf.int/en/forecasts/charts' target=_blank>ECMWF forecast charts<\/a>, <a href='https://www.cpc.ncep.noaa.gov/' target=_blank>NOAA CPC<\/a>, <a href='https://energy-charts.info/' target=_blank>European generation mix<\/a>.<\/p><h3>💡 Trade Ideas<\/h3><ul><li>If mild pattern persists, consider selling front volatility while keeping upside tail hedge.<\/li><li>If forecast turns hotter/colder abruptly, consider buying prompt gamma via weekly options.<\/li><li>Relative-value: long deferred winter risk vs short shoulder contracts if refill pace improves.<\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>Forecast confidence is overstated; one pattern break can erase current demand comfort rapidly.<\/div><\/div>","sig":"Sage 🦎"},{"t":"tech","badge":"📊 📦 Storage Watch","title":"Refill path is improving, but buffer versus stress scenarios stays thin","hook":"Storage trajectory is constructive for now, yet still vulnerable to LNG or pipeline disruptions. Pace matters more than level in the next few weeks.","authorWord":"Inventory is a cushion, not a shield.","author":"Blaise 🧮","details":"<p>EU and US inventory signals suggest seasonal normalization is underway, but the market still prices optionality for supply-side shocks. Refill progress needs continuity in flows and moderate weather.<\/p><p>The key tactical question is not absolute stock today, but whether injections can stay above seasonal pace under volatility in imports and power burn.<\/p><p>Sources: <a href='https://agsi.gie.eu/' target=_blank>GIE AGSI+<\/a>, <a href='https://www.eia.gov/naturalgas/storage/' target=_blank>EIA storage<\/a>, <a href='https://www.iea.org/reports/gas-market-report-q2-2026' target=_blank>IEA gas market report<\/a>.<\/p><h3>💡 Trade Ideas<\/h3><ul><li>If injection pace beats trend, consider bear-steepener via short prompt/long winter.<\/li><li>If refill slips on flow issues, consider long front-month calls as convex hedge.<\/li><li>For balanced books, keep collars around core exposure through next storage prints.<\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>Headline storage comfort can mask regional bottlenecks; localized stress can still drag benchmark higher.<\/div><\/div>","sig":"Blaise 🧮"},{"t":"alert","badge":"📊 💣 Geopolitics & Regulation","title":"Geopolitical premium persists as shipping and sanctions paths stay binary","hook":"Gas pricing still embeds a live geopolitical option value. Regulatory and routing outcomes remain the biggest medium-term uncertainty.","authorWord":"Binary geopolitics argues for convex hedging over linear conviction.","author":"Henry 🦉","details":"<p>Supply security narrative remains centered on maritime risk and sanction implementation details. Even without immediate disruption, elevated uncertainty keeps risk premium sticky in prompt and shoulder tenors.<\/p><p>Policy timeline risk (sanctions scope, exemptions, enforcement) can move spreads as much as physical flows. Traders should treat geopolitics as a probability distribution, not a single base case.<\/p><p>Sources: <a href='https://www.reuters.com/world/middle-east/' target=_blank>Reuters Middle East<\/a>, <a href='https://www.consilium.europa.eu/en/policies/sanctions/' target=_blank>EU sanctions policy<\/a>, <a href='https://www.iea.org/topics/natural-gas' target=_blank>IEA gas analysis<\/a>.<\/p><h3>💡 Trade Ideas<\/h3><ul><li>Buy upside convexity in TTF summer strips as insurance against transit shocks.<\/li><li>Pair with funded downside put spread if diplomatic de-escalation accelerates.<\/li><li>Relative-value: long freight-sensitive LNG spread exposure vs domestic-gas-heavy contracts.<\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>Risk premium may be overpaying for low-frequency tails while fundamentals quietly rebalance.<\/div><\/div>","sig":"Henry 🦉"},{"t":"strategy","badge":"📊 🎯 Risk Flags & Outlook","title":"Asymmetric market: balanced baseline, fat-tailed outcomes","hook":"Base case points to contained range, but payoff asymmetry still favors owning selective upside protection. The desk should trade around a neutral core with event-driven overlays.","authorWord":"Stay tactical in spot, stay convex in risk.","author":"La Rédaction 🦊","details":"<p><strong>Top risks:<\/strong> (1) LNG routing shock, (2) pipeline nomination downside surprise, (3) weather/renewables forecast error lifting gas-for-power demand.<\/p><p><strong>Bull scenario (1-2w):<\/strong> flow disruption + weak wind squeezes prompt; <strong>trade:<\/strong> long near-dated TTF call spread plus long prompt/deferred calendar. <strong>Bear scenario:<\/strong> smooth arrivals + mild weather; <strong>trade:<\/strong> short prompt with protective upside call. <strong>Wild card:<\/strong> abrupt geopolitical de-escalation or escalation; <strong>trade:<\/strong> own strangle where implied lags event risk.<\/p><p><strong>Catalysts:<\/strong> storage print, LNG export utilization updates, key policy headlines, and weekly weather revisions. Positioning context suggests range behavior until one catalyst breaks the balance.<\/p><h3>💡 Trade Ideas<\/h3><ul><li>Core: neutral delta with long convexity around key catalyst windows.<\/li><li>Directional bull hedge: TTF Jun/Jul call spread, partially financed by higher-strike sale.<\/li><li>Relative-value: long winter risk vs short shoulder if refill narrative stays constructive.<\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>Market may be underpricing prolonged disruption scenarios; neutral stance risks missing fast upside repricing.<\/div><\/div>","sig":"La Rédaction 🦊"},{"t":"analysis","badge":"🎲 Scénarios","title":"7 Scénarios Marché — Votes du Conseil","hook":"Le Conseil garde un biais de volatilité élevée avec base case de range instable.","authorWord":"Les structures convexes dominent les idées retenues.","author":"Le Conseil 🎲","details":"<div class='scenario-block'><h3>S1 — Range volatil avec prime géopo <span class='proba'>22%<\/span><\/h3><p>Prix oscillent dans un couloir large, catalysts événementiels dominants.<\/p><p class='votes'>Apex 21% · Sage 22% · Nova 23% · Blaise 22% · Lyra 22% · Dante 24% · Felix 20%<\/p><\/div><div class='scenario-block'><h3>S2 — Squeeze prompt temporaire <span class='proba'>18%<\/span><\/h3><p>Stress court terme sur flux/nominations, puis normalisation partielle.<\/p><p class='votes'>Apex 18% · Sage 17% · Nova 19% · Blaise 18% · Lyra 18% · Dante 20% · Felix 16%<\/p><\/div><div class='scenario-block'><h3>S3 — Refill progressif sans choc <span class='proba'>16%<\/span><\/h3><p>Demande modérée et injections régulières limitent la hausse.<\/p><p class='votes'>Apex 15% · Sage 17% · Nova 16% · Blaise 16% · Lyra 16% · Dante 14% · Felix 18%<\/p><\/div><div class='scenario-block'><h3>S4 — Compression baissière sur détente géopo <span class='proba'>14%<\/span><\/h3><p>Décrue de prime de risque, front mois sous pression.<\/p><p class='votes'>Apex 14% · Sage 14% · Nova 13% · Blaise 15% · Lyra 14% · Dante 11% · Felix 17%<\/p><\/div><div class='scenario-block'><h3>S5 — Choc power/carbon pro-cyclique <span class='proba'>11%<\/span><\/h3><p>Mix power et EUA accroissent la demande gaz de court terme.<\/p><p class='votes'>Apex 11% · Sage 12% · Nova 11% · Blaise 10% · Lyra 11% · Dante 12% · Felix 10%<\/p><\/div><div class='scenario-block'><h3>S6 — Extrême bull (rupture offre) <span class='proba'>10%<\/span><\/h3><p>Spike rapide et élargissement de la backwardation.<\/p><p class='votes'>Apex 10% · Sage 9% · Nova 10% · Blaise 10% · Lyra 10% · Dante 13% · Felix 8%<\/p><\/div><div class='scenario-block'><h3>S7 — Extrême bear (sur-offre + météo c
