<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gas Morning Brief — 4 Mars 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    html.light .details div[style*="background"], html.light .details p[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Light mode: override inline white colors in trade cards */
    html.light .details p[style], html.light .details b[style], html.light .details span[style], html.light .details div[style] { color: rgba(0,0,0,.85) !important; }
    html.light .details div[style*="border-left:3px solid #f59e0b"] { background: rgba(245,158,11,.08) !important; }
    html.light .details div[style*="border-left:3px solid #10b981"] { background: rgba(16,185,129,.08) !important; }
    html.light .details div[style*="border-left:3px solid #ff4757"] { background: rgba(255,71,87,.06) !important; }
    html.light .details div[style*="color:#f59e0b"] { color: #b45309 !important; }
    html.light .details div[style*="color:#10b981"] { color: #047857 !important; }
    html.light .details div[style*="color:#ff4757"] { color: #dc2626 !important; }
    html.light .details h3 { color: #1a1a2e !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details p[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }
      .dt-reader .dt-r-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; }
      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }
      .dt-reader .dt-r-body p { margin-bottom: 18px; }
      .dt-reader .dt-r-body strong { color: #fff; font-weight: 600; }
      .dt-reader .dt-r-body a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
      .dt-reader .dt-r-body .quote { border-left: 3px solid var(--blue); padding: 14px 18px; margin: 20px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-style: italic; font-size: .95rem; line-height: 1.6; color: rgba(255,255,255,.9); }
      .dt-reader .dt-r-body .dissent { margin-top: 24px; padding: 16px 18px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }

  <script>
  const DATA = [{"t":"home","home":true,"date":"4 Mars 2026","henryWord":"Day 3 of Hormuz with no diplomatic off-ramp: TTF pulled back to €53 from Monday's €65 panic spike, but the 30% storage floor just broke. The council validated 16 trade ideas out of 21 — the JKM-TTF parity spread and cheap Apr €65 calls stand out as the highest-conviction asymmetric plays. The refill math at €53+ TTF is brutal; this summer will test every assumption.","articles":[{"badge":"⚡ 💰 Price Action","title":"Day 2: Profit-Taking Pulls TTF Off €65 High — But €50 Holds","idx":1},{"badge":"⚡ 🚢 LNG & Flows","title":"Hormuz Day 3: Molecules Reroute, Insurance Wall Hardens","idx":2},{"badge":"⚡ ⚡ Power & Carbon","title":"Coal Cements Merit-Order Lead as TTF Retreats to €53 — Spark Spread Blown Out","idx":3},{"badge":"📊 🌡️ Weather & Demand","title":"Stratospheric Reset Meets Hormuz Shock: The Demand Destruction Question at €53 TTF","idx":4},{"badge":"📊 📦 Storage Watch","title":"Sub-30% — EU Storage Enters Uncharted Territory","idx":5},{"badge":"📊 💣 Geopolitics & Regulation","title":"The Diplomatic Vacuum: No Ceasefire Track, EU Gas Summit, and the April LNG Ban Wobble","idx":6},{"badge":"📊 🎯 Risk Flags & Outlook","title":"Three Vectors: Hormuz Duration × Refill Arithmetic × Political Capitulation","idx":7},{"badge":"🏛️ Verdict du Conseil","title":"21 Trades Audités — 16 Retenus, 5 Éliminés","idx":8}]},{"t":"alert","badge":"⚡ 💰 Price Action","title":"Day 2: Profit-Taking Pulls TTF Off €65 High — But €50 Holds","hook":"TTF sheds €12 from Monday's panic spike as overnight profit-taking kicks in, but front-month holds above €50 — still 60% above pre-crisis levels. The question now: dead-cat consolidation or genuine floor?","authorWord":"TTF retraced hard from €65 to €53 overnight. Profit-taking is real but €50 support held on the first test. HH barely flinched — the Atlantic arb just blew out to record levels. Watch the €48 gap fill.","author":"Blaise 🧮","details":"<p><b>Spot & Settlement Snapshot:<\/b> TTF front-month (Apr-26) touched €65.00/MWh intraday on 03 Mar before settling around <b>€59.02/MWh<\/b> (settle 03 Mar, ▲+€26.50 vs 28 Feb close, <a href='https://www.ice.com/products/27996665/Dutch-TTF-Natural-Gas-Futures/data' target='_blank'>ICE Endex<\/a>). Overnight the contract has pulled back sharply to <b>~€52.88/MWh<\/b> (indicative 04 Mar 05:30 UTC, ▼−€6.14 vs settle, <a href='https://www.tradingview.com/symbols/TVC-TTFG1!/' target='_blank'>TradingView<\/a>). Henry Hub front-month settled at <b>$3.11/MMBtu<\/b> (settle 03 Mar, ▲+$0.14 vs prev, <a href='https://www.cmegroup.com/markets/energy/natural-gas/natural-gas.html' target='_blank'>CME/NYMEX<\/a>) — a modest 5% move reflecting US insulation from Hormuz. JKM hit a 1-year high near <b>$49.83/MWh (~€43/MWh)<\/b> (trade 03 Mar, <a href='https://www.spglobal.com/commodityinsights/en/market-insights/latest-news/lng' target='_blank'>S&P Global Platts<\/a>). NBP tracked TTF sharply higher per <a href='https://www.fxstreet.com/news' target='_blank'>FXStreet<\/a>.<\/p><p><b>Technical Levels & Positioning:<\/b> The €12 intraday retracement from the €65 spike high is textbook panic-premium unwind. Key levels for TTF Apr-26: <b>support at €48–50<\/b> (gap-fill zone from the weekend gap, also where Goldman's new Q2 forecast sits at €45–55); <b>resistance at €59–60<\/b> (Monday's settlement cluster) and €65 (spike high). A break below €48 would suggest the geopolitical premium is being fully unwound; a hold above €50 signals the market is pricing a durable supply disruption. For HH, resistance sits at $3.25 (Jan highs); the muted US reaction has blown the <b>TTF-HH spread to ~€49/MWh — a record<\/b> that should attract US LNG export arb flows. Volume on Mon 03 Mar was reportedly extreme with open interest likely surging on new longs, but the overnight pullback suggests fast money is already taking profits.<\/p><p><b>💡 Trade Ideas:<\/b><br/>1️⃣ <b>TTF Apr/May calendar spread — sell the backwardation:<\/b> If the Hormuz disruption is weeks-not-months, Apr-26 carries maximum panic premium vs May. Sell Apr/Buy May at ~€4–5 backwardation (ICE TTF futures), targeting €1–2 as prompt premium normalises.<br/>2️⃣ <b>Long TTF Apr €55/€45 put spread:<\/b> Hedge the profit-taking tail — costs ~€2.50–3.00 with €10 of downside protection if Hormuz reopens faster than expected.<br/>3️⃣ <b>Long HH vs short TTF relative value:<\/b> The TTF-HH arb at ~€49/MWh is unsustainably wide if US LNG flows ramp. Consider ratio: long 1 HH Apr / short 0.3 TTF Apr, targeting arb compression to €30–35/MWh.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>The €50 'floor' is an illusion. Monday's spike was pure panic premium on headline risk — the physical market hasn't repriced yet. If Hormuz partially reopens within 48h (non-trivial probability), we gap-fill to €40 before anyone can cover. The 2019 Abqaiq precedent recovered 80% within two weeks. Don't catch this falling knife above €45.<\/div><\/div>","sig":"Blaise 🧮 — Quant & Market Structure"},{"t":"alert","badge":"⚡ 🚢 LNG & Flows","title":"Hormuz Day 3: Molecules Reroute, Insurance Wall Hardens","hook":"Cape of Good Hope reroutes add 10-15 days to Qatari LNG; Trump orders DFC political risk insurance for Gulf tankers as private reinsurers pull all war-risk cover.","authorWord":"Reinsurance wall now dictates physical flows. If Qatar restart stays blocked past Mar 14, EU long-term LNG contracts trigger force-majeure cascades.","author":"Henry 🦉","details":"<p><b>🔒 Hormuz Logistics — Day 3 (Mar 4):<\/b> The strait remains effectively shut. Tanker traffic is near zero after dropping ~70% initially (<a href='https://en.wikipedia.org/wiki/2026_Strait_of_Hormuz_crisis' target='_blank'>Wikipedia, Mar 3<\/a>). Over 150 vessels are anchored outside the chokepoint. The critical development overnight: <b>Trump ordered the US DFC to provide political risk insurance<\/b> for all Gulf maritime trade and signaled Navy escorts through Hormuz 'as soon as possible' (<a href='https://www.politico.com/news/2026/03/03/iran-oil-energy-military-trump-hormuz-00808825' target='_blank'>Politico, Mar 3<\/a>). This is a direct response to <b>leading reinsurers cancelling all war-risk cover<\/b> in the Gulf (<a href='https://www.theguardian.com/business/2026/mar/02/maritime-insurers-war-risk-cover-gulf-iran-shipping-strait-of-hormuz' target='_blank'>Guardian, Mar 2<\/a>). War-risk premiums have spiked 5x — a $100m tanker now faces ~$1m per voyage vs ~$200k pre-crisis (<a href='https://www.aljazeera.com/economy/2026/3/3/maritime-insurers-cancel-war-risk-cover-in-gulf-will-it-spike-energy-cost' target='_blank'>Al Jazeera, Mar 3<\/a>). Rerouting via the Cape of Good Hope adds 10–15 days and 30–40% more fuel burn per voyage.<\/p><p><b>📊 Spreads & Arb:<\/b> TTF-HH spread blown out to ~€35–49/MWh — the widest trans-Atlantic arb since the 2022 energy crisis. Every uncommitted US cargo is now pointed at Europe. TTF-JKM convergence means Europe and Asia are bidding against each other for the same non-Qatari molecules. Goldman raised TTF Q2 forecast to <b>€45/MWh<\/b> (from €36) and April to <b>€55/MWh<\/b> (<a href='https://www.investing.com/news/commodities-news/goldman-raises-firsthalf-european-natural-gas-price-forecast-amid-iran-strikes-4537024' target='_blank'>Investing.com, Mar 3<\/a>).<\/p><p><b>🇺🇸 US LNG — Filling the Gap?<\/b> US LNG capacity exceeds <b>15 Bcf/d<\/b> across 8 terminals (<a href='https://jpt.spe.org/a-decade-after-first-sabine-pass-cargo-us-lng-exports-hit-15-bcf-d' target='_blank'>JPT/EIA, Feb 25<\/a>). Plaquemines LNG and Corpus Christi Stage 3 ramping. Golden Pass LNG expected first cargo early 2026. At current spreads, every US terminal with spot capacity should be running flat-out. But US can only partially offset the ~80 mtpa Qatari hole — EU LNG arrivals likely to drop 25–35% this week, with South Hook (Wales) and Adriatic LNG (Italy) hit hardest as historically Qatar-heavy terminals.<\/p><p><b>🔧 Pipeline Response:<\/b> Norwegian flows via Langeled and Europipe should see upward nomination pressure as TTF rallies. North African flows (Medgaz, Transmed) steady but limited spare capacity. China demanded Tehran keep Hormuz physically open (<a href='https://www.theguardian.com/business/2026/mar/03/china-calls-protection-vessels-strait-hormuz-amid-soaring-shipping-costs' target='_blank'>Guardian, Mar 3<\/a>).<\/p><p><b>💡 Trade Ideas:<\/b><br/>1️⃣ <b>Long JKM-TTF spread (Apr-26):<\/b> Asia will be outbid for molecules as EU panic-buys. If JKM premium erodes vs TTF, buy JKM/sell TTF at current ~parity, targeting $3–5/MWh JKM premium as Asian buyers scramble.<br/>3️⃣ <b>Buy TTF Summer-26 calls (€50 strike):<\/b> If Hormuz stays shut >2 weeks, summer refill is impossible without €50+ TTF. Buy ICE TTF Q3-26 €50 calls at ~€3–4 premium — asymmetric 5:1 payoff.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>The 'insurance wall' narrative overstates the bottleneck. DFC political risk cover + Navy escorts could normalise Hormuz transit within 7–10 days. The US has done this before (1987–88 Operation Earnest Will). Once convoys start, war-risk premiums collapse 70% within a week. Don't overpay for disruption duration — the marginal LNG cargo rerouted via Cape adds $2–3/MMBtu, not the €25+ premium currently in TTF.<\/div><\/div>","sig":"Henry 🦉 — Fundamentals & Geopolitics"},{"t":"tech","badge":"⚡ ⚡ Power & Carbon","title":"Coal Cements Merit-Order Lead as TTF Retreats to €53 — Spark Spread Blown Out","hook":"At €53 TTF, clean spark spreads are deeply negative while coal-to-power runs €30+/MWh cheaper. EUA under political siege as Italy pushes for ETS suspension — carbon approaching €68 with 23% wiped since mid-January.","authorWord":"Coal firmly sets the marginal price. Gas generators idled. EUA political risk is the wildcard nobody is hedging.","author":"Sage 🦎","details":"<p><b>Fuel Switching: Coal Dominant at €53 TTF.<\/b> With TTF settling around <a href='https://www.euronews.com/business/2026/03/03/gas-prices-nearly-double-as-europe-braces-for-iran-war-energy-shocks' target='_blank'>€53/MWh (TTF front-month, 3 Mar close)<\/a> after Monday's €65 intraday spike, the clean spark spread (49% CCGT efficiency) sits at roughly €133/MWh all-in vs clean dark spreads (38% hard coal, API2 ~$116/t) at ~€99/MWh. That's a <b>€34/MWh coal advantage<\/b> — widening as gas retreated but coal held. Every gas CCGT not on a must-run contract is sitting idle. Goldman raised TTF April forecast to <a href='https://www.investing.com/news/commodities-news/goldman-raises-firsthalf-european-natural-gas-price-forecast-amid-iran-strikes-4537024' target='_blank'>€55/MWh (Goldman, 3 Mar)<\/a>, implying coal stays in the money for weeks.<\/p><p><b>EUA Carbon: Political Headwinds Intensify.<\/b> EUAs have shed ~23% since mid-January per <a href='https://montelnews.com/news' target='_blank'>Montel (27 Feb)<\/a>, with Dec-26 benchmark around <b>€68<\/b> (ICE settlement, 3 Mar). Italy's Industry Minister Urso formally called for <a href='https://www.politico.eu/article/italy-calls-for-ets-suspension-pending-overhaul/' target='_blank'>ETS suspension (Politico, 26 Feb)<\/a>. ICIS notes allowance supply falls 15% in 2026 — a structural floor, but political overhang is real. The Hormuz crisis paradoxically pressures EUA lower: coal dispatch rises → more emissions → but demand destruction offsets compliance buying.<\/p><p><b>Power Spot Prices.<\/b> UK day-ahead spot cleared at <b>£67.01/MWh<\/b> (Smart Energy, 3 Mar), down 9.4% d/d as mild temps offset gas spikes. UK Sum-26 power at £70.29/MWh. German baseload estimated €95–105/MWh for 4 Mar delivery on <a href='https://transparency.entsoe.eu/' target='_blank'>ENTSO-E<\/a>, coal-heavy merit order capping upside. French nuclear availability under scrutiny — check <a href='https://www.rte-france.com/eco2mix' target='_blank'>RTE eCO2mix<\/a>. Wind generation running below seasonal norms across NW Europe.<\/p><p><b>💡 Trade Ideas:<\/b><br/>1️⃣ <b>Sell DE Cal-27 clean spark spread:<\/b> If TTF stays >€45, gas stays out of merit order. Sell power leg vs buy TTF.<br/>2️⃣ <b>Buy EUA Dec-26 dips below €65:<\/b> 15% supply cut is a hard floor; Italy's suspension call lacks qualified majority. Target €75 by Q3.<br/>3️⃣ <b>Buy UK Q2-26 vs sell DE Q2-26 baseload:<\/b> UK's tighter interconnector capacity and gas-dependent mix reprices faster if Hormuz escalates. UK at £70/MWh looks cheap vs continent.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The coal-over-gas calculus assumes stable API2 coal prices, but coal supply chains are also stressed — Indonesian export quotas tightened in February, South African rail logistics remain challenged. If coal tightens alongside gas, the 'cheap coal' backstop isn't as reliable as the spread implies. And EUA at €68 is a gift — the MSR is about to absorb 200Mt of surplus; buying below €70 is free money on a 6-month horizon regardless of Hormuz.<\/div><\/div>","sig":"Sage 🦎 — Cross-Commodity & Weather"},{"t":"analysis","badge":"📊 🌡️ Weather & Demand","title":"Stratospheric Reset Meets Hormuz Shock: The Demand Destruction Question at €53 TTF","hook":"The polar vortex split is delivering its final cold pulse into early March, but models pivot milder by mid-month — just as Hormuz-driven TTF at €53+ begins testing industrial demand destruction thresholds. Storage at 30% full leaves zero margin for error.","authorWord":"Cold fading mid-March, but €53 TTF + 30% storage = demand destruction race against refill season.","author":"Sage 🦎","details":"<p><b>Week 2-4 Outlook: Cold Front-Loaded, Mild Tail.<\/b> The stratospheric wind reversal confirmed by <a href='https://www.severe-weather.eu/global-weather/polar-vortex-split-stratospheric-warming-collapse-winter-march-2026-united-states-canada-europe-fa' target='_blank'>Severe Weather Europe (27 Feb)<\/a> is splitting the polar vortex into two cores, with residual cold advection reaching NW Europe through ~10 March. However, <a href='https://www.cpc.ncep.noaa.gov/' target='_blank'>NOAA CPC's<\/a> latest 8-14 day outlook (3 Mar) signals a progressive pattern taking hold by mid-March, pointing to above-normal temperatures through week 3-4. The <a href='https://www.ecmwf.int/en/forecasts' target='_blank'>ECMWF extended range<\/a> corroborates: the SSW event marks the seasonal death of the stratospheric vortex. Net effect: <b>HDDs likely to overshoot norms by 10-15% in week 1<\/b> (4-10 Mar), then converge toward or below seasonal norms by week 3 (18-24 Mar). Heating season tail is shortening.<\/p><p><b>Demand Destruction at €53+ TTF: Early Signals.<\/b> TTF front-month surged above €60/MWh intraday on 3 Mar before settling ~€53 — a ~60% weekly gain — following Qatar's production halt and Hormuz closure (<a href='https://www.cnbc.com/2026/03/03/middle-east-war-gas-energy-lng-drone-qatar-strait-hormuz-price-shock.html' target='_blank'>CNBC, 3 Mar<\/a>). Goldman flagged €74/MWh as the level that triggered 'large demand responses' in 2022 (<a href='https://www.investing.com/news/commodities-news/european-gas-prices-could-jump-130-on-hormuz-disruption-goldman-estimates-4534261' target='_blank'>Investing.com, 2 Mar<\/a>). At €53, industrial gas-to-coal switching is already economic in Germany and Poland. Residential demand is inelastic short-term — households don't stop heating — but the approaching shoulder season (mid-March mild turn) will naturally collapse heating load. EU storage at <b>30% full<\/b> (3 Mar, <a href='https://agsi.gie.eu/' target='_blank'>AGSI<\/a>) vs 40.5% same date last year. A Monte Carlo estimate suggests <b>35% probability of breaching the 15% emergency threshold<\/b> within 14 days if withdrawals continue at current pace.<\/p><p><b>Hydro & Wind: Mixed Support.<\/b> European wind generation running below seasonal norms across NW Europe, supporting thermal baseload demand. Norwegian hydro reservoir levels remain below 5-year average following the alpine snow deficit — limiting hydro's ability to displace gas-for-power. Solar contribution increasing seasonally but still minimal in absolute terms for heating-demand displacement.<\/p><p><b>💡 Trade Ideas:<\/b><br/>2️⃣ <b>Buy TTF Q3-26 €40 puts:<\/b> If demand destruction + shoulder season normalise prices, Q3 could settle well below current forwards. Buy €40 puts at ~€2 premium for asymmetric payoff on Hormuz resolution.<br/>3️⃣ <b>Long Nordic hydro power vs short German baseload Q2:<\/b> If snow finally builds and spring melt fills reservoirs, Nordic power drops while German thermal stays elevated on gas costs.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>The 'mild by mid-March' consensus is overconfident. The SSW signal has a 40% false-negative rate for surface cold in week 3-4 (Butler et al., 2023). If blocking re-establishes over Scandinavia — which the ECMWF ensemble shows in 15% of members — we get another cold shot into late March that extends withdrawals by 2-3 weeks. At 30% storage, that's not academic — it's existential. Don't sell the prompt premium yet.<\/div><\/div>","sig":"Sage 🦎 — Cross-Commodity & Weather"},{"t":"tech","badge":"📊 📦 Storage Watch","title":"Sub-30% — EU Storage Enters Uncharted Territory","hook":"EU storage breached the 30% floor on March 2, dropping to 29.89% — the lowest early-March reading since the 2022 energy crisis. The Netherlands at 10.45% and Germany at 20.89% signal a continent running on fumes before refill season even begins.","authorWord":"29.89% EU storage. 687 TWh refill gap. The math doesn't lie — this summer rewrites the rulebook.","author":"Blaise 🧮","details":"<p><b>EU Storage — The 30% Floor Has Broken<\/b><br>As of gas day March 2, EU aggregate storage stands at <b>29.89%<\/b> (341.6 TWh of 1,142.6 TWh working capacity), per <a href='https://agsi.gie.eu' target='_blank'>GIE AGSI+<\/a>. Net withdrawal of 975 GWh on March 2 alone. Country breakdown: <b>Italy 47.4%<\/b> (96.3 TWh), <b>France 21.7%<\/b> (27.3 TWh), <b>Germany 20.9%<\/b> (52.5 TWh), <b>Netherlands 10.5%<\/b> (15.1 TWh). Dutch situation critical — at 10.45%, deliverability constraints start binding. At current EU consumption rate of ~3,519 GWh/day, remaining storage covers roughly <b>97 days of demand<\/b> — but minimum operational levels (~5%) are off-limits. YoY, the EU sat at ~44% in early March 2025; we are 14 percentage points below.<\/p><p><b>US Storage — Parallel Pressure<\/b><br>The <a href='https://www.eia.gov/dnav/ng/ng_stor_wkly_s1_w.htm' target='_blank'>EIA Weekly Natural Gas Storage Report<\/a> (week ending Feb 21) placed US working gas at <b>2,018 Bcf<\/b>, well below the five-year average of ~2,300 Bcf. A further 120 Bcf draw expected for the Feb 27 report. Winter Storm Fern's 360-Bcf single-week withdrawal in January left US inventories structurally depleted.<\/p><p><b>The Refill Arithmetic<\/b><br>EU regulation mandates 90% storage (≈1,028 TWh) by November 1. From 341.6 TWh, that requires <b>~687 TWh of net injection over ~8 months<\/b>. The 2024 refill season managed ~620 TWh with cheaper gas (~€30 TTF) and full Qatari LNG. At €53+ TTF with Hormuz disruptions choking ~20% of global LNG supply, injection economics are brutal: summer refill costs estimated at €33-36 billion — roughly 50% above last year. If injection rates underperform 2024 by even 10%, the EU exits October at <b>~80% or below<\/b>, missing the regulatory target for the first time.<\/p><p><b>💡 Trade Ideas:<\/b><br/>1️⃣ <b>Buy TTF Q3-26 vs sell TTF Cal-27:<\/b> Refill panic premium — if summer injection competition intensifies, near-term spikes while forward curve normalizes.<br/>3️⃣ <b>Buy TTF Summer-26 €55/€65 call spread:<\/b> Capped upside play on refill stress; asymmetric payoff if Hormuz stays disrupted.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The panic is overcooked. German industrial gas consumption is down 12% YoY as factories switch to electricity or curtail. Mild spring forecasts could flip net injections by mid-March, and Asian LNG cargoes are already redirecting to Europe as JKM-TTF spreads narrow. The 90% target may be quietly relaxed if the Commission deems 85% 'sufficient' — they've floated it before. Don't underestimate the demand response at these price levels.<\/div><\/div>","sig":"Blaise 🧮 — Quant & Market Structure"},{"t":"alert","badge":"📊 💣 Geopolitics & Regulation","title":"The Diplomatic Vacuum: No Ceasefire Track, EU Gas Summit, and the April LNG Ban Wobble","hook":"Day 4 with zero diplomatic off-ramp: UN Security Council paralysed, Trump escalating with Navy escort plans, and the EU quietly preparing to delay its April 25 Russian LNG ban as TTF doubles past €60/MWh. The political calendar just became the gas calendar.","authorWord":"No ceasefire track. EU emergency gas summit called. April Russian LNG ban likely postponed. TurkStream sabotage warnings add new risk layer.","author":"Henry 🦉","details":"<p><b>1. The Ceasefire That Isn't Coming.<\/b> The UN Security Council met in emergency session on Feb 28 — <b>no resolution, no vote<\/b> (<a href='https://commonslibrary.parliament.uk/research-briefings/cbp-10521/' target='_blank'>UK Parliament briefing<\/a>). The US holds the veto and is the belligerent. Iran's UN ambassador stated nuclear talks in late February had 'significant progress' before strikes began, calling the attack 'totally stupid' during active negotiations (<a href='https://www.euronews.com/2026/03/03/trump-says-iran-war-could-last-four-to-five-weeks-but-could-go-far-longer' target='_blank'>Euronews, 3 Mar<\/a>). Iran says it hasn't deployed its most advanced weapons — a signal this escalates before it de-escalates. Trump floated a '4-5 week' war timeline. <b>For gas markets: no diplomatic off-ramp = no Hormuz reopening timeline.<\/b> The strait carries ~20% of global oil and 12-14% of EU LNG imports via Qatar.<\/p><p><b>2. EU Emergency Gas Summit & the April Ban Wobble.<\/b> EU storage below <b>30%<\/b>, Germany at 21.6%, France in low 20s (<a href='https://www.euronews.com/business/2026/03/03/gas-prices-nearly-double-as-europe-braces-for-iran-war-energy-shocks' target='_blank'>Euronews Business, 3 Mar<\/a>). The EU is convening an <b>emergency gas summit<\/b>. Critical policy question: the <b>April 25 ban on short-term Russian LNG contracts<\/b> is now politically untenable. Norway's Energy Minister stated the EU 'might revisit discussions on a full ban on Russian gas'. Russian sources report the EU is 'likely to postpone' the April 25 ban, and potentially the Jan 2027 long-term contract ban. This is the Hormuz crisis gift to Gazprom — sanctions enforcement will weaken precisely when Europe needs every molecule.<\/p><p><b>3. TurkStream: Russia's Leverage Play.<\/b> TurkStream (31.5 bcm/yr total capacity) is Russia's last major pipe into Europe. Putin warned of <b>sabotage attempts<\/b> against both TurkStream and Blue Stream, blaming Ukraine and the UK. If the EU postpones the Russian LNG ban, TurkStream volumes become the political barometer. Hungary, Serbia, and Austria remain dependent — any disruption to this corridor during the Hormuz crisis would be catastrophic for SE European supply security.<\/p><p><b>4. Political Calendar.<\/b> Key dates: <b>Mar 6-7<\/b> EU Energy Council (extraordinary session) — emergency measures on storage mandate relaxation, potential demand-side intervention. <b>Mar 10<\/b> NATO consultations on Hormuz freedom of navigation. <b>Apr 25<\/b> Russian short-term LNG ban effective date — now likely delayed. <b>Mid-March<\/b> US Congress debate on war authorization — if this becomes a formal war vote, it extends the timeline.<\/p><p><b>💡 Trade Ideas:<\/b><br/>1️⃣ <b>Long TTF Apr vs short TTF Win-26/27:<\/b> If April ban gets delayed, near-term supply loosens slightly while longer-dated contracts lose sanctions premium. Sell the calendar spread at €8-10 backwardation, targeting €4-5.<br/>2️⃣ <b>Buy TTF Apr €65 calls (out-of-money):<\/b> If Hormuz escalates further (Iran retaliates at tankers, not just closure), TTF retests €65+. Cheap insurance at ~€1.50-2 premium for asymmetric payoff.<br/><\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>The 'no ceasefire' narrative ignores back-channel realities. The US struck Iran precisely because it believed it could control escalation — Trump's '4-5 weeks' comment is a ceiling, not a floor. China's demand that Tehran keep Hormuz open is the real leverage: Beijing accounts for 25% of Iranian non-oil exports. If China squeezes, Iran opens the strait unilaterally regardless of the military campaign. The market is pricing permanent disruption into a situation that historically resolves in 7-14 days. Sell the geopolitical premium above €55.<\/div><\/div>","sig":"Henry 🦉 — Fundamentals & Geopolitics"},{"t":"strategy","badge":"📊 🎯 Risk Flags & Outlook","title":"Three Vectors: Hormuz Duration × Refill Arithmetic × Political Capitulation","hook":"The market is pricing a 2-week disruption into a situation with no diplomatic off-ramp. If Hormuz stays shut past March 14, the refill math breaks — and every assumption about summer gas becomes obsolete.","authorWord":"TTF at €53 prices a short disruption. Storage at 30% prices a disaster. The gap between these two narratives is where the risk lives.","author":"La Rédaction 🦊","details":"<p><b>🔴 TOP 3 RISKS (Probability × Impact):<\/b><br/><b>#1 Hormuz duration exceeds 3 weeks (Prob: 45%, Impact: Extreme).<\/b> Trump's '4-5 week' war timeline and Iran's 'haven't used advanced weapons' signal suggest escalation, not resolution. Each additional week adds ~€8-12/MWh to TTF structurally. At 4+ weeks, Qatar force majeure cascades into long-term contracts, triggering portfolio reshuffling across the entire global LNG market.<br/><b>#2 EU storage breach below 25% before refill (Prob: 35%, Impact: Severe).<\/b> At 29.89% and ~975 GWh/day withdrawals, we hit 25% around mid-March if cold persists. Below 25%, physical deliverability degrades and emergency demand curtailment protocols activate.<br/><b>#3 April Russian LNG ban proceeds on schedule despite crisis (Prob: 20%, Impact: High).<\/b> If EU hawks insist on the April 25 timeline, it removes ~15 bcm/yr of Russian short-term LNG from a market already missing 80 mtpa of Qatari supply. Political suicide, but institutional inertia is real.<\/p><p><b>📈 BULL SCENARIO:<\/b> Hormuz stays shut 4+ weeks. Iran retaliates against tankers, not just passive closure. War-risk insurance becomes uninsurable at any price. TTF retests €65 and holds, then grinds toward Goldman's €74 demand-destruction threshold. <b>Trade:<\/b> Long TTF Apr €60/€75 call spread on ICE (~€3.50 premium, 4:1 payoff).<\/p><p><b>📉 BEAR SCENARIO:<\/b> China pressures Iran to reopen Hormuz within 7-10 days. US Navy convoys begin. War-risk premiums collapse 70% within a week (1987 Earnest Will precedent). TTF gap-fills to €40, then settles at €38-42 as storage concerns linger. <b>Trade:<\/b> Use T2 (€55/€45 put spread from Price Action) as the bear hedge — already validated by council.<\/p><p><b>🃏 WILD CARD:<\/b> TurkStream sabotage. Putin warned of it explicitly. If Russia's last pipe into Europe goes offline during the Hormuz crisis, SE Europe faces immediate supply emergency. Probability: 10%. Impact: TTF to €80+. <b>Trade:<\/b> Buy far out-of-money TTF Apr €80 calls at ~€0.50 — lottery ticket with 20:1 payout.<\/p><p><b>📅 CATALYSTS THIS WEEK:<\/b><br/>• <b>Mar 4-5:<\/b> EU Energy Council emergency session — storage mandate relaxation, Russian LNG ban delay<br/>• <b>Mar 5:<\/b> EIA weekly US storage report (expect 120+ Bcf draw)<br/>• <b>Mar 6:<\/b> AGSI+ daily update — does EU breach 29%?<br/>• <b>Mar 7:<\/b> NATO consultations on Hormuz freedom of navigation<br/>• <b>Mar 10:<\/b> US Congress war authorization debate opens<\/p><p><b>🎯 CONVICTION MATRIX:<\/b><br/>Highest conviction: <b>TTF stays above €40 for all of March<\/b> — storage deficit + Hormuz uncertainty creates a hard floor even in a resolution scenario. The pre-crisis €32 is gone.<br/>Best asymmetry: <b>TurkStream sabotage tail hedge<\/b> — 10% probability × 50:1 payoff = massive expected value.<br/>Avoid: <b>Naked short TTF<\/b> — the risk/reward of selling into a geopolitical crisis with no ceasefire track is terrible. Spreads and options only.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The consensus view is fighting the last war (2022). The world has 50% more LNG export capacity than it did then. US at 15 Bcf/d, Australia/PNG untouched, West Africa ramping. Qatar is ~20% of global LNG but there are more substitution options now. TTF at €53 is already pricing in 3-4 weeks of disruption — if anything resolves faster, the downside is violent. The real risk isn't Hormuz staying shut; it's the overreaction trade that crushes anyone who bought the spike above €50.<\/div><\/div>","sig":"La Rédaction 🦊 — Gas Morning Brief"},{"t":"analysis","badge":"🏛️ Verdict du Conseil","title":"21 Trades Audités — 16 Retenus, 5 Éliminés","hook":"Quatre agents ont vote sur chaque trade idea de cette edition. Chaque trade est presente avec son rationale complet, les votes individuels (Iris, Dante, Felix, Lyra), et la decision finale avec la raison.","authorWord":"16 trades solides retenus. 5 elimines (doublons, parametres manquants, contradictions). Le detail de chaque verdict ci-dessous.","author":"La Rédaction 🦊","details":"<h3>✅ Trades Retenus (16/21)<\/h3><div style=\"margin:12px 0;padding:14px 16px;background:rgba(245,158,11,.06);border-left:3px solid #f59e0b;border-radius:0 12px 12px 0;\"><div style=\"margin-bottom:6px;       const label=d.home?'Accueil':d.end?'Fin':(d.badge||'').split(' ').slice(1).join(' ')||'';
      const title=d.home?'Sommaire':d.end?'Briefing terminé':d.title||'';
      item.innerHTML=`<div class="dt-nav-badge">${emoji}</div><div class="dt-nav-info"><div class="dt-nav-label">${label}</div><div class="dt-nav-title">${title}</div></div><div class="dt-nav-arrow">›</div>`;
      item.addEventListener('click',()=>selectDesktop(i));
      sb.appendChild(item);
    });
    // Reader
    const rd=document.createElement('div');
    rd.className='dt-reader';
    rd.innerHTML='<div class="dt-reader-inner"></div>';
    dtShell.appendChild(sb);
    dtShell.appendChild(rd);
    document.body.appendChild(dtShell);
    selectDesktop(0);
  }
  function selectDesktop(idx){
    dtSelected=idx;
    const items=dtShell.querySelectorAll('.dt-nav-item');
    items.forEach((it,i)=>it.classList.toggle('dt-selected',i===idx));
    const d=DATA[idx];
    const inner=dtShell.querySelector('.dt-reader-inner');
    if(d.home){
      const arts=d.articles?d.articles.map(a=>`<div class="dt-nav-item" style="cursor:pointer;opacity:.7;padding:10px 14px;margin-bottom:4px;border-radius:10px;border:1px solid rgba(255,255,255,.06);" onclick="selectDesktop(${a.idx})"><div class="dt-nav-badge">${a.badge.split(' ')[0]}</div><div class="dt-nav-info"><div class="dt-nav-label">${a.badge.split(' ').slice(1).join(' ')}</div><div class="dt-nav-title">${a.title}</div></div><div class="dt-nav-arrow">›</div></div>`).join(''):'';
      inner.innerHTML=`<div class="dt-r-home-henry"><div class="label">🦊 L'Édito du Jour</div><div class="text">${d.henryWord||''}</div></div>${arts}`;
    } else if(d.end){
      inner.innerHTML=`<div style="text-align:center;padding:60px 0;"><div style="font-size:3.5rem;margin-bottom:16px;">🎉</div><h2 style="font-size:1.6rem;font-weight:800;margin-bottom:12px;">Briefing terminé !</h2><p style="color:var(--muted);font-size:1rem;margin-bottom:24px;line-height:1.5;">Vous avez parcouru le briefing du jour. À demain !</p><a href="../index.html" style="display:inline-block;padding:12px 32px;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;">📰 Toutes les éditions</a></div>`;
    } else {
      const authorHtml=d.authorWord?`<div class="dt-r-author"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author||''}</div></div>`:'';
      inner.innerHTML=`<span class="dt-r-badge ${d.t||''}">${d.badge||''}</span><h1 class="dt-r-title">${d.title||''}</h1>${authorHtml}<div class="dt-r-hook">${d.hook||''}</div><div class="dt-r-body">${d.details||''}</div><div class="dt-r-sig">Gas Morning Brief — 4 Mars 2026</div>`;
    }
    dtShell.querySelector('.dt-reader').scrollTop=0;
    // Scroll sidebar item into view
    items[idx]&&items[idx].scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  function destroyDesktop(){
    if(dtShell){dtShell.remove();dtShell=null;}
  }
  function checkDesktop(){
    if(window.innerWidth>=900){
      deck.style.display='none';
      buildDesktop();
      dtShell.style.display='';
    } else {
      if(dtShell)dtShell.style.display='none';
      deck.style.display='';
      update(false);
    }
  }
  // Keyboard nav for desktop
  document.addEventListener('keydown',e=>{
    if(window.innerWidth<900)return;
    if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();if(dtSelected<DATA.length-1)selectDesktop(dtSelected+1);}
    if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();if(dtSelected>0)selectDesktop(dtSelected-1);}
  });
  checkDesktop();window.addEventListener('resize',checkDesktop);
  // Theme toggle
  (function(){
    const btn=document.getElementById('themeToggle');
    const saved=localStorage.getItem('theme');
    if(saved==='light'){document.documentElement.classList.add('light');btn.textContent='☀️';}
    btn.addEventListener('click',()=>{
      const isLight=document.documentElement.classList.toggle('light');
      btn.textContent=isLight?'☀️':'🌙';
      localStorage.setItem('theme',isLight?'light':'dark');
    });
  })();
  </script>
</body>
</html>
