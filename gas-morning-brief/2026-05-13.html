<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gas Morning Brief — 13 Mai 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    /* Scenario Probability Card */
    .scenario-block { margin: 1em 0; padding: 0.8em 1em; border-left: 4px solid #ffd700; border-radius: 0 8px 8px 0; background: rgba(255,215,0,0.05); }
    .scenario-block h3 { margin: 0 0 0.3em 0; font-size: 1.05em; display: flex; justify-content: space-between; align-items: center; }
    .scenario-block .proba { font-size: 1.3em; font-weight: bold; color: #ffd700; }
    .scenario-block p { margin: 0.2em 0; font-size: 0.92em; }
    .scenario-block .votes { font-size: 0.8em; opacity: 0.7; font-style: italic; }
    .consensus { margin-top: 1.2em; padding: 0.6em; border-radius: 8px; background: rgba(0,200,100,0.08); }
    .dissent { margin-top: 0.4em; padding: 0.6em; border-radius: 8px; background: rgba(255,80,80,0.08); }

    html.light .details div[style*="background"], html.light .details p[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Light mode: override inline white colors in trade cards */
    html.light .details p[style], html.light .details b[style], html.light .details span[style], html.light .details div[style] { color: rgba(0,0,0,.85) !important; }
    html.light .details div[style*="border-left:3px solid #f59e0b"] { background: rgba(245,158,11,.08) !important; }
    html.light .details div[style*="border-left:3px solid #10b981"] { background: rgba(16,185,129,.08) !important; }
    html.light .details div[style*="border-left:3px solid #ff4757"] { background: rgba(255,71,87,.06) !important; }
    html.light .details div[style*="color:#f59e0b"] { color: #b45309 !important; }
    html.light .details div[style*="color:#10b981"] { color: #047857 !important; }
    html.light .details div[style*="color:#ff4757"] { color: #dc2626 !important; }
    html.light .details h3 { color: #1a1a2e !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details p[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }
      .dt-reader .dt-r-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; }
      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }
      .dt-reader .dt-r-body p { margin-bottom: 18px; }

  <script>
  const DATA = [{"t":"home","home":true,"date":"13 Mai 2026","henryWord":"Le gaz garde une asymétrie haussière malgré une apparence de range: les flux tiennent, mais la convexité reste chère là où le risque d’erreur est maximal. Le conseil retient un panier resserré de structures à risque borné et élimine les idées trop complexes ou redondantes. Exécution: discipline sur le sizing, protection optionnelle active sur Q3/Q4.","articles":[{"badge":"⚡ 💰 Price Action","title":"TTF stabilise près de €46, HH défend $2.7 avant catalyseurs US","idx":1},{"badge":"⚡ 🚢 LNG & Flows","title":"Flux LNG corrects mais fenêtre d’arbitrage toujours fragile","idx":2},{"badge":"⚡ ⚡ Power & Carbon","title":"EUA recule, spark spread plus dépendant du gaz que du carbone","idx":3},{"badge":"📊 🌡️ Weather & Demand","title":"Biais plus chaud en sous-saisonnier: soutien limité à la demande chauffage","idx":4},{"badge":"📊 📦 Storage Watch","title":"UE en refill vigilant, US injection conforme mais sans excès","idx":5},{"badge":"📊 💣 Geopolitics & Regulation","title":"Prime géopolitique persistante: le marché price la durée, pas l’accident","idx":6},{"badge":"📊 🎯 Risk Flags & Outlook","title":"Asymétrie haussière conservée, mais exécution tactique obligatoire","idx":7},{"badge":"🎲 Scénarios","title":"7 scénarios marché gaz — probabilités du conseil","idx":8},{"badge":"📊 🌍 Scénario Géopolitique","title":"Géopolitique & gaz — 7 scénarios réels pondérés","idx":9}],"disclaimer":"⚠️ AVERTISSEMENT — Ce document est un exercice expérimental de veille automatisée produit par intelligence artificielle. Il ne constitue EN AUCUN CAS un conseil en investissement, une recommandation de trading, ni une analyse financière réglementée au sens de la directive MiFID II ou du Code monétaire et financier (art. L541-1). Les « scénarios de marché » présentés sont des hypothèses pédagogiques générées par des modèles de langage — ils ne reflètent pas l'avis d'un professionnel agréé. Les données proviennent de sources publiques, potentiellement retardées ou erronées. Toute décision d'investissement prise sur la base de ce document relève de la seule responsabilité du lecteur. L'auteur n'est pas enregistré comme Conseiller en Investissement Financier (CIF) auprès de l'AMF. Ce contenu est fourni à titre informatif et expérimental uniquement."},{"t":"alert","badge":"⚡ 💰 Price Action","title":"TTF stabilise près de €46, HH défend $2.7 avant catalyseurs US","hook":"Le marché garde une prime géopolitique mais le momentum intraday ralentit. Le vrai signal reste la convexité sur les options d’été.","authorWord":"Range étroit, queue de risque encore chère: privilégier les structures convexes.","author":"La Rédaction 🦊","details":"<p>Le TTF européen s'est maintenu autour de <strong>€46.23/MWh<\/strong> (11 May 2026, source: <a href=https://tradingeconomics.com/commodity/eu-natural-gas target=_blank>TradingEconomics<\/a>), tandis que les références de marché restent suivies via <a href=https://www.cmegroup.com/markets/energy/natural-gas/dutch-ttf-natural-gas-calendar-month.html target=_blank>CME TTF<\/a> et <a href=https://www.investing.com/commodities/dutch-ttf-gas-c1-futures-historical-data target=_blank>Investing<\/a>. Le biais court terme est neutre-haussier tant que la zone €44-45 tient.<\/p><p>Le pricing reste dominé par la protection des queues: les desks paient l’upside optionnel tout en gardant du carry via structures définies en risque.<\/p><h3>💡 Trade Ideas<\/h3><ul><li>Si TTF tient €45: long TTF Jul26 call spread 50/58.<\/li><li>Si cassure de €44: short TTF Summer26 vs long Winter26 (re-steepener défensif).<\/li><li>Relative value: long JKM-TTF spread si stress LNG Asie réaccélère.<\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>Sans nouveau choc d’offre, le marché peut compresser la vol implicite plus vite que prévu.<\/div><\/div><p>Desk note: la gestion du risque reste prioritaire dans ce régime de marché. Nous privilégions des tailles progressives, des stops explicites et un recalibrage quotidien selon flux, météo et liquidité de la courbe. Les scénarios sont pilotés par probabilités conditionnelles et non par conviction binaire.<\/p>","sig":"La Rédaction 🦊"},{"t":"alert","badge":"⚡ 🚢 LNG & Flows","title":"Flux LNG corrects mais fenêtre d’arbitrage toujours fragile","hook":"Les arrivées UE restent fonctionnelles, mais la sensibilité aux disruptions transport est élevée. Le spread transatlantique ne laisse pas de marge d’erreur.","authorWord":"Flux OK ne veut pas dire sécurité: surveiller routes et nominations quotidiennement.","author":"La Rédaction 🦊","details":"<p>Les plateformes de suivi opérationnel <a href=https://www.gie.eu/agsi-and-alsi-transparency-platforms/ target=_blank>GIE ALSI/AGSI<\/a> et <a href=https://gasdashboard.entsog.eu/ target=_blank>ENTSOG<\/a> montrent un système alimenté mais tendu en flexibilité. Les traders gardent un biais prudent sur les spreads TTF-JKM compte tenu du risque route/fret.<\/p><p>La lecture desk: disponibilité apparente en Europe, mais prime de risque persistante sur tout choc maritime ou maintenance non planifiée.<\/p><h3>💡 Trade Ideas<\/h3><ul><li>Si nominations Norvège baissent: long TTF front-month vs short Q4 (bull flattening).<\/li><li>Si flux LNG restent fluides 5-7 jours: vente de call couvert via call spread OTM.<\/li><li>Long optionalité JKM (calls) contre short delta TTF en couverture.<\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>Le marché surestime le risque immédiat: la destruction de demande peut amortir un choc court.<\/div><\/div><p>Desk note: la gestion du risque reste prioritaire dans ce régime de marché. Nous privilégions des tailles progressives, des stops explicites et un recalibrage quotidien selon flux, météo et liquidité de la courbe. Les scénarios sont pilotés par probabilités conditionnelles et non par conviction binaire.<\/p>","sig":"La Rédaction 🦊"},{"t":"tech","badge":"⚡ ⚡ Power & Carbon","title":"EUA recule, spark spread plus dépendant du gaz que du carbone","hook":"Le léger repli carbone détend partiellement le coût marginal, sans changer le régime. Le gaz reste la variable dominante du spark court terme.","authorWord":"Carbone en respiration, mais le pilotage reste gas-led sur le front power.","author":"La Rédaction 🦊","details":"<p>Les EUA ont été vus autour de <strong>€75.64<\/strong> au 12 May 2026 (source: <a href=https://tradingeconomics.com/commodity/carbon target=_blank>TradingEconomics<\/a>; marché de référence <a href=https://www.ice.com/products/197/EUA-Futures/data target=_blank>ICE EUA<\/a>). L’impact est une détente modérée des coûts carbone, insuffisante pour inverser les signaux de merit-order.<\/p><p>La vigilance reste sur outages réseau/interconnexions et écart vent réalisé vs prévu, qui peuvent réinjecter de la demande gas-for-power.<\/p><h3>💡 Trade Ideas<\/h3><ul><li>Si EUA casse plus bas: pair trade short EUA / long TTF Summer si météo chaude.<\/li><li>Long clean spark proxy via long power DE / long gas hedge partiel.<\/li><li>Strangle TTF court terme autour des auctions day-ahead volatiles.<\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>Le carbone peut redevenir le driver dominant si flux gaz se normalisent rapidement.<\/div><\/div><p>Desk note: la gestion du risque reste prioritaire dans ce régime de marché. Nous privilégions des tailles progressives, des stops explicites et un recalibrage quotidien selon flux, météo et liquidité de la courbe. Les scénarios sont pilotés par probabilités conditionnelles et non par conviction binaire.<\/p>","sig":"La Rédaction 🦊"},{"t":"analysis","badge":"📊 🌡️ Weather & Demand","title":"Biais plus chaud en sous-saisonnier: soutien limité à la demande chauffage","hook":"Les signaux météo glissent vers des anomalies plus douces en Europe. Le risque principal se déplace vers l’offre, pas la demande résidentielle.","authorWord":"Moins de HDD que normal = moins de soutien naturel pour les prix spot.","author":"La Rédaction 🦊","details":"<p>Les perspectives saisonnières NOAA/CPC (mise à jour 12 May 2026) indiquent un biais de températures au-dessus des normales sur plusieurs fenêtres (<a href=https://www.cpc.ncep.noaa.gov/products/CFSv2/CFSv2seasonal.shtml target=_blank>CPC CFSv2<\/a>). En parallèle, les scénarios ECMWF relayés par la presse météo suggèrent une volatilité régionale mais pas de choc froid structurant.<\/p><p>Conséquence marché: support moindre via HDD, donc plus grande dépendance aux risques d’offre et au timing des injections.<\/p><h3>💡 Trade Ideas<\/h3><ul><li>Si météo reste douce: short prompt TTF vs long winter strip.<\/li><li>Si surprise chaude + power burn: long call spread TTF Aug/Sep.<\/li><li>Relative value: long spark spread optionnel contre short gamma spot.<\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>Une seule révision froide peut suffire à déclencher un short-covering brutal.<\/div><\/div><p>Références de suivi complémentaires: <a href=https://www.reuters.com/markets/commodities/ target=_blank>Reuters Commodities<\/a> et <a href=https://www.ice.com/ target=_blank>ICE Markets<\/a>.<\/p><p>Desk note: la gestion du risque reste prioritaire dans ce régime de marché. Nous privilégions des tailles progressives, des stops explicites et un recalibrage quotidien selon flux, météo et liquidité de la courbe. Les scénarios sont pilotés par probabilités conditionnelles et non par conviction binaire.<\/p>","sig":"La Rédaction 🦊"},{"t":"tech","badge":"📊 📦 Storage Watch","title":"UE en refill vigilant, US injection conforme mais sans excès","hook":"Le coussin de stockage se reconstruit, mais le point de départ reste fragile en Europe. La fenêtre été doit rester disciplinée sur le risque d’offre.","authorWord":"Le confort revient lentement; aucune place pour l’autosatisfaction.","author":"La Rédaction 🦊","details":"<p>Les tableaux AGSI/ENTSOG restent la référence pour le suivi européen (<a href=https://www.gie.eu/agsi-and-alsi-transparency-platforms/ target=_blank>GIE AGSI<\/a>, <a href=https://gasdashboard.entsog.eu/ target=_blank>ENTSOG<\/a>). Côté US, l’EIA a publié pour la semaine finissant le 1 May 2026 une injection de <strong>+63 Bcf<\/strong> et un stock de <strong>2,205 Bcf<\/strong> (released 7 May 2026 10:30 ET, <a href=https://ir.eia.gov/ngs/ngs.html target=_blank>EIA WNGSR<\/a>).<\/p><p>Lecture desk: rythme US correct, mais en Europe le niveau de départ impose une gestion active des spreads saisonniers.<\/p><h3>💡 Trade Ideas<\/h3><ul><li>Si injections UE sous trajectoire: long Winter26 / short Summer26.<\/li><li>Si rythme US surprend haussier: short HH prompt avec protection call OTM.<\/li><li>Acheter optionalité sur Q4 TTF via call spreads progressifs.<\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>Le marché peut rapidement repasser en excès d’offre si météo et LNG restent favorables.<\/div><\/div><p>Desk note: la gestion du risque reste prioritaire dans ce régime de marché. Nous privilégions des tailles progressives, des stops explicites et un recalibrage quotidien selon flux, météo et liquidité de la courbe. Les scénarios sont pilotés par probabilités conditionnelles et non par conviction binaire.<\/p>","sig":"La Rédaction 🦊"},{"t":"alert","badge":"📊 💣 Geopolitics & Regulation","title":"Prime géopolitique persistante: le marché price la durée, pas l’accident","hook":"Les risques de route et de sanctions restent au cœur du pricing gaz. Le marché conserve une convexité haussière sur les scénarios de disruption prolongée.","authorWord":"Le coût d’erreur est asymétrique: manquer un spike coûte plus cher que payer un peu de carry.","author":"La Rédaction 🦊","details":"<p>Les flux russes restants et le risque maritime moyen-oriental continuent de structurer la courbe, avec suivi quotidien via presse spécialisée et dashboards flux (<a href=https://gasdashboard.entsog.eu/ target=_blank>ENTSOG<\/a>). Côté régulation, l’exécution des mesures UE sur le gaz russe reste un driver de prime de risque via disponibilité LNG.<\/p><p>Le marché privilégie des couvertures asymétriques: faible probabilité d’événement extrême, mais impact prix potentiellement violent.<\/p><h3>💡 Trade Ideas<\/h3><ul><li>Scénario stress géopo: long calls TTF Q3/Q4 (delta faible, convexité élevée).<\/li><li>Scénario détente: put spread TTF financé partiellement par call OTM.<\/li><li>Long JKM vs short TTF si risque Asie-route se matérialise.<\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>Le marché peut surpayer la géopolitique si aucun choc concret n’émerge sous 2 semaines.<\/div><\/div><p>Références de suivi complémentaires: <a href=https://www.reuters.com/markets/commodities/ target=_blank>Reuters Commodities<\/a> et <a href=https://www.ice.com/ target=_blank>ICE Markets<\/a>.<\/p><p>Desk note: la gestion du risque reste prioritaire dans ce régime de marché. Nous privilégions des tailles progressives, des stops explicites et un recalibrage quotidien selon flux, météo et liquidité de la courbe. Les scénarios sont pilotés par probabilités conditionnelles et non par conviction binaire.<\/p>","sig":"La Rédaction 🦊"},{"t":"strategy","badge":"📊 🎯 Risk Flags & Outlook","title":"Asymétrie haussière conservée, mais exécution tactique obligatoire","hook":"La structure de marché reste binaire: range en apparence, queues coûteuses en réalité. Le meilleur set-up combine discipline de carry et protection de spike.","authorWord":"Conviction: conserver de la convexité acheteuse sans surpayer le theta.","author":"La Rédaction 🦊","details":"<p><strong>Top risks (probabilité × impact):<\/strong> 1) disruption flux/LNG, 2) surprise météo chaude avec power burn, 3) choc régulatoire/sanctions.<\/p><p><strong>Bull case (1-2 semaines):<\/strong> choc d’offre court, TTF ré-attaque les hauts récents. <strong>Bear case:<\/strong> flux stables + météo douce, compression de vol et retracement spot. <strong>Wild card:<\/strong> événement géopolitique faible probabilité, fort impact.<\/p><h3>💡 Trade Ideas<\/h3><ul><li>Core: long call spread TTF Jul-Sep.<\/li><li>Hedge bear: put spread financé partiellement.<\/li><li>Tail risk: petit budget long strangle sur front quarter.<\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>Le scénario le plus sous-estimé est une normalisation rapide des flux qui érode la prime en quelques séances.<\/div><\/div><p>Références de suivi complémentaires: <a href=https://www.reuters.com/markets/commodities/ target=_blank>Reuters Commodities<\/a> et <a href=https://www.ice.com/ target=_blank>ICE Markets<\/a>.<\/p><p>Desk note: la gestion du risque reste prioritaire dans ce régime de marché. Nous privilégions des tailles progressives, des stops explicites et un recalibrage quotidien selon flux, météo et liquidité de la courbe. Les scénarios sont pilotés par probabilités conditionnelles et non par conviction binaire.<\/p>","sig":"La Rédaction 🦊"},{"t":"analysis","badge":"🎲 Scénarios","title":"7 scénarios marché gaz — probabilités du conseil","hook":"Le conseil conserve un scénario central de range tendu, avec deux queues asymétriques. La dispersion de votes justifie une exposition optionnelle disciplinée.","authorWord":"Consensus: biais haussier modéré, risque de spike non négligeable.","author":"Le Conseil 🎲","details":"<div class='scenario-block'><h3>S1 — Range tendu Europe <span class='proba'>28%<\/span><\/h3><p>Flux globalement stables, volatilité intraday élevée, TTF en consolidation haute.<\/p><p class='votes'>Apex 26% · Sage 30% · Nova 27% · Blaise 29% · Lyra 28% · Dante 24% · Felix 32%<\/p><\/div><div class='scenario-block'><h3>S2 — Squeeze m
