<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gas Morning Brief — 1 Avril 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    /* Scenario Probability Card */
    .scenario-block { margin: 1em 0; padding: 0.8em 1em; border-left: 4px solid #ffd700; border-radius: 0 8px 8px 0; background: rgba(255,215,0,0.05); }
    .scenario-block h3 { margin: 0 0 0.3em 0; font-size: 1.05em; display: flex; justify-content: space-between; align-items: center; }
    .scenario-block .proba { font-size: 1.3em; font-weight: bold; color: #ffd700; }
    .scenario-block p { margin: 0.2em 0; font-size: 0.92em; }
    .scenario-block .votes { font-size: 0.8em; opacity: 0.7; font-style: italic; }
    .consensus { margin-top: 1.2em; padding: 0.6em; border-radius: 8px; background: rgba(0,200,100,0.08); }
    .dissent { margin-top: 0.4em; padding: 0.6em; border-radius: 8px; background: rgba(255,80,80,0.08); }

    html.light .details div[style*="background"], html.light .details p[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Light mode: override inline white colors in trade cards */
    html.light .details p[style], html.light .details b[style], html.light .details span[style], html.light .details div[style] { color: rgba(0,0,0,.85) !important; }
    html.light .details div[style*="border-left:3px solid #f59e0b"] { background: rgba(245,158,11,.08) !important; }
    html.light .details div[style*="border-left:3px solid #10b981"] { background: rgba(16,185,129,.08) !important; }
    html.light .details div[style*="border-left:3px solid #ff4757"] { background: rgba(255,71,87,.06) !important; }
    html.light .details div[style*="color:#f59e0b"] { color: #b45309 !important; }
    html.light .details div[style*="color:#10b981"] { color: #047857 !important; }
    html.light .details div[style*="color:#ff4757"] { color: #dc2626 !important; }
    html.light .details h3 { color: #1a1a2e !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details p[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }
      .dt-reader .dt-r-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; }
      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }
      .dt-reader .dt-r-body p { margin-bottom: 18px; }
      .dt-reader .dt-r-body strong { color: #fff; font-weight: 600; }

  <script>
  const DATA = [{"t":"home","home":true,"date":"1 Avril 2026","henryWord":"TTF à €49.5 avec stockage à 27.1% : l'UE joue à quitte ou double. La ban LNG russe (-14 bcm/an) et la fermeture d'Hormuz (J32) créent un choc d'offre trois fois. Le Conseil valide 11 trades sur 15 — le Summer/Winter spread à €15 et le call spread géopolitique €45-€70 sont les plus convaincants. La volatilité est reine.","articles":[{"badge":"⚡ 💰 Price Action","title":"TTF Holds Near €49.5 as April 1 LNG Ban Looms — HH Decouples at $2.95","idx":1},{"badge":"⚡ 🚢 LNG & Flows","title":"EU LNG Sendout at 2.8 Bcm/d as Ban Looms — TurkStream Flows Steady at 15.7 Bcm/yr","idx":2},{"badge":"⚡ ⚡ Power & Carbon","title":"Spark Spread Dark at -€8.50/MWh — Gas-to-Power Unprofitable as EUA Crashes to €62.50/t","idx":3},{"badge":"📊 🌡️ Weather & Demand","title":"Europe Faces Warmest April Since 2018 — Heating Demand Collapses 34% Below Normal","idx":4},{"badge":"📊 📦 Storage Watch","title":"EU Storage at 27.1% — Lowest Since 2021 Crisis. 70 Bcm to Inject by November 1.","idx":5},{"badge":"📊 💣 Geopolitics & Regulation","title":"Hormuz Day 32: Closure Extends Indefinitely as Iran Demands Sovereignty. April 1 Russian LNG Ban Closes Last EU Loophole.","idx":6},{"badge":"📊 🎯 Risk Flags & Outlook","title":"Three Supply Shocks Converge — Council Validates 10 of 18 Trade Ideas","idx":7},{"badge":"🎲 Scénarios","title":"7 Scénarios de Marché — Votes du Conseil","idx":8},{"badge":"📊 🌍 Scénario Géopolitique","title":"7 Scénarios Géopolitiques — Votes du Conseil","idx":9},{"badge":"🏛️ Verdict du Conseil","title":"15 Trades Audités — 11 Retenus, 4 Éliminés","idx":10}],"disclaimer":"⚠️ AVERTISSEMENT — Ce document est un exercice expérimental de veille automatisée produit par intelligence artificielle. Il ne constitue EN AUCUN CAS un conseil en investissement, une recommandation de trading, ni une analyse financière réglementée au sens de la directive MiFID II ou du Code monétaire et financier (art. L541-1). Les « scénarios de marché » présentés sont des hypothèses pédagogiques générées par des modèles de langage — ils ne reflètent pas l'avis d'un professionnel agréé. Les données proviennent de sources publiques, potentiellement retardées ou erronées. Toute décision d'investissement prise sur la base de ce document relève de la seule responsabilité du lecteur. L'auteur n'est pas enregistré comme Conseiller en Investissement Financier (CIF) auprès de l'AMF. Ce contenu est fourni à titre informatif et expérimental uniquement."},{"t":"alert","badge":"⚡ 💰 Price Action","title":"TTF Holds Near €49.5 as April 1 LNG Ban Looms — HH Decouples at $2.95","hook":"European gas clings to €49.5/MWh as the April 1 Russian LNG ban removes 14 bcm/yr of supply at the worst possible moment. Henry Hub slides to $2.95 on mild US weather, completely detached from the Baltic drama.","authorWord":"TTF/JKM spread is now the widest since 2022 — EU pays a 58% premium for supply security.","author":"Blaise 🧮","details":"<p><strong>Day-Ahead Settlements (31 Mar close):<\/strong> TTF day-ahead settled at <strong>€49.52/MWh<\/strong> (▲+€1.02 vs prev), according to <a href=\"https://www.ice.com/products/27996665/Dutch-TTF-Natural-Gas-Futures/data\" target=\"_blank\">ICE Endex<\/a>. Henry Hub spot fell to <strong>$2.95/MMBtu<\/strong> (▼-$0.07 vs prev), per <a href=\"https://www.cmegroup.com/markets/energy/natural-gas/natural-gas.html\" target=\"_blank\">CME/NYMEX<\/a>. JKM softened to <strong>$17.80/MMBtu<\/strong> (▼-$0.50 vs prev) on easing Asian demand, reports <a href=\"https://www.sparkcommodities.com/\" target=\"_blank\">Spark Commodities<\/a>.<\/p><p><strong>Technical Levels:<\/strong> TTF front-month finds resistance at <strong>€52.00<\/strong> (Feb 24 high) with support at <strong>€46.50<\/strong> (Mar 19 low). The curve remains in steep backwardation — Summer 26/Winter 26 spread is trading at a record <strong>€15.00<\/strong> premium, reflecting refill urgency. Henry Hub has broken below <strong>$3.00<\/strong> psychological support with next level at <strong>$2.75<\/strong> (Dec 2024 low).<\/p><p><strong>Volume and Open Interest:<\/strong> TTF open interest surged <strong>+8.2% WoW<\/strong> to 1.42M contracts, the highest since January 2025, as speculators rebuild bullish bets ahead of the LNG ban. HH open interest fell <strong>-3.1%<\/strong> to 1.18M contracts, indicating continued US investor apathy.<\/p><p><strong>Overnight Signals:<\/strong> Asian session was quiet with JKM trading sideways. No major cargo diversions reported in the last 24h, but chartering activity for May loading shows a <strong>+22% WoW increase<\/strong> in EU-bound vessels, suggesting forward buying of supply.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>The TTF backwardation is artificial — it is driven by regulatory panic, not physical scarcity. US gas at $2.95 proves the global balance is loose. EU will simply burn more coal this summer if TTF stays above €45. The power sector fuel-switching threshold is now €42/MWh — we are well above it. Bearish.<\/div><\/div><h3>💡 Trade Ideas<\/h3><p>1. <strong>Futures Calendar Spread:<\/strong> Long TTF Summer 26 / Short TTF Winter 26 at current €15.00 spread. Target: €22.00 by July as refill race intensifies. Stop: €12.00.<\/p><p>2. <strong>Call Spread:<\/strong> Long TTF Dec 26 €55 Calls / Short TTF Dec 26 €70 Calls. Net debit ~€2.50/MWh. Plays winter refill squeeze with capped upside.<\/p><p>3. <strong>Relative Value:<\/strong> Long JKM / Short TTF via Q3 26 swaps. Current 58% premium is historically extreme; convergence likely as EU panic subsides post-ban implementation.<\/p>","sig":"Blaise 🧮"},{"t":"alert","badge":"⚡ 🚢 LNG & Flows","title":"EU LNG Sendout at 2.8 Bcm/d as Ban Looms — TurkStream Flows Steady at 15.7 Bcm/yr","hook":"EU terminals are running at 89% utilization but the Russian LNG ban removes 14 bcm/yr of spot supply from April 1. TurkStream continues flowing to Hungary and Serbia, bypassing the transit ban.","authorWord":"The EU 90% storage mandate by November 1 requires 3.2 Bcm/month of injections. Without Russian LNG, we are 1.1 Bcm/month short.","author":"Henry 🦉","details":"<p><strong>EU LNG Arrivals (Week 13):<\/strong> <strong>38 cargoes<\/strong> arrived in the past 7 days (▲+3 vs WoW), delivering <strong>2.78 Bcm<\/strong> of LNG, according to <a href=\"https://gie.eu\" target=\"_blank\">GIE ALSI<\/a>. Sendout rates averaged <strong>2.82 Bcm/d<\/strong> (▲+5.2% WoW) as terminals run hot. Key terminals: Gate (NL) at 92%, Montoir (FR) at 88%, Zeebrugge (BE) at 85%.<\/p><p><strong>Key Spreads:<\/strong> TTF-JKM spread has blown out to <strong>€31.70/MWh<\/strong> (equivalent to a <strong>58%<\/strong> premium), the widest since October 2022. This reflects EU desperation — Asian divert economics are now negative. TTF-HH spread sits at <strong>€35.60/MWh<\/strong> (or <strong>$11.50/MMBtu<\/strong>), a level that historically triggers US export surges but ship availability is now the constraint.<\/p><p><strong>US LNG Export Loadings:<\/strong> US terminals loaded <strong>11.8 Bcf/d<\/strong> (89% of capacity), per <a href=\"https://www.eia.gov/dnav/ng/ng_prod_sum_a_EPL0_R180_Mcf_a.htm\" target=\"_blank\">EIA<\/a>. Sabine Pass and Freeport are at 95%+, but Cheniere <strong>Train 4 outage<\/strong> (until April 15) caps total. Atlantic fleet utilization is at <strong>97%<\/strong> — ships are the bottleneck, not capacity.<\/p><p><strong>Pipeline Flows:<\/strong> Norwegian flows via Langeled and Europipe hold at <strong>312 mcm/d<\/strong> (stable vs WoW). North African flows (Medgaz, Transmed) at <strong>42 mcm/d<\/strong> (▼-5 mcm/d vs WoW) due to Algerian maintenance. <strong>TurkStream<\/strong> continues at <strong>43 mcm/d<\/strong> to Hungary and Serbia, fully exempt from the Russian transit ban — this is the <strong>15.7 Bcm/yr<\/strong> backdoor that keeps Central European supply connected.<\/p><p><strong>Terminal Outages:<\/strong> <strong>Grain LNG (UK)<\/strong> planned maintenance March 31-April 10 (capacity -50%). <strong>South Hook (UK)<\/strong> returning from outage today at 60% ramping to full by April 3. No unplanned outages reported.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>The LNG panic is overblown. EU sendout at 2.82 Bcm/d is only 3% below the 2024 peak. The Russian ban removes 14 bcm/yr, but Qatar and US can fill 8-9 bcm/yr of that gap at current utilization. The remaining 5 bcm is a coal problem, not a gas problem. We will burn more Polish coal and Czech lignite this summer. Bearish TTF.<\/div><\/div><h3>💡 Trade Ideas<\/h3><p>1. <strong>Calendar Spread:<\/strong> Long TTF Q3 26 / Short TTF Q4 26. The panic premium is in Q3 (ban implementation), but Q4 will see the refill reality. Target: €8.00 spread compression from current €12.00.<\/p><p>2. <strong>Relative Value:<\/strong> Long JKM Q3 26 / Short TTF Q3 26. The 58% premium is unsustainable. Asian demand will weaken if EU outbids the market. Convergence to <strong>40%<\/strong> premium likely by June.<\/p><p>3. <strong>Options:<\/strong> Long TTF Jul 26 €45 Puts. The €50 level will not hold if the ban passes smoothly and spot LNG keeps flowing. Downside protection to €42 tested on coal switching.<\/p>","sig":"Henry 🦉"},{"t":"tech","badge":"⚡ ⚡ Power & Carbon","title":"Spark Spread Dark at -€8.50/MWh — Gas-to-Power Unprofitable as EUA Crashes to €62.50/t","hook":"Gas-to-power is completely uneconomic with spark spreads at -€8.50/MWh. Coal plants are running flat out as EUA carbon prices collapse to €62.50/t, their lowest since November 2024.","authorWord":"The fuel-switching price is now €42/MWh. We are 18% above that. Coal is winning. This destroys gas-for-power demand for the next 3 months.","author":"Sage 🦎","details":"<p><strong>Spark Spread (Gas-to-Power):<\/strong> Germany day-ahead spark spread settled at <strong>-€8.50/MWh<\/strong> (▼-€2.10 WoW), according to <a href=\"https://www.entsoe.eu/\" target=\"_blank\">ENTSO-E<\/a>. France at <strong>-€9.20/MWh<\/strong> (▼-€2.40 WoW). Gas plants are bleeding cash — many are bidding below marginal cost to avoid shutdown costs.<\/p><p><strong>Dark Spread (Coal-to-Power):<\/strong> Germany dark spread at <strong>+€12.30/MWh<\/strong> (▲+€3.80 WoW). France at <strong>+€8.70/MWh<\/strong>. Coal plants are printing money. lignite generation in Germany and Czech Republic is at <strong>95% availability<\/strong> — every available megawatt is running.<\/p><p><strong>EUA Carbon Price:<\/strong> EUA Dec 26 settled at <strong>€62.50/t<\/strong> (▼-€8.10 WoW), per <a href=\"https://www.ice.com/products/36691055/EUA-European-Emission-Allowances-Futures\" target=\"_blank\">ICE<\/a>. The carbon market has collapsed on weak industrial demand and political pressure to suspend the ETS in response to the gas crisis. This is the <strong>lowest since November 2024<\/strong>.<\/p><p><strong>Power Spot Prices:<\/strong> Germany day-ahead at <strong>€78.20/MWh<\/strong> (▼-€12.40 WoW). France at <strong>€82.50/MWh<\/strong> (▼-€15.30 WoW). UK N2EX at <strong>£68.90/MWh<\/strong> (▼-£11.20 WoW). The correction is broad-based.<\/p><p><strong>Unplanned Outages:<\/strong> <strong>Gravelines NPP (France)<\/strong> Unit 6 tripped offline March 30 (-1.3 GW). <strong>Doel NPP (Belgium)<\/strong> Unit 4 planned maintenance March 31-April 14 (-1.0 GW). <strong>BritNed interconnector<\/strong> reduced to 40% capacity until April 5 due to cable fault (-400 MW).<\/p><p><strong>Renewable Generation:<\/strong> Wind output in Germany forecast at <strong>8.2 GW<\/strong> today (vs 12.5 GW average for March). Solar at <strong>22.1 GW<\/strong> peak (above average). France river temperatures are rising — nuclear cooling restrictions may ease by mid-April.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The coal switch is temporary. EUA at €62.50 is oversold — the EU will NOT suspend the ETS. This is a buying opportunity for carbon credits. When EUA bounces back to €75+/t by June, the spark spread will recover. Gas plants will not stay offline forever.<\/div><\/div><h3>💡 Trade Ideas<\/h3><p>1. <strong>Carbon Spread:<\/strong> Long EUA Dec 26 at €62.50/t. Target: €78.00/t by June as political pressure fades and industrial demand recovers. Stop: €55.00/t.<\/p><p>2. <strong>Spark Spread Recovery:<\/strong> Long TTF Q3 26 / Short EUA Dec 26. The correlation is broken. When carbon rallies, gas will follow. Play the reconvergence.<\/p><p>3. <strong>Coal-Gas Switching:<\/strong> Long TTF Dec 26 €50 Calls. If TTF falls below €42/MWh, coal generation collapses and gas plants restart. The switching point is a put option on gas prices.<\/p>","sig":"Sage 🦎"},{"t":"analysis","badge":"📊 🌡️ Weather & Demand","title":"Europe Faces Warmest April Since 2018 — Heating Demand Collapses 34% Below Normal","hook":"Extended range forecasts show persistent +2.5°C to +4.5°C anomalies across Europe through April. HDD trajectory is now 34% below the 10-year average — the heating season is effectively over.","authorWord":"The refill season starts 3 weeks early this year. But with storage at 27.1%, we are running a race against the summer heatwave.","author":"Sage 🦎","details":"<p><strong>Extended Range (Week 2-4):<\/strong> The <a href=\"https://www.cpc.ncep.noaa.gov/\" target=\"_blank\">NOAA CPC<\/a> outlook shows <strong>+2.5°C to +4.5°C anomalies<\/strong> across all of Europe for April 10-30. The pattern is a persistent omega block anchored over Scandinavia, drawing warm air from the Azores. No meaningful cold shots are forecast through May.<\/p><p><strong>HDD Trajectory:<\/strong> Cumulative heating degree days (HDD) for the Oct-Mar season are at <strong>2156<\/strong>, vs <strong>3274<\/strong> for the 10-year average (▼-34%). This is the <strong>warmest winter since 2018<\/strong>. March 2026 HDD came in at <strong>412<\/strong>, vs <strong>521<\/strong> average (▼-21%).<\/p><p><strong>Seasonal Demand Outlook:<\/strong> Residential heating demand is collapsing. <strong>Germany gas demand<\/strong> for March was <strong>2.82 Bcm<\/strong> (▼-18% YoY). <strong>France<\/strong> at <strong>1.74 Bcm<\/strong> (▼-22% YoY). Industrial demand remains weak at <strong>-12% YoY<\/strong> across the EU — the manufacturing recession is ongoing.<\/p><p><strong>Hydro Balance:<\/strong> Norwegian reservoir levels at <strong>68.3%<\/strong> of capacity (▲+5.2% vs WoW), per <a href=\"https://www.nve.no/\" target=\"_blank\">NVE<\/a>. This is <strong>+8.7%<\/strong> above the 5-year average. Alpine reservoirs (France, Switzerland, Austria) at <strong>61.2%<\/strong> (▲+3.1% WoW). The spring melt has begun 2 weeks early. Hydro generation will surge in April-May, reducing gas-for-power demand.<\/p><p><strong>Wind Capacity:<\/strong> Seasonal wind generation trend is <strong>+7.3% YoY<\/strong> for April-June, according to <a href=\"https://www.ecmwf.int/\" target=\"_blank\">ECMWF<\/a> extended models. The North Sea wind farm fleet added 3.2 GW of capacity in 2025. Expect wind to cover <strong>28% of EU power demand<\/strong> in April (vs 24% average).<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>The warm weather is bearish, but everyone knows it. The market has already priced in a weak heating season. The risk is a late-April cold snap — the false spring pattern. If we get a blocking pattern reversal in late April, HDDs could spike 40% above forecast. TTF would rip €10/MWh overnight.<\/div><\/div><h3>💡 Trade Ideas<\/h3><p>1. <strong>Weather Play:<\/strong> Long TTF May 26 €45 Puts. The warm weather is in the price. Protection against a late cold snap is cheap — only €1.80/MWh premium.<\/p><p>2. <strong>Hydro-Gas Spread:<\/strong> Short TTF Q2 26 / Long Hydro Power Futures (Nordic). The correlation is negative. When hydro surges, gas drops. Play the convergence.<\/p><p>3. <strong>Volatility Trade:<\/strong> Short TTF May 26 €52-€58 Straddle. Implied vol is at 42% — too high for a market in shoulder season. Pocket the premium as range-bound trading continues.<\/p>","sig":"Sage 🦎"},{"t":"tech","badge":"📊 📦 Storage Watch","title":"EU Storage at 27.1% — Lowest Since 2021 Crisis. 70 Bcm to Inject by November 1.","hook":"EU gas storage ended March at 27.1% full (302 Bcm), the lowest end-of-winter level since 2021. The EU 90% mandate by November 1 requires <strong>70 Bcm of net injections<\/strong> — a herculean task without Russian LNG.","authorWord":"At current injection capacity (0.85 Bcm/d peak), we need 82 days of full injections. But we only have 50 days of peak injection weather before summer heat forces power burn.","author":"Blaise 🧮","details":"<p><strong>EU Storage (AGSI+):<\/strong> Total EU storage at <strong>27.1% full<\/strong> (302 Bcm), per <a href=\"https://agsi.gie.eu/\" target=\"_blank\">GIE AGSI+<\/a>. This is <strong>-12.4% below the 5-year average<\/strong> (39.5%) and <strong>-8.7% below year-ago levels<\/strong> (35.8%). Top countries: Germany at <strong>23.4%<\/strong> (▼-15.2% vs 5YA), Italy at <strong>28.7%<\/strong> (▼-10.1% vs 5YA), France at <strong>31.2%<\/strong> (▼-7.3% vs 5YA). The <strong>Netherlands<\/strong> is critical at <strong>18.9%<\/strong> — its lowest since 2021.<\/p><p><strong>US Storage (EIA):<\/strong> Working gas at <strong>1,456 Bcf<\/strong>, per <a href=\"https://www.eia.gov/naturalgas/storage/\" target=\"_blank\">EIA Weekly<\/a>. This is <strong>+2.8% above the 5-year average<\/strong> (1,416 Bcf) and <strong>+5.2% above year-ago<\/strong> (1,384 Bcf). The US is swimming in gas — hence the $2.95 price. Net withdrawals in March: <strong>-28 Bcf<\/strong> vs <strong>-142 Bcf<\/strong> 5YA.<\/p><p><strong>Trajectory:<\/strong> EU injection pace in March: <strong>+0.42 Bcm/d<\/strong> (▼-18% vs 5YA). The refill is running behind schedule. At this pace, we will only reach <strong>78%<\/strong> by November 1 — missing the mandate. To hit 90%, we need <strong>+0.65 Bcm/d<\/strong> sustained injections from April-October.<\/p><p><strong>End-of-Season Projection:<\/strong> The <strong>EU 90% by Nov 1<\/strong> mandate is in legal force, per <a href=\"https://www.consilium.europa.eu/\" target=\"_blank\">EU Council<\/a>. Current trajectory: <strong>74-76%<\/strong> by Nov 1. Gap to target: <strong>~15 Bcm<\/strong>. This will require demand destruction (coal switching) or emergency imports (spot LNG at any price).<\/p><p><strong>Days of Supply:<\/strong> At current withdrawal rates (0.85 Bcm/d), EU storage has <strong>355 days of supply<\/strong> — sounds comfortable. But we are entering injection season. The <strong>injectable volume<\/strong> is only <strong>810 Bcm<\/strong> (90% of 900 Bcm capacity). We need to fill <strong>70 Bcm<\/strong> in 7 months. That is <strong>0.33 Bcm/d<\/strong> of net injections needed — achievable but tight.<\/p><p><strong>YoY Comparison:<\/strong> Last year (Mar 31, 2025): EU storage at <strong>35.8%<\/strong>. This year: <strong>27.1%<\/strong>. We are <strong>-8.7%<\/strong> behind. The refill equation is broken three ways: lower starting point, Russian LNG ban (-14 Bcm/yr), and weak hydro/reserve buffer.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The storage panic is manufactured. 27.1% on April 1 is not a crisis — it is where we should be after a warm winter. The 90% mandate is political, not physical. If prices spike, the EU will suspend the mandate. This is not 2022. We have LNG terminals, we have coal plants, we have demand flexibility.<\/div><\/div><h3>💡 Trade Ideas<\/h3><p>1. <strong>Calendar Spread:<\/strong> Long TTF Summer 26 / Short TTF Winter 26 at €15.00. The injection squeeze will be most acute in Summer. By Winter, the mandate will either be suspended or met. Target: €22.00.<\/p><p>2. <strong>Relative Value:<\/strong> Short TTF Oct 26 / Long HH Oct 26. The EU storage gap will force TTF up, but US supply glut will keep HH flat. Play the divergence.<\/p><p>3. <strong>Options:<\/strong> Long TTF Aug 26 €55 Calls. The August injection deadline is when the storage panic peaks. If we are behind schedule by July, TTF rips €10/MWh. Premium only €2.10/MWh.<\/p>","sig":"Blaise 🧮"},{"t":"alert","badge":"📊 💣 Geopolitics & Regulation","title":"Hormuz Day 32: Closure Extends Indefinitely as Iran Demands Sovereignty. April 1 Russian LNG Ban Closes Last EU Loophole.","hook":"Iran counter-offer demanding recognition of Hormuz sovereignty has killed any near-term reopening hopes. The April 1 Russian LNG ban closes the transshipment loophole — 14 bcm/yr of spot supply is gone.","authorWord":"The EU has painted itself into a corner. Storage at 27.1%, Russian LNG banned, Hormuz closed. This is a supply shock three ways. The only question is how high TTF spikes before demand breaks.","author":"Henry 🦉","details":"<p><strong>Russia Pipeline Flows:<\/strong> <strong>TurkStream<\/strong> continues at <strong>43 mcm/d<\/strong> (15.7 bcm/yr) to Hungary and Serbia, fully exempt from sanctions. This is the <strong>last Russian gas pipeline to the EU<\/strong>. Pre-war flows via all routes were ~420 mcm/d. Transit loss via Ukraine (closed Jan 2025) and Yamal (stopped Mar 2025) totals <strong>~120 mcm/d<\/strong> (43.8 bcm/yr). Countries most exposed: <strong>Hungary<\/strong> (100% dependent on TurkStream), <strong>Serbia<\/strong> (100%), <strong>Austria<\/strong> (60% via TurkStream link).<\/p><p><strong>Hormuz/Middle East:<\/strong> <strong>Day 32 of the closure<\/strong>. The strait carries <strong>20% of global oil<\/strong> (~18 mb/d) and <strong>~25% of global LNG<\/strong> (~95 Mt/yr or 12.5 bcm/yr), per <a href=\"https://www.eia.gov/\" target=\"_blank\">EIA<\/a>. Qatar exports <strong>~77 Mt/yr<\/strong> (10.1 bcm/yr) via Hormuz — <strong>100%<\/strong> of its LNG is routed through the chokepoint. UAE exports <strong>~12 Mt/yr<\/strong> (1.6 bcm/yr). Oman: <strong>~10 Mt/yr<\/strong> (1.3 bcm/yr). Historical precedent: <strong>1984 Tanker War<\/strong> saw 3-month closures with 40% price spikes. <strong>2019 Abqaiq attack<\/strong> caused a 20% price jump in 48h before recovering in 2 weeks.<\/p><p><strong>Current Impact:<\/strong> At <strong>27.1% storage<\/strong>, EU has <strong>~73 days of supply<\/strong> at current withdrawal rates. A <strong>7-day Hormuz closure<\/strong> would strand <strong>~2.4 Mt of LNG<\/strong> (~0.3 bcm), equivalent to <strong>1.1 days<\/strong> of EU winter demand. A <strong>30-day closure<\/strong> would strand <strong>~10.4 Mt<\/strong> (~1.4 bcm) — <strong>4.8 days<\/strong> of supply. The market is pricing the tail risk, not the base case.<\/p><p><strong>EU Sanctions and LNG Ban:<\/strong> The <strong>April 1, 2026 Russian LNG ban<\/strong> prohibits spot deliveries of Russian LNG to EU terminals. Volume covered: <strong>~14 bcm/yr<\/strong> (45% of total Russian LNG imports). Long-term contracts (Shell, Total, Eni) are exempt — <strong>~17 bcm/yr<\/strong> continues. Which terminals receive Russian LNG: <strong>Zeebrugge (BE)<\/strong> (4.2 bcm/yr), <strong>Montoir (FR)<\/strong> (3.8 bcm/yr), <strong>Gate (NL)<\/strong> (2.9 bcm/yr), <strong>Brindisi (IT)<\/strong> (1.9 bcm/yr). Loophole closed: <strong>Transshipment via Rotterdam<\/strong> — previously used to re-label Russian LNG as Dutch origin — is now banned.<\/p><p><strong>Regulatory Risk:<\/strong> <strong>ETS (Emissions Trading System)<\/strong> is under political pressure to suspend the carbon price floor. If ETS is weakened from current €80/t to €60/t, the <strong>coal-gas switching price drops from €52/MWh to €42/MWh<\/strong> — bearish for gas. If the storage mandate is tightened from 90% to 95%, that adds <strong>45 TWh<\/strong> (~4.5 bcm) of injection demand — bullish.<\/p><p><strong>Political Calendar:<\/strong> <strong>April 7-10: EU Emergency Energy Council<\/strong> — leaders will vote on whether to suspend the 90% storage mandate. <strong>April 15: German coalition vote<\/strong> on extending nuclear plant lifelines (Isar 2, Emsland) — could reduce gas-for-power demand by 0.8 Bcm/mo if passed. <strong>April 28: QatarEnergy force majeure ruling<\/strong> — will determine if Ras Laffan damage (20% capacity offline) is permanent or temporary.<\/p><h3>HORMUZ SCENARIO MATRIX<\/h3><p><strong>Scenario:<\/strong> Naval drill / brief closure<br><strong>Duration:<\/strong> 6-12 hours<br><strong>Probability:<\/strong> 15%<br><strong>LNG Stranded (Mt):<\/strong> 0.2<br><strong>EU Supply Gap (GWh/d):<\/strong> 9<br><strong>TTF Impact (EUR/MWh):<\/strong> ▲+€2<br><strong>Trade Response:<\/strong> No action<br><\/p><p><strong>Scenario:<\/strong> Tactical blockade<br><strong>Duration:<\/strong> 48-72 hours<br><strong>Probability:<\/strong> 35%<br><strong>LNG Stranded (Mt):<\/strong> 1.0<br><strong>EU Supply Gap (GWh/d):<\/strong> 45<br><strong>TTF Impact (EUR/MWh):<\/strong> ▲+€5<br><strong>Trade Response:<\/strong> Buy TTF May €50 Calls<br><\/p><p><strong>Scenario:<\/strong> Extended disruption<br><strong>Duration:<\/strong> 1-2 weeks<br><strong>Probability:<\/strong> 30%<br><strong>LNG Stranded (Mt):<\/strong> 4.8<br><strong>EU Supply Gap (GWh/d):<\/strong> 215<br><strong>TTF Impact (EUR/MWh):<\/strong> ▲+€12<br><strong>Trade Response:<\/strong> Long TTF Summer/Winter spread<br><\/p><p><strong>Scenario:<\/strong> Prolonged conflict<br><strong>Duration:<\/strong> 1-3 months<br><strong>Probability:<\/strong> 20%<br><strong>LNG Stranded (Mt):<\/strong> 14.2<br><strong>EU Supply Gap (GWh/d):<\/strong> 638<br><strong>TTF Impact (EUR/MWh):<\/strong> ▲+€28<br><strong>Trade Response:<\/strong> Long TTF Win 26, Short coal<br><\/p><p><em>Historical analogy: 1984 Tanker War saw 4-month closures with 45% price spikes and 6-month recovery. 2019 Abqaiq drone attack: 20% spike in 48h, full recovery in 2 weeks.<\/em><\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>The Hormuz risk is overpriced. The 1984 analogy is flawed — today LNG market is more flexible with more supply sources. A 7-day closure would only strand 0.3 bcm — EU can cover that with storage buffers and demand response. The 20% probability tail is pricing in a 2008-style repeat. Not happening.<\/div><\/div><h3>💡 Trade Ideas<\/h3><p>1. <strong>Geopolitical Tail Risk:<\/strong> Long TTF Jul 26 €45-€70 Call Spread. Cost €2.80/MWh. Pays 10:1 if Hormuz stays closed through July and storage panic sets in.<\/p><p>2. <strong>Ban Implementation:<\/strong> Long TTF Apr 26 / Short JKM Apr 26. The EU ban only affects TTF. JKM will benefit from diverting LNG. Play the $10/MMBtu divergence.<\/p><p>3. <strong>Regulatory Hedge:<\/strong> Long TTF Oct 26 €55 Puts. If the EU suspends the storage mandate at the April 7 Council, TTF dumps €8/MWh. Protection is cheap at €1.50/MWh premium.<\/p>","sig":"Henry 🦉"},{"t":"strategy","badge":"📊 🎯 Risk Flags & Outlook","title":"Three Supply Shocks Converge — Council Validates 10 of 18 Trade Ideas","hook":"The April 1 LNG ban, Hormuz Day 32 closure, and the EU 27.1% storage hole are all converging on a market that is still pricing €48.50 gas like everything is fine. The council validated 10 trade ideas — the TTF Sum/Win spread and Winter-26 outright are highest conviction.","authorWord":"This is the calm before the storm. The physical market has not adjusted to the new supply reality yet. When it does — 2-3 weeks from now — we will look back at €48.50 as the bargain of the year.","author":"La Rédaction 🦊","details":"<h2>🚨 TOP 3 RISKS (Ranked by Probability × Impact)<\/h2><p><strong>1. Storage refill fails (40% × Critical = CRITICAL)<\/strong>: At 27.1% full, we are 14.5 points behind the 5-year average. Even normal injection rates leave us at 84% by Nov 1 — missing the mandate. Any supply disruption or cold weather and we are looking at a crisis. This is the single biggest risk.<\/p><p><strong>2. Hormuz closure extends beyond 72h (30% × High = HIGH)<\/strong>: We are at Day 32 with no end in sight. A 1-2 week closure would strand 1.2 Mt of LNG and push EU supply gap to 80 GWh/d. The tail risk (10% probability) is a 1-3 month closure — 400 GWh/d supply gap, demand rationing, TTF €65-85.<\/p><p><strong>3. Russian LNG ban creates physical shortage (25% × High = HIGH)<\/strong>: The ban is law, but the market has not adjusted. We are losing 6 bcm/yr of spot Russian LNG. Transshipment loopholes may buy time, but physics wins. Expect 2-3 weeks of chaos as cargoes reroute.<\/p><h2>🐂 BULL SCENARIO (1-2 weeks)<\/h2><p><strong>Trigger<\/strong>: Hormuz closure extends past 7 days + first signs of LNG shortage in Europe (cargoes diverted, storage injection slows).<\/p><p><strong>Price target<\/strong>: TTF to <strong>€58-65/MWh<\/strong> (+20-35% from current €48.50). JKM to <strong>$17-19/MMBtu<\/strong>. Henry Hub unmoved (decoupled).<\/p><p><strong>Catalyst sequence<\/strong>: 1. <strong>Day 7<\/strong>: Iran announces Hormuz closed indefinitely. Qatar reroutes cargoes around Cape (+14 days sailing). 2. <strong>Day 10<\/strong>: EU storage injection rate drops to +0.5%/week (vs. +1.6% required). 3. <strong>Day 14<\/strong>: TTF cracks €60 as traders realize winter refill is in jeopardy.<\/p><p><strong>CONCRETE TRADE STRUCTURE<\/strong>: <strong>Buy TTF Winter-26 €65 calls at 2.80-3.20 euros<\/strong>. This is cheap upside protection. If the bull scenario unfolds, TTF hits €70-75 and these calls are worth 8-12 euros. If not, max risk is 3.20 euros/MWh.<\/p><h2>🐻 BEAR SCENARIO (1-2 weeks)<\/h2><p><strong>Trigger<\/strong>: Hormuz reopens unexpectedly + Russian LNG finds transshipment routes + mild weather persists.<\/p><p><strong>Price target<\/strong>: TTF to <strong>€38-42/MWh<\/strong> (-20% from current €48.50). The demand destruction narrative takes hold — European industrial demand collapses at these price levels.<\/p><p><strong>Catalyst sequence<\/strong>: 1. <strong>Day 3<\/strong>: Iran signals Hormuz reopening within 48h. TTF slides 5%. 2. <strong>Day 7<\/strong>: Turkish ports handle 3 Russian LNG cargoes transshipped to EU buyers. Legal but violates ban spirit. 3. <strong>Day 14<\/strong>: Week 2-4 weather forecast revised warmer (HDD deficit deepens). TTF cracks €40.<\/p><p><strong>CONCRETE TRADE STRUCTURE<\/strong>: <strong>Sell TTF Jun-26 €55 puts at 2.50 euros<\/strong>. This is a bet that TTF stays capped at €50 due to weak demand. If TTF collapses to €38, the put is worth 17 euros (but you are short, so you lose). If TTF holds €50+, you keep the premium. Better: <strong>Buy TTF Jun-26 €48 puts / Sell TTF Jun-26 €55 puts (put spread)<\/strong> for net credit of 1.80 euros. Max risk: 5 - 1.80 = 3.20 euros. Max gain: 1.80 euros.<\/p><h2>🎲 WILD CARD SCENARIO (Low Probability / High Impact)<\/h2><p><strong>Trigger<\/strong>: <strong>Russia cuts TurkStream flows entirely<\/strong> in retaliation for the LNG ban. This removes 23.5 mcm/d (8.6 bcm/yr) of supply to Turkey, Hungary, Serbia, and Austria.<\/p><p><strong>Probability<\/strong>: 10%. But impact is catastrophic for Southeast Europe.<\/p><p><strong>Price target<\/strong>: TTF to <strong>€75-90/MWh<\/strong> (+55-85%) on panic buying. Southeast European buyers bid for any available gas.<\/p><p><strong>ASYMMETRIC TRADE<\/strong>: <strong>Buy TTF Nov-26 €80 calls at 0.80-1.00 euro<\/strong>. This is lottery-ticket cheap. If TurkStream cuts, TTF spikes to €80-90 and these calls are worth 10-15 euros. If not, max risk is 1 euro/MWh.<\/p><h2>📅 CATALYSTS TO WATCH (Next 7 Days)<\/h2><p><strong>Apr 2 (Thu)<\/strong>: EU Energy Ministers emergency meeting on storage shortfall. Could announce joint gas purchasing or demand caps. <a href=\"https://www.consilium.europa.eu\" target=\"_blank\">EU Council<\/a><\/p><p><strong>Apr 3 (Fri)<\/strong>: First weekly AGSI+ storage data post-ban. Market watching for injection rate slowdown. <a href=\"https://agsi.gie.eu\" target=\"_blank\">GIE AGSI+<\/a><\/p><p><strong>Apr 5 (Sun)<\/strong>: Iran nuclear talks resume in Vienna. Potential breakthrough on Hormuz closure. <a href=\"https://www.reuters.com\" target=\"_blank\">Reuters<\/a><\/p><p><strong>Apr 7 (Tue)<\/strong>: U.S. EIA weekly storage report. Watching for injection pace vs. normal. <a href=\"https://www.eia.gov\" target=\"_blank\">EIA<\/a><\/p><p><strong>Apr 8 (Wed)<\/strong>: OPEC+ meeting. Could discuss production cuts affecting gas-linked oil prices. <a href=\"https://www.opec.org\" target=\"_blank\">OPEC<\/a><\/p><h2>🎯 CONVICTION MATRIX (Scenarios Ranked by Probability × Conviction)<\/h2><p>Base case (mild, LNG replaces Russian): 40% prob, Low conviction (1.5x), Score 60.<\/p><p>Bull case (Hormuz 1-2w, LNG shortage): 30% prob, High conviction (4x), Score 120 (Highest conviction).<\/p><p>Bear case (Hormuz reopens, transshipment): 20% prob, Medium conviction (2x), Score 40.<\/p><p>Wild card (TurkStream cut): 10% prob, Extreme conviction (8x), Score 80.<\/p><p><strong>Insight<\/strong>: The bull case (30% probability, 4x conviction) scores higher than the base case. This means the market is underpricing tail risk. The asymmetric upside favors bullish positioning.<\/p><h2>📊 POSITIONING CONTEXT<\/h2><p><strong>Curve shape<\/strong>: TTF is in <strong>steep backwardation<\/strong> — Summer-26 at €44.80, Winter-26 at €58.30 (€13.50 calendar spread). This reflects the market view that near-term supply is adequate but winter will be tight.<\/p><p><strong>Storage<\/strong>: At 27.1% full, we are in a <strong>structural deficit<\/strong> vs. the 5-year average (41.6%). The refill math is broken — even normal injection leaves us at 84% by Nov 1.<\/p><p><strong>Weather<\/strong>: The Week 2-4 outlook is <strong>above-normal temperatures<\/strong>, reducing near-term demand but doing nothing to solve the refill deficit.<\/p><p><strong>Sentiment<\/strong>: Commercial traders are <strong>net short<\/strong> TTF futures at the highest level since November 2025. This is contrarian bullish — when everyone is positioned one way, the squeeze is violent.<\/p><h2>💡 Trade Ideas — Council Validated (10 of 18)<\/h2><p><strong>Highest Conviction (Unanimous)<\/strong>: <strong>TTF Summer-26/Winter-26 calendar spread<\/strong> — Buy at €13.50, target €18.50. The structural refill deficit makes winter gas infinitely more valuable than summer. All 7 council members approved.<\/p><p><strong>Second Highest (5-2 vote)<\/strong>: <strong>TTF Winter-26 outright long<\/strong> — Buy at €58.30, target €75. The convergence of LNG ban, Hormuz, and storage deficit makes winter TTF a coiled spring. Dissent: Dante & Felix argue demand destruction will cap prices.<\/p><p><strong>Third Highest (4-3 vote)<\/strong>: <strong>TTF May-26 €55 calls / €65 calls (call spread)<\/strong> — Buy at 1.80-2.20 euros. Cheap upside protection against Hormuz extension. Dissent: Blaise, Lyra, Dante prefer put spreads.<\/p><p><strong>Rejected (Council Eliminated 8)<\/strong>: 5 duplicate calendar spreads, 2 contradictory directionals (long/short summer), 1 incomplete structure (no strikes). The council culled aggressively for quality.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>La Rédaction is too focused on bullish tail risks. The base case (40% probability) is that LNG replaces Russian supply, Hormuz reopens, and mild weather persists. TTF at €38-42 is just as likely as €65-70. The council should have approved more bearish hedges.<\/div><\/div>","sig":"La Rédaction 🦊"},{"t":"analysis","badge":"🎲 Scénarios","title":"7 Scénarios de Marché — Votes du Conseil","hook":"TTF à €49.5 avec stockage à 27.1%, ban LNG russe imminente, et Hormuz fermé. Le marché est dans une impasse stratégique. Ces 7 scénarios tracent les chemins possibles.","authorWord":"Le conseil est divisé : 58% de probabilité de scénarios haussiers (S1+S2+S5) vs 42% de scénarios baissiers (S3+S4+S6+S7). Le point de bascule c'est le 7 avril : Conseil UE sur le mandat.","author":"Le Conseil 🎲","details":"<div class='scenario-block'>\n  <h3>S1 — Squeeze de Réapprovisionnement (Été 2026) <span class='proba'>28%<\/span><\/h3>\n  <p>Hormuz reste partiellement fermé (-30% flux LNG), la ban UE est appliquée strictement, et le stockage accuse du retard (74% en oct vs 90% mandat). <strong>Déclencheur :<\/strong> Chaudrette fin avril qui inverse la demande. <strong>Conséquence :<\/strong> TTF explose à €75/MWh en août, spread été/hiver à €22,恐慌 buying sur les cargoes spot.<\/p>\n  <p class='votes'>Apex 32% · Sage 25% · Nova 30% · Blaise 28% · Lyra 22% · Dante 18% · Felix 35%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n  <h3>S2 — Résilience Structurelle (L'Europe Tient) <span class='proba'>22%<\/span><\/h3>\n  <p>Hormuz rouvre, le charbon compense (-30% gaz-charbon switch), et la demande industrielle reste faible (-12% YoY). <strong>Déclencheur :<\/strong> Mandat de stockage suspendu le 7 avril. <strong>Conséquence :<\/strong> TTF s'effondre à €38/MWh d'ici juin, spread été/hiver se comprime à €8, coal gen fait des records.<\/p>\n  <p class='votes'>Apex 18% · Sage 28% · Nova 20% · Blaise 25% · Lyra 15% · Dante 30% · Felix 18%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n  <h3>S3 — Volatilité Extrême (Trading Range €35-€70) <span class='proba'>18%<\/span><\/h3>\n  <p>Aucune résolution claire : Hormuz ouvert/close au gré des nouvelles, mandat de stockage maintenu mais non appliqué, flux LNG erratiques. <strong>Déclencheur :<\/strong> Absence de décision claire au Conseil UE du 7 avril. <strong>Conséquence :<\/strong> TTF oscille €35-€70/MWh quotidiennement, vol implicite à 45%, les straddles sont rois.<\/p>\n  <p class='votes'>Apex 15% · Sage 18% · Nova 15% · Blaise 12% · Lyra 25% · Dante 28% · Felix 22%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n  <h3>S4 — Hiver Précoce (2026-27) <span class='proba'>12%<\/span><\/h3>\n  <p>Le remplissage échoue (stockage à 78% au 1er nov), et un hiver froid arrive en novembre. <strong>Déclencheur :<\/strong> HDD +20% au-dessus de la normale en nov-déc. <strong>Conséquence :<\/strong> TTF hiver '27 à €95/MWh, rationnement industriel, UE active les plafonds de prix.<\/p>\n  <p class='votes'>Apex 10% · Sage 12% · Nova 15% · Blaise 8% · Lyra 10% · Dante 18% · Felix 10%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n  <h3>S5 — Breakthrough Technologique (Renouvelables) <span class='proba'>8%<\/span><\/h3>\n  <p>Le printemps exceptionnel + surge hydro + solaire record réduisent drastiquement la demande gaz-électricité (-25% Q2-Q3). <strong>Déclencheur :<\/strong> Hydro à 75% des réservoirs d'ici mai, solaire +15% de capacités. <strong>Conséquence :<\/strong> TTF glisse à €32/MWh, charbon devient marginal, le spread été/hiver s'inverse (été < hiver).<\/p>\n  <p class='votes'>Apex 12% · Sage 5% · Nova 8% · Blaise 5% · Lyra 10% · Dante 2% · Felix 15%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n  <h3>S6 — Shock d'Offre Américain (GNL US) <span class='proba'>7%<\/span><\/h3>\n  <p>Une tempête majeure dans le Golfe du Mexique ou un accident sur un terminal US (Freeport/Sabine) coupe 20% des exportations US pendant 2-3 mois. <strong>Déclencheur :<\/strong> Ouragan catégorie 4 en juin-juillet. <strong>Conséquence :<\/strong> JKM explose, TTF suit à +€15/MWh, l'Europe surenchérit sur les cargoes non-US.<\/p>\n  <p class='votes'>Apex 5% · Sage 8% · Nova 5% · Blaise 10% · Lyra 8% · Dante 3% · Felix 10%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n  <h3>S7 — Récession Globale Profonde <span class='proba'>5%<\/span><\/h3>\n  <p>La crise énergétique déclenche une récession mondiale en 2026 H2. La demande industrielle gaz s'effondre de -25%. <strong>Déclencheur :<\/strong> PMI manufacturier < 45 pendant 3 mois consécutifs. <strong>Conséquence :<\/strong> TTF s'effondre à €25/MWh, le stockage se remplit sans effort, le marché structurellement survolté.<\/p>\n  <p class='votes'>Apex 8% · Sage 4% · Nova 7% · Blaise 12% · Lyra 10% · Dante 1% · Felix 0%<\/p>\n<\/div>\n\n<p class='consensus'><strong>🎯 Consensus :<\/strong> Le conseil accorde 28% au scénario de squeeze de réapprovisionnement (S1) — c'est le scénario de base. Mais la queue de distribution est lourde : S2 (22%) + S3 (18%) = 40% de scénarios de volatilité ou de baisse. Le point clé c'est le 7 avril : si l'UE suspend le mandat, on bascule vers S2. Si elle le maintient, S1 devient probable. Les trades les plus asymétriques sont S4 (12% probabilité, payoff 3x) et S1 (28% probabilité, payoff 2x).<\/p>\n\n<div class='dissent'><div class='dissent-label'>🔥 Dissent — Dante 🔥<\/div><div class='dissent-text'>Le conseil se trompe lourdement sur S1. 28% pour un squeeze de réapprovisionnement ? C'est plus comme 45%. L'histoire montre que les marchés paniquent toujours avant la réalité physique. Stockage à 27.1%, ban LNG, Hormuz fermé = powder keg. Le marché va se rendre compte en avril-mai que les injections sont insuffisantes. TTF à €75/MWh est conservateur. Moi je dis : chargez les calls calendriers été/hiver à €15. C'est le trade du siècle.<\/div><\/div>","sig":"Le Conseil 🎲"},{"t":"analysis","badge":"📊 🌍 Scénario Géopolitique","title":"7 Scénarios Géopolitiques — Votes du Conseil","hook":"Hormuz est fermé depuis 32 jours. L'ultimatum de Trump a été prolongé au 6 avril. L'UE s'apprête à voter sur la suspension du mandat de stockage. Les 3 risques convergent.","authorWord":"Le conseil est unanime sur un point : la non-linéarité du risque. Une mauvaise surprise géopolitique en avril et TTF explose. Le calme est fragile.","author":"Le Conseil 🌍","details":"<div class='scenario-block'>\n  <h3>S1 — Réouverture Diplomatique d'Hormuz <span class='proba'>25%<\/span><\/h3>\n  <p>Trump prolonge l'ultimatum au 6 avril. L'Iran accepte un protocole de \"passage sécurisé\" sous supervision onusienne en échange d'un allègement partiel des sanctions pétrolières. Le détroit rouvre en 48-72 heures. <strong>Conséquence gaz :<\/strong> Le flux LNG normal reprend, JKM baisse de $5/MMBtu, TTF perd €8/MWh sur la disparition de la prime de risque.<\/p>\n  <p class='votes'>Apex 30% · Sage 20% · Nova 25% · Blaise 22% · Lyra 28% · Dante 15% · Felix 35%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n  <h3>S2 — Fermeture Prolongée (1-3 mois) <span class='proba'>20%<\/span><\/h3>\n  <p>L'Iran rejette tout compromis sur la souveraineté d'Hormuz. Les opérations de déminage américain échouent. Les compagnies maritimes redéploient les navires vers le Cap de Bonne Espérance (+12-18 jours de trajet, +$3-5/MMBtu de fret). <strong>Conséquence gaz :<\/strong> 14.2 Mt de LNG bloqués, TTF gagne €15/MWh, JKM grimpe à $22/MMBtu.<\/p>\n  <p class='votes'>Apex 18% · Sage 22% · Nova 20% · Blaise 25% · Lyra 15% · Dante 28% · Felix 12%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n  <h3>S3 — Escalade Militaire Limitée <span class='proba'>15%<\/span><\/h3>\n  <p>Des frappes américaines ciblées sur des sites iraniens (pas les installations nucléaires) déclenchent une réponse asymétrique : attaques de drones sur des terminaux LNG qataris. <strong>Conséquence gaz :<\/strong> Panique sur le marché, TTF +€20/MWh intraday, JKM +$8/MMBtu. Les compagnies d'assurance augmentent les primes de 300%.<\/p>\n  <p class='votes'>Apex 12% · Sage 15% · Nova 18% · Blaise 10% · Lyra 18% · Dante 22% · Felix 10%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n  <h3>S4 — Suspension du Mandat de Stockage UE <span class='proba'>18%<\/span><\/h3>\n  <p>Le Conseil d'urgence de l'UE du 7 avril suspend temporairement l'objectif de 90% de stockage au 1er novembre. <strong>Conséquence gaz :<\/strong> La demande d'injection s'effondre, TTF perd €12/MWh en 48h. Le spread été/hiver se comprime de €15 à €8.<\/p>\n  <p class='votes'>Apex 20% · Sage 25% · Nova 15% · Blaise 18% · Lyra 12% · Dante 10% · Felix 28%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n <h3>S5 — Force Majeure sur Ras Laffan (Qatar) <span class='proba'>8%<\/span><\/h3>\n  <p>Le jugement du 28 avril déclare la force majeure permanente sur 20% de la capacité de Ras Laffan (dommages de guerre). <strong>Conséquence gaz :<\/strong> 15.4 Mt/an de LNG perdus à jamais, JKM grimpe structurellement de $4/MMBtu, TTF +€10/MWh sur le long terme.<\/p>\n  <p class='votes'>Apex 5% · Sage 8% · Nova 10% · Blaise 12% · Lyra 6% · Dante 15% · Felix 2%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n  <h3>S6 — Coup de Théâtre Diplomatique <span class='proba'>10%<\/span><\/h3>\n  <p>Une négociation secrète UE-Russie aboutit à un accord temporaire : prolongement de TurkStream en échange d'un cessez-le-feu en Ukraine. <strong>Conséquence gaz :<\/strong> 15.7 bcm/an de gaz russe supplémentaires, TTF -€8/MWh, le spread TTF-HKM se comprime.<\/p>\n  <p class='votes'>Apex 8% · Sage 5% · Nova 8% · Blaise 3% · Lyra 15% · Dante 5% · Felix 26%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n  <h3>S7 — Guerre Totale (Option Nucléaire) <span class='proba'>4%<\/span><\/h3>\n  <p>Trump ordonne des frappes sur des installations nucléaires iraniennes après un refus catégorique de Téhéran. L'Iran bloque 100% du détroit, mine les approches, attaque des infrastructures pétrolières saoudiennes. <strong>Conséquence gaz :<\/strong> Marché paralysé, TTF +€40/MWh, JKM +$20/MMBtu, rationnement de l'énergie en Europe déclaré.<\/p>\n  <p class='votes'>Apex 2% · Sage 2% · Nova 4% · Blaise 5% · Lyra 3% · Dante 8% · Felix 0%<\/p>\n<\/div>\n\n<p class='consensus'><strong>🎯 Consensus :<\/strong> Le conseil converge sur un risque \"bimodal\" : 43% de probabilité cumulée de scénarios positifs (S1+S4+S6 = réouverture + mandat suspendu + accord russe) vs 27% de scénarios négatifs (S2+S3+S5+S7 = fermeture prolongée + escalade + force majeure + guerre totale). Le scénario central (S1 à 25%) est la réouverture diplomatique, mais la queue de distribution est grasse.<\/p>\n\n<div class='dissent'><div class='dissent-label'>🔥 Contre-narratif — Dante 🔥<\/div><div class='dissent-text'>Le consensus se trompe. La probabilité de S2 (fermeture prolongée) est sous-estimée à 20% — c'est plus comme 35%. L'Iran ne cédera pas sur la souveraineté d'Hormuz, c'est une ligne rouge existentielle pour Mojtaba Khamenei. Et S4 (suspension du mandat) à 18% ? Optimisme délirant. L'UE ne reculera pas publiquement — politiquement suicidaire. Le vrai risque c'est S3+S7 : 15%+4% = 19% de probabilité d'escalade militaire. Le marché price un dip diplomatique (TTF €50). Moi je dis : chargez les calls sur TTF €70. On est dans le scénario fat-tail.<\/div><\/div>","sig":"Le Conseil 🌍"},{"t":"analysis","badge":"🏛️ Verdict du Conseil","title":"15 Trades Audités — 11 Retenus, 4 Éliminés","hook":"Quatre agents ont vote sur chaque trade idea de cette edition. Chaque trade est presente avec son rationale complet, les votes individuels (Iris, Dante, Felix, Lyra), et la decision finale avec la raison.","authorWord":"11 trades solides retenus. 4 elimines (doublons, parametres manquants, contradictions). Le detail de chaque verdict ci-dessous.","author":"La Rédaction 🦊","details":"<h3>✅ Trades Retenus (11/15)<\/h3><div><div><div><b>Long TTF Summer/Winter calendar spread at €15.00<\/b><span>✅✅✅✅<\/span><\/div><div>Carte price-action • T1<\/div><\/div><div>✅ Unanime (4/4)<\/div><\/div><div><div><div><b>Long TTF Dec €55 Calls / Short €70 Calls<\/b><span>✅⚠️✅✅<\/span><\/div><div>Carte price-action • T2<\/div><\/div><div>3✅ 1⚠️ — Approved - Dante suggests wider spread<\/div><\/div><div><div><div><b>Long TTF Q3/Q4 calendar spread at €12.00<\/b><span>✅❌⚠️✅<\/span><\/div><div>Carte lng-flows • T3<\/div><\/div><div>2✅ 1⚠️ 1❌ — 3 approve - Dante dissent overruled<\/div><\/div><div><div><div><b>Long JKM/Short TTF via Q3 swaps<\/b><span>✅✅✅✅<\/span><\/div><div>Carte lng-flows • T4<\/div><\/div><div>✅ Unanime (4/4)<\/div><\/div><div><div><div><b>Long EUA Dec at €62.50/t<\/b><span>⚠️❌❌✅<\/span><\/div><div>Carte power-carbon • T5<\/div><\/div><div>1✅ 1⚠️ 2❌ — Split decision - Iris/Lyra prevail<\/div><\/div>   let startY=0,axis='';
  document.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY;startTime=Date.now();deltaX=0;axis='';dragging=true;cards[cur].classList.remove('anim');},{passive:true});
  document.addEventListener('touchmove',e=>{if(!dragging)return;const dx=e.touches[0].clientX-startX;const dy=e.touches[0].clientY-startY;if(!axis){if(Math.abs(dx)>8||Math.abs(dy)>8){axis=Math.abs(dx)>Math.abs(dy)?'x':'y';}else return;}if(axis==='y')return;deltaX=dx;cards[cur].style.transform=`translate(-50%,-50%) translateX(${deltaX}px) rotate(${deltaX*0.012}deg)`;var p=Math.min(Math.abs(deltaX)/200,1);var sc=0.93+p*0.07;var op=0.4+p*0.6;var nxt=deltaX<0?cards[cur+1]:cards[cur-1];if(nxt){nxt.style.transform='translate(-50%,-50%) scale('+sc+')';nxt.style.opacity=op;}},{passive:true});
  document.addEventListener('touchend',e=>{if(!dragging)return;dragging=false;if(axis==='y'){axis='';return;}axis='';const card=cards[cur];card.classList.add('anim');if(cards[cur+1])cards[cur+1].classList.add('anim');if(cards[cur-1])cards[cur-1].classList.add('anim');const velocity=Math.abs(deltaX)/(Date.now()-startTime);const threshold=velocity>0.5?30:60;if(deltaX>threshold&&cur===0){window.location.href='../index.html';}else if(deltaX<-threshold&&cur===total-1){window.location.href='../index.html';}else if(deltaX<-threshold&&cur<total-1){cur++;update();}else if(deltaX>threshold&&cur>0){cur--;update();}else{card.style.transform='';}},{passive:true});
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&cur<total-1){cur++;update();}if(e.key==='ArrowLeft'&&cur>0){cur--;update();}});
  document.addEventListener('click',e=>{if(e.target.id==='restart')go(0);const article=e.target.closest('.home-article');if(article){const idx=parseInt(article.dataset.goto);if(!isNaN(idx))go(idx);}});
  /* === DESKTOP SPLIT-VIEW === */
  let dtShell=null, dtSelected=0;
  function buildDesktop(){
    if(dtShell)return;
    dtShell=document.createElement('div');
    dtShell.className='desktop-shell';
    // Sidebar
    const sb=document.createElement('nav');
    sb.className='dt-sidebar';
    const logoDate=DATA[0]&&DATA[0].home?`<div class="dt-logo">Gas Morning Brief</div><div class="dt-date">${DATA[0].date||'1 Avril 2026'}</div>`:`<div class="dt-logo">Gas Morning Brief</div><div class="dt-date">1 Avril 2026</div>`;
    sb.innerHTML=logoDate;
    DATA.forEach((d,i)=>{
      const item=document.createElement('div');
      item.className='dt-nav-item'+(i===0?' dt-selected':'');
      item.tabIndex=0;
      item.dataset.idx=i;
      const emoji=d.home?'📰':d.end?'✅':(d.badge||'').split(' ')[0]||'📄';
      const label=d.home?'Accueil':d.end?'Fin':(d.badge||'').split(' ').slice(1).join(' ')||'';
      const title=d.home?'Sommaire':d.end?'Briefing terminé':d.title||'';
      item.innerHTML=`<div class="dt-nav-badge">${emoji}</div><div class="dt-nav-info"><div class="dt-nav-label">${label}</div><div class="dt-nav-title">${title}</div></div><div class="dt-nav-arrow">›</div>`;
      item.addEventListener('click',()=>selectDesktop(i));
      sb.appendChild(item);
    });
    // Reader
    const rd=document.createElement('div');
    rd.className='dt-reader';
    rd.innerHTML='<div class="dt-reader-inner"></div>';
    dtShell.appendChild(sb);
    dtShell.appendChild(rd);
    document.body.appendChild(dtShell);
    selectDesktop(0);
  }
  function selectDesktop(idx){
    dtSelected=idx;
    const items=dtShell.querySelectorAll('.dt-nav-item');
    items.forEach((it,i)=>it.classList.toggle('dt-selected',i===idx));
    const d=DATA[idx];
    const inner=dtShell.querySelector('.dt-reader-inner');
    if(d.home){
      const arts=d.articles?d.articles.map(a=>`<div class="dt-nav-item" style="cursor:pointer;opacity:.7;padding:10px 14px;margin-bottom:4px;border-radius:10px;border:1px solid rgba(255,255,255,.06);" onclick="selectDesktop(${a.idx})"><div class="dt-nav-badge">${a.badge.split(' ')[0]}</div><div class="dt-nav-info"><div class="dt-nav-label">${a.badge.split(' ').slice(1).join(' ')}</div><div class="dt-nav-title">${a.title}</div></div><div class="dt-nav-arrow">›</div></div>`).join(''):'';
      inner.innerHTML=`<div class="dt-r-home-henry"><div class="label">🦊 L'Édito du Jour</div><div class="text">${d.henryWord||''}</div></div>${arts}`;
    } else if(d.end){
      inner.innerHTML=`<div style="text-align:center;padding:60px 0;"><div style="font-size:3.5rem;margin-bottom:16px;">🎉</div><h2 style="font-size:1.6rem;font-weight:800;margin-bottom:12px;">Briefing terminé !</h2><p style="color:var(--muted);font-size:1rem;margin-bottom:24px;line-height:1.5;">Vous avez parcouru le briefing du jour. À demain !</p><a href="../index.html" style="display:inline-block;padding:12px 32px;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;">📰 Toutes les éditions</a></div>`;
    } else {
      const authorHtml=d.authorWord?`<div class="dt-r-author"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author||''}</div></div>`:'';
      inner.innerHTML=`<span class="dt-r-badge ${d.t||''}">${d.badge||''}</span><h1 class="dt-r-title">${d.title||''}</h1>${authorHtml}<div class="dt-r-hook">${d.hook||''}</div><div class="dt-r-body">${d.details||''}</div><div class="dt-r-sig">Gas Morning Brief — 1 Avril 2026</div>`;
    }
    dtShell.querySelector('.dt-reader').scrollTop=0;
    // Scroll sidebar item into view
    items[idx]&&items[idx].scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  function destroyDesktop(){
    if(dtShell){dtShell.remove();dtShell=null;}
  }
  function checkDesktop(){
    if(window.innerWidth>=900){
      deck.style.display='none';
      buildDesktop();
      dtShell.style.display='';
    } else {
      if(dtShell)dtShell.style.display='none';
      deck.style.display='';
      update(false);
    }
  }
  // Keyboard nav for desktop
  document.addEventListener('keydown',e=>{
    if(window.innerWidth<900)return;
    if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();if(dtSelected<DATA.length-1)selectDesktop(dtSelected+1);}
    if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();if(dtSelected>0)selectDesktop(dtSelected-1);}
  });
  checkDesktop();window.addEventListener('resize',checkDesktop);
  // Theme toggle
  (function(){
    const btn=document.getElementById('themeToggle');
    const saved=localStorage.getItem('theme');
    if(saved==='light'){document.documentElement.classList.add('light');btn.textContent='☀️';}
    btn.addEventListener('click',()=>{
      const isLight=document.documentElement.classList.toggle('light');
      btn.textContent=isLight?'☀️':'🌙';
      localStorage.setItem('theme',isLight?'light':'dark');
    });
  })();
  </script>
</body>
</html>
