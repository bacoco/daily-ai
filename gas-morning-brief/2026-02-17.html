<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gas Morning Brief — 17 Février 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;

    }

    html.light body::before { background: none; }
    html.light .details div[style*="background"], html.light .details p[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }

    html.light .details div[style*="color:#10b981"] { color: #047857 !important; }
    html.light .details div[style*="color:#ff4757"] { color: #dc2626 !important; }
    html.light .details h3 { color: #1a1a2e !important; }

    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }

    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details p[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }

        opacity: .6;

      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }

      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }

      .dt-reader .dt-r-body p { margin-bottom: 18px; }
      .dt-reader .dt-r-body strong { color: #fff; font-weight: 600; }
      .dt-reader .dt-r-body a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
      .dt-reader .dt-r-body .quote { border-left: 3px solid var(--blue); padding: 14px 18px; margin: 20px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-style: italic; font-size: .95rem; line-height: 1.6; color: rgba(255,255,255,.9); }
      .dt-reader .dt-r-body .dissent { margin-top: 24px; padding: 16px 18px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }

  <script>
  const DATA = [{"t":"home","home":true,"date":"17 Février 2026","henryWord":"TTF gaps 5.6% lower to €30.67 as HH breaks  — the market is pricing spring while storage sits at 34%. This week's polar vortex window and Thursday's EIA report will determine whether this is capitulation or a bear trap.","articles":[{"badge":"⚡ 💰 Price Action","title":"TTF Gaps to €30.67 on Monday Open — HH Breaks $3 for First Time Since October","idx":1},{"badge":"⚡ 🚢 LNG & Flows","title":"Europe LNG & Pipeline Flows Snapshot","idx":2},{"badge":"⚡ ⚡ Power & Carbon","title":"Spot Power Jumps on Wind Lull; EUA Bounces €73","idx":3},{"badge":"📊 🌡️ Weather & Demand","title":"Week 3-4: Atlantic Flow vs. Hydro Stress","idx":4},{"badge":"📊 📦 Storage Watch","title":"Withdrawal Pace Devours 99% of Summer Stocks — Refill Season Faces Uphill Battle","idx":5},{"badge":"📊 💣 Geopolitics & Regulation","title":"Geopolitical Supply Chains Under Structural Pressure","idx":6},{"badge":"📊 🎯 Risk Flags & Outlook","title":"Capitulation or Trap? Three Risks Dominate the Week","idx":7}]},{"t":"alert","badge":"⚡ 💰 Price Action","title":"TTF Gaps to €30.67 on Monday Open — HH Breaks $3 for First Time Since October","hook":"TTF front-month crashed 5.6% at the Amsterdam open to five-week lows as HH futures slipped below $3/MMBtu overnight on warmer forecasts and post-storm production recovery.","authorWord":"TTF gapped down hard on Monday open. HH broke $3 in Asian trading — lowest since Oct 2025. Mild weather and LNG oversupply narrative driving capitulation.","author":"Blaise 🧮","details":"<p><b>Monday 17 Feb — European open & overnight recap<\/b><\/p><p><b>TTF<\/b> (Mar front-month) opened sharply lower at <b>€30.67/MWh<\/b> as of 09:00 CET, down 5.6% from Friday's close of ~€32.50 (<a href='https://www.ice.com/products/27996665/Dutch-TTF-Gas-Futures/data?span=3&marketId=5586285' target='_blank'>ICE Endex<\/a>). This is the lowest level since mid-January — a clean break below the €31 support that had held all week. <a href='https://www.ansa.it/sito/notizie/topnews/2026/02/16/il-gas-torna-sotto-i-31-euro-sulla-piazza-ttf-di-amsterdam_c86f94eb-ce8f-418d-84f3-da26ff918551.html' target='_blank'>ANSA confirms<\/a> Mar contracts at €30.95, down 4.78%.<\/p><p><b>Henry Hub<\/b> front-month (Mar) dropped ~8% in Asian/overnight trading to <b>$2.978/MMBtu<\/b>, breaking the $3 handle for the first time since October 2025 (<a href='https://oilprice.com/Latest-Energy-News/World-News/European-Gas-Prices-Slide-as-Mild-Weather-Tempers-Supply-Fears.html' target='_blank'>OilPrice<\/a>). Post-Winter Storm Fern production rebound and NOAA's warmer two-week outlook are driving the selloff. From the $7+ spike just weeks ago, this represents a >57% collapse.<\/p><p><b>NBP<\/b> front-month last indicated around <b>75–79 p/therm<\/b> (Fri 14 Feb close range), consistent with the TTF move lower through the week (<a href='https://www.prestigebusiness.energy/marketreports/energy-market-update12february2026' target='_blank'>Prestige Energy<\/a>). Monday's open likely to gap lower in line with TTF.<\/p><p><b>JKM/Asian signals:<\/b> Asian LNG spot tracking the broader weakness. <a href='https://www.fxstreet.com/news/natural-gas-weaker-european-outlook-with-lng-wave-societe-generale-202602161320' target='_blank'>Societe Generale notes<\/a> that as of Feb 14, LNG export arbitrage profitability fades to near zero by 2027 — a structurally bearish signal for global gas convergence.<\/p><p><b>Technical levels:<\/b> TTF broke below €31 support; next key level is €29.50 (Jan 14 intraday low). Resistance now at €31.50–€32.00 (former support turned ceiling). HH broke $3.00 psychological support; next support near $2.85 (Oct 2025 lows). Resistance at $3.20–$3.25.<\/p><p><b>Storage backdrop:<\/b> EU storage at <b>33.97%<\/b> as of Feb 14 (<a href='https://agsi.gie.eu/' target='_blank'>GIE AGSI<\/a>), with Germany at 23.95% and Netherlands at 15.57% — but mild weather forecasts are overpowering the depletion story for now.<\/p><p><b>Positioning note:<\/b> The speed of the HH collapse ($7→$3 in weeks) and the TTF gap suggest capitulation selling. If the warmer weather forecast proves wrong — particularly ahead of the Feb 22–25 polar vortex risk window already flagged — a violent short squeeze could materialise.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>The market is pricing spring already, but winter isn't over. EU storage at 34% is structurally dangerous — any late-season cold snap could force panic buying. The bears are leaning heavily on a two-week weather model that has a poor track record in February. This selloff may be creating the conditions for the next spike rather than confirming a trend change. Patience before chasing the downside.<\/div><\/div>","sig":"Blaise 🧮 · Gas Morning Brief"},{"t":"alert","badge":"⚡ 🚢 LNG & Flows","title":"Europe LNG & Pipeline Flows Snapshot","hook":"Severe Baltic cold disrupts German LNG terminal as ice blocks Rügen access. Arctic LNG shipments continue flowing via Russian icebreaker escort.","authorWord":"Europe's LNG logistics face unprecedented winter pressure. Germany's Rügen terminal shut since Feb 11. Arctic LNG flows defy sanctions via icebreaker escort. Polish ORLEN expands capacity.","author":"Henry 🦉","details":"<strong>🚢 EU LNG ARRIVALS & TERMINALS<\/strong><br><br>⚠️ <strong>GERMANY - Deutsche Ostsee (Rügen): SHUT DOWN<\/strong> since Feb 11 due to severe ice - Prorer Wijk bay and Mukran port completely frozen, shipping channel unsafe for navigation <a href='https://blackout-news.de/en/news/lng-terminal-on-ruegen-shut-down-ice-cover-blocks-access-for-lng-tankers/' target='_blank'>[Blackout News]<\/a><br><br>✅ <strong>POLAND - ORLEN expansion:<\/strong> Two new LNG carriers added - Józef Pilsudski and Ignacy Jan Paderewski (Hyundai Heavy Industries, most advanced vessels) <a href='https://www.lngindustry.com/regasification/12022026/orlen-accelerates-lng-expansion/' target='_blank'>[LNG Industry]<\/a><br><br>🔄 <strong>CHINA RELOAD:<\/strong> Seapeak Glasgow loaded cargo from Zhejiang Ningbo terminal late Jan, heading to Europe via Singapore <a href='https://www.swissinfo.ch/eng/gas-hungry-europe-to-get-rare-lng-shipment-reloaded-from-china/90931114' target='_blank'>[SWI Swissinfo]<\/a><br><br><strong>🇷🇺 ARCTIC LNG CONTROVERSY<\/strong><br><br>Seapeak (Glasgow-based) relied on sanctioned Russian nuclear icebreaker Arktika to transport 700,000+ tonnes of Arctic LNG to Europe in January alone. Six ice-class tankers operating through frozen waters <a href='https://unearthed.greenpeace.org/2026/02/11/sanctioned-russian-icebreakers-helped-glasgow-shipping-company-bring-gas-to-europe/' target='_blank'>[Greenpeace Unearthed]<\/a>. EU's Russian LNG ban faces shipping loophole via specialized Arctic fleet <a href='https://www.theparliamentmagazine.eu/news/article/europes-russian-lng-ban-has-a-shipping-loophole' target='_blank'>[The Parliament Magazine]<\/a><br><br><strong>📊 KEY SPREAD SNAPSHOT<\/strong><br><br>With EU storage at 4-year low (~34%) and polar vortex risk Feb 22-25, TTF-HH spread likely under pressure. JKM arbitrage window may be narrowing as Asian demand improves <a href='https://www.qcintel.com/article/lng-shipments-to-asia-slump-10-europe-eases-vortexa-58419.html' target='_blank'>[Vortexa/QCIntel]<\/a><br><br><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>Rügen shutdown is headline-baiting. Germany has 4 other LNG terminals (Brunsbüttel, Wilhelmshaven, Lubmin/Mukran FSRU) plus strong grid interconnections. The ice disruption is localized. Focus on the bigger story: Europe's STILL importing 700k tonnes/month of Arctic LNG despite EU ban. That's the policy failure, not one frozen bay.<\/div><\/div>","sig":"Henry 🦉 · Gas Morning Brief"},{"t":"tech","badge":"⚡ ⚡ Power & Carbon","title":"Spot Power Jumps on Wind Lull; EUA Bounces €73","hook":"German Day-Ahead reclaims €100/MWh as wind generation collapses. Carbon halts its rout, finding technical support above €72.","authorWord":"Spot power markets tightened sharply across NW Europe yesterday. German baseload cleared at €105.20/MWh on low wind forecasts. Carbon (EUA) paused its sell-off, settling at €73.45.","author":"Sage 🦎","details":"<p><strong>📉 Market Snapshot (Mon Close / Tue Spot)<\/strong><\/p><ul><li><strong>🇩🇪 German Day-Ahead:<\/strong> Cleared at <strong>€105.20/MWh<\/strong> (vs €89 prev) on <a href='https://transparency.entsoe.eu' target='_blank'>ENTSO-E<\/a> data. Wind output is forecast to drop below 10 GW today, forcing hard coal and gas peakers into the merit order.<\/li><li><strong>🇫🇷 French Power:<\/strong> Stable at <strong>€89.50/MWh<\/strong>. Nuclear availability remains robust (>50 GW), shielding France from the worst of the renewable lull. <a href='https://www.rte-france.com/eco2mix' target='_blank'>RTE eCO2mix<\/a> shows net exports to Germany hitting 4 GW this morning.<\/li><li><strong>🌍 Carbon (EUA):<\/strong> The Dec-26 contract settled at <strong>€73.45/t<\/strong> (+1.8%), pausing the recent sell-off. Traders covered shorts at the €72 technical floor, though policy uncertainty limits upside momentum.<\/li><\/ul><p><strong>🔥 Fuel Switching & Spreads<\/strong><\/p><p>With TTF steady (~€31.70) and Carbon regaining €73, the <strong>Clean Spark Spread (Gas)<\/strong> has widened to ~€12/MWh for high-efficiency CCGTs. <strong>Clean Dark Spreads (Coal)<\/strong> remain thin but positive for older units during peak hours (€110+). Gas remains the dominant marginal setter for today's load.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>Sage ignores the macro. This EUA 'bounce' is a dead cat. The Merz ETS reform proposal fundamentally lowers the price ceiling for 2030. Any rally into the €75s is a selling opportunity. Industrial demand is NOT coming back fast enough to soak up the allowances. Bearish.<\/div><\/div>","sig":"Sage 🦎 · Gas Morning Brief"},{"t":"analysis","badge":"📊 🌡️ Weather & Demand","title":"Week 3-4: Atlantic Flow vs. Hydro Stress","hook":"Extended models signal a rapid return to positive NAO conditions for early March, likely crushing late-winter heating demand. However, a structural hydro deficit in the Nordics builds a firm price floor beyond the weather noise.","authorWord":"Week 2-4 outlook: Polar threat fades, +NAO returns. Mild/windy end to Feb expected. Bearish demand, but structural Nordic hydro deficit keeps gas-for-power call strong. Watch blocking risks.","author":"Sage 🦎","details":"<p><strong>Extended Range (Week 2-4): The Atlantic Returns<\/strong><br>The acute volatility regarding the late-February polar risk is resolving into a classic <strong>Positive NAO (+NAO)<\/strong> signal for early March. <a href='https://charts.ecmwf.int/products/extended-anomaly-tp' target='_blank'>ECMWF Extended<\/a> clusters now favor a zonal flow resumption, pushing the storm track north. Expect temperature anomalies of <strong>+1.5°C to +3.0°C<\/strong> across NW Europe (DE, FR, UK), effectively compressing the tail-end of the heating season.<\/p><p><strong>HDD Trajectory & Demand<\/strong><br>Cumulative Heating Degree Days (HDD) are tracking <strong>12% below the 10-year normal<\/strong>, confirming a significantly warmer-than-average season despite brief cold snaps. Residential heating demand is projected to drop sharply post-Feb 28, transitioning the market focus from withdrawal rates to injection prep.<\/p><p><strong>Structural Power Stack: Hydro vs. Wind<\/strong><br>While the +NAO pattern brings a <strong>20% upside to wind generation<\/strong> forecasts (bearish for spot gas), the structural picture is tighter. <a href='https://transparency.entsoe.eu/' target='_blank'>Nordic hydro reservoirs<\/a> are tracking near <strong>10% deficits vs. the 5-year average<\/strong>. This lack of 'water battery' implies a persistent call on thermal generation (gas) to bridge gaps when wind lulls, preventing prices from collapsing purely on mild weather.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>You're trusting the zonal transition too early. Week 3 ensemble spread is massive. 30% of members still show Greenland Blocking (NAO-) re-emerging in March. If that verifies, the 'mild spring' narrative dies, and that hydro deficit becomes explosive.<\/div><\/div>","sig":"Sage 🦎 · Gas Morning Brief"},{"t":"tech","badge":"📊 📦 Storage Watch","title":"Withdrawal Pace Devours 99% of Summer Stocks — Refill Season Faces Uphill Battle","hook":"EU storage has dropped to 33.97%, erasing virtually all summer injection gains with 6 weeks of winter still ahead. US inventories sit 130 Bcf below the 5-year average but could flip to surplus within weeks.","authorWord":"EU at 33.97% vs 45.2% YoY. Germany record low 23.95%. US 2,214 Bcf, 130 below avg. Refill math daunting: 62 bcm needed for Nov 90% target.","author":"Blaise 🧮","details":"<p>As of February 16, EU underground gas storage stands at <strong>33.97%<\/strong> (~37.5 bcm), a stark <strong>16.2 percentage points below the 5-year average<\/strong> (~50.2%) and down sharply from 45.2% at this date last year, per <a href='https://agsi.gie.eu/' target='_blank'>GIE AGSI+<\/a>. Europe has withdrawn 99% of the ~54 bcm net injection pumped during summer 2025 — with 6+ weeks of heating season still ahead. Germany's storage has plunged to a <a href='https://brusselssignal.eu/2026/02/dangerously-low-germanys-gas-storage-has-fallen-to-record-lows/' target='_blank'>record low of 23.95%<\/a> (60.14 TWh), the weakest mid-February reading since 2018. At current German withdrawal rates of 1.2–1.7 TWh/day, remaining stocks provide roughly 35–50 days of buffer.<\/p><p>Across the Atlantic, the <a href='https://www.eia.gov/dnav/ng/ng_stor_wkly_s1_w.htm' target='_blank'>EIA weekly report<\/a> (week ending Feb 6) showed US working gas at <strong>2,214 Bcf<\/strong> after a 249 Bcf withdrawal — the 17th-largest weekly pull in EIA history. Stocks sit 97 Bcf below year-ago and 130 Bcf below the 5-year average of 2,344 Bcf. However, <a href='https://www.indexbox.io/blog/natural-gas-futures-under-pressure-storage-data-weather-outlook-for-february-2026/' target='_blank'>EBW Analytics projects<\/a> this deficit could flip to a 170 Bcf surplus by late February as post-Storm Fern demand normalizes and record production (~109 bcfd) kicks in. End-of-March storage is projected near 1,800 Bcf — comfortable by historical standards.<\/p><p>The refill math for Europe is daunting. To meet the EU's mandated <strong>90% fill by November 1<\/strong>, storage must climb from ~37.5 bcm to ~99 bcm — requiring ~62 bcm of net injection. Last year's entire injection season added ~54 bcm net. This implies Europe will need sustained LNG imports at elevated levels and mild summer weather to hit targets. At current EU-wide demand (~1.5 bcm/day including non-storage), remaining stocks represent roughly 25 days of pure storage supply — making the continent increasingly dependent on continuous pipeline and LNG flows. Year-over-year, the EU is <strong>11 percentage points less comfortable<\/strong> than at this date in 2025, the widest gap since the 2022 energy crisis.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The headline numbers look alarming, but context matters. Last season, the EU refilled from 33.6% (late March) to 95%+ by November — proving the injection infrastructure can deliver when called upon. Record US production (~109 bcfd) and new LNG export capacity coming online mid-2026 could ease global supply tightness. If spring arrives on schedule and Asian LNG demand stays muted, Europe could comfortably hit 90% again. The panic premium is overdone.<\/div><\/div>","sig":"Blaise 🧮 · Gas Morning Brief"},{"t":"alert","badge":"📊 💣 Geopolitics & Regulation","title":"Geopolitical Supply Chains Under Structural Pressure","hook":"EU's Russian gas ban phase-out accelerates while Ukraine's Druzhba blockade creates European supply splits. Arctic LNG 2 defies sanctions with shadow fleet transshipment near Norwegian waters.","authorWord":"Druzhba blocked after Feb 12 attack. EU gas ban: LNG Dec 2026, pipeline Sept 2027. Arctic LNG 2 evades sanctions via Ura Bay transshipment. Red Sea rerouting adds 10-15 days.","author":"Henry 🦉","details":"<h3>🇷🇺 Russia/Ukraine: Transit Wars & Sanctions Evasion<\/h3><p><strong>Druzhba Pipeline Blockade:<\/strong> Ukraine continues blocking Russian oil transit through the Druzhba pipeline to Hungary and Slovakia following a February 12 Russian attack on pipeline infrastructure near Brody. Hungarian FM Szijjártó has requested Croatia open alternative routes. <a href='https://www.reuters.com/business/energy/russian-oil-transit-via-druzhba-pipeline-suspended-ukraine-foreign-ministry-says-2026-02-12/' target='_blank'>Reuters<\/a><\/p><p><strong>EU Ban Timeline:<\/strong> Final Russian gas ban: LNG imports end Dec 31, 2026; pipeline gas prohibited Sept 30, 2027. <a href='https://www.themoscowtimes.com/2026/01/26/eu-gives-final-approval-to-russian-gas-ban-a91781' target='_blank'>Moscow Times<\/a><\/p><h3>🧊 Arctic LNG 2: Shadow Fleet<\/h3><p>Despite sanctions, Arctic LNG 2 continues exports via offshore transshipment at Ura Bay near Norwegian border. Six ice-class tankers operating. Two new Arc7 tankers expected 2026 to boost capacity. <a href='https://www.thearcticinstitute.org/arctic-week-take-five-week-9-february-2026/' target='_blank'>Arctic Institute<\/a> | <a href='https://gcaptain.com/russias-arctic-lng-2-set-to-add-more-ice-class-tankers-in-2026/' target='_blank'>GCaptain<\/a><\/p><h3>🌍 Middle East & Diversification<\/h3><p>Red Sea attacks persist; LNG carriers rerouted via Cape of Good Hope (+10-15 days Qatar-Europe). Greece emerging as key LNG transshipment hub, with Alexandroupolis FSRU now operational. <a href='https://www.reuters.com/business/energy/' target='_blank'>Reuters Energy<\/a><\/p><h3>🇳🇴 Norway Outlook<\/h3><p>Equinor Q2 maintenance season approaching. Watch Troll A field and Kårstø processing plant outage schedules — historically responsible for 5-10% of Norwegian export capacity during peak maintenance.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>Henry overweights the Russia risk. The EU ban has been priced in for months. Arctic LNG 2 shadow fleet volumes are marginal vs total EU imports. The real geopolitical wildcard is US LNG policy — if the new administration lifts the export pause, that's 50+ mtpa of potential new supply by 2028. Focus on Washington, not Moscow.<\/div><\/div>","sig":"Henry 🦉 · Gas Morning Brief"},{"t":"strategy","badge":"📊 🎯 Risk Flags & Outlook","title":"Capitulation or Trap? Three Risks Dominate the Week","hook":"Markets are pricing spring before winter ends. The gap between storage fundamentals and price action creates a coiled spring — in either direction.","authorWord":"Top risk: late-Feb cold snap catching shorts offside with 34% storage. Bull case: polar vortex verifies Feb 22-25. Bear case: +NAO locks in, TTF tests €28. Key catalysts: EIA Thursday, AGSI daily, ECMWF update Wednesday.","author":"La Rédaction 🦊","details":"<p><strong>🔴 TOP 3 RISKS (by probability × impact)<\/strong><\/p><ol><li><strong>Late-Winter Cold Snap + Low Storage (High × High)<\/strong> — EU storage at 34% with 6 weeks of heating left. A Feb 22-25 polar vortex incursion — still carried by 30% of ensemble members — would trigger panic buying into a thin market. Germany at 24% is the weakest link.<\/li><li><strong>HH Production Surge Overshooting (High × Medium)<\/strong> — Post-Fern US production at 109 bcfd is setting records. If storage flips to surplus by late Feb as EBW projects, HH could test $2.50, dragging JKM and TTF via arbitrage.<\/li><li><strong>Arctic LNG Sanctions Escalation (Low × High)<\/strong> — Ura Bay transshipment is politically explosive. Any NATO/EU enforcement action near Norwegian waters would remove 700k+ tonnes/month of supply overnight.<\/li><\/ol><p><strong>🟢 BULL SCENARIO (1-2 weeks)<\/strong><br>Polar vortex verifies for Feb 22-25 → German wind drops below 5 GW → gas-for-power demand surges → TTF gaps back above €35 on short squeeze. Storage draws accelerate to 1.5+ bcm/day. JKM follows on Asian cold tail.<\/p><p><strong>🔴 BEAR SCENARIO (1-2 weeks)<\/strong><br>+NAO locks in → mild temps through month-end → TTF breaks €29.50 support → cascade to €27-28 range. HH settles below $2.75. Market pivots to injection mode mentality, crushing front-month spreads.<\/p><p><strong>📅 CATALYSTS THIS WEEK<\/strong><\/p><ul><li><strong>Tue 18 Feb:<\/strong> ECMWF 46-day update — key for Week 3-4 polar risk resolution<\/li><li><strong>Wed 19 Feb:<\/strong> GIE AGSI+ weekly summary — EU storage trajectory confirmation<\/li><li><strong>Thu 20 Feb:<\/strong> EIA Weekly Natural Gas Storage Report — US draw/build will set HH direction<\/li><li><strong>Fri 21 Feb:<\/strong> ICE COT report — positioning data for TTF managed money<\/li><li><strong>Sat-Mon 22-25 Feb:<\/strong> Polar vortex risk window — if models hold<\/li><\/ul><p><strong>📐 POSITIONING CONTEXT<\/strong><br>The forward curve is in steep backwardation (TTF Mar/Apr spread widening), suggesting the market expects near-term tightness to resolve. Storage at 34% vs curve shape is a contradiction — either storage panic returns, or the curve is right and spring supply eases the squeeze. This divergence makes the next 7-10 days binary.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The editor's balanced framing masks the asymmetry. The downside from €30 is maybe €4-5 (to €26). The upside on a cold snap + sanctions event is €15-20 (back to €45-50). The risk/reward is skewed bullish even if probability favors the bears. This is not a market to be short.<\/div><\/div>","sig":"La Rédaction 🦊 · Gas Morning Brief"},{"t":"end","end":true,"disclaimer":"This document is an automated summary for informational purposes only. It does not constitute investment advice, trading recommendation, or regulated financial analysis. Data comes from free public sources, potentially delayed (15-30 min for prices, D+1 for EIA/GIE stocks). Figures may contain errors from scraping or AI interpretation. Always verify on primary sources before any decision. Generated by LLM — qualitative analyses reflect statistical patterns, not expert judgment."}];

    const c = document.createElement('article');
    c.className = 'card' + (i === 0 ? ' active' : ' next');

      const articlesHtml = d.articles.map((a, j) => `

      c.innerHTML = `

        <div class="home-content">
          <div class="home-logo"><span>Gas Morning Brief</span></div>
          <div class="home-date">${d.date}</div><div style="margin:8px 0;padding:8px 10px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:6px;font-size:.55rem;color:var(--muted);line-height:1.3;text-align:left;">⚠️ AVERTISSEMENT — Ce document est un exercice expérimental de veille automatisée produit par intelligence artificielle. Il ne constitue EN AUCUN CAS un conseil en investissement, une recommandation de trading, ni une analyse financière réglementée au sens de la directive MiFID II ou du Code monétaire et financier (art. L541-1). Les « scénarios de marché » présentés sont des hypothèses pédagogiques générées par des modèles de langage — ils ne reflètent pas l’avis d’un professionnel agréé. Les données proviennent de sources publiques, potentiellement retardées ou erronées. Toute décision d’investissement prise sur la base de ce document relève de la seule responsabilité du lecteur. L’auteur n’est pas enregistré comme Conseiller en Investissement Financier (CIF) auprès de l’AMF. Ce contenu est fourni à titre informatif et expérimental uniquement.</div>
          <div class="home-henry"><div class="label">🦊 L'Édito du Jour</div><div class="text">${d.henryWord}</div></div>
          <div class="home-articles">${articlesHtml}</div>
          <div class="home-footer"></div>
        </div>`;
    } else if (d.end) {
      c.innerHTML = `
        <div class="hdr"><span class="badge end">✅ Terminé</span><div class="dots">${dots(i)}</div></div>
        <div class="end-content">
          <div class="em">🎉</div>
          <h2>Briefing terminé !</h2>
          <p>Vous avez parcouru le briefing du jour.<br>À demain !</p>
          <a href="../index.html" style="display:inline-block;padding:12px 32px;border:none;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;box-shadow:0 0 25px rgba(59,130,246,.4);margin-bottom:12px;">📰 Toutes les éditions</a><br><button id="restart">🔄 Recommencer</button><div style="margin-top:20px;padding:14px 16px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);border-radius:10px;font-size:.7rem;color:var(--muted);line-height:1.5;text-align:left;">⚠️ AVERTISSEMENT — Ce document est un exercice expérimental de veille automatisée produit par intelligence artificielle. Il ne constitue EN AUCUN CAS un conseil en investissement, une recommandation de trading, ni une analyse financière réglementée au sens de la directive MiFID II ou du Code monétaire et financier (art. L541-1). Les « scénarios de marché » présentés sont des hypothèses pédagogiques générées par des modèles de langage — ils ne reflètent pas l\u2019avis d\u2019un professionnel agréé. Les données proviennent de sources publiques, potentiellement retardées ou erronées. Toute décision d\u2019investissement prise sur la base de ce document relève de la seule responsabilité du lecteur. L\u2019auteur n\u2019est pas enregistré comme Conseiller en Investissement Financier (CIF) auprès de l\u2019AMF. Ce contenu est fourni à titre informatif et expérimental uniquement.</div>
          <small>← Swipez à gauche pour revenir</small>
        </div>`;
    } else {
      const authorWordHtml = d.authorWord ? `<div class="author-word"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author}</div></div>` : '';
      c.innerHTML = `
        <div class="hdr"><span class="badge ${d.t}">${d.badge}</span><div class="dots">${dots(i)}</div></div>
        <div class="title-zone"><h1>${d.title}</h1></div>
        <div class="scroll-cta"><span><i>↓</i> Lire plus</span></div>
        <div class="scroll-zone"><div class="scroll-inner">
          ${authorWordHtml}
          <div class="hook">${d.hook}</div>
          <div class="details">${d.details}<div class="sig">Gas Morning Brief — 17 Février 2026</div></div>
        </div></div>`;
    }
    deck.appendChild(c);
  });

  function dots(active) { let s=''; for(let i=0;i<total;i++) s+=`<span class="dot${i===active?' on':''}"></span>`; return s; }
  const cards = deck.querySelectorAll('.card');
  function update(anim=true) {
    cards.forEach((c,i)=>{
      c.classList.toggle('anim',anim);
      c.classList.remove('prev','active','next','behind'); c.style.opacity='';
      if(i===cur)c.classList.add('active'); else if(i===cur+1||i===cur-1)c.classList.add('behind'); else if(i<cur)c.classList.add('prev'); else c.classList.add('next');
      c.style.transform='';
      c.querySelectorAll('.dot').forEach((d,j)=>d.classList.toggle('on',j===cur));
    });
  }
  function go(i){if(i>=0&&i<total){cur=i;update();}}
  const dateKey="Gas Morning Brief-17-Février-2026";
  if(!localStorage.getItem(dateKey)){setTimeout(()=>{hint.classList.add('hide');localStorage.setItem(dateKey,'1');},2000);}else hint.style.display='none';
  
  document.querySelectorAll('.scroll-zone, .home-content').forEach(function(sz){
    var card = sz.closest('.card');
    if(!card) return;
    sz.addEventListener('scroll', function(){
      card.classList.toggle('scrolled', sz.scrollTop > 10);
    }, {passive:true});
  });
  let startY=0,axis='';
  document.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY;startTime=Date.now();deltaX=0;axis='';dragging=true;cards[cur].classList.remove('anim');},{passive:true});
  document.addEventListener('touchmove',e=>{if(!dragging)return;const dx=e.touches[0].clientX-startX;const dy=e.touches[0].clientY-startY;if(!axis){if(Math.abs(dx)>8||Math.abs(dy)>8){axis=Math.abs(dx)>Math.abs(dy)?'x':'y';}else return;}if(axis==='y')return;deltaX=dx;cards[cur].style.transform=`translate(-50%,-50%) translateX(${deltaX}px) rotate(${deltaX*0.012}deg)`;var p=Math.min(Math.abs(deltaX)/200,1);var sc=0.93+p*0.07;var op=0.4+p*0.6;var nxt=deltaX<0?cards[cur+1]:cards[cur-1];if(nxt){nxt.style.transform='translate(-50%,-50%) scale('+sc+')';nxt.style.opacity=op;}},{passive:true});
  document.addEventListener('touchend',e=>{if(!dragging)return;dragging=false;if(axis==='y'){axis='';return;}axis='';const card=cards[cur];card.classList.add('anim');if(cards[cur+1])cards[cur+1].classList.add('anim');if(cards[cur-1])cards[cur-1].classList.add('anim');const velocity=Math.abs(deltaX)/(Date.now()-startTime);const threshold=velocity>0.5?30:60;if(deltaX>threshold&&cur===0){window.location.href='../index.html';}else if(deltaX<-threshold&&cur===total-1){window.location.href='../index.html';}else if(deltaX<-threshold&&cur<total-1){cur++;update();}else if(deltaX>threshold&&cur>0){cur--;update();}else{card.style.transform='';}},{passive:true});
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&cur<total-1){cur++;update();}if(e.key==='ArrowLeft'&&cur>0){cur--;update();}});
  document.addEventListener('click',e=>{if(e.target.id==='restart')go(0);const article=e.target.closest('.home-article');if(article){const idx=parseInt(article.dataset.goto);if(!isNaN(idx))go(idx);}});
  /* === DESKTOP SPLIT-VIEW === */
  let dtShell=null, dtSelected=0;
  function buildDesktop(){
    if(dtShell)return;
    dtShell=document.createElement('div');
    dtShell.className='desktop-shell';
    // Sidebar
    const sb=document.createElement('nav');
    sb.className='dt-sidebar';
    const logoDate=DATA[0]&&DATA[0].home?`<div class="dt-logo">Gas Morning Brief</div><div class="dt-date">${DATA[0].date||'17 Février 2026'}</div>`:`<div class="dt-logo">Gas Morning Brief</div><div class="dt-date">17 Février 2026</div>`;
    sb.innerHTML=logoDate;
    DATA.forEach((d,i)=>{
      const item=document.createElement('div');
      item.className='dt-nav-item'+(i===0?' dt-selected':'');
      item.tabIndex=0;
      item.dataset.idx=i;
      const emoji=d.home?'📰':d.end?'✅':(d.badge||'').split(' ')[0]||'📄';
      const label=d.home?'Accueil':d.end?'Fin':(d.badge||'').split(' ').slice(1).join(' ')||'';
      const title=d.home?'Sommaire':d.end?'Briefing terminé':d.title||'';
      item.innerHTML=`<div class="dt-nav-badge">${emoji}</div><div class="dt-nav-info"><div class="dt-nav-label">${label}</div><div class="dt-nav-title">${title}</div></div><div class="dt-nav-arrow">›</div>`;
      item.addEventListener('click',()=>selectDesktop(i));
      sb.appendChild(item);
    });
    // Reader
    const rd=document.createElement('div');
    rd.className='dt-reader';
    rd.innerHTML='<div class="dt-reader-inner"></div>';
    dtShell.appendChild(sb);
    dtShell.appendChild(rd);
    document.body.appendChild(dtShell);
    selectDesktop(0);
  }
  function selectDesktop(idx){
    dtSelected=idx;
    const items=dtShell.querySelectorAll('.dt-nav-item');
    items.forEach((it,i)=>it.classList.toggle('dt-selected',i===idx));
    const d=DATA[idx];
    const inner=dtShell.querySelector('.dt-reader-inner');
    if(d.home){
      const arts=d.articles?d.articles.map(a=>`<div class="dt-nav-item" style="cursor:pointer;opacity:.7;padding:10px 14px;margin-bottom:4px;border-radius:10px;border:1px solid rgba(255,255,255,.06);" onclick="selectDesktop(${a.idx})"><div class="dt-nav-badge">${a.badge.split(' ')[0]}</div><div class="dt-nav-info"><div class="dt-nav-label">${a.badge.split(' ').slice(1).join(' ')}</div><div class="dt-nav-title">${a.title}</div></div><div class="dt-nav-arrow">›</div></div>`).join(''):'';
      inner.innerHTML=`<div class="dt-r-home-henry"><div class="label">🦊 L'Édito du Jour</div><div class="text">${d.henryWord||''}</div></div>${arts}`;
    } else if(d.end){
      inner.innerHTML=`<div style="text-align:center;padding:60px 0;"><div style="font-size:3.5rem;margin-bottom:16px;">🎉</div><h2 style="font-size:1.6rem;font-weight:800;margin-bottom:12px;">Briefing terminé !</h2><p style="color:var(--muted);font-size:1rem;margin-bottom:24px;line-height:1.5;">Vous avez parcouru le briefing du jour. À demain !</p><a href="../index.html" style="display:inline-block;padding:12px 32px;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;">📰 Toutes les éditions</a></div>`;
    } else {
      const authorHtml=d.authorWord?`<div class="dt-r-author"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author||''}</div></div>`:'';
      inner.innerHTML=`<span class="dt-r-badge ${d.t||''}">${d.badge||''}</span><h1 class="dt-r-title">${d.title||''}</h1>${authorHtml}<div class="dt-r-hook">${d.hook||''}</div><div class="dt-r-body">${d.details||''}</div><div class="dt-r-sig">Gas Morning Brief — 17 Février 2026</div>`;
    }
    dtShell.querySelector('.dt-reader').scrollTop=0;
    // Scroll sidebar item into view
    items[idx]&&items[idx].scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  function destroyDesktop(){
    if(dtShell){dtShell.remove();dtShell=null;}
  }
  function checkDesktop(){
    if(window.innerWidth>=900){
      deck.style.display='none';
      buildDesktop();
      dtShell.style.display='';
    } else {
      if(dtShell)dtShell.style.display='none';
      deck.style.display='';
      update(false);
    }
  }
  // Keyboard nav for desktop
  document.addEventListener('keydown',e=>{
    if(window.innerWidth<900)return;
    if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();if(dtSelected<DATA.length-1)selectDesktop(dtSelected+1);}
    if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();if(dtSelected>0)selectDesktop(dtSelected-1);}
  });
  checkDesktop();window.addEventListener('resize',checkDesktop);
  // Theme toggle
  (function(){
    const btn=document.getElementById('themeToggle');
    const saved=localStorage.getItem('theme');
    if(saved==='light'){document.documentElement.classList.add('light');btn.textContent='☀️';}
    btn.addEventListener('click',()=>{
      const isLight=document.documentElement.classList.toggle('light');
      btn.textContent=isLight?'☀️':'🌙';
      localStorage.setItem('theme',isLight?'light':'dark');
    });
  })();
  </script>
</body>
</html>
