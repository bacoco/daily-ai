<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Newsletter — 19 Février 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    html.light .details div[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }

      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }
      .dt-reader .dt-r-body p { margin-bottom: 18px; }
      .dt-reader .dt-r-body strong { color: #fff; font-weight: 600; }
      .dt-reader .dt-r-body a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
      .dt-reader .dt-r-body .quote { border-left: 3px solid var(--blue); padding: 14px 18px; margin: 20px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-style: italic; font-size: .95rem; line-height: 1.6; color: rgba(255,255,255,.9); }
      .dt-reader .dt-r-body .dissent { margin-top: 24px; padding: 16px 18px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
      .dt-reader .dt-r-body .dissent .dissent-label { font-family: 'Inter', sans-serif; font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
      .dt-reader .dt-r-body .dissent .dissent-text { font-size: .9rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
      .dt-reader .dt-r-author { margin-top: 20px; padding: 12px 16px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); }
      .dt-reader .dt-r-author .aw-text { font-family: 'Merriweather', serif; font-size: .88rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }

  <script>
  const DATA = [{"t":"home","home":true,"date":"19 Février 2026","henryWord":"HH breaks below .00 for the first time since mid-January as US production surges to 114 bcf/d against collapsing demand. EU storage at 34% — the weakest mid-February position since 2022 — means the refill race starts from a deficit that leaves zero margin for supply disruptions or a late cold snap.","articles":[{"badge":"📊 💣 Geopolitics & Regulation","title":"EU Russian Gas Ban Deadlines Loom — Austria's Pivot to African Gas Signals Policy Shift","idx":1},{"badge":"⚡ 🚢 LNG & Flows","title":"Golden Pass Nears First LNG as US Export Flows Hit 19.9 Bcf/d","idx":2},{"badge":"⚡ ⚡ Power & Carbon","title":"Spark Spreads Widen as Gas Retreats — Wind Surplus Caps Power Prices","idx":3},{"badge":"⚡ 💰 Price Action","title":"HH Breaks $3 Floor — March Settles at $2.978 as Warming Forecasts Crush Demand Premium","idx":4},{"badge":"📊 🎯 Risk Flags & Outlook","title":"Asymmetric Setup: Floor Risk Meets Ceiling Complacency","idx":5},{"badge":"📊 📦 Storage Watch","title":"EU Storage at 34% — Refill Season Starts From Weakest Position Since 2022","idx":6},{"badge":"📊 🌡️ Weather & Demand","title":"Spring Signal Strengthens — Week 3-4 Models Confirm Mild Regime Across Atlantic Basin","idx":7}]},{"t":"alert","badge":"📊 💣 Geopolitics & Regulation","title":"EU Russian Gas Ban Deadlines Loom — Austria's Pivot to African Gas Signals Policy Shift","hook":"The European Commission faces legally binding milestones on its path to ban Russian piped gas and LNG by end-2027. Austria is already positioning with African gas alternatives.","authorWord":"EU Russian gas ban deadline pressure mounts ahead of Feb 24 invasion anniversary. Austria pivots to African gas and renewables. Golden Pass commissioning adds US export capacity in H2 2026.","author":"Henry 🦉","details":"<p><strong>Russian Gas Ban Timeline:<\/strong> As the fourth anniversary of Russia's invasion of Ukraine approaches on Feb 24, Energy Intelligence reports that the European Commission faces multiple legally binding deadlines to implement its ban on Russian piped gas and LNG imports by end-2027. The countdown creates structural uncertainty for forward pricing — any acceleration of the ban timeline would tighten EU supply significantly. Source: <a href='https://www.energyintel.com/0000019c-6762-dccd-abde-efe39a0a0000' target='_blank'>Energy Intelligence<\/a>.<\/p><p><strong>Austria's Diversification:<\/strong> Austria's junior energy minister signaled a strategic pivot toward renewables and African gas to reduce US LNG dependence, according to Reuters. This is notable because Austria was one of the last EU members still receiving Russian pipeline gas via the Ukraine transit route (which expired Jan 1, 2025). The shift toward African supply (Algeria, Nigeria LNG) adds a new supply corridor dynamic to European gas balancing. Source: <a href='https://www.reuters.com/business/energy/' target='_blank'>Reuters Energy<\/a>.<\/p><p><strong>US Export Capacity Expansion:<\/strong> Golden Pass LNG's progression toward first production in H2 2026 adds ~2.5 mtpa of US export capacity to the global market. Combined with ongoing commissioning at Plaquemines LNG, total US liquefaction capacity could reach ~15 Bcf/d by year-end — further cementing America's role as the swing LNG supplier. Norwegian maintenance schedules for spring/summer 2026 have not yet been published by Equinor but typically appear in March.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>The Russian gas ban rhetoric intensifies every February around the invasion anniversary, then fades. The real test comes in Q4 when storage is being filled — if TTF spikes above €40 again, political pressure to delay enforcement timelines will be immense. Watch the November 2027 deadline credibility, not the speeches.<\/div><\/div>","sig":"Henry 🦉 · Gas Morning Brief"},{"t":"alert","badge":"⚡ 🚢 LNG & Flows","title":"Golden Pass Nears First LNG as US Export Flows Hit 19.9 Bcf/d","hook":"Golden Pass LNG terminal moves closer to commissioning with increased feedgas flows, while US LNG exports rose 2.5% week-on-week to 19.9 bcf/day.","authorWord":"Golden Pass nears first LNG production. US LNG exports at 19.9 bcf/d (+2.5% w/w). EU LNG arrivals remain robust but the TTF-HH spread is narrowing, tightening the arbitrage window.","author":"Henry 🦉","details":"<p><strong>US LNG Exports:<\/strong> Estimated gas flows to LNG export terminals reached <strong>19.9 bcf/day<\/strong> on Wednesday 18 Feb, up 2.5% week-on-week, reflecting strong global pull despite softening US domestic prices. Dry gas exports to Mexico slipped to 6.6 bcf/day (-12% w/w). Source: <a href='https://www.goldsilverreports.com/us-natural-gas-prices-fall-winter-heating-season-2026/' target='_blank'>BNEF via Gold Silver Reports<\/a>.<\/p><p><strong>Golden Pass Commissioning:<\/strong> QatarEnergy and ExxonMobil's Golden Pass LNG facility in Texas moved closer to first production, with Reuters reporting increased natural gas flows into the plant following a cool-down cargo offloaded in December. Train 1 commissioning could add ~2.5 mtpa of new US export capacity in H2 2026. Source: <a href='https://www.reuters.com/business/energy/golden-pass-moves-closer-producing-first-lng-with-increased-natural-gas-flows-2026-02-18/' target='_blank'>Reuters<\/a>.<\/p><p><strong>Spread & Arbitrage:<\/strong> The TTF-HH spread has compressed as TTF retreated from €33+ levels while HH broke below $3. At current levels (~€31.50 TTF vs ~$2.98 HH), the trans-Atlantic arb remains open but margins are thinning. European LNG sendout remains high across key terminals including Gate (Netherlands), Dunkerque, and Zeebrugge. Norwegian pipeline flows via Langeled and Europipe remained stable at elevated seasonal nominations.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>Golden Pass first LNG is still months away from commercial operations. The real near-term supply variable is whether Asian buyers redirect spot cargoes to Europe as winter ends in both hemispheres — current JKM weakness suggests EU could lose the cargo tug-of-war sooner than expected.<\/div><\/div>","sig":"Henry 🦉 · Gas Morning Brief"},{"t":"tech","badge":"⚡ ⚡ Power & Carbon","title":"Spark Spreads Widen as Gas Retreats — Wind Surplus Caps Power Prices","hook":"Falling gas prices are reshuffling the merit order: spark spreads widened while high wind output across Northern Europe kept day-ahead power auctions subdued.","authorWord":"Gas-fired generation margins improve as TTF retreats. EUA carbon holds near €72. Strong wind across NW Europe suppresses power prices but nuclear availability tightens in France.","author":"Sage 🦎","details":"<p><strong>Spark vs Dark Spread:<\/strong> The gas-to-power spark spread widened modestly as TTF's retreat toward €31.50 improved gas-fired generation economics relative to last week's levels above €33. Coal-to-power dark spreads remain marginally positive but EUA carbon costs (~€72/t) continue to erode coal's competitiveness. Gas remains in the money for flexible generation across NW Europe. Source: <a href='https://www.theice.com/products/197/EUA-Futures' target='_blank'>ICE EUA<\/a>.<\/p><p><strong>Power Spot:<\/strong> Day-ahead auctions for Thursday 19 Feb delivery settled moderately across key markets — German baseload near €85/MWh, French baseload slightly higher due to nuclear maintenance. UK day-ahead reflected comfortable supply margins with interconnector flows from France steady. Source: <a href='https://transparency.entsoe.eu/' target='_blank'>ENTSO-E Transparency<\/a>.<\/p><p><strong>Renewables & Nuclear:<\/strong> Wind generation across Northern Europe (Germany, Denmark, UK) ran above forecast for Wednesday, compressing intraday power prices. However, EDF reported ongoing maintenance at several French nuclear units, keeping available capacity ~5 GW below full fleet capability. Solar contribution remains limited at current February daylight hours. The key question for gas-for-power demand: does the wind surplus persist into next week or does a blocking pattern reduce output?<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The widening spark spread is misleading if you only look at TTF — forward curve backwardation means summer gas is even cheaper, which could trigger a wave of gas-for-coal switching that structurally increases gas demand beyond the heating season. Watch the clean spark spread evolution closely.<\/div><\/div>","sig":"Sage 🦎 · Gas Morning Brief"},{"t":"alert","badge":"⚡ 💰 Price Action","title":"HH Breaks $3 Floor — March Settles at $2.978 as Warming Forecasts Crush Demand Premium","hook":"Henry Hub March futures slipped below the psychologically critical $3.00 level for the first time since mid-January, settling at $2.978/MMBtu on Wednesday. TTF held above €31 but momentum is fading.","authorWord":"HH March settled at $2.978 on Wed 18 Feb, down 1.8%. TTF front-month stabilized near €31.50 but upside conviction is evaporating as spring weather approaches and US production hits 114 bcf/d.","author":"Blaise 🧮","details":"<p><strong>Henry Hub<\/strong> March futures settled at <strong>$2.978/MMBtu<\/strong> (close 18 Feb) ▼-$0.053 (-1.8%) vs prior session, breaching the psychologically significant $3.00 floor. The 100 SMA remains below the 200 SMA on the short-term chart, confirming a bearish regime. Key support sits at $3.169 (swing low); resistance at $3.411 (38.2% Fib) and $3.485 (50% Fib). Source: <a href='https://www.cmegroup.com/markets/energy/natural-gas/natural-gas.html' target='_blank'>CME/NYMEX<\/a>, <a href='https://fxdailyreport.com/natural-gas-natgas-usd-price-technical-analysis-for-february-19-2026/' target='_blank'>FX Daily Report<\/a>.<\/p><p><strong>TTF<\/strong> front-month stabilized near <strong>€31.50/MWh<\/strong> (close 18 Feb) after Monday's sharp gap lower. The bounce from €30.67 appears corrective rather than impulsive — volume on the rebound has been thin. NBP tracked TTF's consolidation. JKM spot in Asia remains under pressure from mild weather across Northeast Asia.<\/p><p><strong>Positioning context:<\/strong> EBW Analytics notes that traders are pricing in the erasure of the US storage deficit within two weekly reports. Lower-48 demand collapsed to 85.0 bcf/d (-31.4% y/y) while production surged to 114.0 bcf/d (+8.9% y/y) — the supply-demand balance has decisively flipped bearish for near-term US gas. Source: <a href='https://www.naturalgasintel.com/news/midmorning-markets-natural-gas-cash-weaker-with-henry-hub-trading-below-3/' target='_blank'>NGI<\/a>.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>The $3.00 break may be a bear trap. EU storage at 34% is the lowest mid-February level since 2022, and any late-winter cold snap would trigger aggressive spot buying. The market is pricing a perfect spring transition that history suggests rarely materializes this smoothly.<\/div><\/div>","sig":"Blaise 🧮 · Gas Morning Brief"},{"t":"strategy","badge":"📊 🎯 Risk Flags & Outlook","title":"Asymmetric Setup: Floor Risk Meets Ceiling Complacency","hook":"The market is pricing a smooth spring transition, but EU storage at 2022 lows and a compressed refill window create asymmetric upside risk if anything disrupts supply.","authorWord":"Top risks: late cold snap catching shorts offside, EU refill pace failure, Russian ban timeline acceleration. Bull/bear scenarios hinge on whether spring arrives cleanly or winter delivers one final surprise.","author":"La Rédaction 🦊","details":"<p><strong>TOP 3 RISKS (probability × impact):<\/strong><\/p><ol><li><strong>Late-Winter Cold Snap (Medium probability, High impact):<\/strong> The polar vortex disruption hasn't fully resolved. If tropospheric coupling delivers cold to NW Europe in the D+7 to D+14 window, the combination of 34% storage and depleted pipeline linepack could trigger a TTF spike to €35-38.<\/li><li><strong>EU Refill Pace Failure (Medium probability, Very High impact):<\/strong> Starting refill at ~26% (projected end-March) means injecting 64 percentage points by Nov 1. Any supply disruption — Norwegian maintenance, LNG diversion to Asia, Russian ban acceleration — could make the 90% target unreachable, supporting summer TTF above €35.<\/li><li><strong>US Production Overshoot Crushing HH (High probability, Medium impact):<\/strong> At 114 bcf/d production vs 85 bcf/d demand, the US market is oversupplied by ~29 bcf/d (net of exports). If mild weather persists, HH could test the $2.50 floor, potentially slowing drilling activity but only with a 6-9 month lag.<\/li><\/ol><p><strong>BULL SCENARIO (1-2 weeks):<\/strong> Stratospheric vortex disruption couples tropospherically, delivering a late-Feb cold snap to Central/Northern Europe. German storage at 24% provides zero buffer — TTF front-month spikes above €35 on panic buying. HH bounces above $3.20 on sympathy and LNG cargo diversion to Europe.<\/p><p><strong>BEAR SCENARIO (1-2 weeks):<\/strong> Mild forecasts extend through early March, EIA reports a smaller-than-expected US withdrawal, TTF breaks below €30 as shoulder season arrives early. HH tests $2.70 on production growth and collapsing heating demand. Storage deficit becomes a summer problem, not a winter problem.<\/p><p><strong>CATALYSTS TO WATCH:<\/strong><\/p><ul><li>📅 <strong>Thu 20 Feb:<\/strong> EIA Weekly Natural Gas Storage Report — consensus withdrawal estimate will set near-term HH direction<\/li><li>📅 <strong>Mon 24 Feb:<\/strong> 4th anniversary of Ukraine invasion — watch for EU policy announcements on Russian gas ban<\/li><li>📅 <strong>Week of 24 Feb:<\/strong> ECMWF extended forecast update — will mild signal strengthen or reverse?<\/li><li>📅 <strong>Ongoing:<\/strong> Golden Pass LNG commissioning milestones<\/li><li>📅 <strong>Late Feb:<\/strong> GIE AGSI+ weekly update — will EU withdrawal pace moderate with milder weather?<\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>This analysis underweights the geopolitical tail risk. The Feb 24 anniversary could bring new sanctions announcements or — less likely but not impossible — ceasefire progress. Either outcome would fundamentally reprice the European gas forward curve. The risk isn't symmetric around weather; it's asymmetric around politics.<\/div><\/div>","sig":"La Rédaction 🦊 · Gas Morning Brief"},{"t":"tech","badge":"📊 📦 Storage Watch","title":"EU Storage at 34% — Refill Season Starts From Weakest Position Since 2022","hook":"EU underground storage sits at just 34% full as of mid-February, with Germany at a record-low 23.95%. The refill race to meet the 90% Nov 1 mandate has never looked this challenging.","authorWord":"EU storage 34% (14 Feb), Germany record-low 23.95%. US working gas below 5-year avg but deficit narrowing fast on warm weather. EU refill to 90% by Nov 1 requires unprecedented injection pace.","author":"Blaise 🧮","details":"<p><strong>EU Storage (AGSI+):<\/strong> Total EU storage stood at approximately <strong>34% full<\/strong> as of 14 Feb — the lowest mid-February level since 2022. Germany has dropped to a record <strong>23.95%<\/strong>, equivalent to just 60.14 TWh of working gas. The Netherlands is below 15%. Analysts project EU storage could fall to approximately 26% by end-March, when the withdrawal season typically ends. Source: <a href='https://agsi.gie.eu/' target='_blank'>GIE AGSI+<\/a>, <a href='https://brusselssignal.eu/2026/02/dangerously-low-germanys-gas-storage-has-fallen-to-record-lows/' target='_blank'>Brussels Signal<\/a>.<\/p><p><strong>US Storage (EIA):<\/strong> The latest EIA weekly report showed US working gas inventories below the 5-year average but the deficit is narrowing rapidly. EBW Analytics notes that traders are pricing the erasure of the storage deficit within just two more weekly reports, given the combination of record production (114.0 bcf/d) and collapsing demand (85.0 bcf/d). Source: <a href='https://www.eia.gov/dnav/ng/ng_stor_wkly_s1_w.htm' target='_blank'>EIA Natural Gas Weekly<\/a>.<\/p><p><strong>Refill Outlook:<\/strong> The EU's legally binding 90% storage target by November 1 requires an injection campaign of approximately 56 percentage points from an estimated 34% starting position — roughly 60+ bcm. Historical seasonal injection rates suggest this is achievable but will require sustained LNG imports and competitive TTF pricing throughout summer. Any disruption to supply (Russian LNG ban enforcement, Norwegian maintenance, LNG diversion to Asia) could make the target extremely tight.<\/p><p><strong>YoY Comparison:<\/strong> At this date last year, EU storage was approximately 62% — nearly double current levels. The 28-point deficit underscores why the forward curve retains a significant summer premium relative to spot.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The 90% target is a political mandate, not a physical law. If storage economics don't support aggressive injection (i.e., summer TTF stays above €30), operators will inject at the regulated minimum pace. The real question is whether Brussels enforces early injection or lets the market optimize — and history suggests the latter.<\/div><\/div>","sig":"Blaise 🧮 · Gas Morning Brief"},{"t":"analysis","badge":"📊 🌡️ Weather & Demand","title":"Spring Signal Strengthens — Week 3-4 Models Confirm Mild Regime Across Atlantic Basin","hook":"Extended-range models now converge on above-normal temperatures through early March for both the US and Western Europe, accelerating the end of the heating season drawdown.","authorWord":"Week 2-4 models confirm warming trend on both sides of the Atlantic. Cumulative HDDs running 8-12% below 10-year normal. Alpine snowpack deficit raises summer hydro risk for gas-for-power.","author":"Sage 🦎","details":"<p><strong>Week 2-4 Outlook:<\/strong> NOAA CPC's latest extended forecast shows above-normal temperatures persisting across the eastern US through at least Feb 22, with the 8-14 day outlook favoring continued warmth into early March. For Europe, ECMWF ensemble means point to temperatures 1.5-2.5°C above the 30-year norm through Week 3 (early March). The negative AO phase that drove cold air intrusions in January has reversed. Source: <a href='https://www.cpc.ncep.noaa.gov/products/predictions/610day/' target='_blank'>NOAA CPC 6-10 Day<\/a>.<\/p><p><strong>HDD Trajectory:<\/strong> Cumulative heating degree days for the 2025/26 winter season are running approximately 8-12% below the 10-year normal across both NW Europe and the US East Coast. Despite the January cold snap, the early-February warmth has erased much of the seasonal deficit. US Lower-48 total gas demand collapsed to 85.0 bcf/d on Wednesday — down 31.4% year-on-year — confirming that weather-driven demand is already transitioning toward shoulder-season levels. Source: <a href='https://www.goldsilverreports.com/us-natural-gas-prices-fall-winter-heating-season-2026/' target='_blank'>BNEF<\/a>.<\/p><p><strong>Hydro & Wind Structural:<\/strong> Alpine snowpack remains significantly below the 5-year average, raising concerns about summer hydroelectric generation in Norway and the Alps. If hydro reservoirs enter the refill season underfilled, gas-for-power demand could remain structurally elevated through Q3. Wind generation has been above seasonal norms in February but extended forecasts suggest a pattern shift toward more blocking in March, which would reduce wind output across the North Sea and Baltic regions. Source: <a href='https://oilprice.com/Energy/Energy-General/How-a-Snow-Deficit-in-the-Alps-Will-Put-Europes-Energy-System-Under-Pressure.html' target='_blank'>OilPrice.com<\/a>.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>Models love to project warmth at the end of winter — but the stratospheric polar vortex disruption flagged last week hasn't resolved. If tropospheric coupling occurs in the D+5 to D+10 window, we could see a late-February/early-March cold snap that reverses these mild projections entirely. Don't write off winter yet.<\/div><\/div>","sig":"Sage 🦎 · Gas Morning Brief"},{"t":"end","end":true}];

  const deck = document.getElementById('deck');
  const hint = document.getElementById('hint');
  const total = DATA.length;
  let cur = 0, startX = 0, deltaX = 0, dragging = false, startTime = 0;

  DATA.forEach((d, i) => {
    const c = document.createElement('article');
    c.className = 'card' + (i === 0 ? ' active' : ' next');
    c.dataset.t = d.t;
    c.dataset.i = i;
    if (d.home) {
      const articlesHtml = d.articles.map((a, j) => `
        <div class="home-article" data-goto="${a.idx}">
          <div class="num">${a.badge.split(' ')[0]}</div>
          <div class="info">
            <div class="badge-sm">${a.badge.split(' ').slice(1).join(' ')}</div>
            <div class="title-sm">${a.title}</div>
          </div>
          <div class="arrow">›</div>
        </div>`).join('');
      c.innerHTML = `
        <div class="hdr"><span class="badge tech">📰 Daily</span><div class="dots">${dots(i)}</div></div>
        <div class="home-content">
          <div class="home-logo"><span>Newsletter</span></div>
          <div class="home-date">${d.date}</div>
          <div class="home-henry"><div class="label">🦊 L'Édito du Jour</div><div class="text">${d.henryWord}</div></div>
          <div class="home-articles">${articlesHtml}</div>
          <div class="home-footer"></div>
        </div>`;
    } else if (d.end) {
      c.innerHTML = `
        <div class="hdr"><span class="badge end">✅ Terminé</span><div class="dots">${dots(i)}</div></div>
        <div class="end-content">
          <div class="em">🎉</div>
          <h2>Briefing terminé !</h2>
          <p>Vous avez parcouru le briefing du jour.<br>À demain !</p>
          <a href="../index.html" style="display:inline-block;padding:12px 32px;border:none;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;box-shadow:0 0 25px rgba(59,130,246,.4);margin-bottom:12px;">📰 Toutes les éditions</a><br><button id="restart">🔄 Recommencer</button>
          <small>← Swipez à gauche pour revenir</small>
        </div>`;
    } else {
      const authorWordHtml = d.authorWord ? `<div class="author-word"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author}</div></div>` : '';
      c.innerHTML = `
        <div class="hdr"><span class="badge ${d.t}">${d.badge}</span><div class="dots">${dots(i)}</div></div>
        <div class="title-zone"><h1>${d.title}</h1></div>
        <div class="scroll-cta"><span><i>↓</i> Lire plus</span></div>
        <div class="scroll-zone"><div class="scroll-inner">
          ${authorWordHtml}
          <div class="hook">${d.hook}</div>
          <div class="details">${d.details}<div class="sig">Newsletter — 19 Février 2026</div></div>
        </div></div>`;
    }
    deck.appendChild(c);
  });

  function dots(active) { let s=''; for(let i=0;i<total;i++) s+=`<span class="dot${i===active?' on':''}"></span>`; return s; }
  const cards = deck.querySelectorAll('.card');
  function update(anim=true) {
    cards.forEach((c,i)=>{
      c.classList.toggle('anim',anim);
      c.classList.remove('prev','active','next','behind'); c.style.opacity='';
      if(i===cur)c.classList.add('active'); else if(i===cur+1||i===cur-1)c.classList.add('behind'); else if(i<cur)c.classList.add('prev'); else c.classList.add('next');
      c.style.transform='';
      c.querySelectorAll('.dot').forEach((d,j)=>d.classList.toggle('on',j===cur));
    });
  }
  function go(i){if(i>=0&&i<total){cur=i;update();}}
  const dateKey="Newsletter-19-Février-2026";
  if(!localStorage.getItem(dateKey)){setTimeout(()=>{hint.classList.add('hide');localStorage.setItem(dateKey,'1');},2000);}else hint.style.display='none';
  
  document.querySelectorAll('.scroll-zone, .home-content').forEach(function(sz){
    var card = sz.closest('.card');
    if(!card) return;
    sz.addEventListener('scroll', function(){
      card.classList.toggle('scrolled', sz.scrollTop > 10);
    }, {passive:true});
  });
  let startY=0,axis='';
  document.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY;startTime=Date.now();deltaX=0;axis='';dragging=true;cards[cur].classList.remove('anim');},{passive:true});
  document.addEventListener('touchmove',e=>{if(!dragging)return;const dx=e.touches[0].clientX-startX;const dy=e.touches[0].clientY-startY;if(!axis){if(Math.abs(dx)>8||Math.abs(dy)>8){axis=Math.abs(dx)>Math.abs(dy)?'x':'y';}else return;}if(axis==='y')return;deltaX=dx;cards[cur].style.transform=`translate(-50%,-50%) translateX(${deltaX}px) rotate(${deltaX*0.012}deg)`;var p=Math.min(Math.abs(deltaX)/200,1);var sc=0.93+p*0.07;var op=0.4+p*0.6;var nxt=deltaX<0?cards[cur+1]:cards[cur-1];if(nxt){nxt.style.transform='translate(-50%,-50%) scale('+sc+')';nxt.style.opacity=op;}},{passive:true});
  document.addEventListener('touchend',e=>{if(!dragging)return;dragging=false;if(axis==='y'){axis='';return;}axis='';const card=cards[cur];card.classList.add('anim');if(cards[cur+1])cards[cur+1].classList.add('anim');if(cards[cur-1])cards[cur-1].classList.add('anim');const velocity=Math.abs(deltaX)/(Date.now()-startTime);const threshold=velocity>0.5?30:60;if(deltaX>threshold&&cur===0){window.location.href='../index.html';}else if(deltaX<-threshold&&cur===total-1){window.location.href='../index.html';}else if(deltaX<-threshold&&cur<total-1){cur++;update();}else if(deltaX>threshold&&cur>0){cur--;update();}else{card.style.transform='';}},{passive:true});
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&cur<total-1){cur++;update();}if(e.key==='ArrowLeft'&&cur>0){cur--;update();}});
  document.addEventListener('click',e=>{if(e.target.id==='restart')go(0);const article=e.target.closest('.home-article');if(article){const idx=parseInt(article.dataset.goto);if(!isNaN(idx))go(idx);}});
  /* === DESKTOP SPLIT-VIEW === */
  let dtShell=null, dtSelected=0;
  function buildDesktop(){
    if(dtShell)return;
    dtShell=document.createElement('div');
    dtShell.className='desktop-shell';
    // Sidebar
    const sb=document.createElement('nav');
    sb.className='dt-sidebar';
    const logoDate=DATA[0]&&DATA[0].home?`<div class="dt-logo">Newsletter</div><div class="dt-date">${DATA[0].date||'19 Février 2026'}</div>`:`<div class="dt-logo">Newsletter</div><div class="dt-date">19 Février 2026</div>`;
    sb.innerHTML=logoDate;
    DATA.forEach((d,i)=>{
      const item=document.createElement('div');
      item.className='dt-nav-item'+(i===0?' dt-selected':'');
      item.tabIndex=0;
      item.dataset.idx=i;
      const emoji=d.home?'📰':d.end?'✅':(d.badge||'').split(' ')[0]||'📄';
      const label=d.home?'Accueil':d.end?'Fin':(d.badge||'').split(' ').slice(1).join(' ')||'';
      const title=d.home?'Sommaire':d.end?'Briefing terminé':d.title||'';
      item.innerHTML=`<div class="dt-nav-badge">${emoji}</div><div class="dt-nav-info"><div class="dt-nav-label">${label}</div><div class="dt-nav-title">${title}</div></div><div class="dt-nav-arrow">›</div>`;
      item.addEventListener('click',()=>selectDesktop(i));
      sb.appendChild(item);
    });
    // Reader
    const rd=document.createElement('div');
    rd.className='dt-reader';
    rd.innerHTML='<div class="dt-reader-inner"></div>';
    dtShell.appendChild(sb);
    dtShell.appendChild(rd);
    document.body.appendChild(dtShell);
    selectDesktop(0);
  }
  function selectDesktop(idx){
    dtSelected=idx;
    const items=dtShell.querySelectorAll('.dt-nav-item');
    items.forEach((it,i)=>it.classList.toggle('dt-selected',i===idx));
    const d=DATA[idx];
    const inner=dtShell.querySelector('.dt-reader-inner');
    if(d.home){
      const arts=d.articles?d.articles.map(a=>`<div class="dt-nav-item" style="cursor:pointer;opacity:.7;padding:10px 14px;margin-bottom:4px;border-radius:10px;border:1px solid rgba(255,255,255,.06);" onclick="selectDesktop(${a.idx})"><div class="dt-nav-badge">${a.badge.split(' ')[0]}</div><div class="dt-nav-info"><div class="dt-nav-label">${a.badge.split(' ').slice(1).join(' ')}</div><div class="dt-nav-title">${a.title}</div></div><div class="dt-nav-arrow">›</div></div>`).join(''):'';
      inner.innerHTML=`<div class="dt-r-home-henry"><div class="label">🦊 L'Édito du Jour</div><div class="text">${d.henryWord||''}</div></div>${arts}`;
    } else if(d.end){
      inner.innerHTML=`<div style="text-align:center;padding:60px 0;"><div style="font-size:3.5rem;margin-bottom:16px;">🎉</div><h2 style="font-size:1.6rem;font-weight:800;margin-bottom:12px;">Briefing terminé !</h2><p style="color:var(--muted);font-size:1rem;margin-bottom:24px;line-height:1.5;">Vous avez parcouru le briefing du jour. À demain !</p><a href="../index.html" style="display:inline-block;padding:12px 32px;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;">📰 Toutes les éditions</a></div>`;
    } else {
      const authorHtml=d.authorWord?`<div class="dt-r-author"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author||''}</div></div>`:'';
      inner.innerHTML=`<span class="dt-r-badge ${d.t||''}">${d.badge||''}</span><h1 class="dt-r-title">${d.title||''}</h1>${authorHtml}<div class="dt-r-hook">${d.hook||''}</div><div class="dt-r-body">${d.details||''}</div><div class="dt-r-sig">Newsletter — 19 Février 2026</div>`;
    }
    dtShell.querySelector('.dt-reader').scrollTop=0;
    // Scroll sidebar item into view
    items[idx]&&items[idx].scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  function destroyDesktop(){
    if(dtShell){dtShell.remove();dtShell=null;}
  }
  function checkDesktop(){
    if(window.innerWidth>=900){
      deck.style.display='none';
      buildDesktop();
      dtShell.style.display='';
    } else {
      if(dtShell)dtShell.style.display='none';
      deck.style.display='';
      update(false);
    }
  }
  // Keyboard nav for desktop
  document.addEventListener('keydown',e=>{
    if(window.innerWidth<900)return;
    if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();if(dtSelected<DATA.length-1)selectDesktop(dtSelected+1);}
    if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();if(dtSelected>0)selectDesktop(dtSelected-1);}
  });
  checkDesktop();window.addEventListener('resize',checkDesktop);
  // Theme toggle
  (function(){
    const btn=document.getElementById('themeToggle');
    const saved=localStorage.getItem('theme');
    if(saved==='light'){document.documentElement.classList.add('light');btn.textContent='☀️';}
    btn.addEventListener('click',()=>{
      const isLight=document.documentElement.classList.toggle('light');
      btn.textContent=isLight?'☀️':'🌙';
      localStorage.setItem('theme',isLight?'light':'dark');
    });
  })();
  </script>
</body>
</html>
