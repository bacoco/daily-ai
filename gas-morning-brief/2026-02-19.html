<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Newsletter — 19 Février 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    html.light .details div[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }

      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }
      .dt-reader .dt-r-body p { margin-bottom: 18px; }
      .dt-reader .dt-r-body strong { color: #fff; font-weight: 600; }
      .dt-reader .dt-r-body a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
      .dt-reader .dt-r-body .quote { border-left: 3px solid var(--blue); padding: 14px 18px; margin: 20px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-style: italic; font-size: .95rem; line-height: 1.6; color: rgba(255,255,255,.9); }
      .dt-reader .dt-r-body .dissent { margin-top: 24px; padding: 16px 18px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
      .dt-reader .dt-r-body .dissent .dissent-label { font-family: 'Inter', sans-serif; font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
      .dt-reader .dt-r-body .dissent .dissent-text { font-size: .9rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
      .dt-reader .dt-r-author { margin-top: 20px; padding: 12px 16px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); }
      .dt-reader .dt-r-author .aw-text { font-family: 'Merriweather', serif; font-size: .88rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }

  <script>
  const DATA = [{"t":"home","home":true,"date":"19 Février 2026","henryWord":"TTF cracks €30 for the first time since January as an LNG cargo wave meets collapsing EUA carbon — yet EU storage at 32.5% is the lowest mid-February reading in 8 years. Mukran ice-locked, Golden Pass ramping, Arctic LNG 2 sanctions leaking: the market is pricing a perfect spring while sitting on the thinnest cushion since 2022.","articles":[{"badge":"📊 💣 Geopolitics & Regulation","title":"Europe's 90% Storage Mandate Meets 34% Reality — The Refill Equation Tightens","idx":1},{"badge":"⚡ 🚢 LNG & Flows","title":"Mukran Ice-Locked for 17 Days as Golden Pass Pulls 300 mmcf — EU LNG Imports Drop 40%","idx":2},{"badge":"⚡ ⚡ Power & Carbon","title":"Carbon Rout Reshuffles the Fuel Stack — Dark Spreads Widen as EUA Slides Below €70","idx":3},{"badge":"⚡ 💰 Price Action","title":"TTF Cracks €30 to 5-Week Low as LNG Glut Smothers Storage Fear","idx":4},{"badge":"📊 🎯 Risk Flags & Outlook","title":"Three-Way Squeeze: Ice, Carbon & Storage Collide at the End of Winter","idx":5},{"badge":"📊 📦 Storage Watch","title":"EU Stocks Hit 8-Year Low at 32.5% — The 90% Refill Challenge Looms Large","idx":6},{"badge":"📊 🌡️ Weather & Demand","title":"La Niña Collapse Meets Nordic Hydro Crisis — The Spring Refill Squeeze","idx":7}]},{"t":"alert","badge":"📊 💣 Geopolitics & Regulation","title":"Europe's 90% Storage Mandate Meets 34% Reality — The Refill Equation Tightens","hook":"EU storage at 34% full, lowest since 2022 crisis. The 90%-by-November mandate now requires a record summer refill campaign — just as sanctions leak, ceasefire talks stall, and Norwegian capex declines.","authorWord":"Storage mandate compliance will dominate European gas policy this summer. The gap between 34% now and 90% by November has never been wider post-crisis.","author":"Henry 🦉","details":"<h3>🏗️ The Structural Gap: 34% → 90%<\/h3><p>EU gas storage stood at just <b>34% full<\/b> as of 14 February — the lowest mid-February reading since 2022, per <a href='https://agsi.gie.eu/' target='_blank'>GIE<\/a>. The EU's storage regulation mandates <b>90% fill by 1 November<\/b>, meaning a required injection of roughly <b>64 percentage points<\/b> (~65 bcm) over ~7 months.<\/p><p>At <a href='https://www.bloomberg.com/news/newsletters/2026-02-12/europe-s-depleted-natural-gas-storage-tanks-spur-energy-security-worries' target='_blank'>E-world in Essen last week<\/a>, traders flagged that such a refill campaign would require sustained high LNG imports throughout summer — structurally supporting TTF Summer 26 prices.<\/p><h3>🇷🇺 Arctic LNG 2: Sanctions Porous, Volumes Trickling<\/h3><p>Despite comprehensive Western sanctions, Russia continues to find workarounds. An <a href='https://cyprusshippingnews.com/2026/02/19/sanctioned-russian-icebreakers-helped-glasgow-shipping-company-bring-gas-to-europe/' target='_blank'>investigation published today<\/a> reveals a Glasgow-based shipping company transported <b>over 700,000 tonnes<\/b> of Arctic gas to Europe in the past month, relying on sanctioned Russian icebreakers. Meanwhile, Novatek uses the <b>Saam FSU<\/b> in Ura Bay for <a href='https://www.thearcticinstitute.org/arctic-week-take-five-week-9-february-2026/' target='_blank'>offshore transshipment<\/a> near the Norwegian border. China received its <a href='https://caliber.az/en/post/china-receives-first-lng-cargo-from-russia-s-sanction-hit-arctic-project' target='_blank'>first Arctic LNG 2 cargo of the year<\/a> at Beihai terminal.<\/p><h3>🇺🇦 Geneva Talks Stall<\/h3><p>Ukraine transit via Sudzha ended 1 January 2025. Yesterday's Geneva negotiations produced <a href='https://www.theguardian.com/world/2026/feb/18/latest-russia-ukraine-peace-talks-geneva-no-breakthrough' target='_blank'>no breakthrough<\/a>. Even a ceasefire would not automatically restore gas transit — requiring a new commercial agreement and pipeline verification. The ~42 mcm/d that once flowed remains structurally offline.<\/p><h3>🇳🇴 Norway: Capex Down, Discovery Up<\/h3><p>Norwegian O&G investment is <a href='https://www.indexbox.io/blog/norways-oil-and-gas-investment-to-decline-after-2025-record-high/' target='_blank'>forecast to decline in 2026<\/a>. However, Equinor's <a href='https://www.reuters.com/business/energy/equinor-makes-oil-gas-find-north-sea-2026-02-16/' target='_blank'>Granat discovery<\/a> near Gullfaks (16 Feb) supports long-term utilisation. Near-term: spring/summer maintenance on Troll, Oseberg, Nyhamna — any overlap with peak injection season could tighten the refill window.<\/p><h3>📐 The Regulatory Equation<\/h3><p>If end-March storage lands at 26%, Europe needs ~7.5 bcm/month Apr–Oct to hit 90%. Starting from 26% with <b>no Ukrainian transit, limited Russian pipeline (TurkStream only), and global LNG competition<\/b>, the margin for error is essentially zero.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>The 90% mandate has survived three winters. Europe refilled from 33% in 2022 to 95% by November — with far less FSRU capacity than today. Global LNG supply is structurally higher in 2026 with Plaquemines, Tortue FLNG, and incremental Qatari volumes. The refill math is tight but achievable. If Chinese industrial recovery disappoints again, the LNG will come west by default.<\/div><\/div>","sig":"Henry 🦉 · Gas Morning Brief"},{"t":"alert","badge":"⚡ 🚢 LNG & Flows","title":"Mukran Ice-Locked for 17 Days as Golden Pass Pulls 300 mmcf — EU LNG Imports Drop 40%","hook":"Germany's largest LNG terminal still ice-bound; Golden Pass ramps to 300 mmcf/d ahead of first cargo; JKM-TTF spread near zero kills Asia arbitrage.","authorWord":"Mukran paralysed by Baltic ice since Feb 2, slashing German LNG imports 40%. Meanwhile Golden Pass pulls record feed gas — new US supply wave imminent.","author":"Henry 🦉","details":"<h3>🧊 Mukran LNG — Ice Siege Enters Third Week<\/h3><p>Germany's largest LNG terminal on Rügen island has been <b>offline since 2 February<\/b>, unable to receive cargoes due to severe Baltic Sea ice. The <i>Minerva Amorgos<\/i> tanker (carrying ~100 mcm) remains anchored at the port roadstead. The federal icebreaker <i>Neuwerk<\/i> — Germany's largest — <b>broke down on 13 Feb<\/b> and returned to Rostock for repairs. A chartered tug (<i>VB Bremen Fighter<\/i>) is now attempting to clear the approach, but as of 18 Feb AIS data shows no change.<\/p><p>Impact: German LNG imports have fallen from ~35 mcm/d to ~20 mcm/d (<b>−43%<\/b>). German storage has dropped to <b>5.7 bcm<\/b> — lowest since 2013 — with drawdown exceeding 100 mcm/d. At current rates, reserves last until mid-April.<\/p><p>Sources: <a href='https://eadaily.com/en/news/2026/02/16/germanys-largest-lng-terminal-has-run-out-of-gas-the-tanker-got-stuck-the-icebreaker-broke-down' target='_blank'>EADaily (16 Feb)<\/a> · <a href='https://agsi.gie.eu/' target='_blank'>GIE AGSI<\/a><\/p><h3>🇺🇸 Golden Pass LNG — 300 mmcf/d Feed Gas & Counting<\/h3><p>Golden Pass (ExxonMobil / QatarEnergy, 18 mtpa nameplate) pulled <b>300 million cubic feet of feed gas on Wednesday 18 Feb<\/b> — a new high — as Train 1 commissioning accelerates. FERC approvals are in hand. Wood Mackenzie and LSEG data suggest <b>first LNG production in March 2026<\/b>, with first export cargo potentially by late Q1.<\/p><p>Sources: <a href='https://www.zawya.com/en/business/energy/golden-pass-moves-closer-to-producing-first-lng-with-increased-natural-gas-flows-into-facility-yd0lelqm' target='_blank'>Reuters/Zawya (19 Feb)<\/a> · <a href='https://www.naturalgasintel.com/news/golden-pass-lng-activity-normalizes-permian-lateral-cleared-to-proceed/' target='_blank'>NGI (18 Feb)<\/a> · <a href='https://lngprime.com/americas/golden-pass-lng-nears-launch-of-first-train/177810/' target='_blank'>LNG Prime (17 Feb)<\/a><\/p><h3>📉 JKM–TTF Spread Near Zero — Arbitrage Window Closing<\/h3><p>The Japan-Korea Marker (JKM) premium over TTF has <b>collapsed to near zero<\/b>, eliminating the incentive for flexible cargoes to swing between Atlantic and Pacific basins. With the JKM–TTF arb shut, more US cargoes are defaulting to Europe — paradoxically adding to the supply glut that is capping TTF.<\/p><p>Source: <a href='https://www.fxstreet.com/news/natural-gas-weaker-european-outlook-with-lng-wave-societe-generale-202602161320' target='_blank'>SocGen via FXStreet (16 Feb)<\/a> · <a href='https://naturalgasintel.com/news/lng-floods-europe-keeping-lid-on-ttf-prices-despite-storage-deficit/' target='_blank'>NGI (17 Feb)<\/a><\/p><h3>🔧 Pipeline Flows — Snapshot<\/h3><ul><li><b>Norwegian corridors<\/b> (Langeled, Europipe II): No unplanned outages on <a href='https://www.gassco.no/en/' target='_blank'>Gassco<\/a> as of 19 Feb.<\/li><li><b>North Africa<\/b>: Medgaz and Transmed flows stable per <a href='https://transparency.entsog.eu/' target='_blank'>ENTSOG<\/a>.<\/li><li><b>Mukran outage<\/b> is the single dominant supply-side disruption in Europe today.<\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>The Mukran ice story is dramatic but ultimately small-beer for the continental balance — one FSRU offline in a system with 30+ import terminals. The real story is the supply tsunami building: Golden Pass ramping, JKM–TTF arb dead, cargoes piling into NW Europe. Watch for a sharp TTF leg lower once the ice clears and the backlog unloads simultaneously.<\/div><\/div>","sig":"Henry 🦉 · Gas Morning Brief"},{"t":"tech","badge":"⚡ ⚡ Power & Carbon","title":"Carbon Rout Reshuffles the Fuel Stack — Dark Spreads Widen as EUA Slides Below €70","hook":"EUA collapse compresses spark spreads and reopens the coal-gas switching debate across NW Europe.","authorWord":"EUA political selloff is rewriting merit-order economics. Dark spreads widen as carbon penalty shrinks — watch coal dispatch.","author":"Sage 🦎","details":"<h3>🏭 EUA Carbon — Political Gravity Wins<\/h3><p>The <a href='https://gmk.center/en/news/carbon-prices-in-europe-fall-in-february-amid-calls-for-ets-review/' target='_blank'>EUA Dec-26 benchmark<\/a> settled around <b>€68–69/t<\/b> on Wednesday, continuing its slide from €90+ in January — a ~25% drawdown in under three weeks.<\/p><p>The catalyst chain: German Chancellor Merz questioned the ETS at an <a href='https://www.energyconnects.com/news/renewables/2026/february/eu-carbon-prices-plunge-as-merz-signals-openness-to-soften-rules/' target='_blank'>Antwerp industrial forum<\/a> (Feb 12), triggering fund liquidation. On Wednesday, <a href='https://www.reuters.com/sustainability/boards-policy-regulation/eu-countries-back-stronger-price-curbs-new-carbon-market-2026-02-18/' target='_blank'>Reuters reported<\/a> EU member states backed <b>stronger price curbs on ETS2<\/b> (buildings & transport). The formal ETS review is due Q3 2026.<\/p><h3>⚡ Spark vs Dark — Who's In the Money?<\/h3><ul><li><b>Clean spark spread<\/b> (gas-to-power): With TTF near €30/MWh and German DA baseload at <a href='https://www.marketscreener.com/news/german-day-ahead-baseload-power-price-down-17-6-at-91-50-eur-mwh-lseg-data-ce7e5ddedb8eff21' target='_blank'>€91.50/MWh<\/a> (Wed), the spark spread remains positive but compressing.<\/li><li><b>Clean dark spread<\/b> (coal-to-power): With ARA coal ~$100/t and EUA now sub-€70 (vs €90 a month ago), the carbon penalty per MWh for coal has dropped ~€10/MWh. Dark spreads are <b>widening materially<\/b>.<\/li><\/ul><p>If EUAs don't recover, gas-for-power burn could face <b>incremental displacement by coal<\/b> — a bearish signal for prompt gas demand.<\/p><h3>🔌 Power Spot — Mid-Week<\/h3><ul><li><b>Germany DA:<\/b> €91.50/MWh (Wed 18 Feb), down 17.6% d/d — <a href='https://www.marketscreener.com/news/german-day-ahead-baseload-power-price-down-17-6-at-91-50-eur-mwh-lseg-data-ce7e5ddedb8eff21' target='_blank'>LSEG<\/a><\/li><li><b>France DA:<\/b> Spiked to €38/MWh on Monday from €12/MWh on <a href='https://www.marketscreener.com/news/french-otc-day-ahead-baseload-power-price-at-38-euros-mwh-up-214-from-price-paid-friday-for-monday-ce7e5ddbd18ff222' target='_blank'>collapsing wind output<\/a> (+214%)<\/li><li><b>UK DA:<\/b> ~£78–79/MWh, tracking lower carbon and gas — <a href='https://www.prestigebusiness.energy/marketreports/energy-market-update16february2026' target='_blank'>Prestige Energy<\/a><\/li><\/ul><h3>☢️ Outages & Renewables<\/h3><ul><li><b>Temelín Unit 1<\/b> (Czech, 1 GW): Entering <a href='https://ceenergynews.com/nuclear/temelin-nuclear-plant-to-begin-unit-shutdown-for-refueling-and-upgrades/' target='_blank'>planned shutdown<\/a> — removes ~1 GW from Central European grid.<\/li><li><b>Ormen Lange compressor<\/b> (Norway): Unplanned failure still curtailing ~5.3 mcm/day of gas flow.<\/li><li><b>Wind:<\/b> After Monday's dramatic collapse spiking French DA +214%, generation remains <b>below seasonal norms<\/b> across NW Europe this week.<\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The \"coal comeback\" narrative may be premature. Even at €68/t, EUAs still impose ~€55–60/MWh carbon cost on hard coal vs ~€12–13/MWh on gas. The absolute spread still heavily favours gas dispatch. If Merz forms a government and the ETS review proves incremental, EUAs could snap back toward €80+ and the dark spread rally would unwind fast. Don't confuse a political tantrum with a structural shift.<\/div><\/div>","sig":"Sage 🦎 · Gas Morning Brief"},{"t":"alert","badge":"⚡ 💰 Price Action","title":"TTF Cracks €30 to 5-Week Low as LNG Glut Smothers Storage Fear","hook":"TTF front-month fell to €29.70 — lowest since 12 Jan — while HH spot clings below $3. EU storage at 33% vs 44% last year, yet prices keep falling. The disconnect signals a regime shift.","authorWord":"TTF broke €30 on mild weather + LNG oversupply despite record-low storage. HH stuck sub-$3. Bears in control but storage deficit could snap back hard.","author":"Blaise 🧮","details":"<h3>📊 Wednesday 18 Feb — Session Recap<\/h3><p><strong>Benchmark:<\/strong> 🇳🇱 TTF Front-Month<br><strong>Price:<\/strong> €29.70/MWh<br><strong>Δ d/d:<\/strong> −€0.74<br><strong>% Move:<\/strong> −2.4%<br><\/p><p><strong>Benchmark:<\/strong> 🇳🇱 TTF Day-Ahead<br><strong>Price:<\/strong> €30.60/MWh<br><strong>Δ d/d:<\/strong> +€0.67<br><strong>% Move:<\/strong> +2.2%<br><\/p><p><strong>Benchmark:<\/strong> 🇬🇧 NBP Day-Ahead<br><strong>Price:<\/strong> 70.50p/therm<br><strong>Δ d/d:<\/strong> −2.50p<br><strong>% Move:<\/strong> −3.4%<br><\/p><p><strong>Benchmark:<\/strong> 🇺🇸 HH Spot (next-day)<br><strong>Price:<\/strong> &lt;$3.00/MMBtu<br><strong>Δ d/d:<\/strong> —<br><strong>% Move:<\/strong> sub-$3 zone<br><\/p><p><strong>Benchmark:<\/strong> 🇺🇸 HH Mar NYMEX<br><strong>Price:<\/strong> ~$3.27/MMBtu<br><strong>Δ d/d:<\/strong> pullback from $3.40<br><strong>% Move:<\/strong> —<br><\/p><h3>🔍 Fresh Angle: The Storage-Price Disconnect<\/h3><p>EU storage sits at <b>33% full<\/b> — its lowest since 2022 and 11 pp below last year (<a href='https://agsi.gie.eu/' target='_blank'>GIE AGSI<\/a>). Germany is at just <b>23%<\/b>, lowest for mid-Feb since at least 2011. Yet TTF keeps falling. The disconnect is striking and points to a structural shift: <b>LNG arrivals are flooding Europe<\/b>, with Asian demand weakening and cargoes being diverted west (<a href='https://naturalgasintel.com/news/lng-floods-europe-keeping-lid-on-ttf-prices-despite-storage-deficit/' target='_blank'>NGI<\/a>).<\/p><p>Meanwhile, Iran-US diplomacy progress has trimmed the Strait of Hormuz risk premium on Qatari LNG flows, and forecasts for <b>mild, windy weather<\/b> through month-end are crushing heating demand and boosting wind generation (<a href='https://www.bairdmaritime.com/shipping/tankers/gas/europe-gas-prices-slip-as-mild-and-windy-weather-curb-demand' target='_blank'>Reuters via Baird Maritime<\/a>).<\/p><h3>📐 Technical Levels<\/h3><p><b>TTF front-month:<\/b> €29.70 is the Jan 12 low — a close below here opens €28.50 (Dec support). Resistance at €30.44 (prior range) and €31.88 (last week's bounce high).<\/p><p><b>HH NYMEX Mar:<\/b> Failed at $3.40 resistance; pulling back toward $3.17–$3.20 (broken support, now resistance). Downside to $3.00 psychological floor. 100 SMA below 200 SMA confirms bearish structure. Stochastic turning from oversold — a corrective bounce could test the 38.2% Fib at $3.41 before sellers re-engage (<a href='https://fxdailyreport.com/natural-gas-natgas-usd-price-technical-analysis-for-february-19-2026/' target='_blank'>FX Daily Report<\/a>).<\/p><h3>⚡ Positioning Note<\/h3><p>The break of $3.20 on HH on Monday was described as a <b>\"fundamental shift in market sentiment\"<\/b> — the Jan $7.50 spike now fully unwound. Record US production at 120.8 Bcf/d continues to overwhelm, with the EIA's last withdrawal (249 Bcf) disappointing expectations (<a href='https://markets.financialcontent.com/stocks/article/marketminute-2026-2-17-natural-gas-plunges-below-key-320-support-level-as-mild-weather-and-sluggish-inventory-draws-weigh-on-sentiment' target='_blank'>MarketMinute<\/a>).<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>The market is pricing perfection on weather and LNG supply. EU storage at 33% with six weeks of winter remaining is not comfortable — it's precarious. A single cold snap reversal in early March, or a Qatari cargo diversion to Asia on any JKM spike, could trigger a violent short-squeeze on TTF. The €29.70 level may look like a floor in hindsight. Shorts beware: the storage deficit hasn't gone anywhere.<\/div><\/div>","sig":"Blaise 🧮 · Gas Morning Brief"},{"t":"strategy","badge":"📊 🎯 Risk Flags & Outlook","title":"Three-Way Squeeze: Ice, Carbon & Storage Collide at the End of Winter","hook":"Mukran ice-locked, EUA in freefall, EU storage at 8-year lows — yet TTF keeps falling. The market is betting on a perfect spring. History suggests otherwise.","authorWord":"Top risks: Mukran backlog unwind, EUA-driven coal switching reducing gas demand, and the 90% refill mandate from a record-low base. Bull/bear hinges on whether spring arrives clean.","author":"La Rédaction 🦊","details":"<p><strong>TOP 3 RISKS (probability × impact):<\/strong><\/p><ol><li><strong>EU Refill Pace Failure (Medium prob, Very High impact):<\/strong> Starting refill at ~26% (projected end-March) means injecting 3.1 TWh/day for 210 days — above any historical pace. Norwegian hydro at 18 TWh below normal compounds the challenge by raising gas-for-power demand during injection months. Any LNG supply disruption could make the 90% Nov 1 target unreachable, supporting TTF above €35 through summer.<\/li><li><strong>EUA Collapse Triggers Coal Switching (High prob, Medium impact):<\/strong> EUA's plunge from €90 to €68 has widened dark spreads materially. If carbon stays sub-€70 through the ETS review (Q3 2026), incremental coal-for-gas switching could structurally reduce gas demand — bearish for prompt TTF but paradoxically easing the refill burden.<\/li><li><strong>Mukran Backlog + LNG Cargo Wave (High prob, Medium impact):<\/strong> When Baltic ice clears, the simultaneous unloading of backed-up cargoes plus Golden Pass commissioning could flood NW Europe with supply, triggering a sharp TTF leg lower toward €28.<\/li><\/ol><p><strong>BULL SCENARIO (1-2 weeks):<\/strong> SSW downward coupling delivers a late-Feb cold snap to Central/Northern Europe. German storage at 22% provides zero buffer — TTF spikes above €35. JKM-TTF spread reopens as Asian buyers compete for spot cargoes, redirecting supply away from Europe.<\/p><p><strong>BEAR SCENARIO (1-2 weeks):<\/strong> Mild forecasts extend through early March. Mukran ice clears, releasing backlogged cargoes. EIA reports a smaller-than-expected US withdrawal. TTF breaks below €28 as shoulder season pricing takes hold. US storage deficit flips to surplus, crushing HH toward $2.50.<\/p><p><strong>CATALYSTS TO WATCH:<\/strong><\/p><ul><li>📅 <strong>Thu 20 Feb:<\/strong> EIA Weekly Storage Report — will the US deficit shrink faster than expected?<\/li><li>📅 <strong>Mon 24 Feb:<\/strong> 4th anniversary of Ukraine invasion — EU Russian gas ban policy announcements likely<\/li><li>📅 <strong>Late Feb:<\/strong> Mukran ice status — any thaw would trigger cargo backlog unwind<\/li><li>📅 <strong>Ongoing:<\/strong> Golden Pass LNG feed gas ramp — first cargo timing (March target)<\/li><li>📅 <strong>Q3 2026:<\/strong> ETS formal review — will political pressure translate into structural EUA reform?<\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>This analysis underweights the geopolitical tail risk. The Feb 24 anniversary could bring new sanctions announcements or ceasefire progress. Either outcome would fundamentally reprice the European gas forward curve. The risk isn't symmetric around weather — it's asymmetric around politics.<\/div><\/div>","sig":"La Rédaction 🦊 · Gas Morning Brief"},{"t":"tech","badge":"📊 📦 Storage Watch","title":"EU Stocks Hit 8-Year Low at 32.5% — The 90% Refill Challenge Looms Large","hook":"EU storage 11pp below last year with Germany at record lows; US deficit poised to flip to surplus within weeks.","authorWord":"EU storage at lowest mid-Feb level in 8 years. Germany at 22%. The injection season math to reach 90% by Nov 1 looks daunting. US picture is the polar opposite — surplus by March.","author":"Blaise 🧮","details":"<h3>🇪🇺 EU Storage — AGSI+ as of 17 Feb<\/h3><p>EU aggregate storage sits at <b>32.5% full<\/b> (371.4 TWh of 1,142.6 TWh working capacity), the <b>lowest mid-February reading in 8 years<\/b>. One year ago: <b>43.3%<\/b> — a deficit of nearly <b>11 percentage points YoY<\/b> (~126 TWh).<\/p><p><strong>Country:<\/strong> 🇮🇹 Italy<br><strong>Fill %:<\/strong> 50.1%<br><strong>TWh:<\/strong> 101.8<br><strong>Daily trend:<\/strong> −0.39pp<br><\/p><p><strong>Country:<\/strong> 🇩🇪 Germany<br><strong>Fill %:<\/strong> 22.3%<br><strong>TWh:<\/strong> 56.1<br><strong>Daily trend:<\/strong> −0.62pp<br><\/p><p><strong>Country:<\/strong> 🇫🇷 France<br><strong>Fill %:<\/strong> 23.0%<br><strong>TWh:<\/strong> 28.9<br><strong>Daily trend:<\/strong> −0.57pp<br><\/p><p><strong>Country:<\/strong> 🇳🇱 Netherlands<br><strong>Fill %:<\/strong> 13.7%<br><strong>TWh:<\/strong> 19.8<br><strong>Daily trend:<\/strong> −0.57pp<br><\/p><p>Germany's 22.3% is a <b>record low for this date<\/b>. Netherlands at 13.7% approaching operational minimums. At current consumption (~10.5 TWh/day), remaining stocks cover ~<b>35 days<\/b>.<\/p><h3>📐 The 90% Refill Math<\/h3><p>EU regulation mandates 90% fill by Nov 1. That means adding ~657 TWh between April and October — <b>3.1 TWh/day sustained injection<\/b> over ~210 days. Historical peak rates: 2.5–2.8 TWh/day. The math implies either an early start, higher rates, or elevated LNG imports all summer. Analysts project stocks bottoming near <b>~26% by end-March<\/b>.<\/p><p>Compounding: <a href='https://oilprice.com/Energy/Energy-General/How-a-Snow-Deficit-in-the-Alps-Will-Put-Europes-Energy-System-Under-Pressure.html' target='_blank'>Alpine snow deficits<\/a> may reduce summer hydro, increasing gas-for-power demand during refill months.<\/p><h3>🇺🇸 US Storage — EIA Week Ending 6 Feb<\/h3><p>Working gas: <b>2,214 Bcf<\/b> after a 249 Bcf withdrawal (17th-largest in EIA history).<\/p><ul><li>vs year-ago: <b>−97 Bcf<\/b> (−4.2%)<\/li><li>vs 5-year avg: <b>−130 Bcf<\/b> (−5.5%)<\/li><\/ul><p>EBW Analytics projects the deficit could <b>flip to a 170 Bcf surplus within 3 weeks<\/b> as heating demand fades. Production at <b>109.3 Bcf/d<\/b>, LNG feed gas steady at 17.9 Bcf/d. Rig count flat at 551.<\/p><p>Sources: <a href='https://agsi.gie.eu/' target='_blank'>GIE AGSI+<\/a> | <a href='https://www.eia.gov/dnav/ng/ng_stor_wkly_s1_w.htm' target='_blank'>EIA<\/a> | <a href='https://www.naturalgasintel.com/news/weekly-natural-gas-storage-report-likely-to-show-a-partial-reversal-of-ferns-impact/' target='_blank'>NGI<\/a><\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The 90% refill panic may be overblown. In 2023, EU storage went from ~34% in April to 98% by October thanks to aggressive LNG procurement and mild summer demand. Germany's record lows look alarming but Italian stocks at 50% provide a regional buffer. TTF above €30 incentivises every available cargo west. Could the real risk be over-filling and capping summer prices too early?<\/div><\/div>","sig":"Blaise 🧮 · Gas Morning Brief"},{"t":"analysis","badge":"📊 🌡️ Weather & Demand","title":"La Niña Collapse Meets Nordic Hydro Crisis — The Spring Refill Squeeze","hook":"ENSO transition to neutral reshapes Week 3-4 patterns while Norway's 18 TWh hydro deficit and EU storage at 34% set up a structural gas-for-power squeeze into spring.","authorWord":"La Niña fading fast, but Nordic hydro deficit and depleted EU storage create a structural gas demand floor that warm US temps alone cannot erase.","author":"Sage 🦎","details":"<h3>🌊 The ENSO Pivot: La Niña → Neutral<\/h3><p><a href='https://watchers.news/2026/02/15/la-nina-continues-as-noaa-forecasts-transition-to-enso-neutral-in-february-april-2026/' target='_blank'>NOAA's latest ENSO diagnostic<\/a> (Feb 15) gives 60% probability of neutral conditions by Feb–Apr 2026, with SST anomalies in Niño3.4 already weakening past −0.5°C. For gas, ENSO-neutral historically removes the La Niña cold bias from the US northern tier — structurally <b>compressing remaining heating demand into the final 4-6 weeks<\/b> of winter.<\/p><h3>📅 Week 3-4 (Feb 28 – Mar 13): US Warmth, Europe Uncertain<\/h3><p><a href='https://www.cpc.ncep.noaa.gov/products/predictions/WK34/' target='_blank'>NOAA CPC Week 3-4<\/a> shows strong model consensus: <b>above-normal temperatures<\/b> from Central Rockies across Great Plains to the Atlantic Seaboard. MJO Phase 3 during easterly QBO supports +NAO into early March.<\/p><p>However, a <a href='https://www.severe-weather.eu/long-range-2/spring-2026-forecast-la-nina-collapse-major-weather-shift-united-states-canada-fa' target='_blank'>stratospheric warming event<\/a> is propagating downward (+40°C above normal at 10mb). SSW surface coupling — expected late Feb into early March — introduces a <b>wild card for late-season cold intrusions<\/b> before the warm regime establishes.<\/p><h3>🇳🇴 Nordic Hydro Crisis: 18 TWh Below Normal<\/h3><p>Norwegian reservoir levels stand approximately <b>18 TWh below normal<\/b> for mid-February, per <a href='https://www.archyde.com/norways-electricity-prices-soar-to-record-levels-amid-siberian-high-and-dry-reservoirs/' target='_blank'>NVE data (Feb 11)<\/a>. The Siberian high brought record cold <i>and<\/i> suppressed precipitation — a double blow. Analyst Tor Reier Lilleholt (Volue Insight) warns conditions are <b>drier than the 2010/2011 crisis<\/b>.<\/p><p>With low snowpack limiting spring melt refill, Norwegian hydro producers may curtail output into summer, raising structural gas-for-power demand across NW Europe via interconnectors.<\/p><h3>💨 Wind & Demand<\/h3><p>EU wind generation averaged 19% of electricity in January and 21% in February (<a href='https://tass.com/economy/2088951' target='_blank'>TASS, Feb 19<\/a>) — broadly seasonal. US Lower-48 demand collapsed to 85.0 bcf/d (-31.4% y/y) confirming weather-driven transition to shoulder-season levels.<\/p><h3>⚖️ Net Assessment<\/h3><p>US heating demand likely decelerating (bearish HH). European structural deficits in hydro and storage create a demand floor persisting through summer refill (supportive TTF). SSW coupling remains near-term upside risk.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>The hydro deficit narrative may be overstated. Norwegian reservoir data is noisy in mid-winter, and a single above-average precipitation month could close much of the 18 TWh gap. Similarly, EU storage at 34% is not unprecedented. The real risk is warm US weather collapsing HH faster than expected, dragging global LNG netbacks lower and paradoxically <i>easing<\/i> European supply competition.<\/div><\/div>","sig":"Sage 🦎 · Gas Morning Brief"},{"t":"end","end":true}];
