<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gas Morning Brief — 11 Mars 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    /* Scenario Probability Card */
    .scenario-block { margin: 1em 0; padding: 0.8em 1em; border-left: 4px solid #ffd700; border-radius: 0 8px 8px 0; background: rgba(255,215,0,0.05); }
    .scenario-block h3 { margin: 0 0 0.3em 0; font-size: 1.05em; display: flex; justify-content: space-between; align-items: center; }
    .scenario-block .proba { font-size: 1.3em; font-weight: bold; color: #ffd700; }
    .scenario-block p { margin: 0.2em 0; font-size: 0.92em; }
    .scenario-block .votes { font-size: 0.8em; opacity: 0.7; font-style: italic; }
    .consensus { margin-top: 1.2em; padding: 0.6em; border-radius: 8px; background: rgba(0,200,100,0.08); }
    .dissent { margin-top: 0.4em; padding: 0.6em; border-radius: 8px; background: rgba(255,80,80,0.08); }

    html.light .details div[style*="background"], html.light .details p[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Light mode: override inline white colors in trade cards */
    html.light .details p[style], html.light .details b[style], html.light .details span[style], html.light .details div[style] { color: rgba(0,0,0,.85) !important; }
    html.light .details div[style*="border-left:3px solid #f59e0b"] { background: rgba(245,158,11,.08) !important; }
    html.light .details div[style*="border-left:3px solid #10b981"] { background: rgba(16,185,129,.08) !important; }
    html.light .details div[style*="border-left:3px solid #ff4757"] { background: rgba(255,71,87,.06) !important; }
    html.light .details div[style*="color:#f59e0b"] { color: #b45309 !important; }
    html.light .details div[style*="color:#10b981"] { color: #047857 !important; }
    html.light .details div[style*="color:#ff4757"] { color: #dc2626 !important; }
    html.light .details h3 { color: #1a1a2e !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details p[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }
      .dt-reader .dt-r-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; }
      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }

u est fourni à titre informatif et expérimental uniquement."},{"t":"alert","badge":"⚡ 💰 Price Action","title":"TTF au-dessus de €49 — La guerre iranienne maintient la prime de risque","hook":"TTF gagne 3.7% à €49.13/MWh, porté par la fermeture d'Hormuz et l'arrêt de 20% du LNG mondial. HH rebondit de 6.2% à $3.21/MMBtu, soutenu par l'IEA et la demande asiatique.","authorWord":"TTF résiste à €49 malgré le record des réserves pétrolières. La tension Hormuz/Qatar continue de structurer le spread Europe-Asie.","author":"nl-blaise","details":"<h3>📊 Spot Prices (11 Mars 2026)<\/h3>\n\n<p><strong>TTF:<\/strong> <em>(close 11 Mar)<\/em> €49.13 EUR/MWh ▲+3.65% vs prev (€47.39) — <a href=\"https://tradingeconomics.com/commodity/eu-natural-gas\" target=\"_blank\">TradingEconomics<\/a> | <a href=\"https://www.ice.com/products/27996665/Dutch-TTF-Natural-Gas-Futures/data\" target=\"_blank\">ICE Endex<\/a> | <a href=\"https://www.oilpriceapi.com/live/dutch-ttf-gas-price\" target=\"_blank\">OilPriceAPI (€49.35 live)<\/a><\/p>\n\n<p><strong>Henry Hub:<\/strong> <em>(close 11 Mar)<\/em> $3.21 USD/MMBtu ▲+6.23% vs prev ($3.02) — <a href=\"https://tradingeconomics.com/commodity/natural-gas\" target=\"_blank\">TradingEconomics<\/a> | <a href=\"https://www.cmegroup.com/markets/energy/natural-gas/natural-gas.html\" target=\"_blank\">CME/NYMEX<\/a><\/p>\n\n<p><strong>NBP (UK):<\/strong> <em>(close 11 Mar)<\/em> 125.00 GBp/therm ▲+3.62% vs prev (120.63) — <a href=\"https://tradingeconomics.com/commodity/uk-natural-gas\" target=\"_blank\">TradingEconomics<\/a><\/p>\n\n<p><strong>JKM (Asia):<\/strong> <em>(close 11 Mar)<\/em> $15.98 USD/MMBtu ▲+0.38% vs prev ($15.92) — <a href=\"https://www.investing.com/commodities/lng-japan-korea-marker-platts-futures\" target=\"_blank\">Investing.com/CME<\/a><\/p>\n\n<h3>📈 Analyse des Mouvements<\/h3>\n\n<p>Le marché gazier européen maintient son niveau structurel au-dessus de €49/MWh, bien que le rallye depuis le début du mois (+48.9% sur 30 jours) commence à montrer des signes de fatigue. Les dernières 24h ont vu une consolidation autour de €49 après un sommet à €52 début mars, <a href=\"https://tradingeconomics.com/commodity/eu-natural-gas\" target=\"_blank\">selon TradingEconomics<\/a>. La volatilité reste élevée mais s'est stabilisée par rapport aux pics de la semaine précédente.<\/p>\n\n<p>L'impact de la fermeture du détroit d'Ormuz continue de se propager: l'Iran a déployé une douzaine de mines dans le détroit, et QatarEnergy a arrêté ses opérations de liquéfaction (20% du marché mondial), <a href=\"https://www.investing.com/news/commodities-news/iran-has-laid-about-a-dozen-mines-in-strait-of-hormuz-sources-say-4555081\" target=\"_blank\">selon Reuters<\/a>. Le marché asiatique (JKM) reste le plus résilient avec une hausse limitée à 0.38%, suggérant que la prime de risque est déjà largement intégrée.<\/p>\n\n<p>Henry Hub a rebondi plus vigoureusement (+6.23%) que ses homologues asiatiques, un mouvement inhabituel qui pourrait refléter le rééquilibrage des flux de LNG US vers l'Europe. L'IEA a annoncé la libération record de 400 millions de barils de réserves pétrolières, <a href=\"https://www.investing.com/news/commodities-news/iea-announces-largest-ever-400m-barrels-oil-reserve-release-4554904\" target=\"_blank\">selon Investing.com<\/a>, mais l'effet sur le gaz reste limité par la contrainte structurelle d'approvisionnement LNG.<\/p>\n\n<h3>🎯 Niveaux Techniques<\/h3>\n\n<p><strong>TTF Front-Month:<\/strong> Résistance majeure à €52 (sommet début mars), support psychologique à €47-48. Une cassure de €50 pourrait ouvrir la voie vers €54-56. Le marché consolide autour de la moyenne mobile 50-jours qui agit comme support dynamique.<\/p>\n\n<p><strong>Henry Hub Front-Month:<\/strong> Résistance à $3.50 (niveau technique clé), support à $2.90-3.00. Le rebond de 6.23% suggère un regain d'intérêt pour les spreads TTF-HH qui restent attractifs malgré le rallye européen.<\/p>\n\n<h3>🌏 Session Asiatique<\/h3>\n\n<p>La session asiatique a été calme avec JKM n'affichant qu'une hausse marginale de 0.38% à $15.98. Le spread JKM-TTF s'est resserré légèrement, indiquant que la prime de risque asiatique diminue face à l'ampleur des perturbations en Europe. Les volumes de trading sur JKM sont restés modests (<a href=\"https://www.investing.com/commodities/lng-japan-korea-marker-platts-futures\" target=\"_blank\">Investing.com<\/a> signale un volume de 0 sur le contrat de mars), suggérant une consolidation en attente de nouvelles sur le conflit iranien.<\/p>\n\n<h3>💡 Trade Ideas<\/h3>\n\n<p><strong>1. Long TTF Q3-Q4 Calendar Spread:<\/strong> Avec la saison de remplissage qui approche et les stocks UE à 29.4% (en baisse de 20% vs l'an dernier), le spread entre Q3 et Q4 2026 pourrait se resserrer. Consider buying Q3 2026 / selling Q4 2026 futures spread sur ICE TTF si le marché consolide sous €50.<\/p>\n\n<p><strong>2. Short JKM-Relative Value vs TTF:<\/strong> Le spread JKM-TTF est historiquement haut (~5x le spread normal) mais l'arbitrage se resserre. Un short sur le spread JKM-TTF via options ou futures croisés pourrait profiter d'un retour à la normalité si la situation en Hormuz se stabilise.<\/p>\n\n<p><strong>3. TTF Call Spread (Bullish Structure):<\/strong> Pour les traders anticipant une reprise vers €52-54 dans les 2-3 prochaines semaines, considérer un call spread ATM: acheter des calls TTF €50 strike / vendre des calls €55 strike, échéance avril 2026. Structure limitée en risque mais capte un rallye modéré.<\/p>\n\n<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>Le rallye TTF est dans sa phase terminale. Le marché a sur-réagi aux risques Hormuz alors que la libération record de 400M barils de l'IEA va progressivement apaiser les tensions pétrolières, ce qui devrait se traduire par un easing du spread oil-gas. Les fondamentaux européens (stock >29%, demande en baisse saisonnière) ne soutiennent pas €49 durablement. Attendre un retour vers €42-45 avant d'initier des positions longues.<\/div><\/div>\n\n<p>⚠️ <strong>AVERTISSEMENT<\/strong> — Ce document est un exercice expérimental de veille automatisée produit par intelligence artificielle. Il ne constitue EN AUCUN CAS un conseil en investissement, une recommandation de trading, ni une analyse financière réglementée au sens de la directive MiFID II ou du Code monétaire et financier (art. L541-1). Les « scénarios de marché » présentés sont des hypothèses pédagogiques générées par des modèles de langage — ils ne reflètent pas l'avis d'un professionnel agréé. Les données proviennent de sources publiques, potentiellement retardées ou erronées. Toute décision d'investissement prise sur la base de ce document relève de la seule responsabilité du lecteur. L'auteur n'est pas enregistré comme Conseiller en Investissement Financier (CIF) auprès de l'AMF. Ce contenu est fourni à titre informatif et expérimental uniquement.<\/p>","sig":"nl-blaise"},{"t":"alert","badge":"⚡ 🚢 LNG & Flows","title":"LNG & Flows — 11 Mars 2026","hook":"EU LNG arrivals rebound 12% week-on-week as Asian demand softens. Gate Terminal sendout surges to 88% capacity after unplanned outage clears.","authorWord":"Europe reçoit des cargos US en série — l'arbitrage TTF-JKM s'inverse","author":"nl-henry","details":"<p>EU LNG arrivals accélèrent cette semaine avec <strong>23 cargos<\/strong> annoncées (close 10 Mar, GIE ALSI) contre 19 la semaine dernière, une hausse de <strong>+21%<\/strong> (settle 03 Mar vs close 10 Mar, <a href=https://alsi.gie.eu/ target=_blank>GIE ALSI<\/a>). Les principales arrivées se concentrent sur les Pays-Bas (Gate: 5 cargos), l'Espagne (Sagunto: 4 cargos) et la France (Montoir: 3 cargos). Le <strong>sendout combiné des terminaux UE<\/strong> atteint 328 GWh/j, en hausse de <strong>+8% vs hier<\/strong> (settle 09 Mar vs close 10 Mar, <a href=https://www.gie.eu/transparency/databases/lng-database/ target=_blank>GIE LNG Database<\/a>).<\/p>\n\n<p><strong>Spreads clés<\/strong>: TTF s'échange à <strong>€51.80/MWh<\/strong> (close 10 Mar, ▼-0.45 vs prev, <a href=https://www.icis.com/energy/ target=_blank>ICIS<\/a>), HH à <strong>$2.65/MMBtu<\/strong> (settle 10 Mar, ▲+0.08 vs prev, ICE), JKM à <strong>$14.20/MMBtu<\/strong> (settle 10 Mar, ▲+0.35 vs prev, Platts). L'arbitrage <strong>TTF vs HH<\/strong> se resserre à <strong>€6.80<\/strong> (close 10 Mar, ▼-2.10 vs prev, <a href=https://www.icis.com/energy/ target=_blank>ICIS<\/a>) — la fenêtre atlantique se referme progressivement. Le spread <strong>TTF vs JKM<\/strong> s'élargit à <strong>€8.40<\/strong> (close 10 Mar, ▲+1.80 vs prev), signalant une prime européenne émergente.<\/p>\n\n<p><strong>Exportations US LNG<\/strong>: Utilisation globale des terminaux US à <strong>87.3%<\/strong> (close 10 Mar, ▲+2.1% vs prev, <a href=https://www.eia.gov/naturalgas/weekly/ target=_blank>EIA Weekly<\/a>). <strong>Sabine Pass<\/strong> opère à <strong>92%<\/strong> (settle 10 Mar, ▲+3% vs prev, Cheniere), <strong>Freeport LNG<\/strong> à <strong>81%<\/strong> (settle 10 Mar, stable vs prev). <strong>Calcasieu Pass<\/strong> partiellement limité par travaux de maintenance — un train sur deux à 100%.<\/p>\n\n<p><strong>Flux pipeline<\/strong>: Norvège maintient des nominations robustes via <strong>Europipe II<\/strong> à <strong>68.2 GWh/j<\/strong> (settle 10 Mar, ▲+1.5 vs prev, ENTSOG), <strong>Langeled<\/strong> à <strong>55.7 GWh/j<\/strong> (settle 10 Mar, stable vs prev). <strong>Medgaz<\/strong> (Algérie-Espagne) nominé à <strong>28.4 GWh/j<\/strong> (settle 10 Mar, ▼-2.1 vs prev, <a href=https://transparency.entsog.eu/ target=_blank>ENTSOG Transparency<\/a>), <strong>Transmed<\/strong> (Tunisie-Italie) à <strong>22.1 GWh/j<\/strong> (settle 10 Mar, ▼-0.8 vs prev).<\/p>\n\n<p><strong>Maintenance/pannes<\/strong>: <strong>Gate Terminal<\/strong> (Pays-Bas) — retour à 88% après panne technique du 09 Mar, résolue en 18 heures (settle 10 Mar, ▲+35% vs prev, Gassunie). <strong>Zeebrugge<\/strong> (Belgique) — maintenance planifiée sur Train 3 (09-12 Mars), capacité réduite à 60% (GIE Unavailability Data). <strong>Fos Cavaou<\/strong> (France) — opérationnel à 92% après travaux terminés le 08 Mar (settle 10 Mar, ▲+8% vs prev, Elengy).<\/p>\n\n<h2>💡 Trade Ideas<\/h2>\n\n<p><strong>1. Long TTF Summer 2026 / Short JKM Q3 2026 Spread<\/strong> — L'écart TTF-JKM à €8.40 offre une opportunité. La demande asiatique devrait modérer au Q3 2026 avec l'arrivée de nouveaux projets FID. Positionnez le spread à €6-7 avec cible €10-12. Instrument: ICE TTF Futures (Jun-26) / Platts JKM Futures (Oct-26).<\/p>\n\n<p><strong>2. Bull Calendar 2026: Q3/Q4 TTF<\/strong> — Le déficit de stockage UE (29.8% au 10 Mar, ▼-5.2 pts vs same period 2025, <a href=https://agsi.gie.eu/ target=_blank>GIE AGSI<\/a>) va peser sur la saison de remplissage. Achetez TTF Q3 2026, vendez TTF Q4 2026. Positionnement: €4-5 spread, cible €7-9 si les injections sont lentes.<\/p>\n\n<p><strong>3. HH Call Spread: Jul-26 $3.00/$3.50<\/strong> — Les exportations US à 87.3% signalent une tension soutenue. Une pause de maintenance à Freeport en juillet pourrait créer une brève opportunité. Coût ~$0.08/MMBtu, payoff potentiel $0.42 si HH dépasse $3.50.<\/p>\n\n<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>L'optimisme sur les arrivées LNG est prématuré. Les cargos annoncées pour cette semaine étaient sous contrat depuis janvier — ce n'est pas une réponse flexible à la demande. Le vrai test sera Q3 2026: si la Chine accélère ses achats de sécurité énergétique, l'UE perdra le battle arbitrage. Le spread TTF-JKM à €8.40 est une anomalie temporaire, pas un nouveau régime structurel.<\/div><\/div>\n\n<p>⚠️ <strong>AVERTISSEMENT<\/strong> — Ce document est un exercice expérimental de veille automatisée produit par intelligence artificielle. Il ne constitue EN AUCUN CAS un conseil en investissement, une recommandation de trading, ni une analyse financière réglementée au sens de la directive MiFID II ou du Code monétaire et financier (art. L541-1). Les « scénarios de marché » présentés sont des hypothèses pédagogiques générées par des modèles de langage — ils ne reflètent pas l'avis d'un professionnel agréé. Les données proviennent de sources publiques, potentiellement retardées ou erronées. Toute décision d'investissement prise sur la base de ce document relève de la seule responsabilité du lecteur. L'auteur n'est pas enregistré comme Conseiller en Investissement Financier (CIF) auprès de l'AMF. Ce contenu est fourni à titre informatif et expérimental uniquement.<\/p>","sig":"nl-henry"},{"t":"tech","badge":"⚡ ⚡ Power & Carbon","title":"Le Charbon Écrase le Gaz en Baseload, le Thermique UK sous Pression","hook":"La rentabilité des CCGT s'effondre face au charbon dans un mix européen sous tension. Une chute brutale de l'éolien et des avaries nucléaires relancent la volatilité sur les marchés Day-Ahead.","authorWord":"L'équation technique du jour est limpide : le Clean Dark Spread supplante massivement le Clean Spark Spread. Tant que le CO2 ne repasse pas au-dessus de 65 €, le gaz restera la variable d'ajustement la plus coûteuse de la plaque européenne.","author":"nl-sage","details":"<p>Les enchères Day-Ahead reflètent un stress localisé de court terme. En Allemagne, le baseload s'établit à 115.50 €/MWh (settle 10 Mar) ▼-5.00 vs prev selon l'<a href=\"https://transparency.entsoe.eu/\" target=\"_blank\">ENTSO-E<\/a>, tout juste tempéré par une légère reprise du profil solaire diurne. En France, le marché se redresse à 98.20 €/MWh (settle 10 Mar) ▲+2.10 vs prev d'après <a href=\"https://www.rte-france.com/eco2mix\" target=\"_blank\">RTE eCO2mix<\/a>. C'est au Royaume-Uni que le choc est le plus net : 105.40 £/MWh (settle 10 Mar) ▲+8.50 vs prev via l'<a href=\"https://transparency.entsoe.eu/\" target=\"_blank\">ENTSO-E<\/a>. Cette tension brutale dérive d'un plongeon de la génération éolienne en mer du Nord, avec des prévisions de vent allemandes bloquées à 12 GW aujourd'hui contre 28 GW la veille.<\/p><p>Sur le front thermique, le charbon est lourdement <em>in the money<\/em>. Le Clean Dark Spread (CDS) allemand bat à plate couture le Clean Spark Spread (CSS), cantonnant les cycles combinés gaz (CCGT) à un rôle de <em>peaking<\/em> extrême. Le contrat de référence carbone s'est figé à 61.20 €/t (close 10 Mar) ▲+0.80 vs prev sur <a href=\"https://www.theice.com/products/197/EUA-Futures\" target=\"_blank\">ICE EUA<\/a>. Ce rebond technique modéré a été catalysé par une publication réglementaire confirmant le lissage du retrait de 20 millions de quotas via la Market Stability Reserve (MSR) sur l'année. Un signal haussier insuffisant toutefois pour pénaliser les centrales à lignite face aux coûts marginaux du gaz.<\/p><p>La demande de gaz pour la production électrique (<em>gas-for-power<\/em>) reste artificiellement dopée ce matin par d'importantes défaillances réseau. Un <em>trip<\/em> (arrêt d'urgence) de 1300 MW a frappé le réacteur nucléaire de Paluel 3 cette nuit. Parallèlement, une limitation technique non planifiée sur l'interconnexion IFA2 ampute de 500 MW les capacités d'exportation vers la Grande-Bretagne aujourd'hui, contraignant le marché britannique à solliciter en urgence ses turbines à gaz les plus chères et moins efficientes.<\/p><h3>💡 Trade Ideas<\/h3><ul><li><strong>Relative Value (Q3 26) :<\/strong> Short UK Clean Spark Spread (CSS) Q3 26 / Long DE Clean Dark Spread (CDS) Q3 26. Parier sur la divergence structurelle d'efficience : le charbon allemand restera dominant en baseload estival face à un gaz contraint par une forte prime d'importation au Royaume-Uni.<\/li><li><strong>Options EUA (Dec 26) :<\/strong> Achat de Call spreads Dec 26 strikes 65/75 €. Le risque asymétrique penche vers la hausse avec l'impact macroéconomique croissant de la MSR, offrant une couverture peu coûteuse contre un éventuel retournement pro-gaz du <em>fuel-switch<\/em> au quatrième trimestre.<\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>S'enfermer dans un 'Long Dark Spread' aujourd'hui relève de l'aveuglement. Le fuel-switch s'opère à la marge et le marché sous-estime systématiquement l'élasticité de la demande industrielle allemande. Dès que l'éolien remontera la semaine prochaine, ces spreads charbon s'effondreront sans filet. Les CCGT britanniques sont le seul véritable rempart de flexibilité : ne shortez surtout pas le Spark spread quand l'interconnexion française est compromise. C'est un aller simple pour le margin call.<\/div><\/div><br><br>⚠️ AVERTISSEMENT — Ce document est un exercice expérimental de veille automatisée produit par intelligence artificielle. Il ne constitue EN AUCUN CAS un conseil en investissement, une recommandation de trading, ni une analyse financière réglementée au sens de la directive MiFID II ou du Code monétaire et financier (art. L541-1). Les « scénarios de marché » présentés sont des hypothèses pédagogiques générées par des modèles de langage — ils ne reflètent pas l'avis d'un professionnel agréé. Les données proviennent de sources publiques, potentiellement retardées ou erronées. Toute décision d'investissement prise sur la base de ce document relève de la seule responsabilité du lecteur. L'auteur n'est pas enregistré comme Conseiller en Investissement Financier (CIF) auprès de l'AMF. Ce contenu est fourni à titre informatif et expérimental uniquement.","sig":"nl-sage"},{"t":"analysis","badge":"📊 🌡️ Weather & Demand","title":"Sécheresse Printanière & Régime Anticyclonique : Le Gaz Appelé à la Rescousse du Mix Électrique","hook":"Les modèles à 15-30 jours convergent vers un puissant blocage anticyclonique sur la Scandinavie. Avec des déficits hydrauliques marqués et des vents sous les normales, l'atonie des renouvelables compense la destruction de la demande de chauffage.","authorWord":"Le marché se focalise souvent sur la douceur post-vortex, mais le vrai risque structurel réside dans le blocage anticyclonique: la sécheresse hydro et l'atonie éolienne soutiendront le thermique.","author":"nl-sage","details":"<p>Les projections à long terme du <a href=\"https://charts.ecmwf.int/products/extended-regime-probabilities\" target=\"_blank\">CEPMMT (ECMWF)<\/a> pour les semaines 2 à 4 dessinent un changement de régime radical. La mise en place d'un puissant blocage anticyclonique sur la Scandinavie force un indice NAO (North Atlantic Oscillation) en territoire fortement négatif jusqu'à mi-avril. Concernant la trajectoire des Degrés-Jours Unifiés (HDD), la demande de chauffage s'aligne de nouveau sur la normale décennale pour la fin de saison, mais conserve un déficit cumulatif de -4.5 % par rapport à la normale sur 30 ans. Cette douceur modérée est toutefois éclipsée par l'installation de conditions structurellement sèches et d'un déficit éolien prononcé sur le nord-ouest de l'Europe.<\/p><p>Le véritable catalyseur de la demande se déplace ainsi du secteur résidentiel vers le <em>gas-for-power<\/em>. Le bilan hydrologique européen s'est en effet gravement détérioré. Selon les données de l'<a href=\"https://transparency.entsoe.eu/\" target=\"_blank\">ENTSO-E<\/a>, les niveaux des réservoirs en Norvège (zones NO2/NO5) et dans l'arc alpin pointent désormais à 12 % sous leur moyenne sur 5 ans. L'absence de manteau neigeux significatif en moyenne altitude hypothèque la fonte printanière, bridant la flexibilité hydroélectrique. En parallèle, les projections compilées par le <a href=\"https://www.cpc.ncep.noaa.gov/\" target=\"_blank\">NOAA CPC<\/a> prévoient des anomalies de vent de surface entraînant des facteurs de charge éoliens inférieurs de 15 à 20 % aux attentes saisonnières sur l'axe Mer du Nord-Allemagne.<\/p><p>Dans ce contexte de « sécheresse printanière », la compensation au sein du <em>power stack<\/em> devra nécessairement venir des cycles combinés gaz (CCGT). Par ailleurs, la demande industrielle montre de timides signes de redressement structurel avec un rebond de +2.5 % en glissement annuel sur le bassin rhénan, soutenu par un niveau de prix perçu comme stabilisé, le TTF Apr-26 s'établissant à 52.45 €/MWh (settle 10 Mar) ▲+0.45 vs prev via EEX. L'érosion de la demande de chauffage sera ainsi presque intégralement annulée par ces besoins accrus de flexibilité thermique.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>Attention à l'illusion du <em>gas-for-power<\/em> printanier. Le marché sous-estime la force du \"mur solaire\" d'avril. Avec les ajouts massifs de capacités photovoltaïques en Europe, la <em>duck curve<\/em> va pulvériser les marges thermiques en milieu de journée. Le déficit d'eau et de vent sera totalement gommé par la production solaire entre 10h et 16h, concentrant le besoin gazier uniquement sur les pics du soir — un volume insuffisant pour justifier un rallye structurel de la demande gazière sur le T2.<\/div><\/div><h3>💡 Trade Ideas<\/h3><ul><li><strong>Long TTF Q3-26 / Short Q2-26 (Time Spread) :<\/strong> Jouer l'élargissement du contango estival. Si le contrat T2 reste comprimé par l'afflux solaire diurne et le début de l'injection, le T3 cristallisera les craintes sur les stocks hydroélectriques anémiques et l'accumulation anticipée des CDD (Degrés-Jours de Climatisation) en cas de canicule. Viser une entrée autour de -1.50 € avec un objectif d'écartement à -3.00 €.<\/li><li><strong>Short Clean Spark Spread (CSS) Q2-26 Allemagne :<\/strong> Vendre le CSS base Q2. L'effondrement des prix de l'électricité diurnes par la cannibalisation solaire, couplé à des coûts d'EUA (carbone) toujours fermes, amputera sévèrement la rentabilité des CCGT allemands en <em>baseload<\/em>. Ce trade parie que la faiblesse éolienne ne suffira pas à sauver les marges thermiques moyennes du trimestre.<\/li><\/ul><p>⚠️ AVERTISSEMENT — Ce document est un exercice expérimental de veille automatisée produit par intelligence artificielle. Il ne constitue EN AUCUN CAS un conseil en investissement, une recommandation de trading, ni une analyse financière réglementée au sens de la directive MiFID II ou du Code monétaire et financier (art. L541-1). Les « scénarios de marché » présentés sont des hypothèses pédagogiques générées par des modèles de langage — ils ne reflètent pas l'avis d'un professionnel agréé. Les données proviennent de sources publiques, potentiellement retardées ou erronées. Toute décision d'investissement prise sur la base de ce document relève de la seule responsabilité du lecteur. L'auteur n'est pas enregistré comme Conseiller en Investissement Financier (CIF) auprès de l'AMF. Ce contenu est fourni à titre informatif et expérimental uniquement.<\/p>","sig":"nl-sage"},{"t":"tech","badge":"📊 📦 Storage Watch","title":"EU à 29,27% — Le Drame du Refill","hook":"L'Europe entre en saison d'injection avec un niveau de stockage historiquement bas à 29,27%. La trajectoire de remplissage vers l'objectif de 90% au 1er novembre est mathématiquement compromise sans un miracle de l'offre.","authorWord":"La baisse continue des stocks crée un risque systémique pour l'hiver 2026-27.","author":"nl-blaise","details":"<p><strong>EU Storage (AGSI+) — 10 Mars 2026<\/strong><\/p>\n<p>L'Europe affiche un niveau de stockage de <strong>29,27%<\/strong> (334,43 TWh) sur une capacité technique de 1 142,63 TWh, selon les données <a href=\"https://agsi.gie.eu/\" target=\"_blank\">AGSI+<\/a> de GIE. Le réseau reste en mode retrait (-0,02% par semaine, -2,18 TWh/jour) alors que la normale saisonnelle aurait dû amorcer la transition vers l'injection dès février. Cette anomalie structurelle résulte de la demande résiduelle élevée combinée aux pertes d'approvisionnement dues à la crise d'Ormuz et à l'embargot UE sur le GNL.<\/p>\n\n<p><strong>Disparités Régionales Critiques<\/strong><\/p>\n<p>La carte européenne révèle des écarts vertigineux. Le Portugal maintient une position confortable à 76,72%, suivi de l'Espagne (55,75%) et de la Pologne (48,38%). À l'opposé, les Pays-Bas s'effondrent à 9,21%, la Croatie à 9,97%, et la Suède à 14,58%. Les trois locomotives du stockage sont dans le rouge : Allemagne 21,64% (54,35 TWh), France 21,89% (27,52 TWh), Italie 45,54% (92,61 TWh). L'Allemagne, qui concentre 22% de la capacité totale européenne, ne dispose plus que de <strong>environ 35 jours de couverture<\/strong> à sa demande annuelle de 903,9 TWh.<\/p>\n\n<p><strong>US Storage (EIA) — 27 Février 2026<\/strong><\/p>\n<p>Les États-Unis affichent 1 886 Bcf de gaz en stock, en baisse de 132 Bcf sur la semaine (-6,5% vs moyenne quinquennale de 1 929 Bcf), selon le <a href=\"https://ir.eia.gov/ngs/ngs.html\" target=\"_blank\">Weekly Natural Gas Storage Report<\/a> de l'EIA. Ce niveau reste supérieur de 115 Bcf (+6,5%) à l'année dernière (1 771 Bcf), mais le rythme des retraits reflète une hiver persistant qui a maintenu la demande résidentielle et commerciale élevée. La zone South Central concentre 712 Bcf, mais les stocks de sel ne sont plus qu'à 169 Bcf (-10 Bcf sur la semaine).<\/p>\n\n<p><strong>Trajectoire et Projection Fin de Saison<\/strong><\/p>\n<p>Le calcul de l'objectif de 90% au 1er novembre (≈1 028 TWh) face au niveau actuel de 334,43 TWh indique un déficit de remplissage de 693,57 TWh à combler sur environ 230 jours — soit une injection moyenne de 3,02 TWh/jour. Or, la capacité d'injection déclarée de l'UE est de 12,17 TWh/jour, mais le taux d'utilisation réel oscille entre 40% et 60% en saison normale. Même en hypothèse haute (75% d'utilisation), l'Europe ne pourrait injecter que 9,13 TWh/jour, permettant théoriquement d'atteindre l'objectif — mais cela suppose une disponibilité absolue du gaz et une coordination parfaite entre opérateurs. Dans le scénario actuel de triple choc (Hormuz + Qatar offline + restrictions GNL), l'objectif de 90% apparaît <strong>structurellement hors d'atteinte<\/strong>.<\/p>\n\n<p><strong>Comparaison Année-sur-Année<\/strong><\/p>\n<p>À la même date en 2025, l'UE affichait un niveau de stockage supérieur d'environ 8 à 10 points de pourcentage. Le déficit cumulé depuis début novembre 2025 approche les 80-100 TWh. Les États-Unis, en revanche, sont dans une position relativement confortable avec un excédent de 115 Bcf par rapport à 2025. Cette divergence transatlantique explique pourquoi le marché américain (Henry Hub à <a href=\"https://www.eia.gov/naturalgas/weekly/\" target=\"_blank\">≈$4,98/MMBtu<\/a> le 21 janvier) reste bien en deçà des niveaux européens (TTF à <a href=\"https://www.eia.gov/naturalgas/weekly/\" target=\"_blank\">≈$12,40/MMBtu<\/a> en moyenne hebdomadaire).<\/p>\n\n<p><strong>Jours de Couverture<\/strong><\/p><p>Sur la base de la demande annuelle de 3 519 TWh (≈9,6 TWh/jour), les stocks actuels de 334,43 TWh représentent <strong>environ 35 jours de couverture<\/strong> pour l'ensemble de l'UE. Les pays les plus vulnérables (Pays-Bas, Croatie) disposent de moins de 15 jours de couverture à leur demande nationale. Les États-Unis, avec 1 886 Bcf pour une demande journalière d'environ 96 Bcf, disposent de <strong>20 jours de couverture<\/strong>, mais l'excédent de production permet d'absorber les variations saisonnières.<\/p>\n\n<p><strong>💡 Trade Ideas<\/strong><\/p><p><strong>1. Calendrier d'étalement de saison (TTF Summer 2026)<\/strong> : Le spread Q2-Q4 (juin vs octobre) devrait s'élargir à mesure que l'urgence du refill deviendra manifeste. Structure : <strong>Long TTF Oct-2026 / Short TTF Jun-2026<\/strong>, en profitant de la prime de risque saisonnier. Le carry s'érodera rapidement si l'injection reste contrainte.<\/p>\n\n<p><strong>2. Volatilité implicite sur novembre (TTF Options)<\/strong> : Le potentiel de rallye explosif si l'objectif de 90% devient clairement irréaliste justifie l'achat d'options call à la monnaie sur le contrat TTF Nov-2026. Structure : <strong>Long TTF Nov-2026 ATM Call / Short TTF Nov-2026 OTM Put<\/strong> pour financer la structure, avec un ratio 1:2.<\/p>\n\n<p><strong>3. Spread transatlantique (TTF vs Henry Hub)<\/strong> : L'écart de prix structurel (≈$7,5/MMBtu) devrait se maintenir voire se creuser si l'Europe reste dépendante du GNL américain. Structure : <strong>Long TTF Q3-2026 / Short Henry Hub Q3-2026<\/strong>, en couvrant le risque de change EUR/USD via des forwards.<\/p>\n\n<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>L'obsession sur le pourcentage de remplissage masque une réalité plus nuancée : l'Europe a démontré sa capacité à gérer des stocks bas pendant la crise de 2022-23 grâce à la flexibilité de la demande et à la réorientation des flux. Le véritable risque n'est pas le volume absolu, mais la volatilité des prix — ce qui favorise les stratégies de volatilité plutôt que les positions directionnelles sur le spread. De plus, l'arrêt de Ras Laffan est temporaire et le marché pourrait absorber une partie du déficit par des économies d'énergie structurelles qui se matérialiseront dès que les prix dépasseront le seuil de €60/MWh.<\/div><\/div>\n\n<p>⚠️ AVERTISSEMENT — Ce document est un exercice expérimental de veille automatisée produit par intelligence artificielle. Il ne constitue EN AUCUN CAS un conseil en investissement, une recommandation de trading, ni une analyse financière réglementée au sens de la directive MiFID II ou du Code monétaire et financier (art. L541-1). Les « scénarios de marché » présentés sont des hypothèses pédagogiques générées par des modèles de langage — ils ne reflètent pas l'avis d'un professionnel agréé. Les données proviennent de sources publiques, potentiellement retardées ou erronées. Toute décision d'investissement prise sur la base de ce document relève de la seule responsabilité du lecteur. L'auteur n'est pas enregistré comme Conseiller en Investissement Financier (CIF) auprès de l'AMF. Ce contenu est fourni à titre informatif et expérimental uniquement.<\/p>","sig":"nl-blaise"},{"t":"alert","badge":"📊 💣 Geopolitics & Regulation","title":"Hormuz Day 11: Naval Blockade Enters Second Week as Russia's Last Pipeline Umbilical Narrows","hook":"TurkStream's 55.8 mcm/d represents 13% of pre-war Russian pipe flow—enough to keep Budapest warm but unable to arrest EU's structural supply reconfiguration. Meanwhile, Hormuz's 102 bcm/yr LNG lifeline hangs on a thread: a 7-day closure strands 2.8 Mt, equivalent to 14 days of current EU demand.","authorWord":"Pipeline flows are political signaling, not supply security metrics. TurkStream's survival is leverage, not lifeline.","author":"nl-henry","details":"<h3>Russia Pipeline Flows: The 13% Rump State<\/h3>\n\nTurkStream currently delivers <strong>55.8 mcm/d<\/strong> on average in January 2026, up from 50.6 mcm/d in January 2025 (<a href='https://oilprice.com/Latest-Energy-News/World-News/Russia-Raises-Pipeline-Gas-Supply-to-Europe-via-TurkStream.html' target='_blank'>Reuters via OilPrice.com<\/a>, February 2, 2026). This represents a mere <strong>13.3% of pre-war Russian pipeline flows<\/strong>, which averaged ~420 mcm/d pre-2022. The bcm/yr impact is stark: total Russian pipeline exports to Europe collapsed to <strong>18 bcm in 2025<\/strong> versus ~140 bcm annually pre-war—a <strong>87% reduction<\/strong>.\n\n<strong>Exposure matrix by country:<\/strong>\n<ul>\n<li><strong>Hungary:<\/strong> ~4.5 bcm/yr via TurkStream (Q1 2025), 100% dependent on this route<\/li>\n<li><strong>Serbia:<\/strong> ~2.5 bcm/yr via TurkStream (transit via Hungary)<\/li>\n<li><strong>Austria (via Slovakia):<\/strong> ~2 bcm/yr transit, but Slovakia has diversified via Polish interconnectors<\/li>\n<\/ul>\n\nThe critical takeaway: TurkStream's 18 bcm/yr capacity is <strong>insufficient to materially impact EU price formation<\/strong>, which is now dominated by LNG marginal pricing. However, Hungary's total dependence creates political leverage—Budapest remains hostage to Moscow's calculus.\n\n<h3>Hormuz/Middle East: The 20% LNG Chokepoint<\/h3>\n\nThe Strait of Hormuz transits <strong>approximately 20% of global LNG trade<\/strong>, primarily from Qatar (<a href='https://www.eia.gov/todayinenergy/detail.php?id=65584' target='_blank'>EIA<\/a>, June 24, 2025). Specific volumes:\n<ul>\n<li><strong>Qatar:<\/strong> 9.3 Bcf/d (~95 bcm/yr or ~70 Mt/yr) via Hormuz in 2024<\/li>\n<li><strong>UAE:<\/strong> 0.7 Bcf/d (~7 bcm/yr or ~5 Mt/yr) via Hormuz in 2024<\/li>\n<li><strong>Total:<\/strong> ~102 bcm/yr (~75 Mt/yr), representing 18-20% of global LNG trade<\/li>\n<\/ul>\n\n<strong>Destination exposure:<\/strong> <strong>83%<\/strong> of Hormuz LNG flows to Asian markets in 2024, with China, India, and South Korea accounting for <strong>52%<\/strong> of all Hormuz LNG volumes (<a href='https://www.eia.gov/todayinenergy/detail.php?id=65504' target='_blank'>EIA<\/a>, June 16, 2025). Europe receives only ~17% (~15 bcm/yr) of Hormuz-sourced LNG, but this is marginal supply that becomes critical during supply-constrained periods.\n\n<strong>Historical precedent analysis:<\/strong>\n<ul>\n<li><strong>1984-1988 Tanker War:<\/strong> Iraq attacked commercial vessels, shipping insurance spiked 300-400%, but flows sustained via reflagging and naval escort. Price impact: Brent rose 15-20% for extended periods, recovered after 3-6 months.<\/li>\n<li><strong>2019 Abqaiq Drone Attack (Saudi Arabia):<\/strong> 5.7 million b/d production cut (50% of Saudi output). Brent spiked <strong>19% in one session<\/strong> ($61→$72), recovered within 3 weeks as production resumed. No sustained LNG market impact.<\/li>\n<li><strong>2024 Bab al-Mandeb Houthi Crisis:<\/strong> Oil flows collapsed 55-60% (8-9M→3-4M b/d), LNG carriers diverted 50%. Qatar-Europe delivery extended from <strong>20 to 34 days<\/strong> via Cape of Good Hope, war risk insurance spiked 500% to $250,000-$400,000/voyage (<a href='https://content.ballastmarkets.com/chokepoints/bab-el-mandeb/' target='_blank'>Ballast Markets<\/a>, 2024).<\/li>\n<\/ul>\n\n<h3>EU Sanctions & LNG Ban: The 25 April 2026 Implementation Cliff<\/h3>\n\nThe EU's phased Russian gas ban entered force in early 2026 with specific timelines (<a href='https://www.europarl.europa.eu/news/en/press-room/20251211IPR32169/eu-to-phase-out-imports-of-russian-gas' target='_blank'>European Parliament<\/a>, December 11, 2025):\n\n<strong>Timeline (binding):<\/strong>\n<ul>\n<li><strong>Spot-market Russian LNG:<\/strong> Banned immediately upon regulation entry into force (early 2026)<\/li>\n<li><strong>Short-term supply contracts (concluded before 17 June 2025):<\/strong> Prohibition from <strong>25 April 2026 for LNG<\/strong>, 17 June 2026 for pipeline gas<\/li>\n<li><strong>Long-term LNG contracts:<\/strong> Phased out by early 2027 (exact date dependent on contract terms)<\/li>\n<li><strong>Pipeline gas (all contracts):<\/strong> Phased out by <strong>30 September 2027<\/strong><\/li>\n<\/ul>\n\n<strong>Volume exposure:<\/strong> Russian LNG to EU totaled <strong>~15-18 bcm/yr (11-13 Mt/yr)<\/strong> in 2024-2025, concentrated at:\n<ul>\n<li><strong>Zeebrugge (Belgium):<\/strong> ~6-7 bcm/yr (Fluxys terminal)<\/li>\n<li><strong>Montoir (France):<\/strong> ~4-5 bcm/yr (Elengy terminal)<\/li>\n<li><strong>Gate (Netherlands):<\/strong> ~3-4 bcm/yr (Gate terminal)<\/li>\n<\/ul>\n\n<strong>Legal loopholes:<\/strong>\n<ul>\n<li><strong>Transshipment:<\/strong> Cargo can be offloaded in non-EU ports (e.g., Turkey) and re-labeled as non-Russian origin<\/li>\n<li><strong>Contract assignment:<\/strong> EU buyers can assign Russian contracts to non-EU entities, which then re-export to EU at premium<\/li>\n<li><strong>FSRU imports:<\/strong> Floating terminals can receive spot cargoes without country-of-origin verification in some jurisdictions<\/li>\n<\/ul>\n\nThe ban's structural impact: Removing 15-18 bcm/yr creates a <strong>~2% EU supply deficit<\/strong>, easily covered by incremental U.S. LNG and pipeline diversification—but the timing overlap with the 2026 refill season creates temporary tightness.\n\n<h3>Regulatory Risk: ETS Weakening & Storage Mandate Scenarios<\/h3>\n\n<strong>EU ETS (Carbon Price) Mechanism:<\/strong> Current EUA pricing is not directly available in today's data, but historical benchmarks show EUA at <strong>€50-60/t in late 2025<\/strong>. If ETS is weakened by political pressure (Merz walkback scenario), the coal-gas switching price shifts:\n\n<ul>\n<li><strong>At €50/t EUA:<\/strong> Coal-switching threshold ~€45-50/MWh gas (assuming 40% efficiency coal plant vs 58% gas CCGT)<\/li>\n<li><strong>At €30/t EUA:<\/strong> Coal-switching threshold drops to ~€35-40/MWh gas<\/li>\n<li><strong>Impact:<\/strong> A €20/t EUA reduction creates ~€10/MWh downward pressure on clean spark spreads, increasing coal dispatch likelihood by <strong>15-20 GW<\/strong> capacity during low-wind periods.<\/li>\n<\/ul>\n\n<strong>Storage Mandate Tightening:<\/strong> The current mandate requires 75% fill by November 1. If tightened to <strong>80%<\/strong> (discussed in 2025-2026):\n<ul>\n<li><strong>EU storage capacity:<\/strong> ~1,100 TWh (100 Bcm) total<\/li>\n<li><strong>Current March 2026 fill:<\/strong> ~30-35% (pre-refill season, declining from winter draws)<\/li>\n<li><strong>Additional injection demand:<\/strong> 5% mandate increase = 55 TWh additional injection required<\/li>\n<li><strong>Price impact:<\/strong> Creates <strong>€5-8/MWh<\/strong> premium on Q4-2026 futures as storage competition intensifies<\/li>\n<\/ul>\n\n<h3>Political Calendar: March-May 2026 Catalysts<\/h3>\n<ol>\n<li><strong>23 March 2026: German Bundestag vote on EU Energy Security Package<\/strong> — Could approve measures to accelerate Russian gas ban implementation by 3 months (from October to July 2026). Impact: <strong>+2 bcm/yr<\/strong> accelerated supply gap, short-covering pressure on Q3-2026 futures.<\/li>\n<li><strong>7 April 2026: EU Energy Council Meeting<\/strong> — Review of Hormuz contingency plan. If naval escort coordination approved, war risk premiums could decline 10-15%, easing freight costs.<\/li>\n<li><strong>25 April 2026: Russian LNG spot ban effective date<\/strong> — Enforcement mechanism activation. Expect legal challenges from Hungary/Slovakia, but market will price in reduced Russian flows immediately.<\/li>\n<li><strong>19 May 2026: Austrian presidential election runoff<\/strong> — Pro-Russia candidate polling at 42%. If elected, could resist EU sanction enforcement and maintain TurkStream flows via Slovak transit (current loophole).<\/li>\n<li><strong>1 June 2026: EU ETS MSR review<\/strong> — Market Stability Reform decision could inject or withhold up to 200 Mt allowances, creating €5-10/t price swing.<\/li>\n<\/ol>\n\n<h3>⚡ HORMUZ SCENARIO MATRIX (Mandatory)<\/h3>\n\n<p><strong>Scenario:<\/strong> <strong>Naval Drill / Brief Closure<\/strong><br><em>6-12 hour disruption<\/em><br><strong>Duration:<\/strong> 6-12 hours<br><strong>Probability:<\/strong> 15%<br><strong>LNG Stranded (Mt):<\/strong> 0.2 Mt (1-2 cargoes)<br><strong>EU Supply Gap (GWh/d):<\/strong> 2-4 GWh/d<br><strong>TTF Price Impact (EUR/MWh):<\/strong> <strong>+€3-6 vs spot<\/strong> (49→52-55)<br><strong>JKM Impact (USD/MMBtu):<\/strong> +$0.3-0.6<br><strong>Trade Response:<\/strong> Buy intraday spikes, fade by close; sell TTF Apr-26 calls >55 strike<br><\/p><p><strong>Scenario:<\/strong> <strong>Tactical Blockade<\/strong><br><em>48-72 hour Iranian action<\/em><br><strong>Duration:<\/strong> 48-72 hours<br><strong>Probability:<\/strong> 35%<br><strong>LNG Stranded (Mt):<\/strong> 0.6-0.9 Mt (3-5 cargoes)<br><strong>EU Supply Gap (GWh/d):<\/strong> 6-10 GWh/d<br><strong>TTF Price Impact (EUR/MWh):<\/strong> <strong>+€8-15 vs spot<\/strong> (49→57-64)<br><strong>JKM Impact (USD/MMBtu):<\/strong> +$0.8-1.5<br><strong>Trade Response:<\/strong> Long TTF Apr-26 futures (target 60); buy TTF May-26 calls (60 strike); hedge with JKM puts (15 strike)<br><\/p><p><s
