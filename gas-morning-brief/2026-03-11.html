<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gas Morning Brief — 11 Mars 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }

    html.light .details p { color: rgba(0,0,0,.75); }

    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    html.light .details div[style*="background"], html.light .details p[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Light mode: override inline white colors in trade cards */
    html.light .details p[style], html.light .details b[style], html.light .details span[style], html.light .details div[style] { color: rgba(0,0,0,.85) !important; }
    html.light .details div[style*="border-left:3px solid #f59e0b"] { background: rgba(245,158,11,.08) !important; }
    html.light .details div[style*="border-left:3px solid #10b981"] { background: rgba(16,185,129,.08) !important; }
    html.light .details div[style*="border-left:3px solid #ff4757"] { background: rgba(255,71,87,.06) !important; }
    html.light .details div[style*="color:#f59e0b"] { color: #b45309 !important; }
    html.light .details div[style*="color:#10b981"] { color: #047857 !important; }
    html.light .details div[style*="color:#ff4757"] { color: #dc2626 !important; }
    html.light .details h3 { color: #1a1a2e !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details p[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }

      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }

        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }

      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }
      .dt-reader .dt-r-body p { margin-bottom: 18px; }
      .dt-reader .dt-r-body strong { color: #fff; font-weight: 600; }
      .dt-reader .dt-r-body a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
      .dt-reader .dt-r-body .quote { border-left: 3px solid var(--blue); padding: 14px 18px; margin: 20px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-style: italic; font-size: .95rem; line-height: 1.6; color: rgba(255,255,255,.9); }
      .dt-reader .dt-r-body .dissent { margin-top: 24px; padding: 16px 18px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }

  <script>
  const DATA = [{"t":"home","home":true,"date":"11 Mars 2026","henryWord":"Trump's 'very complete' crashed TTF 15% in a single session — the biggest down day since Hormuz opened — but mines are confirmed in the Strait and Iran's IRGC vows total blockade. The council validated 10 trades from 17, culling 7 redundant calendar spreads and vague cross-market plays; the JKM-TTF widener (unanimous) and Apr €50 straddle remain highest conviction, while the Apr/Oct calendar captures the ceasefire-vs-refill asymmetry.","articles":[{"badge":"⚡ 💰 Price Action","title":"Ceasefire Hopes Trigger 15% TTF Crash — Biggest Down Day Since Hormuz Opened","idx":1},{"badge":"⚡ 🚢 LNG & Flows","title":"Hormuz Day 11: Mines Confirmed, Zero Tanker Transits — But Ceasefire Talk Caps Panic","idx":2},{"badge":"⚡ ⚡ Power & Carbon","title":"EUA Under Political Siege as EU Leaders Prepare March 19 Carbon Cost Review","idx":3},{"badge":"📊 🌡️ Weather & Demand","title":"Polar Vortex Split Fades — March Turns Mild but Hydro Deficit Persists","idx":4},{"badge":"📊 📦 Storage Watch","title":"EU Storage Below 30% — Injection Season Looms With Historic Deficit","idx":5},{"badge":"📊 💣 Geopolitics & Regulation","title":"Day 11: 'Very Complete' vs 'Not a Single Litre' — The Ceasefire Paradox","idx":6},{"badge":"📊 🎯 Risk Flags & Outlook","title":"The Ceasefire Mirage — Three Scenarios for the Post-Crash Regime","idx":7},{"badge":"🏛️ Verdict du Conseil","title":"17 Trades Audités — 9 Retenus, 8 Éliminés","idx":8}],"disclaimer":"⚠️ AVERTISSEMENT — Ce document est un exercice expérimental de veille automatisée produit par intelligence artificielle. Il ne constitue EN AUCUN CAS un conseil en investissement, une recommandation de trading, ni une analyse financière réglementée au sens de la directive MiFID II ou du Code monétaire et financier (art. L541-1). Les « scénarios de marché » présentés sont des hypothèses pédagogiques générées par des modèles de langage — ils ne reflètent pas l'avis d'un professionnel agréé. Les données proviennent de sources publiques, potentiellement retardées ou erronées. Toute décision d'investissement prise sur la base de ce document relève de la seule responsabilité du lecteur. L'auteur n'est pas enregistré comme Conseiller en Investissement Financier (CIF) auprès de l'AMF. Ce contenu est fourni à titre informatif et expérimental uniquement."},{"t":"alert","badge":"⚡ 💰 Price Action","title":"Ceasefire Hopes Trigger 15% TTF Crash — Biggest Down Day Since Hormuz Opened","hook":"Trump's 'war is very complete' torpedoed the entire Hormuz premium in hours. TTF Apr fell ~15% while Brent collapsed from $120 to $88 — but Iran's IRGC vowed to block every litre.","authorWord":"TTF crashed on ceasefire hopes but Iran keeps blocking Hormuz. The risk premium unwind may be premature with mines now confirmed in the Strait.","author":"Blaise 🧮","details":"<p><strong>TTF Apr<\/strong> settled near <strong>€50.60/MWh<\/strong> (close 10 Mar), ▼~15% vs prev close of ~€59.57, the sharpest single-session decline since the Hormuz crisis began on 28 Feb. <strong>Henry Hub<\/strong> held near <strong>$2.92/MMBtu<\/strong> (close 10 Mar) ◆ flat — the US domestic market remains insulated from the LNG global disruption. <strong>Brent crude<\/strong> collapsed from an intra-day high near $120 to settle at <strong>$87.80/bbl<\/strong> (close 10 Mar), ▼11.3%.<\/p><p>The crash was triggered by Trump telling CBS News the war was 'very complete, pretty much' and suggesting a 'short-term excursion.' Markets immediately unwound the Hormuz insurance premium. The move briefly accelerated to $82/bbl when US Energy Secretary Chris Wright posted — then deleted — a claim that the US Navy had escorted a tanker through Hormuz. The White House later confirmed <strong>no escort had occurred<\/strong>. (<a href='https://www.bbc.com/news/articles/cx2jxe382pwo' target='_blank'>BBC<\/a>)<\/p><p>Key technical levels: TTF Apr support at <strong>€48<\/strong> (pre-Hormuz equilibrium), resistance at <strong>€55<\/strong> (50% retracement of the spike). If ceasefire materializes, a return to €32-35 range is plausible over weeks. If Iran escalates mine-laying, retest of €60+ is immediate risk. According to <a href='https://www.theguardian.com/business/2026/mar/10/oil-prices-drop-trump-iran-war' target='_blank'>The Guardian<\/a>, CNN reported dozens of mines have been laid in recent days, keeping actual shipping risk elevated despite price retreat.<\/p><p>💡 <strong>Trade Ideas:<\/strong><br>T1. <strong>TTF Apr €45/€38 put spread<\/strong> — if ceasefire confirmed within days, TTF could gap through €45 toward pre-crisis levels. Cost: ~€2/MWh, payout: up to €5/MWh. Conviction: medium-high on ceasefire.<br>T2. <strong>Long TTF Apr €55/€65 call spread<\/strong> — insurance if Iran mine deployment escalates and Hormuz remains shut. Cost: ~€1.5/MWh. Conviction: hedge against reversal.<br>T3. <strong>Short Brent Apr / Long TTF Apr ratio<\/strong> — if war ends, oil normalizes faster than gas (storage deficit persists). Relative value play.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>The market is pricing a ceasefire that doesn't exist yet. Iran's IRGC explicitly vowed to block all oil exports 'in response to Trump's nonsense.' Mines are confirmed in the Strait. The risk premium unwind is premature — this could be a bear trap setting up the next leg higher if Hormuz stays closed through the weekend.<\/div><\/div>","sig":"Blaise 🧮 — Gas Morning Brief"},{"t":"alert","badge":"⚡ 🚢 LNG & Flows","title":"Hormuz Day 11: Mines Confirmed, Zero Tanker Transits — But Ceasefire Talk Caps Panic","hook":"CNN confirms dozens of Iranian mines in the Strait while Pakistan Navy escorts national cargoes around the blockade. A fifth of global LNG remains stranded.","authorWord":"Hormuz still physically closed despite Trump's ceasefire rhetoric. Mine-clearing alone could take weeks even after a political deal.","author":"Henry 🦉","details":"<p>Day 11 of the Hormuz shutdown and <strong>zero commercial tanker transits<\/strong> have occurred. The US Navy confirmed it has <strong>not<\/strong> escorted any oil tankers through the Strait, contradicting a quickly-deleted post by US Energy Secretary Chris Wright. <a href='https://www.bbc.com/news/articles/cx2jxe382pwo' target='_blank'>BBC confirmed<\/a> the White House retraction. CNN reported that <strong>dozens of Iranian naval mines<\/strong> have been laid in recent days, adding a physical barrier to the political one.<\/p><p><strong>Pakistan's Navy<\/strong> began escorting merchant vessels to ensure national energy supply continuity — the first country to militarize its LNG shipping lanes. Qatar's foreign ministry rebuked Iran for attacks on civilian energy infrastructure, with spokesman Majed al-Ansari warning of 'repercussions throughout the world.' (<a href='https://www.al-monitor.com/originals/2026/03/war-middle-east-latest-developments-4' target='_blank'>Al-Monitor<\/a>)<\/p><p>Saudi Aramco CEO Amin Nasser warned of <strong>'catastrophic consequences'<\/strong> if the Strait remains blocked, noting global oil stockpiles are at <strong>5-year lows<\/strong>. The key LNG spread: JKM remains at extreme premium to TTF as Asian buyers panic-bid, pulling cargoes east. US feed gas data showed Corpus Christi and Cameron maintenance cutting export capacity — tightening the available LNG pool further. (<a href='https://www.theguardian.com/business/2026/mar/09/iran-war-drives-oil-price-above-100-a-barrel-for-first-time-since-2022' target='_blank'>The Guardian<\/a>)<\/p><p>💡 <strong>Trade Ideas:<\/strong><br>T4. <strong>JKM-TTF spread widener (Apr)<\/strong> — if Hormuz stays closed, Asia keeps outbidding Europe for Atlantic-basin cargoes. Target: $8-10/MMBtu spread. Conviction: high while blockade persists.<br>T5. <strong>Long NBP-TTF basis<\/strong> — UK has only 1.5 days of storage equivalent; any diversion of LNG away from Isle of Grain increases NBP scarcity premium. Tenor: Mar-Apr.<br><\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>Even if a political ceasefire is announced today, mine clearance in the Strait takes 2-4 weeks minimum (cf. 1988 Operation Praying Mantis aftermath). The physical LNG disruption will outlast any diplomatic resolution. Prematurely fading the JKM-TTF spread on ceasefire headlines is the biggest risk for short-horizon traders.<\/div><\/div>","sig":"Henry 🦉 — Gas Morning Brief"},{"t":"tech","badge":"⚡ ⚡ Power & Carbon","title":"EUA Under Political Siege as EU Leaders Prepare March 19 Carbon Cost Review","hook":"EUA clings to €70-71 as lobby groups push for ETS relief at the March 19-20 EU summit. Gas crash eases spark spread pressure but coal remains in the money.","authorWord":"The carbon market is trapped between war-driven gas costs and political pressure to ease industry burdens. March 19 summit is the catalyst.","author":"Sage 🦎","details":"<p><strong>EUA Dec26<\/strong> settled near <strong>€70.57/t<\/strong> (close 2 Mar data), having barely reacted to the energy price surge — the carbon market decoupled from gas, instead tracking equity weakness. <a href='https://gmk.center/en/news/european-carbon-prices-did-not-react-to-rising-prices-on-energy-markets/' target='_blank'>GMK Center<\/a> noted this unusual divergence. The EU is now examining energy taxes, network charges, and carbon costs for short-term industry relief measures ahead of the <strong>March 19-20 EU leaders summit<\/strong>. (<a href='https://www.energyplanets.org/european-union-looks-to-soften-energy-bill/' target='_blank'>Reuters via Energy Planets<\/a>)<\/p><p><a href='https://www.politico.eu/article/big-eu-lobby-groups-exaggerated-industry-support-attack-carbon-price/' target='_blank'>Politico revealed<\/a> that major EU lobby groups (including Solvay, Cefic) exaggerated industry support for the carbon price attack — but the political momentum is real. Any ETS intervention at the summit could trigger a €5-10/t EUA selloff. Meanwhile, with TTF crashing 15% on ceasefire hopes, gas-to-power <strong>spark spreads<\/strong> narrowed sharply — but coal remains in the merit order at current gas price levels above €45/MWh.<\/p><p>The key variable: if TTF stabilizes below €45, gas-fired generation regains competitiveness vs coal, driving EUA demand higher (more gas burn = more allowance demand for backup coal). Above €50, coal stays in the money and EUA is structurally capped. German day-ahead power cleared above €120/MWh earlier in the crisis week.<\/p><p>💡 <strong>Trade Ideas:<\/strong><br>T8. <strong>Long clean spark spread (TTF-to-power)<\/strong> — if ceasefire pulls TTF below €45, gas regains merit order and spark margins widen. Tenor: Apr-May.<br><\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>EUA political risk is overdone. Lobby groups were caught exaggerating; the Commission is unlikely to touch the ETS with COP31 optics in play. A €65 target requires both summit action AND sustained gas-price normalization — neither is guaranteed. More likely EUA grinds sideways at €68-73.<\/div><\/div>","sig":"Sage 🦎 — Gas Morning Brief"},{"t":"analysis","badge":"📊 🌡️ Weather & Demand","title":"Polar Vortex Split Fades — March Turns Mild but Hydro Deficit Persists","hook":"The stratospheric warming event is losing coherence. Week 2-4 models show a milder Atlantic regime settling over NW Europe, capping residual heating demand.","authorWord":"Heating season is ending but the structural hydro-wind deficit means gas-for-power demand persists well into spring, maintaining a floor under prices.","author":"Sage 🦎","details":"<p>The <strong>polar vortex split<\/strong> that extended heating demand through early March is now losing coherence. According to <a href='https://www.severe-weather.eu/global-weather/stratospheric-warming-2026-polar-vortex-forecast-atmospheric-mjo-interference-winter-united-states-canada-europe-fa/' target='_blank'>Severe Weather Europe<\/a>, the early March temperature trend was cooler over a larger part of the continent, but Week 2-4 ensemble models are now trending toward <strong>near-normal to above-normal temperatures<\/strong> for NW Europe from mid-March onward.<\/p><p>The <a href='https://pogodnik.com/en/news/europe-spring-2026-forecast-february-march-april' target='_blank'>Spring 2026 forecast<\/a> describes March-April-May as 'not a clean early spring' — with a drier, warmer regime developing in Iberia and the western Mediterranean, but residual blocking patterns keeping central Europe variable. HDD accumulation is tracking <strong>above the 10-year normal<\/strong> for the winter overall, but the incremental heating demand from here is marginal: the structural story shifts to <strong>gas-for-power<\/strong>.<\/p><p>The critical demand driver is now the <strong>hydro deficit<\/strong>: Alpine reservoir levels remain below the 5-year average after a dry February, and Norwegian hydro is running below seasonal norms. Wind generation has been intermittent — below-average capacity factors through February mean gas-fired generation continues to fill the renewable gap. This structural gas-for-power floor persists regardless of heating season end.<\/p><p>💡 <strong>Trade Ideas:<\/strong><br>T11. <strong>Long Nordic hydro vs TTF relative value<\/strong> — if Alpine/Nordic snow deficits persist, hydro reservoir levels at summer start determine how much gas-for-power Europe needs. Play via NordPool area price vs TTF.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>The hydro deficit narrative has been running for weeks without quantification. Norway's reservoirs are below average but not critically so. A single wet April week could erase the deficit. The gas-for-power floor is real but don't overweight it — the demand destruction from €50+ TTF is already visible in industrial load data.<\/div><\/div>","sig":"Sage 🦎 — Gas Morning Brief"},{"t":"tech","badge":"📊 📦 Storage Watch","title":"EU Storage Below 30% — Injection Season Looms With Historic Deficit","hook":"EU storage at ~30% vs 41% five-year average for this date. Analysts project 22-27% by end-March — the refill mountain is now Everest-scale.","authorWord":"Even with a ceasefire, the storage deficit vs 5Y avg is 11 percentage points. The 90% by Nov 1 mandate looks mathematically brutal at any TTF above €35.","author":"Blaise 🧮","details":"<p>EU aggregate storage stands at approximately <strong>30% capacity<\/strong> (early Mar data via <a href='https://markets.financialcontent.com/stocks/article/marketminute-2026-3-6-global-energy-shock-european-gas-prices-skyrocket-40-as-qatar-suspends-lng-exports' target='_blank'>Financial Content<\/a>), far below the <strong>54% average for this time of year<\/strong> (5Y norm ~41% per AGSI). Germany is particularly exposed at <strong>~20% fill<\/strong>. <a href='https://dpenergietechnik.com/en/blog/oel-gaspreise-steigen-ohne-lieferausfall/' target='_blank'>DP Energietechnik<\/a> confirmed the AGSI reading below 31%.<\/p><p>Reuters analysts project EU storage will be <strong>22-27% at end-March<\/strong>, depending on LNG arrivals and weather. (<a href='https://www.reuters.com/business/energy/europe-faces-gas-storage-scramble-iran-conflict-tightens-supply-2026-03-05/' target='_blank'>Reuters, 5 Mar<\/a>) The EU's 90% by November 1 regulation requires injecting roughly <strong>60+ bcm<\/strong> in ~7 months — a pace approximately 38% above historical seasonal norms. At current TTF prices above €50/MWh, the economic incentive to inject exists (summer-winter spread supports it), but the physical molecule availability is constrained by Hormuz.<\/p><p>If ceasefire reopens Hormuz within 2 weeks, the refill math is tight but feasible. If the blockade extends into April — compounded by the EU Russian LNG spot ban kicking in late April — the 90% target becomes mathematically unachievable without demand rationing or emergency measures. The Aramco CEO's warning about <a href='https://www.bbc.com/news/articles/cx2jxe382pwo' target='_blank'>global stockpiles at 5-year lows<\/a> applies to gas as much as oil.<\/p><p>💡 <strong>Trade Ideas:<\/strong><br>T12. <strong>Long TTF Summer 26 (Q3) outright<\/strong> — refill demand is non-discretionary. Even with ceasefire, the injection pace required supports a €35-40 floor for summer gas. Conviction: high.<br>T14. <strong>Short TTF Apr / Long TTF Oct calendar spread<\/strong> — Apr drops on ceasefire, Oct retains storage-fill anxiety. Asymmetric risk/reward.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The 90% mandate has enforcement flexibility — the Commission can grant derogations for force majeure. If Hormuz reopens, the flood of deferred LNG cargoes could actually create an injection glut in Q2-Q3 as delayed molecules all arrive at once. Don't assume the refill is impossible; assume it's expensive.<\/div><\/div>","sig":"Blaise 🧮 — Gas Morning Brief"},{"t":"alert","badge":"📊 💣 Geopolitics & Regulation","title":"Day 11: 'Very Complete' vs 'Not a Single Litre' — The Ceasefire Paradox","hook":"Trump signals war's end while Israel intensifies Tehran strikes and Iran lays mines. The April EU Russian LNG ban adds a second supply front in 6 weeks.","authorWord":"The diplomatic signals are contradictory: Trump says 'done', Netanyahu says 'not done yet', IRGC says 'total blockade continues.' Mine clearance alone takes weeks.","author":"Henry 🦉","details":"<p><strong>The contradiction is the story.<\/strong> On Day 11 of the US-Israel war on Iran, three simultaneous signals collided: (1) Trump told CBS the war was 'very complete, pretty much' and would end 'soon'; (2) Israeli PM Netanyahu said the offensive was '<strong>not done yet<\/strong>' and vowed to 'break their bones'; (3) Iran's IRGC vowed to block '<strong>not a single litre of oil<\/strong>' from exiting the region. (<a href='https://www.al-monitor.com/originals/2026/03/war-middle-east-latest-developments-4' target='_blank'>Al-Monitor<\/a>)<\/p><p><strong>Physical reality:<\/strong> Israel launched fresh strikes on Tehran (explosions reported in the city center). Iran targeted the US Al-Harir air base in Iraqi Kurdistan with 5 missiles. NATO shot down a <strong>second Iranian ballistic missile in Turkish airspace<\/strong>, prompting Ankara to deploy a Patriot system. CNN confirmed <strong>dozens of mines<\/strong> laid in the Strait. Pakistan began military escorts for its LNG tankers. (<a href='https://www.theguardian.com/world/live/2026/mar/10/iran-war-live-updates-iranian-supreme-leader-mojtaba-khamenei-middle-east-tehran-oil-prices-latest-news' target='_blank'>The Guardian<\/a>)<\/p><p><strong>The second front:<\/strong> Putin's pre-emptive TurkStream threat remains live — Russia suggested it could cut gas to Europe before the EU Russian LNG spot ban kicks in late April. (<a href='https://www.reuters.com/business/energy/putin-suggests-russia-could-stop-supplying-gas-european-markets-now-2026-03-04/' target='_blank'>Reuters, 4 Mar<\/a>) <a href='https://www.easternangle.com/the-total-eu-ban-on-russian-gas-imports-and-why-europes-industrial-competitors-in-asia-know-how-to-use-it-to-their-advantage/' target='_blank'>Eastern Angle<\/a> details how Asia-based competitors are already positioning to exploit EU's self-imposed supply constraint.<\/p><p><strong>Scenario Matrix:<\/strong><\/p><p><strong>Scenario:<\/strong> Ceasefire + mine clearance (2-4 wks)<br><strong>Prob.:<\/strong> 30%<br><strong>TTF Impact:<\/strong> €35-42<br><strong>Trade:<\/strong> Put spreads<br><\/p><p><strong>Scenario:<\/strong> War pauses, Hormuz stays mined (wks)<br><strong>Prob.:<\/strong> 35%<br><strong>TTF Impact:<\/strong> €45-52<br><strong>Trade:<\/strong> Calendar spreads<br><\/p><p><strong>Scenario:<\/strong> Escalation + TurkStream cut<br><strong>Prob.:<\/strong> 20%<br><strong>TTF Impact:<\/strong> €65-80<br><strong>Trade:<\/strong> OTM calls<br><\/p><p><strong>Scenario:<\/strong> Prolonged conflict (1-3 months)<br><strong>Prob.:<\/strong> 15%<br><strong>TTF Impact:<\/strong> €80-120<br><strong>Trade:<\/strong> Deep OTM calls<br><\/p><p>💡 <strong>Trade Ideas:<\/strong><br>T15. <strong>TTF Apr straddle at €50<\/strong> — binary outcome: ceasefire = sub-€40, escalation = €60+. Vol is your friend. Cost: ~€6/MWh but upside unlimited on either leg. Conviction: high on vol, neutral on direction.<br><\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>Trump's 'very complete' language is transactional — he's telegraphing an off-ramp he's already negotiating. The IRGC rhetoric is face-saving bluster; Iran cannot sustain a war against US + Israel for another week. The 35% probability on 'war pauses, Hormuz mined' is too high — once the bombs stop, mine clearance becomes a US Navy priority, not a 4-week delay. Price below €40 by month-end is the base case.<\/div><\/div>","sig":"Henry 🦉 — Gas Morning Brief"},{"t":"strategy","badge":"📊 🎯 Risk Flags & Outlook","title":"The Ceasefire Mirage — Three Scenarios for the Post-Crash Regime","hook":"Markets just priced the end of the war in a single session. But mines are in the water, IRGC is defiant, and storage is at historic lows. The risk is binary.","authorWord":"The 15% TTF crash priced in a ceasefire that doesn't exist yet. This is either the smart money getting ahead — or the biggest bear trap since 2022.","author":"La Rédaction 🦊","details":"<p><strong>TOP 3 RISKS (ranked by probability × impact):<\/strong><\/p><ol><li><strong>Mine clearance delay (High)<\/strong> — Even with a political ceasefire, Iranian mines in Hormuz require weeks of USN mine countermeasure operations. Physical LNG disruption outlasts any diplomatic deal. Impact: TTF stays above €45 for weeks even after bombs stop.<\/li><li><strong>TurkStream weaponization (Medium)<\/strong> — Putin threatened pre-emptive cuts ahead of the April EU LNG ban. If Hormuz reopens but TurkStream closes, Europe faces a supply-source substitution problem. Impact: €55-65 TTF.<\/li><li><strong>Storage refill failure (High)<\/strong> — At 30% vs 41% 5Y avg, even a best-case scenario requires heroic injection rates. If Hormuz remains disrupted into April, the 90% mandate is unachievable. Impact: Winter 26/27 premium explodes.<\/li><\/ol><p><strong>BULL SCENARIO (25% prob):<\/strong> Ceasefire within 48h, Hormuz mine clearance completed by end-March, LNG flood resumes April → TTF collapses to €32-38, massive injection season fills storage to 85%+ by Oct. <strong>Trade:<\/strong> TTF Apr €45/€38 put spread (T1) + short Win26/Sum26 spread.<\/p><p><strong>BEAR SCENARIO (35% prob):<\/strong> War pauses but Hormuz stays mined for weeks, Putin cuts TurkStream, EU LNG ban kicks in April → TTF grinds to €55-65, refill season starts catastrophically late. <strong>Trade:<\/strong> Long TTF Q3 26 outright (T12) + Long Win26/Sum26 spread (T13).<\/p><p><strong>WILD CARD (15% prob):<\/strong> Full escalation — Iran mines extend to Bab el-Mandeb, TurkStream cut simultaneously → TTF €80-120, 2022 crisis redux. <strong>Trade:<\/strong> Deep OTM TTF Apr €80 calls (~€0.50/MWh) or Apr straddle at €50 (T15). Asymmetric 10:1 payout.<\/p><p><strong>CONVICTION MATRIX:<\/strong> Highest conviction play remains <strong>long vol<\/strong> (straddle T15): the outcome is binary and both tails pay. Second: <strong>Long TTF Summer 26<\/strong> (T12) — refill demand is non-discretionary regardless of geopolitics. Third: <strong>JKM-TTF widener<\/strong> (T4) — persists until physical shipping resumes.<\/p><p><strong>CATALYSTS THIS WEEK:<\/strong> ① Trump press conference / ceasefire announcement (any day); ② IEA emergency meeting on strategic reserve release (ongoing); ③ EU leaders summit draft conclus
