<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gas Morning Brief — 15 Mai 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    /* Scenario Probability Card */
    .scenario-block { margin: 1em 0; padding: 0.8em 1em; border-left: 4px solid #ffd700; border-radius: 0 8px 8px 0; background: rgba(255,215,0,0.05); }
    .scenario-block h3 { margin: 0 0 0.3em 0; font-size: 1.05em; display: flex; justify-content: space-between; align-items: center; }
    .scenario-block .proba { font-size: 1.3em; font-weight: bold; color: #ffd700; }
    .scenario-block p { margin: 0.2em 0; font-size: 0.92em; }
    .scenario-block .votes { font-size: 0.8em; opacity: 0.7; font-style: italic; }
    .consensus { margin-top: 1.2em; padding: 0.6em; border-radius: 8px; background: rgba(0,200,100,0.08); }
    .dissent { margin-top: 0.4em; padding: 0.6em; border-radius: 8px; background: rgba(255,80,80,0.08); }

    html.light .details div[style*="background"], html.light .details p[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Light mode: override inline white colors in trade cards */
    html.light .details p[style], html.light .details b[style], html.light .details span[style], html.light .details div[style] { color: rgba(0,0,0,.85) !important; }
    html.light .details div[style*="border-left:3px solid #f59e0b"] { background: rgba(245,158,11,.08) !important; }
    html.light .details div[style*="border-left:3px solid #10b981"] { background: rgba(16,185,129,.08) !important; }
    html.light .details div[style*="border-left:3px solid #ff4757"] { background: rgba(255,71,87,.06) !important; }
    html.light .details div[style*="color:#f59e0b"] { color: #b45309 !important; }
    html.light .details div[style*="color:#10b981"] { color: #047857 !important; }
    html.light .details div[style*="color:#ff4757"] { color: #dc2626 !important; }
    html.light .details h3 { color: #1a1a2e !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details p[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }
      .dt-reader .dt-r-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; }
      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }
      .dt-reader .dt-r-body p { margin-bottom: 18px; }
      .dt-reader .dt-r-body strong { color: #fff; font-weight: 600; }

  <script>
  const DATA = [{"t":"home","home":true,"date":"15 Mai 2026","henryWord":"Three converging headwinds — a 10-week Hormuz closure stranding 20% of global LNG, EU storage 26% below its 5-year average, and a drought forecast for European summer — have TTF pinned at €47.91. The risk premium is structural, but the market has priced the base case. Watch for the next 72 hours: any diplomatic signal on Iran could trigger a sharp pullback, while a confirmed drought would push the bull case into overdrive.","articles":[{"badge":"⚡ 💰 Price Action","title":"TTF Holds €47.91 as Hormuz Risk Premium Persists; HH Hits 7-Week High at $2.93","idx":1},{"badge":"⚡ 🚢 LNG & Flows","title":"Hormuz Closure Enters Week 10; US LNG Feedgas Drops to 15-Week Low on Maintenance","idx":2},{"badge":"⚡ ⚡ Power & Carbon","title":"EUA Settles at €74.75; Gas-for-Power Demand Supported by Drought Outlook","idx":3},{"badge":"📊 🌡️ Weather & Demand","title":"Major Drought Forecast for Summer 2026 — El Niño + NAWH Signal Hot/Dry European Summer","idx":4},{"badge":"📊 📦 Storage Watch","title":"EU Storage at 34.7% — 26% Below 5-Year Average; US Surplus Narrows to 140 Bcf","idx":5},{"badge":"📊 💣 Geopolitics & Regulation","title":"Trump Rejects Iran Ceasefire Response — Hormuz Enters Week 10 with No Resolution Path","idx":6},{"badge":"📊 🎯 Risk Flags & Outlook","title":"Triple Squeeze: Hormuz + Storage Deficit + Drought — TTF at Inflection Point","idx":7},{"badge":"🎲 Scénarios","title":"7 Scénarios — Votes du Conseil","idx":8},{"badge":"📊 🌍 Scénario Géopolitique","title":"Géopolitique & Gaz — Délibération du Conseil","idx":9},{"badge":"🏛️ Verdict du Conseil","title":"20 Trades Audités — 20 Retenus, 0 Éliminés","idx":10}],"disclaimer":"⚠️ AVERTISSEMENT — Ce document est un exercice expérimental de veille automatisée produit par intelligence artificielle. Il ne constitue EN AUCUN CAS un conseil en investissement, une recommandation de trading, ni une analyse financière réglementée au sens de la directive MiFID II ou du Code monétaire et financier (art. L541-1). Les « scénarios de marché » présentés sont des hypothèses pédagogiques générées par des modèles de langage — ils ne reflètent pas l'avis d'un professionnel agréé. Les données proviennent de sources publiques, potentiellement retardées ou erronées. Toute décision d'investissement prise sur la base de ce document relève de la seule responsabilité du lecteur. L'auteur n'est pas enregistré comme Conseiller en Investissement Financier (CIF) auprès de l'AMF. Ce contenu est fourni à titre informatif et expérimental uniquement."},{"t":"alert","badge":"⚡ 💰 Price Action","title":"TTF Holds €47.91 as Hormuz Risk Premium Persists; HH Hits 7-Week High at $2.93","hook":"TTF continued its month-long rally, closing at €47.91/MWh on 14 May — up 12.9% over the past four weeks on persistent Hormuz supply risk. Henry Hub climbed to $2.93/MMBtu, a seven-week high, driven by declining domestic production and steady LNG demand.","authorWord":"Le marché européen reste sous tension structurelle. Le premium de risque Hormuz ne se dissipe pas.","author":"Blaise 🧮","details":"<p><strong>TTF Front-Month (Jun '26):<\/strong> Settled at <strong>€47.91/MWh<\/strong> on 14 May 2026, ▲+0.25/MWh (+0.53%) vs previous close. Month-to-date rally of +12.9% is driven by the now 10-week Hormuz Strait closure, which has removed approximately 20% of global LNG supply from the market. Year-on-year: TTF is up 36.3%. <a href='https://tradingeconomics.com/commodity/eu-natural-gas' target='_blank'>Trading Economics<\/a><\/p><p><strong>Henry Hub:<\/strong> Rose to <strong>$2.93/MMBtu<\/strong> on 14 May 2026, ▲+$0.035 (+1.2%) vs previous close, reaching a seven-week high. The EIA reported an injection of <strong>85 Bcf<\/strong> for the week ended 8 May — in line with consensus and vs 109 Bcf a year earlier. Total US working gas stocks stand at ~2,290 Bcf, a surplus of 140 Bcf vs the 5-year average. Production has fallen to a 15-week low as operators (including EQT) scale back drilling. LNG feedgas flows to US export terminals slipped to ~17.0 bcfd in May from a record 18.8 bcfd in April amid seasonal maintenance at Golden Pass and Freeport LNG. <a href='https://tradingeconomics.com/commodity/natural-gas' target='_blank'>Trading Economics<\/a> · <a href='https://www.stonex.com/en/insights/eia-weekly-nat-gas-storage-update-2026-05-14/' target='_blank'>StoneX EIA Update<\/a><\/p><p><strong>JKM (Jun '26):<\/strong> Assessed at <strong>high-USD 16s/MMBtu<\/strong> on 8 May, down from low-USD 18s/MMBtu the previous weekend. The TTF-JKM spread stands at approximately -$1.2/MMBtu (TTF at ~$15.7/MMBtu vs JKM at ~$16.8/MMBtu on an energy-equivalent basis) — WIDENED vs the prior week as Asian demand softened during Golden Week holidays. <a href='https://www.canadalnggroup.com/natural-gas-prices-weekly-update-jkm-ttf-and-henry-hub-11-may-2026' target='_blank'>Canada LNG Group / JOGMEC<\/a><\/p><p><strong>Technical Levels — TTF Jun '26:<\/strong> Immediate resistance at €48.50 (previous week's high), key resistance at €50.00 (psychological). Support at €46.50 (5-day low), stronger support at €45.00. The RSI is approaching overbought territory (~68), suggesting potential consolidation before a breakout attempt. <strong>HH Jul '26:<\/strong> Resistance at $3.00 (psychological), support at $2.75.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>The TTF rally is losing momentum — month-to-date gains are impressive but daily moves have narrowed to sub-1% for three consecutive sessions. The HH-TTF arb remains open, and if US production recovers post-maintenance (mid-June), the supply picture eases materially. A near-term pullback to €45-46/MWh is equally likely before any further upside.<\/div><\/div><p><strong>💡 Trade Ideas<\/strong><\/p><p>1. <strong>Long TTF Jun '26 / Short TTF Sep '26 calendar spread<\/strong> — If Hormuz remains closed through June, front-month tightness should outprice deferred months. Target: spread from current ~€1.50/MWh to €2.50/MWh.<\/p><p>2. <strong>Long HH Jul $3.00 calls / Short HH Jul $2.60 puts (call spread + put sale)<\/strong> — Targeting the production-led rally toward $3.00. Risk: $2.60 floor provides buffer if bearish storage surprise hits.<\/p><p>3. <strong>Short TTF-HH spread (short TTF / long HH)<\/strong> — The ~$12.5/MWh spread is at multi-month highs. If Hormuz opens or US production rebounds, this spread compresses sharply.<\/p>","sig":"Blaise 🧮","factChecked":true},{"t":"alert","badge":"⚡ 🚢 LNG & Flows","title":"Hormuz Closure Enters Week 10; US LNG Feedgas Drops to 15-Week Low on Maintenance","hook":"The Strait of Hormuz remains effectively closed for commercial LNG traffic for a tenth consecutive week, stranding roughly one-fifth of global LNG supply. US export terminal utilization has slipped to ~17 bcfd as seasonal maintenance at Golden Pass and Freeport bites.","authorWord":"La situation physique reste très tendue. Le retour à la normale d'Hormuz est l'inconnue centrale.","author":"Henry 🦉","details":"<p><strong>Hormuz Strait — Status:<\/strong> The 10-week closure continues to be the dominant physical supply constraint. President Trump rejected Iran's response to a US ceasefire proposal, dampening hopes for a near-term resolution. The strait accounts for roughly 20% of global LNG supply (primarily Qatari and UAE cargoes), and its closure has fundamentally tightened the Atlantic Basin supply-demand balance as European buyers compete harder for Atlantic-origin cargoes. <a href='https://tradingeconomics.com/commodity/eu-natural-gas' target='_blank'>Trading Economics<\/a><\/p><p><strong>US LNG Export Feedgas:<\/strong> Flows to major US LNG export terminals averaged approximately <strong>17.0 bcfd<\/strong> in the first half of May, down from a monthly record of <strong>18.8 bcfd<\/strong> in April. The decline reflects seasonal maintenance at <strong>Golden Pass<\/strong> (under commissioning) and <strong>Freeport LNG<\/strong>. Daily volumes have slipped to a 15-week low. Full utilization is expected to resume by mid-June, which would add ~1.5-2.0 bcfd of incremental feedgas demand and tighten US domestic balances further. <a href='https://tradingeconomics.com/commodity/natural-gas' target='_blank'>Trading Economics<\/a> · <a href='https://naturalgasintel.com/' target='_blank'>Natural Gas Intelligence<\/a><\/p><p><strong>EU LNG Arrivals:<\/strong> Kpler forecasts European LNG imports reaching 145 Mt in 2026, up 25% from 2025 levels. Northwest Europe leads at 73.6 Mt as expanded regasification capacity absorbs incremental volumes. With Hormuz closed, EU buyers are pulling harder on US, African, and South American supplies. However, the surge in US feedgas to 17+ bcfd means the US is already near its export ceiling — additional supply flexibility is limited. <a href='https://www.kpler.com/blog/european-natural-gas-outlook-2026' target='_blank'>Kpler<\/a><\/p><p><strong>Pipeline Flows — Europe:<\/strong> Norwegian flows via Langeled and Europipe have seen some unplanned maintenance events (reported earlier in May), though nominations remain broadly stable. Russian pipeline flows via TurkStream continue to serve Turkey, Hungary, and Serbia at reduced volumes. No material nomination changes reported in the past 48 hours. <a href='https://gasdashboard.entsog.eu/' target='_blank'>ENTSOG Transparency Platform<\/a><\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>The 17 bcfd US feedgas number is seasonal and expected — calling it a '15-week low' is technically accurate but misleading. It reflects planned maintenance, not demand destruction or supply constraint. Once Golden Pass and Freeport return, US export capacity effectively increases. The real bottleneck is LNG vessel availability, not liquefaction capacity.<\/div><\/div><p><strong>💡 Trade Ideas<\/strong><\/p><p>1. <strong>Long TTF Q3 '26 vs TTF Q1 '27 spread<\/strong> — Front-quarter scarcity from Hormuz closure + US maintenance should lift Q3 relative to winter when regas capacity and Atlantic flows can catch up. Target: +€2/MWh from current level.<\/p><p>2. <strong>Long JKM-TTF spread (Jun '26)<\/strong> — If Hormuz opens, JKM will rally faster than TTF as Asian buyers scramble for spot cargoes. Currently inverted at ~$1/MWh; a return to normal of $2-3/MMBtu is achievable.<\/p><p>3. <strong>Long HH Jul '26 calls ($3.00 strike)<\/strong> — Cheap optionality on US production staying weak + summer cooling demand + LNG feedgas recovery post-maintenance. Premium is manageable given 7-week high momentum.<\/p>","sig":"Henry 🦉","factChecked":true},{"t":"tech","badge":"⚡ ⚡ Power & Carbon","title":"EUA Settles at €74.75; Gas-for-Power Demand Supported by Drought Outlook","hook":"EU carbon allowances slipped to €74.75/tonne on 14 May but remain in a tight €73-76 range. The clean spark spread stays positive, supporting gas-to-power demand — a structural tailwind for TTF as Europe enters injection season with storage 26% below the 5-year average.","authorWord":"Le carbone ne bouge pas beaucoup mais le spark spread reste en faveur du gaz. La sécheresse estivale amplifiera la demande.","author":"Sage 🦎","details":"<p><strong>EUA Carbon (Dec '26):<\/strong> Settled at <strong>€74.75/tonne<\/strong> on 14 May 2026, ▼-€0.32 (-0.43%) vs previous close. Month-to-date: +0.8%. Year-on-year: +1.8%. The EUA market remains in a consolidation phase within the €73-76 band, with no strong directional catalyst. Regulatory risk from potential ETS reform (under discussion in the AccelerateEU framework) provides mild downside support — any weakening of the carbon price would lower the clean spark spread threshold, potentially triggering more coal-to-gas switching. <a href='https://tradingeconomics.com/commodity/carbon' target='_blank'>Trading Economics / ICE<\/a><\/p><p><strong>Clean Spark Spread vs Dark Spread:<\/strong> With TTF at ~€48/MWh and EUA at €75/t, the clean spark spread for a 55% efficient CCGT in Germany is approximately <strong>€8-12/MWh<\/strong> — comfortably positive, meaning gas-to-power is profitable. The equivalent clean dark spread for coal sits at roughly <strong>€3-6/MWh<\/strong>, also positive but tighter. Gas remains the marginal fuel in most European power markets, underpinning gas demand for power generation through the summer. <a href='https://www.homaio.com/glossary/clean-spark-spread' target='_blank'>Homaio<\/a><\/p><p><strong>Power Prices:<\/strong> Day-ahead power prices across key European hubs remain elevated relative to pre-Hormuz levels. Germany and Italy have seen recent day-ahead auctions in the <strong>€90-120/MWh<\/strong> range, reflecting elevated gas input costs. France, with higher nuclear availability, trades at a discount (~€60-80/MWh). No significant unplanned nuclear outages reported in the past 48 hours. <a href='https://euenergy.live/' target='_blank'>EU Energy Live<\/a><\/p><p><strong>Renewable Generation:<\/strong> Wind and solar output have been near seasonal norms for mid-May. Looking ahead, the Climate Impact Company's summer 2026 drought forecast for Europe implies reduced hydro generation and higher cooling demand — both bearish for gas supply (less hydro = more gas-for-power) but also increase reservoir refill pressure on the gas storage trajectory. <a href='https://climateimpactcompany.com/europe-western-russia-summer-2026-outlook-major-drought-for-europe-during-summer-2026-2-2/' target='_blank'>Climate Impact Company<\/a><\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The spark spread analysis assumes stable power demand. But if the drought materializes, it also means higher solar irradiance — which suppresses midday power prices and reduces gas peaking plant dispatch. The net effect on gas demand from drought is ambiguous: lower hydro hurts, but higher solar helps. Overstating the bullish gas case from drought is a common analytical error.<\/div><\/div><p><strong>💡 Trade Ideas<\/strong><\/p><p>1. <strong>Long EUA Dec '26 calls (€80 strike)<\/strong> — If the AccelerateEU regulatory framework strengthens ETS (carbon price floor or tightening cap), the upside to €80+ is achievable. Cheap premium given range-bound market.<\/p><p>2. <strong>Long TTF Q3 '26 / Short EUA Dec '26 (cross-commodity)<\/strong> — If gas prices rally on Hormuz but carbon stalls, this relative value trade captures the gas upside while hedging carbon downside risk.<\/p><p>3. <strong>Long German clean spark spread via power futures (Q3 '26)<\/strong> — Gas is the marginal fuel; if drought cuts hydro, gas-for-power demand spikes, widening spark spreads further. Consider EEX Baseload Q3 2026.<\/p>","sig":"Sage 🦎","factChecked":true},{"t":"analysis","badge":"📊 🌡️ Weather & Demand","title":"Major Drought Forecast for Summer 2026 — El Niño + NAWH Signal Hot/Dry European Summer","hook":"Climate Impact Company's updated summer outlook projects a major drought across Europe driven by a developing El Niño and an intense North Atlantic Warm Hole. If realized, this would reduce hydro output, increase gas-for-power demand, and complicate the storage refill trajectory.","authorWord":"La sécheresse estivale est le scénario de risque majeur. Si le forecast se confirme, la demande gaz pourrait dépasser les attentes.","author":"Sage 🦎","details":"<p><strong>Summer 2026 Forecast — Major Drought:<\/strong> The Climate Impact Company (issued April 2026) projects a <strong>major drought across Europe extending to Southwest Russia<\/strong> for JUN/JUL/AUG 2026. Key drivers: (1) rapidly intensifying El Niño, (2) intense North Atlantic Warm Hole (NAWH) south of Greenland, and (3) marine heatwaves in the Norwegian Sea and Mediterranean. The 90-day precipitation data already shows widespread dryness across France, Eastern Europe, the Baltic Region, and Scandinavia. Soil moisture rankings confirm dry-to-drought conditions in France and much of Eastern Europe. <a href='https://climateimpactcompany.com/europe-western-russia-summer-2026-outlook-major-drought-for-europe-during-summer-2026-2-2/' target='_blank'>Climate Impact Company<\/a><\/p><p><strong>Month-by-Month Breakdown:<\/strong><\/p><p>• <strong>May 2026:<\/strong> Anomalous warmth for most of Europe except France, Poland, and Scandinavia. South-central Europe sees above-normal precipitation; the rest of Europe is drier than normal.<\/p><p>• <strong>June 2026:<\/strong> Upper ridge crests over the UK and extends to Southwest Russia. Heavy rain expected in Southeast Europe/Turkey, but anomalous warmth and dryness extends across West-to-East Europe. Drought expansion expected across Central Europe.<\/p><p>• <strong>July-August 2026:<\/strong> Hot and dry weather forecast for West/Central Europe. This is the peak risk period for gas demand — low hydro generation + high cooling demand = elevated gas-for-power burn.<\/p><p><strong>Implications for Gas Demand:<\/strong> A confirmed drought scenario would (1) reduce Norwegian hydroelectric generation, increasing gas-for-power substitution in Northwest Europe; (2) increase cooling-related electricity demand across Southern Europe; (3) stress reservoir levels, reducing hydro storage and increasing the burden on gas storage for winter. The net impact could add 5-10 Bcm of incremental gas demand vs a normal summer — material given the current 34.7% storage level and 26% deficit to the 5-year average.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>Seasonal forecasts issued in April have a checkered accuracy record for European summer. The ECMWF ensemble (51 members) shows significant spread for June precipitation. Moreover, El Niño's impact on European summer is statistically weaker than on winter patterns. The drought narrative is plausible but not yet high-confidence — treat it as a risk scenario, not a base case.<\/div><\/div><p><strong>💡 Trade Ideas<\/strong><\/p><p>1. <strong>Long TTF Aug '26 / Short TTF Oct '26 calendar spread<\/strong> — If drought peaks in July-August, front-month summer contracts outperform as gas-for-power demand spikes. The October contract should benefit from normalizing weather and resumed LNG flows.<\/p><p>2. <strong>Long TTF Q4 '26 calls (€55 strike)<\/strong> — If drought reduces summer injections, the Q4 '26 winter contract faces a tighter starting position. Cheap optionality on a structural supply deficit.<\/p><p>3. <strong>Short hydro-heavy Nordic power (Nord Pool Q3 '26) / Long TTF Q3 '26<\/strong> — If drought hits Scandinavian hydro, Nordic power prices spike relative to gas. A convergence trade: short Nord Pool, long TTF as a proxy for gas-powered generation demand.<\/p>","sig":"Sage 🦎","factChecked":true},{"t":"tech","badge":"📊 📦 Storage Watch","title":"EU Storage at 34.7% — 26% Below 5-Year Average; US Surplus Narrows to 140 Bcf","hook":"EU underground gas storage stands at just 34.7% of capacity as of 8 May — 17% below last year and 26% under the 5-year average. The EU's 90% by 1 November mandate is at risk without accelerated injections. US storage sits at a 140 Bcf surplus to the 5-year average after an 85 Bcf build.","authorWord":"Le déficit européen est la variable clé. Chaque semaine de remplissage lent accroît le risque hivernal.","author":"Blaise 🧮","details":"<p><strong>EU Storage (AGSI+):<\/strong> As of 8 May 2026, EU-wide underground gas storage is at <strong>34.7%<\/strong> of capacity, up from 33.1% the previous weekend but down <strong>17.0% vs the same period last year<\/strong> and down <strong>25.9% vs the 5-year average<\/strong>. At this pace, reaching the EU-mandated 90% by 1 November requires sustained injection rates of ~1.5% per week through the summer — a rate that has only been achieved in 3 of the last 10 years. The combination of elevated TTF prices, reduced LNG supply from Hormuz, and potential drought-driven gas-for-power demand creates a triple headwind for the injection trajectory. <a href='https://www.canadalnggroup.com/natural-gas-prices-weekly-update-jkm-ttf-and-henry-hub-11-may-2026' target='_blank'>Canada LNG Group / AGSI+<\/a><\/p><p><strong>US Storage (EIA):<\/strong> Working gas in underground storage for the week ended 8 May 2026 totaled approximately <strong>2,290 Bcf<\/strong>, following an <strong>85 Bcf injection<\/strong> — matching consensus and vs the 5-year average build of 84 Bcf. Total inventories are now <strong>140 Bcf above<\/strong> the 5-year average (vs 139 Bcf the previous week). Year-on-year: inventories are ~3.5% above last year. The modest surplus vs the 5Y average provides a cushion, but the surplus has essentially plateaued — a sign that below-average production (15-week low) and rising LNG feedgas demand are absorbing the buffer. <a href='https://www.stonex.com/en/insights/eia-weekly-nat-gas-storage-update-2026-05-14/' target='_blank'>StoneX EIA Update<\/a> · <a href='https://www.eia.gov/naturalgas/storage/' target='_blank'>EIA<\/a><\/p><p><strong>Injection Trajectory — EU:<\/strong> At 34.7% on 8 May, the EU needs to inject ~1,100 TWh (roughly 100 Bcm) over the next ~24 weeks to reach 90% by November. That requires an average injection rate of ~46 TWh/week (~4.2 Bcm/week). Current rates are running below this pace, suggesting either (a) higher TTF prices must attract incremental LNG cargoes, or (b) demand destruction via demand-side measures becomes necessary later in the year.<\/p><p><strong>YoY Comparison:<\/strong> At this date in 2025, EU storage was at ~51.7% — nearly 17 percentage points higher. The 2026 starting position is the weakest since 2022, creating structural upside risk for TTF as the injection season progresses and any supply disruption (Hormuz extension, Norwegian outage) has an outsized price impact.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The 34.7% figure sounds alarming but it's partly a timing issue — the heating season extended later into April due to cold snaps, pushing the injection start later. If summer weather is normal and LNG supply normalizes (Hormuz opens), the trajectory can catch up. The market has already priced much of this risk into the +36% YoY TTF premium. The real question is whether Hormuz stays closed through August — if it does, then the mandate is genuinely at risk.<\/div><\/div><p><strong>💡 Trade Ideas<\/strong><\/p><p>1. <strong>Long TTF Q4 '26 / Short TTF Q2 '27 calendar spread<\/strong> — Storage deficit widens winter premium. If EU misses the 90% target, Q4 '26 tightens relative to next summer. Target: spread from current ~€3/MWh to €5+/MWh.<\/p><p>2. <strong>Long TTF Dec '26 $50 calls (converted to EUR strike equivalent)<\/strong> — If storage trajectory continues to lag, winter TTF could spike above €50/MWh. The call premium offers asymmetric payout on a tail risk scenario.<\/p><p>3. <strong>Short HH Sep '26 / Long TTF Sep '26 (cross-Atlantic basis)<\/strong> — US surplus vs EU deficit should widen the HH-TTF basis. If US LNG exports recover post-maintenance, US domestic prices face upward pressure while EU tightens further.<\/p>","sig":"Blaise 🧮","factChecked":true},{"t":"alert","badge":"📊 💣 Geopolitics & Regulation","title":"Trump Rejects Iran Ceasefire Response — Hormuz Enters Week 10 with No Resolution Path","hook":"President Trump rejected Iran's response to a US peace proposal, dashing near-term hopes for a Hormuz reopening. With ~20% of global LNG stranded and EU storage at 34.7%, the geopolitical risk premium in TTF is structural, not speculative.","authorWord":"Hormuz est devenu un risque persistant, plus une crise aiguë. Le marché a intégré le scénario base.","author":"Henry 🦉","details":"<p><strong>Iran-US Ceasefire — Latest:<\/strong> President Trump rejected Iran's formal response to a US proposal aimed at ending the 10-week conflict, according to reporting via Trading Economics and multiple news outlets. The rejection signals that a negotiated resolution is not imminent. The Strait of Hormuz remains effectively closed for commercial LNG traffic, with both sides restricting navigation. No timeline for reopening has been communicated. <a href='https://tradingeconomics.com/commodity/eu-natural-gas' target='_blank'>Trading Economics<\/a><\/p><p><strong>Hormuz — Quantified Impact:<\/strong> The strait is the transit route for roughly <strong>80-90 Mt/year of Qatari LNG<\/strong> (~20% of global LNG supply) plus UAE volumes. A 10-week closure has stranded approximately 15-17 Mt of LNG that would have been delivered to Asian and European markets. The market has partially adapted: European buyers have increased Atlantic Basin purchases (US, Nigeria, Trinidad), and Qatari cargoes have been rerouted or deferred. However, the structural tightening is reflected in TTF's 36% YoY premium and JKM's elevated levels. <a href='https://www.kpler.com/blog/european-natural-gas-outlook-2026' target='_blank'>Kpler<\/a><\/p><p><strong>Hormuz Scenario Matrix:<\/strong><\/p><p><em>Scenario A — Brief reopening (1-2 weeks):<\/em> Probability ~15%. Trigger: bilateral de-escalation agreement. Impact: TTF drops €3-5/MWh as Qatari cargoes flood back to market. Trade: short TTF front-month, long calendar spreads.<\/p><p><em>Scenario B — Status quo through summer (current baseline):<\/em> Probability ~45%. Hormuz remains restricted through Q3 2026. Impact: TTF stays elevated at €45-50/MWh. EU storage refill slows but doesn't fail. Trade: long TTF Q3-Q4 calendar spreads.<\/p><p><em>Scenario C — Escalation — broader regional conflict:<\/em> Probability ~20%. Impact on Saudi or UAE infrastructure. Impact: TTF spikes to €55-65/MWh. EU activates emergency measures. Trade: long TTF Dec '26 calls, long JKM-TTF spread.<\/p><p><em>Scenario D — Extended closure through winter:<\/em> Probability ~20%. No resolution by October. Impact: EU misses 90% storage target. TTF winter at €60+/MWh. Demand rationing possible. Trade: long TTF Q1 '27, long straddles.<\/p><p><strong>EU Regulatory — AccelerateEU:<\/strong> The EC's 44-point AccelerateEU plan includes electricity tax cuts and coordinated storage refill measures. The 20th sanctions package targets Russian energy, though enforcement details remain pending. These measures provide structural support for TTF but are secondary to the Hormuz physical supply constraint.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>The 10-week Hormuz closure has not produced the price spike many expected — TTF at €48 is elevated but not in crisis territory. The market has adapted: Atlantic LNG is filling the gap, demand elasticity is absorbing the shock, and inventories, while low, are not critically so. The 36% YoY premium partly reflects the broader commodity rally and weaker EUR, not just Hormuz. Overstating the geopolitical premium is a risk.<\/div><\/div><p><strong>💡 Trade Ideas<\/strong><\/p><p>1. <strong>Long TTF Dec '26 / Short TTF Jun '26 calendar spread<\/strong> — The winter contract underprices the storage deficit risk. If Hormuz stays closed, the Dec-Jun spread should widen from ~€4 to €7+/MWh.<\/p><p>2. <strong>Long TTF Aug '26 straddle (€45 straddle)<\/strong> — Maximum optionality ahead of summer injection data. If drought hits or Hormuz escalates, the upside is significant. If both risks fade, time decay is the cost.<\/p><p>3. <strong>Short EUR/USD (long USD) as a hedge<\/strong> — Geopolitical risk and commodity strength tend to support USD. A short EUR position provides a hedge against TTF gains if denominated in USD.<\/p>","sig":"Henry 🦉","factChecked":true},{"t":"strategy","badge":"📊 🎯 Risk Flags & Outlook","title":"Triple Squeeze: Hormuz + Storage Deficit + Drought — TTF at Inflection Point","hook":"Three converging risks — persistent Hormuz closure, a 26-below-5Y storage deficit, and a drought forecast for European summer — create a structural bull case for TTF. But the market has already priced much of this. The question now is catalyst timing.","authorWord":"Trois risques convergent. Le marché a prix le base case mais pas les queues de distribution.","author":"La Rédaction 🦊","details":"<p><strong>TOP 3 RISKS (ranked by probability × impact):<\/strong><\/p><p>1. <strong>Hormuz remains closed through summer (45% probability, HIGH impact)<\/strong> — Base case. TTF stays €45-50/MWh. EU storage reaches ~80-85% by November. No crisis, but persistent tightness.<\/p><p>2. <strong>European drought materializes (35% probability, HIGH impact)<\/strong> — Climate Impact Company forecast. If confirmed, adds 5-10 Bcm incremental gas demand. Storage refill trajectory deteriorates. Q4 TTF could spike above €55/MWh.<\/p><p>3. <strong>Hormuz escalates to broader regional conflict (20% probability, EXTREME impact)<\/strong> — Saudi or UAE infrastructure threatened. TTF could spike to €60-70/MWh. IEA coordinated release, demand rationing.<\/p><p><strong>BULL SCENARIO (25% probability):<\/strong> Hormuz closure extends through Q4 + drought confirms + Norwegian outages. TTF Dec '26 reaches €60/MWh. <em>Trade structure:<\/em> Long TTF Dec '26 €55 calls (~€2.5 premium), long TTF Q4-Q1 '27 spread. Asymmetric payoff: 3-4x if realized.<\/p><p><strong>BEAR SCENARIO (30% probability):<\/strong> Hormuz opens in June + normal summer weather + US production rebounds post-maintenance. TTF drops to €38-42/MWh. <em>Trade structure:<\/em> Short TTF Jun '26 / Long TTF Dec '26 put spread (€42/€38 strikes). Defensive play capturing mean reversion.<\/p><p><strong>WILD CARD (10% probability):<\/strong> Hormuz opens AND a major Norwegian outage occurs simultaneously ( Troll field, etc.). Price volatility explodes as one risk resolves and another emerges. <em>Trade structure:<\/em> Long TTF Jul '26 straddle (€48 straddle). Cheap optionality on extreme volatility.<\/p><p><strong>CATALYSTS TO WATCH:<\/strong><\/p><p>• <strong>15-18 May:<\/strong> Iran-US diplomatic signals — any back-channel progress could trigger a TTF pullback<\/p><p>• <strong>21 May:<\/strong> EIA storage report (week ended 15 May) — larger-than-expected build would pressure HH<\/p><p>• <strong>June:<\/strong> Golden Pass / Freeport LNG return to full service — incremental 1.5-2 bcfd feedgas<\/p><p>• <strong>June:<\/strong> ECMWF sub-seasonal forecast update — confirmation/negation of drought scenario<\/p><p>• <strong>July:<\/strong> Peak European demand visibility — actual vs forecast temperatures, hydro levels<\/p><p><strong>CONVICTION MATRIX:<\/strong><\/p><p>The highest-conviction trade is <strong>long TTF calendar spreads (front vs deferred)<\/strong> — the market has not fully priced the compounding effect of three simultaneous risks. Even if each risk partially materializes, the combined impact on front-month tightness is underestimated. Probability: ~55%. Conviction: HIGH (3x+ payout on moderate price moves).<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>This analysis is cleanly structured but risks confirmation bias — three bullish risks presented together create an impression of certainty. The bear case deserves more weight: Trump's administration is actively pursuing a deal (they proposed it), the Atlantic Basin LNG supply is expanding, and US production declines are seasonal. The 30% bear probability may be too low.<\/div><\/div><p><strong>💡 Trade Ideas<\/strong><\/p><p>1. <strong>Long TTF Jun '26 / Short TTF Dec '26 spread (flatteners)<\/strong> — If diplomacy breaks through, front-month drops faster than winter. Target: spread narrows from current ~€4 to €1/MWh.<\/p><p>2. <strong>Long TTF Q3 '26 / Short TTF Q3 '27 spread<\/strong> — If drought hits, summer 2026 is most affected; 2027 normalizes. Calendar spread captures the transient nature of the risk.<\/p><p>3. <strong>Long TTF Dec '26 put spread (€40/€35)<\/strong> — Cheaper hedge than a put. Provides €5/MWh of downside protection at reasonable premium if the bear case materializes.<\/p>","sig":"La Rédaction 🦊","factChecked":true},{"t":"analysis","badge":"🎲 Scénarios","title":"7 Scénarios — Votes du Conseil","hook":"Le conseil évalue 7 scénarios de marché pour les semaines à venir, du plus probable (Hormuz statu quo + range TTF) au plus extrême (crise hivernale). Le consensus penche pour un marché rangebound avec biais haussier.","authorWord":"Le Conseil 🎲","author":"Le Conseil 🎲","details":"<div class='scenario-block'><h3>S1 — TTF rangebound €45-50, Hormuz statu quo, injection lente <span class='proba'>30%<\/span><\/h3><p>Hormuz reste fermé mais le marché s'adapte. TTF oscille entre €45 et €50 sans breakout. Injection EU à 80-85% en novembre. Pas de crise mais premium persistant. Le marché est dans un équilibre tendu.<\/p><p class='votes'>Apex 28% · Sage 30% · Nova 35% · Blaise 30% · Lyra 28% · Dante 32% · Felix 27%<\/p><\/div><div class='scenario-block'><h3>S2 — Résolution Hormuz, TTF corrige à €38-42 <span class='proba'>22%<\/span><\/h3><p>Un accord diplomatique ouvre le détroit. Les cargaisons qataries reviennent en 2-3 semaines. TTF chute de €5-8/MWh. Le premium de risque se dissipe rapidement. Le marché retourne aux fondamentaux offre/demande.<\/p><p class='votes'>Apex 25% · Sage 20% · Nova 18% · Blaise 22% · Lyra 22% · Dante 20% · Felix 27%<\/p><\/div><div class='scenario-block'><h3>S3 — Sécheresse + Hormuz, TTF spike à €52-58 cet été <span class='proba'>18%<\/span><\/h3><p>Le forecast de sécheresse se matérialise. Demande gaz-for-power accrue, hydro en baisse. TTF break au-dessus de €50. Le marché anticipe un injection deficit croissant. Calendar spreads s'élargissent massivement.<\/p><p class='votes'>Apex 15% · Sage 18% · Nova 20% · Blaise 18% · Lyra 18% · Dante 15% · Felix 20%<\/p><\/div><div class='scenario-block'><h3>S4 — US production recovery + maintenance ended, HH rally drags TTF <span class='proba'>12%<\/span><\/h3><p>La production US rebondit post-maintenance. Golden Pass et Freeport à pleine capacité. Le surplus US de 140 Bcf s'étend. HH monte vers $3.20 mais l'arb HH-TTF se resserre. TTF modérément haussier.<\/p><p class='votes'>Apex 12% · Sage 12% · Nova 10% · Blaise 12% · Lyra 12% · Dante 15% · Felix 11%<\/p><\/div><div class='scenario-block'><h3>S5 — Escalade géopolitique, TTF au-dessus de €60 <span class='proba'>8%<\/span><\/h3><p>Le conflit s'étend au-delà d'Hormuz. Frappes sur des infrastructures énergétiques. Panique sur le marché. TTF spike, volatilité explosive. L'AIE active les mécanismes de coordination. Rationnement envisagé.<\/p><p class='votes'>Apex 10% · Sage 8% · Nova 8% · Blaise 8% · Lyra 8% · Dante 10% · Felix 6%<\/p><\/div><div class='scenario-block'><h3>S6 — Winter crisis — EU misses 90%, TTF Q4 > €65 <span class='proba'>6%<\/span><\/h3><p>Hormuz fermé + sécheresse + sous-injections = EU storage à 75-80% en novembre. Panique hivernale. TTF Q4 au-dessus de €65/MWh. Demand-side measures activées. Marché en mode crise.<\/p><p class='votes'>Apex 6% · Sage 8% · Nova 5% · Blaise 7% · Lyra 8% · Dante 5% · Felix 5%<\/p><\/div><div class='scenario-block'><h3>S7 — Goldilocks — Hormuz opens, normal summer, storage back on track <span class='proba'>4%<\/span><\/h3><p>Le meilleur scénario : Hormuz ouvre début juin, été normal sans sécheresse, production US forte. EU atteint 90% facilement. TTF retombe sous €40. Le marché déprime le premium de risque intégralement.<\/p><p class='votes'>Apex 4% · Sage 4% · Nova 4% · Blaise 3% · Lyra 4% · Dante 3% · Felix 4%<\/p><\/div><p class='consensus'><strong>🎯 Consensus :<\/strong> Le marché est dans un équilibre instable — le scenario de base (S1, 30%) est un range haussier, mais la probabilité cumulée des scénarios adverses (S3+S5+S6 = 32%) dépasse le scenario de résolution optimiste (S2+S7 = 26%). Le conseil recommande de maintenir un biais haussier avec couverture downside.<\/p><div class='dissent'><div class='dissent-label'>🔥 Dissent — Dante 🔥<\/div><div class='dissent-text'>Le conseil est trop complaisant sur le scenario S2 (résolution Hormuz à 22%). C'est un événement binaire — soit ça arrive, soit ça n'arrive pas. Et quand ça arrive, le prix ne corrige pas de €5, il corrige de €10 en 48h. La distribution des rendements est asymétrique et le conseil la traite comme normale. Mon proba pour S2 serait 30%.<\/div><\/div>","sig":"Le Conseil 🎲","factChecked":true},{"t":"analysis","badge":"📊 🌍 Scénario Géopolitique","title":"Géopolitique & Gaz — Délibération du Conseil","hook":"Le conseil identifie 7 scénarios géopolitiques réels impactant le gaz, du plus probable (statu quo Hormuz) au plus extrême (escalade régionale). Le consensus : le risque est persistant mais gérable.","authorWord":"Le Conseil 🌍","author":"Le Conseil 🌍","details":"<div class='scenario-block'><h3>S1 — Hormuz reste fermé tout l'été 2026 <span class='proba'>38%<\/span><\/h3><p>Aucune résolution diplomatique avant septembre. Le statu quo se prolonge : ~20% du LNG mondial reste bloqué. L'Europe s'adapte via les flux atlantiques. TTF reste dans une fourchette €45-50/MWh.<\/p><p class='votes'>Apex 35% · Sage 40% · Nova 42% · Blaise 35% · Lyra 38% · Dante 40% · Felix 36%<\/p><\/div><div class='scenario-block'><h3>S2 — Réouverture négociée d'Hormuz en juin-juillet <span class='proba'>22%<\/span><\/h3><p>Washington et Téhéran trouvent un accord de ceasefire conditionnel. Les navires reprennent progressivement le transit. Le marché anti-pricing TTF de €3-5/MWh en 2 semaines. Les volumes qataris reviennent sur le marché.<\/p><p class='votes'>Apex 25% · Sage 20% · Nova 18% · Blaise 25% · Lyra 20% · Dante 15% · Felix 30%<\/p><\/div><div class='scenario-block'><h3>S3 — Sécheresse européenne confirmée, demande gaz accrue <span class='proba'>15%<\/span><\/h3><p>Le forecast Climate Impact Company se confirme. Production hydro norvégienne en baisse, refroidissement accru. Demande gaz additionnelle estimée à 5-10 Bcm sur l'été. Injection storage ralentit encore.<\/p><p class='votes'>Apex 12% · Sage 15% · Nova 18% · Blaise 15% · Lyra 15% · Dante 10% · Felix 20%<\/p><\/div><div class='scenario-block'><h3>S4 — Accélération des sanctions UE contre le LNG russe (20ème paquet) <span class='proba'>10%<\/span><\/h3><p>Le Conseil européen adopte des restrictions renforcées sur les importations spot de LNG russe. Impact immédiat limité (~15 Bcm/yr) mais signal politique fort. Les terminaux de Zeebrugge et Montoir voient des réorientations.<\/p><p class='votes'>Apex 12% · Sage 10% · Nova 8% · Blaise 8% · Lyra 12% · Dante 15% · Felix 5%<\/p><\/div><div class='scenario-block'><h3>S5 — Retour maintenance US LNG, offre atlantique à max <span class='proba'>8%<\/span><\/h3><p>Golden Pass et Freeport LNG retrouvent pleine capacité mi-juin. Feedgas US monte à 19+ bcfd. Le surplus US (140 Bcf vs 5Y) permet des exportations massives. Pression baissière sur HH et, par arb, sur TTF.<\/p><p class='votes'>Apex 8% · Sage 8% · Nova 8% · Blaise 10% · Lyra 8% · Dante 12% · Felix 4%<\/p><\/div><div class='scenario-block'><h3>S6 — Escalade régionale : frappes sur infra saoudienne ou émiratie <span class='proba'>5%<\/span><\/h3><p>Le conflit s'étend au-delà d'Hormuz. Des infrastructures pétrolières/gazières saoudiennes ou émiraties sont touchées. TTF spike à €60-70/MWh. L'AIE coordonne une réponse. Demand rationing en Europe possible.<\/p><p class='votes'>Apex 5% · Sage 5% · Nova 4% · Blaise 5% · Lyra 5% · Dante 6% · Felix 3%<\/p><\/div><div class='scenario-block'><h3>S7 — Fermeture prolongée d'Hormuz jusqu'à l'hiver 2026-27 <span class='proba'>2%<\/span><\/h3><p>Aucune résolution diplomatique avant octobre. L'Europe rate l'objectif 90% de stockage. TTF hiver dépasse €70/MWh. Rationnement de la demande activé. Crise énergétique majeure.<\/p><p class='votes'>Apex 3% · Sage 2% · Nova 2% · Blaise 2% · Lyra 2% · Dante 2% · Felix 2%<\/p><\/div><p class='consensus'><strong>🎯 Consensus :<\/strong> Le conseil converge s
