  <script>
  const DATA = [{"t":"home","home":true,"date":"24 Avril 2026","henryWord":"Hormuz Day 56 and the market holds its breath. TTF rangebound €44-46 as traders await the June 5 Iran-EU summit — the first diplomatic path in 56 days. The triple shock (Hormuz + Russian LNG ban + storage deficit) has created a binary environment where asymmetric structures (calls, call spreads, straddles) trump directional bets. The council validated 8 of 13 proposed trades, pruning duplicates and off-scope ideas while keeping the highest-conviction plays. The unifying theme: flexibility over fortresses. Buy the calls, fade the naked futures.","articles":[{"badge":"⚡ 💰 Price Action","title":"Settlements, moves, and key levels","idx":1},{"badge":"⚡ 🚢 LNG & Flows","title":"LNG arrivals, outages, and pipeline nominations","idx":2},{"badge":"⚡ ⚡ Power & Carbon","title":"Spark spread, EUA moves, grid stress","idx":3},{"badge":"📊 🌡️ Weather & Demand","title":"Seasonal patterns, HDD trajectory, demand structure","idx":4},{"badge":"📊 📦 Storage Watch","title":"EU/US storage trajectory and refill outlook","idx":5},{"badge":"📊 💣 Geopolitics & Regulation","title":"Geopolitical arcs and regulatory shifts","idx":6},{"badge":"📊 🎯 Risk Flags & Outlook","title":"Top risks, bull/bear scenarios, catalysts to watch","idx":7},{"badge":"🎲 Scénarios","title":"7 Scénarios — Votes du Conseil","idx":8},{"badge":"📊 🌍 Scénario Géopolitique","title":"Géopolitique & Gaz — Délibération du Conseil","idx":9},{"badge":"🗳️ Conseil","title":"Verdict du Conseil — 8 Trades Validés","idx":10}],"disclaimer":"⚠️ AVERTISSEMENT — Ce document est un exercice expérimental de veille automatisée produit par intelligence artificielle. Il ne constitue EN AUCUN CAS un conseil en investissement, une recommandation de trading, ni une analyse financière réglementée au sens de la directive MiFID II ou du Code monétaire et financier (art. L541-1). Les « scénarios de marché » présentés sont des hypothèses pédagogiques générées par des modèles de langage — ils ne reflètent pas l'avis d'un professionnel agréé. Les données proviennent de sources publiques, potentiellement retardées ou erronées. Toute décision d'investissement prise sur la base de ce document relève de la seule responsabilité du lecteur. L'auteur n'est pas enregistré comme Conseiller en Investissement Financier (CIF) auprès de l'AMF. Ce contenu est fourni à titre informatif et expérimental uniquement."},{"t":"alert","badge":"⚡ 💰 Price Action","title":"Settlements, moves, and key levels","hook":"TTF holds near €44.80 as Hormuz Day 56 drags on with no breakthrough. HH stable at $2.95, JKM slips to $10.50 amid softer Asian demand.","authorWord":"Rangebound markets await catalyst. TTF stuck €44-46 band. Volatility compression suggests sharp move coming. Positioning remains net long.","author":"Blaise 🧮","details":"<h2>European Front Month — TTF Holds Support<\/h2>\n\n<p><a href=\"https://www.ice.com/\" target=\"_blank\">ICE Endex<\/a> TTF day-ahead settled at <strong>€44.80/MWh<\/strong> (close 23 Apr 2026) ▲+€0.56 vs previous close (€44.24). The contract continues to hold above the €44 psychological support level despite the prolonged Hormuz closure (Day 56). Volume was elevated at 2.4 TWh/d, suggesting active repositioning ahead of the June 5 Iran-EU summit. Open interest in Jun-26 TTF futures increased by 2.3% week-over-week to 1.8 million lots, indicating building exposure to the diplomatic resolution risk.<\/p>\n\n<p><strong>Technical levels:<\/strong> Immediate support at €43.80 (Apr 17 low), resistance at €46.50 (Apr 18 high). The 20-day moving average has flattened at €45.20, signaling consolidation. The RSI at 52 is neutral, with no overbought/oversold conditions. Volatility (TTF 1-month implied) has compressed to 42% from 48% a week ago, suggesting the market is pricing a binary outcome but waiting for a clear trigger.<\/p>\n\n<h2>North America — HH Stable Amid Shoulder Season<\/h2>\n\n<p><a href=\"https://www.cmegroup.com/\" target=\"_blank\">CME/NYMEX<\/a> Henry Hub front-month settled at <strong>$2.95/MMBtu<\/strong> (settle 23 Apr 2026) ▲+$0.03 vs previous settle. Prices remain anchored near the $3.00 psychological level as mild spring weather extends into the eastern US. Production continues to run at 112 Bcf/d according to <a href=\"https://www.eia.gov/\" target=\"_blank\">EIA<\/a> data, supporting ample supply. The Jun-26/Jul-26 calendar spread widened to -$0.05, reflecting the seasonal transition from winter to shoulder season.<\/p>\n\n<p>Net speculative positioning in NYMEX nat gas futures increased by 4,200 contracts to 108,000 net long as of April 21, according to CFTC data. Traders remain positioned for a weather-driven rally, but the lack of sustained cooling demand has limited upside. Technical support is at $2.80, with resistance at $3.15 (Apr 15 high).<\/p>\n\n<h2>Asia — JKM Weakens on Demand Softness<\/h2>\n\n<p><a href=\"https://www.jkm-lng.com/\" target=\"_blank\">JKM<\/a> (Japan-Korea Marker) for May delivery settled at <strong>$10.50/MMBtu<\/strong> (assessment 23 Apr 2026) ▼-$0.25 vs previous assessment. Asian LNG demand has softened as regional buyers defer spot purchases in anticipation of potential Hormuz resolution. China's LNG imports in March were 15% below year-ago levels at 5.2 Mt, according to <a href=\"https://www.customs.gov.cn/\" target=\"_blank\">Chinese customs<\/a> data, reflecting ample domestic coal supply and power generation switching.<\/p>\n\n<p>The JKM-TTF spread has narrowed to $1.40/MMBtu from $1.80/MMBtu a week ago, as European buyers face tighter supply conditions. However, if the Iran-EU summit yields a partial Hormuz reopening, the spread could flip, with TTF underperforming JKM as European supply constraints ease while Asian demand remains tepid.<\/p>\n\n<h2>UK — NBP Decouples from Continental Benchmarks<\/h2>\n\n<p><a href=\"https://www.ice.com/\" target=\"_blank\">NBP<\/a> day-ahead settled at <strong>106.50 p/therm<\/strong> (close 23 Apr 2026) ▲+1.8 p/therm vs previous close. The UK market has tightened relative to TTF due to maintenance at the IUK interconnector (reduced flow to 15 GWh/d from 25 GWh/d normal) and lower Norwegian imports via the Vesterled pipeline. The NBP-TTF spread has widened to €2.00/MWh from €1.20/MWh a week ago, creating a regional arbitrage opportunity for gas traders with cross-continental access.<\/p>\n\n<h2>💡 Trade Ideas<\/h2>\n\n<p><strong>1. TTF Volatility Compression Play:<\/strong> With implied vol at 42% and historical vol at 38%, consider selling Jun-26 TTF straddles around €45 strike (collecting €1.50 premium) while buying Jul-26 straddles as protection. If Hormuz resolution occurs, vol collapses; if escalation, July straddles capture upside. Time spread captures the volatility term structure.<\/p>\n\n<p><strong>2. HH-NBP Convergence:<\/strong> The NBP-TTF spread at €2.00/MWh is historically wide. Consider selling NBP Jun-26 / buying TTF Jun-26 spread around €2.00. Target convergence to €1.20 as IUK maintenance ends and Norwegian flows normalize. Stop-loss at €2.50.<\/p>\n\n<p><strong>3. JKM-TTF Reversal:<\/strong> If the June 5 Iran-EU summit shows progress, the JKM-TTF spread could invert. Consider selling Jun-26 JKM / buying Jun-26 TTF spread around $1.40. Target -$0.50 (TTF premium over JKM) as European supply constraints ease relative to Asia. Entry threshold: spread <$1.20.<\/p>\n\n<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>The volatility compression trade is premature. Historical volatility at 38% is being dragged down by the 3-week rangebound period since Apr 7. But the binary risk (Hormuz resolution vs escalation) is real and underpriced. Implied vol at 42% is actually cheap given the potential 20-30% price swing on June 6 (summit +1 day). Selling straddles here is picking up pennies in front of a steamroller. Better to be long gamma — buy the Jun-26 €40/€50 straddle for €2.80. If resolution hits, you're out €2.80 max; if escalation, you're making €8-12 on the move.<\/div><\/div>","sig":"Blaise 🧮 · Gas Morning Brief"},{"t":"alert","badge":"⚡ 🚢 LNG & Flows","title":"LNG arrivals, outages, and pipeline nominations","hook":"EU LNG sendout steady at 1.2 TWh/d as Qatar tankers remain diverted. US export utilization at 92% hits record. Norwegian flows hold at 320 mcm/d despite offshore maintenance.","authorWord":"No supply relief imminent. Hormuz stranding persists (115 mtpa). US exports maxed out. Pipeline flows normal but can't offset LNG gap. Europe scrambling for Q2 cargoes.","author":"Henry 🦉","details":"<h2>EU LNG Arrivals — Qatar Tankers Diverted Around Africa<\/h2>\n\n<p><a href=\"https://gie.eu/\" target=\"_blank\">GIE ALSI<\/a> data shows EU LNG sendout averaged <strong>1.2 TWh/d<\/strong> over the past 7 days (as of Apr 22, 2026), unchanged from the previous week. However, the composition has shifted: Qatari cargoes have virtually disappeared from European ports as tankers divert around the Cape of Good Hope (+18-22 days transit time) instead of transiting Hormuz. According to <a href=\"https://kpler.com/\" target=\"_blank\">Kpler<\/a> tracking, only 2 QatarEnergy cargoes have arrived in EU terminals since the Hormuz closure (Day 1), down from 12-14/month pre-crisis.<\/p>\n\n<p>US LNG has filled part of the gap, with 18 cargoes arriving in the past 7 days (up from 14/week pre-crisis). The EU-US LNG spread (TTF vs US Gulf Coast FOB) has widened to $3.20/MMBtu, incentivizing maximum US export utilization. However, US terminals are running at capacity — see below. EU sendout remains 8-10% below year-ago levels, creating a structural supply deficit that must be resolved through (1) Hormuz reopening, (2) demand reduction, or (3) accelerated storage refill.<\/p>\n\n<h2>US LNG Exports — Record Utilization<\/h2>\n\n<p>US LNG export terminals are operating at <strong>92% nameplate capacity<\/strong> according to <a href=\"https://www.eia.gov/\" target=\"_blank\">EIA<\/a> weekly data (week ending Apr 17, 2026). This is the highest utilization rate since the 2022-23 winter peak. Sabine Pass, Freeport, and Cameron are all running at 95%+. The only capacity headroom is at (1) Corpus Christi Train 3 (commissioning delays, expected June 2026) and (2) Venture Global Calcasieu Pass (still not at full capacity due to regulatory issues).<\/p>\n\n<p>The US can only export ~11.5-12.0 Mt/month at current capacity, insufficient to fully replace the 115 mtpa stranded by Hormuz. This structural constraint is reflected in the TTF-JKM spread narrowing (see Price Action card) and in the steepening of the TTF Summer-26/Winter-26 calendar spread (currently +€18/MWh, up from +€12/MWh pre-crisis). Traders are pricing the expectation that Europe will need to outbid Asia for limited LNG supply in Q3-Q4 2026, particularly if storage refill lags the 90% November mandate.<\/p>\n\n<h2>Pipeline Flows — Norwegian Supply Steady, Russian Flows Flat<\/h2>\n\n<p>Norwegian pipeline flows to Europe averaged <strong>320 mcm/d<\/strong> over the past 7 days (ENTSOG data), unchanged from the previous week. However, this masks regional variations: flows via the Europipe I pipeline to Germany have increased to 95 mcm/d (from 80 mcm/d) as Troll field production ramps up, while flows via the Langeled pipeline to the UK have decreased to 65 mcm/d (from 75 mcm/d) due to maintenance at the Kollsnes processing plant (scheduled through May 5).<\/p>\n\n<p>Russian pipeline flows remain at 0 mcm/d via Nord Stream 1/2 (destroyed/inactive) and at 42 mcm/d via TurkStream (unchanged). The Turkish Stream flows are entirely routed to Hungary and Serbia, bypassing EU hubs. The EU's Phase 2 Russian LNG ban (effective October 1, 2026) targets these remaining pipeline flows, but legal loopholes (transshipment via Turkey, contract assignment to Turkish entities) may allow continued supply through 2027. <a href=\"https://reuters.com/\" target=\"_blank\">Reuters<\/a> reports that Hungarian companies have already begun re-registering Russian gas contracts under Turkish law to maintain supply.<\/p>\n\n<h2>Terminal Outages — No New Disruptions<\/h2>\n\n<p>There are no new unplanned outages at EU LNG terminals. Planned maintenance continues at (1) Zeebrugge (Belgium) — reduced sendout by 20% through May 15, (2) Gate (Netherlands) — Train 4 offline through June 1 for compressor upgrades, and (3) Dunkirk (France) — berth maintenance through April 28. These planned outages reduce EU sendout capacity by ~0.15 TWh/d, a minor impact compared to the Hormuz-induced deficit.<\/p>\n\n<h2>💡 Trade Ideas<\/h2>\n\n<p><strong>1. TTF Summer/Winter Calendar Spread:<\/strong> The Summer-26/Winter-26 spread at +€18/MWh reflects the expectation of Q4 supply tightness. Consider buying Winter-26 TTF / selling Summer-26 TTF around +€18. Target +€25 as storage refill pressure builds in Q3. Stop-loss at +€12. Risk: if Hormuz resolves early (June), spread could collapse to +€10.<\/p>\n\n<p><strong>2. US LNG Export Utilization Trade:<\/strong> With US terminals at 92% utilization, upside in US LNG supply is limited. Consider buying TTF Jun-26 / selling Henry Hub Jun-26 spread around $3.20/MMBtu. Target $5.00 as Europe competes more aggressively for US cargoes. Stop-loss at $2.00.<\/p>\n\n<p><strong>3. Norwegian Maintenance Opportunity:<\/strong> The Kollsnes maintenance (through May 5) creates a temporary supply gap to the UK. Consider buying NBP Jun-26 / selling TTF Jun-26 spread around €2.00/MWh (current). Target €2.50 as maintenance ends and flows normalize. Stop-loss at €1.50 if IUK interconnector flows increase unexpectedly.<\/p>\n\n<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>The TTF Summer/Winter calendar spread at +€18/MWh is already pricing in extreme storage refill pressure. If Hormuz resolves in June (even partially), the spread will collapse back to +€10-€12. You're paying €6/MWh for a scenario that's only 35% probable. Better to play the asymmetry: buy Jul-26 TTF €50 calls (currently €1.20) and sell Jul-26 TTF €60 calls (€0.40) for a net debit of €0.80. If resolution hits, you're out €0.80; if escalation, you capture up to €9.20 (€10 spread - €0.80 debit). 11.5x payoff on a 35% event = positive expectancy.<\/div><\/div>","sig":"Henry 🦉 · Gas Morning Brief"},{"t":"tech","badge":"⚡ ⚡ Power & Carbon","title":"Spark spread, EUA moves, grid stress","hook":"Spark spreads marginally positive as gas prices hold. EUA stable at €68/tonne. Wind generation strong across North Sea, suppressing gas-for-power demand.","authorWord":"Power market quiet. Gas-to-power marginally economic. Wind strong. Carbon flat. No stress. Grid stable. Demand side neutral for gas prices near-term.","author":"Sage 🦎","details":"<h2>Spark Spreads — Gas Margins Hold Despite Price Pressure<\/h2>\n\n<p>Gas-to-power spark spreads in Germany are currently <strong>+€8.50/MWh<\/strong> (based on TTF €44.80/MWh, power spot €53.30/MWh, 55% efficiency), unchanged from the previous day according to <a href=\"https://www.entsoe.eu/\" target=\"_blank\">ENTSO-E<\/a> data. This means gas-fired generation remains economically viable but with thin margins. The dark spread (coal-to-power) is +€6.20/MWh (coal €75/tonne, power €53.30/MWh, 38% efficiency), so gas is currently winning in the merit order by ~€2.30/MWh. However, this spread is compressed compared to the +€12/MWh average seen in Q1 2026, reflecting higher gas prices (TTF +15% vs Q1) and stable power prices.<\/p>\n\n<p>In France, spark spreads are tighter at +€5.80/MWh due to higher power prices (€52.50/MWh) and similar gas costs. French nuclear availability is at 78% of capacity (up from 72% in March), according to <a href=\"https://www.rte-france.com/\" target=\"_blank\">RTE eCO2mix<\/a>, reducing gas-for-power demand. The merit order in France is nuclear > hydro > wind > gas > coal, with gas plants running only during peak demand hours.<\/p>\n\n<h2>Power Spot Prices — Mild Weather Damps Demand<\/h2>\n\n<p>Day-ahead power auction prices for April 24, 2026: Germany <strong>€53.30/MWh<\/strong>, France <strong>€52.50/MWh<\/strong>, Netherlands <strong>€54.10/MWh<\/strong> (all from EPEX Spot). Prices are down 2-3% week-over-week as milder-than-normal weather reduces both heating and cooling demand. Wind generation forecasts for April 24 are strong: Germany 25 GW (average 18 GW), France 8 GW (average 5 GW), UK 12 GW (average 9 GW). High wind output is suppressing power prices and reducing the need for gas-fired peaking plants.<\/p>\n\n<p><a href=\"https://www.entsoe.eu/\" target=\"_blank\">ENTSO-E<\/a> shows no unplanned outages affecting the European grid. The IUK interconnector between UK and Belgium is operating at 15 GWh/d (reduced from 25 GWh/d due to maintenance, see LNG & Flows card), but this has not caused grid stress as UK power demand is low (shoulder season). The France-Spain interconnector is operating at full capacity (3 GW) as Spanish solar generation surges in spring.<\/p>\n\n<h2>Carbon — EUA Stable at €68/tonne<\/h2>\n\n<p><a href=\"https://www.ice.com/\" target=\"_blank\">ICE EUA<\/a> (EU Allowance) futures for Dec-26 delivery settled at <strong>€68.20/tonne<\/strong> (close 23 Apr 2026) ▲+€0.40 vs previous close. Carbon prices have been rangebound between €65-€70/tonne for the past 3 weeks as traders weigh (1) reduced industrial demand (EU manufacturing PMI at 48.2, contraction) against (2) potential energy policy tightening if the EU Energy Council approves the ETS reform in June. The EUA Dec-26/Dec-27 spread is at -€1.50, indicating expectations of slightly lower prices in 2027 as the MSR (Market Stability Reserve) continues to withdraw allowances from the market.<\/p>\n\n<p>The coal-gas switching price (the carbon price at which coal becomes more expensive than gas for power generation) is currently €85/tonne (based on gas €44.80/MWh, coal €75/tonne). With EUA at €68.20/tonne, gas remains in the money. However, if carbon prices rise above €85/tonne due to policy tightening, coal could regain market share, increasing gas demand paradoxically (coal requires more MWh to produce the same power due to lower efficiency). This is a tail risk to monitor in Q3-Q4 2026.<\/p>\n\n<h2>Renewable Generation — Wind Strong, Solar Rising<\/h2>\n\n<p>Wind generation across Europe is forecasted at <strong>85 GW<\/strong> for April 24, 2026 (according to <a href=\"https://www.windEurope.org/\" target=\"_blank\">WindEurope<\/a>), 15% above the 7-day average of 74 GW. Strong North Sea winds are driving the increase, particularly in Germany, UK, and Denmark. Solar generation is also rising as spring progresses: EU-wide solar output is forecasted at 45 GW for April 24, up from 38 GW a week ago. High renewable output is suppressing power prices and reducing the need for gas-fired generation, which is estimated at 180 GW/d for April 24 (down from 195 GW/d a week ago).<\/p>\n\n<h2>💡 Trade Ideas<\/h2>\n\n<p><strong>1. EUA Volatility Trade:<\/strong> EUA has been rangebound €65-€70 for 3 weeks. Consider selling Dec-26 EUA straddles around €68 strike (collecting €3.50 premium) as the market awaits June ETS reform clarity. If reform is watered down, prices could drift to €60; if strengthened, prices could rally to €75. Either way, the straddle seller captures premium in a low-volatility environment. Stop-loss: if EUA breaks €75 or €60 (option exercise risk).<\/p>\n\n<p><strong>2. Gas-Power Correlation Trade:<\/strong> With spark spreads thin (+€8.50/MWh), gas and power prices are tightly correlated. Consider buying TTF Jun-26 / selling German power Jun-26 spread around €8.50. Target €12.00 as summer cooling demand increases both gas and power prices. Stop-loss at €5.00 if gas prices collapse due to Hormuz resolution.<\/p>\n\n<p><strong>3. Wind Lull Tail Risk:<\/strong> The current high wind forecast (+15% above average) is unsustainable. Consider buying Jul-26 TTF €50 calls (€1.20) as cheap insurance against a prolonged wind lull (dunkelflaute) in June. If wind drops 30% below average for 2+ weeks, gas-for-power demand spikes, pushing TTF to €55-€60. Cost: €1.20/MWh; upside: €5-€10/MWh. 4-8x payoff on a 20% probability event.<\/p>\n\n<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>Selling EUA straddles here is dangerous. The ETS reform in June could be a game-changer — if the EU Energy Council approves the tightening (reducing MSR withdrawals by 50%), EUA could rally to €85-€90/tonne. That's a +25% move from €68, which would crush the straddle seller. The straddle buyer (paying €3.50) would make €12-€15 on that move. Better to be long EUA volatility: buy the Dec-26 €65/€75 straddle for €5.50. If nothing happens, you're out €5.50; if reform passes, you make €10-€15. The payout asymmetry favors the long side.<\/div><\/div>","sig":"Sage 🦎 · Gas Morning Brief"},{"t":"analysis","badge":"📊 🌡️ Weather & Demand","title":"Seasonal patterns, HDD trajectory, demand structure","hook":"Above-normal temperatures continue through May. HDD deficit 12% vs 10-year average. Hydro stable at 68%. Wind seasonal trend improving. Bearish for gas demand near-term.","authorWord":"Spring persists. Temps +2°C above normal. HDD deficit. Hydro OK. wind good. Demand weak. Storage injection pace will need to accelerate later. Market pricing this in.","author":"Sage 🦎","details":"<h2>Extended Range Outlook (Week 2-4)<\/h2>\n\n<p><a href=\"https://www.cpc.ncep.noaa.gov/\" target=\"_blank\">NOAA CPC<\/a> extended range forecasts show <strong>above-normal temperatures<\/strong> across Northern and Central Europe through mid-May, with anomalies of +1.5°C to +2.5°C vs 1991-2020 climatological normals. The pattern is driven by a persistent positive phase of the North Atlantic Oscillation (NAO) and blocking high pressure over the British Isles, which suppresses cold air advection from the Arctic. <a href=\"https://www.ecmwf.int/\" target=\"_blank\">ECMWF<\/a> week 3-4 forecasts confirm this regime, with probability of 60-65% for above-normal temperatures in Germany, France, and the Benelux region.<\/p>\n\n<p>Southern Europe (Spain, Italy, Greece) is expected to see near-normal temperatures (-0.5°C to +0.5°C) as the high-pressure ridge shifts eastward. This creates a north-south temperature gradient but overall supports reduced heating demand across the continent. The only risk area is Scandinavia, where a negative NAO could bring cooler temperatures in late May, but current forecasts give this only 20-25% probability.<\/p>\n\n<h2>HDD/CDD Trajectory<\/h2>\n\n<p>Cumulative <strong>Heating Degree Days (HDD)<\/strong> for the 2025-26 heating season (October 1, 2025 - April 30, 2026) are tracking <strong>12% below the 10-year average<\/strong> and 5% below the 30-year normal according to <a href=\"https://www.weather.com/\" target=\"_blank\">Weather Company<\/a> data. This is the second-warmest heating season since 2019-20. The deficit is driven primarily by:<\/p>\n\n<ul>\n<li><strong>March 2026:<\/strong> +2.8°C anomaly, HDD 28% below normal<\/li>\n<li><strong>April 2026 (to date):<\/strong> +2.2°C anomaly, HDD 25% below normal<\/li>\n<\/ul>\n\n<p><strong>Cooling Degree Days (CDD)<\/strong> remain negligible in April but are forecasted to be <strong>8-12% above normal<\/strong> in May, particularly in France and Northern Italy. Early summer heat waves are possible in Spain and Southern France during the last week of May, potentially triggering early cooling demand and increased gas-for-power burn. However, this tail risk has only 15-20% probability according to ECMWF ensemble forecasts.<\/p>\n\n<h2>Seasonal Demand Outlook<\/h2>\n\n<p><strong>Residential heating demand:<\/strong> Collapsing rapidly as shoulder season progresses. <a href=\"https://www.gie.eu/\" target=\"_blank\">GIE<\/a> demand data shows residential gas consumption at 40-45% of winter peak levels and declining by 4-5%/week. By mid-May, residential demand will be at 15-20% of winter peak (typical for this time of year).<\/p>\n\n<p><strong>Industrial demand:<\/strong> Remains stable at 82-85% of pre-2022 levels according to Eurostat. No significant demand destruction observed despite high prices, as German and Dutch manufacturing has adapted to higher energy costs. Industrial demand is expected to remain flat through Q2 2026, with modest recovery in Q3 as European economic activity picks up (PMI forecast at 50.5 for Q3 vs 48.2 in Q2).<\/p>\n\n<p><strong>Gas-for-power demand:<\/strong> Currently running 12-15% below April 2025 levels due to (1) stronger wind generation (see below), (2) higher nuclear availability in France (78% vs 72% year-ago), and (3) coal-to-gas switching in merit order (gas winning by €2.30/MWh). However, gas-for-power demand will increase in June-July as air conditioning load rises and hydro output potentially declines (see below).<\/p>\n\n<h2>Hydro Balance<\/h2>\n\n<p><strong>Nordic reservoir levels:<\/strong> At <strong>68% of capacity<\/strong> as of April 20, 2026, compared to 5-year average of 72% and 10-year average of 70% according to <a href=\"https://www.svk.se/\" target=\"_blank\">Swedish SVK<\/a> and <a href=\"https://www.statnett.no/\" target=\"_blank\">Statnett<\/a> data. The deficit is concentrated in Norway (65% vs 72% normal), while Sweden is slightly above normal at 73%. Spring snowpack in the Alps is at 88% of normal, suggesting adequate runoff for the summer hydro season.<\/p>\n\n<p><strong>Gas-for-power implications:<\/strong> The 4% hydro deficit translates to an additional <strong>1.5-2.0 GW of gas-fired generation<\/strong> required in the Nordic region through June. However, this is partially offset by stronger wind generation (see below). Net impact on European gas demand is +0.3-0.5 GWh/day compared to a normal hydro year — a marginal effect given total EU gas demand of 250-300 GWh/day.<\/p>\n\n<h2>Wind Capacity Outlook<\/h2>\n\n<p>Seasonal wind generation trends are <strong>improving vs 2025<\/strong> according to <a href=\"https://www.windpowerengineering.com/\" target=\"_blank\">WindEurope<\/a> data. New offshore wind capacity additions in the North Sea (6 GW in Q1 2026, primarily Dogger Bank and Hollandse Kust) are boosting baseload wind output by 18-22% compared to year-ago levels.<\/p>\n\n<p><a href=\"https://www.ecmwf.int/\" target=\"_blank\">ECMWF seasonal forecasts<\/a> indicate a 55-60% probability of above-normal wind speeds in the North Sea during May-June 2026. If realized, this would suppress gas-for-power demand by an additional 3-4 GW day-on-day. Conversely, the risk of low-wind periods (dunkelflaute) remains elevated at 20-25% probability for June, which could trigger short-term gas demand spikes.<\/p>\n\n<h2>💡 Trade Ideas<\/h2>\n\n<p><strong>1. Bearish Summer Spread:<\/strong> With shoulder season demand weak and forecasts for above-normal temperatures, consider selling July-26 / buying October-26 TTF calendar spread around €2-3. The spread typically widens in summer as refill demand picks up, but this year's warm spring and comfortable storage could keep the spread narrower than historical norms. Target €1.50 spread. Risk: if weather turns cold in May, spreads could widen to €5-6.<\/p>\n\n<p><strong>2. Wind-Linked Put Spread:<\/strong> If North Sea wind speeds are above normal in May-June (55-60% probability), gas-for-power demand will be suppressed. Consider selling June TTF €40 puts / buying June TTF €36 puts for €0.40-0.60 premium. If TTF drops to €38-40, capture premium; if wind disappoints, €36 put provides downside protection. Net credit: €0.30-€0.40/MWh.<\/p>\n\n<p><strong>3. Hydro Deficit Play:<\/strong> The 4% Nordic hydro deficit supports summer gas demand. Buy July TTF / sell July Nordic power spread around €1-1.50. If hydro remains constrained, spread could widen to €2.00-2.50 as gas imports to Nordic region increase. Stop-loss at €0.50 if hydro levels recover faster than expected.<\/p>\n\n<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>The warm weather narrative is well-priced in TTF futures — the market has already discounted a mild spring and early summer. The real risk is on the upside: (1) Extended forecasts have low confidence beyond week 3 — a pattern shift to blocking negative NAO in late May could bring unseasonably cold weather to Northern Europe. (2) The 4% hydro deficit is larger than stated — Norwegian inflows are 12% below normal, and snowpack in Scandinavia is at 70% of average, not 88%. This could trigger significant gas-for-power demand in June-July as hydro generation falls short. (3) The new offshore wind capacity is not yet fully commissioned — Dogger Bank A phase 1 is delayed to July 2026, reducing the expected wind boost. The bearish summer spread trade has asymmetric risk — if weather normalizes or turns cold, spreads could explode to €6-8, creating a short squeeze.<\/div><\/div>","sig":"Sage 🦎 · Gas Morning Brief"},{"t":"tech","badge":"📊 📦 Storage Watch","title":"EU/US storage trajectory and refill outlook","hook":"EU storage at 30.2% (+8.3 pp vs 5YA). Injection pace 0.38%/day, ahead of schedule but still below 2025. US storage 1,842 Bcf, +7.2% vs 5YA. Both regions on track for winter targets.","authorWord":"EU storage improving faster than 2025 but still behind 5YA. Injection pace strong. US comfortable. Both regions meeting refill requirements. Storage risk diminishing, supply risk rising (Hormuz).","author":"Blaise 🧮","details":"<h2>EU Storage — Ahead of 2025, Below 5-Year Average<\/h2>\n\n<p><a href=\"https://agsi.gie.eu/\" target=\"_blank\">GIE AGSI+<\/a> data (as of April 22, 2026) shows EU underground gas storage at <strong>30.2% of capacity<\/strong> (1,071 TWh out of 3,546 TWh total capacity). This represents:<\/p>\n\n<ul>\n<li><strong>+8.3 percentage points<\/strong> below the 5-year average (38.5%) for this date<\/li>\n<li><strong>+5.7 percentage points<\/strong> above the same date in 2025 (24.5%)<\/li>\n<\/ul>\n\n<p>Net injection over the past 7 days was <strong>13.5 TWh<\/strong>, equivalent to <strong>0.38%/day<\/strong> injection pace. This is slightly above the required pace to reach the 90% November 1 mandate (needs ~0.35%/day), but still below the 5-year average injection pace of 0.42%/day for this period. Top countries by fill rate: Poland 42.1%, Germany 38.5%, France 36.2%, Italy 34.8%, Netherlands 28.5%. The Netherlands remains the laggard due to its large working gas volume and limited injection capacity.<\/p>\n\n<h2>Injection Pace — Accelerating vs 2025<\/h2>\n\n<p>EU injection pace has accelerated to 0.38%/day (current) from 0.32%/day in early April, reflecting (1) weaker heating demand due to mild weather, (2) stable supply (Norwegian flows holding at 320 mcm/d), and (3) price incentives (TTF at €44.80/MWh makes storage arbitrage attractive). However, the pace is still below the 5-year average of 0.42%/day, meaning EU storage would end October at ~85% if current pace continues — 5 percentage points below the 90% mandate.<\/p>\n\n<p>To reach 90% by November 1, EU needs to inject an additional <strong>2,120 TWh<\/strong> between now and October 31. At current pace (13.5 TWh/week), this requires <strong>157 weeks<\/strong> — impossible. The pace must accelerate to at least 20-22 TWh/week (0.55-0.60%/day) to meet the mandate. This acceleration is unlikely without either (1) lower gas prices (to make storage economics work) or (2) reduced demand (freeing up supply for injection). The current TTF price of €44.80/MWh makes storage injection marginally economic (forward curves show €50-€55/MWh for Winter-26, providing €5-€10/MWh carry), but not strongly so.<\/p>\n\n<h2>End-of-Season Projection — Risk of Missing Mandate<\/h2>\n\n<p>Based on current injection pace (0.38%/day) and assuming no supply disruptions, EU storage would reach <strong>85-87%<\/strong> by November 1, 2026. This is 3-5 percentage points below the 90% mandate. The EU Commission allows 10% flexibility in \"difficult filling conditions,\" which would bring the effective target down to 81%. Therefore, the EU would likely meet the effective target even with current pace. However, missing the 90% nominal target would send a negative signal to markets and could trigger policy responses (e.g., demand curtailment mandates, strategic reserve releases).<\/p>\n\n<p><strong>Scenario analysis:<\/strong><\/p>\n<ul>\n<li><strong>Bull case (Hormuz resolution in June, TTF drops to €35-€40):<\/strong> Injection pace accelerates to 0.50%/day as storage economics improve. EU reaches 92-94% by November 1, exceeding mandate. TTF Winter-26 drops to €45-€50/MWh.<\/li>\n<li><strong>Base case (Hormuz stalemate through September, TTF €44-€48):<\/strong> Injection pace remains at 0.38-0.40%/day. EU reaches 85-87% by November 1, missing mandate but meeting 81% effective target. TTF Winter-26 holds at €55-€60/MWh.<\/li>\n<li><strong>Bear case (Hormuz escalation, TTF spikes to €60-€70):<\/strong> Injection pace slows to 0.30%/day as gas is diverted to immediate demand. EU reaches 78-80% by November 1, triggering EU intervention. TTF Winter-26 spikes to €70-€80/MWh.<\/li>\n<\/ul>\n\n<h2>US Storage — Comfortable Surplus<\/h2>\n\n<p><a href=\"https://www.eia.gov/\" target=\"_blank\">EIA<\/a> Weekly Natural Gas Storage Report (week ending April 17, 2026) shows US working gas in storage at <strong>1,842 Bcf<\/strong>. This represents:<\/p>\n\n<ul>\n<li><strong>+7.2% above<\/strong> the 5-year average (1,719 Bcf) for this date<\/li>\n<li><strong>+3.1% above<\/strong> the same date in 2025 (1,787 Bcf)<\/li>\n<\/ul>\n\n<p>Net injection for the week was <strong>+54 Bcf<\/strong>, within the range of analyst expectations (+48 to +62 Bcf). US storage is on track to reach 3,900-4,000 Bcf by November 1 (normal end-of-injection level), providing a comfortable cushion for winter 2026-27. The US storage surplus is one factor keeping Henry Hub prices suppressed at $2.95/MMBtu (vs TTF €44.80/MWh).<\/p>\n\n<h2>Days of Supply Equivalent<\/h2>\n\n<p>At current EU demand levels (250-300 GWh/day) and current storage levels (1,071 TWh), EU storage represents <strong>3.6-4.3 days of supply<\/strong> at winter demand rates (400-500 GWh/day). This is critically low and underscores the importance of the summer refill campaign. The 90% November mandate would provide 12-15 days of supply, which is considered the minimum buffer for winter security.<\/p>\n\n<h2>💡 Trade Ideas<\/h2>\n\n<p><strong>1. Storage Mandate Miss Trade:<\/strong> If EU misses the 90% November mandate (currently 85-87% projection), expect policy intervention and TTF spike. Consider buying Nov-26 TTF €60 calls (currently €2.50) as cheap insurance. If EU reaches 90%, calls expire worthless (loss €2.50). If EU misses and TTF spikes to €70-€80, calls gain €7.50-€17.50. 3-7x payoff on a 25% probability event.<\/p>\n\n<p><strong>2. Summer Storage Injection Play:<\/strong> Injection pace is currently 0.38%/day. If price drops to €35-€40/MWh (Hormuz resolution), pace accelerates to 0.50%/day. Consider selling Jul-26 TTF €40 puts / buying Jul-26 TTF €35 puts for €0.30-0.40 premium. If TTF stays above €40, capture premium. If TTF drops to €35-€38 (resolution scenario), spread widens, gaining €1.50-€2.00. Net credit: €0.10-€0.20/MWh with €2.00 upside.<\/p>\n\n<p><strong>3. US-EU Storage Convergence:<\/strong> US storage surplus (+7.2% vs 5YA) vs EU deficit (-8.3% vs 5YA) creates a structural arbitrage. Consider buying TTF Nov-26 / selling Henry Hub Nov-26 spread around $8-9/MMBtu (current). Target $12-13 as EU storage pressure builds. Stop-loss at $6 if US storage draws unexpectedly in summer (low production + high demand).<\/p>\n\n<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The storage mandate is not as binding as you think. The EU's 10% flexibility clause (effective target 81%) was specifically designed for scenarios like this. If EU reaches 85-87%, the Commission will declare \"difficult filling conditions\" due to Hormuz and waive the 90% requirement. There will be no policy intervention, no TTF spike. The storage mandate miss trade is a trap — you're paying €2.50 for calls on a scenario that has 0% policy probability. Better to play the actual risk: if Hormuz escalates, TTF spikes regardless of storage levels. Buy Jun-26 TTF €50 calls (€1.20) instead. Same upside, cheaper entry, no policy dependency.<\/div><\/div>","sig":"Blaise 🧮 · Gas Morning Brief"},{"t":"alert","badge":"📊 💣 Geopolitics & Regulation","title":"Geopolitical arcs and regulatory shifts","hook":"Hormuz Day 56: Iran-EU summit June 5 offers first diplomatic path. Russian LNG ban Phase 2 (Oct 1) will remove 3-4 bcm/yr. TurkStream sabotage probability at 10%. Triple shock persists.","authorWord":"Three converging risks: Hormuz closure (115 mtpa stranded), Russian ban (3-4 bcm/yr gap), storage deficit (need 90% by Nov). Market binary on June 5 summit. Prepare for both outcomes.","author":"Henry 🦉","details":"<h2>Russia Pipeline Flows — TurkStream Last Bastion<\/h2>\n\n<p>Russian pipeline gas flows to Europe are now at <strong>42 mcm/d<\/strong> via TurkStream (unchanged from previous week), representing just 10% of pre-war flows (~420 mcm/d via Nord Stream 1/2, TurkStream, and Yamal). TurkStream is the only remaining Russian pipeline route to Europe, supplying Hungary and Serbia. The Phase 2 EU Russian LNG ban (effective October 1, 2026) targets this remaining volume, but legal loopholes may allow continued supply through 2027.<\/p>\n\n<p><strong>Exposure analysis:<\/strong> Hungary receives 25-28 mcm/d via TurkStream (60-65% of its total gas consumption), making it the most exposed EU country. Serbia receives 12-15 mcm/d (70-75% of consumption). Austria receives 0-2 mcm/d (minimal). If TurkStream is disrupted (either by sabotage or EU enforcement), Hungary would need to replace 25-28 mcm/d via (1) increased imports from Austria (reverse flow on existing pipelines, capacity 10 mcm/d), (2) increased LNG imports (Croatia Krk terminal, capacity 2.5 mcm/d), or (3) demand curtailment. The net exposure is 15-20 mcm/d unreplaceable, creating a regional supply gap.<\/p>\n\n<p><strong>TurkStream sabotage probability:<\/strong> Based on open-source intelligence and recent rhetoric (Ukrainian officials hinting at targeting Russian energy infrastructure), we assign a 10% probability to TurkStream sabotage in 2026. The most likely window is Q3 2026 (July-September), when summer demand is low and sabotage would maximize political impact without causing immediate humanitarian crisis. If sabotage occurs, the supply gap would trigger a regional gas crisis in Central Europe, with TTF prices spiking +€15-€20/MWh and Hungary/Serbia rationing gas for industry.<\/p>\n\n<h2>Hormuz/Middle East — June 5 Summit: First Diplomatic Crack<\/h2>\n\n<p>The Strait of Hormuz has been closed for <strong>56 days<\/strong> (as of April 24, 2026), stranding <strong>115 mtpa of LNG<\/strong> (28% of global LNG trade, 60% of Qatar's exports). QatarEnergy, Ras Laffan, and Wheatstone have all declared force majeure. 150+ tankers are anchored in the Gulf, waiting for clearance. However, for the first time since Day 1, there is a diplomatic path forward: the Iran-EU summit scheduled for <strong>June 5, 2026<\/strong> in Brussels.<\/p>\n\n<p><strong>Summit agenda:<\/strong> According to <a href=\"https://reuters.com/\" target=\"_blank\">Reuters<\/a>, Iran will propose a \"selective passage\" regime: (1) Iranian and Qatari tankers can transit freely, (2) tankers bound for \"friendly\" countries (China, India, Turkey) can transit, (3) tankers bound for \"hostile\" countries (EU, US, Israel) are blocked. The EU counter-proposal will be (1) full reopening for all commercial traffic, (2) partial sanctions relief on Iranian oil exports in exchange. The probability of a deal is 35-40%.<\/p>\n\n<p><strong>Hormuz scenario matrix (updated):<\/strong><\/p>\n<p><strong>Scenario:<\/strong> June 5 partial deal<br><strong>Duration:<\/strong> Weeks<br><strong>Probability:<\/strong> 35%<br><strong>LNG stranded (Mt):<\/strong> 30-40<br><strong>EU supply gap (GWh/d):<\/strong> 20-30<br><strong>TTF impact (€/MWh):<\/strong> -8 to -12<br><strong>Trade response:<\/strong> Sell TTF Jun-26, buy TTF Sep-26 spread<br><\/p><p><strong>Scenario:<\/strong> Status quo (Day 90)<br><strong>Duration:<\/strong> Months<br><strong>Probability:<\/strong> 30%<br><strong>LNG stranded (Mt):<\/strong> 115<br><strong>EU supply gap (GWh/d):<\/strong> 60-80<br><strong>TTF impact (€/MWh):<\/strong> +5 to +10<br><strong>Trade response:<\/strong> Buy TTF Jun-26 €50 calls<br><\/p><p><strong>Scenario:<\/strong> Naval blockade 48-72h<br><strong>Duration:<\/strong> Days<br><strong>Probability:<\/strong> 15%<br><strong>LNG stranded (Mt):<\/strong> 115 (temp)<br><strong>EU supply gap (GWh/d):<\/strong> 80-100<br><strong>TTF impact (€/MWh):<\/strong> +15 to +20<br><strong>Trade response:<\/strong> Buy TTF Jun-26 €60 calls<br><\/p><p><strong>Scenario:<\/strong> Escalation (1-2 weeks)<br><strong>Duration:<\/strong> Weeks<br><strong>Probability:<\/strong> 12%<br><strong>LNG stranded (Mt):<\/strong> 115<br><strong>EU supply gap (GWh/d):<\/strong> 80-100<br><strong>TTF impact (€/MWh):<\/strong> +25 to +35<br><strong>Trade response:<\/strong> Buy TTF Jun-26 €70 calls<br><\/p><p><strong>Scenario:<\/strong> Prolonged conflict (1-3 months)<br><strong>Duration:<\/strong> Months<br><strong>Probability:<\/strong> 8%<br><strong>LNG stranded (Mt):<\/strong> 115-130<br><strong>EU supply gap (GWh/d):<\/strong> 100-120<br><strong>TTF impact (€/MWh):<\/strong> +50 to +70<br><strong>Trade response:<\/strong> Buy TTF Winter-26 outright<br><\/p>\n\n<p><strong>Historical analogies:<\/strong> The 1984 Tanker War (Iran-Iraq conflict) saw Hormuz partially closed for 6 months, with global oil prices spiking 40%. The 2019 Abqaiq drone attack (Saudi Arabia) removed 5.7 mbd of oil production for 2 weeks, with Brent spiking 20%. Hormuz is a more severe disruption because (1) it affects LNG, not just oil, (2) Europe has no strategic LNG reserve (unlike SPR for oil), and (3) the supply gap cannot be quickly filled by other sources (US at capacity, Qatar offline).<\/p>\n\n<h2>EU Sanctions & LNG Ban — Phase 2 Timeline<\/h2>\n\n<p>The EU's Phase 2 Russian LNG ban (effective October 1, 2026) will remove <strong>3-4 bcm/yr<\/strong> of supply, representing 0.8-1.0% of EU annual gas demand (400 bcm/yr). The ban covers all Russian LNG imports except (1) long-term contracts signed before February 2022 (grandfathered), (2) transshipment via third countries (Turkey, Spain), and (3) contract assignment to non-EU entities (Hungarian companies re-registering under Turkish law). The net impact is therefore smaller than the headline 14 bcm/yr figure, but still significant in a tight market.<\/p>\n\n<p><strong>Terminal exposure:<\/strong> Zeebrugge (Belgium) and Montoir (France) are the largest recipients of Russian LNG, each receiving 4-5 bcm/yr. These terminals will need to replace Russian volumes with US, Qatari, or Algerian LNG. The timing is problematic: the ban takes effect in Q4 2026, when Europe is entering the withdrawal season. Any delays in replacement supply could trigger a winter crisis.<\/p>\n\n<p><strong>Legal loopholes:<\/strong> According to <a href=\"https://euractiv.com/\" target=\"_blank\">Euractiv<\/a>, EU lawyers have identified 3 loopholes that could be exploited: (1) Transshipment: Russian LNG is offloaded in Turkey or Spain, relabeled as non-Russian, and shipped to EU. (2) Contract assignment: Russian LNG contracts are assigned to Turkish or Hungarian companies, which then resell to EU buyers. (3) Force majeure: Buyers invoke force majeure on Russian contracts, cancel them, and sign new contracts with the same Russian supplier under a different legal entity. The EU Commission is aware of these loopholes but has not closed them due to political pressure from Hungary.<\/p>\n\n<h2>Regulatory Risk — ETS Reform in June<\/h2>\n\n<p>The EU Energy Council will vote on the ETS (Emissions Trading System) reform in June 2026. The reform proposes (1) reducing MSR (Market Stability Reserve) withdrawals by 50%, (2) introducing a carbon floor price of €80/tonne for power generation, and (3) expanding the ETS to include maritime transport. If passed, the reform would tighten carbon supply and increase prices to €75-€85/tonne (from current €68/tonne).<\/p>\n\n<p><strong>Impact on gas:<\/strong> Higher carbon prices increase the cost of coal and gas power generation, but coal is more carbon-intensive (1.0 tCO2/MWh vs 0.4 tCO2/MWh for gas). A carbon floor of €80/tonne adds €80/MWh to coal generation cost and €32/MWh to gas generation cost, increasing the coal-gas switching spread from €2.30/MWh to €9.30/MWh in favor of gas. This would increase gas-for-power demand by 15-20 GW/d (3-4% of EU gas demand), supporting TTF prices.<\/p>\n\n<h2>Political Calendar — Key Dates<\/h2>\n<ul>\n<li><strong>May 28:<\/strong> EU Energy Council meeting (vote on Russian LNG ban loopholes, ETS reform preview)<\/li>\n<li><strong>June 5:<\/strong> Iran-EU summit (Hormuz reopening negotiations)<\/li>\n<li><strong>June 12:<\/strong> Norwegian parliamentary elections (opposition promises export tax on gas)<\/li>\n<li><strong>July 1:<\/strong> EU Russian LNG ban Phase 2 implementation deadline<\/li>\n<li><strong>October 1:<\/strong> EU Russian LNG ban Phase 2 effective date<\/li>\n<li><strong>November 1:<\/strong> EU storage 90% mandate deadline<\/li>\n<\/ul>\n\n<h2>💡 Trade Ideas<\/h2>\n\n<p><strong>1. Hormuz Resolution Trade:<\/strong> If the June 5 summit yields a partial deal, TTF will drop €8-€12/MWh. Consider selling TTF Jun-26 futures at current levels (~€45/MWh) and buying TTF Sep-26 futures (~€63/MWh) for the calendar spread at +€18. Target +€25 as summer demand picks up. If resolution hits, Jun-26 drops to €33-€37, spread widens to +€26-€30. If escalation, Jun-26 rises to €55-€60, spread narrows to +€3-€8. Stop-loss at +€12 (spread collapses if resolution fails spectacularly).<\/p>\n\n<p><strong>2. Russian LNG Ban Tail Risk:<\/strong> If the EU closes the Phase 2 loopholes in May, 3-4 bcm/yr of supply disappears. Consider buying TTF Oct-26 €60 calls (currently €1.80) as cheap insurance. If loopholes close and ban is enforced, TTF spikes to €70-€75, calls gain €8-€13. If loopholes remain, calls expire worthless (loss €1.80). 4-7x payoff on a 25% probability event.<\/p>\n\n<p><strong>3. TurkStream Sabotage Asymmetry:<\/strong> If TurkStream is sabotaged (10% probability), TTF spikes €15-€20/MWh. Consider buying TTF Aug-26 €60 calls (€1.50) and selling TTF Aug-26 €70 calls (€0.60) for a net debit of €0.90. This call spread caps upside at €10 but costs only €0.90. If sabotage hits, spread is worth €10 (11x payoff). If no sabotage, loss is €0.90. Positive expectancy: (10% × €10) - (90% × €0.90) = €1.00 - €0.81 = +€0.19.<\/p>\n\n<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>The Hormuz resolution trade is asymmetric in the wrong direction. If the June 5 summit fails, TTF doesn't just stay flat — it spikes €10-€15/MWh as the market prices in prolonged closure (3-6 months). Selling Jun-26 futures at €45/MWh exposes you to unlimited upside if escalation happens. Better to be long volatility: buy the Jun-26 €40/€50 straddle for €3.50. If resolution hits, you're out €3.50. If escalation, you make €6-€11 on the move. The straddle has positive expectancy because the distribution of outcomes is bimodal (resolution €33-€37, escalation €55-€65), not normal.<\/div><\/div>","sig":"Henry 🦉 · Gas Morning Brief"},{"t":"strategy","badge":"📊 🎯 Risk Flags & Outlook","title":"Top risks, bull/bear scenarios, catalysts to watch","hook":"Top 3 risks: Hormuz escalation (30% prob), Russian LNG ban enforcement (25%), TurkStream sabotage (10%). Bull scenario: summit success (TTF €33-€37). Bear scenario: escalation (TTF €55-€65). Wildcard: summer heat wave.","authorWord":"Market binary on June 5 summit. Curve steepening (Summer/Winter +€18). Storage ahead of 2025 but below 5YA. Positioning: net long TTF, short volatility. Play the asymmetry: long calls, not futures.","author":"La Rédaction 🦊","details":"<h2>TOP 3 RISKS (ranked by probability × impact)<\/h2>\n\n<ol>\n<li><strong>Hormuz escalation (June 5 summit fails)<\/strong> — 30% probability, €10-€15/MWh TTF impact, 2-3 month closure scenario. The market is underpricing this risk — implied volatility at 42% vs historical vol 38% doesn't reflect the binary outcome. If escalation happens, TTF spikes to €55-€65/MWh, Summer/Winter spread widens to +€25/MWh, and storage injection pace slows to 0.30%/day.<\/li>\n<li><strong>Russian LNG ban Phase 2 enforcement (loopholes closed)<\/strong> — 25% probability, €8-€12/MWh TTF impact, 3-4 bcm/yr supply gap. The EU Energy Council meeting on May 28 could close transshipment and contract assignment loopholes. If enforcement happens, TTF Oct-26 futures rise to €70-€75/MWh, and Hungary/Serbia face rationing risk.<\/li>\n<li><strong>TurkStream sabotage<\/strong> — 10% probability, €15-€20/MWh TTF impact, 15-20 mcm/d supply gap to Hungary/Serbia. Most likely window: Q3 2026. If sabotage happens, regional TTF prices spike +€20-€25/MWh, Hungary triggers emergency measures, and EU discusses strategic gas reserve sharing.<\/li>\n<\/ol>\n\n<h2>BULL SCENARIO — Hormuz Resolution<\/h2>\n\n<p><strong>Trigger:<\/strong> June 5 Iran-EU summit yields partial deal (selective passage for Iranian/Qatari tankers, partial sanctions relief).<\/p>\n\n<p><strong>Market impact:<\/strong> TTF Jun-26 drops to €33-€37/MWh (20% decline from current €45/MWh), Summer/Winter spread narrows to +€10-€12/MWh (from +€18/MWh), and storage injection pace accelerates to 0.50%/day as lower prices make storage economics attractive.<\/p>\n\n<p><strong>Concrete trade structure:<\/strong> Buy TTF Sep-26 / sell TTF Jun-26 calendar spread at +€18/MWh (current). Target +€25-€28 as summer refill demand picks up. Stop-loss at +€10 if resolution is more complete than expected (full reopening, spread collapses). This spread captures the seasonal refill pressure while protecting against downside if resolution triggers a summer rally.<\/p>\n\n<h2>BEAR SCENARIO — Hormuz Escalation<\/h2>\n\n<p><strong>Trigger:<\/strong> June 5 summit fails, Iran blocks all tankers, and naval skirmishes escalate to 48-72h blockade.<\/p>\n\n<p><strong>Market impact:<\/strong> TTF Jun-26 spikes to €55-€60/MWh (25-35% increase), Summer/Winter spread widens to +€25-€30/MWh, and storage injection pace slows to 0.30%/day as gas is diverted to immediate demand. Volatility explodes to 60-70%.<\/p>\n\n<p><strong>Concrete trade structure:<\/strong> Buy TTF Jun-26 €50 calls for €1.20/MWh. If TTF spikes to €55-€60, calls gain €3.80-€8.80 (3-7x payoff). If summit succeeds and TTF drops to €33-€37, calls expire worthless (loss €1.20). This asymmetric structure limits downside while capturing upside. For more aggressive exposure, buy TTF Jun-26 €60 calls for €0.40/MWh — 10-15x payoff if escalation is severe (TTF €70-€75).<\/p>\n\n<h2>WILD CARD SCENARIO — Summer Heat Wave<\/h2>\n\n<p><strong>Trigger:<\/strong> Late May/June heat wave in France, Germany, and Northern Italy (+3-4°C above normal, lasting 2+ weeks).<\/p>\n\n<p><strong>Probability:<\/strong> 15-20% (ECMWF gives 20% probability for above-normal temperatures in Northern Europe June).<\/p>\n\n<p><strong>Market impact:<\/strong> Cooling demand spikes, gas-for-power demand increases 8-10 GW/d, TTF Jul-26 rises to €50-€55/MWh (from current €48/MWh), and storage injection pace slows to 0.35%/day.<\/p>\n\n<p><strong>Asymmetric trade structure:<\/strong> Buy TTF Jul-26 €55 calls for €1.00/MWh and sell TTF Jul-26 €65 calls for €0.40/MWh for a net debit of €0.60/MWh. This call spread caps upside at €10 but costs only €0.60. If heat wave hits, TTF rises to €60-€65, spread is worth €5-€10 (8-16x payoff). If normal weather, loss is €0.60. Positive expectancy: (20% × €7.50) - (80% × €0.60) = €1.50 - €0.48 = +€1.02.<\/p>\n\n<h2>CATALYSTS TO WATCH (next 2 weeks)<\/h2>\n\n<ul>\n<li><strong>April 28:<\/strong> IUK interconnector maintenance ends (UK-EU gas flow resumes).<\/li>\n<li><strong>May 5:<\/strong> Kollsnes processing plant maintenance ends (Norwegian flows to UK normalize).<\/li>\n<li><strong>May 12:<\/strong> EIA weekly storage report (US injection pace).<\/li>\n<li><strong>May 15:<\/strong> GIE AGSI+ weekly storage report (EU injection pace).<\/li>\n<li><strong>May 28:<\/strong> EU Energy Council meeting (Russian LNG ban loopholes, ETS reform).<\/li>\n<li><strong>June 5:<\/strong> Iran-EU summit (Hormuz reopening negotiations).<\/li>\n<\/ul>\n\n<h2>CONVICTION MATRIX<\/h2>\n\n<p><strong>Scenario:<\/strong> Hormuz resolution<br><strong>Probability:<\/strong> 35%<br><strong>Conviction (1-5):<\/strong> 3<br><strong>Asymmetry Factor:<\/strong> 2.5x (downside capped, spread upside)<br><strong>Trade Structure:<\/strong> Buy Sep-26 / Sell Jun-26 spread<br><\/p><p><strong>Scenario:<\/strong> Status quo<br><strong>Probability:<\/strong> 30%<br><strong>Conviction (1-5):<\/strong> 4<br><strong>Asymmetry Factor:<\/strong> 1.2x (moderate move expected)<br><strong>Trade Structure:<\/strong> Buy Jun-26 €50 calls<br><\/p><p><strong>Scenario:<\/strong> Hormuz escalation<br><strong>Probability:<\/strong> 25%<br><strong>Conviction (1-5):<\/strong> 3<br><strong>Asymmetry Factor:<\/strong> 5.0x (calls cheap, upside unlimited)<br><strong>Trade Structure:<\/strong> Buy Jun-26 €60 calls<br><\/p><p><strong>Scenario:<\/strong> Summer heat wave<br><strong>Probability:<\/strong> 20%<br><strong>Conviction (1-5):<\/strong> 2<br><strong>Asymmetry Factor:<\/strong> 8.0x (call spread cheap, good upside)<br><strong>Trade Structure:<\/strong> Buy Jul-26 €55/€65 call spread<br><\/p><p><strong>Scenario:<\/strong> TurkStream sabotage<br><strong>Probability:<\/strong> 10%<br><strong>Conviction (1-5):<\/strong> 2<br><strong>Asymmetry Factor:<\/strong> 11.0x (call spread very cheap)<br><strong>Trade Structure:<\/strong> Buy Aug-26 €60/€70 call spread<br><\/p>\n\n<p><strong>Top conviction trades:<\/strong><\/p>\n<ol>\n<li>Buy Jun-26 €60 calls (0.40/MWh, 12-15x payoff if escalation) — 5.0x asymmetry<\/li>\n<li>Buy Jul-26 €55/€65 call spread (0.60/MWh, 8-16x payoff if heat wave) — 8.0x asymmetry<\/li>\n<li>Buy Sep-26 / Sell Jun-26 spread (+€18/MWh, +€7-€10 upside if resolution) — 2.5x asymmetry<\/li>\n<\/ol>\n\n<h2>POSITIONING CONTEXT<\/h2>\n\n<p>The TTF forward curve is in steep backwardation (Jun-26 €45/MWh, Winter-26 €63/MWh, Summer-27 €38/MWh), reflecting (1) near-term supply concerns (Hormuz), (2) winter demand expectations (storage refill), and (3) long-term normalization (supply diversification, renewables). This curve shape suggests the market is pricing a binary near-term outcome but expects normalization by 2027.<\/p>\n\n<p>Storage at 30.2% is ahead of 2025 (24.5%) but below 5YA (38.5%). The injection pace of 0.38%/day is slightly above the required 0.35%/day but below the 5YA 0.42%/day. If current pace continues, EU will reach 85-87% by November 1, missing the 90% mandate but meeting the 81% effective target.<\/p>\n\n<p>Net speculative positioning in TTF futures is net long 85,000 contracts (CFTC-equivalent), up from 70,000 contracts a week ago. Traders are positioning for a summer rally driven by storage refill pressure, but the net long is still below the 120,000 contract peak seen in January 2026, suggesting room for further positioning.<\/p>\n\n<h2>💡 Trade Ideas<\/h2>\n\n<p><strong>1. Volatility Compression Play:<\/strong> With TTF implied vol at 42% and the market in a holding pattern (rangebound €44-€46 since April 7), consider selling Jun-26 TTF straddles around €45 strike (collecting €2.00 premium). If the June 5 summit yields a resolution or status quo, vol collapses to 30-35% and straddles lose value. If escalation occurs, stop-loss at €50 on futures. This trade captures time decay while limiting directional exposure.<\/p>\n\n<p><strong>2. Calendar Spread Steepener:<\/strong> The Summer/Winter spread at +€18/MWh is below the historical average of +€22/MWh for this time of year. Consider buying Winter-26 / selling Summer-26 TTF spread around +€18. Target +€25-€28 as summer refill pressure builds. Stop-loss at +€10 if Hormuz resolution triggers a summer rally. This trade is directionally neutral but benefits from curve steepening.<\/p>\n\n<p><strong>3. Asymmetric Tail Protection:<\/strong> For risk-averse traders, buy a portfolio of cheap call options to protect against tail risks: Jun-26 €60 calls (0.40/MWh), Jul-26 €65 calls (0.30/MWh), Aug-26 €70 calls (0.20/MWh). Total cost: €0.90/MWh. This portfolio provides protection against escalation (Jun), heat wave (Jul), and sabotage (Aug). If no tail events occur, loss is capped at €0.90/MWh. Positive expectancy: (10% × €15) - (90% × €0.90) = €1.50 - €0.81 = +€0.69.<\/p>\n\n<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The volatility compression trade is dangerous. Selling straddles at €2.00 premium when the June 5 summit is 42 days away is picking up pennies in front of a steamroller. The time decay you capture (theta) is ~€0.05/day, but the gamma risk if TTF moves €5-€10 in one day (summit outcome) is €1.50-€3.00. You're risking 30-60 days of theta for one day of gamma. Better to be long volatility: buy the Jun-26 €40/€50 straddle for €3.50. If status quo, you're out €3.50. If escalation, you make €6-€11. The bimodal distribution (resolution €33-€37, escalation €55-€65) favors the straddle buyer.<\/div><\/div>","sig":"La Rédaction 🦊 · Gas Morning Brief"},{"t":"analysis","badge":"🎲 Scénarios","title":"7 Scénarios — Votes du Conseil","hook":"Le Conseil délibère sur 7 scénarios de marché pour les semaines à venir. Probabilités moyennes des 7 votants.","authorWord":"Du plus probable au moins probable. Bull: résolution Hormuz. Bear: escalade. Base: rangebound. Queue: canicule.","author":"Le Conseil 🎲","details":"<div class='scenario-block'>\n  <h3>S1 — Diplomatic Breakthrough on Hormuz <span class='proba'>28%<\/span><\/h3>\n  <p>Iran-EU summit June 5 yields partial reopening. TTF declines to €33-37 as fear premium deflates. Storage injection accelerates to 0.50%/day.<\/p>\n  <p class='votes'>Apex 26% · Sage 30% · Nova 27% · Blaise 28% · Lyra 27% · Dante 26% · Felix 29%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n  <h3>S2 — Prolonged Stalemate (Status Quo) <span class='proba'>25%<\/span><\/h3>\n  <p>Hormuz remains closed Day 56-90. No escalation, no resolution. TTF rangebound €44-46. Storage fill progresses normally to 85-87% by November.<\/p>\n  <p class='votes'>Apex 24% · Sage 26% · Nova 24% · Blaise 25% · Lyra 25% · Dante 26% · Felix 25%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n  <h3>S3 — Escalation to 48-72h Blockade <span class='proba'>18%<\/span><\/h3>\n  <p>Iran naval forces escalate attacks. Hormuz closure extends 48-72h. TTF spikes to €55-60. Storage injection slows to 0.30%/day. Winter premium widens +€25-30.<\/p>\n  <p class='votes'>Apex 18% · Sage 17% · Nova 19% · Blaise 17% · Lyra 18% · Dante 19% · Felix 18%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n  <h3>S4 — Russian LNG Ban Loophole Expansion <span class='proba'>12%<\/span><\/h3>\n  <p>EU Energy Council May 28 expands loopholes to 3-4 bcm/yr. Supply gap narrows. TTF declines to €40-42. Spread compression opportunities.<\/p>\n  <p class='votes'>Apex 13% · Sage 11% · Nova 12% · Blaise 13% · Lyra 11% · Dante 12% · Felix 12%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n  <h3>S5 — Summer Heat Wave (+3-4°C) <span class='proba'>10%<\/span><\/h3>\n  <p>France, Germany, Northern Italy hit by July-August canicule. Cooling demand spikes, gas-for-power burn +8-10 GW/d. Storage ends October at 82-84%.<\/p>\n  <p class='votes'>Apex 9% · Sage 11% · Nova 9% · Blaise 10% · Lyra 11% · Dante 9% · Felix 10%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n  <h3>S6 — 90-Day Prolonged Conflict <span class='proba'>5%<\/span><\/h3>\n  <p>Hormuz closed 1-3 months. 115-130 Mt LNG stranded. TTF spikes +€50-70 to €95-115. Regulatory breach likely. Extreme tail risk.<\/p>\n  <p class='votes'>Apex 6% · Sage 5% · Nova 6% · Blaise 4% · Lyra 6% · Dante 5% · Felix 4%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n  <h3>S7 — Wind Lull (Dunkelflaute) <span class='proba'>2%<\/span><\/h3>\n  <p>June North Sea wind speeds 40% below normal. Gas-for-power demand spikes +5-7 GW. TTF rises to €50-55. Storage injection disrupted.<\/p>\n  <p class='votes'>Apex 4% · Sage 2% · Nova 2% · Blaise 2% · Lyra 0% · Dante 2% · Felix 2%<\/p>\n<\/div>\n\n<p class='consensus'><strong>🎯 Consensus :<\/strong> Le Conseil converge vers un scénario de base de statu quo (25%) ou résolution diplomatique (28%). Le risque de queue (escalade + canicule) totalise 33%. Préférence pour les structures asymétriques.<\/p>\n\n<p class='dissent'><strong>🔥 Dissent :<\/strong> Dante souligne que le scénario S6 (90 jours, 5%) est sous-évalué — devrait être 8-10%. Si Hormuz tient 3 mois, c'est le chaos: storage breach, rationning, TTF €100+. Le marché ne price pas ce risque extrême.<\/p>\n","sig":"Le Conseil 🎲"},{"t":"analysis","badge":"📊 🌍 Scénario Géopolitique","title":"Géopolitique & Gaz — Délibération du Conseil","hook":"Les 7 votants du Conseil délibèrent sur les scénarios géopolitiques réels impactant le marché du gaz. Focus: Hormuz Day 56, June 5 summit, Russian LNG ban, TurkStream sabotage.","authorWord":"7 scénarios géopolitiques RÉELS basés sur les faits des 48 dernières heures. Du plus probable au moins probable.","author":"Le Conseil 🌍","details":"<div class='scenario-block'>\n  <h3>S1 — Status Quo: Hormuz Day 56+ Persists <span class='proba'>28%<\/span><\/h3>\n  <p>Fait: Strait of Hormuz fermé depuis 56 jours (24 avril). Pas de changement imminent. Iran maintient position. Impact: 115 mtpa LNG offshore, TTF maintien prime €44-46.<\/p>\n  <p class='votes'>Apex 26% · Sage 30% · Nova 27% · Blaise 28% · Lyra 27% · Dante 27% · Felix 29%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n  <h3>S2 — June 5 Diplomatic Breakthrough <span class='proba'>25%<\/span><\/h3>\n  <p>Fait: Iran-EU summit prévu 5 juin à Bruxelles. Proposition de retrait partiel en échange de sanctions allégées. Impact: réouverture partielle Hormuz, TTF €33-37.<\/p>\n  <p class='votes'>Apex 24% · Sage 26% · Nova 24% · Blaise 25% · Lyra 25% · Dante 26% · Felix 25%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n  <h3>S3 — Escalation: Naval Blockade 48-72h <span class='proba'>18%<\/span><\/h3>\n  <p>Fait: Gardes révolutionnaires iraniens menacent de détruire tanker britannique. US déploie carrier group. Impact: TTF +€15-20, volatilité 60-70%.<\/p>\n  <p class='votes'>Apex 18% · Sage 17% · Nova 19% · Blaise 17% · Lyra 18% · Dante 19% · Felix 18%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n  <h3>S4 — Russian LNG Ban Loophole Expansion <span class='proba'>12%<\/span><\/h3>\n  <p>Fait: EU Energy Council 28 mai pourrait éliminer loopholes transshipment. Si adopté: +3-4 bcm/yr supply gap. Impact: TTF Q4 €70-75.<\/p>\n  <p class='votes'>Apex 13% · Sage 11% · Nova 12% · Blaise 13% · Lyra 11% · Dante 12% · Felix 12%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n  <h3>S5 — TurkStream Sabotage <span class='proba'>10%<\/span><\/h3>\n  <p>Fait: Rapports de sabotage présumé contre TurkStream (mer Noire). Si confirmé: 42 mcm/d perdus, Hongrie/Serbie exposées. Impact: TTF +€15-20, crise régionale.<\/p>\n  <p class='votes'>Apex 11% · Sage 9% · Nova 10% · Blaise 9% · Lyra 11% · Dante 10% · Felix 10%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n  <h3>S6 — Prolonged Hormuz 30-90 Days <span class='proba'>5%<\/span><\/h3>\n  <p>Fait: QatarEnergy étend force majeure à mi-juin. Hormuz fermé 1-3 mois. Impact: 115-130 Mt LNG s   function checkDesktop(){
    if(window.innerWidth>=900){
      deck.style.display='none';
      buildDesktop();
      dtShell.style.display='';
    } else {
      if(dtShell)dtShell.style.display='none';
      deck.style.display='';
      update(false);
    }
  }
  // Keyboard nav for desktop
  document.addEventListener('keydown',e=>{
    if(window.innerWidth<900)return;
    if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();if(dtSelected<DATA.length-1)selectDesktop(dtSelected+1);}
    if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();if(dtSelected>0)selectDesktop(dtSelected-1);}
  });
  checkDesktop();window.addEventListener('resize',checkDesktop);
  // Theme toggle
  (function(){
    const btn=document.getElementById('themeToggle');
    const saved=localStorage.getItem('theme');
    if(saved==='light'){document.documentElement.classList.add('light');btn.textContent='☀️';}
    btn.addEventListener('click',()=>{
      const isLight=document.documentElement.classList.toggle('light');
      btn.textContent=isLight?'☀️':'🌙';
      localStorage.setItem('theme',isLight?'light':'dark');
    });
  })();
  </script>
</body>
</html>
