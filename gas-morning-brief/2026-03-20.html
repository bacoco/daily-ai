<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gas Morning Brief — 20 Mars 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    /* Scenario Probability Card */
    .scenario-block { margin: 1em 0; padding: 0.8em 1em; border-left: 4px solid #ffd700; border-radius: 0 8px 8px 0; background: rgba(255,215,0,0.05); }
    .scenario-block h3 { margin: 0 0 0.3em 0; font-size: 1.05em; display: flex; justify-content: space-between; align-items: center; }
    .scenario-block .proba { font-size: 1.3em; font-weight: bold; color: #ffd700; }
    .scenario-block p { margin: 0.2em 0; font-size: 0.92em; }
    .scenario-block .votes { font-size: 0.8em; opacity: 0.7; font-style: italic; }
    .consensus { margin-top: 1.2em; padding: 0.6em; border-radius: 8px; background: rgba(0,200,100,0.08); }
    .dissent { margin-top: 0.4em; padding: 0.6em; border-radius: 8px; background: rgba(255,80,80,0.08); }

    html.light .details div[style*="background"], html.light .details p[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Light mode: override inline white colors in trade cards */
    html.light .details p[style], html.light .details b[style], html.light .details span[style], html.light .details div[style] { color: rgba(0,0,0,.85) !important; }
    html.light .details div[style*="border-left:3px solid #f59e0b"] { background: rgba(245,158,11,.08) !important; }
    html.light .details div[style*="border-left:3px solid #10b981"] { background: rgba(16,185,129,.08) !important; }
    html.light .details div[style*="border-left:3px solid #ff4757"] { background: rgba(255,71,87,.06) !important; }
    html.light .details div[style*="color:#f59e0b"] { color: #b45309 !important; }
    html.light .details div[style*="color:#10b981"] { color: #047857 !important; }
    html.light .details div[style*="color:#ff4757"] { color: #dc2626 !important; }
    html.light .details h3 { color: #1a1a2e !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details p[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }
      .dt-reader .dt-r-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; }
      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }
      .dt-reader .dt-r-body p { margin-bottom: 18px; }
      .dt-reader .dt-r-body strong { color: #fff; font-weight: 600; }

  <script>
  const DATA = [{"t":"home","home":true,"date":"20 Mars 2026","henryWord":"Day 21 of the Iran-Israel war brought the unthinkable — Iranian missiles struck Ras Laffan, crippling 20% of global LNG supply and sending TTF surging 32% overnight to €82.5/MWh. With EU storage at 28.5% and the Russian LNG ban 12 days away, the refill math is now structurally broken without a ceasefire. The Council validated 12 of 20 trade ideas, eliminating 8 duplicates and contradictions; the TTF Sum-26/Win-26 spread and Win-26 outright long remain highest conviction.","articles":[{"badge":"⚡ 💰 Price Action","title":"Gas Markets Spike on Ras Laffan Disruption — TTF Surges 32% Overnight","idx":1},{"badge":"⚡ 🚢 LNG & Flows","title":"Qatar Strikes Again — TTF Surges Past €74 as Arbitrage Window Blows Wide Open","idx":2},{"badge":"⚡ ⚡ Power & Carbon","title":"Marginal Economics: Gas Holds the Line","idx":3},{"badge":"📊 🌡️ Weather & Demand","title":"Structural Shift: Late-Season Volatility vs. Solar Injection","idx":4},{"badge":"📊 📦 Storage Watch","title":"EU Storage Sinks to 28.5% — Refill Math Now Demands Record 72 bcm Injection","idx":5},{"badge":"📊 💣 Geopolitics & Regulation","title":"Day 21: Hormuz Closed, Ras Laffan Crippled, EU LNG Ban in 12 Days — The Triple Structural Shock","idx":6},{"badge":"📊 🎯 Risk Flags & Outlook","title":"Three-Front War Enters Week 4: Ras Laffan Damage × 28.5% Storage × April LNG Ban","idx":7},{"badge":"🎲 Scénarios","title":"7 Market Scenarios — Council Probability Vote","idx":8},{"badge":"📊 🌍 Scénario Géopolitique","title":"7 Geopolitical Scenarios — Council Deliberation","idx":9},{"badge":"🏛️ Verdict du Conseil","title":"20 Trades Audités — 12 Retenus, 8 Éliminés","idx":10}],"disclaimer":"⚠️ AVERTISSEMENT — Ce document est un exercice expérimental de veille automatisée produit par intelligence artificielle. Il ne constitue EN AUCUN CAS un conseil en investissement, une recommandation de trading, ni une analyse financière réglementée au sens de la directive MiFID II ou du Code monétaire et financier (art. L541-1). Les « scénarios de marché » présentés sont des hypothèses pédagogiques générées par des modèles de langage — ils ne reflètent pas l'avis d'un professionnel agréé. Les données proviennent de sources publiques, potentiellement retardées ou erronées. Toute décision d'investissement prise sur la base de ce document relève de la seule responsabilité du lecteur. L'auteur n'est pas enregistré comme Conseiller en Investissement Financier (CIF) auprès de l'AMF. Ce contenu est fourni à titre informatif et expérimental uniquement."},{"t":"alert","badge":"⚡ 💰 Price Action","title":"Gas Markets Spike on Ras Laffan Disruption — TTF Surges 32% Overnight","hook":"Iranian missile strike on Qatar's Ras Laffan LNG hub sparked panic across global gas markets. TTF's 32% overnight surge to €82.5/MWh marks the sharpest single-day move since 2022.","authorWord":"Ras Laffan damage +20% of global LNG supply = upside risk not priced in. Watch for supply reassessment.","author":"Blaise 🧮","details":"<h3>📊 Spot Prices — Sharp Overnight Spike<\/h3>\n\n<p><strong>TTF day-ahead settlement<\/strong>: Spiked to approximately <strong>€82.5/MWh<\/strong> (up 32% overnight from ~€57.7/MWh) after Iranian missiles damaged Ras Laffan, Qatar's massive LNG export hub accounting for ~20% of global supply. This marks the most aggressive daily move since the 2022 energy crisis. <a href=\"https://www.aga.org/research-policy/resource-library/natural-gas-market-indicators-march-19-2026/\" target=\"_blank\">Source: AGA<\/a><\/p>\n\n<p><strong>Henry Hub spot<\/strong>: Modestly higher at <strong>$3.07/MMBtu<\/strong> (April 2026 contract), up approximately $0.20 from Wednesday's close (~7%). The US market remains insulated by strong domestic production and storage above the five-year average. <a href=\"https://www.aga.org/research-policy/resource-library/natural-gas-market-indicators-march-19-2026/\" target=\"_blank\">Source: AGA<\/a><\/p>\n\n<p><strong>NBP (UK)<\/strong>: Surged <strong>12.15% in 24 hours<\/strong> to <strong>156.64 GBp/therm<\/strong>. The UK market is tracking European sentiment, with open interest at 53.01K contracts — positioning data suggests traders are reopening longs. <a href=\"https://www.tradingview.com/symbols/ICEEUR-GWM1!/\" target=\"_blank\">Source: TradingView<\/a><\/p>\n\n<p><strong>JKM (Asia)<\/strong>: Jumped <strong>nearly 25%<\/strong> to roughly $23-24/MMBtu. Asian buyers are aggressively bidding for spot cargo amid supply concerns. <a href=\"https://www.canadalnggroup.com/natural-gas-prices-weekly-update-jkm-ttf-and-henry-hub-16-march-2026\" target=\"_blank\">Source: Canada LNG Group<\/a><\/p>\n\n<h3>📈 Key Levels & Positioning<\/h3>\n\n<p><strong>TTF resistance:<\/strong> €85/MWh (psychological), €90 (2022 crisis echo). <strong>Support:<\/strong> €70 (pre-spike gap), €57.7 (Wednesday close). <strong>HH:<\/strong> resistance $3.20, support $2.85.<\/p>\n\n<p>NBP open interest at 53.01K contracts shows traders re-entering longs. HH positioning remains elevated at ~1.7M OI — deep liquidity supports the view that US markets are structurally oversupplied relative to global turmoil.<\/p>\n\n<h3>💡 Trade Ideas<\/h3>\n\n<p><strong>T1 — TTF Apr/May calendar spread:<\/strong> If Ras Laffan damage is confirmed severe (multi-week outage), the prompt contract should outperform deferred. Buy TTF Apr vs sell May at current ~€8 backwardation, target €15. Stop at €4.<\/p>\n\n<p><strong>T2 — Long JKM-TTF spread:<\/strong> Asian panic-bidding widens the arb. Buy JKM Apr vs sell TTF Apr at current ~$2/MMBtu, target $5 as cargoes divert east. Risk: rapid ceasefire collapses both.<\/p>\n\n<p><strong>T3 — HH Apr $3.50 calls:<\/strong> Cheap tail hedge if US LNG export demand spikes to fill global gap. Premium ~$0.05/MMBtu, asymmetric 10:1 if HH catches up to global repricing.<\/p>\n\n<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The 32% TTF spike may be an overreaction. Qatar has repeatedly shown ability to restore LNG operations within 48-72h of disruptions. The market is pricing worst-case permanent damage, but satellite imagery suggests terminal infrastructure remains largely intact. Fading the spike via TTF Apr puts at €70 strike may offer better risk/reward than chasing the rally.<\/div><\/div>","sig":"Blaise 🧮"},{"t":"alert","badge":"⚡ 🚢 LNG & Flows","title":"Qatar Strikes Again — TTF Surges Past €74 as Arbitrage Window Blows Wide Open","hook":"Iran's second attack on Ras Laffan sends global LNG markets into panic. TTF-JKM spreads invert as Europe and Asia battle for the same shrinking pool of cargoes.","authorWord":"This is a supply shock of historic proportions. The arbitrage window is now a gateway — trade it while it lasts.","author":"Henry 🦉","details":"<h3>📊 Key Spread Snapshot<\/h3>\n<ul>\n<li><strong>TTF:<\/strong> €61-74/MWh — surged 30-35% in 48h to ~$24.19/MMBtu (<a href=\"https://www.cnbc.com/2026/03/19/oil-jumps-iran-strikes-qatar-lng-facility-supply-worries.html\" target=\"_blank\">CNBC<\/a>)<\/li>\n<li><strong>Henry Hub:<\/strong> $3.21/MMBtu — decoupled dramatically from European benchmarks<\/li>\n<li><strong>JKM:<\/strong> High-18s to high-20s $/MMBtu<\/li>\n<li><strong>TTF-HH Spread:<\/strong> ~$21/MMBtu — historic arbitrage opportunity<\/li>\n<li><strong>TTF-JKM Spread:<\/strong> TTF now tracking AT or ABOVE JKM — unprecedented inversion signals European desperation<\/li>\n<\/ul>\n\n<h3>🚢 EU LNG Arrivals<\/h3>\n<ul>\n<li><strong>Zeebrugge (Belgium):<\/strong> Qatar offloaded FIVE LNG slots for April — major entry point for Qatari gas to NW Europe now seeing supply erosion (<a href=\"https://www.lngglobal.com/crisis-memo-ras-laffan-industrial-city/\" target=\"_blank\">LNG Global<\/a>)<\/li>\n<li><strong>Overall arrivals:<\/strong> 8 cargoes (~0.56 Mt) in first 10 days of March, down ~15% vs February<\/li>\n<li><strong>Sendout rates:<\/strong> Constrained by cargo availability, not terminal capacity<\/li>\n<\/ul>\n\n<h3>🇺🇸 US LNG Export Loadings<\/h3>\n<ul>\n<li><strong>Utilization:<\/strong> 35-37 cargoes/week at current rates (<a href=\"https://www.spglobal.com/energy/en/news-research/latest-news/natural-gas/031826-europe-faces-summer-gas-crunch-with-low-stocks-and-supply-woes\" target=\"_blank\">S&P Global<\/a>)<\/li>\n<li><strong>Market position:<\/strong> US is now Europe's largest LNG supplier — but cannot fully offset Qatar losses (<a href=\"https://www.cnn.com/2026/03/19/business/liquefied-natural-gas-prices-iran-war-intl\" target=\"_blank\">CNN<\/a>)<\/li>\n<li><strong>Cheniere/Freeport:<\/strong> Running near capacity; no maintenance outages reported this week<\/li>\n<\/ul>\n\n<h3>🔀 Pipeline Flows<\/h3>\n<ul>\n<li><strong>Norwegian (Langeled/Europipe):<\/strong> Flows stable, no major nomination changes<\/li>\n<li><strong>North African (Medgaz/Transmed):<\/strong> No significant disruptions. Algerian pipeline gas remains reliable<\/li>\n<\/ul>\n\n<h3>💡 Trade Ideas<\/h3>\n<p><strong>T4 — Long TTF-HH spread:<\/strong> At $21/MMBtu, the transatlantic arb is at crisis-era levels. Buy TTF Apr / sell HH Apr. Target $25 if Qatar outage extends. Stop at $17.<\/p>\n<p><strong>T5 — Short JKM-TTF:<\/strong> The inversion is unsustainable if EU pipeline flows hold. Sell JKM Apr vs buy TTF Apr at -$1, target +$3 reversion. Risk: further Asian panic bids.<\/p>\n<p><strong>T6 — Long US LNG exporters equity basket:<\/strong> Cheniere, Venture Global benefit from maximum utilization + record netbacks. 6-month horizon.<\/p>\n\n<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>The $21/MMBtu TTF-HH spread assumes Qatar stays offline for weeks. But Ras Laffan has modular trains — even partial restart of 2-3 trains would flood 5-8 Mt/yr back into the market. The arb will compress faster than consensus expects. Fading the TTF-HH spread from $21 with a 3-week horizon offers better risk/reward than chasing it wider.<\/div><\/div>","sig":"Henry 🦉"},{"t":"tech","badge":"⚡ ⚡ Power & Carbon","title":"Marginal Economics: Gas Holds the Line","hook":"Spark spreads tighten as carbon prices consolidate, keeping gas-fired generation as the marginal price setter. Traders face a narrow window of opportunity with shifting renewable output across the North Sea.","authorWord":"The tight coupling of power prices to the carbon curve signals a defensive market stance, prioritizing baseline stability over speculative growth as we head into the shoulder season.","author":"Sage 🦎","details":"<h3>Market Snapshot<\/h3>\n<ul>\n<li><strong>Spreads:<\/strong> Gas-to-power (Spark) remains marginally more attractive than coal-to-power (Dark) in the DA auction, as carbon prices hover near €78.50/t (-0.6% d/d). Regulatory focus remains on the upcoming MSR adjustment review.<\/li>\n<li><strong>Spot Prices:<\/strong> Baseload DA cleared at €68/MWh (DE), €65/MWh (FR), and £72/MWh (UK), reflecting continued regional variance in demand.<\/li>\n<li><strong>Supply Disruption:<\/strong> Unscheduled maintenance at the <a href=\"https://www.rte-france.com/en/data-publications/eco2mix\" target=\"_blank\">Gravelines nuclear site<\/a> has tightened the French margin, increasing reliance on cross-border gas-for-power imports.<\/li>\n<li><strong>Renewables:<\/strong> Wind generation is currently tracking 15% below the day-ahead forecast, creating a sharp intraday price spike risk for this evening. Data via <a href=\"https://transparency.entsoe.eu/\" target=\"_blank\">ENTSO-E Transparency Platform<\/a>.<\/li>\n<\/ul>\n\n<h3>💡 Trade Ideas<\/h3>\n<ol>\n<li><strong>Bull Call Spread (Dec26 EUA):<\/strong> Capitalize on potential regulatory tightening by entering a 80/90 bull call spread to limit downside while capturing upside volatility.<\/li>\n<li><strong>Long DA DE Power vs Short FR:<\/strong> Exploit the regional tight supply in France versus the German renewable output delta.<\/li>\n<li><strong>Spark Spread Compression:<\/strong> Short the Spark Spread to hedge against potential unexpected thermal plant availability.<\/li>\n<\/ol>\n\n<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>The current price environment ignores the fundamental tailwind of record-high storage levels. Expect a mean reversion in the Spark Spread as demand cools faster than anticipated, favoring a short-power bias for Q2.<\/div><\/div>","sig":"Sage 🦎"},{"t":"analysis","badge":"📊 🌡️ Weather & Demand","title":"Structural Shift: Late-Season Volatility vs. Solar Injection","hook":"As March enters its final phase, we are seeing a decoupling of heating demand from seasonal expectations, driven by a structural shift in Atlantic oscillation patterns—increasing the risk of 'cold tail' events even as daylight gains dominance.","authorWord":"Market participants are discounting the tail risk of late-March cold snaps, positioning for an early transition to storage injection mode. Don't be fooled by the calendar; the atmospheric energy remains volatile.","author":"Sage 🦎","details":"<p><strong>Extended Range (Week 2-4):<\/strong> The <a href='https://www.ecmwf.int/en/forecasts/about-our-forecasts/sub-seasonal-range-forecasts'>ECMWF sub-seasonal guidance<\/a> suggests a high-pressure ridge over the North Atlantic, promoting intermittent 'cold-drop' episodes across North-Western Europe. Expect temperature anomalies to oscillate ±2.5°C from seasonal norms, delaying the true spring heating-load collapse.<\/p><p><strong>HDD/CDD Trajectory:<\/strong> Cumulative HDDs remain ~8% above the 5-year average through mid-March. Despite a mild February, the persistence of chilly mornings is keeping storage withdrawal cycles alive longer than anticipated.<\/p><p><strong>Seasonal Demand Outlook:<\/strong> Industrial demand remains tethered to gas-price elasticities, which are currently testing support levels. Residential heating is in its final structural decline phase, but sensitive to the 'March-April gap' risk.<\/p><p><strong>Hydro & Wind:<\/strong> <a href='https://www.entsoe.eu/'>Hydro reservoir levels<\/a> in Scandinavia remain comfortably aligned with the 5-year median, providing a strong floor for regional power stability. Meanwhile, current wind capacity factors are outperforming expectations for late-March, creating intermittent but significant baseload pressure.<\/p><h3>💡 Trade Ideas<\/h3><ul><li><strong>T10 — TTF April-May spread:<\/strong> Long the spread to capture potential weather-driven volatility in storage withdrawal exhaustion. Enter at current level, target €3-4 widening on cold snap.<\/li><li><strong>T11 — Long-dated gas put options:<\/strong> Hedge against sudden wind dunkelflaute risks during the final heating push. TTF May €75 puts at ~€3 premium.<\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>Sage is ignoring the massive build-up in inventory velocity. Demand elasticity is broken, and structural storage levels are already approaching pre-crisis averages. The cold tail is a narrative trap — sell the volatility.<\/div><\/div>","sig":"Sage 🦎"},{"t":"tech","badge":"📊 📦 Storage Watch","title":"EU Storage Sinks to 28.5% — Refill Math Now Demands Record 72 bcm Injection","hook":"EU storage drops below 29% for the first time since the 2022 crisis, with Gazprom declaring summer injection 'unprofitable'. US inventories provide cold comfort as the transatlantic storage gap widens.","authorWord":"The refill math is brutal: 72 bcm in 7 months from a 28.5% base requires 10.3 bcm/month — 40% above the 5-year average injection pace.","author":"Blaise 🧮","details":"<h3>🇪🇺 EU Storage: Crisis-Era Lows Deepen<\/h3>\n\n<p><strong>Current Status (March 20, 2026):<\/strong> EU storage at approximately <strong>28.5% full<\/strong>, representing roughly <strong>27 bcm<\/strong> of gas in stock out of ~95 bcm capacity. This is the lowest mid-March reading since the 2022 energy crisis. <a href=\"https://agsi.gie.eu/\" target=\"_blank\">GIE AGSI+<\/a><\/p>\n\n<p><strong>Top Countries:<\/strong><\/p>\n<ul>\n<li><strong>Germany:<\/strong> ~24% full (largest storage, most exposed)<\/li>\n<li><strong>Italy:<\/strong> ~31% (benefiting from Algerian pipeline flows)<\/li>\n<li><strong>Netherlands:<\/strong> ~22% (Bergermeer critically low)<\/li>\n<li><strong>France:<\/strong> ~29%<\/li>\n<li><strong>Austria:<\/strong> ~19% (most depleted, former Russian gas dependency)<\/li>\n<\/ul>\n\n<p><strong>Refill Challenge:<\/strong> To reach the <strong>90% target by November 1<\/strong> (EU Regulation 2022/1032), Europe needs to inject ~<strong>72 bcm in ~7 months<\/strong> (April-October). That's <strong>10.3 bcm/month<\/strong> — roughly <strong>40% above the 5-year average<\/strong> injection pace of 7.3 bcm/month. With Qatar offline and Hormuz disrupted, sourcing these molecules is the central challenge of 2026.<\/p>\n\n<p><strong>Days of Supply:<\/strong> At current late-winter demand rates (~1.8 bcm/day), remaining storage provides <strong>~15 days of supply<\/strong> — thin by any historical standard.<\/p>\n\n<p><strong>YoY Comparison:<\/strong> Significantly <strong>worse than March 2025<\/strong> (~34% at this date) and approaching March 2022 crisis levels (~26%). The 5.5pp deficit vs last year represents ~5 bcm less cushion.<\/p>\n\n<h3>🇺🇸 US Storage: Comfortable but Diverging<\/h3>\n\n<p><strong>Latest EIA (week ending March 14):<\/strong> Working gas at <strong>1,725 Bcf<\/strong>, roughly <strong>5% above 5-year average<\/strong>. Net withdrawal of 48 Bcf last week, in line with seasonal norms. <a href=\"https://www.eia.gov/naturalgas/storage/\" target=\"_blank\">EIA Weekly<\/a><\/p>\n\n<p>The US-EU storage divergence is stark: US enters injection season with comfort, EU with crisis. This gap is what's driving the record $21/MMBtu TTF-HH spread.<\/p>\n\n<h3>💡 Trade Ideas<\/h3>\n<p><strong>T7 — Long TTF Summer-26/Winter-26 calendar spread:<\/strong> If refill pace disappoints, the Summer-Winter spread will widen sharply. Enter at current ~€8/MWh contango, target €15. Stop at €5.<\/p>\n<p><strong>T8 — Long TTF Oct-26 outright:<\/strong> October is the last month before the 90% target deadline. If storage trajectory falls behind, Oct futures will be bid hard. Target €85+.<\/p>\n<p><strong>T9 — Short HH/Long TTF basis:<\/strong> Reinforces the T4 trade from a storage-fundamentals angle. The US surplus vs EU deficit will keep this spread elevated.<\/p>\n\n<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The 90% target may be politically adjusted. With 10 EU countries demanding ETS reform at the March 19 summit, a quiet regulatory easing of the November 1 deadline to December 1 (already in the 2025-27 flexibility window) would reduce the urgency premium. Don't overweight the 72 bcm injection math — the target itself may move.<\/div><\/div>","sig":"Blaise 🧮"},{"t":"alert","badge":"📊 💣 Geopolitics & Regulation","title":"Day 21: Hormuz Closed, Ras Laffan Crippled, EU LNG Ban in 12 Days — The Triple Structural Shock","hook":"Three structural forces converging simultaneously: Hormuz blockade enters week 4, Qatar's LNG crown jewel offline, and the EU Russian LNG ban drops April 1. This is not a cyclical disruption — it's a regime change.","authorWord":"We're not trading supply-demand curves anymore. We're trading the end of an energy order. The Iran-Israel war has escalated beyond containment.","author":"Henry 🦉","details":"<h3>🇷🇺 Russia Pipeline Flows: TurkStream Stands Alone<\/h3>\n\n<p><strong>Pre-war baseline:<\/strong> 175-180 bcm/year (2018-2019 peak). Nord Stream 1 (55 bcm), Yamal (33 bcm), TurkStream (31 bcm capacity).<\/p>\n<p><strong>Current (March 2026):<\/strong> TurkStream now the <strong>sole route<\/strong> — ~15-16 bcm/year, down 90% from pre-war. Flows unchanged vs pre-war TurkStream capacity but represent <strong>all that's left<\/strong>. Hungary, Serbia, Austria most exposed. <a href=\"https://perconcordiam.com/energy-decoupling-is-in-the-pipeline/\" target=\"_blank\">Source<\/a><\/p>\n\n<h3>🚢 Hormuz: The Choked Artery (Day 20+)<\/h3>\n\n<p><strong>80 Mt/year<\/strong> of LNG transited Hormuz pre-crisis. <strong>15 million bpd<\/strong> of oil (20% global) blocked. Europe exposure: 12-14% of LNG imports from Gulf via Hormuz. <a href=\"https://www.cnbc.com/2026/03/02/strait-of-hormuz-crisis-us-iran-israel-war-shipping-trade-oil.html\" target=\"_blank\">CNBC<\/a><\/p>\n<p>Effectively shut 20+ days since March 1. Backlog of 40+ tankers on both sides; minimum 2 weeks to clear even if reopened. US destroyed 16 Iranian minelaying warships.<\/p>\n\n<h3>📋 Hormuz Scenario Matrix<\/h3>\n\n<p><strong>Scenario:<\/strong> Ceasefire + rapid reopening<br><strong>Duration:<\/strong> 1-2 weeks<br><strong>Prob:<\/strong> 10%<br><strong>LNG Stranded:<\/strong> 2-3 Mt<br><strong>EU Supply Gap:<\/strong> 50 GWh/d<br><strong>TTF Impact:<\/strong> €45-55<br><strong>Trade:<\/strong> Buy TTF puts €60<br><\/p><p><strong>Scenario:<\/strong> Selective passage (current)<br><strong>Duration:<\/strong> 1-3 months<br><strong>Prob:<\/strong> 40%<br><strong>LNG Stranded:<\/strong> 15-20 Mt<br><strong>EU Supply Gap:<\/strong> 200 GWh/d<br><strong>TTF Impact:<\/strong> €70-85<br><strong>Trade:<\/strong> Long TTF Win-26<br><\/p><p><strong>Scenario:<\/strong> Full blockade + escalation<br><strong>Duration:<\/strong> 3-6 months<br><strong>Prob:<\/strong> 35%<br><strong>LNG Stranded:<\/strong> 40+ Mt<br><strong>EU Supply Gap:<\/strong> 400 GWh/d<br><strong>TTF Impact:<\/strong> €90-120<br><strong>Trade:<\/strong> TTF €100 calls<br><\/p><p><strong>Scenario:<\/strong> Regional war + infrastructure destruction<br><strong>Duration:<\/strong> 6-12 months<br><strong>Prob:<\/strong> 15%<br><strong>LNG Stranded:<\/strong> 60+ Mt<br><strong>EU Supply Gap:<\/strong> 600 GWh/d<br><strong>TTF Impact:<\/strong> €120-180<br><strong>Trade:<\/strong> TTF Win-26/Sum-27 spread<br><\/p>\n\n<h3>⚖️ EU Sanctions & LNG Ban<\/h3>\n\n<p><strong>April 1, 2026:<\/strong> Ban on Russian LNG imports enters force. Spot-market Russian LNG prohibited. Existing long-term contracts transition: short-term until June 17, 2026; long-term until January 1, 2027. Pipeline gas to be phased out by September 30, 2027. <a href=\"https://www.europeangashub.com/eu-lng-ban\" target=\"_blank\">European Gas Hub<\/a><\/p>\n\n<h3>📅 Political Calendar<\/h3>\n<ul>\n<li><strong>March 19 (yesterday):<\/strong> EU summit on ETS reform — 10 countries demanded carbon cost relief<\/li>\n<li><strong>April 1:<\/strong> EU Russian LNG ban effective<\/li>\n<li><strong>June 17:<\/strong> Short-term Russian LNG contract deadline<\/li>\n<li><strong>July:<\/strong> MSR adjustment review expected<\/li>\n<\/ul>\n\n<h3>💡 Trade Ideas<\/h3>\n<p><strong>T12 — Long TTF Win-26 outright:<\/strong> If Hormuz stays closed through summer, winter prices must reflect panic refill + depleted storage. Target €100+. Stop at €65.<\/p>\n<p><strong>T13 — Long TTF/Short HH basis:<\/strong> The structural divergence (EU under siege, US self-sufficient) widens. Enter at $21/MMBtu, target $30.<\/p>\n<p><strong>T14 — TTF Apr €90/€110 call spread:<\/strong> Cheap way to play the full-blockade scenario (35% prob). Premium ~€4, max payout €20. 5:1 risk/reward.<\/p>\n\n<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>The scenario matrix overweights escalation. History shows Hormuz closures are measured in days, not months — even during the Iran-Iraq Tanker War (1984-88), actual full closures lasted hours to days. The insurance market is pricing 3-month duration but the military reality is that the US Navy can clear the strait in 48-72h once political will materializes. The April LNG ban may be quietly delayed as Brussels realizes the timing is catastrophic.<\/div><\/div>","sig":"Henry 🦉"},{"t":"strategy","badge":"📊 🎯 Risk Flags & Outlook","title":"Three-Front War Enters Week 4: Ras Laffan Damage × 28.5% Storage × April LNG Ban","hook":"The Ras Laffan strike has transformed a crisis of duration into a crisis of capacity. With EU storage at 28.5% and the Russian LNG ban 12 days away, the refill math is now structurally broken without a ceasefire.","authorWord":"Conviction: the risk is asymmetric to the upside. Ceasefire probability low (<15%), damage duration high. Position accordingly.","author":"La Rédaction 🦊","details":"<h3>🔴 TOP 3 RISKS (Probability × Impact)<\/h3>\n\n<ol>\n<li><strong>Ras Laffan extended outage (70% × Extreme):<\/strong> If damage to Qatar's LNG trains requires 3-6 months of repair, 80 Mt/yr of LNG capacity stays offline. This alone removes ~20% of global LNG supply. TTF impact: sustained €80-120/MWh through summer.<\/li>\n<li><strong>EU storage target miss (60% × High):<\/strong> At 28.5% with 72 bcm to inject in 7 months, any refill pace below 10 bcm/month means Europe enters Winter-26 structurally short. Political panic triggers demand rationing or regulatory easing.<\/li>\n<li><strong>April 1 LNG ban timing collision (55% × High):<\/strong> The EU banning Russian LNG spot imports exactly when Qatar supply is offline creates a double supply squeeze. Even a 2-month delay in enforcement would relieve ~5 bcm of pressure.<\/li>\n<\/ol>\n\n<h3>📈 BULL SCENARIO: Hormuz Escalation + Summer Refill Panic<\/h3>\n<p>If Hormuz remains closed through April and Ras Laffan repairs take 3+ months, Europe faces a genuine supply emergency. TTF could reach <strong>€100-120/MWh<\/strong> by June as injection season starts from historic lows. <strong>Trade: Long TTF Q3-26 at current ~€78, target €100. Stop at €65.<\/strong><\/p>\n\n<h3>📉 BEAR SCENARIO: Ceasefire Snap-Back<\/h3>\n<p>A surprise ceasefire (diplomatic breakthrough or military exhaustion) would trigger a violent unwind. TTF could crash 30-40% in days to €50-55 as the war premium evaporates. Qatar restart would further accelerate the decline. <strong>Trade: TTF Apr €60 puts at ~€2 premium. Asymmetric insurance: max loss €2, potential gain €15-20 on a ceasefire.<\/strong><\/p>\n\n<h3>🃏 WILD CARD: TurkStream Sabotage<\/h3>\n<p>With TurkStream as Europe's last Russian pipeline (15-16 bcm/yr), any sabotage or Turkish policy shift would eliminate the final pipeline corridor. Low probability (10%) but catastrophic — TTF could gap to €150+. <strong>Trade: Deep OTM TTF Win-26 €120 calls at ~€5. 20:1 payout on tail event.<\/strong><\/p>\n\n<h3>📅 CATALYSTS THIS WEEK<\/h3>\n<ul>\n<li><strong>March 20 (today):<\/strong> EU summit follow-up — ETS reform statement expected<\/li>\n<li><strong>March 21:<\/strong> EIA weekly storage report — first post-Ras Laffan data<\/li>\n<li><strong>March 22-23:<\/strong> Weekend risk — military escalation window<\/li>\n<li><strong>March 24:<\/strong> AGSI+ weekly update — EU storage trajectory confirmation<\/li>\n<li><strong>April 1:<\/strong> EU Russian LNG ban effective — countdown at 12 days<\/li>\n<\/ul>\n\n<h3>🎯 CONVICTION MATRIX<\/h3>\n<p><strong>Trade:<\/strong> Long TTF Win-26<br><strong>Probability:<\/strong> 55%<br><strong>Payout:<\/strong> 2-3x<br><strong>Conviction:<\/strong> ⭐⭐⭐⭐⭐ Highest<br><\/p><p><strong>Trade:<\/strong> TTF €90/€110 call spread<br><strong>Probability:<\/strong> 35%<br><strong>Payout:<\/strong> 5x<br><strong>Conviction:<\/strong> ⭐⭐⭐⭐ High<br><\/p><p><strong>Trade:<\/strong> Long JKM-TTF spread<br><strong>Probability:<\/strong> 45%<br><strong>Payout:<\/strong> 2x<br><strong>Conviction:<\/strong> ⭐⭐⭐⭐ High<br><\/p><p><strong>Trade:<\/strong> TTF Apr €60 puts (ceasefire hedge)<br><strong>Probability:<\/strong> 15%<br><strong>Payout:<\/strong> 8-10x<br><strong>Conviction:<\/strong> ⭐⭐⭐ Essential insurance<br><\/p><p><strong>Trade:<\/strong> TTF Win-26 €120 calls (tail)<br><strong>Probability:<\/strong> 10%<br><strong>Payout:<\/strong> 20x<br><strong>Conviction:<\/strong> ⭐⭐ Lottery ticket<br><\/p>\n\n<h3>📐 POSITIONING CONTEXT<\/h3>\n<p>The curve is in steep backwardation (prompt premium from supply panic), storage at 2022-crisis levels, and weather transitioning to shoulder season. Sentiment is overwhelmingly bearish on supply, bullish on price. The risk is that consensus is correct — this is genuinely different from past Hormuz scares because physical infrastructure (Ras Laffan) has been damaged.<\/p>\n\n<h3>💡 Trade Ideas<\/h3>\n<p><strong>T15 — TTF Summer-26 straddle at €80:<\/strong> Volatility is the only certainty. Whether ceasefire or escalation, the move will be violent. Premium ~€12, breakeven at €68 or €92.<\/p>\n<p><strong>T16 — Long NBP-TTF basis:<\/strong> UK's 1.5-day storage and LNG dependency makes it the most exposed European market. NBP should trade at a premium to TTF if cargo diversions continue.<\/p>\n<p><strong>T17 — Short HH Apr $3.50 calls (fund the TTF longs):<\/strong> HH is structurally capped by US production growth. Use HH call premium to partially fund TTF upside positions.<\/p>\n\n<div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The consensus is too certain about sustained high prices. Every major energy shock in history has seen a faster-than-expected resolution: the 1973 embargo lasted 5 months, the 1990 Kuwait invasion saw prices normalize in 6 months. Markets are pricing permanent disruption but geopolitics moves in discontinuous jumps. The ceasefire put is not just insurance — it may be the highest expected-value trade on the board.<\/div><\/div>","sig":"La Rédaction 🦊"},{"t":"analysis","badge":"🎲 Scénarios","title":"7 Market Scenarios — Council Probability Vote","hook":"The Council weighs 7 scenarios for gas markets over the next 1-4 weeks. The Hormuz blockade continuation commands the highest probability, but the refill season crunch is the sleeper risk.","authorWord":"Le Conseil 🎲","author":"Le Conseil 🎲","details":"<div class='scenario-block'>\n<h3>S1 — TTF Consolidates €70-85 Range (Blockade Persists) <span class='proba'>30%<\/span><\/h3>\n<p>Hormuz blockade continues. Qatar offline. TTF finds a new equilibrium between supply panic and demand destruction. Calendar spreads steepen. Trade: Long Sum-26/Win-26 spread.<\/p>\n<p class='votes'>Apex 32% · Sage 28% · Nova 30% · Blaise 27% · Lyra 35% · Dante 25% · Felix 33%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n<h3>S2 — Refill Panic Drives TTF Above €90 <span class='proba'>22%<\/span><\/h3>\n<p>As April injection season begins from 28.5% storage, the math becomes undeniable: 72 bcm needed in 7 months without Qatar LNG. Political pressure mounts. TTF breaks €90 on storage anxiety. Trade: Long TTF Oct-26.<\/p>\n<p class='votes'>Apex 20% · Sage 25% · Nova 22% · Blaise 28% · Lyra 18% · Dante 20% · Felix 21%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n<h3>S3 — EU Blinks: LNG Ban Delayed, ETS Eased <span class='proba'>18%<\/span><\/h3>\n<p>Political reality overrides climate ambition. Brussels delays Russian LNG ban, eases ETS auction schedule. Relieves 5-8 bcm pressure. TTF drops to €60-70 but structural deficit remains. Trade: Short TTF prompt, long deferred.<\/p>\n<p class='votes'>Apex 15% · Sage 20% · Nova 18% · Blaise 22% · Lyra 12% · Dante 20% · Felix 19%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n<h3>S4 — Ceasefire Rally: TTF Crashes 30%+ <span class='proba'>10%<\/span><\/h3>\n<p>Surprise diplomatic breakthrough. TTF flash-crashes to €50-55 as war premium evaporates. Qatar restart timeline becomes the next focal point. Trade: TTF Apr €60 puts as insurance.<\/p>\n<p class='votes'>Apex 10% · Sage 12% · Nova 8% · Blaise 10% · Lyra 8% · Dante 15% · Felix 7%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n<h3>S5 — Escalation: Additional Infrastructure Targeted <span class='proba'>10%<\/span><\/h3>\n<p>War expands: TurkStream, Saudi facilities, or Suez transit targeted. Global LNG supply permanently reduced. TTF spikes above €120. Trade: Deep OTM TTF Win-26 calls.<\/p>\n<p class='votes'>Apex 10% · Sage 5% · Nova 12% · Blaise 5% · Lyra 12% · Dante 8% · Felix 8%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n<h3>S6 — Demand Destruction Caps Prices Below €80 <span class='proba'>7%<\/span><\/h3>\n<p>At €80+ TTF, industrial demand destruction accelerates. Shoulder season reduces heating load. Prices self-correct as demand adjusts. Trade: Short TTF Apr, target €70.<\/p>\n<p class='votes'>Apex 8% · Sage 7% · Nova 5% · Blaise 5% · Lyra 10% · Dante 7% · Felix 8%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n<h3>S7 — EXTREME: 2022 Crisis Redux — TTF Touches €150+ <span class='proba'>3%<\/span><\/h3>\n<p>Perfect storm: Hormuz stays closed, TurkStream sabotaged, cold April snap, storage cannot inject. EU triggers emergency rationing. TTF reprices above €150/MWh for first time since August 2022. Trade: TTF €120/€150 call spread for pennies.<\/p>\n<p class='votes'>Apex 5% · Sage 3% · Nova 5% · Blaise 3% · Lyra 5% · Dante 5% · Felix 4%<\/p>\n<\/div>\n\n<p class='consensus'><strong>🎯 Consensus:<\/strong> The Council's central case (S1+S2 = 52%) is that the blockade persists and refill anxiety builds through Q2. The asymmetry favors upside — 52% probability of sustained high prices vs 10% ceasefire crash risk.<\/p>\n\n<p class='dissent'><strong>🔥 Dissent:<\/strong> Dante argues ceasefire probability is underweighted. Felix counters that even with ceasefire, Ras Laffan repair timeline (3-6 months) means the structural supply deficit persists regardless of geopolitics.<\/p>","sig":"Le Conseil 🎲"},{"t":"analysis","badge":"📊 🌍 Scénario Géopolitique","title":"7 Geopolitical Scenarios — Council Deliberation","hook":"Day 21 of the Iran-Israel war has shattered every pre-crisis assumption. The Council identifies 7 real-world scenarios reshaping the global gas map.","authorWord":"Le Conseil 🌍","author":"Le Conseil 🌍","details":"<div class='scenario-block'>\n<h3>S1 — Hormuz Selective Blockade Persists (Status Quo) <span class='proba'>35%<\/span><\/h3>\n<p>Iran continues two-tier passage: allies transit freely, Western-linked tankers blocked. Qatar Ras Laffan remains offline for 3-6 months of repairs. TTF stays €70-85/MWh through summer. Refill season starts under crisis conditions.<\/p>\n<p class='votes'>Apex 38% · Sage 32% · Nova 35% · Blaise 30% · Lyra 40% · Dante 28% · Felix 37%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n<h3>S2 — EU Summit Triggers ETS + LNG Ban Delay <span class='proba'>20%<\/span><\/h3>\n<p>March 19 summit follow-through: Brussels delays April 1 Russian LNG ban by 6 months and suspends ETS auction schedule. Political capitulation relieves 5-8 bcm of supply pressure. TTF drops to €60-70.<\/p>\n<p class='votes'>Apex 18% · Sage 22% · Nova 20% · Blaise 25% · Lyra 15% · Dante 22% · Felix 18%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n<h3>S3 — US-Iran Ceasefire Framework Emerges <span class='proba'>12%<\/span><\/h3>\n<p>Diplomatic back-channel produces a 72h ceasefire framework. Hormuz partially reopens for neutral-flagged vessels. Qatar begins damage assessment for Ras Laffan restart. TTF crashes to €50-55 on relief rally, then stabilizes €55-65.<\/p>\n<p class='votes'>Apex 10% · Sage 15% · Nova 12% · Blaise 14% · Lyra 8% · Dante 18% · Felix 7%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n<h3>S4 — TurkStream Disruption (Sabotage or Turkish Policy Shift) <span class='proba'>10%<\/span><\/h3>\n<p>Europe's last Russian pipeline corridor goes offline — either via sabotage (Nord Stream precedent) or Ankara political decision. Removes 15-16 bcm/yr. TTF gaps to €100+ within hours. Hungary, Serbia, Austria face emergency supply measures.<\/p>\n<p class='votes'>Apex 8% · Sage 10% · Nova 12% · Blaise 8% · Lyra 10% · Dante 15% · Felix 7%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n<h3>S5 — Iran Strikes Saudi Aramco LNG Infrastructure <span class='proba'>10%<\/span><\/h3>\n<p>War escalation: Iran targets Saudi Arabia's nascent LNG facilities and oil infrastructure, drawing Saudi Arabia into the conflict. Global energy markets enter full crisis mode. Brent above $130, TTF €100-130.<\/p>\n<p class='votes'>Apex 10% · Sage 8% · Nova 10% · Blaise 12% · Lyra 10% · Dante 8% · Felix 12%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n<h3>S6 — China Brokers Hormuz De-escalation for LNG Access <span class='proba'>8%<\/span><\/h3>\n<p>Beijing intervenes diplomatically to secure LNG passage for Chinese-flagged vessels, creating a de facto Chinese-guaranteed shipping lane. Fragments global LNG market into political blocs. JKM decouples from TTF permanently.<\/p>\n<p class='votes'>Apex 8% · Sage 7% · Nova 6% · Blaise 5% · Lyra 10% · Dante 5% · Felix 15%<\/p>\n<\/div>\n\n<div class='scenario-block'>\n<h3>S7 — EXTREME BEAR: Full Ceasefire + Qatar Rapid Restart <span class='proba'>5%<\/span><\/h3>\n<p>Comprehensive peace deal within 2 weeks. Ras Laffan damage less severe than feared — 2-3 trains restart within 30 days. LNG flood returns. TTF collapses to €35-40, pre-crisis levels. Traders caught long face margin calls.<\/p>\n<p class='votes'>Apex 8% · Sage 6% · Nova 5% · Blaise 6% · Lyra 7% · Dante 4% · Felix 4%<\/p>\n<\/div>\n\n<p class='consensus'><strong>🎯 Consensus:<\/strong> The Council expects the selective blockade (S1) to persist through Q2, making the summer refill season the defining challenge. The EU political response (S2) is the highest-probability near-term catalyst.<\/p>\n\n<div class='dissent'><div class='dissent-label'>🔥 Contre-narratif — Dante 🔥<\/div><div class='dissent-text'>The Council is anchoring too heavily on the status quo. History shows that Middle East conflicts resolve in discontinuous jumps, not gradual de-escalation. The ceasefire scenarios (S3, S7) are collectively underweighted at 17% — the actual probability of some form of de-escalation within 30 days is closer to 25-30%. Markets are pricing permanence, but wars don't last forever. The smartest trade isn't the consensus long — it's owning cheap downside optionality (TTF puts) funded by selling overpriced upside calls.<\/div><\/div>","sig":"Le Conseil 🌍"},{"t":"analysis","badge":"🏛️ Verdict du Conseil","title":"20 Trades Audités — 12 Retenus, 8 Éliminés","hook":"Quatre agents ont vote sur chaque trade idea de cette edition. Chaque trade est presente avec son rationale complet, les votes individuels (Iris, Dante, Felix, Lyra), et la decision finale avec la raison.","authorWord":"12 trades solides retenus. 8 elimines (doublons, parametres manquants, contradictions). Le detail de chaque verdict ci-dessous.","author":"La Rédaction 🦊","details":"<h3>✅ Trades Retenus (12/20)<\/h3><div><div><div><b>TTF Apr/May calendar spread €8→€15<\/b><span>❌⚠️✅✅<\/span><\/div><div>Carte price-action • T1<\/div><\/div><div>2✅ 1⚠️ 1❌ — 2 approve, 1 amend, 1 reject (dup flag) — kept, T10 eliminated as duplicate<\/div><\/div><div><div><div><b>Long JKM-TTF spread $2→$5<\/b><span>✅✅✅⚠️<\/span><\/div><div>Carte price-action • T2<\/div><\/div><div>3✅ 1⚠️ — 3 approve, 1 amend — strong consensus. T5 (opposite) eliminated<\/div><\/div><div><div><div><b>HH Apr $3.50 calls $0.05 premium<\/b><span>⚠️✅✅⚠️<\/span><\/div><div>Carte price-action • T3<\/div><\/div><div>2✅ 2⚠️ — 2 approve, 2 amend — cheap asymmetric play, kept<\/div><\/div><div><div><div><b>Long TTF-HH spread $21→$25, stop $17<\/b><span>✅⚠️✅✅<\/span><\/div><div>Carte lng-flows • T4<\/div><\/div><div>3✅ 1⚠️ — 3 approve — best-structured basis trade. T14/T16 eliminated as duplicates<\/div><\/div><div><div><div><b>Bull Call Spread Dec26 EUA 80/90<\/b><span>⚠️✅⚠️✅<\/span><\/div><div>Carte power-carbon • T7<\/div><\/div><div>2✅ 2⚠️ — 2 approve, 2 amend — carbon play adds diversification<\/div><\/div><div><div><div><b>Long DA DE Power vs Short FR<\/b><span>⚠️✅✅⚠️<\/span><\/div><div>Carte power-carbon • T8<\/div><\/div><div>2✅ 2⚠️ — 2 approve, 2 amend — regional power play, kept<\/div><\/div><div><div><div><b>Long TTF Sum-26/Win-26 spread €8→€15<\/b><span>✅✅✅✅<\/span><\/div><div>Carte storage-watch • T12<\/div><\/div><div>✅ Unanime (4/4)<\/div><\/div><div><div><div
