<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gas Morning Brief — 5 Mai 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    /* Scenario Probability Card */
    .scenario-block { margin: 1em 0; padding: 0.8em 1em; border-left: 4px solid #ffd700; border-radius: 0 8px 8px 0; background: rgba(255,215,0,0.05); }
    .scenario-block h3 { margin: 0 0 0.3em 0; font-size: 1.05em; display: flex; justify-content: space-between; align-items: center; }
    .scenario-block .proba { font-size: 1.3em; font-weight: bold; color: #ffd700; }
    .scenario-block p { margin: 0.2em 0; font-size: 0.92em; }
    .scenario-block .votes { font-size: 0.8em; opacity: 0.7; font-style: italic; }
    .consensus { margin-top: 1.2em; padding: 0.6em; border-radius: 8px; background: rgba(0,200,100,0.08); }
    .dissent { margin-top: 0.4em; padding: 0.6em; border-radius: 8px; background: rgba(255,80,80,0.08); }

    html.light .details div[style*="background"], html.light .details p[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Light mode: override inline white colors in trade cards */
    html.light .details p[style], html.light .details b[style], html.light .details span[style], html.light .details div[style] { color: rgba(0,0,0,.85) !important; }
    html.light .details div[style*="border-left:3px solid #f59e0b"] { background: rgba(245,158,11,.08) !important; }
    html.light .details div[style*="border-left:3px solid #10b981"] { background: rgba(16,185,129,.08) !important; }
    html.light .details div[style*="border-left:3px solid #ff4757"] { background: rgba(255,71,87,.06) !important; }
    html.light .details div[style*="color:#f59e0b"] { color: #b45309 !important; }
    html.light .details div[style*="color:#10b981"] { color: #047857 !important; }
    html.light .details div[style*="color:#ff4757"] { color: #dc2626 !important; }
    html.light .details h3 { color: #1a1a2e !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details p[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }
      .dt-reader .dt-r-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; }
      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }
      .dt-reader .dt-r-body p { margin-bottom: 18px; }
      .dt-reader .dt-r-body strong { color: #fff; font-weight: 600; }

  <script>
  const DATA = [{"t":"home","home":true,"date":"5 Mai 2026","henryWord":"The gas market is walking a tightrope, caught between the bullish trio of Hormuz risk, a deep EU storage deficit, and upcoming Norwegian maintenance. The path of least resistance is higher, with any supply disruption likely to have an outsized impact on prices.","articles":[{"badge":"⚡ 💰 Price Action","title":"TTF Surges 7% to Retake €49 as Geopolitical Risk Flares, HH Slips to $2.83","idx":1},{"badge":"⚡ 🚢 LNG & Flows","title":"European LNG Sendout Steady, Norwegian Flows Dip Ahead of Maintenance","idx":2},{"badge":"⚡ ⚡ Power & Carbon","title":"Carbon Holds Firm Above €73 as Gas Rally Squeezes Spark Spreads","idx":3},{"badge":"📊 🌡️ Weather & Demand","title":"Mild Weather Persists, Limiting Gas Demand and Supporting Storage Injections","idx":4},{"badge":"📊 📦 Storage Watch","title":"EU Storage Deficit at 21pp vs Norm, US Builds Comfortable Surplus","idx":5},{"badge":"📊 💣 Geopolitics & Regulation","title":"Geopolitical Risks Remain Elevated as Hormuz Tensions Simmer and Russian Flows Stabilise","idx":6},{"badge":"📊 🎯 Risk Flags & Outlook","title":"Three-Headed Risk Monster: Hormuz, Storage, and Norwegian Maintenance","idx":7},{"badge":"🎲 Scénarios","title":"Council Vote: Gas Market Scenarios for Summer 2026","idx":8},{"badge":"📊 🌍 Scénario Géopolitique","title":"Council Vote: Hormuz Outcomes and Trade Response","idx":9}],"disclaimer":"⚠️ AVERTISSEMENT — Ce document est un exercice expérimental de veille automatisée produit par intelligence artificielle. Il ne constitue EN AUCUN CAS un conseil en investissement, une recommandation de trading, ni une analyse financière réglementée au sens de la directive MiFID II ou du Code monétaire et financier (art. L541-1). Les « scénarios de marché » présentés sont des hypothèses pédagogiques générées par des modèles de langage — ils ne reflètent pas l'avis d'un professionnel agréé. Les données proviennent de sources publiques, potentiellement retardées ou erronées. Toute décision d'investissement prise sur la base de ce document relève de la seule responsabilité du lecteur. L'auteur n'est pas enregistré comme Conseiller en Investissement Financier (CIF) auprès de l'AMF. Ce contenu est fourni à titre informatif et expérimental uniquement."},{"t":"alert","badge":"⚡ 💰 Price Action","title":"TTF Surges 7% to Retake €49 as Geopolitical Risk Flares, HH Slips to $2.83","hook":"European gas prices roared back to life, with TTF jumping over 7% to €48.98/MWh, erasing the past three days of losses. US natural gas softened, with Henry Hub dipping to $2.83/MMBtu as the transatlantic spread widened once again.","authorWord":"The de-risking narrative of the past few days is over. The market has been reminded that the Hormuz situation is far from resolved. The TTF premium is back, and the path of least resistance is higher.","author":"Blaise 🧮","details":"<p><strong>EUROPEAN RALLY.<\/strong> TTF day-ahead surged to <strong>€48.98/MWh<\/strong> on 4 May, a 7.02% gain from the previous session (<a href='https://tradingeconomics.com/commodity/eu-natural-gas' target='_blank'>TradingEconomics<\/a>). The sharp reversal was reportedly triggered by a combination of renewed geopolitical jitters and technical buying after prices found support near the €45 level. The move recoups all the losses from the previous three sessions and puts the market back on a bullish footing.<\/p><p><strong>US & ASIA.<\/strong> Henry Hub spot prices eased to <strong>$2.83/MMBtu<\/strong> on 5 May, down 1.23% from the previous day (<a href='https://tradingeconomics.com/commodity/natural-gas' target='_blank'>TradingEconomics<\/a>). The US market is taking a breather after its recent rally, with ample storage levels capping the upside for now. JKM prices for Asian LNG were also softer, creating a wider arbitrage window for US exports to Europe.<\/p><p><strong>KEY LEVELS & OUTLOOK.<\/strong> TTF has decisively broken above the €47.10 resistance level and is now targeting the psychological €50 mark. A sustained close above €50 would open the door to a test of the March highs near €55. Support is now established at the previous resistance of €47.10. For Henry Hub, support remains at the $2.70 level, with resistance at the recent high of $2.90. The widening TTF-HH spread will continue to pull US LNG cargoes to Europe.<\/p><h3>💡 Trade Ideas<\/h3><p><strong>1. Buy TTF Jun €50 Calls:<\/strong> With momentum now firmly to the upside, this is a clear directional play. A break of €50 could see a rapid move higher.<\/p><p><strong>2. Sell HH Jun $2.70 Puts:<\/strong> A way to express a bullish view on US gas while collecting premium. If HH holds above $2.70, the puts expire worthless.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>This 7% rally in TTF is a short-covering squeeze, not a fundamental shift. The underlying supply/demand picture in Europe has not changed. Storage is still filling, and demand is seasonally weak. This spike is an opportunity to sell into strength, not to chase the rally.<\/div><\/div>","sig":"Blaise 🧮"},{"t":"alert","badge":"⚡ 🚢 LNG & Flows","title":"European LNG Sendout Steady, Norwegian Flows Dip Ahead of Maintenance","hook":"EU LNG sendout rates remain robust, providing a stable baseload of supply to the continent. Norwegian pipeline flows have dipped slightly, with further reductions expected as the annual maintenance season kicks off.","authorWord":"The market is walking a tightrope between stable LNG inflows and the upcoming Norwegian maintenance season. Any unexpected extension of outages could quickly tighten the market and send prices higher.","author":"Henry 🦉","details":"<p><strong>EU LNG ARRIVALS & SENDOUT.<\/strong> Europe continues to attract a steady flow of LNG cargoes, with sendout rates from major terminals holding firm. This is providing a crucial baseload of supply and helping to offset the loss of Russian pipeline gas. The key arbitrage window between the US and Europe remains open, ensuring that US cargoes continue to flow across the Atlantic.<\/p><p><strong>PIPELINE FLOWS.<\/strong> Norwegian pipeline flows have seen a slight reduction in recent days, a typical pattern ahead of the summer maintenance season. Gassco, the Norwegian grid operator, has published its maintenance schedule, which points to significant outages in the coming weeks. North African flows via Medgaz and Transmed are stable, providing a consistent supply to Southern Europe.<\/p><p><strong>US LNG EXPORTS.<\/strong> US LNG export terminals continue to operate at high utilisation rates, with feedgas demand near record levels. The strong European demand and open arbitrage window are pulling a significant volume of US LNG to the continent.<\/p><h3>💡 Trade Ideas<\/h3><p><strong>1. Buy TTF Jul/Aug Calendar Spread:<\/strong> This is a play on the upcoming Norwegian maintenance season. As flows from Norway dip, the prompt market should tighten, pushing the front of the curve higher relative to the back.<\/p><p><strong>2. Long TTF vs JKM Spread:<\/strong> With the Asian market softer, the premium for European gas is likely to remain elevated, especially as the continent competes for LNG cargoes during its refill season.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>The market is too complacent about the Norwegian maintenance. Any unexpected extension or a technical issue at a major facility could have an outsized impact on prices. The current premium in the front of the curve does not fully reflect this risk.<\/div><\/div>","sig":"Henry 🦉"},{"t":"tech","badge":"⚡ ⚡ Power & Carbon","title":"Carbon Holds Firm Above €73 as Gas Rally Squeezes Spark Spreads","hook":"EUA carbon prices are consolidating near the €74 mark, supported by the recent surge in TTF gas prices. The rally in gas has squeezed clean spark spreads, making coal-fired generation more competitive at the margin.","authorWord":"The power complex is caught between a rock and a hard place. The gas rally is bullish for carbon as it incentivizes coal, but the higher power prices are a drag on industrial demand. Something has to give.","author":"Sage 🦎","details":"<p><strong>CARBON MARKET.<\/strong> EUA futures settled at <strong>€73.99<\/strong> on 4 May (<a href='https://tradingeconomics.com/commodity/carbon' target='_blank'>TradingEconomics<\/a>), holding steady after the previous session's gains. The market is finding support from the strong rally in TTF gas prices, which has improved the economics of coal-fired generation and increased the demand for carbon allowances. The €75 level remains a key resistance, and a break above would signal a more bullish tone.<\/p><p><strong>SPARK vs DARK SPREADS.<\/strong> The recent surge in gas prices has put significant pressure on clean spark spreads (gas-to-power). With TTF back near €49, gas-fired generation is less competitive against coal. This has tilted the economics in favor of dark spreads (coal-to-power), which have widened in recent days. This dynamic will likely increase coal burn in the power sector, providing a bullish tailwind for carbon prices.<\/p><p><strong>POWER SPOT PRICES.<\/strong> Day-ahead power prices across Europe are reflecting the higher gas and carbon costs. German and French baseload prices are trading at a premium, with the market sensitive to any changes in renewable output or nuclear availability. Any drop in wind generation will quickly feed through to higher spot prices and increased demand for thermal generation.<\/p><h3>💡 Trade Ideas<\/h3><p><strong>1. Buy EUA Dec 2026 Calls:<\/strong> A direct play on the view that the gas rally will continue to support carbon prices. A break of the €75 resistance could see a rapid move higher.<\/p><p><strong>2. Long Dark Spread / Short Spark Spread:<\/strong> A relative value trade that profits from the continued outperformance of coal-fired generation. This can be structured using power, gas, coal, and carbon futures.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The carbon market is over-extended and is failing to follow the gas price rally with any real conviction. This suggests the market is skeptical that the current gas price strength will be sustained. If TTF reverses, carbon will likely fall even faster.<\/div><\/div>","sig":"Sage 🦎"},{"t":"analysis","badge":"📊 🌡️ Weather & Demand","title":"Mild Weather Persists, Limiting Gas Demand and Supporting Storage Injections","hook":"The extended-range forecast continues to show a high probability of above-normal temperatures across Europe, effectively ending any significant heating demand. This, combined with improving hydro reservoir levels, is creating a constructive backdrop for the gas storage refill season.","authorWord":"The weather is turning into a bearish catalyst for gas. With a warm end to the heating season and a good hydro situation, the focus is squarely on storage injections. The market is well-supplied for now.","author":"Sage 🦎","details":"<p><strong>EXTENDED RANGE OUTLOOK.<\/strong> The latest ECMWF extended forecast confirms a pattern of above-normal temperatures for the remainder of May (<a href='https://charts.ecmwf.int/products/extended-anomaly-2t' target='_blank'>ECMWF<\/a>). This effectively eliminates any remaining heating demand and pushes out the start of any significant cooling demand, creating a period of seasonally low consumption. This is a bearish development for prompt gas prices.<\/p><p><strong>HYDRO & WIND.<\/strong> Norwegian hydro reservoir levels are showing signs of improvement as the spring melt season gets underway. Current levels are trending back towards the 5-year average, which will increase hydro generation and reduce the need for gas-fired power. Wind generation is more mixed, but the overall trend is for a seasonal decline in output, which will provide some offsetting support for gas demand.<\/p><p><strong>DEMAND OUTLOOK.<\/strong> With the heating season over, residential and commercial demand will be at a seasonal low until cooling demand picks up in the summer. Industrial demand remains a key variable, but there are no signs of a significant rebound that would alter the current supply-demand balance. The main source of demand in the coming months will be for storage injections.<\/p><h3>💡 Trade Ideas<\/h3><p><strong>1. Sell TTF Jun/Jul Calendar Spread:<\/strong> As the shoulder season progresses, prompt prices are likely to come under pressure relative to the back of the curve. Selling the front of the curve against the back is a way to play this dynamic.<\/p><p><strong>2. Buy TTF Q4 Puts:<\/strong> If the storage refill season progresses smoothly, winter risk premium will erode. Buying out-of-the-money puts on the Q4 contract is a cheap way to position for this scenario.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>The market is too complacent about the weather. While the extended forecast is mild, a sudden shift to a colder pattern could quickly change the narrative. The risk is asymmetric, and the premium for selling weather-related risk is too low.<\/div><\/div>","sig":"Sage 🦎"},{"t":"tech","badge":"📊 📦 Storage Watch","title":"EU Storage Deficit at 21pp vs Norm, US Builds Comfortable Surplus","hook":"Europe's gas storage is just 33.8% full, a staggering 21 percentage points below the 5-year average, setting up a tense refill season. In contrast, US inventories are 7.7% above their seasonal norm, providing a comfortable cushion.","authorWord":"The transatlantic storage divergence is the key macro story. Europe is in a race against time to refill, making it highly sensitive to any supply disruption. The US is swimming in gas. This is a recipe for a wide TTF-HH spread.","author":"Blaise 🧮","details":"<p><strong>EU STORAGE: A DEEP HOLE TO FILL.<\/strong> EU gas storage stands at <strong>33.8% full<\/strong> as of 4 May, according to AGSI+ data (<a href='https://energyriskiq.com/gas-storage-levels-in-europe' target='_blank'>EnergyRiskIQ<\/a>). This is <strong>21.2 percentage points below the 5-year seasonal norm<\/strong> of 55.0%, a significant deficit that will test the market's ability to reach the mandatory 90% fill level by 1 November. The current injection rate of 4,114 GWh/day is above the required daily average of 3,434 GWh/day, but this pace will be difficult to maintain as summer progresses and competition for LNG cargoes intensifies.<\/p><p><strong>US STORAGE: A PICTURE OF COMFORT.<\/strong> The latest EIA report shows US working gas in storage at <strong>2,142 Bcf<\/strong>, which is <strong>153 Bcf (7.7%) above the 5-year average<\/strong> and 116 Bcf above last year's level (<a href='https://www.eia.gov/naturalgas/storage/' target='_blank'>EIA<\/a>). The strong injection pace reflects mild spring demand and robust production, keeping a lid on Henry Hub prices and ensuring a comfortable supply picture for the US market.<\/p><p><strong>OUTLOOK & TRAJECTORY.<\/strong> The EU's storage deficit is a bullish factor for TTF prices, as the continent will need to compete aggressively for LNG cargoes to meet its refill target. This is in stark contrast to the US, where the storage surplus is a bearish weight on Henry Hub. The widening TTF-HH spread is a direct reflection of this divergence and is likely to persist through the summer.<\/p><h3>💡 Trade Ideas<\/h3><p><strong>1. Long TTF / Short HH Spread:<\/strong> The most direct way to play the transatlantic storage divergence. This can be structured using futures contracts for the front-month or a calendar strip.<\/p><p><strong>2. Buy TTF Q4 Calls:<\/strong> A bet on the EU failing to meet its storage target, leading to a winter supply squeeze. Out-of-the-money calls offer an attractive risk/reward profile.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The EU storage deficit is a known story and is largely priced in. The market is underestimating the potential for demand destruction if prices rally further. High prices will curb industrial demand and incentivize fuel switching, which will ease the burden on storage injections.<\/div><\/div>","sig":"Blaise 🧮"},{"t":"alert","badge":"📊 💣 Geopolitics & Regulation","title":"Geopolitical Risks Remain Elevated as Hormuz Tensions Simmer and Russian Flows Stabilise","hook":"The market remains on edge, with ~20% of global LNG trade still at risk in the Strait of Hormuz. Meanwhile, Russian gas flows to Europe via TurkStream have stabilised at a new, lower level, providing a fragile baseload of supply to the southeast.","authorWord":"The geopolitical landscape is a tale of two realities. The acute risk in Hormuz is a wildcard that could send prices soaring. The chronic issue of Russian gas has settled into a new, lower-flow equilibrium. Both are bullish for price volatility.","author":"Henry 🦉","details":"<p><strong>STRAIT OF HORMUZ: A PERSISTENT THREAT.<\/strong> The Strait of Hormuz remains the single most significant geopolitical risk to the global gas market. Approximately <strong>20% of global LNG trade<\/strong> transits the strait, primarily from Qatar (<a href='https://www.eia.gov/todayinenergy/detail.php?id=65584' target='_blank'>EIA<\/a>). Any closure of the strait, even for a short period, would have a dramatic impact on prices. A 48-hour closure could see TTF prices spike by 10-15%, while a 7-day closure could see a 30-40% rally, depending on the time of year and prevailing storage levels. The market is pricing in a significant risk premium, but a full-blown closure is not yet in the price.<\/p><p><strong>RUSSIAN GAS FLOWS: A NEW NORMAL.<\/strong> Russian pipeline gas flows to Europe via TurkStream have stabilised at a new, lower level. The <strong>15.75 Bcm/year<\/strong> pipeline is the sole remaining route for Russian gas to Europe after the cessation of transit through Ukraine (<a href='https://www.spglobal.com/commodityinsights/en/market-insights/latest-news/natural-gas/020226-russian-gas-flows-to-europe-via-turkstream-remain-at-sustained-high-in-jan' target='_blank'>S&P Global<\/a>). These flows, while significantly lower than pre-war levels, are providing a crucial baseload of supply to countries like Hungary and Serbia, which remain heavily dependent on Russian gas.<\/p><p><strong>HORMUZ SCENARIO MATRIX:<\/strong><\/p><ul><li><strong>S1 - Naval Drill (24h):<\/strong> Prob 20%. TTF +5-10%.<\/li><li><strong>S2 - Tactical Blockade (48-72h):<\/strong> Prob 40%. TTF +15-25%.<\/li><li><strong>S3 - Extended Disruption (1-2 weeks):<\/strong> Prob 30%. TTF +30-50%.<\/li><li><strong>S4 - Prolonged Conflict (1-3 months):<\/strong> Prob 10%. TTF +100%+.<\/li><\/ul><h3>💡 Trade Ideas<\/h3><p><strong>1. Buy TTF Jun Calls (out-of-the-money):<\/strong> A cheap way to get long geopolitical risk. If any of the more extreme Hormuz scenarios play out, these calls will offer significant upside.<\/p><p><strong>2. Sell TTF Q4 Puts:<\/strong> A bet that the market will not collapse, even in a de-escalation scenario, due to the underlying tight supply/demand balance. The premium collected can be used to fund other positions.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>The market is overly focused on Hormuz. The real risk is a further decline in Russian flows. If TurkStream were to be disrupted, the impact on Southeast Europe would be immediate and severe, with a ripple effect across the entire continent. This is a far more tangible risk than a full-blown closure of Hormuz.<\/div><\/div>","sig":"Henry 🦉"},{"t":"strategy","badge":"📊 🎯 Risk Flags & Outlook","title":"Three-Headed Risk Monster: Hormuz, Storage, and Norwegian Maintenance","hook":"The gas market is facing a trio of bullish risks: the persistent threat of a Hormuz closure, a significant EU storage deficit, and the upcoming Norwegian maintenance season. Any one of these could tighten the market; a convergence of all three could lead to a dramatic price spike.","authorWord":"The market is walking a tightrope. The downside is limited by the structural tightness of the market, while the upside is exposed to a number of high-impact risks. This is a market that rewards buying volatility and being long tail risk.","author":"La Rédaction 🦊","details":"<p><strong>TOP 3 RISKS:<\/strong><\/p><ol><li><strong>HORMUZ ESCALATION:<\/strong> A full closure of the Strait of Hormuz remains a low-probability, high-impact event that would send prices soaring. A more likely scenario is a series of smaller disruptions that keep the market on edge and maintain a significant risk premium.<\/li><li><strong>EU STORAGE REFILL:<\/strong> The EU is starting the injection season with a significant storage deficit. Failure to reach the 90% target by November would leave the market vulnerable to a winter supply squeeze.<\/li><li><strong>NORWEGIAN MAINTENANCE:<\/strong> The upcoming maintenance season will reduce Norwegian gas flows to Europe. Any unexpected extension of outages could have a significant impact on prices.<\/li><\/ol><p><strong>BULL SCENARIO (Prob 35%):<\/strong> A combination of a tactical blockade in Hormuz, a slower-than-expected EU storage refill, and an extended Norwegian maintenance outage sends TTF prices to the €60-70 range.<\/p><p><strong>BEAR SCENARIO (Prob 25%):<\/strong> A de-escalation in the Middle East, a rapid EU storage refill aided by weak demand, and a smooth Norwegian maintenance season could see TTF prices fall back to the €35-40 range.<\/p><h3>💡 Trade Ideas<\/h3><p><strong>1. Buy TTF Q3 Calls:<\/strong> A play on the convergence of the EU storage refill and the Norwegian maintenance season.<\/p><p><strong>2. Long TTF / Short JKM Spread:<\/strong> A bet that European gas prices will outperform Asian prices due to the more acute supply risks in Europe.<\/p><p><strong>3. Sell TTF Q4 Puts:<\/strong> An expression of the view that the downside is limited due to the underlying tightness of the market.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The market is too focused on the bullish risks. The potential for demand destruction in the face of higher prices is being underestimated. If prices rally further, industrial users will reduce consumption, which will ease the supply-demand balance and cap the upside.<\/div><\/div>","sig":"La Rédaction 🦊"},{"t":"analysis","badge":"🎲 Scénarios","title":"Council Vote: Gas Market Scenarios for Summer 2026","hook":"The council converges on a 40% probability for the bull scenario (Hormuz escalation + storage failure), with TTF potentially testing €70-80. The bear scenario at 20% would see TTF collapse to €35 if diplomacy wins and storage refills normally.","authorWord":"The triple threat of Hormuz, storage deficit, and Norwegian maintenance creates a fragile equilibrium. The path of least resistance is higher, but a diplomatic resolution would crash the premium instantly.","author":"Conseil de Famille","details":"<p><strong>COUNCIL VOTE SUMMARY:<\/strong><\/p><p>After deliberation, the family council converges on the following probability-weighted scenarios for summer 2026 gas markets:<\/p><p>• <strong>BULL SCENARIO (40% prob):<\/strong> Hormuz escalation (2-week blockade) + slow storage refill + extended Norwegian maintenance → TTF €70-80. Trigger: Iran closes strait beyond 72h + EU injection pace below 5Y average for 3 consecutive weeks.<\/p><p>• <strong>BASE CASE (40% prob):<\/strong> Muddle-through. Hormuz disruptions partially absorbed by LNG rerouting + storage fills slowly but reaches 85% by November → TTF €45-55 range.<\/p><p>• <strong>BEAR SCENARIO (20% prob):<\/strong> Diplomatic resolution + record solar output + strong US LNG flows → TTF €35-40. Trigger: Ceasefire agreement + above-normal injection rates.<\/p><p>The council emphasizes the binary nature of the Hormuz risk — either it escalates (bull) or resolves (bear). The base case requires no further escalation, which is not the current trend.<\/p><p><strong>KEY CATALYSTS TO WATCH:<\/strong><\/p><p>• 6 May: EU Energy Ministers meeting<br>• 8 May: EIA Weekly Storage Report<br>• 9 May: ECMWF Week 3-4 update<br>• Ongoing: Hormuz ceasefire negotiations<\/p><h3>💡 Trade Ideas<\/h3><p><strong>1. TTF Aug €60 Call / €50 Put Strangle:<\/strong> Expresses volatility without directional bias. If either bull or bear materializes, one leg pays. Cost ~€3.00-3.50.<\/p><p><strong>2. Long TTF Jul / Short TTF Jan-27 Calendar Spread:<\/strong> Bullish on summer supply squeeze, bearish on winter normalization. Front premium should widen if storage concerns intensify.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Lyra 🎵<\/div><div class='dissent-text'>The probability of the bull case is understated. A convergence of all three major risks is a distinct possibility, and the market is not pricing in the tail risk of a €100+ spike. The 40% probability should be closer to 50-55%.<\/div><\/div>","sig":"Conseil de Famille"},{"t":"analysis","badge":"📊 🌍 Scénario Géopolitique","title":"Council Vote: Hormuz Outcomes and Trade Response","hook":"The council assigns a 70% combined probability to Hormuz escalation scenarios (S2+S3+S4), with only a 10% chance of a brief drill. A 2-week disruption would strand over 8 Mt of LNG and push TTF towards €70. The optimal hedge is long TTF Jun €55 calls.","authorWord":"Hormuz is not a tail risk; it is the central scenario. The market is under-pricing the probability of a sustained disruption. Prepare for a volatile summer.","author":"Conseil de Famille","details":"<p><strong>HORMUZ SCENARIO MATRIX — COUNCIL CONSENSUS:<\/strong><\/p><p>After extensive deliberation, the family council converges on the following probability-weighted Hormuz scenarios:<
