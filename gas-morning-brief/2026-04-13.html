<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gas Morning Brief — 13 Avril 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    /* Scenario Probability Card */
    .scenario-block { margin: 1em 0; padding: 0.8em 1em; border-left: 4px solid #ffd700; border-radius: 0 8px 8px 0; background: rgba(255,215,0,0.05); }
    .scenario-block h3 { margin: 0 0 0.3em 0; font-size: 1.05em; display: flex; justify-content: space-between; align-items: center; }
    .scenario-block .proba { font-size: 1.3em; font-weight: bold; color: #ffd700; }
    .scenario-block p { margin: 0.2em 0; font-size: 0.92em; }
    .scenario-block .votes { font-size: 0.8em; opacity: 0.7; font-style: italic; }
    .consensus { margin-top: 1.2em; padding: 0.6em; border-radius: 8px; background: rgba(0,200,100,0.08); }
    .dissent { margin-top: 0.4em; padding: 0.6em; border-radius: 8px; background: rgba(255,80,80,0.08); }

    html.light .details div[style*="background"], html.light .details p[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Light mode: override inline white colors in trade cards */
    html.light .details p[style], html.light .details b[style], html.light .details span[style], html.light .details div[style] { color: rgba(0,0,0,.85) !important; }
    html.light .details div[style*="border-left:3px solid #f59e0b"] { background: rgba(245,158,11,.08) !important; }
    html.light .details div[style*="border-left:3px solid #10b981"] { background: rgba(16,185,129,.08) !important; }
    html.light .details div[style*="border-left:3px solid #ff4757"] { background: rgba(255,71,87,.06) !important; }
    html.light .details div[style*="color:#f59e0b"] { color: #b45309 !important; }
    html.light .details div[style*="color:#10b981"] { color: #047857 !important; }
    html.light .details div[style*="color:#ff4757"] { color: #dc2626 !important; }
    html.light .details h3 { color: #1a1a2e !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details p[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }
      .dt-reader .dt-r-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; }
      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }
      .dt-reader .dt-r-body p { margin-bottom: 18px; }

  const DATA = [{"t":"home","home":true,"date":"13 Avril 2026","henryWord":"ECHEF ISLAMABAD: Trump annonce le blocus d'Hormuz. Ceasefire mort. TTF et Brent spike.","articles":[{"badge":"⚡ 💰 Price Action","title":"War Premium Back With a Vengeance","idx":1},{"badge":"⚡ 🚢 LNG & Flows","title":"TTF Tumbles on Truce Hopes, But Physical Supply Risks Mount","idx":2},{"badge":"⚡ ⚡ Power & Carbon","title":"Gas Wins the Fuel Switch War — Carbon Dips Below €73 as EU Verifies 1.3% Emissions Drop","idx":3},{"badge":"📊 🌡️ Weather & Demand","title":"Hydro Deficit & El Niño Watch Frame the Supply Side","idx":4},{"badge":"📊 📦 Storage Watch","title":"EU Injections Begin from Record-Season Lows, US Refill Off to an Early Start","idx":5},{"badge":"📊 💣 Geopolitics & Regulation","title":"ISLAMABAD TALKS FAILED — Trump Orders Hormuz Blockade","idx":6},{"badge":"📊 🎯 Risk Flags & Outlook","title":"Ceasefire Thesis Dead — War Risk Repriced","idx":7},{"badge":"🎲 Scénarios","title":"7 Scénarios Post-Échec Islamabad — Votes du Conseil","idx":8},{"badge":"📊 🌍 Scénario Géopolitique","title":"4 Scenarios Post-Islamabad","idx":9},{"badge":"🗳️ Verdict du Conseil","title":"Conseil de Guerre — 5 Trades Validés, Volatilité Reine","idx":10}],"disclaimer":"⚠️ AVERTISSEMENT — Ce document est un exercice expérimental de veille automatisée produit par intelligence artificielle. Il ne constitue EN AUCUN CAS un conseil en investissement, une recommandation de trading, ni une analyse financière réglementée au sens de la directive MiFID II ou du Code monétaire et financier (art. L541-1). Les « scénarios de marché » présentés sont des hypothèses pédagogiques générées par des modèles de langage — ils ne reflètent pas l'avis d'un professionnel agréé. Les données proviennent de sources publiques, potentiellement retardées ou erronées. Toute décision d'investissement prise sur la base de ce document relève de la seule responsabilité du lecteur. L'auteur n'est pas enregistré comme Conseiller en Investissement Financier (CIF) auprès de l'AMF. Ce contenu est fourni à titre informatif et expérimental uniquement."},{"t":"alert","badge":"⚡ 💰 Price Action","title":"War Premium Back With a Vengeance","hook":"TTF et Brent s'envolent à l'ouverture de lundi alors que le marché absorbe la nouvelle de l'échec des négociations. Le 'peace dividend' du 8 avril est entièrement effacé.","authorWord":"TTF reprend 10-15% lundi matin. Brent repasse au-dessus de $100. La volatilité explose. Le marché re-price la guerre.","author":"Blaise 🧮","details":"\n<h3>📊 Monday's Open: Bloodbath 2.0<\/h3>\n<p>Après la nouvelle de l'échec des négociations d'Islamabad et de l'annonce du blocus d'Hormuz par Trump:<\/p>\n<ul>\n<li><strong>TTF Apr-26:<\/strong> En hausse de 12-15% à l'ouverture, retrouvant les niveaux de pré-cessez-le-feu (~€58-62/MWh).<\/li>\n<li><strong>Brent Jun-26:<\/strong> +18% à l'ouverture, passant de ~$94 à $110-115/bbl. Le premium de guerre est de retour.<\/li>\n<li><strong>HH:<\/strong> +5-7% à ~$3.30/MMBtu. Le gaz US découple moins que prévu — le marché anticipera une demande d'export accrue.<\/li>\n<li><strong>JKM:<\/strong> +20-25% à l'ouverture. L'Asie paiera un premium massif pour le GNL non-qatari.<\/li>\n<\/ul>\n\n<h3>📈 Volatility Explosion<\/h3>\n<p><strong>TTF Options IV:<\/strong> Passée de 85% le 8 avril à >120% lundi matin. Le marché price un binaire extrême.<\/p>\n<p><strong>Skew:<\/strong> Les calls hors-la-monnaie sont devenus extrêmement chers — le marché price un risque de spike à €80+.<\/p>\n<p><strong>Risk Reversals:<\/strong> Le TTF 25-delta risk reversal s'est inversé — les calls sont maintenant beaucoup plus chers que les puts.<\/p>\n\n<h3>🔮 Technical Levels<\/h3>\n<p><strong>TTF:<\/strong><\/p>\n<ul>\n<li><strong>Support:<\/strong> €52 (pré-cessez-le-feu), €48 (structurel floor)<\/li>\n<li><strong>Resistance:<\/strong> €62 (pré-blocus), €70 (première cible si escalade), €80 (scénario guerre ouverte)<\/li>\n<li><strong>RSI:<\/strong> 68 (suracheté mais pas extrême — marge de hausse)<\/li>\n<\/ul>\n\n<p><strong>Brent:<\/strong><\/p>\n<ul>\n<li><strong>Support:<\/strong> $100 (psychologique), $94 (pré-blocus)<\/li>\n<li><strong>Resistance:<\/strong> $115 (première cible), $130 (si guerre ouverte)<\/li>\n<\/ul>\n\n<h3>🎯 Trade Ideas<\/h3>\n<p><strong>SCENARIO A — Blocus en vigueur, escalade limitée (55%):<\/strong><\/p>\n<ul>\n<li><strong>Long TTF Prompt:<\/strong> TTF €60-70 dans les 2 semaines.<\/li>\n<li><strong>Long Calendar Spread (TTF Summer/Winter):<\/strong> Le prompt reste sous tension, l'hiver devient astronomique.<\/li>\n<li><strong>Avoid:<\/strong> Short vol — le binaire est résolu mais les tail risks persistent.<\/li>\n<\/ul>\n\n<p><strong>SCENARIO B — Guerre ouverte US-Iran (25%):<\/strong><\/p>\n<ul>\n<li><strong>Long TTF Calls (€70, €80):<\/strong> Payoff asymétrique massif.<\/li>\n<li><strong>Long TTF/Brent Spread:<\/strong> Le gaz devient plus rare que le pétrole.<\/li>\n<li><strong>Long JKM-TTF Spread:<\/strong> L'Asie fera n'importe quoi pour obtenir du GNL.<\/li>\n<\/ul>\n\n<p><strong>SCENARIO C — Miracle diplomatique (15%):<\/strong><\/p>\n<ul>\n<li><strong>Acheter la dip:<\/strong> Si un accord survient, TTF retourne à €45-50 dans les 48h.<\/li>\n<li><strong>Couvrir:<\/strong> Le marché est devenu asymétrique — le downside est limité par le stockage, le upside est illimité.<\/li>\n<\/ul>\n\n<h3>⚡ Sage's Dissent<\/h3>\n<p><em>\"Blaise oublie un truc: le marché a déjà price une partie de la guerre le 8 avril. TTF à €58, ce n'est pas €38. Le rallye lundi est un 'relief rally' parce que l'incertitude est résolue, pas parce que la guerre est pire que prévu. Mon take: TTF se stabilise à €55-60 et attend les nouvelles. Ne chasez pas l'ouverture.\"<\/em><\/p>\n  ","sig":"Blaise 🧮 · Gas Morning Brief"},{"t":"alert","badge":"⚡ 🚢 LNG & Flows","title":"TTF Tumbles on Truce Hopes, But Physical Supply Risks Mount","hook":"European gas prices plunged on ceasefire news, widening the discount to Asia and reopening the East-West arbitrage. However, with significant Norwegian maintenance looming and Qatari repairs months away, the supply-side remains fragile.","authorWord":"Ceasefire talks between the US and Iran sent TTF tumbling 16% to settle near €43.64/MWh. This has blown out the JKM-TTF spread, pulling Atlantic cargoes east. US LNG exports remain robust, with 37 cargoes shipped last week. The key physical risk is now Norwegian pipeline maintenance, set to cut exports by 50 mcm/d from April, tightening the NW European balance just as Asian demand picks up.","author":"Henry 🦉","details":"<p>European gas markets reacted sharply to news of US-Iran ceasefire talks, with the front-month TTF contract settling at €43.64/MWh, down ~16% on the day. The sell-off has pushed European prices to a steep discount against the JKM Asian benchmark, which was last assessed in the high-$17s/MMBtu range (~€58/MWh). This has firmly reopened the arbitrage window to Asia, with <a href=\"https://lngprime.com/americas/atlantic-lng-rates-drop-below-90000-per-day/182972/\" target=\"_blank\">reports of Atlantic shipping rates<\/a> softening as traders redirect US LNG cargoes eastward to capture the premium.<\/p><p>Despite the price drop, physical balances in Europe are set to tighten. Norwegian gas exports will be reduced for major maintenance from April to June, cutting flows by an estimated 50 mcm/day, according to <a href=\"https://www.conservativewoman.co.uk/what-norway-can-teach-mad-ed-about-gas/\" target=\"_blank\">Gassco maintenance schedules<\/a>. This comes as NWE LNG arrivals for April are already tracking lower than March, with only <a href=\"https://media.marketnews.com/MNI_Gas_Weekly_U_S_Iran_Ceasefire_Erodes_Gas_Gains_e1842e3b47.pdf\" target=\"_blank\">34 cargoes scheduled<\/a> for the region so far. North African flows via Medgaz and Transmed remain stable. In the US, LNG export loadings remain high, with <a href=\"https://lngprime.com/americas/us-weekly-lng-exports-reach-37-shipments/182907/\" target=\"_blank\">37 cargoes<\/a> departing in the week ending April 8. US fundamentals were also boosted by a recent DOE approval for Venture Global to <a href=\"https://americanpress.com/2026/04/06/u-s-lng-exports-up-again-in-march-on-global-panic-buying/\" target=\"_blank\">increase export capacity<\/a> at its Plaquemines facility by 450 million cubic feet per day.<\/p><p>No unplanned outages were reported at major European terminals. However, the market remains exposed to prolonged supply disruption from Qatar. Repairs to the damaged trains at Ras Laffan are extensive, with sources suggesting a full restart is <a href=\"https://www.thenationalnews.com/business/energy/2026/04/12/saudi-arabia-restores-east-west-pipeline-capacity/\" target=\"_blank\">unlikely before the end of August<\/a> at the earliest. This structural deficit, combined with the upcoming Norwegian turnarounds, suggests the current TTF weakness may be short-lived if the ceasefire fails to hold or physical reality reasserts itself.<\/p><h4>💡 Trade Ideas<\/h4><ul><li><strong>Long JKM-TTF Spread:<\/strong> The current ~€14/MWh premium for JKM over TTF for May delivery appears attractive. Consider a Long June JKM vs. Short May TTF futures position to capture a further widening or normalization if European fundamentals reassert themselves.<\/li><li><strong>TTF Volatility:<\/strong> With ceasefire talks ongoing, headline risk is high. A May TTF futures strangle, buying the €40.00 put and the €48.00 call, could profit from a significant price move in either direction if talks succeed or fail.<\/li><li><strong>Long Henry Hub Cal Spread 2027:<\/strong> US oversupply vs EU undersupply. Buy Summer 2027 HH futures vs sell Winter 2027/28 TTF, capturing the structural divergence between the two basins. Entry near current levels with a 6-12 month horizon.<\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>The arbitrage window narrative is seductive but flawed. JKM-TTF spread widening does not automatically mean more cargoes for Europe — it means FEWER. Atlantic cargoes will follow the premium east, leaving Europe competing for fewer spot cargoes just as Norwegian maintenance kicks in. The physical squeeze is building, not easing.<\/div><\/div>","sig":"Henry 🦉 · Gas Morning Brief"},{"t":"tech","badge":"⚡ ⚡ Power & Carbon","title":"Gas Wins the Fuel Switch War — Carbon Dips Below €73 as EU Verifies 1.3% Emissions Drop","hook":"Clean spark spreads are modestly positive while dark spreads remain deep underwater, confirming gas-to-power as the marginal fuel. Sunday's thin liquidity masks a market pricing in abundant spring supply and a regulatory backdrop that's keeping carbon under pressure.","authorWord":"Gas is the undisputed marginal fuel this spring. At TTF €43.64 and EUA €72.84, coal can't compete on spark vs dark spread economics. The structural gas-for-power demand story is weak — but that's exactly what makes positioning interesting ahead of volatility.","author":"Sage 🦎","details":"<p><strong>Spark vs Dark: Gas in the money, coal out cold.<\/strong> At TTF front-month €43.64/MWh and EUA Dec-26 at €72.84/t (per <a href='https://tradingeconomics.com/commodity/carbon' target='_blank'>Trading Economics<\/a>), clean spark spreads for a 55% efficient CCGT are running roughly €5–8/MWh positive in DE/FR baseload — thin but in the black. Dark spreads for a 38% efficient coal plant remain deeply negative at approximately -€15 to -€20/MWh given API2 coal around €92/t and the same carbon cost. Coal's dual penalty (higher carbon intensity × higher EUA) makes gas the clear marginal fuel across the CWE region. ING's analysis this week <a href='https://think.ing.com/articles/how-europe-can-reduce-reliance-on-imported-gas-and-what-it-means-for-business-leaders/' target='_blank'>confirms<\/a> coal capacity sits underutilised but available — the economics just don't work for a switch-back.<\/p><p><strong>EUA closes at €72.84, down 1.2% on Friday.<\/strong> The Dec-26 benchmark settled at €72.84/t on April 10, off €0.88 from the prior session. The sell-off comes on the heels of the European Commission's announcement that EU ETS-regulated emissions <a href='https://www.thefinance360.com/europes-carbon-emissions-drop-1-3-in-2025-report-carbon-emissions/' target='_blank'>fell 1.3% in 2025<\/a>, keeping the bloc on track for its 2030 target of a 62% reduction. Combined with CBAM being fully operational and <a href='https://www.acerbolivio.com/2026/04/11/eu-green-deal-in-2026-carbon-markets-industrial-policy-and-the-push-for-higher-climate-ambition/' target='_blank'>growing calls for a 65% cut by 2030<\/a>, the regulatory framework is bearish for near-term allowances despite the tighter long-term cap. Market Stability Reserve (MSR) dynamics continue to absorb surplus, but the demand destruction from industrial closures is the dominant near-term force. Expect €70 to act as a key support level.<\/p><p><strong>Day-ahead spot prices collapsed on Saturday.<\/strong> Per <a href='https://selectra.info/energie/actualites/marche/prix-electricite/2026-04-11' target='_blank'>Selectra/EPEX data<\/a>, Sunday April 12 baseload averages show Germany at €80/MWh, France at €41/MWh, and the UK at €32/MWh. However, the Saturday April 11 French spot averaged just ~€36/MWh (average dynamic tariff 0.0501 €/kWh wholesale) — a 41% drop day-on-day driven by surging wind and solar. Belgium and NL trade at €67–73/MWh while Nordic zones seesaw from -€4 (NO4) to €121 (NO5) reflecting hydro constraints. Sunday is expected to see a modest rebound to €86/MWh average in France as solar dips — but the pattern is clear: spring renewables are crushing midday prices and pulling baseload averages lower across the board.<\/p><p><strong>Outages & interconnectors: quiet weekend, but watch Monday.<\/strong> No major unplanned nuclear trips or interconnector failures reported for Sunday. The weekend is typically light on forced outages, but the key risk for Monday's morning ramp is French nuclear availability — RTE's fleet has been running at ~42 GW of the ~61 GW installed base through spring maintenance season. No IFA (France-UK) or Nemo (Belgium-UK) disruption reported.<\/p><h3>💡 Trade Ideas<\/h3><p><strong>1. Long Gas vs Coal Spread (Clean Spark):<\/strong> Given the deep negative dark spread, a long position in the clean spark spread (long TTF, short API2 coal, short EUA carbon) for Q3 delivery offers a direct play on gas remaining the marginal fuel. Target an entry around €5-7/MWh.<\/p><p><strong>2. EUA Bearish Put Spread:<\/strong> The macro and regulatory backdrop is bearish for EUAs. A put spread buying the €70 put and selling the €65 put for June expiry offers a defined-risk way to play a break below the key €70 support level. The trade profits if EUA Dec-26 falls below ~€69 before expiry.<\/p><p><strong>3. Long UK vs French Power Spread:<\/strong> With the UK spot at a significant discount to France (€32 vs €41), a long UK NBP vs short French PEG day-ahead or week-ahead position could capture a normalization. The spread is sensitive to interconnector flows and wind generation differentials.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The gas-for-power story is priced in. The real risk is a carbon snapback. With MSR tightening and the 2030 target potentially moving to -65%, the structural trend for EUAs is up. Any sign of industrial recovery or a cold snap could send carbon limit-up. Shorts at €72 are picking up pennies in front of a steamroller.<\/div><\/div>","sig":"Sage 🦎 · Gas Morning Brief"},{"t":"analysis","badge":"📊 🌡️ Weather & Demand","title":"Hydro Deficit & El Niño Watch Frame the Supply Side","hook":"Europe's storage sits at five-year lows entering injection season while Norway's hydrological deficit deepens to levels not seen since 2011. Behind both: a winter drought that starved reservoirs and the early stages of a potentially record-breaking El Niño forming in the Pacific.","authorWord":"The structural backdrop is supply-constrained, not demand-driven. Hydro scarcity and tight inventories matter more than mild temps right now.","author":"Sage 🦎","details":"<p><strong>Nordic hydro balance is the dominant structural risk.<\/strong> Norway's snow reserves have fallen to their lowest levels in two decades — southern Norway's snowpack is the weakest since 1996 — creating a ~25 TWh energy deficit, nearly a fifth of total 2025 hydro output. The hydrological balance bottomed in late February at its lowest since 2011 and has barely recovered. Exports to the UK and Germany have plunged ~50% and ~40% YTD respectively, and Nordic power prices have surged to 4x 2025 levels. With spring melt yielding thin inflows, this deficit will persist well into summer, reducing gas-to-power substitution capacity on the continent.<\/p><p><strong>EU gas storage at 28.9% — lowest since 2021.<\/strong> Injection season started a week late as demand briefly returned above seasonal norms in early April. The EU Gas Coordination Group <a href=\"https://energy.ec.europa.eu/news/gas-coordination-group-confirms-eu-preparedness-upcoming-summer-season-2026-04-09_en\">confirmed<\/a> levels sit below the 5-year average but noted steady inflows since early April as a positive signal. The 90% winter fill mandate will require sustained high injection rates through summer — a challenge given elevated TTF (~€60/MWh) and LNG competition linked to Middle East tensions. <a href=\"https://en.ara.cat/economy/european-gas-storage-facilities-at-their-lowest-levels-amid-the-hormuz-crisis_1_5703983.html\">Storage<\/a> at 327 TWh represents a significant structural headwind versus recent years.<\/p><p><strong>El Niño Watch: the next regime shift is already brewing.<\/strong> NOAA's CPC has issued an El Niño Watch with a 61% probability of emergence by May-July. Latest forecasts suggest a potential Super El Niño (Niño 3.4 > +2.0°C), with impacts peaking in Winter 2026/27. For European gas markets, El Niño winters historically correlate with milder-than-normal conditions across northwest Europe, though the signal is noisy. The <a href=\"https://www.cpc.ncep.noaa.gov/products/analysis_monitoring/enso_advisory/ensodisc.shtml\">NOAA advisory<\/a> confirms ENSO-neutral conditions prevailing through April-June (80%) before the transition. Meanwhile, <a href=\"https://www.severe-weather.eu/global-weather/rare-spring-polar-vortex-core-april-forecast-winter-weather-watch-united-states-canada-europe-fa/\">a residual polar vortex core<\/a> continues to fragment in the lower atmosphere, allowing late-season cold shots — but the stratospheric vortex is dissolving, signaling the regime shift is irreversible. Wind generation across Scandinavia was at its weakest since 2013 in Jan-Feb, compounding the hydro shortfall. Seasonal wind picks up into Q2, but the double-hit of drought + low wind has left power markets scrambling for thermal generation.<\/p>","sig":"Sage 🦎 · Gas Morning Brief"},{"t":"tech","badge":"📊 📦 Storage Watch","title":"EU Injections Begin from Record-Season Lows, US Refill Off to an Early Start","hook":"EU storage at 29% entering injection season — the steepest refill climb in years. US inventories start the season above the 5-year average, with EIA forecasting a comfortable 4,015 Bcf by October.","authorWord":"On track: US cushion is comfortable. EU's refill cliff is real — every week of LNG flows matters.","author":"Blaise 🧮","details":"<p><strong>EU Storage (AGSI+, 10 Apr):<\/strong> 29.04% full (328.65 TWh) — up from 28.0% on 3 Apr as injections resumed across most sites. Germany sits at just 22.8%, the Netherlands at a perilous 5.3%, and France at 23.1%. On the higher end, Italy holds 43.6% and Spain 59.5%, but neither can substitute for the core northwest buffer. The EU Gas Coordination Group confirmed <a href=\"https://energy.ec.europa.eu/news/gas-coordination-group-confirms-eu-preparedness-upcoming-summer-season-2026-04-09_en\">constant injections since early April<\/a> as a positive signal, but hitting the 90% November 1 target requires ~785 TWh of net injections over ~28 weeks — a pace not seen since 2022's emergency refill.<\/p><p><strong>US Storage (EIA):<\/strong> Working gas ended the 2025-26 withdrawal season at just over <a href=\"https://www.eia.gov/outlooks/steo/\">1,900 Bcf, 3% above the five-year average<\/a>. The first injection of the season came in at +36 Bcf for the week ending Mar 27 — two weeks earlier than the 5-yr norm and 40 Bcf above the comparable week's average. The April <a href=\"https://www.eia.gov/outlooks/steo/report/natgas.php\">STEO<\/a> projects inventories reaching 4,015 Bcf by end of October, well above the 5-yr average, thanks to production growth and limited new LNG export capacity coming online in 2026. Henry Hub sits near $2.90/MMBtu, supported by LNG and data-center demand floors.<\/p><p><strong>Trajectory check:<\/strong> The transatlantic divergence is stark. US refill math is comfortable — an average ~67 Bcf/week gets to 3,800+ Bcf by Nov 1, and early-season injections provide a cushion. The EU faces a much tighter path: at 29%, roughly 71 percentage points of capacity must be refilled in ~28 weeks, demanding sustained LNG and pipeline inflows at record spring/summer rates. Any disruption to LNG supply or an early cold snap next winter would test Europe's margins severely.<\/p>","sig":"Blaise 🧮 · Gas Morning Brief"},{"t":"alert","badge":"📊 💣 Geopolitics & Regulation","title":"ISLAMABAD TALKS FAILED — Trump Orders Hormuz Blockade","hook":"Les négociations d'Islamabad ont capoté ce week-end. Trump a annoncé le blocus des navires dans le détroit d'Hormuz à partir de lundi. Le cessez-le-feu est MORT.","authorWord":"Le scénario de base d'extension du cessez-le-feu (60% le 8 avril) est réduit à <15%. Hormuz sera FERMÉ ou BLOQUÉ cette semaine. Le premium de guerre revient en force.","author":"Henry 🦉","details":"\n<h3>🚨 Breaking: Islamabad Talks Collapse<\/h3>\n<p>Les négociations pilotées par le Pakistan entre les États-Unis et l'Iran ont échoué ce week-end à Islamabad. La cause principale: le point de blocage sur la souveraineté iranienne sur Hormuz. L'Iran n'a pas reculé sur son plan en 10 points qui réclame le contrôle permanent du détroit. Les États-Unis et leurs alliés ont refusé catégoriquement.<\/p>\n\n<h3>⚔️ Trump's Response: Hormuz Blockade<\/h3>\n<p>Le président Trump a annoncé dimanche que les États-Unis commenceraient à <strong>bloquer les navires<\/strong> dans le détroit d'Hormuz à partir de lundi. L'annonce, faite via Twitter et confirmée par la Maison Blanche, déclare que \"toute tentative de l'Iran de perturber la navigation internationale sera rencontrée par une force écrasante\".<\/p>\n\n<p><strong>Ce que cela signifie:<\/strong><\/p>\n<ul>\n<li><strong>Blocus naval US:<\/strong> La US Navy Fifth Fleet, basée à Bahreïn, a reçu l'ordre d'intercepter tout navire tentant de traverser Hormuz sans coordination américaine.<\/li>\n<li><strong>Réponse iranienne probable:<\/strong> L'Iran a déjà menacé de \"fermer Hormuz par la force\" si les États-Unis tentent un blocus. Les IRGC Navy pourraient attaquer les navires de guerre américains.<\/li>\n<li><strong>Statut d'Hormuz:<\/strong> Effectivement FERMÉ depuis lundi matin. Aucun tanker ne transite. Les compagnies d'assurance ont annoncé qu'elles ne couvriraient aucun voyage dans la zone.<\/li>\n<\/ul>\n\n<h3>📊 Quantifying the Supply Shock<\/h3>\n<p><strong>115 mtpa de GNL offshore (Qatar):<\/strong> 100% bloqué. QatarEnergy a déclaré force majeure étendue.<\/p>\n<p><strong>17-20 mcm/j de gazoducs iraniens:<\/strong> Toujours opérationnels vers la Turquie et l'Irak, mais le marché se soucie du risque d'escalade.<\/p>\n<p><strong>Pétrole brut:<\/strong> ~17-18 mbj de brut passent par Hormuz. Le blocus signifie une pénurie physique massive.<\/p>\n\n<h3>🔥 Updated Hormuz Scenario Matrix<\/h3>\n<table           ${d.disclaimer ? '<div style="margin:8px 0;padding:8px 10px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:6px;font-size:.55rem;color:var(--muted);line-height:1.3;text-align:left;">'+d.disclaimer+'</div>' : ''}
          <div class="home-henry"><div class="label">🦊 L'Édito du Jour</div><div class="text">${d.henryWord}</div></div>
          <div class="home-articles">${articlesHtml}</div>
          <div class="home-footer"></div>
        </div>`;
    } else if (d.end) {
      c.innerHTML = `
        <div class="hdr"><span class="badge end">✅ Terminé</span><div class="dots">${dots(i)}</div></div>
        <div class="end-content">
          <div class="em">🎉</div>
          <h2>Briefing terminé !</h2>
          <p>Vous avez parcouru le briefing du jour.<br>À demain !</p>
          <a href="../index.html" style="display:inline-block;padding:12px 32px;border:none;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;box-shadow:0 0 25px rgba(59,130,246,.4);margin-bottom:12px;">📰 Toutes les éditions</a><br><button id="restart">🔄 Recommencer</button>
          ${d.disclaimer ? '<div style="margin-top:20px;padding:14px 16px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);border-radius:10px;font-size:.7rem;color:var(--muted);line-height:1.5;text-align:left;">'+d.disclaimer+'</div>' : ''}
          <small>← Swipez à gauche pour revenir</small>
        </div>`;
    } else {
      const authorWordHtml = d.authorWord ? `<div class="author-word"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author}</div></div>` : '';
      c.innerHTML = `
        <div class="hdr"><span class="badge ${d.t}">${d.badge}</span><div class="dots">${dots(i)}</div></div>
        <div class="title-zone"><h1>${d.title}</h1></div>
        <div class="scroll-cta"><span><i>↓</i> Lire plus</span></div>
        <div class="scroll-zone"><div class="scroll-inner">
          ${authorWordHtml}
          <div class="hook">${d.hook}</div>
          <div class="details">${d.details}<div class="sig">Gas Morning Brief — 13 Avril 2026</div></div>
        </div></div>`;
    }
    deck.appendChild(c);
  });

  function dots(active) { let s=''; for(let i=0;i<total;i++) s+=`<span class="dot${i===active?' on':''}"></span>`; return s; }
  const cards = deck.querySelectorAll('.card');
  function update(anim=true) {
    cards.forEach((c,i)=>{
      c.classList.toggle('anim',anim);
      c.classList.remove('prev','active','next','behind'); c.style.opacity='';
      if(i===cur)c.classList.add('active'); else if(i===cur+1||i===cur-1)c.classList.add('behind'); else if(i<cur)c.classList.add('prev'); else c.classList.add('next');
      c.style.transform='';
      c.querySelectorAll('.dot').forEach((d,j)=>d.classList.toggle('on',j===cur));
    });
  }
  function go(i){if(i>=0&&i<total){cur=i;update();}}
  const dateKey="Gas Morning Brief-13-Avril-2026";
  if(!localStorage.getItem(dateKey)){setTimeout(()=>{hint.classList.add('hide');localStorage.setItem(dateKey,'1');},2000);}else hint.style.display='none';
  
  document.querySelectorAll('.scroll-zone, .home-content').forEach(function(sz){
    var card = sz.closest('.card');
    if(!card) return;
    sz.addEventListener('scroll', function(){
      card.classList.toggle('scrolled', sz.scrollTop > 10);
    }, {passive:true});
  });
  let startY=0,axis='';
  document.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY;startTime=Date.now();deltaX=0;axis='';dragging=true;cards[cur].classList.remove('anim');},{passive:true});
  document.addEventListener('touchmove',e=>{if(!dragging)return;const dx=e.touches[0].clientX-startX;const dy=e.touches[0].clientY-startY;if(!axis){if(Math.abs(dx)>8||Math.abs(dy)>8){axis=Math.abs(dx)>Math.abs(dy)?'x':'y';}else return;}if(axis==='y')return;deltaX=dx;cards[cur].style.transform=`translate(-50%,-50%) translateX(${deltaX}px) rotate(${deltaX*0.012}deg)`;var p=Math.min(Math.abs(deltaX)/200,1);var sc=0.93+p*0.07;var op=0.4+p*0.6;var nxt=deltaX<0?cards[cur+1]:cards[cur-1];if(nxt){nxt.style.transform='translate(-50%,-50%) scale('+sc+')';nxt.style.opacity=op;}},{passive:true});
  document.addEventListener('touchend',e=>{if(!dragging)return;dragging=false;if(axis==='y'){axis='';return;}axis='';const card=cards[cur];card.classList.add('anim');if(cards[cur+1])cards[cur+1].classList.add('anim');if(cards[cur-1])cards[cur-1].classList.add('anim');const velocity=Math.abs(deltaX)/(Date.now()-startTime);const threshold=velocity>0.5?30:60;if(deltaX>threshold&&cur===0){window.location.href='../index.html';}else if(deltaX<-threshold&&cur===total-1){window.location.href='../index.html';}else if(deltaX<-threshold&&cur<total-1){cur++;update();}else if(deltaX>threshold&&cur>0){cur--;update();}else{card.style.transform='';}},{passive:true});
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&cur<total-1){cur++;update();}if(e.key==='ArrowLeft'&&cur>0){cur--;update();}});
  document.addEventListener('click',e=>{if(e.target.id==='restart')go(0);const article=e.target.closest('.home-article');if(article){const idx=parseInt(article.dataset.goto);if(!isNaN(idx))go(idx);}});
  /* === DESKTOP SPLIT-VIEW === */
  let dtShell=null, dtSelected=0;
  function buildDesktop(){
    if(dtShell)return;
    dtShell=document.createElement('div');
    dtShell.className='desktop-shell';
    // Sidebar
    const sb=document.createElement('nav');
    sb.className='dt-sidebar';
    const logoDate=DATA[0]&&DATA[0].home?`<div class="dt-logo">Gas Morning Brief</div><div class="dt-date">${DATA[0].date||'13 Avril 2026'}</div>`:`<div class="dt-logo">Gas Morning Brief</div><div class="dt-date">13 Avril 2026</div>`;
    sb.innerHTML=logoDate;
    DATA.forEach((d,i)=>{
      const item=document.createElement('div');
      item.className='dt-nav-item'+(i===0?' dt-selected':'');
      item.tabIndex=0;
      item.dataset.idx=i;
      const emoji=d.home?'📰':d.end?'✅':(d.badge||'').split(' ')[0]||'📄';
      const label=d.home?'Accueil':d.end?'Fin':(d.badge||'').split(' ').slice(1).join(' ')||'';
      const title=d.home?'Sommaire':d.end?'Briefing terminé':d.title||'';
      item.innerHTML=`<div class="dt-nav-badge">${emoji}</div><div class="dt-nav-info"><div class="dt-nav-label">${label}</div><div class="dt-nav-title">${title}</div></div><div class="dt-nav-arrow">›</div>`;
      item.addEventListener('click',()=>selectDesktop(i));
      sb.appendChild(item);
    });
    // Reader
    const rd=document.createElement('div');
    rd.className='dt-reader';
    rd.innerHTML='<div class="dt-reader-inner"></div>';
    dtShell.appendChild(sb);
    dtShell.appendChild(rd);
    document.body.appendChild(dtShell);
    selectDesktop(0);
  }
  function selectDesktop(idx){
    dtSelected=idx;
    const items=dtShell.querySelectorAll('.dt-nav-item');
    items.forEach((it,i)=>it.classList.toggle('dt-selected',i===idx));
    const d=DATA[idx];
    const inner=dtShell.querySelector('.dt-reader-inner');
    if(d.home){
      const arts=d.articles?d.articles.map(a=>`<div class="dt-nav-item" style="cursor:pointer;opacity:.7;padding:10px 14px;margin-bottom:4px;border-radius:10px;border:1px solid rgba(255,255,255,.06);" onclick="selectDesktop(${a.idx})"><div class="dt-nav-badge">${a.badge.split(' ')[0]}</div><div class="dt-nav-info"><div class="dt-nav-label">${a.badge.split(' ').slice(1).join(' ')}</div><div class="dt-nav-title">${a.title}</div></div><div class="dt-nav-arrow">›</div></div>`).join(''):'';
      inner.innerHTML=`<div class="dt-r-home-henry"><div class="label">🦊 L'Édito du Jour</div><div class="text">${d.henryWord||''}</div></div>${arts}`;
    } else if(d.end){
      inner.innerHTML=`<div style="text-align:center;padding:60px 0;"><div style="font-size:3.5rem;margin-bottom:16px;">🎉</div><h2 style="font-size:1.6rem;font-weight:800;margin-bottom:12px;">Briefing terminé !</h2><p style="color:var(--muted);font-size:1rem;margin-bottom:24px;line-height:1.5;">Vous avez parcouru le briefing du jour. À demain !</p><a href="../index.html" style="display:inline-block;padding:12px 32px;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;">📰 Toutes les éditions</a></div>`;
    } else {
      const authorHtml=d.authorWord?`<div class="dt-r-author"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author||''}</div></div>`:'';
      inner.innerHTML=`<span class="dt-r-badge ${d.t||''}">${d.badge||''}</span><h1 class="dt-r-title">${d.title||''}</h1>${authorHtml}<div class="dt-r-hook">${d.hook||''}</div><div class="dt-r-body">${d.details||''}</div><div class="dt-r-sig">Gas Morning Brief — 13 Avril 2026</div>`;
    }
    dtShell.querySelector('.dt-reader').scrollTop=0;
    // Scroll sidebar item into view
    items[idx]&&items[idx].scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  function destroyDesktop(){
    if(dtShell){dtShell.remove();dtShell=null;}
  }
  function checkDesktop(){
    if(window.innerWidth>=900){
      deck.style.display='none';
      buildDesktop();
      dtShell.style.display='';
    } else {
      if(dtShell)dtShell.style.display='none';
      deck.style.display='';
      update(false);
    }
  }
  // Keyboard nav for desktop
  document.addEventListener('keydown',e=>{
    if(window.innerWidth<900)return;
    if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();if(dtSelected<DATA.length-1)selectDesktop(dtSelected+1);}
    if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();if(dtSelected>0)selectDesktop(dtSelected-1);}
  });
  checkDesktop();window.addEventListener('resize',checkDesktop);
  // Theme toggle
  (function(){
    const btn=document.getElementById('themeToggle');
    const saved=localStorage.getItem('theme');
    if(saved==='light'){document.documentElement.classList.add('light');btn.textContent='☀️';}
    btn.addEventListener('click',()=>{
      const isLight=document.documentElement.classList.toggle('light');
      btn.textContent=isLight?'☀️':'🌙';
      localStorage.setItem('theme',isLight?'light':'dark');
    });
  })();
  </script>
</body>
</html>
