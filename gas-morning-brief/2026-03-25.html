<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gas Morning Brief — 25 Mars 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    /* Scenario Probability Card */
    .scenario-block { margin: 1em 0; padding: 0.8em 1em; border-left: 4px solid #ffd700; border-radius: 0 8px 8px 0; background: rgba(255,215,0,0.05); }
    .scenario-block h3 { margin: 0 0 0.3em 0; font-size: 1.05em; display: flex; justify-content: space-between; align-items: center; }
    .scenario-block .proba { font-size: 1.3em; font-weight: bold; color: #ffd700; }
    .scenario-block p { margin: 0.2em 0; font-size: 0.92em; }
    .scenario-block .votes { font-size: 0.8em; opacity: 0.7; font-style: italic; }
    .consensus { margin-top: 1.2em; padding: 0.6em; border-radius: 8px; background: rgba(0,200,100,0.08); }
    .dissent { margin-top: 0.4em; padding: 0.6em; border-radius: 8px; background: rgba(255,80,80,0.08); }

    html.light .details div[style*="background"], html.light .details p[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Light mode: override inline white colors in trade cards */
    html.light .details p[style], html.light .details b[style], html.light .details span[style], html.light .details div[style] { color: rgba(0,0,0,.85) !important; }
    html.light .details div[style*="border-left:3px solid #f59e0b"] { background: rgba(245,158,11,.08) !important; }
    html.light .details div[style*="border-left:3px solid #10b981"] { background: rgba(16,185,129,.08) !important; }
    html.light .details div[style*="border-left:3px solid #ff4757"] { background: rgba(255,71,87,.06) !important; }
    html.light .details div[style*="color:#f59e0b"] { color: #b45309 !important; }
    html.light .details div[style*="color:#10b981"] { color: #047857 !important; }
    html.light .details div[style*="color:#ff4757"] { color: #dc2626 !important; }
    html.light .details h3 { color: #1a1a2e !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details p[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }
      .dt-reader .dt-r-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; }
      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }
      .dt-reader .dt-r-body p { margin-bottom: 18px; }
      .dt-reader .dt-r-body strong { color: #fff; font-weight: 600; }

  <script>
  const DATA = [{"t":"home","home":true,"date":"25 Mars 2026","henryWord":"Trump's ultimatum walkback bought time but solved nothing — TTF shed 10% to €53.8 while Hormuz stays physically closed and QatarEnergy's force majeure makes the Ras Laffan loss permanent. With the April 1 Russian LNG ban 7 days out and storage at 28.5%, the refill equation is broken three different ways. The Council validated 13 of 21 trade ideas, eliminating 8 duplicates and contradictions; the TTF Sum/Win-26 calendar and Win-26 outright remain highest conviction.","articles":[{"badge":"⚡ 💰 Price Action","title":"Ultimatum Walkback Triggers €6 TTF Slide — HH Unmoved at $2.92","idx":1},{"badge":"⚡ 🚢 LNG & Flows","title":"QatarEnergy Force Majeure Reshuffles Global LNG — US Exporters Maxed Out","idx":2},{"badge":"⚡ ⚡ Power & Carbon","title":"Spark Spreads Compress as TTF Slides — EUA Under Political Siege Below €67","idx":3},{"badge":"📊 🌡️ Weather & Demand","title":"The Spring Tightening: Navigating the Hydro Void","idx":4},{"badge":"📊 📦 Storage Watch","title":"28.5% and Counting Down — Gazprom Calls Injection 'Unprofitable' as EU Eases Targets","idx":5},{"badge":"📊 💣 Geopolitics & Regulation","title":"Trump Blinks on Hormuz — But Iran Denies Any Talks as Day 25 Grinds On","idx":6},{"badge":"📊 🎯 Risk Flags & Outlook","title":"Three Fault Lines Persist Despite Ultimatum Relief — April Ban Is the Next Catalyst","idx":7},{"badge":"🎲 Scénarios","title":"7 Market Scenarios — Council Probability Vote","idx":8},{"badge":"📊 🌍 Scénario Géopolitique","title":"Day 25: The Ultimatum Mirage — 7 Geopolitical Scenarios for Gas Markets","idx":9},{"badge":"🏛️ Verdict du Conseil","title":"21 Trades Audités — 13 Retenus, 8 Éliminés","idx":10}],"disclaimer":"⚠️ AVERTISSEMENT — Ce document est un exercice expérimental de veille automatisée produit par intelligence artificielle. Il ne constitue EN AUCUN CAS un conseil en investissement, une recommandation de trading, ni une analyse financière réglementée au sens de la directive MiFID II ou du Code monétaire et financier (art. L541-1). Les « scénarios de marché » présentés sont des hypothèses pédagogiques générées par des modèles de langage — ils ne reflètent pas l'avis d'un professionnel agréé. Les données proviennent de sources publiques, potentiellement retardées ou erronées. Toute décision d'investissement prise sur la base de ce document relève de la seule responsabilité du lecteur. L'auteur n'est pas enregistré comme Conseiller en Investissement Financier (CIF) auprès de l'AMF. Ce contenu est fourni à titre informatif et expérimental uniquement."},{"t":"alert","badge":"⚡ 💰 Price Action","title":"Ultimatum Walkback Triggers €6 TTF Slide — HH Unmoved at $2.92","hook":"TTF shed 10% from Monday's €60 spike to settle near €53.8 as Trump postponed the Hormuz strike deadline. Henry Hub barely flinched at $2.92 — the Atlantic-Pacific divergence is now the widest since Hormuz Day 1.","authorWord":"The relief rally is a mirage. Storage at 28.5% and Ras Laffan offline for years mean the floor is higher than the chart says.","author":"Blaise 🧮","details":"<p><strong>TTF front-month<\/strong> settled at <a href='https://tradingeconomics.com/commodity/eu-natural-gas' target='_blank'>€53.82/MWh (close 24 Mar)<\/a>, down sharply from Monday's intraday high above €60 — a >10% single-session reversal triggered by Trump's claim of 'productive' talks with Iran. <strong>Henry Hub<\/strong> traded at <a href='https://www.cmegroup.com/markets/energy/natural-gas/natural-gas.html' target='_blank'>$2.92/MMBtu (settle 24 Mar)<\/a>, essentially flat, with ample US shoulder-season supply insulating domestic prices from global turmoil. <strong>JKM<\/strong> remains elevated at ~$19-20/MMBtu as Asian buyers panic-bid for non-Hormuz cargoes.<\/p><p>The divergence is staggering: since February 28, European gas is up 85%, Asian LNG up 143%, while US Henry Hub has barely moved. Volume surged on the reversal — TTF open interest expanded as shorts likely covered on the ultimatum walkback. Key technical levels: TTF support at €50 (psychological + March lows), resistance at €60 (Monday spike). HH remains rangebound $2.80-$3.20 with no war premium baked in.<\/p><p>Iran <a href='https://www.cbsnews.com/live-updates/iran-war-us-israel-trump-ultimatum-strait-of-hormuz/' target='_blank'>denies any talks are happening<\/a>, and the Hormuz blockade remains physically in place. This 'relief' could snap back violently if Trump reimpositions the deadline or if Iran escalates.<\/p><p>💡 <b>Trade Ideas:<\/b><br>1. <b>Long TTF Apr-26 €55/€65 call spread<\/b> — capture re-escalation risk. Entry ~€2/MWh premium, target €5-6 payout if Hormuz talks collapse. Asymmetric given blockade still in effect.<br>2. <b>Short HH / Long TTF spread<\/b> — the decoupling is extreme. If US LNG export capacity remains maxed, TTF-HH spread should stay elevated. Target TTF-HH equivalent spread above $15/MMBtu.<br>3. <b>Long TTF Apr €50 straddle<\/b> — binary outcome: either talks produce a ceasefire (TTF toward €40) or collapse triggers re-escalation (TTF back toward €65+). Implied vol should be rich but the realized range justifies it.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>The €53 level may be a fair-value anchor, not a floor. If Trump genuinely extends diplomatic runway by 5+ days, the geopolitical premium could erode further as shoulder-season demand fades. The real test is April injection pace — if cargoes reroute and injection starts, TTF could drift toward €45 regardless of Hormuz headlines.<\/div><\/div>","sig":"Blaise 🧮"},{"t":"alert","badge":"⚡ 🚢 LNG & Flows","title":"QatarEnergy Force Majeure Reshuffles Global LNG — US Exporters Maxed Out","hook":"QatarEnergy declared force majeure on long-term contracts to Italy, Belgium, South Korea and China as Ras Laffan's 17% capacity loss becomes a multi-year supply hole. US LNG exporters are already running flat-out with no spare capacity until late 2026.","authorWord":"The force majeure makes it official: this isn't a shipping disruption, it's a structural supply deficit. Europe is now bidding against Asia for every free molecule.","author":"Henry 🦉","details":"<p><a href='https://www.reuters.com/business/energy/qatarenergy-declares-force-majeure-lng-contracts-2026-03-24/' target='_blank'>QatarEnergy's force majeure declaration<\/a> (24 Mar) transforms the Ras Laffan damage from a tactical disruption into a structural supply shock. The 17% capacity offline represents roughly 13 Mt/yr of LNG — equivalent to ~18 bcm of European gas demand. Buyers in Italy (Edison), Belgium (Fluxys), South Korea (KOGAS) and China (CNOOC/Sinopec) are now scrambling for replacement cargoes on the spot market.<\/p><p><strong>US LNG at maximum:<\/strong> <a href='https://www.reuters.com/business/energy/ceraweek-energy-security-key-national-security-shell-ceo-says-2026-03-24/' target='_blank'>Cheniere's CFO confirmed<\/a> output already exceeds nameplate capacity — no material increase possible until Sabine Pass Train 6 or Corpus Christi Stage III add volumes later in 2026. Venture Global's CEO noted 31% of 2026 production remains uncontracted, providing some spot flexibility. Meanwhile, <a href='https://www.reuters.com/business/energy/ceraweek-venture-global-has-adequate-long-term-supply-lng-ceo-says-2026-03-24/' target='_blank'>Santos shut Darwin LNG<\/a> for maintenance, removing more spot supply.<\/p><p>The TTF-HH arb is blown wide at ~$15+/MMBtu equivalent, incentivizing every available US cargo to head East. But the pipeline is full. Norwegian flows via Langeled and Europipe remain stable but can't compensate for LNG shortfalls. The JKM-TTF spread remains elevated as Asian buyers outbid Europe for spot cargoes — Shell's Wael Sawan warned Europe could face shortages <a href='https://www.reuters.com/business/energy/ceraweek-shell-concerned-iran-war-will-impact-long-term-confidence-lng-supply-2026-03-23/' target='_blank'>'by next month'<\/a>.<\/p><p>💡 <b>Trade Ideas:<\/b><br>1. <b>Long JKM-TTF spread Q2-26<\/b> — Asian premium should persist or widen as Qatar volumes stay offline. Entry at current ~$4-5/MMBtu, target $7-8 if competition for spot cargoes intensifies.<br>2. <b>Long TTF Sum-26/Win-26 calendar spread<\/b> — if injection season is supply-constrained, the winter premium should widen. Entry near current levels, target €5-7 widening.<br>3. <b>Short NBP-TTF spread<\/b> — UK has 1.5 days of storage; any cargo diversion hits NBP harder. Consider NBP premium compression as spot tightness equalizes across NW Europe.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>Glencore's Kolupaev argues existing global LNG flows can cover demand if properly redirected. The IEA projected 7%+ global LNG output growth in 2026 from US expansion. If Hormuz talks progress and even partial transit resumes, the supply picture loosens faster than the panic suggests. The force majeure may be a negotiating tactic as much as a supply reality.<\/div><\/div>","sig":"Henry 🦉"},{"t":"tech","badge":"⚡ ⚡ Power & Carbon","title":"Spark Spreads Compress as TTF Slides — EUA Under Political Siege Below €67","hook":"The €6 TTF drop reopened gas-for-power economics at the margin, but EUA continues its political descent as 10+ EU countries demand ETS reform by July. The merit order remains in flux.","authorWord":"Carbon is caught between market forces and political gravity. At €66-67, the ETS is being repriced for regulatory risk, not fundamentals.","author":"Sage 🦎","details":"<p><strong>Spark spreads tightened<\/strong> on Tuesday as TTF's slide to €53.8/MWh improved gas-fired generation economics. German baseload day-ahead cleared lower, with the prompt power complex responding to the gas relief. However, the dark spread (coal-to-power) remains competitive at current gas levels — the coal-gas switching range sits around €50-55/MWh TTF, meaning we're right on the knife edge. Any TTF dip below €50 would flip the merit order decisively toward gas; any spike back above €60 hands it to coal.<\/p><p><strong>EUA carbon:<\/strong> Permits traded around €66-67/tCO2, continuing their slide from €72+ earlier in March. The <a href='https://www.euronews.com/my-europe/2026/03/23/eu-pushes-early-gas-refills-while-easing-storage-targets-on-iran-war' target='_blank'>EU March 19 summit<\/a> saw 10+ member states demand an ETS review by July, with industry lobbying for temporary carbon cost relief during the energy crisis. If ETS allowance supply is loosened or MSR intake is adjusted, expect EUA to test €60 support. French nuclear availability remains a key variable — any unplanned outages would boost gas-for-power demand and support spark spreads.<\/p><p>Wind generation performed near seasonal norms across NW Europe on Tuesday, providing some relief to the power stack. But the structural picture remains gas-dependent: the persistent hydro deficit in Norway and the Alps means thermal generation carries a heavier load than usual heading into Q2.<\/p><p>💡 <b>Trade Ideas:<\/b><br>1. <b>Long clean spark spread Q2-26<\/b> — if TTF stabilizes €50-55 and EUA stays pressured below €70, gas-fired generation margins improve. Target €5-7/MWh clean spark.<br>2. <b>Short EUA Dec-26<\/b> — political momentum toward ETS reform is strong; 10+ countries demanding review creates downside. Target €60, stop above €72.<br><\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>Henry argues the ETS reform noise is political theater that won't survive the legislative process. The MSR continues to absorb surplus allowances, and the fundamental scarcity signal is intact. A ceasefire that crashes TTF below €40 would actually support EUA as gas-for-power demand surges, improving carbon intensity of the power mix. Don't short EUA based on headlines — the regulatory framework is designed to resist exactly this kind of political pressure.<\/div><\/div>","sig":"Sage 🦎"},{"t":"analysis","badge":"📊 🌡️ Weather & Demand","title":"The Spring Tightening: Navigating the Hydro Void","hook":"Storage levels at 28.9% serve as a structural anchor, keeping the market tethered to supply risks as we enter the shoulder season. Persistent hydro deficits ensure gas remains the marginal balancer for any late-season cold snaps.","authorWord":"Sage 🦎 tracking the drift from winter tail-risk into spring fundamental recovery.","author":"Sage 🦎","details":"<p>The transition into early April continues to show classic seasonal variability. Extended range models suggest a waning but lingering <a href='https://www.cpc.ncep.noaa.gov/products/precip/CWlink/daily_ao_index/ao.shtml' target='_blank'>Arctic Oscillation (AO)<\/a> influence, which risks intermittent cold air advection despite the overall trend toward spring. With cumulative heating degree days (HDD) still slightly elevated above 10-year normals, the current mild weather is helping, but not fully repairing, the storage trajectory deficit.<\/p><p>The critical focus remains on the persistent hydro imbalance in Norway and the Alps. With reservoirs lagging significantly behind the 5-year average, the power sector remains heavily reliant on flexible thermal generation. Expect heightened gas-for-power sensitivity as wind generation displays its characteristic spring variability, potentially tightening the supply-demand balance faster than storage withdrawal curves imply.<\/p><p>💡 <b>Trade Ideas:<\/b><br>1. <b>Long TTF Sum-26/Win-26 spread<\/b> — accumulate to hedge slow injection if hydro deficit forces sustained gas-for-power through Q2. Entry near current levels, target €3-5 widening.<br>2. <b>Long TTF Apr-26 €65 calls<\/b> — capture potential spikes from unexpected late-season cold anomalies given 28.9% storage buffer. Premium ~€1.5-2/MWh, asymmetric upside if cold snap materializes.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>Blaise argues that current storage levels, while low, are bolstered by record-pace LNG arrivals and aggressive renewable output. He believes the market is overestimating the 'hydro void,' anticipating a rapid storage build-up once April industrial demand dips.<\/div><\/div>","sig":"Sage 🦎"},{"t":"tech","badge":"📊 📦 Storage Watch","title":"28.5% and Counting Down — Gazprom Calls Injection 'Unprofitable' as EU Eases Targets","hook":"EU storage hit 28.5% on March 21 — the lowest mid-March reading since the 2022 crisis. Gazprom declared summer injection 'unprofitable' at current prices while the EU signals flexibility on the 90% November mandate.","authorWord":"The refill math is brutal: ~70 bcm to inject in 7.5 months, from the lowest start since 2022, with Qatar offline and the Russian LNG ban in 7 days.","author":"Blaise 🧮","details":"<p><strong>EU storage<\/strong> stood at <a href='https://gmk.center/en/news/european-gas-prices-continue-to-rise-due-to-the-conflict-in-the-middle-east/' target='_blank'>28.5% full as of March 21<\/a> (AGSI+), down from 28.93% on March 17 and well below last year's 34.47% at the same date. Critical country-level data: Netherlands at just 7.7% (Bergermeer at 6.5%), Germany's Rehden facility at 19% of 42 TWh capacity. The withdrawal season is ending but storage continues to drain as late-March heating demand persists.<\/p><p><strong>The 90% mandate:<\/strong> The <a href='https://www.euronews.com/my-europe/2026/03/23/eu-pushes-early-gas-refills-while-easing-storage-targets-on-iran-war' target='_blank'>European Commission signaled flexibility<\/a> on the November 1 target, pushing for early refills while potentially lowering the 90% threshold. This is a de facto acknowledgment that the math doesn't work: reaching 90% from 28.5% requires injecting ~70 bcm over ~230 days — a pace 38% above the 5-year average injection rate, in a market where Qatar's force majeure has removed ~18 bcm/yr of supply and the April 1 Russian LNG ban eliminates another ~15 bcm/yr of spot volumes.<\/p><p><strong>US storage:<\/strong> EIA data shows working gas around 1,700-1,750 Bcf, near the 5-year average. US fundamentals are comfortable — the war premium is absent in HH precisely because domestic supply/demand is balanced heading into shoulder season. The US-EU storage divergence mirrors the price divergence.<\/p><p><a href='https://eu.news-pravda.com/world/2026/03/18/178303.html' target='_blank'>Gazprom calling summer injection 'unprofitable'<\/a> is both a statement of fact (high spot prices make storage economics unattractive) and a geopolitical signal — Moscow wants Europe to feel the squeeze. Days of supply at current demand rates: ~45-50 days for EU at winter withdrawal rates, ~90+ days at shoulder season rates.<\/p><p>💡 <b>Trade Ideas:<\/b><br>1. <b>Long TTF Win-26 outright<\/b> — if injection pace disappoints, winter prices must rise to ration demand. Entry €58-62, target €75+ by October. Conviction: HIGH.<br>2. <b>Long TTF Q3-26/Q4-26 spread<\/b> — injection failure in summer means Q4 tightness. Entry near flat, target €3-5 contango flip to backwardation.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>Henry notes that the EU's willingness to ease the 90% target is actually bearish for winter prices — if the mandate drops to 80% or 75%, the injection demand falls by 10-15 bcm, removing the most bullish price catalyst. Combined with IEA's projection of 7%+ global LNG growth in 2026, the storage picture may look better by June than the current panic implies. Don't extrapolate March's desperation into November's outcome.<\/div><\/div>","sig":"Blaise 🧮"},{"t":"alert","badge":"📊 💣 Geopolitics & Regulation","title":"Trump Blinks on Hormuz — But Iran Denies Any Talks as Day 25 Grinds On","hook":"Trump postponed his power-plant strike deadline, claiming 'productive' talks with Tehran. Iran's foreign ministry says zero contact since bombing began. The Hormuz blockade remains physically in place while the April 1 EU Russian LNG ban is now 7 days away.","authorWord":"The diplomatic noise is masking the unchanged physical reality: Hormuz is still closed, Ras Laffan is still crippled, and the April ban is still coming.","author":"Henry 🦉","details":"<p><strong>1. The Ultimatum Walkback:<\/strong> <a href='https://www.cbsnews.com/live-updates/iran-war-us-israel-trump-ultimatum-strait-of-hormuz/' target='_blank'>Trump announced Monday<\/a> he was postponing the 48-hour deadline to strike Iranian power plants, citing 'good and productive conversations.' <a href='https://www.lemonde.fr/en/international/article/2026/03/24/in-iran-trump-steps-back-from-his-own-ultimatum_6751766_4.html' target='_blank'>Le Monde and The Guardian report<\/a> that Iran categorically denies any talks since the bombing began 25 days ago. The extension buys time but changes nothing on the ground — Hormuz remains under Iranian naval control with selective passage for 'friendly' nations.<\/p><p><strong>2. Hormuz Physical Reality:<\/strong> Day 25 of the blockade. ~20% of global LNG transits Hormuz (~80 Mt/yr from Qatar, UAE, Oman). With Ras Laffan's 17% capacity offline for an estimated 3-5 years per <a href='https://www.reuters.com/business/energy/qatarenergy-declares-force-majeure-lng-contracts-2026-03-24/' target='_blank'>QatarEnergy's force majeure<\/a>, even a full Hormuz reopening doesn't restore pre-war supply. The two-tier passage regime (open for China/India, closed for Western-linked vessels) continues to fragment global LNG routes.<\/p><p><strong>3. April 1 Russian LNG Ban (T-7 days):<\/strong> The EU ban on Russian LNG spot imports takes effect in one week. This covers ~15 bcm/yr of spot volumes (long-term contracts via Yamal LNG to Zeebrugge, Montoir, and Gate are exempt). Net impact: ~5-8 bcm/yr of actual displaced volumes, as much of the 'spot' flow is really contract-linked. But the signal effect is significant — it removes optionality from an already tight market.<\/p><p><strong>4. Scenario Matrix:<\/strong><p><strong>Scenario:<\/strong> Diplomatic breakthrough / partial Hormuz reopening<br><strong>Duration:<\/strong> 1-2 weeks<br><strong>Prob:<\/strong> 15%<br><strong>TTF Impact:<\/strong> €40-45<br><\/p><p><strong>Scenario:<\/strong> Extended stalemate, selective passage continues<br><strong>Duration:<\/strong> 1-3 months<br><strong>Prob:<\/strong> 45%<br><strong>TTF Impact:<\/strong> €50-60<br><\/p><p><strong>Scenario:<\/strong> Escalation: US strikes Iranian infrastructure<br><strong>Duration:<\/strong> weeks<br><strong>Prob:<\/strong> 25%<br><strong>TTF Impact:<\/strong> €65-80<br><\/p><p><strong>Scenario:<\/strong> Full conflict: Hormuz + Gulf oil infrastructure hit<br><strong>Duration:<\/strong> months<br><strong>Prob:<\/strong> 15%<br><strong>TTF Impact:<\/strong> €80-120+<br><\/p><\/p><p><strong>5. Political Calendar:<\/strong> EU Energy Ministers meeting March 28 on emergency measures. EU Russian LNG ban effective April 1. US Congressional review of war powers April 3. OPEC+ meeting April 5 on production response.<\/p><p>💡 <b>Trade Ideas:<\/b><br>1. <b>Short TTF Apr/May spread<\/b> — if diplomatic momentum holds, the war premium drains from the front. But hedge with OTM calls for escalation tail.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>Blaise argues the market is overweighting the worst-case Hormuz scenarios. Trump's walkback is the first concrete de-escalation signal in 25 days. The 45% probability on 'extended stalemate' is too high — the economic pain on all sides (US inflation, Chinese energy costs, Gulf state revenues) creates massive incentives for a deal. Watch the April 5 OPEC+ meeting: if Saudi Arabia signals production increases to offset Iran's loss, the supply picture improves without any Hormuz resolution. Price probability-weighted TTF should be closer to €48-50, not €55.<\/div><\/div>","sig":"Henry 🦉"},{"t":"strategy","badge":"📊 🎯 Risk Flags & Outlook","title":"Three Fault Lines Persist Despite Ultimatum Relief — April Ban Is the Next Catalyst","hook":"Trump's walkback bought time but solved nothing. The three structural fault lines — Hormuz blockade, 28.5% storage, and the April 1 LNG ban — converge in exactly 7 days. The relief rally is a selling opportunity for bulls and a trap for bears.","authorWord":"The conviction trade remains long Winter-26. Everything else is noise around a structurally broken refill equation.","author":"La Rédaction 🦊","details":"<p><strong>TOP 3 RISKS (probability × impact):<\/strong><br>1. <b>April 1 Russian LNG ban + Hormuz blockade compound<\/b> (70% prob, HIGH impact) — removing ~20 bcm/yr of supply in a market already short 18 bcm from Ras Laffan. If both constraints bind simultaneously, EU injection pace falls below the minimum needed for 80% November fill.<br>2. <b>Diplomatic collapse / re-escalation<\/b> (25% prob, EXTREME impact) — Iran denies talks; Trump's walkback may be temporary. A return to strike threats sends TTF back above €60 instantly. The market gave back €6 on hope — it can add €15 on despair.<br>3. <b>Stagflation feedback loop<\/b> (60% prob, MEDIUM impact) — Euro zone PMI at near-stall, energy inflation feeding through. ECB rate response could tighten financial conditions and hit industrial gas demand, creating a deflationary offset to supply tightness.<\/p><p><strong>BULL SCENARIO:<\/strong> Hormuz talks genuinely progress (Iran opens partial passage for Western vessels), EU delays LNG ban by 3 months, mild April allows aggressive injection start. TTF to €42-45. <b>Trade:<\/b> Long TTF Sum-26/Win-26 calendar spread — capture injection constraint upside.<\/p><p><strong>BEAR SCENARIO (for prices = bearish risk):<\/strong> Trump re-escalates, US strikes Iranian power infrastructure, Iran retaliates against Gulf facilities, Hormuz fully closes to all traffic. TTF to €80-100. <b>Trade:<\/b> Long TTF Apr-26 €65/€85 call spread — entry ~€2/MWh, max payout €18/MWh. The asymmetry is extraordinary.<\/p><p><strong>WILD CARD:<\/strong> Saudi Arabia unilaterally increases oil production to crash Iran's remaining revenue, destabilizing the regime. Gas impact is indirect but oil-indexed LNG contracts (~30% of global trade) would cheapen, easing European LNG costs. <b>Trade:<\/b> Monitor for entry; this scenario is a watch, not an actionable trade today.<\/p><p><strong>CATALYSTS THIS WEEK:<\/strong><br>• March 26: Iran foreign ministry press conference on Hormuz status<br>• March 28: EU Energy Ministers emergency session<br>• April 1: EU Russian LNG spot ban effective<br>• April 3: US Congressional war powers review<br>• April 5: OPEC+ meeting on production response<\/p><p><strong>CONVICTION MATRIX:<\/strong><br>🟢 HIGHEST: Long TTF Win-26 outright (storage math structurally broken)<br>🟢 HIGH: Long TTF €55/€65 call spread Apr-26 (re-escalation tail)<br>🟡 MEDIUM: Long JKM-TTF spread (Asian competition persists)<br>🟡 MEDIUM: Short EUA Dec-26 (political reform pressure)<br>🔴 WATCH: TTF Apr €50 straddle (binary outcome priced but vol justified)<\/p><p><strong>POSITIONING CONTEXT:<\/strong> Curve in steep backwardation front-to-deferred, consistent with acute near-term supply stress. Storage at 28.5% with April ban in 7 days = market pricing crisis duration, not resolution. The €53 level is a temporary equilibrium that breaks one way or the other within days.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>Henry warns against consensus long-Winter positioning. If the EU drops the 90% mandate to 75-80%, removes 10-15 bcm of injection demand, and IEA's 7% LNG growth materializes, the curve flattens dramatically. The real risk isn't undersupply — it's that everyone is positioned the same way, creating a violent squeeze if any of the three fault lines resolves. The 2022 analogy is popular but wrong: Europe has more LNG import capacity, more demand flexibility, and more political will to act than it did then.<\/div><\/div>","sig":"La Rédaction 🦊"},{"t":"analysis","badge":"🎲 Scénarios","title":"7 Market Scenarios — Council Probability Vote","hook":"From €40 ceasefire crash to €120 Gulf infrastructure war — the Council assigns probabilities to 7 price paths for TTF over the next 2-4 weeks. The base case is a grinding range, but the tails are fat.","authorWord":"Le Conseil 🎲 — probability-weighting the fog of war.","author":"Le Conseil 🎲","details":"<div class='scenario-block'><h3>S1 — Range-Bound Grind: TTF €50-58 <span class='proba'>32%<\/span><\/h3><p>Hormuz stalemate continues, April LNG ban takes effect but is partially circumvented via contract reassignment. Storage injection starts slowly but starts. Markets oscillate on headlines without breaking range.<\/p><p class='votes'>Apex 30% · Sage 35% · Nova 32% · Blaise 34% · Lyra 30% · Dante 28% · Felix 35%<\/p><\/div><div class='scenario-block'><h3>S2 — Diplomatic Drift Lower: TTF €42-50 <span class='proba'>20%<\/span><\/h3><p>Trump's ultimatum postponement becomes permanent. De facto ceasefire-by-exhaustion. War premium slowly erodes over 2-3 weeks. Injection season begins, storage trajectory improves. Markets cautiously optimistic.<\/p><p class='votes'>Apex 22% · Sage 20% · Nova 18% · Blaise 18% · Lyra 22% · Dante 15% · Felix 25%<\/p><\/div><div class='scenario-block'><h3>S3 — Escalation Spike: TTF €60-80 <span class='proba'>20%<\/span><\/h3><p>Talks collapse, Trump reimpositions ultimatum or strikes Iranian targets. Iran retaliates against Gulf shipping. TTF spikes on supply destruction fears. Duration: days to weeks depending on severity.<\/p><p class='votes'>Apex 18% · Sage 15% · Nova 22% · Blaise 15% · Lyra 18% · Dante 28% · Felix 18%<\/p><\/div><div class='scenario-block'><h3>S4 — April Ban Shock: TTF €55-65 <span class='proba'>12%<\/span><\/h3><p>Russian LNG ban takes effect cleanly on April 1. Market underestimates the spot volume loss. Combined with Ras Laffan offline, injection season starts from a supply deficit. TTF grinds higher on physical tightness.<\/p><p class='votes'>Apex 12% · Sage 12% · Nova 14% · Blaise 15% · Lyra 10% · Dante 12% · Felix 9%<\/p><\/div><div class='scenario-block'><h3>S5 — Storage Panic: TTF €65-85 <span class='proba'>8%<\/span><\/h3><p>By late April, injection pace is clearly insufficient. Market realizes 90% November target is impossible even at reduced levels. Panic buying begins. Governments invoke emergency measures. Echoes of summer 2022.<\/p><p class='votes'>Apex 8% · Sage 8% · Nova 7% · Blaise 8% · Lyra 10% · Dante 10% · Felix 5%<\/p><\/div><div class='scenario-block'><h3>S6 — Gulf Infrastructure War: TTF €80-120+ (Extreme Bull) <span class='proba'>5%<\/span><\/h3><p>Iran strikes Saudi/UAE oil and gas infrastructure. Oil spikes above $130. Oil-indexed LNG contracts surge. Energy crisis goes global. TTF enters 2022-like regime. Demand destruction becomes the only balancing mechanism.<\/p><p class='votes'>Apex 5% · Sage 4% · Nova 5% · Blaise 5% · Lyra 6% · Dante 5% · Felix 5%<\/p><\/div><div class='scenario-block'><h3>S7 — Ceasefire Crash: TTF €28-38 (Extreme Bear) <span class='proba'>3%<\/span><\/h3><p>Surprise full ceasefire. Hormuz reopens. QatarEnergy begins repair timeline. Market overshoots to downside as war premium evaporates entirely. Massive short squeeze followed by gradual recovery as structural damage (Ras Laffan 3-5yr repair) is repriced.<\/p><p class='votes'>Apex 5% · Sage 6% · Nova 2% · Blaise 5% · Lyra 4% · Dante 2% · Felix 3%<\/p><\/div><p class='consensus'><strong>🎯 Consensus:<\/strong> Probability-weighted TTF = ~€56/MWh. The Council sees a slight negative skew — more paths lead to €50-60 than to extremes. But the fat tails (S5+S6 = 13% probability of €65-120+) mean the risk-adjusted positioning favors long convexity over outright direction.<\/p><div class='dissent'><div class='dissent-label'>🔥 Dissent — Dante 🔥<\/div><div class='dissent-text'>The probability-weighted price understates risk because it treats scenarios as independent. S3 (escalation) naturally leads to S5 (storage panic) which feeds S6 (infrastructure war). The conditional probability of S5 given S3 is >40%, not the unconditional 8%. The real distribution is bimodal: either we grind (55%) or we cascade (30%). The middle scenarios (S2, S4) are unstable equilibria, not landing zones.<\/div><\/div>","sig":"Le Conseil 🎲"},{"t":"analysis","badge":"📊 🌍 Scénario Géopolitique","title":"Day 25: The Ultimatum Mirage — 7 Geopolitical Scenarios for Gas Markets","hook":"Trump's walkback is the first crack in 25 days of escalation, but Iran denies any contact. The Council maps 7 real-world scenarios from diplomatic breakthrough to Gulf-wide infrastructure war — each with direct gas price implications.","authorWord":"Le Conseil 🌍 — mapping the geopolitical tree from Hormuz to your P&L.","author":"Le Conseil 🌍","details":"<div class='scenario-block'><h3>S1 — Extended Stalemate: Selective Hormuz Persists <span class='proba'>30%<\/span><\/h3><p>Iran maintains two-tier Hormuz passage (open for China/India, closed for Western vessels) for 2-4 more months. No direct US strikes on Iranian power infrastructure. QatarEnergy force majeure remains in effect. TTF ranges €48-58, with periodic spikes on headline risk.<\/p><p class='votes'>Apex 28% · Sage 32% · Nova 30% · Blaise 35% · Lyra 28% · Dante 25% · Felix 32%<\/p><\/div><div class='scenario-block'><h3>S2 — Diplomatic Pause: Trump Extends Deadline Repeatedly <span class='proba'>22%<\/span><\/h3><p>Trump continues postponing his ultimatum, claiming progress while Iran denies talks. A de facto freeze emerges — no escalation but no resolution. Markets slowly price out the war premium. TTF drifts to €45-50 over 2-3 weeks.<\/p><p class='votes'>Apex 25% · Sage 20% · Nova 22% · Blaise 18% · Lyra 24% · Dante 20% · Felix 25%<\/p><\/div><div class='scenario-block'><h3>S3 — US Strikes Iranian Power Grid <span class='proba'>18%<\/span><\/h3><p>Trump re-imposes ultimatum and follows through on power plant strikes. Iran retaliates with missile attacks on Gulf infrastructure. Immediate TTF spike to €70-80, with sustained elevated prices for weeks.<\/p><p class='votes'>Apex 18% · Sage 15% · Nova 20% · Blaise 15% · Lyra 18% · Dante 22% · Felix 18%<\/p><\/div><div class='scenario-block'><h3>S4 — Partial Hormuz Reopening via Back-Channel Deal <span class='proba'>12%<\/span><\/h3><p>Oman or Qatar mediates a quiet arrangement: Iran allows limited Western-flagged tanker passage in exchange for sanctions relief signal. Hormuz partially reopens. TTF drops sharply to €38-42. QatarEnergy force majeure partially lifted for non-damaged trains.<\/p><p class='votes'>Apex 12% · Sage 15% · Nova 10% · Blaise 12% · Lyra 14% · Dante 8% · Felix 13%<\/p><\/div><div class='scenario-block'><h3>S5 — EU Delays Russian LNG Ban <span class='proba'>8%<\/span><\/h3><p>Under extreme supply pressure, EU delays or softens the April 1 Russian LNG ban. Political backlash from Eastern European states forces a 3-6 month extension. TTF eases €3-5 on the news. A relief valve that buys time for injection season.<\/p><p class='votes'>Apex 7% · Sage 8% · Nova 8% · Blaise 10% · Lyra 6% · Dante 10% · Felix 7%<\/p><\/div><div class='scenario-block'><h3>S6 — Iran Retaliates Against Saudi Oil Infrastructure (Extreme Bull) <span class='proba'>6%<\/span><\/h3><p>Iran strikes Abqaiq or Ras Tanura, triggering oil supply disruption alongside existing gas crisis. Brent spikes above $130, oil-indexed LNG contracts surge. TTF to €90-120 as global energy crisis compounds. Historical analogy: 2019 Abqaiq attack caused 50% Brent spike.<\/p><p class='votes'>Apex 5% · Sage 4% · Nova 6% · Blaise 5% · Lyra 6% · Dante 10% · Felix 6%<\/p><\/div><div class='scenario-block'><h3>S7 — Full Ceasefire Within 2 Weeks (Extreme Bear) <span class='proba'>4%<\/span><\/h3><p>Surprise ceasefire brokered by China/Russia. Iran reopens Hormuz immediately, US withdraws strike forces. TTF crashes to €30-35 — back to pre-war levels. QatarEnergy begins repair timeline. Massive short squeeze in energy markets.<\/p><p class='votes'>Apex 5% · Sage 6% · Nova 4% · Blaise 5% · Lyra 4% · Dante 5% · Felix 1%<\/p><\/div><p class='consensus'><strong>🎯 Consensus:<\/strong> The Council converges on extended stalemate (S1 + S2 = 52% combined) as the base case — neither side has incentive to escalate or capitulate in the near term. The gas market will remain hostage to headline risk with €48-58 as the likely range.<\/p><div class='dissent'><div class='dissent-label'>🔥 Contre-narratif — Dante 🔥<\/div><div class='dissent-text'>The Council underweights escalation risk. Trump's walkback is weakness, not diplomacy — Iran will read it as permission to harden the blockade. The 18% on S3 should be 25%+. And the 4% on full ceasefire is fantasy: there is no diplomatic channel, no mediator with leverage, and no face-saving exit for either side. The real binary is S1 (grind) vs S3 (escalation), everything else is noise.<\/div><\/div>","sig":"Le Conseil 🌍"},{"t":"analysis","badge":"🏛️ Verdict du Conseil","title":"21 Trades Audités — 13 Retenus, 8 Éliminés","hook":"Quatre agents ont vote sur chaque trade idea de cette edition. Chaque trade est presente avec son rationale complet, les votes individuels (Iris, Dante, Felix, Lyra), et la decision finale avec la raison.","authorWord":"13 trades solides retenus. 8 elimines (doublons, parametres manquants, contradictions). Le detail de chaque verdict ci-dessous.","author":"La Rédaction 🦊","details":"<h3>✅ Trades Retenus (13/21)<\/h3><div><div><div><b>Long TTF Apr €55/€65 call spread<\/b><span>✅⚠️✅✅<\/span><\/div><div>Carte price-action • T1<\/div><\/div><div>3✅ 1⚠️ — 3 approve, 1 amend. Well-framed re-escalation hedge.<\/div><\/div><div><div><div><b>Short HH / Long TTF spread<\/b><span>⚠️❌✅✅<\/span><\/div><div>Carte price-action • T2<\/div><\/div><div>2 plomatic hedge.<\/div><\/div><div><div><div><b>Long TTF Apr €65/€85 call spread<\/b><span>✅⚠️✅⚠️<\/span><\/div><div>Carte risk-outlook • T19<\/div><\/div><div>2✅ 2⚠️ — 2 approve, 2 amend. Kept with tightened strikes to €60/€75.<\/div><\/div><h3>❌ Trades Éliminés (8/21)<\/h3><div><div><div><b>Long DE baseload/short TTF Cal-27<\/b><span>⚠️⚠️⚠️❌<\/span><\/div><div>Carte power-carbon • T9<\/div><\/div><div>❌ 3 amend, 1 reject. Eliminated: too complex, unclear thesis for gas brief.<\/div><div>0✅ 3⚠️ 1❌<\/div><\/div><div><div><div><b>Long TTF Sum/Win-26 spread<\/b><span>❌❌❌❌<\/span><\/div><div>Carte weather-demand • T10<\/div><\/div><div>❌ Unanimous reject. Exact duplicate of T5.<\/div><div>0✅ 4❌<\/div><\/div><div><div><div><b>Long TTF Apr/May spread<\/b><span>✅⚠️✅❌<\/span><\/div><div>Carte storage-watch • T14<\/div><\/div><div>❌ Contradicts T17. Eliminated to resolve conflict.<\/div><div>2✅ 1⚠️ 1❌<\/div><\/div><div><div><div><b>Long TTF Apr €60/€75 call spread<\/b><span>✅❌⚠️❌<\/span><\/div><div>Carte geopolitics • T15<\/div><\/div><div>❌ 2 reject. Contradicts current de-escalation signal from Trump walkback.<\/div><div>1✅ 1⚠️ 2❌<\/div><\/div><div><div><div><b>Long TTF Win-26 above €58<\/b><span>❌❌❌❌<\/span><\/div><div>Carte geopolitics • T16<\/div><\/div><div>❌ Unanimous reject. Duplicate of T12.<\/div><div>0✅ 4❌<\/div><\/div><div><div><div><b>Sell TTF Apr €55c / Buy €45p<\/b><span>⚠️⚠️⚠️❌<\/span><\/div><div>Carte risk-outlook • T18<\/div><\/div><div>❌ 3 amend, 1 reject. Eliminated: mislabelled structure (bearish reversal, not bull hedge).<\/div><div>0✅ 3⚠️ 1❌<\/div><\/div><div><div><div><b>Long Brent put + TTF put<\/b><span>⚠️❌⚠️❌<\/span><\/div><div>Carte risk-outlook • T20<\/div><\/div><div>❌ 2 reject, 2 amend. Eliminated: mixed oil/gas with unclear catalyst.<\/div><div>0✅ 2⚠️ 2❌<\/div><\/div><div><div><div><b>Long TTF Win-26 outright<\/b><span>❌❌❌❌<\/span><\/div><div>Carte risk-outlook • T21<\/div><\/div><div>❌ Unanimous reject. Triplicate of T12.<\/div><div>0✅ 4❌<\/div><\/div><h3>💬 Le Conseil Parle<\/h3><div><div>Dante 🔥<\/div><div>Portfolio is dangerously long TTF — if Trump diplomacy produces a ceasefire, the entire book unwinds violently. HH near $2.92 floor makes T2 asymmetric against the thesis. Straddle expensive post-vol spike.<\/div><\/div><div><div>Iris 👁️<\/div><div>Strong overall quality but several trades lack specific entry levels and spread ratios. Three duplicates flagged (T10, T16, T21). Amends needed for T2, T6, T7 position sizing.<\/div><\/div><div><div>Felix 🐱<\/div><div>Good diversity of instruments (spreads, options, outright) but 5 April TTF options trades is too many for one edition. Consolidate to 2-3 max. T14/T17 contradiction hurts credibility. Duplicates are lazy.<\/div><\/div><div><div>Lyra 🎵<\/div><div>Core thesis coherent: bullish TTF on injection constraint + Ras Laffan + LNG ban. Over-concentrated in Win-26 tenor. Top 5: T2, T5, T7, T12, T13. Worst 5: T10/T16/T21 (duplicates), T15, T18. Need bearish hedges to balance skew.<\/div><\/div>","sig":"La Rédaction 🦊 · Conseil de Rédaction"},{"t":"end","end":true,"disclaimer":"⚠️ AVERTISSEMENT — Ce document est un exercice expérimental de veille automatisée produit par intelligence artificielle. Il ne constitue EN AUCUN CAS un conseil en investissement, une recommandation de trading, ni une analyse financière réglementée au sens de la directive MiFID II ou du Code monétaire et financier (art. L541-1). Les « scénarios de marché » présentés sont des hypothèses pédagogiques générées par des modèles de langage — ils ne reflètent pas l'avis d'un professionnel agréé. Les données proviennent de sources publiques, potentiellement retardées ou erronées. Toute décision d'investissement prise sur la base de ce document relève de la seule responsabilité du lecteur. L'auteur n'est pas enregistré comme Conseiller en Investissement Financier (CIF) auprès de l'AMF. Ce contenu est fourni à titre informatif et expérimental uniquement."}];

        <div class="end-content">
          <div class="em">🎉</div>
          <h2>Briefing terminé !</h2>
          <p>Vous avez parcouru le briefing du jour.<br>À demain !</p>
          <a href="../index.html" style="display:inline-block;padding:12px 32px;border:none;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;box-shadow:0 0 25px rgba(59,130,246,.4);margin-bottom:12px;">📰 Toutes les éditions</a><br><button id="restart">🔄 Recommencer</button>
          ${d.disclaimer ? '<div style="margin-top:20px;padding:14px 16px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);border-radius:10px;font-size:.7rem;color:var(--muted);line-height:1.5;text-align:left;">'+d.disclaimer+'</div>' : ''}
          <small>← Swipez à gauche pour revenir</small>
        </div>`;
    } else {
      const authorWordHtml = d.authorWord ? `<div class="author-word"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author}</div></div>` : '';
      c.innerHTML = `
        <div class="hdr"><span class="badge ${d.t}">${d.badge}</span><div class="dots">${dots(i)}</div></div>
        <div class="title-zone"><h1>${d.title}</h1></div>
        <div class="scroll-cta"><span><i>↓</i> Lire plus</span></div>
        <div class="scroll-zone"><div class="scroll-inner">
          ${authorWordHtml}
          <div class="hook">${d.hook}</div>
          <div class="details">${d.details}<div class="sig">Gas Morning Brief — 25 Mars 2026</div></div>
        </div></div>`;
    }
    deck.appendChild(c);
  });

  function dots(active) { let s=''; for(let i=0;i<total;i++) s+=`<span class="dot${i===active?' on':''}"></span>`; return s; }
  const cards = deck.querySelectorAll('.card');
  function update(anim=true) {
    cards.forEach((c,i)=>{
      c.classList.toggle('anim',anim);
      c.classList.remove('prev','active','next','behind'); c.style.opacity='';
      if(i===cur)c.classList.add('active'); else if(i===cur+1||i===cur-1)c.classList.add('behind'); else if(i<cur)c.classList.add('prev'); else c.classList.add('next');
      c.style.transform='';
      c.querySelectorAll('.dot').forEach((d,j)=>d.classList.toggle('on',j===cur));
    });
  }
  function go(i){if(i>=0&&i<total){cur=i;update();}}
  const dateKey="Gas Morning Brief-25-Mars-2026";
  if(!localStorage.getItem(dateKey)){setTimeout(()=>{hint.classList.add('hide');localStorage.setItem(dateKey,'1');},2000);}else hint.style.display='none';
  
  document.querySelectorAll('.scroll-zone, .home-content').forEach(function(sz){
    var card = sz.closest('.card');
    if(!card) return;
    sz.addEventListener('scroll', function(){
      card.classList.toggle('scrolled', sz.scrollTop > 10);
    }, {passive:true});
  });
  let startY=0,axis='';
  document.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY;startTime=Date.now();deltaX=0;axis='';dragging=true;cards[cur].classList.remove('anim');},{passive:true});
  document.addEventListener('touchmove',e=>{if(!dragging)return;const dx=e.touches[0].clientX-startX;const dy=e.touches[0].clientY-startY;if(!axis){if(Math.abs(dx)>8||Math.abs(dy)>8){axis=Math.abs(dx)>Math.abs(dy)?'x':'y';}else return;}if(axis==='y')return;deltaX=dx;cards[cur].style.transform=`translate(-50%,-50%) translateX(${deltaX}px) rotate(${deltaX*0.012}deg)`;var p=Math.min(Math.abs(deltaX)/200,1);var sc=0.93+p*0.07;var op=0.4+p*0.6;var nxt=deltaX<0?cards[cur+1]:cards[cur-1];if(nxt){nxt.style.transform='translate(-50%,-50%) scale('+sc+')';nxt.style.opacity=op;}},{passive:true});
  document.addEventListener('touchend',e=>{if(!dragging)return;dragging=false;if(axis==='y'){axis='';return;}axis='';const card=cards[cur];card.classList.add('anim');if(cards[cur+1])cards[cur+1].classList.add('anim');if(cards[cur-1])cards[cur-1].classList.add('anim');const velocity=Math.abs(deltaX)/(Date.now()-startTime);const threshold=velocity>0.5?30:60;if(deltaX>threshold&&cur===0){window.location.href='../index.html';}else if(deltaX<-threshold&&cur===total-1){window.location.href='../index.html';}else if(deltaX<-threshold&&cur<total-1){cur++;update();}else if(deltaX>threshold&&cur>0){cur--;update();}else{card.style.transform='';}},{passive:true});
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&cur<total-1){cur++;update();}if(e.key==='ArrowLeft'&&cur>0){cur--;update();}});
  document.addEventListener('click',e=>{if(e.target.id==='restart')go(0);const article=e.target.closest('.home-article');if(article){const idx=parseInt(article.dataset.goto);if(!isNaN(idx))go(idx);}});
  /* === DESKTOP SPLIT-VIEW === */
  let dtShell=null, dtSelected=0;
  function buildDesktop(){
    if(dtShell)return;
    dtShell=document.createElement('div');
    dtShell.className='desktop-shell';
    // Sidebar
    const sb=document.createElement('nav');
    sb.className='dt-sidebar';
    const logoDate=DATA[0]&&DATA[0].home?`<div class="dt-logo">Gas Morning Brief</div><div class="dt-date">${DATA[0].date||'25 Mars 2026'}</div>`:`<div class="dt-logo">Gas Morning Brief</div><div class="dt-date">25 Mars 2026</div>`;
    sb.innerHTML=logoDate;
    DATA.forEach((d,i)=>{
      const item=document.createElement('div');
      item.className='dt-nav-item'+(i===0?' dt-selected':'');
      item.tabIndex=0;
      item.dataset.idx=i;
      const emoji=d.home?'📰':d.end?'✅':(d.badge||'').split(' ')[0]||'📄';
      const label=d.home?'Accueil':d.end?'Fin':(d.badge||'').split(' ').slice(1).join(' ')||'';
      const title=d.home?'Sommaire':d.end?'Briefing terminé':d.title||'';
      item.innerHTML=`<div class="dt-nav-badge">${emoji}</div><div class="dt-nav-info"><div class="dt-nav-label">${label}</div><div class="dt-nav-title">${title}</div></div><div class="dt-nav-arrow">›</div>`;
      item.addEventListener('click',()=>selectDesktop(i));
      sb.appendChild(item);
    });
    // Reader
    const rd=document.createElement('div');
    rd.className='dt-reader';
    rd.innerHTML='<div class="dt-reader-inner"></div>';
    dtShell.appendChild(sb);
    dtShell.appendChild(rd);
    document.body.appendChild(dtShell);
    selectDesktop(0);
  }
  function selectDesktop(idx){
    dtSelected=idx;
    const items=dtShell.querySelectorAll('.dt-nav-item');
    items.forEach((it,i)=>it.classList.toggle('dt-selected',i===idx));
    const d=DATA[idx];
    const inner=dtShell.querySelector('.dt-reader-inner');
    if(d.home){
      const arts=d.articles?d.articles.map(a=>`<div class="dt-nav-item" style="cursor:pointer;opacity:.7;padding:10px 14px;margin-bottom:4px;border-radius:10px;border:1px solid rgba(255,255,255,.06);" onclick="selectDesktop(${a.idx})"><div class="dt-nav-badge">${a.badge.split(' ')[0]}</div><div class="dt-nav-info"><div class="dt-nav-label">${a.badge.split(' ').slice(1).join(' ')}</div><div class="dt-nav-title">${a.title}</div></div><div class="dt-nav-arrow">›</div></div>`).join(''):'';
      inner.innerHTML=`<div class="dt-r-home-henry"><div class="label">🦊 L'Édito du Jour</div><div class="text">${d.henryWord||''}</div></div>${arts}`;
    } else if(d.end){
      inner.innerHTML=`<div style="text-align:center;padding:60px 0;"><div style="font-size:3.5rem;margin-bottom:16px;">🎉</div><h2 style="font-size:1.6rem;font-weight:800;margin-bottom:12px;">Briefing terminé !</h2><p style="color:var(--muted);font-size:1rem;margin-bottom:24px;line-height:1.5;">Vous avez parcouru le briefing du jour. À demain !</p><a href="../index.html" style="display:inline-block;padding:12px 32px;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;">📰 Toutes les éditions</a></div>`;
    } else {
      const authorHtml=d.authorWord?`<div class="dt-r-author"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author||''}</div></div>`:'';
      inner.innerHTML=`<span class="dt-r-badge ${d.t||''}">${d.badge||''}</span><h1 class="dt-r-title">${d.title||''}</h1>${authorHtml}<div class="dt-r-hook">${d.hook||''}</div><div class="dt-r-body">${d.details||''}</div><div class="dt-r-sig">Gas Morning Brief — 25 Mars 2026</div>`;
    }
    dtShell.querySelector('.dt-reader').scrollTop=0;
    // Scroll sidebar item into view
    items[idx]&&items[idx].scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  function destroyDesktop(){
    if(dtShell){dtShell.remove();dtShell=null;}
  }
  function checkDesktop(){
    if(window.innerWidth>=900){
      deck.style.display='none';
      buildDesktop();
      dtShell.style.display='';
    } else {
      if(dtShell)dtShell.style.display='none';
      deck.style.display='';
      update(false);
    }
  }
  // Keyboard nav for desktop
  document.addEventListener('keydown',e=>{
    if(window.innerWidth<900)return;
    if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();if(dtSelected<DATA.length-1)selectDesktop(dtSelected+1);}
    if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();if(dtSelected>0)selectDesktop(dtSelected-1);}
  });
  checkDesktop();window.addEventListener('resize',checkDesktop);
  // Theme toggle
  (function(){
    const btn=document.getElementById('themeToggle');
    const saved=localStorage.getItem('theme');
    if(saved==='light'){document.documentElement.classList.add('light');btn.textContent='☀️';}
    btn.addEventListener('click',()=>{
      const isLight=document.documentElement.classList.toggle('light');
      btn.textContent=isLight?'☀️':'🌙';
      localStorage.setItem('theme',isLight?'light':'dark');
    });
  })();
  </script>
</body>
</html>
