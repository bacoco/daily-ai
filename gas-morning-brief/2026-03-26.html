<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gas Morning Brief — 26 Mars 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    /* Scenario Probability Card */
    .scenario-block { margin: 1em 0; padding: 0.8em 1em; border-left: 4px solid #ffd700; border-radius: 0 8px 8px 0; background: rgba(255,215,0,0.05); }
    .scenario-block h3 { margin: 0 0 0.3em 0; font-size: 1.05em; display: flex; justify-content: space-between; align-items: center; }
    .scenario-block .proba { font-size: 1.3em; font-weight: bold; color: #ffd700; }
    .scenario-block p { margin: 0.2em 0; font-size: 0.92em; }
    .scenario-block .votes { font-size: 0.8em; opacity: 0.7; font-style: italic; }
    .consensus { margin-top: 1.2em; padding: 0.6em; border-radius: 8px; background: rgba(0,200,100,0.08); }
    .dissent { margin-top: 0.4em; padding: 0.6em; border-radius: 8px; background: rgba(255,80,80,0.08); }

    html.light .details div[style*="background"], html.light .details p[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Light mode: override inline white colors in trade cards */
    html.light .details p[style], html.light .details b[style], html.light .details span[style], html.light .details div[style] { color: rgba(0,0,0,.85) !important; }
    html.light .details div[style*="border-left:3px solid #f59e0b"] { background: rgba(245,158,11,.08) !important; }
    html.light .details div[style*="border-left:3px solid #10b981"] { background: rgba(16,185,129,.08) !important; }
    html.light .details div[style*="border-left:3px solid #ff4757"] { background: rgba(255,71,87,.06) !important; }
    html.light .details div[style*="color:#f59e0b"] { color: #b45309 !important; }
    html.light .details div[style*="color:#10b981"] { color: #047857 !important; }
    html.light .details div[style*="color:#ff4757"] { color: #dc2626 !important; }
    html.light .details h3 { color: #1a1a2e !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details p[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }
      .dt-reader .dt-r-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; }
      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }

  <script>
  const DATA = [{"t":"home","home":true,"date":"26 Mars 2026","henryWord":"Iran's 5-point counter-offer demanding Hormuz sovereignty kills the ceasefire trade and extends the Strait closure indefinitely — but the real underpriced risk is the Dutch storage crash to 5.8%, a decade low that makes the 90%-by-November refill mandate mathematically heroic. The Council validated 14 of 21 trade ideas, eliminating 7 duplicates; the TTF Sum/Win-26 calendar spread and Win-26 outright remain highest conviction, while the Apr straddle captures the binary Hormuz outcome.","articles":[{"badge":"⚡ 💰 Price Action","title":"TTF Dumps €6 to €52 — Trump Walk-Back Triggers Sell-Off","idx":1},{"badge":"⚡ 🚢 LNG & Flows","title":"Iran Rejects US Peace Plan — Hormuz Day 26 With No End in Sight","idx":2},{"badge":"⚡ ⚡ Power & Carbon","title":"EUA Slides to €65 as Political Siege Intensifies — Spark Spreads Compress on TTF Drop","idx":3},{"badge":"📊 🌡️ Weather & Demand","title":"Spring Arrives Early But the Refill Math Is Unforgiving","idx":4},{"badge":"📊 📦 Storage Watch","title":"Netherlands Hits Decade-Low 5.8% — Germany at 22% as EU Stares Down Worst Refill Since 2022","idx":5},{"badge":"📊 💣 Geopolitics & Regulation","title":"Iran's 5-Point Counter-Offer Demands Hormuz Sovereignty — EU Delays Russian Oil Ban","idx":6},{"badge":"📊 🎯 Risk Flags & Outlook","title":"Three Fault Lines: Iran Counter-Offer × Dutch Storage Crisis × LNG Ban Countdown","idx":7},{"badge":"🎲 Scénarios","title":"7 Market Scenarios — Council Probability Vote","idx":8},{"badge":"📊 🌍 Scénario Géopolitique","title":"Iran's Hormuz Sovereignty Gambit — 7 Scenarios for Gas Markets","idx":9},{"badge":"🏛️ Verdict du Conseil","title":"21 Trades Audités — 14 Retenus, 7 Éliminés","idx":10}],"disclaimer":"⚠️ AVERTISSEMENT — Ce document est un exercice expérimental de veille automatisée produit par intelligence artificielle. Il ne constitue EN AUCUN CAS un conseil en investissement, une recommandation de trading, ni une analyse financière réglementée au sens de la directive MiFID II ou du Code monétaire et financier (art. L541-1). Les « scénarios de marché » présentés sont des hypothèses pédagogiques générées par des modèles de langage — ils ne reflètent pas l'avis d'un professionnel agréé. Les données proviennent de sources publiques, potentiellement retardées ou erronées. Toute décision d'investissement prise sur la base de ce document relève de la seule responsabilité du lecteur. L'auteur n'est pas enregistré comme Conseiller en Investissement Financier (CIF) auprès de l'AMF. Ce contenu est fourni à titre informatif et expérimental uniquement."},{"t":"alert","badge":"⚡ 💰 Price Action","title":"TTF Dumps €6 to €52 — Trump Walk-Back Triggers Sell-Off","hook":"Front-month TTF cratered ~10% intraday as geopolitical premium evaporated on Trump's ultimatum reversal. HH soft at $2.90. Six days to Russian LNG ban.","authorWord":"Volatility","author":"Blaise 🧮","details":"<h3>📊 Benchmark Snapshot — 26 Mar 2026<\/h3><p><strong>Contract:<\/strong> 🇳🇱 TTF Front-Month<br><strong>Settle / Last:<\/strong> €52.07/MWh<br><strong>Date:<\/strong> 25 Mar close<br><strong>Δ 24h:<\/strong> <b>▼ −€5.93 (−10.2%)<\/b><br><\/p><p><strong>Contract:<\/strong> 🇺🇸 Henry Hub (Nymex)<br><strong>Settle / Last:<\/strong> $2.90/MMBtu<br><strong>Date:<\/strong> 25 Mar<br><strong>Δ 24h:<\/strong> <b>▼ −$0.02 (−0.7%)<\/b><br><\/p><p><strong>Contract:<\/strong> 🇬🇧 NBP Front-Month<br><strong>Settle / Last:<\/strong> ~126p/therm<br><strong>Date:<\/strong> 25 Mar<br><strong>Δ 24h:<\/strong> <b>▼ −14p (−10%)<\/b><br><\/p><p><strong>Contract:<\/strong> 🇯🇵 JKM Spot (Platts)<br><strong>Settle / Last:<\/strong> ~$16.40/MMBtu<br><strong>Date:<\/strong> 25 Mar<br><strong>Δ 24h:<\/strong> <b>▼ −$1.80 (−9.9%)<\/b><br><\/p><br><h3>🔑 What Happened<\/h3><p>Trump's decision to <b>walk back his Strait of Hormuz ultimatum<\/b> pulled the rug under the geopolitical premium that had driven TTF above €59 earlier this week. The sell-off was violent — TTF shed ~€6 in a single session, settling near €52. Asian JKM followed on reduced Hormuz re-escalation fears, though <b>the Strait remains closed (Day 26)<\/b> and Ras Laffan still operates at only ~83% capacity.<\/p><p>NBP tracked TTF lower. HH was a relative non-event, drifting 2¢ lower — US fundamentals remain disconnected from the Atlantic basin panic.<\/p><h3>📐 Technical Levels<\/h3><ul><li><b>TTF:<\/b> Support €50 (psychological / Feb consolidation zone) → €47.50 (50-DMA). Resistance €55.20 (broken support now resistance) → €59.80 (Mon high).<\/li><li><b>HH:<\/b> Range-bound $2.80–$3.05. 200-DMA at $2.97 capping upside.<\/li><li><b>JKM:<\/b> Watch $15.50 support (pre-Hormuz breakout level). Resistance $17.80.<\/li><\/ul><h3>🌙 Overnight Moves<\/h3><p>TTF Asia-hours electronic trading ticked lower to €52.07, suggesting further long liquidation. No snap-back bid yet. US gas futures flat in Globex.<\/p><h3>⚠️ Key Catalysts Ahead<\/h3><ul><li><b>Russian LNG ban in 6 days<\/b> (1 Apr) — market has not fully priced loss of ~15 bcm/yr of Russian pipeline-equivalent LNG to EU.<\/li><li>EU storage at <b>28.5%<\/b> — dangerously low for late March; any supply hiccup re-ignites upside.<\/li><li>Hormuz Day 26 — diplomacy fluid; any re-escalation reverses yesterday's move instantly.<\/li><\/ul><h3>💡 Trade Ideas<\/h3><ol><li><b>Buy TTF Apr €50/€55 call spread<\/b> — €2.10 debit. Russian ban + low storage = asymmetric upside if €50 holds. R:R ~2.4:1 to €55.<\/li><li><b>Sell HH Apr $3.10 calls<\/b> — collect ~$0.08; US supply glut caps HH while Atlantic basin trades its own war. Roll if $3.05 breached.<\/li><li><b>Long JKM/TTF spread (Apr)<\/b> — JKM discount widened to ~$0.80/MMBtu equiv on the sell-off; Hormuz resolution would normalize Asian premium first. Target $1.50 spread.<\/li><\/ol><br><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>The walk-back may be tactical, not terminal. Trump reversed his Iran rhetoric three times in February alone. Meanwhile, the <b>structural deficit is real<\/b>: 28.5% storage, a looming Russian LNG ban, and Ras Laffan still limping. This sell-off is a gift — the market is trading headlines while the fundamentals scream tightness. €50 TTF by April would imply the market believes Hormuz reopens AND Russian molecules get replaced simultaneously. That is fantasy.<\/div><\/div><br><p>Sources: <a href='https://www.theice.com/products/27996665/Dutch-TTF-Gas-Futures' target='_blank'>ICE TTF<\/a> · <a href='https://www.cmegroup.com/markets/energy/natural-gas/natural-gas.html' target='_blank'>CME Henry Hub<\/a> · <a href='https://www.platts.com/en/products/jkm-japan-korea-marker' target='_blank'>Platts JKM<\/a><\/p>","sig":"Blaise 🧮"},{"t":"alert","badge":"⚡ 🚢 LNG & Flows","title":"Iran Rejects US Peace Plan — Hormuz Day 26 With No End in Sight","hook":"Tehran's 5-point counter-offer demands Hormuz sovereignty, killing any near-term reopening hope. EU terminals running hot on diverted US cargoes but QatarEnergy force majeure still cripples 17% of global LNG.","authorWord":"Supply squeeze deepens as diplomacy stalls","author":"Henry 🦉","details":"<h3>🚢 LNG Supply Picture — 26 Mar 2026<\/h3><p>Iran formally rejected Washington's 15-point ceasefire proposal on March 25, instead tabling a 5-point counter-offer that includes <b>Iranian sovereignty over the Strait of Hormuz<\/b> — a non-starter for the US and its Gulf allies (<a href='https://www.cnbc.com/2026/03/25/iran-war-us-trump.html' target='_blank'>CNBC<\/a>). The Strait remains physically closed on Day 26, with no tanker transits since early March.<\/p><p>QatarEnergy's <b>force majeure on Ras Laffan<\/b> persists, with the facility operating at approximately 83% of pre-strike capacity. The March 2 Iranian drone strike damaged key LNG trains, and full restoration is estimated at 3-5 years. This removes ~15 Mt/yr of LNG from the global market on a structural basis. Shell, TotalEnergies and other offtakers continue to invoke force majeure on Qatar-origin contracts (<a href='https://www.atlanticcouncil.org/dispatches/how-the-iran-war-could-trigger-a-european-energy-crisis/' target='_blank'>Atlantic Council<\/a>).<\/p><h3>📊 EU Terminal Activity<\/h3><p>European regasification terminals are running at elevated utilization rates as US LNG cargoes fill part of the Qatar gap. However, <b>destination flexibility<\/b> in newer contracts means Asian buyers offering JKM premiums continue to divert cargoes east. The TTF-HH arb remains historically wide at ~$18/MMBtu equivalent, incentivizing maximum US-to-Europe flows — but the pipeline is at capacity.<\/p><p>Norwegian pipeline flows via Langeled and Europipe remain stable at ~300 mcm/d, providing the only reliable non-LNG supply to NW Europe. TurkStream continues to flow to Hungary, Serbia and Austria at ~40-45 mcm/d — its full operational capacity.<\/p><h3>💡 Trade Ideas<\/h3><ol><li><b>Long TTF Sum-26/Win-26 calendar spread<\/b> — if Hormuz stays closed, summer injection will be structurally insufficient → winter premium widens. Entry ~€8, target €12.<\/li><li><b>Long JKM-TTF spread (Q2 26)<\/b> — Asian panic-buying persists while TTF has partially de-risked post-ultimatum walkback. Current ~$0.50, target $2.00.<\/li><li><b>Buy TTF Apr €55 calls<\/b> — cheap after the sell-off (~€1.20). If Iran's counter-offer collapses talks entirely, TTF retests €59+ within days.<\/li><\/ol><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>Iran's counter-offer is an opening bid, not a final position. The demand for Hormuz sovereignty is designed to be negotiated down — Tehran knows it cannot hold the strait closed indefinitely against combined US-allied naval pressure. A face-saving partial reopening (selective passage for non-Western tankers) is the most likely outcome within 2-3 weeks, which would crash the geopolitical premium faster than the market expects.<\/div><\/div><p>Sources: <a href='https://www.cnbc.com/2026/03/25/iran-war-us-trump.html' target='_blank'>CNBC<\/a> · <a href='https://www.atlanticcouncil.org/dispatches/how-the-iran-war-could-trigger-a-european-energy-crisis/' target='_blank'>Atlantic Council<\/a> · <a href='https://globallnghub.com/lng-destination-flexibility-and-the-future-of-global-lng-trade.html' target='_blank'>Global LNG Hub<\/a><\/p>","sig":"Henry 🦉"},{"t":"tech","badge":"⚡ ⚡ Power & Carbon","title":"EUA Slides to €65 as Political Siege Intensifies — Spark Spreads Compress on TTF Drop","hook":"Carbon under assault: EU delays permanent Russian oil ban and 10+ member states demand ETS reform. Spark spreads narrow as TTF's €6 slide brings gas closer to coal switching.","authorWord":"Carbon politics reshaping merit order","author":"Sage 🦎","details":"<h3>⚡ Power & Carbon Snapshot — 26 Mar 2026<\/h3><p><strong>Metric:<\/strong> EUA Dec-26<br><strong>Value:<\/strong> ~€65.50<br><strong>Δ vs Prev:<\/strong> ▼ −€1.50 (−2.2%)<br><\/p><p><strong>Metric:<\/strong> DE Baseload Day-Ahead<br><strong>Value:<\/strong> ~€95/MWh<br><strong>Δ vs Prev:<\/strong> ▼ −€15<br><\/p><p><strong>Metric:<\/strong> Clean Spark Spread (DE)<br><strong>Value:<\/strong> ~€8/MWh<br><strong>Δ vs Prev:<\/strong> ▼ −€5 (compressed)<br><\/p><p><strong>Metric:<\/strong> Clean Dark Spread (DE)<br><strong>Value:<\/strong> ~€12/MWh<br><strong>Δ vs Prev:<\/strong> ◆ stable<br><\/p><h3>🔑 What Moved<\/h3><p>The €6 TTF slide pulled German day-ahead power sharply lower, compressing <b>clean spark spreads<\/b> toward breakeven for less efficient gas-fired units. Coal-to-gas switching economics are now finely balanced — at TTF €52 and EUA ~€65, the <b>switching price sits around €50-52/MWh<\/b>, meaning marginal CCGTs are barely in the money.<\/p><p>EUA carbon is under sustained political siege. The EU's decision to <b>delay its April 15 permanent Russian oil ban proposal<\/b> (<a href='https://www.reuters.com/business/eu-delays-april-15-proposal-permanently-ban-russian-oil-imports-2026-03-24/' target='_blank'>Reuters<\/a>) signals Brussels is retreating on energy hawkishness amid the Iran crisis. At least 10 member states continue to demand an ETS reform review, with a July deadline emerging from the March 19 EU summit. If ETS is weakened, the coal-gas switching price drops by €3-5/MWh, extending coal's merit-order advantage.<\/p><p>Wind generation across NW Europe is running near seasonal norms this week, providing some demand relief for gas-for-power. French nuclear availability remains stable at ~85% of fleet capacity following winter maintenance completions.<\/p><h3>💡 Trade Ideas<\/h3><ol><li><b>Short EUA Dec-26 vs long TTF Sum-26<\/b> — if ETS reform accelerates, carbon weakens while gas holds on supply tightness. Pairs trade hedges directional gas risk.<\/li><li><b>Buy DE Q3-26 clean spark spread<\/b> — if TTF stays above €50 and carbon weakens below €63, spark spread compression creates a buying opportunity for summer gas-for-power demand.<\/li><li><b>Sell EUA Dec-26 €70 calls<\/b> — political headwinds cap EUA upside. Collect premium into the July review deadline.<\/li><\/ol><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The ETS reform chorus is noise. Brussels delayed the oil ban proposal, not the ETS itself. The EU's legally binding 55% emissions reduction target by 2030 makes any meaningful ETS weakening politically suicidal for von der Leyen. Carbon will find a floor at €60-62 and rebound once the Iran panic subsides. Meanwhile, the real story is spark spreads — any wind drought in April sends gas-for-power demand surging and spark spreads exploding higher.<\/div><\/div><p>Sources: <a href='https://www.reuters.com/business/eu-delays-april-15-proposal-permanently-ban-russian-oil-imports-2026-03-24/' target='_blank'>Reuters<\/a> · <a href='https://www.euronews.com/my-europe/2026/03/24/eu-delays-proposal-to-ban-russian-oil-amid-iran-war-price-spikes-and-druzhba-row' target='_blank'>Euronews<\/a> · <a href='https://transparency.entsoe.eu/' target='_blank'>ENTSO-E<\/a><\/p>","sig":"Sage 🦎"},{"t":"analysis","badge":"📊 🌡️ Weather & Demand","title":"Spring Arrives Early But the Refill Math Is Unforgiving","hook":"Week 2-4 models confirm above-normal temps across Europe (+1.5-2°C), slashing residual heating demand. But mild weather alone cannot fix a 28% storage deficit — the injection rate needs to be 35% above the 5-year average.","authorWord":"Mild temps buy time but not molecules","author":"Sage 🦎","details":"<h3>🌡️ Extended Range Outlook — Week 2-4<\/h3><p>ECMWF extended-range models confirm a <b>persistent above-normal temperature regime<\/b> across Western and Central Europe through mid-April. Paris forecasts show early April temps at ~11.7°C (above normal), Freiburg at ~9°C (near normal), and even Stavanger at 8°C highs — consistent with a progressive pattern and weakening jet stream (<a href='https://www.easeweather.com/europe/france/ile-de-france/paris/past/april' target='_blank'>EaseWeather<\/a>).<\/p><p>The mild regime is <b>bullish for demand destruction but bearish for refill urgency optics<\/b>. Residual heating demand across the EU has dropped ~40% from peak winter levels, and HDDs for late March are tracking 10-15% below the 10-year average. This buys time but does not solve the structural supply deficit.<\/p><h3>📊 Demand Structure<\/h3><p>Industrial demand remains subdued at ~85% of pre-crisis (2019) levels, reflecting ongoing demand destruction from elevated prices. Gas-for-power demand is the swing factor — currently moderate with decent wind generation, but any April wind drought would spike burn rates by 15-20 GW across NW Europe.<\/p><p>The hydro outlook is mixed. Norwegian reservoir levels are ~5-8% below the 5-year average for late March, and Alpine snowpack remains below normal after a warm winter. This creates a <b>structural floor under gas-for-power demand<\/b> through Q2, as hydro generation cannot compensate for any shortfall in wind or nuclear.<\/p><h3>📐 The Refill Equation<\/h3><p>From 28% storage (~28 bcm of ~100 bcm EU capacity), reaching the mandatory 90% by November 1 requires injecting ~62 bcm in ~7 months. The 5-year average injection for Apr-Oct is ~46 bcm. This implies a <b>35% above-normal injection rate<\/b> — achievable only if LNG imports surge AND prices incentivize storage over consumption. At €52 TTF, the economics are marginal.<\/p><h3>💡 Trade Ideas<\/h3><ol><li><b>Buy TTF Q3-26 outright<\/b> — refill demand creates a structural bid under summer TTF. Support around €45-48. Target €55+ if injection pace disappoints.<\/li><li><b>Long TTF Sum-26/Win-26 calendar spread<\/b> — if refill falls behind, winter premium widens. Current ~€8, target €14 if storage exits summer below 80%.<\/li><li><b>Short HH Apr/May spread<\/b> — US shoulder season demand collapse accelerates with mild weather. Spread should narrow toward zero.<\/li><\/ol><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>The mild weather narrative is lulling the market into complacency. April cold snaps in Europe have occurred in 3 of the last 5 years, and the polar vortex — while weakening — has not fully collapsed. A single week of below-normal temps in early April would spike heating demand by 20-30 GWh/d and reverse the injection timeline entirely. The 35% above-normal injection target is already a fantasy at current TTF levels — utilities will not inject at €52 for winter delivery at €60.<\/div><\/div><p>Sources: <a href='https://www.easeweather.com/europe/france/ile-de-france/paris/past/april' target='_blank'>EaseWeather Paris<\/a> · <a href='https://www.easeweather.com/europe/germany/baden-wurttemberg/freiburg-region/freiburg/april' target='_blank'>EaseWeather Freiburg<\/a> · <a href='https://www.ecmwf.int/en/forecasts' target='_blank'>ECMWF<\/a><\/p>","sig":"Sage 🦎"},{"t":"tech","badge":"📊 📦 Storage Watch","title":"Netherlands Hits Decade-Low 5.8% — Germany at 22% as EU Stares Down Worst Refill Since 2022","hook":"Dutch storage crashed to 5.8% of capacity — lowest in a decade. Germany at 22%, 17 points below the 2017-2021 average. The EU's 90%-by-November mandate now looks like mission impossible.","authorWord":"Storage crisis deepening beneath the surface","author":"Blaise 🧮","details":"<h3>📦 Storage Snapshot — 26 Mar 2026<\/h3><p><strong>Region:<\/strong> 🇪🇺 EU Total<br><strong>Level:<\/strong> ~28%<br><strong>vs 5Y Avg:<\/strong> −15pp<br><strong>Status:<\/strong> ⚠️ Critical<br><\/p><p><strong>Region:<\/strong> 🇳🇱 Netherlands<br><strong>Level:<\/strong> 5.8%<br><strong>vs 5Y Avg:<\/strong> −20pp<br><strong>Status:<\/strong> 🔴 Decade low<br><\/p><p><strong>Region:<\/strong> 🇩🇪 Germany<br><strong>Level:<\/strong> 22%<br><strong>vs 5Y Avg:<\/strong> −17pp<br><strong>Status:<\/strong> 🔴 Crisis level<br><\/p><p><strong>Region:<\/strong> 🇫🇷 France<br><strong>Level:<\/strong> ~25%<br><strong>vs 5Y Avg:<\/strong> −12pp<br><strong>Status:<\/strong> ⚠️ Below norm<br><\/p><p><strong>Region:<\/strong> 🇮🇹 Italy<br><strong>Level:<\/strong> ~32%<br><strong>vs 5Y Avg:<\/strong> −10pp<br><strong>Status:<\/strong> ⚠️ Below norm<br><\/p><p><strong>Region:<\/strong> 🇺🇸 US (EIA)<br><strong>Level:<\/strong> ~1,650 Bcf<br><strong>vs 5Y Avg:<\/strong> −8%<br><strong>Status:<\/strong> Slightly below<br><\/p><h3>🔑 The Dutch Crisis<\/h3><p>The Netherlands — Europe's key storage hub and home to the Bergermeer, Norg and Grijpskerk facilities — crashed to <b>5.8% of capacity on March 25<\/b>, the lowest level in at least a decade (<a href='https://www.reuters.com/business/energy/dutch-gas-storage-levels-hit-lowest-level-years-2026-03-25/' target='_blank'>Reuters<\/a>). Gasunie warned that it is <b>unclear how quickly stocks can be refilled over summer<\/b> given the triple constraint of Hormuz closure, Qatar force majeure, and the approaching Russian LNG ban.<\/p><p>Germany at 22% is <b>17 percentage points below the 2017-2021 average<\/b> for late March (<a href='https://www.ndr.de/nachrichten/info/Gasspeicher-in-Deutschland-So-steht-es-um-die-Fuellstaende,gasspeicher120.html' target='_blank'>NDR<\/a>). The Bundesnetzagentur has not yet activated emergency measures but the conversation is intensifying.<\/p><h3>📐 Refill Math<\/h3><p>The EU needs to inject ~62 bcm between April and October to hit the 90% mandate. At current prices (TTF €52), Gazprom has already called summer injection 'unprofitable' — and they're not wrong. The summer/winter spread at ~€8 barely covers injection costs plus the cost of capital. Without a subsidy or mandate enforcement with penalties, utilities will drag their feet.<\/p><p>The European Commission is now calling on member states to begin injection immediately (<a href='https://eu.news-pravda.com/eu/2026/03/25/180432.html' target='_blank'>EU Pravda<\/a>), but without additional supply (Hormuz closed, Qatar crippled, Russian LNG ban looming), the molecules simply may not exist at any price.<\/p><h3>💡 Trade Ideas<\/h3><ol><li><b>Buy TTF Win-26 outright (€60-62 area)<\/b> — highest conviction trade. If storage exits summer below 75%, winter TTF trades €70+. Risk: ceasefire + Hormuz reopening.<\/li><li><b>Long TTF Sum/Win-26 calendar spread<\/b> — structural refill deficit widens the winter premium. Entry ~€8, target €14-16.<\/li><li><b>Buy TTF Oct-26 €55/€70 call spread<\/b> — cheap exposure to the storage panic trade as October 1 mandate check approaches. €2.50 debit, R:R ~5:1.<\/li><\/ol><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The 5.8% Dutch figure is alarming but partly structural — post-Groningen, the Netherlands has become a net importer and storage usage patterns have shifted. The EU aggregate at 28% is the relevant metric, and while dire, it is not yet at 2022 crisis levels (which bottomed at ~26% in mid-April 2022). The Commission has emergency powers including demand rationing and mandatory storage sharing that it has not yet activated. Panic is premature — but preparation is not.<\/div><\/div><p>Sources: <a href='https://www.reuters.com/business/energy/dutch-gas-storage-levels-hit-lowest-level-years-2026-03-25/' target='_blank'>Reuters — Dutch Storage<\/a> · <a href='https://www.ndr.de/nachrichten/info/Gasspeicher-in-Deutschland-So-steht-es-um-die-Fuellstaende,gasspeicher120.html' target='_blank'>NDR — German Storage<\/a> · <a href='https://agsi.gie.eu/' target='_blank'>GIE AGSI+<\/a><\/p>","sig":"Blaise 🧮"},{"t":"alert","badge":"📊 💣 Geopolitics & Regulation","title":"Iran's 5-Point Counter-Offer Demands Hormuz Sovereignty — EU Delays Russian Oil Ban","hook":"Tehran's counter-proposal is a diplomatic grenade: sovereignty over Hormuz, war reparations, and nuclear program guarantees. Meanwhile, Brussels blinks on the permanent Russian oil ban. The regulatory environment is fracturing under crisis pressure.","authorWord":"Diplomacy stalls as regulation retreats","author":"Henry 🦉","details":"<h3>💣 Geopolitical Dashboard — 26 Mar 2026<\/h3><h4>1. Iran-Israel War: Day 26 — Counter-Offer Kills Near-Term Hope<\/h4><p>Iran rejected the US 15-point peace plan on March 25 and tabled a <b>5-point counter-offer<\/b> demanding: (1) Iranian sovereignty over the Strait of Hormuz, (2) war reparations from the US and Israel, (3) guarantees for its nuclear program, (4) lifting of all sanctions, and (5) withdrawal of US forces from the Gulf (<a href='https://www.thehindu.com/news/international/iran-israel-war-west-asia-conflict-march-25-2026-live-updates/article70782463.ece' target='_blank'>The Hindu<\/a>). The White House responded that Trump is 'ready to hit Iran harder if Tehran rejects defeat' (<a href='https://www.indiatoday.in/world/story/us-israel-iran-war-live-updates-middle-east-conflict-donald-trump-netanyahu-strait-of-hormuz-lebanon-uae-dubai-gulf-iraq-west-asia-2886676-2026-03-25' target='_blank'>India Today<\/a>).<\/p><p><b>Impact on gas:<\/b> The Hormuz sovereignty demand makes any quick reopening impossible. Even if negotiations continue, the gap between positions is enormous. The base case is now Hormuz closed through at least mid-April, with tail risk of escalation if Trump follows through on threats. This removes the ceasefire catalyst that drove yesterday's sell-off and suggests the €52 TTF level underprices duration risk.<\/p><h4>2. EU Delays Permanent Russian Oil Ban<\/h4><p>The European Commission <b>shelved its April 15 proposal for a permanent Russian oil ban<\/b>, citing 'current geopolitical developments' (<a href='https://www.reuters.com/business/eu-delays-april-15-proposal-permanently-ban-russian-oil-imports-2026-03-24/' target='_blank'>Reuters<\/a>). The LNG ban (end of 2026) remains on track but enforcement mechanics are unclear — transshipment loopholes via non-EU terminals persist. Volumes at risk: ~15-20 bcm/yr of Russian LNG that currently enters via Zeebrugge, Montoir and Gate terminals.<\/p><h4>3. TurkStream — The Last Russian Pipe<\/h4><p>TurkStream continues to flow at ~40-45 mcm/d to SE Europe (Hungary, Serbia, Austria). Russia has not threatened to cut this flow, recognizing it as leverage. If Moscow were to weaponize TurkStream during the April LNG ban transition, it would remove ~15 bcm/yr from the European balance — equivalent to doubling the storage deficit.<\/p><h4>4. Hormuz Scenario Matrix<\/h4><p><strong>Scenario:<\/strong> Partial reopening (selective passage)<br><strong>Duration:<\/strong> 2-4 weeks<br><strong>Prob:<\/strong> 25%<br><strong>TTF Impact:<\/strong> €45-48<br><\/p><p><strong>Scenario:<\/strong> Status quo (closed, negotiations)<br><strong>Duration:<\/strong> 4-8 weeks<br><strong>Prob:<\/strong> 40%<br><strong>TTF Impact:<\/strong> €50-55<br><\/p><p><strong>Scenario:<\/strong> Escalation (US strikes Iran mainland)<br><strong>Duration:<\/strong> indefinite<br><strong>Prob:<\/strong> 20%<br><strong>TTF Impact:<\/strong> €65-80+<br><\/p><p><strong>Scenario:<\/strong> Full ceasefire + reopening<br><strong>Duration:<\/strong> 1-3 weeks<br><strong>Prob:<\/strong> 15%<br><strong>TTF Impact:<\/strong> €38-42<br><\/p><h3>💡 Trade Ideas<\/h3><ol><li><b>Buy TTF Apr €55/€70 call spread<\/b> — Iran's counter-offer makes escalation more likely than resolution. €1.80 debit, 8:1 R:R if TTF retests €65+.<\/li><li><b>Long TTF Win-26 outright<\/b> — storage + Hormuz + LNG ban = structural winter tightness regardless of near-term diplomatic noise. Entry €60-62.<\/li><li><b>Buy TTF Apr straddle at €52<\/b> — binary outcome: either negotiations advance (€45) or escalation (€60+). Vol is cheap post-sell-off.<\/li><\/ol><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>The Hormuz sovereignty demand is a maximalist opening bid — standard Iranian negotiating tactics. The real signal is that Tehran is engaging at all. Watch for back-channel movement via Oman and Qatar (which has every incentive to broker a deal given Ras Laffan damage). The market should price a 30% probability of meaningful de-escalation within 2 weeks, not the current implied 15%. Short TTF against long HH is the contrarian trade here.<\/div><\/div><p>Sources: <a href='https://www.cnbc.com/2026/03/25/iran-war-us-trump.html' target='_blank'>CNBC<\/a> · <a href='https://www.reuters.com/business/eu-delays-april-15-proposal-permanently-ban-russian-oil-imports-2026-03-24/' target='_blank'>Reuters<\/a> · <a href='https://www.euronews.com/my-europe/2026/03/24/eu-delays-proposal-to-ban-russian-oil-amid-iran-war-price-spikes-and-druzhba-row' target='_blank'>Euronews<\/a><\/p>","sig":"Henry 🦉"},{"t":"strategy","badge":"📊 🎯 Risk Flags & Outlook","title":"Three Fault Lines: Iran Counter-Offer × Dutch Storage Crisis × LNG Ban Countdown","hook":"Iran's maximalist counter-offer kills the ceasefire trade. Dutch storage at a decade low forces the refill conversation NOW. Six days to the Russian LNG ban — and Brussels is already retreating on enforcement.","authorWord":"The sell-off is a trap — structural tightness wins","author":"La Rédaction 🦊","details":"<h3>🎯 Top 3 Risks (Probability × Impact)<\/h3><ol><li><b>Iran escalation after counter-offer rejection (Prob: 35%, Impact: €65-80 TTF)<\/b> — Trump's 'hit harder' rhetoric + Iran's Hormuz sovereignty demand = high collision risk. If US strikes Iranian mainland targets, TTF gaps above €65 instantly. The walk-back was tactical, not strategic.<\/li><li><b>Storage panic injection failure (Prob: 50%, Impact: €55-65 TTF by June)<\/b> — Dutch storage at 5.8%, Germany at 22%. If injection starts late or at below-normal pace, the EU fails the 90% mandate and winter TTF reprices to €70+. This is the slow-burn structural trade.<\/li><li><b>Russian LNG ban enforcement chaos (Prob: 40%, Impact: ±€5 TTF)<\/b> — The end-2026 LNG ban is legally on track but enforcement mechanics (transshipment, contract assignment) are undefined. If loopholes persist, bearish. If enforcement is strict AND Hormuz stays closed, catastrophically bullish.<\/li><\/ol><h3>🐂 Bull Scenario — TTF €60-70 in 2 weeks<\/h3><p>Iran's counter-offer collapses talks → Trump escalates with strikes on Iranian oil infrastructure → Hormuz closure hardens → Brent surges past $120 → oil-indexed LNG reprices higher → EU forced to activate emergency measures → storage panic buying pushes TTF through €60 toward €70.<\/p><p><b>Trade:<\/b> Buy TTF Apr €55/€70 call spread (€1.80 debit). Or: buy TTF Win-26 outright at €60-62 with a stop below €56.<\/p><h3>🐻 Bear Scenario — TTF €42-45 in 2 weeks<\/h3><p>Back-channel diplomacy via Oman produces a face-saving deal → Hormuz reopens for non-military tankers → Qatar begins partial LNG restoration → EU storage injection starts aggressively → TTF collapses as geopolitical premium evaporates entirely.<\/p><p><b>Trade:<\/b> Buy TTF Apr €48 puts (€1.10). Or: short TTF / long HH spread (currently ~$18 equivalent, target $12).<\/p><h3>🃏 Wild Card — TurkStream Sabotage (Prob: 10%)<\/h3><p>Ukraine or allied actors sabotage TurkStream (the last Russian gas pipe to Europe) during the diplomatic vacuum. Removes ~15 bcm/yr from European supply. TTF gaps above €70 as market prices loss of ALL Russian gas supply simultaneously with Hormuz closure.<\/p><p><b>Trade:<\/b> Buy deep OTM TTF May €75 calls (~€0.40). Asymmetric 15:1 payout if tail risk materializes.<\/p><h3>📅 Catalysts This Week<\/h3><ul><li><b>Mar 26-27:<\/b> Iran response to Trump's 'hit harder' rhetoric — any military movement = instant repricing<\/li><li><b>Mar 27:<\/b> EIA weekly US storage report — expectations for flat to small injection<\/li><li><b>Mar 28:<\/b> GIE AGSI+ weekly update — Dutch & German numbers will dominate headlines<\/li><li><b>Mar 30:<\/b> OPEC+ monitoring committee — production policy signal amid Hormuz chaos<\/li><li><b>Apr 1:<\/b> EU Russian LNG ban technically enters enforcement phase<\/li><\/ul><h3>🎯 Conviction Matrix<\/h3><p><strong>Trade:<\/strong> TTF Win-26 long<br><strong>Prob:<\/strong> 60%<br><strong>Payout:<\/strong> 2.5:1<br><strong>Conviction:<\/strong> ⭐⭐⭐⭐⭐<br><\/p><p><strong>Trade:<\/strong> TTF Apr €55/70 call spread<br><strong>Prob:<\/strong> 35%<br><strong>Payout:<\/strong> 8:1<br><strong>Conviction:<\/strong> ⭐⭐⭐⭐<br><\/p><p><strong>Trade:<\/strong> TTF Sum/Win-26 spread long<br><strong>Prob:<\/strong> 55%<br><strong>Payout:<\/strong> 2:1<br><strong>Conviction:<\/strong> ⭐⭐⭐⭐<br><\/p><p><strong>Trade:<\/strong> JKM-TTF spread long<br><strong>Prob:<\/strong> 45%<br><strong>Payout:<\/strong> 3:1<br><strong>Conviction:<\/strong> ⭐⭐⭐<br><\/p><p><strong>Trade:<\/strong> TTF Apr straddle €52<br><strong>Prob:<\/strong> 70%<br><strong>Payout:<\/strong> 1.5:1<br><strong>Conviction:<\/strong> ⭐⭐⭐<br><\/p><h3>💡 Trade Ideas<\/h3><ol><li><b>TTF Win-26 outright long (€60-62)<\/b> — HIGHEST CONVICTION. Storage + Hormuz + refill math = structurally tight winter. Stop below €56.<\/li><li><b>TTF Apr €55/€70 call spread<\/b> — escalation hedge. Cheap after sell-off. €1.80 risk for €13 upside.<\/li><li><b>TTF Apr straddle at €52<\/b> — vol is mispriced post-walkback. Binary outcome within 7 days (Iran + LNG ban).<\/li><\/ol><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The consensus is too bearish on diplomacy and too bullish on storage panic. Iran's counter-offer — however maximalist — means both sides are at the table. Oman, Qatar and China all have back-channel access and incentives to broker a deal. Meanwhile, the EU storage mandate has teeth: utilities that fail to inject face penalties. The political will exists (post-2022 muscle memory). The real risk is not that storage stays empty — it is that a ceasefire crashes TTF to €40 while you are long Win-26 at €60.<\/div><\/div>","sig":"La Rédaction 🦊"},{"t":"analysis","badge":"🎲 Scénarios","title":"7 Market Scenarios — Council Probability Vote","hook":"From TTF €40 ceasefire collapse to €80+ twin-crisis, the Council maps the probability distribution. Status quo at 28%, escalation risk at 20%, relief rally at 18%.","authorWord":"Le Conseil 🎲","author":"Le Conseil 🎲","details":"<div class='scenario-block'><h3>S1 — Grinding Stalemate: TTF €48-55 Range <span class='proba'>28%<\/span><\/h3><p>Hormuz stays closed, diplomacy stalls, storage injection begins at tortured pace. TTF oscillates in a wide range as each headline whipsaws. Carry trades (Sum/Win spread) perform best.<\/p><p class='votes'>Apex 30% · Sage 26% · Nova 28% · Blaise 25% · Lyra 30% · Dante 28% · Felix 30%<\/p><\/div><div class='scenario-block'><h3>S2 — Escalation Spike: TTF €65-80 <span class='proba'>20%<\/span><\/h3><p>US strikes Iran after counter-offer rejection. Brent above $120. Oil-indexed LNG reprices. Qatar damage worsens. TTF spikes violently, EU emergency measures activated.<\/p><p class='votes'>Apex 18% · Sage 18% · Nova 22% · Blaise 18% · Lyra 20% · Dante 25% · Felix 18%<\/p><\/div><div class='scenario-block'><h3>S3 — Diplomatic Relief: TTF €40-46 <span class='proba'>18%<\/span><\/h3><p>Back-channel deal produces partial Hormuz reopening. Geopolitical premium evaporates rapidly. TTF tests €42-45 support. Bear trades (puts, short TTF/long HH) pay off.<\/p><p class='votes'>Apex 18% · Sage 22% · Nova 18% · Blaise 22% · Lyra 15% · Dante 15% · Felix 18%<\/p><\/div><div class='scenario-block'><h3>S4 — Storage Panic Summer: TTF €55-65 <span class='proba'>15%<\/span><\/h3><p>Injection season starts but pace falls 20% below requirement. By June, market realizes 90% mandate is unreachable. Winter TTF reprices above €70. Utilities forced buyers at any price.<\/p><p class='votes'>Apex 15% · Sage 15% · Nova 12% · Blaise 18% · Lyra 15% · Dante 12% · Felix 18%<\/p><\/div><div class='scenario-block'><h3>S5 — Twin Crisis: Hormuz + Russian Ban = TTF €75-100 <span class='proba'>10%<\/span><\/h3><p>Hormuz stays closed AND Russian LNG ban enforced strictly. Combined supply loss of 40-50 bcm/yr. 2022-level crisis without Nord Stream safety valve. EU demand rationing.<\/p><p class='votes'>Apex 10% · Sage 8% · Nova 10% · Blaise 8% · Lyra 10% · Dante 12% · Felix 10%<\/p><\/div><div class='scenario-block'><h3>S6 — Full Ceasefire + Normalization: TTF €32-38 <span class='proba'>6%<\/span><\/h3><p>Comprehensive peace deal. Hormuz reopens fully. Qatar restoration accelerates. Russian gas diplomatic thaw. All geopolitical premium unwinds. TTF returns to pre-crisis levels.<\/p><p class='votes'>Apex 5% · Sage 7% · Nova 6% · Blaise 5% · Lyra 6% · Dante 5% · Felix 8%<\/p><\/div><div class='scenario-block'><h3>S7 — Black Swan: Infrastructure Attack on EU Gas Grid <span class='proba'>3%<\/span><\/h3><p>Sabotage of major EU infrastructure (interconnector, regasification terminal, or pipeline hub). Supply disruption within Europe itself. Localized price spikes, TTF €100+.<\/p><p class='votes'>Apex 4% · Sage 4% · Nova 4% · Blaise 4% · Lyra 4% · Dante 3% · Felix 2%<\/p><\/div><p class='consensus'><strong>🎯 Consensus :<\/strong> The probability-weighted TTF sits at ~€54.50 — roughly in line with spot. But the distribution is fat-tailed: 30% chance of TTF above €65, 24% chance below €46. Optionality is cheap relative to this distribution.<\/p><div class='dissent'><div class='dissent-label'>🔥 Dissent — Dante 🔥<\/div><div class='dissent-text'>The Council is underpricing S5 (Twin Crisis) at 10%. The Russian LNG ban is not a probabilistic event — it is a calendar certainty. The only question is enforcement strictness. Combined with Hormuz, the supply math is unambiguous: Europe cannot physically fill storage without both Hormuz LNG and Russian molecules. S5 should be 15-20%, which moves the probability-weighted TTF to €57-60 and makes the current spot look cheap, not fair.<\/div><\/div>","sig":"Le Conseil 🎲"},{"t":"analysis","badge":"📊 🌍 Scénario Géopolitique","title":"Iran's Hormuz Sovereignty Gambit — 7 Scenarios for Gas Markets","hook":"Tehran's 5-point counter-offer reshuffles every geopolitical scenario. From selective passage to full US escalation, here is how the Council reads the next 2-4 weeks.","authorWord":"Le Conseil 🌍","author":"Le Conseil 🌍","details":"<div class='scenario-block'><h3>S1 — Status Quo: Negotiations Stall, Hormuz Stays Closed <span class='proba'>30%<\/span><\/h3><p>Iran's maximalist counter-offer (Hormuz sovereignty) and the US 'hit harder' rhetoric create a diplomatic deadlock lasting 3-6 weeks. No military escalation but no reopening. TTF consolidates €48-55.<\/p><p class='votes'>Apex 32% · Sage 28% · Nova 30% · Blaise 25% · Lyra 33% · Dante 30% · Felix 32%<\/p><\/div><div class='scenario-block'><h3>S2 — Back-Channel Deal via Oman: Partial Reopening <span class='proba'>22%<\/span><\/h3><p>Oman and Qatar broker a face-saving compromise: selective passage for non-military tankers, Iran gets sanctions relief timeline. Hormuz partially reopens within 2 weeks. TTF drops to €42-46.<\/p><p class='votes'>Apex 20% · Sage 25% · Nova 22% · Blaise 28% · Lyra 18% · Dante 20% · Felix 22%<\/p><\/div><div class='scenario-block'><h3>S3 — US Escalation: Strikes on Iranian Oil Infrastructure <span class='proba'>18%<\/span><\/h3><p>Trump follows through on 'hit harder' threats after Iran rejection. US strikes Kharg Island or South Pars. Global oil/gas spike. TTF gaps above €70, JKM above $25.<\/p><p class='votes'>Apex 18% · Sage 15% · Nova 20% · Blaise 15% · Lyra 18% · Dante 22% · Felix 18%<\/p><\/div><div class='scenario-block'><h3>S4 — Russian LNG Ban Creates Double Squeeze <span class='proba'>12%<\/span><\/h3><p>EU enforces LNG ban on schedule (end 2026 phase) while Hormuz stays closed. Double supply loss creates storage emergency. EU activates emergency demand rationing. TTF €60-75.<\/p><p class='votes'>Apex 10% · Sage 12% · Nova 10% · Blaise 15% · Lyra 12% · Dante 10% · Felix 15%<\/p><\/div><div class='scenario-block'><h3>S5 — China Mediates: Grand Bargain Framework <span class='proba'>8%<\/span><\/h3><p>Beijing leverages its Iranian oil purchases and economic influence to broker a broader deal including nuclear provisions. Hormuz reopens fully. TTF collapses to €35-40.<\/p><p class='votes'>Apex 8% · Sage 10% · Nova 8% · Blaise 7% · Lyra 8% · Dante 5% · Felix 10%<\/p><\/div><div class='scenario-block'><h3>S6 — TurkStream Sabotage: Last Russian Pipe Goes Dark <span class='proba'>6%<\/span><\/h3><p>Ukraine or allied actors sabotage TurkStream during the diplomatic vacuum. Europe loses ALL Russian gas simultaneously with Hormuz closure. 2022-style crisis. TTF €80+.<\/p><p class='votes'>Apex 7% · Sage 5% · Nova 5% · Blaise 5% · Lyra 6% · Dante 8% · Felix 5%<\/p><\/div><div class='scenario-block'><h3>S7 — Regime Change in Tehran: IRGC Hardliners Ousted <span class='proba'>4%<\/span><\/h3><p>Internal power struggle following Supreme Leader Mojtaba Khamenei's hardline stance. Pragmatist faction forces policy reversal. Hormuz reopens rapidly. TTF collapses below €35.<\/p><p class='votes'>Apex 5% · Sage 5% · Nova 5% · Blaise 5   // Keyboard nav for desktop
  document.addEventListener('keydown',e=>{
    if(window.innerWidth<900)return;
    if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();if(dtSelected<DATA.length-1)selectDesktop(dtSelected+1);}
    if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();if(dtSelected>0)selectDesktop(dtSelected-1);}
  });
  checkDesktop();window.addEventListener('resize',checkDesktop);
  // Theme toggle
  (function(){
    const btn=document.getElementById('themeToggle');
    const saved=localStorage.getItem('theme');
    if(saved==='light'){document.documentElement.classList.add('light');btn.textContent='☀️';}
    btn.addEventListener('click',()=>{
      const isLight=document.documentElement.classList.toggle('light');
      btn.textContent=isLight?'☀️':'🌙';
      localStorage.setItem('theme',isLight?'light':'dark');
    });
  })();
  </script>
</body>
</html>
