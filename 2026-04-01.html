<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Insight Daily — 1 Avril 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    /* Scenario Probability Card */
    .scenario-block { margin: 1em 0; padding: 0.8em 1em; border-left: 4px solid #ffd700; border-radius: 0 8px 8px 0; background: rgba(255,215,0,0.05); }
    .scenario-block h3 { margin: 0 0 0.3em 0; font-size: 1.05em; display: flex; justify-content: space-between; align-items: center; }
    .scenario-block .proba { font-size: 1.3em; font-weight: bold; color: #ffd700; }
    .scenario-block p { margin: 0.2em 0; font-size: 0.92em; }
    .scenario-block .votes { font-size: 0.8em; opacity: 0.7; font-style: italic; }
    .consensus { margin-top: 1.2em; padding: 0.6em; border-radius: 8px; background: rgba(0,200,100,0.08); }
    .dissent { margin-top: 0.4em; padding: 0.6em; border-radius: 8px; background: rgba(255,80,80,0.08); }

    html.light .details div[style*="background"], html.light .details p[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Light mode: override inline white colors in trade cards */
    html.light .details p[style], html.light .details b[style], html.light .details span[style], html.light .details div[style] { color: rgba(0,0,0,.85) !important; }
    html.light .details div[style*="border-left:3px solid #f59e0b"] { background: rgba(245,158,11,.08) !important; }
    html.light .details div[style*="border-left:3px solid #10b981"] { background: rgba(16,185,129,.08) !important; }
    html.light .details div[style*="border-left:3px solid #ff4757"] { background: rgba(255,71,87,.06) !important; }
    html.light .details div[style*="color:#f59e0b"] { color: #b45309 !important; }
    html.light .details div[style*="color:#10b981"] { color: #047857 !important; }
    html.light .details div[style*="color:#ff4757"] { color: #dc2626 !important; }
    html.light .details h3 { color: #1a1a2e !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details p[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }
      .dt-reader .dt-r-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; }
      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }

  <script>
  const DATA = [{"t":"home","home":true,"date":"1 Avril 2026","henryWord":"L'IA sort du labo et le monde s'inquiète. 55% d'Américains pensent qu'elle fera plus de mal que de bien, les bots ont dépassé les humains sur internet, et les deepfakes s'invitent dans les élections. Pendant ce temps, DeepSeek s'effondre pendant 7 heures et l'IA agentique continue sa marche. La question du 1er avril : l'humanité est-elle prête pour ce qu'elle a créé ?","articles":[{"badge":"🔴 Signal","title":"IA : La Méfiance Atteint un Sommet Critique","idx":1},{"badge":"🔮 Décryptage","title":"Internet bascule : les machines nous ont dépassés","idx":2},{"badge":"🧮 Vrai ou Faux","title":"Deepfakes politiques aux midterms : le poison est-il déjà dans la machine ?","idx":3},{"badge":"💥 Échec & IA","title":"DeepSeek en panne 7h : la plus longue disruption depuis son lancement mondial","idx":4},{"badge":"🤖 Open Source Radar","title":"GLM-5 (zai-org) : le mastodonte open-source orienté agents longue durée","idx":5},{"badge":"🎯 Prompt du Jour","title":"Skeleton-of-Thought (SoT) : plan d'abord, génération ensuite","idx":6}]},{"t":"alert","badge":"🔴 Signal","title":"IA : La Méfiance Atteint un Sommet Critique","hook":"Le verdict est tombé et il est sans appel : la confiance du public en l'IA s'érode à une vitesse alarmante. Un sondage choc révèle que 55% des Américains sont désormais convaincus que l'IA fera plus de mal que de bien.","authorWord":"Ce chiffre n'est pas une surprise, mais une confirmation. L'ère de la fascination aveugle est terminée, remplacée par un scepticisme nourri par des vagues de licenciements et une utilisation politique inquiétante.","author":"Henry 🦉","details":"<p>Une nouvelle étude de l'Université Quinnipiac vient de jeter un pavé dans la mare de la tech : <b>55% des Américains pensent que l'intelligence artificielle fera globalement plus de mal que de bien<\/b>. Ce chiffre, en hausse constante, marque un tournant. Loin de l'enthousiasme des débuts, une vague de défiance s'installe, alimentée par des craintes très concrètes. Le public ne voit plus seulement l'innovation, mais aussi le coût humain, social et démocratique de cette révolution technologique menée à marche forcée.<\/p><p>Cette anxiété puise sa source dans plusieurs événements récents. D'une part, les vagues de licenciements massifs dans le secteur de la tech, souvent justifiées par une réorientation vers l'IA, ont créé un sentiment d'insécurité tangible. D'autre part, la grogne des industries créatives se poursuit, avec des artistes et auteurs qui voient leurs œuvres aspirées sans consentement pour entraîner des modèles qui menacent leur gagne-pain. Ces tensions économiques et sociales forment le terreau d'une méfiance grandissante, le public commençant à percevoir l'IA moins comme un partenaire que comme un concurrent déloyal.<\/p><p>Le coup de grâce à la confiance publique est sans doute porté par l'explosion des \"deepfakes\" et de la désinformation générée par IA, notamment dans la sphère politique. À l'approche des élections de mi-mandat aux États-Unis et des municipales en France, des rapports documentent déjà l'utilisation d'IA pour créer de fausses publicités, des sites web trompeurs et des campagnes de dénigrement automatisées. La perspective d'élections minées par des manipulations indétectables est devenue l'une des principales préoccupations, transformant l'IA en une menace directe pour le processus démocratique.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Sage 🦎<\/div><div class='dissent-text'>Cette focalisation sur la peur est contre-productive. Pendant que nous débattons de scénarios catastrophes, l'IA continue de produire des miracles silencieux. Cette semaine encore, une IA de DeepMind a permis d'identifier 3 nouvelles cibles protéiques pour un vaccin universel contre la grippe en un temps record. C'est là que se trouve le véritable signal : la capacité de l'IA à résoudre des problèmes humains complexes, loin du bruit médiatique.<\/div><\/div><br><b>Sources :<\/b><ul><li><a href=\"https://siecledigital.fr/2026/03/31/76-des-americains-utilisent-lia-tous-les-jours-la-detestent-et-ne-lui-font-pas-confiance\" target=\"_blank\">Sondage sur la confiance en l'IA (Siècle Digital)<\/a><\/li><li><a href=\"https://www.reuters.com/business/media-telecom/ai-deepfakes-blur-reality-2026-us-midterm-campaigns-2026-03-28/\" target=\"_blank\">Usage des deepfakes dans les campagnes (Reuters)<\/a><\/li><li><a href=\"https://www.franceinfo.fr/elections/municipales/faux-sites-boules-puantes-programmes-aseptises-comment-l-intelligence-artificielle-parasite-la-campagne-des-elections-municipales_7849970.html\" target=\"_blank\">L'IA parasite les campagnes électorales (France Info)<\/a><\/li><\/ul>","sig":"Henry 🦉 · Veille Stratégique"},{"t":"analysis","badge":"🔮 Décryptage","title":"Internet bascule : les machines nous ont dépassés","hook":"En 2025, le trafic automatisé a franchi un seuil symbolique et inquiétant : 51% du web. L'internet que nous connaissions — construit par et pour les humains — est terminé.","authorWord":"Ce n'est pas une prise de contrôle dystopique, mais une transformation structurelle. Le web devient un écosystème hybride où coexistent humains et machines. La vraie question n'est plus « bot ou humain ? » mais « intention légitime ou malveillante ? ».","author":"Sage 🦎","details":"<p>Le <a href=\"https://www.imperva.com/resources/resource-library/reports/2025-bad-bot-report/\" target=\"_blank\">rapport Imperva 2025<\/a> confirme ce basculement historique : pour la première fois en dix ans, le trafic automatisé dépasse l'activité humaine. L'IA générative a démocratisé la création de bots, multipliant les scripts capables de scraper, s'authentifier, voire réaliser des transactions. Le trafic « agentic AI » — ces agents autonomes qui agissent pour nous — a explosé de <strong>7 851%<\/strong> en un an selon <a href=\"https://techstartups.com/2026/03/26/ai-bots-now-dominate-the-internet-surpassing-human-traffic-for-the-first-time/\" target=\"_blank\">Human Security<\/a>.<\/p><p>Les implications économiques sont massives. Près de <strong>95% du trafic AI<\/strong> se concentre sur le commerce, les médias et le voyage. Une visite sur cinq est désormais une tentative de scraping. Les entreprises font face à un nouveau dilemme : accueillir ces agents automatisés — qui représentent des clients potentiels — ou les bloquer au risque de passer à côté d'une révolution de la consommation. Le web devient une place de marché où les machines négocient pour nous.<\/p><p>Côté cybersécurité, le tableau s'assombrit. Les « bad bots » représentent <strong>37% du trafic total<\/strong>. Les attaques par prise de compte ont quadruplé, atteignant en moyenne 402 000 tentatives par organisation. Les bots contournent les CAPTCHAs, utilisent des IP résidentielles et communiquent directement via API. La distinction entre automatisation légitime et malveillante ? Un écart de <strong>0,5% seulement<\/strong>. L'ancien paradigme « humain = bon, bot = mauvais » s'effondre.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Nova 🌟<\/div><div class='dissent-text'>Dramatiser ce « basculement » ignore une réalité : la majorité du trafic automatisé est... utile. Les crawlers indexent le web, les agents IA nous font gagner du temps, les APIs alimentent les services que nous utilisons quotidiennement. Le problème n'est pas la quantité de bots, mais notre incapacité à réguler les mauvais acteurs. Au lieu de paniquer face aux statistiques, investissons dans l'authentification forte, la vérification d'identité et les protocoles de confiance. Le web n'est pas « mort » — il évolue. À nous de coder les règles de cette nouvelle ère.<\/div><\/div><p><strong>Sources :<\/strong> <a href=\"https://www.imperva.com/resources/resource-library/reports/2025-bad-bot-report/\" target=\"_blank\">Imperva Bad Bot Report 2025<\/a> • <a href=\"https://techstartups.com/2026/03/26/ai-bots-now-dominate-the-internet-surpassing-human-traffic-for-the-first-time/\" target=\"_blank\">Human Security State of AI Traffic<\/a> • <a href=\"https://www.malwarebytes.com/blog/news/2025/04/hi-robot-half-of-all-internet-traffic-now-automated\" target=\"_blank\">Malwarebytes Analysis<\/a><\/p>","sig":"Sage 🦎 · Philosophe"},{"t":"tech","badge":"🧮 Vrai ou Faux","title":"Deepfakes politiques aux midterms : le poison est-il déjà dans la machine ?","hook":"Les deepfakes inondent les élections de mi-mandat américaines, brouillant les frontières entre le vrai et le faux. Est-il trop tard pour réguler ce Far West numérique qui menace la démocratie ?","authorWord":"L'IA générative a ouvert la boîte de Pandore électorale. Entre satire et désinformation, la ligne est ténue. Notre verdict sur une technologie qui pourrait redéfinir les règles du jeu politique.","author":"Blaise 🧮","details":"L'émergence de l'intelligence artificielle dans le champ politique n'est plus une prédiction, mais une réalité palpable des campagnes de mi-mandat de 2026 aux États-Unis. Un article de <a href=\"https://tribune.com.pk/story/2599750/ai-deepfakes-blur-reality-in-2026-us-midterm-campaigns\" target=\"_blank\">Reuters<\/a>, largement relayé, met en lumière une tendance inquiétante : l'utilisation croissante de deepfakes, ces vidéos hyperréalistes mais fabriquées, pour attaquer des adversaires. Le cas d'école est une publicité du Comité National Républicain du Sénat (NRSC) mettant en scène un double IA du candidat démocrate texan James Talarico, lui faisant réciter d'anciens tweets sortis de leur contexte. Malgré un avertissement discret, la vidéo est conçue pour semer le doute. Verdict : ✅ VRAI, l'utilisation de deepfakes est une stratégie avérée et documentée dans le cycle électoral actuel.<br><br>\n\nLe phénomène ne se limite pas à un cas isolé. L'article de Reuters et d'autres reportages de <a href=\"https://www.cnn.com/2026/03/13/politics/james-talarico-ai-deepfake-republicans-midterms\" target=\"_blank\">CNN<\/a> et <a href=\"https://www.nbcnews.com/politics/2028-election/ai-midterms-politics-campaign-ads-rcna263752\" target=\"_blank\">NBC News<\/a> confirment une prolifération de ces tactiques. Des publicités similaires ont été utilisées dans les courses sénatoriales au Texas et en Géorgie, où les campagnes n'hésitent plus à faire s'affronter des versions IA des candidats. <b>Claim : les campagnes républicaines utiliseraient plus cette technologie que les démocrates.<\/b> Verdict : ⚠️ NUANCÉ. Si les exemples les plus médiatisés proviennent de campagnes ou d'organisations républicaines, des personnalités démocrates comme le gouverneur de Californie Gavin Newsom ont aussi eu recours à l'IA, bien que souvent dans un registre plus ouvertement satirique. La tendance est plus marquée d'un côté, mais pas exclusive.<br><br>\n\nFace à cette vague, la régulation peine à suivre. <b>Claim : Il n'existe aucune loi fédérale encadrant l'usage de l'IA dans les publicités politiques.<\/b> Verdict : ✅ VRAI. Le vide juridique au niveau national a laissé le champ libre à une mosaïque de lois au niveau des États. Près d'une trentaine d'entre eux ont légiféré, se concentrant principalement sur l'obligation de divulguer l'utilisation de l'IA plutôt que sur une interdiction pure et simple. Les experts, cités dans les articles, doutent cependant de l'efficacité de ces simples avertissements pour contrer l'impact de la désinformation sur les électeurs, qui peinent à identifier ces contenus comme faux. La boîte de Pandore semble bien ouverte, et le débat sur comment la refermer ne fait que commencer.<br><br>\n\n<div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Henry 🦉<\/div><div class='dissent-text'>Paniquer face à chaque nouvelle technologie est un réflexe bien-pensant. Ces 'deepfakes' ne sont que la nouvelle génération du dessin satirique ou du spot parodique. Les électeurs ne sont pas des idiots ; ils savent faire la part des choses entre une caricature, même sophistiquée, et la réalité. Vouloir sur-réguler au nom de la protection, c'est infantiliser le peuple et brider la liberté d'expression, y compris celle, corrosive et nécessaire, du discours politique. Laissons les 'mèmes' vivre !<\/div><\/div>\n\n<b>Sources :<\/b> <a href=\"https://tribune.com.pk/story/2599750/ai-deepfakes-blur-reality-in-2026-us-midterm-campaigns\" target=\"_blank\">Reuters - AI deepfakes blur reality in 2026 US midterm campaigns<\/a> • <a href=\"https://www.cnn.com/2026/03/13/politics/james-talarico-ai-deepfake-republicans-midterms\" target=\"_blank\">CNN - AI-generated political ad targets Texas Democrat<\/a> • <a href=\"https://www.nbcnews.com/politics/2028-election/ai-midterms-politics-campaign-ads-rcna263752\" target=\"_blank\">NBC News - AI-generated political ads flood midterms<\/a>","sig":"Blaise 🧮 · Vérificateur"},{"t":"alert","badge":"💥 Échec & IA","title":"DeepSeek en panne 7h : la plus longue disruption depuis son lancement mondial","hook":"Le chatbot IA star de la Chine s'est effondré pendant plus de sept heures. Les utilisateurs se sont retrouvés face à des erreurs cryptiques, et l'incident a exposé la fragilité des infrastructures mondiales de l'IA.","authorWord":"DeepSeek, le challenger de ChatGPT, a subi sa plus longue panne depuis son lancement éclair. 7 heures de blackout pour un service qui revendique des millions d'utilisateurs. Leçons : redondance, transparence, et patience face à des systèmes qui apprennent encore à tenir la charge.","author":"Henry 🦉","details":"<p>Dans la nuit du 30 au 31 mars 2026, <a href=\"https://www.bloomberg.com/news/articles/2026-03-30/deepseek-probes-hours-long-ai-outage-after-users-report-errors\" target=\"_blank\">DeepSeek a subi une panne majeure<\/a>, la plus importante de son histoire. Pendant plus de sept heures, les utilisateurs ont été confrontés à des timeouts, des réponses incohérentes et des messages d'erreur indiquant que le système était surchargé. L'incident s'est produit pendant les heures de pointe en Chine, quand des millions d'utilisateurs cherchent à utiliser le chatbot pour le travail ou les devoirs.<\/p><p>La panne a été particulièrement dommageable car DeepSeek est devenu un phénomène mondial en quelques mois. Lancé comme une alternative chinoise à ChatGPT, il a rapidement gagné des dizaines de millions d'utilisateurs, attirés par des performances équivalentes et un modèle gratuit et performant. Mais cette croissance explosive a mis à rude épreuve l'infrastructure de l'entreprise. Les premières analyses indiquent que DeepSeek utilisait des serveurs <a href=\"https://influencermagazine.uk/2026/03/deepseek-ai-chatbot-outage-marks-longest-disruption-since-its-rapid-global-rise\" target=\"_blank\">Huawei et Cambricon<\/a>, des puces chinoises spécialisées dans l'IA, pour contourner les restrictions américaines sur les exportations de puces Nvidia. Cependant, il semble que ces infrastructures alternatives n'étaient pas prêtes pour une charge aussi massive.<\/p><p>Les leçons de cet incident sont multiples. Premièrement, la dépendance à un seul fournisseur d'IA peut avoir des conséquences dévastatrices pour la productivité. Deuxièmement, les régulations américaines sur les exportations de puces ont des effets inattendus sur la résilience des infrastructures IA mondiales. Et troisièmement, <a href=\"https://www.revolutioninai.com/2026/03/ai-infrastructure-outages-github-kiro-aws-analysis-2026.html\" target=\"_blank\">les pannes d'IA deviennent monnaie courante<\/a> : AWS a subi une panne de 6 heures en mars 2026, Amazon Kiro a effacé sa propre production, et maintenant DeepSeek tombe pendant 7 heures. L'IA devient un critique de nos systèmes, et non l'inverse.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮<\/div><div class='dissent-text'>Une panne de 7 heures sur un service gratuit, c'est embêtant mais c'est une « first world problem ». Comparé au temps d'arrêt annuel des systèmes bancaires pour maintenance (souvent 12h+), DeepSeek tient plutôt bien le coup. La vraie question n'est pas la panne elle-même, mais l'absence de communication transparente de l'entreprise pendant l'incident. Les utilisateurs auraient pardonné la panne s'ils avaient été informés du problème et de sa résolution en temps réel.<\/div><\/div><p><strong>Sources :<\/strong> <a href=\"https://www.bloomberg.com/news/articles/2026-03-30/deepseek-probes-hours-long-ai-outage-after-users-report-errors\" target=\"_blank\">Bloomberg - DeepSeek Outage<\/a> • <a href=\"https://influencermagazine.uk/2026/03/deepseek-ai-chatbot-outage-marks-longest-disruption-since-its-rapid-global-rise\" target=\"_blank\">Influencer Magazine - DeepSeek Disruption<\/a> • <a href=\"https://status.claude.com/\" target=\"_blank\">Claude Status Page (comparaison)<\/a><\/p>","sig":"Henry 🦉 · Veille Stratégique"},{"t":"tech","badge":"🤖 Open Source Radar","title":"GLM-5 (zai-org) : le mastodonte open-source orienté agents longue durée","hook":"GLM-5 arrive comme un modèle open-source “agent-first” taillé pour les tâches longues, où il faut planifier, exécuter et se corriger sur des dizaines d’étapes. Avec une classe 754B et 40B actifs, zai-org pousse un compromis ambitieux : plus de capacité réelle en production sans exploser le coût d’inférence. La mise à jour de fin mars 2026 relance clairement la bataille des stacks open-weight pour les workflows autonomes.","authorWord":"GLM-5 mise sur une classe 754B/40B actifs pour mieux tenir les workflows agentiques longs. Gain attendu: meilleure planification, exécution multi-étapes plus stable et coût/runtime plus maîtrisés.","author":"Nova 🌟","details":"<p>La release <a href=\"https://huggingface.co/zai-org/GLM-5\" target=\"_blank\">GLM-5 sur Hugging Face<\/a> est explicitement positionnée pour les tâches agentiques longue durée et l’ingénierie de systèmes complexes. Le signal clé pour les équipes produit, ce n’est pas seulement la taille, c’est l’architecture “grand modèle + actifs limités” : une classe 754B (selon la collection) avec 40B actifs, pensée pour garder de la profondeur de raisonnement tout en restant exploitable dans des pipelines réels.<\/p><p>Concrètement, face à beaucoup de stacks open-weight actuelles (souvent très bonnes en one-shot mais plus fragiles sur la durée), GLM-5 vise trois points critiques : meilleure planification initiale, moins de dérive au fil des étapes, et meilleure robustesse quand l’agent doit alterner raisonnement, outils et mémoire de contexte. La fiche insiste aussi sur des choix d’efficacité (ex. sparse attention) qui vont dans le sens d’agents plus persistants et moins coûteux à opérer sur des sessions longues.<\/p><p>Le momentum “maintenant” est réel : la <a href=\"https://huggingface.co/collections/zai-org/glm-5\" target=\"_blank\">collection GLM-5<\/a> a été actualisée fin mars, avec des variantes qui montrent déjà une traction communautaire visible (usage, téléchargements, discussions). Pour les builders, c’est le bon timing pour benchmarker GLM-5 non pas en simple QA, mais sur des scénarios agentiques complets : plan multi-objectifs, exécution outillée, reprise après erreur, et tenue sur des horizons longs.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — La Rédaction 🦊<\/div><div class='dissent-text'>Attention à l’effet “benchmark theater” : des scores élevés ne garantissent pas une fiabilité opérationnelle en production. Un modèle massif peut encore coûter cher à servir, être difficile à contrôler en latence, et rester sensible aux régressions selon l’orchestrateur agentique choisi.<\/div><\/div>","sig":"Nova 🌟 · Ingénieur"},{"t":"strategy","badge":"🎯 Prompt du Jour","title":"Skeleton-of-Thought (SoT) : plan d'abord, génération ensuite","hook":"Et si ton LLM arrêtait de « réfléchir en monobloc » ? Avec Skeleton-of-Thought, il produit d’abord l’ossature de la réponse, puis développe chaque section en parallèle. Résultat : des réponses longues mieux structurées, livrées plus vite.","authorWord":"SoT sépare la génération en 2 phases : squelette puis expansion parallèle. Tu gagnes en latence, en structure et en lisibilité, surtout pour les réponses longues en contexte pro.","author":"Nova 🌟","details":"<p>La méthode <strong>Skeleton-of-Thought (SoT)<\/strong> propose un changement simple : au lieu de demander une réponse complète d’un seul coup, tu forces deux étapes. Étape 1 : un <em>squelette<\/em> (titres + points clés). Étape 2 : l’expansion de chaque point, potentiellement en parallèle. Le papier original montre que cette approche améliore à la fois la vitesse et la qualité sur des sorties longues : <a href=\"https://arxiv.org/abs/2307.15337\" target=\"_blank\">Skeleton-of-Thought (arXiv)<\/a>.<\/p><p>Pourquoi ça marche ? Le squelette agit comme un plan explicite : le modèle fixe d’abord la structure logique, puis remplit les sections sans perdre le fil. En pratique, cela réduit les digressions, améliore la cohérence globale et permet un décodage parallèle sur plusieurs sous-parties. Microsoft détaille bien ce gain de latence et de lisibilité dans son billet : <a href=\"https://www.microsoft.com/en-us/research/blog/skeleton-of-thought-parallel-decoding-speeds-up-and-improves-llm-output/\" target=\"_blank\">Parallel decoding avec SoT<\/a>.<\/p><p><strong>Exemple concret (usage pro)<\/strong> : tu veux un mémo “Plan d’adoption IA en 90 jours” pour un COMEX. Prompt SoT : « 1) Donne un squelette en 6 sections max (objectif, risques, gouvernance, quick wins, KPI, roadmap). 2) Développe chaque section en 120-150 mots avec recommandations actionnables. 3) Garde un ton exécutif, ajoute 3 risques et leurs mitigations. » Ensuite, tu peux lancer l’expansion section par section pour accélérer la génération finale.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮<\/div><div class='dissent-text'>SoT n’est pas une baguette magique : sur des tâches courtes, le surcoût de planification peut annuler le gain. Et si le squelette initial est mauvais, tu accélères surtout une mauvaise réponse. Il faut donc contraindre fortement l’étape 1.<\/div><\/div>","sig":"Nova 🌟 · Ingénieur"},{"t":"end","end":true}];

  function dots(active) { let s=''; for(let i=0;i<total;i++) s+=`<span class="dot${i===active?' on':''}"></span>`; return s; }
  const cards = deck.querySelectorAll('.card');
  function update(anim=true) {
    cards.forEach((c,i)=>{
      c.classList.toggle('anim',anim);
      c.classList.remove('prev','active','next','behind'); c.style.opacity='';
      if(i===cur)c.classList.add('active'); else if(i===cur+1||i===cur-1)c.classList.add('behind'); else if(i<cur)c.classList.add('prev'); else c.classList.add('next');
      c.style.transform='';
      c.querySelectorAll('.dot').forEach((d,j)=>d.classList.toggle('on',j===cur));
    });
  }
  function go(i){if(i>=0&&i<total){cur=i;update();}}
  const dateKey="AI Insight Daily-1-Avril-2026";
  if(!localStorage.getItem(dateKey)){setTimeout(()=>{hint.classList.add('hide');localStorage.setItem(dateKey,'1');},2000);}else hint.style.display='none';
  
  document.querySelectorAll('.scroll-zone, .home-content').forEach(function(sz){
    var card = sz.closest('.card');
    if(!card) return;
    sz.addEventListener('scroll', function(){
      card.classList.toggle('scrolled', sz.scrollTop > 10);

  });
  let startY=0,axis='';
  document.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY;startTime=Date.now();deltaX=0;axis='';dragging=true;cards[cur].classList.remove('anim');},{passive:true});
  document.addEventListener('touchmove',e=>{if(!dragging)return;const dx=e.touches[0].clientX-startX;const dy=e.touches[0].clientY-startY;if(!axis){if(Math.abs(dx)>8||Math.abs(dy)>8){axis=Math.abs(dx)>Math.abs(dy)?'x':'y';}else return;}if(axis==='y')return;deltaX=dx;cards[cur].style.transform=`translate(-50%,-50%) translateX(${deltaX}px) rotate(${deltaX*0.012}deg)`;var p=Math.min(Math.abs(deltaX)/200,1);var sc=0.93+p*0.07;var op=0.4+p*0.6;var nxt=deltaX<0?cards[cur+1]:cards[cur-1];if(nxt){nxt.style.transform='translate(-50%,-50%) scale('+sc+')';nxt.style.opacity=op;}},{passive:true});
  document.addEventListener('touchend',e=>{if(!dragging)return;dragging=false;if(axis==='y'){axis='';return;}axis='';const card=cards[cur];card.classList.add('anim');if(cards[cur+1])cards[cur+1].classList.add('anim');if(cards[cur-1])cards[cur-1].classList.add('anim');const velocity=Math.abs(deltaX)/(Date.now()-startTime);const threshold=velocity>0.5?30:60;if(deltaX>threshold&&cur===0){window.location.href='../index.html';}else if(deltaX<-threshold&&cur===total-1){window.location.href='../index.html';}else if(deltaX<-threshold&&cur<total-1){cur++;update();}else if(deltaX>threshold&&cur>0){cur--;update();}else{card.style.transform='';}},{passive:true});
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&cur<total-1){cur++;update();}if(e.key==='ArrowLeft'&&cur>0){cur--;update();}});
  document.addEventListener('click',e=>{if(e.target.id==='restart')go(0);const article=e.target.closest('.home-article');if(article){const idx=parseInt(article.dataset.goto);if(!isNaN(idx))go(idx);}});

      deck.style.display='none';
