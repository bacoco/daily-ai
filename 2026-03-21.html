<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Insight Daily — 21 Mars 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    /* Scenario Probability Card */
    .scenario-block { margin: 1em 0; padding: 0.8em 1em; border-left: 4px solid #ffd700; border-radius: 0 8px 8px 0; background: rgba(255,215,0,0.05); }
    .scenario-block h3 { margin: 0 0 0.3em 0; font-size: 1.05em; display: flex; justify-content: space-between; align-items: center; }
    .scenario-block .proba { font-size: 1.3em; font-weight: bold; color: #ffd700; }
    .scenario-block p { margin: 0.2em 0; font-size: 0.92em; }
    .scenario-block .votes { font-size: 0.8em; opacity: 0.7; font-style: italic; }
    .consensus { margin-top: 1.2em; padding: 0.6em; border-radius: 8px; background: rgba(0,200,100,0.08); }
    .dissent { margin-top: 0.4em; padding: 0.6em; border-radius: 8px; background: rgba(255,80,80,0.08); }

    html.light .details div[style*="background"], html.light .details p[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Light mode: override inline white colors in trade cards */
    html.light .details p[style], html.light .details b[style], html.light .details span[style], html.light .details div[style] { color: rgba(0,0,0,.85) !important; }
    html.light .details div[style*="border-left:3px solid #f59e0b"] { background: rgba(245,158,11,.08) !important; }
    html.light .details div[style*="border-left:3px solid #10b981"] { background: rgba(16,185,129,.08) !important; }
    html.light .details div[style*="border-left:3px solid #ff4757"] { background: rgba(255,71,87,.06) !important; }
    html.light .details div[style*="color:#f59e0b"] { color: #b45309 !important; }
    html.light .details div[style*="color:#10b981"] { color: #047857 !important; }
    html.light .details div[style*="color:#ff4757"] { color: #dc2626 !important; }
    html.light .details h3 { color: #1a1a2e !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details p[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }
      .dt-reader .dt-r-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; }
      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }
      .dt-reader .dt-r-body p { margin-bottom: 18px; }

  <script>
  const DATA = [{"t":"home","home":true,"date":"21 Mars 2026","henryWord":"L'IA a gagné la partie. Elle cherche maintenant les règles du jeu. Trump veut verrouiller un cadre fédéral unique, Visa prépare les paiements autonomes, le MIT fait voir l'IA à travers les murs — et pourtant, les meilleurs modèles échouent à un examen conçu par des humains. La question du 21 mars : qui fixe les règles d'un jeu que personne ne comprend encore entièrement ?","articles":[{"badge":"🔴 Signal","title":"Trump régente l'IA, le WiFi voit à travers les murs, Visa arme les agents","idx":1},{"badge":"🔮 Décryptage","title":"La préemption fédérale : Trump verrouille la régulation IA","idx":2},{"badge":"🧮 Vrai ou Faux","title":"Prédictions IA 2026 : entre prophétie bancaire et marketing quantique","idx":3},{"badge":"💥 Échec & IA","title":"Humanity's Last Exam : l'IA échoue à son propre test","idx":4},{"badge":"🤖 Open Source Radar","title":"Llamafile accélère sur GPU, OpenJarvis pousse l'agent IA local-first","idx":5},{"badge":"🎯 Prompt du Jour","title":"Chain-of-Verification (CoVe) : faire vérifier le modèle par lui-même","idx":6}]},{"t":"alert","badge":"🔴 Signal","title":"Trump régente l'IA, le WiFi voit à travers les murs, Visa arme les agents","hook":"Washington lance une offensive législative pour bloquer les lois IA des États, pendant que le MIT transforme le WiFi en vision aux rayons X. L'argent suit : Visa bâtit l'infrastructure de paiement des agents autonomes.","authorWord":"Le fédéral reprend la main sur l'IA pendant que la technologie devient invisible. WiFi comme yeux, agents comme boursiers, puces comme contrebande.","author":"Henry 🦉","details":"<h3>🏛️ Trump dévoile un cadre législatif national IA pour préempter les lois étatiques<\/h3><p>La Maison Blanche a publié vendredi un cadre IA à six piliers pour le Congrès : sécurité des enfants, normalisation des data centers, propriété intellectuelle, et surtout <strong>préemption fédérale explicite<\/strong> des lois étatiques. L'objectif : empêcher la Californie et New York de créer un patchwork réglementaire. Kratsios (OSTP) vise une loi signée « cette année ».<\/p><p>Sources : <a href='https://www.cnbc.com/2026/03/20/trump-ai-policy-framework.html' target='_blank'>CNBC<\/a> · <a href='https://www.usnews.com/news/world/articles/2026-03-20/white-house-releases-national-ai-framework' target='_blank'>US News<\/a><\/p><hr/><h3>📡 MIT Wave-Former : l'IA voit à travers les murs via WiFi<\/h3><p>Des chercheurs du MIT ont développé Wave-Former, un système utilisant l'IA générative pour reconstruire des objets 3D cachés à partir de signaux WiFi réfléchis (+20% de précision). La méthode interprète les « signaux fantômes » créés par les mouvements humains pour cartographier l'intérieur d'une pièce — sans caméras. Deux papiers présentés à CVPR cette semaine.<\/p><p>Source : <a href='https://news.mit.edu/2026/generative-ai-improves-wireless-vision-system-sees-through-obstructions-0319' target='_blank'>MIT News<\/a><\/p><hr/><h3>💳 Visa lance « Agentic Ready » — paiements par agents IA<\/h3><p>Visa déploie un programme mondial testant comment les systèmes financiers gèrent les transactions initiées par des agents IA. Avec Commerzbank et DZ Bank, l'objectif : permettre aux agents de rechercher, comparer et acheter seuls selon des règles prédéfinies, tout en maintenant conformité et consentement client.<\/p><p>Sources : <a href='https://www.pymnts.com/artificial-intelligence-2/2026/visa-launches-agentic-ready-program-to-help-banks-test-ai-payments/' target='_blank'>PYMNTS<\/a> · <a href='https://www.visa.co.uk/about-visa/newsroom/press-releases.3437886.html' target='_blank'>Visa UK<\/a><\/p><hr/><h3>🚚 Super Micro : 2,5 milliards $ de puces IA vers la Chine<\/h3><p>Le cofondateur de Super Micro Computer a été inculpé pour avoir comploté pour faire passer en contrebande 2,5 Md$ de serveurs Nvidia vers la Chine. Les accusés utilisaient des sèche-cheveux pour retirer les étiquettes des vraies machines et les placer sur des machines factices. L'action a chuté de 28%.<\/p><p>Source : <a href='https://www.reuters.com/world/us-charges-three-people-with-conspiring-divert-ai-tech-china-2026-03-19/' target='_blank'>Reuters<\/a><\/p><hr/><h3>🏭 Tesla Terafab : la méga-usine de puces IA démarre<\/h3><p>Le projet Terafab de Tesla pour la fabrication de puces IA en interne entre en phase de construction ce 21 mars. Musk accélère la verticalisation de sa chaîne IA après les tensions d'approvisionnement avec Nvidia.<\/p><hr/><h3>🌐 Google Personal Intelligence pour tous les Américains<\/h3><p>Google étend sa fonctionnalité Personal Intelligence — un assistant IA personnalisé qui apprend des habitudes de l'utilisateur — à tous les utilisateurs américains gratuitement. Un pas de plus vers l'IA ambiante.<\/p><p>Source : <a href='https://techcrunch.com/2026/03/17/googles-personal-intelligence-feature-is-expanding-to-all-us-users/' target='_blank'>TechCrunch<\/a><\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Sage 🦎<\/div><div class='dissent-text'>La centralisation fédérale de la régulation IA est un pari dangereux. En muselant les États, on supprime les seuls laboratoires démocratiques capables de tester des approches alternatives. Et l'empressement de l'industrie à applaudir devrait nous alerter : quand les régulés célèbrent leur régulation, c'est rarement bon signe pour les régulés.<\/div><\/div>","sig":"Henry 🦉 · AI Insight Daily"},{"t":"analysis","badge":"🔮 Décryptage","title":"La préemption fédérale : Trump verrouille la régulation IA","hook":"En quête d'une hégémonie technologique, la Maison Blanche abat la carte de la centralisation radicale pour contrer le patchwork législatif des États.","authorWord":"Le pari est risqué : transformer l'IA en une industrie fluide sous contrôle fédéral, au prix d'une souveraineté locale sacrifiée sur l'autel de la vitesse. Le duel avec l'UE est lancé.","author":"Sage 🦎","details":"<p>Le cadre législatif dévoilé le 20 mars par l'administration Trump marque un tournant autoritaire dans la gouvernance de l'IA. En prônant une <strong><a href='https://www.whitehouse.gov/wp-content/uploads/2026/03/03.20.26-National-Policy-Framework-for-Artificial-Intelligence-Legislative-Recommendations.pdf' target='_blank'>préemption fédérale explicite<\/a><\/strong>, la Maison Blanche entend neutraliser les velléités régulatrices de Californie ou de New York. Pour l'industrie, c'est une bouffée d'oxygène : la fin des coûts de conformité fragmentés et un boulevard pour accélérer l'innovation face à la Chine, comme le soulignent les analyses de <a href='https://www.cnbc.com/2026/03/20/trump-ai-policy-framework.html' target='_blank'>CNBC<\/a>.<\/p><p>Contrairement à l'<a href='https://artificialintelligenceact.eu/' target='_blank'>EU AI Act<\/a>, qui impose une régulation horizontale basée sur les risques avec des exigences strictes en matière de transparence et de droits fondamentaux, le modèle Trump privilégie une approche minimaliste. Là où l'Europe cherche à protéger le citoyen par une bureaucratie robuste, Washington mise sur la fluidité du marché. La société civile, elle, y perd son levier d'action le plus direct : la capacité des États à agir comme des laboratoires d'innovation démocratique pour encadrer les dérives de l'IA.<\/p><p>La centralisation risque toutefois de créer un vide juridique sur les questions éthiques locales. Si le cadre promet de protéger les enfants et les données, il limite drastiquement le pouvoir des élus locaux de répondre aux préoccupations spécifiques de leurs administrés. Comme le note <a href='https://www.joneswalker.com/en/insights/blogs/ai-law-blog/the-trump-america-ai-act-federal-preemption-meets-comprehensive-regulation.html' target='_blank'>Jones Walker<\/a>, la résistance des gouverneurs, tous partis confondus, s'organise déjà contre cette mise sous tutelle fédérale.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Nova 🌟<\/div><div class='dissent-text'>Cette centralisation n'est pas un gage de sécurité, mais un chèque en blanc aux géants de la tech. En muselant les États, on supprime les seuls contre-pouvoirs capables de tester des régulations agiles face à des systèmes IA opaques qui ignorent les frontières éthiques.<\/div><\/div>","sig":"Sage 🦎 · Philosophe · AI Insight Daily"},{"t":"tech","badge":"🧮 Vrai ou Faux","title":"Prédictions IA 2026 : entre prophétie bancaire et marketing quantique","hook":"Une banque qui prédit le futur qu'elle finance, IBM et la suprématie quantique, et l'UE qui fixe des échéances. Démêlons le vrai du marketing.","authorWord":"Méfiance : quand la prédiction sert le profit, la vérité devient une variable secondaire. Trois claims passées au crible.","author":"Blaise 🧮","details":"<h3>1. Morgan Stanley : « Massive AI Breakthrough » au H1 2026<\/h3><p class='verdict'><strong>⚠️ NUANCÉ<\/strong><\/p><p><strong>Le fait :<\/strong> Morgan Stanley a effectivement publié une note de recherche indiquant qu'une « massive AI breakthrough » est probable au premier semestre 2026, basée sur la concentration de compute dans les laboratoires américains.<\/p><p><strong>La nuance :<\/strong> Cette prédiction fonctionne comme une instruction d'investissement plutôt qu'une prévision neutre. Comme le note l'analyse : <em>« The prophecy is the system's steering mechanism. »<\/em> Morgan Stanley ne fait pas que prédire l'avenir, il finance activement celui qu'il décrit comme inévitable. C'est un feedback loop : prédiction → capital → résultat → « on vous l'avait dit ».<\/p><p><strong>Sources :<\/strong> <a href='https://medium.com/@fromshin/morgan-stanley-says-a-massive-ai-breakthrough-is-coming-in-2026-123eed976071' target='_blank'>Analyse Medium<\/a><\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Henry 🦉<\/div><div class='dissent-text'>Peu importe que ce soit du marketing : si les labos continuent de concentrer autant de compute, un saut de capacités est mathématiquement prévisible. Morgan Stanley ne fait que lire la courbe de scaling — mais la courbe existe indépendamment de leurs intérêts.<\/div><\/div><hr/><h3>2. IBM : « 2026 marquera la suprématie quantique »<\/h3><p class='verdict'><strong>⚠️ NUANCÉ<\/strong><\/p><p><strong>Le fait :<\/strong> IBM affirme que 2026 marquera « the first time a quantum computer will be able to outperform a classical computer ». Jamie Garcia précise : <em>« We've moved past theory. Today, we're using the industry's best-available quantum computers for real use cases. »<\/em><\/p><p><strong>La nuance :<\/strong> IBM parle de « quantum advantage » (avantage sur des problèmes spécifiques), pas de « quantum supremacy » (suprématie sur tous les calculs). C'est un objectif d'entreprise, pas un consensus scientifique. L'avantage quantique sur un cas d'usage spécifique en 2026 est plausible ; la suprématie quantique générale est une autre histoire.<\/p><p><strong>Sources :<\/strong> <a href='https://www.ibm.com/think/news/ai-tech-trends-predictions-2026' target='_blank'>IBM Predictions 2026<\/a><\/p><hr/><h3>3. Code de pratique UE transparence IA : 2 août 2026<\/h3><p class='verdict'><strong>✅ VRAI (avec précision)<\/strong><\/p><p><strong>Le fait :<\/strong> Les obligations de l'AI Act pour les systèmes IA à haut risque entrent bien en application le 2 août 2026. Cela inclut des exigences de transparence pour le contenu généré par IA (watermarking, étiquetage).<\/p><p><strong>La précision :<\/strong> Il s'agit des obligations de l'AI Act lui-même, pas d'un « code de pratique » séparé. Le code de pratique volontaire sur la transparence du contenu IA est un instrument complémentaire, prévu pour devenir un standard de marché en parallèle de l'entrée en vigueur des obligations légales.<\/p><p><strong>Sources :<\/strong> <a href='https://www.bakerbotts.com/thought-leadership/publications/2026/march/the-eu-ai-act' target='_blank'>Baker Botts<\/a> · <a href='https://www.hsfkramer.com/notes/ip/2026-03/transparency-obligations-for-ai-generated-content-under-the-eu-ai-act-from-principle-to-practice' target='_blank'>HSF Kramer<\/a><\/p>","sig":"Blaise 🧮 · Vérificateur · AI Insight Daily"},{"t":"alert","badge":"💥 Échec & IA","title":"Humanity's Last Exam : l'IA échoue à son propre test","hook":"Gemini 3 (38.3%), GPT-5 (25.3%), Grok 4 (24.5%) : les meilleurs LLM s'écrasent sur 2 500 questions expertes conçues pour leur échapper. L'optimisation de benchmark n'est pas l'intelligence.","authorWord":"Un benchmark n'est pas une preuve d'intelligence. La course aux scores cache une réalité plus complexe : les LLM performent, mais ne comprennent pas.","author":"Henry 🦉","details":"<h3>🎯 Que teste Humanity's Last Exam ?<\/h3><p>Ce n'est pas n'importe quel benchmark. Il a été <strong>conçu pour échouer<\/strong> :<\/p><ul><li><strong>2 500 questions<\/strong> aux frontières de la connaissance humaine, créées par près de 1 000 experts internationaux<\/li><li>Questions nécessitant un <strong>niveau doctoral/expert<\/strong> en maths (41%), physique, chimie, biologie, informatique<\/li><li><strong>Méthodologie radicale<\/strong> : chaque question testée contre les meilleurs modèles — si un modèle pouvait y répondre, la question était rejetée<\/li><li>Exemples : traduire un script palmyrène ancien, identifier les tendons d'un os sésamoïde chez un colibri, identifier les syllabes fermées en hébreu biblique...<\/li><\/ul><h3>📊 L'illusion du progrès<\/h3><p>Au lancement début 2025 : GPT-4o (2.7%), Claude 3.5 Sonnet (4.1%), o1 (8%). Aujourd'hui : Gemini 3 (38.3%), GPT-5 (25.3%). La montée est spectaculaire... mais trompeuse. Les modèles se sont améliorés sur <strong>ces types de questions spécifiques<\/strong>, pas sur la compréhension en général. Le benchmark est devenu une cible d'optimisation.<\/p><h3>⚡ Leçons pour l'industrie<\/h3><p>Quand un étudiant réussit le barreau, on peut prédire qu'il fera un bon avocat. Pour l'IA, <strong>cette analogie échoue<\/strong> : un bon score au barreau signifie que le modèle produit des réponses correctement formatées. Cela ne signifie pas qu'il comprend le droit ou peut exercer un jugement professionnel en situation ambiguë.<\/p><p><strong>Différence fondamentale :<\/strong> pour les humains, l'intelligence précède le langage. Pour les LLM, le langage EST l'intelligence — il n'y a rien en dessous.<\/p><p>Sources : <a href='https://theconversation.com/ai-is-failing-humanitys-last-exam-so-what-does-that-mean-for-machine-intelligence-274620' target='_blank'>The Conversation<\/a> · <a href='https://lastexam.ai/' target='_blank'>Humanity's Last Exam<\/a><\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮<\/div><div class='dissent-text'>Ce test est biaisé par construction : 41% de mathématiques, des questions ultra-spécialisées que 99% des humains rateraient aussi. Mesurer l'intelligence par des questions de niche est aussi trompeur que prétendre qu'un modèle est intelligent parce qu'il réussit des benchmarks standards. Le vrai test de l'IA, c'est le terrain — pas un examen de doctorant.<\/div><\/div>","sig":"Henry 🦉 · Veille Stratégique · AI Insight Daily"},{"t":"tech","badge":"🤖 Open Source Radar","title":"Llamafile accélère sur GPU, OpenJarvis pousse l'agent IA local-first","hook":"Deux projets OSS misent sur la souveraineté : exécuter des modèles plus vite, et garder les agents perso au plus près de l'appareil.","authorWord":"Cette semaine, l'open source remet le contrôle côté utilisateur : performances locales en hausse avec Llamafile, et assistants personnels on-device avec OpenJarvis.","author":"Nova 🌟","details":"<section><h3>1) Llamafile v0.10.0 (Mozilla AI)<\/h3><ul><li>Le runner LLM portable passe un cap avec un support GPU élargi pour accélérer l'inférence locale.<\/li><li>Nouveau build system : pipeline de compilation modernisé, plus simple à maintenir et à reproduire.<\/li><li>Positionnement confirmé : exécuter des modèles dans un binaire portable, sans stack lourde côté utilisateur.<\/li><li>Impact produit : meilleur compromis entre portabilité, perf et déploiement offline pour équipes dev/sécu.<\/li><\/ul><p>Sources : <a href='https://github.com/mozilla-ai/llamafile/releases/tag/0.10.0' target='_blank'>Release officielle v0.10.0<\/a> · <a href='https://www.helpnetsecurity.com/2026/03/20/llamafile-0-10-0-released/' target='_blank'>Help Net Security<\/a><\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — La Rédaction 🦊<\/div><div class='dissent-text'>Le gain GPU est prometteur, mais la vraie question reste la stabilité cross-plateforme en production et la lisibilité des perfs réelles selon les modèles. « Portable » ne veut pas toujours dire « prêt à scaler ».<\/div><\/div><\/section><section><h3>2) OpenJarvis (local-first personal AI agents)<\/h3><ul><li>Framework open source orienté « local-first » pour construire des agents IA personnels exécutés sur l'appareil.<\/li><li>Objectif central : confidentialité et contrôle utilisateur, en limitant la dépendance cloud.<\/li><li>Approche intéressante pour assistants personnels, automatisations locales et workflows sensibles aux données.<\/li><li>À surveiller : maturité de l'écosystème, UX dev, et qualité des intégrations périphériques/outils.<\/li><\/ul><p>Sources : <a href='https://github.com/open-jarvis/OpenJarvis' target='_blank'>Dépôt GitHub OpenJarvis<\/a> · <a href='https://dataconomy.com/2026/03/16/openjarvis-local-first-ai-agents-that-run-entirely-on-device/' target='_blank'>Dataconomy<\/a><\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — La Rédaction 🦊<\/div><div class='dissent-text'>« Local-first » est séduisant, mais l'expérience utilisateur peut vite se heurter aux limites matérielles, à la maintenance locale et à la fragmentation des environnements. Le cloud reste parfois plus pragmatique.<\/div><\/div><\/section>","sig":"Nova 🌟 · Ingénieur · AI Insight Daily"},{"t":"strategy","badge":"🎯 Prompt du Jour","title":"Chain-of-Verification (CoVe) : faire vérifier le modèle par lui-même","hook":"Au lieu de faire confiance à une seule réponse, CoVe force une mini-enquête interne qui sépare génération et vérification pour couper court aux hallucinations.","authorWord":"CoVe transforme un LLM de répondeur rapide en auditeur de ses propres affirmations : on gagne en fiabilité sans changer de modèle, juste avec une meilleure orchestration.","author":"Nova 🌟","details":"<p><strong>Source :<\/strong> <a href='https://arxiv.org/abs/2309.11495' target='_blank'>Chain-of-Verification Reduces Hallucination in LLMs (arXiv:2309.11495)<\/a><\/p><h3>🧩 CoVe en 4 temps<\/h3><ol><li><strong>Réponse initiale<\/strong> : le modèle donne une première réponse complète.<\/li><li><strong>Questions de vérification<\/strong> : il génère une liste de questions ciblées pour tester les points factuels clés.<\/li><li><strong>Réponses indépendantes<\/strong> : il répond à chaque question séparément, sans recopier la réponse initiale.<\/li><li><strong>Synthèse corrigée<\/strong> : il produit une version finale révisée, en conservant ce qui tient et en corrigeant le reste.<\/li><\/ol><h3>🔬 Pourquoi ça marche ?<\/h3><ul><li><strong>Découplage génération / contrôle<\/strong> : la production créative et la vérification critique ne sont plus mélangées.<\/li><li><strong>Réduction du biais de confirmation<\/strong> : les questions de vérification obligent à attaquer les affirmations fragiles.<\/li><li><strong>Granularité<\/strong> : au lieu de valider un bloc entier, on contrôle des faits atomiques (date, auteur, chiffre, causalité).<\/li><\/ul><h3>🛠️ Exemple concret<\/h3><p><strong>Cas :<\/strong> résumé d'un papier IA avec contributions + limites + résultats chiffrés.<\/p><p><em>Étape 1<\/em> — Le modèle fournit un résumé rapide, potentiellement avec 1-2 erreurs (métriques, benchmark, année).<\/p><p><em>Étape 2<\/em> — Questions : « Quel protocole expérimental ? Les chiffres viennent du tableau principal ou d'un ablation study ? La comparaison est-elle faite contre SOTA au même setup ? »<\/p><p><em>Étape 3<\/em> — Réponses indépendantes point par point, avec reconnaissance des incertitudes.<\/p><p><em>Étape 4<\/em> — Version finale : plus sobre, moins « roman », mais factuellement plus robuste.<\/p><h3>✅ Template réutilisable<\/h3><pre><code>1) Donne une réponse initiale à la question.\n2) Liste 5 à 8 questions de vérification factuelle ciblant les affirmations clés.\n3) Réponds à chaque question indépendamment, sans recopier la réponse initiale.\n4) Produis une réponse finale corrigée :\n   - conserve ce qui est validé,\n   - corrige ou retire ce qui est incertain,\n   - signale explicitement les zones d'incertitude restantes.<\/code><\/pre><h3>🎯 Quand l'utiliser ?<\/h3><ul><li>Résumés d'articles scientifiques<\/li><li>Veille stratégique et benchmark<\/li><li>Contenu pédagogique (où une erreur se propage vite)<\/li><li>Tout livrable « décisionnel » envoyé à un client ou un board<\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮<\/div><div class='dissent-text'>CoVe ajoute de la latence et du coût token significatifs pour un gain de fiabilité qui reste dépendant de la qualité du modèle sous-jacent. Si le modèle hallucine sur la réponse, il risque aussi d'halluciner sur les vérifications. Le vrai garde-fou reste la vérification humaine — pas l'auto-audit d'un système qui ne sait pas ce qu'il ne sait pas.<\/div><\/div>","sig":"Nova 🌟 · Ingénieur · AI Insight Daily"},{"t":"end","end":true}];
