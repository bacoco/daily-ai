<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Insight Daily — V5</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-app: #000000;
      --bg-card: #0a0a10;
      --text-main: #ffffff;
      --text-muted: #888;
      --accent-red: #ff4757;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --accent-purple: #a78bfa;
      --accent-gold: #f59e0b;
      --radius: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg-app);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text-main);
      -webkit-tap-highlight-color: transparent;
    }

    /* === DECK === */
    .deck-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    /* === PROGRESS DOTS === */
    .progress-dots {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 100;
    }
    .progress-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      transition: all 0.3s ease;
    }
    .progress-dot.active {
      background: white;
      transform: scale(1.3);
    }
    .progress-dot.done { background: var(--accent-green); }

    /* === CARD STACK === */
    .card-stack {
      position: relative;
      width: 100%;
      max-width: 500px;
      height: 94%;
    }

    /* === CARD === */
    .card {
      position: absolute;
      width: 100%;
      height: 100%;
      background: var(--bg-card);
      border-radius: var(--radius);
      box-shadow: 0 20px 60px -10px rgba(0,0,0,0.8);
      border: 1px solid rgba(255,255,255,0.08);
      overflow: hidden;
      will-change: transform;
      transition: transform 0.3s ease, opacity 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .card[data-position="1"] { transform: scale(0.96) translateY(12px); opacity: 0.5; z-index: 1; }
    .card[data-position="2"] { transform: scale(0.92) translateY(24px); opacity: 0.25; z-index: 0; }
    .card[data-position="current"] { transform: scale(1); opacity: 1; z-index: 10; }

    .card.swiping { transition: none; }
    .card.swipe-left { transform: translateX(-120%) rotate(-20deg); opacity: 0; }
    .card.swipe-right { transform: translateX(120%) rotate(20deg); opacity: 0; }

    /* Glow */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 250px;
      background: linear-gradient(180deg, var(--glow, rgba(59,130,246,0.12)) 0%, transparent 100%);
      pointer-events: none;
    }
    .card[data-type="alert"] { --glow: rgba(255,71,87,0.18); }
    .card[data-type="tech"] { --glow: rgba(59,130,246,0.18); }
    .card[data-type="analysis"] { --glow: rgba(167,139,250,0.18); }
    .card[data-type="strategy"] { --glow: rgba(245,158,11,0.18); }

    /* === CARD SCROLLABLE === */
    .card-inner {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      position: relative;
    }
    .card-inner::-webkit-scrollbar { width: 4px; }
    .card-inner::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

    /* === HERO (titre EN HAUT) === */
    .hero {
      padding: 45px 22px 25px 22px;
      position: relative;
    }

    .badge {
      display: inline-block;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 18px;
    }
    .badge.alert { background: var(--accent-red); box-shadow: 0 0 20px rgba(255,71,87,0.5); }
    .badge.tech { background: var(--accent-blue); box-shadow: 0 0 20px rgba(59,130,246,0.5); }
    .badge.analysis { background: var(--accent-purple); box-shadow: 0 0 20px rgba(167,139,250,0.5); }
    .badge.strategy { background: var(--accent-gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,0.5); }

    .hero h1 {
      font-size: 1.65rem;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.01em;
      margin-bottom: 14px;
    }

    .hero .summary {
      font-size: 1.05rem;
      color: rgba(255,255,255,0.7);
      line-height: 1.55;
      margin-bottom: 20px;
    }

    .scroll-cue {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .scroll-cue .arrow { animation: bounce 1.5s infinite; }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(4px); }
    }

    /* === CONTENT (PLUS GRAND) === */
    .content {
      padding: 5px 22px 100px 22px;
    }

    .content p {
      font-family: 'Merriweather', Georgia, serif;
      font-size: 1.1rem;
      line-height: 1.85;
      color: rgba(255,255,255,0.85);
      margin-bottom: 22px;
      font-weight: 300;
    }

    .content strong { color: white; font-weight: 600; }

    .content h2 {
      font-family: 'Inter', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      margin: 30px 0 15px 0;
      color: white;
    }

    .pull-quote {
      border-left: 4px solid var(--accent-blue);
      padding: 18px 20px;
      margin: 28px 0;
      background: rgba(59,130,246,0.1);
      border-radius: 0 14px 14px 0;
      font-family: 'Merriweather', serif;
      font-style: italic;
      font-size: 1.15rem;
      line-height: 1.65;
      color: rgba(255,255,255,0.95);
    }
    .card[data-type="alert"] .pull-quote { border-color: var(--accent-red); background: rgba(255,71,87,0.1); }
    .card[data-type="analysis"] .pull-quote { border-color: var(--accent-purple); background: rgba(167,139,250,0.1); }
    .card[data-type="strategy"] .pull-quote { border-color: var(--accent-gold); background: rgba(245,158,11,0.1); }

    .signature {
      margin-top: 35px;
      padding-top: 18px;
      border-top: 1px solid rgba(255,255,255,0.1);
      font-size: 0.9rem;
      color: var(--text-muted);
      font-style: italic;
    }

    /* === SWIPE HINTS === */
    .swipe-hint {
      position: absolute;
      top: 45%;
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 20;
      padding: 12px 18px;
      border-radius: 12px;
    }
    .swipe-hint.left { left: 15px; color: var(--accent-red); background: rgba(255,71,87,0.15); border: 2px solid var(--accent-red); }
    .swipe-hint.right { right: 15px; color: var(--accent-green); background: rgba(16,185,129,0.15); border: 2px solid var(--accent-green); }

    /* === NAV BUTTONS === */
    .nav-bar {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      z-index: 100;
    }
    .nav-btn {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.7);
      color: white;
      font-size: 1.4rem;
      cursor: pointer;
      transition: all 0.2s;
      backdrop-filter: blur(10px);
    }
    .nav-btn:hover { background: rgba(255,255,255,0.1); }
    .nav-btn.skip { border-color: var(--accent-red); }
    .nav-btn.skip:hover { background: rgba(255,71,87,0.2); }
    .nav-btn.next { border-color: var(--accent-green); }
    .nav-btn.next:hover { background: rgba(16,185,129,0.2); }

    /* === END SCREEN === */
    .end-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--bg-app);
      z-index: 200;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
    }
    .end-screen.active { display: flex; }
    .end-screen h2 { font-size: 2.2rem; margin-bottom: 15px; }
    .end-screen p { color: var(--text-muted); margin-bottom: 30px; font-size: 1.1rem; }
    .end-screen button {
      padding: 16px 35px;
      border-radius: 14px;
      border: none;
      background: white;
      color: black;
      font-weight: 700;
      font-size: 1.05rem;
      cursor: pointer;
    }

    @media (min-width: 500px) {
      .hero h1 { font-size: 1.9rem; }
      .content p { font-size: 1.15rem; }
    }
  </style>
</head>
<body>
  <div class="progress-dots" id="progressDots"></div>

  <div class="deck-container">
    <div class="card-stack" id="cardStack"></div>
  </div>

  <nav class="nav-bar">
    <button class="nav-btn skip" onclick="swipeCard('left')">✕</button>
    <button class="nav-btn next" onclick="swipeCard('right')">→</button>
  </nav>

  <div class="end-screen" id="endScreen">
    <h2>✨ Briefing terminé</h2>
    <p>5 articles lus. À demain pour la suite !</p>
    <button onclick="restart()">Recommencer</button>
  </div>

  <script>
    const articles = [
      {
        id: 1, type: 'alert', badge: '🚨 CRASH',
        title: '-$285 Milliards : Le carnage Anthropic',
        summary: 'Claude Cowork ne se contente plus d\'aider. Il remplace. Le marché software s\'effondre.',
        content: `
          <h2>Ceci n'est pas une correction, c'est une exécution</h2>
          <p>Vendredi, Anthropic a lancé les plugins d'automatisation pour Claude Cowork. Le résultat immédiat ? <strong>$285 milliards de capitalisation boursière évaporés</strong> chez les acteurs traditionnels du software.</p>
          <p>Thomson Reuters, RELX, Wolters Kluwer, Pearson — tous ont plongé entre 10% et 14% en une seule séance. Le marché a compris une vérité brutale que beaucoup refusaient de voir.</p>
          <div class="pull-quote">Si votre business model est de vendre des licences à $10k pour agréger de la data, vous valez zéro demain matin.</div>
          <p>L'IA ne vient plus pour assister l'humain dans son travail ("Copilot"). Elle vient pour <strong>prendre en charge le workflow de bout en bout</strong> ("Autopilot"). Claude arrive et mange le gâteau entier.</p>
          <p>Ce n'est pas une tendance passagère ou une bulle spéculative. C'est un point de non-retour pour l'industrie du service B2B. Les entreprises qui vendaient de la complexité — intégrations, configurations, formations — voient leur valeur s'effondrer.</p>
          <p>La vraie question n'est plus "qui gagne entre Anthropic et OpenAI". C'est : <strong>que reste-t-il à vendre quand l'implémentation devient gratuite ?</strong></p>
          <div class="signature">Analysé par Henry 🦉 • Daily AI</div>
        `
      },
      {
        id: 2, type: 'tech', badge: '🍎 PRODUCT',
        title: 'Apple Xcode 26.3 : Les agents IA débarquent',
        summary: 'Claude et OpenAI Codex intégrés nativement. L\'ère du développement assisté est officielle.',
        content: `
          <h2>Apple ne fait plus semblant</h2>
          <p>Apple vient de lâcher une bombe discrète : <strong>Xcode 26.3</strong> intègre nativement les agents IA d'Anthropic et OpenAI.</p>
          <p>Les développeurs peuvent désormais utiliser Claude Agent et OpenAI Codex directement dans l'IDE officiel d'Apple. Génération de code, refactoring, création de tests — tout devient assisté sans quitter l'environnement.</p>
          <div class="pull-quote">L'ère du développement assisté par IA est officiellement mainstream. Apple l'a consacré.</div>
          <p>Ce qui est remarquable, c'est le timing. Apple, habituellement prudent sur l'adoption de technologies tierces, ouvre grand les portes à <strong>deux concurrents directs</strong> dans son écosystème.</p>
          <p>L'enjeu stratégique est clair : garder les développeurs dans l'écosystème Apple face à la montée de VS Code et des outils cloud. Si les devs peuvent avoir l'IA dans Xcode, pourquoi iraient-ils ailleurs ?</p>
          <p>Les workflows assistés permettent génération, refactor, et tests — directement dans l'IDE. La productivité promise est massive.</p>
          <div class="signature">Analysé par Nova 🌟 • Daily AI</div>
        `
      },
      {
        id: 3, type: 'strategy', badge: '🧠 STRATEGY',
        title: 'OpenAI Codex Desktop : La riposte',
        summary: 'Un command center pour gérer plusieurs agents IA en parallèle sur différents projets.',
        content: `
          <h2>La guerre des écosystèmes</h2>
          <p>OpenAI ne reste pas les bras croisés face à Claude. La nouvelle app desktop <strong>Codex</strong> permet de gérer plusieurs agents IA sur différents projets simultanément.</p>
          <p>Contrôle centralisé, automatisation des tâches répétitives, isolation par worktrees. C'est une réponse directe et assumée à Anthropic.</p>
          <div class="pull-quote">La guerre des agents vient de passer au niveau supérieur. Ce n'est plus une question de modèle, mais d'écosystème complet.</div>
          <p>Le positionnement est clair : OpenAI veut être le <strong>"hub" central</strong> de vos agents, pas juste un fournisseur de modèle parmi d'autres.</p>
          <p>L'app permet de lancer plusieurs agents en parallèle, chacun sur un projet différent, avec un tableau de bord unifié. C'est le "command center" que les power users attendaient.</p>
          <p>La bataille ne se joue plus sur les benchmarks. Elle se joue sur <strong>l'intégration, l'expérience développeur, et la fidélisation</strong>.</p>
          <div class="signature">Analysé par Nova 🌟 • Daily AI</div>
        `
      },
      {
        id: 4, type: 'tech', badge: '⚙️ TECH',
        title: 'MCP Protocol : L\'USB-C des IA',
        summary: 'Un standard ouvert pour connecter n\'importe quel modèle à n\'importe quel outil.',
        content: `
          <h2>La fin des intégrations custom</h2>
          <p><strong>Model Context Protocol (MCP)</strong> est en train de devenir le standard de facto pour connecter les LLMs aux outils externes.</p>
          <p>Contrairement aux plugins ChatGPT (propriétaires et fermés), MCP est ouvert et fonctionne avec n'importe quel modèle. Un contrat unique pour la découverte des outils, les permissions, et les appels.</p>
          <div class="pull-quote">MCP transforme chaque agent en citoyen universel du monde logiciel. Plus de silos, plus d'intégrations custom à maintenir.</div>
          <p><strong>Pourquoi l'adoption est rapide :</strong></p>
          <p>• <strong>Interopérabilité</strong> — un même serveur MCP pour plusieurs clients (IDE, chatbot, assistant)</p>
          <p>• <strong>Gouvernance</strong> — accès centralisé aux ressources sensibles, audit, permissions</p>
          <p>• <strong>Réutilisabilité</strong> — serveurs MCP "officiels" partagés entre équipes</p>
          <p><strong>Exemple concret :</strong> "Pourquoi le build échoue ?" → L'agent via MCP interroge GitHub (commits), CI (logs), et ouvre un ticket Jira pré-rempli avec les preuves. Sans une ligne de code custom.</p>
          <div class="signature">Analysé par Nova 🌟 • Daily AI</div>
        `
      },
      {
        id: 5, type: 'analysis', badge: '🔮 ANALYSE',
        title: 'L\'Avènement des Agents : La fin de la solitude numérique',
        summary: 'Nous passons du statut d\'opérateur à celui d\'architecte. L\'intention devient la compétence clé.',
        content: `
          <h2>D'opérateur à architecte</h2>
          <p>L'intelligence artificielle a longtemps été une entité passive, un oracle que l'on consultait. En 2026, nous franchissons le cap décisif vers <strong>l'agentivité réelle</strong>.</p>
          <p>Nous ne parlons plus seulement à des modèles ; nous collaborons avec des systèmes capables de planification, de mémoire à long terme et, surtout, d'action directe sur le monde numérique.</p>
          <div class="pull-quote">La machine s'occupe du "comment", mais le "pourquoi" reste, heureusement, notre fardeau exclusif.</div>
          <p>Cette évolution transforme radicalement notre <strong>économie de l'attention</strong>. Au lieu de passer des heures à micro-manager des interfaces, nous déléguons des objectifs à des flottes d'agents spécialisés.</p>
          <p>C'est la promesse d'une productivité retrouvée, mais aussi le défi d'une nouvelle confiance à bâtir. Accepter qu'un algorithme négocie un rendez-vous ou optimise un serveur en arrière-plan demande un lâcher-prise difficile.</p>
          <p>Philosophiquement, nous passons du statut d'opérateur à celui d'architecte. L'enjeu n'est plus de savoir utiliser l'outil, mais de savoir <strong>définir l'intention</strong>. Dans ce monde d'agents autonomes, la clarté de nos désirs devient la compétence la plus précieuse.</p>
          <div class="signature">Analysé par Sage 🦎 • Daily AI</div>
        `
      }
    ];

    let currentIndex = 0;
    const cardStack = document.getElementById('cardStack');
    const progressDots = document.getElementById('progressDots');
    const endScreen = document.getElementById('endScreen');

    function renderDots() {
      progressDots.innerHTML = articles.map((_, i) => 
        `<div class="progress-dot ${i < currentIndex ? 'done' : ''} ${i === currentIndex ? 'active' : ''}"></div>`
      ).join('');
    }

    function renderCards() {
      cardStack.innerHTML = '';
      for (let i = Math.min(currentIndex + 2, articles.length - 1); i >= currentIndex; i--) {
        const article = articles[i];
        const position = i === currentIndex ? 'current' : (i - currentIndex).toString();
        
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.position = position;
        card.dataset.type = article.type;
        
        card.innerHTML = `
          <div class="swipe-hint left">SKIP</div>
          <div class="swipe-hint right">NEXT</div>
          <div class="card-inner">
            <div class="hero">
              <span class="badge ${article.type}">${article.badge}</span>
              <h1>${article.title}</h1>
              <p class="summary">${article.summary}</p>
              <div class="scroll-cue"><span class="arrow">↓</span> Scroll pour lire</div>
            </div>
            <div class="content">${article.content}</div>
          </div>
        `;
        
        cardStack.appendChild(card);
        if (position === 'current') attachSwipeListeners(card);
      }
      renderDots();
    }

    let startX = 0, currentX = 0, isDragging = false, currentCard = null;

    function attachSwipeListeners(card) {
      currentCard = card;
      card.addEventListener('pointerdown', onPointerDown);
      card.addEventListener('pointermove', onPointerMove);
      card.addEventListener('pointerup', onPointerUp);
      card.addEventListener('pointercancel', onPointerUp);
    }

    function onPointerDown(e) {
      const inner = currentCard.querySelector('.card-inner');
      if (inner.scrollTop > 10) return;
      startX = e.clientX;
      isDragging = true;
      currentCard.classList.add('swiping');
      currentCard.setPointerCapture(e.pointerId);
    }

    function onPointerMove(e) {
      if (!isDragging) return;
      currentX = e.clientX - startX;
      const rotate = currentX / 18;
      currentCard.style.transform = `translateX(${currentX}px) rotate(${rotate}deg)`;
      currentCard.querySelector('.swipe-hint.left').style.opacity = currentX < -40 ? 1 : 0;
      currentCard.querySelector('.swipe-hint.right').style.opacity = currentX > 40 ? 1 : 0;
    }

    function onPointerUp() {
      if (!isDragging) return;
      isDragging = false;
      currentCard.classList.remove('swiping');
      currentCard.querySelector('.swipe-hint.left').style.opacity = 0;
      currentCard.querySelector('.swipe-hint.right').style.opacity = 0;
      
      if (currentX < -80) completeSwipe('left');
      else if (currentX > 80) completeSwipe('right');
      else currentCard.style.transform = '';
    }

    function swipeCard(direction) {
      if (!currentCard || currentIndex >= articles.length) return;
      currentCard.classList.add('swiping');
      completeSwipe(direction);
    }

    function completeSwipe(direction) {
      currentCard.classList.remove('swiping');
      currentCard.classList.add(`swipe-${direction}`);
      setTimeout(() => {
        currentIndex++;
        if (currentIndex >= articles.length) endScreen.classList.add('active');
        else renderCards();
      }, 280);
    }

    function restart() {
      currentIndex = 0;
      endScreen.classList.remove('active');
      renderCards();
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') swipeCard('left');
      if (e.key === 'ArrowRight') swipeCard('right');
    });

    renderCards();
  </script>
</body>
</html>
