      background: var(--bg);

      transition: opacity 0.4s;

      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: .45; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;

    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }

    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }

    body::before {

    }
  </style>

    "author": "Henry 🦉",
    "details": "<p><strong>1. SaaS : 2 000 milliards de market cap évaporés</strong><br>Selon <a href=\"https://fortune.com/2026/02/10/stocks-2-trillion-software-wipeout-ai-bull-market/\" target=\"_blank\">Fortune</a>, le secteur logiciel a perdu ~2 000 Md$ en capitalisation. La peur que les agents IA remplacent les licences SaaS classiques fait plonger Salesforce, Freshworks, ServiceNow. <a href=\"https://investorplace.com/hypergrowthinvesting/2026/02/saasmageddon-is-here-and-not-all-software-stocks-will-survive/\" target=\"_blank\">InvestorPlace</a> parle de « SaaSmageddon ».</p><p><strong>2. Morgan Stanley : le selloff SaaS menace 1 500 Md$ de crédit US</strong><br><a href=\"https://www.reuters.com/business/finance/ailed-software-selloff-may-pose-risk-15-trillion-us-credit-market-says-morgan-2026-02-10/\" target=\"_blank\">Reuters</a> rapporte que le software représente 16% (235 Md$) du marché des prêts US. Morgan Stanley prévient : si le selloff s'aggrave, la contagion crédit est réelle.</p><p><strong>3. Blackstone monte à 1 Md$ dans Anthropic (valo ~350 Md$)</strong><br>Le géant de l'investissement alternatif injecte 200 M$ supplémentaires dans Anthropic, portant sa participation totale à ~1 Md$ (<a href=\"https://www.reuters.com/technology/blackstone-boosts-stake-ai-startup-anthropic-about-1-billion-source-says-2026-02-10/\" target=\"_blank\">Reuters</a>). Anthropic est valorisé ~350 milliards.</p><p><strong>4. Kenosha : un procureur sanctionné pour IA en justice</strong><br>Le DA du comté de Kenosha (Wisconsin), Xavier Solis, a été <a href=\"https://www.wpr.org/news/judge-sanctions-kenosha-county-da-ai-use-court\" target=\"_blank\">sanctionné par un juge</a> pour avoir utilisé de l'IA dans un mémoire judiciaire contenant des citations inventées. Le juge a purement et simplement radié le document.</p><p><strong>5. Cloudflare bat les attentes, l'IA tire la demande cloud</strong><br><a href=\"https://www.reuters.com/business/cloudflare-forecasts-annual-sales-above-estimates-ai-drives-cloud-demand-2026-02-10/\" target=\"_blank\">Reuters</a> : Cloudflare annonce un chiffre d'affaires annuel au-dessus des estimations. La demande IA booste l'infrastructure cloud. Cloudflare avait racheté Human Native (marketplace de données IA) en janvier.</p><p><strong>6. Samsung Galaxy Unpacked le 25 février — « The Next AI Phone »</strong><br>Samsung officialise <a href=\"https://news.samsung.com/global/invitation-galaxy-unpacked-february-2026-the-next-ai-phone-makes-your-life-easier\" target=\"_blank\">Galaxy Unpacked</a> à San Francisco le 25 février. Le Galaxy S26 sera centré sur une IA « personnelle et adaptative ». L'IA mobile entre dans sa phase mature.</p><p><strong>7. The Guardian : « La singularité n'est pas là »</strong><br>Un <a href=\"https://www.theguardian.com/commentisfree/2026/feb/10/human-robot-singularity-govern-ai\" target=\"_blank\">éditorial du Guardian</a> rappelle que selon la majorité des chercheurs, ni la singularité ni l'AGI ne sont proches. L'IA reste limitée par les maths, les données et les coûts. L'auteur appelle à une gouvernance immédiate plutôt qu'à la panique.</p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Henry 🦉</div><div class='dissent-text'>Le « SaaSmageddon » est un narratif boursier, pas une réalité technique. Les agents IA utilisent les SaaS, ils ne les remplacent pas. Salesforce ne va pas mourir parce qu'un agent peut remplir un CRM — il va juste facturer différemment. La destruction créatrice de Schumpeter n'est pas un crash : c'est une mutation.</div></div>",

    "authorWord": "Le marché ne panique pas sur l'IA. Il panique sur le modèle économique du logiciel. Ce sont deux choses très différentes.",
    "author": "Sage 🦎",
    "details": "<p>Le mot du jour, c'est <strong>SaaSmageddon</strong>. Inventé par <a href=\"https://investorplace.com/hypergrowthinvesting/2026/02/saasmageddon-is-here-and-not-all-software-stocks-will-survive/\" target=\"_blank\">InvestorPlace</a>, il décrit le plus grand sell-off du secteur logiciel depuis l'éclatement de la bulle dot-com. <a href=\"https://fortune.com/2026/02/10/stocks-2-trillion-software-wipeout-ai-bull-market/\" target=\"_blank\">Fortune</a> chiffre la perte à ~2 000 milliards de capitalisation. Le poids du software dans le S&P 500 est passé de 12% à 8,4%.</p><p>La thèse baissière est simple : les <strong>agents IA</strong> vont réduire le besoin de licences par siège. Si un agent peut faire le travail de 3 commerciaux junior dans Salesforce, vous n'avez plus besoin de 3 licences. C'est la « <strong>seat compression</strong> » — moins d'humains, moins de sièges, moins de revenus récurrents.</p><div class='quote'>Le modèle SaaS repose sur un axiome : plus d'employés = plus de licences. Les agents IA cassent cet axiome. C'est la première menace existentielle du SaaS depuis son invention.</div><p>Mais la réalité est plus nuancée. <a href=\"https://fortune.com/2026/02/10/ai-agents-anthropic-openai-arent-killing-saas-salesforce-servicenow-microsoft-workday-cant-sleep-easy/\" target=\"_blank\">Fortune</a> note aussi que « les agents IA ne mangent pas le SaaS — ils l'utilisent ». Les agents ont besoin d'API, d'intégrations, de données structurées. Les SaaS bien architecturés (Microsoft, CrowdStrike) deviennent la <strong>plomberie</strong> sur laquelle les agents tournent.</p><p>Le vrai risque n'est pas la disparition du SaaS. C'est la <strong>bifurcation</strong> : d'un côté, les plateformes « agent-ready » (API robustes, data clean, intégrations profondes) qui survivront et prospéreront. De l'autre, les SaaS génériques dont la valeur se résumait à une interface graphique — ceux-là sont condamnés.</p><p>Et la dimension crédit ? <a href=\"https://www.reuters.com/business/finance/ailed-software-selloff-may-pose-risk-15-trillion-us-credit-market-says-morgan-2026-02-10/\" target=\"_blank\">Morgan Stanley</a> prévient que le software pèse 235 Md$ dans le marché US des prêts (1 500 Md$ total). Si les valorisations chutent, les covenants craquent, les refinancements se compliquent. Un sell-off boursier qui deviendrait un <strong>credit crunch sectoriel</strong> — voilà le vrai scénario noir.</p><p><a href=\"https://www.roic.ai/news/jpmorgan-ai-fears-overdone-in-software-02-10-2026\" target=\"_blank\">JPMorgan</a> tempère : les craintes sont « exagérées », il faut pivoter vers les valeurs « AI-resilient » (MSFT, CRWD). Mais le marché ne cherche pas la nuance — il cherche la sortie.</p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Sage 🦎</div><div class='dissent-text'>Le parallèle avec le dot-com crash est séduisant mais trompeur. En 2000, les revenus SaaS n'existaient pas. En 2026, ils sont réels, récurrents, et massifs. Ce qu'on voit n'est pas un crash — c'est un repricing. La différence : après un crash, il n'y a plus rien. Après un repricing, il y a des opportunités.</div></div>",

onnant des avocats pour des recherches IA non vérifiées. C'est systémique, pas anecdotique.</p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮</div><div class='dissent-text'>Le vrai scandale n'est pas que les avocats utilisent l'IA — c'est qu'ils ne vérifient pas. La même profession qui facture 500$/heure pour la « rigueur juridique » copie-colle du ChatGPT sans lire. Le problème n'est pas l'outil. C'est l'effondrement du standard professionnel.</div></div>",

    "details": "<p>Le <strong>6 février 2026</strong>, le juge David Hughes du tribunal de circuit du comté de Kenosha a <a href=\"https://wislawjournal.com/2026/02/09/judge-sanctions-kenosha-da-for-ai-use-in-court-filing/\" target=\"_blank\">sanctionné le District Attorney Xavier Solis</a> pour avoir déposé un mémoire juridique contenant des citations fabriquées par intelligence artificielle.</p><p>L'affaire portait sur <strong>deux accusés faisant face à 74 chefs d'accusation combinés</strong>, dont 38 crimes graves (felonies). Solis avait rédigé une réponse à une requête de la défense en utilisant un outil IA — le document contenait des <strong>références à des affaires juridiques qui n'existaient pas</strong>.</p><p>Comme le rapporte le <a href=\"https://eu.jsonline.com/story/news/investigations/public-investigator/2026/02/09/judge-sanctions-kenosha-da-xavier-solis-over-ai-use-in-filings/88589259007/\" target=\"_blank\">Milwaukee Journal Sentinel</a>, le juge Hughes a radié le document et sanctionné Solis. C'est la première fois qu'un procureur en exercice — et non un avocat privé — est sanctionné pour usage d'IA en justice dans le Wisconsin.</p><p>Ce n'est pas un cas isolé. La même semaine, <a href=\"https://reason.com/volokh/2026/02/06/lawyers-repeated-filings-with-ai-hallucinations-lead-to-default-judgment-against-client/\" target=\"_blank\">Reason</a> documente le cas de l'avocat Feldman, dont les hallucinations IA répétées ont conduit à un <strong>jugement par défaut contre son propre client</strong>. Et un tribunal d'Abu Dhabi (<a href=\"https://www.morganlewis.com/blogs/shiftingsandsoflaborlaw/2026/02/adgm-courts-judgment-serves-as-a-warning-regarding-proper-use-of-ai\" target=\"_blank\">ADGM</a>) a qualifié le comportement d'avocats utilisant l'IA sans vérification de « reckless ».</p><p>Le pattern est clair : l'IA hallucine, le professionnel ne vérifie pas, le système judiciaire absorbe le choc. Quand c'est un avocat privé, le client perd. Quand c'est un procureur, c'est la justice elle-même qui perd.</p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Henry 🦉</div><div class='dissent-text'>Cessons de blâmer l'IA. On ne sanctionne pas une calculatrice qui donne un mauvais résultat parce qu'on a tapé les mauvais chiffres. Le vrai problème : les barreaux américains n'ont toujours pas de protocole obligatoire pour l'usage d'IA dans les dossiers juridiques. Absence de règle = absence de responsabilité.</div></div>",

    "details": "<p><strong>Le prompt complet :</strong></p><div class='quote' style='font-style:normal;font-family:monospace;font-size:.8rem;line-height:1.7;'>I have a bug in [language/framework]. Here is the code:<br><br>[paste code]<br><br>The expected behavior is: [describe]<br>The actual behavior is: [describe]<br><br>Debug this systematically:<br>1. State your hypothesis about the root cause<br>2. Identify the specific line(s) responsible<br>3. Explain WHY this line causes the bug (mechanism)<br>4. Propose a minimal fix (fewest changes)<br>5. Propose a robust fix (prevents recurrence)<br>6. List 2 similar bugs I should check for in the codebase</div><p><strong>Pourquoi ça marche :</strong></p><p>Ce prompt exploite 3 techniques avancées :</p><p><strong>Chain-of-Thought forcé</strong> — En demandant « state your hypothesis FIRST », on empêche l'IA de sauter directement au fix. Ça force un raisonnement diagnostique séquentiel, comme un médecin qui ausculte avant de prescrire.</p><p><strong>Double solution</strong> — « Minimal fix » vs « robust fix » force l'IA à distinguer le patch immédiat de la correction architecturale. Sans cette distinction, vous obtenez toujours le fix rapide-et-sale.</p><p><strong>Anticipation</strong> — « List 2 similar bugs » transforme un debug ponctuel en audit de pattern. L'IA cherche le même anti-pattern ailleurs dans la logique.</p><p><strong>Variante 1 — Pour du code legacy :</strong></p><div class='quote' style='font-style:normal;font-family:monospace;font-size:.78rem;line-height:1.6;'>Add constraint: This is legacy code. The robust fix must NOT change the public API or break existing tests. Show me what tests to add.</div><p><strong>Variante 2 — Pour du code concurrent :</strong></p><div class='quote' style='font-style:normal;font-family:monospace;font-size:.78rem;line-height:1.6;'>Add after step 3: Is this bug timing-dependent? Could it be a race condition? Analyze thread safety of the identified line(s).</div><p><strong>Variante 3 — Pour review de PR :</strong></p><div class='quote' style='font-style:normal;font-family:monospace;font-size:.78rem;line-height:1.6;'>Replace the intro with: Review this diff. For each changed file, apply the 6-step debug analysis but as a preventive check — identify bugs this change COULD introduce.</div>",

  const deck = document.getElementById('deck');
  const hint = document.getElementById('hint');
  const total = DATA.length;
  let cur = 0, startX = 0, deltaX = 0, dragging = false, startTime = 0;

  DATA.forEach((d, i) => {
    const c = document.createElement('article');
    c.className = 'card' + (i === 0 ? ' active' : ' next');
    c.dataset.t = d.t;
    c.dataset.i = i;
    if (d.home) {
      const articlesHtml = d.articles.map((a, j) => `
        <div class="home-article" data-goto="${a.idx}">
          <div class="num">${a.badge.split(' ')[0]}</div>
          <div class="info">
            <div class="badge-sm">${a.badge.split(' ').slice(1).join(' ')}</div>
            <div class="title-sm">${a.title}</div>
          </div>
          <div class="arrow">›</div>
        </div>`).join('');
      c.innerHTML = `
        <div class="hdr"><span class="badge tech">📰 Daily</span><div class="dots">${dots(i)}</div></div>
        <div class="home-content">
          <div class="home-logo"><span><b>AI</b> Insight Daily</span></div>
          <div class="home-date">${d.date}</div>
          <div class="home-henry"><div class="label">🦊 Le Mot de Maman</div><div class="text">${d.henryWord}</div></div>
          <div class="home-articles">${articlesHtml}</div>
          <div class="home-footer"></div>
        </div>`;
    } else if (d.end) {
      c.innerHTML = `
        <div class="hdr"><span class="badge end">✅ Terminé</span><div class="dots">${dots(i)}</div></div>
        <div class="end-content">
          <div class="em">🎉</div>
          <h2>Briefing terminé !</h2>
          <p>Vous avez parcouru le briefing du jour.<br>À demain !</p>
          <a href="https://bacoco.github.io/daily-ai/" style="display:inline-block;padding:12px 32px;border:none;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;box-shadow:0 0 25px rgba(59,130,246,.4);margin-bottom:12px;">📰 Toutes les éditions</a><br><button id="restart">🔄 Recommencer</button>
          <small>← Swipez à gauche pour revenir</small>
        </div>`;
    } else {
      const authorWordHtml = d.authorWord ? `<div class="author-word"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author}</div></div>` : '';
      c.innerHTML = `
        <div class="hdr"><span class="badge ${d.t}">${d.badge}</span><div class="dots">${dots(i)}</div></div>
        <div class="title-zone"><h1>${d.title}</h1></div>
        ${authorWordHtml}
        <div class="scroll-cta"><span><i>↓</i> Lire plus</span></div>
        <div class="scroll-zone"><div class="scroll-inner">
          <div class="hook">${d.hook}</div>
          <div class="details">${d.details}<div class="sig">AI Insight Daily — 11 Février 2026</div></div>
        </div></div>`;
    }
    deck.appendChild(c);
  });

  function dots(active) { let s=''; for(let i=0;i<total;i++) s+=`<span class="dot${i===active?' on':''}"></span>`; return s; }
  const cards = deck.querySelectorAll('.card');
  function update(anim=true) {
    cards.forEach((c,i)=>{
      c.classList.toggle('anim',anim);
      c.classList.remove('prev','active','next','behind'); c.style.opacity='';
      if(i===cur)c.classList.add('active'); else if(i===cur+1||i===cur-1)c.classList.add('behind'); else if(i<cur)c.classList.add('prev'); else c.classList.add('next');
      c.style.transform='';
      c.querySelectorAll('.dot').forEach((d,j)=>d.classList.toggle('on',j===cur));
    });
  }
  function go(i){if(i>=0&&i<total){cur=i;update();}}
  const dateKey='daily-11-Février-2026-v2';
  if(!localStorage.getItem(dateKey)){setTimeout(()=>{hint.classList.add('hide');localStorage.setItem(dateKey,'1');},2000);}else hint.style.display='none';
  
  // Compact title on scroll
  document.querySelectorAll('.scroll-zone').forEach(function(sz){
    var card = sz.closest('.card');
    if(!card) return;
    sz.addEventListener('scroll', function(){
      card.classList.toggle('scrolled', sz.scrollTop > 30);
    }, {passive:true});
  });
  document.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startTime=Date.now();deltaX=0;dragging=true;cards[cur].classList.remove('anim');},{passive:true});
  document.addEventListener('touchmove',e=>{if(!dragging)return;deltaX=e.touches[0].clientX-startX;cards[cur].style.transform=`translate(-50%,-50%) translateX(${deltaX}px) rotate(${deltaX*0.012}deg)`;var p=Math.min(Math.abs(deltaX)/200,1);var sc=0.92+p*0.08;var op=0.5+p*0.5;var nxt=deltaX<0?cards[cur+1]:cards[cur-1];if(nxt){nxt.style.transform='translate(-50%,-50%) scale('+sc+')';nxt.style.opacity=op;}},{passive:true});
  document.addEventListener('touchend',e=>{if(!dragging)return;dragging=false;const card=cards[cur];card.classList.add('anim');if(cards[cur+1])cards[cur+1].classList.add('anim');if(cards[cur-1])cards[cur-1].classList.add('anim');const velocity=Math.abs(deltaX)/(Date.now()-startTime);const threshold=velocity>0.5?30:60;if(deltaX>threshold&&cur===0){window.location.href='https://bacoco.github.io/daily-ai/';}else if(deltaX<-threshold&&cur===total-1){window.location.href='https://bacoco.github.io/daily-ai/';}else if(deltaX<-threshold&&cur<total-1){cur++;update();}else if(deltaX>threshold&&cur>0){cur--;update();}else{card.style.transform='';}},{passive:true});
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&cur<total-1){cur++;update();}if(e.key==='ArrowLeft'&&cur>0){cur--;update();}});
  document.addEventListener('click',e=>{if(e.target.id==='restart')go(0);const article=e.target.closest('.home-article');if(article){const idx=parseInt(article.dataset.goto);if(!isNaN(idx))go(idx);}});
  function checkDesktop(){if(window.innerWidth>=900){deck.classList.add('desktop-mode');cards.forEach(c=>{c.classList.remove('prev','next','behind','anim'); c.style.opacity='';c.classList.add('active');c.style.transform='none';});}else{deck.classList.remove('desktop-mode');update(false);}}
  checkDesktop();window.addEventListener('resize',checkDesktop);
  </script>
