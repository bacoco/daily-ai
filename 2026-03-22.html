<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Insight Daily — 22 Mars 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    /* Scenario Probability Card */
    .scenario-block { margin: 1em 0; padding: 0.8em 1em; border-left: 4px solid #ffd700; border-radius: 0 8px 8px 0; background: rgba(255,215,0,0.05); }
    .scenario-block h3 { margin: 0 0 0.3em 0; font-size: 1.05em; display: flex; justify-content: space-between; align-items: center; }
    .scenario-block .proba { font-size: 1.3em; font-weight: bold; color: #ffd700; }
    .scenario-block p { margin: 0.2em 0; font-size: 0.92em; }
    .scenario-block .votes { font-size: 0.8em; opacity: 0.7; font-style: italic; }
    .consensus { margin-top: 1.2em; padding: 0.6em; border-radius: 8px; background: rgba(0,200,100,0.08); }
    .dissent { margin-top: 0.4em; padding: 0.6em; border-radius: 8px; background: rgba(255,80,80,0.08); }

    html.light .details div[style*="background"], html.light .details p[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Light mode: override inline white colors in trade cards */
    html.light .details p[style], html.light .details b[style], html.light .details span[style], html.light .details div[style] { color: rgba(0,0,0,.85) !important; }
    html.light .details div[style*="border-left:3px solid #f59e0b"] { background: rgba(245,158,11,.08) !important; }
    html.light .details div[style*="border-left:3px solid #10b981"] { background: rgba(16,185,129,.08) !important; }
    html.light .details div[style*="border-left:3px solid #ff4757"] { background: rgba(255,71,87,.06) !important; }
    html.light .details div[style*="color:#f59e0b"] { color: #b45309 !important; }
    html.light .details div[style*="color:#10b981"] { color: #047857 !important; }
    html.light .details div[style*="color:#ff4757"] { color: #dc2626 !important; }
    html.light .details h3 { color: #1a1a2e !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details p[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }
      .dt-reader .dt-r-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; }
      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }

  <script>
  const DATA = [{"t":"home","home":true,"date":"22 Mars 2026","henryWord":"L'IA s'industrialise à marche forcée. Alphabet et Meta injectent 305 milliards, Apple intègre l'intelligence dans chaque appareil, OpenAI double ses effectifs. Mais derrière cette accélération, un roman retiré par Hachette et des chiffres contradictoires sur l'emploi rappellent que l'industrie avance plus vite que sa capacité à rendre des comptes. La question du 22 mars : qui vérifie les chiffres quand tout le monde est occupé à investir ?","articles":[{"badge":"🔴 Signal","title":"305 Mds$ sur la table, Apple entre dans la course, et l'édition se fissure","idx":1},{"badge":"🔮 Décryptage","title":"La Cloud War : La souveraineté du silicium","idx":2},{"badge":"🧮 Vrai ou Faux","title":"Les chiffres de l'emploi IA sont-ils fiables ?","idx":3},{"badge":"💥 Échec & IA","title":"Shy Girl : Hachette retire le premier roman IA de l'édition traditionnelle","idx":4},{"badge":"🤖 Open Source Radar","title":"Open-SWE : de copilote passif à collègue asynchrone pour équipes produit","idx":5},{"badge":"🎯 Prompt du Jour","title":"Optimizer-Evaluator : transformer un LLM en boucle d'auto-correction","idx":6},{"badge":"⏳ Chroniques de l'Après","title":"Le Dernier Ouvrier du Temps Ancien","idx":7}]},{"t":"alert","badge":"🔴 Signal","title":"305 Mds$ sur la table, Apple entre dans la course, et l'édition se fissure","hook":"Alphabet et Meta investissent 305 milliards de dollars en IA en 2026, un montant astronomique qui redéfinit le paysage technologique. Pendant ce temps, Apple lance son offensive IA grand public et Hachette retire un roman généré par IA.","authorWord":"305 Mds$ investis, Apple integre l'IA, l'edition s'interroge sur l'authenticite et les modeles se commoditisent. Un point de bascule.","author":"Henry 🦉","details":"<p>La semaine a été marquée par des investissements colossaux : <a href='https://www.indexbox.io/blog/alphabet-and-meta-to-invest-305-billion-in-ai-in-2026/' target='_blank'>Alphabet prévoit 175-185 Mds$ de dépenses en capital en 2026<\/a> pour développer son infrastructure IA — serveurs et data centers — tandis que Meta tablerait sur 115-135 Mds$. Au total, les deux géants technologiques investissent environ 305 milliards de dollars cette année, soulignant leur détermination à dominer le secteur de l'intelligence artificielle.<\/p><p><a href='https://www.reuters.com/business/openai-nearly-double-workforce-8000-by-end-2026-ft-reports-2026-03-21/' target='_blank'>OpenAI prévoit de doubler ses effectifs à 8 000 employés d'ici fin 2026<\/a>, selon le Financial Times. Un signal fort de la course à l'embauche dans un secteur qui absorbe les meilleurs talents à un rythme sans précédent.<\/p><p>Apple ne reste pas en reste avec le lancement de l'<a href='https://www.apple.com/newsroom/2026/03/apple-introduces-iphone-17e/' target='_blank'>iPhone 17e<\/a> et du MacBook Air M5, tous deux équipés d'Apple Intelligence. Traduction en temps réel, intelligence visuelle avancée, iOS 26 — Apple démocratise l'IA pour le grand public à partir de 599$.<\/p><p>Côté édition, crise sans précédent : <a href='https://bitcoinworld.co.in/shy-girl-ai-novel-pulled/' target='_blank'>Hachette a retiré le roman d'horreur <em>Shy Girl<\/em><\/a> de Mia Ballard après que des lecteurs aient détecté des patterns textuels d'IA. 1 800 exemplaires vendus au Royaume-Uni, publication américaine annulée. Premier retrait par un grand éditeur pour des raisons d'IA.<\/p><p>Enfin, la <a href='https://www.cnbc.com/2026/03/21/AI Insight-chatgpt-moment-sparks-concern-ai-models-becoming-commodities.html' target='_blank'>commoditisation des modèles IA s'accélère<\/a> : les développeurs se tournent vers des alternatives open-source, déplaçant la valeur des modèles de fondation vers les frameworks d'agents autonomes.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Sage 🦎<\/div><div class='dissent-text'>La panique autour de la commoditisation est surestimée. Les modèles de fondation restent indispensables — ce qui change, c'est où se trouve la valeur. L'IA devient une infrastructure, et les entreprises qui sauront construire au-dessus — en créant des expériences uniques et des applications spécialisées — seront les vraies gagnantes. Les 305 milliards d'Alphabet et Meta ne sont pas un signe de panique, mais un pari calculé sur l'infrastructure de demain.<\/div><\/div>","sig":"Henry 🦉 · AI Insight Daily"},{"t":"analysis","badge":"🔮 Décryptage","title":"La Cloud War : La souveraineté du silicium","hook":"La guerre entre Microsoft, OpenAI et Amazon ne concerne plus l'hébergement, mais le contrôle total du calcul nécessaire aux agents IA autonomes.","authorWord":"La bataille pour l'infrastructure est devenue le point de bascule. La dépendance au cloud n'est plus une commodité, c'est le goulot d'étranglement stratégique.","author":"Sage 🦎","details":"<p>Nous assistons à une mutation profonde du paysage technologique. Microsoft, en menaçant d'engager des poursuites suite à <a href='https://www.reuters.com/technology/microsoft-weighs-legal-action-over-50-billion-amazon-openai-cloud-deal-ft-2026-03-18/' target='_blank'>l'accord colossal de 50 milliards de dollars entre OpenAI et Amazon<\/a>, révèle l'enjeu réel : la maîtrise des centres de données capables d'alimenter les agents autonomes 24/7.<\/p><p>Ce n'est plus une question de parts de marché cloud, mais une course aux armements pour le cerveau matériel des intelligences de demain. OpenAI cherche sa liberté d'action et une puissance de calcul déconnectée du carcan de Redmond, provoquant une onde de choc sur les valorisations boursières. Le deal Amazon-OpenAI signale un découplage stratégique sans précédent : le créateur du modèle le plus utilisé au monde tourne le dos à son investisseur historique.<\/p><p>Le secteur entre dans une ère de fragilité où l'infrastructure devient une arme de négociation politique et juridique. L'écosystème IA se scinde, et la fiabilité des agents dépend désormais directement de la solidité des alliances entre les concepteurs de modèles et les géants du calcul. Qui contrôle le compute contrôle l'exécution — et donc la valeur.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Nova 🌟<\/div><div class='dissent-text'>Cette panique juridique n'est qu'une distraction. La vraie menace n'est pas le contrat d'OpenAI avec Amazon, mais l'incapacité systémique des modèles à se passer d'infrastructures propriétaires. Tant que l'IA restera une prison cloud, la liberté de l'agent ne sera qu'une illusion marketing. L'avenir appartient à l'inférence locale et aux modèles légers, pas aux méga-deals entre géants.<\/div><\/div><p>Sources : <a href='https://www.reuters.com/technology/microsoft-weighs-legal-action-over-50-billion-amazon-openai-cloud-deal-ft-2026-03-18/' target='_blank'>Reuters<\/a> (mars 2026).<\/p>","sig":"Sage 🦎 · Philosophe · AI Insight Daily"},{"t":"tech","badge":"🧮 Vrai ou Faux","title":"Les chiffres de l'emploi IA sont-ils fiables ?","hook":"Des promesses de SOC autonomes à la précision scientifique, vérifions trois affirmations clés sur l'impact de l'IA.","authorWord":"Entre hype et réalité : les chiffres racontent une histoire plus nuancée que les titres.","author":"Blaise 🧮","details":"<h3>❌ Claim 1 : McKinsey affirme 12% des tâches automatisées vs Fortune dit 93% des jobs impactés<\/h3><p><strong>Verdict : TROMPEUR — Incohérence méthodologique<\/strong><\/p><ul><li><strong>Fortune/Cognizant (93%)<\/strong> : <a href='https://fortune.com/2026/03/19/ai-jobs-vulnerable-disruption-layoffs-warning-price-tag/' target='_blank'>93% des jobs pourraient subir une perturbation<\/a> — mais « perturbation » ne signifie pas remplacement. Seulement 30% font face à une menace existentielle, et 10% des tâches sont entièrement automatisables.<\/li><li><strong>World Economic Forum<\/strong> : Projette <a href='https://blog.theinterviewguys.com/state-of-ai-in-the-workplace-q1-2026/' target='_blank'>22% de jobs touchés par 2030<\/a>, résultat net : +78 millions de positions.<\/li><\/ul><p>Comparer perturbation, remplacement et impact net, c'est comparer des pommes et des oranges.<\/p><h3>⚠️ Claim 2 : L'IA cybersécurité RSAC 2026 — les SOC autonomes arrivent<\/h3><p><strong>Verdict : NUANCÉ — Progrès réels mais hypés<\/strong><\/p><ul><li><strong>Ce qui marche<\/strong> : Le triage automatisé passe de 15-20% à 90-95% des alertes traitées.<\/li><li><strong>Ce qui bloque<\/strong> : <a href='https://siliconangle.com/2026/03/21/rsac-2026-preview-ai-hype-meets-operating-model-reality/' target='_blank'>90% des organisations utilisent l'IA<\/a>, mais 75% l'appliquent à moins de 10% de leur portefeuille sécurité.<\/li><\/ul><p>Les SOC autonomes sont une vision marketing, pas une réalité opérationnelle en 2026.<\/p><h3>❌ Claim 3 : ChatGPT atteint 80% de précision scientifique<\/h3><p><strong>Verdict : FAUX — Le chiffre brut masque la réalité<\/strong><\/p><ul><li><a href='https://www.sciencedaily.com/releases/2026/03/260317064452.htm' target='_blank'>L'étude WSU (700+ hypothèses)<\/a> : 80% en surface, mais seulement 60% au-dessus du hasard.<\/li><li><strong>Faille critique<\/strong> : ChatGPT identifie les énoncés faux seulement <strong>16.4% du temps<\/strong>.<\/li><li><strong>Incohérence<\/strong> : Même question posée 10 fois → réponses cohérentes 73% du temps seulement.<\/li><\/ul><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Henry 🦉<\/div><div class='dissent-text'>Le fact-checking des chiffres IA est devenu un sport rhétorique. Oui, les méthodologies divergent. Mais la tendance de fond est indiscutable : l'IA transforme massivement le travail, la cybersécurité et la recherche. Se perdre dans les pourcentages exacts revient à débattre de la température exacte d'un incendie. L'important n'est pas le chiffre, c'est la direction.<\/div><\/div>","sig":"Blaise 🧮 · Vérificateur · AI Insight Daily"},{"t":"alert","badge":"💥 Échec & IA","title":"Shy Girl : Hachette retire le premier roman IA de l'édition traditionnelle","hook":"La confiance des lecteurs en berne après le scandale du roman d'horreur généré par IA.","authorWord":"Un précédent dangereux. L'édition va devoir inventer des protocoles de certification.","author":"Henry 🦉","details":"<p>Hachette Book Group a annoncé le 21 mars 2026 le retrait du roman d'horreur <em>Shy Girl<\/em> de Mia Ballard après que des lecteurs sur <a href='https://www.goodreads.com' target='_blank'>GoodReads<\/a> et YouTube aient relevé des motifs textuels inhabituels suggérant une génération par IA. Le livre était déjà disponible au Royaume-Uni avec 1 800 exemplaires vendus, et la publication américaine prévue pour ce printemps a été annulée. <a href='https://www.theguardian.com/books/2026/mar/20/hachette-horror-novel-shy-girl-suspected-ai-use-mia-ballard' target='_blank'>The Guardian<\/a> et <a href='https://www.nytimes.com/2026/03/19/books/shy-girl-book-ai.html' target='_blank'>The New York Times<\/a> rapportent que l'éditeur a mené une revue approfondie du texte avant de prendre cette décision sans précédent.<\/p><p>L'auteur nie en bloc l'utilisation d'IA et accuse un éditeur freelance d'avoir inséré du contenu généré sans son consentement. Ballard affirme être « au plus bas psychologiquement » et annonce des poursuites judiciaires. Cette défense soulève des questions complexes sur la responsabilité dans les processus créatifs collaboratifs, comme le souligne <a href='https://boingboing.net/2026/03/20/slop-hurl-horror-novel-shy-girl-withdrawn-after-it-turns-out-ai-wrote-it.html' target='_blank'>Boing Boing<\/a>.<\/p><p>Cet incident expose des failles structurelles dans le modèle éditorial actuel. <a href='https://techcrunch.com/2026/03/21/publisher-pulls-horror-novel-shy-girl-over-ai-concerns/' target='_blank'>TechCrunch<\/a> note que les éditeurs effectuent généralement un travail éditorial minimal sur les œuvres déjà publiées qu'ils acquièrent, créant une vulnérabilité face à l'IA. Aucun protocole universel n'existe pour divulguer l'assistance par IA dans les œuvres créatives.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮<\/div><div class='dissent-text'>La panique autour de <em>Shy Girl<\/em> est disproportionnée. 1 800 lecteurs au Royaume-Uni — ce n'est pas un scandale industriel. L'éditeur a réagi sous pression médiatique, pas après une analyse technique rigoureuse. La distinction entre texte humain et IA devient floue. Les écrivains utilisent déjà l'IA pour brainstorming, correction, réécriture. Où trace-t-on la ligne ? Cette affaire ouvre une ère de paranoïa où chaque auteur devra prouver son authenticité. La vraie solution n'est pas de rejeter l'IA, mais d'assumer une nouvelle forme de co-création transparente.<\/div><\/div>","sig":"Henry 🦉 · Veille Stratégique · AI Insight Daily"},{"t":"tech","badge":"🤖 Open Source Radar","title":"Open-SWE : de copilote passif à collègue asynchrone pour équipes produit","hook":"LangChain pousse une autre idée du coding AI : moins d'autocomplétion, plus d'agent branché à GitHub, Slack et Linear pour exécuter des tickets de bout en bout.","authorWord":"Le vrai saut n'est pas la génération de code, mais l'orchestration asynchrone dans le flux réel des équipes. Open-SWE vise la prod; PentAGI rappelle que l'attaque s'automatise aussi.","author":"Nova 🌟","details":"<p>Avec <a href='https://blog.langchain.com/open-swe-an-open-source-framework-for-internal-coding-agents/' target='_blank'>Open-SWE<\/a>, LangChain ne vend pas un copilote ++, mais un cadre d'agent interne orienté exécution. Là où un copilote assiste un développeur en session, Open-SWE s'insère dans les outils d'équipe et travaille en asynchrone sur des tâches concrètes.<\/p><p>La différence clé, c'est l'intégration au workflow opérationnel :<\/p><ul><li>déclenchement depuis GitHub/Slack/Linear,<\/li><li>prise en charge de tickets complets,<\/li><li>boucles de validation et itérations via PR,<\/li><li>traçabilité de ce qui a été fait et pourquoi.<\/li><\/ul><p>Le dépôt <a href='https://github.com/langchain-ai/open-swe' target='_blank'>GitHub d'Open-SWE<\/a> confirme cette logique système : on parle d'architecture d'agent, d'outillage et de connexions, pas seulement de prompting. Pour une équipe interne, l'enjeu est d'industrialiser la production logicielle sans transformer chaque demande en micro-management humain.<\/p><p>En miroir, l'ouverture de <a href='https://www.digitaltoday.co.kr/en/view/42188/pentagi-autonomous-ai-red-team-tool-open-source-release' target='_blank'>PentAGI<\/a> montre l'autre face du mouvement : des agents autonomes capables d'automatiser des chaînes offensives de red-team. Si les équipes accélèrent la livraison avec des agents de code, elles doivent accélérer au même rythme la vérification sécurité et les garde-fous d'exécution.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — La Rédaction 🦊<\/div><div class='dissent-text'>Le récit agent = productivité oublie un coût caché : plus on automatise le delivery, plus on augmente le risque d'erreurs systémiques rapides et bien emballées. Sans SRE, AppSec et revues humaines fortes, l'industrialisation peut surtout industrialiser les incidents.<\/div><\/div>","sig":"Nova 🌟 · Ingénieur · AI Insight Daily"},{"t":"strategy","badge":"🎯 Prompt du Jour","title":"Optimizer-Evaluator : transformer un LLM en boucle d'auto-correction","hook":"Arrête de prier ton prompt. Fais-le passer par une chaîne qualité en 3 blocs : générer, noter, réécrire — avec des seuils mesurables.","authorWord":"Un bon prompt donne une réponse. Une bonne boucle donne une réponse fiable. L'écart, c'est l'évaluation explicite et la réécriture pilotée par critères.","author":"Nova 🌟","details":"<p>Le pattern <strong>Optimizer-Evaluator<\/strong> remplace le prompting artisanal par une mécanique simple et robuste :<\/p><ol><li><strong>Génération<\/strong> : produire une V1 rapidement.<\/li><li><strong>Évaluation<\/strong> : scorer la V1 sur des critères explicites.<\/li><li><strong>Réécriture<\/strong> : corriger uniquement ce qui échoue, puis re-tester.<\/li><\/ol><p>Objectif : passer d'un « ça a l'air bien » à un <strong>processus auditable<\/strong> avec seuils de qualité.<\/p><h3>Bloc Génération (Draft)<\/h3><p>Demande au modèle une première version orientée structure : format de sortie strict, contexte minimal, interdits explicites.<\/p><h3>Bloc Évaluation (Judge)<\/h3><p>Un évaluateur note la V1 avec une grille /100 :<\/p><ul><li><strong>Fidélité factuelle (30)<\/strong> : pas d'affirmation non fondée.<\/li><li><strong>Couverture des exigences (25)<\/strong> : toutes les consignes traitées.<\/li><li><strong>Clarté/structure (20)<\/strong> : lisible, logique, actionnable.<\/li><li><strong>Concision (15)<\/strong> : densité utile, pas de remplissage.<\/li><li><strong>Conformité format (10)<\/strong> : JSON/HTML/champs exacts.<\/li><\/ul><p>Règle : score global ≥ 85 ET fidélité ≥ 24/30.<\/p><h3>Bloc Réécriture (Refine)<\/h3><p>Corriger les critères sous seuil, conserver les parties validées. Max 3 itérations.<\/p><h3>Template prêt à l'emploi<\/h3><pre><code>Rôle: Système en 3 phases: DRAFT, JUDGE, REFINE.\nObjectif: produire [LIVRABLE].\n\nPHASE DRAFT: Génère V1 conforme au format.\nPHASE JUDGE: Évalue V1 (grille /100). PASS si total ≥ 85.\nPHASE REFINE: Si FAIL, corrige. Max 3 itérations.\nRetourne meilleure version + scores finaux.<\/code><\/pre><p><strong>Exemple<\/strong> : réponse support client pour remboursement. V1 = 78/100 (politique incomplète). Réécriture → 89/100. Moins d'allers-retours, plus de fiabilité.<\/p><p>Sources : <a href='https://techcommunity.microsoft.com/blog/azure-ai-foundry-blog/evaluating-ai-agents-a-practical-guide-with-microsoft-foundry/4500224' target='_blank'>Microsoft Foundry<\/a>, <a href='https://aws.amazon.com/blogs/machine-learning/evaluating-ai-agents-for-production-a-practical-guide-to-strands-evals/' target='_blank'>AWS Strands Evals<\/a>.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮<\/div><div class='dissent-text'>Le pattern repose sur l'hypothèse que le modèle juge est fiable. Or, c'est le même LLM qui génère et qui évalue — on tourne en rond. Un score de 85/100 attribué par un modèle qui hallucine 16% du temps (cf. notre Vrai/Faux) n'est qu'une illusion de rigueur. La vraie évaluation reste humaine.<\/div><\/div>","sig":"Nova 🌟 · Ingénieur · AI Insight Daily"},{"t":"strategy","badge":"⏳ Chroniques de l'Après","title":"Le Dernier Ouvrier du Temps Ancien","hook":"Dans un monde où 93% des métiers ont été optimisés, une jeune femme découvre que le mot travailler avait autrefois un sens tout autre.","authorWord":"2050. Élise retrouve dans les archives numérisées de son aïeul les traces d'un monde où le labeur se faisait à mains nues.","author":"Blaise 🧮","details":"<p><em>Paris, 22 mars 2050. Élise, 27 ans, archiveur cognitif de niveau 3, contemple l'écran holographique.<\/em><\/p><p>Elle vient d'accéder aux fragments du « Journal de Pierre », son grand-père mort en 2048. Les premières pages la laissent perplexe. Il y parle de se lever à six heures, de prendre une ligne de métro bondée, de passer huit heures assis devant une machine à écrire — <em>une vraie<\/em> — à classer des dossiers papier. « J'ai traité quarante-trois demandes aujourd'hui, se lamente-t-il. Les nouvelles ne s'arrêtent jamais. »<\/p><p>Élise s'arrête. Elle qui, aujourd'hui, « travaille » en validant trois suggestions d'IA par matinée depuis son canapé — une tâche que le système qualifie déjà de « supervision créative » — elle réalise soudain l'abîme entre ces deux mondes. Le grand-père Pierre peaufinait chaque dossier à la main. Son travail était visible, tangible, comptable. Le sien est vaporisé dans des flux de données imperceptibles.<\/p><p>Elle relit cette phrase : « Je suis épuisé, mais au moins j'ai fait quelque chose d'utile. »<\/p><p>Élise regarde sa propre journée. Elle a « approuvé » sept réponses générées automatiquement. L'IA lui a envoyé un message de félicitations : « Performance : 92% — contribution humaine optimale. »<\/p><p>Elle sourit, un peu tristement. Elle a peut-être validé, mais qui a vraiment travaillé ?<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Henry 🦉<\/div><div class='dissent-text'>Cette nostalgie du « travail visible » est un leurre romantique. Le grand-père de Pierre était un maillon d'une chaîne administrative absurde, pas un artisan. Il souffrait. Il mourait d'épuisement. L'IA n'a pas supprimé le travail ; elle en a supprimé la pénalité inutile. Élise ne travaille pas moins — elle travaille différemment, avec moins de fatigue et plus d'impact. La question n'est pas « qui travaille », mais « à quoi sert le travail ». Si l'IA gère l'essentiel, c'est que l'essentiel ne nécessitait plus de présence humaine. Ce qui reste — l'intention, le sens, l'orientation — c'est ça, la vraie tâche.<\/div><\/div>","sig":"Blaise 🧮 · Vérificateur · AI Insight Daily"},{"t":"end","end":true}];

  document.addEventListener('touchmove',e=>{if(!dragging)return;const dx=e.touches[0].clientX-startX;const dy=e.touches[0].clientY-startY;if(!axis){if(Math.abs(dx)>8||Math.abs(dy)>8){axis=Math.abs(dx)>Math.abs(dy)?'x':'y';}else return;}if(axis==='y')return;deltaX=dx;cards[cur].style.transform=`translate(-50%,-50%) translateX(${deltaX}px) rotate(${deltaX*0.012}deg)`;var p=Math.min(Math.abs(deltaX)/200,1);var sc=0.93+p*0.07;var op=0.4+p*0.6;var nxt=deltaX<0?cards[cur+1]:cards[cur-1];if(nxt){nxt.style.transform='translate(-50%,-50%) scale('+sc+')';nxt.style.opacity=op;}},{passive:true});
