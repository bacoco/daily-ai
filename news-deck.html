<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>News‑Deck — Prototype</title>
  <style>
    /*
      News-Deck Prototype
      - Mobile-first, ratio card 9:16
      - 3 cards max in DOM (virtualized: prev/current/next)
      - Pointer Events swipe + visible buttons
      - Keyboard navigation (← →)
      - Premium dark mode

      Notes:
      - Animations rely on transform/opacity only (GPU-friendly)
      - Uses minimal, accessible controls (buttons, ARIA)
    */

    :root{
      color-scheme: dark;
      --bg0:#07090f;
      --bg1:#0b1020;
      --card:#0c1224;
      --stroke:rgba(255,255,255,.10);
      --stroke2:rgba(255,255,255,.14);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.68);
      --muted2:rgba(255,255,255,.54);
      --shadow: 0 18px 60px rgba(0,0,0,.55);
      --radius: 24px;
      --pad: 18px;
      --safeTop: env(safe-area-inset-top);
      --safeBottom: env(safe-area-inset-bottom);
      --safeLeft: env(safe-area-inset-left);
      --safeRight: env(safe-area-inset-right);

      --accentBreaking:#ff4d6d;
      --accentTech:#43c6ff;
      --accentAnalysis:#a78bfa;

      --progressH: 3px;
      --btnH: 44px;
      --easing: cubic-bezier(.2,.9,.2,1);
    }

    *{ box-sizing: border-box; }
    html, body{ height: 100%; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background: radial-gradient(1200px 900px at 20% 0%, rgba(122,92,255,.18), transparent 55%),
                  radial-gradient(1000px 800px at 90% 10%, rgba(41,176,255,.14), transparent 60%),
                  linear-gradient(180deg, var(--bg0), var(--bg1));
      color:var(--text);
      overflow:hidden; /* deck is viewport-scoped */
    }

    /* Screen reader utility */
    .sr-only{
      position:absolute;
      width:1px; height:1px;
      padding:0; margin:-1px;
      overflow:hidden; clip:rect(0,0,0,0);
      white-space:nowrap; border:0;
    }

    .app{
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: calc(10px + var(--safeTop)) calc(10px + var(--safeRight)) calc(10px + var(--safeBottom)) calc(10px + var(--safeLeft));
    }

    /*
      The card is kept at 9:16 ratio.
      On desktop, we clamp it to a comfortable size.
    */
    .stage{
      width: min(92vw, 430px);
      aspect-ratio: 9 / 16;
      height: auto;
      position: relative;
      filter: drop-shadow(var(--shadow));
    }

    @media (min-width: 900px){
      .stage{
        width: 420px;
      }
    }

    /* Progress bar: discreet, not gamified */
    .progressWrap{
      position:absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      height: var(--progressH);
      background: rgba(255,255,255,.10);
      border-radius: 999px;
      overflow:hidden;
      z-index: 10;
      pointer-events:none;
    }
    .progressBar{
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, rgba(255,255,255,.55), rgba(255,255,255,.22));
      border-radius: 999px;
      transform-origin: left center;
      transition: width 260ms var(--easing);
    }

    /* Deck area */
    .deck{
      position:absolute;
      inset:0;
      border-radius: var(--radius);
      overflow:hidden;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--stroke);
    }

    /*
      Each card is absolutely positioned.
      We'll keep only 3 cards in the DOM.
      z-index is managed by order: current on top.
    */
    .card{
      position:absolute;
      inset:0;
      display:flex;
      flex-direction:column;
      border-radius: var(--radius);
      overflow:hidden;
      background: var(--card);
      border: 1px solid rgba(255,255,255,.10);
      will-change: transform, opacity;
      transform: translate3d(0,0,0);
      transition: transform 260ms var(--easing), opacity 220ms ease;
    }

    /* Background layer: gradient (and optional image) */
    .cardBg{
      position:absolute;
      inset:0;
      background:
        radial-gradient(900px 560px at 20% 10%, rgba(255,255,255,.14), transparent 58%),
        linear-gradient(135deg, rgba(255,255,255,.06), rgba(255,255,255,.00) 50%),
        var(--bg);
      transform: translateZ(0);
    }
    .cardBg::after{
      content:"";
      position:absolute;
      inset:0;
      /* subtle vignette to keep text readable */
      background: linear-gradient(180deg,
        rgba(0,0,0,.00) 0%,
        rgba(0,0,0,.08) 35%,
        rgba(0,0,0,.42) 76%,
        rgba(0,0,0,.62) 100%
      );
    }

    /* Foreground content */
    .cardInner{
      position:relative;
      height:100%;
      display:flex;
      flex-direction:column;
      padding: 14px var(--pad) 14px var(--pad);
      gap: 12px;
    }

    .topRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      min-height: 36px;
      padding-top: 6px;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      background: rgba(0,0,0,.28);
      border: 1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .dot{
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,0,0,.25);
    }

    .count{
      font-variant-numeric: tabular-nums;
      color: var(--muted2);
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(0,0,0,.18);
      border: 1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .spacer{
      flex: 1 1 auto;
    }

    .headline{
      margin-top: auto; /* pushes headline towards bottom for that 9:16 editorial feel */
      font-size: 24px;
      line-height: 1.10;
      letter-spacing: -0.01em;
      margin-bottom: 0;
      text-wrap: balance;
      text-shadow: 0 10px 26px rgba(0,0,0,.42);
    }

    .summary{
      margin:0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow:hidden;
      text-shadow: 0 10px 22px rgba(0,0,0,.35);
    }

    .details{
      margin-top: 6px;
      border-radius: 16px;
      background: rgba(0,0,0,.20);
      border: 1px solid rgba(255,255,255,.12);
      overflow:hidden;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    /* Accessible “tap to expand” using <details> */
    details{
      margin:0;
    }
    details > summary{
      list-style:none;
      cursor:pointer;
      user-select:none;
      padding: 12px 14px;
      color: rgba(255,255,255,.86);
      font-size: 13px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
    }
    details > summary::-webkit-details-marker{ display:none; }

    .chev{
      width: 18px;
      height: 18px;
      opacity:.8;
      transition: transform 200ms var(--easing);
      flex: 0 0 auto;
    }
    details[open] .chev{ transform: rotate(180deg); }

    .detailsBody{
      padding: 0 14px 12px 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    /* Bottom action bar */
    .actions{
      margin-top: 10px;
      display:grid;
      grid-template-columns: 1fr auto 1fr;
      align-items:center;
      gap: 12px;
      padding-bottom: 2px;
    }

    .btn{
      height: var(--btnH);
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(0,0,0,.18);
      color: var(--text);
      font-weight: 600;
      letter-spacing: .02em;
      padding: 0 16px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap: 10px;
      cursor:pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 120ms ease, background 160ms ease, border-color 160ms ease;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .btn:focus-visible{
      outline: 2px solid rgba(255,255,255,.38);
      outline-offset: 2px;
    }
    .btn:active{ transform: scale(.98); }

    .btnSkip{
      justify-self:start;
    }
    .btnSave{
      justify-self:end;
      border-color: rgba(255,255,255,.20);
    }

    .btn kbd{
      font: inherit;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.86);
    }

    .hint{
      color: var(--muted2);
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(0,0,0,.18);
      border: 1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    /* Swipe affordance (subtle) */
    .swipeHint{
      position:absolute;
      left: 14px;
      right: 14px;
      bottom: 68px;
      display:flex;
      justify-content:space-between;
      pointer-events:none;
      opacity:.25;
      font-size: 12px;
      color: rgba(255,255,255,.75);
      text-transform: uppercase;
      letter-spacing: .12em;
    }

    /* Card stacking visuals */
    .card[data-pos="prev"]{ transform: translate3d(-8%, 0, 0) scale(.98); opacity:.18; }
    .card[data-pos="next"]{ transform: translate3d( 8%, 0, 0) scale(.98); opacity:.18; }
    .card[data-pos="current"]{ opacity:1; }

    /* During drag we temporarily disable transitions for the current card */
    .card.isDragging{ transition: none !important; }

    /* Reduced motion: keep it comfortable */
    @media (prefers-reduced-motion: reduce){
      .card{ transition: none; }
      .progressBar{ transition: none; }
      .chev{ transition:none; }
      .btn{ transition:none; }
    }

    /* Desktop helper text */
    .footerHelp{
      position: fixed;
      left: 0; right: 0;
      bottom: 10px;
      text-align:center;
      color: rgba(255,255,255,.40);
      font-size: 12px;
      pointer-events:none;
    }
    @media (max-width: 560px){
      .footerHelp{ display:none; }
    }
  </style>
</head>
<body>
  <div class="app" role="application" aria-label="News-Deck">
    <div class="stage">
      <div class="progressWrap" aria-hidden="true"><div class="progressBar" id="progressBar"></div></div>

      <!-- Live region for assistive tech (e.g., announces card change) -->
      <div class="sr-only" aria-live="polite" aria-atomic="true" id="live"></div>

      <div class="deck" id="deck" aria-label="Cartes d'actualités"></div>
    </div>
  </div>

  <div class="footerHelp">Astuce desktop : ← = Skip, → = Save</div>

  <script>
    /*
      Deck logic
      - Data is static demo content (5 items)
      - Virtualization keeps only 3 cards in the DOM (prev/current/next)
      - Swipe uses Pointer Events
      - Buttons + keyboard arrows are first-class navigation
    */

    const NEWS = [
      {
        id: 'anthropic-285b',
        category: 'Breaking',
        title: 'Anthropic : valorisation $285B en chute',
        summary: "Correction brutale sur les valeurs IA : re-pricing et prudence des investisseurs.",
        details: "Le marché réévalue les multiples des leaders IA. Les investisseurs privilégient la trajectoire de revenus, la discipline de coûts et la clarté des roadmaps plutôt que les projections trop agressives.",
        bg: 'linear-gradient(135deg, rgba(255,77,109,.28), rgba(255,77,109,.06) 55%, rgba(12,18,36,.00))'
      },
      {
        id: 'xcode-26-3-agents',
        category: 'Breaking',
        title: 'Apple : Xcode 26.3 et agents intégrés',
        summary: "Nouveaux workflows assistés : génération, refactor, tests — directement dans l’IDE.",
        details: "Xcode 26.3 introduit des assistants orientés tâches (navigation, modifications multi-fichiers, création de tests). L’enjeu : productivité sans sacrifier contrôle, sécurité et performance locale.",
        bg: 'linear-gradient(135deg, rgba(255,77,109,.22), rgba(67,198,255,.08) 60%, rgba(12,18,36,.00))'
      },
      {
        id: 'codex-desktop',
        category: 'Breaking',
        title: 'OpenAI : Codex arrive sur Desktop',
        summary: "Un client bureau pour coder plus vite : itération, exécution et contextes projet.",
        details: "L’approche desktop vise à réduire la friction entre l’éditeur, l’exécution et l’accès au contexte (fichiers, commandes, logs). Le point critique reste la gouvernance : permissions, audit et limites d’actions.",
        bg: 'linear-gradient(135deg, rgba(255,77,109,.20), rgba(167,139,250,.10) 60%, rgba(12,18,36,.00))'
      },
      {
        id: 'mcp-explique',
        category: 'Tech',
        title: 'MCP Protocol : le modèle expliqué',
        summary: "Un standard pour connecter modèles et outils : contexte, ressources et actions.",
        details: "MCP (Model Context Protocol) structure la façon dont un assistant accède à des capacités externes : découverte, permissions et appels d’outils. Objectif : interopérabilité et intégrations plus sûres.",
        bg: 'linear-gradient(135deg, rgba(67,198,255,.26), rgba(67,198,255,.06) 55%, rgba(12,18,36,.00))'
      },
      {
        id: 'analyse-sage',
        category: 'Analysis',
        title: 'L’Analyse de Sage : signal vs bruit',
        summary: "Ce qui compte cette semaine : qualité des données, coût d’inférence et adoption réelle.",
        details: "Lecture macro : la maturité IA se mesure moins aux démos qu’aux déploiements. Les gagnants optimisent l’inférence, verrouillent des données différenciantes et trouvent des usages récurrents côté métiers.",
        bg: 'linear-gradient(135deg, rgba(167,139,250,.26), rgba(167,139,250,.06) 55%, rgba(12,18,36,.00))'
      },
    ];

    // Category styling map
    const CATEGORY = {
      Breaking: { accent: 'var(--accentBreaking)' },
      Tech: { accent: 'var(--accentTech)' },
      Analysis: { accent: 'var(--accentAnalysis)' },
    };

    const deckEl = document.getElementById('deck');
    const progressEl = document.getElementById('progressBar');
    const liveEl = document.getElementById('live');

    // Current index in NEWS
    let index = 0;

    // Track saved items for the prototype (in-memory)
    const saved = new Set();

    // Gesture state
    let pointerId = null;
    let startX = 0;
    let startY = 0;
    let dx = 0;
    let dy = 0;
    let isDragging = false;

    // Current card element (the one user drags)
    let currentCardEl = null;

    // Helpers
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    function announce(text){
      // Helps screen readers understand state changes.
      liveEl.textContent = text;
    }

    function updateProgress(){
      const pct = ((index + 1) / NEWS.length) * 100;
      progressEl.style.width = pct + '%';
    }

    function actionLabel(){
      // For center hint [3/8] style.
      return `[${index + 1}/${NEWS.length}]`;
    }

    function createCard(item, pos){
      const cat = CATEGORY[item.category] || { accent: 'rgba(255,255,255,.7)' };

      const card = document.createElement('article');
      card.className = 'card';
      card.dataset.pos = pos;
      card.dataset.id = item.id;
      card.style.setProperty('--accent', cat.accent);
      card.setAttribute('role', 'group');
      card.setAttribute('aria-label', `${item.category} — ${item.title}`);

      // Background
      const bg = document.createElement('div');
      bg.className = 'cardBg';
      bg.style.setProperty('--bg', item.bg);

      // Foreground
      const inner = document.createElement('div');
      inner.className = 'cardInner';

      inner.innerHTML = `
        <div class="topRow">
          <div class="badge" aria-label="Catégorie">
            <span class="dot" aria-hidden="true"></span>
            <span>${escapeHtml(item.category)}</span>
          </div>
          <div class="count" aria-label="Position">${actionLabel()}</div>
        </div>

        <div class="spacer" aria-hidden="true"></div>

        <h2 class="headline">${escapeHtml(truncate(item.title, 60))}</h2>
        <p class="summary">${escapeHtml(item.summary)}</p>

        <div class="details">
          <details>
            <summary>
              <span>Tap pour afficher les détails</span>
              <svg class="chev" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </summary>
            <div class="detailsBody">${escapeHtml(item.details)}</div>
          </details>
        </div>

        <div class="actions" role="toolbar" aria-label="Actions">
          <button class="btn btnSkip" type="button" data-action="skip" aria-label="Skip (flèche gauche)">
            <span aria-hidden="true">←</span> SKIP <kbd aria-hidden="true">←</kbd>
          </button>
          <div class="hint" aria-label="Progression">${actionLabel()}</div>
          <button class="btn btnSave" type="button" data-action="save" aria-label="Save (flèche droite)">
            <kbd aria-hidden="true">→</kbd> SAVE <span aria-hidden="true">→</span>
          </button>
        </div>
      `;

      // Subtle swipe hint (non essential)
      const swipe = document.createElement('div');
      swipe.className = 'swipeHint';
      swipe.innerHTML = '<span>Swipe ←</span><span>Swipe →</span>';

      card.appendChild(bg);
      card.appendChild(inner);
      card.appendChild(swipe);

      // Buttons
      card.querySelector('[data-action="skip"]').addEventListener('click', () => performAction('skip'));
      card.querySelector('[data-action="save"]').addEventListener('click', () => performAction('save'));

      return card;
    }

    function render(){
      // Virtualization: clear and render only prev/current/next.
      deckEl.innerHTML = '';

      const prevIdx = index - 1;
      const nextIdx = index + 1;

      // Create in back-to-front order: prev, next, current (current on top)
      if (prevIdx >= 0) deckEl.appendChild(createCard(NEWS[prevIdx], 'prev'));
      if (nextIdx < NEWS.length) deckEl.appendChild(createCard(NEWS[nextIdx], 'next'));

      const cur = createCard(NEWS[index], 'current');
      deckEl.appendChild(cur);
      currentCardEl = cur;

      // Attach gesture listeners to deck (single surface); we only drag current card.
      // (We attach every render to ensure we keep the right references.)
      attachGestureListeners();

      updateProgress();
      announce(`Carte ${index + 1} sur ${NEWS.length}. ${NEWS[index].category}. ${NEWS[index].title}`);
    }

    function attachGestureListeners(){
      // Ensure we don't stack listeners across renders.
      deckEl.onpointerdown = onPointerDown;
      deckEl.onpointermove = onPointerMove;
      deckEl.onpointerup = onPointerUp;
      deckEl.onpointercancel = onPointerCancel;
    }

    function onPointerDown(e){
      // Only left click / primary touch
      if (e.button !== undefined && e.button !== 0) return;
      if (!currentCardEl) return;

      // Avoid hijacking interaction with controls / details.
      const interactive = e.target.closest('button, a, summary, details');
      if (interactive) return;

      pointerId = e.pointerId;
      deckEl.setPointerCapture(pointerId);
      startX = e.clientX;
      startY = e.clientY;
      dx = 0; dy = 0;
      isDragging = true;
      currentCardEl.classList.add('isDragging');
    }

    function onPointerMove(e){
      if (!isDragging || e.pointerId !== pointerId) return;
      dx = e.clientX - startX;
      dy = e.clientY - startY;

      // Prevent vertical scroll gestures from triggering a swipe.
      // We tolerate some diagonal, but focus on horizontal navigation.
      const absX = Math.abs(dx);
      const absY = Math.abs(dy);
      if (absY > absX * 1.15) {
        // treat as non-swipe, but keep the card stable
        currentCardEl.style.transform = 'translate3d(0,0,0)';
        return;
      }

      const w = deckEl.getBoundingClientRect().width;
      const progress = clamp(dx / w, -1, 1);
      const rotate = progress * 6; // small editorial tilt
      currentCardEl.style.transform = `translate3d(${dx}px, 0, 0) rotate(${rotate}deg)`;
      // Optionally fade neighbors a touch; we keep it subtle.
    }

    function onPointerUp(e){
      if (!isDragging || e.pointerId !== pointerId) return;
      finishDrag();
    }

    function onPointerCancel(e){
      if (!isDragging || e.pointerId !== pointerId) return;
      cancelDrag();
    }

    function cancelDrag(){
      isDragging = false;
      pointerId = null;
      if (!currentCardEl) return;
      currentCardEl.classList.remove('isDragging');
      currentCardEl.style.transform = '';
    }

    function finishDrag(){
      isDragging = false;
      if (!currentCardEl) return;

      const w = deckEl.getBoundingClientRect().width;
      const threshold = Math.min(110, w * 0.22);

      const absX = Math.abs(dx);
      const absY = Math.abs(dy);
      currentCardEl.classList.remove('isDragging');

      // If the user was primarily vertical, snap back.
      if (absY > absX * 1.15){
        currentCardEl.style.transform = '';
        pointerId = null;
        return;
      }

      if (absX >= threshold){
        // Swipe direction maps to actions.
        performAction(dx < 0 ? 'skip' : 'save', { fromSwipe: true });
      } else {
        currentCardEl.style.transform = '';
      }
      pointerId = null;
    }

    function performAction(action, opts = {}){
      if (!currentCardEl) return;
      if (index >= NEWS.length) return;

      const item = NEWS[index];
      const w = deckEl.getBoundingClientRect().width;

      // Decide end transform (slide out)
      const dir = action === 'skip' ? -1 : 1;
      const outX = dir * (w + 80);
      const rotate = dir * 7;

      // Persist save state
      if (action === 'save') saved.add(item.id);

      // Animate current out
      currentCardEl.style.transform = `translate3d(${outX}px, 0, 0) rotate(${rotate}deg)`;
      currentCardEl.style.opacity = '0.02';

      // Announce action (polite, not gamified)
      announce(`${action === 'save' ? 'Enregistré' : 'Passé'} : ${item.title}`);

      // After animation, advance
      window.setTimeout(() => {
        index = Math.min(index + 1, NEWS.length); // clamp

        if (index >= NEWS.length){
          renderEndState();
        } else {
          render();
        }
      }, prefersReducedMotion() ? 0 : 230);
    }

    function renderEndState(){
      // Simple end card; still consistent with UI.
      deckEl.innerHTML = '';
      updateProgress();

      const card = document.createElement('article');
      card.className = 'card';
      card.dataset.pos = 'current';
      card.style.setProperty('--accent', 'rgba(255,255,255,.6)');

      const bg = document.createElement('div');
      bg.className = 'cardBg';
      bg.style.setProperty('--bg', 'linear-gradient(135deg, rgba(255,255,255,.08), rgba(255,255,255,.02) 55%, rgba(12,18,36,.00))');

      const inner = document.createElement('div');
      inner.className = 'cardInner';
      inner.innerHTML = `
        <div class="topRow">
          <div class="badge"><span class="dot" aria-hidden="true"></span><span>Fin</span></div>
          <div class="count">[${NEWS.length}/${NEWS.length}]</div>
        </div>
        <div class="spacer" aria-hidden="true"></div>
        <h2 class="headline">Deck terminé</h2>
        <p class="summary">${saved.size} news enregistrée(s). Vous pouvez relancer le prototype.</p>
        <div class="details">
          <details>
            <summary>
              <span>Voir la liste enregistrée</span>
              <svg class="chev" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </summary>
            <div class="detailsBody">${escapeHtml(listSaved())}</div>
          </details>
        </div>
        <div class="actions" role="toolbar" aria-label="Actions">
          <button class="btn btnSkip" type="button" id="restartBtn" aria-label="Recommencer">
            Recommencer
          </button>
          <div class="hint">[fin]</div>
          <button class="btn btnSave" type="button" id="copyBtn" aria-label="Copier la liste">
            Copier
          </button>
        </div>
      `;

      card.appendChild(bg);
      card.appendChild(inner);
      deckEl.appendChild(card);

      document.getElementById('restartBtn').addEventListener('click', () => {
        index = 0;
        saved.clear();
        render();
      });
      document.getElementById('copyBtn').addEventListener('click', async () => {
        const txt = listSaved();
        try{
          await navigator.clipboard.writeText(txt);
          announce('Liste copiée dans le presse-papiers.');
        } catch {
          announce('Copie impossible (permissions navigateur).');
        }
      });

      announce('Deck terminé.');
    }

    function listSaved(){
      if (saved.size === 0) return 'Aucune news enregistrée.';
      const lines = NEWS.filter(n => saved.has(n.id)).map(n => `• ${n.title}`);
      return lines.join('\n');
    }

    // Keyboard navigation (desktop)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft'){
        e.preventDefault();
        if (index < NEWS.length) performAction('skip');
      }
      if (e.key === 'ArrowRight'){
        e.preventDefault();
        if (index < NEWS.length) performAction('save');
      }
    }, { passive: false });

    function prefersReducedMotion(){
      return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }

    // Small safety: keep title max 60 chars as requested
    function truncate(s, max){
      s = String(s || '');
      if (s.length <= max) return s;
      return s.slice(0, max - 1).trimEnd() + '…';
    }

    // Minimal HTML escaping (we control demo data but keep it clean/maintainable)
    function escapeHtml(str){
      return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    // Init
    render();
  </script>
</body>
</html>
