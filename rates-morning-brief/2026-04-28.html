<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rates & Inflation Morning Brief — 28 Avril 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    /* Scenario Probability Card */
    .scenario-block { margin: 1em 0; padding: 0.8em 1em; border-left: 4px solid #ffd700; border-radius: 0 8px 8px 0; background: rgba(255,215,0,0.05); }
    .scenario-block h3 { margin: 0 0 0.3em 0; font-size: 1.05em; display: flex; justify-content: space-between; align-items: center; }
    .scenario-block .proba { font-size: 1.3em; font-weight: bold; color: #ffd700; }
    .scenario-block p { margin: 0.2em 0; font-size: 0.92em; }
    .scenario-block .votes { font-size: 0.8em; opacity: 0.7; font-style: italic; }
    .consensus { margin-top: 1.2em; padding: 0.6em; border-radius: 8px; background: rgba(0,200,100,0.08); }
    .dissent { margin-top: 0.4em; padding: 0.6em; border-radius: 8px; background: rgba(255,80,80,0.08); }

    html.light .details div[style*="background"], html.light .details p[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Light mode: override inline white colors in trade cards */
    html.light .details p[style], html.light .details b[style], html.light .details span[style], html.light .details div[style] { color: rgba(0,0,0,.85) !important; }
    html.light .details div[style*="border-left:3px solid #f59e0b"] { background: rgba(245,158,11,.08) !important; }
    html.light .details div[style*="border-left:3px solid #10b981"] { background: rgba(16,185,129,.08) !important; }
    html.light .details div[style*="border-left:3px solid #ff4757"] { background: rgba(255,71,87,.06) !important; }
    html.light .details div[style*="color:#f59e0b"] { color: #b45309 !important; }
    html.light .details div[style*="color:#10b981"] { color: #047857 !important; }
    html.light .details div[style*="color:#ff4757"] { color: #dc2626 !important; }
    html.light .details h3 { color: #1a1a2e !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details p[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }
      .dt-reader .dt-r-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; }
      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }

  <script>
  const DATA = [{"t":"home","home":true,"date":"28 Avril 2026","henryWord":"Triple CB week kicks off with oil at 08 and Hormuz on day 60. The desk goes into Wednesday short Schatz and long vol — the ECB is the most likely source of a market surprise.","articles":[{"badge":"📊 Macro Pulse","title":"Fed & ECB Week: Quiet Data Calendar Before the Storm","idx":1},{"badge":"📉 Core Yields","title":"Fed Week Opens With Yields Creeping Higher — UST 10Y at 4.32%, Bund Tests 3.04%","idx":2},{"badge":"🏛️ CB Radar","title":"Triple CB Week: Fed & ECB Hold Expected, But IMF's +50bp Call Haunts the Doves","idx":3},{"badge":"💸 Inflation Dynamics","title":"Energy Shock Keeps Breakevens Bid — $108 Brent Fires the Inflation Afterburner","idx":4},{"badge":"🏗️ Supply & Fiscal","title":"Heavy Treasury Week: $69B 2Y + $70B 5Y Today, EGB Supply Later","idx":5},{"badge":"📐 Curve & Carry","title":"Bear Steepening Dominates — UST 2s10s at ~52bp, Bund Curve Positive","idx":6},{"badge":"🔄 RV & Spreads","title":"BTP-Bund Widens to 81bp on Hormuz Fear — Periphery Stress Returns Ahead of ECB","idx":7},{"badge":"🌍 Geopol & Risk Overlay","title":"RISK-OFF — Hormuz Stalemate + Triple CB Week Keeps Safe Havens Bid","idx":8},{"badge":"⚖️ Desk Vote","title":"Top 3 Trades — Bund Steepener, BTP Tightener, UST Carry","idx":9},{"badge":"🗳️ Conseil de Validation","title":"Council Verdict: 7 of 11 Trades Retained — Iris 👁️ Lead Review","idx":10}],"disclaimer":"⚠️ DISCLAIMER — This document is an experimental automated market intelligence product generated by artificial intelligence. It does NOT constitute investment advice, a trading recommendation, or regulated financial analysis under MiFID II or any securities regulation. The 'trade ideas' and 'scenarios' presented are pedagogical hypotheses generated by language models — they do not reflect the opinion of a licensed professional. Data is sourced from public feeds and may be delayed or inaccurate. Any investment decision based on this document is the sole responsibility of the reader. The author is not registered as an Investment Advisor with any regulatory authority. This content is provided for informational and experimental purposes only."},{"t":"alert","badge":"📊 Macro Pulse","title":"Fed & ECB Week: Quiet Data Calendar Before the Storm","hook":"No major US or EZ data releases today — all eyes turn to Wednesday's Fed decision and Thursday's ECB/BoE. The calm before the central bank super-week storm.","authorWord":"Light data day ahead of 3 CB decisions in 48h. Position for Powell's tone, not today's numbers.","author":"Blaise 🧮","details":"<b>📅 Today's Calendar — 28 April 2026<\/b><br><br>The data calendar is remarkably thin for a Monday, with no Tier-1 releases scheduled for the US, Eurozone, UK, or Japan. This creates a <b>tactical vacuum<\/b> ahead of the most consequential central bank week of Q2:<br><br><ul><li><b>Wednesday 30 Apr<\/b>: Fed rate decision (hold expected) + Powell press conference (possibly his last) — <a href='https://www.reuters.com/business/fed-likely-hold-rates-steady-powell-prepares-possible-swan-song-2026-04-27/' target='_blank'>Reuters<\/a><\/li><li><b>Thursday 1 May<\/b>: ECB rate decision (hold at 2.00% expected, per <a href='https://polymarket.com/event/ecb-interest-rates-april-2026' target='_blank'>Polymarket 98% hold probability<\/a>) + BoE decision (hold at 3.75% expected, but narrow 5-4 vote last time — <a href='https://hoa.org.uk/news/interest-rate-predictions-2/' target='_blank'>HoA<\/a>)<\/li><\/ul><br><b>🔍 What to Watch Instead<\/b><br><br>With no data to anchor expectations, markets will trade on:<br>1. <b>Oil price dynamics<\/b>: Brent holding near $108/bbl — any further escalation in Hormuz disruption feeds the stagflation narrative<br>2. <b>Fed whisperer articles<\/b>: Any pre-meeting WSJ/FT pieces on the inflation outlook could shift OIS pricing<br>3. <b>Treasury auctions<\/b>: $69B 2Y and $70B 5Y note results today — demand quality signals foreign buyer appetite<br><br><b>📊 Thursday–Friday Preview<\/b><br><br>Post-CB decision, the calendar picks up: US Q1 GDP (advance estimate) and Core PCE data are expected later in the week. Consensus for Q1 GDP is around 2.0% annualized, but the Hormuz oil shock creates meaningful downside risk to Q2.<br><br><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The market is underpricing a hawkish surprise from the ECB. With Brent at $108, the IMF calling for +50bp by year-end (<a href='https://www.reuters.com/business/imf-expects-ecb-raise-rates-by-half-percentage-point-2026-2026-04-17/' target='_blank'>Reuters, 17 Apr<\/a>), and Lagarde's 'layer cake of shocks' language, the April hold is not a done deal. A dissent from Schnabel or Holzmann would send Bunds 5bp wider instantly.<\/div><\/div><br><br><b>💡 Trade Ideas<\/b><br><br><ul><li><b>Schatz straddle pre-ECB<\/b>: Buy ATM straddle on Schatz Jun26 futures around 97.80. If ECB surprises hawkish, Schatz drops 10-15 ticks. If hold, premiums decay but manageable. Cost: ~15bp DV01-equivalent. Horizon: through 30 Apr.<\/li><li><b>Long front-end vs belly on data calm<\/b>: Receive 2Y OIS vs pay 5Y in EUR, betting that the flat data calendar keeps the front-end anchored while term premium creeps higher on supply/oil. Entry: current 2Y-5Y OIS spread. Stop: 2Y OIS +5bp. Target: flatten 3bp.<\/li><\/ul>","sig":"Blaise 🧮","factChecked":true},{"t":"alert","badge":"📉 Core Yields","title":"Fed Week Opens With Yields Creeping Higher — UST 10Y at 4.32%, Bund Tests 3.04%","hook":"Oil at $108 keeps the inflation premium bid across sovereigns. UST 10Y +1bp to 4.32%, Bund 10Y +3bp to 3.04%, BTP-Bund spread at 81bp. Supply weighs.","authorWord":"Higher-for-longer repricing continues. Oil + supply + CB hawkish risk = no relief for duration bulls.","author":"Henry 🦉","details":"<b>📊 Benchmark Yields — 27 Apr 2026 Close<\/b><br><br><p><strong>Benchmark:<\/strong> <b>UST 2Y<\/b><br><strong>Yield (%):<\/strong> 3.80<br><strong>Day Δ (bp):<\/strong> ~+2<br><\/p><p><strong>Benchmark:<\/strong> <b>UST 5Y<\/b><br><strong>Yield (%):<\/strong> 3.95<br><strong>Day Δ (bp):<\/strong> ~+1<br><\/p><p><strong>Benchmark:<\/strong> <b>UST 10Y<\/b><br><strong>Yield (%):<\/strong> 4.322<br><strong>Day Δ (bp):<\/strong> +1.0<br><\/p><p><strong>Benchmark:<\/strong> <b>UST 30Y<\/b><br><strong>Yield (%):<\/strong> 4.93<br><strong>Day Δ (bp):<\/strong> +2.0<br><\/p><p><strong>Benchmark:<\/strong> <b>Europe<\/b><br><\/p><p><strong>Benchmark:<\/strong> <b>Bund 10Y<\/b><br><strong>Yield (%):<\/strong> 3.04<br><strong>Day Δ (bp):<\/strong> +3.0<br><\/p><p><strong>Benchmark:<\/strong> <b>OAT 10Y<\/b><br><strong>Yield (%):<\/strong> 3.69<br><strong>Day Δ (bp):<\/strong> +4.0<br><\/p><p><strong>Benchmark:<\/strong> <b>BTP 10Y<\/b><br><strong>Yield (%):<\/strong> 3.85<br><strong>Day Δ (bp):<\/strong> +5.0<br><\/p><p><strong>Benchmark:<\/strong> <b>Gilt 10Y<\/b><br><strong>Yield (%):<\/strong> 4.98<br><strong>Day Δ (bp):<\/strong> +4.0<br><\/p><br><small>Sources: <a href='https://www.cnbc.com/2026/04/27/us-iran-peace-talks-stall-global-markets-stocks-oil-treasurys.html' target='_blank'>CNBC (UST 10Y 4.322%)<\/a>, <a href='https://fred.stlouisfed.org/series/DGS10' target='_blank'>FRED (UST 10Y 4.31% Apr 24)<\/a>, <a href='https://tradingeconomics.com/germany/government-bond-yield' target='_blank'>TradingEconomics (Bund 10Y 3.04%)<\/a>, <a href='https://tradingeconomics.com/italy/government-bond-yield' target='_blank'>TE Italy (BTP 10Y 3.85%)<\/a>, <a href='https://tradingeconomics.com/france/government-bond-yield' target='_blank'>TE France (OAT 10Y 3.69%)<\/a>. All data as of 27 Apr 2026 close.<\/small><br><br><hr><br><b>🚗 Drivers<\/b><br><br><b>1. Oil persistence<\/b>: Brent near $108/bbl as Iran proposed partial Hormuz reopening but Trump cancelled Islamabad summit — markets price low probability of near-term resolution. The inflation transmission to yields is direct and ongoing.<br><br><b>2. Treasury supply<\/b>: $69B 2Y and $70B 5Y note auctions today — described as 'lackluster' by <a href='https://www.cnbc.com/2026/04/27/treasury-yields-fed-policy-week-mpc-powell.html' target='_blank'>CNBC<\/a>, both tailed, pushing yields higher.<br><br><b>3. CB week positioning<\/b>: Dealers reducing duration exposure ahead of triple CB decisions (Fed Wed, ECB/BoE Thu). The uncertainty premium is being priced in.<br><br><b>🌅 Overnight / Asia<\/b><br><br>JGB 10Y +2.6bp to 2.463% (<a href='https://www.cnbc.com/2026/04/27/us-iran-peace-talks-stall-global-markets-stocks-oil-treasurys.html' target='_blank'>CNBC<\/a>). UST futures slightly softer in Asian session. Nikkei flat. No major catalyst from the Asian timezone.<br><br><b>📐 Technical Levels<\/b><br><br><ul><li><b>UST 10Y<\/b>: Resistance at 4.35% (Apr 24 high), then 4.40% (psychological). Support at 4.28% (50DMA) and 4.20%.<\/li><li><b>Bund 10Y<\/b>: Testing 3.04% — breakout above 3.05% opens 3.10%. Support at 2.98%.<\/li><\/ul><br><b>📈 Cross-Market Context<\/b><br><br>DXY at 98.27 (-0.26%), VIX at 19.00 (+1.55%), S&P 500 at 7,165 (<a href='https://www.schwab.com/learn/story/stock-market-update-open' target='_blank'>Schwab<\/a>). Risk tone mildly cautious but not distressed.<br><br><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>The market is too focused on oil and not enough on the growth slowdown. EZ PMIs are in contraction territory, and the US consumer is showing fatigue. A recession scare in Q2 would trigger a 20bp rally in Bunds and UST 10Y, regardless of oil. The risk-reward favors duration longs at these levels, especially in 5Y where carry is positive.<\/div><\/div><br><br><b>💡 Trade Ideas<\/b><br><br><ul><li><b>Short Bund 10Y (duration bearish)<\/b>: Sell Bund Jun26 futures at ~131.50. Stop: 132.40 (3.00% Bund). Target: 130.00 (3.10% Bund). R:R ~2:1. Catalyst: ECB hawkish hold or hot PCE.<\/li><li><b>UST 2s10s bear steepener<\/b>: Pay 2Y OIS / receive 10Y OIS. Entry: ~50bp. Stop: 40bp. Target: 60bp. Rationale: Supply weighs on long end, Fed holds short end anchored.<\/li><li><b>Long USD vs EUR rates via futures<\/b>: Buy UST 10Y / sell Bund 10Y (duration neutral). US-Germany spread widening on policy divergence.<\/li><\/ul>","sig":"Henry 🦉","factChecked":true},{"t":"analysis","badge":"🏛️ CB Radar","title":"Triple CB Week: Fed & ECB Hold Expected, But IMF's +50bp Call Haunts the Doves","hook":"Fed (Wed), ECB & BoE (Thu) all expected to hold, but pricing for June hikes is rising. ECB at 98% hold per Polymarket, but the IMF's call for +50bp by year-end has shifted the narrative.","authorWord":"Three holds, three different stories. The IMF's +50bp ECB call and JPMorgan's BoE hike forecast change the forward curve entirely.","author":"Sage 🦎","details":"<b>🏛️ Central Bank Pricing Matrix — 28 April 2026<\/b><br><br><p><strong>Central Bank:<\/strong> <b>Fed<\/b><br><strong>Next Meeting:<\/strong> Apr 28-29 (Wed)<br><strong>Current Rate:<\/strong> 4.25-4.50%<br><strong>Market Pricing:<\/strong> Hold (near 100%)<br><strong>Change vs Last Week:<\/strong> Unchanged<br><\/p><p><strong>Central Bank:<\/strong> <b>ECB<\/b><br><strong>Next Meeting:<\/strong> Apr 30 (Thu)<br><strong>Current Rate:<\/strong> 2.00% deposit<br><strong>Market Pricing:<\/strong> Hold at 98% (<a href='https://polymarket.com/event/ecb-interest-rates-april-2026' target='_blank'>Polymarket<\/a>)<br><strong>Change vs Last Week:<\/strong> Slightly less dovish<br><\/p><p><strong>Central Bank:<\/strong> <b>BoE<\/b><br><strong>Next Meeting:<\/strong> Apr 30 (Thu)<br><strong>Current Rate:<\/strong> 3.75%<br><strong>Market Pricing:<\/strong> Hold expected, but narrow 5-4 vote (<a href='https://hoa.org.uk/news/interest-rate-predictions-2/' target='_blank'>HoA<\/a>)<br><strong>Change vs Last Week:<\/strong> Hawkish tilt<br><\/p><br><small>Sources as linked. Data as of 28 Apr 2026.<\/small><br><br><hr><br><b>📈 Forward Guidance Deltas<\/b><br><br><b>Fed<\/b>: Powell's press conference on Wednesday is the main event. <a href='https://www.reuters.com/business/fed-likely-hold-rates-steady-powell-prepares-possible-swan-song-2026-04-27/' target='_blank'>Reuters reports<\/a> this could be his last meeting as Chair. Language on 'inflation risks' and 'data dependency' will be parsed word by word. Any shift from 'patient' to 'vigilant' on oil-driven inflation would be hawkish.<br><br><b>ECB<\/b>: The <a href='https://www.cnbc.com/2026/04/16/ecb-interest-rates-hike-inflation-iran-washington.html' target='_blank'>ECB's 'layer cake of shocks'<\/a> framing has markets pricing a June hike at ~30%. The <a href='https://www.reuters.com/business/imf-expects-ecb-raise-rates-by-half-percentage-point-2026-2026-04-17/' target='_blank'>IMF's recommendation of +50bp by year-end<\/a> (17 Apr) provides intellectual cover for hawks on the GC. Watch for Schnabel/Nagel dissents.<br><br><b>BoE<\/b>: <a href='https://www.thestreet.com/fed/global-central-banks-ecb-and-boe-signal-shocking-shift-on-interest-rate-bets-due-to-iran-war-oil-spike' target='_blank'>J.P. Morgan expects 25bp hikes in April and July<\/a>. The last vote was 5-4 — another split decision this week would signal a hike is imminent by June.<br><br><b>📉 Balance Sheet Watch<\/b><br><br><ul><li><b>Fed QT<\/b>: SOMA runoff continuing at ~$25B/month cap for Treasuries. No signals of slowdown from Warsh nomination chatter.<\/li><li><b>ECB PEPP<\/b>: Reinvestment phase — full reinvestment of maturing PEPP holdings through 2026 H1. No change expected at this meeting, but any tapering signal would widen periphery spreads.<\/li><\/ul><br><b>🔀 Cross-CB Divergence<\/b><br><br>The ECB-Fed policy gap remains wide. With ECB at 2.00% and Fed at 4.25-4.50%, the 225-250bp gap supports EUR/USD downside on a rate differential basis. However, if ECB starts hiking in June while Fed holds, the gap could narrow by 25-50bp, supporting EUR. <a href='https://www.linkedin.com/posts/bernardrenaud_rates-centralbanks-monetarypolicy-activity-7444781436152320000-q0O9' target='_blank'>1Y GBP OIS at 4.24% (Renaud/LI)<\/a> — BoE pricing steepest tightening among the three.<br><br><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The market is complacent on the ECB. A 98% hold probability is too high given the IMF call, Brent at $108, and EZ inflation still above target. Lagarde could use the press conference to explicitly signal June as 'live,' which would trigger a Bund sell-off. Being short Schatz into the meeting offers asymmetric payoff.<\/div><\/div><br><br><b>💡 Trade Ideas<\/b><br><br><ul><li><b>Short Schatz into ECB<\/b>: Sell Schatz Jun26 futures around 97.80. Stop: 98.00. Target: 97.40. R:R ~3:1. If ECB signals June hike, Schatz drops 15-20 ticks.<\/li><li><b>Long Euribor volatility<\/b>: Buy Jun26 Euribor straddle at ~97.50 strike. Premium ~10bp. If ECB surprises or signals June as live, vol explodes.<\/li><li><b>ECB-Fed 2Y spread tightener<\/b>: Receive 2Y EUR OIS / pay 2Y USD OIS. Betting on ECB hiking path converging toward Fed. Entry: ~-225bp. Target: -200bp by Q3.<\/li><\/ul>","sig":"Sage 🦎","factChecked":true},{"t":"analysis","badge":"💸 Inflation Dynamics","title":"Energy Shock Keeps Breakevens Bid — $108 Brent Fires the Inflation Afterburner","hook":"Oil at $108 is pushing inflation expectations higher across the board. US 10Y breakevens above 2.40%, German 10Y near 2.14%. The pass-through from Hormuz to CPI is now priced as structural, not transitory.","authorWord":"Energy-driven inflation is no longer a 2025 story — it's the dominant 2026 theme. Central banks are cornered.","author":"Sage 🦎","details":"<b>💸 Breakeven Snapshot — 27 Apr 2026<\/b><br><br><p><strong>Breakeven:<\/strong> <b>US 10Y BE<\/b><br><strong>Level (%):<\/strong> ~2.40<br><strong>Day Δ (bp):<\/strong> +2<br><strong>Comment:<\/strong> Holding above 2.35% resistance<br><\/p><p><strong>Breakeven:<\/strong> <b>DE 10Y BE<\/b><br><strong>Level (%):<\/strong> ~2.14<br><strong>Day Δ (bp):<\/strong> +1<br><strong>Comment:<\/strong> Supported by energy/base effects<br><\/p><p><strong>Breakeven:<\/strong> <b>FR 10Y BE<\/b><br><strong>Level (%):<\/strong> ~2.10<br><strong>Day Δ (bp):<\/strong> +1<br><strong>Comment:<\/strong> Tracking DE closely<br><\/p><p><strong>Breakeven:<\/strong> <b>IT 10Y BE<\/b><br><strong>Level (%):<\/strong> ~2.15<br><strong>Day Δ (bp):<\/strong> +1<br><strong>Comment:<\/strong> Higher inflation risk premium<br><\/p><br><small>Estimates based on nominal yield minus real yield spread. US BE ≈ 4.32% - 1.92%. DE BE ≈ 3.04% - 0.90%. Sources: <a href='https://tradingeconomics.com/germany/government-bond-yield' target='_blank'>TE Germany<\/a>, <a href='https://www.cnbc.com/2026/04/27/us-iran-peace-talks-stall-global-markets-stocks-oil-treasurys.html' target='_blank'>CNBC UST<\/a>. Approximate levels as of 27 Apr 2026.<\/small><br><br><hr><br><b>🔥 Core vs Headline Decomposition<\/b><br><br>The inflation story in 2026 has two distinct drivers:<br><br><b>1. Energy base effects<\/b>: Brent at $108 is +35% from the 2025 average. This feeds directly into headline CPI with a 2-3 month lag. The worst of the pass-through is expected in Q3 2026 data.<br><br><b>2. Core services stickiness<\/b>: Wage growth in the EZ remains above 4% YoY. Services inflation is plateauing, not declining. The ECB's 'last mile' problem is now a 'new mile' problem.<br><br><b>📊 Real Yields<\/b><br><br><ul><li><b>US 10Y real yield<\/b>: ~1.92% (4.32% nominal - 2.40% BE). Historically restrictive. Percentile: ~75th over 15 years.<\/li><li><b>DE 10Y real yield<\/b>: ~0.90% (3.04% - 2.14% BE). Moderately restrictive. ECB policy rate at 2.00% in real terms is mildly positive.<\/li><\/ul><br>Central banks have room to hold or hike without entering deeply restrictive territory, which supports the 'higher for longer' narrative.<br><br><b>🔗 Linkers vs Nominals<\/b><br><br>BTP€i vs BTP: Real yield on BTP€i ~0.70%, vs BTP nominal 3.85% — implied breakeven ~3.15%, which is well above DE breakeven, reflecting Italy-specific inflation risk. For RV purposes, BTP€i looks cheap vs OAT€i on a breakeven-relative basis.<br><br><b>⛽ Commodity Inputs<\/b><br><br>Brent near $108, natural gas (TTF) at ~€45/MWh (down from €50+ peak but structurally elevated). Metals complex mixed — copper stable, iron ore soft on China demand concerns. The primary inflation transmission channel remains energy.<br><br><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>Breakevens are overestimating the energy pass-through. The global growth slowdown (EZ in contraction, China decelerating) will cap demand-pull inflation. By Q3, base effects roll over and headline CPI drops sharply. Being long breakevens here is fighting the eventual mean reversion. Consider a 5Y vs 10Y BE flattener.<\/div><\/div><br><br><b>💡 Trade Ideas<\/b><br><br><ul><li><b>Long DE 10Y breakeven widener<\/b>: Buy inflation-linked vs sell nominal Bunds 10Y. Entry: ~2.14%. Target: 2.30%. Stop: 2.00%. Rationale: Oil pass-through not fully priced.<\/li><li><b>BE flattener (5Y vs 10Y US)<\/b>: Pay 5Y US BE / receive 10Y US BE. Near-term inflation priced into 5Y, 10Y anchored by long-term expectations. Entry: ~-20bp. Target: -10bp.<\/li><li><b>Long BTP€i vs short BTP<\/b>: Duration-neutral linker RV. Italian breakevens offer value vs Germany. Entry: ~3.15% BE spread. Target: 3.30%.<\/li><\/ul>","sig":"Sage 🦎","factChecked":true},{"t":"alert","badge":"🏗️ Supply & Fiscal","title":"Heavy Treasury Week: $69B 2Y + $70B 5Y Today, EGB Supply Later","hook":"The US fires the opening salvo of supply week with $139B in coupons today. Italy, France, and UK also lining up auctions. Demand quality is the key variable in a volatile CB week.","authorWord":"Supply absorption is the test. With 3 CB decisions, dealers are lean on inventory — tail risk is real.","author":"Blaise 🧮","details":"<b>🏗️ Auction Calendar — Week of 28 April 2026<\/b><br><br><b>Today (28 Apr):<\/b><br><ul><li><b>UST 2Y note<\/b>: $69B — results expected afternoon. Previous: $67B, bid-to-cover 2.48x. Tail risk elevated given CB week positioning.<\/li><li><b>UST 5Y note<\/b>: $70B — results expected afternoon. Previous: $68B.<\/li><\/ul><br><b>Tomorrow (29 Apr):<\/b><br><ul><li><b>UST 7Y note<\/b>: Expected ~$44B<\/li><\/ul><br><b>Later this week:<\/b><br><ul><li>Italy: BTP short-term auction expected Thursday — first test of periphery demand post-ECB decision<\/li><li>France: OAT auction expected mid-week<\/li><li>UK: Gilt auction in pipeline<\/li><\/ul><br><small>Source: <a href='https://www.schwab.com/learn/story/stock-market-update-open' target='_blank'>Schwab<\/a>, <a href='https://www.cnbc.com/2026/04/27/treasury-yields-fed-policy-week-mpc-powell.html' target='_blank'>CNBC<\/a>. Auction sizes as of 27 Apr 2026.<\/small><br><br><hr><br><b>📊 Recent Results<\/b><br><br>Monday's $69B 2Y and $70B 5Y were described as 'lackluster' by CNBC, with both auctions tailing. Indirect bidder participation was below average, suggesting reduced foreign demand in a CB-volatile week. This is concerning given the sheer volume of supply still to come.<br><br><b>📦 Supply Pipeline Context<\/b><br><br>Q2 is typically heavy for Treasury issuance. With QT continuing (Fed runoff ~$25B/month), the net supply to the market is elevated. The Treasury Borrowing Advisory Committee (TBAC) has signaled larger coupon sizes may be needed to fund the fiscal deficit, which is running above 6% of GDP.<br><br>In Europe, the ECB's full PEPP reinvestment provides a backstop for EGB supply, but any tapering signal at Thursday's meeting would change the calculus dramatically for periphery bonds.<br><br><b>🏛️ Fiscal Backdrop<\/b><br><br><ul><li><b>US<\/b>: FY2026 deficit tracking above $1.8T. No fiscal consolidation in sight.<\/li><li><b>EU<\/b>: Italy's deficit still above 3% target. France dealing with political uncertainty and spending pressures. ECB PEPP reinvestment remains the key backstop.<\/li><\/ul><br><b>📉 QT Absorption<\/b><br><br>Fed QT + ECB APP roll-off = ~€30-40B/month of net supply hitting markets in combined US/EU. With dealer balance sheets constrained, auction tail risk is structurally higher than in 2024-25.<br><br><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The tail on the 2Y is being overinterpreted. Foreign demand always dips in CB-heavy weeks as investors wait for guidance. Post-Fed/ECB clarity, demand will normalize. The real risk is not in auctions but in the fiscal trajectory — the US is running wartime deficits in peacetime, and the term premium will eventually reflect this permanently.<\/div><\/div><br><br><b>💡 Trade Ideas<\/b><br><br><ul><li><b>Pre-auction concession trade<\/b>: Buy the 5Y WI ahead of Wednesday's 7Y auction, expecting post-auction snapback. Entry: ~3.96% WI yield. Target: 3.92%. Stop: 4.00%.<\/li><li><b>WI vs cash basis trade<\/b>: If the 2Y WI trades cheap to the cash by 1-2bp into the auction, buy the WI and sell cash. Concession should compress post-results.<\/li><li><b>BTP pre-ECB widener<\/b>: If BTP-Bund widens on ECB hawkish fears, buy BTP post-ECB for snapback. Entry: 83bp+ on widening. Target: 78bp.<\/li><\/ul>","sig":"Blaise 🧮","factChecked":true},{"t":"tech","badge":"📐 Curve & Carry","title":"Bear Steepening Dominates — UST 2s10s at ~52bp, Bund Curve Positive","hook":"The yield curve continues to bear-steepen as term premium reprices for oil-driven inflation and heavy supply. Carry remains positive in the belly — 5Y is the sweet spot for duration-neutral positioning.","authorWord":"Bear steepening is the regime. Oil + supply + CB uncertainty all push the long end higher. Belly carry is the only free lunch.","author":"Nova 🌟","details":"<b>📐 Curve Snapshot — 27 Apr 2026 Close<\/b><br><br><p><strong>Curve:<\/strong> <b>UST 2s10s<\/b><br><strong>Current (bp):<\/strong> ~52<br><strong>Day Δ (bp):<\/strong> +~1<br><strong>Regime:<\/strong> Bear steepening<br><\/p><p><strong>Curve:<\/strong> <b>UST 5s30s<\/b><br><strong>Current (bp):<\/strong> ~98<br><strong>Day Δ (bp):<\/strong> +~2<br><strong>Regime:<\/strong> Bear steepening<br><\/p><p><strong>Curve:<\/strong> <b>Bund 2s10s<\/b><br><strong>Current (bp):<\/strong> ~44<br><strong>Day Δ (bp):<\/strong> +~1<br><strong>Regime:<\/strong> Bear steepening<br><\/p><p><strong>Curve:<\/strong> <b>Gilt 2s10s<\/b><br><strong>Current (bp):<\/strong> ~100+<br><strong>Day Δ (bp):<\/strong> +~3<br><strong>Regime:<\/strong> Bear steepening<br><\/p><br><small>Estimated from yield levels: UST 2Y 3.80%, 10Y 4.32%, 30Y 4.93%. Bund 2Y ~2.60%, 10Y 3.04%. Sources: <a href='https://www.cnbc.com/2026/04/27/us-iran-peace-talks-stall-global-markets-stocks-oil-treasurys.html' target='_blank'>CNBC<\/a>, <a href='https://tradingeconomics.com/germany/government-bond-yield' target='_blank'>TE Germany<\/a>. As of 27 Apr 2026.<\/small><br><br><hr><br><b>🦋 Butterfly Analysis<\/b><br><br><b>UST 2s5s10s butterfly<\/b>: The belly (5Y) is trading roughly fair vs wings. No strong signal for a butterfly trade this week — the dominant move is a parallel shift higher with steepening bias.<br><br><b>Bund 2s5s10s butterfly<\/b>: Similar story. The belly is supported by positive carry, but the curve is moving as a whole rather than showing butterfly dislocations.<br><br><b>💰 Carry & Roll-Down (3-Month, Approximate)<\/b><br><br><ul><li><b>UST 2Y<\/b>: Carry ~+18bp, roll-down ~+8bp. Total ~+26bp. Best carry in the curve.<\/li><li><b>UST 5Y<\/b>: Carry ~+20bp, roll-down ~+12bp. Total ~+32bp. Optimal risk-adjusted carry.<\/li><li><b>UST 10Y<\/b>: Carry ~+15bp, roll-down ~+10bp. Total ~+25bp. Positive but more vol risk.<\/li><li><b>Bund 5Y<\/b>: Carry ~+15bp equivalent. Positive carry positioning supports the belly.<\/li><\/ul><br><b>📈 Curve Regime<\/b><br><br><b>Bear steepening<\/b> is the dominant regime: the long end is selling off faster than the front end as term premium reprices for: (1) persistent oil/inflation, (2) heavy supply, (3) reduced CB pivot expectations. This is consistent with the 2026 Q2 macro backdrop.<br><br>Historical analogy: The 2022-23 hiking cycle saw similar bear steepening before the curve eventually bull-flattened on recession fears. We're not there yet — growth is too resilient, especially in the US.<br><br><b>🌍 Cross-Currency Curve<\/b><br><br>Bund curve is flatter than UST curve (44bp vs 52bp 2s10s). This reflects the ECB's lower rate level and the EZ growth slowdown. A Bund steepener relative to UST flattener could work if the ECB hikes in June while the Fed holds.<br><br><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>Bear steepening is running out of road. The 2s10s at 52bp is approaching the top of its 6-month range. If the Fed holds and Powell sounds dovish on Wednesday, we could see a sharp bull flattening reversal. Positioning for steepening here has poor risk-reward — the asymmetric move is toward flattening.<\/div><\/div><br><br><b>💡 Trade Ideas<\/b><br><br><ul><li><b>UST 5Y carry trade<\/b>: Buy UST 5Y at ~3.95%. Carry + roll-down ~32bp/quarter. Stop: 4.15% (+20bp). Target: hold for 3 months. This is the optimal carry bucket.<\/li><li><b>Bund 2s10s steepener<\/b>: Pay 2Y / receive 10Y Bund. Entry: 44bp. Target: 55bp by Q3. Stop: 35bp. Rationale: ECB hiking path steeper than priced, pushing belly higher vs long-end carry.<\/li><li><b>UST 2s5s10s butterfly<\/b>: Receive 5Y / pay 2Y and 10Y. Small edge — belly slightly cheap. Entry: ~0bp (fair). Target: +3bp belly cheapening. Small size, tactical.<\/li><\/ul>","sig":"Nova 🌟","factChecked":true},{"t":"analysis","badge":"🔄 RV & Spreads","title":"BTP-Bund Widens to 81bp on Hormuz Fear — Periphery Stress Returns Ahead of ECB","hook":"The BTP-Bund spread is back above 80bp as oil-fueled stagflation fears hit Italian risk. OAT-Bund at 65bp. The ECB's PEPP reinvestment is the only thing keeping spreads from blowing out further.","authorWord":"Periphery is where the stress lives. BTP-Bund at 81bp is the key level — breach 85bp and forced selling kicks in.","author":"Henry 🦉","details":"<b>🔄 Spread Table — 27 Apr 2026 Close<\/b><br><br><p><strong>Spread:<\/strong> <b>BTP-Bund 10Y<\/b><br><strong>Level (bp):<\/strong> 81<br><strong>Day Δ (bp):<\/strong> +2<br><strong>1W Δ (bp):<\/strong> +~3<br><strong>Direction:<\/strong> WIDENED<br><\/p><p><strong>Spread:<\/strong> <b>OAT-Bund 10Y<\/b><br><strong>Level (bp):<\/strong> 65<br><strong>Day Δ (bp):<\/strong> +1<br><strong>1W Δ (bp):<\/strong> +~2<br><strong>Direction:<\/strong> WIDENED<br><\/p><p><strong>Spread:<\/strong> <b>Spain-Bund 10Y<\/b><br><strong>Level (bp):<\/strong> ~75<br><strong>Day Δ (bp):<\/strong> +~1<br><strong>1W Δ (bp):<\/strong> +~2<br><strong>Direction:<\/strong> WIDENED<br><\/p><p><strong>Spread:<\/strong> <b>Gilt-Bund 10Y<\/b><br><strong>Level (bp):<\/strong> ~194<br><strong>Day Δ (bp):<\/strong> +~1<br><strong>1W Δ (bp):<\/strong> +~2<br><strong>Direction:<\/strong> WIDENED<br><\/p><p><strong>Spread:<\/strong> <b>EGB vs UST 10Y<\/b><br><strong>Level (bp):<\/strong> ~-128<br><strong>Day Δ (bp):<\/strong> ~flat<br><strong>1W Δ (bp):<\/strong> +~2<br><strong>Direction:<\/strong> WIDENED<br><\/p><br><small>Calculated: BTP 3.85% - Bund 3.04% = 81bp. OAT 3.69% - Bund 3.04% = 65bp. Sources: <a href='https://tradingeconomics.com/germany/government-bond-yield' target='_blank'>TE Germany<\/a>, <a href='https://tradingeconomics.com/italy/government-bond-yield' target='_blank'>TE Italy<\/a>, <a href='https://tradingeconomics.com/france/government-bond-yield' target='_blank'>TE France<\/a>. As of 27 Apr 2026 close.<\/small><br><br><hr><br><b>📊 Spread Drivers<\/b><br><br><b>1. Stagflation fears<\/b>: EZ PMIs in contraction territory + Brent at $108 = worst possible combination for periphery bonds. Higher inflation without growth support = fiscal deterioration risk for high-debt countries like Italy.<br><br><b>2. ECB PEPP allocation<\/b>: The ECB's reinvestment of PEPP maturing bonds is the key backstop. Any hint of tapering at Thursday's meeting would widen BTP-Bund by 5-10bp immediately. The market is currently pricing 'no change' but is nervous.<br><br><b>3. Italian fiscal concerns<\/b>: Italy's deficit remains above the 3% EU target. Political stability has improved marginally, but the growth outlook is deteriorating, making fiscal consolidation harder.<br><br><b>📈 ASW Spreads<\/b><br><br>Asset-swap levels for BTPs remain elevated, with the cash-vs-swap basis still wide for Italian paper. This reflects a structural risk premium rather than a temporary dislocation — BTP ASW ~55bp vs Bund ~15bp.<br><br><b>🔀 Flow Intelligence<\/b><br><br>No specific block trades reported, but general dealer positioning is light — most desks are flat ahead of the ECB. This means any surprise (hawkish hold, PEPP taper hint) would have outsized impact due to low market depth.<br><br><b>⚖️ Duration-Neutral Opportunities<\/b><br><br>The best risk-adjusted spread trade currently is <b>long BTP / short Bund<\/b> on a DV01-matched basis, betting that the ECB hold + confirmed PEPP reinvestment triggers a 3-5bp tightening. The risk is a hawkish ECB surprise which could push the spread to 90bp+.<br><br><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>BTP-Bund at 81bp is not stressed — it's fairly priced for the risk. Italian fundamentals (debt/GDP, political risk, bank exposure) justify a 75-85bp range. The 'spread widening' narrative is overblown. Wait for 90bp before buying BTP for value. At current levels, the carry advantage of BTP vs Bund is offset by the volatility risk.<\/div><\/div><br><br><b>💡 Trade Ideas<\/b><br><br><ul><li><b>BTP-Bund tightener post-ECB<\/b>: Buy BTP 10Y / sell Bund 10Y DV01-matched at 81bp. Target: 75bp. Stop: 88bp. R:R ~1:1.5. Catalyst: ECB hold + PEPP confirmation.<\/li><li><b>OAT vs BTP intra-EU RV<\/b>: Long OAT / short BTP (BTP-OAT spread widener from 16bp to 20bp). France has better fiscal fundamentals but Italy has ECB backstop. If spreads blow out, BTP underperforms.<\/li><li><b>EGB vs UST basis trade<\/b>: Long EGB / short UST on a duration-neutral basis. ECB tightening path supports EUR rates vs USD. Entry: current levels. Target: 3bp tightening. Stop: -5bp widening.<\/li><\/ul>","sig":"Henry 🦉","factChecked":true},{"t":"alert","badge":"🌍 Geopol & Risk Overlay","title":"RISK-OFF — Hormuz Stalemate + Triple CB Week Keeps Safe Havens Bid","hook":"Iran's partial reopening proposal rejected by Trump. Brent at $108. Triple central bank decisions in 48h. Risk tag: 🟡 NEUTRAL-to-RISK-OFF, tilted negative on geopol.","authorWord":"The Hormuz ceiling is intact. Every failed negotiation attempt pushes oil higher and safety bid stronger. Bunds and USTs benefit.","author":"Henry 🦉","details":"<b>🏷️ Risk Tag: 🟡 NEUTRAL → leaning RISK-OFF<\/b><br><br>The dominant sentiment driver is the Hormuz stalemate combined with central bank uncertainty. Not a full risk-off (equities are stable, VIX at 19 is elevated but not panic), but the direction of travel is negative.<br><br><hr><br><b>🛡️ Flight-to-Quality Flows<\/b><br><br><ul><li><b>Bund bid<\/b>: Bund 10Y at 3.04% with +3bp on the day — the absolute level is higher, but relative to risk assets, Bunds are outperforming periphery (BTP-Bund widening).<\/li><li><b>UST bid<\/b>: UST 10Y at 4.32%, up only +1bp vs BTP +5bp. Safe haven status confirmed in the spread move.<\/li><li><b>JGB stable<\/b>: 10Y at 2.46%, modestly higher but not showing flight-to-quality behavior.<\/li><\/ul><br><b>🌍 Active Geopolitical Arcs<\/b><br><br><b>1. Hormuz (PRIMARY)<\/b>: Iran proposed partial reopening — ceasefire first, nuclear talks later. Trump cancelled Islamabad summit, said talks can happen by phone. Markets price <5% chance of near-term resolution. This is Day 60+ of disruption. <a href='https://www.cnbc.com/2026/04/27/us-iran-peace-talks-stall-global-markets-stocks-oil-treasurys.html' target='_blank'>CNBC<\/a><br><br><b>2. US-China trade<\/b>: No major escalation in 48h, but baseline tariffs remain elevated. A secondary risk factor for global growth.<br><br><b>3. Russia-Ukraine<\/b>: Ceasefire talks stalled. Russian LNG ban in effect (short-term contracts from Apr 25). Low immediate market impact beyond what's already priced.<br><br><b>🏴 Periphery Risk<\/b><br><br>BTP-Bund at 81bp and widening. No specific Italian political event, but the combination of EZ stagflation + ECB hold creates a negative backdrop. If the ECB hints at hiking while growth contracts, periphery spreads face asymmetric widening risk.<br><br><b>⛽ Energy-Inflation Transmission<\/b><br><br>Brent at $108 is the primary channel from geopol to rates. The transmission path: Oil ↑ → CPI ↑ → CB hawkishness ↑ → Yields ↑ → Periphery stress ↑. This loop is now fully operational and is the dominant driver of cross-asset moves.<br><br><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>The geopolitical risk premium is overpriced. Markets have been pricing Hormuz disruption for 60 days — the base case is already in the price. A surprise ceasefire would trigger a violent oil correction (-15%) and a massive risk-on rally. The asymmetric tail is toward de-escalation, not further escalation. Being short volatility here is the contrarian play.<\/div><\/div><br><br><b>💡 Trade Ideas<\/b><br><br><ul><li><b>Long Bund / short BTP on risk-off<\/b>: DV01-matched. If Hormuz escalates, BTP-Bund widens to 90bp+. Entry: 81bp spread. Target: 90bp. Stop: 75bp. Horizon: 1-2 weeks.<\/li><li><b>UST 10Y straddle<\/b>: Buy ATM straddle on UST 10Y futures at 4.32%. Premium ~15bp. If escalation (or surprise ceasefire), either direction moves yields 15-20bp. Break-even: ~4.17% or ~4.47%.<\/li><li><b>Long linkers on energy shock<\/b>: Buy inflation-linked bonds (US TIPS or EU linkers) as oil shock hedge. Brea       localStorage.setItem('theme',isLight?'light':'dark');
    });
  })();
  </script>
</body>
</html>
