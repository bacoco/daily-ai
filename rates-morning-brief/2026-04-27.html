<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rates & Inflation Morning Brief — 27 Avril 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    /* Scenario Probability Card */
    .scenario-block { margin: 1em 0; padding: 0.8em 1em; border-left: 4px solid #ffd700; border-radius: 0 8px 8px 0; background: rgba(255,215,0,0.05); }
    .scenario-block h3 { margin: 0 0 0.3em 0; font-size: 1.05em; display: flex; justify-content: space-between; align-items: center; }
    .scenario-block .proba { font-size: 1.3em; font-weight: bold; color: #ffd700; }
    .scenario-block p { margin: 0.2em 0; font-size: 0.92em; }
    .scenario-block .votes { font-size: 0.8em; opacity: 0.7; font-style: italic; }
    .consensus { margin-top: 1.2em; padding: 0.6em; border-radius: 8px; background: rgba(0,200,100,0.08); }
    .dissent { margin-top: 0.4em; padding: 0.6em; border-radius: 8px; background: rgba(255,80,80,0.08); }

    html.light .details div[style*="background"], html.light .details p[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Light mode: override inline white colors in trade cards */
    html.light .details p[style], html.light .details b[style], html.light .details span[style], html.light .details div[style] { color: rgba(0,0,0,.85) !important; }
    html.light .details div[style*="border-left:3px solid #f59e0b"] { background: rgba(245,158,11,.08) !important; }
    html.light .details div[style*="border-left:3px solid #10b981"] { background: rgba(16,185,129,.08) !important; }
    html.light .details div[style*="border-left:3px solid #ff4757"] { background: rgba(255,71,87,.06) !important; }
    html.light .details div[style*="color:#f59e0b"] { color: #b45309 !important; }
    html.light .details div[style*="color:#10b981"] { color: #047857 !important; }
    html.light .details div[style*="color:#ff4757"] { color: #dc2626 !important; }
    html.light .details h3 { color: #1a1a2e !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details p[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }
      .dt-reader .dt-r-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; }
      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }

  <script>
  const DATA = [{"t":"home","home":true,"date":"27 Avril 2026","henryWord":"Une semaine décisive pour les banques centrales s'ouvre, avec 7 décisions en 72 heures. Le Conseil a validé 11 trades, dont le steepener UST 2s10s et le tightener BTP-Bund. Le marché reste suspendu à la situation à Hormuz et aux données d'inflation.","articles":[{"badge":"📊 Macro Pulse","title":"Central Bank Super-Week: 7 Decisions in 72 Hours + Q1 GDP + PCE","idx":1},{"badge":"📉 Core Yields","title":"UST 10Y at 4.33% as Hormuz Stalemate Deepens — Bund Holds 3.01% Ahead of ECB Week","idx":2},{"badge":"🏛️ CB Radar","title":"7 Central Banks in 72 Hours: FOMC & ECB Anchor the Week, Warsh Looms","idx":3},{"badge":"💸 Inflation Dynamics","title":"EZ CPI Flash Expected at 3.0% — Oil Shock Pass-Through Enters Phase Two","idx":4},{"badge":"🏗️ Supply & Fiscal","title":"Post-Auction Calm Before ECB Week Storm — Italy, France, and US Supply in Focus","idx":5},{"badge":"📐 Curve & Carry","title":"UST Bear Steepening Dominates — Bund Curve Flat Ahead of ECB Inflection","idx":6},{"badge":"🔄 RV & Spreads","title":"BTP-Bund at ~79bp as ECB Week Tests Periphery — OAT-Bund Stable at ~64bp","idx":7},{"badge":"🌍 Geopol & Risk Overlay","title":"Risk Tag: 🟡 NEUTRAL — Hormuz Enters Week 9, Ceasefire Hopes vs Stalemate Reality","idx":8},{"badge":"⚖️ Desk Vote","title":"Central Bank Super-Week: Top 3 Trades — ECB Divergence, Steepener, BTP RV","idx":9},{"badge":"🗳️ Conseil Verdict","title":"11 Trades Validés / 2 Rejetés — BTP-Bund Tightener Divise le Conseil","idx":10}],"disclaimer":"⚠️ DISCLAIMER — This document is an experimental automated market intelligence product generated by artificial intelligence. It does NOT constitute investment advice, a trading recommendation, or regulated financial analysis under MiFID II or any securities regulation. The 'trade ideas' and 'scenarios' presented are pedagogical hypotheses generated by language models — they do not reflect the opinion of a licensed professional. Data is sourced from public feeds and may be delayed or inaccurate. Any investment decision based on this document is the sole responsibility of the reader. The author is not registered as an Investment Advisor with any regulatory authority. This content is provided for informational and experimental purposes only."},{"t":"alert","badge":"📊 Macro Pulse","title":"Central Bank Super-Week: 7 Decisions in 72 Hours + Q1 GDP + PCE","hook":"The most consequential week of 2026 for rates desks. Seven central banks decide between Monday and Thursday, anchored by the FOMC (Wed) and ECB (Thu), with Q1 GDP advance and Core PCE dropping simultaneously Thursday morning.","authorWord":"Seven CB decisions, Q1 GDP, Core PCE, EZ CPI flash — the data avalanche reshapes every rates trade this week. Monday is the calm before the storm.","author":"Blaise 🧮","details":"<h3>📅 This Week's Data Calendar<\/h3><p><strong>Monday 27 Apr<\/strong>: Quiet data day. BoJ decision overnight (cons. hold 0.75%). Chile rate decision (cons. hold 4.50%). Focus on positioning ahead of the Wednesday-Thursday supernova.<\/p><p><strong>Tuesday 28 Apr<\/strong>: CB Consumer Confidence (cons. 89.4 vs prev 91.8) — sentiment erosion from oil shock continues. Brazil IPCA-15 mid-month (prior 0.44% MoM / 3.90% YoY).<\/p><p><strong>Wednesday 29 Apr<\/strong> — TRIPLE CB DAY:<br>- German CPI flash April (cons. 3.0% YoY vs 2.7% March) — first read on EZ inflation acceleration<br>- BoC decision (cons. hold 2.25%)<br>- FOMC decision (cons. hold 3.50–3.75%, <a href='https://www.cmegroup.com/markets/interest-rates/cme-fedwatch-tool.html' target='_blank'>Polymarket 99.7%<\/a>) — statement language is the event; Powell's possibly last meeting as Chair before Kevin Warsh expected takeover in May<br>- Copom (Brazil, cons. cut from 14.75%)<\/p><p><strong>Thursday 30 Apr<\/strong> — DATA SUPERNOVA:<br>- EZ CPI flash April (cons. 3.0% YoY vs 2.6% March) — oil shock pass-through confirmed<br>- EZ Q1 GDP flash (cons. 0.2% QoQ) — stagnation risk<br>- France, Germany, Italy, Spain Q1 GDP all release simultaneously<br>- BoE decision (cons. hold 3.75%)<br>- ECB decision (cons. hold 2.00%, <a href='https://www.reuters.com/world/europe/key-ecb-policymaker-comments-run-up-april-30-meeting-2026-04-24/' target='_blank'>per Reuters<\/a>: Nagel hawks vs Lagarde patience)<br>- US Q1 GDP advance (cons. 2.2% QoQ vs 0.5% Q4) — major acceleration<br>- Core PCE March (cons. 0.3% MoM vs 0.4% prior) — Fed's preferred gauge<br>- Mexico Q1 GDP<\/p><p><strong>Friday 1 May<\/strong>: ISM Manufacturing (cons. 53.2 vs 52.7). May Day — Europe and LATAM closed. Only US/UK open.<\/p><h3>🎯 Surprise Potential<\/h3><p>The widest consensus ranges are on EZ CPI (2.8–3.3% range possible given oil pass-through uncertainty) and US Q1 GDP (1.5–2.8% — huge swing depending on inventory and net exports). Core PCE at 0.3% MoM would be the first deceleration in months — a miss higher would shatter the \"patient Fed\" narrative.<\/p><p>Per <a href='https://www.riotimesonline.com/key-market-events-for-the-week-of-april-27-may-1-2026/' target='_blank'>Rio Times<\/a>, the FOMC hold is near-certain but the statement's language on inflation vs labor market risks — and whether any members pushed for hike-inclusive \"two-sided\" stance — will set the tone. Michigan sentiment confirmed at 47.6 (lowest since 2008), with 1Y inflation expectations at 4.8%.<\/p><h3>💡 Trade Ideas<\/h3><p><strong>T1 — Short Schatz straddle pre-ECB<\/strong>: If EZ CPI prints 3.0%+ on Thursday, the ECB hold becomes politically charged. Buy Jun Schatz 99.50 straddle — vol is cheap ahead of the decision, breakout risk is asymmetric.<\/p><p><strong>T2 — Long US 2Y receiver pre-FOMC<\/strong>: If Powell's statement acknowledges labor market softening alongside sticky inflation, the belly benefits. Buy 2Y OIS receiver, strike at current level, 1-week tenor.<\/p><p><strong>T3 — Long Brent vs short Bund breakeven<\/strong>: If German CPI prints 3.0%+ Wednesday, BEs widen. Long DBR 10Y BE via linkers vs nominals, targeting 2.30%+ from current ~2.14%.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The consensus is too focused on the ECB hold. If EZ CPI prints 3.2%+ and German GDP comes in negative, the stagflationary signal could force a hawkish surprise. Markets pricing two ECB hikes for 2026 are underestimating the tail — a June hike is not off the table if the data forces Lagarde's hand. The real trade is long Euribor June hike probability, currently at 0.1%.<\/div><\/div>","sig":"Blaise 🧮"},{"t":"alert","badge":"📉 Core Yields","title":"UST 10Y at 4.33% as Hormuz Stalemate Deepens — Bund Holds 3.01% Ahead of ECB Week","hook":"US yields creep higher as Trump cancels Iran envoy talks, keeping the Hormuz risk premium intact. The ECB-Fed divergence widens into the week's dual CB decisions.","authorWord":"UST 10Y at 4.33% ▲+2bp, Bund 10Y steady at 3.01%, BTP 3.80%, Gilt 4.93%. The transatlantic gap is the trade — 132bp and widening on divergent CB paths.","author":"Henry 🦉","details":"<h3>📊 Benchmark Yields Snapshot<\/h3><p><strong>Instrument:<\/strong> UST 2Y<br><strong>Yield:<\/strong> 3.83%<br><strong>Δ Day:<\/strong> ◆ flat<br><strong>Δ Week:<\/strong> ▲+3bp<br><\/p><p><strong>Instrument:<\/strong> UST 5Y<br><strong>Yield:<\/strong> 4.06%<br><strong>Δ Day:<\/strong> ▲+1bp<br><strong>Δ Week:<\/strong> ▲+5bp<br><\/p><p><strong>Instrument:<\/strong> UST 10Y<br><strong>Yield:<\/strong> 4.33%<br><strong>Δ Day:<\/strong> ▲+2bp<br><strong>Δ Week:<\/strong> ▲+7bp<br><\/p><p><strong>Instrument:<\/strong> UST 30Y<br><strong>Yield:<\/strong> 4.69%<br><strong>Δ Day:<\/strong> ▲+2bp<br><strong>Δ Week:<\/strong> ▲+8bp<br><\/p><p><strong>Instrument:<\/strong> Bund 10Y<br><strong>Yield:<\/strong> 3.01%<br><strong>Δ Day:<\/strong> ◆ flat<br><strong>Δ Week:<\/strong> ▲+4bp<br><\/p><p><strong>Instrument:<\/strong> OAT 10Y<br><strong>Yield:<\/strong> 3.65%<br><strong>Δ Day:<\/strong> ▼-2bp<br><strong>Δ Week:<\/strong> ◆ flat<br><\/p><p><strong>Instrument:<\/strong> BTP 10Y<br><strong>Yield:<\/strong> 3.80%<br><strong>Δ Day:<\/strong> ▼-1bp<br><strong>Δ Week:<\/strong> ▼-2bp<br><\/p><p><strong>Instrument:<\/strong> Gilt 10Y<br><strong>Yield:<\/strong> 4.93%<br><strong>Δ Day:<\/strong> ◆ flat<br><strong>Δ Week:<\/strong> ▲+5bp<br><\/p><p><em>Sources: <a href='https://tradingeconomics.com/united-states/government-bond-yield' target='_blank'>TradingEconomics US<\/a>, <a href='https://tradingeconomics.com/germany/government-bond-yield' target='_blank'>TradingEconomics DE<\/a>, <a href='https://tradingeconomics.com/italy/government-bond-yield' target='_blank'>TradingEconomics IT<\/a>, <a href='https://tradingeconomics.com/united-kingdom/government-bond-yield' target='_blank'>TradingEconomics UK<\/a> — data as of close 24 Apr 2026 / live 27 Apr<\/em><\/p><h3>🔥 Drivers<\/h3><p><strong>Primary: Hormuz stalemate<\/strong> — President Trump cancelled plans to send senior envoys to Pakistan for a second round of Iran talks. Tehran reiterated it would not negotiate under blockade conditions. The Strait of Hormuz remains effectively closed, entering its ninth week. Brent crude is on track for a 14% weekly gain, keeping the inflation premium baked into long-end yields.<\/p><p><strong>Secondary: Ifo collapse<\/strong> — Germany's Ifo Business Climate dropped to 84.4 (April), lowest since May 2020, missing the 85.5 consensus. The Bund bid from growth fears is capping the upside in European yields even as inflation expectations rise.<\/p><p><strong>Overnight: Asian session quiet<\/strong> — BoJ decision due Monday overnight (cons. hold 0.75%). JGBs steady. UST futures slightly bid in thin Asia trading.<\/p><h3>📈 Technical Levels<\/h3><p><strong>UST 10Y<\/strong>: Support 4.25% (prior consolidation), resistance 4.40% (March high). Current 4.33% sits in the upper half of the range. A break above 4.40% on hot PCE Thursday opens 4.50%.<\/p><p><strong>Bund 10Y<\/strong>: Holding the 3.00% psychological level. Support at 2.95%, resistance at 3.08% (2011 high zone). The ECB decision Thursday is the catalyst for a breakout either way.<\/p><h3>💡 Trade Ideas<\/h3><p><strong>T1 — Long UST 10Y @ 4.33%, target 4.45%, stop 4.22%<\/strong>: If Core PCE prints 0.4%+ MoM Thursday, the break above 4.40% triggers momentum. Use June T-Note futures (TYM6).<\/p><p><strong>T2 — Short Bund 10Y vs Long UST 10Y (duration-neutral)<\/strong>: The ECB-Fed divergence is the structural trade. ECB holds, Fed stays hawkish → US yields outperform on the upside. DV01-match ~1.3x Bund per UST contract.<\/p><p><strong>T3 — Long Gilt 10Y receiver<\/strong>: If BoE holds Thursday (cons. 3.75%), but UK CPI at 3.3% and rising, the market pricing of 2 hikes may be too aggressive. Fade the hike premium if BoE guidance is dovish.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>The US-EU yield divergence trade is crowded. Every rates desk is long UST / short Bund on the CB divergence thesis. If the ECB surprises hawkish (Nagel camp wins), Bunds sell off and the convergence trade crushes positioning. The asymmetric play is actually the opposite: long Bund / short UST as a mean-reversion bet, with tight stops above 3.08% on Bunds.<\/div><\/div>","sig":"Henry 🦉"},{"t":"analysis","badge":"🏛️ CB Radar","title":"7 Central Banks in 72 Hours: FOMC & ECB Anchor the Week, Warsh Looms","hook":"The FOMC hold is near-certain but statement language could reshape the entire rate path. The ECB faces its most divisive meeting since 2023 — hawks want action, Lagarde wants patience. And Powell may be chairing his last meeting.","authorWord":"FOMC 99.7% hold, ECB likely hold at 2.00%, but markets price 2 full hikes for 2026. The real risk is forward guidance, not the decision. Warsh takeover in May reshapes Fed trajectory.","author":"Sage 🦎","details":"<h3>📊 OIS Pricing Matrix<\/h3><p><strong>CB:<\/strong> Fed (FOMC)<br><strong>Next Meeting:<\/strong> Wed 30 Apr<br><strong>Current Rate:<\/strong> 3.50–3.75%<br><strong>Consensus:<\/strong> Hold<br><strong>Market Pricing:<\/strong> 99.7% hold (<a href='https://www.cmegroup.com/markets/interest-rates/cme-fedwatch-tool.html' target='_blank'>Polymarket<\/a>)<br><\/p><p><strong>CB:<\/strong> ECB<br><strong>Next Meeting:<\/strong> Thu 30 Apr<br><strong>Current Rate:<\/strong> 2.00%<br><strong>Consensus:<\/strong> Hold<br><strong>Market Pricing:<\/strong> 2 hikes priced 2026 (<a href='https://www.globalbankingandfinance.com/fragile-hold-five-questions-ecb/' target='_blank'>Global Banking<\/a>)<br><\/p><p><strong>CB:<\/strong> BoE<br><strong>Next Meeting:<\/strong> Thu 30 Apr<br><strong>Current Rate:<\/strong> 3.75%<br><strong>Consensus:<\/strong> Hold<br><strong>Market Pricing:<\/strong> 2 hikes priced 2026<br><\/p><p><strong>CB:<\/strong> BoJ<br><strong>Next Meeting:<\/strong> Mon 27 Apr<br><strong>Current Rate:<\/strong> 0.75%<br><strong>Consensus:<\/strong> Hold<br><strong>Market Pricing:<\/strong> Hold consensus<br><\/p><p><strong>CB:<\/strong> BoC<br><strong>Next Meeting:<\/strong> Wed 30 Apr<br><strong>Current Rate:<\/strong> 2.25%<br><strong>Consensus:<\/strong> Hold<br><strong>Market Pricing:<\/strong> Hold consensus<br><\/p><h3>🔴 FOMC — The Powell Farewell Tour<\/h3><p>The FOMC hold is a near-certainty, but this may be Jerome Powell's <strong>final meeting as Chair<\/strong> — Kevin Warsh is anticipated to take over in May. Per <a href='https://www.riotimesonline.com/key-market-events-for-the-week-of-april-27-may-1-2026/' target='_blank'>Rio Times<\/a>, the March minutes revealed \"some participants\" advocated for \"two-sided\" language that includes potential hikes, and one member voted for a cut. How those camps shifted after March CPI at 3.3% and NFP at +178K will define rate expectations through year-end. J.P. Morgan sees the Fed on hold for all of 2026, with the next move a hike in mid-2027.<\/p><h3>🟡 ECB — The Hawk-Dove Knife Edge<\/h3><p>Per <a href='https://www.reuters.com/world/europe/key-ecb-policymaker-comments-run-up-april-30-meeting-2026-04-24/' target='_blank'>Reuters (24 Apr)<\/a>, De Guindos urges caution: \"inflation expectations are quite well-anchored. We need to be patient.\" But with EZ CPI expected at 3.0% (vs 2.6% March) and money markets pricing two ECB hikes for 2026, the hold is fragile. Nagel and the hawks want action; Lagarde wants patience. The Iran ceasefire provides temporary cover, but Hormuz remains effectively closed and energy flows haven't resumed.<\/p><p><strong>Balance sheet watch<\/strong>: ECB APP/PEPP runoff continues. No signal of slowing. QT absorption adds ~€20B/month of net supply to the market, pressuring EGB spreads.<\/p><h3>🟠 BoE — Hike Premium Building<\/h3><p>Gilt 10Y at 4.93%, approaching 2008 levels. UK CPI 3.3% (March) and businesses expect 4% CPI over the next year per the BoE Decision Maker Panel. Markets fully price two quarter-point hikes in 2026. Retail sales rose 0.7% MoM (unexpected), reinforcing the hike narrative. But the BoE may hold Thursday and wait for more data.<\/p><h3>💰 Real Rates Context<\/h3><p>US 10Y real yield (nominal - BE) ≈ 4.33% - 2.38% ≈ <strong>1.95%<\/strong>. DE 10Y real yield ≈ 3.01% - 2.14% ≈ <strong>0.87%<\/strong>. The Fed is clearly in restrictive territory; the ECB is barely above neutral. This gap supports the USD rates outperformance thesis.<\/p><h3>💡 Trade Ideas<\/h3><p><strong>T1 — Long Euribor Dec 2026 receiver<\/strong>: If the ECB holds and Lagarde signals patience despite 3.0% CPI, the market's pricing of 2 hikes may be too aggressive. Fade the hike premium in Dec Euribor contracts.<\/p><p><strong>T2 — Long SOFR-Fed Funds spread<\/strong>: Warsh's expected appointment may shift the Fed toward a more hawkish long-term stance. Position for steeper OIS curve via SOFR 2Y vs 10Y steepener.<\/p><p><strong>T3 — Short Sterling 2Y vs Long Euribor 2Y<\/strong>: BoE hike pricing (2 hikes) is more aggressive than ECB (also 2 hikes but from lower base). If both hold, the BoE has more room to disappoint. Short Sterling receivers, long Euribor receivers.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The Warsh transition is underpriced. A new Fed Chair in May means a potential policy reset — Warsh is known for favoring tighter policy and could accelerate QT or shift dot projections. The risk isn't the Wednesday hold; it's the May-June recalibration. Positioning for a hawkish pivot under Warsh via long 5Y UST payers is the asymmetric play.<\/div><\/div>","sig":"Sage 🦎"},{"t":"analysis","badge":"💸 Inflation Dynamics","title":"EZ CPI Flash Expected at 3.0% — Oil Shock Pass-Through Enters Phase Two","hook":"German CPI consensus 3.0% Wednesday, EZ CPI 3.0% Thursday. Core is easing to 2.2% — but headline is screaming higher on energy. The stagflationary signal is unmistakable for the ECB.","authorWord":"US BE 10Y at ~2.38%, DE BE at ~2.14%. The energy pass-through is complete in PPI but still working through consumer prices. Real yields diverge: US ~1.95%, DE ~0.87%.","author":"Sage 🦎","details":"<h3>📊 Breakeven Snapshot<\/h3><p><strong>10Y Breakeven:<\/strong> US 10Y BE<br><strong>Level:<\/strong> ~2.38%<br><strong>Δ Week:<\/strong> ▲+4bp<br><strong>Context:<\/strong> Oil premium building<br><\/p><p><strong>10Y Breakeven:<\/strong> DE 10Y BE<br><strong>Level:<\/strong> ~2.14%<br><strong>Δ Week:<\/strong> ▲+3bp<br><strong>Context:<\/strong> Highest since 2023<br><\/p><p><strong>10Y Breakeven:<\/strong> FR 10Y BE<br><strong>Level:<\/strong> ~2.10%<br><strong>Δ Week:<\/strong> ▲+2bp<br><strong>Context:<\/strong> Tracking DE<br><\/p><p><strong>10Y Breakeven:<\/strong> IT 10Y BE<br><strong>Level:<\/strong> ~2.25%<br><strong>Δ Week:<\/strong> ▲+2bp<br><strong>Context:<\/strong> BTP nominal offset<br><\/p><p><em>Source: Derived from <a href='https://tradingeconomics.com/united-states/government-bond-yield' target='_blank'>TradingEconomics<\/a> nominal yields minus TIPS/linker yields, cross-referenced with <a href='https://www.mortgagedaily.com/mortgage-rate-forecast/week-of-april-27-2026/' target='_blank'>MortgageDaily<\/a><\/em><\/p><h3>🔥 Core vs Headline Decomposition<\/h3><p><strong>US<\/strong>: Headline CPI at 3.3% (March), Core expected easing. Core PCE consensus 0.3% MoM (Thursday) — first deceleration in months. But the annual Core PCE rate at 3.0%+ keeps cuts off the table.<\/p><p><strong>EZ<\/strong>: Flash CPI consensus 3.0% YoY (vs 2.6% March) — headline jumping on energy base effects and oil shock pass-through. But <strong>core CPI easing to 2.2%<\/strong> (from 2.3%) — the underlying disinflation continues beneath the energy noise. This divergence is Lagarde's cover for a hold.<\/p><p><strong>Germany<\/strong>: CPI consensus 3.0% (vs 2.7% March). Ifo at 84.4 — business confidence collapsing while prices rise. The stagflationary signal is unmistakable.<\/p><h3>💰 Real Yields<\/h3><p><strong>US 10Y real yield<\/strong>: ~1.95% (4.33% - 2.38% BE) — firmly restrictive territory. The Fed is doing its job via the long end.<br><strong>DE 10Y real yield<\/strong>: ~0.87% (3.01% - 2.14% BE) — barely above neutral. If ECB holds, real yields compress further as BEs widen on oil shock. This is the structural argument for Bund underperformance.<\/p><h3>🛢️ Commodity Inputs<\/h3><p>Brent crude on track for 14% weekly gain as Hormuz remains effectively closed. The oil → PPI → CPI transmission is now complete at the producer level (PPI +1.2% MoM in March) and working through consumer prices. Unless the Hormuz ceasefire produces real results, the energy premium in breakevens is sticky.<\/p><h3>💡 Trade Ideas<\/h3><p><strong>T1 — Long DBR 10Y BE widener<\/strong>: If German CPI prints 3.0%+ Wednesday, DE BEs should widen from 2.14% toward 2.30%. Execute via long DBR€i vs short DBR nominal, DV01-matched.<\/p><p><strong>T2 — Short US 5Y5Y inflation swap<\/strong>: The front-end energy premium is real, but 5Y5Y forward at ~2.5% may be overpricing a permanent shift. If the Hormuz ceasefire materializes, the belly of the inflation curve compresses fast.<\/p><p><strong>T3 — Long BTP€i vs short OAT€i<\/strong>: Italian inflation-linked bonds offer ~15bp higher real yield with similar EUR inflation exposure. A duration-neutral linker RV trade benefits from convergence if periphery stress eases post-ECB.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>The market is treating this energy shock as transitory — but Hormuz is in week 9 with no resolution. If Brent breaks $110 and holds, the 5Y5Y inflation swap reprices permanently. The disinflation in core is real, but headline inflation at 3%+ for 6+ months will unanchor expectations. Short BE flatteners are the more prudent trade — protect the belly, don't fade it.<\/div><\/div>","sig":"Sage 🦎"},{"t":"alert","badge":"🏗️ Supply & Fiscal","title":"Post-Auction Calm Before ECB Week Storm — Italy, France, and US Supply in Focus","hook":"The week ahead is heavy on sovereign supply despite the CB decision overload. Italy and France test investor appetite ahead of Thursday's ECB, while the US Treasury continues its refunding cycle.","authorWord":"Supply pipeline normal after last week's heavy issuance. Focus shifts to post-ECB demand dynamics — if the ECB holds hawkish, EGB auctions may see concession widening.","author":"Blaise 🧮","details":"<h3>📅 Auction Calendar — This Week<\/h3><p><strong>Monday 27 Apr<\/strong>: No major EGB auctions. Focus on BoJ overnight decision and positioning.<\/p><p><strong>Tuesday 28 Apr<\/strong>: Germany auctions €4B Bund 10Y reopening (DBR 0% 15 Feb 2036). Key test of 3.01% yield level demand ahead of Wednesday's German CPI and Thursday's ECB.<\/p><p><strong>Wednesday 29 Apr<\/strong>: US Treasury 5Y Note auction ($70B estimate). Comes hours before the FOMC decision — dealers may demand extra concession given event risk.<\/p><p><strong>Thursday 30 Apr<\/strong>: France OAT auction (short/medium maturities). Italy BTP short-term auction. Both come after the ECB decision — if the hold is dovish, demand should be strong. If hawkish, concession may be needed.<\/p><p><strong>Friday 1 May<\/strong>: May Day — Europe closed. No EGB issuance. US markets open.<\/p><h3>📊 Recent Auction Results<\/h3><p><strong>Last week's highlight<\/strong>: The 20Y UST auction cleared at 4.883% with decent demand. Bid-to-cover was in line with recent averages. No tail, no aggressive concession — suggesting institutional demand remains steady at these yield levels despite Hormuz uncertainty.<\/p><p><strong>EGB supply<\/strong>: Last week saw heavy issuance from Italy and France. BTP short-term cleared with slightly improved bid-to-cover, suggesting periphery demand is holding despite the 79bp BTP-Bund spread. OAT auctions were uneventful.<\/p><h3>🏗️ Fiscal Backdrop<\/h3><p>Germany's 2026 deficit trajectory is under scrutiny as the Ifo collapses to 84.4 — growth weakness may force fiscal expansion, increasing Bund supply in H2. France's budget remains constrained by EU fiscal rules. Italy's deficit is stable but vulnerable to a widening BTP-Bund spread if ECB hawkishness pressures periphery.<\/p><p><strong>ECB QT absorption<\/strong>: The ECB continues to let PEPP and APP holdings roll off at pace, adding ~€20B/month of net new supply to the market. This is the structural headwind for EGB spreads — more supply + less ECB buying = wider spreads over time.<\/p><h3>💡 Trade Ideas<\/h3><p><strong>T1 — Long Tuesday's Bund 10Y auction concession trade<\/strong>: Buy the new DBR 10Y at auction, expect concession tightening post-auction as dealers cover shorts. If the ECB holds dovish Thursday, the Bund rally compresses the concession. Target 3-5bp tightening in 48h.<\/p><p><strong>T2 — Short WI vs Long cash basis (UST 5Y)<\/strong>: Wednesday's 5Y auction + FOMC creates event risk. The WI should trade cheap to cash into the auction — buy the basis (long WI, short cash) to capture the concession snapback.<\/p><p><strong>T3 — Long BTP vs short OAT post-ECB<\/strong>: If the ECB holds and Lagarde is dovish, periphery should outperform. The BTP-OAT spread at ~15bp is tight historically — but in a risk-on post-ECB rally, Italian duration offers more convexity.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The supply argument for wider EGB spreads is sound, but the auction timing is terrible. Selling Italy and France on the same day as the ECB decision — with Q1 GDP, CPI, and BoE also hitting — means dealers are operating with zero risk appetite. Expect aggressive concessions on Thursday's EGB auctions regardless of the ECB outcome. The trade is to wait for the post-auction cheapening and buy the snapback on Friday/Monday.<\/div><\/div>","sig":"Blaise 🧮"},{"t":"tech","badge":"📐 Curve & Carry","title":"UST Bear Steepening Dominates — Bund Curve Flat Ahead of ECB Inflection","hook":"UST 2s10s at ~50bp and steepening on term premium. Bund 2s10s flat at ~44bp, awaiting Thursday's ECB-CPI-GDP triple catalyst. The cross-currency curve divergence is the carry trade of the quarter.","authorWord":"UST 2s10s ~50bp bear steepening, Bund 2s10s ~44bp flat. Carry is positive at the long end for both — but the steepening momentum favors UST duration.","author":"Nova 🌟","details":"<h3>📊 Curve Snapshot<\/h3><p><strong>Curve:<\/strong> UST 2s10s<br><strong>Level:<\/strong> ~50bp<br><strong>Δ Day:<\/strong> ▲+2bp<br><strong>Δ Week:<\/strong> ▲+4bp<br><strong>Regime:<\/strong> Bear steepening<br><\/p><p><strong>Curve:<\/strong> UST 5s30s<br><strong>Level:<\/strong> ~63bp<br><strong>Δ Day:<\/strong> ▲+1bp<br><strong>Δ Week:<\/strong> ▲+3bp<br><strong>Regime:<\/strong> Bear steepening<br><\/p><p><strong>Curve:<\/strong> Bund 2s10s<br><strong>Level:<\/strong> ~44bp<br><strong>Δ Day:<\/strong> ◆ flat<br><strong>Δ Week:<\/strong> ▲+1bp<br><strong>Regime:<\/strong> Neutral<br><\/p><p><strong>Curve:<\/strong> Bund 5s30s<br><strong>Level:<\/strong> ~55bp<br><strong>Δ Day:<\/strong> ◆ flat<br><strong>Δ Week:<\/strong> ◆ flat<br><strong>Regime:<\/strong> Neutral<br><\/p><p><strong>Curve:<\/strong> Gilt 2s10s<br><strong>Level:<\/strong> ~75bp<br><strong>Δ Day:<\/strong> ▲+3bp<br><strong>Δ Week:<\/strong> ▲+5bp<br><strong>Regime:<\/strong> Bear steepening<br><\/p><h3>📈 Curve Regime Analysis<\/h3><p><strong>UST<\/strong>: Bear steepening dominates — the long end is driven higher by term premium (Hormuz inflation risk + Warsh appointment uncertainty + fiscal supply). The front end is anchored by the Fed hold consensus. This regime persists as long as the oil shock continues. Z-score of 2s10s vs 1Y history: ~0.7 (not extreme, room to steepen further).<\/p><p><strong>Bund<\/strong>: The curve is frozen ahead of Thursday's ECB-GDP-CPI triple event. A hawkish ECB surprise would flatten the curve (front end reprices hikes). A dovish hold would steepen (front end anchored, long end sells on inflation). Either way, Thursday breaks the paralysis.<\/p><p><strong>Gilt<\/strong>: Bear steepening the most aggressively — UK specific factors (CPI 3.3%, hike pricing, retail sales beat) are pushing the long end higher. BoE hold Thursday could flatten temporarily if hike expectations are trimmed.<\/p><h3>🦋 Butterfly<\/h3><p>UST 2s5s10s butterfly: Belly slightly cheap vs wings. If the 5Y auction Wednesday sees strong demand (flight to belly quality pre-FOMC), the butterfly flattens.<\/p><p>Bund 2s5s10s butterfly: Neutral, awaiting ECB catalyst.<\/p><h3>💰 Carry & Roll-Down<\/h3><p><strong>UST 10Y<\/strong>: 3-month carry ~+12bp annualized, roll-down ~+8bp — positive carry at the sweet spot of the curve.<br><strong>Bund 10Y<\/strong>: 3-month carry ~+6bp annualized, roll-down ~+4bp — positive but lower than UST due to flatter curve.<br><strong>Optimal carry positioning<\/strong>: UST 7-10Y sector offers the best carry-per-DV01 in the G7 universe.<\/p><h3>💡 Trade Ideas<\/h3><p><strong>T1 — Long UST 2s10s steepener<\/strong>: Enter at 50bp, target 60bp, stop 42bp. Bear steepening has momentum from term premium and Hormuz inflation risk. Execute via Dec TU vs TY futures spread.<\/p><p><strong>T2 — Long Bund 2s10s steepener post-ECB<\/strong>: If the ECB holds dovish Thursday, the front end stays anchored while long-end BEs widen on oil shock. Enter at 44bp, target 55bp. Use Jun Schatz vs Bund futures.<\/p><p><strong>T3 — Short Gilt 2s10s flattener<\/strong>: BoE hold + dovish guidance Thursday = front-end rally, long-end stays sticky on CPI. Fade the bear steepening. Enter at 75bp, target 65bp, stop 82bp.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>The UST steepening trade is consensus. Everyone is long 2s10s steepener on term premium. But if PCE prints soft at 0.2% MoM Thursday, the entire bear steepening thesis unwinds — the long end rallies hard and the curve flattens. The asymmetric trade is actually a UST butterfly: long 2Y, short 5Y, long 10Y — this profits from either a bull flatten (soft PCE) or continued bear steepen (hot PCE) as long as the belly underperforms. Cost is lower, convexity is better.<\/div><\/div>","sig":"Nova 🌟"},{"t":"analysis","badge":"🔄 RV & Spreads","title":"BTP-Bund at ~79bp as ECB Week Tests Periphery — OAT-Bund Stable at ~64bp","hook":"Periphery spreads enter the ECB week in a holding pattern. BTP-Bund at 79bp is the key level — a hawkish ECB breaks it wider, a dovish hold compresses it. The risk-reward favors tighteners if Lagarde stays patient.","authorWord":"BTP-Bund 79bp (close 24 Apr) WIDENED +1bp vs prev — periphery stress from Hormuz fear. OAT-Bund 64bp TIGHTENED -2bp. Spain-Bund ~68bp. The ECB decision is the catalyst for direction.","author":"Henry 🦉","details":"<h3>📊 Spread Table<\/h3><p><strong>Spread:<\/strong> BTP-Bund 10Y<br><strong>Level (24 Apr):<\/strong> 79bp<br><strong>Δ Day:<\/strong> ▲+1bp<br><strong>Δ Week:<\/strong> ▼-1bp<br><strong>Direction:<\/strong> WIDENED on day, TIGHTENED on week<br><\/p><p><strong>Spread:<\/strong> OAT-Bund 10Y<br><strong>Level (24 Apr):<\/strong> 64bp<br><strong>Δ Day:<\/strong> ▼-2bp<br><strong>Δ Week:<\/strong> ▼-3bp<br><strong>Direction:<\/strong> TIGHTENED<br><\/p><p><strong>Spread:<\/strong> Spain-Bund 10Y<br><strong>Level (24 Apr):<\/strong> ~68bp<br><strong>Δ Day:<\/strong> ▼-1bp<br><strong>Δ Week:<\/strong> ▼-2bp<br><strong>Direction:<\/strong> TIGHTENED<br><\/p><p><strong>Spread:<\/strong> EGB vs UST 10Y<br><strong>Level (24 Apr):<\/strong> ~-132bp<br><strong>Δ Day:<\/strong> ▲+2bp<br><strong>Δ Week:<\/strong> ▲+7bp<br><strong>Direction:<\/strong> WIDENING — US outperformance<br><\/p><p><em>Sources: Derived from <a href='https://tradingeconomics.com/italy/government-bond-yield' target='_blank'>TradingEconomics IT<\/a>, <a href='https://tradingeconomics.com/france/government-bond-yield' target='_blank'>TradingEconomics FR<\/a>, <a href='https://tradingeconomics.com/germany/government-bond-yield' target='_blank'>TradingEconomics DE<\/a><\/em><\/p><h3>🔍 Spread Drivers<\/h3><p><strong>BTP-Bund<\/strong>: At 79bp, the spread is in the middle of its 3-month range (70-90bp). The ECB PEPP reinvestment flexibility provides a backstop — the ECB has signaled it can redirect PEPP redemptions toward periphery in stress. This cap limits the upside. But if the ECB signals hawkishness Thursday, the PEPP backstop is tested.<\/p><p><strong>OAT-Bund<\/strong>: France remains the relative value gem at 64bp. French fiscal discipline and EU recovery fund inflows provide support. The tightener trade (long OAT / short Bund) has worked for 3 consecutive weeks.<\/p><p><strong>EGB vs UST<\/strong>: The 132bp gap reflects the ECB-Fed divergence. If the Fed stays hawkish while the ECB holds, this gap continues to widen — US yields outperform on the upside.<\/p><h3>📊 Flow Intelligence<\/h3><p>No major CFTC positioning data available for the latest week. Anecdotal flows suggest real money is nibbling at BTPs at these levels, attracted by the carry premium vs Bunds. Dealer inventories are light ahead of the ECB decision — nobody wants to be caught wrong-footed.<\/p><h3>💡 Trade Ideas<\/h3><p><strong>T1 — Long BTP / Short Bund tightener (DV01-neutral)<\/strong>: Enter at 79bp, target 70bp, stop 85bp. If the ECB holds dovish Thursday, periphery should compress. DV01 ratio ~1.15:1 (more BTP face value per Bund). Carry is positive (~3bp/month).<\/p><p><strong>T2 — Long OAT / Short Bund tightener<\/strong>: The France-Germany convergence continues. Enter at 64bp, target 55bp. Supported by EU fiscal flows and France's 2026 budget discipline.<\/p><p><strong>T3 — Long EGB vs Short UST (duration-neutral)<\/strong>: Fade the ECB-Fed divergence at extremes. If both central banks hold, the 132bp gap should compress as US yields find a ceiling. Use Bund and UST futures, DV01-matched.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>The BTP tightener is a consensus carry trade that works until it doesn't. If EZ CPI prints 3.2%+ and German GDP is negative Thursday, the stagflationary signal triggers a periphery blowout. BTP-Bund at 79bp can gap to 90bp in hours. The ECB PEPP backstop only works if the ECB is in a supportive mood — and a hawkish ECB doesn't buy periphery. The safer trade is OAT-Bund tightener (France has fiscal discipline as a buffer) while keeping BTP exposure minimal.<\/div><\/div>","sig":"Henry 🦉"},{"t":"alert","badge":"🌍 Geopol & Risk Overlay","title":"Risk Tag: 🟡 NEUTRAL — Hormuz Enters Week 9, Ceasefire Hopes vs Stalemate Reality","hook":"Trump cancels Iran envoy talks, Tehran refuses negotiations under blockade. Oil rallying but not spiking. Markets are pricing a stalemate, not an escalation — but the risk of a sudden breakout remains asymmetric.","authorWord":"Risk tag: NEUTRAL. Hormuz stalemate is priced in. The asymmetric risk is an escalation breakout (oil → $120+) or a sudden ceasefire breakthrough. Neither is the base case this week.","author":"Henry 🦉","details":"<h3>🏷️ Risk Tag: 🟡 NEUTRAL<\/h3><p><strong>Why NEUTRAL and not RISK-OFF<\/strong>: Oil is rallying (+14% week) but in an orderly fashion, not a panic spike. Brent near $105 is elevated but below the $120 peak that triggered RISK-OFF in prior weeks. Safe-haven flows are moderate — Bunds and USTs are bid but not aggressively. BTP-Bund at 79bp is stable, not widening in panic mode.<\/p><h3>🔥 Active Geopolitical Arcs<\/h3><p><strong>1. Hormuz / Iran (PRIMARY)<\/strong>: Day 56+ of the Hormuz closure. Trump cancelled envoy talks in Pakistan. Tehran's FM Araghchi reportedly heading to Islamabad Friday — but no breakthrough expected. Oil remains bid on supply disruption, not panic buying. The Strait remains effectively closed with no sign of reopening.<\/p><p><strong>2. US-Iran Negotiations<\/strong>: Stalled. Trump's cancellation of the Islamabad envoy trip signals frustration. Tehran's precondition (end blockade) is unacceptable to Washington. Stalemate is the base case, but the market has adjusted to it.<\/p><p><strong>3. Russia-Ukraine<\/strong>: Background noise for rates markets. No direct transmission to government bond yields this week.<\/p><h3>📊 Flight-to-Quality Monitor<\/h3><p><strong>Bund bid<\/strong>: Moderate. The Ifo collapse (84.4) provides a growth-fear bid that complements the geopolitical premium. But the Bund is also digesting the ECB rate hike pricing — the two forces offset.<br><strong>UST bid<\/strong>: Moderate. The 4.33% level is attracting real money. If Hormuz escalates, UST is the primary safe haven.<br><strong>Periphery risk<\/strong>: BTP spreads are stable at 79bp. No imminent blowout risk unless the ECB surprises hawkish.<\/p><h3>🛢️ Energy-Inflation Transmission<\/h3><p>Brent +14% weekly is now fully in the CPI pipeline. The pass-through is showing up in EZ CPI (cons 3.0% April vs 2.6% March) and German CPI (cons 3.0% vs 2.7%). This is the mechanism that connects geopolitics to rates: oil → CPI → CB policy → yields.<\/p><h3>💡 Trade Ideas<\/h3><p><strong>T1 — Long UST 10Y straddle pre-FOMC<\/strong>: If Hormuz escalates or de-escalates this week, the UST 10Y moves 10-15bp either way. Buy 4.33% straddle (1-week, covering FOMC + PCE). Vol is relatively cheap ahead of the event cluster.<\/p><p><strong>T2 — Long Bund / Short BTP on escalation hedge<\/strong>: If Hormuz talks collapse entirely and oil spikes, BTP-Bund widens to 90bp+. Pre-position a small DV01-neutral spread widener as a portfolio hedge.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>NEUTRAL is complacent. Hormuz is in week 9 with no resolution and oil at $105 — this is a structural supply disruption, not a temporary scare. The market is pricing a ceasefire that hasn't happened. The risk tag should be 🟡 leaning RISK-OFF. The ceasefire hope is keeping spreads tight, but if the stalemate drags into May, the inflation premium becomes permanent and CB policy responds aggressively. The correct trade is to own volatility, not fade it.<\/div><\/div>","sig":"Henry 🦉"},{"t":"strategy","badge":"⚖️ Desk Vote","title":"Central Bank Super-Week: Top 3 Trades — ECB Divergence, Steepener, BTP RV","hook":"Seven central banks in 72 hours, Q1 GDP, Core PCE, EZ CPI flash — the trade density is extreme. The desk's top conviction: UST steepener, BTP-Bund tightener, and inflation breakeven widener.","authorWord":"Top conviction: UST 2s10s steepener (term premium), BTP-Bund tightener (ECB dovish hold), DBR BE widener (oil shock). Council validation pending — 27 trades submitted from 8 cards.","author":"La Rédaction 🦊","details":"<h3>🏆 TOP 3 TRADE IDEAS<\/h3><h3>Trade #1 — UST 2s10s Steepener [CONVICTION: 4/5]<\/h3><p><strong>Instrument<\/strong>: Dec TU vs TY futures spread<br><strong>Direction<\/strong>: Long steepener (short 2Y, long 10Y)<br><strong>Entry<\/strong>: 50bp<br><strong>Stop<\/strong>: 42bp (flatline)<br><strong>Target<\/strong>: 60bp<br><strong>Duration<\/strong>: 2-4 weeks<br><strong>R:R<\/strong>: 1:1.25<br><strong>Rationale<\/strong>: Bear steepening driven by term premium (Hormuz + Warsh + fiscal supply). Fed hold keeps front end anchored. PCE Thursday is the catalyst — even a soft print doesn't kill the steepener as long as the oil shock persists.<\/p><h3>Trade #2 — BTP-Bund Tightener [CONVICTION: 3/5]<\/h3><p><strong>Instrument<\/strong>: BTP 10Y vs Bund 10Y, DV01-neutral (ratio ~1.15:1)<br><strong>Direction<\/strong>: Tightener (long BTP, short Bund)<br><strong>Entry<\/strong>: 79bp<br><strong>Stop<\/strong>: 85bp<br><strong>Target<\/strong>: 70bp<br><strong>Duration<\/strong>: 1-2 weeks<br><strong>R:R<\/strong>: 1:1.5<br><strong>Rationale<\/strong>: ECB hold + dovish Lagarde = periphery compression. PEPP backstop caps downside. Carry is positive (~3bp/month). Key risk: EZ CPI surprise at 3.2%+ triggers hawkish ECB signal.<\/p><h3>Trade #3 — DBR 10Y Breakeven Widener [CONVICTION: 3/5]<\/h3><p><strong>Instrument<\/strong>: Long DBR€i vs short DBR nominal, DV01-matched<br><strong>Direction<\/strong>: BE widener (linkers outperform nominals)<br><strong>Entry<\/strong>: 2.14%<br><strong>Stop<\/strong>: 2.05% (ceasefire breakthrough)<br><strong>Target<\/strong>: 2.30%<br><strong>Duration<\/strong>: 2-3 weeks<br><strong>R:R<\/strong>: 1:1.9<br><strong>Rationale<\/strong>: German CPI cons 3.0% Wednesday confirms oil pass-through. If EZ CPI also jumps Thursday, BEs have room to widen. The ceasefire risk is the stop — if Hormuz opens, BEs compress fast.<\/p><h3>🐂 Bull Scenario (Yields Higher / Spreads Wider)<\/h3><p><strong>Trigger<\/strong>: EZ CPI 3.2%+ AND Core PCE 0.4%+ MoM. Both central banks signal hawkish tilt. Oil breaks $110.<br><strong>Trade<\/strong>: Long UST 10Y payer, short BTP (spread widens to 90bp+), long BE steepener.<\/p><h3>🐻 Bear Scenario (Yields Lower / Spreads Tighter)<\/h3><p><strong>Trigger<\/stron
