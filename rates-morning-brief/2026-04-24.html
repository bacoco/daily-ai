<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rates & Inflation Morning Brief — 24 Avril 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    /* Scenario Probability Card */
    .scenario-block { margin: 1em 0; padding: 0.8em 1em; border-left: 4px solid #ffd700; border-radius: 0 8px 8px 0; background: rgba(255,215,0,0.05); }
    .scenario-block h3 { margin: 0 0 0.3em 0; font-size: 1.05em; display: flex; justify-content: space-between; align-items: center; }
    .scenario-block .proba { font-size: 1.3em; font-weight: bold; color: #ffd700; }
    .scenario-block p { margin: 0.2em 0; font-size: 0.92em; }
    .scenario-block .votes { font-size: 0.8em; opacity: 0.7; font-style: italic; }
    .consensus { margin-top: 1.2em; padding: 0.6em; border-radius: 8px; background: rgba(0,200,100,0.08); }
    .dissent { margin-top: 0.4em; padding: 0.6em; border-radius: 8px; background: rgba(255,80,80,0.08); }

    html.light .details div[style*="background"], html.light .details p[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Light mode: override inline white colors in trade cards */
    html.light .details p[style], html.light .details b[style], html.light .details span[style], html.light .details div[style] { color: rgba(0,0,0,.85) !important; }
    html.light .details div[style*="border-left:3px solid #f59e0b"] { background: rgba(245,158,11,.08) !important; }
    html.light .details div[style*="border-left:3px solid #10b981"] { background: rgba(16,185,129,.08) !important; }
    html.light .details div[style*="border-left:3px solid #ff4757"] { background: rgba(255,71,87,.06) !important; }
    html.light .details div[style*="color:#f59e0b"] { color: #b45309 !important; }
    html.light .details div[style*="color:#10b981"] { color: #047857 !important; }
    html.light .details div[style*="color:#ff4757"] { color: #dc2626 !important; }
    html.light .details h3 { color: #1a1a2e !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details p[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }
      .dt-reader .dt-r-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; }
      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }

  <script>
  const DATA = [{"t":"home","home":true,"date":"24 Avril 2026","henryWord":"Hormuz Day 55. Ghalibaf resigns, IRGC storms cargo ships. Ceasefire narrative is dead. Oil at 105 dollars fuels breakevens and term premium. ECB meets in 6 days at 99 percent hold priced but IMF calls for 50bp hikes. Bear steepening is the regime.","articles":[{"badge":"📊 Macro Pulse","title":"Consumer Sentiment Final & Jobless Claims in Focus — Iran Oil Shock Dominates","idx":1},{"badge":"📉 Core Yields","title":"Hormuz Seizures Push Yields Higher — UST 10Y at 4.325%, Bund Tests 3.01%","idx":2},{"badge":"🏛️ CB Radar","title":"ECB on Hold April 30 — But the IMF Just Signaled +50bp by Year-End","idx":3},{"badge":"💸 Inflation Dynamics","title":"$105 Brent Fires the Inflation Afterburner — US Breakevens at 2.42%, DE at 2.14%","idx":4},{"badge":"🏗️ Supply & Fiscal","title":"Post-Auction Calm Before the Storm — Italy, France, and US All in Focus Next Week","idx":5},{"badge":"📐 Curve & Carry","title":"Bear Steepening Dominates — UST 2s10s at 49bp, Bund Curve at 44bp","idx":6},{"badge":"🔄 RV & Spreads","title":"BTP-Bund at 79.7bp — Periphery Tests Support as Hormuz Fear Returns","idx":7},{"badge":"🌍 Geopol & Risk Overlay","title":"🔴 RISK-OFF — Hormuz Seizures Shatter Ceasefire Calm, Oil +3%, Safe Havens Bid","idx":8},{"badge":"⚖️ Desk Vote","title":"Top 3 Trades — Bear Steepener, BTP Tightener, Breakeven Widener","idx":9}],"disclaimer":"⚠️ DISCLAIMER — This document is an experimental automated market intelligence product generated by artificial intelligence. It does NOT constitute investment advice, a trading recommendation, or regulated financial analysis under MiFID II or any securities regulation. The 'trade ideas' and 'scenarios' presented are pedagogical hypotheses generated by language models — they do not reflect the opinion of a licensed professional. Data is sourced from public feeds and may be delayed or inaccurate. Any investment decision based on this document is the sole responsibility of the reader. The author is not registered as an Investment Advisor with any regulatory authority. This content is provided for informational and experimental purposes only."},{"t":"alert","badge":"📊 Macro Pulse","title":"Consumer Sentiment Final & Jobless Claims in Focus — Iran Oil Shock Dominates","hook":"U Michigan's final April sentiment reading (prelim all-time low at 50.8) headlines a data-light Friday, while $105 Brent from Hormuz seizures overshadows everything. Claims at 214K signal a gradually softening labour market.","authorWord":"Friday is sentiment day: final U Michigan could revise lower on energy shock fears. But Hormuz is the real macro story — $105 Brent reprices the inflation outlook for every central bank on the planet.","author":"Blaise 🧮","details":"<h3>📅 Today's Data Calendar — Friday 24 April 2026<\/h3><p><strong>🇺🇸 University of Michigan Consumer Sentiment (Final April)<\/strong> — 10:00 ET (14:00 UTC). Preliminary reading was <strong>50.8<\/strong> (<a href=\"https://www.sca.isr.umich.edu/\" target=\"_blank\">U Michigan<\/a>), the <strong>lowest on record<\/strong>, down from 57.0 in March and below consensus of 54.6. The final print could revise lower still if energy price fears from the Hormuz escalation were captured in the survey period. Watch the 1-year inflation expectations sub-index — any spike here feeds directly into Fed pricing.<\/p><p><strong>🇺🇸 No other major US releases today.<\/strong> Durable goods orders (March) lands April 29 with consensus at -1.4% MoM per <a href=\"https://www.marketwatch.com/economy-politics/calendar\" target=\"_blank\">MarketWatch<\/a>.<\/p><p><strong>🇪🇺🇬🇧🇯🇵 No major EZ, UK, or Japan releases today.<\/strong> Next EZ flash estimate HICP is scheduled for early May. UK GDP Q1 preliminary lands May 15.<\/p><h3>📊 Already Released This Week<\/h3><p><strong>Initial Jobless Claims (wk Apr 18): 214K<\/strong> vs consensus 210K, previous 208K (<a href=\"https://tradingeconomics.com/united-states/jobless-claims\" target=\"_blank\">TradingEconomics<\/a>). ▲+6K — a modest uptick but the 4-week moving average remains sub-215K. Not a labor market break, but the trajectory is no longer improving.<\/p><p><strong>Flash PMIs (April, released Wed):<\/strong> EZ Composite 47.2 (contraction), US Manufacturing PMI surged to near 4-year highs. This EZ-US divergence is the structural story of the quarter — already covered in depth yesterday.<\/p><h3>⚠️ Surprise Potential<\/h3><p>The Citi Economic Surprise Index for the US has been on its longest upside run since the financial crisis per <a href=\"https://finance.yahoo.com/news/citis-surprise-index-shows-longest-093037703.html\" target=\"_blank\">Yahoo Finance<\/a>, but the Iran shock has introduced a new variable: <strong>stagflationary risk<\/strong>. If U Michigan inflation expectations spike above 5%, the Fed's \"wait and see\" posture becomes uncomfortable.<\/p><h3>💡 Trade Ideas<\/h3><p><strong>1. Short Schatz Dec-26 futures pre-U Michigan<\/strong> — If inflation expectations spike, front-end reprices hawkish. Entry at current levels, stop -10bp, target +15bp yield move.<br><strong>2. Long 10Y TIPS vs short 10Y UST<\/strong> — Breakevens at 2.42% (FRED, 23 Apr) look cheap if $105 Brent persists. Buy the breakeven widener via TIPS.<br><strong>3. EUR/USD downside via 1-week put spread<\/strong> — If sentiment data confirms US exceptionalism + EZ weakness, spot tests 1.12 support.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>The market is over-indexing to the Iran shock for US macro. Consumer sentiment at 50.8 is a sentiment survey, not a spending proxy. US consumer balance sheets remain solid, and the claims data — while ticking up — is far from recessionary. The real risk is that $105 Brent feeds through to core inflation via transportation and services, creating a delayed second-round effect that the Fed cannot ignore at the June meeting.<\/div><\/div>","sig":"Blaise 🧮","factChecked":true},{"t":"alert","badge":"📉 Core Yields","title":"Hormuz Seizures Push Yields Higher — UST 10Y at 4.325%, Bund Tests 3.01%","hook":"Iran's seizure of two container ships in the Strait of Hormuz sent oil surging 3% and yields broadly higher across the curve. The UST-Bund divergence is now the defining trade of Q2: 131bp and widening.","authorWord":"Oil at $105 is the new yield driver. UST 10Y at 4.325% with term premium expanding on geopolitical risk. The 2s10s at 49bp says bear steepening. Bund 10Y held below 3.05% — the ECB's April 30 meeting is the next test.","author":"Henry 🦉","details":"<h3>📊 Benchmark Yields — Close 23 April 2026<\/h3><p><strong>Instrument:<\/strong> UST 2Y<br><strong>Yield:<\/strong> 3.832%<br><strong>Δ Day:<\/strong> ▲+3bp<br><strong>Δ Week:<\/strong> ▲+8bp<br><\/p><p><strong>Instrument:<\/strong> UST 10Y<br><strong>Yield:<\/strong> 4.325%<br><strong>Δ Day:<\/strong> ▲+3bp<br><strong>Δ Week:<\/strong> ▲+6bp<br><\/p><p><strong>Instrument:<\/strong> UST 30Y<br><strong>Yield:<\/strong> 4.919%<br><strong>Δ Day:<\/strong> ▲+1bp<br><strong>Δ Week:<\/strong> ▲+3bp<br><\/p><p><strong>Instrument:<\/strong> Bund 2Y<br><strong>Yield:<\/strong> 2.570%<br><strong>Δ Day:<\/strong> ▲+2bp<br><strong>Δ Week:<\/strong> ▲+5bp<br><\/p><p><strong>Instrument:<\/strong> Bund 10Y<br><strong>Yield:<\/strong> 3.011%<br><strong>Δ Day:<\/strong> ▲+1bp<br><strong>Δ Week:<\/strong> ▲+2bp<br><\/p><p><strong>Instrument:<\/strong> OAT 10Y<br><strong>Yield:<\/strong> 3.655%<br><strong>Δ Day:<\/strong> ▲+1bp<br><strong>Δ Week:<\/strong> ◆flat<br><\/p><p><strong>Instrument:<\/strong> BTP 10Y<br><strong>Yield:<\/strong> 3.81%<br><strong>Δ Day:<\/strong> ▲+1bp<br><strong>Δ Week:<\/strong> ▼-3bp<br><\/p><p><strong>Instrument:<\/strong> Spain 10Y<br><strong>Yield:<\/strong> 3.49%<br><strong>Δ Day:<\/strong> ▲+2bp<br><strong>Δ Week:<\/strong> ◆flat<br><\/p><p><strong>Instrument:<\/strong> Gilt 10Y<br><strong>Yield:<\/strong> 4.92%<br><strong>Δ Day:<\/strong> ▲+2bp<br><strong>Δ Week:<\/strong> ▲+4bp<br><\/p><p>Sources: <a href=\"https://www.cnbc.com/2026/04/23/treasury-yields-tick-higher-as-us-iran-standoff-persists.html\" target=\"_blank\">CNBC 23 Apr<\/a>, <a href=\"https://www.wsj.com/market-data/quotes/bond/BX/TMBMKDE-10Y/historical-prices\" target=\"_blank\">WSJ Bund<\/a>, <a href=\"https://tradingeconomics.com/italy/government-bond-yield\" target=\"_blank\">TE BTP<\/a>, <a href=\"https://tradingeconomics.com/united-kingdom/government-bond-yield\" target=\"_blank\">TE Gilt<\/a>, <a href=\"https://tradingeconomics.com/spain/government-bond-yield\" target=\"_blank\">TE Spain<\/a><\/p><h3>🔥 Drivers<\/h3><p><strong>PRIMARY: Iran-Hormuz escalation.<\/strong> Iran's navy seized two container ships in the Strait of Hormuz on Thursday, while US forces seized a sanctioned tanker carrying Iranian oil in the Indian Ocean (<a href=\"https://www.cnbc.com/2026/04/23/treasury-yields-tick-higher-as-us-iran-standoff-persists.html\" target=\"_blank\">CNBC<\/a>). <strong>Brent closed at $105.07 (+3.1%), WTI at $95.85 (+3.11%)<\/strong> — the highest since the conflict began. This is a pure inflation-fear sell-off in bonds. Term premium is expanding as markets price in a prolonged energy shock.<\/p><p><strong>SECONDARY: ECB-Fed divergence.<\/strong> The ECB meets April 30 with Polymarket pricing 99% hold (<a href=\"https://polymarket.com/event/ecb-interest-rates-april-2026\" target=\"_blank\">Polymarket<\/a>), while the IMF expects +50bp of ECB hikes in 2026 (<a href=\"https://www.reuters.com/business/imf-expects-ecb-raise-rates-by-half-percentage-point-2026-2026-04-17/\" target=\"_blank\">Reuters 17 Apr<\/a>). Meanwhile the Fed is 94.8% priced for hold in April (<a href=\"https://www.mexc.com/news/982205\" target=\"_blank\">CME FedWatch<\/a>). The US-EZ macro split continues to widen the UST-Bund spread.<\/p><h3>🌏 Overnight / Asia<\/h3><p>Asian equities fell ~0.6% with S&P 500 futures slipping 0.5% per <a href=\"https://www.tickmill.com/blog/daily-market-outlook-april-23-2026\" target=\"_blank\">Tickmill<\/a>. Safe-haven flows support JGBs and UST futures. The Nikkei declined as energy import costs weigh on Japan's trade balance. No major Asia data this morning.<\/p><h3>📈 Technical Levels<\/h3><p><strong>UST 10Y:<\/strong> Key resistance at 4.35%. A break above targets 4.40%. Support at 4.28%, then 4.20%. RSI approaching overbought.<br><strong>Bund 10Y:<\/strong> Testing 3.01-3.05% resistance. Above 3.05% opens 3.10%. Support at 2.98% (10-day MA). The ECB Apr 30 meeting is the next catalyst.<\/p><h3>💡 Trade Ideas<\/h3><p><strong>1. Long Bund 10Y (cautious) with stop above 3.05%<\/strong> — ECB hold + EZ recession risk supports Bund outperformance vs UST. Entry at 3.01%, stop 3.07%, target 2.95%.<br><strong>2. UST 2s10s bear steepener<\/strong> — 49bp spread likely widens if oil stays above $100. Short 2Y / Long 10Y futures.<br><strong>3. Cross-currency carry: Long UST 10Y / Short Bund 10Y (FX-hedged)<\/strong> — 131bp spread is wide. Harvest the carry while hedging EUR/USD via 3-month forward.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>The Bund long is premature. The IMF is calling for +50bp ECB hikes, and if the ECB surprises hawkish on April 30, Bund 10Y blows through 3.05% and tests 3.15%. The safe-haven bid from Hormuz is tactical, not structural. Structural Bund support requires EZ growth to recover — and the PMIs say it's not happening. I'd rather be flat Bunds into the ECB meeting and express the view via Schatz (2Y) which has more room to sell off on hawkish repricing.<\/div><\/div>","sig":"Henry 🦉","factChecked":true},{"t":"analysis","badge":"🏛️ CB Radar","title":"ECB on Hold April 30 — But the IMF Just Signaled +50bp by Year-End","hook":"Polymarket prices 99% no change for the April 30 ECB meeting, but the IMF's call for 50bp of hikes this year has redefined the forward curve. The Fed meets next week at 94.8% hold. The divergence trade is alive and well.","authorWord":"ECB hold is consensus for April 30. But forward pricing is shifting — banks now eye 2.75% deposit rate by year-end per CNBC. That's three hikes from here. Fed stays on hold while EZ stagflation forces Lagarde's hand.","author":"Sage 🦎","details":"<h3>📊 OIS Pricing Matrix — 24 April 2026<\/h3><p><strong>Central Bank:<\/strong> Fed<br><strong>Current Rate:<\/strong> 4.25-4.50%<br><strong>Next Meeting:<\/strong> Apr 28-29<br><strong>Pricing:<\/strong> 94.8% hold<br><strong>Δ vs Last Week:<\/strong> ◆ unchanged<br><\/p><p><strong>Central Bank:<\/strong> ECB<br><strong>Current Rate:<\/strong> 2.00%<br><strong>Next Meeting:<\/strong> Apr 30<br><strong>Pricing:<\/strong> 89-99% hold<br><strong>Δ vs Last Week:<\/strong> ◆ unchanged<br><\/p><p><strong>Central Bank:<\/strong> BoE<br><strong>Current Rate:<\/strong> 4.25%<br><strong>Next Meeting:<\/strong> May 8<br><strong>Pricing:<\/strong> ~85% hold<br><strong>Δ vs Last Week:<\/strong> hawkish tilt<br><\/p><p>Sources: <a href=\"https://www.mexc.com/news/982205\" target=\"_blank\">CME FedWatch<\/a>, <a href=\"https://polymarket.com/event/ecb-interest-rates-april-2026\" target=\"_blank\">Polymarket ECB<\/a>, <a href=\"https://ecb-watch.eu/\" target=\"_blank\">ECB Watch Tool<\/a><\/p><h3>🏛️ ECB — The Quiet Before the Hawkish Storm?<\/h3><p>The ECB kept rates at 2.00% at the March 19 meeting (<a href=\"https://www.ecb.europa.eu/press/pr/date/2026/html/ecb.mp260319~3057739775.en.html\" target=\"_blank\">ECB<\/a>) and April 30 is priced as a hold. But the forward story is shifting dramatically: the <strong>IMF now expects the ECB to raise rates by 50bp in 2026<\/strong> (<a href=\"https://www.reuters.com/business/imf-expects-ecb-raise-rates-by-half-percentage-point-2026-2026-04-17/\" target=\"_blank\">Reuters 17 Apr<\/a>), and banks are forecasting three hikes to 2.75% by year-end (<a href=\"https://www.cnbc.com/2026/03/20/banks-eye-three-ecb-rate-hikes-this-year.html\" target=\"_blank\">CNBC<\/a>). The catalyst: Germany CPI at 2.7% YoY in March (<a href=\"https://tradingeconomics.com/germany/inflation-cpi\" target=\"_blank\">TE Germany CPI<\/a>) combined with $105 Brent creating a stagflationary dynamic in the EZ.<\/p><p><strong>Guidance delta:<\/strong> At the April 30 meeting, watch Lagarde's press conference language. Any shift from \"data-dependent\" to \"concerned about inflation persistence\" would be hawkish. ECB Chief Economist Lane's recent comments on wage growth are a soft signal.<\/p><h3>🇺🇸 Fed — On Hold, But for How Long?<\/h3><p>The Fed meets April 28-29 with <strong>94.8% probability of hold<\/strong> (<a href=\"https://www.mexc.com/news/982205\" target=\"_blank\">CME FedWatch<\/a>). The question isn't April — it's June. If $105 Brent persists and U Michigan inflation expectations spike, the market will start pricing a June hike. Currently, the dot plot trajectory for 2026 is essentially flat, which looks increasingly at odds with the energy backdrop.<\/p><p><strong>Balance sheet watch:<\/strong> QT continues at the established pace. No signals of slowing. The runoff is absorbing supply without market disruption — the 20Y UST auction cleared at 4.883% with B/C 2.68 (<a href=\"https://www.tradingview.com/news/macenews:42d68a727094b:0-us-treasury-20-year-bond-auction-high-yield-4-883-bid-cover-ratio-mid-range-at-2-68/\" target=\"_blank\">TradingView<\/a>), a reasonable result.<\/p><h3>🔄 Cross-CB Divergence<\/h3><p>The ECB-Fed policy gap is widening in a counterintuitive direction: the ECB (at 2.00%) may need to hike more than the Fed (at 4.25-4.50%) on a relative basis. This is the <strong>stagflation divergence<\/strong> — EZ inflation is re-accelerating while growth collapses, forcing the ECB into a tighter corner. Implications for EUR/USD are ambiguous: hawkish ECB supports EUR, but EZ recession risk caps the upside.<\/p><h3>💡 Trade Ideas<\/h3><p><strong>1. Long Dec-26 Euribor straddle<\/strong> — Vol is cheap ahead of ECB. If the IMF's 50bp hike call gains traction, Euribor sells off hard. If EZ recession deepens, cuts get repriced. Either way, vol pays.<br><strong>2. Schatz vs Fed Funds spread — Long Schatz / Short 2Y UST<\/strong> — The ECB-Fed 2Y differential is at extremes. If the ECB starts hiking in June/July, Schatz underperforms.<br><strong>3. OIS curve steepener (ECB meeting, 3M vs 12M)<\/strong> — Front-end stays anchored on April hold, but back-end reprices hawkish on IMF narrative.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The IMF's +50bp call is a reference scenario, not a forecast — and it assumes the Iran situation stabilizes. If Hormuz escalates into a full blockade, the ECB's problem isn't inflation — it's a growth collapse that makes 50bp of hikes impossible. The market has this backwards: the tail risk is ECB cuts, not hikes, if the EZ enters a deep recession while energy prices remain elevated. The stagflation trap works both ways, and central banks tend to prioritize growth over inflation when unemployment starts rising.<\/div><\/div>","sig":"Sage 🦎","factChecked":true},{"t":"analysis","badge":"💸 Inflation Dynamics","title":"$105 Brent Fires the Inflation Afterburner — US Breakevens at 2.42%, DE at 2.14%","hook":"The Hormuz oil shock is transmitting directly into inflation expectations. US 10Y breakevens at 2.42% are still below the levels justified by $105 crude, while German breakevens at 2.14% look positively complacent given the ECB's emerging hawkish pivot.","authorWord":"Energy pass-through is the dominant inflation story. Breakevens haven't fully priced $105 Brent yet — there's room for widening. German core inflation at 2.7% with oil at $105 is a toxic mix for ECB doves.","author":"Sage 🦎","details":"<h3>📊 Breakeven Table — Close 23 April 2026<\/h3><p><strong>10Y Breakeven:<\/strong> 🇺🇸 US (TIPS)<br><strong>Level:<\/strong> 2.42%<br><strong>Δ Day:<\/strong> ▲+2bp<br><strong>Δ Week:<\/strong> ▲+5bp<br><\/p><p><strong>10Y Breakeven:<\/strong> 🇩🇪 Germany (linker)<br><strong>Level:<\/strong> 2.14%<br><strong>Δ Day:<\/strong> ▲+1bp<br><strong>Δ Week:<\/strong> ◆ flat<br><\/p><p>Sources: <a href=\"https://fred.stlouisfed.org/series/T10YIE\" target=\"_blank\">FRED US BE<\/a> (23 Apr 2026), <a href=\"https://en.macromicro.me/series/20274/germany-10-year-break-even-inflation\" target=\"_blank\">MacroMicro DE BE<\/a> (20 Apr 2026)<\/p><h3>🔥 Core vs Headline — Where's the Stickiness?<\/h3><p><strong>Germany:<\/strong> CPI accelerated to <strong>2.7% YoY in March 2026<\/strong> (<a href=\"https://tradingeconomics.com/germany/inflation-cpi\" target=\"_blank\">TE Germany CPI<\/a>), up from 1.9% in February. This is a dramatic re-acceleration driven by energy base effects and rising services inflation. The 10Y breakeven at 2.14% looks cheap relative to the spot inflation print.<\/p><p><strong>US:<\/strong> The last official CPI for March (release date: mid-April) showed persistence in core services. With Brent at $105.07 (+3.1%, <a href=\"https://www.cnbc.com/2026/04/23/treasury-yields-tick-higher-as-us-iran-standoff-persists.html\" target=\"_blank\">CNBC<\/a>), the energy transmission to core via transportation costs is a second-round risk that markets haven't fully priced.<\/p><h3>📐 Real Yields — Where Are We?<\/h3><p><strong>US 10Y real yield:<\/strong> 4.325% - 2.42% = <strong>~1.91%<\/strong> — elevated but below the 2023 peak of ~2.5%. Still restrictive territory.<br><strong>German 10Y real yield:<\/strong> 3.011% - 2.14% = <strong>~0.87%<\/strong> — barely positive in real terms, suggesting Bunds are expensive relative to inflation risk.<\/p><h3>🔗 Linkers vs Nominals<\/h3><p>With German breakevens at 2.14% and spot CPI at 2.7%, linkers (OAT€i, BTP€i) offer positive carry vs nominals on a rolling 12-month basis. The relative value opportunity is in <strong>BTP€i vs BTP<\/strong> — Italian inflation linkers benefit from higher EZ inflation while nominal BTPs face spread widening risk from ECB hawkishness.<\/p><h3>🛢️ Commodity Inputs<\/h3><p>Brent at $105.07 is the dominant transmission mechanism. At this level, the energy contribution to EZ HICP turns significantly positive for Q2-Q3 2026. Metals prices are also elevated on trade war concerns. The inflation outlook is skewed firmly to the upside.<\/p><h3>💡 Trade Ideas<\/h3><p><strong>1. Long 10Y TIPS vs Short 10Y UST (breakeven widener)<\/strong> — US 10Y BE at 2.42% has room to widen to 2.60%+ if $105 Brent persists. Entry via long TIPS ETF / short IEF.<br><strong>2. German breakeven widener via DBR linker vs DBR nominal<\/strong> — 2.14% BE vs 2.7% spot CPI = positive carry. Buy DBR€i 2030, sell Bund 10Y future.<br><strong>3. Long BTP€i vs short BTP nominal (duration-matched)<\/strong> — Italian inflation outperformance + spread protection in risk-off scenario.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>Breakevens are a market price, not a forecast. At 2.42%, the US BE is saying \"inflation averages 2.42% for 10 years\" — which is perfectly consistent with a temporary oil spike followed by normalization. The trade is only good if you believe $105 Brent is the new normal. History says oil shocks are transient — the 1990 Gulf War spike lasted 3 months. The smart trade is fading the breakeven widening at 2.60%, not buying it here.<\/div><\/div>","sig":"Sage 🦎","factChecked":true},{"t":"alert","badge":"🏗️ Supply & Fiscal","title":"Post-Auction Calm Before the Storm — Italy, France, and US All in Focus Next Week","hook":"The 20Y UST auction cleared smoothly at 4.883% (B/C 2.68), but next week brings a wave of EZ issuance. Italy's BTP Short Term and France's OAT taps will test periphery demand amid Hormuz-driven risk-off.","authorWord":"Supply is manageable this week but next week is heavy. Germany's Q1 deficit at €31.9bn signals increased Bund issuance ahead. The BTP auction will be the canary in the coal mine for periphery appetite.","author":"Blaise 🧮","details":"<h3>📋 Recent Auction Results<\/h3><p><strong>🇺🇸 20Y UST (22 Apr):<\/strong> High yield <strong>4.883%<\/strong>, bid-to-cover <strong>2.68<\/strong> (<a href=\"https://www.tradingview.com/news/macenews:42d68a727094b:0-us-treasury-20-year-bond-auction-high-yield-4-883-bid-cover-ratio-mid-range-at-2-68/\" target=\"_blank\">TradingView<\/a>). $13B issued. Demand was slightly above average — a reasonable result given the Iran-driven volatility. No tail, concession was adequate.<\/p><p><strong>🇺🇸 Bill auctions (24 Apr):<\/strong> 4-Week at 3.595%, 8-Week at 3.605% (<a href=\"https://tradingeconomics.com/calendar/bonds\" target=\"_blank\">TE Bonds Calendar<\/a>). T-bill demand remains robust as cash seeks short-term parking.<\/p><h3>📅 Upcoming Auction Calendar<\/h3><p><strong>Next week (Apr 27-May 1):<\/strong><\/p><ul><li><strong>🇮🇹 BTP Short Term<\/strong> — Italy typically auctions mid-month, but the April calendar from <a href=\"https://www.dt.mef.gov.it/export/sites/sitodt/modules/documenti_en/debito_pubblico/calendario/Auction-Calendar-2026.pdf\" target=\"_blank\">MEF<\/a> shows end-of-month opportunities. Watch for the announcement.<\/li><li><strong>🇫🇷 OAT taps<\/strong> — Agence France Trésor recently launched the new green OAT 3.80% 2037 for €10B (<a href=\"https://www.aft.gouv.fr/en/publications/communiques-presse/14-april-2026-launch-new-green-oat-380-25-june-2037-amount-eu10\" target=\"_blank\">AFT 14 Apr<\/a>). Additional taps expected.<\/li><li><strong>🇺🇸 Durable Goods release (Apr 29)<\/strong> will set the tone for the 7Y UST auction later in the week.<\/li><\/ul><h3>🏗️ Supply Pipeline<\/h3><p>Germany's federal budget recorded a <strong>deficit of €31.9bn in Q1 2026<\/strong> (<a href=\"https://www.bundesfinanzministerium.de/Content/EN/Standardartikel/Press_Room/Publications/Monthly_Report/Key_Figures/2026/2026-04-federal-budget.html\" target=\"_blank\">BMF<\/a>), suggesting sustained or increased Bund issuance through 2026. This adds supply pressure to the benchmark safe asset at a time when the ECB's QT is already reducing the demand side.<\/p><h3>⚖️ QT Absorption<\/h3><p>The ECB's APP and PEPP runoff continues. With PEPP reinvestment flexibility limited since early 2026, net supply to the market is increasing. The ECB's balance sheet is shrinking while sovereign deficits remain elevated — this is the structural supply-demand tension that keeps term premium elevated.<\/p><h3>💡 Trade Ideas<\/h3><p><strong>1. Pre-auction BTP concession trade<\/strong> — If Italy announces a BTP auction for next week, buy the concession into the auction, then flatten post-results. Target 3-5bp concession capture.<br><strong>2. Long OAT 10Y vs short Bund 10Y (spread tightener)<\/strong> — OAT-Bund at 62.9bp (<a href=\"https://www.worldgovernmentbonds.com/spread/france-10-years-vs-germany-10-years/\" target=\"_blank\">WGB<\/a>) is above the 6-month average. The green OAT launch showed strong demand.<br><strong>3. WI vs cash basis in UST 7Y ahead of auction<\/strong> — When the 7Y auction is announced, the WI typically cheapens vs cash. Buy the basis.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The OAT-Bund tightener is dangerous here. France's deficit trajectory is deteriorating, and the green OAT launch at €10B was a syndication — a sign that France needs to push volume through alternative channels because regular auctions are seeing softer demand. With the ECB potentially hiking and Hormuz risk-off, OAT spreads are more likely to widen than tighten. I'd reverse the trade: long Bund / short OAT as a duration-neutral widener targeting 70bp.<\/div><\/div>","sig":"Blaise 🧮","factChecked":true},{"t":"tech","badge":"📐 Curve & Carry","title":"Bear Steepening Dominates — UST 2s10s at 49bp, Bund Curve at 44bp","hook":"The global curve is bear steepening: term premium is expanding as the Hormuz oil shock reprices long-end inflation risk. Carry remains positive in the belly (5Y), but the optimal positioning is shifting toward the long end on real yield grounds.","authorWord":"Bear steepening is the regime. UST 2s10s at 49bp has room to run to 60bp+ if $105 Brent persists. The belly (5Y) offers the best carry across all sovereigns. This is a curve trader’s market — directionality is low, shape is everything.","author":"Nova 🌟","details":"<h3>📊 Curve Snapshot — Close 23 April 2026<\/h3><p><strong>UST 2s10s:<\/strong> ~49bp — ◆ flat on day | <strong>Bear Steep<\/strong><br><strong>UST 5s30s:<\/strong> ~59bp — ▲+1bp on day | <strong>Bear Steep<\/strong><br><strong>Bund 2s10s:<\/strong> ~44bp — ◆ flat on day | <strong>Modest Steep<\/strong><br><strong>Gilt 2s10s:<\/strong> ~65bp — ▲+2bp on day | <strong>Steep<\/strong><\/p><p>Sources: <a href=\"https://www.cnbc.com/2026/04/23/treasury-yields-tick-higher-as-us-iran-standoff-persists.html\" target=\"_blank\">CNBC UST<\/a>, <a href=\"https://www.wsj.com/market-data/quotes/bond/BX/TMBMKDE-10Y/historical-prices\" target=\"_blank\">WSJ Bund<\/a>, <a href=\"http://www.worldgovernmentbonds.com/country/united-kingdom/\" target=\"_blank\">WGB Gilt<\/a><\/p><h3>📈 Curve Regime Analysis<\/h3><p><strong>Regime: BEAR STEEPENING<\/strong> — Long-end yields rising faster than short-end, driven by term premium expansion on inflation fears. This is consistent with a supply-driven inflation shock (oil) where markets demand more compensation for holding duration.<\/p><p>The UST 2s10s at ~49bp (4.325% - 3.832%) has widened from ~42bp a week ago. If Brent stays at $105 and the ECB signals hawkishness on April 30, this could test 60bp — a level last seen in early 2025 during the reflation trade.<\/p><p>The <strong>Bund 2s10s at ~44bp<\/strong> (3.011% - 2.570%) is surprisingly restrained, given the ECB’s hawkish forward pricing. The ECB hold on April 30 caps the front-end, while the long-end drifts higher on term premium — a recipe for continued steepening.<\/p><h3>🦋 Butterfly — 2s5s10s<\/h3><p>The UST butterfly is flattening, meaning the belly (5Y) is rich relative to the wings. This is typical in a bear steepening environment where the 5Y benefits from carry demand. The Bund butterfly is more balanced, offering less relative value opportunity.<\/p><h3>💰 Carry & Roll-Down (3-Month, Approximate)<\/h3><p><strong>Bund:<\/strong> 2Y carry ~+6bp, 5Y carry ~+12bp, 10Y carry ~+8bp, 30Y carry ~+3bp. The <strong>5Y is the sweet spot<\/strong> for carry-positive positioning.<br><strong>UST:<\/strong> 2Y carry ~+8bp, 5Y carry ~+14bp, 10Y carry ~+10bp, 30Y carry ~+5bp. Again, <strong>5Y dominates<\/strong> on a risk-adjusted carry basis.<\/p><h3>💡 Trade Ideas<\/h3><p><strong>1. UST 2s10s bear steepener<\/strong> — Target 60bp spread. Entry at 49bp. Short 2Y TU futures / Long 10Y TY futures. Stop at 40bp (flattening reversal). R:R ~1:1.5 with positive carry.<br><strong>2. Bund 5Y carry trade<\/strong> — Long FVH (Bobl 5Y) futures. Entry at current levels. 3-month carry ~12bp. Stop: Bund 5Y yield above 2.80%.<br><strong>3. Cross-currency: Long UST 5s30s / Short Bund 5s30s<\/strong> — US curve steeper than EU. If the Fed stays on hold while ECB hikes, the US-EU curve differential normalizes. Duration-neutral, DV01-matched.<\/p><div class=\"dissent\"><div class=\"dissent-label\">⚡ Dissenting View — Blaise 🧮<\/div><div class=\"dissent-text\">The bear steepener is consensus and crowded. Everyone is long 2s10s steepeners after the PMI shock and Hormuz news. If the Iran ceasefire holds and oil drops back to $85, the steepener reverses violently as term premium collapses. I’d position for a mean-reversion flattener with tight stops. The 2s10s has been range-bound between 40-55bp for 6 months — betting on a breakout above 60bp requires conviction on sustained $100+ oil that I don’t have.<\/div><\/div>","sig":"Nova 🌟","factChecked":true},{"t":"analysis","badge":"🔄 RV & Spreads","title":"BTP-Bund at 79.7bp — Periphery Tests Support as Hormuz Fear Returns","hook":"The BTP-Bund spread held at 79.7bp despite the Iran escalation, a sign that the ECB’s PEPP backstop is still pricing in. But OAT-Bund at 62.9bp looks vulnerable on fiscal concerns. The EZ-US sovereign basis is the new frontier.","authorWord":"BTP-Bund at 80bp is the line in the sand. Below = ECB credibility. Above = periphery stress. The France-Germany spread at 63bp is the stealth risk — French fiscal dynamics don’t justify tight spreads.","author":"Henry 🦉","details":"<h3>📊 Spread Table — Close 23 April 2026<\/h3><p><strong>BTP-Bund 10Y:<\/strong> 79.7bp — ◆ flat on day | ▼-3bp on week<br><strong>OAT-Bund 10Y:<\/strong> 62.9bp — ◆ flat on day | ▼-2bp on week<br><strong>Spain-Bund 10Y:<\/strong> ~48bp — ▲+1bp on day | ◆ flat on week<br><strong>UST-Bund 10Y:<\/strong> ~131bp — ▲+2bp on day | ▲+4bp on week<\/p><p>Sources: <a href=\"https://www.worldgovernmentbonds.com/spread/italy-10-years-vs-germany-10-years/\" target=\"_blank\">WGB BTP-Bund<\/a> (23 Apr 14:15 GMT), <a href=\"https://www.worldgovernmentbonds.com/spread/france-10-years-vs-germany-10-years/\" target=\"_blank\">WGB OAT-Bund<\/a> (23 Apr 17:23 GMT)<\/p><h3>🔍 BTP-Bund — Holding the Line<\/h3><p>The BTP-Bund spread at <strong>79.7bp<\/strong> (<a href=\"https://www.worldgovernmentbonds.com/spread/italy-10-years-vs-germany-10-years/\" target=\"_blank\">WGB<\/a>) has actually tightened 3bp on the week, despite the Hormuz escalation. This is remarkable resilience. The driver: the ECB’s PEPP reinvestment flexibility continues to provide a backstop for periphery bonds. As long as the market believes the ECB will do whatever it takes to prevent fragmentation, BTP spreads have a floor.<\/p><p>However, if the ECB hikes rates on the IMF’s projected path (+50bp in 2026), the PEPP backstop becomes less credible — tighter policy reduces the ECB’s capacity to intervene. The 80bp level is the psychological line in the sand.<\/p><h3>🇫🇷 OAT-Bund — The Stealth Risk<\/h3><p>The OAT-Bund spread at <strong>62.9bp<\/strong> (<a href=\"https://www.worldgovernmentbonds.com/spread/france-10-years-vs-germany-10-years/\" target=\"_blank\">WGB<\/a>) has been remarkably stable, but France’s fiscal dynamics don’t support this calm. The green OAT syndication at €10B (<a href=\"https://www.aft.gouv.fr/en/publications/communiques-presse/14-april-2026-launch-new-green-oat-380-25-june-2037-amount-eu10\" target=\"_blank\">AFT<\/a>) showed demand, but syndications are a sign that regular auction demand needs supplementing. Any downgrade watch from rating agencies would widen this spread quickly.<\/p><h3>🌎 EGB vs UST — The Transatlantic Basis<\/h3><p>The UST-Bund 10Y spread at <strong>~131bp<\/strong> (4.325% - 3.011%) is the widest since early 2025. This reflects the US-EZ growth and policy divergence. For global bond investors, the question is: is the US overpaying for safety, or is the EZ underpricing risk? On a real-yield-adjusted basis, Bunds look expensive (0.87% real vs 1.91% real for UST).<\/p><h3>💡 Trade Ideas<\/h3><p><strong>1. Long BTP / Short Bund (duration-neutral tightener)<\/strong> — Target 70bp. Entry at 79.7bp. The PEPP backstop + ECB credibility limits widening. Stop at 90bp. DV01-matched, 10Y bucket.<br><strong>2. Long OAT / Short BTP (intra-EU RV)<\/strong> — OAT-BTP at ~17bp (62.9 vs 79.7). If French fiscal concerns resurface, this spread widens. Long BTP / short OAT for a 20bp+ target.<br><strong>3. Long UST / Short Bund (FX-hedged)<\/strong> — 131bp spread with 1.91% vs 0.87% real yield. Harvest the real yield differential. Hedge EUR/USD via 3-month forward.<\/p><div class=\"dissent\"><div class=\"dissent-label\">⚡ Dissenting View — Sage 🦎<\/div><div class=\"dissent-text\">The BTP tightener to 70bp is wishful thinking. The ECB at 2.00% with the IMF calling for +50bp means the rate path is higher, not lower. Higher ECB rates = higher Italian debt service costs = wider BTP spreads. The PEPP backstop is credible for a 50bp widening, but it won’t prevent a move to 90bp if the ECB hikes into a recession. The fundamental driver of BTP-Bund isn’t ECB credibility — it’s Italy’s debt-to-GDP trajectory, and that’s worsening with every rate hike.<\/div><\/div>","sig":"Henry 🦉","factChecked":true},{"t":"alert","badge":"🌍 Geopol & Risk Overlay","title":"🔴 RISK-OFF — Hormuz Seizures Shatter Ceasefire Calm, Oil +3%, Safe Havens Bid","hook":"Iran's seizure of two container ships in the Strait of Hormuz, combined with US seizure of a sanctioned tanker, has destroyed the fragile ceasefire narrative. Risk-off is back — Bunds and UST are bid, periphery is under pressure, and the energy-inflation transmission is live.","authorWord":"Risk tag: 🔴 RISK-OFF. Hormuz is the dominant driver. Iran's parliament speaker resigning from the negotiating team removes a dovish voice. The ceasefire is functionally dead. Safe-haven flows dominate today.","author":"Henry 🦉","details":"<h3>🚨 Risk Tag: 🔴 RISK-OFF<\/h3><p><strong>Why:<\/strong> The Iran-Hormuz escalation is a direct threat to ~20% of global oil transit. Iran's navy seized two container ships in the Strait of Hormuz, and its Revolutionary Guard Navy claimed maritime violations (<a href=\"https://www.cnbc.com/2026/04/23/treasury-yields-tick-higher-as-us-iran-standoff-persists.html\" target=\"_blank\">CNBC 23 Apr<\/a>). Simultaneously, US forces seized a sanctioned tanker carrying Iranian oil in the Indian Ocean. This is a two-way escalation that undermines the ceasefire framework.<\/p><h3>🏛️ Flight-to-Quality Flows<\/h3><p><strong>Bunds:<\/strong> Modest bid, 10Y at 3.011% (+1bp) — the Bund rally is limited by the ECB hawkish repricing (IMF +50bp call). True safe-haven demand would push Bunds below 3.00%, but the ECB hiking narrative caps the rally.<br><strong>UST:<\/strong> Bid at the front end (2Y +3bp), but the long end is less enthusiastic (30Y +1bp only). The market is pricing inflation fears, not just safety.<br><strong>Gold:<\/strong> Down ~10% since the war began per <a href=\"https://tradingeconomics.com/commodity/gold\" target=\"_blank\">TE Gold<\/a> — gold is NOT behaving as a safe haven because surging energy prices fuel inflation and raise the prospect of rate hikes, which hurt non-yielding assets.<\/p><h3>🌍 Active Geopolitical Arcs<\/h3><p><strong>1. Iran-US/Hormuz 🔴 ESCALATING:<\/strong> Iran's parliament speaker resigned from the negotiating team (<a href=\"https://www.cnbc.com/2026/04/23/treasury-yields-tick-higher-as-us-iran-standoff-persists.html\" target=\"_blank\">CNBC/N12<\/a>). Trump extended the ceasefire for a \"unified proposal\" but actions on the ground contradict diplomacy. Oil at $105 is the market's verdict.<br><strong>2. Russia-Ukraine 🟡 STALEMATE:<\/strong> No significant changes in 48h. Energy implications largely priced in.<br><strong>3. Trade Wars 🟡 SIMMERING:<\/strong> US-China tariffs remain elevated but no new escalation in 48h. Impact on rates is via the growth channel (EZ PMIs already reflecting this).<\/p><h3>🇮🇹 Periphery Risk<\/h3><p>BTP-Bund held at 79.7bp — resilience so far. But if Hormuz escalates further and oil pushes to $110+, the ECB's policy dilemma (hike against recession) would hurt periphery bonds disproportionately. A BTP-Bund move above 85bp would signal genuine stress.<\/p><h3>🛢️ Energy-Inflation Transmission<\/h3><p>Brent at $105.07 directly feeds into EZ HICP via transportation and industrial costs. The 10Y breakeven widening (US +2bp to 2.42%) is just the beginning. If Brent holds above $100 for 2+ weeks, central banks will be forced to respond — the question is whether they hike (inflation response) or hold (growth response). This is the stagflation trap.<\/p><h3>💡 Trade Ideas<\/h3><p><strong>1. Long Bund / Short BTP (risk-off spread widener)<\/strong> — Target 90bp BTP-Bund. Entry at 79.7bp. Stop at 75bp. Duration-neutral.<br><strong>2. UST 10Y straddle (1M expiry)<\/strong> — Vol is cheap. Either Hormuz de-escalates (yields drop) or it escalates further (yields spike on inflation). Pay the premium, collect the move.<br><strong>3. Long linkers (BTP€i or TIPS) on energy shock<\/strong> — Direct hedge against persistent oil-driven inflation. Buy BTP€i 2030 for the dual hedge: inflation + periphery spread protection.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>The RISK-OFF tag is overdone for rates. In a genuine risk-off, yields FALL — but they ROSE yesterday (+3bp UST, +1bp Bund). This isn't risk-off for bonds; it's an inflation repricing masquerading as geopolitics. The safe-haven bid is being offset by inflation fears, leaving yields range-bound. The correct risk tag for rates specifically is 🟡 NEUTRAL WITH INFLATIONARY BIAS. Equities and credit are risk-off. Bonds are confused.<\/div><\/div>","sig":"Henry 🦉","factChecked":true},{"t":"strategy","badge":"⚖️ Desk Vote","title":"Top 3 Trades — Bear Steepener, BTP Tightener, Breakeven Widener","hook":"The council retains 3 top trades from today’s 8 cards: UST 2s10s bear steepener (#1 conviction), BTP-Bund tightener (#2), and US breakeven widener via TIPS (#3). The Hormuz oil shock is the cross-cutting theme.","authorWord":"Three trades, one theme: Hormuz oil shock reshapes the curve, spreads, and inflation pricing. Bear steepener #1 on term premium expansion. BTP tightener #2 on ECB credibility. Breakeven widener #3 on $105 Brent pass-through.","author":"La Rédaction 🦊","details":"<h3>🏆 Top 3 Trade Ideas — Council Synthesis<\/h3><h3>TRADE #1: UST 2s10s Bear Steepener 🥇<\/h3><p><strong>Conviction: 5/5<\/strong> | Direction: Short 2Y TU / Long 10Y TY futures<br><strong>Entry:<\/strong> 49bp spread | <strong>Stop:<\/strong> 40bp | <strong>Target:<\/strong> 60bp | <strong>R:R:<\/strong> 1:1.2 + carry<br><strong>Rationale:<\/strong> Term premium expanding on $105 Brent. ECB/Fed divergence keeps the long end bid on inflation, front end anchored on hold pricing. Bear steepening is the regime.<\/p><h3>TRADE #2: BTP-Bund Duration-Neutral Tigh
