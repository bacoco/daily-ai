<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rates & Inflation Morning Brief — 24 Avril 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    /* Scenario Probability Card */
    .scenario-block { margin: 1em 0; padding: 0.8em 1em; border-left: 4px solid #ffd700; border-radius: 0 8px 8px 0; background: rgba(255,215,0,0.05); }
    .scenario-block h3 { margin: 0 0 0.3em 0; font-size: 1.05em; display: flex; justify-content: space-between; align-items: center; }
    .scenario-block .proba { font-size: 1.3em; font-weight: bold; color: #ffd700; }
    .scenario-block p { margin: 0.2em 0; font-size: 0.92em; }
    .scenario-block .votes { font-size: 0.8em; opacity: 0.7; font-style: italic; }
    .consensus { margin-top: 1.2em; padding: 0.6em; border-radius: 8px; background: rgba(0,200,100,0.08); }
    .dissent { margin-top: 0.4em; padding: 0.6em; border-radius: 8px; background: rgba(255,80,80,0.08); }

    html.light .details div[style*="background"], html.light .details p[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Light mode: override inline white colors in trade cards */
    html.light .details p[style], html.light .details b[style], html.light .details span[style], html.light .details div[style] { color: rgba(0,0,0,.85) !important; }
    html.light .details div[style*="border-left:3px solid #f59e0b"] { background: rgba(245,158,11,.08) !important; }
    html.light .details div[style*="border-left:3px solid #10b981"] { background: rgba(16,185,129,.08) !important; }
    html.light .details div[style*="border-left:3px solid #ff4757"] { background: rgba(255,71,87,.06) !important; }
    html.light .details div[style*="color:#f59e0b"] { color: #b45309 !important; }
    html.light .details div[style*="color:#10b981"] { color: #047857 !important; }
    html.light .details div[style*="color:#ff4757"] { color: #dc2626 !important; }
    html.light .details h3 { color: #1a1a2e !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details p[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }
      .dt-reader .dt-r-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; }
      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }

  <script>
  const DATA = [{"t":"home","home":true,"date":"24 Avril 2026","henryWord":"Stagflation day. The EZ just printed its worst PMI in 17 months while oil holds above 02 on Hormuz escalation. The ECB is cornered into a June hike it can't afford, and the Fed is on hold with Warsh waiting in the wings. Bear steepening is the regime — carry-positive curve trades are the expression. The council retained 17 of 23 trades, with the Bund 2s10s steepener as top conviction.","articles":[{"badge":"📊 Macro Pulse","title":"UMich Final Sentiment in Focus as EZ Stagflation Deepens — PMI Shock Sets Divergence Theme","idx":1},{"badge":"📉 Core Yields","title":"UST 10Y Holds 4.30% as Hormuz Fog Meets Resilient US Data — Bear Steepening Intact","idx":2},{"badge":"🏛️ CB Radar","title":"ECB Cornered: June Hike Priced as Stagflation Bites — Fed Holds Steady with Warsh Looming","idx":3},{"badge":"💸 Inflation Dynamics","title":"Energy Shock Pass-Through Accelerates — Breakevens Unmooring as Brent Holds $102+","idx":4},{"badge":"🏗️ Supply & Fiscal","title":"Heavy Supply Week Nears End — Warsh's QT Ambitions Set the Real Test","idx":5},{"badge":"📐 Curve & Carry","title":"Bear Steepening Dominates — 2s10s Bunds Positive as Term Premium Reprices","idx":6},{"badge":"🔄 RV & Spreads","title":"BTP-Bund Holds 78.8bp on Hormuz Fear — OAT Widening Signals Contagion Beyond Italy","idx":7},{"badge":"🌍 Geopol & Risk Overlay","title":"RISK-OFF — Hormuz Seizures Shatter Ceasefire Calm, Oil +$10 in a Week","idx":8},{"badge":"⚖️ Desk Vote","title":"17 Trades Validated — Bund Steepener #1 Conviction in Stagflation Regime","idx":9},{"badge":"🏛️ Verdict du Conseil","title":"22 Trades Audités — 17 Retenus, 5 Éliminés","idx":10}],"disclaimer":"⚠️ DISCLAIMER — This document is an experimental automated market intelligence product generated by artificial intelligence. It does NOT constitute investment advice, a trading recommendation, or regulated financial analysis under MiFID II or any securities regulation. The 'trade ideas' and 'scenarios' presented are pedagogical hypotheses generated by language models — they do not reflect the opinion of a licensed professional. Data is sourced from public feeds and may be delayed or inaccurate. Any investment decision based on this document is the sole responsibility of the reader. The author is not registered as an Investment Advisor with any regulatory authority. This content is provided for informational and experimental purposes only."},{"t":"alert","badge":"📊 Macro Pulse","title":"UMich Final Sentiment in Focus as EZ Stagflation Deepens — PMI Shock Sets Divergence Theme","hook":"Eurozone PMIs just printed their worst reading in 17 months while the US remains in expansion. Today's UMichigan final sentiment will reveal whether the American consumer is starting to crack under $102+ oil.","authorWord":"EZ Composite PMI crashed to 48.6 vs 50.1 expected — the fastest contraction since Nov 2024. Today: Final UMich Sentiment (Apr). Tomorrow: quiet. The divergence trade is live.","author":"La Rédaction 🦊","details":"<h3>📅 Today's Data Calendar — 24 April 2026<\/h3><p><strong>🇺🇸 Final University of Michigan Consumer Sentiment (Apr)<\/strong> — Consensus: ~57.9 (preliminary was 57.9). Key sub-component to watch: <strong>1Y inflation expectations<\/strong> (prelim: 6.7%, 5Y: 4.4%). Any upward revision here will cement the 'no cuts' narrative for the Fed. Release: 10:00 ET / 15:00 BST. Source: <a href='https://www.schwab.com/learn/story/stock-market-update-open' target='_blank'>Schwab Morning Update<\/a><\/p><p><strong>🇩🇪 Ifo Business Climate (Apr)<\/strong> — Expected to reflect the PMI shock. Consensus around 87.0 vs 86.7 prior. If it misses alongside the flash PMIs, the ECB's June hike dilemma intensifies.<\/p><p><strong>🇺🇸 Durable Goods Orders (Mar)<\/strong> — Consensus: +1.2% MoM headline, +0.2% ex-transport. A beat would reinforce the US strength narrative vs EZ weakness.<\/p><h3>📉 Yesterday's Key Releases<\/h3><p><strong>🇪🇺 Flash Composite PMI (Apr)<\/strong>: <strong>48.6<\/strong> vs 50.1 expected — a massive miss. Services drove the decline, while manufacturing held in expansion. The energy shock from the Hormuz crisis is biting European demand. Source: <a href='https://www.reuters.com/business/euro-zone-business-activity-contracted-april-costs-rocketed-pmi-shows-2026-04-23/' target='_blank'>Reuters<\/a><\/p><p><strong>🇺🇸 Flash Composite PMI (Apr)<\/strong>: Best reading in 47 months, showing the US economy continues to outperform dramatically. Source: <a href='https://en.ilsole24ore.com/art/stock-exchange-latest-news-tokyo-record-nikkei-index-first-time-above-60000-AIxWOeeC' target='_blank'>Il Sole 24 Ore<\/a><\/p><p><strong>🇺🇸 Weekly Jobless Claims<\/strong>: 214,000 — remains low, labor market solid.<\/p><h3>🔮 Tomorrow's Preview (25 April)<\/h3><p>Light calendar. Focus will be on any weekend developments on the Hormuz front and positioning ahead of next week's FOMC (Apr 30) and ECB (Apr 30) meetings.<\/p><h3>💡 Trade Ideas<\/h3><p><strong>T1 — Short Schatz vs Long UST 2Y (ECB-Fed divergence)<\/strong>: EZ PMI shock + ECB June hike pricing vs resilient US data supports a widenening of the 2Y rate differential. Entry: short Schatz Dec-26, long UST 2Y note. Duration: 4-6 weeks. R:R ~2:1.<\/p><p><strong>T2 — Long Bund volatility pre-Ifo<\/strong>: If Ifo confirms PMI weakness, expect Bund rally on growth fears conflicting with ECB hike pricing. Buy Bund 10Y straddle (ATM ~3.05 strike), 1-month expiry.<\/p><p><strong>T3 — Fade UMich sentiment spike<\/strong>: If 1Y inflation expectations jump above 7%, initial UST sell-off likely overdone given still-solid growth. Consider long UST 10Y @ 4.35% with stop at 4.45%.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The PMI divergence is being over-extrapolated. EZ manufacturing is still above 50, and the services slump could reverse quickly if Hormuz opens. The ECB hike in June is not a done deal — Simkus himself said April should be a hold. Fading the divergence trade could be the contrarian play.<\/div><\/div>","sig":"La Rédaction 🦊"},{"t":"alert","badge":"📉 Core Yields","title":"UST 10Y Holds 4.30% as Hormuz Fog Meets Resilient US Data — Bear Steepening Intact","hook":"Government bonds are selling off globally as energy-driven inflation fears dominate, but safe-haven flows are capping the upside. The UST 10Y sits at a critical juncture between stagflation repricing and flight-to-quality bids.","authorWord":"UST 10Y 4.30% (close 23 Apr) ▲+1bp. BTP 10Y 3.79%. Bund 10Y ~3.01%. Bear steepening regime intact. Hormuz escalation vs ceasefire headlines driving intraday swings.","author":"La Rédaction 🦊","details":"<h3>📊 Benchmark Yields — Close 23 April 2026<\/h3><p><strong><strong>Instrument<\/strong>:<\/strong> UST 2Y<br><strong>Yield:<\/strong> 3.89%<br><strong>Day Δ:<\/strong> ▲+2bp<br><strong>Wk Δ:<\/strong> ▲+8bp<br><\/p><p><strong><strong>Instrument<\/strong>:<\/strong> UST 5Y<br><strong>Yield:<\/strong> 4.08%<br><strong>Day Δ:<\/strong> ▲+1bp<br><strong>Wk Δ:<\/strong> ▲+6bp<br><\/p><p><strong><strong>Instrument<\/strong>:<\/strong> UST 10Y<br><strong>Yield:<\/strong> 4.30%<br><strong>Day Δ:<\/strong> ▲+1bp<br><strong>Wk Δ:<\/strong> ▲+5bp<br><\/p><p><strong><strong>Instrument<\/strong>:<\/strong> UST 30Y<br><strong>Yield:<\/strong> 4.62%<br><strong>Day Δ:<\/strong> ▲+2bp<br><strong>Wk Δ:<\/strong> ▲+4bp<br><\/p><p><strong><strong>Instrument<\/strong>:<\/strong> Bund 2Y<br><strong>Yield:<\/strong> ~2.05%<br><strong>Day Δ:<\/strong> ◆ flat<br><strong>Wk Δ:<\/strong> ▲+5bp<br><\/p><p><strong><strong>Instrument<\/strong>:<\/strong> Bund 10Y<br><strong>Yield:<\/strong> ~3.01%<br><strong>Day Δ:<\/strong> ▲+1bp<br><strong>Wk Δ:<\/strong> ▲+4bp<br><\/p><p><strong><strong>Instrument<\/strong>:<\/strong> Bund 30Y<br><strong>Yield:<\/strong> ~3.28%<br><strong>Day Δ:<\/strong> ▲+2bp<br><strong>Wk Δ:<\/strong> ▲+3bp<br><\/p><p><strong><strong>Instrument<\/strong>:<\/strong> OAT 10Y<br><strong>Yield:<\/strong> ~3.65%<br><strong>Day Δ:<\/strong> ▲+2bp<br><strong>Wk Δ:<\/strong> ▲+6bp<br><\/p><p><strong><strong>Instrument<\/strong>:<\/strong> BTP 10Y<br><strong>Yield:<\/strong> 3.79%<br><strong>Day Δ:<\/strong> ▲+2bp<br><strong>Wk Δ:<\/strong> ▲+5bp<br><\/p><p><strong><strong>Instrument<\/strong>:<\/strong> Gilt 10Y<br><strong>Yield:<\/strong> ~4.85%<br><strong>Day Δ:<\/strong> ▲+3bp<br><strong>Wk Δ:<\/strong> ▲+7bp<br><\/p><p><em>Sources: <a href='https://fred.stlouisfed.org/series/DGS10' target='_blank'>FRED DGS10<\/a>, <a href='https://www.ansa.it/sito/notizie/topnews/2026/04/23/lo-spread-tra-btp-e-bund-chiude-poco-mosso-a-788-punti-base_c48ebf30-375e-4516-b6c4-1161bcbbfdba.html' target='_blank'>ANSA<\/a>, <a href='https://www.schwab.com/learn/story/stock-market-update-open' target='_blank'>Schwab<\/a>, <a href='https://en.ilsole24ore.com/art/stock-exchange-latest-news-tokyo-record-nikkei-index-first-time-above-60000-AIxWOeeC' target='_blank'>Il Sole 24 Ore<\/a><\/em><\/p><h3>🔍 Drivers<\/h3><p><strong>PRIMARY: Hormuz escalation.<\/strong> Iran flaunted control over the Strait with video of commandos storming a cargo ship. Trump ordered the Navy to 'shoot and kill any boat' mining the strait. Oil jumped back above $102/bbl. This is driving the bear steepening as long-end yields rise on inflation fears while the short-end is anchored by central bank uncertainty. Source: <a href='https://www.reuters.com/business/energy/oil-prices-edge-lower-with-no-progress-us-iran-talks-hormuz-shipping-still-2026-04-23/' target='_blank'>Reuters Energy<\/a><\/p><p><strong>SECONDARY: EZ PMI shock.<\/strong> The massive miss on EZ Composite PMI (48.6 vs 50.1) triggered Bund outperformance vs periphery, supporting the flight-to-quality bid that prevented a sharper sell-off.<\/p><p><strong>Overnight: Asian session.<\/strong> Nikkei broke 60,000 for the first time. JGB yields stable. UST futures mildly offered in Asia. Safe-haven flows balanced by inflation repricing.<\/p><h3>📈 Technical Levels<\/h3><p><strong>UST 10Y:<\/strong> Support 4.25% (prior consolidation), Resistance 4.35% (Mar high), then 4.50% (key psychological). Current RSI: 58, not overbought.<\/p><p><strong>Bund 10Y:<\/strong> Support 2.95%, Resistance 3.08% (recent high). ECB June hike pricing capping the rally.<\/p><h3>🌐 Cross-Market Context<\/h3><p>DXY: 98.74 ▲+0.16 | S&P 500: 7,137 ▲+0.4% | VIX: 19.39 ▲+0.47 | Brent: $92.70 (WTI) / ~$102+ (Brent). Source: <a href='https://www.schwab.com/learn/story/stock-market-update-open' target='_blank'>Schwab<\/a><\/p><h3>💡 Trade Ideas<\/h3><p><strong>T4 — Long UST 10Y @ 4.30% (contrarian)<\/strong>: If Hormuz ceasefire materializes, expect a sharp rally. Entry: 4.30%, Stop: 4.45%, Target: 4.10%. R:R ~1.3:1. Catalyst: any de-escalation headline.<\/p><p><strong>T5 — Short Bund 30Y / Long Bund 2Y (bear flattener)<\/strong>: ECB June hike repricing should flatten the curve further. Entry: 2s30s at ~123bp, targeting 115bp. DV01-neutral.<\/p><p><strong>T6 — Long Gilt 10Y vs Short UST 10Y<\/strong>: BoE hawkishness is fully priced while Fed has room to surprise dovish. Spread compression trade, hedged EUR/GBP.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>The bear steepening is running on fumes. With the EZ entering contraction and US data beating, the correlation between stocks and bonds flipping positive suggests we're in a late-cycle regime. A reversal to bull flattening could come fast if any ceasefire holds. The contrarian trade is to position for a risk-off rally in the long end.<\/div><\/div>","sig":"La Rédaction 🦊"},{"t":"analysis","badge":"🏛️ CB Radar","title":"ECB Cornered: June Hike Priced as Stagflation Bites — Fed Holds Steady with Warsh Looming","hook":"The ECB faces its worst nightmare: hiking into a recession to fight war-driven inflation. Meanwhile, the Fed holds at 3.75% with Kevin Warsh — a known balance sheet hawk — nominated to replace Powell in May.","authorWord":"ECB deposit rate: 2.0%. June hike now consensus. Fed Funds: 3.5-3.75%. One cut projected for 2026. Warsh wants QT acceleration. Simkus: 'should not raise in April.' Stagflation dilemma.","author":"La Rédaction 🦊","details":"<h3>🏛️ OIS Pricing Matrix<\/h3><p><strong><strong>Central Bank<\/strong>:<\/strong> <strong>ECB<\/strong><br><strong>Next Meeting:<\/strong> 30 Apr (hold) / 5 Jun<br><strong>Current Rate:<\/strong> 2.00%<br><strong>Priced Move:<\/strong> Apr: hold; Jun: +25bp priced ~80%<br><strong>Δ vs Last Week:<\/strong> ▲ Hawkish repricing<br><\/p><p><strong><strong>Central Bank<\/strong>:<\/strong> <strong>Fed<\/strong><br><strong>Next Meeting:<\/strong> 30 Apr / 18 Jun<br><strong>Current Rate:<\/strong> 3.50-3.75%<br><strong>Priced Move:<\/strong> Apr: hold; Jun: ~20% cut<br><strong>Δ vs Last Week:<\/strong> ◆ Unchanged<br><\/p><p><strong><strong>Central Bank<\/strong>:<\/strong> <strong>BoE<\/strong><br><strong>Next Meeting:<\/strong> 8 May<br><strong>Current Rate:<\/strong> 4.25%<br><strong>Priced Move:<\/strong> May: hold priced ~70%<br><strong>Δ vs Last Week:<\/strong> ▲ Slightly hawkish<br><\/p><p><em>Sources: <a href='https://tradingeconomics.com/united-states/interest-rate' target='_blank'>Trading Economics<\/a>, <a href='https://commonslibrary.parliament.uk/research-briefings/sn02802/' target='_blank'>UK House of Commons Library<\/a>, <a href='https://www.globalbankingandfinance.com/ecb-raise-rates-june-war-driven-inflation-path-beyond/' target='_blank'>Global Banking & Finance<\/a><\/em><\/p><h3>🇪🇺 ECB — The Hawkish Dilemma<\/h3><p>The EZ Composite PMI crashing to 48.6 creates a toxic policy mix: the economy is contracting while energy-driven inflation surges. ECB Governing Council member Simkus stated: <strong>'Should not raise rates at the upcoming April meeting but cannot rule out one later this year'<\/strong> (source: <a href='https://www.fxstreet.com/analysis/big-tech-earnings-in-focus-ibm-tesla-hynix-all-weak-after-results-202604230715' target='_blank'>FXStreet<\/a>). However, markets are pricing an ~80% probability of a June hike as the energy pass-through to core inflation accelerates.<\/p><p>The April 30 meeting is priced as a hold, but the statement and Lagarde press conference will be critical for June forward guidance.<\/p><h3>🇺🇸 Fed — Warsh Transition Risk<\/h3><p>Powell's term ends May 15. Kevin Warsh, nominated as successor, told the Senate Banking Committee that the Fed's recurring use of its balance sheet is 'quite unhelpful.' He advocates reducing the Fed's $6.7 trillion balance sheet. <strong>Any abrupt QT acceleration would pull up long-term yields<\/strong>, the opposite of what the administration wants. Warsh acknowledged changes would 'need to be clearly communicated and would take time.' Source: <a href='https://www.schwab.com/learn/story/stock-market-update-open' target='_blank'>Schwab / Barron's<\/a><\/p><p>Separately, the Supreme Court ruling on whether Trump can fire Fed Gov. Lisa Cook could come any day, with implications for Fed independence.<\/p><h3>💷 BoE — Most Hawkish of the Three<\/h3><p>UK services inflation remains stubbornly high. 10Y Gilt yields pushing toward 5%. The BoE is arguably in the tightest spot: an economy flirting with stagnation but inflation requiring continued restrictive policy.<\/p><h3>🔄 Cross-CB Divergence<\/h3><p><strong>ECB-Fed 2Y rate gap<\/strong>: ~155bp (3.75% Fed vs ~2.05% ECB 2Y). If the ECB hikes in June, this compresses. If the Fed cuts, it compresses further. The EUR/USD implications are significant — currently ~1.14.<\/p><h3>💡 Trade Ideas<\/h3><p><strong>T7 — Short Euribor Jun-26 (ECB hike trade)<\/strong>: With 80% probability of a June hike, there's still 20bp of pricing to capture. Entry: sell Euribor 3M Jun-26 at current level, target 20bp lower. Stop: if ECB signals hold through summer.<\/p><p><strong>T8 — Long Fed Funds / Short Euribor (divergence)<\/strong>: Position for ECB hiking while Fed holds. The rate differential compression supports EUR strength but the trade works via the front-end.<\/p><p><strong>T9 — Long 5Y5Y inflation swap (EUR)<\/strong>: ECB stagflation means inflation expectations become unanchored. Buy 5Y5Y EUR inflation swap at current ~2.4%, targeting 2.6%.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The ECB June hike is not the certainty markets are pricing. Simkus explicitly said 'should not raise in April' and the GC is divided. If the Hormuz ceasefire holds and oil drops $15, the inflation urgency evaporates. The risk-reward of short Euribor is poor — you're fighting the ECB's own words.<\/div><\/div>","sig":"La Rédaction 🦊"},{"t":"analysis","badge":"💸 Inflation Dynamics","title":"Energy Shock Pass-Through Accelerates — Breakevens Unmooring as Brent Holds $102+","hook":"The Hormuz blockade is no longer a tail risk — it's the baseline. Brent above $102 is feeding directly into breakevens, and the 5Y5Y forward is starting to signal that long-term inflation expectations are becoming unanchored.","authorWord":"Brent $102+ on Hormuz. EZ breakevens widening. 5Y5Y inflation swap trending higher. Core services inflation sticky. Real yields compressed. Stagflationary dynamics entrenched.","author":"La Rédaction 🦊","details":"<h3>📊 Breakeven Snapshot<\/h3><p><strong><strong>10Y Breakeven<\/strong>:<\/strong> 🇩🇪 Germany<br><strong>Level:<\/strong> ~2.15%<br><strong>Day Δ:<\/strong> ▲+3bp<br><strong>Wk Δ:<\/strong> ▲+8bp<br><\/p><p><strong><strong>10Y Breakeven<\/strong>:<\/strong> 🇫🇷 France<br><strong>Level:<\/strong> ~2.30%<br><strong>Day Δ:<\/strong> ▲+4bp<br><strong>Wk Δ:<\/strong> ▲+10bp<br><\/p><p><strong><strong>10Y Breakeven<\/strong>:<\/strong> 🇮🇹 Italy<br><strong>Level:<\/strong> ~2.45%<br><strong>Day Δ:<\/strong> ▲+3bp<br><strong>Wk Δ:<\/strong> ▲+7bp<br><\/p><p><strong><strong>10Y Breakeven<\/strong>:<\/strong> 🇺🇸 US<br><strong>Level:<\/strong> ~2.65%<br><strong>Day Δ:<\/strong> ▲+2bp<br><strong>Wk Δ:<\/strong> ▲+5bp<br><\/p><p><strong>5Y5Y Forward Inflation Swaps (EUR):<\/strong> ~2.35-2.40%, trending higher. Source: market estimates based on <a href='https://www.ndtvprofit.com/markets/brent-crude-oil-price-today-april-24-surges-past-106-as-iran-talks-stall-hormuz-remain-choked-11401274' target='_blank'>NDTV Profit<\/a><\/p><h3>🔍 Core vs Headline Dynamics<\/h3><p>The current inflation impulse is fundamentally <strong>energy-driven<\/strong>. Brent has moved from ~$88 before the Hormuz crisis to $102-106, adding an estimated 0.5-0.8pp to headline inflation over 3-6 months. However, the secondary pass-through is what concerns central banks:<\/p><ul><li><strong>Transport & logistics costs<\/strong> are rising, feeding into goods inflation<\/li><li><strong>Wage demands<\/strong> are accelerating in energy-intensive sectors<\/li><li><strong>Services inflation<\/strong> remains sticky above target across G7<\/li><\/ul><p>The EZ PMI input cost component surged, confirming the cost-push pressure. Source: <a href='https://www.reuters.com/business/euro-zone-business-activity-contracted-april-costs-rocketed-pmi-shows-2026-04-23/' target='_blank'>Reuters<\/a><\/p><h3>📈 Real Yields<\/h3><p><strong>German 10Y real yield:<\/strong> ~3.01% (nominal) - ~2.15% (BE) = ~86bp. Still positive but compressed from the inflation surge.<br><strong>US 10Y real yield:<\/strong> ~4.30% - ~2.65% = ~165bp. More attractive but at risk if breakevens continue to rise.<\/p><p>Real yields are in the lower quartile of their 2Y range, suggesting inflation expectations are rising faster than nominal yields — a stagflation signal.<\/p><h3>🔗 Linker Analysis<\/h3><p>BTP€i vs BTP nominal: Italian linker underperformance reflects fiscal concerns — investors demand more real yield compensation for Italy's debt trajectory. OAT€i performing better, but French fiscal uncertainty capping demand. Source: <a href='https://quifinanza.it/economia/finanza/spread-btp-bund-22-aprile-2026/974867/' target='_blank'>QuiFinanza<\/a><\/p><h3>🛢️ Commodity Inputs<\/h3><p>Brent: $102-106/bbl ▲+$10 from last Friday's lows. Gas: TTF elevated. Metals: copper stable. The energy transmission channel is the dominant driver and shows no sign of normalizing while Hormuz remains disrupted.<\/p><h3>💡 Trade Ideas<\/h3><p><strong>T10 — Long BE flattener (5Y vs 10Y EUR)<\/strong>: Short-term inflation expectations rising faster than long-term → buy 5Y BE, sell 10Y BE. Entry: 5Y/10Y BE spread at ~-15bp, target -5bp.<\/p><p><strong>T11 — Long DE inflation swap vs Short US inflation swap<\/strong>: EZ more exposed to energy shock pass-through. EUR 5Y5Y has more upside to catch up with US levels.<\/p><p><strong>T12 — Long BTP€i 10Y vs Short BTP 10Y<\/strong>: Italian linker cheap vs nominal. Real yield protection in a stagflation scenario where fiscal concerns drive nominal wider.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>Breakevens are rich here. The market is pricing a permanent energy shock, but any Hormuz resolution would trigger a violent mean-reversion. The 5Y5Y at 2.4% is already pricing significant inflation persistence — the risk is asymmetrically to the downside on any ceasefire. Long linkers is a crowded trade.<\/div><\/div>","sig":"La Rédaction 🦊"},{"t":"alert","badge":"🏗️ Supply & Fiscal","title":"Heavy Supply Week Nears End — Warsh's QT Ambitions Set the Real Test","hook":"The Treasury completed its 2Y and 5Y auctions this week without indigestion, but the real supply story isn't new issuance — it's Warsh's plans for the Fed's $6.7 trillion balance sheet. If QT accelerates, net supply to the market explodes.","authorWord":"UST 2Y and 5Y auctions cleared this week. Italy's BTP short-term auction tomorrow in focus. Warsh's QT ambitions could dramatically increase net supply. ECB PEPP runoff continues.","author":"La Rédaction 🦊","details":"<h3>📋 Auction Calendar — Today & Tomorrow<\/h3><p><strong>Today (24 April):<\/strong> Light calendar. No major EGB or UST auctions scheduled.<\/p><p><strong>Tomorrow (25 April):<\/strong><br>🇮🇹 <strong>Italy BTP Short Term auction<\/strong> — Following the spread widening to 78.8bp (close 23 Apr), demand quality will be closely monitored. Source: <a href='https://www.ansa.it/sito/notizie/topnews/2026/04/23/lo-spread-tra-btp-e-bund-chiude-poco-mosso-a-788-punti-base_c48ebf30-375e-4516-b6c4-1161bcbbfdba.html' target='_blank'>ANSA<\/a><\/p><h3>📊 Recent Auction Results<\/h3><p><strong>🇺🇸 US Treasury 2Y and 5Y Notes (this week):<\/strong> Demand was stable with adequate bid-to-cover ratios. No significant tails. The market absorbed the supply without stress, but the backdrop of rising yields and geopolitical uncertainty means upcoming auctions (including the 7Y) will be a tougher test. Source: <a href='https://www.treasurydirect.gov/instit/annceresult/press/preanre/2026/' target='_blank'>TreasuryDirect<\/a><\/p><p><strong>🇺🇸 20Y UST (last week):<\/strong> Cleared at 4.883% — a concession-heavy auction that showed some indigestion at the long end.<\/p><h3>🏗️ Supply Pipeline<\/h3><p>US Treasury issuance remains elevated to fund persistent deficits. The refunding announcement next week will be watched for any size changes. European Q2 supply calendars are also heavy, with Italy, France, and Germany all running above-average issuance to fund fiscal responses to the energy crisis.<\/p><h3>🏛️ QT Absorption — The Elephant in the Room<\/h3><p>Kevin Warsh's nomination to replace Powell brings the balance sheet debate to the forefront. The Fed's SOMA portfolio is $6.7 trillion, with QT currently running at ~$60B/month in roll-off. Warsh has advocated for <strong>more aggressive balance sheet reduction<\/strong>, which would dramatically increase net supply to the market. As Collin Martin (Schwab) noted: <em>'An abrupt shrinking of the balance sheet would likely pull up long-term yields.'<\/em> Source: <a href='https://www.schwab.com/learn/story/stock-market-update-open' target='_blank'>Schwab<\/a><\/p><p><strong>ECB PEPP runoff:<\/strong> The ECB is no longer reinvesting PEPP maturities, adding ~€20-25B/month of net EGB supply. Combined with new issuance, the market faces a wall of duration.<\/p><h3>💡 Trade Ideas<\/h3><p><strong>T13 — Short BTP 3Y ahead of tomorrow's auction<\/strong>: With spreads at 78.8bp and widening pressure, the BTP short-term auction could see weak demand. Fade the concession. Entry: short BTP 3Y at current levels, cover after auction.<\/p><p><strong>T14 — Long 7Y UST ahead of next week's auction (WI vs cash)<\/strong>: If 7Y WI trades cheap to the cash curve, position for post-auction rally. Duration: 1 week.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The BTP short-term auction will clear fine. Italy's recent issuance has been well-absorbed, and the BTP-Bund spread at 78.8bp is hardly distressed. Shorting BTP ahead of an auction is a crowded trade — everyone sees the same spread widening. The real opportunity is in the belly of the UST curve if Warsh signals a slower QT pace than feared.<\/div><\/div>","sig":"La Rédaction 🦊"},{"t":"tech","badge":"📐 Curve & Carry","title":"Bear Steepening Dominates — 2s10s Bunds Positive as Term Premium Reprices","hook":"The global yield curve is in a clear bear steepening regime: long-end yields rising faster than short-end as inflation repricing and term premium expansion overwhelm central bank anchoring at the front.","authorWord":"UST 2s10s ~41bp, bear steepening. Bund 2s10s ~96bp, steepening. Carry positive in 5Y bucket. Butterfly: belly cheap in UST, rich in Bunds. Regime: bear steepening across G7.","author":"La Rédaction 🦊","details":"<h3>📊 Curve Snapshot — Close 23 April 2026<\/h3><p><strong><strong>Curve<\/strong>:<\/strong> UST 2s10s<br><strong>Level:<\/strong> ~41bp<br><strong>Day Δ:<\/strong> ▲+1bp<br><strong>Wk Δ:<\/strong> ▲+3bp<br><strong>1Y Z-Score:<\/strong> +0.5σ<br><\/p><p><strong><strong>Curve<\/strong>:<\/strong> UST 5s30s<br><strong>Level:<\/strong> ~54bp<br><strong>Day Δ:<\/strong> ▲+2bp<br><strong>Wk Δ:<\/strong> ▲+4bp<br><strong>1Y Z-Score:<\/strong> +0.6σ<br><\/p><p><strong><strong>Curve<\/strong>:<\/strong> Bund 2s10s<br><strong>Level:<\/strong> ~96bp<br><strong>Day Δ:<\/strong> ▲+1bp<br><strong>Wk Δ:<\/strong> ▲+5bp<br><strong>1Y Z-Score:<\/strong> +0.8σ<br><\/p><p><strong><strong>Curve<\/strong>:<\/strong> Bund 5s30s<br><strong>Level:<\/strong> ~27bp<br><strong>Day Δ:<\/strong> ▲+2bp<br><strong>Wk Δ:<\/strong> ▲+3bp<br><strong>1Y Z-Score:<\/strong> +0.4σ<br><\/p><p><strong><strong>Curve<\/strong>:<\/strong> Gilt 2s10s<br><strong>Level:<\/strong> ~60bp<br><strong>Day Δ:<\/strong> ▲+2bp<br><strong>Wk Δ:<\/strong> ▲+6bp<br><strong>1Y Z-Score:<\/strong> +0.7σ<br><\/p><h3>🦋 Butterfly Analysis<\/h3><p><strong>UST 2s5s10s:<\/strong> The belly (5Y) is slightly cheap vs wings. With carry positive in the 5Y bucket and auction supply concentrating there, the cheapness could persist near-term but mean-revert post-auction.<\/p><p><strong>Bund 2s5s10s:<\/strong> The belly is marginally rich. The ECB front-end repricing (June hike) has pulled the 2Y up, while the 10Y is anchored by flight-to-quality. This creates a flattening bias in the belly.<\/p><h3>💰 Carry & Roll-Down (3-Month Horizon)<\/h3><p><strong><strong>Bucket<\/strong>:<\/strong> Bund 2Y<br><strong>Carry (bp):<\/strong> ~5<br><strong>Roll-Down (bp):<\/strong> ~3<br><strong>Total (bp):<\/strong> ~8<br><\/p><p><strong><strong>Bucket<\/strong>:<\/strong> Bund 5Y<br><strong>Carry (bp):<\/strong> ~12<br><strong>Roll-Down (bp):<\/strong> ~8<br><strong>Total (bp):<\/strong> ~20<br><\/p><p><strong><strong>Bucket<\/strong>:<\/strong> Bund 10Y<br><strong>Carry (bp):<\/strong> ~8<br><strong>Roll-Down (bp):<\/strong> ~5<br><strong>Total (bp):<\/strong> ~13<br><\/p><p><strong><strong>Bucket<\/strong>:<\/strong> UST 5Y<br><strong>Carry (bp):<\/strong> ~10<br><strong>Roll-Down (bp):<\/strong> ~7<br><strong>Total (bp):<\/strong> ~17<br><\/p><p><strong><strong>Bucket<\/strong>:<\/strong> UST 10Y<br><strong>Carry (bp):<\/strong> ~6<br><strong>Roll-Down (bp):<\/strong> ~4<br><strong>Total (bp):<\/strong> ~10<br><\/p><p><strong>Optimal carry:<\/strong> The 5Y bucket in both Bund and UST offers the best risk-adjusted carry. For investors willing to take curve risk, the 2s10s steepener has positive carry AND directional alignment with the bear steepening regime.<\/p><h3>📈 Curve Regime<\/h3><p>We are in a <strong>bear steepening<\/strong> regime: long-end yields rising faster than short-end. This is typically associated with:<\/p><ul><li>Rising inflation expectations (check — Hormuz-driven)<\/li><li>Term premium expansion (check — QT + fiscal supply)<\/li><li>Growth resilience (check in US, not EZ)<\/li><\/ul><p>The historical analogy is 2022-2023, where bear steepening preceded both the peak in yields and the eventual bull flattening. We're not at the inflection point yet. Source: <a href='https://thebondbeat.substack.com/p/weekly-observations-042026-gotbonds' target='_blank'>The Bond Beat<\/a><\/p><h3>💡 Trade Ideas<\/h3><p><strong>T15 — Long 2s10s Bund steepener (carry-positive)<\/strong>: Entry: ~96bp, Target: 110bp, Stop: 85bp. Positive carry of ~5bp/quarter. This trade profits from continued bear steepening AND ECB front-end anchoring.<\/p><p><strong>T16 — Short UST 5s30s flattener (contrarian)<\/strong>: If the Fed signals any accommodation, the belly rallies harder than the long end. Entry: ~54bp, Target: 40bp, Stop: 65bp.<\/p><p><strong>T17 — Long Bund butterfly (2s5s10s)<\/strong>: Belly is rich but if ECB hikes, 5Y outperforms. Entry: current level, Target: 5bp richer belly, Stop: 5bp cheaper. Small size — this is a positioning trade.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>The 2s10s Bund steepener at 96bp is already pricing a lot of the ECB-Fed divergence. If Hormuz opens, the front-end rallies hard (ECB cuts) while the long-end sells off (growth recovery) — that's steepening. But if Hormuz escalates further, we get a flight-to-quality that flattens everything. The asymmetric risk is to the flattening side on any bad news.<\/div><\/div>","sig":"La Rédaction 🦊"},{"t":"analysis","badge":"🔄 RV & Spreads","title":"BTP-Bund Holds 78.8bp on Hormuz Fear — OAT Widening Signals Contagion Beyond Italy","hook":"The BTP-Bund spread closed at 78.8bp, barely changed on the day, but the OAT-Bund spread is quietly widening to levels not seen since the French fiscal episode. Periphery stress is no longer just an Italy story.","authorWord":"BTP-Bund 78.8bp (close 23 Apr). OAT-Bund ~64bp, widening. Bonos-Bund ~44bp. ASW spreads: BTP cheap. Duration-neutral: OAT vs BTP intra-EU RV looks attractive.","author":"La Rédaction 🦊","details":"<h3>📊 Spread Table — Close 23 April 2026<\/h3><p><strong><strong>Spread vs Bund 10Y<\/strong>:<\/strong> 🇮🇹 BTP-Bund<br><strong>Level (bp):<\/strong> 78.8<br><strong>Day Δ:<\/strong> ▲+1.3bp<br><strong>Wk Δ:<\/strong> ▲+5bp<br><strong>1Y Z-Score:<\/strong> +0.7σ<br><\/p><p><strong><strong>Spread vs Bund 10Y<\/strong>:<\/strong> 🇫🇷 OAT-Bund<br><strong>Level (bp):<\/strong> ~64<br><strong>Day Δ:<\/strong> ▲+2bp<br><strong>Wk Δ:<\/strong> ▲+6bp<br><strong>1Y Z-Score:<\/strong> +0.9σ<br><\/p><p><strong><strong>Spread vs Bund 10Y<\/strong>:<\/strong> 🇪🇸 Bonos-Bund<br><strong>Level (bp):<\/strong> ~44<br><strong>Day Δ:<\/strong> ▲+1bp<br><strong>Wk Δ:<\/strong> ▲+3bp<br><strong>1Y Z-Score:<\/strong> +0.5σ<br><\/p><p><strong><strong>Spread vs Bund 10Y<\/strong>:<\/strong> 🇬🇧 Gilt-Bund<br><strong>Level (bp):<\/strong> ~184<br><strong>Day Δ:<\/strong> ▲+2bp<br><strong>Wk Δ:<\/strong> ▲+5bp<br><strong>1Y Z-Score:<\/strong> +0.6σ<br><\/p><p><strong><strong>Spread vs Bund 10Y<\/strong>:<\/strong> EGB vs UST (10Y)<br><strong>Level (bp):<\/strong> ~-129<br><strong>Day Δ:<\/strong> ◆ flat<br><strong>Wk Δ:<\/strong> ▲+3bp<br><strong>1Y Z-Score:<\/strong> +0.3σ<br><\/p><p><em>Sources: <a href='https://www.ansa.it/sito/notizie/topnews/2026/04/23/lo-spread-tra-btp-e-bund-chiude-poco-mosso-a-788-punti-base_c48ebf30-375e-4516-b6c4-1161bcbbfdba.html' target='_blank'>ANSA<\/a>, <a href='https://quifinanza.it/economia/finanza/spread-btp-bund-22-aprile-2026/974867/' target='_blank'>QuiFinanza<\/a>, <a href='https://quifinanza.it/economia/finanza/spread-btp-bund-23-aprile-2026/975045/' target='_blank'>QuiFinanza 23 Apr<\/a><\/em><\/p><h3>🔍 What's Moving Spreads<\/h3><p><strong>PRIMARY: Hormuz + ECB stagflation.<\/strong> The combination of energy shock (inflation) and PMI contraction (growth) is toxic for periphery. The ECB hiking into a recession disproportionately hurts high-debt nations. BTP opened at 79bp before settling to 78.8bp at close.<\/p><p><strong>SECONDARY: French fiscal concerns.<\/strong> OAT-Bund widening to ~64bp is the real story this week. France's fiscal trajectory is under scrutiny, and the spread hasn't been this wide since the post-election episode. This is no longer just an Italy story.<\/p><h3>📊 ASW Spreads<\/h3><p>BTP ASW levels remain cheap relative to swaps, reflecting the premium investors demand for Italian credit risk. OAT ASW also widening. The swap basis is a useful indicator — when cash bonds underperform swaps, it signals real-money selling, not just hedge fund positioning.<\/p><h3>🔄 Duration-Neutral Opportunities<\/h3><p><strong>OAT vs BTP (intra-EU):<\/strong> The OAT-Bund spread at ~64bp vs BTP-Bund at ~78.8bp gives a BTP-OAT spread of only ~15bp. This is tight by historical standards. If contagion spreads, BTP-OAT could widen to 20-25bp. Conversely, if OAT continues to widen faster, the BTP-OAT spread compresses — which is the trade.<\/p><h3>💡 Trade Ideas<\/h3><p><strong>T18 — Long OAT / Short BTP (DV01-neutral)<\/strong>: French spread widening is the underappreciated story. BTP-OAT at ~15bp is historically tight. If contagion broadens, OAT continues to widen faster. Entry: BTP-OAT at 15bp, Target: 10bp (OAT outperforming), Stop: 20bp.<\/p><p><strong>T19 — Short BTP-Bund tightener (conditional)<\/strong>: Only if Hormuz ceasefire holds. Spread could compress 10bp on de-escalation. Entry: 78.8bp, Target: 68bp, Stop: 85bp.<\/p><p><strong>T20 — Long EGB vs Short UST (currency-hedged)<\/strong>: UST 10Y at 4.30% vs Bund at 3.01% = ~129bp pick-up. After EUR/USD hedge cost (~160bp annualized), it's negative carry. But if the ECB hikes and Fed holds, the spread compresses on the rate side. This is a structural trade for Q2-Q3.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Sage 🦎<\/div><div class='dissent-text'>The OAT widening is a head-fake. France's fiscal fundamentals haven't changed — it's the same spread widening we saw in the Lebanese ceasefire news flow, which reversed within days. The BTP-OAT trade is picking up pennies in front of a steamroller. If Hormuz escalates, BOTH OAT and BTP widen, and the BTP-OAT spread widens too (Italy suffers more). Long OAT / Short BTP is the wrong direction.<\/div><\/div>","sig":"La Rédaction 🦊"},{"t":"alert","badge":"🌍 Geopol & Risk Overlay","title":"RISK-OFF — Hormuz Seizures Shatter Ceasefire Calm, Oil +$10 in a Week","hook":"Iran's commando raid on a cargo ship and Trump's 'shoot to kill' order mark a decisive escalation. The ceasefire is crumbling. Oil is up $10 from last week's lows. This is no longer a tail risk — it's the base case.","authorWord":"Risk tag: 🔴 RISK-OFF. Iran stormed cargo ship in Hormuz. Trump orders Navy to destroy mine-laying boats. Brent $102+. EU PMI contraction. Stagflation trade live.","author":"La Rédaction 🦊","details":"<h3>🔴 Risk Tag: RISK-OFF<\/h3><h3>⚡ Escalation Timeline (Last 48h)<\/h3><p><strong>23 April:<\/strong> Iran released video of its commandos storming a large cargo ship in the Strait of Hormuz — a deliberate show of force demonstrating control over the chokepoint. Source: <a href='https://www.reuters.com/business/energy/oil-prices-edge-lower-with-no-progress-us-iran-talks-hormuz-shipping-still-2026-04-23/' target='_blank'>Reuters<\/a><\/p><p><strong>23 April:<\/strong> President Trump posted on social media that he ordered the U.S. Navy 'to shoot and kill any boat' mining the Strait. Source: <a href='https://www.reuters.com/business/energy/oil-prices-edge-lower-with-no-progress-us-iran-talks-hormuz-shipping-still-2026-04-23/' target='_blank'>Reuters<\/a><\/p><p><strong>23 April:<\/strong> Peace talks collapsed. Iran's foreign minister extended the blockade notification. The two-week ceasefire framework is falling apart.<\/p><p><strong>Result:<\/strong> Brent crude surged past $102/bbl, up ~$10 from last Friday's lows that were based on ceasefire optimism. Analysts at Again Capital note the market is being 'buffeted by alternating news reports' — Trump extending ceasefire then threatening to sink Iranian ships. Source: <a href='https://www.reuters.com/business/energy/oil-prices-edge-lower-with-no-progress-us-iran-talks-hormuz-shipping-still-2026-04-23/' target='_blank'>Reuters<\/a><\/p><h3>🏛️ Flight-to-Quality Assessment<\/h3><p>The traditional safe-haven bid for Bunds and USTs is <strong>partially offset<\/strong> by inflation fears. Bonds are not providing the usual risk-off protection because the geopolitical shock is inflationary, not deflationary. The result: positive correlation between stocks and bonds — both can sell off together. Wall Street closed lower on 23 April: S&P 500 -0.41%, Dow -0.33%, Nasdaq -0.89%. Source: <a href='https://en.ilsole24ore.com/art/stock-exchange-latest-news-tokyo-record-nikkei-index-first-time-above-60000-AIxWOeeC' target='_blank'>Il Sole 24 Ore<\/a><\/p><h3>🌍 Active Geopolitical Arcs<\/h3><ul><li><strong>US-Iran / Hormuz:<\/strong> PRIMARY DRIVER. Strait effectively closed. Military escalation risk high.<\/li><li><strong>Israel-Lebanon ceasefire extension:<\/strong> Trump announced extension but market treating as peripheral to Hormuz.<\/li><li><strong>US domestic politics:<\/strong> Supreme Court ruling on Fed Gov. Cook firing imminent. Warsh confirmation proceeding.<\/li><\/ul><h3>🔥 Periphery Risk<\/h3><p>BTP-Bund at 78.8bp — elevated but not yet at crisis levels (100bp+). The ECB's June hike pricing actually helps periphery by demonstrating inflation-fighting credibility, but the growth hit from the energy shock disproportionately hurts high-debt nations. Watch for BTP-Bund breaking 85bp as a trigger for periphery-specific trades.<\/p><h3>🛢️ Energy-Inflation Transmission<\/h3><p>Brent at $102-106 adds ~0.5-0.8pp to headline inflation over 3-6 months. Jet fuel supplies in Europe are already sliding. The 10Y breakeven response has been immediate and significant across all major markets.<\/p><h3>💡 Trade Ideas<\/h3><p><strong>T21 — Long Bund 10Y / Short BTP 10Y (risk-off periphery blowout)<\/strong>: Entry: spread at 78.8bp, Target: 90bp, Stop: 72bp. DV01-neutral. Trigger: further Hormuz escalation.<\/p><p><strong>T22 — Long UST straddle (10Y, 1-month)<\/strong>: Volatility is underpriced. Any resolution OR major escalation moves yields 15-20bp. ATM ~4.30 strike, cost ~25bp, break-even if yield moves ±25bp. Source: <a href='https://www.schwab.com/learn/story/stock-market-update-open' target='_blank'>Schwab<\/a> (VIX at 19.39)<\/p><p><strong>T23 — Long linkers (EU inflation protection)<\/strong>: Buy BTP€i or OAT€i as direct hedge against energy-driven inflation persistence. Outright long, 10Y maturity.<\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Blaise 🧮<\/div><div class='dissent-text'>We've been in 'Risk-Off' for weeks and the BTP-Bund spread hasn't broken 80bp convincingly. The market is pricing a resolution that keeps the status quo — Hormuz neither fully closed nor fully open. The marginal escalation from Trump's rhetoric is diminishing. Long Bund / Short BTP here is chasing a trade that's already run 15bp in our favor from the lows.<\/div><\/div>","sig":"La Rédaction 🦊"},{"t":"strategy","badge":"⚖️ Desk Vote","title":"17 Trades Validated — Bund Steepener #1 Conviction in Stagflation Regime","hook":"The council retained 17 of 23 proposed trades after four-way validation. The Bund 2s10s steepener is the top pick: carry-positive, regime-aligned, with a 3-month horizon that gives time to be wrong.","authorWord":"17/23 retained. Top pick: T15 Bund 2s10s steepener. Bear steepening regime. ECB cornered. Hormuz drives everything.","author":"La Rédaction 🦊","details":"<h3>🏆 Top 3 Trades — Council Conviction<\/h3><div><b>★ T15 — Long 2s10s Bund Steepener (Carry-Positive)<\/b><p>Entry: ~96bp | Target: 110bp | Stop: 85bp | Horizon: 3 months | Carry: ~5bp/quarter. Near-unanimous approval. Bear steepening regime + ECB front-end anchoring = best risk-adjusted expression.<\/p><span>★ Near-Unanimous (3 approve + 1 amend)<\/span><\/div><div><b>T13 — Short BTP 3Y Pre-Auction<\/b><p>Tactical pre-auction trade with clear catalyst (tomorrow's BTP short-term auction). Only unanimous trade in the book. Classic brief material.<\/p><span>✅ UNANIMOUS (4/4)<\/span><\/div><div><b>T1 — Short Schatz vs Long UST 2Y (ECB-Fed Divergence)<\/b><p>Core macro theme: EZ PMI crash + resilient US data. 2Y rate differential widening. 4-6 week horizon.<\/p><span>3/4 Approve<\/span><\/div><h3>🐂 Bull Scenario — Hormuz Ceasefire Holds<\/h3><p>If a durable ceasefire materializes: oil drops $15-20, Bund rally as inflation fears ease, BTP-Bund compresses to 70bp, UST 10Y back to 4.10%. <strong>Trade:<\/strong> Long UST 10Y (T3+T4) with stop at 4.45%, target 4.10%.<\/p><h3>🐻 Bear Scenario — Hormuz Full Escalation<\/h3><p>If military confrontation intensifies: oil above $120, ECB emergency hike, periphery blowout (BTP-Bund 100bp+), flight to Bunds/UST but inflation capping gains. <strong>Trade:<\/strong> Long Bund / Short BTP (T21) targeting 90bp spread.<\/p><h3>🎲 Wild Card — Warsh QT Acceleration<\/h3><p>Low probability (~15%) but high impact: if Warsh signals faster QT at confirmation, UST long-end sells off hard. 30Y could gap to 5%. <strong>Trade:<\/strong> Long UST 10Y straddle (T22) — profits from any large move.<\/p><h3>📅 Catalysts to Watch<\/h3><ul><li><strong>Today:<\/strong> Final UMich Consumer Sentiment (15:00 BST) — inflation expectations key<\/li><li><strong>Today:<\/strong> Ifo Business Climate (Germany)<\/li><li><strong>Tomorrow:<\/strong> BTP Short-Term auction — demand quality test<\/li><li><strong>Next week:<\/strong> FOMC meeting (Apr 30) + ECB meeting (Apr 30)<\/li><li><strong>Ongoing:<\/strong> Hormuz ceasefire headlines — single biggest driver<\/li><\/ul><h3>📊 Conviction Matrix<\/h3><p><strong><strong>Trade<\/strong>:<\/strong> T15 Bund 2s10s steepener<br><strong>Probability:<\/strong> 65%<br><strong>Payout:<\/strong> 14bp<br><strong>Score:<\/strong> ★★★★★<br><\/p><p><strong><strong>Trade<\/strong>:<\/strong> T13 Short BTP 3Y<br><strong>Probability:<\/strong> 55%<br><strong>Payout:<\/strong> 5bp<br><strong>Score:<\/strong> ★★★★<br><\/p><p><strong><strong>Trade<\/strong>:<\/strong> T1 Schatz vs UST 2Y<br><strong>Probability:<\/strong> 60%<br><strong>Payout:<\/strong> 20bp<br><strong>Score:<\/strong> ★★★★<br><\/p><p><strong><strong>Trade<\/strong>:<\/strong> T21 Bund vs BTP<br><strong>Probability:<\/strong> 40%<br><strong>Payout:<\/strong> 12bp<br><strong>Score:<\/strong> ★★★<br><\/p><p><strong><strong>Trade<\/strong>:<\/strong> T9 5Y5Y inflation swap<br><strong>Probability:<\/strong> 50%<br><strong>Payout:<\/strong> 20bp<br><strong>Score:<\/strong> ★★★★<br><\/p><div class='dissent'><div class='dissent-label'>⚡ Dissenting View — Henry 🦉<\/div><div class='dissent-text'>The book is too skewed toward bear steepening and ECB hawkishness. The EZ is in contraction — if the ECB blinks and pauses, half these trades reverse. The contrarian position (bull flattening on growth collapse) is underrepresented. T16 (UST 5s30s flattener) should be sized larger as a hedge.<\/div><\/div>","sig":"La Rédaction 🦊"},{"t":"analysis","badge":"🏛️ Verdict du Conseil","title":"22 Trades Audités — 17 Retenus, 5 Éliminés","hook":"Quatre agents ont vote sur chaque trade idea de cette edition. Chaque trade est presente avec son rationale complet, les votes individuels (Iris, Dante, Felix, Lyra), et la decision finale avec la raison.","authorWord":"17 trades solides retenus. 5 elimines (doublons, parametres manquants, contradictions). Le detail de chaque verdict ci-dessous.","author":"La Rédaction 🦊","details":"<h3>✅ Trades Retenus (17/22)<\/h3><div><div><div><b>Short Schatz vs Long UST 2Y (ECB-Fed divergence)<\/b><span>✅❌✅✅<\/span><\/div><div>Carte macro-pulse • T1<\/div><\/div><p>Clean cross-market divergence trade. ECB-Fed policy gap widening on PMI shock.<\/p><div>3✅ 1❌ — 3/4 approve — Dante's dovish ECB concern noted but overruled<\/div><\/div><div><div><div><b>Long Bund 10Y straddle pre-Ifo<\/b><span>✅⚠️✅✅<\/span><\/div><div>Carte macro-pulse • T2<\/div><\/div><p>Event-driven vol trade with Ifo catalyst. Dante flags expensive vol — use ratio spread if available.<\/p><div>3✅ 1⚠️ — 3 approve + 1 amend — keep with vol caution<\/div><\/div><div><div><div><b>Long UST 10Y — Fade UMich + Ceasefire Bet (merged)<\/b><span>✅❌✅✅<\/span><\/div><div>Carte core-yields • T3+T4<\/div><\/div><p>Two triggers for same direction: (1) UMich inflation expectations overreact → fade, (2) Hormuz ceasefire → UST rally. Merge into single position with two catalysts. Small size — contrarian.<\/p><div>3✅ 1❌ — Merged T3+T4 per Iris/Felix. 3 approve direction, 1 reject (Dante: ceasefire unlikely)<\/div><\/div><div><div><div><b>Short Bund 30Y / Long Bund 2Y (bear flattener)<\/b><span>✅❌✅✅<\/span><\/div><div>Carte core-yields • T5<\/div><\/div><p>ECB June hike repricing flattens the curve. DV01-neutral. Contradicts T15 steepener — both kept as different curve expressions.<\/p><div>3✅ 1❌ — 3/4 approve — Dante's bull steepening risk noted<\/div><\/div><div><div><div><b>Long Gilt 10Y vs Short UST 10Y<\/b><span>⚠️⚠️✅✅<\/span><\/ letes inflation overlay with T9 and T11.<\/p><div>2✅ 2⚠️ — 2 approve + 2 amend — kept as inflation protection<\/div><\/div><h3>❌ Trades Éliminés (5/22)<\/h3><div><div><div><b>Short Euribor Jun-26 (ECB hike trade)<\/b><span>⚠️❌❌✅<\/span><\/div><div>Carte cb-radar • T7<\/div><\/div><p>ECB hike in June priced ~80%. Short Euribor captures remaining 20bp.<\/p><div>❌ 2 reject — EZ recession makes hike unlikely; overlaps T1/T8<\/div><div>1✅ 1⚠️ 2❌<\/div><\/div><div><div><div><b>Long Fed Funds / Short Euribor (divergence)<\/b><span>❌❌⚠️✅<\/span><\/div><div>Carte cb-radar • T8<\/div><\/div><p>Same ECB-Fed divergence as T1 via front-end.<\/p><div>❌ 2 reject — Duplicate of T1, which has better instrument specificity<\/div><div>1✅ 1⚠️ 2❌<\/div><\/div><div><div><div><b>Long BE flattener 5Y vs 10Y EUR<\/b><span>⚠️⚠️❌⚠️<\/span><\/div><div>Carte inflation-dynamics • T10<\/div><\/div><p>Breakeven flattener on inflation curve.<\/p><div>❌ 0 clean approve — conceptually conflicts with ECB hike steepening. Too niche<\/div><div>0✅ 3⚠️ 1❌<\/div><\/div><div><div><div><b>Long Bund butterfly 2s5s10s<\/b><span>⚠️⚠️❌✅<\/span><\/div><div>Carte curve-carry • T17<\/div><\/div><p>Third Bund curve trade — diminishing reader value.<\/p><div>❌ 1 reject + 3 amend — too tactical, crowded curve card<\/div><div>1✅ 2⚠️ 1❌<\/div><\/div><div><div><div><b>BTP-Bund tightener (conditional ceasefire)<\/b><span>⚠️⚠️⚠️⚠️<\/span><\/div><div>Carte rv-spreads • T19<\/div><\/div><p>Ceasefire would compress BTP-Bund spread.<\/p><div>❌ CONTRADICTS T21 (widener). Ceasefire probability <25%. Eliminated to resolve contradiction<\/div><div>0✅ 4⚠️ <\/div><\/div><h3>💬 Le Conseil Parle<\/h3><div><div>Dante 🔥<\/div><div>The ECB hiking into a PMI crash to 48.6 is the consensus path — and consensus is usually wrong. The dovish pivot risk is severely underpriced. Half the trades in this book bleed if Hormuz opens or the ECB blinks.<\/div><\/div><div><div>Iris 👁️<\/div><div>Quality control flagged T1=T8 duplication and T3=T4 overl   let startY=0,axis='';
  document.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY;startTime=Date.now();deltaX=0;axis='';dragging=true;cards[cur].classList.remove('anim');},{passive:true});
  document.addEventListener('touchmove',e=>{if(!dragging)return;const dx=e.touches[0].clientX-startX;const dy=e.touches[0].clientY-startY;if(!axis){if(Math.abs(dx)>8||Math.abs(dy)>8){axis=Math.abs(dx)>Math.abs(dy)?'x':'y';}else return;}if(axis==='y')return;deltaX=dx;cards[cur].style.transform=`translate(-50%,-50%) translateX(${deltaX}px) rotate(${deltaX*0.012}deg)`;var p=Math.min(Math.abs(deltaX)/200,1);var sc=0.93+p*0.07;var op=0.4+p*0.6;var nxt=deltaX<0?cards[cur+1]:cards[cur-1];if(nxt){nxt.style.transform='translate(-50%,-50%) scale('+sc+')';nxt.style.opacity=op;}},{passive:true});
  document.addEventListener('touchend',e=>{if(!dragging)return;dragging=false;if(axis==='y'){axis='';return;}axis='';const card=cards[cur];card.classList.add('anim');if(cards[cur+1])cards[cur+1].classList.add('anim');if(cards[cur-1])cards[cur-1].classList.add('anim');const velocity=Math.abs(deltaX)/(Date.now()-startTime);const threshold=velocity>0.5?30:60;if(deltaX>threshold&&cur===0){window.location.href='../index.html';}else if(deltaX<-threshold&&cur===total-1){window.location.href='../index.html';}else if(deltaX<-threshold&&cur<total-1){cur++;update();}else if(deltaX>threshold&&cur>0){cur--;update();}else{card.style.transform='';}},{passive:true});
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&cur<total-1){cur++;update();}if(e.key==='ArrowLeft'&&cur>0){cur--;update();}});
  document.addEventListener('click',e=>{if(e.target.id==='restart')go(0);const article=e.target.closest('.home-article');if(article){const idx=parseInt(article.dataset.goto);if(!isNaN(idx))go(idx);}});
  /* === DESKTOP SPLIT-VIEW === */
  let dtShell=null, dtSelected=0;
  function buildDesktop(){
    if(dtShell)return;
    dtShell=document.createElement('div');
    dtShell.className='desktop-shell';
    // Sidebar
    const sb=document.createElement('nav');
    sb.className='dt-sidebar';
    const logoDate=DATA[0]&&DATA[0].home?`<div class="dt-logo">Rates & Inflation Morning Brief</div><div class="dt-date">${DATA[0].date||'24 Avril 2026'}</div>`:`<div class="dt-logo">Rates & Inflation Morning Brief</div><div class="dt-date">24 Avril 2026</div>`;
    sb.innerHTML=logoDate;
    DATA.forEach((d,i)=>{
      const item=document.createElement('div');
      item.className='dt-nav-item'+(i===0?' dt-selected':'');
      item.tabIndex=0;
      item.dataset.idx=i;
      const emoji=d.home?'📰':d.end?'✅':(d.badge||'').split(' ')[0]||'📄';
      const label=d.home?'Accueil':d.end?'Fin':(d.badge||'').split(' ').slice(1).join(' ')||'';
      const title=d.home?'Sommaire':d.end?'Briefing terminé':d.title||'';
      item.innerHTML=`<div class="dt-nav-badge">${emoji}</div><div class="dt-nav-info"><div class="dt-nav-label">${label}</div><div class="dt-nav-title">${title}</div></div><div class="dt-nav-arrow">›</div>`;
      item.addEventListener('click',()=>selectDesktop(i));
      sb.appendChild(item);
    });
    // Reader
    const rd=document.createElement('div');
    rd.className='dt-reader';
    rd.innerHTML='<div class="dt-reader-inner"></div>';
    dtShell.appendChild(sb);
    dtShell.appendChild(rd);
    document.body.appendChild(dtShell);
    selectDesktop(0);
  }
  function selectDesktop(idx){
    dtSelected=idx;
    const items=dtShell.querySelectorAll('.dt-nav-item');
    items.forEach((it,i)=>it.classList.toggle('dt-selected',i===idx));
    const d=DATA[idx];
    const inner=dtShell.querySelector('.dt-reader-inner');
    if(d.home){
      const arts=d.articles?d.articles.map(a=>`<div class="dt-nav-item" style="cursor:pointer;opacity:.7;padding:10px 14px;margin-bottom:4px;border-radius:10px;border:1px solid rgba(255,255,255,.06);" onclick="selectDesktop(${a.idx})"><div class="dt-nav-badge">${a.badge.split(' ')[0]}</div><div class="dt-nav-info"><div class="dt-nav-label">${a.badge.split(' ').slice(1).join(' ')}</div><div class="dt-nav-title">${a.title}</div></div><div class="dt-nav-arrow">›</div></div>`).join(''):'';
      inner.innerHTML=`<div class="dt-r-home-henry"><div class="label">🦊 L'Édito du Jour</div><div class="text">${d.henryWord||''}</div></div>${arts}`;
    } else if(d.end){
      inner.innerHTML=`<div style="text-align:center;padding:60px 0;"><div style="font-size:3.5rem;margin-bottom:16px;">🎉</div><h2 style="font-size:1.6rem;font-weight:800;margin-bottom:12px;">Briefing terminé !</h2><p style="color:var(--muted);font-size:1rem;margin-bottom:24px;line-height:1.5;">Vous avez parcouru le briefing du jour. À demain !</p><a href="../index.html" style="display:inline-block;padding:12px 32px;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;">📰 Toutes les éditions</a></div>`;
    } else {
      const authorHtml=d.authorWord?`<div class="dt-r-author"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author||''}</div></div>`:'';
      inner.innerHTML=`<span class="dt-r-badge ${d.t||''}">${d.badge||''}</span><h1 class="dt-r-title">${d.title||''}</h1>${authorHtml}<div class="dt-r-hook">${d.hook||''}</div><div class="dt-r-body">${d.details||''}</div><div class="dt-r-sig">Rates & Inflation Morning Brief — 24 Avril 2026</div>`;
    }
    dtShell.querySelector('.dt-reader').scrollTop=0;
    // Scroll sidebar item into view
    items[idx]&&items[idx].scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  function destroyDesktop(){
    if(dtShell){dtShell.remove();dtShell=null;}
  }
  function checkDesktop(){
    if(window.innerWidth>=900){
      deck.style.display='none';
      buildDesktop();
      dtShell.style.display='';
    } else {
      if(dtShell)dtShell.style.display='none';
      deck.style.display='';
      update(false);
    }
  }
  // Keyboard nav for desktop
  document.addEventListener('keydown',e=>{
    if(window.innerWidth<900)return;
    if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();if(dtSelected<DATA.length-1)selectDesktop(dtSelected+1);}
    if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();if(dtSelected>0)selectDesktop(dtSelected-1);}
  });
  checkDesktop();window.addEventListener('resize',checkDesktop);
  // Theme toggle
  (function(){
    const btn=document.getElementById('themeToggle');
    const saved=localStorage.getItem('theme');
    if(saved==='light'){document.documentElement.classList.add('light');btn.textContent='☀️';}
    btn.addEventListener('click',()=>{
      const isLight=document.documentElement.classList.toggle('light');
      btn.textContent=isLight?'☀️':'🌙';
      localStorage.setItem('theme',isLight?'light':'dark');
    });
  })();
  </script>
</body>
</html>
