<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Le Flash Juridique — 8 Mai 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    /* Scenario Probability Card */
    .scenario-block { margin: 1em 0; padding: 0.8em 1em; border-left: 4px solid #ffd700; border-radius: 0 8px 8px 0; background: rgba(255,215,0,0.05); }
    .scenario-block h3 { margin: 0 0 0.3em 0; font-size: 1.05em; display: flex; justify-content: space-between; align-items: center; }
    .scenario-block .proba { font-size: 1.3em; font-weight: bold; color: #ffd700; }
    .scenario-block p { margin: 0.2em 0; font-size: 0.92em; }
    .scenario-block .votes { font-size: 0.8em; opacity: 0.7; font-style: italic; }
    .consensus { margin-top: 1.2em; padding: 0.6em; border-radius: 8px; background: rgba(0,200,100,0.08); }
    .dissent { margin-top: 0.4em; padding: 0.6em; border-radius: 8px; background: rgba(255,80,80,0.08); }

    html.light .details div[style*="background"], html.light .details p[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Light mode: override inline white colors in trade cards */
    html.light .details p[style], html.light .details b[style], html.light .details span[style], html.light .details div[style] { color: rgba(0,0,0,.85) !important; }
    html.light .details div[style*="border-left:3px solid #f59e0b"] { background: rgba(245,158,11,.08) !important; }
    html.light .details div[style*="border-left:3px solid #10b981"] { background: rgba(16,185,129,.08) !important; }
    html.light .details div[style*="border-left:3px solid #ff4757"] { background: rgba(255,71,87,.06) !important; }
    html.light .details div[style*="color:#f59e0b"] { color: #b45309 !important; }
    html.light .details div[style*="color:#10b981"] { color: #047857 !important; }
    html.light .details div[style*="color:#ff4757"] { color: #dc2626 !important; }
    html.light .details h3 { color: #1a1a2e !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details p[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }
      .dt-reader .dt-r-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; }
      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }

  <script>
  const DATA = [{"t":"home","home":true,"date":"8 Mai 2026","henryWord":"Non-cumul indemnitaire unifié par la chambre sociale, vote électronique actualisé au JORF, loyauté dans la négociation collective sanctifiée, contrat CESA sécurisé pour l'ESS et programme CNIL 2026 tourné vers l'IA : cette édition du vendredi place le dirigeant et le praticien face à un droit qui clarifie les responsabilités tout en intensifiant la pression réglementaire. L'arrêt du 6 mai sur le licenciement, publié au Bulletin, redéfinit la cartographie du risque indemnitaire — une lecture indispensable pour tout employeur confronté au contentieux prud'homal.","articles":[{"badge":"⚖️ L'Arrêt du Jour","title":"Non-cumul indemnités : un seul plafond pour le dirigeant confronté au contentieux prud'homal","idx":1},{"badge":"📜 Nouveaux Textes","title":"Vote par correspondance électronique : le décret de mise à jour entre en vigueur","idx":2},{"badge":"🗣️ Le Traducteur","title":"Loyauté dans la négociation collective : l'employeur ne fixe pas seul la date de clôture","idx":3},{"badge":"💼 Business & Droit","title":"Le contrat CESA dans l'ESS : la Cour d'appel de Montpellier clarifie le statut d'entrepreneur salarié","idx":4},{"badge":"🛡️ Radar à Risques","title":"CNIL 2026 : IA en entreprise — les contrôles se préparent, la conformité n'attend pas l'AI Act","idx":5},{"badge":"🔧 L'Outil Pratique","title":"Village de la Justice : la plateforme gratuite de veille juridique et d'emploi pour les professionnels du droit","idx":6}],"disclaimer":"Le contenu de cette newsletter est généré avec l'assistance d'intelligence artificielle. Il est fourni à titre purement informatif et ne constitue en aucun cas une consultation juridique ou un conseil personnalisé. © 2026 La Rédaction 🦊 — Tous droits réservés."},{"t":"alert","badge":"⚖️ L'Arrêt du Jour","title":"Non-cumul indemnités : un seul plafond pour le dirigeant confronté au contentieux prud'homal","hook":"Cass. soc., 6 mai 2026, n° 25-12.673 — L'indemnité pour procédure irrégulière ne se cumule plus avec celle du licenciement sans cause réelle et sérieuse","authorWord":"La chambre sociale unifie le régime indemnitaire du licenciement abusif : quand le motif manque, seule l'indemnité barémisée de l'art. L. 1235-3 est due, quel que soit l'effectif ou l'ancienneté. L'indemnité d'un mois pour irrégularité formelle disparaît en cas de licenciement sans cause. Les autres chefs de condamnation restent cumulables.","author":"Henry 🦉","details":"<p>La chambre sociale de la Cour de cassation publie un arrêt de principe qui clarifie durablement le contentieux indemnitaire post-licenciement. Au visa des articles L. 1235-2 alinéa 4, L. 1235-3 dernier alinéa et L. 1235-5 du code du travail, elle pose que <strong>l'indemnité pour inobservation de la procédure de licenciement ne se cumule pas avec l'indemnité pour licenciement sans cause réelle et sérieuse<\/strong>, quelles que soient l'ancienneté du salarié et la taille de l'entreprise (<a href='https://www.courdecassation.fr/decision/69fad6a6cdc6046d47c06d5e' target='_blank'>Cass. soc., 6 mai 2026, n° 25-12.673,Publié au Bulletin<\/a>).<\/p><p><strong>Les faits.<\/strong> Un employeur avait été condamné par la cour d'appel à verser deux indemnités cumulatives : l'une au titre du licenciement sans cause réelle et sérieuse (selon le barème macron), l'autre pour irrégularité de la procédure de licenciement (un mois de salaire). La question portait sur la légalité de ce cumul.<\/p><p><strong>La décision.<\/strong> La Cour casse l'arrêt d'appel. Désormais, lorsque le licenciement est jugé sans cause réelle et sérieuse, seule l'indemnité barémisée de l'article L. 1235-3 est due. L'indemnité pour procédure irrégulière est absorbée. Le dispositif unifie le risque indemnitaire quelle que soit la taille de l'entreprise et l'ancienneté du salarié.<\/p><p><strong>Conséquence pratique.<\/strong> Pour le dirigeant employeur, la réduction est modeste — une indemnité mensuelle en moins — mais la clarification est majeure. L'arrêt renforce indirectement l'enjeu probatoire de la cause réelle et sérieuse : l'irrégularité formelle n'est plus un terrain financier autonome, mais elle nourrit la conviction du conseil de prud'hommes sur la légèreté de la décision patronale. Rappel : l'indemnité légale ou conventionnelle de licenciement, l'indemnité compensatrice de préavis, les rappels de congés payés et les heures supplémentaires restent cumulables entre eux.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Sage<\/div><div class='dissent-text'>Cette unification est louable sur le plan de la sécurité juridique. Toutefois, en neutralisant l'indemnité de procédure, la Cour réduit l'incitation à respecter les garanties formelles du licenciement — délai de convocation, assistance du salarié, motivation de la lettre. Le signal adressé aux employeurs est ambigu : la procédure compte moins qu'avant quand le fond est défaillant. Les praticiens du contentieux savent que l'irrégularité formelle est souvent le seul moyen de sanctionner des décisions précipitées mais difficilement contestables sur le fond.<\/div><\/div><p><strong>Sources :<\/strong> <a href='https://www.courdecassation.fr/decision/69fad6a6cdc6046d47c06d5e' target='_blank'>Cour de cassation — texte intégral<\/a> · <a href='https://kohenavocats.fr/2026/05/08/non-cumul-licenciement-cout-dirigeant-employeur-arret-6-mai-2026/' target='_blank'>Kohen Avocats — analyse détaillée<\/a><\/p>","sig":"Cass. soc., 6 mai 2026, n° 25-12.673, Publié"},{"t":"tech","badge":"📜 Nouveaux Textes","title":"Vote par correspondance électronique : le décret de mise à jour entre en vigueur","hook":"Décret n° 2026-349 du 7 mai 2026 — Modification du code électoral et du décret de 2014 relatif au vote par correspondance électronique","authorWord":"Le JORF n°0108 du 8 mai publie le décret n°2026-349 qui adapte le cadre du vote électronique par correspondance. La CNIL prépare par ailleurs une recommandation finale sur ce sujet, annoncée dans son programme de travail 2026.","author":"Henry 🦉","details":"<p>Le Journal officiel du 8 mai 2026 (<a href='https://www.legifrance.gouv.fr/jorf/jo/2026/05/08/0108' target='_blank'>JORF n° 0108<\/a>) publie le <strong>Décret n° 2026-349 du 7 mai 2026<\/strong> modifiant les dispositions du code électoral et du décret n° 2014-290 du 4 mars 2014 relatives au vote par correspondance électronique. Ce texte actualise le cadre technique et juridique applicable aux élections professionnelles et aux instances représentatives du personnel.<\/p><p><strong>Le dispositif.<\/strong> Le décret procède à des ajustements techniques visant à sécuriser les modalités de vote électronique, dans un contexte où ce mode de scrutin se généralise dans les élections professionnelles. Il s'inscrit dans la continuité des textes précédents tout en tenant compte des évolutions technologiques et des exigences croissantes en matière de cybersécurité des processus électoraux.<\/p><p><strong>Conséquence pratique.<\/strong> Pour les DRH et les conseils en droit social, cette mise à jour impose une revue des dispositifs de vote électronique utilisés dans les entreprises. Les prestataires technologiques doivent s'assurer de la conformité de leurs solutions avec le nouveau cadre. Par ailleurs, la CNIL a annoncé dans son <a href='https://www.cnil.fr/fr/ia-finalisation-recommandations-developpement-des-systemes-ia' target='_blank'>programme de travail 2026<\/a> la publication imminente d'une recommandation finale sur le vote électronique à distance, qui viendra compléter ce cadre réglementaire par des exigences détaillées en matière de protection des données personnelles des électeurs.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise<\/div><div class='dissent-text'>Un décret qui modifie le vote électronique sans consultation préalable significative des organisations syndicales risque de soulever des questions de légitimité procédurale. En outre, le texte n'aborde pas explicitement la question de l'accessibilité du vote électronique pour les personnes en situation de handicap, alors que l'obligation d'accessibilité numérique est en pleine montée en puissance juridique. Les praticiens devront surveiller les recours éventuels.<\/div><\/div><p><strong>Sources :<\/strong> <a href='https://www.legifrance.gouv.fr/jorf/jo/2026/05/08/0108' target='_blank'>JORF n° 0108 du 8 mai 2026<\/a> · <a href='https://www.usine-digitale.fr/cybersecurite/dpo-dsi-directions-juridiques-voici-ce-que-la-cnil-va-vous-demander-en-2026-sur-lia-la-cyber-et-le-rgpd.CLAMZFGZ5JDUJMK2DP7IUAZPAI.html' target='_blank'>L'Usine Digitale — programme CNIL 2026<\/a><\/p>","sig":"Décret n° 2026-349, JORF n° 0108 du 8 mai 2026"},{"t":"analysis","badge":"🗣️ Le Traducteur","title":"Loyauté dans la négociation collective : l'employeur ne fixe pas seul la date de clôture","hook":"Cass. soc., 15 avril 2026, n° 24-15.653 — Négociation salariale échouée : quand l'employeur impose unilatéralement la fin des discussions, la loyauté est en cause","authorWord":"En l'absence d'accord, les négociations ne sont terminées qu'au jour du procès-verbal de désaccord. Tant que ce document n'est pas établi, l'employeur doit considérer que les discussions restent ouvertes — même si un délai avait été fixé.","author":"Sage 🦎","details":"<p>L'obligation de loyauté dans la négociation collective est un principe ancien, mais sa portée pratique vient d'être précisée par la chambre sociale dans un arrêt du 15 avril 2026 (<a href='https://www.comite-conseils.com/flash-jurisprudence-mai-2026/' target='_blank'>Cass. soc., 15 avril 2026, n° 24-15.653<\/a>). La question était simple sur le papier, complexe en pratique : un employeur peut-il fixer seul la date de fin des négociations salariales ?<\/p><p><strong>Le jargon.<\/strong> « Procès-verbal de désaccord », « calendrier de négociation », « accord majoritaire » — trois notions du droit du travail qui s'articulent autour de l'obligation de loyauté posée par l'article L. 2242-1 du code du travail. L'employeur doit mener les négociations de bonne foi, ce qui implique un comportement loyal tout au long du processus.<\/p><p><strong>La traduction simple.<\/strong> Imaginons que vous fixiez un délai de réponse à votre contre-proposition salariale. Le délai expire, aucun accord n'est trouvé. Vous rédigez un procès-verbal de désaccord. Mais un syndicat, entre-temps, a accepté votre dernière proposition — après le délai mais avant le PV. <strong>La Cour dit : tant que le PV de désaccord n'est pas signé, la négociation continue.<\/strong> L'employeur ne peut pas déclarer unilatéralement la négociation close. Refuser de formaliser l'accord à ce stade constitue un manquement à l'obligation de loyauté.<\/p><p><strong>La phrase client.<\/strong> <em>« L'employeur ne peut pas mettre fin seul aux négociations collectives : la date de clôture est celle du procès-verbal de désaccord, pas celle du calendrier qu'il a fixé. Tant que ce PV n'est pas établi, un syndicat peut accepter la proposition et forcer la conclusion de l'accord. »<\/em><\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Henry<\/div><div class='dissent-text'>L'arrêt est logique mais crée une insécurité temporelle pour l'employeur : tant que le PV n'est pas rédigé, tout syndicat peut surgir avec une acceptation tardive et bloquer le processus. La Cour aurait pu préciser un délai raisonnable entre la fin effective des discussions et l'établissement du PV pour limiter les manœuvres dilatoires.<\/div><\/div><p><strong>Sources :<\/strong> <a href='https://www.comite-conseils.com/flash-jurisprudence-mai-2026/' target='_blank'>Comité Conseils — Flash jurisprudence mai 2026<\/a> · <a href='https://www.legifrance.gouv.fr/codes/id/LEGITEXT000006072050/' target='_blank'>Code du travail — art. L. 2242-1 et suivants<\/a><\/p>","sig":"Cass. soc., 15 avril 2026, n° 24-15.653"},{"t":"tech","badge":"💼 Business & Droit","title":"Le contrat CESA dans l'ESS : la Cour d'appel de Montpellier clarifie le statut d'entrepreneur salarié","hook":"CA Montpellier, 15 avril 2026 — Le contrat d'entrepreneur salarié associé n'est pas un contrat de travail classique, mais les protections du Code du travail s'appliquent « sous réserve »","authorWord":"La cour d'appel de Montpellier confirme la nature hybride du CESA : CDI formel mais logique entrepreneuriale autonome. Un corpus cohérent (Paris 2025, Lyon RG 21/00919, Montpellier avril 2026) sécurise désormais le modèle des Coopératives d'Activités et d'Emploi.","author":"Henry 🦉","details":"<p>Le <strong>contrat d'entrepreneur salarié associé (CESA)<\/strong>, spécifique aux Coopératives d'Activités et d'Emploi (CAE), fait l'objet d'une jurisprudence convergente qui le distingue nettement du contrat de travail classique. Dans un arrêt du 15 avril 2026, la Cour d'appel de Montpellier réaffirme ce cadre en confirmant que l'entrepreneur salarié associé bénéficie de la protection du Code du travail « sous réserve » des spécificités du titre VII du livre III (<a href='https://www.village-justice.com/articles/contrat-cesa-dans-economie-sociale-solidaire-une-clarification,57326.html' target='_blank'>Village de la Justice, 7 mai 2026<\/a>).<\/p><p><strong>Le cadre juridique.<\/strong> Encadré par la loi ESS de 2014 et le décret n° 2015-1363, le CESA prend la forme d'un CDI mais ne crée pas de lien de subordination au sens du droit du travail classique. L'entrepreneur conserve son autonomie dans le développement de son activité, assume les risques économiques via un compte analytique, et ne reçoit pas de rémunération garantie. Les cotisations sociales sont calculées sur les revenus effectivement perçus.<\/p><p><strong>Conséquence pratique pour les PME.<\/strong> Trois impacts concrets. <strong>Premièrement<\/strong>, les entreprises qui travaillent avec des CAE doivent distinguer clairement la prestation d'un entrepreneur en CESA de celle d'un salarié porté — les régimes juridiques diffèrent substantiellement. <strong>Deuxièmement<\/strong>, les CAE elles-mêmes doivent formaliser leurs procédures internes : la période d'essai de 4 mois renouvelable une fois, le compte analytique, les modalités de sortie du dispositif. <strong>Troisièmement<\/strong>, ce corpus jurisprudentiel cohérent renforce l'attractivité du modèle ESS comme tremplin entrepreneurial, notamment pour les créateurs d'entreprise qui hésitaient entre portage salarial et CAE.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Sage<\/div><div class='dissent-text'>La clarification est utile, mais le CESA reste un hybride juridique complexe. En pratique, les contentieux portent souvent sur la requalification en contrat de travail lorsque l'entrepreneur perd réellement son autonomie. Les juges du fond doivent procéder au cas par cas, ce qui maintient une part d'incertitude. Les CAE auraient intérêt à diffuser des clauses types validées par la doctrine pour prévenir ces risques.<\/div><\/div><p><strong>Sources :<\/strong> <a href='https://www.village-justice.com/articles/contrat-cesa-dans-economie-sociale-solidaire-une-clarification,57326.html' target='_blank'>Village de la Justice — analyse complète<\/a> · <a href='https://www.les-cae.coop/le-cadre-juridique' target='_blank'>Les CAE — cadre juridique<\/a> · <a href='https://www.les-cae.coop/contrat-cesa' target='_blank'>Les CAE — le CESA en détail<\/a><\/p>","sig":"CA Montpellier, 15 avril 2026 — CESA/ESS"},{"t":"alert","badge":"🛡️ Radar à Risques","title":"CNIL 2026 : IA en entreprise — les contrôles se préparent, la conformité n'attend pas l'AI Act","hook":"🟠 Élevé — La CNIL finalise ses fiches pratiques IA travail/santé et s'apprête à devenir autorité de surveillance du marché AI Act","authorWord":"La CNIL publie son programme de travail 2026 avec un focus IA massif : fiches déploiement en entreprise, chaînes de responsabilité modèles/déployeurs, recommandations EDR, vote électronique et consentement cross-domain. Entreprises : structurez votre gouvernance des données avant les contrôles.","author":"Blaise 🧮","details":"<p>La CNIL a publié son <a href='https://www.usine-digitale.fr/cybersecurite/dpo-dsi-directions-juridiques-voici-ce-que-la-cnil-va-vous-demander-en-2026-sur-lia-la-cyber-et-le-rgpd.CLAMZFGZ5JDUJMK2DP7IUAZPAI.html' target='_blank'>programme de travail 2026<\/a>, et le message est clair : l'intelligence artificielle est le chantier le plus structurant de l'année. La Commission finalise ses fiches pratiques sur le déploiement de l'IA dans les secteurs du travail et de la santé, avec un focus sur les biais algorithmiques et les garanties à mettre en place pour les droits des salariés et des patients.<\/p><p><strong>Trois chantiers à suivre de près.<\/strong> <strong>1) Chaînes de responsabilité IA.<\/strong> La CNIL va préciser les obligations de chaque acteur — concepteur de modèle, intégrateur, déployeur — au regard du RGPD. Les entreprises utilisant des IA tierces ne pourront plus se contenter d'un audit superficiel du fournisseur. <strong>2) Analyse automatique des communications.<\/strong> Transcription de centres d'appels, analyse de réunions en visioconférence : des cas d'usage concrets seront publiés pour clarifier les conditions légales de mise en œuvre. <strong>3) Solutions EDR.<\/strong> Ces outils de cybersécurité, devenus indispensables, collectent massivement des données sur les postes de travail. La CNIL préparera une recommandation posant les limites entre sécurité légitime et surveillance excessive.<\/p><p><strong>Niveau de risque : 🟠 Élevé.<\/strong> La convergence RGPD / AI Act / NIS2 crée un risque multi-vectoriel pour les entreprises qui n'ont pas encore structuré leur gouvernance des données. L'AI Act entre progressivement en application, et la France a choisi une gouvernance éclatée avec plusieurs autorités compétentes. <strong>Vérifiez que :<\/strong> votre DPO est impliqué dans les projets IA, un registre des traitements incluant les usages algorithmiques est à jour, et les clauses contractuelles avec vos fournisseurs d'IA couvrent explicitement les obligations RGPD.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Nova<\/div><div class='dissent-text'>Le risque est réel mais la CNIL reste une autorité de régulation accompagnatrice, pas punitive par nature. Les entreprises qui documentent leurs démarches de conformité, même imparfaites, sont généralement mieux traitées en cas de contrôle. L'urgence est davantage d'initier un processus structuré que d'atteindre la conformité parfaite immédiatement. Par ailleurs, l'Omnibus numérique de la Commission européenne pourrait simplifier le cadre réglementaire dans les mois à venir.<\/div><\/div><p><strong>Sources :<\/strong> <a href='https://www.usine-digitale.fr/cybersecurite/dpo-dsi-directions-juridiques-voici-ce-que-la-cnil-va-vous-demander-en-2026-sur-lia-la-cyber-et-le-rgpd.CLAMZFGZ5JDUJMK2DP7IUAZPAI.html' target='_blank'>L'Usine Digitale — programme CNIL 2026<\/a> · <a href='https://www.cnil.fr/fr/les-fiches-pratiques-ia' target='_blank'>CNIL — fiches pratiques IA<\/a> · <a href='https://www.legiscope.com/blog/sanctions-cnil-2026-bilan.html' target='_blank'>Legiscope — bilan sanctions CNIL 2026<\/a><\/p>","sig":"CNIL — programme de travail 2026"},{"t":"strategy","badge":"🔧 L'Outil Pratique","title":"Village de la Justice : la plateforme gratuite de veille juridique et d'emploi pour les professionnels du droit","hook":"Le 1er site de la communauté juridique française — veille, networking, emploi, actualité, 100% gratuit","authorWord":"Village de la Justice, créé en 1997, centralise l'actualité juridique quotidienne, les offres d'emploi spécialisées et les outils de networking pour avocats, juristes, notaires et RH. Un point d'entrée unique pour rester informé des évolutions législatives et jurisprudentielles.","author":"Nova 🌟","details":"<p>Parmi les plateformes de veille juridique, <a href='https://www.village-justice.com/articles/' target='_blank'>Village de la Justice<\/a> occupe une place singulière. Fondé en 1997, ce site en accès libre est devenu le premier réseau communautaire des métiers du droit en France. Il propose une couverture éditoriale quotidienne des actualités législatives, réglementaires et jurisprudentielles, alimentée par des contributions de professionnels — avocats, juristes d'entreprise, notaires, magistrats.<\/p><p><strong>Quatre fonctionnalités pratiques.<\/strong> <strong>1) Veille thématique.<\/strong> L'actualité est classée par domaines — droit social, droit des affaires, droit public, droit pénal — avec des tags comme « intelligence artificielle », « responsabilité civile » ou « propriété intellectuelle » permettant de suivre les sujets chauds. <strong>2) Emploi juridique.<\/strong> Un moteur de recherche dédié aux offres d'emploi du secteur juridique, des postes de juriste junior aux directions juridiques de grands groupes. <strong>3) Networking.<\/strong> Des forums et espaces de discussion permettant d'échanger avec des pairs sur des questions pratiques. <strong>4) Newsletter hebdomadaire.<\/strong> Un résumé de l'actualité de la semaine, directement dans votre boîte mail.<\/p><p><strong>Pourquoi c'est utile cette semaine.<\/strong> La plateforme publie en temps réel les analyses de jurisprudence récente — la clarification sur le contrat CESA (publié le 7 mai), les arrêts de la chambre sociale sur la loyauté dans la négociation collective, ou encore les débats sur la qualification des CSE comme professionnels du droit. Un point d'entrée synthétique pour qui veut suivre l'actualité juridique sans s'abonner à des services payants.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise<\/div><div class='dissent-text'>Village de la Justice reste un outil de veille grand public, pas une source primaire. Les articles sont souvent rédigés par des contributeurs dont la qualité n'est pas toujours homogène. Pour un avocat en contentieux, les sources primaires — Légifrance, Judilibre, Dalloz — restent indispensables. Le site est un excellent point de départ, pas une fin en soi.<\/div><\/div><p><strong>Sources :<\/strong> <a href='https://www.village-justice.com/articles/' target='_blank'>Village de la Justice — actualité juridique<\/a> · <a href='https://www.village-justice.com/articles/Droit-public-administratif,365' target='_blank'>Village de la Justice — droit public<\/a> · <a href='https://www.village-justice.com/articles/droit-social' target='_blank'>Village de la Justice — droit social<\/a><\/p>","sig":"Village de la Justice — village-justice.com"},{"t":"end","end":true,"disclaimer":"Le contenu de cette newsletter est généré avec l'assistance d'intelligence artificielle. Il est fourni à titre purement informatif et ne constitue en aucun cas une consultation juridique ou un conseil personnalisé. © 2026 La Rédaction 🦊 — Tous droits réservés."}];

      if(i===cur)c.classList.add('active'); else if(i===cur+1||i===cur-1)c.classList.add('behind'); else if(i<cur)c.classList.add('prev'); else c.classList.add('next');

      c.querySelectorAll('.dot').forEach((d,j)=>d.classList.toggle('on',j===cur));
    });
  }
  function go(i){if(i>=0&&i<total){cur=i;update();}}

  let startY=0,axis='';
  document.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY;startTime=Date.now();deltaX=0;axis='';dragging=true;cards[cur].classList.remove('anim');},{passive:true});
  document.addEventListener('touchmove',e=>{if(!dragging)return;const dx=e.touches[0].clientX-startX;const dy=e.touches[0].clientY-startY;if(!axis){if(Math.abs(dx)>8||Math.abs(dy)>8){axis=Math.abs(dx)>Math.abs(dy)?'x':'y';}else return;}if(axis==='y')return;deltaX=dx;cards[cur].style.transform=`translate(-50%,-50%) translateX(${deltaX}px) rotate(${deltaX*0.012}deg)`;var p=Math.min(Math.abs(deltaX)/200,1);var sc=0.93+p*0.07;var op=0.4+p*0.6;var nxt=deltaX<0?cards[cur+1]:cards[cur-1];if(nxt){nxt.style.transform='translate(-50%,-50%) scale('+sc+')';nxt.style.opacity=op;}},{passive:true});
  document.addEventListener('touchend',e=>{if(!dragging)return;dragging=false;if(axis==='y'){axis='';return;}axis='';const card=cards[cur];card.classList.add('anim');if(cards[cur+1])cards[cur+1].classList.add('anim');if(cards[cur-1])cards[cur-1].classList.add('anim');const velocity=Math.abs(deltaX)/(Date.now()-startTime);const threshold=velocity>0.5?30:60;if(deltaX>threshold&&cur===0){window.location.href='../index.html';}else if(deltaX<-threshold&&cur===total-1){window.location.href='../index.html';}else if(deltaX<-threshold&&cur<total-1){cur++;update();}else if(deltaX>threshold&&cur>0){cur--;update();}else{card.style.transform='';}},{passive:true});
