    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }

    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }

    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }

    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }

    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }

    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }

    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }

    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }

    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }

        /* Force all content to fit card width — no horizontal overflow */

  <script>
  const DATA = [{"t":"home","home":true,"date":"14 Février 2026","henryWord":"Première édition du Flash Juridique ! Assurance-vie, fiscalité 2026, partage de la valeur, prud'hommes, NIS2 et outils pratiques — le droit qui compte, en 6 cartes.","articles":[{"idx":1,"badge":"⚖️ L'Arrêt du Jour","title":"Assurance-vie : la Cour de cassation bouleverse les règles de désignation des bé…"},{"idx":2,"badge":"📜 Nouveaux Textes","title":"Loi de finances 2026 : la contribution exceptionnelle sur les hauts revenus est …"},{"idx":3,"badge":"🗣️ Le Traducteur","title":"Partage de la valeur (11-49 salariés) → L'obligation vous tombe-t-elle dessus en…"},{"idx":4,"badge":"💼 Business & Droit","title":"Prud'hommes : contester un licenciement coûtera désormais 50 euros"},{"idx":5,"badge":"🛡️ Le Radar à Risques","title":"Loi Résilience (NIS2) : les dirigeants de PME personnellement responsables en ma…"},{"idx":6,"badge":"🔧 L'Outil Pratique","title":"Simulateur officiel d'indemnité de licenciement — estimez le minimum légal en 30…"}]},{"t":"alert","badge":"⚖️ L'Arrêt du Jour","title":"L'Arrêt du Jour","hook":"Assurance-vie : la Cour de cassation bouleverse les règles de désignation des bénéficiaires en cas de succession","details":"<p><strong>Les faits :</strong> Un litige sur la clause bénéficiaire d'un contrat d'assurance-vie, où les héritiers contestaient la désignation au profit d'un tiers.<br><br><strong>La décision :</strong> La Cour de cassation vient de préciser les conditions dans lesquelles une clause bénéficiaire peut être remise en cause lors de la succession, renforçant la protection des héritiers réservataires.<br><br><strong>Impact : Les assureurs et notaires doivent revoir la rédaction des clauses bénéficiaires. Les clients ayant des contrats anciens devraient vérifier leur conformité.</strong><br><br>Source : <a href='https://placement.meilleurtaux.com/assurance-vie/actualites/2026-fevrier/nouvelle-regle-juridique-applicable-succession-assurance-vie-pourrait-poser-probleme.html' target='_blank'>Meilleurtaux — Nouvelle règle juridique assurance-vie</a>\n<div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Sage 🦎</div><div class='dissent-text'>Attention à ne pas sur-réagir : la Cour ne remet pas en cause le principe de l'assurance-vie hors succession, elle en précise les limites. Nuance fondamentale.</div></div></p>","authorWord":"Un arrêt qui va faire du bruit chez les notaires. Vérifiez les clauses de vos clients dès maintenant.","author":"Henry 🦉"},{"t":"tech","badge":"📜 Nouveaux Textes","title":"Nouveaux Textes","hook":"Loi de finances 2026 : la contribution exceptionnelle sur les hauts revenus est prolongée et durcie","details":"<p><strong>Avant :</strong> La contribution exceptionnelle sur les hauts revenus (CEHR, art. 223 sexies du CGI) devait rester temporaire. Les PME/ETI étaient globalement épargnées.<br><br><strong>Maintenant :</strong> La LF 2026 introduit une contribution différentielle sur les hauts revenus (CDHR) garantissant un taux minimum d'imposition de 20%. La surtaxe IS pour les groupes à +1,5 Md€ de CA est reconduite. Les zones de revitalisation rurale (ZRR) sont prolongées jusqu'en 2030.<br><br><strong>Entrée en vigueur :</strong> 1er janvier 2026 (exercices clos à compter du 31/12/2026 pour certaines mesures IS).<br><br>Source : <a href='https://www.tgs-france.fr/blog/fiscalite-les-mesures-phares-de-la-loi-de-finances-pour-2026/' target='_blank'>TGS France — Mesures phares LF 2026</a> · <a href='https://www.vie-publique.fr/loi/300444-budget-de-letat-2026-projet-de-loi-de-finances-plf-2026' target='_blank'>Vie publique — PLF 2026</a>\n<div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮</div><div class='dissent-text'>Prudence : plusieurs mesures ont des dates d'entrée en vigueur différentes. Ne pas confondre ce qui s'applique dès 2026 et ce qui ne concernera que les exercices clos fin 2026.</div></div></p>","authorWord":"Les PME sont épargnées, mais les dirigeants à hauts revenus sont directement visés. À surveiller pour vos clients entrepreneurs.","author":"Henry 🦉"},{"t":"analysis","badge":"🗣️ Le Traducteur","title":"Le Traducteur","hook":"Partage de la valeur (11-49 salariés) → L'obligation vous tombe-t-elle dessus en 2026 ?","details":"<p><strong>Le Jargon :</strong> Assujettissement expérimental au partage de la valeur pour les sociétés de 11 à 49 salariés réalisant un bénéfice net fiscal au moins égal à 1 % du chiffre d'affaires pendant trois exercices consécutifs.<br><br><strong>La Traduction :</strong> Si votre PME a été rentable (même juste un peu, >1% du CA) en 2023, 2024 et 2025, vous ne pouvez plus y couper : vous devez verser une prime ou mettre en place de l'intéressement cette année.<br><br><strong>La phrase pour votre client :</strong> \"Attendons votre bilan 2025 : si vous validez la 3ème année de bénéfice consécutive, on devra lancer un accord de partage ou une prime avant la fin de l'année.\"\n<div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Henry 🦉</div><div class='dissent-text'>Pas de panique sur l'intéressement complexe. La <strong>Prime de Partage de la Valeur (PPV)</strong> suffit souvent à purger l'obligation légale avec plus de souplesse pour la trésorerie.</div></div></p>","authorWord":"Attention au seuil de 1% : c'est très bas. Beaucoup de dirigeants pensent être trop petits pour cette loi. Vérifiez systématiquement le trio 2023-2024-2025.","author":"Sage 🦎"},{"t":"tech","badge":"💼 Business & Droit","title":"Business & Droit","hook":"Prud'hommes : contester un licenciement coûtera désormais 50 euros","details":"<p><strong>Contexte :</strong> Le gouvernement prévoit d'instaurer un droit de timbre de 50 € pour saisir le Conseil de prud'hommes, dans le cadre des mesures de désengorgement de la justice.<br><br><strong>Impact business :</strong> Pour les employeurs, cela pourrait réduire les saisines abusives. Pour les salariés, c'est une barrière symbolique mais contestée par les syndicats qui y voient une entrave à l'accès à la justice.<br><br><strong>Ce que ça change :</strong> Les avocats en droit du travail doivent informer leurs clients (salariés et employeurs) de cette évolution. Les entreprises en procédure de licenciement peuvent anticiper une légère baisse du contentieux.<br><br>Source : <a href='https://www.capital.fr/votre-carriere/contester-son-licenciement-coutera-50-euros-ce-que-prevoit-la-nouvelle-loi-1523580' target='_blank'>Capital — Contester son licenciement coûtera 50 euros</a>\n<div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Sage 🦎</div><div class='dissent-text'>Question de fond : peut-on mettre un prix à l'accès à la justice sociale ? 50 € pour un cadre, c'est rien. Pour un SMIC, c'est un jour et demi de travail. L'égalité devant la loi en prend un coup.</div></div></p>","authorWord":"50 € symboliques, mais un signal fort. Le vrai impact sera sur les petits litiges où l'enjeu financier est faible.","author":"Henry 🦉"},{"t":"strategy","badge":"🛡️ Le Radar à Risques","title":"Le Radar à Risques","hook":"Loi Résilience (NIS2) : les dirigeants de PME personnellement responsables en matière de cybersécurité 🟠 Élevé","details":"<p>La transposition française de la directive européenne NIS2, dite <strong>Loi Résilience</strong>, étend considérablement le périmètre des entreprises soumises à des obligations de cybersécurité. Sont désormais concernées : PME et ETI de secteurs critiques (énergie, transport, santé, numérique, gestion des déchets, services postaux, alimentaire…), mais aussi leurs <strong>sous-traitants et prestataires</strong>.<br><br>L'innovation majeure : la <strong>responsabilité personnelle des dirigeants</strong>. Les membres de l'organe de direction doivent approuver les mesures de gestion des risques cyber et superviser leur mise en œuvre. Sanctions : jusqu'à <strong>10 M€ ou 2 % du CA mondial</strong> pour l'entreprise, et jusqu'à <strong>140 000 € d'amende personnelle</strong> pour le dirigeant.<br><br><strong>À vérifier :</strong> Vérifiez si votre entreprise entre dans le périmètre NIS2 (entité essentielle ou importante), désignez un responsable cybersécurité, et faites réaliser un audit de conformité avant l'entrée en vigueur des sanctions.<br><br>Base légale : Directive (UE) 2022/2555 du 14 décembre 2022 (NIS2), projet de loi relatif à la résilience des infrastructures critiques et au renforcement de la cybersécurité.<br><br>🔗 <a href='https://www.mobilecube.fr/audit-cybersecurite-obligatoire-pour-pme-en-france' target='_blank'>Source : Audit cybersécurité PME — Directive NIS2 2026</a>\n<div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Nova 🌟</div><div class='dissent-text'>Tempérons : le calendrier d'application reste progressif et l'ANSSI privilégie l'accompagnement avant la sanction. Les PME hors secteurs listés ne sont pas directement visées. Le vrai risque immédiat concerne surtout les sous-traitants de grands groupes qui exigeront la conformité par contrat, bien avant toute sanction administrative.</div></div></p>","authorWord":"140 000 € d'amende personnelle pour un dirigeant qui n'a pas supervisé la cyber : le risque n'est plus abstrait.","author":"Blaise 🧮"},{"t":"tech","badge":"🔧 L'Outil Pratique","title":"L'Outil Pratique","hook":"Simulateur officiel d'indemnité de licenciement — estimez le minimum légal en 30 secondes","details":"<p>Outil public 100% gratuit édité par l'administration française, utile pour préparer un premier échange ou vérifier un ordre de grandeur en droit du travail.<br><br><strong>Pour qui :</strong> avocats, RH, employeurs et salariés.<br><br><strong>Avantage clé :</strong> estimation immédiate, neutre et fondée sur les règles légales en vigueur.<br><br><a href='https://www.service-public.fr/simulateur/calcul/IndemniteLicenciement' target='_blank'>Accéder au simulateur →</a>\n<div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮</div><div class='dissent-text'>Le simulateur donne un minimum légal : il n'intègre pas toujours les clauses conventionnelles, usages ou contentieux pouvant majorer l'indemnité.</div></div></p>","authorWord":"Simple, fiable et rapide pour cadrer un dossier avant d'affiner avec la convention collective et la jurisprudence.","author":"Nova 🌟"},{"t":"end","end":true}];

  const deck = document.getElementById('deck');
  const hint = document.getElementById('hint');
  const total = DATA.length;
  let cur = 0, startX = 0, deltaX = 0, dragging = false, startTime = 0;

  DATA.forEach((d, i) => {
    const c = document.createElement('article');
    c.className = 'card' + (i === 0 ? ' active' : ' next');
    c.dataset.t = d.t;
    c.dataset.i = i;
    if (d.home) {
      const articlesHtml = d.articles.map((a, j) => `
        <div class="home-article" data-goto="${a.idx}">
          <div class="num">${a.badge.split(' ')[0]}</div>

      c.innerHTML = `

    } else if (d.end) {

          <a href="../index.htmlflash-juridique/" style="display:inline-block;padding:12px 32px;border:none;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;box-shadow:0 0 25px rgba(59,130,246,.4);margin-bottom:12px;">📰 Toutes les éditions</a><br><button id="restart">🔄 Recommencer</button>

  });

  function dots(active) { let s=''; for(let i=0;i<total;i++) s+=`<span class="dot${i===active?' on':''}"></span>`; return s; }
  const cards = deck.querySelectorAll('.card');
  function update(anim=true) {
    cards.forEach((c,i)=>{
      c.classList.toggle('anim',anim);
      c.classList.remove('prev','active','next','behind'); c.style.opacity='';
      if(i===cur)c.classList.add('active'); else if(i===cur+1||i===cur-1)c.classList.add('behind'); else if(i<cur)c.classList.add('prev'); else c.classList.add('next');
      c.style.transform='';
      c.querySelectorAll('.dot').forEach((d,j)=>d.classList.toggle('on',j===cur));
    });
  }
  function go(i){if(i>=0&&i<total){cur=i;update();}}
  const dateKey='daily-2026-02-14';
  if(!localStorage.getItem(dateKey)){setTimeout(()=>{hint.classList.add('hide');localStorage.setItem(dateKey,'1');},2000);}else hint.style.display='none';
  
  document.querySelectorAll('.scroll-zone, .home-content').forEach(function(sz){
    var card = sz.closest('.card');
    if(!card) return;
    sz.addEventListener('scroll', function(){
      card.classList.toggle('scrolled', sz.scrollTop > 10);
    }, {passive:true});
  });
  let startY=0,axis='';document.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY;startTime=Date.now();deltaX=0;axis='';dragging=true;cards[cur].classList.remove('anim');},{passive:true});
  document.addEventListener('touchmove',e=>{if(!dragging)return;const dx=e.touches[0].clientX-startX;const dy=e.touches[0].clientY-startY;if(!axis){if(Math.abs(dx)>8||Math.abs(dy)>8){axis=Math.abs(dx)>Math.abs(dy)?'x':'y';}else return;}if(axis==='y')return;deltaX=dx;cards[cur].style.transform=`translate(-50%,-50%) translateX(${deltaX}px) rotate(${deltaX*0.012}deg)`;var p=Math.min(Math.abs(deltaX)/200,1);var sc=0.93+p*0.07;var op=0.4+p*0.6;var nxt=deltaX<0?cards[cur+1]:cards[cur-1];if(nxt){nxt.style.transform='translate(-50%,-50%) scale('+sc+')';nxt.style.opacity=op;}},{passive:true});
  document.addEventListener('touchend',e=>{if(!dragging)return;dragging=false;if(axis==='y'){axis='';return;}axis='';const card=cards[cur];card.classList.add('anim');if(cards[cur+1])cards[cur+1].classList.add('anim');if(cards[cur-1])cards[cur-1].classList.add('anim');const velocity=Math.abs(deltaX)/(Date.now()-startTime);const threshold=velocity>0.5?30:60;if(deltaX>threshold&&cur===0){window.location.href='../index.htmlflash-juridique/';}else if(deltaX<-threshold&&cur===total-1){window.location.href='../index.htmlflash-juridique/';}else if(deltaX<-threshold&&cur<total-1){cur++;update();}else if(deltaX>threshold&&cur>0){cur--;update();}else{card.style.transform='';}},{passive:true});
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&cur<total-1){cur++;update();}if(e.key==='ArrowLeft'&&cur>0){cur--;update();}});
  document.addEventListener('click',e=>{if(e.target.id==='restart')go(0);const article=e.target.closest('.home-article');if(article){const idx=parseInt(article.dataset.goto);if(!isNaN(idx))go(idx);}});
    /* === DESKTOP SPLIT-VIEW === */
  let dtShell=null, dtSelected=0;
  function buildDesktop(){
    if(dtShell)return;
    dtShell=document.createElement('div');

    const sb=document.createElement('nav');

    const logoDate=DATA[0]&&DATA[0].home?`<div class="dt-logo"><b>AI</b> Insight Daily</div><div class="dt-date">${DATA[0].date||'__DATE__'}</div>`:`<div class="dt-logo"><b>AI</b> Insight Daily</div><div class="dt-date">__DATE__</div>`;
    sb.innerHTML=logoDate;
    DATA.forEach((d,i)=>{
      const item=document.createElement('div');
      item.className='dt-nav-item'+(i===0?' dt-selected':'');

      item.innerHTML=`<div class="dt-nav-badge">${emoji}</div><div class="dt-nav-info"><div class="dt-nav-label">${label}</div><div class="dt-nav-title">${title}</div></div><div class="dt-nav-arrow">›</div>`;
      item.addEventListener('click',()=>selectDesktop(i));
      sb.appendChild(item);

    // Reader

    rd.innerHTML='<div class="dt-reader-inner"></div>';

    dtShell.appendChild(rd);
    document.body.appendChild(dtShell);
    selectDesktop(0);
  }
  function selectDesktop(idx){

    const items=dtShell.querySelectorAll('.dt-nav-item');
    items.forEach((it,i)=>it.classList.toggle('dt-selected',i===idx));

      const arts=d.articles?d.articles.map(a=>`<div class="dt-nav-item" style="cursor:pointer;opacity:.7;padding:10px 14px;margin-bottom:4px;border-radius:10px;border:1px solid rgba(255,255,255,.06);" onclick="selectDesktop(${a.idx})"><div class="dt-nav-badge">${a.badge.split(' ')[0]}</div><div class="dt-nav-info"><div class="dt-nav-label">${a.badge.split(' ').slice(1).join(' ')}</div><div class="dt-nav-title">${a.title}</div></div><div class="dt-nav-arrow">›</div></div>`).join(''):'';

    } else if(d.end){
      inner.innerHTML=`<div style="text-align:center;padding:60px 0;"><div style="font-size:3.5rem;margin-bottom:16px;">🎉</div><h2 style="font-size:1.6rem;font-weight:800;margin-bottom:12px;">Briefing terminé !</h2><p style="color:var(--muted);font-size:1rem;margin-bottom:24px;line-height:1.5;">Vous avez parcouru le briefing du jour. À demain !</p><a href="../index.html" style="display:inline-block;padding:12px 32px;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;">📰 Toutes les éditions</a></div>`;
    } else {
      const authorHtml=d.authorWord?`<div class="dt-r-author"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author||''}</div></div>`:'';
      inner.innerHTML=`<span class="dt-r-badge ${d.t||''}">${d.badge||''}</span><h1 class="dt-r-title">${d.title||''}</h1>${authorHtml}<div class="dt-r-hook">${d.hook||''}</div><div class="dt-r-body">${d.details||''}</div><div class="dt-r-sig">AI Insight Daily — __DATE__</div>`;
    }
    dtShell.querySelector('.dt-reader').scrollTop=0;
    // Scroll sidebar item into view
    items[idx]&&items[idx].scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  function destroyDesktop(){
    if(dtShell){dtShell.remove();dtShell=null;}
  }
  function checkDesktop(){
    if(window.innerWidth>=900){
      deck.style.display='none';
      buildDesktop();
      dtShell.style.display='';
    } else {
      if(dtShell)dtShell.style.display='none';
      deck.style.display='';
      update(false);
    }
  }
  // Keyboard nav for desktop
  document.addEventListener('keydown',e=>{
    if(window.innerWidth<900)return;
    if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();if(dtSelected<DATA.length-1)selectDesktop(dtSelected+1);}
    if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();if(dtSelected>0)selectDesktop(dtSelected-1);}
  });
  checkDesktop();window.addEventListener('resize',checkDesktop);
  // Theme toggle
  (function(){
    const btn=document.getElementById('themeToggle');
    const saved=localStorage.getItem('theme');
    if(saved==='light'){document.documentElement.classList.add('light');btn.textContent='☀️';}
    btn.addEventListener('click',()=>{
      const isLight=document.documentElement.classList.toggle('light');
      btn.textContent=isLight?'☀️':'🌙';
      localStorage.setItem('theme',isLight?'light':'dark');
    });
  })();
  </script>
