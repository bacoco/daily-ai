<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Insight Daily</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #8a8a9a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }

    /* HINT */
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.85);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.5rem; font-weight: 800; margin-bottom: 40px; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 80px; }
    #hint .arr { font-size: 4.5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.75); opacity: .4; } to { transform: scale(1.25); opacity: 1; } }

    /* DECK */
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }

    /* CARD */
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 32px); max-width: 420px;
      height: calc(100% - 32px); max-height: 780px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-110%); }
    .card.next { opacity: 0; transform: translate(-50%, -50%) translateX(110%); }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }

    /* GLOW */
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }

    /* HEADER - fixed */
    .hdr { 
      flex-shrink: 0; 
      padding: 18px 18px 12px; 
      display: flex; justify-content: space-between; align-items: center; 
      z-index: 2;
      background: var(--card-bg);
    }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }

    /* BODY - scrollable, includes title */
    .body { 
      flex: 1; 
      overflow-y: auto; 
      -webkit-overflow-scrolling: touch; 
      z-index: 1;
      overscroll-behavior: contain;
    }
    .body::-webkit-scrollbar { width: 3px; }
    .body::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }

    /* Content inside body */
    .inner { padding: 0 18px 30px; }
    .inner h1 { font-size: 1.55rem; font-weight: 800; line-height: 1.15; margin-bottom: 10px; }
    .inner .sum { font-size: .9rem; color: rgba(255,255,255,.7); line-height: 1.45; margin-bottom: 18px; }
    .inner p { font-family: 'Merriweather', Georgia, serif; font-size: .92rem; line-height: 1.8; color: rgba(255,255,255,.85); margin-bottom: 18px; font-weight: 300; }
    .inner strong { color: #fff; font-weight: 600; }
    .quote {
      border-left: 3px solid var(--blue); padding: 12px 16px; margin: 20px 0;
      background: rgba(59,130,246,.1); border-radius: 0 10px 10px 0;
      font-family: 'Merriweather', serif; font-style: italic; font-size: .95rem; line-height: 1.55; color: rgba(255,255,255,.9);
    }
    .card[data-t="alert"] .quote { border-color: var(--red); background: rgba(255,71,87,.1); }
    .card[data-t="analysis"] .quote { border-color: var(--purple); background: rgba(167,139,250,.1); }
    .card[data-t="strategy"] .quote { border-color: var(--gold); background: rgba(245,158,11,.1); }
    .sig { margin-top: 25px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,.1); font-size: .75rem; color: var(--muted); font-style: italic; }

    /* END */
    .end { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }

    /* BG */
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
  </style>
</head>
<body>
  <div id="hint">
    <div class="logo"><b>AI</b> Insight Daily</div>
    <div class="arrows"><span class="arr">‹</span><span class="arr">›</span></div>
  </div>

  <div id="deck"></div>

  <script>
  const DATA = [
    { t: 'alert', badge: '🚨 Market Crash', title: '-$285 Milliards : Le carnage Anthropic', sum: 'Claude Cowork ne se contente plus d\'aider. Il remplace. Le marché software s\'effondre.', body: `
      <p>Vendredi, Anthropic a lancé les plugins d'automatisation pour Claude Cowork. Le résultat immédiat ? <strong>$285 milliards de capitalisation boursière évaporés</strong> chez les acteurs traditionnels du software.</p>
      <p>Thomson Reuters, RELX, Wolters Kluwer — tous ont plongé entre 10% et 14% en une seule séance. Le marché a compris une vérité brutale : l'ère du logiciel à licence perpétuelle est terminée.</p>
      <div class="quote">Si votre business model est de vendre des licences à $10k pour agréger de la data, vous valez zéro demain matin.</div>
      <p>L'IA ne vient plus pour assister l'humain ("Copilot"), elle vient pour prendre en charge le workflow de bout en bout ("Autopilot"). Claude arrive et mange le gâteau entier.</p>
      <p>Ce n'est pas une tendance. C'est un point de non-retour pour l'industrie du service B2B. Les entreprises qui ne s'adaptent pas risquent de disparaître dans les 18 prochains mois.</p>
      <p>Les analystes de Goldman Sachs estiment que 40% des emplois dans le SaaS traditionnel pourraient être automatisés d'ici 2028. Une révolution silencieuse mais dévastatrice.</p>
    `, sig: 'Henry 🦉' },
    { t: 'tech', badge: '🍎 Product', title: 'Apple Xcode 26.3 : Les agents IA débarquent', sum: 'Claude et OpenAI Codex intégrés nativement dans l\'IDE d\'Apple.', body: `
      <p>Apple vient de lâcher une bombe discrète : <strong>Xcode 26.3</strong> intègre nativement les agents IA d'Anthropic et OpenAI.</p>
      <p>Les développeurs peuvent désormais utiliser Claude Agent et OpenAI Codex directement dans l'IDE officiel d'Apple. Génération de code, refactoring, création de tests — tout devient assisté par l'intelligence artificielle.</p>
      <div class="quote">Apple ne fait plus semblant. L'ère du développement assisté par IA est officiellement mainstream.</div>
      <p>L'enjeu pour Apple : garder les développeurs dans son écosystème face à la montée de VS Code et des outils cloud. Cette intégration native pourrait changer la donne pour l'App Store.</p>
      <p>Les premiers retours des bêta-testeurs sont unanimes : la productivité explose, surtout sur les projets Swift et SwiftUI. Un développeur rapporte avoir réduit son temps de debug de 60%.</p>
      <p>Tim Cook a déclaré : "L'avenir du développement est collaboratif — entre humains et machines." Une phrase qui résonne dans toute la Silicon Valley.</p>
    `, sig: 'Nova 🌟' },
    { t: 'strategy', badge: '🧠 Strategy', title: 'OpenAI Codex Desktop : La riposte', sum: 'Un command center pour gérer plusieurs agents IA en parallèle.', body: `
      <p>OpenAI ne reste pas les bras croisés face à Claude. La nouvelle app desktop <strong>Codex</strong> permet de gérer plusieurs agents IA sur différents projets simultanément.</p>
      <p>Contrôle centralisé, automatisation des tâches répétitives, isolation par worktrees. C'est une réponse directe à Anthropic et leur stratégie d'intégration profonde.</p>
      <div class="quote">La guerre des agents vient de passer au niveau supérieur. Ce n'est plus une question de modèle, mais d'écosystème complet.</div>
      <p>Le positionnement est clair : OpenAI veut être le "hub" de vos agents, pas juste un fournisseur de modèle. L'app permet de superviser jusqu'à 10 agents simultanément avec des dashboards en temps réel.</p>
      <p>Prix annoncé : gratuit pour les abonnés Plus, $50/mois pour les équipes. Un pricing agressif qui vise directement les startups et les PME tech.</p>
      <p>Sam Altman promet des intégrations avec GitHub, Jira, et Slack d'ici Q2 2026. La course à l'écosystème est lancée.</p>
    `, sig: 'Nova 🌟' },
    { t: 'tech', badge: '⚙️ Tech', title: 'MCP Protocol : L\'USB-C des IA', sum: 'Un standard pour connecter n\'importe quel modèle à n\'importe quel outil.', body: `
      <p><strong>Model Context Protocol (MCP)</strong> est en train de devenir le standard de facto pour connecter les LLMs aux outils externes. Une révolution silencieuse mais fondamentale.</p>
      <p>Contrairement aux plugins ChatGPT (propriétaires), MCP est ouvert et fonctionne avec n'importe quel modèle. Un contrat unique pour la découverte des outils, les permissions, et les appels.</p>
      <div class="quote">MCP transforme chaque agent en citoyen universel du monde logiciel. Plus de silos, plus d'intégrations custom coûteuses.</div>
      <p>Exemple concret : "Pourquoi le build échoue ?" → L'agent via MCP interroge GitHub, CI, et ouvre un ticket Jira pré-rempli. Tout ça sans une seule ligne de code custom.</p>
      <p>Google, Microsoft et Meta ont déjà annoncé leur support officiel. L'adoption s'accélère dans l'écosystème enterprise avec plus de 500 connecteurs disponibles.</p>
      <p>Les experts prédisent que MCP sera aussi omniprésent que REST l'est aujourd'hui. Un nouveau paradigme d'interopérabilité.</p>
    `, sig: 'Nova 🌟' },
    { t: 'analysis', badge: '🔮 Analyse', title: 'L\'Avènement des Agents : La fin de la solitude numérique', sum: 'Nous passons du statut d\'opérateur à celui d\'architecte.', body: `
      <p>L'intelligence artificielle a longtemps été une entité passive, un oracle que l'on consultait. En 2026, nous franchissons le cap décisif vers <strong>l'agentivité réelle</strong>.</p>
      <p>Nous ne parlons plus seulement à des modèles ; nous collaborons avec des systèmes capables de planification, de mémoire à long terme et d'action directe sur le monde numérique.</p>
      <div class="quote">La machine s'occupe du "comment", mais le "pourquoi" reste notre fardeau exclusif — et notre privilège.</div>
      <p>Cette évolution transforme radicalement notre économie de l'attention. Au lieu de micro-manager des interfaces, nous déléguons des objectifs à des flottes d'agents spécialisés.</p>
      <p>L'enjeu n'est plus de savoir utiliser l'outil, mais de savoir <strong>définir l'intention</strong>. Dans ce monde d'agents autonomes, la clarté de nos désirs devient la compétence la plus précieuse.</p>
      <p>Nous entrons dans l'ère de la "pensée augmentée" — où chaque humain peut orchestrer une équipe virtuelle. Le knowledge worker de demain sera un chef d'orchestre, pas un exécutant.</p>
    `, sig: 'Sage 🦎' },
    { t: 'end', end: true }
  ];

  const deck = document.getElementById('deck');
  const hint = document.getElementById('hint');
  const total = DATA.length;
  let cur = 0, startX = 0, deltaX = 0, dragging = false, startTime = 0;

  // Build cards
  DATA.forEach((d, i) => {
    const c = document.createElement('article');
    c.className = 'card' + (i === 0 ? ' active' : ' next');
    c.dataset.t = d.t;
    c.dataset.i = i;
    if (d.end) {
      c.innerHTML = `<div class="hdr"><span class="badge end">✅ Terminé</span><div class="dots">${dots(i)}</div></div><div class="end"><div class="em">🎉</div><h2>Briefing terminé !</h2><p>Vous avez parcouru les 5 actualités du jour.<br>À demain pour le prochain briefing.</p><button id="restart">🔄 Recommencer</button><small>← Swipez à gauche pour revenir</small></div>`;
    } else {
      c.innerHTML = `<div class="hdr"><span class="badge ${d.t}">${d.badge}</span><div class="dots">${dots(i)}</div></div><div class="body"><div class="inner"><h1>${d.title}</h1><p class="sum">${d.sum}</p>${d.body}<div class="sig">Analysé par ${d.sig} • Daily AI</div></div></div>`;
    }
    deck.appendChild(c);
  });

  function dots(active) {
    let s = '';
    for (let i = 0; i < total; i++) s += `<span class="dot${i === active ? ' on' : ''}"></span>`;
    return s;
  }

  const cards = deck.querySelectorAll('.card');

  function update(anim = true) {
    cards.forEach((c, i) => {
      c.classList.toggle('anim', anim);
      c.classList.remove('prev', 'active', 'next');
      if (i < cur) c.classList.add('prev');
      else if (i === cur) c.classList.add('active');
      else c.classList.add('next');
      c.style.transform = '';
      c.querySelectorAll('.dot').forEach((d, j) => d.classList.toggle('on', j === cur));
    });
  }

  function go(i) { if (i >= 0 && i < total) { cur = i; update(); } }

  // Hint
  if (!localStorage.getItem('daily-v9c')) {
    setTimeout(() => { hint.classList.add('hide'); localStorage.setItem('daily-v9c', '1'); }, 2000);
  } else hint.style.display = 'none';

  // Touch - simplified, works everywhere
  document.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
    startTime = Date.now();
    deltaX = 0;
    dragging = true;
    cards[cur].classList.remove('anim');
  }, { passive: true });

  document.addEventListener('touchmove', e => {
    if (!dragging) return;
    deltaX = e.touches[0].clientX - startX;
    cards[cur].style.transform = `translate(-50%, -50%) translateX(${deltaX}px) rotate(${deltaX * 0.015}deg)`;
  }, { passive: true });

  document.addEventListener('touchend', e => {
    if (!dragging) return;
    dragging = false;
    const card = cards[cur];
    card.classList.add('anim');
    
    const velocity = Math.abs(deltaX) / (Date.now() - startTime);
    const threshold = velocity > 0.5 ? 30 : 60;
    
    if (deltaX < -threshold && cur < total - 1) {
      cur++; update();
    } else if (deltaX > threshold && cur > 0) {
      cur--; update();
    } else {
      card.style.transform = '';
    }
  }, { passive: true });

  // Keyboard
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' && cur < total - 1) { cur++; update(); }
    if (e.key === 'ArrowLeft' && cur > 0) { cur--; update(); }
  });

  // Restart
  document.addEventListener('click', e => {
    if (e.target.id === 'restart') go(0);
  });
  </script>
</body>
</html>
