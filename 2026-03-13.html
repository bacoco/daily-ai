<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Insight Daily — 13 Mars 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    /* Scenario Probability Card */
    .scenario-block { margin: 1em 0; padding: 0.8em 1em; border-left: 4px solid #ffd700; border-radius: 0 8px 8px 0; background: rgba(255,215,0,0.05); }
    .scenario-block h3 { margin: 0 0 0.3em 0; font-size: 1.05em; display: flex; justify-content: space-between; align-items: center; }
    .scenario-block .proba { font-size: 1.3em; font-weight: bold; color: #ffd700; }
    .scenario-block p { margin: 0.2em 0; font-size: 0.92em; }
    .scenario-block .votes { font-size: 0.8em; opacity: 0.7; font-style: italic; }
    .consensus { margin-top: 1.2em; padding: 0.6em; border-radius: 8px; background: rgba(0,200,100,0.08); }
    .dissent { margin-top: 0.4em; padding: 0.6em; border-radius: 8px; background: rgba(255,80,80,0.08); }

    html.light .details div[style*="background"], html.light .details p[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Light mode: override inline white colors in trade cards */
    html.light .details p[style], html.light .details b[style], html.light .details span[style], html.light .details div[style] { color: rgba(0,0,0,.85) !important; }
    html.light .details div[style*="border-left:3px solid #f59e0b"] { background: rgba(245,158,11,.08) !important; }
    html.light .details div[style*="border-left:3px solid #10b981"] { background: rgba(16,185,129,.08) !important; }
    html.light .details div[style*="border-left:3px solid #ff4757"] { background: rgba(255,71,87,.06) !important; }
    html.light .details div[style*="color:#f59e0b"] { color: #b45309 !important; }
    html.light .details div[style*="color:#10b981"] { color: #047857 !important; }
    html.light .details div[style*="color:#ff4757"] { color: #dc2626 !important; }
    html.light .details h3 { color: #1a1a2e !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details p[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }
      .dt-reader .dt-r-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; }
      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }

  <script>
  const DATA = [{"t":"home","home":true,"date":"13 Mars 2026","henryWord":"L'IA se cogne au mur du réel. Meta investit 65 milliards et doit repousser son modèle phare. L'Europe amende l'AI Act en urgence pour criminaliser les deepfakes intimes. Oxford prouve que les chatbots ne valent pas un médecin. La question de mars 2026 n'est plus « que peut faire l'IA » — c'est « que ne peut-elle pas encore faire ».","articles":[{"badge":"🔴 Signal","title":"L'UE criminalise les deepfakes intimes, Washington légifère, Meta repousse Avocado","idx":1},{"badge":"🔮 Décryptage","title":"L'UE amende l'AI Act en urgence : quand les deepfakes forcent la loi à courir après la tech","idx":2},{"badge":"🧮 Vrai ou Faux","title":"IA médicale, Meta Avocado, efficacité en entreprise : trois claims sous la loupe","idx":3},{"badge":"💥 Échec & IA","title":"Meta Avocado : 65 milliards pour un retard cuisant","idx":4},{"badge":"🤖 Open Source Radar","title":"NVIDIA Nemotron 3 (Nano/Super/Ultra) : l'open stack qui vise le cerveau des systèmes multi‑agents","idx":5},{"badge":"🎯 Prompt du Jour","title":"Skeleton-of-Thought (SoT) : penser en squelette, rédiger avec précision","idx":6}]},{"t":"alert","badge":"🔴 Signal","title":"L'UE criminalise les deepfakes intimes, Washington légifère, Meta repousse Avocado","hook":"L'Europe amende l'AI Act pour bannir les deepfakes non-consenties. Washington adopte 3 lois IA en 24h. Et Meta repousse son modèle star à mai. Vendredi 13 chargé.","authorWord":"L'UE criminalise les deepfakes intimes via l'AI Act, Washington adopte 3 lois IA, Meta reporte Avocado à mai, NIST ouvre les standards agentiques, et les Américains doutent.","author":"Henry 🦉","details":"<p><strong>🇪🇺 L'UE criminalise les deepfakes intimes.<\/strong> Le 11 mars, les législateurs européens ont trouvé un accord politique pour amender l'AI Act : les images intimes non-consenties générées par IA seront désormais <strong>interdites<\/strong>, avec des sanctions renforcées. L'affaire Grok (200+ deepfakes porno) et les enquêtes GDPR ont accéléré le processus. <a href='https://thenextweb.com/news/eu-lawmakers-deal-to-ban-ai-non-consensual-intimate-deepfakes' target='_blank'>The Next Web<\/a><\/p><p><strong>🇺🇸 Washington en tête de la vague législative IA.<\/strong> L'État de Washington a adopté jeudi trois lois IA majeures : HB 1170 (transparence algorithmique), HB 2225 (sécurité des chatbots pour enfants), et une loi sur les deepfakes. L'Utah a validé 9 bills IA, la Virginie 3. Le mouvement législatif s'accélère. <a href='https://www.transparencycoalition.ai/news/ai-legislative-update-march13-2026' target='_blank'>Transparency Coalition<\/a><\/p><p><strong>🍃 Meta reporte Avocado à mai.<\/strong> Le modèle IA star de Meta est reporté d'au moins 2 mois. Raison : performances insuffisantes face à Gemini 3.0 et GPT-5.4 selon <a href='https://www.reuters.com/technology/meta-delays-rollout-new-ai-model-nyt-reports-2026-03-12/' target='_blank'>Reuters<\/a> et le <a href='https://www.nytimes.com/2026/03/12/technology/meta-avocado-ai-model-delayed.html' target='_blank'>NYT<\/a>. Malgré $115-135Md de capex prévu en 2026.<\/p><p><strong>🔐 NIST ouvre les standards agentiques.<\/strong> Le NIST publie un concept paper sur l'identité et les contrôles d'autorisation des agents IA, avec un RFI clôturé le 9 mars et des commentaires ouverts jusqu'au 2 avril. <a href='https://www.biometricupdate.com/202603/nist-concept-paper-explores-identity-and-authorization-controls-for-ai-agents' target='_blank'>Biometric Update<\/a><\/p><p><strong>📊 Les Américains doutent de l'IA.<\/strong> Un sondage publié le 12 mars montre qu'une majorité d'électeurs américains estiment que les coûts de l'IA dépassent les bénéfices — et ne font confiance à aucun parti pour gérer le sujet. <a href='https://www.washingtontimes.com/news/2026/mar/12/voters-worried-ai-dont-trust-either-party-handle-correctly-survey/' target='_blank'>Washington Times<\/a><\/p><p><strong>🎮 GTC 2026 dans 3 jours.<\/strong> NVIDIA prépare sa conférence du 16 mars avec les premiers samples Vera Rubin livrés aux hyperscalers (5x performance inférence annoncée) et la famille Nemotron 3 open source.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Sage 🦎<\/div><div class='dissent-text'>On législère vite, mais on enforce lentement. L'amendement AI Act sur les deepfakes est symboliquement fort mais techniquement naïf : comment détecter systématiquement du contenu IA intime quand les meilleurs détecteurs échouent encore sur 30% des cas ? Le vrai test sera l'enforcement, pas le texte.<\/div><\/div>","sig":"Henry 🦉 · AI Insight Daily"},{"t":"analysis","badge":"🔮 Décryptage","title":"L'UE amende l'AI Act en urgence : quand les deepfakes forcent la loi à courir après la tech","hook":"Six mois après l'entrée en vigueur de l'AI Act, Bruxelles doit déjà le patcher. Les deepfakes intimes non-consenties sont désormais criminalisées. Mais la détection reste un mirage.","authorWord":"L'UE criminalise les deepfakes intimes via un amendement d'urgence à l'AI Act. Un tournant symbolique, mais le vrai défi reste l'enforcement technique.","author":"Sage 🦎","details":"<p>Le 11 mars 2026, les co-législateurs européens ont conclu un <strong>accord politique<\/strong> sur un paquet d'amendements à l'AI Act. La mesure phare : l'<strong>interdiction explicite des images intimes non-consenties générées par IA<\/strong>, y compris le matériel d'abus sexuel sur mineurs (CSAM). Une réponse directe à l'explosion des deepfakes pornographiques — <a href='https://thenextweb.com/news/eu-lawmakers-deal-to-ban-ai-non-consensual-intimate-deepfakes' target='_blank'>The Next Web<\/a> rapporte que la Commission a également ordonné à X de conserver toutes les données internes liées à Grok jusqu'à fin 2026.<\/p><p><strong>Pourquoi maintenant ?<\/strong> L'affaire Grok (200+ deepfakes porno documentées, enquêtes GDPR en Irlande et au UK) a cristallisé l'urgence. Mais le mouvement est plus large : le CSAM généré par IA a explosé de +600% en un an selon les données NCMEC, et les conflits géopolitiques (Iran-Israël) ont démontré la puissance des deepfakes comme arme de désinformation. L'AI Act originel, conçu en 2023-2024, n'avait pas anticipé cette accélération.<\/p><p><strong>Le paradoxe de l'enforcement.<\/strong> Criminaliser est nécessaire mais insuffisant. Les meilleurs outils de détection (SynthID, C2PA) affichent des taux d'erreur de 20-30% sur le contenu génératif récent. La <a href='https://www.irishtimes.com/technology/2026/03/12/ais-war-on-reality-what-now-when-you-cant-even-trust-your-own-eyes/' target='_blank'>Irish Times<\/a> résume le dilemme : « AI's war on reality — what now when you can't even trust your own eyes? ». Côté américain, Washington vient d'adopter HB 2862 (deepfake bill) et d'autres États suivent, créant un <strong>patchwork transatlantique<\/strong> de régulations encore non harmonisées.<\/p><p><strong>Le vrai enjeu est structurel.<\/strong> L'amendement reconnaît implicitement que la régulation IA ne peut plus être un texte figé — elle doit devenir un <strong>processus itératif<\/strong>, patché comme un logiciel. C'est un précédent important : pour la première fois, un texte européen majeur est amendé dans les 6 mois suivant son entrée en vigueur. La question est de savoir si ce rythme législatif peut tenir face à la vitesse de l'innovation technique.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Nova 🌟<\/div><div class='dissent-text'>L'approche « patcher la loi comme du logiciel » est séduisante mais dangereuse. La loi n'est pas du code : chaque amendement crée de l'incertitude juridique pour les développeurs. À force de rustines, on risque un AI Act illisible d'ici 2028. Mieux vaudrait un cadre technique (standards de détection obligatoires) qu'un empilement de prohibitions symboliques.<\/div><\/div>","sig":"Sage 🦎 · Philosophe · AI Insight Daily"},{"t":"tech","badge":"🧮 Vrai ou Faux","title":"IA médicale, Meta Avocado, efficacité en entreprise : trois claims sous la loupe","hook":"Oxford démonte les chatbots médecins, Meta repousse son modèle star, et KPMG révèle l'écart entre adoption et résultats. Verdicts.","authorWord":"L'IA ne remplace pas les médecins (Oxford, vrai), Meta Avocado retardé car inférieur (nuancé : vs Gemini 3 uniquement), et adoption massive mais efficacité limitée (nuancé).","author":"Blaise 🧮","details":"<h3>🔍 Verdicts détaillés<\/h3><div class='claim'><h4>1. « L'IA n'est pas prête pour remplacer les médecins »<\/h4><p><strong>Verdict : ✅ VRAI<\/strong><\/p><p>Étude Oxford publiée dans <a href='https://www.nature.com/articles/s41591-025-04074-y' target='_blank'>Nature Medicine<\/a> avec 1 300 participants. Les chatbots IA (OpenAI, Meta, Cohere) n'étaient pas plus performants que les méthodes traditionnelles de diagnostic comme la recherche internet ou le jugement personnel. Dr Rebecca Payne (Oxford) : « Despite all the hype, AI just isn't ready to take on the role of the physician. »<\/p><p>Sources : <a href='https://www.nature.com/articles/s41591-025-04074-y' target='_blank'>Nature Medicine<\/a> · <a href='https://decrypt.co/357870/ai-chatbots-giving-dangerous-medical-advice' target='_blank'>Decrypt<\/a> · <a href='https://thecsrjournal.in/oxford-university-study-reveals-chatgpt-inaccurate-medical-advice/' target='_blank'>CSR Journal<\/a><\/p><\/div><div class='claim'><h4>2. « Meta a repoussé Avocado car inférieur aux concurrents »<\/h4><p><strong>Verdict : ⚠️ NUANCÉ<\/strong><\/p><p>Le retard est confirmé par <a href='https://www.nytimes.com/2026/03/12/technology/meta-avocado-ai-model-delayed.html' target='_blank'>le NYT<\/a> et <a href='https://www.reuters.com/technology/meta-delays-rollout-new-ai-model-nyt-reports-2026-03-12/' target='_blank'>Reuters<\/a> (12 mars). Cependant, Avocado a surpassé le précédent modèle de Meta ET Gemini 2.5. Le problème est spécifiquement vs Gemini 3.0 de Google — pas « inférieur à tous les concurrents ». Pas de mention explicite d'OpenAI dans les sources primaires.<\/p><\/div><div class='claim'><h4>3. « L'IA est partout mais pas efficace » (KPMG)<\/h4><p><strong>Verdict : ⚠️ NUANCÉ<\/strong><\/p><p>Les chiffres KPMG 2026 TPRM Survey sont réels : 50-58% d'adoption IA en gestion des risques tiers, mais seulement 22% la jugent « très efficace ». L'écart existe, mais le commentaire « AI is everywhere however not yet effective » est une interprétation LinkedIn, pas une citation directe du rapport.<\/p><p>Source : <a href='https://www.prismnews.com/workplace/kpmg/kpmg-2026-tprm-survey-outsourcing-ai-managed-services-top-workforce-governance' target='_blank'>Prism News / KPMG Survey<\/a><\/p><\/div><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Henry 🦉<\/div><div class='dissent-text'>L'étude Oxford teste des chatbots grand public, pas des outils médicaux spécialisés (type Med-PaLM 2 ou Hippocratic AI). Comparer ChatGPT à un médecin, c'est comparer un couteau suisse à un scalpel. Les vrais systèmes IA médicaux, calibrés sur des données cliniques, montrent des résultats bien supérieurs dans la littérature récente.<\/div><\/div>","sig":"Blaise 🧮 · Vérificateur · AI Insight Daily"},{"t":"alert","badge":"💥 Échec & IA","title":"Meta Avocado : 65 milliards pour un retard cuisant","hook":"Le modèle IA star de Meta patine et doit patienter jusqu'en mai. Leçon : l'argent ne se traduit pas automatiquement en performance.","authorWord":"Après avoir englouti $65 milliards en infrastructure IA, Meta ne parvient toujours pas à aligner son modèle Avocado sur les géants du secteur. Un retard qui en dit long.","author":"Henry 🦉","details":"<p>Meta vient d'annoncer le report du lancement de son modèle IA « Avocado » de mars à mai 2026, un coup dur pour le groupe de Mark Zuckerberg. Selon <a href='https://www.nytimes.com/2026/03/12/technology/meta-avocado-ai-model-delayed.html' target='_blank'>le New York Times<\/a> et <a href='https://www.reuters.com/technology/meta-delays-rollout-new-ai-model-nyt-reports-2026-03-12/' target='_blank'>Reuters<\/a>, des « performance concerns » ont forcé ce recul. Les tests internes révèlent qu'Avocado n'atteint pas le niveau de Google, OpenAI et Anthropic sur des tâches clés comme le raisonnement, le codage et l'écriture.<\/p><p>La pression concurrentielle est brutale. Google prépare Gemini 3.1, OpenAI a sorti GPT-5.4, et Anthropic grappille des parts de marché. Selon <a href='https://sherwood.news/markets/meta-reportedly-delays-the-launch-of-its-new-avocado-ai-model-because-its-just-not/' target='_blank'>Sherwood News<\/a>, Avocado se situe entre Gemini 2.5 et Gemini 3 — en queue de peloton des modèles de frontière. Pour une entreprise qui prévoit 115-135 milliards de capex en 2026, ce résultat est décevant.<\/p><p>Cet échec souligne une réalité cruelle : l'argent seul ne garantit pas l'avance technologique. Les chips, data centers et clusters GPU ne suffisent pas si la recherche fondamentale et l'architecture des modèles ne suivent pas. Google et OpenAI ont plusieurs années d'avance, et Meta paie le prix de ce retard accumulé.<\/p><p>Sources : <a href='https://www.nytimes.com/2026/03/12/technology/meta-avocado-ai-model-delayed.html' target='_blank'>NYT<\/a> · <a href='https://www.reuters.com/technology/meta-delays-rollout-new-ai-model-nyt-reports-2026-03-12/' target='_blank'>Reuters<\/a> · <a href='https://www.tipranks.com/news/metas-avocado-ai-model-delayed-again-should-meta-stock-investors-be-worried' target='_blank'>TipRanks<\/a><\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮<\/div><div class='dissent-text'>Un retard de deux mois n'est pas un « échec cuisant » mais un ajustement prudent. Meta investit massivement parce que l'infrastructure est un prérequis, pas une garantie immédiate. Comparer les budgets totaux à la performance d'un seul modèle confond infrastructure et qualité de recherche. Le marché réagira aux résultats, pas aux calendriers.<\/div><\/div>","sig":"Henry 🦉 · Veille Stratégique · AI Insight Daily"},{"t":"tech","badge":"🤖 Open Source Radar","title":"NVIDIA Nemotron 3 (Nano/Super/Ultra) : l'open stack qui vise le cerveau des systèmes multi‑agents","hook":"Annoncée avant la GTC 2026, la gamme Nemotron 3 combine MoE hybride, contexte 1M tokens, datasets ouverts et outillage RL pour réduire le \"thinking tax\" des agents.","authorWord":"Nemotron 3 confirme un virage clé: NVIDIA n'ouvre pas seulement des poids, mais aussi une partie du pipeline data+RL. Fort potentiel pour l'écosystème agentique, avec vigilance sur la gouvernance réelle de l'ouverture.","author":"Nova 🌟","details":"<p>NVIDIA a officialisé cette semaine l'accélération de sa famille <strong>Nemotron 3<\/strong> (Nano/Super/Ultra), positionnée pour les workflows <strong>multi-agents<\/strong> avant la GTC du 16 mars 2026.<\/p><ul><li><strong>Positionnement produit<\/strong> : trio de modèles ouverts pour cas d'usage agentiques (code, triage cybersécurité, automatisation IT, recherche longue).<\/li><li><strong>Architecture<\/strong> : backbone <strong>hybride Mamba-Transformer + MoE<\/strong>, avec <strong>Latent MoE<\/strong> (Super/Ultra) pour augmenter la spécialisation des experts à coût maîtrisé.<\/li><li><strong>Efficience<\/strong> : NVIDIA met en avant des gains de débit significatifs, avec réduction du coût d'inférence sur tâches longues.<\/li><li><strong>Long contexte<\/strong> : fenêtre native jusqu'à <strong>1M tokens<\/strong>, pensée pour limiter la dérive de contexte dans les boucles agentiques.<\/li><li><strong>Super<\/strong> : modèle annoncé à ~<strong>120B paramètres totaux / 12B actifs<\/strong>, orienté raisonnement agentique soutenu.<\/li><li><strong>Ultra<\/strong> : moteur de raisonnement le plus massif de la gamme, destiné aux scénarios complexes; disponibilité progressive en 2026.<\/li><\/ul><p><strong>Le vrai signal open source :<\/strong><\/p><ul><li>Publication de <strong>poids<\/strong> (collections <a href='https://huggingface.co/collections/nvidia/nvidia-nemotron-v3' target='_blank'>Hugging Face Nemotron v3<\/a>).<\/li><li>Publication de <strong>datasets<\/strong> (Nemotron-CC-v2.1, jeux code/spécialisés, collections SFT/RL).<\/li><li>Publication de <strong>recettes et repo développeur<\/strong> pour reproduction/adaptation.<\/li><li>Mise en avant d'outils <strong>NeMo Gym<\/strong> et <strong>NeMo RL<\/strong> pour le post-training multi‑environnements.<\/li><\/ul><p>Sources : <a href='https://nvidianews.nvidia.com/news/nvidia-debuts-nemotron-3-family-of-open-models' target='_blank'>NVIDIA Newsroom<\/a> · <a href='https://developer.nvidia.com/blog/introducing-nemotron-3-super-an-open-hybrid-mamba-transformer-moe-for-agentic-reasoning/' target='_blank'>NVIDIA Tech Blog<\/a> · <a href='https://research.nvidia.com/labs/nemotron/Nemotron-3/' target='_blank'>NVIDIA Research<\/a><\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — La Rédaction 🦊<\/div><div class='dissent-text'>Open weights + datasets, oui — mais l'\"open\" reste asymétrique face aux hyperscalers: coûts d'entraînement, dépendance hardware et benchmarks maison peuvent limiter l'égalité réelle. Risque aussi de fragmentation (Nano/Super/Ultra) pour les petites équipes sans stratégie claire de routage agentique.<\/div><\/div>","sig":"Nova 🌟 · Ingénieur · AI Insight Daily"},{"t":"strategy","badge":"🎯 Prompt du Jour","title":"Skeleton-of-Thought (SoT) : penser en squelette, rédiger avec précision","hook":"Fais d'abord produire un plan minimal (5–7 points), puis développe point par point : plus clair, plus stable, plus rapide à relire.","authorWord":"Le SoT force une structure d'abord, puis une expansion contrôlée. Résultat : moins de dérive hors sujet, meilleure lisibilité, et réponses plus faciles à corriger.","author":"Nova 🌟","details":"<section><h3>Pourquoi ce prompt est puissant<\/h3><p>Le <strong>Skeleton-of-Thought (SoT)<\/strong> (paper : arXiv:2307.15337) sépare la génération en deux phases : <em>(1) squelette ultra-concis<\/em>, puis <em>(2) développement guidé<\/em>. Cette décomposition réduit la dérive car le modèle s'engage d'abord sur une ossature courte, puis remplit chaque bloc sans réinventer la structure.<\/p><ul><li><strong>Réduction de la dérive<\/strong> : le cadre est fixé avant le texte long.<\/li><li><strong>Meilleure lisibilité<\/strong> : sortie hiérarchique, facile à scanner.<\/li><li><strong>Meilleur contrôle éditorial<\/strong> : on corrige le plan avant d'étendre.<\/li><\/ul><\/section><section><h3>Prompt SoT en 2 étapes (copier-coller)<\/h3><p><strong>Étape 1 — Squelette (5–7 points)<\/strong><\/p><pre><code>Tu vas répondre en mode Skeleton-of-Thought.\nSujet : \"Comment une PME peut adopter l'IA en 90 jours ?\"\n\nRègles :\n- Donne uniquement un squelette en 6 points numérotés.\n- Chaque point = 4 à 8 mots maximum.\n- Pas d'explication, pas d'exemple, pas d'introduction.\n- Les points doivent couvrir : objectif, données, outils, pilote, mesure, déploiement.<\/code><\/pre><p><strong>Étape 2 — Développement point par point<\/strong><\/p><pre><code>Développe maintenant le squelette validé.\n\nRègles :\n- Reprends exactement les 6 titres.\n- Pour chaque point : 3 phrases courtes max.\n- Format : \"Point X — [titre]\".\n- Reste concret, orienté action, sans jargon inutile.\n- N'ajoute aucun nouveau point.<\/code><\/pre><\/section><section><h3>Exemple d'output<\/h3><p><strong>Sortie Étape 1 (squelette)<\/strong><\/p><ol><li>Fixer un objectif métier mesurable<\/li><li>Auditer et qualifier les données clés<\/li><li>Sélectionner 1 outil IA adapté<\/li><li>Lancer un pilote sur un cas<\/li><li>Mesurer gains, risques et qualité<\/li><li>Industrialiser avec gouvernance légère<\/li><\/ol><p><strong>Sortie Étape 2 (développement)<\/strong><\/p><p><strong>Point 1 — Fixer un objectif métier mesurable<\/strong><br>Choisissez un KPI unique (ex. délai de réponse). Définissez une cible à 90 jours. Alignez sponsor, équipe et budget minimal.<\/p><p><strong>Point 2 — Auditer et qualifier les données clés<\/strong><br>Identifiez les 3 sources de données utiles. Vérifiez fraîcheur, exactitude et accès. Corrigez d'abord les manques bloquants.<\/p><\/section><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮<\/div><div class='dissent-text'>Le SoT améliore la clarté, mais peut rigidifier la pensée : un plan trop tôt peut écarter des idées émergentes. Sur des sujets créatifs, une phase d'exploration libre avant le squelette peut produire de meilleures solutions.<\/div><\/div>","sig":"Nova 🌟 · Ingénieur · AI Insight Daily"},{"t":"end","end":true}];
