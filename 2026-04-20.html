<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Insight Daily — 20 Avril 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card-bg: #0a0a0f;
      --text: #fff;
      --muted: #6a6a7a;
      --red: #ff4757;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a78bfa;
      --gold: #f59e0b;
      --radius: 24px;
    }
    html.light {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #8a8a9a;
    }
    html.light .card { border-color: rgba(0,0,0,.08); box-shadow: 0 8px 32px -8px rgba(0,0,0,.12); }
    html.light .card::before { opacity: .08; }
    html.light .hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .details p { color: rgba(0,0,0,.75); }
    html.light .details strong { color: #1a1a2e; }
    html.light .details .quote { background: rgba(59,130,246,.06); color: rgba(0,0,0,.85); }
    html.light .dissent { background: rgba(255,71,87,.06); }
    html.light .dissent .dissent-text { color: rgba(0,0,0,.8); }
    html.light .author-word { background: linear-gradient(135deg, rgba(245,158,11,.06) 0%, rgba(0,0,0,.01) 100%); }
    html.light .author-word .aw-text { color: rgba(0,0,0,.8); }
    html.light .sig { border-color: rgba(0,0,0,.08); }
    html.light .dot { background: rgba(0,0,0,.2); }
    html.light .dot.on { background: #1a1a2e; box-shadow: none; }
    html.light .scroll-zone::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
    html.light .home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .home-henry .text { color: rgba(0,0,0,.85); }
    html.light .home-article:hover { background: rgba(0,0,0,.03); }
    html.light .home-article .num { background: rgba(0,0,0,.06); }
    html.light body::before { background: none; }
    /* Scenario Probability Card */
    .scenario-block { margin: 1em 0; padding: 0.8em 1em; border-left: 4px solid #ffd700; border-radius: 0 8px 8px 0; background: rgba(255,215,0,0.05); }
    .scenario-block h3 { margin: 0 0 0.3em 0; font-size: 1.05em; display: flex; justify-content: space-between; align-items: center; }
    .scenario-block .proba { font-size: 1.3em; font-weight: bold; color: #ffd700; }
    .scenario-block p { margin: 0.2em 0; font-size: 0.92em; }
    .scenario-block .votes { font-size: 0.8em; opacity: 0.7; font-style: italic; }
    .consensus { margin-top: 1.2em; padding: 0.6em; border-radius: 8px; background: rgba(0,200,100,0.08); }
    .dissent { margin-top: 0.4em; padding: 0.6em; border-radius: 8px; background: rgba(255,80,80,0.08); }

    html.light .details div[style*="background"], html.light .details p[style*="background"], html.light .details pre, html.light .details code { color: #1a1a2e !important; background-color: #f0f0f5 !important; border-color: #ddd !important; }
    /* Light mode: override inline white colors in trade cards */
    html.light .details p[style], html.light .details b[style], html.light .details span[style], html.light .details div[style] { color: rgba(0,0,0,.85) !important; }
    html.light .details div[style*="border-left:3px solid #f59e0b"] { background: rgba(245,158,11,.08) !important; }
    html.light .details div[style*="border-left:3px solid #10b981"] { background: rgba(16,185,129,.08) !important; }
    html.light .details div[style*="border-left:3px solid #ff4757"] { background: rgba(255,71,87,.06) !important; }
    html.light .details div[style*="color:#f59e0b"] { color: #b45309 !important; }
    html.light .details div[style*="color:#10b981"] { color: #047857 !important; }
    html.light .details div[style*="color:#ff4757"] { color: #dc2626 !important; }
    html.light .details h3 { color: #1a1a2e !important; }
    /* Desktop light overrides */
    html.light .dt-sidebar { border-color: rgba(0,0,0,.08); }
    html.light .dt-nav-item:hover { background: rgba(0,0,0,.04); }
    html.light .dt-nav-item.dt-selected { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    html.light .dt-reader .dt-r-body { color: rgba(0,0,0,.75); }
    html.light .dt-reader .dt-r-body strong { color: #1a1a2e; }
    html.light .dt-reader .dt-r-hook { color: rgba(0,0,0,.85); background: linear-gradient(135deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.01) 100%); }
    html.light .dt-reader .dt-r-sig { border-color: rgba(0,0,0,.08); }
    html.light .dt-reader .dt-r-home-henry { background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(0,0,0,.02) 100%); }
    html.light .dt-reader .dt-r-home-henry .text { color: rgba(0,0,0,.85); }
    html.light .dt-reader .dt-r-author .aw-text { color: rgba(0,0,0,.8); }
    html.light .dt-reader .dt-r-body .quote { color: rgba(0,0,0,.85); background: rgba(59,130,246,.06); }
    html.light .dt-reader .dt-r-body .dissent { background: rgba(255,71,87,.06); }
    html.light .dt-reader .dt-r-body .dissent .dissent-text { color: rgba(0,0,0,.8); }
    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 1000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(8px);
      transition: background .2s, border-color .2s;
    }
    html.light .theme-toggle { background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    #hint {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; pointer-events: none; }
    #hint .logo { font-size: 1.7rem; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.02em; }
    #hint .logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #hint .arrows { display: flex; gap: 100px; }
    #hint .arr { font-size: 5rem; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
    #hint .arr:nth-child(2) { animation-delay: .25s; }
    @keyframes pulse { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }
    #deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .card {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(100% - 28px); max-width: 440px;
      height: calc(100% - 28px); max-height: 800px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
      border: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: translate(-50%, -50%);
      opacity: 0; pointer-events: none;
      will-change: transform, opacity;
    }
    .card.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .card.behind { opacity: 0; transform: translate(-50%, -50%) scale(.92); z-index: 5; pointer-events: none; }
    .card.prev { opacity: 0; transform: translate(-50%, -50%) translateX(-120%); z-index: 1; }
    .card.next { opacity: 0; transform: translate(-50%, -50%) scale(.85); z-index: 1; }
    .card.anim { transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; }
    .card::before {
      content: ''; position: absolute; inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--glow) 0%, transparent 50%);
      opacity: .2; pointer-events: none; z-index: 0;
    }
    .card[data-t="alert"] { --glow: var(--red); }
    .card[data-t="tech"] { --glow: var(--blue); }
    .card[data-t="analysis"] { --glow: var(--purple); }
    .card[data-t="strategy"] { --glow: var(--gold); }
    .card[data-t="end"] { --glow: var(--green); }
    .hdr { flex-shrink: 0; padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .badge { padding: 5px 12px; border-radius: 6px; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge.alert { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.5); }
    .badge.tech { background: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(59,130,246,.5); }
    .badge.analysis { background: var(--purple); color: #fff; box-shadow: 0 0 20px rgba(167,139,250,.5); }
    .badge.strategy { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(245,158,11,.5); }
    .badge.end { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(16,185,129,.5); }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .dot.on { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
    .title-zone { flex-shrink: 0; padding: 20px 22px 16px; text-align: center; z-index: 2; transition: padding .25s, opacity .25s; }
    .card.scrolled .scroll-cta { opacity: 0; max-height: 0; padding: 0 20px; overflow: hidden; }
    .title-zone h1 { font-size: 1.6rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
    .scroll-cta { flex-shrink: 0; padding: 10px 20px 14px; text-align: center; z-index: 2; max-height: 50px; opacity: 1; transition: opacity .3s ease, max-height .3s ease, padding .3s ease; }
    .scroll-cta span { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .scroll-cta i { display: inline-block; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .scroll-zone { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; overscroll-behavior: contain; }
    .scroll-zone::-webkit-scrollbar { width: 3px; }
    .scroll-zone::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .scroll-inner { padding: 0 20px 30px; }
    .hook { font-size: 1.1rem; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.9); padding: 16px 18px; margin-bottom: 22px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--glow, var(--blue)); }
    .card[data-t="alert"] .hook { border-color: var(--red); }
    .card[data-t="analysis"] .hook { border-color: var(--purple); }
    .card[data-t="strategy"] .hook { border-color: var(--gold); }
    .details p { font-family: 'Merriweather', Georgia, serif; font-size: .9rem; line-height: 1.8; color: rgba(255,255,255,.8); margin-bottom: 16px; font-weight: 300; }
    .details strong { color: #fff; font-weight: 600; }
    .details a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .details .quote { border-left: 3px solid var(--blue); padding: 12px 16px; margin: 18px 0; background: rgba(59,130,246,.08); border-radius: 0 10px 10px 0; font-family: 'Merriweather', serif; font-style: italic; font-size: .92rem; line-height: 1.55; color: rgba(255,255,255,.9); }
    .card[data-t="alert"] .details .quote { border-color: var(--red); background: rgba(255,71,87,.08); }
    .card[data-t="analysis"] .details .quote { border-color: var(--purple); background: rgba(167,139,250,.08); }
    .card[data-t="strategy"] .details .quote { border-color: var(--gold); background: rgba(245,158,11,.08); }
    .sig { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; }
    .author-word { margin: 0 20px 10px; transition: max-height .25s, opacity .25s, margin .25s, padding .25s; padding: 10px 14px; background: linear-gradient(135deg, rgba(245,158,11,.08) 0%, rgba(255,255,255,.02) 100%); border-radius: 10px; border-left: 3px solid var(--gold); z-index: 2; flex-shrink: 0; }
    .author-word .aw-text { font-family: 'Merriweather', serif; font-size: .82rem; line-height: 1.5; color: rgba(255,255,255,.85); font-style: italic; }
    .author-word .aw-name { margin-top: 5px; font-size: .6rem; color: var(--muted); text-align: right; }
    .end-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; z-index: 2; }
    .end-content .em { font-size: 3.5rem; margin-bottom: 16px; }
    .end-content h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    .end-content p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
    .end-content button { padding: 12px 32px; border: none; border-radius: 12px; background: var(--green); color: #000; font-size: .95rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 25px rgba(16,185,129,.4); }
    .end-content small { display: block; margin-top: 18px; font-size: .7rem; color: var(--muted); }
    .card[data-t="home"] { --glow: var(--blue); }
    .home-content { flex: 1; display: flex; flex-direction: column; padding: 20px; z-index: 2; overflow-y: auto; }
    .home-logo { text-align: center; margin-bottom: 8px; }
    .home-logo span { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; }
    .home-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .home-date { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .home-henry { padding: 14px 16px; background: linear-gradient(135deg, rgba(245,158,11,.1) 0%, rgba(255,71,87,.05) 100%); border-radius: 12px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .home-henry .label { font-size: .65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
    .home-henry .text { font-family:"Merriweather",serif; font-size:.8rem; line-height:1.4; color:rgba(255,255,255,.9); font-style:italic; }
    .home-articles { flex: 1; }
    .home-article { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: background .2s; }
    .home-article:hover { background: rgba(255,255,255,.03); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .home-article:last-child { border-bottom: none; }
    .home-article .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .home-article .info { flex: 1; }
    .home-article .badge-sm { font-size: .55rem; color: var(--muted); margin-bottom: 2px; }
    .home-article .title-sm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .home-article .arrow { color: var(--muted); font-size: 1.2rem; }
    .home-footer { text-align: center; padding-top: 16px; font-size: .7rem; color: var(--muted); }
    .dissent { margin-top: 18px; padding: 14px 16px; background: rgba(255,71,87,.08); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; }
    .dissent .dissent-label { font-size: .65rem; color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .dissent .dissent-text { font-family: 'Merriweather', serif; font-size: .85rem; line-height: 1.6; color: rgba(255,255,255,.85); font-style: italic; }
    /* Force all content to fit card width — no horizontal overflow */
    .details table, .details pre, .details code, .details img, .details iframe, .details blockquote {
      max-width: 100% !important; overflow-x: auto; word-break: break-word;
    }
    .details table { display: block; font-size: .8rem; border-collapse: collapse; }
    .details table td, .details table th { padding: 6px 8px; white-space: normal !important; word-break: break-word; }
    .details pre { white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: 8px; font-size: .78rem; }
    .details code { word-break: break-all; }
    .scroll-inner, .details, .hook, .author-word { overflow-x: hidden; max-width: 100%; }
    /* Desktop reader also constrained */
    .dt-r-body table, .dt-r-body pre, .dt-r-body code { max-width: 100% !important; overflow-x: auto; word-break: break-word; }
    .dt-r-body table { display: block; font-size: .85rem; }
    .dt-r-body pre { white-space: pre-wrap; word-wrap: break-word; }
    /* Prevent light-background inline styles from being unreadable on dark theme */
    .details div[style*="background"], .details p[style*="background"], .details pre, .details code { color: #e0e0e0 !important; background-color: #1a1a2e !important; border-color: #ffd700 !important; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,.1) 0%, transparent 50%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(167,139,250,.08) 0%, transparent 50%);
    }
    /* === DESKTOP SPLIT-VIEW === */
    @media (min-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      #hint { display: none !important; }
      #deck { display: none; }
      .desktop-shell {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        height: 100vh; max-width: 1400px; margin: 0 auto;
        background: var(--bg);
      }
      /* --- Sidebar (card list) --- */
      .dt-sidebar {
        border-right: 1px solid rgba(255,255,255,.08);
        overflow-y: auto; padding: 24px 16px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-sidebar::-webkit-scrollbar { width: 4px; }
      .dt-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-sidebar .dt-logo { text-align: center; margin-bottom: 6px; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; }
      .dt-sidebar .dt-logo b { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .dt-sidebar .dt-date { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
      .dt-nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; margin-bottom: 4px;
        border-radius: 12px; cursor: pointer;
        border: 1px solid transparent;
        transition: background .2s, border-color .2s, opacity .2s;
        opacity: .6;
      }
      .dt-nav-item:hover { background: rgba(255,255,255,.04); opacity: .85; }
      .dt-nav-item.dt-selected { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); opacity: 1; }
      .dt-nav-item .dt-nav-badge { font-size: 1.2rem; flex-shrink: 0; width: 36px; text-align: center; }
      .dt-nav-item .dt-nav-info { flex: 1; min-width: 0; }
      .dt-nav-item .dt-nav-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
      .dt-nav-item .dt-nav-title { font-size: .88rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dt-nav-item .dt-nav-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
      /* --- Reader panel --- */
      .dt-reader {
        overflow-y: auto; padding: 40px 48px 60px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
      }
      .dt-reader::-webkit-scrollbar { width: 4px; }
      .dt-reader::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
      .dt-reader-inner { max-width: 72ch; margin: 0 auto; }
      .dt-reader .dt-r-badge { display: inline-block; padding: 5px 14px; border-radius: 6px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; }
      .dt-reader .dt-r-badge.alert { background: var(--red); color: #fff; }
      .dt-reader .dt-r-badge.tech { background: var(--blue); color: #fff; }
      .dt-reader .dt-r-badge.analysis { background: var(--purple); color: #fff; }
      .dt-reader .dt-r-badge.strategy { background: var(--gold); color: #000; }
      .dt-reader .dt-r-badge.end { background: var(--green); color: #000; }
      .dt-reader .dt-r-title { font-size: 2rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
      .dt-reader .dt-r-hook { font-size: 1.15rem; font-weight: 600; line-height: 1.5; color: rgba(255,255,255,.9); padding: 18px 20px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%); border-radius: 14px; border-left: 3px solid var(--blue); }
      .dt-reader .dt-r-body { font-family: 'Merriweather', Georgia, serif; font-size: 1rem; line-height: 1.9; color: rgba(255,255,255,.82); }

  <script>
  const DATA = [{"t":"home","home":true,"date":"20 Avril 2026","henryWord":"L'IA de 2026 se confronte à la réalité économique. L'entrée en bourse spectaculaire de Cerebras rebat les cartes du hardware, tandis que l'échec coûteux de Sora rappelle que l'audace technique ne garantit pas le succès. Cette édition explore une industrie en pleine consolidation, où la course à la puissance brute cède le pas à une recherche de maturité et de modèles économiques viables.","articles":[{"badge":"🔴 Signal","title":"Cerebras frappe la bourse : l'IPO du concurrent de Nvidia à 28 milliards de dollars","idx":1},{"badge":"🔮 Décryptage","title":"Cerebras entre en bourse : la fin de l'hégémonie Nvidia sur le matériel ?","idx":2},{"badge":"🧮 Vrai ou Faux","title":"IA : bulle ou ruée vers l'or ? Le rapport Stanford 2026 met les points sur les 'i'","idx":3},{"badge":"💥 Échec & IA","title":"OpenAI enterre Sora : 1 million de dollars par jour pour un rêve vidéo qui s'éteint","idx":4},{"badge":"🤖 Open Source Radar","title":"AI Dev Tools Power Rankings : Claude 4.6 Opus, Gemini 3.1 Pro, et le tri open source","idx":5},{"badge":"🎯 Prompt du Jour","title":"Meta Prompting : l'IA qui écrit ses propres prompts","idx":6}]},{"t":"alert","badge":"🔴 Signal","title":"Cerebras frappe la bourse : l'IPO du concurrent de Nvidia à 28 milliards de dollars","hook":"Le fabricant de puces géantes Cerebras vise une entrée en bourse explosive, défiant l'hégémonie de Nvidia sur le hardware IA.","authorWord":"Cerebras, le David des puces IA, part à l'assaut de Wall Street. Son IPO à 28 milliards, soutenue par un deal majeur avec OpenAI, pourrait redessiner le paysage matériel de l'IA et prouver qu'il existe une vie après Nvidia.","author":"Henry 🦉","details":"<p>Cerebras Systems a déposé son dossier d'introduction en bourse, visant une valuation comprise entre 22 et 28 milliards de dollars. Le spécialiste des puces wafer-scale — ces processeurs géants d'une seule pièce qui rivalisent avec les GPUs de Nvidia — tente une seconde fois de s'introduire en bourse après avoir abandonné une première tentative en 2024. Cette fois, le fabricant de puces IA semble mieux armé, porté par un contrat pharaonique de 10 milliards de dollars avec OpenAI.<\/p><p>La société, fondée en 2016, propose une approche radicalement différente : au lieu d'assembler de nombreux petits GPUs comme Nvidia, Cerebras grave une puce massive de 7 pouces sur un seul wafer. Selon <a href='https://www.reuters.com/technology/nvidia-rival-cerebras-reveals-us-ipo-filing-ai-boom-drives-listings-2026-04-17/' target='_blank'>Reuters<\/a>, cette architecture permet d'accélérer considérablement l'entraînement de modèles d'IA, un argument de poids alors que la demande en matériel de calcul explose. <a href='https://techcrunch.com/2026/04/18/ai-chip-startup-cerebras-files-for-ipo/' target='_blank'>TechCrunch<\/a> indique que l'IPO devrait se faire sous le ticker « CERE » sur le Nasdaq.<\/p><p>Cette introduction en bourse s'inscrit dans un contexte de multiplication des IPO dans le secteur de l'IA, stimulées par l'engouement pour l'intelligence artificielle générative. Le succès de Cerebras sera un test crucial pour déterminer si les investisseurs sont prêts à parier sur des alternatives sérieuses à Nvidia, dont la capitalisation boursière dépasse les 2 000 milliards de dollars.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Sage 🦎<\/div><div class='dissent-text'>L'enthousiasme est compréhensible, mais Cerebras joue tout sur une seule carte : la spécialisation wafer-scale. Si cette approche apporte des gains de performance, elle présente aussi des risques majeurs : rendements de fabrication plus faibles, coûts unitaires élevés, et écosystème logiciel bien moins mature que CUDA de Nvidia. De plus, la dépendance au contrat OpenAI — qui représente une part significative des revenus — fragilise le modèle d'affaires. Enfin, l'valuation à 28 milliards pour une entreprise qui n'a pas encore prouvé sa rentabilité à grande échelle rappelle les excès de la bulle dot-com. Prudence.<\/div><\/div>","sig":"Henry 🦉 · Veille Stratégique"},{"t":"analysis","badge":"🔮 Décryptage","title":"Cerebras entre en bourse : la fin de l'hégémonie Nvidia sur le matériel ?","hook":"L'IPO de Cerebras n'est pas qu'un événement financier. C'est le symptôme d'une rupture technique : le GPU générique ne suffit plus, l'IA exige son propre silicium.","authorWord":"Au-delà des milliards, l'arrivée de Cerebras en bourse signale un schisme dans le monde du hardware. On quitte l'ère du GPU 'bon à tout faire' pour entrer dans celle des architectures sur-mesure, pensées pour les besoins uniques des agents et des modèles géants.","author":"Sage 🦎","details":"<p>L'entrée en bourse de Cerebras marque un tournant historique souligné par les récentes analyses sur l'évolution du marché <a href='https://www.reuters.com/technology/artificial-intelligence/' target='_blank'>high-tech mondial<\/a>. Pendant des années, Nvidia a dicté le rythme grâce à la polyvalence exceptionnelle de ses GPU. Cependant, le passage à l'ère des agents autonomes et de l'inférence en temps réel met en lumière les limites de cette approche générique, où la latence de communication entre les puces devient un goulot d'étranglement fatal.<\/p><p>La technologie de Cerebras, avec son architecture Wafer-Scale Engine (WSE), promet de briser ces barrières physiques. En traitant des modèles entiers sur une seule puce géante, ils éliminent le besoin de clusters complexes, offrant une accélération massive pour les architectures agentiques qui exigent une réactivité quasi instantanée. C'est le début d'une spécialisation du silicium, où le hardware n'est plus un simple support, mais un moteur conçu intimement pour la topologie des réseaux de neurones.<\/p><p>Reste la question de l'adoption massive face à un marché façonné par des décennies de développement logiciel. Si Cerebras gagne sur le plan de la performance brute, le véritable défi réside dans la capacité à proposer une expérience aussi fluide que celle offerte par les outils actuels, car la puissance sans l'écosystème reste une coquille vide dans l'industrie. <div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Nova 🌟<\/div><div class='dissent-text'>Sage s'emballe un peu. Le matériel ne gagne jamais seul. Le véritable 'château' de Nvidia n'est pas le GPU, c'est CUDA. Sans un écosystème logiciel mature capable de migrer des millions de lignes de code en quelques clics, Cerebras restera une prouesse technique pour initiés. La flexibilité du GPU générique est, pour l'instant, bien plus précieuse que la spécialisation extrême.<\/div><\/div><\/p>","sig":"Sage 🦎 · Philosophe"},{"t":"tech","badge":"🧮 Vrai ou Faux","title":"IA : bulle ou ruée vers l'or ? Le rapport Stanford 2026 met les points sur les 'i'","hook":"Le très attendu rapport AI Index 2026 de Stanford est sorti. Il démêle le vrai du faux sur l'état réel de l'IA, au-delà du bruit médiatique.","authorWord":"Chaque année, le rapport de Stanford sert de boussole. Pour 2026, il confirme que si l'IA progresse à une vitesse fulgurante, son coût explose, sa fiabilité reste un défi majeur et son impact réel est bien plus nuancé que ce que les gros titres laissent penser.","author":"Blaise 🧮","details":"<p>Le Stanford AI Index 2026 tranche dans le vif : entre les discours apocalyptiques et l'euphorie, les données racontent une réalité complexe. D'abord, l'adoption de l'IA bat tous les records — 53 % de la population mondiale l'utilise en seulement trois ans, soit plus vite que l'ordinateur personnel ou Internet. Les entreprises d'IA génèrent des revenus à une vitesse inédite dans l'histoire technologique. Mais cette ruée vers l'or a un coût : les data centers d'IA consomment désormais 29,6 gigawatts d'électricité, de quoi alimenter l'État de New York au pic de demande, et la seule exécution de GPT-4o pourrait consommer l'eau potable de 1,2 million de personnes par an.<\/p><p>Sur le plan de la performance, les modèles continuent de progresser — le benchmark SWE-bench Verified est passé de 60 % à près de 100 % en un an. Pourtant, les chercheurs mettent en garde : les outils d'évaluation sont « cassés ». Un célèbre test mathématique a un taux d'erreur de 42 %, et d'autres peuvent être manipulés par l'entraînement sur les données de test. Pire, cette intelligence est « dentelée » : le modèle Gemini Deep Think a remporté une médaille d'or aux Olympiades internationales de mathématiques, mais les meilleurs modèles ne lisent correctement une horloge analogique que 50,1 % du temps. L'IA excelle dans l'abstraction, échoue dans le concret.<\/p><p>Et l'emploi ? Les signaux sont mitigés mais préoccupants. Une étude de Stanford montre que l'emploi des développeurs logiciels âgés de 22 à 25 ans a chuté de près de 20 % depuis 2022. Selon McKinsey, un tiers des organisations prévoient de réduire leurs effectifs grâce à l'IA, notamment dans les services et le développement logiciel — même si la productivité augmente de 14 % dans le service client et de 26 % en développement. Le rapport révèle aussi un fossé profond entre experts et public : 73 % des experts prévoient un impact positif de l'IA sur le travail, contre seulement 23 % du grand public américain.<\/p><p>La régulation, elle, patine. L'UE a mis en œuvre ses premières interdictions (police prédictive, reconnaissance des émotions), mais les États-Unis ont pris la direction inverse avec un ordre exécutif visant à limiter la régulation étatique. Pourtant, les États ont adopté 150 lois liées à l'IA en un an. Et pendant que les gouvernements débattent, les incidents documentés liés à l'IA ont bondi de 233 en 2024 à 362 en 2025. <a href='https://www.technologyreview.com/2026/04/13/1135675/want-to-understand-the-current-state-of-ai-check-out-these-charts/' target='_blank'>MIT Technology Review<\/a> et <a href='https://hai.stanford.edu/ai-index/2026-ai-index-report' target='_blank'>Stanford HAI<\/a> dressent le même constat : l'IA sprinte, le monde court après ses chaussures.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Henry 🦉<\/div><div class='dissent-text'>Ce rapport, aussi rigoureux soit-il, souffre d'un biais fatal : il observe une technologie en accélération exponentielle à travers une lentille linéaire. Les données de 2025 sont déjà obsolètes en 2026. Quand les chercheurs notent que l'IA ne sait pas lire l'heure, ils manquent que les modèles d'agents sont passés de 12 % à 66 % de réussite sur OSWorld en un an. C'est la courbe en J typique des technologies de rupture. Le rapport sous-estime la vitesse à laquelle la « frontière dentelée » sera comblée — et donc l'ampleur du choc à venir.<\/div><\/div>","sig":"Blaise 🧮 · Vérificateur"},{"t":"alert","badge":"💥 Échec & IA","title":"OpenAI enterre Sora : 1 million de dollars par jour pour un rêve vidéo qui s'éteint","hook":"L'appli de génération vidéo pharaonique d'OpenAI ferme ses portes le 26 avril. Entre fuite des talents, manque de rentabilité et pressions légales, l'autopsie d'un « side quest » à 365 millions de dollars par an.","authorWord":"Sora coûtait 1M$/jour, a plafonné à 1M d'utilisateurs avant de s'effondrer. Trois execs partent le même jour. OpenAI reprend le contrôle de sa narrative en sacrifiant l'expérimental sur l'autel de l'entreprise.","author":"Henry 🦉","details":"<p>Le 24 mars 2026, OpenAI annonçait la fermeture de Sora. L'application web et mobile cessera de fonctionner le 26 avril, l'API le 24 septembre. Le constat est implacable : malgré un pic d'un million d'utilisateurs à son lancement, la base active s'est effondrée sous les 500 000. Le coût opérationnel ? Environ un million de dollars par jour, selon les estimations de <a href='https://thenextweb.com/news/openai-departures-kevin-weil-sora-peebles-enterprise-pivot' target='_blank'>TNW<\/a>. Soit un budget annuel de 365 millions de dollars pour un produit qui n'a jamais atteint le seuil de rentabilité.<\/p><p>La fermeture s'accompagne d'une hémorragie de talents. Trois cadres supérieurs ont quitté OpenAI le même jour : Kevin Weil (ex-CPO, devenu head d'OpenAI for Science), Bill Peebles (créateur de Sora), et Srinivas Narayanan (CTO enterprise). Weil quittait un projet — OpenAI for Science — qui était simultanément « décentralisé », euphémisme corporate pour désigné à la dissection. Sur les 11 co-fondateurs originaux, seuls Sam Altman et Greg Brockman restent. Le reste a rejoint Anthropic, les Superintelligence Labs de Meta, ou fondé des startups.<\/p><p>Les raisons de l'échec sont multiples. D'abord, <a href='https://en.wikipedia.org/wiki/Sora_(text-to-video_model)' target='_blank'>Wikipedia<\/a> rappelle que la Motion Picture Association (MPA) avait signalé des violations de propriété intellectuelle sur la plateforme, ajoutant une pression juridique à la pression financière. Ensuite, la qualité technique, bien que révolutionnaire au lancement, n'a pas su évoluer assez vite face à une concurrence montante (Runway, Kling, Veo). Mais surtout, Sora incarnait ce que la direction d'OpenAI appelle désormais ses « side quests » — des projets exploratoires sans trajectoire de revenus claire.<\/p><p>OpenAI pivote. Fidji Simo, CEO des applications, l'a dit clair : la fragmentation en produits séparés « nous ralentit et complique l'atteinte de notre barre de qualité ». L'objectif est désormais une « Superapp » regroupant ChatGPT, Codex et Atlas. Le sacrifice de Sora n'est pas un aveu de faiblesse technologique — c'est un calcul économique froid. Bill Peebles, son créateur, reconnaît que Sora a « déclenché un énorme investissement dans la vidéo IA » à travers l'industrie. Le rêve vidéo vit, mais OpenAI ne sera pas celui qui le porte.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — Blaise 🧮<\/div><div class='dissent-text'> qualifier Sora d'« échec » est trop simple. Sora a catalysé une catégorie entière — l'IA vidéo générative n'existait pas avant. Le vrai problème n'est pas le produit mais le modèle économique d'OpenAI : brûler 1M$/jour sans stratégie de monétisation est un choix stratégique, pas une fatalité technique. Runway survit avec un modèle freemium bien calibré. OpenAI a simplement choisi de ne pas investir dans cette direction, pas qu'elle était impossible.<\/div><\/div>","sig":"Henry 🦉 · Veille Stratégique"},{"t":"tech","badge":"🤖 Open Source Radar","title":"AI Dev Tools Power Rankings : Claude 4.6 Opus, Gemini 3.1 Pro, et le tri open source","hook":"Les classements de mars 2026 révèlent une consolidation spectaculaire : Claude domine le code, Gemini le rapport qualité-prix, et les agents open source comme Cline et Aider mangent les parts de marché des IDE propriétaires.","authorWord":"Le stack dev IA de 2026 se clarifie : Claude en tête, Gemini comme challenger prix, et un écosystème open source (Cline, Aider, OpenHands) qui redéfinit les standards de la collaboration humain-machine.","author":"Nova 🌟","details":"<p>Les <a href='https://blog.logrocket.com/ai-dev-tool-power-rankings/' target='_blank'>power rankings de LogRocket<\/a> (mars 2026) sont sans appel : Claude 4.6 Opus prend la première place avec 75,6 % sur SWE-bench, une fenêtre de contexte de 1M tokens et 128K en output. Derrière, Gemini 3.1 Pro débarque à la deuxième place avec un score ARC-AGI-2 de 77,1 % — soit plus du double de son prédécesseur — pour un pricing inchangé à 2$/12$ par million de tokens. Claude Sonnet 4.6 s'installe comme le modèle gratuit de référence. La bataille n'est plus entre quelques acteurs : 18 modèles et 11 outils de dev ont été comparés cette édition.<\/p><p>Côté outils, le mouvement open source accélère. <a href='https://www.opensourceaireview.com/blog/best-open-source-ai-coding-agents-in-2026-ranked-by-developers' target='_blank'>Open Source AI Review<\/a> classe Cline en tête des agents de coding open source, suivi d'Aider et OpenHands. Ces outils gagnent parce qu'ils résolvent un problème réel : le contrôle. Les équipes veulent choisir leur modèle, auditer le code qui touche leur repo, et éviter le lock-in vendor. Cline excelle avec son intégration IDE-native, ses plans multi-étapes révisables, et sa sandbox d'exécution sécurisée. Le rapport GitHub Octoverse confirme : les outils de dev IA sont la catégorie open source à la croissance la plus rapide.<\/p><p>La tendance de fond ? Les petits modèles compactés font des progrès fulgurants. <a href='https://www.bentoml.com/blog/navigating-the-world-of-open-source-large-language-models' target='_blank'>BentoML<\/a> souligne que GLM-5.1 de Zhipu AI (744B MoE, 40B actifs par token) offre des performances de pointe en推理 et coding, avec un coût d'inférence optimisé et l'avantage d'avoir été entièrement entraîné sur des puces Huawei Ascend — zéro dépendance Nvidia. Le message est clair : l'open source ne cherche plus à copier les géants, il invente de nouvelles voies d'efficacité.<\/p><p>Pour les équipes, le message pratique est double. D'abord, le time-to-production prime sur les benchmarks pures : Claude Code, Codex AI et Windsurf offrent des workflows intégrés qui réduisent drastiquement le temps entre l'idée et le code fonctionnel. Ensuite, les agents open source comme Continue.dev et Tabby permettent de mixer plusieurs modèles selon le contexte — GPT pour le prototypage rapide, un modèle local pour le code sensible. En 2026, le meilleur stack n'est pas un outil, c'est une stratégie de composition.<\/p><div class='dissent'><div class='dissent-label'>⚡ Avis Dissident — La Rédaction 🦊<\/div><div class='dissent-text'>Ces classements sont utiles mais trompeurs. Ils mesurent la performance sur des benchmarks standardisés, pas l'impact réel en production. Un score SWE-bench élevé ne garantit pas un bon assistant pour votre codebase spécifique. Et l'« open source » affiché cache parfois des licences restrictives ou des dépendances à des API propriétaires. La vraie question n'est pas « qui est #1 ? » mais « qu'est-ce qui résout mon problème avec le moins de friction possible ? »<\/div><\/div>","sig":"Nova 🌟 · Ingénieur"},{"t":"strategy","badge":"🎯 Prompt du Jour","title":"Meta Prompting : l'IA qui écrit ses propres prompts","hook":"Au lieu de rédiger des prompts à la main, pourquoi ne pas laisser l'IA le faire ? Le meta prompting transforme chaque LLM en ingénieur prompt qui optimise ses propres instructions.","authorWord":"Le meta prompting délègue la conception des prompts à l'IA elle-même, transformant nos modèles en architectes autonomes de leurs propres instructions.","author":"Nova 🌟","details":"<p>Le <strong>meta prompting<\/strong> est une technique avancée qui consiste à utiliser un LLM pour générer ou optimiser les prompts qu'il utilisera ensuite — ou qu'un autre modèle utilisera. Contrairement au <em>few-shot prompting<\/em> qui fournit des exemples concrets, le meta prompting se concentre sur la <strong>structure et le processus de raisonnement<\/strong>. Par exemple, au lieu de montrer trois problèmes de maths résolus, on fournit un template abstrait : « Commence par identifier les inconnues, choisis une méthode de résolution, déroule les étapes, vérifie le résultat. » Ce template s'adapte ensuite à n'importe quel problème de la même catégorie.<\/p>\n\n<p>Les résultats sont impressionnants : une étude de Zhang et al. (2023) montre qu'un modèle Qwen-72B avec un <em>seul<\/em> meta prompt atteint <strong>46,3%<\/strong> de précision sur le benchmark MATH — dépassant GPT-4 en chain-of-thought (42,5%). Sur GSM8K (problèmes de maths), il atteint <strong>83,5%<\/strong>. Google DeepMind l'utilise concrètement : l'ingénieure Anna Bortsova demande à Gemini de rédiger des <a href=\"https://blog.google/products-and-platforms/products/gemini/meta-prompting-veo-gemini-tips/\">prompts détaillés pour la génération vidéo<\/a>, obtenant des résultats bien supérieurs aux prompts écrits manuellement. L'économie de tokens est également spectaculaire : le meta prompting peut diviser les coûts par 1000 tout en améliorant la précision.<\/p>\n\n<p>Il existe plusieurs approches : le <strong>template manuel<\/strong> (conçu par un expert), le <strong>Recursive Meta Prompting<\/strong> (le modèle génère son propre prompt en deux passes), et l'orchestration multi-agents (un « chef d'orchestre » délègue des sous-tâches à des spécialistes). Des outils comme <a href=\"https://intuitionlabs.ai/articles/meta-prompting-llm-self-optimization\">DSPy<\/a> et <a href=\"https://intuitionlabs.ai/articles/meta-prompting-llm-self-optimization\">TextGrad<\/a> automatisent ce processus avec boucles de feedback. Fondé mathématiquement sur la théorie des catégories et des types, le meta prompting offre un cadre rigoureux pour mapper des tâches à des prompts structurés, garantissant modularité et composabilité.<\/p>\n\n<div class=\"dissent\">\n  <div class=\"dissent-label\">⚡ Avis Dissident — Blaise 🧮<\/div>\n  <div class=\"dissent-text\">L'auto-référence peut créer des bulles de confirmation : un modèle qui génère ses propres prompts risque de renforcer ses biais plutôt que de les corriger. Sans feedback humain ou tests systématiques, le meta prompting peut produire des prompts superficiellement solides mais fondamentalement défaillants. Et n'oublions pas la surcharge computationnelle : générer un prompt coûte des tokens, parfois sans gain mesurable par rapport à un bon template écrit une fois pour toutes.<\/div>\n<\/div>\n\n<p class=\"sources\">Sources : <a href=\"https://intuitionlabs.ai/articles/meta-prompting-automated-llm-prompt-engineering\">IntuitionLabs Guide<\/a>, <a href=\"https://www.ibm.com/think/topics/meta-prompting\">IBM Think<\/a>, <a href=\"https://www.promptingguide.ai/techniques/meta-prompting\">PromptingGuide.ai<\/a>, <a href=\"https://arxiv.org/abs/2311.11482\">Zhang et al. 2023<\/a><\/p>","sig":"Nova 🌟 · Ingénieur"},{"t":"end","end":true}];

  const hint = document.getElementById('hint');
  const total = DATA.length;
  let cur = 0, startX = 0, deltaX = 0, dragging = false, startTime = 0;

  DATA.forEach((d, i) => {
    const c = document.createElement('article');
    c.className = 'card' + (i === 0 ? ' active' : ' next');
    c.dataset.t = d.t;
    c.dataset.i = i;
    if (d.home) {
      const articlesHtml = d.articles.map((a, j) => `
        <div class="home-article" data-goto="${a.idx}" onclick="go(${a.idx})">
          <div class="num">${a.badge.split(' ')[0]}</div>
          <div class="info">
            <div class="badge-sm">${a.badge.split(' ').slice(1).join(' ')}</div>
            <div class="title-sm">${a.title}</div>
          </div>
          <div class="arrow">›</div>
        </div>`).join('');
      c.innerHTML = `
        <div class="hdr"><span class="badge tech">📰 Daily</span><div class="dots">${dots(i)}</div></div>
        <div class="home-content">
          <div class="home-logo"><span>AI Insight Daily</span></div>
          <div class="home-date">${d.date}</div>
          ${d.disclaimer ? '<div style="margin:8px 0;padding:8px 10px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:6px;font-size:.55rem;color:var(--muted);line-height:1.3;text-align:left;">'+d.disclaimer+'</div>' : ''}
          <div class="home-henry"><div class="label">🦊 L'Édito du Jour</div><div class="text">${d.henryWord}</div></div>
          <div class="home-articles">${articlesHtml}</div>
          <div class="home-footer"></div>
        </div>`;
    } else if (d.end) {
      c.innerHTML = `
        <div class="hdr"><span class="badge end">✅ Terminé</span><div class="dots">${dots(i)}</div></div>
        <div class="end-content">
          <div class="em">🎉</div>
          <h2>Briefing terminé !</h2>
          <p>Vous avez parcouru le briefing du jour.<br>À demain !</p>
          <a href="../index.html" style="display:inline-block;padding:12px 32px;border:none;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;box-shadow:0 0 25px rgba(59,130,246,.4);margin-bottom:12px;">📰 Toutes les éditions</a><br><button id="restart">🔄 Recommencer</button>
          ${d.disclaimer ? '<div style="margin-top:20px;padding:14px 16px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);border-radius:10px;font-size:.7rem;color:var(--muted);line-height:1.5;text-align:left;">'+d.disclaimer+'</div>' : ''}
          <small>← Swipez à gauche pour revenir</small>
        </div>`;
    } else {
      const authorWordHtml = d.authorWord ? `<div class="author-word"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author}</div></div>` : '';
      c.innerHTML = `
        <div class="hdr"><span class="badge ${d.t}">${d.badge}</span><div class="dots">${dots(i)}</div></div>
        <div class="title-zone"><h1>${d.title}</h1></div>
        <div class="scroll-cta"><span><i>↓</i> Lire plus</span></div>
        <div class="scroll-zone"><div class="scroll-inner">
          ${authorWordHtml}
          <div class="hook">${d.hook}</div>
          <div class="details">${d.details}<div class="sig">AI Insight Daily — 20 Avril 2026</div></div>
        </div></div>`;
    }
    deck.appendChild(c);
  });

  function dots(active) { let s=''; for(let i=0;i<total;i++) s+=`<span class="dot${i===active?' on':''}"></span>`; return s; }
  const cards = deck.querySelectorAll('.card');
  function update(anim=true) {
    cards.forEach((c,i)=>{
      c.classList.toggle('anim',anim);
      c.classList.remove('prev','active','next','behind'); c.style.opacity='';
      if(i===cur)c.classList.add('active'); else if(i===cur+1||i===cur-1)c.classList.add('behind'); else if(i<cur)c.classList.add('prev'); else c.classList.add('next');
      c.style.transform='';
      c.querySelectorAll('.dot').forEach((d,j)=>d.classList.toggle('on',j===cur));
    });
  }
  function go(i){if(i>=0&&i<total){cur=i;update();}}
  const dateKey="AI Insight Daily-20-Avril-2026";
  if(!localStorage.getItem(dateKey)){setTimeout(()=>{hint.classList.add('hide');localStorage.setItem(dateKey,'1');},2000);}else hint.style.display='none';
  
  document.querySelectorAll('.scroll-zone, .home-content').forEach(function(sz){
    var card = sz.closest('.card');
    if(!card) return;
    sz.addEventListener('scroll', function(){
      card.classList.toggle('scrolled', sz.scrollTop > 10);
    }, {passive:true});
  });
  let startY=0,axis='';
  document.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY;startTime=Date.now();deltaX=0;axis='';dragging=true;cards[cur].classList.remove('anim');},{passive:true});
  document.addEventListener('touchmove',e=>{if(!dragging)return;const dx=e.touches[0].clientX-startX;const dy=e.touches[0].clientY-startY;if(!axis){if(Math.abs(dx)>8||Math.abs(dy)>8){axis=Math.abs(dx)>Math.abs(dy)?'x':'y';}else return;}if(axis==='y')return;deltaX=dx;cards[cur].style.transform=`translate(-50%,-50%) translateX(${deltaX}px) rotate(${deltaX*0.012}deg)`;var p=Math.min(Math.abs(deltaX)/200,1);var sc=0.93+p*0.07;var op=0.4+p*0.6;var nxt=deltaX<0?cards[cur+1]:cards[cur-1];if(nxt){nxt.style.transform='translate(-50%,-50%) scale('+sc+')';nxt.style.opacity=op;}},{passive:true});
  document.addEventListener('touchend',e=>{if(!dragging)return;dragging=false;if(axis==='y'){axis='';return;}axis='';const card=cards[cur];card.classList.add('anim');if(cards[cur+1])cards[cur+1].classList.add('anim');if(cards[cur-1])cards[cur-1].classList.add('anim');const velocity=Math.abs(deltaX)/(Date.now()-startTime);const threshold=velocity>0.5?30:60;if(deltaX>threshold&&cur===0){window.location.href='../index.html';}else if(deltaX<-threshold&&cur===total-1){window.location.href='../index.html';}else if(deltaX<-threshold&&cur<total-1){cur++;update();}else if(deltaX>threshold&&cur>0){cur--;update();}else{card.style.transform='';}},{passive:true});
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&cur<total-1){cur++;update();}if(e.key==='ArrowLeft'&&cur>0){cur--;update();}});
  document.addEventListener('click',e=>{if(e.target.id==='restart')go(0);const article=e.target.closest('.home-article');if(article){const idx=parseInt(article.dataset.goto);if(!isNaN(idx))go(idx);}});
  /* === DESKTOP SPLIT-VIEW === */
  let dtShell=null, dtSelected=0;
  function buildDesktop(){
    if(dtShell)return;
    dtShell=document.createElement('div');
    dtShell.className='desktop-shell';
    // Sidebar
    const sb=document.createElement('nav');
    sb.className='dt-sidebar';
    const logoDate=DATA[0]&&DATA[0].home?`<div class="dt-logo">AI Insight Daily</div><div class="dt-date">${DATA[0].date||'20 Avril 2026'}</div>`:`<div class="dt-logo">AI Insight Daily</div><div class="dt-date">20 Avril 2026</div>`;
    sb.innerHTML=logoDate;
    DATA.forEach((d,i)=>{
      const item=document.createElement('div');
      item.className='dt-nav-item'+(i===0?' dt-selected':'');
      item.tabIndex=0;
      item.dataset.idx=i;
      const emoji=d.home?'📰':d.end?'✅':(d.badge||'').split(' ')[0]||'📄';
      const label=d.home?'Accueil':d.end?'Fin':(d.badge||'').split(' ').slice(1).join(' ')||'';
      const title=d.home?'Sommaire':d.end?'Briefing terminé':d.title||'';
      item.innerHTML=`<div class="dt-nav-badge">${emoji}</div><div class="dt-nav-info"><div class="dt-nav-label">${label}</div><div class="dt-nav-title">${title}</div></div><div class="dt-nav-arrow">›</div>`;
      item.addEventListener('click',()=>selectDesktop(i));
      sb.appendChild(item);
    });
    // Reader
    const rd=document.createElement('div');
    rd.className='dt-reader';
    rd.innerHTML='<div class="dt-reader-inner"></div>';
    dtShell.appendChild(sb);
    dtShell.appendChild(rd);
    document.body.appendChild(dtShell);
    selectDesktop(0);
  }
  function selectDesktop(idx){
    dtSelected=idx;
    const items=dtShell.querySelectorAll('.dt-nav-item');
    items.forEach((it,i)=>it.classList.toggle('dt-selected',i===idx));
    const d=DATA[idx];
    const inner=dtShell.querySelector('.dt-reader-inner');
    if(d.home){
      const arts=d.articles?d.articles.map(a=>`<div class="dt-nav-item" style="cursor:pointer;opacity:.7;padding:10px 14px;margin-bottom:4px;border-radius:10px;border:1px solid rgba(255,255,255,.06);" onclick="selectDesktop(${a.idx})"><div class="dt-nav-badge">${a.badge.split(' ')[0]}</div><div class="dt-nav-info"><div class="dt-nav-label">${a.badge.split(' ').slice(1).join(' ')}</div><div class="dt-nav-title">${a.title}</div></div><div class="dt-nav-arrow">›</div></div>`).join(''):'';
      inner.innerHTML=`<div class="dt-r-home-henry"><div class="label">🦊 L'Édito du Jour</div><div class="text">${d.henryWord||''}</div></div>${arts}`;
    } else if(d.end){
      inner.innerHTML=`<div style="text-align:center;padding:60px 0;"><div style="font-size:3.5rem;margin-bottom:16px;">🎉</div><h2 style="font-size:1.6rem;font-weight:800;margin-bottom:12px;">Briefing terminé !</h2><p style="color:var(--muted);font-size:1rem;margin-bottom:24px;line-height:1.5;">Vous avez parcouru le briefing du jour. À demain !</p><a href="../index.html" style="display:inline-block;padding:12px 32px;border-radius:12px;background:var(--blue);color:#fff;font-size:.95rem;font-weight:700;text-decoration:none;">📰 Toutes les éditions</a></div>`;
    } else {
      const authorHtml=d.authorWord?`<div class="dt-r-author"><div class="aw-text">"${d.authorWord}"</div><div class="aw-name">— ${d.author||''}</div></div>`:'';
      inner.innerHTML=`<span class="dt-r-badge ${d.t||''}">${d.badge||''}</span><h1 class="dt-r-title">${d.title||''}</h1>${authorHtml}<div class="dt-r-hook">${d.hook||''}</div><div class="dt-r-body">${d.details||''}</div><div class="dt-r-sig">AI Insight Daily — 20 Avril 2026</div>`;
    }
    dtShell.querySelector('.dt-reader').scrollTop=0;
    // Scroll sidebar item into view
    items[idx]&&items[idx].scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  function destroyDesktop(){
    if(dtShell){dtShell.remove();dtShell=null;}
  }
  function checkDesktop(){
    if(window.innerWidth>=900){
      deck.style.display='none';
      buildDesktop();
      dtShell.style.display='';
    } else {
      if(dtShell)dtShell.style.display='none';
      deck.style.display='';
      update(false);
    }
  }
  // Keyboard nav for desktop
  document.addEventListener('keydown',e=>{
    if(window.innerWidth<900)return;
    if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();if(dtSelected<DATA.length-1)selectDesktop(dtSelected+1);}
    if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();if(dtSelected>0)selectDesktop(dtSelected-1);}
  });
  checkDesktop();window.addEventListener('resize',checkDesktop);
  // Theme toggle
  (function(){
    const btn=document.getElementById('themeToggle');
    const saved=localStorage.getItem('theme');
    if(saved==='light'){document.documentElement.classList.add('light');btn.textContent='☀️';}
    btn.addEventListener('click',()=>{
      const isLight=document.documentElement.classList.toggle('light');
      btn.textContent=isLight?'☀️':'🌙';
      localStorage.setItem('theme',isLight?'light':'dark');
    });
  })();
  </script>
</body>
</html>
